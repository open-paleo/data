# Open Paleo — Flagged Publication Sources
#
# References to publishers or journals listed here trigger a validator
# warning and a reviewer sign-off request on pull requests. Citations
# are NOT rejected outright — many individual papers from flagged
# publishers are legitimate — but reviewers must confirm the citation
# before merge.
#
# Primary source: https://beallslist.net/
#   - `publishers:` block mirrors the Standalone Publishers list.
#   - `journals:` block mirrors the Standalone Journals list.
# Both are filtered to exclude publications scoped to domains outside
# paleontology's scientific neighborhood (medical specialties,
# business/finance, law, pure engineering/IT). The filter errs on
# the side of inclusion — generically-named publishers stay in.
#
# The `open_paleo_additions:` blocks list community-flagged sources
# that are NOT currently on Beall's active list (e.g. MDPI was removed
# under legal pressure). Each addition has a `reason:` explaining its
# inclusion.
#
# To propose an addition or removal: open a PR editing this file with a
# brief justification linking to the relevant discussion, Beall's update,
# or community post. Periodic re-syncs with upstream Beall's List are
# done manually.

