# Formation registry: canonical unit name -> rank, containment, spellings and
# the papers each of those rests on.
#
# WHY THIS EXISTS. `location.formation` is free text, and nothing in a unit's
# name records its rank: "Morrison" is a formation and "Kem Kem" is a group,
# spelled the same way in the same field. Without a table there is no way to
# check that the field holds a formation, and no way to record that two
# spellings mean one thing.
#
# RULE OF ENTRY. Every entry carries the paper each claim was read from. This
# file is CURATED, NEVER MINED: a rank or an age inferred from phrasing is a
# guess, and text mining reliably folds leading qualifiers into unit names
# ("Middle Jurassic Lower" as a child of Shaximiao) and ignores basin scoping.
# Add a line when a primary states the rank, and not otherwise.
#
# HOMONYMS ARE KEYED BY COUNTRY. Unit names are reused across basins: the Hekou
# Group of the Lanzhou-Minhe Basin in Gansu and the Hekou Formation of Jiangxi's
# Guifeng Group are different units of different ages. A name-keyed registry
# would merge them. Same trap as the institution-code collisions.
#
# FIELDS
#   rank         group | subgroup | formation | member | bed | informal | none
#   kind         what the string actually is, when `rank: none`
#   parent       the unit that contains this one, where a source states it
#   contains     units inside this one, where a source states them
#   variants     ALTERNATE AND LEGACY NAMES a publication actually prints for
#                this unit -- Erlian for Iren Dabasu, Red Beds for Elliot,
#                Wucaiwan for Shishugou. The test is whether some paper uses the
#                string AS THIS UNIT'S NAME. Four things are therefore NOT
#                variants and do not belong here: a rank word appended to the
#                key ("Iren Dabasu Fm."), a diacritic or spacing form
#                ("Zhangjiaao", "Cambridge Green Sand"), a rank CLAIM
#                ("Hastings Beds Group" -- that is `rank_contested`), and a
#                string attested only in a reference work, which renders names
#                rather than establishing them. Abbreviations and folded
#                diacritics are the matcher's job, not the registry's.
#   rank_contested  ranks the literature genuinely disagrees on -- kept visible
#                rather than settled by majority
#   stages       the unit's published age, oldest stage first. An ENVELOPE for
#                checking records, never a source to derive them from: a taxon
#                is often dated more finely than its unit (a metre above a
#                contact, a dated ash), and filling records from here would
#                flatten exactly that. Recorded as STAGES, never as Ma --
#                a stage range tracks the chart in schema.yml automatically,
#                whereas a stated Ma value derives from nothing and so falls
#                out of step whenever the chart is revised. Where sources
#                disagree, this is the UNION of what they publish rather than a
#                choice between them: it is a bound, not a verdict. Which source
#                gives which range goes in the reference notes.
#   references   [{id, notes}] -- `id` resolves to a references/ store entry,
#                the same pointer shape genus and clade files use
#
# QUOTATION MARKS MEAN THE CITED PAPER'S OWN WORDS, transcribed from the paper
# itself and left as it prints them -- OCR damage, archaic spelling and all.
# Never quote a summary, an extraction record, a reference work's rendering or
# any other derived text: those are paraphrase, and paraphrase inside quotation
# marks is a fabricated quotation however faithful its sense. The failure is
# invisible on reading, because a good paraphrase is exactly what a real quote
# looks like. Elide with `...` rather than silently dropping words, including
# dropped inline citations. Where the wording is ours, drop the marks.
#
# WHERE A COARSE VALUE IS CORRECT, say so in the notes rather than in a field.
# A group that is the finest unit anyone has published belongs in
# `location.group`, which needs no defending; an informally named unit carries
# `rank: informal`. Neither needs a flag, and a flag with no consumer rots.
#
# CANONICAL SPELLINGS. Where the literature is split, the choice and its reason
# are recorded on the entry. Sânpetru over Sînpetru is the worked example: the
# post-Ceauşescu Romanian orthographic reform replaced î with â in this
# position, Weishampel (2003) flags it in its own geology section, and all four
# reference works print â.
#
# DELIBERATELY EXCLUDED: Shaximiao vs Xiashaximiao / Shangshaximiao. Xia and
# shang are Chinese for lower and upper, so those name a subunit rather than a
# spelling of the same unit -- a substantive difference that must stay in the
# active findings. Watch for the same trap in other Chinese formation names.

Adamantina:
  rank: formation
  parent: Bauru
  references:
    - id: fernandes2000a
      notes: >
        Superseded by this revision, whose "most important change presented
        concerns the Bauru Group, especially the Adamantina Formation": its
        ground is redistributed, the Vale do Rio do Peixe Formation taking the
        bulk of it -- "It corresponds to much of the former Adamantina Formation
        defined by Soares et al. (1980)" -- and the Araçatuba, São José do Rio
        Preto and Presidente Prudente taking the rest. Barcelos (1984) had
        proposed the first two as members of the Adamantina; the Presidente
        Prudente is credited to Fernandes (1998), and Table 1 ties it to the
        Adamantina only through "part of unit Ka_V".
    - id: soares2020a
      notes: >
        Kept in use two decades after that supersession, as one of the four
        formations of the "vertically superposed Araçatuba, Uberaba, Adamantina,
        and Marília formations".
    - id: cavalcanti2026a
      notes: >
        Still in use for the Triângulo Mineiro region, where "the Bauru Group is
        divided into the Adamantina, Uberaba, Marília, and Serra da Galga
        formations". The paper names it once and says nothing further about it.

Allen:
  rank: formation
  stages: [Campanian, Maastrichtian]
  parent: Malargüe
  references:
    - id: salgado1996a
      notes: >
        The subdivision is positional, not named: "Lower member of the Allen
        Formation, Malargue Group" in the horizon line and "Lower Member" in the
        running text of the same paper. There is no upper counterpart with a
        name either: the divisions are positional rather than named.
    - id: martinelli2004a
      notes: >
        Places the formation in the Malargue Group. The same site is called the
        Neuquen Group by Rozadilla (2021) and Aranciaga Rolando (2021).

"Ashdown Beds":
  rank: formation
  parent: Hastings
  stages: [Berriasian]
  references:
    - id: galton2009a
      notes: >
        The basal unit of the Hastings Beds, closing the succession given "in
        descending order the Upper Tunbridge Wells Sands, Grinstead Clay, Lower
        Tunbridge Wells Sands, Wadhurst Clay, Ashdown Beds".
    - id: norman2013a
      notes: >
        Formation rank and the age: the Weald Sub-basin succession runs "from
        the upper Berriasian (Ashdown Beds Formation) to the top of the
        Barremian".

Araçatuba:
  rank: formation
  parent: Bauru
  references:
    - id: fernandes2000a
      notes: >
        Bauru Basin. Rests directly on the Serra Geral basalts and "laterally,
        it interdigitates with the Vale do Rio do Peixe Formation, which
        regionally overlies it", the two being partly contemporaneous. The name
        was used before this revision for a lithofacies by Suguio and others
        (1977) and at formation rank by Suguio (1981), in both cases for parts
        of what are now the Santo Anastácio and Vale do Rio do Peixe, and
        Barcelos (1984) proposed its first type section as a member of the
        Adamantina.

Bahariya:
  rank: formation
  variants: [Baharija]

Baharîje:
  rank: formation
  variants: [Baharija]

Barbalha:
  rank: formation
  parent: Santana
  stages: [Aptian]
  variants: ["Rio da Batateira"]
  references:
    - id: arai2020a
      notes: >
        Araripe Basin, the basal formation of the group. The psammitic section
        it names "has been termed the Barbalha Formation (Assine, 1990, 1992)
        and the Rio da Batateira Formation (Ponte and Appi, 1990)", so both
        names are in print for one unit. Aptian on the presence of Sergipea
        variverrucata; the Albian extension in the older literature followed
        from ages attributed to the Romualdo rather than from this unit.

Baruungoyot:
  rank: formation
  stages: [Campanian]
  variants: ["Barun Goyot"]

Bauru:
  rank: group
  contains: [Uberaba, "Vale do Rio do Peixe", Araçatuba, "São José do Rio Preto",
             "Presidente Prudente", Adamantina, Marília, "Serra da Galga"]
  references:
    - id: fernandes2000a
      notes: >
        The Upper Cretaceous sequence of the Bauru Basin "is now divided in two
        groups, partially contemporaneous: Caiuá Group ... and Bauru Group", the
        latter composed of the Uberaba, Vale do Rio do Peixe, Araçatuba, São
        José do Rio Preto, Presidente Prudente and Marília formations, each
        credited to its own author, with no order stated. This revision
        supersedes the Adamantina Formation of Soares et al. (1980) -- "the most
        important change presented concerns the Bauru Group, especially the
        Adamantina Formation" -- while the Marília is retained in the sense of
        those authors, subdivided into the Echaporã, Serra da Galga and Ponte
        Alta members.
    - id: silvajunior2022a
      notes: >
        Soares and others (2021) raised the Serra da Galga from a member of the
        Marília to a formation of the Bauru Group, the usage this paper works in
        throughout.
    - id: soares2020a
      notes: >
        A competing subdivision that keeps the name Fernandes and Coimbra (2000)
        superseded: "The Bauru Group is formed by the vertically superposed
        Araçatuba, Uberaba, Adamantina, and Marília formations" -- stacked
        rather than laterally equivalent. The list itself states no direction,
        but the paper elsewhere calls the Marília "the uppermost unit of the
        Bauru Group". Its Adamantina spans the same interval as the Vale do Rio
        do Peixe, São José do Rio Preto and Presidente Prudente of that
        revision, so the units listed here are the union of the two schemes
        rather than eight coexisting formations.
    - id: cavalcanti2026a
      notes: >
        Keeps the Adamantina as well, for the Triângulo Mineiro region: "the
        Bauru Group is divided into the Adamantina, Uberaba, Marília, and Serra
        da Galga formations".
    - id: delcourt2017a
      notes: >
        The Mato Grosso outcrops formerly assigned here belong to the Parecis
        Group instead. Pycnonemosaurus was collected at Fazenda Roncador, where
        Kellner and Campos (2002) had it that "this locality is in the Bauru
        Group", but "recent work has shown that this locality is actually part
        of the Parecis Group".

Bayangobi:
  rank: formation
  variants: ["Bayan Gobi", Bayingobi]

"Bayn Dzak":
  rank: member
  parent: Djadokhta
  variants: ["Bayan Zag"]
  references:
    - id: dashzeveg2005a
      notes: >
        The lower of the formation's two members, "dominated by moderate
        reddish orange sands with subordinate mudstone units" and cropping out
        only along the southern edge of the basin, with its type section at the
        Flaming Cliffs. The same locality is written Bayan Zag by Benton (2000)
        and was worked by the Central Asiatic Expeditions under the name
        Shabarakh Usu.
    - id: arbour2015a
      notes: >
        Assigns a holotype to it: "Bayn Dzak Member, Djadokhta Formation".

Baynshire:
  rank: formation
  stages: [Cenomanian, Turonian, Coniacian, Santonian]
  references:
    - id: barsbold1983a
      notes: >
        Gives "Cenomanian-Turonian" for individual holotypes from this
        formation, which is a narrower reading for those taxa rather than a
        competing range for the unit.
    - id: averianov2020a
      notes: Prints the unit as the "Bayan Shireh Formation".
    - id: arbour2015a
      notes: >
        Prints the name as the "Bayanshiree Formation", and carries the younger
        end of the envelope: it reports Jerzykiewicz (2000) as dating the unit
        late Cenomanian-Coniacian to ?early Santonian, and a
        magnetostratigraphical and palynological analysis as placing the
        sediments no later than the latest Santonian.
  variants: ["Bayan Shireh", Bayanshiree]

"Belly River":
  rank: group
  contains: [Foremost, Oldman, "Dinosaur Park"]
  references:
    - id: eberth2005a
      notes: >
        Southern Alberta plains. At Dinosaur Provincial Park the complete group
        "is approximately 280 m thick and consists of the Foremost (170 m),
        Oldman (40 m), and Dinosaur Park (70 m) formations", bounded by the
        Pakowki and Bearpaw marine shales. The redefined group "is synonymous
        with the long-standing informal usage of 'Belly River', McLean's 'Judith
        River Formation', and Eberth and Hamblin's 'Judith River Group'": the
        three constituent formations were separated out of McLean's single
        Judith River Formation by Eberth and Hamblin (1993), who accepted
        Russell and Landes's (1940) Foremost, redefined the Oldman, and erected
        the Dinosaur Park Formation for the uppermost beds.
  variants: ["Belly River Series"]

Bevons:
  rank: none
  kind: locality
  references:
    - id: accarie1995a
      notes: >
        A commune near Sisteron. The erecting paper gives a lithological
        description rather than a formal unit, which is why the reference works
        fell back on the place name.

"Buckhorn Conglomerate":
  rank: member
  parent: "Cedar Mountain"
  references:
    - id: tidwell2001a
      notes: >
        "The basal member of the Cedar Mountain Formation is the Buckhorn
        Conglomerate (Kirkland et al. 1997)."
    - id: carpenter1999a
      notes: >
        Records what the unit is laterally: present in the San Rafael Swell and
        "believed to be equivalent to the Yellow Cat and Poison Strip Sandstone
        of the Paradox Basin", so the same interval carries different names in
        the two areas.

"Bulldog Shale":
  rank: member
  parent: Marree
  stages: [Aptian, Albian]
  references:
    - id: barrett2010b
      notes: >
        South Australia. "Detailed lithostratigraphic evaluation has now firmly
        placed the Coober Pedy and Andamooka opaliferous beds within the Bulldog
        Shale (a constituent of the Marree Subgroup, which was formerly called
        the Marree Formation)", superseding Molnar's (1980) three candidate
        source units. "Microfossils suggest an Aptian-lower Albian age", while
        molluscan remains are usually read as Aptian alone.

"Calcaires de Caen":
  rank: formation
  variants: ["Calcaire de Caen"]

"Cambridge Greensand":
  rank: formation

"Cañadón Asfalto":
  rank: formation
  stages: [Toarcian, Aalenian, Bajocian]
  references:
    - id: cúneo2013a
      notes: >
        A two-member scheme exists but is not settled and is not used for these
        dinosaurs: "Some workers have subdivided the formation into a lower
        lacustrine/tuffaceous (Las Chacritas) member and an upper siliciclastic
        fluvial (Puesto Almada) member". The members are Cabaleri (2010),
        published as a symposium abstract, and no subsequent description places
        a taxon in either member.
    - id: rauhut2005b
      notes: >
        Why the member names cannot be inferred from a locality: this paper puts
        Condorraptor at the "Las Chacritas locality, 2.3 km west of Cerro
        Condor", a canyon, and names no member. Las Chacritas and Puesto Almada
        are each simultaneously a place and a member named after it, and Puesto
        Almada as a place lies in the Canadon Calcareo outcrop -- a different
        formation from the one whose member carries the name.
    - id: pol2020a
      notes: >
        Positional rather than named: Bagualia comes from the "Lower levels of
        the Canadon Asfalto Formation dated at 179.17 +/- 0.12 Ma".
    - id: cúneo2013a
      notes: >
        U-Pb geochronology for the basin. Deposition begins "at ca. 179 Ma
        (early-mid Toarcian)" and "most probably continued into the early Middle
        Jurassic (Aalenian or Bajocian)", though "the exact age of the upper
        Cañadón Asfalto Formation is poorly constrained".

Candeleros:
  rank: formation
  parent: "Río Limay"
  stages: [Albian, Cenomanian, Turonian]
  references:
    - id: carballido2010a
      notes: >
        Neuquén Basin. Places the unit in the "Neuquén Group, Río Limay
        Subgroup", below the Huincul Formation, "with an age estimated at early
        Cenomanian". Also moves the Rayososaurus agrioensis holotype into its
        upper part.
    - id: gallina2005a
      notes: >
        Gives the wider reading the envelope has to hold: "the upper member of
        the Candeleros Formation (Cenomanian-Turonian)". That upper member is
        described informally and carries no name.
    - id: martinelli2004a
      notes: >
        Dates the Giganotosaurus carolinii horizon Albian-Cenomanian while
        giving other occurrences in the same unit as Cenomanian, which is the
        other end of the published spread.
    - id: carrano2012a
      notes: >
        "?late Cenomanian, Late Cretaceous" for the same subgroup placement.

Carbon:
  rank: member
  parent: "Horseshoe Canyon"
  stages: [Maastrichtian]
  references:
    - id: eberth2012a
      notes: >
        The sixth of the formation's seven members, its base "marked by the
        first occurrence of clean sandstone, coal, or carbonaceous shale in the
        #11-12 coal zone" above the Tolman and its top at the first white
        sandstones of the Whitemud, which this paper explicitly excludes from
        it. Equivalent to the "member C" of Ower (1960), the "Coaly Member" of
        Srivastava (1968) and the "Carbon-Thompson Coal Zone" of McCabe and
        others (1989). Magnetostratigraphy puts it in the upper 31n to lowermost
        30n magnetochrons, about 68.4-67.5 Ma.
    - id: arbour2013a
      notes: >
        Applies the member scheme in the field: "the Morrin, Tolman and Carbon
        members ... of the Horseshoe Canyon Formation crop out in this region of
        the Red Deer River".

"Cedar Mountain":
  rank: formation
  contains: [Buckhorn Conglomerate, Yellow Cat, Poison Strip, Ruby Ranch, Mussentuchit]
  references:
    - id: tidwell2001a
      notes: >
        "The basal member of the Cedar Mountain Formation is the Buckhorn
        Conglomerate (Kirkland et al. 1997). Four additional members established
        and named by Kirkland et al. (1997) are: the Yellow Cat Member, Poison
        Strip Sandstone, Ruby Ranch Member, and the Mussentuchit Member."
    - id: carpenter1999a
      notes: >
        Gives four members rather than five -- "The Cedar Mountain Formation has
        recently been divided into several members (Kirkland and others 1997):
        Yellow Cat Member, Poison Strip Sandstone, Ruby Ranch Member, and
        Mussentuchit Member" -- with the Buckhorn Conglomerate a lateral
        equivalent rather than a fifth. Why the member rather than the formation
        is the operative unit: the ankylosaurs are stratigraphically restricted,
        Gastonia to the Yellow Cat and Animantarx to the Mussentuchit.

"Cerro Carnerero":
  rank: formation

Changwangpu:
  rank: formation
  parent: Wangshi
  references:
    - id: zhang2019a
      notes: >
        Named as one of the group's four formations, "the Late Cretaceous
        Wangshi Group, which comprises the Xingezhuang, Jiangjunding,
        Jingangkou, and Changwangpu formations", with no order stated.

"Chipping Norton Limestone":
  rank: formation

Conques:
  rank: formation
  parent: Tremp
  stages: [Maastrichtian]
  contains: [Basturs]
  references:
    - id: párraga2019a
      notes: >
        Eastern Tremp Syncline, south-central Pyrenees; the lower of the group's
        two red-bed formations. "The Basturs Poble bonebed occurs in the upper
        lower Maastrichtian section of the Conques Formation (Tremp Group;
        Cuevas, 1992)", and for the informal equivalent, "This formation is part
        of the 'Lower Red Garumnian' facies (the "Tremp Formation" of authors;
        Rosell et al. 2001; Riera et al. 2009; Fondevilla et al. 2016)."
    - id: prieto-márquez2019a
      notes: >
        Costa de les Solanes "lies in the lower Maastrichtian Conques Formation
        (Tremp Group; Cuevas, 1992)", below "lacustrine limestones of the
        Basturs Member (Cuevas, 1992)". Separated from the Talarn above by a
        gap, not a contact: "The hadrosaurid-bearing localities of the Talarn
        Formation are temporally separated from the above-discussed localities
        of the Conques Formation by a 3.85 Ma time lapse".
    - id: vila2022a
      notes: >
        Orcau-1, "Lower portion of the Tremp Group, basalmost strata of the
        Conques Formation" -- group rank for the parent, formation for this.
    - id: augustin2023a
      notes: >
        The only member-rank usage found, "the Upper Cretaceous (lower
        Maastrichtian) Conques Member of the Tremp Formation", for the same
        Basturs Poble horizon that its own cited source (Párraga and
        Prieto-Márquez 2019) calls a formation. Not recorded as
        `rank_contested`: the paper describes an ornithopod and does not define
        the unit, so it states no rank in the sense this file collects.

Crato:
  rank: formation
  parent: Santana
  stages: [Aptian]
  references:
    - id: arai2020a
      notes: >
        Araripe Basin. One of Beurlen's (1971) four members, raised to
        formation rank within the Santana Group. Aptian on the presence of
        Sergipea variverrucata. Where the Aptian-Albian boundary falls has moved
        repeatedly across this unit -- Pons and others (1990, 1996) and Arai and
        others (2004) placed it inside the Crato -- and this paper concludes it
        lies above the group entirely.
    - id: delcourt2025a
      notes: >
        Uses formation rank throughout: the Araripe Plateau borders "where the
        Crato, Ipubi, and Romualdo formations are exposed".

"Cuckfield Stone":
  rank: bed
  parent: Grinstead Clay
  references:
    - id: young1988a
      notes: >
        Ranked a bed rather than a member: "the Cuckfield Stone is a lenticular
        bed of sandstone, calcareous in part, that separates the Lower Grinstead
        Clay from the Upper Grinstead Clay", and "is apparently a channel-fill
        deposit".
    - id: norman2013a
      notes: >
        Places dinosaur material "embedded in Cuckfield Stone (Grinstead Clay
        Member, upper middle Valanginian)".

"Dinosaur Park":
  rank: formation
  parent: Belly River
  stages: [Campanian]
  references:
    - id: arbour2013a
      notes: >
        Dates the top of the formation at 74.9 Ma and places its deposition
        within the Campanian; no source extends the unit into the Santonian or
        the Maastrichtian.
    - id: eberth2005a
      notes: >
        The uppermost of the Belly River Group's three formations, 70 m thick at
        Dinosaur Provincial Park. Erected by Eberth and Hamblin (1993) for "the
        upper most beds in the package" they separated out of McLean's Judith
        River Formation.

Djadokhta:
  rank: formation
  stages: [Campanian]
  contains: ["Bayn Dzak", Tugrugyin]
  references:
    - id: dashzeveg2005a
      notes: >
        Erects both members on lithology and maps them at their type localities:
        the Bayn Dzak Member at Bayn Dzak (the Flaming Cliffs) and the Tugrugyin
        Member at Tugrugyin Shireh, the second superposed on the first. The
        subdivision is scoped to the southern Ulan Nur Basin, so it does not
        reach the Nemegt Basin exposures at Ukhaa Tolgod.
    - id: arbour2015a
      notes: >
        Applies the subdivision to a holotype, equating "Bayan Zag" with Bayn
        Dzak, Shabarakh Usu and the Flaming Cliffs, and placing it in the "Bayn
        Dzak Member, Djadokhta Formation".

Dockum:
  rank: group
  references:
    - id: nesbitt2015a
      notes: >
        Lepidus. The erecting paper withheld a formation name deliberately;
        this is the uncontested fallback if Cooper Canyon is judged too
        contested.

Douira:
  rank: formation
  parent: "Kem Kem"
  stages: [Cenomanian]
  references:
    - id: ibrahim2020a
      notes: >
        Erected here, "with stratotype at the locality Douira", as the upper of
        the group's two formations. It "rests conformably on the Gara Sbaa
        Formation" and is capped by the massive fossiliferous limestone at the
        base of the Akrabou. The shift to finer-grained sedimentation at its
        base is tied to the Mid Cenomanian Event at about 96.0 Ma.
    - id: kellermann2025a
      notes: >
        Follows the scheme; the Carcharodontosaurus neotype is from this
        formation.

Drumheller:
  rank: member
  parent: "Horseshoe Canyon"
  stages: [Campanian]
  references:
    - id: eberth2012a
      notes: >
        The second of the formation's seven members, elevated here from
        Hamblin's (2004) informal Hoodoo tongue and correlative with
        Srivastava's (1968) Coaly Member. Its base "interfingers with or rests
        sharply on marine shales and sandstones of the Bearpaw Formation" to the
        east and south and conformably overlies the Strathmore to the north and
        west; its top is the Drumheller bentonite zone in well logs, or the top
        of the #6-7 coal zone in outcrop. Within the uppermost 33n to lower 32n
        magnetochrons, about 73.2-71.5 Ma.

Echaporã:
  rank: member
  parent: Marília
  references:
    - id: fernandes2000a
      notes: >
        Bauru Basin, one of the three members Barcelos and Suguio (1987)
        defined in the formation. It "has gradational and interdigitated
        contacts with the Vale do Rio do Peixe Formation", rests directly on the
        Serra Geral basalts along the eastern border in São Paulo, and in Goiás
        oversteps the basalts onto older units. Soares and others (1980) had
        treated its type areas as the Marília Formation itself.
    - id: soares2020a
      notes: >
        Restricts the Marília Formation to "the southeastern and northwestern
        parts of the Bauru Basin", the deposits this member covers, so that
        under that revision the formation and this member describe the same
        rocks. Table 2 lists "Echaporã Member" as the restricted formation's
        previous nomenclature, alongside the Serra da Galga and Ponte Alta
        members it supersedes; the paper does not separately say the name is
        withdrawn.

"El Carrizo":
  rank: formation
  parent: Malargüe
  references:
    - id: martinelli2004a
      notes: >
        Neuquén Basin. The uppermost unit of the group's southeastern sequence,
        "from the base to the top respectively ... the Allen, Jagüel, Roca, and
        El Carrizo formations". Nothing further is said about it.

"El Mers":
  rank: group
  contains: ["El Mers I", "El Mers II", "El Mers III"]
  references:
    - id: maidment2020a
      notes: >
        Middle Atlas, Morocco. Group rank, "divided into three formations known
        as El Mers I-III" after Oukassou and others (2015), and "dated as
        Bathonian-Callovian based on echinoderm, brachiopod and ammonite
        biostratigraphy". Overlain unconformably by a Barremian sequence, the
        area having been emergent until the Cretaceous.
    - id: maidment2021a
      notes: >
        Places the El Mers III above the El Mers II, the only ordering any
        source states for the three: the Boulahfa horizon, first reported from
        the El Mers II, is moved up because "subsequent field observations at
        the site suggest that it may lie slightly higher in the stratigraphy".
        The numbering itself is not given as a stratigraphic sequence anywhere.

"El Mers I":
  rank: formation
  parent: "El Mers"
  stages: [Bathonian]
  references:
    - id: maidment2020a
      notes: >
        Middle Atlas, Morocco. One of the group's three formations and the
        oldest dated of them, which "comprises varicoloured mudstones and
        interbedded, laterally restricted sandstones", terrestrial, and "is
        dated as middle Bathonian on the basis of ammonite biostratigraphy of
        the surrounding marine intervals". Dinosaur bones have been reported
        from it since Termier and others (1940).

"El Mers II":
  rank: formation
  parent: "El Mers"
  stages: [Bathonian]
  references:
    - id: maidment2020a
      notes: >
        The second of the group's three formations, correlated from the nearby
        Skoura syncline; the Adratiklit locality is placed in it only
        tentatively, as outcrops that "may correspond to the El Mers II
        Formation".
    - id: maidment2021a
      notes: >
        Withdraws that placement: the same authors "reported the horizon as
        lying in the El Mers II Formation, but subsequent field observations at
        the site suggest that it may lie slightly higher in the stratigraphy",
        which moves the Boulahfa material to the El Mers III.

"El Mers III":
  rank: formation
  parent: "El Mers"
  stages: [Bathonian, Callovian]
  references:
    - id: maidment2021a
      notes: >
        Gives the horizon as the "El Mers III Formation (Upper
        Bathonian/Callovian, Middle Jurassic: 168.3-163.5 million years ago)"
        at Boulahfa, and places both Spicomellus and Adratiklit in it.
    - id: zafaty2024a
      notes: >
        The fullest description of the unit: "a series of many tens of meters
        (~60 m) of fine friable gray marls, green pinkish marls and siltstones
        interspersed with calcareous marls", Bathonian-?Callovian, cut at its
        top by the paleochannel sandstones of the Oued El Atchane Formation.

Elliot:
  rank: formation
  variants: ["Red Beds"]
  stages: [Norian, Rhaetian, Hettangian, Sinemurian, Pliensbachian]
  references:
    - id: peyredefabrègues2016a
      notes: >
        Gives the historical names: the Elliot and Clarens Formations were
        called the "Red Beds" and the "Cave Sandstone" respectively, and the
        Lower Red Beds are the equivalent of the lower Elliot Formation. The
        formation straddles the Triassic-Jurassic boundary and its two informal
        parts carry the split, material being "found in the lower Elliot
        Formation (Late Triassic) or in the upper Elliot Formation (Early
        Jurassic)". A wide span across this formation is therefore expected
        rather than anomalous.
    - id: barrett2019a
      notes: >
        Sets out the published age framework: the lower Elliot is "regarded as
        Late Triassic (potentially Norian/Rhaetian) in age, whereas the upper
        Elliot Formation has been considered to be Early Jurassic
        (Hettangian-Sinemurian)". Magnetostratigraphy across the main Karoo
        Basin subsequently moved the Triassic-Jurassic boundary up into the
        upper Elliot, so that "the lower part of the upper Elliot is Rhaetian in
        age, while its upper part is Early Jurassic (Hettangian-Sinemurian)".
    - id: yates2011a
      notes: >
        The younger bound, hedged at source: "Upper Elliot Formation, Early
        Jurassic, possibly Pliensbachian".

"Farta Pão":
  rank: formation
  contains: [Sobral]
  stages: [Kimmeridgian, Tithonian]
  references:
    - id: mateus2017a
      notes: >
        Lusitanian Basin, west-central Portugal. Unites the Sobral, Arranhó I,
        Arranhó II and Freixial members, the Sobral having also been treated as
        a formation in its own right and as a member of the Lourinhã.

Figuerola:
  rank: formation
  parent: Fontllonga
  stages: [Maastrichtian, Danian]
  references:
    - id: fondevilla2019a
      notes: >
        Places the unit in the Àger Syncline's OWN group, not the Tremp Group:
        "Colombo and Cuevas (1993) did the same for the Àger Syncline, replacing
        the Tremp Fm by the Fontllonga Group. In this case, the La Maçana Fm
        replaces the "Grey Garumnian"; the Figuerola Fm is equivalent to the
        "Lower Red Garumnian"; the Millà Fm is equivalent to the "Vallcebre
        limestones"; and the Perauba Complex can be related to the "Upper Red
        Garumnian"." So the Figuerola is the Àger counterpart of the Conques
        plus Talarn, and is not a synonym of either.
    - id: prieto-márquez2021a
      notes: >
        Àger Syncline, NOT the Tremp Syncline -- the distinction matters because
        the two synclines carry different formation names for coeval strata. The
        Fylax type horizon at Fontllonga-R is "Rocks corresponding to chron C29r
        within the Figuerola Formation", and "The Figuerola Formation spans
        chrons C31n through C29n and consists of alternating brown, ochre, and
        reddish marl with sandstone that have been interpreted as fluvial
        deposits". Not a synonym of the Talarn: the same paper uses Talarn for
        the Tremp-Syncline unit of the same chron, "Pararhabdodon isonensis from
        the Talarn Formation of the eastern Tremp syncline".

Fontllonga:
  rank: group
  contains: ["La Maçana", Figuerola, "Millà"]
  stages: [Maastrichtian, Danian]
  references:
    - id: fondevilla2019a
      notes: >
        The Àger Syncline's counterpart to the Tremp Group, erected by the same
        move at the same time: "Colombo and Cuevas (1993) did the same for the
        Àger Syncline, replacing the Tremp Fm by the Fontllonga Group." Its
        formations answer one-for-one to the Tremp Group's, so a locality in the
        Àger Syncline takes a Fontllonga-Group formation and never a
        Tremp-Syncline one.

Foremost:
  rank: formation
  parent: "Belly River"
  stages: [Campanian]
  references:
    - id: eberth2005a
      notes: >
        Southern Alberta, the lowest of the group's three formations, 170 m
        thick at Dinosaur Provincial Park. It "gradationally overlies marine
        shales of the Pakowki (Claggett) Formation" and "includes the McKay and
        Taber coal zones at the bottom and top, respectively, and an extensive
        sandy zone overlying the Taber Coal Zone referred to here as the
        Herronton Sandstone Zone" -- coal and sandstone zones rather than named
        members, and the Herronton was moved inside this formation here. Its
        base is nearly coincident with the 33n-33r chron boundary, in the
        Baculites asperiformis biozone at an estimated 80 Ma, but is "strongly
        diachronous, becoming progressively older to the west". Absent in
        Montana, which is part of why the nomenclature of the wedge is tangled.

Fuvelian:
  rank: none
  kind: local chronostratigraphic stage
  references:
    - id: csiki-sava2015a
      notes: >
        A time term, not a rock unit: "Several local stage names were proposed
        during the nineteenth century to subdivide the Upper Cretaceous
        continental series of Provence, notably by Matheron (1864: Valdonnian
        and Fuvelian) and Villot", the latter contributing the Begudian and
        Rognacian. Gives the Fuvelian as upper Santonian to lower Campanian.
    - id: tortosa2014a
      notes: >
        Shows the distinction inside one paper: gives Arcovenator a formation
        and a local stage side by side, while placing Tarascosaurus in "the
        Fuvelian local stage" with no formation.

Ganzhou:
  rank: group
  contains: [Maodian, Zhoutian]
  references:
    - id: yao2026a
      notes: Underlies the Guifeng Group.

"Gara Sbaa":
  rank: formation
  stages: [Cenomanian]
  parent: Kem Kem
  references:
    - id: ibrahim2020a
      notes: >
        Erects the unit as the lower formation of the Kem Kem Group. Not a
        spelling of Ifezouane: this paper treats the Ifezouane as a laterally
        correlative unit of a different region and explicitly rejects Cavin et
        al.'s (2010) application of that name to the Kem Kem strata.

Gosau:
  rank: group
  references:
    - id: csiki-sava2015a
      notes: The Grünbach Formation sits in the Lower Gosau Subgroup.
    - id: bunzel1870a
      notes: >
        Its "Gosau formation" is pre-modern usage, from before the Gosau was
        raised to group rank.

"Grinstead Clay":
  rank: formation
  rank_contested: [member, formation]
  parent: Hastings
  references:
    - id: galton2009a
      notes: >
        Places it within the Hastings Beds, between the Upper and Lower
        Tunbridge Wells Sands: "in descending order the Upper Tunbridge Wells
        Sands, Grinstead Clay, Lower Tunbridge Wells Sands, Wadhurst Clay,
        Ashdown Beds".
    - id: norman2013a
      notes: Treats it as a formation; so do Naish (2008) and Raven (2020).
    - id: norman2010a
      notes: >
        Treats it as a Member of the Tunbridge Wells Sand Formation. Recorded
        at formation rank with the disagreement kept visible rather than
        settled by majority.

Guifeng:
  rank: group
  contains: ["Hekou (CN-JX)", Tangbian, Lianhe]
  references:
    - id: yao2026a
      notes: Jiangxi. Its Hekou Formation is not the Gansu Hekou Group.

Hastings:
  rank: group
  rank_contested: [group, subgroup]
  contains: ["Ashdown Beds", "Wadhurst Clay", "Tunbridge Wells Sand",
             "Grinstead Clay"]
  variants: ["Hastings Beds"]
  references:
    - id: norman2010a
      notes: >
        Contains the Wadhurst Clay Formation below and the Tunbridge Wells Sand
        Formation as its uppermost part; the two together "correspond to the
        entire Valanginian stage". Treated here at sub-group rank within the
        Wealden, as the "Hastings Sub-Group".
    - id: norman2013a
      notes: >
        Uses group rank for the same unit, placing the Wadhurst Clay and Lower
        Tunbridge Wells Sand formations within the "Hastings Group".
    - id: galton2009a
      notes: >
        Uses the bare legacy name for the unit, giving the "Lower Weald
        Clay/Hastings Beds boundary" in Sussex, and the fullest constituent list
        of any source here: "Hastings Beds: in descending order the Upper
        Tunbridge Wells Sands, Grinstead Clay, Lower Tunbridge Wells Sands,
        Wadhurst Clay, Ashdown Beds". The Tunbridge Wells Sand appears twice in
        that succession, as an upper and a lower division with the Grinstead
        Clay between them, so the units listed here are not a single ascending
        sequence.

"Hekou (CN-GS)":
  rank: group
  references:
    - id: yao2026a
      notes: >
        Lanzhou-Minhe Basin, Lower Cretaceous. Distinct from the Hekou
        Formation of the Guifeng Group in Jiangxi -- different unit, different
        age.
    - id: you2006a
      notes: >
        Daxiatitan, Huanghetitan liujiaxiaensis, Lanzhousaurus, Yongjinglong.
        No work subdivides the Hekou Group into named formations in this basin.

"Hekou (CN-JX)":
  rank: formation
  parent: Guifeng
  references:
    - id: yao2026a
      notes: >
        Jiangxi, the lowest formation of "the upper Guifeng Group consisting of
        the Hekou, Tangbian and Lianhe formations in ascending order". Not the
        Hekou Group of the Lanzhou-Minhe Basin in Gansu -- a different unit of a
        different age.

Hikagenosawa:
  rank: formation
  parent: Yezo
  stages: [Cenomanian]
  references:
    - id: hayakawa2005a
      notes: >
        Hokkaido. One of the formations of the Middle Yezo Group in the Omakisawa
        River area, alongside the Maruyama and Takinosawa formations, all of them
        "composed predominantly of fossiliferous mudstone and intercalated
        sandstone; they were deposited in offshore, shallow to deep marine
        environments". The Cenomanian-Turonian boundary sits at its contact with
        the Saku Formation in northern Oyubari, and the Cenomanian index
        inoceramid Inoceramus ginterensis occurs in its upper part.
    - id: oyabu2026a
      notes: >
        Puts the upper part of the formation in the upper Cenomanian, in Yubari
        City.

Horsethief:
  rank: member
  parent: "Horseshoe Canyon"
  stages: [Campanian]
  references:
    - id: eberth2012a
      notes: >
        The third of the formation's seven members, running from the base of the
        Drumheller bentonite zone (or the top of the #6-7 coal zone) to "the top
        of the uppermost subbituminous coal in the #8-9 coal zone". Correlative
        with the lower half of Hamblin's (2004) Midland tongue. Within the 32n
        magnetochron, about 71.5-71.0 Ma.
    - id: arbour2013a
      notes: >
        Ties the formal member to the informal scheme it replaces: material "in
        the upper part of Unit 1 of the Horseshoe Canyon Formation, now defined
        as the Horsethief Member".

Houcheng:
  rank: formation
  references:
    - id: zhao2006a
      notes: >
        Laterally equivalent to the Tuchengzi Formation and not a spelling of
        it: Houcheng is the Hebei name, Tuchengzi the Liaoning one. Which
        applies follows the province the locality sits in.

Hutubihe:
  rank: formation
  parent: Tugulu
  stages: [Valanginian]
  references:
    - id: zheng2023a
      notes: >
        Junggar Basin, the second formation of the group. Valanginian in this
        paper's age model for the group, consistent with the
        Toroisporis-Densoisporites-Classopollis-Piceaepollenites sporopollen
        assemblage reported by Yu and others (1986).

Ipubi:
  rank: formation
  parent: Santana
  stages: [Aptian]
  references:
    - id: arai2020a
      notes: >
        Araripe Basin. One of Beurlen's (1971) four members, raised to formation
        rank within the Santana Group, and Aptian on the presence of Sergipea
        variverrucata. The Aptian-Albian reading of Arai and others (1997),
        maintained into the 2000s, is superseded here.
    - id: delcourt2025a
      notes: >
        Uses formation rank for it alongside the Crato and Romualdo.

"Iren Dabasu":
  rank: formation
  variants: [Erlian, "Iren Debasu"]
  references:
    - id: xu2006c
      notes: >
        Erlian is the Chinese name for the same unit, and these two papers show
        it directly: this one puts Sonidosaurus at "Saihangaobi, Sonid Zuoqi,
        Nei Mongol (15 km southwest of Erenhot); Elian Formation".
    - id: xu2007b
      notes: >
        The same locality under the other name -- Gigantoraptor from
        "Saihangaobi, Sunitezuoqi, Nei Mongol Autonomous Region. Iren Dabasu
        Formation". Both names must be searched: the Erlian literature, which
        is where the basin's subdivision is discussed, does not surface under
        Iren Dabasu.
    - id: brett-surman1979a
      notes: Prints the unit as the "Iren Debasu Formation" in its horizon line.

Jagüel:
  rank: formation
  parent: Malargüe
  stages: [Maastrichtian, Danian]
  references:
    - id: martinelli2004a
      notes: >
        Neuquén Basin, present in both the southeastern and northwestern
        sequences of the group. Fully marine, overlying the Allen at Bajo de
        Santa Rosa and, with it, resting discordantly on the Bajo de la Carpa
        Formation. "The age inferred for the Jagüel Formation is Late
        Maastrichtian-Early Danian", and the Cretaceous-Paleogene boundary is
        recognized in its upper part.

Jiangjunding:
  rank: formation
  parent: Wangshi
  references:
    - id: zhang2019a
      notes: >
        Named as one of the group's four formations, "the Late Cretaceous
        Wangshi Group, which comprises the Xingezhuang, Jiangjunding,
        Jingangkou, and Changwangpu formations", with no order stated.

Jingangkou:
  rank: formation
  parent: Wangshi
  stages: [Campanian, Maastrichtian]
  variants: [Hongtuya]
  references:
    - id: zhang2019a
      notes: >
        Laiyang, Shandong. One of the group's four formations, and the source of
        the equation the older literature has to be read through: Yan and Chen
        (2005) "obtained an isotope age of 73 Ma for the Jingangkou Formation
        (which they called the Hongtuya Formation)".
    - id: yao2026a
      notes: >
        Tabulates the unit as late Campanian to early Maastrichtian in its
        summary of China's formally named hadrosaurids, giving it as the horizon
        for Tsintaosaurus and Laiyangosaurus at Laiyang.

Jiufotang:
  rank: formation
  parent: Jehol
  stages: [Aptian]
  references:
    - id: arbour2015a
      notes: >
        "Jiufotang Formation, Aptian."
    - id: zheng2023a
      notes: >
        Dates it about 122-115.5 Ma and identifies it as the host of the
        late-stage Jehol Biota assemblage.
    - id: yao2019a
      notes: >
        Places it above the Yixian, and records that whether the Sihedang
        exposures belong to one or the other is unsettled -- an issue that paper
        declines to resolve.

"Kuangyuan Series":
  rank: informal
  references:
    - id: young1942a
      notes: >
        The historical unit for the Guangyuan (Kuangyuan) vertebrate localities
        in Sichuan, and the horizon the taxa from them were erected on: the
        Chienkosaurus teeth came "all from the rich shell-bearing layer at the
        top of the Kuangyuan Series". Which modern formation that layer belongs
        to is unsettled — Penglaizhen and Suining have both been proposed — so
        records from these localities hold the historical unit rather than a
        choice between them. Rank word kept: it is part of the name.

"Hell Creek":
  rank: formation
  stages: [Maastrichtian]
  references:
    - id: brown2011a
      notes: >
        Dates the unit by correlation rather than directly: the Frenchman
        Formation of Saskatchewan is "contemporary with the youngest part of the
        Hell Creek Formation of Montana", and the Frenchman "was deposited in
        the last one-half million years of the Maastrichtian".

"Horseshoe Canyon":
  rank: formation
  contains: [Strathmore, Drumheller, Horsethief, Morrin, Tolman, Carbon, Whitemud]
  stages: [Campanian, Maastrichtian]
  references:
    - id: eberth2012a
      notes: >
        Defines the members: the formation "is divided into seven mappable
        members: Strathmore, Drumheller, Horsethief, Morrin, Tolman, Carbon, and
        Whitemud (bottom to top)". The Strathmore Member is the basal one,
        bounded by the lower and upper tongues of the Bearpaw Formation, and the
        Strathmore and Drumheller members were elevated here from Hamblin's
        (2004) informal Strathmore and Hoodoo tongues. The formation "spans
        approximately 7 million years, ranging from late Campanian (~74.0 Ma;
        magnetochron 33n) to late Maastrichtian (~67 Ma; magnetochron 30n)",
        which is why the envelope carries both stages.

Huincul:
  rank: formation
  parent: "Río Limay"
  stages: [Cenomanian, Turonian, Coniacian]
  references:
    - id: baiano2020a
      notes: >
        "Huincul Formation (Cenomanian-Turonian)", the prevailing modern
        reading.
    - id: carballido2010a
      notes: >
        Places the formation in the "Río Limay Subgroup, Neuquén Group", and
        gives the Limaysaurus tessonei-bearing levels of the Candeleros and
        Huincul formations as Cenomanian.
    - id: gallina2005a
      notes: >
        The Coniacian end, on a minority reading -- "'La Buitrera', Huincul
        Formation (Turonian-Coniacian)". Later work on the same locality
        generally prefers Cenomanian-Turonian.

Jehol:
  rank: group
  contains: [Yixian, Jiufotang]
  references:
    - id: yao2019a
      notes: >
        Lingyuanosaurus, Zhongjianosaurus -- both from the Sihedang locality on
        identical coordinates. Whether those exposures belong to the Yixian or
        the overlying Jiufotang is unsettled as of 2026, and this paper declines
        the question outright: "Resolving this stratigraphic issue is beyond the
        scope of the present paper." Group rank is the finest unit both readings
        share.

"Judith River":
  rank: formation
  stages: [Campanian]
  references:
    - id: arbour2017a
      notes: >
        A northern Montana unit "deposited over an approximately 4 Myr interval
        during a Campanian transgressive-regressive cycle of the Western
        Interior Seaway".
    - id: eberth2005a
      notes: >
        The historic "Judith River Formation" of southern Alberta is a different
        unit from the Montana formation: the redefined Belly River Group "is
        synonymous with the long-standing informal usage of 'Belly River',
        McLean's 'Judith River Formation', and Eberth and Hamblin's 'Judith
        River Group'", and Eberth and Hamblin (1993) subdivided that single
        Alberta unit into the Foremost, Oldman and Dinosaur Park formations, so
        papers predating the revision use the old name for all three.

"Kalahari Deposits":
  rank: none
  kind: region name hardened into a unit
  references:
    - id: dewit1992a
      notes: >
        The only geological investigation of the Kangnas site uses the word
        "Formation" nowhere and "Kalahari" once, inside a cited reference title;
        it describes a crater-facies deposit above an olivine-melilitite
        intrusion.
    - id: rogers1915a
      notes: >
        The companion note to the erecting paper, and the only contemporary
        account of the well. Uses "Kalahari" purely as a region -- "the southern
        Kalahari", "the Kalahari region" -- and names no stratigraphic unit.
        Every later use of "Kalahari Deposits" traces to Cooper (1985).

"Kem Kem":
  rank: group
  contains: ["Gara Sbaa", Douira]
  references:
    - id: ibrahim2020a
      notes: >
        "recognized here as the Kem Kem Group, which is composed of the lower
        Gara Sbaa and upper Douira formations".
    - id: kellermann2025a
      notes: >
        Follows the Ibrahim scheme; the Carcharodontosaurus neotype is Douira.

"La Posa":
  rank: formation
  parent: Tremp
  stages: [Maastrichtian]
  references:
    - id: dallavecchia2020a
      notes: >
        The lowest formation of the group, below the red beds: "the Els Nerets
        site of the La Posa Formation, which is referred to the magnetochron
        C31r and dated to the early Maastrichtian". Corresponds to the informal
        'grey unit' / 'Grey Garumnian'.

Lameta:
  rank: formation
  stages: [Maastrichtian]
  references:
    - id: wilson2003a
      notes: >
        Ranks the unit as a formation and dates it Maastrichtian, on the
        infratrappean Lameta sediments at Rahioli, Gujarat, which lie below the
        Deccan Trap flood basalts.

Lewisville:
  rank: formation
  parent: Woodbine
  contains: [Arlington, Tarrant]
  stages: [Cenomanian]
  references:
    - id: tykoski2023a
      notes: >
        North Texas. "The Lewisville Formation is the upper formation of the
        Woodbine Group following recent revision of Woodbine stratigraphy and
        nomenclature by Denne et al. (2016)", with the Arlington and Tarrant as
        its members. Uppermost lower to lower middle Cenomanian, about 96 Ma.

Lianhe:
  rank: formation
  parent: Guifeng
  stages: [Maastrichtian]
  references:
    - id: yao2026a
      notes: >
        Jiangxi, the uppermost formation of the group; it "displays conformable
        contact with the lower Tangbian Formation" and "can be dated to the
        Maastrichtian according to the spore and pollen assemblages".

Lianmuqin:
  rank: formation
  parent: Tugulu
  stages: [Valanginian, Hauterivian, Barremian, Aptian, Albian]
  references:
    - id: zheng2023a
      notes: >
        Places the unit as the uppermost formation of the Tugulu Group, which
        "consists (in ascending order) of the Qingshuihe, Hutubihe, Shengjinkou,
        and Lianmuqin Formations". Concludes that "the paleontological evidence
        thus indicates an Aptian-Albian age for the Lianmuqin Formation of the
        southern Junggar Basin", but carries the older bound down on its own
        radioisotopic evidence: "our isotopic age from the top of the
        Shengjinkou Formation indicates that the Lianmuqin Formation could have
        been deposited as early as the Valanginian". A white tuffaceous
        siltstone marker bed separates the Shengjinkou and Lianmuqin formations
        in the northwestern Junggar Basin.
    - id: rauhut2005c
      notes: >
        The older reading, hedged at source: "Age-?Valanginian-Albian (Shen and
        Mateer, 1992)". Prints the unit name as "Lianmugin".
    - id: maidment2008a
      notes: >
        Also ranks the unit a formation, and gives a Valanginian-Albian age.

Loncoche:
  rank: formation
  parent: Malargüe
  stages: [Campanian, Maastrichtian]
  references:
    - id: martinelli2004a
      notes: >
        Neuquén Basin, the lowest unit of the group's northwestern sequence --
        the paper lists that sequence without stating a direction, but places
        this formation between the Neuquén Group below and the Jagüel above.
        "The Loncoche Formation (Late Campanian-Early Maastrichtian) extends
        over southern Mendoza Province and the west of La Pampa Province", and
        with the Allen it "represents the transition between the fully
        continental Neuquén Group and the fully marine Jagüel Formation".

Lourinhã:
  rank: formation
  rank_contested: [formation, group]
  contains: ["Praia da Amoreira-Porto Novo", "Praia Azul"]
  stages: [Kimmeridgian, Tithonian]
  references:
    - id: mateus2014a
      notes: >
        Lusitanian Basin, west-central Portugal. "The Lourinha Formation ... is
        early Kimmeridgian-late Tithonian in age."
    - id: tschopp2015a
      notes: >
        Gives the members used for horizons: "Amoreira-Porto Novo Member,
        Lourinha Formation, Late Kimmeridgian" and the Sobral Member, without
        stating their order.
    - id: carrano2012a
      notes: >
        Uses the alternative member vocabulary for the same succession,
        "Alcobaça and Porto Novo Members, Lourinha Formation; late
        Kimmeridgian-Tithonian".
    - id: maidment2008a
      notes: >
        Group rank for the same unit, "the Upper Jurassic Lourinha Group of
        Portugal (Escaso et al. 2007)". Recorded at formation rank, which is the
        prevailing usage, with the disagreement kept visible.

Lufeng:
  rank: formation
  stages: [Hettangian, Sinemurian, Pliensbachian, Toarcian]
  contains: [Shawan, "Zhangjia'ao"]
  variants: ["Lower Lufeng"]
  references:
    - id: xing2012b
      notes: >
        Ties the modern member names to the color terms the older literature
        uses, which is what makes those papers readable: the Zhangjia'ao Member
        "was originally recognized as the 'Deep Red Beds' of the Upper Member"
        and the Shawan Member "as the 'Dark Purple Beds' of the Lower Member".
        Its per-member faunal lists overlap, so they identify a taxon's
        occurrences and cannot fix a holotype's member on their own.
    - id: you2014b
      notes: >
        States the same equivalence from the other side, "Shawan Member of the
        Lufeng Formation (Fang et al. 2000). This is equivalent to the Dull
        Purplish Beds of the Lower Lufeng Formation".
    - id: sekiya2010a
      notes: >
        Records that replacing the upper/lower bed names with Shawan and
        Zhangjia'ao remains contested, so both vocabularies stay current in the
        literature.
    - id: zhang2024a
      notes: >
        Magnetostratigraphy gives "Early Jurassic (late Sinemurian-Toarcian)"
        against the Hettangian and Sinemurian of the bed-based dating. The
        envelope spans both.

"Magnesian Conglomerate":
  rank: none
  kind: superseded misassignment
  references:
    - id: galton2007a
      notes: >
        Asylosaurus, Thecodontosaurus. The erecting paper rejects it outright --
        the deposit is "a Triassic (Rheatian) dolomitized cave breccia or
        fissure fill (not in Magnesian/ Dolomitic Conglomerate ...) in Lower
        Carboniferous (Dinantian) marine limestone" -- and explains how the name
        entered circulation: "It was long equated with the Magnesian
        Conglomerate, which occurs very close by."

Malargüe:
  rank: group
  contains: [Allen, Jagüel, Roca, "El Carrizo", Loncoche, Pircala]
  stages: [Campanian, Maastrichtian, Danian]
  references:
    - id: martinelli2004a
      notes: >
        Neuquén Basin, "Late Campanian-Early Paleocene sensu Legarreta &
        Gulisano, 1989". Its constituent formations "vary according to their
        position in the Neuquén basin": in the southeast, "from the base to the
        top respectively ... the Allen, Jagüel, Roca, and El Carrizo
        formations"; in the northwest, "Loncoche, Jagüel, Roca, and Pircala
        formations", the latter list with no direction stated. The contained
        units are the union of the two sequences, not a single ascending order.

Maodian:
  rank: formation
  parent: Ganzhou
  stages: [Cenomanian, Turonian, Coniacian, Santonian]
  references:
    - id: yao2026a
      notes: >
        Jiangxi, the lower formation of the group and the only one in it with
        absolute ages: a K-Ar age of 85.9 Ma from Ling (1996) against quartz
        electron spin resonance dating "between 96.5 and 87.5 Ma
        (Cenomanian-Coniacian)" from Zhong and others (2002). The envelope
        spans both.

Marília:
  rank: formation
  parent: Bauru
  contains: [Echaporã]
  stages: [Maastrichtian]
  references:
    - id: fernandes2000a
      notes: >
        Bauru Basin. Retained from Soares and others (1980) unchanged by this
        revision, and "divided into three members: Serra da Galga, Ponte Alta,
        and Echaporã" after Barcelos and Suguio (1987).
    - id: soares2020a
      notes: >
        Restricts the formation: "the use of the term Marília Formation is here
        restricted to the southeastern and northwestern parts of the Bauru
        Basin", the deposits traditionally treated as the Echaporã Member. The
        same revision reclassifies and elevates the Serra da Galga succession,
        "previously referred to in the literature as a member", to formation
        rank, and deprecates the Ponte Alta Member, referring its calcretes to
        "undifferentiated bodies of the Serra da Galga Formation".
    - id: martinelli2004a
      notes: >
        Gives its age as Late Maastrichtian.

Marree:
  rank: subgroup
  contains: ["Bulldog Shale"]
  references:
    - id: barrett2010b
      notes: >
        "the Marree Subgroup, which was formerly called the Marree Formation".

Miaogou:
  rank: formation
  stages: [Aptian, Albian]
  references:
    - id: hao2025a
      notes: >
        "Miaogou Formation (Aptian-Albian)" for the Maortu locality, which is
        where the formation's dinosaur record comes from.

Morrin:
  rank: member
  parent: "Horseshoe Canyon"
  stages: [Campanian, Maastrichtian]
  references:
    - id: eberth2012a
      notes: >
        The fourth of the formation's seven members, from the top of the #8-9
        coal zone up to the maximum flooding surface of the Drumheller Marine
        Tongue just above the #10 coal. It "includes the Campanian-Maastrichtian
        boundary (70.6 Ma)", which is why the envelope carries both stages;
        about 71.0-70.5 Ma in Drumheller outcrop.
    - id: arbour2013a
      notes: >
        Ties the formal member to the informal scheme it replaces, constraining
        material to "Unit 2 (Morrin Member ...) of the Horseshoe Canyon
        Formation", with the members taken "sensu Eberth and Braman".

Mussentuchit:
  rank: member
  parent: Cedar Mountain
  stages: [Albian, Cenomanian]
  references:
    - id: avrahami2024a
      notes: >
        The younger bound: a radiometrically dated member-wide span of 99.674
        +0.439/-0.197 to 98.905 +0.158/-0.183 Ma, a window inside the
        Cenomanian.
    - id: carpenter1999a
      notes: >
        The older bound: gives the member as "Late Albian or Early Cenomanian"
        on faunal grounds, supported by a radiometric date of 98.39 +/- 0.07 Ma.

Morrison:
  rank: formation
  stages: [Oxfordian, Kimmeridgian, Tithonian]
  references:
    - id: carrano2012a
      notes: >
        "Morrison Formation (Kimmeridgian-Tithonian)", the range most of the
        literature gives.
    - id: tschopp2015a
      notes: >
        The older bound, for material at the formation's base: Dystrophaeus
        viaemalae is listed as "Oxfordian; low in Morrison Form.". No source
        extends the formation into the Berriasian.

Nemegt:
  rank: formation
  stages: [Campanian, Maastrichtian]
  references:
    - id: tsuihiji2011a
      notes: >
        "Nemegt Formation (late Campanian-early Maastrichtian to Maastrichtian)".
        Maastrichtian alone is the commoner phrasing, but the Campanian end is
        published: Karczewska and Ziembinska-Tworzydlo (1983) argued the
        formation down to the early Campanian on charophyte evidence. No members
        have been erected for this formation.

Neuquén:
  rank: group
  contains: ["Río Limay"]
  references:
    - id: carballido2010a
      notes: Candeleros and Huincul are formations within the Río Limay Subgroup.

"Praia da Amoreira-Porto Novo":
  rank: member
  parent: Lourinhã
  variants: ["Amoreira-Porto Novo", "Porto Novo"]
  references:
    - id: mateus2014a
    - id: mateus2017a
      notes: >
        Hill (1988, 1989) erected Praia da Amoreira and Porto Novo as two
        superposed members; Manuppella and others (1999) mapped them as one
        body, which this paper treats as a single member under the combined
        name. Papers shorten it to either constituent, so a bare "Porto Novo
        Member" is usually this unit rather than Hill's upper one.

Arlington:
  rank: member
  parent: Lewisville
  references:
    - id: head1998a
      notes: >
        Places the unit under the Woodbine Formation, in the classification
        current before the Woodbine was raised to group rank.
    - id: tykoski2023a
      notes: >
        Reflects the later scheme, in which the Lewisville is "the upper
        formation of the Woodbine Group" and the Arlington and Tarrant are its
        members.

Ohyamashimo:
  rank: formation
  parent: Sasayama
  stages: [Albian]
  references:
    - id: tanaka2024a
      notes: >
        Hyogo Prefecture, southwest Japan, the lower of the group's two
        formations, "mainly composed of terrestrial conglomerate, sandstones and
        siltstones, with intercalated rhyolitic tuff beds in its lower part",
        early Albian at about 112 Ma. The Miyada bonebeds lie in that lower
        part, for which no member is named.

"Pant-y-ffynnon Quarry fissure fill":
  rank: none
  kind: fissure fill
  references:
    - id: spiekman2021a
      notes: >
        Karstic fills in Carboniferous Limestone. The South Wales and Bristol
        Channel fissure faunas have no formation name in any paper, so this
        string is the best available value rather than a defect.

Parecis:
  rank: group
  references:
    - id: delcourt2017a
      notes: >
        No formation has been published for the Fazenda Roncador locality, so
        group rank is the finest honest value there.

"Oxford Clay":
  rank: formation
  stages: [Callovian, Oxfordian]
  contains: [Peterborough, Stewartby, Weymouth]
  references:
    - id: ruiz-omeñaca2007a
      notes: >
        Gives the equation the older literature has to be read through:
        "Oxford Clay Formation, Peterborough Member (=lower Oxford Clay)".
    - id: naish2007a
      notes: >
        Assigns all three members: five genera from "the Middle Callovian
        Peterborough Member ... in clay pits between Yaxley, Peterborough and
        Whittlesey"; "Clay pits in the Upper Callovian Stewartby Member ... near
        Oxford yielded the theropod Eustreptospondylus"; and Metriacanthosaurus
        parkeri "from the Weymouth Member (formerly Upper Oxford Clay)".

Pen:
  rank: formation
  stages: [Santonian]
  references:
    - id: rivera-sylva2018a
      notes: >
        "the Pen Formation (Upper Cretaceous, Santonian), at the Los Primos
        locality".

Oldman:
  rank: formation
  parent: Belly River
  stages: [Campanian]
  references:
    - id: arbour2017a
      notes: >
        Treats the unit as broadly contemporaneous with the Judith River
        Formation of Montana -- the Oldman and Dinosaur Park "were deposited
        penecontemporaneously and under similar geological controls and
        palaeoenvironmental conditions as the Judith River Formation" -- with
        its "upper muddy unit (unit 3)" lithostratigraphically and
        chronostratigraphically correlative with that formation's Coal Ridge
        Member.
    - id: eberth2005a
      notes: >
        One of the Belly River Group's three formations, 40 m thick at Dinosaur
        Provincial Park, where the exposed succession runs "in ascending order"
        from the upper 20 m of this formation into the complete Dinosaur Park
        Formation. Its stratigraphic extent was redefined by Eberth and Hamblin
        (1993) when they subdivided McLean's Judith River Formation.

Pawpaw:
  rank: formation
  variants: ["Paw Paw"]

Peterborough:
  rank: member
  parent: "Oxford Clay"
  stages: [Callovian]
  references:
    - id: ruiz-omeñaca2007a
      notes: >
        The lowest of the formation's three members and the equation the older
        literature has to be read through: "Cox et al. (1992) renamed the lower
        Oxford Clay the Peterborough Member of the Oxford Clay Formation."
        Middle Callovian, probably the Jason Zone; the upper Callovian and
        middle-upper Callovian ages given for the same material by Galton
        (1977b, 1980b) and Weishampel (1992) come from the older informal
        usage.
    - id: naish2007a
      notes: >
        "the Middle Callovian Peterborough Member of the Oxford Clay Formation
        in clay pits between Yaxley, Peterborough and Whittlesey".

Pircala:
  rank: formation
  parent: Malargüe
  references:
    - id: martinelli2004a
      notes: >
        Neuquén Basin. Listed last in the group's northwestern sequence,
        "Loncoche, Jagüel, Roca, and Pircala formations", which the paper gives
        without stating a direction. Nothing further is said about it.

"Ponte Alta":
  rank: none
  kind: deprecated member
  rank_contested: [member, none]
  parent: "Serra da Galga"
  references:
    - id: fernandes2000a
      notes: >
        Bauru Basin, one of the three members Barcelos and Suguio (1987)
        defined in the formation, and a diagenetic body rather than a
        depositional one: it "constitutes interior nuclei or tabular zones of
        the Serra da Galga Member, created by post-depositional cementation",
        with an interdigitated, complex and irregular contact against it.
        Generally taken to overlie the Uberaba Formation.
    - id: soares2020a
      notes: >
        Deprecates the name. This revision proposes "to deprecate the Ponte Alta
        Member classification and to refer the groundwater calcrete beds as
        undifferentiated bodies of the Serra da Galga Formation", the beds
        failing the code's mappability test: "The Ponte Alta Member is
        discontinued, and its strata are considered instead, as part of the
        Serra da Galga Formation, in view of their poor traceability and
        suitability for regional geological mapping."
    - id: cavalcanti2026a
      notes: >
        Follows that reassignment without adopting the member name: at the Ponte
        Alta Quarry the egg-bearing paleosol lies "just above the limestone
        belonging to the Serra da Galga Formation", and Ponte Alta is absent
        from this paper's list of the Bauru Group's formations. It is otherwise
        a quarry and geosite name here; the one use of "Ponte Alta Member"
        relays a fossil association credited to Dias-Brito and others (2001)
        rather than this paper's own nomenclature.

"Praia Azul":
  rank: member
  parent: Lourinhã
  stages: [Kimmeridgian, Tithonian]
  references:
    - id: mateus2017a
      notes: >
        The Consolação sub-basin package named the Praia Azul Member by Hill
        (1989), corresponding to the Sobral unit of Manuppella and others
        (1999) — a different body from the Sobral of the Arruda sub-basin.

"Presidente Prudente":
  rank: formation
  parent: Bauru
  references:
    - id: fernandes2000a
      notes: >
        Bauru Basin, erected by Fernandes (1998) and one of the six formations
        of the group as revised here. It "occurs at the highest elevations of
        the regional interfluvial areas, below which the Vale do Rio do Peixe
        Formation crops out", the two interdigitating as the fluvial system
        replaced the eolian one.

Qingshuihe:
  rank: formation
  parent: Tugulu
  stages: [Berriasian]
  references:
    - id: zheng2023a
      notes: >
        Junggar Basin, the basal formation of the group, but only in the south:
        "the Qingshuihe Formation does not occur in the NW Junggar Basin".
        Berriasian in this paper's age model, consistent with the clam shrimp,
        ostracod and sporopollen evidence.

Roca:
  rank: formation
  parent: Malargüe
  references:
    - id: martinelli2004a
      notes: >
        Neuquén Basin, present in both the southeastern and northwestern
        sequences of the group, above the Jagüel in the southeastern, which is
        the sequence given base to top. Nothing further is said about it.

Romualdo:
  rank: formation
  parent: Santana
  stages: [Aptian, Albian]
  references:
    - id: arai2020a
      notes: >
        Araripe Basin, the uppermost formation of the group, overlying the
        Barbalha, Crato and Ipubi. Concludes it is Aptian throughout: "a large
        portion of the Romualdo Formation (from its base to the level of sample
        49) is Aptian in age. It is very likely that the whole regressive
        section at the top of the unit is also Aptian." The Albian age carried
        by much of the literature is rejected on the ground that "indisputably
        Albian palynomorphs ... have not been reported thus far in any published
        work from the Romualdo Formation".
    - id: sues2002a
      notes: >
        The other end of the envelope, and why it is recorded rather than
        settled: reviewing the same question two decades earlier, "the
        concretion-bearing horizon of the Romualdo Member is probably younger
        than early Albian", with Berthou (1990) putting the concretions in the
        mid to late Albian. Much of the vertebrate literature dates the unit
        from this reading.
    - id: delcourt2025a
      notes: >
        Aptian, and works in formation rather than member rank. Distinguishes
        informal upper and lower carbonate concretion levels within the unit; no
        member is named for either.
    - id: carrano2012a
      notes: >
        Uses the older member rank, "Romualdo Member, Santana Formation".

"Ruby Ranch":
  rank: member
  parent: "Cedar Mountain"
  references:
    - id: carpenter1999a
      notes: >
        One of the four members Kirkland and others (1997) established. No stage
        is given: "the few taxa known suggest that the Ruby Ranch correlates
        with the Cloverly Formation of Montana and Wyoming".
    - id: tidwell2001a
      notes: >
        Places it above the Yellow Cat and Poison Strip interval.

"São José do Rio Preto":
  rank: formation
  parent: Bauru
  references:
    - id: fernandes2000a
      notes: >
        Bauru Basin. "It overlies the Vale do Rio do Peixe Formation, with
        transitional contact, locally erosive (diastems)." The name has been
        applied at three different scopes -- a facies association of the old
        Bauru Formation for Suguio and others (1977), a formation of the Bauru
        Group for Suguio (1981), and a member of the Adamantina for Soares and
        others (1980) and Barcelos (1984) -- and as used here it "corresponds to
        a restricted part of the unit previously mapped with this name".

Sawada:
  rank: formation
  parent: Sasayama
  stages: [Albian]
  references:
    - id: tanaka2024a
      notes: >
        Hyogo Prefecture, the upper of the group's two formations, "mainly
        composed of andesite, andesitic pyroclastic rocks and tuffaceous
        sandstones and mudstones". Its andesite gives a zircon age of 106.4 ±
        0.4 Ma, early Albian, which bounds the Ohyamashimo bonebeds from above.

"Serra da Galga":
  rank: formation
  rank_contested: [member, formation]
  parent: Bauru
  stages: [Maastrichtian]
  references:
    - id: silvajunior2022a
      notes: >
        Uberaba, Minas Gerais. Uses the unit at formation rank within the Bauru
        Group -- "the Serra da Galga Formation (Bauru Group, Late Cretaceous)",
        Maastrichtian -- following Soares and others (2021), who erected it as a
        new lithostratigraphic unit out of what had been a member of the
        Marília. Uberabatitan, Trigonosaurus and Baurutitan all come from it.
    - id: fernandes2000a
      notes: >
        The earlier rank, as one of the Marília Formation's three members. It
        overlies the Uberaba Formation with slightly erosive contacts, has an
        interdigitated contact with the Ponte Alta Member, and is presumed to
        pass westward into the Echaporã Member.

Shawan:
  rank: member
  parent: Lufeng
  variants: ["Dark Purple Beds", "Dull Purplish Beds"]
  references:
    - id: xing2012b
      notes: >
        The lowermost member of the formation, which "was originally recognized
        as the 'Dark Purple Beds' of the Lower Member of the Lower Lufeng
        Formation". Conformable below the Zhangjia'ao Member and unconformable
        on the Proterozoic Etouchang Formation. Hettangian in the Fang and
        others (2000) scheme.
    - id: you2014b
      notes: >
        States the same equivalence from the other side: the "Shawan Member of
        the Lufeng Formation (Fang et al. 2000) ... is equivalent to the Dull
        Purplish Beds of the Lower Lufeng Formation (Series) as defined by Bien
        (1940)".
    - id: zhang2024a
      notes: >
        No stage envelope is recorded because the two published ages are for
        different things: the Hettangian belongs to the member in the Fang and
        others (2000) scheme, while the late Sinemurian-Toarcian of the
        magnetostratigraphy is a formation-wide result.
    - id: irmis2008a
      notes: >
        Records the formalization: "the 'dull purple beds' and 'dark red beds'
        were formalized as the Shawan and Zhangjiawa members respectively".

Shengjinkou:
  rank: formation
  parent: Tugulu
  stages: [Valanginian]
  references:
    - id: zheng2023a
      notes: >
        Junggar Basin, the third formation of the group. "Our ca. 135.2 Ma U-Pb
        age places the upper Shengjinkou Formation within the Valanginian
        Stage", against an Early Cretaceous biostratigraphic age from its clam
        shrimp, sporopollen and siyuichthyid fish.

Sobral:
  rank: member
  rank_contested: [member, formation]
  parent: "Farta Pão"
  stages: [Kimmeridgian, Tithonian]
  references:
    - id: mateus2017a
      notes: >
        Places the Sobral as a member of the Farta Pão Formation, alongside the
        Arranhó I, Arranhó II and Freixial members, in the Arruda sub-basin.
    - id: tschopp2015a
      notes: >
        Lusitanian Basin. Member rank within the Lourinhã, dated
        "Kimmeridgian/Tithonian". The paper states no order relative to the
        Amoreira-Porto Novo.
    - id: carrano2012a
      notes: >
        Uses formation rank for the same unit, "Sobral Formation; late
        Kimmeridgian-early Tithonian, Late Jurassic".

Stewartby:
  rank: member
  parent: "Oxford Clay"
  stages: [Callovian]
  references:
    - id: naish2007a
      notes: >
        The middle of the formation's three members: "Clay pits in the Upper
        Callovian Stewartby Member of the Oxford Clay Formation near Oxford
        yielded the theropod Eustreptospondylus."

Strathmore:
  rank: member
  parent: "Horseshoe Canyon"
  stages: [Campanian]
  references:
    - id: eberth2012a
      notes: >
        The basal member, "formally elevated ... to member status on the basis
        of its widespread and mappable distribution in the subsurface" from
        Hamblin's (2004) informal Strathmore tongue. It "is bounded by the lower
        and upper tongues of the Bearpaw Formation and their correlative
        flooding surfaces", and to the north and west amalgamates with the
        Drumheller above and the Dinosaur Park Formation below. Within the 33n
        magnetochron, about 74.0-73.2 Ma.

Talarn:
  rank: formation
  parent: Tremp
  stages: [Maastrichtian, Danian]
  references:
    - id: serrano2021a
      notes: >
        The strongest source for the unit carrying the Pararhabdodon holotype,
        which it states in the formal horizon line of the emended diagnosis:
        "Sant Romà d'Abella at Tossal de la Doba Hill, near the town of Isona i
        Conca Dellà, Lleida Province, eastern Tremp Syncline, northeastern
        Spain. This locality corresponds to the upper Maastrichtian (C29r chron)
        strata of the Talarn Formation." Also names the rank history:
        "Stratigraphically, Sant Romà d'Abella corresponds to the Talarn
        Formation of the Tremp Group, a redefinition by Cuevas (1992) of the
        "Tremp Formation" of Mey et al. (1968)". Restricts the species to this
        one formation -- "P. isonensis is restricted to the upper Maastrichtian
        Talarn Formation" -- dropping the Serrat del Rostiar 1 referral that put
        earlier accounts in the Conques as well.
    - id: fondevilla2019a
      notes: >
        The chronostratigraphic synthesis the C29r calibration rests on, and the
        source of the informal crosswalk: "the La Posa Fm represents the "Grey
        Garumnian"; the Conques and Talarn formations are equivalent to the
        "Lower Red Garumnian"". Because the pair share one informal unit, an
        attribution to the "Lower Red Garumnian" alone does not resolve to
        either -- that needs the chron.
    - id: sellés2021a
      notes: >
        Eastern Tremp Syncline; the unit carrying the latest-Maastrichtian
        dinosaur sites, including the Pararhabdodon type locality. "the Sant
        Romà d'Abella site falls within the upper part of the fluvial Talarn
        Formation of the Tremp Group", and "the Sant Romà d'Abella site falls
        within the C29r magnetochron (latest Maastrichtian), thus placing the
        site within the final 200 ka before the K-Pg boundary".
    - id: prieto-márquez2022a
      notes: >
        Same unit and chron at a second locality: "Masia de Ramón falls within
        the upper part of the fluvial Talarn Formation of the Tremp Group and
        isotopic, magnetostratigraphic, and biochronological calibrations
        indicate that the locality correlates with the middle part of the C29r
        magnetochron (latest Maastrichtian)".
    - id: prieto-márquez2013a
      notes: >
        Predates the formation-rank usage and maps the unit onto the informal
        scheme instead, which is why the unit STRADDLES the K/Pg and why an
        informal attribution alone does not resolve to it: the "'lower red unit'
        (or 'lower red Garumnian', corresponding to the Conques Formation and
        the Cretaceous portion of the Talarn Formation in Cuevas [20])", and the
        "'upper red unit' (or 'upper red Garumnian', corresponding to the
        Paleogene portion of the Talarn Formation, the Esplugafreda Formation,
        and the Claret Formation in Cuevas [20])". Places the Pararhabdodon type
        locality by the coarse scheme only, "The Sant Romà d'Abella locality
        occurs in the upper section of the 'lower red unit' of the Tremp
        Formation".

Tangbian:
  rank: formation
  parent: Guifeng
  references:
    - id: yao2026a
      notes: >
        Jiangxi, the middle formation of "the upper Guifeng Group consisting of
        the Hekou, Tangbian and Lianhe formations in ascending order", and with
        the Hekou one of the two that have produced vertebrates.

Tarrant:
  rank: member
  parent: Lewisville
  stages: [Cenomanian]
  references:
    - id: tykoski2023a
      notes: >
        North Texas. A member of the Lewisville Formation, with the Arlington,
        in the Woodbine stratigraphy of Denne and others (2016).
    - id: head1998a
      notes: >
        The classification current before that revision, in which it is "the
        Tarrant Member of the Eagleford Group", capping the Arlington Member of
        the Woodbine Formation. Dated to the Conlinoceras tarrantense ammonite
        zone, at the base of the middle Cenomanian.

Tolman:
  rank: member
  parent: "Horseshoe Canyon"
  stages: [Maastrichtian]
  references:
    - id: eberth2012a
      notes: >
        The fifth of the formation's seven members, from the bentonite-rich
        mudstone marking the maximum flooding surface of the Drumheller Marine
        Tongue up to the return of organic-rich shales and paleochannel
        sandstones at the base of the Carbon. Modified from Hamblin's (2004)
        Tolman tongue. Spans most of 31r and the lower half of 31n, about
        70.4-68.4 Ma.
    - id: arbour2013a
      notes: >
        Applies the member scheme in the field, with the Morrin and Carbon, on
        the Red Deer River.

Tugrugyin:
  rank: member
  parent: Djadokhta
  references:
    - id: dashzeveg2005a
      notes: >
        The upper of the formation's two members, "composed of pale orange to
        light gray sands", with its key section at Tugrugyin Shireh. "The
        Tugrugyin Member overlies the Bayn Dzak Member, making it somewhat
        younger."

"Tunbridge Wells Sand":
  rank: formation
  parent: Hastings
  stages: [Valanginian]
  variants: ["Tunbridge Wells Sandstone"]
  references:
    - id: norman2010a
      notes: >
        The Weald. "the Tunbridge Wells Sand Formation (which represents the
        uppermost part of the Hastings Sub-Group)", above the Wadhurst Clay; the
        same paragraph also prints Tunbridge Wells Sandstone Formation for it.
        With the Wadhurst Clay it corresponds "to the entire Valanginian stage
        (141-137 Ma) in more recent correlation tables".
    - id: carrano2012a
      notes: >
        "the Tunbridge Wells Sand Formation (Valanginian) of Cuckfield, Sussex".

Uberaba:
  rank: formation
  parent: Bauru
  references:
    - id: fernandes2000a
      notes: >
        Bauru Basin. Retained "as defined by Hasui (1968)" unchanged by this
        revision. Its lower contact "corresponds to an unconformity with basalts
        of the Serra Geral Formation, associated with a basal breccia", and it
        is overlain by the Serra da Galga Member of the Marília Formation.

"Vale do Rio do Peixe":
  rank: formation
  parent: Bauru
  references:
    - id: fernandes2000a
      notes: >
        Bauru Basin, and the unit that carries this revision's main change: it
        "corresponds to much of the former Adamantina Formation defined by
        Soares et al. (1980)". The unit of greatest areal extent in the eastern
        part of the basin, resting directly on the Serra Geral basalts, passing
        west and southwest into the Santo Anastácio, surrounding the Araçatuba,
        and passing at its top into the Echaporã Member with diastemic contacts
        against the Presidente Prudente and São José do Rio Preto.

"Wadhurst Clay":
  rank: formation
  parent: Hastings
  stages: [Valanginian]
  references:
    - id: norman2010a
      notes: >
        The Weald. "Underlying the Tunbridge Wells Sandstone Formation is the
        Wadhurst Clay Formation", both within the "Hastings Sub-Group", and the
        two together correspond to the whole of the Valanginian.
    - id: norman2013a
      notes: >
        Uses group rank for the parent instead, and dates the dinosaur-bearing
        material middle Valanginian, about 137-138 Ma, including the Barilium
        dawsoni holotype from Shornden quarry.

Weymouth:
  rank: member
  parent: "Oxford Clay"
  stages: [Oxfordian]
  references:
    - id: naish2007a
      notes: >
        The uppermost of the formation's three members and the only Oxfordian
        one: Metriacanthosaurus parkeri comes "from the Weymouth Member
        (formerly Upper Oxford Clay) of Weymouth, Dorset".
    - id: carrano2012a
      notes: >
        Prints the older wording for the same horizon, "Weymouth Member, Upper
        Oxford Clay".

Whitemud:
  rank: member
  rank_contested: [member, formation]
  parent: "Horseshoe Canyon"
  stages: [Maastrichtian]
  references:
    - id: eberth2012a
      notes: >
        The uppermost of the formation's seven members, and the one whose rank
        depends on where you stand: in the Red Deer River valley "we include it
        here as the Whitemud Member of the HCFm", while "it also occurs in
        southeastern Alberta and southern Saskatchewan, where it is justifiably
        treated as a formation", the rank it was erected at by Irish and Havard
        (1968). Srivastava's (1968) earlier member proposal is rejected for
        lacking a description or measured section. Its base is the first white
        or light-colored fine sandstone above the Carbon, its top an
        unconformity below the Battle Formation; within the lower 30n
        magnetochron, about 67.5-67.0 Ma.
    - id: brown2011a
      notes: >
        Uses formation rank in the Saskatchewan sense, listing "the terrestrial
        Eastend, Whitemud, and Battle formations" below the Frenchman.

Xingezhuang:
  rank: formation
  parent: Wangshi
  references:
    - id: zhang2019a
      notes: >
        Named as one of the group's four formations, "the Late Cretaceous
        Wangshi Group, which comprises the Xingezhuang, Jiangjunding,
        Jingangkou, and Changwangpu formations", with no order stated.

"Zhangjia'ao":
  rank: member
  parent: Lufeng
  variants: [Zhangjiaao, Zhangjiawa, "Dark Red Beds", "Deep Red Beds"]
  references:
    - id: xing2012b
      notes: >
        Apostrophe form. Zhang (2018) prints Zhangjiaao for the same member.
    - id: irmis2008a
      notes: >
        Uses the Zhangjiawa spelling and ties it to the older bed name, "the
        'deep red beds' (= Zhangjiawa Member of Fang et al. 2000)", which is the
        same unit the apostrophe form denotes.

"Poison Strip":
  rank: member
  parent: Cedar Mountain
  variants: ["Poison Strip Sandstone"]
  references:
    - id: tidwell2001a
      notes: >
        Erected as the Poison Strip Sandstone, and the same paper's horizon line
        prints "Poison Strip Member" for the same unit. Recorded without the
        lithologic term so one string names the member.

"Râul Mare Beds":
  rank: informal
  parent: Sânpetru
  references:
    - id: díaz2025a
      notes: >
        "a not yet formally defined lithostratigraphical unit that either
        represents the uppermost part of the Sînpetru Formation ... or is a
        distinct unit". Also the name of the river beside the outcrop.

"Red Beds of Hermiin Tsav":
  rank: none
  kind: locality
  references:
    - id: funston2018a
      notes: >
        An informal name for the Baruungoyot type locality, not a rival
        formation: the paper writes "Baruungoyot Formation, Hermiin Tsav".

"Río Limay":
  rank: subgroup
  parent: Neuquén
  contains: [Candeleros, Huincul]
  references:
    - id: carballido2010a

Shaximiao:
  rank: formation
  stages: [Bajocian, Bathonian, Callovian, Oxfordian, Kimmeridgian, Tithonian]
  references:
    - id: dai2022a
      notes: >
        The lower part "was inferred as Bathonian to Callovian age
        traditionally", and a zircon U-Pb maximum depositional age of
        166.0 +/- 1.5 Ma places it in the late Middle Jurassic. The paper notes
        that the formation's precise age remains contested.
    - id: moore2023a
      notes: >
        The younger bound, for the upper part: Daanosaurus comes from "the
        Upper Jurassic (?Kimmeridgian-Tithonian) upper beds of the Shaximiao
        Formation". The formation therefore spans the Middle Jurassic to the
        latest Jurassic, which is why a record on the bare formation name
        resolves to little.
    - id: maidment2008a
      notes: >
        "Upper Shaximiao Formation (Late Jurassic)" for the upper part, against
        the Middle Jurassic of the lower. Xiashaximiao and Shangshaximiao are
        the lower and upper parts respectively, xia and shang being Chinese for
        lower and upper, so those names denote subunits rather than spellings of
        the whole.

Shishugou:
  rank: formation
  stages: [Bathonian, Callovian, Oxfordian]
  variants: [Wucaiwan]
  references:
    - id: carrano2012a
      notes: >
        The older bound, and the synonymy at the formation's base: "lower
        Shishugou (= Wucaiwan) Formation; middle Bathonian-late Callovian,
        Middle Jurassic". Material formerly assigned to a separate Wucaiwan
        Formation belongs to the lower part of this unit.
    - id: choiniere2010a
      notes: >
        The younger bound: gives the upper part of the formation as Oxfordian on
        a radiometric date, placing its holotype in informal "lower orange
        mudstone beds in the upper part" of the unit.

Sânpetru:
  rank: formation
  variants: [Sînpetru]
  references:
    - id: weishampel2003a
      notes: >
        Canonical spelling chosen here. This paper flags the change in its own
        geology section: "in this post-Ceausescu era, some spellings in the
        Romanian language have changed, among them Sînpetru to Sânpetru". All
        four reference works print â. The î form is kept as a variant because it
        survives in later literature, including Augustin (2022).

Santana:
  rank: group
  contains: [Barbalha, Crato, Ipubi, Romualdo]
  references:
    - id: arai2020a
      notes: >
        Araripe Basin. Gives the nomenclatural history: formalized as the Santana
        Formation by Beurlen (1963) and subdivided by Beurlen (1971) into the
        Crato, Ipubi and Romualdo members, the Barbalha being introduced later;
        Assine et al. (2014) and Neumann and Assine (2015) then raised these to
        formational status as the Santana Group, "in ascending order ... the
        Barbalha, Crato, Ipubi and Romualdo formations". That nomenclature is the
        one used here. Concludes on palynology that "the entire Santana Group is
        of Aptian age because of the conspicuous presence of Sergipea
        variverrucata and the absence of indisputably Albian forms".
    - id: delcourt2025a
      notes: >
        Names the Crato, Ipubi and Romualdo each as formations, and works
        throughout in the Romualdo Formation rather than the older member
        wording.

Sasayama:
  rank: group
  contains: [Ohyamashimo, Sawada]
  references:
    - id: tanaka2024a
      notes: >
        "The Sasayama Group, comprising the Ohyamashimo and Sawada formations in
        ascending order".

"Toundoute Continental Series":
  rank: informal
  references:
    - id: montenat2005a
      notes: >
        Berberosaurus, Tazoudasaurus. Erects no formation, dividing the
        succession into eight explicitly informal units A-H. The lower bone-bed
        is term F, the upper term G.

"Two Medicine":
  rank: formation
  stages: [Campanian]
  references:
    - id: varricchio2025a
      notes: >
        "the Campanian Two Medicine Formation of Montana", which the same paper
        correlates largely with the Dinosaur Park Formation of Alberta. No
        source places the unit in the Santonian or the Maastrichtian.
    - id: horner1988a
      notes: >
        States the position within the formation as well as the age: "Upper Two
        Medicine Formation, Upper Cretaceous (? Late Campanian)".

Tremp:
  rank: group
  rank_contested: [group, formation]
  contains: ["La Posa", Conques, Talarn]
  stages: [Maastrichtian, Danian]
  references:
    - id: fondevilla2019a
      notes: >
        States the rank change and its authors: "For the Tremp Syncline, Cuevas
        (1992) and Pujalte and Schmitz (2006) redefined the Tremp Fm as Tremp
        Group, and divided it into different formations that are more or less
        equivalent to the informal "Garumnian" units of Rosell et al. (2001)."
        And, in the same paragraph, why both ranks are still in print: "Despite
        these formal lithostratigraphic divisions, the terms 'Garumnian',
        'Garumnian facies' and Tremp Fm were widely used by researchers until
        recently".
    - id: prieto-márquez2019a
      notes: >
        Group rank with the Cuevas (1992) formations inside it, the prevailing
        usage in the eastern Tremp Syncline: Costa de les Solanes "lies in the
        lower Maastrichtian Conques Formation (Tremp Group; Cuevas, 1992),
        included in the 'Lower Red Garumnian' facies (the "Tremp Formation" of
        authors; Rosell et al., 2001; Riera et al., 2009; Fondevilla et al.,
        2016)" -- i.e. names the formation-rank usage as the older convention
        for the same rocks.
    - id: sellés2021a
      notes: >
        Group rank, "the upper part of the fluvial Talarn Formation of the Tremp
        Group".
    - id: vila2022a
      notes: >
        Group rank, "Lower portion of the Tremp Group, basalmost strata of the
        Conques Formation".
    - id: prieto-márquez2013a
      notes: >
        Formation rank, explicitly chosen over the group scheme and with the
        subdivisions left informal: "Here, we follow the division scheme by
        [22], where the Tremp Formation (equivalent to the 'Garumnian' in
        Leymerie [23] and the Tremp Group in Cuevas [20] is composed of four
        informal units." Same rocks at a coarser resolution, not a rival
        correlation -- an older Tremp Formation attribution does not conflict
        with a newer Conques or Talarn one and must not be recorded as a
        dispute.
    - id: prieto-márquez2021a
      notes: >
        Formation rank, "the lower and middle part of the Tremp Formation" with
        no formal member names published.
    - id: csiki-sava2015a
      notes: >
        Formation rank, recognizing informal intervals rather than named members
        -- a "lower Tremp Formation" interval near Aren and an informal "lower
        red unit" at Sant Roma d'Abella. Laterally related to and diachronous
        with the Aren Sandstone.
    - id: peredasuberbiola2009a
      notes: >
        Formation rank in the WESTERN (Aragonese) Tremp Syncline, where the
        group's internal formations are not applied: the Arenysaurus type
        horizon is "Blasi 3 site in Aren (Huesca, Spain); lower part of the
        Tremp Formation". Coarse is correct there -- see the Talarn entry.
    - id: prieto-márquez2006b
      notes: >
        The informal three-part scheme the older literature uses, and the source
        of the group's Paleogene top: "The Garumnian red-beds are divided into
        three sections: the Grey Garumnian, followed by a Lower Red Garumnian,
        both of Maastrichtian age, and an Upper Red Garumnian of Danian age
        (Tertiary) (Rosell et al., 2001)." Places the Pararhabdodon sites in the
        Lower Red Garumnian without naming a formation.

Tugulu:
  rank: group
  contains: [Qingshuihe, Hutubihe, Shengjinkou, Lianmuqin]
  references:
    - id: zheng2023a
      notes: >
        The group "consists (in ascending order) of the Qingshuihe, Hutubihe,
        Shengjinkou, and Lianmuqin Formations", so the Lianmuqin is its
        uppermost formation. The Qingshuihe Formation does not occur in the
        northwestern Junggar Basin.

Udurchukan:
  rank: formation

Ukureyskaya:
  rank: formation
  variants: [Ukurey]

"Villar del Arzobispo":
  rank: formation
  stages: [Kimmeridgian, Tithonian]
  references:
    - id: barco2005a
      notes: >
        No named members: positions here are stated as parts of the formation,
        as in "Cuesta Lonsal-1 is situated in the lower part of the Villar del
        Arzobispo Formation".
    - id: sánchez-fenollosa2023a
      notes: >
        The Barrihonda-El Humero site "is located in the Riodeva Facies
        Association", which is a facies association rather than a
        lithostratigraphic unit and so is not a member. Overlies the Higueruelas
        Formation and is unconformably overlain by Lower Cretaceous units.

"Vulcanodon Beds":
  rank: none
  kind: informal
  references:
    - id: viglietti2018a
      notes: >
        Superseded. The type locality is reassessed: "Vulcanodon was found in
        the uppermost Forest Sandstone, and not within interbedded sandstones of
        the Batoka Basalt Formation contrary to the descriptions of Bond et al.
        (1970) and Raath (1972)".

Wales:
  rank: none
  kind: country
  references:
    - id: jones2026c
      notes: >
        Reached the formation comparison from a reference work's locality
        column. A reminder that those columns are not stratigraphy.

Wangshi:
  rank: group
  contains: [Xingezhuang, Jiangjunding, Jingangkou, Changwangpu]
  references:
    - id: zhang2019a
      notes: >
        Gives the group's constituent formations: "the Late Cretaceous Wangshi
        Group, which comprises the Xingezhuang, Jiangjunding, Jingangkou, and
        Changwangpu formations", with no order stated. Also records that Yan and
        Chen (2005) obtained an isotope age of 73 Ma "for the Jingangkou
        Formation (which they called the Hongtuya Formation)", so the two names
        have been applied to one unit.
    - id: an2015a
      notes: >
        Zhucheng. Works in "the lower Hongtuya Formation of the Wangshi Group",
        dating its dinosaur bone beds between 77.3 and 73.5 Ma and putting the
        formation's upper boundary at 73 Ma.
    - id: buffetaut1995a
      notes: >
        Micropachycephalosaurus. "dinosaur remains occur at several distinct
        levels in the Wangshi Group", and the group's competing subdivision
        schemes disagree about which subunit the dinosaur beds sit in, so a
        formation-rank value for an unfigured 1978 locality is not supportable.

Wessex:
  rank: formation
  stages: [Barremian]
  references:
    - id: pond2023a
      notes: >
        Places the Barremian-Aptian boundary in the overlying Vectis Formation,
        so the Wessex does not reach the Aptian, and dates the base of the
        exposed succession on the Isle of Wight as earliest Barremian.
    - id: averianov2021b
      notes: >
        Gives the unit as "the Lower Cretaceous (Barremian) Wessex Formation of
        the Isle of Wight, United Kingdom".

Woodbine:
  rank: group
  contains: [Lewisville]
  references:
    - id: tykoski2023a
      notes: >
        Raised to group by Denne and others (2016); the Lewisville is its upper
        formation, with Arlington and Tarrant as members inside it.

Wulansuhai:
  rank: formation
  references:
    - id: xu2011c
      notes: >
        Bayan Mandahu is the locality rather than the formation, and the usual
        phrasing keeps them apart -- "the Upper Cretaceous Wulansuhai Formation
        of Bayan Mandahu, Inner Mongolia".

Xiagou:
  rank: formation

"Yellow Cat":
  rank: member
  parent: Cedar Mountain
  stages: [Berriasian, Valanginian, Hauterivian, Barremian, Aptian]
  references:
    - id: royo-torres2017b
      notes: >
        "All of these data suggest a potential age of late Berriasian-early
        Aptian" for the member. Wide, and genuinely so -- the paper reports a
        conflict between detrital zircon maxima and the ostracod and charophyte
        evidence.

Dakangpu:
  rank: member
  parent: Yixian
  references:
    - id: wu2012a
      notes: >
        "Dakangpu Member (equivalent to the Dawangzhangzi Beds) of the middle
        part of Yixian Formation". The Dawangzhangzi name is reported as an
        equivalent horizon rather than the same named unit, so it is not carried
        here as a variant.

Yixian:
  rank: formation
  parent: Jehol
  stages: [Hauterivian, Barremian, Aptian]
  references:
    - id: zhou2006b
      notes: >
        The older bound, from the base of the formation: the Lujiatun beds are
        "the lowest part of the Yixian Formation (Hauterivian, Early
        Cretaceous)", their age put at "Hauterivian (132.0-127.0 Ma)".
    - id: wu2012a
      notes: >
        The younger bound, from the middle of the formation: the "Dakangpu
        Member (equivalent to the Dawangzhangzi Beds) of the middle part of
        Yixian Formation, Late Barremian-Early Aptian". The envelope spans both
        readings.

Yezo:
  rank: group
  references:
    - id: suzuki2004a
      notes: >
        Nipponosaurus. "Upper Ammonites Bed; now Upper Yezo Group". No
        formation-rank unit is recoverable: the Kawakami colliery has been
        inaccessible since 1945 and the excavation field notes are lost.

Yuliangzi:
  rank: formation
  variants: [Yuliangze]

Zhonggou:
  rank: formation
  parent: Xinminpu
  stages: [Albian]
  references:
    - id: you2014a
      notes: >
        Gansu. The upper of the group's two formations -- "the lower Xiagou and
        the upper Zhonggou formations" -- separated from the Xiagou by andesites
        dated at 113.7 Ma in the Hanxia Section, and "most likely of Albian
        age". Field work in 2010 and 2011 refined the Mazongshan dinosaur
        localities from the group to this formation specifically.
    - id: zheng2023a
      notes: >
        Corroborates the Albian reading from the angiosperm pollen of the
        Jiuquan Basin.
    - id: tanaka2024a
      notes: >
        Gives Archaeoceratops oshimai as lower Albian in this formation.

Zhoutian:
  rank: formation
  parent: Ganzhou
  references:
    - id: yao2026a
      notes: >
        Jiangxi, the upper formation of the group and the one that has produced
        most of its vertebrates. It "developed a terrestrial facies lake basin
        ... composed of finegrained siltstones and mudstones, interbedded with
        several gypsum layers" and rests conformably on the Maodian. No absolute
        age is available for it.

Ziliujing:
  rank: formation
  variants: [Zilujing]

Xinminpu:
  rank: group
  contains: [Xiagou, Zhonggou]
  variants: [Xinminbao]
  references:
    - id: you2014a
      notes: >
        "The Xinminpu Group includes two formations: the lower Xiagou and the
        upper Zhonggou formations", and elsewhere writes the pair as "the
        Xinminpu (= Xinminbao) Group", which is why both spellings reached the
        records.
