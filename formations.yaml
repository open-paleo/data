# Formation registry: canonical unit name -> rank, containment, spellings and
# the papers each of those rests on.
#
# WHY THIS EXISTS. `location.formation` is free text, and nothing in a unit's
# name records its rank: "Morrison" is a formation and "Kem Kem" is a group,
# spelled the same way in the same field. Without a table there is no way to
# check that the field holds a formation, and no way to record that two
# spellings mean one thing.
#
# RULE OF ENTRY. Every entry carries the paper each claim was read from. This
# file is CURATED, NEVER MINED: a rank or an age inferred from phrasing is a
# guess, and text mining reliably folds leading qualifiers into unit names
# ("Middle Jurassic Lower" as a child of Shaximiao) and ignores basin scoping.
# Add a line when a primary states the rank, and not otherwise.
#
# HOMONYMS ARE KEYED BY COUNTRY. Unit names are reused across basins: the Hekou
# Group of the Lanzhou-Minhe Basin in Gansu and the Hekou Formation of Jiangxi's
# Guifeng Group are different units of different ages. A name-keyed registry
# would merge them. Same trap as the institution-code collisions.
#
# FIELDS
#   rank         group | subgroup | formation | member | bed | informal | none
#   kind         what the string actually is, when `rank: none`
#   parent       the unit that contains this one, where a source states it
#   contains     units inside this one, where a source states them
#   variants     spellings seen in the literature for the same unit; a variant
#                NOT listed here is new and does need review
#   rank_contested  ranks the literature genuinely disagrees on -- kept visible
#                rather than settled by majority
#   stages       the unit's published age, oldest stage first. An ENVELOPE for
#                checking records, never a source to derive them from: a taxon
#                is often dated more finely than its unit (a metre above a
#                contact, a dated ash), and filling records from here would
#                flatten exactly that. Recorded as STAGES, never as Ma --
#                a stage range tracks the chart in schema.yml automatically,
#                whereas a stated Ma value derives from nothing and so falls
#                out of step whenever the chart is revised. Where sources
#                disagree, this is the UNION of what they publish rather than a
#                choice between them: it is a bound, not a verdict. Which source
#                gives which range goes in the reference notes.
#   references   [{id, notes}] -- `id` resolves to a references/ store entry,
#                the same pointer shape genus and clade files use
#
# WHERE A COARSE VALUE IS CORRECT, say so in the notes rather than in a field.
# A group that is the finest unit anyone has published belongs in
# `location.group`, which needs no defending; an informally named unit carries
# `rank: informal`. Neither needs a flag, and a flag with no consumer rots.
#
# CANONICAL SPELLINGS. Where the literature is split, the choice and its reason
# are recorded on the entry. Sânpetru over Sînpetru is the worked example: the
# 1993 Romanian orthographic reform replaced î with â in this position,
# Weishampel (2003) flags it in its own geology section, and all four reference
# works print â.
#
# DELIBERATELY EXCLUDED: Shaximiao vs Xiashaximiao / Shangshaximiao. Xia and
# shang are Chinese for lower and upper, so those name a subunit rather than a
# spelling of the same unit -- a substantive difference that must stay in the
# active findings. Watch for the same trap in other Chinese formation names.

Allen:
  rank: formation
  stages: [Campanian, Maastrichtian]
  parent: Malargüe
  references:
    - id: salgado1996a
      notes: >
        The subdivision is positional, not named: "Lower member of the Allen
        Formation, Malargue Group" in the horizon line and "Lower Member" in the
        running text of the same paper. There is no upper counterpart with a
        name either: the divisions are positional rather than named.
    - id: martinelli2004a
      notes: >
        Places the formation in the Malargue Group. The same site is called the
        Neuquen Group by Rozadilla (2021) and Aranciaga Rolando (2021).

Bahariya:
  rank: formation
  variants: ["Baharija Fm."]

Baharîje:
  rank: formation
  variants: ["Baharija Fm.", "Baharija Formation"]

Baruungoyot:
  rank: formation
  stages: [Campanian]
  variants: ["Barun Goyot Fm."]

Bauru:
  rank: group
  contains: [Adamantina, Marília]
  references:
    - id: delcourt2017a
      notes: >
        Paraná Basin. The Mato Grosso outcrops formerly assigned here belong to
        the Parecis Group instead.

Bayangobi:
  rank: formation
  variants: ["Bayan Gobi Fm.", "Bayingobi Fm."]

Baynshire:
  rank: formation
  stages: [Cenomanian, Turonian, Coniacian, Santonian]
  variants: ["Bayan Shireh Fm.", "Bayanshiree Svita"]

Bevons:
  rank: none
  kind: locality
  references:
    - id: accarie1995a
      notes: >
        A commune near Sisteron. The erecting paper gives a lithological
        description rather than a formal unit, which is why the reference works
        fell back on the place name; the rocks are the Marnes Bleues.

"Calcaires de Caen":
  rank: formation
  variants: ["Calcaire de Caen", "Calcaire du Caen"]

"Cambridge Greensand":
  rank: formation
  variants: ["Cambridge Green Sand"]

"Cañadón Asfalto":
  rank: formation
  stages: [Toarcian, Aalenian, Bajocian]
  references:
    - id: cúneo2013a
      notes: >
        A two-member scheme exists but is not settled and is not used for these
        dinosaurs: "Some workers have subdivided the formation into a lower
        lacustrine/tuffaceous (Las Chacritas) member and an upper siliciclastic
        fluvial (Puesto Almada) member". The members are Cabaleri (2010),
        published as a symposium abstract, and no subsequent description places
        a taxon in either member.
    - id: rauhut2005b
      notes: >
        Why the member names cannot be inferred from a locality: this paper puts
        Condorraptor at the "Las Chacritas locality, 2.3 km west of Cerro
        Condor", a canyon, and names no member. Las Chacritas and Puesto Almada
        are each simultaneously a place and a member named after it, and Puesto
        Almada as a place lies in the Canadon Calcareo outcrop -- a different
        formation from the one whose member carries the name.
    - id: pol2020a
      notes: >
        Positional rather than named: Bagualia comes from the "Lower levels of
        the Canadon Asfalto Formation dated at 179.17 +/- 0.12 Ma".

"Cedar Mountain":
  rank: formation
  contains: [Buckhorn Conglomerate, Yellow Cat, Poison Strip, Ruby Ranch, Mussentuchit]
  references:
    - id: tidwell2001a
      notes: >
        "The basal member of the Cedar Mountain Formation is the Buckhorn
        Conglomerate (Kirkland et al. 1997). Four additional members established
        and named by Kirkland et al. (1997) are: the Yellow Cat Member, Poison
        Strip Sandstone, Ruby Ranch Member, and the Mussentuchit Member."
    - id: carpenter1999a
      notes: >
        The same five-member scheme, and why the member rather than the
        formation is the operative unit: the ankylosaurs are stratigraphically
        restricted, Gastonia to the Yellow Cat and Animantarx to the
        Mussentuchit.

"Cerro Carnerero":
  rank: formation
  variants: ["Cerro Carnereo Fm."]

"Chipping Norton Limestone":
  rank: formation
  variants: ["Chipping Norton Ls."]

"Cuckfield Stone":
  rank: member
  parent: Grinstead Clay
  references:
    - id: norman2013a

"Dinosaur Park":
  rank: formation
  parent: Belly River
  stages: [Campanian]
  references:
    - id: arbour2013a
      notes: >
        "Dinosaur Park Formation (upper Campanian)". The literature is
        consistent on this: no source extends the unit into the Santonian or the
        Maastrichtian.

Djadokhta:
  rank: formation
  stages: [Campanian]
  contains: ["Bayn Dzak", Tugrugyin]
  references:
    - id: dashzeveg2005a
      notes: >
        Erects both members on lithology and maps them at their type localities:
        the Bayn Dzak Member at Bayn Dzak (the Flaming Cliffs) and the Tugrugyin
        Member at Tugrugyin Shireh, the second superposed on the first. The
        subdivision is scoped to the southern Ulan Nur Basin, so it does not
        reach the Nemegt Basin exposures at Ukhaa Tolgod.
    - id: arbour2015a
      notes: >
        Applies the subdivision to a holotype, and equates the locality names:
        "Bayan Zag (= Bayn Dzak, Shabarakh Usu, the Flaming Cliffs); Bayn Dzak
        Member, Djadokhta Formation".

Dockum:
  rank: group
  references:
    - id: nesbitt2015a
      notes: >
        Lepidus. The erecting paper withheld a formation name deliberately;
        this is the uncontested fallback if Cooper Canyon is judged too
        contested.

"El Mers":
  rank: group
  contains: ["El Mers I", "El Mers II", "El Mers III"]
  references:
    - id: maidment2020a

Elliot:
  rank: formation
  stages: [Norian, Rhaetian, Hettangian, Sinemurian, Pliensbachian]
  references:
    - id: andrzejewski2019a
      notes: >
        The formation straddles the Triassic-Jurassic boundary and its two
        informal parts carry the split: "lower Elliot Formation (Late Triassic)"
        against "upper Elliot Formation (Early Jurassic)". A wide span across
        this formation is therefore expected rather than anomalous.
    - id: yates2011a
      notes: >
        The younger bound, hedged at source: "Upper Elliot Formation, Early
        Jurassic, possibly Pliensbachian". No source carries it into the
        Toarcian.

Fuvelian:
  rank: none
  kind: local chronostratigraphic stage
  references:
    - id: csiki-sava2015a
      notes: >
        One of the four Provence local stages (Valdonnian, Fuvelian, Begudian,
        Rognacian) erected by Matheron (1864) -- a time term, not a rock unit.
    - id: tortosa2014a
      notes: >
        Shows the distinction inside one paper: gives Arcovenator a formation
        AND a local stage side by side, while placing Tarascosaurus in "the
        Fuvelian local stage" with no formation.

Ganzhou:
  rank: group
  contains: [Maodian, Zhoutian]
  references:
    - id: yao2026a
      notes: Underlies the Guifeng Group.

"Gara Sbaa":
  rank: formation
  stages: [Cenomanian]
  parent: Kem Kem
  variants: ["Ifezouane Formation", "Ifezouane Fm."]
  references:
    - id: ibrahim2020a
      notes: >
        Erects the unit as the lower formation of the Kem Kem Group. Ifezouane
        is the same rock under the earlier scheme of Cavin et al.; the two names
        compete, and the later literature has largely followed Ibrahim.

Gosau:
  rank: group
  references:
    - id: csiki-sava2015a
      notes: The Grünbach Formation sits in the Lower Gosau Subgroup.
    - id: bunzel1870a
      notes: >
        Its "Gosau formation" is pre-modern usage, from before the Gosau was
        raised to group rank.

"Grinstead Clay":
  rank: formation
  rank_contested: [member, formation]
  references:
    - id: norman2013a
      notes: Treats it as a formation; so do Naish (2008) and Raven (2020).
    - id: norman2010a
      notes: >
        Treats it as a Member of the Tunbridge Wells Sand Formation. Recorded
        at formation rank with the disagreement kept visible rather than
        settled by majority.

Guifeng:
  rank: group
  contains: [Hekou, Tangbian, Lianhe]
  references:
    - id: yao2026a
      notes: Jiangxi. Its Hekou Formation is NOT the Gansu Hekou Group.

Hastings:
  rank: group
  contains: ["Wadhurst Clay", "Tunbridge Wells Sand"]
  variants: ["Hastings Beds", "Hastings Beds Group"]
  references:
    - id: carrano2012a
      notes: Also treated as a sub-group of the Wealden.

"Hekou (CN-GS)":
  rank: group
  references:
    - id: yao2026a
      notes: >
        Lanzhou-Minhe Basin, Lower Cretaceous. NOT the Hekou Formation of the
        Guifeng Group in Jiangxi -- different unit, different age.
    - id: you2006a
      notes: >
        Daxiatitan, Huanghetitan liujiaxiaensis, Lanzhousaurus, Yongjinglong.
        No work subdivides the Hekou Group into named formations in this basin.

Houcheng:
  rank: formation
  references:
    - id: zhao2006a
      notes: >
        Laterally equivalent to the Tuchengzi Formation and not a spelling of
        it: Houcheng is the Hebei name, Tuchengzi the Liaoning one. Which
        applies follows the province the locality sits in.

"Iren Dabasu":
  rank: formation
  variants: ["Erlian Formation", "Iren Dabasu Fm.", "Iren Nor Formation",
    "Iren Debasu Formation", "Elian Formation"]
  references:
    - id: xu2006c
      notes: >
        Erlian is the Chinese name for the same unit, and these two papers show
        it directly: this one puts Sonidosaurus at "Saihangaobi, Sonid Zuoqi,
        Nei Mongol (15 km southwest of Erenhot); Elian Formation".
    - id: xu2007b
      notes: >
        The same locality under the other name -- Gigantoraptor from
        "Saihangaobi, Sunitezuoqi, Nei Mongol Autonomous Region. Iren Dabasu
        Formation". Both names must be searched: the Erlian literature, which
        is where the basin's subdivision is discussed, does not surface under
        Iren Dabasu.

"Kuangyuan Series":
  rank: informal
  references:
    - id: young1942a
      notes: >
        The historical unit for the Guangyuan (Kuangyuan) vertebrate localities
        in Sichuan, and the horizon the taxa from them were erected on: the
        Chienkosaurus teeth came "all from the rich shell-bearing layer at the
        top of the Kuangyuan Series". Which modern formation that layer belongs
        to is unsettled — Penglaizhen and Suining have both been proposed — so
        records from these localities hold the historical unit rather than a
        choice between them. Rank word kept: it is part of the name.

"Horseshoe Canyon":
  rank: formation
  contains: [Horsethief, Morrin, Tolman, Carbon, Strathmore]
  stages: [Campanian, Maastrichtian]
  references:
    - id: carr2017a
      notes: >
        "Horseshoe Canyon Formation (Campanian-Maastrichtian, Late Cretaceous)".
        Maastrichtian alone is the commoner phrasing here, but the Campanian end
        is published and the unit's base is late Campanian, so the envelope
        carries both.
    - id: brusatte2012b
      notes: >
        Uses the five members, which are well established in the literature:
        Horsethief, Morrin, Tolman, Carbon and Strathmore, in ascending
        order.

Huincul:
  rank: formation
  parent: "Río Limay"
  stages: [Cenomanian, Turonian, Coniacian]
  references:
    - id: baiano2020a
      notes: >
        "Huincul Formation (Cenomanian-Turonian; Upper Cretaceous)", the
        prevailing modern reading.
    - id: gallina2005a
      notes: >
        The Coniacian end, on a minority reading -- "'La Buitrera', Huincul
        Formation (Turonian-Coniacian)". Later work on the same locality
        generally prefers Cenomanian-Turonian.

Jehol:
  rank: group
  contains: [Yixian, Jiufotang]
  references:
    - id: yao2019a
      notes: >
        Lingyuanosaurus, Zhongjianosaurus -- both from the Sihedang locality on
        identical coordinates. Whether those exposures belong to the Yixian or
        the overlying Jiufotang is unsettled as of 2026, and this paper declines
        the question outright: "Resolving this stratigraphic issue is beyond the
        scope of the present paper." Group rank is the finest unit both readings
        share.

"Judith River":
  rank: formation
  stages: [Campanian]
  references:
    - id: arbour2017a
      notes: >
        "Judith River Formation (Campanian)", consistently through the
        literature. NAME COLLISION: the historic "Judith River Formation" of
        southern Alberta is a different unit from this Montana formation. The
        Alberta usage denotes what is now the Belly River Group, since split
        into the Foremost, Oldman and Dinosaur Park formations, and papers
        predating that revision use the old name for all three.

"Kalahari Deposits":
  rank: none
  kind: region name hardened into a unit
  references:
    - id: dewit1992a
      notes: >
        The only geological investigation of the Kangnas site uses the word
        "Formation" nowhere and "Kalahari" once, inside a cited reference title;
        it describes a crater-facies deposit above an olivine-melilitite
        intrusion.
    - id: rogers1915a
      notes: >
        The companion note to the erecting paper, and the only contemporary
        account of the well. Uses "Kalahari" purely as a region -- "the southern
        Kalahari", "the Kalahari region" -- and names no stratigraphic unit.
        Every later use of "Kalahari Deposits" traces to Cooper (1985).

"Kem Kem":
  rank: group
  contains: ["Gara Sbaa", Douira]
  references:
    - id: ibrahim2020a
      notes: >
        "recognized here as the Kem Kem Group, which is composed of the lower
        Gara Sbaa and upper Douira formations".
    - id: kellermann2025a
      notes: >
        Follows the Ibrahim scheme; the Carcharodontosaurus neotype is Douira.

Lianmuqin:
  rank: formation
  parent: Tugulu
  stages: [Barremian, Aptian]
  references:
    - id: xu2018c
      notes: >
        Dates the upper Tugulu Group, of which the Lianmuqin is the uppermost
        formation, Barremian-Aptian. The unit's age is contested: Rauhut and Xu
        (2005) give "?Valanginian-Albian" after Shen
        and Mateer (1992), and Sanchez-Fenollosa et al. (2025) late
        Valanginian-?Barremian.

Lufeng:
  rank: formation
  stages: [Hettangian, Sinemurian, Pliensbachian, Toarcian]
  contains: [Shawan, "Zhangjia'ao"]
  variants: ["Lower Lufeng Formation", "Lower Lufeng Series"]
  references:
    - id: xing2012b
      notes: >
        Ties the modern member names to the color terms the older literature
        uses, which is what makes those papers readable: the Zhangjia'ao Member
        "was originally recognized as the 'Deep Red Beds' of the Upper Member"
        and the Shawan Member "as the 'Dark Purple Beds' of the Lower Member".
        Its per-member faunal lists overlap, so they identify a taxon's
        occurrences and cannot fix a holotype's member on their own.
    - id: you2014b
      notes: >
        States the same equivalence from the other side, "Shawan Member of the
        Lufeng Formation (Fang et al. 2000). This is equivalent to the Dull
        Purplish Beds of the Lower Lufeng Formation".
    - id: sekiya2010a
      notes: >
        Records that replacing the upper/lower bed names with Shawan and
        Zhangjia'ao remains contested, so both vocabularies stay current in the
        literature.
    - id: zhang2024a
      notes: >
        Magnetostratigraphy gives "Early Jurassic (late Sinemurian-Toarcian)"
        against the Hettangian and Sinemurian of the bed-based dating. The
        envelope spans both.

"Magnesian Conglomerate":
  rank: none
  kind: superseded misassignment
  references:
    - id: galton2007a
      notes: >
        Asylosaurus, Thecodontosaurus. The erecting paper rejects it outright --
        the deposit is "a Triassic (Rheatian) dolomitized cave breccia or
        fissure fill (not in Magnesian/ Dolomitic Conglomerate) in Lower
        Carboniferous (Dinantian) marine limestone" -- and explains how the name
        entered circulation: "It was long equated with the Magnesian
        Conglomerate, which occurs very close by."

Marree:
  rank: subgroup
  contains: ["Bulldog Shale"]
  references:
    - id: barrett2010b
      notes: >
        "the Marree Subgroup, which was formerly called the Marree Formation".

Miaogou:
  rank: formation
  stages: [Aptian, Albian]
  references:
    - id: hao2025a
      notes: >
        "Miaogou Formation (Aptian-Albian)" for the Maortu locality, which is
        where the formation's dinosaur record comes from.

Mussentuchit:
  rank: member
  parent: Cedar Mountain
  stages: [Albian, Cenomanian]
  references:
    - id: avrahami2024a
      notes: >
        Radiometrically "99.674 +0.439/0.197 to 98.905 +0.158/0.183 Myr", a
        window inside the Cenomanian; Kirkland (1998) gives the member as
        "latest Albian-basal Cenomanian", so the envelope carries both.

Morrison:
  rank: formation
  stages: [Oxfordian, Kimmeridgian, Tithonian]
  references:
    - id: carrano2012a
      notes: >
        "Morrison Formation (Kimmeridgian-Tithonian)", the range most of the
        literature gives.
    - id: tschopp2015a
      notes: >
        The older bound, for material at the formation's base: Dystrophaeus
        viaemalae is listed as "Oxfordian; low in Morrison Form.". No source
        extends the formation into the Berriasian.

Nemegt:
  rank: formation
  stages: [Campanian, Maastrichtian]
  references:
    - id: tsuihiji2011a
      notes: >
        "Nemegt Formation (late Campanian-early Maastrichtian to Maastrichtian)".
        Maastrichtian alone is the commoner phrasing, but the Campanian end is
        published: Karczewska and Ziembinska-Tworzydlo (1983) argued the
        formation down to the early Campanian on charophyte evidence. No members
        have been erected for this formation.

Neuquén:
  rank: group
  contains: ["Río Limay"]
  references:
    - id: carballido2010a
      notes: Candeleros and Huincul are formations within the Río Limay Subgroup.

"Amoreira-Porto Novo":
  rank: member
  parent: Lourinhã
  references:
    - id: mateus2014a

Arlington:
  rank: member
  parent: Lewisville
  references:
    - id: head1998a

"Pant-y-ffynnon Quarry fissure fill":
  rank: none
  kind: fissure fill
  references:
    - id: spiekman2021a
      notes: >
        Karstic fills in Carboniferous Limestone. The South Wales and Bristol
        Channel fissure faunas have no formation name in any paper, so this
        string is the best available value rather than a defect.

Parecis:
  rank: group
  references:
    - id: delcourt2017a
      notes: >
        No formation has been published for the Fazenda Roncador locality, so
        group rank is the finest honest value there.

"Oxford Clay":
  rank: formation
  stages: [Callovian, Oxfordian]
  contains: [Peterborough, Stewartby, Weymouth]
  references:
    - id: ruiz-omeñaca2007a
      notes: >
        Gives the equation the older literature has to be read through:
        "Oxford Clay Formation, Peterborough Member (=lower Oxford Clay)".
        Middle Oxford Clay is the Stewartby Member and Upper Oxford Clay the
        Weymouth Member.
    - id: naish2007a
      notes: >
        Assigns all three members: five genera from "the Middle Callovian
        Peterborough Member ... in clay pits between Yaxley, Peterborough and
        Whittlesey"; "Clay pits in the Upper Callovian Stewartby Member ... near
        Oxford yielded the theropod Eustreptospondylus"; and Metriacanthosaurus
        parkeri "from the Weymouth Member (formerly Upper Oxford Clay)".

Pen:
  rank: formation
  stages: [Santonian]
  references:
    - id: rivera-sylva2018a
      notes: >
        "the Pen Formation (Upper Cretaceous, Santonian), at the Los Primos
        locality". Its one informal member, the McKinney Springs tongue, is a
        Big Bend unit and does not reach the Coahuila outcrops.

Oldman:
  rank: formation
  parent: Belly River
  stages: [Campanian]
  references:
    - id: arbour2017a
      notes: >
        "Oldman Formation (Campanian)". One of the three formations the historic
        Judith River Formation of southern Alberta was split into.

Pawpaw:
  rank: formation
  variants: ["Paw Paw Formation"]

"Zhangjia'ao":
  rank: member
  parent: Lufeng
  variants: [Zhangjiaao, "Zhangjia'ao Member", "Dark Red Beds", "Deep Red Beds"]
  references:
    - id: xing2012b
      notes: >
        Apostrophe form. Zhang (2018) prints Zhangjiaao for the same member.

"Poison Strip":
  rank: member
  parent: Cedar Mountain
  variants: ["Poison Strip Sandstone", "Poison Strip Sandstone Member",
    "Poison Strip Member"]
  references:
    - id: tidwell2001a
      notes: >
        Erected as the Poison Strip Sandstone, and the same paper's horizon line
        prints "Poison Strip Member" for the same unit. Recorded without the
        lithologic term so one string names the member.

"Râul Mare Beds":
  rank: informal
  parent: Sânpetru
  references:
    - id: díaz2025a
      notes: >
        "a not yet formally defined lithostratigraphical unit that either
        represents the uppermost part of the Sînpetru Formation ... or is a
        distinct unit". Also the name of the river beside the outcrop.

"Red Beds of Hermiin Tsav":
  rank: none
  kind: locality
  references:
    - id: funston2018a
      notes: >
        An informal name for the Baruungoyot type locality, not a rival
        formation: the paper writes "Baruungoyot Formation, Hermiin Tsav".

"Río Limay":
  rank: subgroup
  parent: Neuquén
  contains: [Candeleros, Huincul]
  references:
    - id: carballido2010a

Shishugou:
  rank: formation
  stages: [Bathonian, Callovian, Oxfordian]
  variants: [Wucaiwan]
  references:
    - id: carrano2012a
      notes: >
        The older bound, and the synonymy at the formation's base: "lower
        Shishugou (= Wucaiwan) Formation; middle Bathonian-late Callovian,
        Middle Jurassic". Material formerly assigned to a separate Wucaiwan
        Formation belongs to the lower part of this unit.
    - id: choiniere2010a
      notes: >
        "Shishugou Formation (Oxfordian)" for the upper part, dated at Wucaiwan
        by 40Ar/39Ar on feldspars from intercalated tuffs.

Sânpetru:
  rank: formation
  variants: ["Sînpetru Fm.", "Sînpetru", "Sanpetru Fm."]
  references:
    - id: weishampel2003a
      notes: >
        Canonical spelling chosen here. The 1993 Romanian orthographic reform
        replaced î with â in this position, and this paper flags it in its own
        geology section -- "among them Sînpetru to Sânpetru". All four reference
        works print â. The î form is kept as a variant because it survives in
        later literature, including Augustin (2022).

Santana:
  rank: group
  contains: [Crato, Ipubi, Romualdo]
  references:
    - id: delcourt2025a
      notes: >
        Araripe Basin. The old "Santana Formation" was raised to group rank and
        its Romualdo Member became the Romualdo Formation, so the two names
        describe the same rock at different ranks -- but only for the Romualdo,
        NOT for Crato or Ipubi taxa.

Sasayama:
  rank: group
  contains: [Ohyamashimo, Sawada]
  references:
    - id: tanaka2024a
      notes: >
        "The Sasayama Group, comprising the Ohyamashimo and Sawada formations in
        ascending order".

"Toundoute Continental Series":
  rank: informal
  references:
    - id: montenat2005a
      notes: >
        Berberosaurus, Tazoudasaurus. Erects no formation, dividing the
        succession into eight explicitly informal units A-H. The lower bone-bed
        is term F, the upper term G.

"Two Medicine":
  rank: formation
  stages: [Campanian]
  references:
    - id: varricchio2025a
      notes: >
        "the Campanian Two Medicine Formation of Montana", which the same paper
        correlates largely with the Dinosaur Park Formation of Alberta. No
        source places the unit in the Santonian or the Maastrichtian.
    - id: horner1988a
      notes: >
        States the position within the formation as well as the age: "Upper Two
        Medicine Formation, Upper Cretaceous (? Late Campanian)".

Tremp:
  rank: group
  contains: ["La Posa", Conques]
  references:
    - id: prieto-márquez2021a
      notes: La Posa is the basal grey unit, Conques the overlying lower red unit.

Tugulu:
  rank: group
  contains: [Lianmuqin]
  references:
    - id: rauhut2005c
      notes: Lianmuqin is the uppermost formation of the group.

Udurchukan:
  rank: formation
  variants: ["Udurchurkan Fm."]

Ukureyskaya:
  rank: formation
  variants: ["Ukurey Fm."]

"Villar del Arzobispo":
  rank: formation
  stages: [Kimmeridgian, Tithonian]
  parent: Higueruelas
  references:
    - id: barco2005a
      notes: >
        No named members: positions here are stated as parts of the formation,
        as in "Cuesta Lonsal-1 is situated in the lower part of the Villar del
        Arzobispo Formation".
    - id: sánchez-fenollosa2023a
      notes: >
        A named unit here that is NOT a member: the Barrihonda-El Humero site
        "is located in the Riodeva Facies Association", a facies association
        rather than a lithostratigraphic unit. Overlies the Higueruelas
        Formation and is unconformably overlain by Lower Cretaceous units.

"Vulcanodon Beds":
  rank: none
  kind: informal
  references:
    - id: viglietti2018a
      notes: >
        Superseded. The type locality lies "within the uppermost Forest
        Sandstone rather than the interbedded sandstones of the Batoka Basalt
        Formation".

Wales:
  rank: none
  kind: country
  references:
    - id: jones2026c
      notes: >
        Reached the formation comparison from a reference work's locality
        column. A reminder that those columns are not stratigraphy.

Wangshi:
  rank: group
  contains: [Xingezhuang, Jingangkou, Hongtuya]
  references:
    - id: an2015a
      notes: Zhucheng.
    - id: buffetaut1995a
      notes: >
        Micropachycephalosaurus. "dinosaur remains occur at several distinct
        levels in the Wangshi Group", and the group's competing subdivision
        schemes disagree about which subunit the dinosaur beds sit in, so a
        formation-rank value for an unfigured 1978 locality is not supportable.

Wessex:
  rank: formation
  stages: [Barremian]
  references:
    - id: averianov2021b
      notes: >
        "Wessex Formation (Barremian, Early Cretaceous)", consistently through
        the literature. The wider spans that appear alongside it belong to the
        containing units rather than to this formation: "Wealden Supergroup
        (Berriasian-Aptian)" and "Wealden Group (Cretaceous: Valanginian)".

Woodbine:
  rank: group
  contains: [Lewisville]
  references:
    - id: tykoski2023a
      notes: >
        Raised to group by Denne and others (2016); the Lewisville is its upper
        formation, with Arlington and Tarrant as members inside it.

Wulansuhai:
  rank: formation
  variants: ["Bayan Mandahu Formation"]
  references:
    - id: xu2011c
      notes: >
        Bayan Mandahu is the LOCALITY, not the formation, and the usual phrasing
        keeps them apart -- "the Upper Cretaceous Wulansuhai Formation of Bayan
        Mandahu, Inner Mongolia".

Xiagou:
  rank: formation
  variants: ["Xiaogou Fm."]

"Yellow Cat":
  rank: member
  parent: Cedar Mountain
  stages: [Berriasian, Valanginian, Hauterivian, Barremian, Aptian]
  references:
    - id: royo-torres2017b
      notes: >
        "All of these data suggest a potential age of late Berriasian-early
        Aptian" for the member. Wide, and genuinely so -- the paper reports a
        conflict between detrital zircon maxima and the ostracod and charophyte
        evidence.

Yixian:
  rank: formation
  parent: Jehol
  stages: [Hauterivian, Barremian, Aptian]
  references:
    - id: zhou2006b
      notes: >
        "Yixian Formation (Hauterivian, Early Cretaceous)", the older bound and
        the commonest phrasing.
    - id: fowler2011b
      notes: >
        The younger bound, from the formation's uppermost beds: "the Lujiatun
        Beds of the Yixian Formation, Jehol Group; Lower Cretaceous
        (Barremian-Aptian), ca. 125 Ma". The envelope spans both readings.

Yezo:
  rank: group
  references:
    - id: suzuki2004a
      notes: >
        Nipponosaurus. "Upper Ammonites Bed; now Upper Yezo Group". No
        formation-rank unit is recoverable: the Kawakami colliery has been
        inaccessible since 1945 and the excavation field notes are lost.

Yuliangzi:
  rank: formation
  variants: ["Yuliangze Fm.", "Yuliangze Formation"]

Ziliujing:
  rank: formation
  variants: ["Zilujing Fm."]

Xinminpu:
  rank: group
  contains: [Xiagou, Zhonggou]
  variants: [Xinminbao]
  references:
    - id: you2014a
      notes: >
        "The Xinminpu Group includes two formations: the lower Xiagou and the
        upper Zhonggou formations", and elsewhere writes the pair as "the
        Xinminpu (= Xinminbao) Group", which is why both spellings reached the
        records.
