name: Jianshangou
rank: member
parent: Yixian
period: [Early Cretaceous]
stages: [Barremian]
dispute:
  summary: >
    The Yixian's internal subdivisions take different rank words across
    sources, without any source arguing the rank. Wang and colleagues (2016)
    write "the Jianshangou Member, a cyclical lacustrine mudstone"; Chang and
    colleagues (2017) write unit throughout, listing the formation as divided
    "from bottom to top into the Lujiatun Unit, Lower Lava Unit, Jianshangou
    Unit, Upper Lava Unit, Dawangzhangzi Unit and Jingangshan Unit", and
    their disagreement with earlier work is over age, their basalt dates
    making the Lujiatun contemporaneous with the Jianshangou; Jin and
    colleagues (2008) call it "the Jianshangou Bed".
references:
  - id: wang2016a
    notes: >
      Uses member rank and describes the lithology, "a cyclical lacustrine
      mudstone containing a taphocoenosis of articulated compression fossils
      with soft tissue" preservation.
  - id: jin2008a
    notes: >
      Calls it "the Jianshangou Bed" and correlates it with the Dawangzhangzi
      Bed of the same formation.
  - id: chang2017a
    notes: >
      Places it third in the formation's succession and writes unit rank
      throughout, dating it contemporaneous with the Lujiatun.
  - id: chen1998a
    notes: >
      Calls it the Jianshangou "intercalated bed (60 m thick)" at the base of
      the Yixian and weighs its age: the beds are "probably younger than the
      Solnhofen Lithographic Limestones (Early Tithonian)", and "the presence
      of Psittacosaurus in the same beds is more consistent with an Early
      Cretaceous age", as are the palynomorphs and a recent radiometric date
      of the Yixian Formation, though "other radiometric dating attempts have
      indicated older ages".
  - id: huang2026a
    notes: >
      Barremian, on a radiometric date: the holotype comes from the
      "Jianshangou Unit (125.457 ± 0.051 Ma; Barremian, Lower Cretaceous) of
      the Yixian Formation, Jehol Group", the date taken from the U-Pb zircon
      work of Zhong and colleagues (2021) on tuff layers from the top, middle
      and bottom of the Yixian Formation. Uses unit rather than member rank.
  - id: zhong2021a
beds:
  - name: Anjiagou
    period: [Early Cretaceous]
    references:
      - id: wang2016a
        notes: >
          Places it inside the Jianshangou Member, which "is divided into 4 units:
          the basal Dajianshanzi Bed, a shallow-water lacustrine unit with
          abundant mollusks and rooted zones; the Anjiagou Bed, the main
          tetrapod-bearing unit, consisting of microlaminated dark gray
          mudstones". Gives no stage for the bed.
