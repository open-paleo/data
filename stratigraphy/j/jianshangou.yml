name: Jianshangou
rank: member
parent: Yixian
period: [Early Cretaceous]
stages: [Barremian]
references:
  - id: wang2016a
    notes: >
      Uses member rank and describes the lithology, "a cyclical lacustrine
      mudstone containing a taphocoenosis of articulated compression fossils
      with soft tissue" preservation.
  - id: jin2008a
    notes: >
      Calls it "the Jianshangou Bed" and correlates it with the Dawangzhangzi
      Bed of the same formation.
  - id: chang2017a
    notes: >
      Places it third in the formation's succession and writes unit rank
      throughout, dating it contemporaneous with the Lujiatun.
  - id: chen1998a
    notes: >
      Calls it the Jianshangou "intercalated bed (60 m thick)" at the base of
      the Yixian and weighs its age: the beds are "probably younger than the
      Solnhofen Lithographic Limestones (Early Tithonian)", and "the presence
      of Psittacosaurus in the same beds is more consistent with an Early
      Cretaceous age", as are the palynomorphs and a recent radiometric date
      of the Yixian Formation, though "other radiometric dating attempts have
      indicated older ages".
  - id: huang2026a
    notes: >
      Barremian, on a radiometric date: the holotype comes from the
      "Jianshangou Unit (125.457 ± 0.051 Ma; Barremian, Lower Cretaceous) of
      the Yixian Formation, Jehol Group", the date taken from the U-Pb zircon
      work of Zhong and colleagues (2021) on tuff layers from the top, middle
      and bottom of the Yixian Formation. Uses unit rather than member rank.
  - id: zhong2021a
  - id: wang1998a
    notes: >
      Separates two bodies of rock under the name. Its own "upper Jianshangou
      vertebrate fossil bed" is bed 8 of its composite section, 10–15 m of
      shale and siltstone with 4–5 tuff layers at the top of the second
      sedimentary cycle of member 3 of the lower Yixian Formation, holding the
      Zhangheotherium holotype. The "Jianshangou sedimentary interbed" of Chen
      and colleagues (1980) is broader: "roughly equivalent" to the whole of
      member 3, beds 5–9, which also holds the lower Sihetun fossil bed
      (translated). Gives no age of its own.
  - id: he2006a
    notes: >
      Relays 40Ar/39Ar ages of 124.6 ± 0.3 Ma and 125.0 ± 0.2 Ma for the bed
      from Swisher and colleagues (1999, 2002), and from its own date for the
      Lujiatun tuff concludes that "the Lujiatun bed was most likely deposited
      at the same time as the Jianshangou bed of the lower Yixian Formation".
      Chang and colleagues (2017) recalculate that Lujiatun date and Zhong and
      colleagues (2021) find it younger than the lava above the Lujiatun.
  - id: chen1980a
  - id: swisher1999a
  - id: swisher2002a
  - id: wang2001c
    notes: >
      Dates the Sihetun vertebrate beds without naming the member, reaching
      them through the composite section of the Yixian Formation at Sihetun,
      where vertebrates occur "especially abundantly in Bed 6" of the
      lacustrine Member 3 (translated). Its own Ar-Ar ages, 128.2 ± 0.8 Ma on
      a basalt-andesite in the lower part of Bed 2 and 122.3 ± 0.5 Ma on a
      diabase intruding Beds 5 to 9, give "the age range of Beds 2–9 is
      128–122 Ma" (translated); the diabase gives only a minimum age for the
      beds it cuts.
beds:
  - name: Anjiagou
    period: [Early Cretaceous]
    stages: [Barremian]
    references:
      - id: wang2016a
        notes: >
          Places it inside the Jianshangou Member, which "is divided into 4 units:
          the basal Dajianshanzi Bed, a shallow-water lacustrine unit with
          abundant mollusks and rooted zones; the Anjiagou Bed, the main
          tetrapod-bearing unit, consisting of microlaminated dark gray
          mudstones". Gives no stage for the bed.
