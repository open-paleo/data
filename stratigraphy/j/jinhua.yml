name: Jinhua
rank: formation
period: [Late Cretaceous]
stages: [Cenomanian, Turonian, Coniacian]
references:
  - id: tang2001a
    notes: >
      Gives the Jiangshanosaurus type as from "the lower part of the Jinhua
      Formation in Jiangshan, Zhejiang. The geological age is Late Early
      Cretaceous (Albian)", on a 105 Ma Rb-Sr date. That reading is
      superseded: Mannion and colleagues (2019) record the lower section as
      "now regarded as early Late Cretaceous", and the lower basalt is about
      102 Ma.
  - id: mannion2019b
    notes: >
      Calls it "The early Late Cretaceous Jinhua Formation", and records that
      its lower section, which yielded Jiangshanosaurus, was "then dated as
      Albian (late Early Cretaceous), but now regarded as early Late
      Cretaceous in age".
  - id: mayer2026a
    notes: >
      Treats it as Turonian-Coniacian, placing Dongyangosaurus sinensis and
      Jiangshanosaurus lixianensis as "both from the Turonian-Coniacian Jinhua
      Formation" in a reconstruction of lithostrotian ancestral range, while
      calling the lithostrotian affinities of those two taxa controversial.
  - id: wilson2005a
    notes: >
      Lists Jiangshanosaurus lixianensis, spelled "Jianshanosaurus", from the
      Jinhua Formation as "Aptian-Albian" in a table of "Cretaceous Asian
      sauropod genera, listed in order of their stratigraphic appearance",
      crediting the age to Tang and colleagues (2001), who give Albian only.
      The Aptian has no other source here and is not carried.
  - id: yu2010a
    notes: >
      Gives Jiangshanosaurus as from "the Jinhua Formation, whose lower basalt
      has an age of (101.8±3.2) Ma", at the Albian–Cenomanian boundary on
      GTS2020, and a 105 Ma basalt in the lower member of the underlying
      Zhongdai Formation. The error on the basal date reaches into the latest
      Albian, which is not carried.
