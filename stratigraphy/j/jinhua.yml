name: Jinhua
rank: formation
period: [Early Cretaceous, Late Cretaceous]
stages: [Aptian, Albian, Cenomanian, Turonian, Coniacian]
references:
  - id: tang2001a
    notes: >
      Gives the Jiangshanosaurus type as from "the lower part of the Jinhua
      Formation in Jiangshan, Zhejiang. The geological age is Late Early
      Cretaceous (Albian)".
  - id: mannion2019b
    notes: >
      Calls it "The early Late Cretaceous Jinhua Formation", and records that
      its lower section, which yielded Jiangshanosaurus, was "then dated as
      Albian (late Early Cretaceous), but now regarded as early Late
      Cretaceous in age".
  - id: mayer2026a
    notes: >
      Treats it as Turonian-Coniacian, placing Dongyangosaurus sinensis and
      Jiangshanosaurus lixianensis as "both from the Turonian-Coniacian Jinhua
      Formation" in a reconstruction of lithostrotian ancestral range, while
      calling the lithostrotian affinities of those two taxa controversial.
  - id: wilson2005a
    notes: >
      Lists Jiangshanosaurus lixianensis, spelled "Jianshanosaurus", from the
      Jinhua Formation as "Aptian-Albian" in a table of "Cretaceous Asian
      sauropod genera, listed in order of their stratigraphic appearance",
      crediting the age to Tang and colleagues (2001).
