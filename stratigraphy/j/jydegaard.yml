name: Jydegaard
rank: formation
parent: Nyker
period: [Early Cretaceous]
stages: [Berriasian, Valanginian]
references:
  - id: bonde2012a
    notes: >
      Gives the Dromaeosauroides horizon as "The base of the Jydegaard
      Formation (Late Berriasian) at Robbedale", which has produced three
      dinosaurian tooth crowns.
  - id: christiansen2003a
    notes: >
      Places it as the youngest formation of the Nyker Group and gives the
      dromaeosaurid tooth horizon as "Lower Cretaceous (Berriasian-Valanginian),
      Jydegaard Formation".
  - id: pittman2020c
    notes: >
      Tabulates the formation as Berriasian to Valanginian.
