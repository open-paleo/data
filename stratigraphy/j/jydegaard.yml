name: Jydegaard
rank: formation
parent: Nyker
period: [Early Cretaceous]
stages: [Berriasian, Valanginian]
references:
  - id: bonde2012a
    notes: >
      Gives the Dromaeosauroides horizon as "The base of the Jydegaard
      Formation (Late Berriasian) at Robbedale", which has produced three
      dinosaurian tooth crowns.
  - id: christiansen2003a
    notes: >
      Places it as the youngest formation of the Nyker Group, whose facies and
      fauna have been reported as "Wealden-like". Gives the dromaeosaurid
      tooth horizon as "Lower Cretaceous (Berriasian-Valanginian), Jydegaard
      Formation"; the basal 2-3 meters are "considered Late Berriasian to
      ?Early Valanginian, i.e. Ryazanian in age", while the entire formation
      "supposedly includes most or all of the Valanginian, perhaps even
      younger stages".
  - id: pittman2020a
    notes: >
      Tabulates the formation as Berriasian to Valanginian.
