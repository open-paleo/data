name: Jiufotang
rank: formation
parent: Jehol
period: [Early Cretaceous]
stages: [Aptian]
lithology: mudstone, siltstone, shale and sandstone, with tuff
references:
  - id: zhou2003a
    notes: >
      Records that the age is not directly constrained: it "is unknown;
      however, it is generally believed to be Aptian (Wang and Zhou 2002),
      which is slightly younger than the Santana Formation of Brazil".
  - id: sereno2010a
    notes: >
      Uses "Jiufotang Formation (Aptian)".
  - id: zhou2006a
    notes: >
      Gives the formation, in the upper Jehol Group, as "Late Early
      Cretaceous", its age "recently determined as 120.3 ± 0.7 Ma, based on
      ⁴⁰Ar/³⁹Ar dating on the sanidine crystals from tuffs interbedded within
      the fossil-bearing deposits" by He and colleagues (2004).
  - id: wang2002a
  - id: he2004a
    notes: >
      Dates tuffs interbedded with the fossil-bearing shales at Shangheshou to
      "120.3 ± 0.7 million years ago", a result that "confirms an Aptian age
      for the Jiufotang Formation", and gives the Jehol Group as "the Yixian
      Formation and the overlying Jiufotang Formation".
  - id: tong2021a
    notes: >
      Aptian in a review of macrobaenid turtle occurrences: Liaochelys
      jianchangensis of Jianchang, western Liaoning, comes from the "Jiufotang
      Fm. Early Cretaceous (Aptian)", as does Jeholochelys lingyuanensis of
      Lingyuan.
  - id: turner2012a
    notes: >
      Gives Microraptor gui as distributed "Aptian-Albian, Early Cretaceous,
      Jiufotang Formation", and Microraptor zhaoianus over the same interval
      in the "Yixian and Jiufotang Formations": ranges of taxa, not a dating
      of the formation.
  - id: liu2012a
    notes: >
      Source of the lithology.
beds:
  - name: Meileyingzi
    period: [Early Cretaceous]
    references:
      - id: sereno2010a
        notes: >
          Gives the Psittacosaurus meileyingensis type horizon as "Meileyingzi
          Beds, Jiufotang Formation (Aptian); Beipiao, Liaoning Province,
          People's Republic of China". The Aptian follows the formation's name,
          not the beds'.
