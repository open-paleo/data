name: Jiufotang
rank: formation
period: [Early Cretaceous]
stages: [Aptian, Albian]
references:
  - id: zhou2003a
    notes: >
      Records that the age is not directly constrained: it "is unknown;
      however, it is generally believed to be Aptian (Wang and Zhou 2002),
      which is slightly younger than the Santana Formation of Brazil".
  - id: sereno2010a
    notes: >
      Uses "Jiufotang Formation (Aptian".
  - id: zhou2006a
    notes: >
      Gives the formation, in the upper Jehol Group, as "Late Early
      Cretaceous", its age "recently determined as 120.3 ± 0.7 Ma, based on
      ⁴⁰Ar/³⁹Ar dating on the sanidine crystals from tuffs interbedded within
      the fossil-bearing deposits" by He and colleagues (2004).
  - id: wang2002a
  - id: he2004a
    notes: >
      The primary behind the radiometric figure the entry's other references
      relay: "40Ar/39Ar step heating analyses of K-feldspar and the SHRIMP
      U-Pb zircon data indicate that tuffs at the Shangheshou section erupted
      at 120.3 plus or minus 0.7 million years ago. This result confirms an
      Aptian age for the Jiufotang Formation that was mainly based on
      biostratigraphic evidence." The Albian appears nowhere in it. Where the
      paper calls that figure a minimum age it is speaking of the fossils
      rather than of the unit, the tuffs being interbedded with the
      fossil-bearing shales.
  - id: tong2021a
    notes: >
      Aptian in a review of macrobaenid turtle occurrences: Liaochelys
      jianchangensis of Jianchang, western Liaoning, comes from the "Jiufotang
      Fm. Early Cretaceous (Aptian)", as does Jeholochelys lingyuanensis of
      Lingyuan.
  - id: turner2012a
    notes: >
      Carries the formation into the Albian: Microraptor gui is distributed
      "Aptian-Albian, Early Cretaceous, Jiufotang Formation, Xiasanjiazi,
      Chaoyang County, western Liaoning", and Microraptor zhaoianus over the
      same interval in the "Yixian and Jiufotang Formations".
