name: Jehol
rank: group
period: [Early Cretaceous]
stages: [Barremian, Aptian]
references:
  - id: yao2019a
    notes: >
      "the Lower Cretaceous Jehol Group of Lingyuan, Liaoning Province,
      China". Gives only the series, not a stage.
  - id: zhou2026a
    notes: >
      Records that the Early Cretaceous microraptorines other than Jian "have
      been recovered from Barremian–Aptian sediments of the Jehol Group of
      northeastern China".
  - id: barrett2007b
    notes: >
      Gives the group as "the Jiufotang, Yixian and Dabeigou (?) Formations" of
      Liaoning and nearby areas, deposited "during the late Early Cretaceous".
  - id: he2004a
    notes: >
      Dates a tuff in the Jiufotang Formation at 120.1 ± 0.4 Ma, Aptian, and
      concludes that "the Jehol sedimentation had a duration of more than 8 Ma
      (between 128 Ma and 120 Ma) from Barremian to Aptian".
  - id: swisher2002a
    notes: >
      Dates tuffs in the lower Yixian Formation at 125.0 Ma, Barremian on the
      ICS chart v2024/12.
