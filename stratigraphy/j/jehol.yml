name: Jehol
rank: group
period: [Early Cretaceous]
stages: [Barremian, Aptian]
references:
  - id: yao2019a
    notes: >
      "the Lower Cretaceous Jehol Group of Lingyuan, Liaoning Province,
      China". Gives only the series, not a stage.
  - id: zhou2026a
    notes: >
      Records that the Early Cretaceous microraptorines other than Jian "have
      been recovered from Barremian–Aptian sediments of the Jehol Group of
      northeastern China".
  - id: barrett2007b
    notes: >
      The group "consists of the Jiufotang, Yixian and Dabeigou (?)
      Formations" and crops out in Liaoning Province and adjacent areas of
      northeastern China. "Although biostratigraphical correlations initially
      indicated a Late Jurassic age for these units, recently obtained
      radiometric dates and reinterpretation of the biostratigraphical
      evidence indicate that the group was deposited during the late Early
      Cretaceous"; those dates also show that the
      Eosestheria-Ephemeropsis-Lycoptera assemblage the group shares with the
      Mengyin Formation of Shandong "is of late Early Cretaceous age".
