name: Javkhlant
rank: formation
period: [Late Cretaceous]
stages: [Santonian, Campanian, Maastrichtian]
references:
  - id: eberth2009a
    notes: >
      Formally redescribes the Shine Us Khudag redbeds as the formation,
      noting they "have variously been assigned to the Jibhalanta Suite,
      Javkhlant Formation, Baruungoyot Svita, Djadokhta Formation, and the
      'Barunbayan'" and "since 1969 have been regarded by most stratigraphers
      working in the area as having a Santonian-Campanian age". The paper
      itself accepts that the formation at Shine Us Khudag is "Late Cretaceous
      in age" and "can only tentatively accept the previously proposed
      biostratigraphically derived Santonian-Campanian age range".
  - id: son2022a
    notes: >
      Gives "Javkhlant Formation, ?Santonian-Campanian", hedging the older
      end. This is the paper that also corrects the Khugenetjavkhlant
      locality spelling, the formation name sharing its second element.
  - id: fowler2020b
    notes: >
      Gives the age of the Javkhlant Formation, which yielded Albinykus, as
      "Campanian–Maastrichtian" after Nesbitt and colleagues (2011), "or
      Santonian–Campanian" after Norell and Barta (2016).
  - id: nesbitt2011a
    notes: >
      Gives the age as a relay with a query on its older end: material was
      "collected from the Javkhlant Formation, Shine Us Khudag redbeds at
      Khugenetslavkant ... considered to be ?Santonian-Campanian in age
      (Eberth et al., 2009)". It gives no Maastrichtian.
  - id: norell2016a
    notes: >
      "The Javkhlant beds at Shine Us Khudug that produced the Haya griva type
      material have been assigned a Santonian-Campanian age based on, among
      other things, ostracods", after Jerzykiewicz and Russell (1991), Khand
      and colleagues (2000) and Jerzykiewicz (2001); because Haya griva occurs
      at both sites, the Zos Canyon beds 600 km away are recognized as "coeval
      with the Javkhlant beds at Shine Us Khudug" and of the same
      Santonian-Campanian age. Calls the white to reddish-brown beds of the
      eastern Gobi "the Upper Cretaceous Javkhlant Formation".
  - id: jerzykiewicz2000a
  - id: jerzykiewicz1991a
    notes: >
      Never names this formation. It is a survey of the Gobi Basin's late
      Mesozoic stratigraphy and vertebrates, dense on the neighboring units
      - the Nemegt, Djadokhta and Barun Goyot - and contributes nothing
      directly here.
  - id: khand2000a
    notes: >
      "The fossil horizon of the Javkhlant Formation is correlative with the
      Santonian-Campanian Stage" -- the statement behind the
      Santonian-Campanian age that Norell and Barta (2016) relay to this
      paper. Shuvalov and Stankevich (1977) had called these beds the
      Baruungoyot Formation; here they are 15-60 m of red sandstone and sandy
      clay resting on the Bayanshiree and overlain by the Nemegt Formation.
