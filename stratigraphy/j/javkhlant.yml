name: Javkhlant
rank: formation
period: [Late Cretaceous]
stages: [Santonian, Campanian]
lithology: red sandstone, sandy clay and gravelite, with some conglomerate
references:
  - id: eberth2009a
    notes: >
      Redescribes the Shine Us Khudag redbeds as the formation, which it accepts
      as "Late Cretaceous in age", taking the earlier Santonian-Campanian only
      "tentatively".
  - id: son2022a
    notes: >
      Gives "Javkhlant Formation, ?Santonian-Campanian", hedging the older
      end. This is the paper that also corrects the Khugenetjavkhlant
      locality spelling, the formation name sharing its second element.
  - id: fowler2020b
    notes: >
      Gives the age of the Javkhlant Formation, which yielded Albinykus, as
      "Campanian–Maastrichtian" after Nesbitt and colleagues (2011), "or
      Santonian–Campanian" after Norell and Barta (2016).
  - id: nesbitt2011a
    notes: >
      Gives the age as a relay with a query on its older end: material was
      "collected from the Javkhlant Formation, Shine Us Khudag redbeds at
      Khugenetslavkant ... considered to be ?Santonian-Campanian in age
      (Eberth et al., 2009)". It gives no Maastrichtian.
  - id: norell2016a
    notes: >
      Relays a Santonian-Campanian age for the formation at Shine Us Khudug,
      "based on, among other things, ostracods", and correlates the Zos Canyon
      beds with it through *Haya griva*.
  - id: jerzykiewicz2000a
  - id: jerzykiewicz1991a
    notes: >
      Never names this formation. It is a survey of the Gobi Basin's late
      Mesozoic stratigraphy and vertebrates, dense on the neighboring units —
      the Nemegt, Djadokhta and Barun Goyot — and gives nothing directly on this
      unit.
  - id: khand2000a
    notes: >
      Lists the formation's ostracods and correlates "the fossil horizon of the
      Javkhlant Formation" with the Santonian-Campanian. Source of the
      lithology.
  - id: shuvalov1977a
