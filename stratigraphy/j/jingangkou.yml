name: Jingangkou
rank: formation
parent: Wangshi
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
references:
  - id: prieto-márquez2013b
    notes: >
      Gives the parent and the type area: "Lower Campanian ... Jingangkou
      Formation, Wangshi Group, near the village of Chingkankou, 20 km south
      of the city of Laiyang, Shandong Province", and elsewhere calls it "the
      Campanian (Upper Cretaceous) Jingangkou Formation of Shandong".
      Tsintaosaurus spinorhinus comes from a bonebed in it.
  - id: yao2026a
    notes: >
      Sets it beside its neighbor: "the Hongtuya (?middle to late Campanian)
      and Jingangkou (?late Campanian to early Maastrichtian) formations in
      Zhucheng and Laiyang", both hedged.
  - id: zhang2019a
    notes: >
      Places the formation in the Wangshi Group, after Hu and colleagues (2001),
      as the horizon of Laiyangosaurus youngi, Tsintaosaurus and Tanius
      chingkankouensis near Laiyang, and equates it with the Hongtuya Formation
      of Yan and Chen (2005), whose basalt date of 73 Ma it relays.
  - id: borinder2021a
    notes: >
      Gives "Upper Cretaceous (probable upper Campanian) strata of the
      Jingangkou Formation" for the type material of Tanius chingkankouensis and
      T. laiyangensis, and describes "a rich succession of dinosaur assemblage
      spanning the Jiangjunding and Jingangkou formations".
  - id: yan2005a
  - id: hu2001a
