name: Javelina
rank: formation
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
references:
  - id: lehman2006a
    notes: >
      Publishes the date the unit's Maastrichtian rests on and states the
      stage outright: "A U-Pb age of 69.0 ± 0.9 Ma obtained from monazite in a
      tuff bed in the Javelina Formation confirms that these strata are of
      latest Cretaceous (Maastrichtian) age." It supersedes the authors' own
      preliminary report, which it says later workers referred to although
      "the full data and basis for the age assessment have not been presented
      and so are subject to misinterpretation. Here, we provide a thorough
      account of our suggested age determination." The figure comes from a
      207Pb/204Pb against 235U/204Pb isochron on five multigrain fractions,
      "an approach chosen to avoid the effects of 230Th-derived excess 206Pb".
      The tuff "occurs approximately in the middle of the fluvio-lacustrine
      Javelina Formation, about 90 m stratigraphically below the position of
      the Cretaceous-Tertiary boundary", on Tornillo Creek in Big Bend
      National Park. The date requires the unit's reversed-polarity interval
      to correlate with C31r rather than C29r, and a hiatus of as much as 2 Ma
      may lie within the formation.
  - id: wick2013a
    notes: >
      Describes Bravoceratops from "the lowermost part of the Javelina
      Formation (early Maastrichtian) of Big Bend National Park, TX, USA". The
      locality section puts the site "in the base of the Javelina Formation,
      terminal Campanian to early Maastrichtian in age", inferred from its
      position at least 57 m below a tuff in the middle of the formation dated
      to 69±0.9 Ma.
  - id: maxwell1967a
    notes: >
      Erects the formation when redefining the Tornillo Clay as the Tornillo
      Group, divided into "the Javelina Formation of Late Cretaceous age and
      the Black Peaks (Paleocene) and Hannold Hill (Lower Eocene) Formations
      of early Tertiary age".
  - id: breyer2007a
    notes: >
      "Middle to Upper Maastrichtian" where it lies in the hanging wall of the
      southeastern boundary fault of the Rosillos Mountains fault block in Big
      Bend, an outward-dipping normal fault that juxtaposes "sediments of the
      Javelina Formation (Middle to Upper Maastrichtian) in the hanging wall
      of the fault with the pyroclastic strata in the footwall". Elsewhere
      calls it "the Upper Cretaceous Javelina Formation", whose position
      across that fault indicates the pyroclastic rocks below "must be
      Maastrichtian or older", and records that McDowell and colleagues (2004)
      reported a U-Pb monazite age of 69 ± 1 Ma from a tuff in it.
