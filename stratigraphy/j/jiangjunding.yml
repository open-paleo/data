name: Jiangjunding
rank: formation
parent: Wangshi
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
references:
  - id: borinder2021a
    notes: >
      Gives the Tanius type as from "Upper Cretaceous strata of the
      Jiangjunding Formation (Wangshi Group) in Shandong Province", recovered
      by a Sino-Swedish expedition in 1923. Dates the formation as "Upper
      Cretaceous (upper Campanian–lower Maastrichtian)" and, following Xing
      and colleagues (2014), says its outcrops near the find site, "the most
      likely source unit" for the type, "stratigraphically range from the
      upper Campanian to lower Maastrichtian".
  - id: buffetaut1995a
    notes: >
      Records Young's (1958) placement of the locality that yielded the
      Tanius type "in the lower part of the Wangshi Group, below the
      Jingangkou" locality.
  - id: young1958a
