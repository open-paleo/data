name: Jaisalmer
rank: formation
period: [Middle Jurassic]
stages: [Bathonian]
references:
  - id: bajpai2023a
    notes: >
      Describes Tharosaurus from "the Middle Jurassic (early-middle
      Bathonian) strata of Jaisalmer Basin, western India", from the base of
      the Fort Member.
  - id: mannion2025a
    notes: >
      Gives the internal order, "the Bathonian Badabag Member of the
      Jaisalmer Formation, which overlies the Fort Member".
  - id: zhang2026a
    notes: >
      Lists among turiasaurs "a heart-shaped tooth found from the Middle
      Jurassic Jaisalmer Formation of India", reported by Sharma and
      colleagues (2022).
  - id: sharma2022a
