name: Jaisalmer
rank: formation
period: [Middle Jurassic, Late Jurassic]
stages: [Bajocian, Bathonian, Callovian, Oxfordian]
references:
  - id: bajpai2023a
    notes: >
      Describes Tharosaurus from "the Middle Jurassic (early-middle
      Bathonian) strata of Jaisalmer Basin, western India", from the base of
      the Fort Member.
  - id: mannion2025a
    notes: >
      Gives the internal order, "the Bathonian Badabag Member of the
      Jaisalmer Formation, which overlies the Fort Member".
  - id: zhang2026a
    notes: >
      Lists among turiasaurs "a heart-shaped tooth found from the Middle
      Jurassic Jaisalmer Formation of India", reported by Sharma and
      colleagues (2022).
  - id: sharma2022a
  - id: pandey2012a
    notes: >
      Reviews the Jurassic facies and stratigraphy of the Jaisalmer Basin and
      tabulates the formation's members with their ages: Joyan "Bajocian",
      Fort "Early–Mid. Bathonian", Bada Bag "Late Bathonian", Kuldhar
      "Callovian" and Jajiya "Oxfordian". The lowest member, the Hamira,
      shares an age cell with the underlying Lathi Formation's Thaiat Member,
      "Early Jurassic–Bajocian", so its own age is not separable from the
      table.
  - id: kumar2022a
    notes: >
      Divides the formation into six members, "Hamira, Joyan, Fort, Badabag,
      Kuldhar and Jajiya, in an ascending order".
