name: Judith River
rank: formation
period: [Late Cretaceous]
stages: [Campanian]
lithology: interbedded mudstone, siltstone and sandstone, with minor coal,
  bentonite and mollusc coquinas
references:
  - id: arbour2017a
    notes: >
      The formation "of northern Montana was deposited over an approximately 4
      Myr interval during the Campanian (Late Cretaceous)".
  - id: sues1978a
    notes: Independently gives "Judith River Formation (Campanian)".
  - id: cspg2008a
    notes: >
      Describes its rock: "Predominantly interbedded mudstone, siltstone and
      sandstone in varying proportions. Coal, bentonite and mollusc coquinas are
      minor but prominent constituents in part."
