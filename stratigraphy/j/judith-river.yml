name: Judith River
rank: formation
period: [Late Cretaceous]
stages: [Campanian]
description: "The Judith River Formation dates to the Late Cretaceous, between 79 and 75.3 million years ago, corresponding to the \"Judithian\" land vertebrate age. It was laid down during the same time period as portions of the Two Medicine Formation of Montana and the Oldman Formation of Alberta. It is an historically important formation, explored by early American paleontologists such as Edward Drinker Cope, who named several dinosaurs from scrappy remains found here on his 1876 expedition (such as Monoclonius). Modern work has found nearly complete skeletons of the hadrosaurid Brachylophosaurus."
references:
  - id: arbour2017a
    notes: >
      The formation "of northern Montana was deposited over an approximately 4
      Myr interval during the Campanian (Late Cretaceous)".
  - id: sues1978a
    notes: Independently gives "Judith River Formation (Campanian)".
