name: Juans Lake
rank: bed
parent: Allison
period: [Late Cretaceous]
stages: [Campanian]
references:
  - id: mcdonald2018a
    notes: >
      Miller and colleagues (1991) divided the Allison Member into the Lower
      Beds, Juans Lake Beds and La Vida Beds, and McDonald and Wolfe's field
      area is predominantly fluvial mudstones and sandstones in the Juans Lake
      Beds, which yielded the three specimens of the nodosaurid Invictarx
      zephyri along with turtles, neosuchians and hadrosaurid, ceratopsid and
      theropod material. Their horizon statement gives the beds as "lower
      Campanian, Upper Cretaceous", on a framework built from the Menefee's
      approximately 84.0-78.5 Ma span in the correlation chart of Molenaar and
      colleagues (2002), Baculites perplexus in the overlying Cliff House
      Sandstone at 78.0 to 78.5 Ma, and an Ar/Ar date of 78.22 Ma that Lucas
      and colleagues (2005) obtained from a bentonite near the top of the
      formation in the Gallina hogback.
  - id: mcdonald2021a
    notes: >
      Places it precisely: "Juans Lake Beds ..., upper part of the Allison
      Member, Menefee Formation, approximately 120 meters below the overlying
      Cliff House Sandstone; middle Campanian".
  - id: mcdonald2018b
    notes: >
      Gives the same position with the older reading, "Juans Lake Beds ...,
      upper part of the Allison Member, Menefee Formation; lower Campanian,
      Upper Cretaceous".
