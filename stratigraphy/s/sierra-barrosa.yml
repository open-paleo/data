name: Sierra Barrosa
rank: formation
parent: Neuquén
period: [Late Cretaceous]
stages: [Turonian, Coniacian]
references:
  - id: filippi2019a
    notes: >
      Puts the Kaijutitan holotype in the "Sierra Barrosa Formation (upper
      Coniacian, Upper Cretaceous)".
  - id: salgado2009a
    notes: >
      Uses the same words for a locality rather than the unit, placing the
      "Sierra Barrosa locality (Anacleto Formation, Late Cretaceous, early
      Campanian". The formation takes its name from the place, so the string
      appears in both roles and at different ages.
  - id: garrido2010a
    notes: >
      Erects the unit as Sierra Barrosa Formation, nom. nov., for the
      sandstones between the Los Bastos and Plottier Formations that Herrero
      Ducloux (1938, 1939) had called the "Upper Portezuelo". With no absolute
      dating available, "Based on stratigraphic relations, this unit is
      assigned to the Middle-Late Coniacian."
  - id: coria2016a
    notes: >
      The Murusraptor holotype comes from "the Upper Cretaceous Sierra Barrosa
      Formation (Turonian-Coniacian) of Neuquén Province, Argentina", the unit
      placed in the Río Neuquén Subgroup of the Neuquén Group; the horizon
      given for the specimen itself narrows this to "Sierra Barrosa Formation
      (Coniacian)".
