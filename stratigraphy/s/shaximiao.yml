name: Shaximiao
rank: formation
period: [Middle Jurassic, Late Jurassic]
stages: [Bajocian, Bathonian, Callovian, Oxfordian, Kimmeridgian, Tithonian]
variants: [Dashanpu]
dispute:
  summary: >
    The age is in flux and the lower and upper parts are dated separately.
    Mannion and colleagues (2019) record that "Wang et al. (2018) recently
    dated the Shaximiao (=Dashanpu) Formation as Oxfordian, rather than the
    late Middle Jurassic (Bathonian-Callovian) age that has been the consensus
    for some time", and say outright that "the ages of several Jurassic
    stratigraphic units from China are in a state of flux". Sánchez-Fenollosa
    and colleagues (2025) split it, giving the lower Shaximiao as
    "Bathonian-early Oxfordian" and the upper as "?Kimmeridgian-?Tithonian".
    Xiashaximiao and Shangshaximiao are the lower and upper parts rather than
    spellings: xia and shang are Chinese for lower and upper.
references:
  - id: mannion2019a
    notes: >
      Records Wang and colleagues' (2018) Oxfordian redating and the consensus
      it displaces, "the late Middle Jurassic (Bathonian-Callovian) age that
      has been the consensus for some time", and gives Dashanpu as an
      equivalent name.
  - id: sánchez-fenollosa2025a
    notes: >
      Dates the two parts separately, lower "Bathonian-early Oxfordian" and
      upper "?Kimmeridgian-?Tithonian", both hedged in the source.
  - id: sadleir2008a
    notes: >
      Uses "Lower Shaximiao Formation (Bajocian or Bathonian-Callovian)", the
      oldest bound among the sources cited.
  - id: li2011a
    notes: >
      Argues that "the entire Shaximiao Formation is of Bajocian-Callovian age
      (middle-late part of Middle Jurassic)", putting the upper member "of
      Middle Jurassic age (Bathonian-Callovian)" in the abstract but "namely
      the Bajocian-Bathonian" in the discussion. It records the reading it
      argues against: the invertebrates placed the formation in the Middle
      Jurassic, "although vertebrate fossils tended to indicate a Late
      Jurassic age for the upper member of the Shaximiao Formation".
  - id: buffetaut1999a
    notes: >
      Treats the lower and upper parts as separate formations of different
      ages, contrasting the Sao Khua sauropods with "the increasingly well
      known sauropods from the Middle Jurassic Xiashaximiao Formation and the
      Late Jurassic Shanshaximiao Formation of China".
