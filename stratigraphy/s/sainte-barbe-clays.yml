name: Sainte-Barbe Clays
rank: formation
period: [Late Jurassic, Early Cretaceous]
stages: [Barremian, Aptian]
references:
  - id: mcdonald2010b
    notes: >
      Gives Iguanodon bernissartensis as from "the Sainte-Barbe Clays
      Formation of Belgium".
  - id: bertozzo2025a
    notes: >
      Gives the age and the fuller name, Iguanodon and Mantellisaurus having
      co-existed in "the upper Barremian-lower Aptian Bernissart Sainte-Barbe
      Formation of Bernissart in Belgium".
  - id: yans2012a
    notes: >
      Dates the formation in the Iguanodon Sinkhole at Bernissart as "late
      Late Barremian to earliest Aptian" from its angiosperm pollen and carbon
      isotope trend, narrowing the conclusion of Robaszynski and colleagues
      (2001) that this formation "was Late Jurassic to Early Cretaceous in
      age".
  - id: robaszynski2001a
    notes: >
      A lithostratigraphic lexicon entry. Its age statement - "Late Jurassic
      ('Purbeckian') to Early Cretaceous (Aptian) and possibly even extending
      into Early Cenomanian" - follows a list of four formations and covers
      the Wealden-facies set as a whole rather than this one; the Barremian
      does not appear in it. What it gives precisely is the stratotype, "in
      the former Ste-Barbe pit of Bernissart where the iguanodontid dinosaurs
      were discovered".
