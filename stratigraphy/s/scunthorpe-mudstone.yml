name: Scunthorpe Mudstone
rank: formation
period: [Late Triassic, Early Jurassic]
stages: [Rhaetian, Hettangian, Sinemurian]
variants: [Scunthorpe Mudstones]
references:
  - id: ezcurra2020a
    notes: >
      Gives the Sarcosaurus type horizon as the "Bucklandi zone of the
      Scunthorpe Mudstone Formation, Lias Group, Early Jurassic (lowermost
      Sinemurian)" at Barrow upon Soar, Leicestershire.
  - id: cox1999a
    notes: >
      Defines the formation in the Lias Group, previously the "Scunthorpe
      Mudstones Formation (Gaunt et al., 1992)": type section the BGS
      Blyborough Borehole, "c. 51.57 m to 139.50 m depth", with the Fulbeck
      borehole F/B5 of Brandon and colleagues (1990) as primary reference
      section. It rests with a sharp contact on the Cotham or Langport Member
      of the Penarth Group and is "Up to 128 m" thick; its
      "Chronostratigraphy" is "Upper Triassic to Lower Jurassic, uppermost
      Rhaetian to Upper Sinemurian (Obtusum or Oxynotum Zone)". Members:
      Frodingham Ironstone, Foston, Beckingham, Granby, Barnby and Barnstone.
  - id: brandon1990a
    notes: >
      In a revised Lias scheme east of Nottingham that formally divides the
      beds below the Marlstone Rock Bed into two formations: "The Scunthorpe
      Mudstone Formation, forming the lower part of the sequence, is divided
      into five members for which Borehole F/B5, sunk on Fulbeck Airfield, is
      defined as the type section", about 113 m in all.
  - id: gaunt1992a
    notes: >
      As the "Scunthorpe Mudstones Formation", bases it in the Blyborough
      Borehole "at a depth of 139.50 m", where grey mudstone "rests with a
      sharp base on the Cotham Member of the Penarth Group"; "almost 90 m"
      thick in the south of the district, and "It ranges in age from late
      Rhaetian to late Sinemurian."
