name: Scunthorpe Mudstone
rank: formation
parent: Lias
period: [Late Triassic, Early Jurassic]
stages: [Rhaetian, Hettangian, Sinemurian]
variants: [Scunthorpe Mudstones]
lithology: mudstone with limestone beds
references:
  - id: ezcurra2020a
    notes: >
      Gives the Sarcosaurus type horizon as the "Bucklandi zone of the
      Scunthorpe Mudstone Formation, Lias Group, Early Jurassic (lowermost
      Sinemurian)" at Barrow upon Soar, Leicestershire.
  - id: cox1999a
    notes: >
      Defines the formation in the Lias Group, with its type section in the
      Blyborough Borehole, and dates it "uppermost Rhaetian to Upper Sinemurian
      (Obtusum or Oxynotum Zone)".
  - id: brandon1990a
    notes: >
      In a revised Lias scheme east of Nottingham that formally divides the beds
      below the Marlstone Rock Bed into two formations: "The Scunthorpe Mudstone
      Formation, forming the lower part of the sequence, is divided into five
      members for which Borehole F/B5, sunk on Fulbeck Airfield, is defined as
      the type section", about 113 m in all. Source of the lithology.
  - id: gaunt1992a
    notes: >
      As the "Scunthorpe Mudstones Formation", bases it in the Blyborough
      Borehole "at a depth of 139.50 m", where grey mudstone "rests with a
      sharp base on the Cotham Member of the Penarth Group"; "almost 90 m"
      thick in the south of the district, and "It ranges in age from late
      Rhaetian to late Sinemurian."
