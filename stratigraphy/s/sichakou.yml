name: Sichakou
rank: member
parent: Huajiying
period: [Early Cretaceous]
stages: [Hauterivian]
references:
  - id: xing2020a
    notes: >
      Places it and the Qiaotou as the two members of the lower Huajiying
      Formation in the Sichakou Basin of Fengning Autonomous County, Hebei:
      vertebrate fossils occur "in the lower part of the formation (Sichakou
      and Qiaotou members) dated by 40Ar/39Ar to the weighted mean age of
      130.7 Mya". Gives the Protopteryx horizon in the lacustrine shales as
      "Sichakou member (Hauterivian, Lower Cretaceous)".
  - id: jin2008a
    notes: >
      Uses the fuller name, "Sichakou Sedimentary Member of the Early
      Cretaceous Huajiying Formation in the Sichakou basin, Fengning, Hebei",
      and sets it above the First Volcanic Member of the same formation.
