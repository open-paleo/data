name: Serra da Galga
rank: formation
parent: Bauru
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
dispute:
  summary: >
    Formation or member of the Marília. Cavalcanti and colleagues (2026) list
    it as one of four formations of the Bauru Group, alongside the Marília
    rather than inside it. Santucci and colleagues (2022) instead write
    "Serra da Galga Member, Marília Formation, Bauru Group, Maastrichtian".
    Under the formation reading the parent is the Bauru Group; under the
    other it would be the Marília.
references:
  - id: cavalcanti2026a
    notes: >
      Lists it at formation rank among the Bauru Group's four formations.
  - id: santucci2022a
    notes: >
      Uses member rank under the Marília, with a Maastrichtian age.
  - id: silvajunior2022a
    notes: >
      Places it at formation rank in the Bauru Group, giving "Serra da Galga
      Formation (Bauru Group, Late Cretaceous)".
  - id: silvajunior2021a
    notes: >
      Calls the formation "almost consensually accepted as of
      Campanian-Maastrichtian age", citing Soares and colleagues (2021).
  - id: soares2020a
    notes: >
      The erecting paper, and the source of the rank the entry uses. It shows
      "how the previously named Serra da Galga and Ponte Alta members reveal
      a unique set of lithological, architectural, and genetic signatures
      that permits to separate them from the Marilia Formation", and proposes
      "a new lithostratigraphic classification for the unit ... the Serra da
      Galga Formation". The scheme it replaces is Barcelos (1984), who
      "organized the formation into three members: the Echapora Member in the
      southeastern and northwestern parts, and the Serra da Galga and Ponte
      Alta members restricted to the northeastern part", so the new formation
      takes in the former Serra da Galga and Ponte Alta while the Echapora
      stays with the Marilia. Sources that still use member rank are
      following the older scheme rather than disputing this one.
      It gives this unit no stage. Its only age statement is for the basin,
      which "evolved from the Coniacian to the Maastrichtian, based on
      biostratigraphic information ... and absolute dating of igneous
      intrusions close to the margins of the basin", and it contains no
      Campanian at all.
