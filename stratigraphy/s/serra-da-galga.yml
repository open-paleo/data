name: Serra da Galga
rank: formation
parent: Bauru
period: [Late Cretaceous]
stages: [Maastrichtian]
dispute:
  summary: >
    Formation or member of the Marília. Cavalcanti and colleagues (2026) list
    it as one of four formations of the Bauru Group, alongside the Marília
    rather than inside it. Santucci and Filippi (2022) instead write
    "Serra da Galga Member, Marília Formation, Bauru Group, Maastrichtian".
    Under the formation reading the parent is the Bauru Group; under the
    other it would be the Marília.
references:
  - id: cavalcanti2026a
    notes: >
      Lists it at formation rank among the Bauru Group's four formations.
  - id: santucci2022a
    notes: >
      Uses member rank under the Marília: "Serra da Galga Member, Marília
      Formation, Bauru Group, Maastrichtian", a locality line citing
      Dias-Brito and colleagues (2001) and Dias and colleagues (2020) for the
      age rather than re-examining it.
  - id: silvajunior2022a
    notes: >
      Places it at formation rank in the Bauru Group, giving "Serra da Galga
      Formation (Bauru Group, Late Cretaceous)".
  - id: silvajunior2021a
    notes: >
      Calls the formation "almost consensually accepted as of
      Campanian-Maastrichtian age", citing Soares and colleagues (2020). That
      paper gives the unit no stage and names no Campanian, so the citation
      does not carry the range.
  - id: soares2020a
    notes: >
      The erecting paper, and the source of the unit's formation rank. It shows
      "how the previously named Serra da Galga and Ponte Alta members reveal
      a unique set of lithological, architectural, and genetic signatures
      that permits to separate them from the Marilia Formation", and proposes
      "a new lithostratigraphic classification for the unit ... the Serra da
      Galga Formation". The scheme it replaces is Barcelos (1984), who
      "organized the formation into three members: the Echapora Member in the
      southeastern and northwestern parts, and the Serra da Galga and Ponte
      Alta members restricted to the northeastern part", so the new formation
      takes in the former Serra da Galga and Ponte Alta while the Echapora
      stays with the Marilia. Sources that still use member rank are
      following the older scheme rather than disputing this one.
      It gives this unit no stage. Its only age statement is for the basin,
      which "evolved from the Coniacian to the Maastrichtian, based on
      biostratigraphic information ... and absolute dating of igneous
      intrusions close to the margins of the basin", and it contains no
      Campanian at all.
  - id: barcelos1984a
  - id: santucci2001a
    notes: >
      Dates the base of the unit, then the Serra da Galga Member of the
      Marília Formation, by Aeolosaurus: "the base of the Serra da Galga
      Member ... indicates a Late Campanian/Early Maastrichtian age for this
      portion of the Bauru Group", stated also in the Latinate form
      "Neocampanian/Eomaastrichtian", where the prefixes mean late and early.
      The basis has since been withdrawn: Martinelli and colleagues (2011)
      find "no characters indicating the presence of this Patagonian genus in
      the Late Cretaceous of Brazil", so the Aeolosaurus biochron no longer
      dates the unit.
  - id: santucci2006a
    notes: >
      Reports that "The most recent papers argue for a late Campanian ⁄ early
      Maastrichtian age", suggested "for the upper Adamantina Formation near
      Monte Alto and the lower Marília Formation (Serra da Galga Member) in
      Uberaba", citing Santucci and Bertini (2001) among others.
  - id: dias-brito2001a
    notes: >
      Dates the upper part by charophytes and ostracods: Amblyochara sp. and
      Neuquenocypris minor mineira nov. subsp., from the Ponte Alta Member,
      are "Maastrichtian (probably Late Maastrichtian) in age", against a
      Turonian-Santonian assemblage in the Adamantina Formation below; "a
      hiatus, encompassing more than 11 Ma, separates those two formations."
  - id: dias2020a
    notes: >
      Describes the Marília Formation in the Triângulo Mineiro, where of its
      three members the Serra da Galga and Ponte Alta "occur only", as "the
      youngest among the Cretaceous formations of the region, with a
      Maastrichtian age", following Dias-Brito and colleagues (2001).
  - id: arai2023a
    notes: >
      A stratigraphic revision of the Bauru Supersequence that treats this
      unit and the Marília as separate formations. "Micropaleontology of
      charophytes and ostracods has indicated Maastrichtian (upper
      Maastrichtian?) strata in the Serra da Galga Formation", and with the
      units' arrangement this gives "a Maastrichtian (late Maastrichtian?)
      age for the Marília and Serra da Galga formations". Beneath them, "The
      maximum pre-Marília/Serra da Galga hiatus would involve the
      mid-Campanian to early Maastrichtian time interval."
  - id: martinelli2011a
    notes: >
      Re-examines the Brazilian titanosaur material referred to Aeolosaurus,
      including the specimens behind the Aeolosaurus age for the base of the
      former Serra da Galga Member, and finds "no characters indicating the
      presence of this Patagonian genus in the Late Cretaceous of Brazil".
  - id: menegazzo2016a
    notes: >
      Records that "The genus Aeolosaurus has been used to attribute
      Campanian–Maastrichtian to the Adamantina and Marília formations",
      noting that on Martinelli and colleagues (2011) "the evidence of this
      genus in the Bauru Basin is inconclusive", and that earlier ostracod
      and charophyte work gave "the Marília Formation" as "Maastrichtian".
      On its fish, charophytes and ostracods "Maastrichtian age is indicated
      for the Marília Formation", in the sense that still included this unit.
