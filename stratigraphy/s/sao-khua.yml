name: Sao Khua
rank: formation
period: [Early Cretaceous]
stages: [Valanginian, Hauterivian, Barremian]
references:
  - id: tucker2022a
    notes: >
      Dates the formation by detrital zircon U-Pb. The youngest three concordant
      grains give a maximum depositional age of 133.8 (±1.8) Ma for the middle
      Sao Khua, and 132.4 (±2.0) Ma for the base of the overlying Phu Phan
      Formation. The authors read both young populations as
      "near-contemporaneous with regional volcanic activity and near-synchronous
      with sedimentation", and conclude "a tightly constrained late
      Valanginian–early Hauterivian age of 133.6–132.1 Ma for Sao Khua
      Formation", setting it against the late Barremian of Tumpeesuwan and
      colleagues (2010) and the papers that follow it. Even at its error limit
      the middle Sao Khua age, 135.6 Ma, is younger than the base of the
      Valanginian on the ICS chart v2024/12, so it excludes the Berriasian for
      that part of the unit; the late Barremian stays on the bivalve
      correlation, since a maximum depositional age does not by itself rule out
      a younger age.
  - id: gale2020a
    notes: >
      The Valanginian "started at 137.7 ± 0.5 Ma", and the Hauterivian "ranges
      from 132.6 ± 0.6 to 126.5 ± 0.7 Ma".
  - id: buffetaut2009a
    notes: >
      Brackets it rather than dating it directly: the formation "can thus be
      considered as later than earliest Cretaceous and earlier than Aptian",
      which leaves Valanginian to Barremian. Records the
      "Valanginian–Hauterivian age" that Buffetaut and Suteethorn (1999)
      suggested, adding that the formation "may be somewhat younger
      (Barremian?)".
  - id: samathi2019a
    notes: >
      Narrows it within that, "Sao Khua Formation, probably upper Barremian,
      Lower Cretaceous", following the late Barremian age Tumpeesuwan and
      colleagues (2010) drew from non-marine bivalves.
  - id: buffetaut1999a
    notes: >
      Brackets the unit by excluding both ends: "The Sao Khua Formation can
      therefore safely be placed in the Lower Cretaceous. Its exact age is
      still somewhat uncertain: it is probably younger than Berriasian and
      older than Aptian." Both limits are exclusive, so what is left is
      Valanginian to Barremian, and the whole is hedged by "probably". That
      span contains the late Valanginian–early Hauterivian zircon age of
      Tucker and colleagues (2022).
  - id: tumpeesuwan2010a
    notes: >
      Supports one stage, by faunal correlation: "The temporal distribution of
      this subgenus is limited to the Late Barremian Formations of Japan and
      Korea, thus we suggest a Late Barremian age for the Sao Khua Formation",
      the subgenus being Pseudohyria (Matsumotoina). That is a bivalve
      correlation to other basins, a different class of evidence from the
      detrital-zircon ages of Tucker and colleagues (2022) and Jia and
      colleagues (2022). The author's name is misspelled Tumpeesawan where
      Samathi and colleagues (2019) relay this work.
  - id: racey1996a
    notes: >
      Sets aside the Late Jurassic age that Buffetaut and Ingavat (1986) and
      Buffetaut and colleagues (1993) drew from the vertebrate fauna: "the Sao
      Khua Formation is probably Early Cretaceous in age rather than Late
      Jurassic", although the sauropods on their own "would indicate a Late
      Jurassic to Early Cretaceous age", the span the palynology of Hahn
      (1982) also gave. Bracketed below by palynomorphs from the underlying
      Phra Wihan Formation, which show it "is no older than Early Cretaceous
      in age", and above by the Aptian Khok Kruat Formation, "the Sao Khua
      Formation must fall within the age range Berriasian-Aptian". Both ends
      of that range are the ages of the adjacent formations, so it bounds the
      unit rather than dating it; Buffetaut and colleagues (2009) state the
      upper bound exclusively.
  - id: hahn1982a
  - id: buffetaut1986b
    notes: >
      Dates the unit by the Phu Wiang vertebrates, a floodplain assemblage the
      paper finds "very similar to assemblages from well-known late Jurassic
      localities in western North America (Morrison Formation) and China
      (Shangshaximiao Formation of Sichuan)": "Its vertebrate fauna thus
      indicates a late Jurassic age for the Sao Khua Formation, which is in
      agreement with other palaeontological and magnetostratigraphical
      evidence". Names no stage.
  - id: buffetaut1993a
  - id: martin1994a
    notes: >
      "Magnetostratigraphic data suggest a somewhat older, Middle Jurassic,
      age", following Maranate and Vella (1986), against the Late Jurassic the
      formation "was usually thought to be ... on the basis of its vertebrate
      fauna" and the Early Cretaceous that palynology of the underlying Phra
      Wihan Formation implies. "Pending a clarification of its geological age,
      the Sao Khua Formation will be considered here as Late Jurassic to Early
      Cretaceous in age." Martin and colleagues date the magnetostratigraphy
      1982 in their text but list Maranate and Vella's 1986 study in their
      references; Racey and colleagues (1996) report the same work and supply
      the stages, "Maranate and Vella (1986) suggested a Middle Jurassic
      (Bathonian-Callovian) age for the Sao Khua Fm on the basis of
      palaeomagnetic data".
  - id: jia2022a
    notes: >
      Puts a radiometric floor under the Early Cretaceous reading. Detrital
      zircon U-Pb gives "maximum possible depositional ages of approximately
      208, approximately 154, and approximately 140 Ma for the Nam Phong
      Formation, Phu Kradung Formation, and Sao Khua Formation,
      respectively, indicating that the Phra Wihan Formation and the
      overlying Sao Khua Formation are Early Cretaceous deposits", the 140 Ma
      peak "constraining the lower limit of its depositional age to the Early
      Cretaceous, which is generally consistent with previous interpretations
      based on paleontological data that it approximately belongs to the
      Berriasian to Barremian stages". The Berriasian to Barremian is the
      paleontological reading it compares with rather than its own result,
      which is a floor of about 140 Ma. The constraint is geochronological and
      not magnetostratigraphic: the paper's paleomagnetic samples from its
      three sites in this formation "did not yield meaningful paleomagnetic
      results".
  - id: maranate1986a
