name: Sao Khua
rank: formation
period: [Early Cretaceous]
stages: [Valanginian, Hauterivian]
lithology: sandstone and floodplain mudstone
references:
  - id: tucker2022a
    notes: >
      Dates the formation by detrital zircon U-Pb, with a maximum depositional
      age of 133.8 (±1.8) Ma for its middle part, and concludes on a "late
      Valanginian–early Hauterivian age".
  - id: gale2020a
    notes: >
      The Valanginian "started at 137.7 ± 0.5 Ma", and the Hauterivian "ranges
      from 132.6 ± 0.6 to 126.5 ± 0.7 Ma".
  - id: buffetaut2009a
    notes: >
      Brackets it rather than dating it directly: the formation "can thus be
      considered as later than earliest Cretaceous and earlier than Aptian",
      which leaves Valanginian to Barremian. Credits a
      "Valanginian–Hauterivian age" to Buffetaut and Suteethorn (1999), who
      give only "probably younger than Berriasian and older than Aptian", and
      adds that the formation "may be somewhat younger (Barremian?)".
  - id: samathi2019a
    notes: >
      Narrows it within that, "Sao Khua Formation, probably upper Barremian,
      Lower Cretaceous", following the late Barremian age Tumpeesuwan and
      colleagues (2010) drew from non-marine bivalves.
  - id: buffetaut1999a
    notes: >
      Places the formation in the Lower Cretaceous, "probably younger than
      Berriasian and older than Aptian".
  - id: tumpeesuwan2010a
    notes: >
      Names the bivalve Pseudohyria (Matsumotoina) somanai from the formation
      and suggests a late Barremian age from the range of its subgenus in Japan
      and Korea.
  - id: racey1996a
    notes: >
      Sets aside the Late Jurassic age drawn from the vertebrates and places the
      formation "within the age range Berriasian-Aptian" from the ages of the
      units below and above. Source of the lithology.
  - id: hahn1982a
  - id: buffetaut1986b
    notes: >
      Dates the formation late Jurassic from its vertebrate fauna, which it
      compares with those of the Morrison and Shangshaximiao formations; names
      no stage.
  - id: buffetaut1993a
  - id: martin1994a
    notes: >
      Treats the formation as Late Jurassic to Early Cretaceous "pending a
      clarification of its geological age", noting a Middle Jurassic
      magnetostratigraphic reading.
  - id: jia2022a
    notes: >
      Gives the formation a detrital-zircon maximum depositional age of about
      140 Ma, which places it in the Early Cretaceous.
  - id: maranate1986a
