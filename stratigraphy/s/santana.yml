name: Santana
rank: group
period: [Early Cretaceous]
stages: [Aptian]
description: "The Santana Group is a geologic group, formerly included as the middle part of the Araripe Group, in the Araripe Basin of northeastern Brazil. The group comprises the Crato, Ipubi and Romualdo Formations. The formations of the group were deposited in a lacustrine to subtidal shallow marine environment in the Araripe rift basin. The Santana Group has provided a rich assemblage of fossils; flora, fish, arthropods, insects, turtles, snakes, dinosaurs including Irritator, and pterosaurs such as Thalassodromeus. The Romualdo and Crato Formations are renowned for their excellent conservation and designated Lagerstätten."
references:
  - id: sayão2020a
    notes: >
      Gives the group and its formations: "there is a consensus to consider
      the former Santana Formation as the Santana Group, that is further
      divided from base to top, into the Barbalha, Crato, Ipubi and Romualdo
      formations".
  - id: arai2020a
    notes: >
      Dates the group on palynology: "the entire Santana Group is of Aptian
      age because of the conspicuous presence of Sergipea variverrucata", and
      reports the group rank as the elevation of the old Santana Formation's
      four members to formations.
  - id: kellner2011b
    notes: >
      Uses the group scheme: "the Albian Romualdo Formation of the Santana
      Group".
