name: Santana
rank: group
period: [Early Cretaceous]
stages: [Aptian]
references:
  - id: sayão2020a
    notes: >
      Gives the group and its formations: "there is a consensus to consider
      the former Santana Formation as the Santana Group, that is further
      divided from base to top, into the Barbalha, Crato, Ipubi and Romualdo
      formations".
  - id: arai2020a
    notes: >
      Dates the group on palynology: "the entire Santana Group is of Aptian
      age because of the conspicuous presence of Sergipea variverrucata", and
      reports the group rank as the elevation of the old Santana Formation's
      four members to formations.
  - id: kellner2011b
    notes: >
      Uses the group scheme: "the Albian Romualdo Formation of the Santana
      Group".
