name: Suining
rank: formation
period: [Late Jurassic, Early Cretaceous]
stages: [Tithonian, Berriasian]
lithology: red mudstone, with interbedded arkosic sandstone and siltstone
dispute:
  summary: >
    Late Jurassic, Jurassic–Cretaceous, or Aptian and younger. Xing and
    colleagues (2015) and Wei and colleagues (2025) place the formation in the
    Late Jurassic on its ostracods and dinosaurs; Huang and colleagues (2021)
    put the Jurassic–Cretaceous boundary in its upper part on conchostracans
    and ostracods. Liu and colleagues (2017) and Wang and colleagues (2019)
    give maximum depositional ages of about 120 Ma for the lower formation and
    114.4 ± 1.1 Ma for a higher bed, both Aptian, which would exclude a
    Jurassic age.
references:
  - id: wang2019c
    notes: >
      Dates zircons from a tuffaceous sandstone in the middle of the formation
      at 114.4 ± 1.1 Ma, a maximum depositional age, and correlates it with
      "other Lower Cretaceous (Aptian) units".
  - id: moore2020a
    notes: >
      Places it in the succession, the formation "overlies the Shaximiao
      Formation and has yielded Qijianglong and M. anyuensis". This is the
      date that makes the Mamenchisaurus species span an implausible interval,
      recorded on that genus's dispute.
  - id: xing2015a
    notes: >
      "Based on the lithology and the characteristics of associated
      ostracods, the stratigraphic age of the Suining Formation is
      definitively Upper Jurassic".
  - id: wei2025a
    notes: >
      "Most of the sedimentology studies assigned the Suining Formation to
      the Upper Jurassic but some chemical analyses of zircon U-Pb dating
      indicated that it belongs to the Lower Cretaceous".
  - id: gu1997a
    notes: >
      Source of the lithology.
  - id: liu2017a
    notes: >
      Detrital zircons from the lower formation give a maximum depositional
      age of about 120 Ma, from which it concludes the formation "includes a
      Lower Cretaceous component".
  - id: huang2021a
    notes: >
      Places the Jurassic–Cretaceous boundary in the upper Suining, at the
      appearance of early Djungarica ostracods and Eosestheriopsis
      conchostracans.
