name: Suining
rank: formation
period: [Late Jurassic, Early Cretaceous]
stages: [Aptian]
references:
  - id: wang2019c
    notes: >
      Dates it by zircon: "our new and more precise zircon U-Pb zircon age
      data allow novel correlation of the Suining Formation with other Lower
      Cretaceous (Aptian) units". Records the older dating it replaces, that
      the formation "was proposed to be Late Jurassic based on lateral
      correlations of the bivalve, Estheria, ostracod and vertebrate
      assemblages", and still labels it "Upper Jurassic Suining Formation" in
      its map, following "the traditional classification of these formations".
      Records that Mamenchisaurus anyuensis "is known from the top of the
      Suining Formation and the bottom of the Penglaizhen Formation in Anyue
      County".
  - id: moore2020a
    notes: >
      Places it in the succession, the formation "overlies the Shaximiao
      Formation and has yielded Qijianglong and M. anyuensis". This is the
      date that makes the Mamenchisaurus species span an implausible interval,
      recorded on that genus's dispute.
