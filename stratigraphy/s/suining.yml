name: Suining
rank: formation
period: [Late Jurassic]
dispute:
  summary: >
    Lithology and ostracods place the formation in the Upper Jurassic (Xing
    and colleagues 2015; Wei and colleagues 2025). Wang and colleagues
    (2019) date its youngest detrital zircons at a mean of 114.4 ± 1.1 Ma,
    Aptian on the ICS chart v2024/12, and correlate it with Lower Cretaceous
    units; as a maximum depositional age, that figure would exclude the Late
    Jurassic.
references:
  - id: wang2019c
    notes: >
      Dates it by zircon: "our new and more precise zircon U-Pb zircon age
      data allow novel correlation of the Suining Formation with other
      Lower Cretaceous (Aptian) units". Records the dating it argues
      against, that the formation "was proposed to be Late Jurassic based
      on lateral correlations of the bivalve, Estheria, ostracod and
      vertebrate assemblages", and still labels it "Upper Jurassic Suining
      Formation" in its map, following "the traditional classification of
      these formations". Records that Mamenchisaurus anyuensis "is known
      from the top of the Suining Formation and the bottom of the
      Penglaizhen Formation in Anyue County". The zircon age, "mean ages
      of 114.4±1.1 Ma", is a maximum depositional age and does not by
      itself date the formation.
  - id: moore2020a
    notes: >
      Places it in the succession, the formation "overlies the Shaximiao
      Formation and has yielded Qijianglong and M. anyuensis". This is the
      date that makes the Mamenchisaurus species span an implausible interval,
      recorded on that genus's dispute.
  - id: xing2015a
    notes: >
      "Based on the lithology and the characteristics of associated
      ostracods, the stratigraphic age of the Suining Formation is
      definitively Upper Jurassic".
  - id: wei2025a
    notes: >
      "Most of the sedimentology studies assigned the Suining Formation to
      the Upper Jurassic but some chemical analyses of zircon U-Pb dating
      indicated that it belongs to the Lower Cretaceous".
