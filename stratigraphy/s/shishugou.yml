name: Shishugou
rank: formation
period: [Middle Jurassic, Late Jurassic]
stages: [Bathonian, Callovian, Oxfordian]
lithology: sandstone, siltstone and mudstone, with minor limestone lenses
references:
  - id: moore2020a
    notes: >
      Calls it the "Middle-Late Jurassic Shishugou Formation" and splits it by
      level: Klamelisaurus from the lower part is "late Callovian" while
      Mamenchisaurus sinocanadorum "was collected from its middle or upper
      beds (Oxfordian ...)".
  - id: moore2018a
    notes: >
      Dates the Bellusaurus quarry, between tuffs of 162.2 and 159.7 Ma at
      Wucaiwan, and "much of the Shishugou Formation" to the "earliest
      Oxfordian".
  - id: eberth2001a
    notes: >
      Relays a Bathonian to Oxfordian age for the Shishugou Megasequence, at
      Huoxiaoshan the formation alone, and splits its fauna into Middle and Late
      Jurassic assemblages after Dong (1992).
  - id: dong1992a
  - id: upchurch2005a
  - id: hesselbo2020a
    notes: >
      Puts the base of the Oxfordian at 161.5 Ma, against 163.5 Ma in GTS2012.
  - id: currie1993c
    notes: >
      Source of the lithology.
