name: Shishugou
rank: formation
period: [Middle Jurassic, Late Jurassic]
stages: [Aalenian, Bajocian, Bathonian, Callovian, Oxfordian]
references:
  - id: moore2020a
    notes: >
      Calls it the "Middle-Late Jurassic Shishugou Formation" and splits it by
      level: Klamelisaurus from the lower part is "late Callovian" while
      Mamenchisaurus sinocanadorum "was collected from its middle or upper
      beds (Oxfordian".
  - id: moore2018a
    notes: >
      Places its material "within the earliest Oxfordian": radiometric ages of
      162.2 ± 0.2 and 159.7 ± 0.3 Ma for the T-1 and T-BW tuffs at Wucaiwan
      put "the Bellusaurus quarry, and much of the Shishugou Formation, within
      the earliest Oxfordian (early Late Jurassic)". Sets that against
      "earlier studies that considered the Shishugou Formation to be as old as
      Aalenian in age", following Upchurch and Barrett (2005).
  - id: eberth2001a
    notes: >
      Splits its fauna by age, following Dong (1992): "The Middle Jurassic
      vertebrate assemblage from the Shishugou Formation in northeastern
      Junggar consists of fish, lungfish, turtles, crocodilians, amphibians,
      small sauropods, theropods, hypsilophodontids, ankylosaurs, therapsids,
      and lizards", while "The Late Jurassic assemblage from the Shishugou
      Formation is less diverse". The Shishugou Megasequence, which at
      Huoxiaoshan is made up of the 450-m-thick formation alone, "is regarded
      as Bathonian to Oxfordian in age".
  - id: dong1992a
