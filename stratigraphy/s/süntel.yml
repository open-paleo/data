name: Süntel
rank: formation
period: [Late Jurassic]
stages: [Kimmeridgian]
references:
  - id: zuo2017a
    notes: >
      The dedicated sedimentology of the Kimmeridgian carbonate ramp of the
      Lower Saxony Basin, covering "the Lower to Middle Süntel Formation"
      above the Korallenoolith Formation, their boundary diachronous and
      "corresponding to the Oxfordian-Kimmeridgian boundary or Early
      Kimmeridgian". The formation is constrained by the ostracod genus
      Macrodentina, ostracod zones 9 to 12 marking the Lower Süntel in the
      Langenberg section.
  - id: hornung2012a
    notes: >
      Gives the outcrop pattern in Lower Saxony, the unit buried across wide
      areas but exposed in local uplifts including the southeastern Süntel,
      the Deister, the Bückeberge and the Hils mountains.
beds:
  - name: '83'
    informal: true
    period: [Late Jurassic]
    stages: [Kimmeridgian]
    references:
      - id: evers2020a
        notes: >
          Corrects which bed of the Langenberg quarry section the vertebrates come
          from: after the subdivision of Fischer (1991), "most of the terrestrial
          vertebrate remains (including the sauropod dinosaur Europasaurus
          holgeri and all theropod bones) were found in bed 83, not in bed 93 as
          erroneously stated in some publications". A light grey-greenish marly
          limestone assigned to the "Mittleres Kimmeridge", "a northwest-German
          equivalent to the lower part of the upper Kimmeridgian". The bone-rich
          sections are 30 to 50 cm thick.
      - id: sander2006a
        notes: >
          Carries the superseded number, giving the Europasaurus horizon as "Late
          Jurassic, middle Kimmeridgian marine carbonate rock, bed 93 of section
          at Langenberg quarry".
      - id: carballido2013a
        notes: >
          Repeats the superseded number in its own emended horizon statement,
          "Late Jurassic, middle Kimmeridgian marine carbonate rocks, bed 93 of
          section at Langenberg Quarry".
      - id: zuo2017a
        notes: >
          Places the Kimmeridgian of the Langenberg section in the Süntel
          Formation: ostracod zones 9 to 12 of that section correspond to the
          Lower Süntel Formation.
      - id: fischer1991a
