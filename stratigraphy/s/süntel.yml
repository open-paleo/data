name: Süntel
rank: formation
period: [Late Jurassic]
stages: [Kimmeridgian]
references:
  - id: zuo2017a
    notes: >
      Studies the Kimmeridgian carbonate ramp of the Lower Saxony Basin,
      covering "the Lower to Middle Süntel Formation", and dates the formation
      by Macrodentina ostracod zones; it "covers early to late Kimmeridgian
      time".
  - id: gramann1997a
    notes: >
      Cited by Zuo and colleagues (2017) for the correlation of the North
      German ostracod zonation with the Boreal ammonite zones.
  - id: hornung2012a
    notes: >
      Gives the outcrop pattern in Lower Saxony, the unit buried across wide
      areas but exposed in local uplifts including the southeastern Süntel,
      the Deister, the Bückeberge and the Hils mountains.
beds:
  - name: '83'
    informal: true
    period: [Late Jurassic]
    stages: [Kimmeridgian]
    references:
      - id: evers2020a
        notes: >
          Places the vertebrates, including Europasaurus, in bed 83 of Fischer's
          (1991) section, not bed 93: a light gray-green marly limestone of the
          "Mittleres Kimmeridge".
      - id: sander2006a
        notes: >
          Carries the superseded number, giving the Europasaurus horizon as "Late
          Jurassic, middle Kimmeridgian marine carbonate rock, bed 93 of section
          at Langenberg quarry".
      - id: carballido2013a
        notes: >
          Repeats the superseded number in its own emended horizon statement,
          "Late Jurassic, middle Kimmeridgian marine carbonate rocks, bed 93 of
          section at Langenberg Quarry".
      - id: zuo2017a
        notes: >
          Places the Kimmeridgian of the Langenberg section in the Süntel
          Formation: ostracod zone 9 of that section falls in the Lower Süntel
          and zones 13 to 14 in the Middle Süntel.
      - id: fischer1991a
