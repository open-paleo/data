name: Smoky Hill Chalk
rank: member
parent: Niobrara Chalk
period: [Late Cretaceous]
stages: [Coniacian, Santonian, Campanian]
lithology: olive-gray, flaky-weathering impure chalk
references:
  - id: carpenter2007b
    notes: >
      Gives "Smoky Hill Chalk, Niobrara Formation, Cretaceous, Coniacian".
  - id: pittman2020c
    notes: >
      Names it as the "Smoky Hill Chalk Member of the Niobrara Formation" and,
      after Bell and Chiappe (2015), dates it "late Coniacian–early
      Campanian", a range that takes in the Santonian.
  - id: bell2015b
    notes: >
      A species-level phylogeny that does not name this member and mentions
      the Niobrara only once.
  - id: clarke2004a
    notes: >
      Dates the whole member "upper Coniacian–lower Campanian" after Stewart and
      colleagues (1990), and puts Marker Units 15–20, which yielded most of its
      vertebrates, in the late Santonian–early Campanian.
  - id: stewart1990b
  - id: stewart1990a
  - id: hattin1982a
    notes: >
      Describes the member in its Kansas type area from a 181.8 m composite
      section, and dates it "Coniacian-Campanian" from the Western Interior
      inoceramid and ammonite zones. Source of the lithology.
  - id: bennett1990a
