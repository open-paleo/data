name: Smoky Hill Chalk
rank: member
parent: Niobrara Chalk
period: [Late Cretaceous]
stages: [Coniacian, Santonian, Campanian]
references:
  - id: carpenter2007b
    notes: >
      Gives "Smoky Hill Chalk, Niobrara Formation, Cretaceous, Coniacian".
  - id: pittman2020a
    notes: >
      Names it as the "Smoky Hill Chalk Member of the Niobrara Formation" and,
      after Bell and Chiappe (2015), dates it "late Coniacian–early
      Campanian", a range that takes in the Santonian.
  - id: bell2015b
    notes: >
      A species-level phylogeny that does not name this member; the Niobrara
      appears once in some 67,000 characters. It contributes nothing to the
      entry's age.
  - id: clarke2004a
    notes: >
      "The entire Smoky Hill Chalk Member of the Niobrara Formation is upper
      Coniacian–lower Campanian in age (Stewart et al., 1990)", and "The top
      of the Smoky Hill Chalk Member, close to Marker Unit 23 of Hattin
      (1982), is in the early Campanian". Within the member, Stewart (1990)
      put the interval containing Marker Units 8 to 10 of Hattin (1982) in the
      upper Santonian, so the overlying Marker Units 15 to 20, the source of
      nearly all the fossil vertebrates after Bennett (1990), must be "at the
      earliest, from later in the upper Santonian through the early
      Campanian".
  - id: stewart1990b
  - id: stewart1990a
  - id: hattin1982a
    notes: >
      Works out the age in the Kansas type area from the Western Interior
      inoceramid and ammonite zones, converting each zone to a stage: "Strata
      of the Smoky Hill Chalk Member (Coniacian-Campanian) are exposed
      extensively in the type area, where 12 key sections are the basis for a
      composite section that is 181.8 m (596.3 ft) thick." The base falls at
      the bottom of the Inoceramus (Volviceramus) grandis Range Zone, which
      "places the contact close to the Lower/Upper Coniacian boundary", and
      the highest, fossil-poor beds "are also assignable to the Lower
      Campanian".
  - id: bennett1990a
