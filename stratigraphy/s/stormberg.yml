name: Stormberg
rank: group
informal: true
period: [Late Triassic, Early Jurassic]
stages: [Carnian, Norian, Rhaetian, Hettangian, Sinemurian, Pliensbachian]
references:
  - id: bordy2020a
    notes: >
      Uses the group for the Molteno, Elliot and Clarens formations, in "the
      Upper Triassic–Lower Jurassic Stormberg and Drakensberg groups (Karoo
      Supergroup)".
  - id: visser1984a
    notes: >
      Reports that the South African Committee for Stratigraphy "discarded the
      name 'Stormberg'", retains it for "all the sedimentary rocks from the
      base of the Molteno to the top of the Cave Sandstone", and dates the
      Molteno Carnian.
  - id: lucas2001a
    notes: >
      Calls it "the now defunct 'Stormberg Group'".
