name: Solnhofen Lithographic Limestone
rank: formation
period: [Late Jurassic]
stages: [Kimmeridgian, Tithonian]
variants: [Altmühltal, Solnhofen Limestone, Solnhofen Formation]
references:
  - id: chen1998a
    notes: >
      Dates it "(Early Tithonian)" while comparing the Chinese bird-bearing
      beds against it.
  - id: chiappe2010a
    notes: >
      Gives the German name alongside, "the Solnhofen Lithographic
      Limestones (Solnhofener Plattenkalk)", and places the Stark Quarry top
      limestones, uppermost Kimmeridgian, slightly older than them.
  - id: holtz2004a
    notes: >
      A reference work, hedging between two stages for the Compsognathus type
      horizon, "the Kimmeridgian or basal Tithonian Solnhofen Lithographic
      Limestone of Jachenhausen". Not unioned, since the hedge is between
      stages rather than across them.
  - id: pittman2020a
    notes: >
      Equates the traditional name with the Altmühltal Formation, which is
      entered separately under that name, and tabulates the unit as "Late
      Jurassic", "Tithonian".
  - id: foth2025a
    notes: >
      Dates the southern Franconian "partially laminated, partially silty
      limestones of late Kimmeridgian to early Tithonian age, commonly
      referred to as the 'Solnhofen limestone'", and states that the base of
      the Altmühltal Formation, which holds the Solnhofen limestone sensu
      stricto, "begins with the latest Kimmeridgian".
