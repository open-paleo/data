name: St. Mary River
rank: formation
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
references:
  - id: brown2015a
    notes: >
      Gives "St. Mary River Formation (Maastrichtian".
  - id: voris2020a
    notes: >
      Spans the boundary, treating the formation "of southernmost Alberta and
      northern Montana" as potentially recording taxa that "persisted from the
      late Campanian into the early Maastrichtian".
  - id: brown1942a
    notes: >
      Gives the Leptoceratops cerorhynchus horizon as "St. Mary River
      formation, Upper Cretaceous, near Buffalo Lake, Blackfeet Indian
      Reservation, Montana", the skeleton coming from "the lower part of the
      St. Mary River formation".
  - id: pittman2020a
    notes: >
      Dates it jointly with two other Alberta units, listing Troodon material
      from "the Campanian-Maastrichtian Wapiti, Horseshoe Canyon and St. Mary
      River formations of Alberta, Canada".
