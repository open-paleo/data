name: Sudmoor Point Sandstone
rank: member
informal: true
parent: Wessex
period: [Early Cretaceous]
stages: [Hauterivian, Barremian]
dispute:
  summary: >
    Jacobs and colleagues (2023) place the Hauterivian–Barremian boundary "a
    short distance above the Sudmoor Point Sandstone", on palaeomagnetic
    results given as a personal communication; Martill (2015) holds that "the
    exposed Wessex Formation is entirely Barremian", and Longrich and
    colleagues (2024) date the exposures to "probably either earliest
    Barremian or latest Hauterivian".
references:
  - id: longrich2024c
    notes: >
      Dates the exposures, which "probably date to around 125-126 Ma", the
      specimen being "probably either earliest Barremian or latest Hauterivian
      in age". The paper hedges between two stages rather than giving a range
      across them.
  - id: lockwood2021a
    notes: >
      Fixes the stage boundary relative to the locality, "The base of the
      Barremian stage within the Wessex Formation lies west of Sudmoor Point
      and has been dated to 126.5 Ma".
  - id: stewart1981a
    notes: >
      The published description: "The Sudmoor Point Sandstone Member is well
      exposed for approximately 1.8 km, between Roughland Cliff ... and
      Chilton Chine", "The average thickness of the member is 6 m", near the
      base of the exposed Wealden, and it is "one of a number of similar
      sandstones, in the Wessex Formation (Stewart, 1978)". Gives no age.
  - id: hendry2010a
    notes: >
      A field-excursion guide that also treats it as a member, "the
      Brighstone, Chilton Chine and Sudmoor Point Sandstone Members".
  - id: hopson2015a
    notes: >
      The British Geological Survey sheet explanation: "The Wessex Formation
      has no formal subdivision on the island ..., although a number of named
      beds (principally the dividing sandstone units) are described from the
      continuous coastal section", which is what makes the unit informal.
  - id: martill2015a
    notes: >
      Describes "approximately 6 m of the fluvial point-bar Sudmoor Point
      Sandstone", capped by plant debris bed L1 of Stewart (1978), and holds
      that "On the Isle of Wight the exposed Wessex Formation is entirely
      Barremian".
  - id: jacobs2023a
    notes: >
      Reports that "Recent palaeomagnetic studies demonstrate that the
      boundary between chrons CM3n and CM5r, coincident with the
      Hauterivian–Barremian boundary, fall a short distance above the Sudmoor
      Point Sandstone (Conall Mc Niocaill pers comm. 2021)".
