name: Scollard
rank: formation
period: [Late Cretaceous, Paleocene]
stages: [Maastrichtian, Danian]
lithology: buff to white bentonitic sandstone, with gray and brown shale and
  minor coal
references:
  - id: eberth2020a
    notes: >
      Places the base at 66.88 Ma, after Eberth and Kamo (2019), and divides the
      formation into a "Cretaceous portion" and a "Paleogene portion of the
      Scollard Formation".
  - id: sankey2001a
    notes: >
      Places Scollard microvertebrate collections at 65–60 Ma, after Eberth and
      Ryan (1992), and reads the lower Scollard dinosaur fauna as one of drier,
      open habitat.
  - id: eberth2012a
    notes: >
      Puts the basal Scollard sandstones above the Battle Formation in the Red
      Deer River valley, and separates on palynology a lower Scollard from a
      coal-rich, wetter "upper Scollard Formation".
  - id: arbour2015a
    notes: >
      Lists AMNH 5214, a referred specimen of Ankylosaurus magniventris, from
      the left bank of the Red Deer River, Alberta, in the "Scollard
      Formation, 45.4m below K–Pg boundary, Maastrichtian".
  - id: arbour2017b
    notes: >
      Repeats the same locality and horizon for the same specimen.
  - id: pittman2020c
    notes: >
      Tabulates it in the troodontid fossil record, for Troodon, as Late
      Cretaceous to Paleogene and Maastrichtian to Paleocene in age.
  - id: eberth1992a
  - id: eberth2019a
  - id: lehman1987a
    notes: >
      Source of the lithology.
