name: Scollard
rank: formation
period: [Late Cretaceous]
stages: [Maastrichtian]
references:
  - id: eberth2020a
    notes: >
      The base of the Scollard in the Red Deer River valley is placed at 66.88
      Ma, an age interpolated by Eberth and Kamo (2019), and coincides with
      the base of the R. collaris-P. reductus palynomorph biozone; a bentonite
      75 cm lower, in the uppermost Battle Formation, dates to 66.936 ± 0.047
      Ma by U-Pb CA-ID-TIMS. The Edmonton Group lithostratigraphic column
      splits the formation into a "Cretaceous portion of the Scollard
      Formation" and a "Paleogene portion of the Scollard Formation".
  - id: sankey2001a
    notes: >
      Microvertebrate collections from the Scollard are placed at 65-60 Ma, in
      a comparison drawn "from the Milk River (84-82.5 Ma), Oldman and
      Dinosaur Park (79.5-74 Ma), Horseshoe Canyon (72-67 Ma), and Scollard
      (65-60 Ma) formations", the figures taken from Eberth and Ryan (1992).
      Paleoecologically the upper Aguja tooth fauna of Big Bend, Texas, is
      read as closer to the lower Scollard than to units of its own age:
      Richardoestesia isosceles outnumbers R. gilmorei, Troodon and
      Dromaeosaurus are absent to rare, and pachycephalosaurids are present to
      common, a combination taken as the signature of drier, open habitat.
      Saurornitholestes cf. langstoni is present but slightly less abundant
      than in the Milk River and Horseshoe Canyon formations.
  - id: eberth2012a
    notes: >
      In the Red Deer River valley the basal sandstones of the Scollard cap
      the Tolman Bridge section, above the Battle Formation that drapes the
      Whitemud Member at the top of the Horseshoe Canyon Formation.
      Palynostratigraphy from 572 outcrop and core samples separates a lower
      Scollard whose strata have "reduced numbers of gymnosperms with greater
      numbers of angiosperms" from an "upper Scollard Formation where coals
      are abundant and conditions were judged independently to be wetter". Two
      palynomorphs of the underlying Carbon Member carry up into it:
      Wodehouseia spinata "becomes more common in the Battle and Scollard
      formations", and Scollardia trapaformis "has been rarely seen in the
      base of the Scollard Formation".
  - id: arbour2015a
    notes: >
      Gives an ankylosaur holotype from the left bank of the Red Deer River,
      Alberta, in the "Scollard Formation, 45.4m below K-Pg boundary,
      Maastrichtian".
  - id: arbour2017b
    notes: >
      Repeats the same locality and horizon for the same specimen.
  - id: pittman2020a
    notes: >
      Tabulates it in the troodontid fossil record, for Troodon, as Late
      Cretaceous to Paleogene and Maastrichtian to Paleocene in age.
