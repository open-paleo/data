name: Sunjiawan
rank: formation
period: [Early Cretaceous, Late Cretaceous]
stages: [Albian, Cenomanian, Turonian]
references:
  - id: lü2007b
    notes: >
      Gives the Crichtonsaurus benxiensis horizon as "Sunjiawan Formation
      (Cenomanian-Turonian)", deferring to Dong (2002) for the formation's
      age.
  - id: xing2024a
    notes: >
      Sets it beside its correlatives at the same age, "Sunjiawan Formation,
      Cenomanian", against the Liangtoutang and Baynshire.
  - id: jiang2006a
    notes: >
      Tentatively makes the formation late Albian: from K-Ar ages on the
      underlying Zhanglaogongtun Formation and the age of the Fuxin Formation
      below it, "the Zhanglaogongtun and the overlying Sunjiawan formations
      are tentatively considered as late Albian in age in this paper."
  - id: dong2002a
    notes: >
      Places Crichtonsaurus bohlini in the "basal purplish-red coarse sandy
      conglomerate bed of the Sunjiawan Formation, early Late Cretaceous", and
      says the fossil "supports the Late Cretaceous age of this unit
      (Cenomanian-Turonian)".
  - id: averianov2020a
    notes: >
      Places Borealosaurus in the "Lower Cretaceous (Albian) Sunjiawan
      Formation of Liaoning Province, China".
