name: Saltrio
rank: formation
period: [Early Jurassic]
stages: [Sinemurian]
description: "The Saltrio Formation is a formation in the Lombardy Basin of northern Italy. The stratigraphic sequence at the Galli quarry, located at an elevation of approximately 700 meters on the southeastern flank of the ridge above Saltrio, represents one of the most detailed exposures of the Saltrio Formation. This section, reaching a total thickness of about 17 meters, begins atop underlying dolomite and consists of a series of carbonate-dominated layers that reflect varying depositional conditions in a marine setting. On neighboring highs, pale crinoidal packstones-grainstones (\"Saltrio-type\") formed as autochthonous crinoid meadows, with encrusting sponge reefs, bivalvia, brachiopods, bryozoans, and foraminiferans. Fragmentary Ichthyosaur remains and bioeroded dinosaur bones (e.g., Saltriovenator zanellai) suggest transport from nearby terrestrial sources into a proximal slope or ramp, that is, an open subtidal zone some dozen of meters depth reached by the effects of storm waves and with constant bottom currents."
references:
  - id: benson2010b
    notes: >
      Records the material "from the Saltrio Formation (Sinemurian) near
      Saltrio" in Regione Lombardia, Italy.
  - id: carrano2012a
    notes: >
      Uses the same unit and age for the theropod informally called
      'Saltriosaurus'.
  - id: dalsasso2018a
    notes: >
      Describes it as a marine limestone "which deposited at the bottom of an
      open sea basin during Early Jurassic (Sinemurian) times", an age its
      ammonites support. The Saltriovenator bones lie in the bucklandi Zone of
      its lower banks, "the earliest portion of the early Sinemurian
      substage".
