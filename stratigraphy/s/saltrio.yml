name: Saltrio
rank: formation
period: [Early Jurassic]
stages: [Sinemurian]
references:
  - id: benson2010b
    notes: >
      Records the material "from the Saltrio Formation (Sinemurian) near
      Saltrio" in Regione Lombardia, Italy.
  - id: carrano2012a
    notes: >
      Uses the same unit and age for the theropod informally called
      'Saltriosaurus'.
  - id: dalsasso2018a
    notes: >
      Describes it as a marine limestone "which deposited at the bottom of an
      open sea basin during Early Jurassic (Sinemurian) times", an age its
      ammonites support. The Saltriovenator bones lie in the bucklandi Zone of
      its lower banks, "the earliest portion of the early Sinemurian
      substage".
