name: Straw-yellow Sandstone
rank: member
informal: true
parent: Wangjiashan
period: [Middle Jurassic]
stages: [Bathonian]
references:
  - id: ning2024a
    notes: >
      Considers it late Bathonian on megafossil plants, palynoflora and the
      invertebrates of the overlying Oil Shale Member, the Baiyinosaurus
      material coming "from the upper part of the Straw-yellow Sandstone
      Member ..., whose age is considered to be Middle Jurassic, late
      Bathonian". It "was deposited mainly in a lake deltaic setting, and the
      succession is characterized by its straw-yellow colour".
  - id: li1982a
    notes: >
      Names the member: the Wangjiashan Formation "was first named by the No.
      133 Coalfield Exploration Team (1976), with its type locality at
      Shuidonggou", and "in this paper it is proposed that the lower part be
      named the Straw-yellow Sandstone Member and the upper part the Oil Shale
      Member". Straw-yellow quartz-feldspar sandstone, 476.75 m thick in the
      Shuidonggou–Kushuixia section, with a 20–60 m grey-white fine
      conglomerate at its base, disconformable on the Longfengshan Formation.
      Dated Middle Jurassic.
  - id: li2019b
    notes: >
      Records that "The 607-m-thick Wangjiashan Formation was informally
      divided into two members", the lower "composed of straw-yellow
      sandstones (477 m thick) which were deposited mainly in a lake deltaic
      setting", and that it "is thought to have been formed in the late
      Bathonian (Li et al. 1982; Du 1985; Zhang 2009)". Of those three, Li and
      colleagues (1982) and the lexicon of Zhang (2009) give only a Middle
      Jurassic age.
