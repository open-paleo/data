name: Straw-yellow Sandstone
rank: member
informal: true
parent: Wangjiashan
period: [Middle Jurassic]
stages: [Bathonian]
lithology: straw-yellow quartz-feldspar sandstone, with interbedded purple sandy
  shale
references:
  - id: li2024a
    notes: >
      Considers it late Bathonian on megafossil plants, palynoflora and the
      invertebrates of the overlying Oil Shale Member, the Baiyinosaurus
      material coming "from the upper part of the Straw-yellow Sandstone
      Member ..., whose age is considered to be Middle Jurassic, late
      Bathonian". It "was deposited mainly in a lake deltaic setting, and the
      succession is characterized by its straw-yellow colour".
  - id: li1982a
    notes: >
      Names the member as the lower part of the Wangjiashan Formation:
      straw-yellow quartz-feldspar sandstone, 476.75 m thick at Shuidonggou,
      dated Middle Jurassic. Source of the lithology.
  - id: li2019b
    notes: >
      Gives the member as the lower of two informal members of the 607-m-thick
      Wangjiashan Formation, 477 m of straw-yellow sandstone, and dates it to
      the late Bathonian.
  - id: zhang2009b
  - id: du1985a
    notes: >
      Cited by Li and colleagues (2019) for a late Bathonian age for the
      Straw-yellow Sandstone Member.
  - id: zhang2009c
    notes: >
      Names the member as the lower part of the Wangjiashan Formation, about
      240 m thick, and gives it no age of its own.
