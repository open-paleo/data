name: Santa Maria
rank: formation
period: [Middle Triassic, Late Triassic]
stages: [Ladinian, Carnian]
references:
  - id: langer2004a
    notes: >
      Tabulates it as "?early Carnian" for Rio Grande do Sul.
  - id: colbert1970a
    notes: >
      Reviews an age that "has been regarded either as of Middle Triassic or
      Late Triassic": Caster (1952) had the formation covering a sequence
      "from the final stages of the Early Triassic through the Late Triassic",
      and Cox (1965) suggested it "might be of Ladinian age, antedating
      slightly the Carnian Ischigualasto Formation". Colbert weighs the
      cynodonts and pseudosuchians, favoring "a possible late Middle Triassic
      or Ladinian age", against the rhynchosaurs and dinosaurs, favoring "a
      possible Upper Triassic or Carnian age", and suggests placing the Santa
      Maria and Ischigualasto faunas "within the lower or Carnian phase of the
      Upper Triassic".
  - id: reig1963a
    notes: >
      Tentatively assigns the Middle Triassic fauna of Santa María in Brazil,
      with that of Tanganyika, to the upper Anisian or lower Ladinian, a
      little older than the Ischigualasto fauna it places in the upper
      Ladinian. This faunal correlation predates the radiometric dating of the
      unit.
  - id: caster1952a
    notes: >
      Argues from South African correlation rather than from stages, working
      in Beaufort beds and the Cynognathus zone, and calls these rocks "the
      Santa Maria beds". Its one chronological remark points the other way
      from the Middle Triassic reading and rests on a single specimen: "A
      lone saurischian gives the Santa Maria fauna a late Triassic aspect."
  - id: cox1965a
    notes: >
      "All the specimens came from the Santa Maria Formation, of probably
      Middle Triassic age" — an epoch rather than a stage, and one that
      excludes the Carnian. The U-Pb date of Langer and colleagues (2018)
      has since placed the top of the formation in the Carnian.
  - id: shubin1991a
    notes: >
      Places both of the formation's assemblage zones in the early Late
      Triassic: the Manda, Yerrapalli and Ischichuca formations "show
      affinities to the two early Late Triassic assemblages from the Santa
      Maria Formation of southern Brazil", its Dinodontosaurus and Scaphonyx
      zones, which it correlates with Romer's Zone B/C alongside the
      Ischigualasto Formation.
  - id: langer2018a
    notes: >
      Gives "a weighted mean 206Pb/238U date of 233.23 ± 0.73 Ma (2σ complete
      uncertainty) from the Santa Maria Formation", at Cerro da Alemoa, "the
      typesection of the Alemoa Member", which "serves as the best maximum
      estimate for the depositional age of the bone bed near the top of the
      Santa Maria Formation" and is "consistent with a late Carnian
      (Tuvalian) age" for its fauna. The Caturrita Formation above is
      younger than 225.42 ± 0.37 Ma. The lower Dinodontosaurus
      Assemblage-Zone "is supposed to be coeval with the Chañares fauna", for
      which the paper notes better age constraints are needed.
  - id: sues2025a
    notes: >
      Calls the "Dinodontosaurus and Santacruzodon assemblage zones of the
      Santa Maria Supersequence" "Carnian-age".
  - id: martinelli2017a
    notes: >
      Gives the lower formation's age as an inference: "The age of the
      Dinodontosaurus AZ is inferred on the basis of biostratigraphic
      correlations with the Chañares Formation of the Ischigualasto-Villa
      Unión Basin, western Argentina (Fiorelli et al. 2013; Marsicano et al.
      2016) and radiometric dating of the overlying Santa Cruz Sequence
      (Philipp et al. 2013), both suggesting a late Ladinian–early Carnian
      age." No radiometric date comes from the Dinodontosaurus Assemblage
      Zone itself.
  - id: pavanatto2018a
    notes: >
      Records both readings of the Dinodontosaurus Assemblage Zone. By the
      Chañares correlation it is "considered early Carnian (236-234 Ma)", but
      a maximum age of 236 Ma on the overlying Santa Cruz Sequence, which
      holds the younger Santacruzodon Assemblage Zone, "raise[s] the
      possibility that Dinodontosaurus AZ might have been deposited during
      Ladinian to early Carnian".
  - id: novas2021a
    notes: >
      Explains why the zone may span both stages. In the Chañares Formation,
      "Radioisotopic ages constrained the Massetognathus-Chanaresuchus AZ to
      236.1 ± 0.6–233.7 ± 0.4 Ma (earliest Carnian ...) and, as a
      consequence, the older Tarjadia AZ is inferred to extend into the
      Ladinian". The Brazilian zone "also includes species very closely
      related to those restricted to the Tarjadia AZ", and "The taxonomic
      similarities of both AZs of the Chañares Formation with the whole
      Dinodontosaurus AZ of Brazil suggest that the latter may also include
      two different faunal associations".
