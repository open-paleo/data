name: Seonso Conglomerate
period: [Late Cretaceous]
stages: [Santonian, Campanian]
description: "The Seonso Conglomerate is a Late Cretaceous aged geologic formation in South Korea. Fossils of dinosaurs and lizards are reported from the formation at the Bibong-ri Dinosaur Egg Site in Boseong County."
references:
  - id: huh2011a
    notes: >
      Gives "The Seonso Conglomerate (?Santonian - Campanian, Late Cretacous)
      of Boseong site 5 (southern coast of Korean Peninsula)". Uses no rank
      word with the name.
  - id: boyd2015a
    notes: >
      Independently places the Koreanosaurus material in "the Late Cretaceous
      Seonso Conglomerate of South Korea".
