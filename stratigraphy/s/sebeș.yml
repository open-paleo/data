name: Sebeș
rank: formation
variants: [Șard]
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
references:
  - id: csiki-sava2015a
    notes: >
      Equates the two names, "Sebeş = Şard Formation".
  - id: turner2012a
    notes: >
      Gives the Balaur distribution as "Maastrichtian, Late Cretaceous, Sebes
      Formation, Alba County, Romania", writing the name without the
      diacritic.
  - id: díezdíaz2025a
    notes: >
      Dates the formation as "uppermost Campanian–upper Maastrichtian", naming
      it "the major fossil-bearing unit" of the Transylvanian Basin.
  - id: csiki-sava2016a
    notes: >
      Dates the lower part as early Maastrichtian from its conformable position
      on upper Campanian marine beds, perhaps latest Campanian at Petrești; the
      top is poorly constrained.
  - id: vremir2014a
    notes: >
      At Petrești-Arini the formation "began in this area sometime during the
      latest Campanian–earliest Maastrichtian", above marine beds of
      nannofossil zone CC22.
