name: Sebeș
rank: formation
variants: [Șard]
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
references:
  - id: turner2012a
    notes: >
      Gives the Balaur distribution as "Maastrichtian, Late Cretaceous, Sebes
      Formation, Alba County, Romania", writing the name without the
      diacritic.
  - id: díaz2025a
    notes: >
      Dates the formation as "uppermost Campanian–upper Maastrichtian", naming
      it "the major fossil-bearing unit" of the Transylvanian Basin.
  - id: csiki-sava2016a
    notes: >
      Rests the dating on stratigraphic position: the lower part conformably
      overlies upper Campanian marine deposits, so "the early Maastrichtian
      age of the transitional and continental beds from the lower Sebeș
      Formation ... is rather well established", and palynology from the lower
      part of the continental succession supports it, though "It is also
      conceivable that in the Petrești area their deposition already started
      during the latest Campanian". The estimated thickness of the unit makes
      it "possible that most of the Maastrichtian is represented", but the
      upper constraints are poor, the coarser-grained top being covered along
      erosional unconformities by much younger beds.
