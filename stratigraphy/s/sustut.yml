name: Sustut
rank: group
period: [Early Cretaceous, Late Cretaceous]
stages: [Barremian, Aptian, Albian, Cenomanian, Turonian, Coniacian, Santonian, Campanian, Maastrichtian]
references:
  - id: arbour2019a
    notes: >
      Names the group by way of the units inside it, giving the Ferrisaurus
      horizon as "Tatlatui Member, Tango Creek Formation, Sustut Group" in
      British Columbia. Dates that site by pollen: the presumed holotype
      locality yielded "the Maastrichtian marker taxon Pseudoaquilapollenites
      bertillonites, indicating an age of approximately 68.2–67.2 Ma for the
      site".
  - id: evenchick2001a
    notes: >
      Sweet's palynology reports for its lower formation, the Tango Creek, run
      from "Barremian to Early or Middle Albian" at the oldest to "Late
      Campanian, possibly Early Maastrichtian" at the youngest, which carries
      the group down into the Early Cretaceous; the reports between cover the
      Albian through the Campanian.
  - id: evenchick2003a
    notes: >
      Dates the group, "The Sustut Group is mid-Cretaceous to latest
      Cretaceous", and both its formations: "Northwest of the study area the
      Tango Creek Formation is early Albian to late Campanian and Brothers
      Peak Formation late Campanian to early Maastrichtian", after Sweet's
      reports in Evenchick and colleagues (2001).
  - id: arbour2020a
    notes: >
      Records that the Brothers Peak Formation's age has "varied substantially
      over the years, ranging from Maastrichtian to Eocene depending on the
      methodology used". Its own pollen contains Pseudoaquilapollenites
      bertillonites, "which has a very restricted occurrence in the upper
      Maastrichtian of western North America".
