name: Salt Wash
rank: member
parent: Morrison
period: [Late Jurassic]
stages: [Oxfordian, Kimmeridgian]
references:
  - id: carpenter2008a
    notes: >
      Dates Reed's Quarry 13 at Como Bluff, in the member, "latest
      Oxfordian-earliest Kimmeridgian" from "regional correlations from dated
      horizons", the quarry lying "about 35 m below the 156.3 + 2 Ma age for
      strata at the level of Reed's Quarry 9".
  - id: chure2020a
    notes: >
      Gives a holotype horizon in "the Salt Wash Member of the Upper Jurassic
      (Kimmeridgian) Morrison Formation", with referred specimens "in the
      stratigraphically equivalent lower part of the Morrison Formation in
      Wyoming".
  - id: chure2000a
    notes: >
      Independently gives "the Salt Wash Member of the Morrison Formation
      (Kimmeridgian, Jurassic)" at Dinosaur National Monument, the quarry
      being "Kimmeridgian in age (Kowallis et al. 1998)".
  - id: carrano2012a
    notes: >
      Pairs it with its neighbor above across the formation's span, "Salt
      Wash and Brushy Basin Members, Morrison Formation;
      Kimmeridgian-Tithonian".
  - id: kowallis1998a
    notes: >
      Cited by Chure (2000) for the Kimmeridgian age of the Dinosaur National
      Monument quarry.
