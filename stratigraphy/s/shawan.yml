name: Shawan
rank: member
parent: Lufeng
period: [Early Jurassic]
stages: [Hettangian, Sinemurian]
variants: [Dull Purplish Beds, Dark Purple Beds]
references:
  - id: chen2026a
    notes: >
      The basis for the Hettangian. In drill core WK23-1 the Yubacun
      Formation beneath the Lufeng tops out at about 200.17 Ma, on an
      astrochronology anchored to the 201.51 ± 0.15 Ma onset of the
      end-Triassic carbon-isotope excursion, and the main excursion
      continues "into the basal Lufeng Formation". This member is the
      lowest part of the Lufeng, so its base is Hettangian on the ICS
      chart v2024/12 where the Lufeng overlies the Yubacun. The core is in
      the Kunming Basin rather than the Chuxiong Basin of the type
      section.
  - id: hesselbo2020a
    notes: >
      Runs the Hettangian from 201.4 to 199.5 Ma, which leaves about 0.6 Myr
      of the stage after the 200.1 Ma base of the Lufeng in the Wande core.
  - id: liang2024a
    notes: >
      Gives "Shawan member of the lower Lufeng Formation (Hettangian)" in a
      passing locality line that relays earlier work rather than dating the
      member. This
      is the lower of the pair formalized by Fang and colleagues (2000) out of
      the informal Dark Purple Beds, the upper being the Zhangjiawa.
  - id: xing2012b
    notes: >
      Gives the Sinosaurus specimen ZLJT01 as from "Lower Jurassic, Shawan
      member, Lufeng Formation (Lower Lufeng Formation)", the "lowermost
      (Shawan member) portion" of the formation.
  - id: fang2000a
    notes: >
      The erecting paper, which subdivides the region's red beds by "erecting
      the following nomenclature", giving "the Lufeng Fm. (including the
      Shawan and Zhangjia'ao members)" and reducing the earlier formations to
      member status. Its type section is "at Shawan and Dahuangtian, Lufeng
      Co.". It names no international stage anywhere, working only in J1, J2
      and J3. Both spellings of the companion member appear in the paper: Zhangjia'ao five times, in the list
      of erected names, two table rows, the naming history and the paper's own
      descriptive prose; and Zhangjiawa once, as the formal definition header.
      Frequency favors the first and position the second. The member is
      "Represented by units 1-7 with a thickness of 107.7 m" at the type
      section, where it "is unconformable with the underlying purple phyllites
      of the Proterozoic Etou'an (chang?) Fm. of the Kunyang Group" with no
      Yubacun beneath it, and "In the Lufeng Basin this unit is 528 m thick".
      That thickness is hard to fit in the roughly 0.6 Myr of Hettangian left
      after the base of the Lufeng, so the member likely reaches the
      Sinemurian.
  - id: barrett2005b
    notes: >
      Records the renaming: "Fang et al. (2000) proposed a new nomenclature,
      re-naming the Lower Lufeng Formation the 'Lufeng Formation,' the Dull
      Purplish Beds the 'Shawan Member,' and the Dark Red Beds the 'Zhangjiawa
      Member'". The older two-horizon scheme it reports, "the lower Dull
      Purplish Beds (Hettangian) and upper Dark Red Beds (Sinemurian)", gave
      this unit the Hettangian alone, before the dating of the Lufeng base.
  - id: irmis2004a
    notes: >
      Gives the informal name under another rendering: the formation "was
      informally divided into two subunits, the lower 'Dark Purple Beds' and
      upper 'Deep Red Beds' (Bien 1941). Fang et al. (2000) formalized these
      units into the Shawan Member and Zhangjiawa Member, respectively."
