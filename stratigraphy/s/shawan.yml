name: Shawan
rank: member
parent: Lufeng
period: [Early Jurassic]
stages: [Hettangian]
references:
  - id: liang2024a
    notes: >
      Gives "Shawan member of the lower Lufeng Formation (Hettangian". This
      is the lower of the pair formalized by Fang and colleagues (2000) out of
      the informal Dark Purple Beds, the upper being the Zhangjiawa.
  - id: xing2012b
    notes: >
      Gives the Sinosaurus specimen ZLJT01 as from "Lower Jurassic, Shawan
      member, Lufeng Formation (Lower Lufeng Formation)", the "lowermost
      (Shawan member) portion" of the formation.
  - id: fang2000a
    notes: >
      The erecting paper, which subdivides the region's red beds by "erecting
      the following nomenclature", giving "the Lufeng Fm. (including the
      Shawan and Zhangjia'ao members)" and reducing the earlier formations to
      member status. Its type section is "at Shawan and Dahuangtian, Lufeng
      Co.". It names no international stage anywhere, working only in J1, J2
      and J3, so the Hettangian on this entry is not from here. Both spellings of the companion member appear
      here: Zhangjia'ao five times, in the list of erected names, two table
      rows, the naming history and the paper's own descriptive prose; and
      Zhangjiawa once, as the formal definition header. Frequency favors the
      first and position the second.
