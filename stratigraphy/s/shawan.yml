name: Shawan
rank: member
parent: Lufeng
period: [Early Jurassic]
stages: [Hettangian, Sinemurian]
variants: [Dull Purplish Beds, Dark Purple Beds]
lithology: dark purple-red mudstone, with thin siltstone interbeds
references:
  - id: chen2026a
    notes: >
      Dates the top of the Yubacun Formation beneath the Lufeng to about 200.17
      Ma in a Kunming Basin core, with the carbon-isotope excursion continuing
      "into the basal Lufeng Formation".
  - id: hesselbo2020a
    notes: >
      Runs the Hettangian from 201.4 to 199.5 Ma, which leaves about 0.6 Myr
      of the stage after the 200.1 Ma base of the Lufeng in the Wande core.
  - id: liang2024a
    notes: >
      Gives "Shawan member of the lower Lufeng Formation (Hettangian)" in a
      passing locality line that relays earlier work rather than dating the
      member. This
      is the lower of the pair formalized by Fang and colleagues (2000) out of
      the informal Dark Purple Beds, the upper being the Zhangjiawa.
  - id: xing2012b
    notes: >
      Gives the Sinosaurus specimen ZLJT01 as from "Lower Jurassic, Shawan
      member, Lufeng Formation (Lower Lufeng Formation)", the "lowermost
      (Shawan member) portion" of the formation.
  - id: fang2000a
    notes: >
      Erects the member, with its type section "at Shawan and Dahuangtian",
      107.7 m thick there and 528 m in the Lufeng Basin.
  - id: barrett2005b
    notes: >
      Reports the renaming of the Dull Purplish Beds as the Shawan Member by
      Fang and colleagues (2000), and the traditional Hettangian age of those
      beds.
  - id: irmis2004a
    notes: >
      Gives the informal name under another rendering: the formation "was
      informally divided into two subunits, the lower 'Dark Purple Beds' and
      upper 'Deep Red Beds' (Bien 1941). Fang et al. (2000) formalized these
      units into the Shawan Member and Zhangjiawa Member, respectively."
  - id: bien1941a
    notes: >
      Cited by Irmis (2004) for the informal 'Dark Purple Beds' and 'Deep Red
      Beds' division of the Lufeng Formation.
  - id: bien1940a
    notes: >
      Erects the Lufeng Series and divides it into a "Carnosauria- and
      Bienotherium-bearing Lower Lufeng Series" and an Upper Lufeng Series,
      the lower part including the "Dull purplish beds", "Called in the field
      as 'dirty beds'". Bien dates the Lower Lufeng Series "Upper Triassic in
      age (uppermost middle Keuper)"; the Triassic–Jurassic boundary lies
      below the Lufeng.
  - id: huang2005a
    notes: >
      Ranks it the lower member of the Lufeng Formation, 107.7 m thick at
      Chuanjie, and correlates sites low in the member roughly with the middle
      Sinemurian.
  - id: chen2025b
    notes: >
      Source of the lithology.
