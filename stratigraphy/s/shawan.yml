name: Shawan
rank: member
parent: Lufeng
period: [Early Jurassic]
stages: [Hettangian]
references:
  - id: chen2026a
    notes: >
      The basis for the Hettangian. In drill core WK23-1 the Yubacun
      Formation beneath the Lufeng tops out at about 200.17 Ma, on an
      astrochronology anchored to the 201.51 ± 0.15 Ma onset of the
      end-Triassic carbon-isotope excursion, and the main excursion continues
      "into the basal Lufeng Formation". This member is the lowest part of
      the Lufeng, so it is Hettangian on GTS2020. The core is in the Kunming
      Basin rather than the Chuxiong Basin of the type section.
  - id: hesselbo2020a
    notes: >
      Runs the Hettangian from 201.4 to 199.5 Ma.
  - id: liang2024a
    notes: >
      Gives "Shawan member of the lower Lufeng Formation (Hettangian)" in a
      passing locality line that relays earlier work rather than dating the
      member. This
      is the lower of the pair formalized by Fang and colleagues (2000) out of
      the informal Dark Purple Beds, the upper being the Zhangjiawa.
  - id: xing2012b
    notes: >
      Gives the Sinosaurus specimen ZLJT01 as from "Lower Jurassic, Shawan
      member, Lufeng Formation (Lower Lufeng Formation)", the "lowermost
      (Shawan member) portion" of the formation.
  - id: fang2000a
    notes: >
      The erecting paper, which subdivides the region's red beds by "erecting
      the following nomenclature", giving "the Lufeng Fm. (including the
      Shawan and Zhangjia'ao members)" and reducing the earlier formations to
      member status. Its type section is "at Shawan and Dahuangtian, Lufeng
      Co.". It names no international stage anywhere, working only in J1, J2
      and J3, so the Hettangian on this entry is not from here. Both spellings
      of the companion member appear here: Zhangjia'ao five times, in the list
      of erected names, two table rows, the naming history and the paper's own
      descriptive prose; and Zhangjiawa once, as the formal definition header.
      Frequency favors the first and position the second.
