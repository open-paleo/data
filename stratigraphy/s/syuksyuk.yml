name: Syuksyuk
rank: formation
period: [Late Cretaceous]
stages: [Turonian, Coniacian, Santonian, Campanian]
lithology: variegated and red sand, sandstone, siltstone, conglomerate and
  gravel, with pink sand and variegated clay near the top
references:
  - id: vereshchagin1979a
    notes: >
      Defines the formation, with its stratotype at Syuksyuk settlement, between
      the Dzhamsugum and Darbazin formations, and dates it "Upper
      Turonian—Coniacian". Source of the lithology.
  - id: nessov1995a
    notes: >
      Assigns several dinosaur localities to the formation, Kyrkkuduk I and the
      Syuk-Syuk wells among them, and dates them "Upper Cretaceous, Santonian".
  - id: nessov1997a
    notes: >
      Shows how hard the contact with the Darbazin is to fix, moving beds
      both ways at two localities. At Darbaza the beds are "Syuksyukian
      Formation or, more likely, lower part of the Darbazinian Formation,
      Santonian or Santonian-Lower Campanian"; at Kazgurt they are "Upper
      part of the Syuksyukian Formation (Suslov, 1987), Santonian", with the
      rival attribution called erroneous rather than this one. Gives Azatbash
      as "Сюксюкская свита, сантон - нижний кампан" ("Syuksyuk Formation,
      Santonian - lower Campanian", translated).
  - id: rozhdestvensky1964a
    notes: >
      Assigns the dinosaur-bearing band at this site to "the lower part of
      the Darbaza Suite ... no later than the Upper Turonian", on Belenky's
      authority, and places the locality 45 km north of Tashkent. The
      attribution is superseded: Nessov (1995) puts the same bed in this
      formation instead, and the Turonian is a ceiling rather than a
      determination.
  - id: suslov1987a
    notes: >
      Cited by Nessov (1997) for placing the Kazgurt beds in the upper
      Syuksyuk Formation.
