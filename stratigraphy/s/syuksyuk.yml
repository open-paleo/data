name: Syuksyuk
rank: formation
period: [Late Cretaceous]
stages: [Turonian, Coniacian, Santonian, Campanian]
references:
  - id: vereshchagin1979a
    notes: >
      The dictionary entry. "Named after Syuksyuk settlement, Pritashkent
      district, Central Asia. G. A. Belenky, 1966", with the stratotype "at
      Syuksyuk settlement, 10 km east of Dzhilga railway station". It "lies on
      the Dzhamsugum Formation and is overlain by the Darbazin Formation.
      Belongs to the Upper Turonian-Coniacian", and most of it corresponds to
      the informally named Dinosaur Horizon.
  - id: nessov1995a
    notes: >
      Uses the name at formation rank, and carries the unit later than the
      dictionary does. Kyrkkuduk I, the Jaxartosaurus locality on the northern
      foot of the Alymtau Ridge, is "Syuk-Syuk Formation. Upper Cretaceous,
      Santonian." At the Syuk-Syuk locality itself the horizon is the "Lower
      part of the Darbazin Formation (Rozhdestvensky, 1964a). Syuk-Syuk
      Formation (Stratigraphic Dictionary, 1979), rather than the Beleutin
      Formation", also Santonian. An undescribed theropod is placed "from the
      Santonian - lower Campanian of Syuk-Syuk, Kazakhstan".
  - id: nessov1997a
    notes: >
      Shows how hard the contact with the Darbazin is to fix, moving beds
      both ways at two localities. At Darbaza the beds are "Syuksyukian
      Formation or, more likely, lower part of the Darbazinian Formation,
      Santonian or Santonian-Lower Campanian"; at Kazgurt they are "Upper
      part of the Syuksyukian Formation (Suslov, 1987), Santonian", with the
      rival attribution called erroneous rather than this one.
  - id: rozhdestvensky1964a
    notes: >
      Assigns the dinosaur-bearing band at this site to "the lower part of
      the Darbaza Suite ... no later than the Upper Turonian", on Belenky's
      authority, and places the locality 45 km north of Tashkent. The
      attribution is superseded: Nessov (1995) puts the same bed in this
      formation instead, and the Turonian is a ceiling rather than a
      determination.
