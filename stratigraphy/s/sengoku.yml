name: Sengoku
rank: formation
period: [Early Cretaceous]
stages: [Berriasian, Valanginian, Hauterivian, Barremian]
references:
  - id: carrano2012a
    notes: >
      Gives the Wakinosaurus tooth as from "the Sengoku Formation
      (Hauterivian-Barremian) of Fukuoka, Japan".
  - id: okazaki1992a
    notes: >
      The original description, giving the locality at Sengokukyo,
      Miyata-machi, Kurate Gun, Fukuoka Prefecture, and the horizon as
      "Sengoku Formation, Wakino Subgroup, Kwanmon Group. Neocomian (Early
      Cretaceous)." Gale and colleagues (2020) resolve the Neocomian into "the
      Berriasian, Valanginian and Hauterivian".
  - id: gale2020a
