name: Sembar
rank: formation
period: [Late Jurassic]
stages: [Kimmeridgian]
lithology: shale, with minor marl and mudstone
references:
  - id: malkani2003a
    notes: >
      Reports the "First Kimmeridgian (Late Jurassic) dinosaur fossils ...
      discovered in the lowest horizon of Sembar Formation just near the contact
      of Zidi/Chiltan Limestone", in the Karkh area of Pakistan. Describes its
      rock: "Sembar Formation | Mainly shale with minor marl and mudstone".
