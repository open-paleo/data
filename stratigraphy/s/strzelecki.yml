name: Strzelecki
rank: group
period: [Early Cretaceous]
references:
  - id: tosolini1999a
    notes: >
      Defines the group, not formally described before, with the Tyers River
      Subgroup, the Rhyll Arkose and an undifferentiated upper part that
      others call the Wonthaggi Formation, and dates its Rintoul Creek
      Formation Valanginian from its own palynology.
  - id: herne2019a
    notes: >
      Gives the Flat Rocks locality as "in the Wonthaggi Formation (Strzelecki
      Group)".
