name: Sânpetru
rank: formation
variants: [Sînpetru]
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
references:
  - id: augustin2023a
    notes: >
      Gives "Sînpetru Formation (Maastrichtian", spelling the unit with î.
  - id: díaz2025a
    notes: >
      Also spells it Sînpetru, and sets it beside its neighbor: "Sînpetru
      Formation (Maastrichtian) in the central part of the basin; the partly
      volcanoclastic Densus-Ciula Formation (Maastrichtian". The name is also
      spelled Sânpetru, following the Romanian orthographic reform that
      replaced î with â in this position; both read primaries use the older
      form, so the two spellings are current side by side in the literature.
  - id: godefroit2009a
    notes: >
      Places the Nălaţ-Vad locality, discovered in 2002, in this formation in
      the Haţeg Basin, dating the unit "(Maastrichtian, Late Cretaceous)", and
      reports palaeomagnetic work by Panaiotu and Panaiotu (2002) suggesting
      that "this formation should entirely belong to the lower Maastrichtian".
  - id: panaiotu2002a
  - id: csiki-sava2016a
    notes: >
      Magnetostratigraphic sampling of the western bank of the Sibișel Valley,
      after Panaiotu and Panaiotu (2010), "definitively established a
      dominantly early to early late Maastrichtian age for the entire Sibișel
      Valley succession, well constrained to the time interval between C32N1
      and the basalmost part of C30R through identification of several
      magnetic reversals", so that the stratotype section "represents roughly
      the time interval between 71.6 and 68.2 Ma, and currently can be
      considered the most precisely dated continuous succession of the
      continental uppermost Cretaceous from Transylvania". The succession on
      the eastern bank is unconstrained and is provisionally correlated with
      the lower-middle part of the left side, "and thus early to earliest late
      Maastrichtian in age". At the upper middle to terminal part of the
      stratotype, palynologically calibrated magnetostratigraphy "supports an
      early late Maastrichtian age".
  - id: panaiotu2010a
    notes: >
      Magnetostratigraphy of ten localities along the Sibișel Valley starts
      the lower member earlier than had been assumed: with the
      Campanian-Maastrichtian boundary at 70.6 ± 0.5 Ma, the correlation
      "implies the starting of the sedimentation in this part of the Sânpetru
      Formation during the Late Campanian, earlier than it was usually
      assumed", so that "the Sânpetru formation is Late
      Campanian–Maastrichtian in age". That turns on where the boundary is
      placed: at 72.5 ± 0.5 Ma "the Sânpetru Formation developed only inside
      the Maastrichtian".
