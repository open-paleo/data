name: Sânpetru
rank: formation
variants: [Sînpetru]
lithology: sandstone, conglomerate and mudstone
period: [Late Cretaceous]
stages: [Maastrichtian]
references:
  - id: augustin2023a
    notes: >
      Gives "Sînpetru Formation (Maastrichtian)", spelling the unit with î.
  - id: díezdíaz2025a
    notes: >
      Spells the unit Sînpetru and gives it as Maastrichtian, in the central
      part of the basin beside the Densuș-Ciula Formation.
  - id: godefroit2009a
    notes: >
      Places the Nălaț-Vad locality, discovered in 2002, in this formation in
      the Hațeg Basin, dating the unit "(Maastrichtian, Late Cretaceous)", and
      reports paleomagnetic work by Panaiotu and Panaiotu (2002) suggesting
      that "this formation should entirely belong to the lower Maastrichtian".
  - id: panaiotu2002a
  - id: csiki-sava2016a
    notes: >
      Dates the Sibișel Valley stratotype to roughly 71.6–68.2 Ma, "early to
      early late Maastrichtian", from the magnetostratigraphy of Panaiotu and
      Panaiotu (2010).
  - id: panaiotu2010a
    notes: >
      Dates the formation from the magnetostratigraphy of ten Sibișel Valley
      localities as "Late Campanian–Maastrichtian", or wholly Maastrichtian with
      the stage boundary at 72.5 Ma. Source of the lithology.
  - id: gale2020a
    notes: >
      Places the base of the Maastrichtian in "Chron C32n.2n.88", where
      "the age for all of these base-Maastrichtian levels is approximately
      72.2 Ma".
