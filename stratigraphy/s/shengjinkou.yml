name: Shengjinkou
rank: formation
parent: Tugulu
period: [Early Cretaceous]
stages: [Valanginian]
references:
  - id: zheng2023a
    notes: >
      Places it third in the Tugulu Group's ascending order and dates it on
      clam shrimp, which "places the upper Shengjinkou Formation within the
      Valanginian Stage". Its clam shrimp and sporopollen fossils, together
      with siyuichthyid fish, "indicate an Early Cretaceous biostratigraphic
      age".
  - id: wang2021a
    notes: >
      The Hamititan description, and the source later work cites for this
      unit's age, though it gives none: the formation is "Early Cretaceous"
      throughout and no stage or numeric age appears anywhere in the paper.
      Places it in "the Shengjinkou Formation of the Tugulu Group, which is
      distributed in the Turpan-Hami Basin, south of the Tian Shan Mountains
      in Xinjiang", its lacustrine sequence "mainly composed by the
      gray-white sa[ndstones]", and lists the group there as the
      Sanshilidadun, Shengjinkou and Lianmuqin formations in ascending order
      -- a different set of neighbors from the Junggar Basin succession.
  - id: mannion2026a
    notes: >
      Independently gives "the Shengjinkou Formation of north-west China,
      dated to the upper Valanginian".
