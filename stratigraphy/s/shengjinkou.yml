name: Shengjinkou
rank: formation
parent: Tugulu
period: [Early Cretaceous]
stages: [Valanginian]
references:
  - id: zheng2023a
    notes: >
      Places it third in the Tugulu Group's ascending order and dates it on
      clam shrimp, which "places the upper Shengjinkou Formation within the
      Valanginian Stage". Its clam shrimp and sporopollen fossils, together
      with siyuichthyid fish, "indicate an Early Cretaceous biostratigraphic
      age".
  - id: mannion2026a
    notes: >
      Independently gives "the Shengjinkou Formation of north-west China,
      dated to the upper Valanginian".
