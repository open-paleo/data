name: Shengjinkou
rank: formation
parent: Tugulu
period: [Early Cretaceous]
stages: [Valanginian]
references:
  - id: zheng2023a
    notes: >
      Places it third in the Tugulu Group's ascending order and dates it on
      clam shrimp, which "places the upper Shengjinkou Formation within the
      Valanginian Stage". Its clam shrimp and sporopollen fossils, together
      with siyuichthyid fish, "indicate an Early Cretaceous biostratigraphic
      age".
  - id: wang2021a
    notes: >
      Describes Hamititan from the formation in the Turpan-Hami Basin, where it
      lies between the Sanshilidadun and Lianmuqin formations, and gives it no
      age finer than "Early Cretaceous".
  - id: mannion2026a
    notes: >
      Gives "the Shengjinkou Formation of north-west China, dated to the upper
      Valanginian", after Zheng and colleagues (2023).
  - id: lucas2001b
    notes: >
      The third of the Tugulu Group's four formations, "the thin (50–60 m
      thick) Shengjinkou Formation, gray-green mudstones and shales that have
      produced a diverse and endemic ichthyofauna". With the Lianmuqin it
      forms the "Upper Tugulu Group", a fauna "of Tsagantsabian age", a
      land-vertebrate age the book does not tie to a stage.
  - id: song2025a
    notes: >
      Dates a tuffaceous sandstone at the top of the formation at Wuerho, in
      the Junggar Basin, at 134.27 ± 0.36 Ma, and concludes that "the top of
      the Shengjinkou Formation is middle Valanginian in age".
