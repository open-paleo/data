name: Santo Domingo
rank: formation
period: [Late Triassic]
stages: [Carnian]
references:
  - id: hechenleitner2025a
    notes: >
      Reports "a new Late Triassic tetrapod assemblage from the Santo Domingo
      Formation in Quebrada Santo Domingo (QSD), a remote locality in the
      Andes of La Rioja province", and sets it among the Carnian tetrapod
      faunas. The same locality also exposes the Cretaceous Ciénaga del Río
      Huaco Formation.
