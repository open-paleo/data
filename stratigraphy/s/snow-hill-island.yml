name: Snow Hill Island
rank: formation
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
dispute:
  summary: >
    Which formation contains the Gamma Member is not settled. Soto-Acuña and
    colleagues (2024) give the "Gamma Member of Snow Hill Island Formation";
    Coria and colleagues (2011) place the same member in "the Gamma Member of
    the Santa Marta Formation (Marambio Group)". So the two names compete for
    the unit above the member rather than for the member itself.
references:
  - id: motta2025a
    notes: >
      Gives "Snow Hill Island Formation (Cape Lamb Member, Lower
      Maastrichtian".
  - id: pittman2020a
    notes: >
      Tabulates the formation as Late Cretaceous, Maastrichtian.
  - id: soto-acuña2024a
    notes: >
      Gives the "Gamma Member of Snow Hill Island Formation (upper
      Campanian)".
  - id: coria2011a
    notes: >
      A one-page conference abstract that does not name this formation and
      assigns the material elsewhere: the Antarctopelta holotype is placed in
      "lower levels of the Gamma Member of the Santa Marta Formation
      (Marambio Group, upper Campanian)". Neither of those units is in the
      registry.
