name: Snow Hill Island
rank: formation
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
references:
  - id: motta2025a
    notes: >
      Gives "Snow Hill Island Formation (Cape Lamb Member, Lower
      Maastrichtian ...)".
  - id: pittman2020a
    notes: >
      Tabulates the formation as Late Cretaceous, Maastrichtian.
  - id: soto-acuña2024a
    notes: >
      Gives the "Gamma Member of Snow Hill Island Formation (upper
      Campanian)".
  - id: coria2011a
    notes: >
      A one-page conference abstract that does not name this formation and
      gives the older assignment of the member: the Antarctopelta holotype is
      placed in "lower levels of the Gamma Member of the Santa Marta Formation
      (Marambio Group, upper Campanian)".
