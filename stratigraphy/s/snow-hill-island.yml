name: Snow Hill Island
rank: formation
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
description: "The Snow Hill Island Formation is an Early Maastrichtian geologic formation found on James Ross Island, James Ross Island group, Antarctica. Remains of a paravian theropod Imperobator antarcticus have been recovered from it, as well as the elasmarian ornithopods Trinisaura santamartaensis and Morrosaurus antarcticus, the ankylosaurian Antarctopelta oliveroi, and the shark Notidanodon sp. Alongside these described genera are also the remains of indeterminate elasmosaurids, lithostrotian titanosaurs and an indeterminate pterosaur. The uppermost portion of the Gamma Member containing the Santa Marta Cove fauna is dated to the late Campanian, approximately 73.4 million years ago, while the younger Cape Lamb Member is from the latest Campanian to early Maastrichtian, with the uppermost portion dated to 69.7 million years ago."
references:
  - id: motta2025a
    notes: >
      Gives "Snow Hill Island Formation (Cape Lamb Member, Lower
      Maastrichtian ...)".
  - id: pittman2020c
    notes: >
      Tabulates the formation as Late Cretaceous, Maastrichtian.
  - id: soto-acuña2024a
    notes: >
      Gives the "Gamma Member of Snow Hill Island Formation (upper
      Campanian)".
  - id: coria2011a
    notes: >
      A one-page conference abstract that does not name this formation and
      gives the older assignment of the member: the Antarctopelta holotype is
      placed in "lower levels of the Gamma Member of the Santa Marta Formation
      (Marambio Group, upper Campanian)".
