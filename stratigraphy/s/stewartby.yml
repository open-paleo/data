name: Stewartby
rank: member
parent: Oxford Clay
period: [Middle Jurassic]
stages: [Callovian]
lithology: pale to medium gray calcareous mudstone, with silty mudstone and thin
  siltstone beds
references:
  - id: smith1997a
    notes: >
      Records the formalization, the three units "traditionally been termed
      the lower, middle, and upper Oxford Clay" having been "formally renamed
      by Cox et al. (1992) as the Peterborough, Stewartby, and Weymouth
      Members". Dates the member in describing it: "The Stewartby Member
      (Callovian) is dominated by pale to medium gray, silty, calcareous,
      blocky mudstones".
  - id: barron2012a
    notes: >
      Lists it among the formal subdivisions of the formation, between the
      Peterborough Member below and the Weymouth Member above.
  - id: cox1992a
    notes: >
      Cited by Smith (1997) for formally renaming the Oxford Clay units,
      including the Stewartby Member. Describes its rock: "Predominantly pale to
      medium-grey, commonly smooth-textured, variably silty, calcareous,
      generally rather poorly fossiliferous, blocky mudstone. Subordinate beds
      of silty mudstone packed with immature shells of the bivalve Bositra
      buchii (Roemer). Thin (up to about 0.3 m), calcareous siltstones,
      particularly in upper part, commonly with Gryphaea."
