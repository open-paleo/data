name: Stewartby
rank: member
parent: Oxford Clay
period: [Middle Jurassic]
stages: [Callovian]
description: "The Stewartby Member is a member of the Oxford Clay Formation in England. It makes up the middle Oxford Clay and, with the Weymouth Member (the upper Oxford Clay), forms the formation's upper facies. The upper facies is a fossil poor assemblage of calcareous mudstones. The Middle and Upper Oxford Clays differ slightly, as they are separated by an argillaceous limestone in the South Midlands."
references:
  - id: smith1997a
    notes: >
      Records the formalization, the three units "traditionally been termed
      the lower, middle, and upper Oxford Clay" having been "formally renamed
      by Cox et al. (1992) as the Peterborough, Stewartby, and Weymouth
      Members". Dates the member in describing it: "The Stewartby Member
      (Callovian) is dominated by pale to medium gray, silty, calcareous,
      blocky mudstones".
  - id: barron2012a
    notes: >
      Lists it among the formal subdivisions of the formation, between the
      Peterborough Member below and the Weymouth Member above.
  - id: cox1992a
    notes: >
      Cited by Smith (1997) for formally renaming the Oxford Clay units,
      including the Stewartby Member.
