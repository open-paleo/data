name: Stewartby
rank: member
parent: Oxford Clay
period: [Middle Jurassic]
stages: [Callovian]
references:
  - id: barsbold1997a
    notes: >
      Records the formalization, the three units "traditionally been termed
      the lower, middle, and upper Oxford Clay" having been "formally renamed
      by Cox et al. (1992) as the Peterborough, Stewartby, and Weymouth
      Members". Dates the member in describing it: "The Stewartby Member
      (Callovian) is dominated by pale to medium gray, silty, calcareous,
      blocky mudstones".
  - id: barron2012a
    notes: >
      Lists it among the formal subdivisions of the formation, between the
      Peterborough Member below and the Weymouth Member above.
