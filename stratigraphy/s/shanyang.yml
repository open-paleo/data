name: Shanyang
rank: formation
period: [Late Cretaceous]
references:
  - id: holtz2004a
    notes: >
      Tabulates the Shanyangosaurus type material against "Shanyang Formation
      (Shaanxi), People's Republic of China" and "Late Cretaceous" in separate
      cells, and in running text calls it "the mid- to late Maastrichtian
      Shanyang Formation of Shaanxi, China", attributing the occurrence to Xue
      and colleagues (1996), who give only the series.
  - id: zhao2008a
    notes: >
      Prints the locality "Niupanggou, Shanyang, Shanxi", the unit and "Early
      Cretaceous" on three stacked lines of a distribution field, giving the
      province as Shanxi where Xue and colleagues give Shaanxi. The same
      volume prints Early Cretaceous in the same form for the Hongtuling
      Formation; those are the two units erected in Xue and colleagues (1996),
      and in each entry the remarks immediately following cite Holtz and
      colleagues (2004), whose table gives this formation as Late Cretaceous.
  - id: xue1996a
    notes: >
      Gives a tyrannosaurid tooth from "Wujiagou, Shanyang, Shaanxi; Upper
      Cretaceous Shanyang Formation". Gives only the series.
  - id: horner2004a
    notes: >
      Tabulates Shantungosaurus giganteus as Campanian in a row whose
      occurrence cell names both the Wangshi Group of Shandong and this
      formation in Shaanxi, so the age is given across two units rather than
      for this one.
