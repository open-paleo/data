name: Los Molles
rank: formation
period: [Early Jurassic, Middle Jurassic]
stages: [Toarcian, Aalenian, Bajocian]
references:
  - id: salgado2017a
    notes: >
      "The specimen was found in the marine-deltaic deposits of the Los Molles
      Formation (Toarcian-Bajocian), which in this sector reaches a thickness
      of approximately 1,042 m", and the same span stands unattributed in the
      abstract. The horizon is fixed biostratigraphically rather than by the
      formation: the ammonite Sonninia altecostata places the fossil-bearing
      level in the early Bajocian, some 40 m below the contact with the
      overlying Bajocian-Bathonian Lajas Formation, in laminated pelites rich
      in ammonitiferous concretions.
  - id: brown2020b
    notes: >
      Gives the Isaberrysaura horizon as "Los Molles Formation
      (Toarcian-Bajocian), Neuquén Province, Argentina", and records the
      cycad seeds preserved as gut contents.
  - id: hui2021a
    notes: >
      Narrows the occurrence, Isaberrysaura being "known from the Bajocian
      part of the Los Molles Formation of Argentina".
