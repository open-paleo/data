name: Los Alamitos
rank: formation
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
references:
  - id: alarcón-muñoz2023a
    notes: >
      Gives the Huallasaurus horizon as "Arroyo Verde Puelén Department, Río
      Negro Province, late Campanian to early Maastrichtian, Los Alamitos
      Formation".
  - id: bandeira2024a
    notes: >
      Tabulates the same taxon and unit as "Campanian" to "Maastrichtian" on
      Bonaparte and colleagues (1984) and Rozadilla and colleagues (2021).
  - id: powell2003a
    notes: >
      Places the Estancia Los Alamitos titanosaurid locality in the "Lower
      section of the Los Alamitos Formation" and dates it "Late Cretaceous,
      Campanian or probably Early Maastrichtian", after Bonaparte (1984).
      Gives the Aeolosaurus rionegrinus horizon as the Los Alamitos Formation,
      "Late Cretaceous, Campanian-Maastrichtian", after Bonaparte and
      colleagues (1984).
  - id: bonaparte1984b
    notes: >
      The primary for both stages, and it gives them in its title: "Los
      Alamitos Formation (Campanian-Maastrichtian) of southeastern Rio
      Negro". Presents the unit's lithology, paleontology and paleoecology in
      its type area, with the succession running from the Jurassic Marifil
      through the Chubut Group.
  - id: rozadilla2021a
    notes: >
      Places the unit among "Campanian-Maastrichtian sedimentary units in
      northern Patagonia", beside the Allen, in the course of reviewing South
      American hadrosaurids.
  - id: bonaparte1984c
