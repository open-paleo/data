name: Lower Greensand
rank: group
period: [Early Cretaceous]
stages: [Aptian, Albian]
references:
  - id: barker2020a
    notes: >
      Gives the rank and its contents: the succession at Knock Cliff "is
      formed of the three strata of the Lower Greensand Group: the uppermost
      members of the Ferruginous Sands Formation (late Aptian in age ...),
      the Sandrock Formation (age undetermined), and the Monk's Bay Sandstone
      Formation (Albian in age ...)". Names the "Aptian Ferruginous Sands
      Formation of the Lower Greensand Group".
