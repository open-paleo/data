name: Lonzée
rank: member
period: [Late Cretaceous]
stages: [Coniacian, Santonian, Campanian]
references:
  - id: godefroit2007a
    notes: >
      Gives the Craspedodon teeth as "discovered in the Lonzée Member
      (?Coniacian-Santonian, Upper Cretaceous) in the surroundings of the
      village of Lonzée (Namur Province, Belgium)". Names no containing unit.
  - id: robaszynski2001a
    notes: >
      Its belemnites and inoceramids give the member a "? Coniacian –
      Santonian -? basal Campanian" age, the belemnites indicating Santonian
      and the inoceramids partly Coniacian. Its known occurrence "is
      restricted to the area around Lonzée near Gembloux (Namur)", about 3 m
      thick, with no stratotype fixed and no outcrops left.
