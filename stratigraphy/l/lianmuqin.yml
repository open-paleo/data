name: Lianmuqin
rank: formation
parent: Tugulu
period: [Early Cretaceous]
stages: [Valanginian, Hauterivian, Barremian, Aptian, Albian]
references:
  - id: zheng2023a
    notes: >
      Gives the group's order -- "the Tugulu Group consists (in ascending
      order) of the Qingshuihe, Hutubihe, Shengjinkou, and Lianmuqin
      Formations" -- and dates "A distinct, white tuffaceous siltstone ...
      lying ∼30 m below the vertebrate-bearing layers", the marker "that
      separates the Shengjinkou and Lianmuqin Formations" near Urho, at 135.2
      ± 0.9 Ma by CA-ID-TIMS U-Pb, "indicating a Valanginian maximum age for
      the Urho fauna". The Valanginian is a floor only: the unit "could have
      been deposited as early as the Valanginian", and "our maximum age
      estimate does not preclude a post-Valanginian depositional age". The
      positive evidence is younger: the clam shrimp Cratostracus, also in the
      Aptian Guantou Formation, and a
      Cicatricosisporites-Interulobites-Classopollis-Tricolpites assemblage
      with angiosperm pollen give "an Aptian-Albian age for the Lianmuqin
      Formation of the southern Junggar Basin". The paper's age model puts
      "the Lianmuqin Formation as Valanginian to Albian". The lower part at
      Urho, where the vertebrates are, is bounded only from below.
  - id: tucker2022a
    notes: >
      "Strata of the Tugulu Group (China) likely span the Valanginian;
      however, it is unclear which of its formations dates to this age",
      this unit among those "variably" dated to it.
  - id: gale2020a
    notes: >
      Runs the Valanginian from 137.7 to 132.6 Ma, so the 135.2 Ma floor is
      Valanginian.
  - id: jia2024a
    notes: >
      Places Wuerhosaurus homheni "in the Lianmuqin Formation of the Tugulu
      Group in the late Valanginian age", citing Zheng and colleagues
      (2023). That reads Zheng's maximum age as the age of the beds.
