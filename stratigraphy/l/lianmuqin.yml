name: Lianmuqin
rank: formation
parent: Tugulu
period: [Early Cretaceous]
stages: [Valanginian, Hauterivian, Barremian, Aptian, Albian]
lithology: variegated mudstone and siltstone
references:
  - id: zheng2023a
    notes: >
      Dates a tuff at the Shengjinkou–Lianmuqin contact near Urho at 135.2 ± 0.9
      Ma, a Valanginian maximum, and gives the formation as "Valanginian to
      Albian".
  - id: tucker2022a
    notes: >
      "Strata of the Tugulu Group (China) likely span the Valanginian;
      however, it is unclear which of its formations dates to this age",
      this unit among those "variably" dated to it.
  - id: gale2020a
    notes: >
      Runs the Valanginian from 137.7 to 132.6 Ma, so the 135.2 Ma floor is
      Valanginian.
  - id: jia2024a
    notes: >
      Places Wuerhosaurus homheni "in the Lianmuqin Formation of the Tugulu
      Group in the late Valanginian age", citing Zheng and colleagues
      (2023). That reads Zheng's maximum age as the age of the beds.
  - id: lucas2001b
    notes: >
      The uppermost of the Tugulu Group's four formations, "interbedded red
      green and yellow variegated mudstones and siltstones, 213–360 m thick",
      with a dinosaur-dominated assemblage near Urho. With the Shengjinkou it
      forms the "Upper Tugulu Group", a fauna "of Tsagantsabian age", a
      land-vertebrate age the book does not tie to a stage. Source of the
      lithology.
