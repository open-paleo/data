name: Lianmuqin
rank: formation
parent: Tugulu
period: [Early Cretaceous]
stages: [Valanginian, Hauterivian, Barremian, Aptian, Albian]
references:
  - id: jia2024a
    notes: >
      Places it "of the Tugulu Group in the late Valanginian".
  - id: zheng2023a
    notes: >
      Gives the group's order -- "the Tugulu Group consists (in ascending
      order) of the Qingshuihe, Hutubihe, Shengjinkou, and Lianmuqin
      Formations" -- and reads this unit as possibly "deposited as early as
      the Valanginian". Paleontological evidence indicates "an Aptian-Albian
      age for the Lianmuqin Formation of the southern Junggar Basin", and the
      paper's age model puts "the Lianmuqin Formation as Valanginian to
      Albian".
