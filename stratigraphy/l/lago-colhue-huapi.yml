name: Lago Colhué Huapi
rank: formation
period: [Late Cretaceous]
stages: [Coniacian, Santonian, Campanian, Maastrichtian]
references:
  - id: casal2015a
    notes: >
      Erects the unit and fixes its position: it "overlies the Bajo Barreal
      Formation (Upper Member) and it is covered by the Laguna Palacios or
      Salamanca Formation", with base and top transitional. The Bajo Barreal
      Upper Member survives the split. What the new unit resolved was
      attribution rather than rock: "stratigraphic and chronological aspects
      of these levels have historically been confused, which in many cases
      resulted in the conflicting and questionable stratigraphic placement of
      their fossils". From its dinosaurs the paper concludes that "the age of
      the proposed formation is comprised between Coniacian–Maastrichtian":
      caudal vertebrae preliminarily assigned to Rebbachisauridae, from the
      first red mudstones at estancia Ocho Hermanos, suggest those levels
      correspond "at most to the Coniacian", and the Aeolosaurus–hadrosaur
      association at the headwaters of the Río Chico indicates that the
      sediments there "should correspond, at least, to the Early Campanian".
  - id: casal2007a
    notes: >
      The earliest age reading for these beds, made before the unit existed:
      "a Campanian-Maastrichtian? age for the upper levels of this
      stratigraphic unit, outcropping in the southeast of Lago Colhué Huapi",
      then attributed to the upper Bajo Barreal.
  - id: ibiricu2019a
    notes: >
      Gives "Lago Colhue Huapi Formation, Coniacian–Maastrichtian", and places
      Sektensaurus within it in "the Upper Cretaceous (Campanian)".
  - id: ibiricu2025a
    notes: >
      Places the formation in the "Upper Cretaceous (Coniacian–Maastrichtian)"
      and carries the younger bound: studies of its uppermost part,
      "particularly those of palynomorphs, support a late Maastrichtian age
      for these strata", while its middle section is "Santonian –?lower
      Maastrichtian".
