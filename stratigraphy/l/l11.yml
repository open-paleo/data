name: L11
rank: bed
informal: true
parent: Wessex
period: [Early Cretaceous]
variants: [Black Band]
references:
  - id: naish2022a
    notes: >
      Places it in the scheme and in section: Stewart (1978) "assigned bed
      numbers to each of the plant debris beds within the Wessex Formation and
      E. lengi was recovered from L11, the plant debris bed above the Grange
      Chine Sandstone". The horizon is "the L11 plant debris bed above the
      Grange Chine Sandstone of the Wessex Formation of the Wealden
      Supergroup. It dates to the Barremian". The published name is "L11 plant
      debris bed", of which the bare numeral is a truncation.
  - id: lockwood2025a
    notes: >
      Gives the equation that makes Black Band a name for this bed rather than
      a separate one: MIWG 6643 came "from the 'Black Band' (bed L11 in
      Stewart ...), a plant debris bed cropping out c. 100 m east of Grange
      Chine, lying above the Grange Chine Sandstone in the Wessex Formation".
  - id: stewart1978a
