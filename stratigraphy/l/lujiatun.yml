name: Lujiatun
rank: member
parent: Yixian
period: [Early Cretaceous]
stages: [Barremian]
references:
  - id: zhong2021a
    notes: >
      Dates single zircons from tuffs at the "top (CY18–20), middle (CY17–17)
      and bottom (CY17–18 and CY17–9) of the Yixian Formation" by CA-ID-IRMS
      U-Pb, putting the formation's onset "at 125.755 ± 0.061 Ma (CY17–9)" and
      giving "the extraordinarily short duration of the LJT Unit (<71 ± 86
      Kyr)"; the overlying Jianshangou Unit is resolvably younger. Earlier
      ages for the unit were "younger than those of the immediate overlying
      Lower Lava Unit", which "casts serious doubt on the robustness of these
      dating results". On GTS2020, which runs the Barremian from 126.5 to
      121.4 Ma, 125.755 Ma is Barremian.
  - id: chang2017a
    notes: >
      Gives argon-argon ages "of 126.0 ± 0.8 Ma for a basaltic sample at
      Lujiatun village and 125.8 ± 1.0 Ma for a basaltic sample at Daziying
      village", combined "in a weighted mean age of 125.92 ± 0.62 Ma", and
      recalculates an earlier 123.2 ± 1.0 Ma for the unit as 124.4 ± 1.0 Ma.
  - id: gale2020a
    notes: >
      "The Barremian Stage lasted 5.1 Myr from 126.5 ± 0.7 to 121.4 ± 0.6 Ma",
      and the Hauterivian ran "from 132.6 ± 0.6 to 126.5 ± 0.7 Ma".
  - id: sereno2009a
    notes: >
      Gives "Lujiatun Beds [Hauterivian-Barremian stages, ~130 million years
      ago (Ma)] of the Lower Cretaceous" in the main text, but its notes date
      the same beds "to the late Early Cretaceous (Barremian-Aptian, ~125
      Ma)". Both readings predate the high-precision dating of Zhong and
      colleagues (2021), which puts the unit in the Barremian.
  - id: sereno2010a
    notes: >
      Gives "Lujiatun Beds, lowermost Yixian Formation (late Barremian or
      earliest Albian)", placing it at the base of the formation. Late
      Barremian and earliest Albian are not adjacent stages, and the same
      paper's text has the lowermost Yixian beds "no older than 123–125 Ma,
      straddling the Barremian-Aptian boundary", so the Albian reads as a
      slip for Aptian. That boundary reading sets earlier argon dates against
      the 2004 time scale, and is superseded by Zhong and colleagues (2021).
  - id: cuenca-bescós2003a
    notes: >
      "Lujiatum Beds, Yixian Formation (Hauterivian, Liaoning, China)" is one
      of the gobiconodontid localities plotted on the Hauterivian
      paleogeographic map here.
