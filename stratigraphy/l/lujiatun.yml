name: Lujiatun
rank: member
parent: Yixian
period: [Early Cretaceous]
stages: [Barremian]
lithology: volcaniclastic sandstone and conglomerate
references:
  - id: zhong2021a
    notes: >
      Dates the onset of the Yixian Formation, at the base of the unit, to
      "125.755 ± 0.061 Ma" by U-Pb on single zircons, and gives the unit an
      "extraordinarily short duration".
  - id: chang2017a
    notes: >
      Dates basalts directly above the unit by argon-argon to a weighted mean of
      "125.92 ± 0.62 Ma", a minimum age for it, and recalculates an earlier date
      on the unit to 124.4 ± 1.0 Ma.
  - id: gale2020a
    notes: >
      "The Barremian Stage lasted 5.1 Myr from 126.5 ± 0.7 to 121.4 ± 0.6 Ma",
      and the Hauterivian ran "from 132.6 ± 0.6 to 126.5 ± 0.7 Ma".
  - id: sereno2009a
    notes: >
      Gives "Lujiatun Beds [Hauterivian-Barremian stages, ~130 million years
      ago (Ma)] of the Lower Cretaceous" in the main text, but its notes date
      the same beds "to the late Early Cretaceous (Barremian-Aptian, ~125
      Ma)". Both readings predate the high-precision dating of Zhong and
      colleagues (2021), which puts the unit in the Barremian.
  - id: sereno2010a
    notes: >
      Places the Lujiatun Beds in the "lowermost Yixian Formation" and dates
      them "late Barremian or earliest Albian".
  - id: cuenca-bescós2003a
    notes: >
      "Lujiatum Beds, Yixian Formation (Hauterivian, Liaoning, China)" is one of
      the gobiconodontid localities plotted on the Hauterivian paleogeographic
      map in this paper.
  - id: he2006a
    notes: >
      Dates the fossil-bearing tuff at Lujiatun village by argon-argon on
      K-feldspar to "123.2 ± 1.0 Ma", which it calls Aptian, and reads the bed
      as contemporaneous with the Jianshangou.
  - id: wang2016a
    notes: >
      Source of the lithology.
  - id: zhou2006b
    notes: >
      Gives "the upper parts of the Lujiatun beds" a 40Ar/39Ar date of 128.4 ±
      0.2 Ma, after Wang and colleagues (2001), the date the same paper gives
      for the lower Jianshangou sequence at Sihetun.
  - id: wang2001c
