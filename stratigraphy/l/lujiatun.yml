name: Lujiatun
rank: member
parent: Yixian
period: [Early Cretaceous]
stages: [Hauterivian, Barremian, Aptian, Albian]
dispute:
  summary: >
    Rank and age both move between sources, as with the Yixian's other
    subdivisions. Sereno and colleagues call it the "Lujiatun Beds" in both
    2009 and 2010, not a member, and date it "Hauterivian-Barremian" in the
    first and "late Barremian or earliest Albian" in the second.
references:
  - id: sereno2009a
    notes: >
      Gives "Lujiatun Beds [Hauterivian-Barremian stages, ~130 million years
      ago (Ma)] of the Lower Cretaceous" in the main text, but its notes date
      the same beds "to the late Early Cretaceous (Barremian-Aptian, ~125
      Ma)".
  - id: sereno2010a
    notes: >
      Gives "Lujiatun Beds, lowermost Yixian Formation (late Barremian or
      earliest Albian", placing it at the base of the formation.
  - id: cuenca-bescós2003a
    notes: >
      "Lujiatum Beds, Yixian Formation (Hauterivian, Liaoning, China)" is one
      of the gobiconodontid localities plotted on the Hauterivian
      paleogeographic map here.
