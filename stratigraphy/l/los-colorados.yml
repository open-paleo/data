name: Los Colorados
rank: formation
parent: Agua de la Peña
period: [Late Triassic, Early Jurassic]
stages: [Norian, Rhaetian]
references:
  - id: arcucci2003a
    notes: >
      Gives the containment, the formation being "the upper part of the Agua
      de la Peña Group in the Ischigualasto-Villa Union Basin in western
      Argentina". Reports its age as "widely considered as Norian", and
      records that Heckert and Lucas (2000) referred it instead to the
      Rhaetian, "basing this statement upon correlations of other tetrapod
      genera, mainly aetosaurs". Arcucci and colleagues doubt that referral,
      since recognizing a European marine stage in this predominantly
      terrestrial basin is difficult, and settle on "the latest part of the
      Late Triassic".
  - id: galton2004a
    notes: >
      Tabulates "Los Colorados Formation | Norian" for La Rioja.
  - id: peyredefabrègues2015a
    notes: >
      Independently gives the Esquina locality as "Late Triassic (Norian".
  - id: shubin1991a
    notes: >
      The formation's tetrapod assemblage is "generally considered to be Late
      Triassic in age", but in this cluster analysis it "weakly clustered with
      those from the Early Jurassic, emphasizing its peculiar, seemingly
      intermediate faunal composition". The reading is left open, the analysis
      supporting "the impression that this assemblage may either represent an
      intermediate fauna or that sampling of this formation may have
      encompassed both Late Triassic and Early Jurassic strata", with the
      published information insufficient to show whether all the taxa came
      from the same stratigraphic level.
