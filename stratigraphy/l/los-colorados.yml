name: Los Colorados
rank: formation
parent: Agua de la Peña
period: [Late Triassic]
stages: [Norian]
lithology: red sandstone sheets with thin mudstone and siltstone interbeds
references:
  - id: langer2018a
    notes: >
      Dates the top by magnetostratigraphy: "magnetostratigraphic correlation
      of upper Los Colorados Formation strata, coeval with those yielding the
      La Esquina fauna (Caselli et al., 2001), to the Newark astrochronological
      polarity time scale (Olsen et al., 2010) places them between ca. 213 and
      216 Ma".
  - id: mcphee2017b
    notes: >
      "The Los Colorados fauna is restricted to the La Esquina Member (upper
      third of the formation), with an upper age bound of ~213 Ma".
  - id: ezcurra2017a
    notes: >
      Places Zupaysaurus rougieri in "the middle Norian (ca. 213 Ma) upper
      levels of the Los Colorados Formation".
  - id: martínez2011a
    notes: >
      Places "the overlying Los Colorados Formation near the close of the Late
      Triassic (late Norian)".
  - id: ogg2020a
    notes: >
      GTS2020 takes the base of the Rhaetian at 205.7 Ma, with 209.5 Ma as
      the older candidate; either way an age of 213 Ma is Norian.
  - id: arcucci2003a
    notes: >
      Places the formation in "the upper part of the Agua de la Peña Group",
      reports its age as "widely considered as Norian", and dates it to "the
      latest part of the Late Triassic".
  - id: galton2004a
    notes: >
      Tabulates "Los Colorados Formation | Norian" for La Rioja.
  - id: peyredefabrègues2015a
    notes: >
      Independently gives the Esquina locality as "Late Triassic (Norian)".
  - id: shubin1991a
    notes: >
      In a cluster analysis of early Mesozoic tetrapod faunas, finds the
      formation's assemblage "weakly clustered" with Early Jurassic ones, and
      leaves its age open.
  - id: pol2007a
    notes: >
      Relays the older faunal readings: "The age of this unit has been
      considered as Norian–Rhaetian (Bonaparte 1972) or the tetrapod-based
      biochron late Coloradian (Bonaparte 1973)". Superseded by the
      magnetostratigraphic ages of Langer and colleagues (2018).
  - id: heckert2000a
    notes: >
      Refers the Los Colorados Formation to the Rhaetian on correlations of
      its tetrapods, mainly aetosaurs, as Arcucci and Coria (2003)
      report.
  - id: caselli2001a
    notes: >
      Cited by Langer and colleagues (2018) for the beds yielding the La
      Esquina fauna.
  - id: olsen2010a
    notes: >
      Cited by Langer and colleagues (2018) for the Newark astrochronological
      polarity time scale used to date the upper beds.
  - id: bonaparte1972a
    notes: >
      Cited by Pol and Powell (2007) for an older Norian–Rhaetian age for the
      formation.
  - id: bonaparte1973a
    notes: >
      Cited by Pol and Powell (2007) for the late Coloradian biochron age of
      the unit.
  - id: shipman2004a
    notes: >
      Source of the lithology.
