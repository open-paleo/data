name: Los Colorados
rank: formation
parent: Agua de la Peña
period: [Late Triassic]
stages: [Norian]
references:
  - id: langer2018a
    notes: >
      Dates the top by magnetostratigraphy: "magnetostratigraphic correlation
      of upper Los Colorados Formation strata, coeval with those yielding the
      La Esquina fauna (Caselli et al., 2001), to the Newark astrochronological
      polarity time scale (Olsen et al., 2010) places them between ca. 213 and
      216 Ma".
  - id: mcphee2017b
    notes: >
      "The Los Colorados fauna is restricted to the La Esquina Member (upper
      third of the formation), with an upper age bound of ~213 Ma".
  - id: ezcurra2017a
    notes: >
      Places Zupaysaurus rougieri in "the middle Norian (ca. 213 Ma) upper
      levels of the Los Colorados Formation".
  - id: martínez2011a
    notes: >
      Places "the overlying Los Colorados Formation near the close of the Late
      Triassic (late Norian)".
  - id: ogg2020a
    notes: >
      GTS2020 takes the base of the Rhaetian at 205.7 Ma, with 209.5 Ma as
      the older candidate; either way an age of 213 Ma is Norian.
  - id: arcucci2003a
    notes: >
      Gives the containment, the formation being "the upper part of the Agua
      de la Peña Group in the Ischigualasto-Villa Union Basin in western
      Argentina". Reports its age as "widely considered as Norian", and
      records that Heckert and Lucas (1998) referred it instead to the
      Rhaetian, "basing this statement upon correlations of other tetrapod
      genera, mainly aetosaurs". Arcucci and colleagues doubt that referral,
      since recognizing a European marine stage in this predominantly
      terrestrial basin is difficult, and settle on "the latest part of the
      Late Triassic". The magnetostratigraphic ages of Langer and colleagues
      (2018) place the upper formation in the Norian.
  - id: galton2004a
    notes: >
      Tabulates "Los Colorados Formation | Norian" for La Rioja.
  - id: peyredefabrègues2015a
    notes: >
      Independently gives the Esquina locality as "Late Triassic (Norian)".
  - id: shubin1991a
    notes: >
      The formation's tetrapod assemblage is "generally considered to be Late
      Triassic in age", but in this cluster analysis it "weakly clustered with
      those from the Early Jurassic, emphasizing its peculiar, seemingly
      intermediate faunal composition". The reading is left open, the analysis
      supporting "the impression that this assemblage may either represent an
      intermediate fauna or that sampling of this formation may have
      encompassed both Late Triassic and Early Jurassic strata", with the
      published information insufficient to show whether all the taxa came
      from the same stratigraphic level. The magnetostratigraphic ages of
      Langer and colleagues (2018) place the upper formation in the Norian,
      superseding the Early Jurassic suggestion.
  - id: pol2007a
    notes: >
      Relays the older faunal readings: "The age of this unit has been
      considered as Norian–Rhaetian (Bonaparte 1972) or the tetrapod-based
      biochron late Coloradian (Bonaparte 1973)". Superseded by the
      magnetostratigraphic ages of Langer and colleagues (2018).
