name: Las Leoneras
rank: formation
period: [Late Triassic, Early Jurassic]
stages: [Sinemurian, Pliensbachian, Toarcian]
references:
  - id: pol2011b
    notes: >
      Gives the competing readings and what constrains them: the unit has been
      "referred to the Pliensbachian–Toarcian" or to the "Upper
      Sinemurian–Toarcian", "although no direct datings of these sediments are
      available", and its age "is certainly constrained by the Middle Jurassic
      dating of the volcanic facies of the overlying Lonco Trapial Formation".
      The context is "consistent with a Lower Jurassic age for the Las
      Leoneras Formation. However, an Upper Triassic age cannot be completely
      ruled out at the moment, as there is not a well-defined lower constraint
      for the age of this unit."
  - id: cúneo2013a
    notes: >
      Places its base, the deposition of "the fluvial and lacustrine strata
      of the Las Leoneras Formation over the basement igneous and metamorphic
      rocks (Mamil Choike Formation)" beginning in the Early Jurassic.
  - id: pol2020a
    notes: >
      Sets it below the volcanic Lonco Trapial Formation and records that it
      "yielded Leonerasaurus taquetrensis", one of the youngest documented
      non-eusauropod sauropodomorphs.
