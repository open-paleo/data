name: Las Leoneras
rank: formation
period: [Early Jurassic]
stages: [Sinemurian, Pliensbachian, Toarcian]
lithology: sandstone and mudstone, with tuff and agglomerate
references:
  - id: pol2011b
    notes: >
      Finds an Early Jurassic age consistent with its setting below the Lonco
      Trapial Formation, though "no direct datings of these sediments are
      available".
  - id: cúneo2013a
    notes: >
      Places its base, the deposition of "the fluvial and lacustrine strata of
      the Las Leoneras Formation over the basement igneous and metamorphic rocks
      (Mamil Choike Formation)" beginning in the Early Jurassic. Source of the
      lithology.
  - id: pol2020a
    notes: >
      Sets it below the volcanic Lonco Trapial Formation and records that it
      "yielded Leonerasaurus taquetrensis", one of the youngest documented
      non-eusauropod sauropodomorphs.
