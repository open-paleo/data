name: Las Leoneras
rank: formation
period: [Early Jurassic]
stages: [Sinemurian, Pliensbachian]
lithology: sandstone and mudstone, with tuff and agglomerate
references:
  - id: pol2011b
    notes: >
      Finds an Early Jurassic age consistent with its setting below the Lonco
      Trapial Formation, though "no direct datings of these sediments are
      available", and relays readings of "Pliensbachian–Toarcian" and "Upper
      Sinemurian–Toarcian" from Figari and Courtade (1993) and Page and
      colleagues (1999).
  - id: cúneo2013a
    notes: >
      Places its base, the deposition of "the fluvial and lacustrine strata of
      the Las Leoneras Formation over the basement igneous and metamorphic rocks
      (Mamil Choike Formation)" beginning in the Early Jurassic. Dates a tuff
      in the upper formation, about 40 m below the Lonco Trapial, at 188.946 ±
      0.096 Ma by U–Pb on zircon, early Pliensbachian, and gives the formation
      "a Sinemurian to Pliensbachian age". Source of the lithology.
  - id: pol2020a
    notes: >
      Sets it below the volcanic Lonco Trapial Formation and records that it
      "yielded Leonerasaurus taquetrensis", one of the youngest documented
      non-eusauropod sauropodomorphs.
  - id: page1999a
    notes: >
      Gives the formation as Liassic "con reservas" from its stratigraphic
      position; its chart of the basin, after Figari and Courtade (1993), draws
      it from the upper Sinemurian to the top of the Toarcian.
  - id: figari1993a
