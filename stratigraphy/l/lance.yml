name: Lance
rank: formation
period: [Late Cretaceous]
stages: [Maastrichtian]
references:
  - id: boyd2009a
    notes: >
      Gives "Lance Formation of Wyoming (Maastrichtian; 70.6 to 65.5 Ma
      ...)". The 65.5 Ma end is an older figure for the
      Cretaceous–Paleogene boundary, which the ICS chart v2024/12 puts at
      66.0 Ma.
  - id: sullivan2006a
    notes: >
      Pairs it with its correlative at the same age: "Lance Formation,
      Montana and Wyoming; Hell Creek Formation, South Dakota; late
      Maastrichtian".
  - id: lull1915a
    notes: >
      Describes the unit as "The late Cretaceous beds of Wyoming, which have
      received from the United States Geological Survey the official
      designation of Lance formation", beds that had earlier gone by the names
      Laramie formation, Converse County beds, and Ceratops beds.
  - id: csiki-sava2016a
    notes: >
      Upper Maastrichtian, in a comparison: a Transylvanian theropod tooth
      morphotype "resembles in its shape teeth from the upper Maastrichtian
      Lance Formation of North America assigned by Longrich (2008) to the
      possible troodontid Pectinodon".
