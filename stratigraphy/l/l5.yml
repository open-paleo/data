name: L5
rank: bed
informal: true
parent: Wessex
period: [Early Cretaceous]
references:
  - id: pond2023a
    notes: >
      Gives "Plant debris bed L5 (Gale ...), Wessex Formation, Wealden Group",
      and places it: "Plant debris bed L5 lies close to the base of the
      exposed Wessex Formation on the Island, which is thought to be earliest
      Barremian in age". Cites the numbering to Gale in the horizon line and
      to Stewart later in the same paper, where Lockwood and colleagues credit
      Stewart throughout.
  - id: sweetman2010a
    notes: >
      Follows Stewart's (1978) bed numbers and figures "Bed L5 exposed
      north-east of Chilton Chine ... to show rapid transition from basal
      conglomerate to the overlying siltstone and gradual transition from this
      into the overlying mudstone facies", with "distinct laminations
      delineated by the concentration of fine carbonaceous material". A second
      exposure it figures, about 25 m away, is placed "north-west of Chilton
      Chine".
  - id: stewart1978a
