name: La Colonia
rank: formation
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
references:
  - id: pérez-moreno2024a
    notes: >
      Gives "La Colonia Formation (Campanian-Maastrichtian".
  - id: pol2024a
    notes: >
      Uses the narrower "La Colonia Formation (Maastrichtian, Upper
      Cretaceous)". Koleken was found "close to the base of the stratigraphic
      section", and "The age of the base of this unit has been recently
      restricted to the early Maastrichtian".
  - id: martinelli2004a
    notes: >
      Gives "The La Colonia Formation (Campanian-Maastrichtian)" as "exposed
      in the north-central Chubut Province", and counts it with Los Alamitos
      among "the Campanian-Maastrichtian Los Alamitos and La Colonia
      formations", the richest Mesozoic mammal localities in South America.
