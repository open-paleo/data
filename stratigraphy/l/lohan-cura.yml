name: Lohan Cura
rank: formation
period: [Early Cretaceous]
stages: [Aptian, Albian]
references:
  - id: carballido2012a
    notes: >
      Dates it by way of a member inside it, "The age of this member is
      considered as Aptian-Albian" for the Puesto Quiroga.
  - id: bellardini2022a
    notes: >
      Gives "the fluvial sediments of the Lohan Cura Formation (Albian)" at
      Cerro de los Leones, and refers the Ligabuesaurus beds there to the
      lower section of the Cullín Grande Member, "the upper member of the
      Lohan Cura Formation (Bajada del Agrio Group, Lower Cretaceous,
      Albian)".
  - id: bellardini2022b
    notes: >
      Independently gives the same.
  - id: garrido2010a
    notes: >
      Albian, as the unit beneath the Neuquén Group: south of the Huincul
      Ridge "the Candeleros Formation rests concordantly on deposits of the
      Lohan Cura Formation, the latter with an estimated age in the Albian",
      following Leanza and Hugo (1995) and Leanza (1999). At the El Sauce
      field near Picún Leufú the boundary between the two is a level of
      evaporites, gypsum interlaminated with fine green mudstones, which forms
      the top of the Lohan Cura.
  - id: leanza1995a
    notes: >
      Erects the formation: the name "is proposed to identify a set of
      continental sedimentites that overlie Formation La Amarga in
      unconformity and are covered in the same manner by Formation Candeleros,
      reaching 177.20 m in thickness", with Cerro Lohan Cura as the type
      locality and the Puesto Quiroga and Cullin Grande members from bottom to
      top. Its age is bracketed rather than measured: the minimum comes from
      "the age of the unconformity existing at the base of the Neuquen Group
      which, according to Orchuela and Ploszkiewicz (1984), can be estimated
      at the Lower Cenomanian (97±3 Ma)", and the maximum "can reach the
      Aptian".
  - id: leanza1999a
