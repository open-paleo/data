name: Lohan Cura
rank: formation
period: [Early Cretaceous]
stages: [Aptian, Albian]
references:
  - id: carballido2012a
    notes: >
      Dates it by way of a member inside it, "The age of this member is
      considered as Aptian-Albian" for the Puesto Quiroga.
  - id: bellardini2022a
    notes: >
      Gives "the fluvial sediments of the Lohan Cura Formation (Albian)" at
      Cerro de los Leones, and refers the Ligabuesaurus beds there to the
      lower section of the Cullín Grande Member, "the upper member of the
      Lohan Cura Formation (Bajada del Agrio Group, Lower Cretaceous,
      Albian)".
  - id: bellardini2022b
    notes: >
      Independently gives the same.
  - id: garrido2010a
    notes: >
      Gives the formation "an estimated age in the Albian" after Leanza and Hugo
      (1995) and Leanza (1999), and places its top at an evaporite level beneath
      the Candeleros near Picún Leufú.
  - id: leanza1995a
    notes: >
      Erects the formation, with Cerro Lohan Cura as its type locality and the
      Puesto Quiroga and Cullín Grande members, and brackets its age between the
      La Amarga below and the Neuquén Group above.
  - id: leanza1999a
  - id: orchuela1984a
    notes: >
      Cited by Leanza and Hugo (1995) for a Lower Cenomanian age of the
      unconformity at the base of the Neuquén Group.
