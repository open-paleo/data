name: Lianhe
rank: formation
parent: Guifeng
period: [Late Cretaceous]
stages: [Maastrichtian]
references:
  - id: yao2026a
    notes: >
      Gives a bonebed "within the middle of the Upper Cretaceous
      (Maastrichtian) Lianhe Formation at the Zhutongkeng locality, Shahe
      Town, Zhanggong District, Ganzhou City, Jiangxi Province".
  - id: xing2024a
    notes: >
      Places it third in the Guifeng Group, after the Hekou and the Tangbian.
  - id: li2018a
    notes: >
      Treats the "Hekou and Lianhe formations" as "probably the same sequences
      but named differently", after Xie (2001), rather than successive units,
      and proposes keeping the name Hekou. Dates the Guifeng Group only by its
      position among the neighboring groups, as possibly starting "after~100Ma"
      in the early Late Cretaceous; no radiometric date comes from the group.
  - id: xie2001a
