name: Lameta
rank: formation
period: [Late Cretaceous]
stages: [Maastrichtian]
references:
  - id: chatterjee1978a
    notes: >
      Reads the unit as wholly Late Cretaceous and younger than the age Huene
      and Matley had given it: the Indosuchus horizon is "Lameta Group in the
      Narmada Valley, India, late Cretaceous", and correlation with the
      Ariyalur Stage "adds strength to the Maestrichtian assignment of the
      upper limit of the group". The lower third is "at least younger than the
      Turonian as tyrannosaurs are known to occur in the highest Cretaceous",
      with a lower limit that "may extend down to Santonian". The unit is
      handled at group rank, after Chanda and Bhattacharyya (1966), with a
      Greensand, a Limestone and a Sandy Limestone inside it.
  - id: wilson2003a
    notes: >
      Dates the formation Maastrichtian throughout, mapping "principal Late
      Cretaceous (Maastrichtian) dinosaur localities in the Lameta Formation"
      and placing the Rajasaurus skeleton in "latest Cretaceous
      (Maastrichtian) beds near Rahioli" in Gujarat. The bones lie in a
      conglomeratic layer below an egg-bearing limestone equivalent to the
      "Main Lameta limestone" at Bara Simla, which "has been regarded as
      latest Cretaceous (Maastrichtian) in age on the basis of
      microvertebrates and associated microfossils" and on its position
      beneath the Deccan Trap flood basalts.
  - id: huene1933a
    notes: >
      Huene and Matley date the Lameta fauna by correlation with Depéret's
      Madagascan beds and conclude "we may take the fossiliferous beds at
      Jubbulpore to be Turonian and the Pisdura beds to be lowest Senonian",
      arguing from plentiful allosaurids, coelurids and compsognathids and
      from the unspecialized nodosaur Lametasaurus that these rocks record "an
      age not high in the Upper Cretaceous". This is the source of the
      mid-Cretaceous stages attached to the formation, and it is a correlation
      later work replaces with a Maastrichtian age.
  - id: jain1997a
    notes: >
      The horizon of Titanosaurus colberti at Dongargaon is given as "Late
      Cretaceous (Maastrichtian)", and "A Maastrichtian age for the Lameta
      Formation, in general, is also suggested by Buffetaut (1987), Dogra et
      al. (1988), Udhoji and Mohabey (1991), and Chatterjee (1992)". Jain and
      Bandyopadhyay set that against a sequence of earlier readings for the
      Dongargaon exposure, from a Paleocene-to-Eocene age for the fish fauna
      through a post-Cretaceous age and a Santonian-to-Maastrichtian range,
      and conclude with Mohabey and colleagues that the biota indicates "a
      terminal Cretaceous (=Maastrichtian) age".
  - id: carrano2008a
    notes: Gives "Lameta Formation; Maastrichtian".
  - id: chure2000a
    notes: >
      Independently, "Lameta Formation AGE: Maastrichtian".
  - id: chanda1966a
beds:
  - name: Carnosaur Bed
    informal: true
    period: [Late Cretaceous]
    stages: [Maastrichtian]
    references:
      - id: carrano2008a
        notes: >
          Gives the occurrence in full: "Bara Simla Hill, Jabalpur, Madhya
          Pradesh, India; 'Carnosaur Bed', 'infratrappean beds' of the Lameta
          Formation; Maastrichtian, Late Cretaceous (Matley 1921)". Both this
          paper and Walker keep the name in quotation marks, and it traces to
          Matley (1921) rather than to a formal erection, which is why it carries
          `informal`.
      - id: walker1964a
        notes: >
          Records what the name denotes: Matley "gave an account of the discovery
          of a large mass of bones from a single spot, the 'Carnosaur Bed' of Bara
          Simla Hill, Jubbulpore". A single quarry horizon rather than a mappable
          unit.
      - id: matley1921a
  - name: Sauropod Bed
    informal: true
    period: [Late Cretaceous]
    references:
      - id: huene1933a
        notes: >
          Gives the section it belongs to at Bara Simla, running "Deccan trap,
          Upper sands, Upper limestone, Mottled nodular beds, Lower or Main
          Limestone, Green sand, and White clays of Jabalpur formation, with
          Sauropod bed, Ossiferous conglomerate, and Carnosaur bed indicated".
          The counterpart to the Carnosaur bed, from the same Matley scheme.
      - id: wilson2003b
        notes: >
          Records the attribution and its uncertainty: "Matley's research at Bara
          Simla suggested that the 'Sauropod bed' yielded the fossils", against an
          alternative reading placing them in the "'Ossiferous conglomerate'".
          Keeps the name in quotation marks, as the Carnosaur sources do.
