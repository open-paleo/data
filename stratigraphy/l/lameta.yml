name: Lameta
rank: formation
period: [Late Cretaceous]
stages: [Maastrichtian]
references:
  - id: chatterjee1978a
    notes: >
      Treats the Lameta as a group of three formations, after Chanda and
      Bhattacharyya (1966), and puts its upper limit in the Maastrichtian by
      correlation with the Ariyalur Stage.
  - id: wilson2003a
    notes: >
      Dates the formation Maastrichtian, placing the Rajasaurus skeleton in
      "latest Cretaceous (Maastrichtian) beds near Rahioli", below an
      egg-bearing limestone.
  - id: huene1933a
    notes: >
      Dates the fossil beds by correlation with a Madagascan fauna, taking those
      at Jubbulpore "to be Turonian and the Pisdura beds to be lowest Senonian".
  - id: jain1997a
    notes: >
      Dates the Titanosaurus colberti horizon at Dongargaon "Late Cretaceous
      (Maastrichtian)" and names four works that give the formation in general a
      Maastrichtian age.
  - id: carrano2008a
    notes: Gives "Lameta Formation; Maastrichtian".
  - id: chure2000a
    notes: >
      Independently, "Lameta Formation AGE: Maastrichtian".
  - id: chanda1966a
  - id: buffetaut1987a
    notes: >
      Jain and Bandyopadhyay (1997) list it among works giving the Lameta
      Formation a Maastrichtian age.
  - id: dogra1988a
    notes: >
      Jain and Bandyopadhyay (1997) list it among works giving the Lameta
      Formation a Maastrichtian age.
  - id: udhoji1991a
    notes: >
      Jain and Bandyopadhyay (1997) list it among works giving the Lameta
      Formation a Maastrichtian age.
  - id: chatterjee1992a
    notes: >
      Jain and Bandyopadhyay (1997) list it among works giving the Lameta
      Formation a Maastrichtian age.
beds:
  - name: Carnosaur Bed
    informal: true
    period: [Late Cretaceous]
    stages: [Maastrichtian]
    references:
      - id: carrano2008a
        notes: >
          Gives the occurrence in full: "Bara Simla Hill, Jabalpur, Madhya
          Pradesh, India; 'Carnosaur Bed', 'infratrappean beds' of the Lameta
          Formation; Maastrichtian, Late Cretaceous (Matley 1921)". The
          Maastrichtian follows the formation's name, and the credit to Matley
          (1921) covers the locality, not the age: Matley dates the Lameta
          "Albian or Cenomanian or both". Keeps the name in quotation marks, as
          Walker does.
      - id: huene1933a
        notes: >
          Names it among the fossil horizons of the Bara Simla section, which
          "will be referred to, in ascending order, as the Carnosaur bed, the
          Ossiferous Conglomerate, and the Sauropod bed", and places it "At the
          top of the greensand zone, immediately under the Main Limestone". A
          working label rather than a formal erection, which is why the bed
          carries `informal`.
      - id: walker1964a
        notes: >
          Records what the name denotes: Matley "gave an account of the discovery
          of a large mass of bones from a single spot, the 'Carnosaur Bed' of Bara
          Simla Hill, Jubbulpore". A single quarry horizon rather than a mappable
          unit.
      - id: matley1921a
        notes: >
          Describes the horizon without naming it: at "the top of the greensand
          zone", "a large mass of bones was found immediately below the Main
          Limestone", which he calls the "Megalosaurian bone-mass". Dates only
          the Lameta as a whole, concluding "the Lameta Group Albian or
          Cenomanian or both".
  - name: Sauropod Bed
    informal: true
    period: [Late Cretaceous]
    stages: [Maastrichtian]
    references:
      - id: huene1933a
        notes: >
          Gives the section it belongs to at Bara Simla, running "Deccan trap,
          Upper sands, Upper limestone, Mottled nodular beds, Lower or Main
          Limestone, Green sand, and White clays of Jabalpur formation, with
          Sauropod bed, Ossiferous conglomerate, and Carnosaur bed indicated".
          The counterpart to the Carnosaur bed, from the same Matley scheme.
      - id: wilson2003b
        notes: >
          Records the attribution and its uncertainty: "Matley's research at Bara
          Simla suggested that the 'Sauropod bed' yielded the fossils", against an
          alternative reading placing them in the "'Ossiferous conglomerate'".
          Keeps the name in quotation marks, as the Carnosaur sources do.
      - id: chure2000a
        notes: >
          Gives the Orthogoniosaurus matleyi locality as the "Sauropod Bed, 50
          yards northeast of and slightly stratigraphically above" the Carnosaur
          Bed on Bara Simla Hill. Its "AGE: Maastrichtian" sits beside "HORIZON:
          Lameta Formation" in a compiled entry whose ages follow Weishampel
          (1990) unless stated otherwise, so it dates the formation, not the
          bed.
      - id: weishampel1990b
        notes: >
          The compilation whose ages Chure (2000) follows unless stated
          otherwise, the source of the Maastrichtian it gives for the
          formation.
