name: Lytle
rank: member
parent: Purgatoire
period: [Early Cretaceous]
stages: [Aptian, Albian]
references:
  - id: brill2007a
    notes: >
      Relocates the Theiophytalia type, which comes not from the Morrison
      Formation "but in the lower Lytle Member of the Purgatoire Formation
      (Dakota Group), which is of Aptian-Albian age", and gives the type
      horizon as "Lower Lytle member of the Purgatoire Formation (Lower
      Cretaceous)". Places the site on the ridge running south towards
      Colorado City.
  - id: mcdonald2010b
    notes: >
      Independently gives "the Aptian-Albian Lytle Member of the Purgatoire
      Formation of Colorado".
  - id: mateer1987a
    notes: >
      Ranks it the Lytle Formation, the basal formation of the Dakota Group
      after Gustason and Kauffman (1985): "The twofold division of the Dakota
      Group (Purgatoire and Dakota formations) is rejected", and the member
      rank in the Purgatoire is reported as the scheme of Finlay (1916). The
      unit unconformably overlies the Morrison Formation, is "36 m at the type
      section just south of Colorado Springs", and is overlain disconformably
      by the Plainview. Rare ostracods and bivalves in it suggest an
      Aptian–Albian age, and homotaxial units "support an Aptian-middle Albian
      age for the Lytle", though "more fossil data from the Lytle itself are
      required to firmly establish its age".
  - id: gustason1985a
  - id: finlay1916a
