name: Lytle
rank: member
parent: Purgatoire
period: [Early Cretaceous]
stages: [Aptian, Albian]
lithology: coarse white conglomeratic sandstone
references:
  - id: brill2007a
    notes: >
      Relocates the Theiophytalia type, which comes not from the Morrison
      Formation "but in the lower Lytle Member of the Purgatoire Formation
      (Dakota Group), which is of Aptian-Albian age", and gives the type horizon
      as "Lower Lytle member of the Purgatoire Formation (Lower Cretaceous)".
      Places the site on the ridge running south towards Colorado City. Source
      of the lithology.
  - id: mcdonald2010b
    notes: >
      Gives "the Aptian–Albian Lytle Member of the Purgatoire Formation of
      Colorado", citing Brill and Carpenter (2007).
  - id: mateer1987a
    notes: >
      Ranks it the basal formation of the Dakota Group, rejecting the
      Purgatoire, and dates it "Aptian-Albian" from rare ostracods and bivalves.
  - id: gustason1985a
  - id: finlay1916a
