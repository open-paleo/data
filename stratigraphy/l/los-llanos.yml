name: Los Llanos
rank: formation
period: [Late Cretaceous]
stages: [Campanian]
references:
  - id: velandia2025a
    notes: >
      Gives the Vitosaura horizon at "the Tama locality, in outcrops of the
      Campanian Los Llanos Formation", La Rioja Province, northwestern
      Argentina, in a paleosol level of the Tama pedotype about 28 meters
      above the underlying Patquía Formation, and confirms abelisaurids in the
      unit. Hedges that age in the systematic section: "A Late Cretaceous age
      (possibly Campanian) has been suggested for the Los Llanos Formation
      based on an association of microfossils" and vertebrates.
