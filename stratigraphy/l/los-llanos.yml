name: Los Llanos
rank: formation
period: [Late Cretaceous]
stages: [Campanian]
description: "Los Llanos Formation is a geological formation in the La Rioja Province, northwestern Argentina whose strata date back to the Campanian stage of the Late Cretaceous. The formation crops out in the Sanagasta geological park, where more than 90 titanosaurid nesting sites were discovered in Los Llanos Formation. The sites were encountered on top of areas characterized by hydrothermal activity as geysers and other vents, suggesting a preferred location for the incubation of the dinosaur eggs. Apart from fossil eggs, the formation has provided fossil flora and ostracods."
references:
  - id: jiménezvelandia2025a
    notes: >
      Gives the Vitosaura horizon at "the Tama locality, in outcrops of the
      Campanian Los Llanos Formation", La Rioja Province, northwestern
      Argentina, in a paleosol level of the Tama pedotype about 28 meters
      above the underlying Patquía Formation, and confirms abelisaurids in the
      unit. Hedges that age in the systematic section: "A Late Cretaceous age
      (possibly Campanian) has been suggested for the Los Llanos Formation
      based on an association of microfossils" and vertebrates.
