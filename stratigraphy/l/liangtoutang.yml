name: Liangtoutang
rank: formation
parent: Tiantai
period: [Early Cretaceous, Late Cretaceous]
stages: [Albian, Cenomanian]
variants:
- Laijia
references:
- id: zheng2012a
  notes: >
    Places the formation in the Tiantai Group between the Tangshang and
    Chichengshan Formations, a red sandstone of shallow lacustrine origin rich
    in eggs and bones. Notes that it "has been assigned previously to late
    Early Cretaceous" and radiometrically dated at 105.9 to 103.2 Ma, while
    fossil comparison and stratigraphic correlation point to the early Late
    Cretaceous: "Taking into account the radiometric dates and stratigraphic
    correlation, we place it in the mid-Cretaceous, Albian–Cenomanian." Its
    type horizon and keywords give the same "Albian–Cenomanian"; only the
    abstract prints "the Liangtoutang Formation (Aptian–Cenomanian)".
- id: zheng2018a
  notes: >
    Records Laijia Formation as an alternate name and gives the age as
    mid-Cretaceous, Albian to Cenomanian, 105.9 to 96 Ma, from three
    radiometric studies and stratigraphic correlation, giving the horizon as
    "later Early to early Late Cretaceous (Albian-Cenomanian)"; the formation
    had been widely accepted as early Late Cretaceous before those dates.
- id: xing2024a
  notes: >
    Repeats the Albian to Cenomanian span.
