name: Liangtoutang
rank: formation
parent: Tiantai
period: [Early Cretaceous, Late Cretaceous]
stages: [Albian, Cenomanian]
variants:
- Laijia
lithology: red sandstone
references:
- id: zheng2012a
  notes: >
    Places the formation in the Tiantai Group between the Tangshang and
    Chichengshan Formations, a red sandstone of shallow lakes, and dates it
    "Albian–Cenomanian". Source of the lithology.
- id: zheng2018a
  notes: >
    Records Laijia Formation as an alternate name and gives the age as
    mid-Cretaceous, Albian to Cenomanian, 105.9 to 96 Ma, from three
    radiometric studies and stratigraphic correlation, giving the horizon as
    "later Early to early Late Cretaceous (Albian-Cenomanian)"; the formation
    had been widely accepted as early Late Cretaceous before those dates.
- id: xing2024a
  notes: >
    Repeats the Albian to Cenomanian span.
- id: he2012a
  notes: >
    Calls the unit the Laijia Formation, between the Tangshang and
    Chichengshan formations, and dates three tuffs "conformably interbedded"
    in it by SIMS U-Pb on zircon, at 99.4 ± 1.1, 97.2 ± 0.7 and 96.1 ± 0.9 Ma,
    giving "about 96–99 Ma (Cenomanian)" as the depositional age of the
    enclosing beds.
- id: yu2010a
  notes: >
    Records that the two members of the Laijia Formation were renamed the
    Liangtoutang and Chichengshan Formations in 1996, and ties the lower
    Liangtoutang to the lower Jinhua and Chaochuan by their eggs.
