references:
  - id: ansorge2025a
    notes: >
      Erects the member, with its type section in the Grimmen clay pit, and
      gives its position there as "units 2-7, Posidonia Shale Formation,
      Lehmhagen Member, lower Toarcian, semicelatum Subzone".
  - id: haubold1990a
    notes: >
      Describes the beds in the clay pit near Grimmen without naming the member,
      placing the Emausaurus holotype in a "bituminous shale" of the lowermost
      Toarcian, after Ernst (1967).
