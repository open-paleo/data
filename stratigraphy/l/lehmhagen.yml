name: Lehmhagen
rank: member
parent: Posidonia Shale
period: [Early Jurassic]
stages: [Toarcian]
references:
  - id: ansorge2025a
    notes: >
      Gives the unit and its position in the Grimmen clay pit, "units 2-7,
      Posidonia Shale Formation, Lehmhagen Member, lower Toarcian,
      semicelatum Subzone".
  - id: haubold1990a
    notes: >
      Describes the beds in the clay pit east of Klein-Lehmhagen, near
      Grimmen, without naming the member: the Emausaurus holotype comes from
      "the lowest concretion layer in the 30 to 50 cm thick 'bituminous
      shale', interpreted as the equivalent of the Posidonia Shale"
      (translated), of the Dactylioceras tenuicostatum Zone and the base of
      the Harpoceras falcifer Zone, lowermost Toarcian, after Ernst (1967).
  - id: ernst1967a
