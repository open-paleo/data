name: Lecho
rank: formation
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
references:
  - id: powell2003a
    notes: >
      Places it in its wider framework and fixes the fossil level: "Lecho
      Formation, Balbuena Subgroup, Salta Group. The fossiliferous level lies
      22 m above the base of this unit." Gives the El Brete estancia as "11 km
      west of El Tala, upon National Route 9 in the Department of Candelaria,
      in southern Salta Province" -- note Hendrickx and colleagues (2024) give
      Route 6 rather than Route 9 for the site's road.
  - id: powell1992a
    notes: >
      Repeats the 22 m level and brackets the age: the formation "underlies
      the Yacoraite Formation", and correlation with the Colorado River and
      Allen faunas "infers a Campanian-Maastrichtian age for the Lecho
      Formation".
  - id: hendrickx2024a
    notes: >
      Gives "the Maastrichtian Lecho Formation of Salta, Argentina" and logs
      the occurrence of Noasaurus within it against the overlying
      "Maastrichtian–Danian Yacoraite Formation of the Balbuena Subgroup,
      Salta Group", dating that occurrence "early or mid Maastrichtian, Upper
      Cretaceous". Notes the formation "is typically regarded as belonging to
      the latest stages of the Cretaceous, either as (?Upper)
      Campanian–Maastrichtian ... or strictly Maastrichtian".
