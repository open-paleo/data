name: Lecho
rank: formation
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
references:
  - id: powell2003a
    notes: >
      Places the formation in the Balbuena Subgroup of the Salta Group, puts the
      El Brete fossil level "22 m above the base" of it, and locates the
      estancia 11 km west of El Tala.
  - id: powell1992a
    notes: >
      Repeats the 22 m level and brackets the age: the formation "underlies
      the Yacoraite Formation", and correlation with the Colorado River and
      Allen faunas "infers a Campanian-Maastrichtian age for the Lecho
      Formation".
  - id: hendrickx2024a
    notes: >
      Calls the formation Maastrichtian and dates the Noasaurus occurrence to
      the "early or mid Maastrichtian", beneath the Maastrichtian–Danian
      Yacoraite Formation.
  - id: marquillas2005a
    notes: >
      Places the formation at the base of the Balbuena Subgroup, which
      accumulated "during the Maastrichtian to Early Paleocene", above
      volcanics dated 70 ± 5 Ma.
  - id: montano2022a
    notes: >
      Models the base of the overlying Yacoraite Formation at about 68.1 Ma,
      by extrapolation below its lowest dated ash.
