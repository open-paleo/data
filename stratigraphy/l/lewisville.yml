name: Lewisville
rank: formation
parent: Woodbine
period: [Late Cretaceous]
stages: [Cenomanian]
dispute:
  summary: >
    Formation or member of the Woodbine. Tykoski and colleagues (2023) title
    their paper for "the Lewisville Formation (middle Cenomanian) of Texas";
    McDonald and colleagues (2017) twice write of "the Lewisville Member of
    the Woodbine Formation of Texas".
references:
  - id: tykoski2023a
    notes: >
      Uses formation rank and gives the age as middle Cenomanian.
  - id: mcdonald2017a
    notes: >
      Uses member rank under the Woodbine.
