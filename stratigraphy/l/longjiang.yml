name: Longjiang
rank: formation
period: [Early Cretaceous]
stages: [Barremian, Aptian]
references:
- id: wang2023a
  notes: >
    Lowest of the three Lower Cretaceous formations exposed in the
    Dayangshu Basin of the Great Khingan Range fold belt, beneath the
    Jiufengshan and Ganhe Formations; intermediate lava and clastic rocks
    yielding a Jehol-type assemblage at the Pigeon Hill locality.
- id: wang2022a
  notes: >
    Gives the horizon for the Pigeon Hill material as Longjiang Formation,
    Lower Cretaceous.
- id: wang2019d
  notes: >
    Dates the tuff of the fossil-bearing bed at Pigeon Hill: "A total of 99
    analyses defined a weighted mean 206Pb/238U age of 121±0.74 Ma
    (MSWD=1.5) (Fig. 2), which represents the formation age of volcanic
    tuff", given elsewhere as 121.23 ± 0.74 Ma, and places those strata in
    "the upper part of the Longjiang Formation".
