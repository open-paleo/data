name: Liburnian
rank: formation
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
dispute:
  summary: >
    Dalla Vecchia (2009, 2020) gives the Tethyshadros beds as upper Campanian
    to lower Maastrichtian, at "the basal part of the Liburnian Formation";
    Chiarenza and colleagues (2021), on foraminifera and strontium isotopes,
    place the same beds "between the lower Campanian and the lowermost middle
    Campanian".
references:
  - id: dallavecchia2009a
    notes: >
      Gives the Tethyshadros horizon as "A lens of well-bedded, black
      limestone, 10 meters-thick and 70 meters long, in the upper
      Campanian-Paleocene Liburnian Formation near the Villaggio del
      Pescatore, Trieste Province, north-eastern Italy".
  - id: dallavecchia2020a
    notes: >
      Narrows the horizon within it, the holotype coming from "the basal part
      of the Liburnian Formation (upper Campanian or lower Maastrichtian) of
      NE Italy".
  - id: dai2024a
    notes: >
      Independently places Tethyshadros in the "lower Liburnian Formation in
      Trieste Province of northeast Italy", late Campanian to early
      Maastrichtian.
  - id: csiki-sava2015a
    notes: >
      Places the Tethyshadros site at Villaggio del Pescatore in "calcareous
      deposits of the Liburnia Formation" and traces its dating: "first
      reported as Santonian ... or Santonian–Campanian", its age was later
      revised by Dalla Vecchia (2009) to late Campanian to early
      Maastrichtian, "based on biostratigraphic data and lithostratigraphic
      correlations".
  - id: chiarenza2021a
    notes: >
      Revises the age of the Villaggio del Pescatore beds, which "pertain to
      the lower part of the Liburnian limestone facies" and rest unconformably
      on "the limestone-dominated Aurisina facies". Foraminifera and
      strontium-isotope stratigraphy put them "between the lower Campanian and
      the lowermost middle Campanian", "between 81.5 and 80.5 Ma". Calls the
      unit a facies rather than a formation.
  - id: dallavecchia2006a
    notes: >
      Refers hadrosaurid remains from a paleokarst fissure at Kozina,
      southwestern Slovenia, to "deposits time-corresponding to the lower
      Liburnian Beds, Maastrichtian", the fissure fill including "dark
      limestone fragments from the Maastrichtian–Paleocene Liburnian Beds",
      after Debeljak and colleagues (1999).
  - id: debeljak1999a
