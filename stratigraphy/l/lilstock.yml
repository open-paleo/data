name: Lilstock
rank: formation
parent: Penarth
period: [Late Triassic]
stages: [Rhaetian]
description: "The Lilstock Formation is a geologic formation in England. It preserves bivalve, insect and other invertebrate fossils, as well as fossil fish of Agkistracanthus mitgelensis and the basal theropod dinosaur Newtonsaurus cambrensis dating back to the Rhaetian of the Triassic period."
references:
  - id: evans2025a
    notes: >
      Gives the rank, parent and age together, "the Cotham Member of the
      Lilstock Formation (Penarth Group, Rhaetian)", and names the Langport
      Member as its other subdivision.
  - id: martill2016a
    notes: >
      Places conodonts in "the Late Triassic Langport Member of the Lilstock
      Formation (Penarth Group) at Lavernock Point", 4 m beneath the
      Dracoraptor site.
