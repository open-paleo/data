name: Lufeng
rank: formation
period: [Early Jurassic]
stages: [Hettangian, Sinemurian, Pliensbachian, Toarcian]
lithology: maroon mudstone interbedded with quartzose sandstone
references:
  - id: barrett2005b
    notes: >
      Places the Lower Lufeng Formation in the "Lower Jurassic" and records
      its traditional split "into two horizons: the lower Dull Purplish Beds
      (Hettangian) and upper Dark Red Beds (Sinemurian)". Both are informal
      horizon names; the paper keeps them over the member names Fang and
      colleagues (2000) proposed, noting "this system has not been widely
      accepted".
  - id: raven2019a
    notes: Gives the whole as "Lufeng Formation (Hettangian-Sinemurian)".
  - id: xing2012b
    notes: >
      Recounts the dating of the Lower Lufeng Formation: it "was originally
      thought to be Late Triassic" (Bien, 1940; Young, 1951), but
      "biostratigraphical correlates (both vertebrate and invertebrate)
      indicate an Early Jurassic (Hettangian–Sinemurian) age". Sinosaurus
      specimen ZLJT01 comes from the lowermost (Shawan member) portion of the
      formation.
  - id: young1951a
  - id: fang2000a
    notes: >
      Erects the Lufeng Formation with its Shawan and Zhangjia'ao members and
      places all of it in the Lower Jurassic: the formal definitions sit under a Lower Jurassic
      heading and carry J1 symbols, with the Triassic units below them. The
      paper names no international stage anywhere, and no Norian, Rhaetian or
      Upper Triassic appears in it.
  - id: bien1940a
    notes: >
      Names the Lufeng Series and dates its lower part, the Lower Lufeng Series,
      as "Upper Triassic in age (uppermost middle Keuper)".
  - id: olsen1984a
    notes: >
      Correlates the Lower Lufeng Series with the upper Stormberg of southern
      Africa on shared vertebrate families and dates it Early Jurassic.
  - id: cui1976a
  - id: sigogneau-russell1981a
    notes: >
      Places the lower Lufeng in the Early Jurassic, its dark red beds "now
      admitted, both by geologists and paleontologists, to be Liassic".
  - id: you2014b
    notes: >
      Gives the age as "probably early - middle Early Jurassic (Hettangian -
      Pliensbachian)", with the formation above the Yubacun and disconformably
      below the Chuanjie.
  - id: huang2005a
    notes: >
      Places the formation in the Lower Jurassic on magnetostratigraphy and
      correlates its upper part with the upper Toarcian.
  - id: luo1995a
  - id: chen2026a
    notes: >
      Places the Triassic–Jurassic boundary in the underlying Yubacun Formation
      in a Kunming Basin drill core, with the Lower Jurassic Lufeng above it.
      Source of the lithology.
  - id: pang2002a
    notes: >
      Establishes the Yubacun Formation beneath the Fengjiahe, which it equates
      with the former Lower Lufeng Formation, and correlates the Yubacun with
      the marine Hettangian–lower Sinemurian.
  - id: wang2025a
    notes: >
      Gives the sequence as "the Lower Jurassic Yubacun Formation and Lufeng
      Formation", the Yubacun, "which represents the lowest Jurassic
      sequence", conformably overlying the Upper Triassic Shezi Formation and
      conformable with the Lufeng above.
  - id: hesselbo2020a
    notes: >
      Runs the Hettangian from 201.4 to 199.5 Ma.
