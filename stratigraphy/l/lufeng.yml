name: Lufeng
rank: formation
period: [Early Jurassic]
stages: [Hettangian, Sinemurian, Pliensbachian, Toarcian]
references:
  - id: barrett2005b
    notes: >
      Places the Lower Lufeng Formation in the "Lower Jurassic" and records
      its traditional split "into two horizons: the lower Dull Purplish Beds
      (Hettangian) and upper Dark Red Beds (Sinemurian)". Both are informal
      horizon names; the paper keeps them over the member names Fang and
      colleagues (2000) proposed, noting "this system has not been widely
      accepted".
  - id: raven2019a
    notes: Gives the whole as "Lufeng Formation (Hettangian-Sinemurian)".
  - id: xing2012b
    notes: >
      Recounts the dating of the Lower Lufeng Formation: it "was originally
      thought to be Late Triassic" (Bien, 1940; Young, 1951), but
      "biostratigraphical correlates (both vertebrate and invertebrate)
      indicate an Early Jurassic (Hettangian–Sinemurian) age". Sinosaurus
      specimen ZLJT01 comes from the lowermost (Shawan member) portion of the
      formation.
  - id: young1951a
  - id: fang2000a
    notes: >
      Erects the nomenclature this entry uses and places all of it in the
      Lower Jurassic: the formal definitions sit under a Lower Jurassic
      heading and carry J1 symbols, with the Triassic units below them. The
      paper names no international stage anywhere, and no Norian, Rhaetian or
      Upper Triassic appears in it, so the Triassic stages on this entry are
      not from here.
  - id: bien1940a
    notes: >
      The founding Triassic reading, and it hedges its own upper part. Its
      title is the claim - the discovery of Triassic saurischian and
      primitive mammalian remains at Lufeng - and it concludes that "the
      lower part of the so-called 'Younger Red Bed Formation' of Lufeng has
      been accurately dated as of Upper Triassic in age". But its summary
      separates the two halves: the lower series "has been reliably dated as
      of Upper Triassic in age (uppermost middle Keuper), while the ... Upper
      Lufeng Series might still be of Upper Triassic (upper Keuper), though
      the possibilities of its being post-Trias, or Lias are not completely
      ruled out". The argument is conducted in Keuper and Lias, and no
      international stage appears in it. It predates the recognition of the
      Yubacun Formation between the Triassic Shezi and this unit.
  - id: olsen1984a
    notes: >
      "Floral evidence strongly suggests that the lower Lufeng, too, is Early
      Jurassic in age", after Cui (1976) and Sigogneau-Russell and Sun (1981).
      The Lower Lufeng Series shares morganucodontid mammals, tritylodontids,
      prosauropod and ornithischian dinosaurs and protosuchian crocodiles at
      family level with the upper Stormberg assemblage of southern Africa,
      which the paper dates Early Jurassic (Hettangian to Pliensbachian).
  - id: cui1976a
  - id: sigogneau-russell1981a
    notes: >
      Places the unit in the Early Jurassic and contradicts the Triassic
      reading for its upper part specifically. Under an Early Jurassic
      heading it records that the purple beds are "differently allocated
      according to the various authors either to the Rhaetic or to the
      earliest Jurassic", while "The upper level at least, composed of dark
      red beds (mudstones and sandstones), is now admitted, both by
      geologists and paleontologists, to be Liassic", the argument running
      through a coal level correlated into Szechuan. It adds that "further
      study is necessary before its age can be definitively set", and
      elsewhere writes of the famous Chinese "Triassic" mammals in its own
      quotation marks.
  - id: you2014b
    notes: >
      Biostratigraphic correlation makes the age "probably early - middle
      Early Jurassic (Hettangian - Pliensbachian)" after Luo and Wu (1995),
      while "Magnetostratigraphic analysis has indicated late Sinemurian –
      ?Toarcian for the age of the Lufeng Formation" after Huang and
      colleagues (2005). In the Lufeng area the formation overlies the Lower
      Jurassic Yubacun Formation and is disconformably overlain by the Middle
      Jurassic Chuanjie Formation.
  - id: huang2005a
    notes: >
      A magnetostratigraphic study of the Jurassic in the Lufeng area, and it
      places this unit and its neighbors in the Lower Jurassic: its
      stratigraphic table carries the Fengjiahe and the Lufeng formations both
      as J1, with the Lufeng's two members beneath that heading and the
      Triassic units below them. It correlates the upper part of the Lufeng
      Formation with the upper Toarcian, reads sites low in the section as
      "roughly" middle Sinemurian, and records that the interval from the base
      of the upper member down through the Shawan Member "has unstable rock
      magnetism with disordered directions", so the members themselves are the
      part it cannot correlate. It concludes that the transitional Yubacun
      Formation, between the Upper Triassic Zhaijie and the Lower Jurassic
      Lufeng, "should be assigned to the Jurassic System". It names no Norian,
      and its single Rhaetian is a polarity zone below this unit. Its middle
      Sinemurian for the low sites is an unanchored polarity correlation,
      superseded at the base by the dated core of Chen and colleagues (2026);
      its upper Toarcian stands.
  - id: luo1995a
  - id: chen2026a
    notes: >
      In drill core WK23-1 in the Kunming Basin, "the Triassic–Jurassic
      transitional Yubacun Formation is stratigraphically bounded by the
      overlying Lufeng Formation (Lower Jurassic) at 15.23 m depth and the
      underlying Shezi Formation (Upper Triassic)". An astrochronology
      anchored "to the established high-precision U-Pb age for the onset of
      the I-CIE ... at 201.51 ± 0.15 Ma" puts the Triassic–Jurassic boundary
      inside the Yubacun and its topmost beds at about 200.17 Ma, with the
      main carbon-isotope excursion continuing "into the basal Lufeng
      Formation". On GTS2020 the base of the Lufeng is therefore Hettangian.
      The core is in the Kunming Basin, not the Chuxiong Basin of the type
      area, and the base may be diachronous between them.
  - id: pang2002a
    notes: >
      Establishes the Yubacun Formation at its type section near Yipinglang,
      Lufeng County, where "the sequence from top to bottom is the Fengjiahe
      Formation, the Yubacun Formation, and the Shezi Formation", the
      Fengjiahe being the "former Lower Lufeng Formation". It assigns "the
      Shezi Formation to the Norian–Rhaetian and the Yubacun Formation to the
      Lower Jurassic, roughly equivalent to the marine Hettangian–lower
      Sinemurian", which would start this unit no earlier than the
      Sinemurian; the dated core of Chen and colleagues (2026) puts the top
      of the Yubacun in the Hettangian. The core is preferred: Pang's
      equivalence correlates a mixed-polarity section against the 1995 time
      scale with no age anchor, while Chen's age model is anchored to a U-Pb
      date. The two are different sections, the Lufeng County type section
      and the Wande core, and the base of the Lufeng may differ in age
      between the Chuxiong and Kunming basins.
  - id: wang2025a
    notes: >
      Gives the sequence as "the Lower Jurassic Yubacun Formation and Lufeng
      Formation", the Yubacun, "which represents the lowest Jurassic
      sequence", conformably overlying the Upper Triassic Shezi Formation and
      conformable with the Lufeng above.
  - id: hesselbo2020a
    notes: >
      Runs the Hettangian from 201.4 to 199.5 Ma.
