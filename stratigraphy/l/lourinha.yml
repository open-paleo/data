name: Lourinhã
rank: formation
period: [Late Jurassic, Early Cretaceous]
stages: [Kimmeridgian, Tithonian, Berriasian]
references:
  - id: schneider2009a
    notes: >
      Fluvial sandstones of the unit were laid down in the northernmost sector
      of the Lusitanian Basin while the Alcobaça and other formations
      accumulated elsewhere, and the body of sandstone "gradually expanded
      southward to the Torres Vedras area and covered the entire NLB and large
      parts of the CLB", so that "Stratigraphically, the unit spans the entire
      Kimmeridgian and Tithonian". Sr-isotope ages on oyster shells contradict
      the model of Pena dos Reis and colleagues (1996), which included the
      Arranhó in this formation and had the formation start only in the late
      Early Tithonian. Which beds belong here has shifted with each author:
      the Praia Azul and Sobral were moved into the Farta Pão Formation, where
      this paper keeps the Sobral as a member, and the Sobral has elsewhere
      been treated as a basal member of this formation.
  - id: mateus2009b
    notes: >
      The 400-m-thick formation "consists of mostly alluvial sediments,
      deposited during the early rifting of the Atlantic Ocean in the
      Kimmeridgian and Tithonian", its succession shifting repeatedly between
      flood-plain mud and fluvial sands in a way that favors the preservation
      of tracks. Elsewhere puts the same deposition in "latest Jurassic,
      Tithonian–Kimmeridgian times" after Hill (1989), and its conclusions
      carry the age again: "The Lourinhã Formation (Kimmeridgian/Tithonian)
      contains a rich and diverse dinosaur ichno- and somatofossil fauna".
  - id: mateus2017a
    notes: >
      The dedicated treatment, titled "The Lourinhã Formation: the Upper
      Jurassic to lowermost Cretaceous of the Lusitanian Basin, Portugal",
      which is where the formation rank and the span come from. The
      Berriasian is in its text and not only in that title: the last field
      stop "examines the top of the Assenta Member of the Lourinhã Formation
      ... upper Tithonian to lowermost Berriasian) and the Porto da Calada
      Formation ... Berriasian) and thus includes the Jurassic-Cretaceous
      boundary". Notes the
      deposits "can reach almost 400 m".
