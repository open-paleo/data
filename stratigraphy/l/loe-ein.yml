name: Loe-ein
rank: formation
period: [Late Jurassic, Early Cretaceous]
stages: [Kimmeridgian]
dispute:
  summary: >
    Dong (1990) gives Monkonosaurus "from the Loe-ein Formation (Kimmeridgian
    or Neocomian)", and Sun and colleagues (1992) the "Loe-ein Formation",
    "Late Jurassic or Early Cretaceous". Weishampel and colleagues (2004) list
    it instead under the "Lura Formation (?= Loe-ein Formation ...)", "Early
    Cretaceous", citing Sun and colleagues among others, who give neither the
    Lura name nor an Early Cretaceous age alone; Pereda-Suberbiola and
    colleagues (2013) relay that placement.
references:
  - id: dong1990b
    notes: >
      Gives the hedged age, Monkonosaurus coming "from the Loe-ein Formation
      (Kimmeridgian or Neocomian)", and sets it beside Wuerhosaurus from the
      Tugulu Group.
  - id: pereda-suberbiola2013a
    notes: >
      States that the age "is uncertain", records Dong's Late Jurassic to
      Early Cretaceous reading, and gives the competing Lura Formation
      assignment.
  - id: weishampel2004b
    notes: >
      A list row rather than prose, and the source of the queried synonymy:
      "Lura Formation (?= Loe-ein Formation; Zhao 1983; Dong 1990b; Sun et
      al. 1992)" for Xizang Zizhiqu, with Monkonosaurus lawulacus under it at
      "Age: Early Cretaceous (Sun et al., 1992; Yao et al., in press)". The
      question mark on the equation is the compendium's own. The age is an
      epoch rather than a stage, and is itself relayed, one of its two
      sources being in press at the time, so it adds nothing to the
      Kimmeridgian.
  - id: sun1992a
    notes: >
      Gives the Monkonosaurus lawulacus distribution as "Lawulashan, Monko,
      Tibet", "Loe-ein Formation", "Late Jurassic or Early Cretaceous" (p.
      163), with no mention of a Lura Formation.
