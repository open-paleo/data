name: Los Blanquitos
rank: formation
period: [Late Cretaceous]
stages: [Santonian, Campanian, Maastrichtian]
references:
  - id: powell1979a
    notes: >
      Places the Arroyo Morterito dinosaurs in "the upper section of the Los
      Blanquitos Formation (Pirgua Subgroup, Salta Group) of the Upper
      Cretaceous (Upper Senonian)", and concludes that "the Senonian
      (Campanian-Maestrichtian) age of the Los Blanquitos Formation can be
      reaffirmed", which radiometric dates from the Pirgua Subgroup also
      support. The overlying Yacoraite Formation is limited to the
      Maastrichtian.
  - id: carrano2012a
    notes: >
      Gives the Unquillosaurus pubis as coming "from the Los Blanquitos
      Formation (late Santonian-?Campanian) of Arroyo El Morterito", Salta,
      Argentina, keeping the Campanian as a query.
