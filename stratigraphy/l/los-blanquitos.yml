name: Los Blanquitos
rank: formation
period: [Late Cretaceous]
stages: [Santonian, Campanian, Maastrichtian]
lithology: red and orange sandstone and conglomerate
references:
  - id: powell1979a
    notes: >
      Places the Arroyo Morterito dinosaurs in the upper section of the
      formation and reaffirms its "Senonian (Campanian-Maestrichtian) age"
      (translated). Source of the lithology.
  - id: carrano2012a
    notes: >
      Gives the Unquillosaurus pubis as coming "from the Los Blanquitos
      Formation (late Santonian-?Campanian) of Arroyo El Morterito", Salta,
      Argentina, keeping the Campanian as a query.
