name: Lonco Trapial
rank: formation
period: [Early Jurassic]
stages: [Pliensbachian, Toarcian]
dispute:
  summary: >
    Nullo and Proserpio (1975) redefine the Lonco Trapial Group as a
    formation under articles 6 and 7 of the Argentine stratigraphic code,
    reducing its Cajón de Ginebra and Cerro Carnerero formations to members
    and naming the effusive rocks above them the Pampa de Agnia Member.
    Cúneo and colleagues (2013), Pol and colleagues (2020) and Zaffarana and
    colleagues (2020) use formation rank. Rauhut (2003) still writes "the
    Lonco Trapial Group", and Cúneo and colleagues cite Nullo and Proserpio
    for "the so-called Lonco Trapial Group", the reverse of that paper's
    scheme. Pol and colleagues (2022) write that the Cerro Carnerero "is
    overlain by the Lonco Trapial Formation", treating the two as separate
    units.
references:
  - id: pol2011b
    notes: >
      Uses the unit as the upper age constraint on the Las Leoneras Formation,
      calling the andesite and volcaniclastic deposits that unconformably
      cover it Middle Jurassic. Already records the strain in that assignment:
      the sedimentary facies at the base of the unit in this region carry a
      well preserved taphoflora "that was originally regarded as Middle
      Jurassic in age", but new evidence makes it Early Jurassic.
  - id: pol2020a
    notes: >
      Dates the volcanic rocks directly: a U-Pb zircon date of 180.330 +/-
      0.068 Ma from the massive pyroclastic interval "provides a direct age
      constraint on its peak volcanic activity" and is congruent with the
      previously determined 188.9-178.8 Ma bracket, which the paper glosses as
      Pliensbachian-Toarcian. The timing puts this volcanism alongside the
      Karoo-Ferrar large igneous province and the early Toarcian oceanic
      anoxic event.
  - id: cúneo2013a
    notes: >
      Brackets the unit between U-Pb zircon dates on tuffs in the formations
      below and above it, a weighted mean of 188.946 +/- 0.096 Ma in the upper
      Las Leoneras Formation and 178.766 +/- 0.092 Ma in the lower Canadon
      Asfalto Formation, and concludes its age is "entirely within the Early
      Jurassic (Pliensbachian-Toarcian)", explicitly older than the Middle to
      Late Jurassic ages of 176 to 146 Ma that K-Ar geochronology had
      supported. Records that the conglomeratic and volcanic-dominated facies
      have carried the alternative names Taquetren Formation, Cerro Carnerero
      Formation and Canadon Puelman beds, "collectively grouped under the
      so-called Lonco Trapial Group", and that the flora at the base of the
      unit at Canadon del Zaino is restricted to the Pliensbachian.
  - id: rauhut2003c
    notes: >
      Names the group by way of its basal unit, the Cerro Carnerero being
      "the basal formation of the Lonco Trapial Group" in Chubut Province,
      Argentina. Its Toarcian to Middle Jurassic reading for the group
      predates the U-Pb dating.
  - id: nullo1975a
    notes: >
      Redefines the unit. "The assemblage of rocks that make up the Lonco
      Trapial Group ... constitute a lithostratigraphic unit that by its
      characteristics should be considered as a Formation", and under article
      7 of the code "the Formations that made up the Lonco Trapial Group
      should be considered as members", giving "Lonco Trapial Formation:
      Pampa de Agnia Member. Cerro Carnerero Member. Cajón de Ginebra
      Member." It placed the unit in the "Bayocian-Bathonian" on its
      lithology, flora and radiometric dating, before the U-Pb dates.
  - id: zaffarana2020a
    notes: >
      A petrogenetic study using formation rank throughout, with dated Lonco
      Trapial samples of "~192 Ma", "~185 Ma" and "~177–178 Ma", which run
      from the earliest Pliensbachian to the late Toarcian on GTS2020.
  - id: hesselbo2020a
    notes: >
      Puts the base of the Pliensbachian at 192.9 Ma and the base of the
      Toarcian at 184.2 Ma.
  - id: pol2022a
    notes: >
      Treats the Cerro Carnerero as a separate formation "overlain by the
      Lonco Trapial Formation", and cautions that the Lonco Trapial "may not
      be synchronous in all areas in which it has been recognized".
