name: Lonco Trapial
rank: group
period: [Early Jurassic, Middle Jurassic]
stages: [Pliensbachian, Toarcian, Aalenian, Bajocian, Bathonian]
references:
  - id: pol2011b
    notes: >
      Uses the unit as the upper age constraint on the Las Leoneras Formation,
      calling the andesite and volcaniclastic deposits that unconformably
      cover it Middle Jurassic. Already records the strain in that assignment:
      the sedimentary facies at the base of the unit in this region carry a
      well preserved taphoflora "that was originally regarded as Middle
      Jurassic in age", but new evidence makes it Early Jurassic.
  - id: pol2020a
    notes: >
      Dates the volcanic rocks directly: a U-Pb zircon date of 180.330 +/-
      0.068 Ma from the massive pyroclastic interval "provides a direct age
      constraint on its peak volcanic activity" and is congruent with the
      previously determined 188.9-178.8 Ma bracket, which the paper glosses as
      Pliensbachian-Toarcian. The timing puts this volcanism alongside the
      Karoo-Ferrar large igneous province and the early Toarcian oceanic
      anoxic event.
  - id: cúneo2013a
    notes: >
      Brackets the unit between U-Pb zircon dates on tuffs in the formations
      below and above it, a weighted mean of 188.946 +/- 0.096 Ma in the upper
      Las Leoneras Formation and 178.766 +/- 0.092 Ma in the lower Canadon
      Asfalto Formation, and concludes its age is "entirely within the Early
      Jurassic (Pliensbachian-Toarcian)", explicitly older than the Middle to
      Late Jurassic ages of 176 to 146 Ma that K-Ar geochronology had
      supported. Records that the conglomeratic and volcanic-dominated facies
      have carried the alternative names Taquetren Formation, Cerro Carnerero
      Formation and Canadon Puelman beds, "collectively grouped under the
      so-called Lonco Trapial Group", and that the flora at the base of the
      unit at Canadon del Zaino is restricted to the Pliensbachian.
  - id: rauhut2003c
    notes: >
      Names the group by way of its basal unit, the Cerro Carnerero being
      "the basal formation of the Lonco Trapial Group" in Chubut Province,
      Argentina.
