name: Laramie
rank: formation
period: [Late Cretaceous]
stages: [Maastrichtian]
references:
  - id: carpenter2002a
    notes: >
      Groups it with the Arapahoe and Denver as the basin's dinosaur-bearing
      "Upper Cretaceous strata" and, after Lehman (1987, 2001), puts their
      dinosaurs in the Triceratops-dominated Maastrichtian fauna.
  - id: csiki1998a
    notes: >
      Cites the dedicated faunal treatment, "Vertebrate fauna of the Laramie
      Formation (Maastrichtian), Weld County, Colorado".
  - id: novas1996a
    notes: >
      Gives "Ornithomimus" minutus, which Holtz (1995) had considered a
      possible member of the Mononykus lineage, as from the "Laramie
      Formation, Late Maastrichtian".
  - id: holtz1995a
    notes: >
      A theropod phylogeny, which names this unit once and not in connection
      with any age.
  - id: carpenter1979a
  - id: lehman1987a
  - id: lehman2001a
