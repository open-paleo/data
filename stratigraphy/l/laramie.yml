name: Laramie
rank: formation
period: [Late Cretaceous]
stages: [Maastrichtian]
description: "The Laramie Formation is a geologic formation of the Late Cretaceous (Maastrichtian) age, named for exposures in northeastern Colorado, in the United States. It was deposited on a coastal plain and in coastal swamps that flanked the Western Interior Seaway. It contains coal, clay and uranium deposits, as well as plant and animal fossils, including dinosaur remains. The formation contains some of the oldest records of grass in western North America."
references:
  - id: carpenter2002a
    notes: >
      Counts it, with the Arapahoe and Denver Formations, among the "Upper
      Cretaceous strata of the Denver Basin". Places it in the basin as "the
      delta plain environment of the Laramie Formation" at Locality 9, one of
      only two places in the basin that have yielded semiarticulated
      specimens, and, following Lehman (1987, 2001), treats the basin's
      dinosaurs as the southernmost part of the Triceratops-dominated
      Maastrichtian fauna.
  - id: csiki1998a
    notes: >
      Cites the dedicated faunal treatment, "Vertebrate fauna of the Laramie
      Formation (Maastrichtian), Weld County, Colorado".
  - id: novas1996a
    notes: >
      Gives "Ornithomimus" minutus, which Holtz (1995) had considered a
      possible member of the Mononykus lineage, as from the "Laramie
      Formation, Late Maastrichtian".
  - id: holtz1995a
    notes: >
      A theropod phylogeny, which names this unit once and not in connection
      with any age.
  - id: carpenter1979a
  - id: lehman1987a
  - id: lehman2001a
