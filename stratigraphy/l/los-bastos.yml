name: Los Bastos
rank: formation
parent: Neuquén
period: [Late Cretaceous]
stages: [Coniacian]
references:
  - id: gonzálezriga2013a
    notes: >
      Places it in the group and dates it, Malarguesaurus having been "found
      in strata assigned to Los Bastos Formation (early-middle Coniacian)"
      in the middle levels of the Neuquén Group, with Mendozasaurus in the
      upper levels of the Sierra Barrosa Formation.
  - id: bellardini2022a
    notes: >
      Independently gives "the Los Bastos Formation (Coniacian) of
      north-western Neuquén Basin (Mendoza Province, Argentina)".
  - id: garrido2010a
    notes: >
      Erects it for a succession of red mudstones with minor sandstone
      intercalations above the Portezuelo Formation and below the newly named
      Sierra Barrosa Formation, in the Río Neuquén Subgroup, with its type
      locality at the Los Bastos hydrocarbon deposit between Sierra Barrosa
      and Cerro Senillosa. Absolute dating is lacking: "Based on stratigraphic
      relations, an age ranging from Early Coniacian to Middle Coniacian is
      inferred for this unit."
