name: Lias
rank: group
period: [Late Triassic, Early Jurassic, Middle Jurassic]
stages: [Rhaetian, Hettangian, Sinemurian, Pliensbachian, Toarcian, Aalenian]
references:
  - id: cox1999a
    notes: >
      Defines the group for onshore England and Wales: "Predominantly grey,
      well bedded, marine calcareous mudstone and silty mudstone", up to about
      1300 m thick, resting "markedly non-sequential on Penarth Group or older
      strata" and overlain by the Inferior Oolite, with the chronostratigraphy
      "Uppermost Triassic to Middle Jurassic (lower Aalenian)". Its twelve
      formations include the Blue Lias, Scunthorpe Mudstone and Charmouth
      Mudstone.
