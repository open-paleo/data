name: Lias
rank: group
period: [Late Triassic, Early Jurassic, Middle Jurassic]
stages: [Rhaetian, Hettangian, Sinemurian, Pliensbachian, Toarcian, Aalenian]
description: "The Lias Group or Lias is a lithostratigraphic unit (a sequence of rock strata) found in a large area of western Europe, including the British Isles, the North Sea, the Low Countries and the north of Germany. It consists of marine limestones, shales, marls and clays. Lias is a Middle English term for hard limestone, used in this specific sense by geologists since 1833. In the past, geologists used Lias not only for the sequence of rock layers, but also for the timespan during which they were formed. It is now more specifically known that the Lias is Rhaetian to Toarcian in age (over a period of c. 20 million years between 200 to 180 million years ago) and thus also includes a part of the Triassic."
references:
  - id: cox1999a
    notes: >
      Defines the group for onshore England and Wales: "Predominantly grey,
      well bedded, marine calcareous mudstone and silty mudstone", up to about
      1300 m thick, resting "markedly non-sequential on Penarth Group or older
      strata" and overlain by the Inferior Oolite, with the chronostratigraphy
      "Uppermost Triassic to Middle Jurassic (lower Aalenian)". Its twelve
      formations include the Blue Lias, Scunthorpe Mudstone and Charmouth
      Mudstone.
