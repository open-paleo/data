name: Lower Argiles Rutilantes
rank: formation
period: [Late Cretaceous]
stages: [Campanian]
dispute:
  summary: >
    Tabuce and colleagues (2013) describe the Aix-en-Provence Basin localities
    as sitting in "an argillite formation characterized by fluviatile deposits
    and lacustrine beds (historically named Lower 'Argiles et Grès à Reptiles'
    Formation or Lower 'Argiles Rutilantes' Formation) dated from the Lower
    Rognacian, a local continental stage", and add that the Rognacian "has
    been equivocally proposed to be equivalent to the late
    Campanian-Maastrichtian period". The Aix-en-Provence geological map notice
    (Catzigras and colleagues, 1969) divides the Argiles et Grès à Reptiles at
    the Calcaire de Rognac into lower and upper parts, the same division Cojan
    and Moreau (2006) draw between this formation and the Upper Argiles
    Rutilantes.
references:
  - id: tortosa2014a
    notes: >
      "Lower Argiles Rutilantes Formation, upper part of the Lower Rognacian,
      Late Campanian" for the Jas Neuf Sud locality near Pourrières, Var.
  - id: tabuce2013a
    notes: >
      Treats the name as one of two historical names for the same argillite
      formation, and dates it by the Lower Rognacian local stage rather than
      by an international one.
  - id: cojan2006a
    notes: >
      Distinguishes this formation from a younger one of the same name. Its
      succession runs from "the Calcaire de Rognac Formation" to "the
      overlying Upper Argiles Rutilantes Formation" and then the Calcaire de
      Vitrolles, so the Upper formation lies above the Calcaire de Rognac and
      this one below it. The Upper formation's polarity sequence "can be
      attributed to anomaly 31 or the 31R-30N sequence"; that dating belongs
      to the Upper formation and not to this one.
  - id: catzigras1969a
    notes: >
      Divides the Argiles et Grès à Reptiles at the Calcaire de Rognac into a
      lower unit, 250 to 300 m, forming "the base of the Rognacian series",
      and an upper unit of 100 m, the division that parallels this formation's
      separation from the Upper Argiles Rutilantes.
