name: Lakota
rank: formation
period: [Early Cretaceous]
stages: [Berriasian, Valanginian, Hauterivian, Barremian, Aptian]
references:
  - id: boyd2015b
    notes: >
      Relocating a type locality confirmed "its provenance from unit L2 (lower
      Fuson Member equivalent) of the Lakota Formation", and "recently revised
      ages for the members ... based on charophyte and ostracod
      biostratigraphy" constrain the taxon to the late Valanginian to early
      Barremian. "Early interpretations of the age of the Lakota Formation
      varied from Valanginian to Aptian"; the ostracod, charophyte and
      mammalian work since then extends "the lower-most units to the
      Berriasian" and limits "the upper-most to the Barremian".
  - id: kirkland1993a
    notes: >
      Gives the younger reading, that the formation "has been dated
      independently of vertebrate fossils as Barremian".
  - id: weishampel1989a
    notes: >
      Gives the horizon of Iguanodon lakotaensis as the Lakota Formation,
      "Early Cretaceous, possibly Barremian", following Sohn (1979), and
      treats the genus's presence as "further evidence of a possible Barremian
      age for the unit".
  - id: sohn1979a
    notes: >
      States its conclusion on its own title page, and it is an exclusion
      rather than an assignment: the monograph is a "Revision of nonmarine
      Lower Cretaceous ostracode genera from the Black Hills ... On the basis
      of this revision, the Lakota Formation is considered to be pre-Aptian
      in age". So it assigns no stage and rules one out. The entry's other
      references agree with it: an upper Berriasian to lower Barremian
      correlation, a Barremian dated independently of vertebrates, and a
      "possibly Barremian" that is itself following this paper.
  - id: cifelli2014a
    notes: >
      The "nonmarine Lower Cretaceous Lakota Formation of the Black Hills
      region" is "correlated with the upper Berriasian–lower Barremian", lying
      between the underlying Morrison Formation and Aptian–Albian units
      exposed elsewhere in North America; "A pre-Aptian age for the Lakota
      Formation (Fig. 2, Berriasian to Barremian) is generally supported by
      charophyte data". Within the unit, the lower part of Chilson Member unit
      2 is constrained to "late Berriasian–Valanginian" and the sampled Fuson
      Member section to "late Valanginian–early Barremian", so that its
      mammals come from two horizons of different estimated age.
