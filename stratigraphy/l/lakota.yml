name: Lakota
rank: formation
period: [Early Cretaceous]
stages: [Berriasian, Valanginian, Hauterivian, Barremian]
lithology: mudstone, sandstone and limestone
references:
  - id: boyd2015b
    notes: >
      Places the Dakotadon type locality in unit L2 ("lower Fuson Member
      equivalent") and relays later work that runs the formation from the
      Berriasian to the Barremian.
  - id: kirkland1993a
    notes: >
      Relays Sohn (1979): the formation "has been dated independently of
      vertebrate fossils as Barremian", without Sohn's "or older".
  - id: weishampel1989a
    notes: >
      Gives the horizon of Iguanodon lakotaensis as the Lakota Formation,
      "Early Cretaceous, possibly Barremian", following Sohn (1979), and
      treats the genus's presence as "further evidence of a possible Barremian
      age for the unit".
  - id: sohn1979a
    notes: >
      Dates the formation from its ostracodes as "pre-Aptian", Barremian or
      older rather than late Aptian as earlier held.
  - id: cifelli2014a
    notes: >
      Correlates the formation with the upper Berriasian–lower Barremian, dating
      a lower Chilson Member horizon late Berriasian–Valanginian and a Fuson
      Member section late Valanginian–early Barremian. Source of the lithology.
  - id: d'emic2019a
    notes: >
      Correlates the Minnewaste Limestone and Fuson Member with lacustrine units
      "deposited in both the Aptian and the Albian", and describes a
      disconformity in the formation spanning most of the Aptian.
  - id: mcdonald2011a
    notes: >
      Gives the Dakotadon horizon as "Lakota Formation, Barremian–Aptian
      (Tschudy et al. 1984)". The work cited is a palynological study of the
      Cedar Mountain and Burro Canyon formations of the Colorado Plateau,
      which does not discuss the Lakota, so its Aptian has no support in its
      own citation.
  - id: tschudy1984a
