name: Lourinhã
rank: formation
period: [Late Jurassic, Early Cretaceous]
stages: [Kimmeridgian, Tithonian, Berriasian]
dispute:
  summary: >
    The formation's Early Cretaceous is disputed. Schneider and colleagues
    (2009) have it span "the entire Kimmeridgian and Tithonian", Mateus and
    colleagues (2009) give Kimmeridgian and Tithonian throughout, and Russo
    and Mateus (2021) also end at the Tithonian. Against them, Pena dos Reis
    and colleagues (1996) write that "The Tithonian and Berriasian are
    represented in the center and North by the Lourinhã formation", and Mateus
    and colleagues (2017) hold that "the last few meters of the Assenta Mb.
    can be considered as earliest Berriasian". Salminen and colleagues (2014)
    call the Assenta "Tithonian in age" in their background, but their own
    magnetostratigraphy at Porto da Calada places the Jurassic–Cretaceous
    boundary "at around 52 m of the log", below the base of the Porto da
    Calada Formation "at our 60 m".
references:
  - id: schneider2009a
    notes: >
      Fluvial sandstones of the unit were laid down in the northernmost sector
      of the Lusitanian Basin while the Alcobaça and other formations
      accumulated elsewhere, and the body of sandstone "gradually expanded
      southward to the Torres Vedras area and covered the entire NLB and large
      parts of the CLB", so that "Stratigraphically, the unit spans the entire
      Kimmeridgian and Tithonian". Sr-isotope ages on oyster shells contradict
      the model of Pena dos Reis and colleagues (1996), which included the
      Arranhó in this formation and had the formation start only in the late
      Early Tithonian. Which beds belong to the formation has shifted with each
      author: the Praia Azul and Sobral were moved into the Farta Pão Formation,
      where this paper keeps the Sobral as a member, and the Sobral has
      elsewhere been treated as a basal member of this formation.
  - id: mateus2009b
    notes: >
      The 400-m-thick formation "consists of mostly alluvial sediments,
      deposited during the early rifting of the Atlantic Ocean in the
      Kimmeridgian and Tithonian", its succession shifting repeatedly between
      flood-plain mud and fluvial sands in a way that favors the preservation
      of tracks. Elsewhere puts the same deposition in "latest Jurassic,
      Tithonian–Kimmeridgian times" after Hill (1989), and its conclusions
      carry the age again: "The Lourinhã Formation (Kimmeridgian/Tithonian)
      contains a rich and diverse dinosaur ichno- and somatofossil fauna".
  - id: mateus2017a
    notes: >
      The dedicated treatment, titled "The Lourinhã Formation: the Upper
      Jurassic to lowermost Cretaceous of the Lusitanian Basin, Portugal",
      which is where the formation rank and the span come from. The Berriasian
      is in its text and not only in that title: the last field stop "examines
      the top of the Assenta Member of the Lourinhã Formation (... upper
      Tithonian to lowermost Berriasian) and the Porto da Calada Formation
      (... Berriasian) and thus includes the Jurassic-Cretaceous boundary".
      Notes the deposits "can reach almost 400 m".
  - id: hill1989a
  - id: salminen2014a
  - id: russo2021a
  - id: penadosreis1996a
