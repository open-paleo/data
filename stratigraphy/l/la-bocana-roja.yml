name: La Bocana Roja
rank: formation
period: [Late Cretaceous]
stages: [Cenomanian, Turonian, Coniacian, Santonian, Campanian]
dispute:
  summary: >
    Kane and colleagues (2022) revise the age "from Campanian to Turonian",
    on a detrital zircon maximum depositional age of 93.6 ± 1.1 Ma for the
    upper part of the formation. Rivera-Sylva and Longrich (2024) answer that
    the zircon date "is only a maximum age" and that the dinosaur fauna
    "strongly argues for a mid- or late Campanian age", with "detrital
    zircons, dated ash beds, microfossils, fossil invertebrates and
    vertebrates providing discordant dates". The base of the overlying El
    Gallo Formation is dated to 75.84 Ma, and the age of the uppermost La
    Bocana Roja "differs from north to south" across the angular
    unconformity between them.
references:
  - id: chure2000a
    notes: >
      Gives the Labocania horizon as "LACM locality 7257, Arroyo del Rosario,
      Baja California, Mexico", in the La Bocana Roja Formation, at
      "?Campanian".
  - id: molnar1974a
    notes: >
      Following Kilmer (1963), describes it as "red mudstones and tuffs
      unconformably underlying" the El Gallo Formation. Says it "may thus be
      presumed late Campanian or earlier in age" from a late Campanian
      potassium-argon date in the El Gallo, and is "probably not older than
      Cenomanian" because it contains hadrosaurian fossils. The late Campanian
      bound rests on Kilmer's correlation with the lowermost El Gallo, which
      Kane and colleagues (2022) reject.
  - id: paul1988a
    notes: >
      Gives Labocania anomala from the "La Bocana Roja Formation of Baja
      California", dated "Campanian of the late Late Cretaceous".
  - id: kilmer1963a
  - id: kane2022a
    notes: >
      "The new data yield an MDA for the La Bocana Roja Fm. of 93.6±1.1 Ma
      (Turonian). Previous work suggested a Campanian age, based largely on
      the presence of a theropod dinosaur fossil, Labocania", and the paper
      revises "the age considerably from Campanian to Turonian". It rejects
      Kilmer's (1963) suggestion that the unit is the equivalent of the
      lowermost El Gallo Formation: "the latter is significantly older". The
      date is a maximum for the upper part, and the base of the formation is
      not exposed.
  - id: rivera-sylva2024a
    notes: >
      Replies that the zircon date "is only a maximum age", since "detrital
      zircons are reworked from older sediments", and that "Radiometric dates of
      tuffs in the overlying El Gallo Formation suggest a minimum age of 75.84
      ± 0.05 Ma for the La Bocana Roja Formation". It
      reads the dinosaurs, Labocania's tyrannosaur affinities and a lambeosaur
      ischium like Magnapaulia, as arguing "for a mid- or late Campanian age".
      That argument rests largely on Labocania, the fossil whose age is in
      question.
