name: La Bocana Roja
rank: formation
period: [Late Cretaceous]
stages: [Cenomanian, Turonian, Coniacian, Santonian, Campanian]
lithology: red mudstone and tuff
dispute:
  summary: >
    Kane and colleagues (2022) revise the age "from Campanian to Turonian",
    on a detrital zircon maximum depositional age of 93.6 ± 1.1 Ma for the
    upper part of the formation. Rivera-Sylva and Longrich (2024) answer that
    the zircon date "is only a maximum age" and that the dinosaur fauna
    "strongly argues for a mid- or late Campanian age", with "detrital
    zircons, dated ash beds, microfossils, fossil invertebrates and
    vertebrates providing discordant dates". The base of the overlying El
    Gallo Formation is dated to 75.84 Ma, and the age of the uppermost La
    Bocana Roja "differs from north to south" across the angular
    unconformity between them.
references:
  - id: chure2000a
    notes: >
      Gives the Labocania horizon as "LACM locality 7257, Arroyo del Rosario,
      Baja California, Mexico", in the La Bocana Roja Formation, at
      "?Campanian".
  - id: molnar1974a
    notes: >
      Describes the formation, after Kilmer, as "red mudstones and tuffs"
      below the El Gallo Formation. Presumes it "late Campanian or earlier"
      from a potassium-argon date of 73 ± 2 million years in the middle third
      of the El Gallo, given as a personal communication and read as late
      Campanian on the time scale of Kulp (1961), and probably not older than
      Cenomanian from its hadrosaurs. Source of the lithology.
  - id: paul1988a
    notes: >
      Gives Labocania anomala from the "La Bocana Roja Formation of Baja
      California", dated "Campanian of the late Late Cretaceous".
  - id: kilmer1963a
    notes: >
      Cited by Molnar (1974) for the unit names and the description of the
      rocks; credited with no age.
  - id: kane2022a
    notes: >
      Dates the upper part of the formation to a detrital-zircon maximum
      depositional age of 93.6 ± 1.1 Ma and revises its age "from Campanian to
      Turonian".
  - id: rivera-sylva2024a
    notes: >
      Reads the zircon date as "only a maximum age", takes a minimum of 75.84 Ma
      from tuffs in the El Gallo Formation above, and argues from the dinosaurs
      for a mid- or late Campanian age.
  - id: kulp1961a
