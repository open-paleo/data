name: La Amarga
rank: formation
period: [Early Cretaceous]
stages: [Barremian, Aptian]
references:
  - id: pereda-suberbiola2013a
    notes: >
      Gives the formation, one of its members and the span together: "La
      Amarga Formation, Puesto Antigual Member; Barremian-lower Aptian" of
      Neuquén.
  - id: salgado2006b
    notes: >
      Places the Zapalasaurus type in the Piedra Parada Member, "whose age is
      regarded as Barremian-lower Aptian", and reviews earlier datings of the
      formation, from Hauterivian to Aptian.
  - id: musacchio1975a
    notes: >
      Barremian, in two passing comparisons with the Chubut Group ostracods:
      Cypridea feruglioi "has certain morphological affinities with Cypridea
      australis Musacchio from the La Amarga Formation (Barremian) of
      Neuquén", and the Brazilian species missing from the Chubut material are
      likewise not found in "the La Amarga Formation [Barremian] of Neuquén".
  - id: leanza1995a
    notes: >
      Gives the formation as "habitualmente" assigned "al Hauteriviano tardío /
      Barremiano" on its microfauna, after Musacchio (1993), and charts it in
      the Barremian.
  - id: leanza1997a
    notes: >
      Assigns the formation "al Hauteriviano superior y Barremiano", from its
      microfauna and its position above Agrio Formation beds with early and
      middle Hauterivian ammonites.
  - id: leanza2003a
    notes: >
      Ascribes the formation "al Barremiano superior – Aptiano inferior", by
      correlation with the Huitrín Formation through the unconformities at its
      base and top, and finds it probable that the latest late Hauterivian and
      early Barremian left no rocks in the region.
  - id: leanza2004a
    notes: >
      Gives the formation as "Barremian–Early Aptian", crediting Leanza and
      Hugo (1995, 1997), whose texts give the late Hauterivian to Barremian.
  - id: musacchio1993a
  - id: uliana1975a
    notes: >
      Cited by Salgado and colleagues (2006) for a Hauterivian–Barremian age,
      by correlation with the upper Agrio Formation.
  - id: dellapé1978a
    notes: >
      Cited by Salgado and colleagues (2006), with Uliana and colleagues
      (1975), for a Hauterivian–Barremian age by correlation with the upper
      Agrio Formation.
