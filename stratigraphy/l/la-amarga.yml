name: La Amarga
rank: formation
period: [Early Cretaceous]
stages: [Hauterivian, Barremian, Aptian]
references:
  - id: pereda-suberbiola2013a
    notes: >
      Gives the formation, one of its members and the span together: "La
      Amarga Formation, Puesto Antigual Member; Barremian-lower Aptian" of
      Neuquén.
  - id: salgado2006b
    notes: >
      Groups under the formation "a thick package of continental sediments of
      lower Cretaceous age" and places the Zapalasaurus type in its Piedra
      Parada Member, "whose age is regarded as Barremian-lower Aptian".
      Reviews earlier datings, among them a correlation with the upper part of
      the Agrio Formation "to the Hauterivian–Barremian" and Leanza and Hugo's
      (1995, 1997) age for the three members "ranging from the late
      Hauterivian to the Barremian".
  - id: musacchio1975a
    notes: >
      Barremian, in two passing comparisons with the Chubut Group ostracods:
      Cypridea feruglioi "has certain morphological affinities with Cypridea
      australis Musacchio from the La Amarga Formation (Barremian) of
      Neuquén", and the Brazilian species missing from the Chubut material are
      likewise not found in "the La Amarga Formation [Barremian] of Neuquén".
