name: Laguna Colorada
rank: formation
period: [Early Jurassic]
references:
  - id: apaldetti2011a
    notes: >
      Gives the Triassic reading, listing Mussaurus among the taxa of "the
      Norian Laguna Colorada Formation", the age long based on the Dicroidium
      flora nearby. It predates the U-Pb dating, which places the beds in the
      Early Jurassic.
  - id: bandeira2024a
    notes: >
      Tabulates "cf. Heterodontosaurus sp. | Argentina | Laguna Colorada
      Formation | Sinemurian" beside a citation of Baez and Marsicano (2001),
      whose title places that find in the Upper Triassic.
  - id: pol2021a
    notes: >
      U–Pb dates from the Mussaurus-bearing interval, in the middle of the
      formation at its type locality, "assign an Early Jurassic (Sinemurian)
      maximum age" to those beds; its methods call them the "maximum age of
      deposition". Gives the formation as deposited "during the Early
      Jurassic".
  - id: hesselbo2020a
    notes: >
      Puts the base of the Pliensbachian at 192.9 Ma, against 190.8 Ma in
      GTS2012.
  - id: baez2001a
