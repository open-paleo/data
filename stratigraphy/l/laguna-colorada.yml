name: Laguna Colorada
rank: formation
period: [Late Triassic, Early Jurassic]
stages: [Norian, Rhaetian, Hettangian, Sinemurian]
dispute:
  summary: >
    Whether the unit is Triassic or Jurassic is unsettled. Apaldetti and
    colleagues (2011) place Mussaurus in "the Norian Laguna Colorada
    Formation"; Bandeira and colleagues (2024) tabulate the heterodontosaurid
    from the same unit as Sinemurian.
references:
  - id: apaldetti2011a
    notes: >
      Gives the Triassic reading, listing Mussaurus among the taxa of "the
      Norian Laguna Colorada Formation".
  - id: bandeira2024a
    notes: >
      Gives the Jurassic reading, tabulating "cf. Heterodontosaurus sp. |
      Argentina | Laguna Colorada Formation | Sinemurian".
  - id: pol2021a
    notes: >
      U–Pb dates from tuffaceous siltstones intercalated with the
      Mussaurus-bearing interval, in the middle of the formation at its type
      locality, "assign an Early Jurassic (Sinemurian) maximum age for the
      Mussaurus bearing sediments", although the unit "has long been regarded
      as Late Triassic (Norian) in age". Describes it as "a 170 m-thick
      succession of fluvio-lacustrine sediments deposited in a post-rift
      thermally induced sag basin during the Early Jurassic".
