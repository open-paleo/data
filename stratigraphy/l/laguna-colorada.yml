name: Laguna Colorada
rank: formation
period: [Early Jurassic]
stages: [Sinemurian, Pliensbachian]
references:
  - id: apaldetti2011a
    notes: >
      Gives the Triassic reading, listing Mussaurus among the taxa of "the
      Norian Laguna Colorada Formation", the age long based on the Dicroidium
      flora nearby. It predates the U-Pb dating, which places the beds in the
      Early Jurassic.
  - id: bandeira2024a
    notes: >
      Gives the Jurassic reading, tabulating "cf. Heterodontosaurus sp. |
      Argentina | Laguna Colorada Formation | Sinemurian", the label of Pol
      and colleagues (2021) rather than a separate dating.
  - id: pol2021a
    notes: >
      U–Pb dates from tuffaceous siltstones intercalated with the
      Mussaurus-bearing interval, in the middle of the formation at its type
      locality, "assign an Early Jurassic (Sinemurian) maximum age for the
      Mussaurus bearing sediments", although the unit "has long been regarded as
      Late Triassic (Norian) in age". Describes it as "a 170 m-thick succession
      of fluvio-lacustrine sediments deposited in a post-rift thermally induced
      sag basin during the Early Jurassic". The two dates, 192.78 ± 0.14 and
      192.74 ± 0.14 Ma, are labeled Sinemurian on the older scale; on the ICS
      chart v2024/12, whose Pliensbachian begins at 192.9 Ma, they fall at the
      Sinemurian–Pliensbachian boundary, and as a maximum the beds are that age
      or younger. Only the middle of the formation is dated.
  - id: hesselbo2020a
    notes: >
      Puts the base of the Pliensbachian at 192.9 Ma, against 190.8 Ma in
      GTS2012.
