name: Lulworth
rank: formation
parent: Purbeck
period: [Late Jurassic, Early Cretaceous]
stages: [Tithonian, Berriasian]
lithology: ostracod-rich calcarenite and micritic limestone, with evaporites,
  and interbedded mudstone and micrite above
references:
  - id: naish2008a
    notes: >
      Gives a member and the younger reading, Echinodon becklesii coming
      "probably from the Berriasian Warbarrow Tout Member of the Lulworth
      Formation of Durlston Bay, Dorset".
  - id: galton1978a
    notes: >
      Places Echinodon in the "freshwater Dirt Bed (Mammal Bed)" of the
      "Lulworth Beds" and reports both an "Upper Volgian or 'Tithonian'" age and
      a Berriasian one.
  - id: clements1993a
    notes: >
      Places the Cherty Freshwater Member at the top of the formation, below
      the Cinder Member at the base of the Durlston Formation.
  - id: norman2012a
    notes: >
      Gives the Owenodon dentary as "Collected from the 'Cherty freshwater
      beds'" of middle Berriasian age, labeling the horizon the Durlston
      Formation.
  - id: hesselbo2020a
  - id: casey1963a
    notes: >
      Proposes the name: "I would suggest the name 'Lulworth Beds' for the
      sequence between the Portland Stone and the Cinder Bed", the Cinder Bed
      falling "in the middle of the Middle Purbeck".
  - id: townson1975a
    notes: >
      Gives the unit formation rank: the "Purbeck Beds", "comprising the
      Lulworth and Durlston Beds (Casey 1963), are renamed Purbeck Group,
      Lulworth Formation and Durlston Formation". Its base lies on "a dark
      brown ostracodal stromatolitic limestone which marks the top of the
      Portland Group", and it is 30 to 55 m thick across Dorset.
  - id: hopson2008a
    notes: >
      Source of the lithology.
