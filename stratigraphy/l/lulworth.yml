name: Lulworth
rank: formation
parent: Purbeck
period: [Late Jurassic, Early Cretaceous]
stages: [Tithonian, Berriasian]
lithology: ostracod-rich calcarenite and micritic limestone, with evaporites,
  and interbedded mudstone and micrite above
references:
  - id: naish2008a
    notes: >
      Gives a member and the younger reading, Echinodon becklesii coming
      "probably from the Berriasian Warbarrow Tout Member of the Lulworth
      Formation of Durlston Bay, Dorset".
  - id: galton1978a
    notes: >
      Records the disagreement behind the older bound: the material occurs "in
      the Lulworth Beds of CASEY (1971, Upper Volgian or 'Tithonian', Upper
      Jurassic)", although Hesselbo and colleagues (2020) assign the Upper
      Volgian "to the lowermost Cretaceous", while "problems of determination
      of the age of the Lulworth Beds are reviewed by DODSON et al (1964) who
      assign them to the Berriasian". Its own horizon for Echinodon is the
      "freshwater Dirt Bed (Mammal Bed) in lower part of Lulworth Beds (Middle
      Purbeck Beds, Lower Cretaceous)". Uses "Lulworth Beds" where later work
      uses Formation.
  - id: clements1993a
    notes: >
      Places the Cherty Freshwater Member at the top of the formation, below
      the Cinder Member at the base of the Durlston Formation.
  - id: norman2012a
    notes: >
      Gives the Owenodon dentary as "Collected from the 'Cherty freshwater
      beds'" of middle Berriasian age, labeling the horizon the Durlston
      Formation.
  - id: hesselbo2020a
  - id: casey1963a
    notes: >
      Proposes the name: "I would suggest the name 'Lulworth Beds' for the
      sequence between the Portland Stone and the Cinder Bed", the Cinder Bed
      falling "in the middle of the Middle Purbeck".
  - id: townson1975a
    notes: >
      Gives the unit formation rank: the "Purbeck Beds", "comprising the
      Lulworth and Durlston Beds (Casey 1963), are renamed Purbeck Group,
      Lulworth Formation and Durlston Formation". Its base lies on "a dark
      brown ostracodal stromatolitic limestone which marks the top of the
      Portland Group", and it is 30 to 55 m thick across Dorset.
  - id: hopson2008a
    notes: >
      Describes its rock: "Dominated in the lower part by pale-weathering,
      ostracod-rich calcarenites that are commonly rippled. Stromatolitic or
      algal, micritic limestone, with evaporitic material, is also common
      (particularly in east Dorset). The upper part of the formation comprises
      monotonous, interbedded dark grey mudstones and white-weathering
      micrites."
