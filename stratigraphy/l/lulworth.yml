name: Lulworth
rank: formation
parent: Purbeck
period: [Late Jurassic, Early Cretaceous]
stages: [Tithonian, Berriasian]
references:
  - id: naish2008a
    notes: >
      Gives a member and the younger reading, Echinodon becklesii coming
      "probably from the Berriasian Warbarrow Tout Member of the Lulworth
      Formation of Durlston Bay, Dorset".
  - id: galton1978a
    notes: >
      Records the disagreement behind the older bound: the material occurs "in
      the Lulworth Beds of CASEY (1971, Upper Volgian or 'Tithonian', Upper
      Jurassic)", while "problems of determination of the age of the Lulworth
      Beds are reviewed by DODSON et al (1964) who assign them to the
      Berriasian". Its own horizon for Echinodon is the "freshwater Dirt Bed
      (Mammal Bed) in lower part of Lulworth Beds (Middle Purbeck Beds, Lower
      Cretaceous)". Uses "Lulworth Beds" where later work uses Formation.
