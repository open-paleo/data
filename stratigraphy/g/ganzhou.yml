name: Ganzhou
rank: group
period: [Late Cretaceous]
stages: [Cenomanian, Turonian, Coniacian]
references:
  - id: yao2026a
    notes: >
      Gives the subdivision that created it: the strata "were further
      subdivided into the lower Ganzhou Group composed of the Maodian and
      Zhoutian formations, and the upper Guifeng Group consisting of the
      Hekou, Tangbian and Lianhe formations in ascending order". No age is
      stated for the group itself.
  - id: xing2024a
    notes: >
      Dates the group through its members. "The Ganzhou Group is further
      subdivided into the Maodian and Zhoutian formations", and "Zircon dating
      placed the lower Maodian Formation to after the early Albian stage (110
      Ma), and the Zhoutian Formation to the Turonian to early Coniacian
      stages (96–90 Ma)". The Maodian has only that floor and lies beneath the
      Zhoutian. On GTS2020, whose Turonian begins at 93.9 Ma and Coniacian at
      89.4 Ma, the Zhoutian's 96 to 90 Ma runs from the middle Cenomanian to
      the late Turonian, so the Cenomanian comes from the paper's own figures
      and the Coniacian only from its stage label. Counts the group among
      "the Upper Cretaceous Ganzhou and Guifeng groups" of the Jiangxi red
      beds.
