name: Ganzhou
rank: group
period: [Late Cretaceous]
stages: [Cenomanian, Turonian]
references:
  - id: yao2026a
    notes: >
      Gives the subdivision that created it: the strata "were further
      subdivided into the lower Ganzhou Group composed of the Maodian and
      Zhoutian formations, and the upper Guifeng Group consisting of the
      Hekou, Tangbian and Lianhe formations in ascending order". No age is
      stated for the group itself.
  - id: xing2024a
    notes: >
      Dates the group through its members. "The Ganzhou Group is further
      subdivided into the Maodian and Zhoutian formations", and "Zircon
      dating placed the lower Maodian Formation to after the early Albian
      stage (110 Ma), and the Zhoutian Formation to the Turonian to early
      Coniacian stages (96–90 Ma)". The Maodian has only that floor and
      lies beneath the Zhoutian. The 96–90 Ma restates as a range what Li
      and colleagues (2018) give as a conditional floor, and the Turonian
      to early Coniacian is read off that range. The Coniacian has no
      further basis: even 90 Ma is Turonian on the ICS chart v2024/12,
      where the Coniacian begins at 89.8 Ma. Counts the group among "the
      Upper Cretaceous Ganzhou and Guifeng groups" of the Jiangxi red
      beds.
  - id: li2018a
    notes: >
      Gives the Maodian's youngest detrital zircons and, from them, only a
      floor for the Zhoutian: "the youngest zircon of the middle Maodian
      Formation gave an age of 98.0±1.0 Ma ... This indicates that the
      earliest deposition of the Maodian Formation may have been later than
      101.0 Ma ... Correspondingly, if the Zhoutian Formation lies above the
      Maodian Formation, its deposition may have been later than 95–90 Ma."
  - id: han2024a
    notes: >
      Dates the upper formation of the group by palynology, relayed: "The
      Zhoutian Formation consists of reddish siltstone and sandstone, with
      interbedded halite beds. Palynological analysis suggests an early Late
      Cretaceous (Cenomanian–Turonian) age". Repeats the age for the
      Gandititan quarry in the Zhoutian.
  - id: xi2021a
    notes: >
      Gives the Maodian as Barremian–Albian and "周田组为一套细碎屑岩,
      时代为阿尔布期晚期—塞诺曼期早期" ("the Zhoutian Formation is a fine clastic
      sequence dating to the late Albian–early Cenomanian", translated),
      citing no source for the Zhoutian. The Albian top is not taken: the
      palynology and the 96–90 Ma figure put the Zhoutian in the Cenomanian
      and Turonian.
  - id: xi2018a
    notes: >
      "The age of the Lengshuiwu, Maodian and Zhoutian Formations was
      suggested as late early Cretaceous", partly after Li and colleagues
      (2018), whose zircons give the Zhoutian only a floor of 95–90 Ma, not
      an Early Cretaceous age.
