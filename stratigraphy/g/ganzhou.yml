name: Ganzhou
rank: group
period: [Late Cretaceous]
stages: [Cenomanian, Turonian, Coniacian]
references:
  - id: yao2026a
    notes: >
      Gives the subdivision that created it: the strata "were further
      subdivided into the lower Ganzhou Group composed of the Maodian and
      Zhoutian formations, and the upper Guifeng Group consisting of the
      Hekou, Tangbian and Lianhe formations in ascending order". No age is
      stated for the group itself.
  - id: xing2024a
    notes: >
      Places the Zhoutian within it, "Zhoutian Formation, Ganzhou Group
      (Turonian-early Coniacian; Upper Cretaceous; 96-90 Ma)", an age from
      zircon dating that applies to the Zhoutian, which with the Maodian makes
      up the group. Counts the group among "the Upper Cretaceous Ganzhou and
      Guifeng groups" of the Jiangxi red beds.
