name: Gosau
rank: group
period: [Late Cretaceous, Paleocene]
references:
  - id: csiki-sava2015a
    notes: >
      Gives "the Upper Cretaceous to Palaeocene Gosau Group of the eastern
      Alps", and places the Muthmannsdorf beds in the Grünbach Formation "of
      the Lower Gosau Subgroup", after Summesberger and colleagues (2000).
  - id: augustin2023a
    notes: >
      Assigns the Muthmannsdorf coal-bearing series to "the lower Campanian
      Grünbach Formation of the Gosau Group".
  - id: hradecká1999a
    notes: >
      Puts the coal-bearing beds of Grünbach–Neue Welt, with the rest of its
      studied sediments, in an Upper Gosau Subgroup.
  - id: summesberger2000a
    notes: >
      Cited by Csiki-Sava and colleagues (2015) for placing the Grünbach
      Formation in a Lower Gosau Subgroup; its title presents the Grünbach
      Formation as one of three new terms in the Gosau Group.
