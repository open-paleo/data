name: Grès à Reptiles
rank: formation
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
references:
  - id: leloeuff1998a
    notes: >
      Type horizon for Variraptor: "Grès à Reptiles Formation; Late Campanian
      to Early Maastrichtian ...; La Bastide Neuve (Fox-Amphoux, Var,
      France)", the locality lying "in the Fox-Amphoux syncline, 35 km west of
      Draguignan". The bare name is this paper's own for the Var succession
      rather than a shortening of the Argiles et Grès à Reptiles, which is the
      Aix-en-Provence basin's formation. The two are separate units, not two
      spellings. The same name is used here for Roques-Hautes in the
      Bouches-du-Rhône.
  - id: turner2012a
    notes: >
      Records Variraptor mechinorum from the "Late Campanian to Early
      Maastrichtian, Late Cretaceous, Grès à Reptiles Formation, La Bastide
      Neuve".
