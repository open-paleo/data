name: Grinstead Clay
rank: formation
parent: Hastings Beds
period: [Early Cretaceous]
stages: [Valanginian]
dispute:
  summary: >
    Rank is contested, and the naming authority settles the position
    without settling the rank. Barker and colleagues (2023) set the
    disagreement out: the unit "subdivides the Tunbridge Wells Sands
    Formation" in one scheme "and from which the ''Suchosaurus
    cultridens'' type specimen was discovered ..., is downgraded to a
    member of the latter formation in other works". Galton (2009) uses
    formation rank and places it "at the top of the Hastings Group"; Raven
    and colleagues (2020) use formation throughout; and Norman and
    colleagues (2013) cannot keep one usage, writing Formation in the body
    and Member in both figure captions. Drew (1861), who names the unit,
    uses no rank word anywhere - he has "the bed of clay", "the second
    stratum", "the lower sands", the vocabulary of rank postdating him -
    but he is explicit about position: the clay "appears in the Tunbridge
    Wells Sand" and "divides the sand into Upper and Lower Tunbridge Wells
    Sand". That bears on the parent whichever rank is chosen, and it
    points away from the recorded one. The Tunbridge Wells Sand has no
    entry of its own.
references:
  - id: raven2020a
    notes: >
      The Hylaeosaurus armatus holotype came from Tilgate Forest near
      Cuckfield, West Sussex, at a quarry the paper calls "An imprecisely
      located quarry", and its horizon is given as "Lower Cretaceous,
      Valanginian" after Austen and Batten (2018). The unit is treated as a
      formation throughout, abbreviated "GC Fm" in the paper's stratigraphic
      scheme for the Wealden Supergroup.
  - id: norman2013a
    notes: >
      Places the Whiteman's Green quarries at Cuckfield, West Sussex, the
      likely source of the Iguanodon anglicus lectotype and of the Kukufeldia
      tilgatensis dentary, in "Hastings Group Beds of the Grinstead Clay
      Formation ... which is a mappable lithological unit that is exposed in
      the more westerly parts of the Weald", and dates those outcrops
      "upper-middle Valanginian in age (~137 Ma)". The figure captions for
      both specimens instead call the unit the Grinstead Clay Member, "upper
      middle Valanginian".
  - id: drew1861a
    notes: >
      Coins the name: "The bed of clay that appears in the Tunbridge Wells
      Sand, and thickens to 50 ft. to the westward, may well be called
      Grinstead Clay, from its occurring on the north side of the town of East
      Grinstead ... This clay of course divides the sand into Upper and Lower
      Tunbridge Wells Sand." Drew traces it west from Penshurst Park, where 17
      feet of clay rests on a bed of white rock-sand with the Wadhurst Clay
      not far beneath, to the Balcombe Tunnel cuttings, where more than 40 ft.
      can be measured and he estimates about 50 ft. in all; at East Grinstead
      the red clay at its top is "a very useful mark by which to recognize
      this stratum", passing down into brown clay, brown shale or blue shale.
      He gives the clay no age.
  - id: barker2023a
    notes: >
      States the rank disagreement, and confirms the unit as the source of the
      Suchosaurus type specimen.
  - id: galton2009a
    notes: >
      Uses formation rank and dates it "~135 Ma (later middle Valanginian)",
      elsewhere "later mid-Valanginian", placing it at the top of the Hastings
      Group. Mostly spells the unit Grinsted, but lists it once as Grinstead
      Clay among the Hastings Beds.
