name: Grinstead Clay
rank: formation
parent: Hastings Beds
period: [Early Cretaceous]
stages: [Valanginian]
lithology: silty mudstone, with thin siltstone, clay ironstone and shelly
  limestone
dispute:
  summary: >
    Rank is contested, and the naming authority settles the position
    without settling the rank. Barker and colleagues (2023) set the
    disagreement out: the unit "subdivides the Tunbridge Wells Sands
    Formation" in one scheme "and from which the 'Suchosaurus
    cultridens' type specimen was discovered ..., is downgraded to a
    member of the latter formation in other works". Galton (2009) uses
    formation rank and places it "at the top of the Hastings Group"; Raven
    and colleagues (2020) use formation throughout; and Norman (2013)
    cannot keep one usage, writing Formation in the body
    and Member in both figure captions. Drew (1861), who names the unit, uses no
    rank word anywhere — the paper has "the bed of clay", "the second stratum",
    "the lower sands", the vocabulary of rank postdating it — but Drew is
    explicit about position: the clay "appears in the Tunbridge Wells Sand" and
    "divides the sand into Upper and Lower Tunbridge Wells Sand". That bears on the parent whichever rank is chosen, and it
    points away from the recorded one. The Tunbridge Wells Sand has no
    entry of its own.
references:
  - id: raven2020a
    notes: >
      The Hylaeosaurus armatus holotype came from Tilgate Forest near
      Cuckfield, West Sussex, at a quarry the paper calls "An imprecisely
      located quarry", and its horizon is given as "Lower Cretaceous,
      Valanginian" after Austen and Batten (2018). The unit is treated as a
      formation throughout, abbreviated "GC Fm" in the paper's stratigraphic
      scheme for the Wealden Supergroup.
  - id: norman2013a
    notes: >
      Places the Whiteman's Green quarries at Cuckfield in the Grinstead Clay
      Formation, "a mappable lithological unit", of upper-middle Valanginian
      age; its figure captions call the unit a member.
  - id: drew1861a
    notes: >
      Names the clay after East Grinstead and traces it west from Penshurst Park
      to the Balcombe Tunnel, where it reaches about 50 feet; it "divides the
      sand into Upper and Lower Tunbridge Wells Sand".
  - id: barker2023a
    notes: >
      States the rank disagreement, and confirms the unit as the source of the
      Suchosaurus type specimen.
  - id: galton2009a
    notes: >
      Uses formation rank and dates it "~135 Ma (later middle Valanginian)"
      (p. 214), elsewhere "later mid-Valangian [sic], Rawson et al., 1978"
      (p. 234), placing it "at the top of the Hastings Group". Mostly spells the unit "Grinsted", but lists it once as "Grinstead
      Clay" among the Hastings Beds.
  - id: austen2018a
    notes: >
      Uses formation rank, placing the Grinstead Clay above the Ardingly
      Sandstone Member of the Lower Tunbridge Wells Sand Formation, and draws it
      in the Hastings Group within the Valanginian (Fig. 3).
  - id: hopson2008a
    notes: >
      Source of the lithology.
