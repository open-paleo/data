name: Gruhalde
rank: member
parent: Klettgau
period: [Late Triassic]
stages: [Carnian, Norian, Rhaetian]
references:
  - id: zahner2019a
    notes: >
      Gives the parent and the position: the Frick Plateosaurus material "is
      derived from the middle part of the Gruhalde Member of the Klettgau
      Formation", and a new layer sits "1m beneath the Triassic-Jurassic
      boundary, uppermost Gruhalde Member, Klettgau Formation, latest
      Norian", in the Gruhalde clay pit at Frick, Canton Aargau.
  - id: rauhut2020a
    notes: >
      Places the Bratelen Bonebeds "on top of the Gruhalde Member", where the
      studied sauropodomorph material comes from.
  - id: jordan2016a
    notes: >
      Formally defines the member within the newly named Klettgau Formation
      and gives its chronostratigraphic age as "Carnian to Rhaetian (?)",
      following the German scheme of the DSK and of Kozur and Bachmann (2008);
      it "encompasses all strata formerly called «Bunte Mergel», «Obere Bunte
      Mergel», and «Knollenmergel»", with the Gruhalde clay pit at Frick AG as
      its type locality. In the middle part of the type section, where
      coarse-grained sand allows correlation with the German Löwenstein
      Formation, "The presence of Plateosaurus remains points to a Late Norian
      age".
