name: Golmayo
rank: formation
period: [Early Cretaceous]
stages: [Hauterivian, Barremian]
lithology: channel sandstone, micritic limestone and red mudstone, with minor
  conglomerate
references:
  - id: royo-torres2017a
    notes: >
      Gives "the Golmayo Formation (upper Hauterivian-lower Barremian) in Soria
      province (Spain)" as the Soriatitan golmayensis type unit. Describes its
      rock: "The latter is 800 m thick and consists of channel sandstones,
      micritic limestones, red lutites and, to a lesser extent, siliciclastic
      and calcareous conglomerates."
  - id: fuentesvidarte2016a
    notes: >
      Independently places the Zorralbo I site in the "Lower Cretaceous (upper
      Hauterivian/lower Barremian), Golmayo Formation (Iberian Range)".
