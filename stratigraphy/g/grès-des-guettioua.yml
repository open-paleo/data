name: Grès des Guettioua
rank: formation
period: [Middle Jurassic]
stages: [Bathonian, Callovian]
variants: [Guettioua, Guettioua Sandstone, Tagalft]
dispute:
  summary: >
    Jenny, Le Marrec and Monbaron (1981) take the Atlasaurus skeleton as "an
    important argument for definitively assigning this unit to the Bathonian";
    Monbaron and colleagues (1999) give the lower Couches rouges as
    "Bathonian-Callovian", and Allain and Aquesbi's (2008) chart extends the
    formation from the upper Bathonian into the Callovian.
references:
  - id: allain2008a
    notes: >
      Gives "The Bathonian Guettioua Formation has yielded the skeleton of the
      sauropod Atlasaurus imelakei", and names "its lateral equivalent in the
      Middle Atlas, the El Mers Formation". Lists the three formations of the
      Red beds complex from the top down, "the Djebel Sidal, the Iouaridene
      and the Guettioua formations", so the Guettioua is the lowest. Its
      stratigraphic chart (Fig. 2, described rather than quoted) extends "Grès
      de Guettioua F." from the upper Bathonian into the Callovian, sharing
      the interval with the El Mers.
  - id: dai2022a
    notes: >
      Lists it among the Middle Jurassic dinosaur-bearing units worldwide,
      beside the Shaximiao, Zhiluo, Shishugou, Forest Marble and Cañadón
      Asfalto.
  - id: mannion2019a
    notes: >
      Refers to Atlasaurus as "the late Middle Jurassic Moroccan
      non-neosauropod eusauropod Atlasaurus imelakei (Guettioua Formation)",
      and counts it among the sauropods of "the Bathonian of Morocco".
  - id: jenny1981a
    notes: >
      Formalizes the name Roch gave in 1933 to the whole red-bed sequence of
      the Guettioua basin, "excluding from the 'Guettioua Sandstone Formation'
      the red pelites that overlie these sandstones", which become the
      Iouaridène Formation. The Red Beds above the Tilougguit Formation "are
      divided into three lithostratigraphic units: the Grès des Guettioua
      Formation ...; the Iouaridène Formation; the Jbel Sidal Formation".
      Designates no type section, describing a typical one north of Amougguez
      instead. Equates it with the "Tagalft Formation, Monbaron [1980]". Dates
      it by the sauropod skeleton "in the Grès des Guettioua of the Tilougguit
      basin", which "is an important argument for definitively assigning this
      unit to the Bathonian".
  - id: monbaron1999a
    notes: >
      Places the Atlasaurus locality "at the base of a rubefied, detritic
      sequence in the 'Couches rouges' termed the Guettioua Formation", and
      dates the Couches rouges "Bathonian-Callovian, cf. Jenny et al., 1981,
      Souhel and Canerot, 1989", "at least with regard to their lower levels".
      Its type-locality line nonetheless gives "Wawmda, Tilougguit Formation".
