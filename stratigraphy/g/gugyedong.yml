name: Gugyedong
rank: member
parent: Hupyeongdong
period: [Early Cretaceous]
stages: [Albian]
references:
  - id: choi2019a
    notes: >
      Ranks it as the upper member of the Hupyeongdong Formation: "The
      Gugyedong Member, in contrast, makes up most of the Hupyeongdong
      Formation and consists mainly of purple mudstone and siltstone." Its
      zircons date the formations above and below, so the member lies between
      about 106 and 100 Ma. It says its ages "agree well with the
      Aptian–Albian depositional age of the Hayang Group indicated by
      previous studies", but none of its maximum depositional ages reaches
      the Aptian.
  - id: kim1983a
    notes: >
      Gives the Ultrasaurus tabriensis horizon as "the Gugyedong Formation of
      the Hayang Group", a light gray granite cobble-bearing paraconglomerate
      that is "an exceptional intercalation in the red beds of the Cretaceous
      System in Korea". Its section runs "from bottom to top, of the Iljig
      Formation, Gumidomari Conglomerate, and Gugyedong Formation", the
      Gumidomari Conglomerate being the later Gumidong Member. No stage is
      given.
  - id: wilson2005a
    notes: >
      A reference work, tabulating the same occurrence as Aptian after Kim
      (1983), which gives no stage. The Aptian follows older palynological
      readings of the Hayang Group that the zircon ages of Choi and Kwon
      (2019) do not support.
  - id: gale2020a
    notes: >
      Puts the base of the Albian at 113.2 Ma and of the Cenomanian at 100.5
      Ma.
