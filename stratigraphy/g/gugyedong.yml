name: Gugyedong
rank: member
parent: Hupyeongdong
period: [Early Cretaceous]
stages: [Albian]
lithology: purple mudstone and siltstone
references:
  - id: choi2019a
    notes: >
      Ranks it as the upper member of the Hupyeongdong Formation, making up most
      of it and consisting "mainly of purple mudstone and siltstone"
      (translated). Source of the lithology.
  - id: kim1983a
    notes: >
      Gives the Ultrasaurus tabriensis horizon as a light gray paraconglomerate
      in "the Gugyedong Formation of the Hayang Group", above the Iljig
      Formation and the Gumidong Conglomerate.
  - id: wilson2005a
    notes: >
      A reference work, tabulating the same occurrence as Aptian after Kim
      (1983), which gives no stage. The Aptian follows older palynological
      readings of the Hayang Group that the zircon ages of Choi and Kwon
      (2019) do not support.
  - id: gale2020a
    notes: >
      Puts the base of the Albian at 113.2 Ma and of the Cenomanian at 100.5
      Ma.
