name: Guichón
rank: formation
period: [Early Cretaceous, Late Cretaceous]
stages: [Aptian, Albian, Cenomanian, Turonian, Coniacian, Santonian,
  Campanian, Maastrichtian]
dispute:
  summary: >
    The age is openly unresolved across most of the Cretaceous. Soto and
    colleagues (2012) state it plainly: "the age of the Guichón Formation is
    not clear. Proposed ages range from Aptian ... to Santonian-?Campanian",
    with the geological evidence and the fossil evidence pulling different
    ways. Soto Núñez and colleagues (2026) argue from a sauropod "deeply
    nested within Aeolosaurini", a "Coniacian-Maastrichtian clade", for the
    younger end.
references:
  - id: soto2012a
    notes: >
      States the range of proposed ages, "from Aptian ... to
      Santonian-?Campanian": the unconformity with the overlying Mercedes
      Formation and the facies likeness to the Albian Migues Formation "led
      some authors ... to suggest an Early Cretaceous age for this unit".
      Reports the unit's correlation with the Argentinean Puerto Yeruá
      Formation, and concludes that a derived lithostrotian with Sphaerovum
      eggshells "provides an important biostratigraphic criterion to allocate
      the Guichón Formation ... to the Late Cretaceous".
  - id: sotonúñez2026a
    notes: >
      Argues the younger end from faunal affinity: in "the Upper Cretaceous
      Guichón Formation", a new sauropod nested in Aeolosaurini, "a
      Coniacian-Maastrichtian clade", "provides additional evidence that
      suggests this age". Notes that the unit was first dated "'Cenomanian or
      older'" by Rusconi (1933) and "even Aptian" by Goso and Perea (2003),
      concludes that "most lines of evidence seem to point to a latest
      Cretaceous age for the Guichón/Puerto Yeruá Formation, perhaps late
      Santonian-early Campanian", and places the formation between "the
      Hauterivian basaltic flows of the Arapey Formation" below and "the
      Campanian-Maastrichtian Mercedes Formation" above.
  - id: bandeira2024a
    notes: >
      Tabulates it as "Turonian - Santonian" for an unnamed iguanodont from
      Uruguay, following von Huene (1934) and Soto and colleagues (2012).
  - id: rusconi1933a
  - id: goso2003a
  - id: huene1934b
