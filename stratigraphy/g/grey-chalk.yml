name: Grey Chalk
rank: subgroup
parent: Chalk
period: [Late Cretaceous]
stages: [Cenomanian]
lithology: clayey, marly chalk without flint
references:
  - id: hopson2005a
    notes: >
      Divides the Chalk Group "into two subgroups, the Grey Chalk and White
      Chalk subgroups", defines this one with the West Melbury Marly Chalk and
      Zig Zag Chalk formations in the Southern Province, and dates it "Upper
      Cretaceous, Cenomanian. Mantelliceras mantelli to Calycoceras guerangeri
      zones". Source of the lithology.
