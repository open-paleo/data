name: Gamma
rank: member
parent: Snow Hill Island
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
variants: [Herbert Sound]
references:
  - id: ely2019a
    notes: >
      Gives the alternate name and the position: "The Herbert Sound or Gamma
      Member, underlies the Cape Lamb Member ... within the Snow Hill Island
      Formation", and dates it uppermost Campanian.
  - id: soto-acuña2024a
    notes: >
      Uses the Snow Hill Island reading, referring osteoderms to "the
      Campanian-Maastrichtian Gamma Member of the Snow Hill Island".
  - id: salgado2006a
    notes: >
      Uses the older Santa Marta assignment, from before these outcrops were
      placed in the Snow Hill Island Formation, and fixes a level, the
      Antarctopelta fossils being "collected about 90 m from the base of the
      Gamma Member".
