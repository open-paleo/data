name: Gamma
rank: member
parent: Snow Hill Island
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
variants: [Herbert Sound]
dispute:
  summary: >
    Which formation contains it is not settled. Soto-Acuña and colleagues
    (2024) give the "Gamma Member of Snow Hill Island Formation (upper
    Campanian)"; Salgado and colleagues (2006) give "the Gamma Member of the
    Santa Marta Formation (Marambio Group) (upper Campanian)".
references:
  - id: ely2019a
    notes: >
      Gives the alternate name and the position: "The Herbert Sound or Gamma
      Member, underlies the Cape Lamb Member ... within the Snow Hill Island
      Formation", and dates it uppermost Campanian.
  - id: soto-acuña2024a
    notes: >
      Uses the Snow Hill Island reading, referring osteoderms to "the
      Campanian-Maastrichtian Gamma Member of the Snow Hill Island".
  - id: salgado2006a
    notes: >
      Uses the Santa Marta reading, and fixes a level, the Antarctopelta
      fossils being "collected about 90 m from the base of the Gamma Member".
