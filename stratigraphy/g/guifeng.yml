name: Guifeng
rank: group
period: [Late Cretaceous]
stages: [Coniacian, Santonian, Campanian, Maastrichtian]
lithology: red clastic sedimentary rocks
dispute:
  summary: >
    Xi and colleagues (2018) give the group as "early to mid-late Cretaceous"
    on "two isotopic ages of 89–86 Ma from the basalt of the Hekou Formation",
    and Xi and colleagues (2021) as "middle to late Late Cretaceous"; Li and
    colleagues (2018) have it beginning "after ~100 Ma". Xing and colleagues
    (2020) instead relay paleomagnetic dating of the group "to 71.4–65.0 Ma",
    and the Hekou and Lianhe formations are dated Maastrichtian from
    vertebrates near Ganzhou (Jin and colleagues 2022) and from spores and
    pollen (Yao and colleagues 2026). The readings come from different basins,
    and Li and colleagues treat the group's three formations as lateral
    equivalents of one another rather than a stacked sequence.
references:
  - id: yao2026a
    notes: >
      Gives the group's order, "the upper Guifeng Group consisting of the
      Hekou, Tangbian and Lianhe formations in ascending order", and dates the
      topmost of those: the Lianhe Formation "can be dated to the Maastrichtian
      according to the spore and pollen assemblages".
  - id: zhu2025a
    notes: >
      Places the Tangbian Formation in the group, "This set of strata is
      classified locally as Tangbian Formation, which belongs to Guifeng
      Group".
  - id: jin2022a
    notes: >
      Equates the group with the Nanxiong Formation of the Ganzhou Basin, after
      Liu (1997), and gives its own specimens as "Hekou Formation (Upper
      Cretaceous, Maastrichtian), Guifeng Group".
  - id: liu1997a
  - id: xing2024a
    notes: >
      Names the group's three formations in Jiangxi, "the Guifeng Group
      consists of the Hekou, Tangbian, and Lianhe formations", and places it
      above the Ganzhou Group, with its Maodian and Zhoutian formations, as
      the upper of "the Upper Cretaceous Ganzhou and Guifeng groups".
  - id: xi2018a
    notes: >
      Relays two basalt ages of 89–86 Ma from the Hekou Formation, which "imply
      that the age of the Guifeng Group might be early to mid-late Cretaceous".
  - id: xi2021a
    notes: >
      Describes the group as mainly red clastic sediments with Late Cretaceous
      dinosaur eggs and ostracods, its age "middle to late Late Cretaceous"
      (translated). Source of the lithology.
  - id: li2018a
    notes: >
      Has the group start "after ~100 Ma", and treats the Hekou and Tangbian
      formations as coeval facies and the Hekou and Lianhe as one sequence under
      two names.
  - id: xing2020b
    notes: >
      "Palaeomagnetic studies have dated the Guifeng Group to 71.4–65.0
      Ma", a relay of 1991 work. The 65.0 Ma end is an older figure for
      the end of the Cretaceous, which the ICS chart v2024/12 puts at 66.0
      Ma, rather than a date for the group.
  - id: ling1996a
    notes: >
      Raises the unit to a group: "The former Ganzhou Formation and Guifeng
      Formation are both raised to group rank" (translated), with the new
      Hekou Formation as its lower part and the new Tangbian Formation as its
      middle part. Gives the group no definition or age of its own.
