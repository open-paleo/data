name: Guifeng
rank: group
period: [Late Cretaceous]
stages: [Coniacian, Santonian, Campanian, Maastrichtian]
dispute:
  summary: >
    Xi and colleagues (2019) give the group as "early to mid-late
    Cretaceous" on "two isotopic ages of 89–86 Ma from the basalt of the
    Hekou Formation", and Xi and colleagues (2021) as "middle to late Late
    Cretaceous"; Li and colleagues (2018) have it beginning "after ~100 Ma".
    Xing and colleagues (2021) instead relay palaeomagnetic dating of the
    group "to 71.4–65.0 Ma", and the Hekou and Lianhe formations are dated
    Maastrichtian from vertebrates near Ganzhou (Jin and colleagues 2022) and
    from spores and pollen (Yao and colleagues 2026). The readings come from
    different basins, and Li and colleagues treat the group's three
    formations as lateral equivalents of one another rather than a stacked
    sequence.
references:
  - id: yao2026a
    notes: >
      Gives the group's order, "the upper Guifeng Group consisting of the
      Hekou, Tangbian and Lianhe formations in ascending order", and dates the
      topmost of those: the Lianhe Formation "can be dated to the Maastrichtian
      according to the spore and pollen assemblages".
  - id: zhu2024a
    notes: >
      Places the Tangbian Formation in the group, "This set of strata is
      classified locally as Tangbian Formation, which belongs to Guifeng
      Group".
  - id: jin2022a
    notes: >
      Gives the group's older name and the material it covers: vertebrate
      fossils come from "the Nanxiong Formation (= Guifeng Group) that is
      exposed in the vicinity of the Gannan Basin", among them Banji long,
      Ganzhousaurus nankangensis, Jiangxisaurus ganzhouensis and Nankangia
      jiangxiensis, all of which their own describing papers place in the
      Nanxiong Formation. Its own specimens, from Ganzhou railway station and
      the Third High School of Ganxian County, are given as "Hekou Formation
      (Upper Cretaceous, Maastrichtian), Guifeng Group". The equation is
      credited to Liu (1997).
  - id: liu1997a
  - id: xing2024a
    notes: >
      Names the group's three formations in Jiangxi, "the Guifeng Group
      consists of the Hekou, Tangbian, and Lianhe formations", and places it
      above the Ganzhou Group, with its Maodian and Zhoutian formations, as
      the upper of "the Upper Cretaceous Ganzhou and Guifeng groups".
  - id: xi2018a
    notes: >
      "The Guifeng Group (Hekou, Tangbian and Lianhe Formations), consisting
      primarily of red beds, yields late Cretaceous ostracodes and dinosaur
      eggs, and two isotopic ages of 89–86 Ma from the basalt of the Hekou
      Formation imply that the age of the Guifeng Group might be early to
      mid-late Cretaceous". On GTS2020, whose Coniacian begins at 89.4 Ma
      and Santonian at 85.7 Ma, 89 to 86 Ma is Coniacian to earliest
      Santonian.
  - id: xi2021a
    notes: >
      The group "consists mainly of red clastic sediments and yields fossils
      such as Late Cretaceous dinosaur eggs and ostracods; its age may be
      middle to late Late Cretaceous" (时代可能为晚白垩世中晚期).
  - id: li2018a
    notes: >
      "The Guifeng Group may have begun in the early Late Cretaceous (after
      ~100 Ma)"
      (圭峰群可能始于晚白垩世初期(~100 Ma之后)),
      a placement from basin evolution rather than new dates. It treats the Hekou, Tangbian
      and Lianhe as "mainly contemporaneous heteropic formations", lateral
      equivalents rather than a stacked sequence, and since the Hekou and
      Lianhe "formed at the same time in the same basin and have the same
      lithofacies, they are very likely the same set of strata".
  - id: xing2020b
    notes: >
      "Palaeomagnetic studies have dated the Guifeng Group to 71.4–65.0 Ma",
      a relay of 1991 work. On GTS2020 the younger figure falls in the
      Paleocene, which the stage list here does not record.
  - id: gale2020a
    notes: >
      Puts the base of the Coniacian at 89.4 Ma and the base of the Santonian
      at 85.7 Ma.
