name: Galula
rank: formation
period: [Early Cretaceous, Late Cretaceous]
stages: [Aptian, Albian, Cenomanian, Turonian, Coniacian, Santonian,
  Campanian]
references:
  - id: gorscak2019a
    notes: >
      Dates the formation through its two members, which sit far apart: "the
      Mtuka Member (Aptian-Cenomanian) and Namba Member (Campanian)". The
      Namba's Campanian is one of two magnetostratigraphic correlations
      Widlansky and colleagues (2018) offer, not a settled age.
  - id: gorscak2017a
    notes: >
      Gives the earlier whole-formation estimate, "middle Cretaceous
      (Aptian-Cenomanian)".
  - id: widlansky2018a
    notes: >
      Dates the formation through its members by magnetostratigraphy: "the
      Namba Member is no older than Late Cretaceous (Cenomanian-Campanian),
      with the Mtuka Member less well constrained to the middle Cretaceous
      (Aptian-Cenomanian)", together Aptian to Campanian. For the Namba's
      reversals, "one interpretation correlates the Namba Member to Chron
      C32" and "An alternative correlation assigns reversals in the Namba
      Member to recently proposed short reversals near the end of the
      Cretaceous Normal Superchron (Chron C34)", and "Geological age
      constraints, however, are less supportive of a Campanian age".
