name: GAD 5
rank: bed
informal: true
parent: Elrhaz
period: [Early Cretaceous]
stages: [Aptian, Albian]
dispute:
  summary: >
    Which units it spans is read two ways, and the two sides are not
    evenly weighted. Taquet (1976), who describes the locality, places it
    in one formation - "Deposit of Gadoufaoua, GAD 5 formation (upper part
    of the formation of Elrhaz), Tegama series, Aptian" - and never
    mentions the Echkar at all, so the primary source does not recognize
    the boundary the disagreement is about. Galton (1982) and Carrano and
    colleagues (2008) keep it inside one formation too, but Galton's
    horizon line is close enough to Taquet's that the one-formation side
    reads as one determination restated rather than three independent
    votes. Sereno and colleagues (1999) instead have it crossing a
    boundary, GAD 5 "corresponds with the upper part of the Elrhaz
    Formation and the lower part of the Echkar Formation" - a reading that
    appears twenty-three years after the describing work and is the only
    support anywhere for the Albian, since Taquet's three uses of that
    stage are all for other taxa in other places.
references:
  - id: taquet1976a
    notes: >
      Aptian, and the upper part of the Elrhaz Formation: the Ouranosaurus
      type locality is "Deposit of Gadoufaoua, GAD 5 formation (upper part of
      the formation of Elrhaz), Tégama series, Aptian", and the distribution
      line reads "Deposit of Gadoufaoua GAD 5, Elrhaz formation, Tégama
      series, Aptian, north-east Niger". The holotype skeleton came from "the
      superior part of the GAD 5, partly situated above a sandstone and
      conglomerate layer well readily identifiable, forming a cliff (cliff of
      Elrhaz)". The paratype, from the edge of an airfield 4 km south of the
      Innocents, is placed at the same level. The copy held is an English
      translation of the French monograph, so its "GAD 5 formation" is the
      translator's word and not a rank claim by Taquet, who is describing a
      numbered level.
  - id: galton1982a
    notes: >
      Separates the level from the place under its own headings, LOCALITY
      "Gadoufaoua, the region of niveau des Innocents" against HORIZON "GAD
      5, upper part of El Rhaz formation, Tégama Series, Aptian (Lower
      Cretaceous)".
  - id: sereno1999a
    notes: >
      Gives the numbering scheme and the crosscut: in the Gadoufaoua region
      "the Tegama Group was divided into eight GAD levels", GAD being "an
      abbreviation for Gadoufaoua", and GAD 5 "corresponds with the upper
      part of the Elrhaz Formation and the lower part of the Echkar
      Formation, which yielded all of the sauropod remains".
  - id: taquet1998a
    notes: >
      Gives both together in the Cristatusaurus type-locality line,
      "Gadoufaoua; GAD 5, niveau des Innocents, Tegama Formation, Aptian".
  - id: carrano2008a
    notes: >
      Tabulates abelisaurid and noasaurid material from "Elrhaz Formation
      (GAD 5); Aptian-Albian, Early Cretaceous" at Gadoufaoua.
