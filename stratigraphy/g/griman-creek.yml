name: Griman Creek
rank: formation
period: [Early Cretaceous, Late Cretaceous]
stages: [Albian, Cenomanian]
lithology: sandstone, siltstone and mudstone
references:
  - id: bell2019b
    notes: >
      Dates the fossil-bearing beds at Lightning Ridge by detrital zircon to the
      "early to mid-Cenomanian", a range it restricts to those exposures and
      their fauna.
  - id: agnolín2010a
    notes: >
      Gives "Griman Creek Formation, early-middle Albian".
  - id: bell2018a
    notes: >
      Carries the younger reading, "Griman Creek Formation (Cenomanian)",
      which is why both stages are held.
  - id: exon1976a
    notes: >
      Source of the lithology.
