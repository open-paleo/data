name: Griman Creek
rank: formation
period: [Early Cretaceous, Late Cretaceous]
stages: [Albian, Cenomanian]
references:
  - id: bell2019b
    notes: >
      New zircon dates put the fossil-bearing beds at Lightning Ridge in the
      Late Cretaceous: “The GCF preferred maximum depositional age range is
      early to mid-Cenomanian, with a range of 100.2–96.6 Ma”, dates that
      “confirm an early to mid-Cenomanian age for the fauna, rather than
      Albian, as has been reported previously”. The range is a local one —
      “this age range relates to the available exposures (and its fauna)
      around Lightning Ridge” and may not carry to “exposures of the GCF in
      other parts of the Surat Basin”, for which the paper reports
      fission-track ages of about 107 to 99 Ma and “a middle Albian age” from
      Queensland core palynology without setting either aside. Its conclusions
      add that “the local stratigraphy around Lightning Ridge cannot at this
      stage be tied into the regional stratigraphy of the GCF”.
  - id: agnolín2010a
    notes: >
      Gives "Griman Creek Formation, early-middle Albian".
  - id: bell2018a
    notes: >
      Carries the younger reading, "Griman Creek Formation (Cenomanian",
      which is why both stages are held.
