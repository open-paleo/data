name: Griman Creek
rank: formation
parent: Rolling Downs
period: [Early Cretaceous]
stages: [Albian]
lithology: sandstone, siltstone and mudstone
references:
  - id: bell2019b
    notes: >
      Dates a volcanogenic claystone above the highest fossil-bearing
      claystone at Lightning Ridge, by detrital zircon, to an "early to mid-
      Cenomanian" maximum depositional age, a range it restricts to those
      exposures and their fauna.
  - id: agnolín2010a
    notes: >
      Gives "Griman Creek Formation, early-middle Albian".
  - id: bell2018a
    notes: >
      Gives the Lightning Ridge specimens as "Wallangulla Sandstone, GCF,
      Cenomanian", after the maximum depositional age of Bell and colleagues
      (2019).
  - id: exon1976a
    notes: >
      Source of the lithology.
  - id: burger1980a
    notes: >
      Finds the Coptospora paradoxa Zone in the formation in drilled sections
      across the Homeboin, Dirranbandi, Surat and St George areas, and dates
      the interval, "the youngest sequence preserved in the Surat Basin", as
      middle Albian.
  - id: cook2013a
    notes: >
      Gives the formation's palynomorphs as "attributable to APK5 and an
      Albian age", after Burger (1980) and others, and calls it "the last
      known deposition in the Surat Basin in the late Albian".
