name: Grès à Reptiles
rank: formation
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
references:
  - id: leloeuff1998a
    notes: >
      Gives the type horizon of Variraptor as the "Grès à Reptiles Formation",
      Late Campanian to Early Maastrichtian, at La Bastide Neuve in the
      Fox-Amphoux syncline, Var.
  - id: turner2012a
    notes: >
      Records Variraptor mechinorum from the "Late Campanian to Early
      Maastrichtian, Late Cretaceous, Grès à Reptiles Formation, La Bastide
      Neuve".
