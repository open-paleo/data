name: Guettioua
rank: formation
period: [Middle Jurassic]
stages: [Bathonian]
references:
  - id: allain2008a
    notes: >
      Gives "The Bathonian Guettioua Formation has yielded the skeleton of the
      sauropod Atlasaurus imelakei", and names "its lateral equivalent in the
      Middle Atlas, the El Mers Formation". Places it last of the three
      formations of the sequence, after the Djebel Sidal and the Iouaridene.
      The lateral equivalence is between areas, not an alternate name.
  - id: dai2022a
    notes: >
      Lists it among the Middle Jurassic dinosaur-bearing units worldwide,
      beside the Shaximiao, Zhiluo, Shishugou, Forest Marble and Cañadón
      Asfalto.
  - id: mannion2019a
    notes: >
      Refers to Atlasaurus as "the late Middle Jurassic Moroccan
      non-neosauropod eusauropod Atlasaurus imelakei (Guettioua Formation)",
      and counts it among the sauropods of "the Bathonian of Morocco".
