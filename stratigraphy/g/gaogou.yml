name: Gaogou
rank: formation
period: [Late Cretaceous]
stages: [Cenomanian, Turonian]
references:
  - id: pu2017a
    notes: >
      Gives the Beibeilong locality in Heimaogou, Xixia County, Henan, as "the
      Upper Cretaceous Gaogou Formation (Cenomanian-Turonian)".
  - id: wang2013c
    notes: >
      Records that the name was also applied loosely elsewhere in Henan.
      Of the egg-bearing red beds of the Xiaguan-Gaoqiu Basin it writes that
      "this set of 'red beds' has variously been called the 'Gaogou
      Formation,' 'Majiacun Formation,' 'Sangping Formation,' and 'Xiaguan
      Formation,' but none of these names was based on a formally measured
      stratigraphic section", which is what that paper supplies for the
      Xiaguan.
