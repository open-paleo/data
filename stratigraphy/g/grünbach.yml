name: Grünbach
rank: formation
period: [Late Cretaceous]
stages: [Campanian]
references:
  - id: csiki-sava2015a
    notes: >
      Gives the age and what it rests on: the "Grünbach Formation was dated as
      early Campanian on the basis of foraminiferan (Globotruncana elevata
      Zone) and nannoplankton data (Zone UC 15)", and the Muthmannsdorf fauna
      comes from it. Records that Suess (1881) had suggested a pre-Turonian age.
  - id: augustin2023a
    notes: >
      Places it in its group and names the workings: the Mochlodon suessi
      material came from the "'coal-bearing series' of Muthmannsdorf, which
      was mined until the end of the 19th century and which is assignable to
      the lower Campanian Grünbach Formation of the Gosau Group".
  - id: suess1881a
    notes: >
      Describes the horizon before it had a name - the formation and the
      locality are named nowhere in the paper - identifying it by position in
      the Gosau succession of the "Neue Welt" south of Vienna, as the
      freshwater sandstones, marls and coal with Melanopsis, Unio and a palm
      flora above the basal breccia: "It is this horizon which has yielded
      the reptilian bones." The pre-Turonian age sometimes quoted from it
      follows from one correlation rather than from the fossils of this unit:
      the rudist-coral limestone higher in the same succession is taken to be
      "the true French Turonian zone of Hippurites cornu-vaccinum", and the
      conclusion is drawn from below it - "it is certain that they are older
      than the true Turonian deposits, and especially older than the zone of
      Hippurites cornu-vaccinum". The datum is the zone, so recalibrating it
      removes the deduction; the relative succession the paper gives is the
      Gosau Group as still understood.
