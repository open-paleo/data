name: Grünbach
rank: formation
period: [Late Cretaceous]
stages: [Campanian]
lithology: alternating carbonaceous shale and coal, with conglomerate and
  sandstone
references:
  - id: csiki-sava2015a
    notes: >
      Gives the age and what it rests on: the "Grünbach Formation was dated as
      early Campanian on the basis of foraminiferan (Globotruncana elevata Zone)
      and nannoplankton data (Zone UC 15)", and the Muthmannsdorf fauna comes
      from it. Records that Suess (1881) had suggested a pre-Turonian age.
      Source of the lithology.
  - id: augustin2023a
    notes: >
      Places it in its group and names the workings: the Mochlodon suessi
      material came from the "'coal-bearing series' of Muthmannsdorf, which
      was mined until the end of the 19th century and which is assignable to
      the lower Campanian Grünbach Formation of the Gosau Group".
  - id: suess1881a
    notes: >
      Places the bones, without naming the formation, in the freshwater
      sandstones, marls and coal above the basal breccia of the Gosau beds of
      the "Neue Welt", and judges them older than the Turonian.
  - id: hradecká1999a
    notes: >
      Dates the Coal-Bearing Series at Maiersdorf, from one sample, to the
      "late Early Campanian" by planktonic foraminifera and nannofossils.
