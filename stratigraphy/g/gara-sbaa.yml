name: Gara Sbaa
rank: formation
parent: Kem Kem
period: [Late Cretaceous]
stages: [Cenomanian]
references:
  - id: ibrahim2020a
    notes: >
      Erects it: the strata "are recognized here as the Kem Kem Group, which
      is composed of the lower Gara Sbaa and upper Douira formations", each
      given its own chapter. Notes that the age of the "Kem Kem beds" "has
      been regarded variously as mid or early Late Cretaceous
      (Albian-Cenomanian)". The name is also a locality — Rebbachisaurus
      garasbae came "from the locality Gara Sbaa" — so the string does
      double duty.
  - id: sereno1996a
    notes: >
      Describes the beds without naming the formation: the informal "Kem Kem
      beds", which "can be divided equally into two units", the lower of
      reddish cross-stratified sandstone, measured in a section at Gara es
      Sbaa that holds the Deltadromeus skeleton. "Nine elasmobranch species
      strongly support a Cenomanian age for the deposit", seven of them shared
      with the Bahariya Formation.
