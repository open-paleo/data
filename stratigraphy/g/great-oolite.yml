name: Great Oolite
rank: group
period: [Middle Jurassic]
stages: [Bajocian, Bathonian, Callovian]
description: "The Great Oolite Group is a Middle Jurassic stratigraphic unit that outcrops in southern England. It consists of a complex set of marine deposits primarily mudstone and bioclastic ooidal and fine grained limestone, deposited in nearshore to shelf settings. It is exposed at the surface as a variably thick belt extending roughly NE-SW from the coast of Dorset up to the Humber. It is also present at depth in the Weald and Wessex Basins, as well as offshore. Several of the constituent formations, notably the Taynton Limestone Formation and the Forest Marble Formation are notable for their fossil content, including those of dinosaurs and pterosaurs and some of the earliest mammals."
references:
  - id: carrano2012a
    notes: >
      Group rank and one of its formations in a single occurrence line:
      "White Limestone Formation, Great Oolite Group; middle-late Bathonian,
      Middle Jurassic".
  - id: barron2012a
    notes: >
      Pairs it with the group below: across England "the Lower Jurassic Lias
      Group is overlain in turn by the Inferior Oolite and Great Oolite groups
      of Aalenian to earliest Callovian age". The group's own age entry is
      narrower, "Late Bajocian to Early Callovian: Parkinsoni Zone to Herveyi
      Zone".
  - id: naish2007a
    notes: >
      Dates a formation inside it, "the Bajocian-Bathonian Forest Marble
      Formation of Oxfordshire".
  - id: rauhut2010a
    notes: >
      Gives the horizon of Proceratosaurus at Minchinhampton, Gloucestershire,
      as "Great Oolite, Late Bathonian, Middle Jurassic".
