name: Great Oolite
rank: group
period: [Middle Jurassic]
stages: [Bajocian, Bathonian, Callovian]
references:
  - id: carrano2012a
    notes: >
      Group rank and one of its formations in a single occurrence line:
      "White Limestone Formation, Great Oolite Group; middle-late Bathonian,
      Middle Jurassic".
  - id: barron2012a
    notes: >
      Pairs it with the group below: across England "the Lower Jurassic Lias
      Group is overlain in turn by the Inferior Oolite and Great Oolite groups
      of Aalenian to earliest Callovian age". The group's own age entry is
      narrower, "Late Bajocian to Early Callovian: Parkinsoni Zone to Herveyi
      Zone".
  - id: naish2007a
    notes: >
      Dates a formation inside it, "the Bajocian-Bathonian Forest Marble
      Formation of Oxfordshire".
  - id: rauhut2010a
    notes: >
      Gives the horizon of Proceratosaurus at Minchinhampton, Gloucestershire,
      as "Great Oolite, Late Bathonian, Middle Jurassic".
