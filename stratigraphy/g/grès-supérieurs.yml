name: Grès supérieurs
rank: formation
period: [Early Cretaceous, Late Cretaceous]
stages: [Barremian, Aptian, Albian, Cenomanian]
references:
  - id: allain1999a
    notes: >
      Gives the type horizon for Tangvayosaurus as "Grès supérieurs
      Formation, Aptian-Albian" at Tang Vay, Savannakhet Province, Laos, dated
      "by the occurrence of fresh water pelecypods of the Trigonioidacea
      super-family".
  - id: allain2012a
    notes: >
      Gives the correlation: the formation "is considered here the lateral
      equivalent of the Khok Kruat and Phu Pan formations in neighbouring
      Thailand and is probably late Barremian to early Cenomanian in age". The
      correlation is a lateral equivalence between countries, not an alternate
      name. The late Barremian rests on that correlation alone; neither
      Buffetaut (1991) nor Sha (2007) dates the Laotian beds that low.
  - id: buffetaut1991b
    notes: >
      Dates the dinosaur-bearing beds of Muong Phalane, naming them by
      locality rather than as the formation. By satellite-imagery correlation
      they "are the equivalent of the Khok Kruat Formation of the Khorat
      Plateau", and "The dinosaur-bearing beds of southern Laos are thus
      likely to be late Early Cretaceous to basal Late Cretaceous in age". Its
      primitive hadrosaurid material "suggests an earlier age than that
      accepted by" Hoffet, who had considered the fauna "Senonian in age".
  - id: sha2007a
    notes: >
      Dates the two non-marine bivalve assemblages found in southern Laos. The
      Trigonioides kobayashi–Plicatounio suzukii assemblage of Ban Vang Soung,
      Ban Na Pho and Ban Ta Seng "is Aptian in age and probably extends up
      into the Albian"; the T. diversicostatus–Pseudohyria subovalis
      assemblage of "the Ba Na Gnom Bed of the northern Muong Phalane" is
      "Late Aptian-Early Cenomanian, but mainly Albian".
