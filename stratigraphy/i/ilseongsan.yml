name: Ilseongsan
rank: formation
period: [Early Cretaceous, Late Cretaceous]
stages: [Albian, Cenomanian]
references:
  - id: jung2026a
    notes: >
      Gives the Doolysaurus horizon as "the mid-Cretaceous Ilseongsan
      Formation of Aphae Island (Aphaedo)" in Korea, and dates the formation
      "mid-Cretaceous (Albian–early Cenomanian; ~113–97 Ma)". That age follows
      biostratigraphic data and a 97.55 Ma date on the Maewolli Tuff higher in
      the section, rather than an earlier K-Ar estimate of 77–83 Ma.
