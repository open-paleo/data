name: Itat
rank: formation
period: [Middle Jurassic]
stages: [Bathonian]
description: "The Itat Formation is a geologic formation in western Siberia. Dinosaur remains are among the fossils that have been recovered from the formation, including the proceratosaurid Kileskus, as well as fish, amphibians, mammals and many other vertebrates. The formation is noted for bearing significant coal reserves, with large open pit coal mines extracting lignite from the unit currently in operation."
references:
  - id: averianov2010a
    notes: >
      Describes Kileskus from "the Middle Jurassic (Bathonian) Itat Formation
      at Berezovsk Quarry, Krasnoyarsk Territory (West Siberia, Russia)".
  - id: averianov2018a
    notes: >
      Places it among the continental terrigenous Jurassic units of the
      Chulim-Yenisei sedimentary basin, with the Makarovo and Tyazhin
      Formations.
