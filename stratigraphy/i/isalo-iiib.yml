name: Isalo IIIb
rank: formation
parent: Isalo III
period: [Middle Jurassic]
stages: [Bathonian]
references:
  - id: buffetaut2005a
    notes: >
      Gives the Archaeodontosaurus horizon in the Kamoro River area, where
      "variegated clays and sandstones of the Isalo IIIb Formation crop out.
      This formation contains fossiliferous marine intercalations indicating a
      Bathonian age", after Collignon (1953), and the type stratum as "Isalo
      IIIb Formation, Bathonian (Middle Jurassic)".
  - id: raveloson2019a
    notes: >
      Treats the containing unit as a subgroup rather than a formation: "The
      Isalo III subgroup is divided into two subunits: Isalo IIIa and Isalo
      IIIb", with the top of the series recognized as "Isalo IIIb-Bathonien
      Facies Mixte Dinosauriens".
  - id: mannion2010a
    notes: >
      Independently places the Archaeodontosaurus dentary in "the Isalo IIIb
      Formation (near Ambondromamy) within the Majunga Basin".
  - id: collignon1953a
  - id: maganuco2005a
    notes: >
      Assigns theropod material from around Ambondromamy, Port-Bergé,
      Tsinjorano and the Kamoro River to "a single Subunit referable to the
      Isalo IIIb", dated Bathonian.
  - id: geiger2004a
    notes: >
      Treats the Isalo IIIa, IIIb and IIIc as Jurassic sandstones outside the
      Isalo Formation, parts of which "can be attributed to younger formations
      such as the Sakaraha, Ankazoabo and Sakanavaka Formations". Places the
      Sakaraha Formation, Bajocian to Early Bathonian, "only ... in the
      southern Morondava Basin".
  - id: bindellini2019a
    notes: >
      States that "the Isalo IIIb subunit outcropping in the Mahajanga Basin
      has been included in the Sakaraha Formation", crediting Geiger and
      colleagues (2004), who do not make that assignment.
  - id: hendrickx2025a
    notes: >
      Calls the unit "currently referred to as the Sakaraha Formation" and
      takes the Ambondromamy and Tsinjorano horizon from Maganuco and
      colleagues (2005).
