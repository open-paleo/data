name: Inferior Oolite
rank: group
period: [Middle Jurassic]
stages: [Aalenian, Bajocian, Bathonian]
references:
  - id: barron2012a
    notes: >
      Gives the rank and pairs it with its neighbor above: across England "the
      Lower Jurassic Lias Group is overlain in turn by the Inferior Oolite and
      Great Oolite groups of Aalenian to earliest Callovian age". The span
      quoted covers both groups together, so the span covers more than this
      unit alone. The entry for this group alone gives its age as "Aalenian to
      Bathonian, Opalinum Zone to Zigzag Zone" and no parent unit, and the
      group "ranges from Early Aalenian to earliest Bathonian in age". Also
      records that "Aalenian to lower Bajocian strata are absent adjacent to
      the Mendip High".
  - id: carrano2012a
    notes: >
      Places Duriavenator in the "upper part of Inferior Oolite Group; late
      Bajocian, Middle Jurassic" at Sherborne, Dorset, and Magnosaurus in the
      "middle part of Inferior Oolite; early Bajocian, Middle Jurassic" at
      nearby Nethercomb.
