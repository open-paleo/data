name: Ischigualasto
rank: formation
parent: Agua de la Peña
period: [Late Triassic]
stages: [Carnian, Norian]
lithology: mudstone, sandstone and conglomerate, with basalt flows
references:
  - id: ezcurra2010a
    notes: >
      Has deposition begin about 231 Ma in the late Carnian, places the top of
      the Valle de la Luna Member "in the mid-Norian", and recognizes four
      members after Currie and colleagues (2009).
  - id: martínez2025a
    notes: >
      Gives "Ischigualasto Formation, late Carnian".
  - id: martínez2009b
    notes: >
      Calls it "the early Carnian Ischigualasto Formation". An age of "228 My
      (earliest Carnian) for a level 20 meters above the base of the
      Ischigualasto Formation" leads it to suggest "that deposition of the
      formation may have begun during the Ladinian".
  - id: reig1963a
    notes: >
      Takes the Ischigualasto fauna to be "somewhat more modern than the
      typical Middle Triassic faunas of Santa María (Brazil) and Tanganyika",
      concluding that "The fauna of the Ischigualasto Beds then represents the
      highest Middle Triassic, equivalent to the upper Ladinian".
  - id: novas2021a
    notes: >
      Gives "The Late Triassic (late Carnian–earliest Norian) Ischigualasto
      Formation of Argentina", citing earlier ash-bed dates near its bottom
      and top of 231.4 ± 0.3 and 225.9 ± 0.9 Ma in San Juan Province and 230.2
      ± 1.9 and 221.4 ± 1.2 Ma in La Rioja Province.
  - id: cox1965a
    notes: >
      Assigns the Ischigualasto fauna provisionally to the Carnian, from its
      saurischians and the pseudosuchian Aetosauroides.
  - id: casamiquela1961a
    notes: >
      Gives the horizon of its two new stagonolepoids as the middle and upper
      thirds of the unit and the age as "Middle to Upper Triassic of the
      Ischigualasto-Ischichuca basin." Names no stage.
  - id: colbert1963a
  - id: currie2009a
    notes: >
      Gives the containment: the formation, "designated as part of the Agua de
      la Peña Group by Bossi (1971) has in the past been undifferentiated", and
      formally divides it into four members, in ascending order "the La Peña
      Member, the Cancha de Bochas Member, the Valle de la Luna Member, and the
      Quebrada de la Sal Member". Source of the lithology.
  - id: shipman2004a
    notes: >
      A doctoral thesis. Dates an ash near the top of the formation at "218 ±
      1.7Ma" and puts the base at the Peña Conglomerate, above a regional
      unconformity.
  - id: caselli2001a
    notes: >
      Describes a sharp upper contact with the Los Colorados Formation on the
      southeastern slope of Cerro Rajado, a contact whose nature varies across
      the basin.
  - id: rogers1993a
  - id: bossi1971a
