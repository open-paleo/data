name: Ischigualasto
rank: formation
parent: Agua de la Peña
period: [Middle Triassic, Late Triassic]
stages: [Ladinian, Carnian, Norian]
references:
  - id: ezcurra2010a
    notes: >
      Dates a member inside it, a recalculated age of "about 219.4-220.4 ± 1.7
      Ma" locating "the top of the Valle de la Luna Member of the
      Ischigualasto Fm. in the mid-Norian". Dates the formation's own base
      rather than a member: "the deposition of the sedimentary unit began
      approximately 231 Ma during the late Carnian", with "The lower third of
      the Ischigualasto Fm. (late Carnian)" holding Herrerasaurus, Eoraptor
      and Panphagia. Two further dates bracket it upward - a bentonite about
      80 m above the base in the Cancha de Bochas Member at 227.8 plus or
      minus 0.3 Ma, and plagioclase about 610 m above the base at the top of
      the Valle de la Luna Member at 217.0 plus or minus 1.7 Ma before the
      correction noted above. Follows Currie and colleagues (2009) in
      recognizing four members, from lowest to highest the La Pena, Cancha de
      Bochas, Valle de la Luna and Quebrada de la Sal.
  - id: martínez2025a
    notes: >
      Gives "Ischigualasto Formation, late Carnian".
  - id: martínez2009b
    notes: >
      Calls it "the early Carnian Ischigualasto Formation". An age of "228 My
      (earliest Carnian) for a level 20 meters above the base of the
      Ischigualasto Formation" leads it to suggest "that deposition of the
      formation may have begun during the Ladinian".
  - id: reig1963a
    notes: >
      Takes the Ischigualasto fauna to be "somewhat more modern than the
      typical Middle Triassic faunas of Santa María (Brazil) and Tanganyika",
      concluding that "The fauna of the Ischigualasto Beds then represents the
      highest Middle Triassic, equivalent to the upper Ladinian".
  - id: novas2021a
    notes: >
      Gives "The Late Triassic (late Carnian–earliest Norian) Ischigualasto
      Formation of Argentina", citing earlier ash-bed dates near its bottom
      and top of 231.4 ± 0.3 and 225.9 ± 0.9 Ma in San Juan Province and 230.2
      ± 1.9 and 221.4 ± 1.2 Ma in La Rioja Province.
  - id: cox1965a
    notes: >
      If Colbert's (1963) view that saurischians arose only at the start of
      the Late Triassic is accepted, "it would indicate a Carnian age for the
      Ischigualasto deposits, from which Reig (1963) has described a
      carnosaurian and two genera of coelurosaurian saurischians". "Such an
      Upper Triassic date for this fauna is also supported by the presence of
      a pseudosuchian, Aetosauroides", which Casamiquela (1961) held to be
      close to Aëtosaurus from the Norian of Germany. The Carnian reading is
      offered as provisional, the Argentinian fauna being one "which has above
      provisionally been assigned to the Carnian".
  - id: casamiquela1961a
    notes: >
      Gives the horizon of its two new stagonolepoids as the middle and upper
      thirds of the unit and the age as "Middle to Upper Triassic of the
      Ischigualasto-Ischichuca basin." Names no stage.
