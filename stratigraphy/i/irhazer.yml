name: Irhazer
rank: group
period: [Middle Jurassic, Late Jurassic]
stages: [Bajocian, Bathonian, Callovian, Oxfordian]
references:
  - id: remes2009a
    notes: >
      Group rank and the unit above it: the site sits "at the base of the
      Irhazer Group ('Argiles de l'Irhazer' below the Tiourarén Formation)".
      The group "has traditionally been considered Jurassic to 'Neocomian' in
      age", but after a late Middle to early Late Jurassic age proposed for
      the overlying Tiourarén Formation, the position of Spinophorosaurus at
      the base of the group is "consistent with an even earlier age,
      presumably Middle Jurassic (Bajocian-Bathonian)", and "it cannot be
      excluded that the Argiles de l'Irhazer are even older (Lower Jurassic)".
      The Lower Jurassic is a possibility left open rather than a reading; the
      traditional Jurassic to "Neocomian" range predates the redating of the
      Tiourarén at the top of the group.
  - id: rauhut2009a
    notes: >
      Places the Tiouaren Formation as "the uppermost unit of the Irhazer
      Group", originally included in the upper part of the "argiles de
      l'Ihrazer". Records that Greigert and Pougnet (1967) "also assumed an
      Early Cretaceous age for the 'argiles de l'Ihrazer'" on conchostracans
      and bivalves, evidence the paper finds weak before arguing a
      pre-Kimmeridgian, probably late Middle Jurassic age for the Tiouaren
      Formation. With the uppermost unit now Bathonian to Oxfordian, the group
      carries no stage after the Oxfordian.
  - id: greigert1967a
  - id: greigert1967b
