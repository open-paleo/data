name: Irhazer
rank: group
period: [Middle Jurassic, Late Jurassic]
stages: [Bajocian, Bathonian, Callovian, Oxfordian]
lithology: red clay with sparse interbeds of fine-grained calcareous sandstone
references:
  - id: remes2009a
    notes: >
      Places the Spinophorosaurus site at the base of the group, below the
      Tiourarén Formation, and dates it "presumably Middle Jurassic
      (Bajocian-Bathonian)".
  - id: rauhut2009a
    notes: >
      Makes the Tiouaren Formation "the uppermost unit of the Irhazer Group" and
      argues it is pre-Kimmeridgian, probably late Middle Jurassic, against the
      older Early Cretaceous reading.
  - id: greigert1967a
  - id: greigert1967b
  - id: serrano-martínez2014a
    notes: >
      Source of the lithology.
