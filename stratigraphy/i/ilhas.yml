name: Ilhas
rank: group
period: [Early Cretaceous]
stages: [Valanginian, Hauterivian, Barremian]
references:
  - id: bandeira2024a
    notes: >
      Names the group by way of the Marfim Formation inside it, in the
      Recôncavo Basin of Bahia, Brazil, and dates the group "Valanginian –
      Barremian", one of "the Lower Cretaceous Massacará and Ilhas groups".
      The Marfim Formation within it is given as "Valanginian – Hauterivian".
