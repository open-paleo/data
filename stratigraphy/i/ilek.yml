name: Ilek
rank: formation
period: [Early Cretaceous]
stages: [Valanginian, Hauterivian, Barremian, Aptian, Albian]
references:
  - id: leshchinskiy2000a
    notes: >
      States that the age of the formation's deposits "was determined as
      Valanginian-Aptian?". Palynomorphs from the upper part of the formation
      are "characteristic of Aptian-Albian", and the Chulyma reference
      borehole section yielded, also from the upper part, gastropods and
      pelecypods "characteristic of Hauterivian-Barremian".
  - id: averianov2024a
    notes: >
      Uses the narrower "Ilek Formation, Lower Cretaceous (Aptian".
  - id: cuenca-bescós2003a
    notes: >
      Maschenko and Lopatin (1998) "described new gobiconodontids from the
      Early Cretaceous site of Shestakovo (Western Siberia, Russia) in the
      Ilek Formation dated as Aptian–Albian"; the paper adds that the
      Shestakovo vertebrate assemblage "is comparable to that of Khoboor,
      suggesting a similar age".
  - id: maschenko1998a
    notes: >
      Makes no determination of its own and relays two mutually exclusive
      ones: the unit's fossil-bearing deposits "were dated as of Neocomian
      (OSYKO, 1958) or as of Aptian-Albian age (ROZHDESTVENSKY, 1960)". Two
      authors, forty years old, reported in a mammal paper about Shestakovo
      which adds nothing about the unit. Note the archaic term, which no
      modern-stage search would find.
