name: Iren Dabasu
rank: formation
period: [Late Cretaceous]
stages: [Coniacian, Santonian, Campanian, Maastrichtian]
dispute:
  summary: >
    Vertebrates and microfossils date the formation differently. Currie and
    Eberth (1993) find it "younger than Cenomanian" and "best considered early
    Senonian in age", adding that it "may ultimately prove to be as young as
    Campanian". Van Itterbeeck and colleagues (2005) date it
    Campanian-Maastrichtian from charophytes and ostracods, probably "the
    latest Campanian–Early Maastrichtian" by correlation with the Nemegt
    Formation. The Campanian is the one stage both readings allow.
references:
  - id: currie1993d
    notes: >
      Overturns the Cenomanian age: the formation is "younger than Cenomanian
      and is best considered early Senonian in age. Preliminary data suggest
      that it may ultimately prove to be as young as Campanian", and "the
      generally accepted Cenomanian designation may be too old".
  - id: zanno2010a
    notes: >
      Gives "Iren Dabasu Formation, Late Cretaceous (Campanian-Maastrichtian
      ...)", while noting that its dates "have not yet been firmly
      established": micropaleontological studies "support a
      Campanian-Maastrichtian age, whereas macrovertebrates support a
      Cenomanian-early Campanian age".
  - id: tsogtbaatar2019a
    notes: >
      Uses the narrower Campanian for the Inner Mongolian exposures.
  - id: vanitterbeeck2005b
    notes: >
      The charophytes and ostracods of the Iren Nor site date the formation as
      "Campanian–Maastrichtian", which "can probably be refined to the latest
      Campanian–Early Maastrichtian" by correlation with the Nemegt Formation.
      The paper reviews older estimates: Berkey and Morris (1927) "proposed a
      Lower Cretaceous age for the Iren Dabasu Formation" on Iguanodon, the
      primitive hadrosaurs have been read as "an early Late Cretaceous age
      (Cenomanian–Turonian)", and derived theropods as "mid to late Late
      Cretaceous (Coniacian–Santonian–?Early Campanian)"; the microfossil age
      calls the vertebrate-based estimates into question.
  - id: guo2017a
    notes: >
      Calls the unit the Erlian Formation, "also referred to as Iren Dabasu
      Formation", and from detrital zircons in one sandstone gives "a maximum
      depositional age of 95.8 ± 6.2 Ma", the mean of the two youngest grains,
      so the formation is "post-early Cenomanian". It reviews the published
      ages without choosing among them; the geochronology "has not been clearly
      defined".
  - id: berkey1927a
