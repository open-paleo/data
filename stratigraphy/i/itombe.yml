name: Itombe
rank: formation
period: [Late Cretaceous]
stages: [Turonian]
references:
  - id: mateus2011a
    notes: >
      Records how the Tadi Beds came to be placed in it: Antunes and Cappetta
      (2002) "reconfirm the late Turonian age of these beds, and place them
      in the 'Itombe Formation'", against an original reading that made them
      the base of the 'Senonian'.
  - id: antunes2002a
  - id: mateus2019a
    notes: >
      Reports that the Angolatitan locality at Iembe, which Mateus and
      colleagues (2011) place in the Tadi Beds of this formation, is "now
      considered Coniacian" after "the discovery of the ammonite Protexanites
      sp. at Iembe", having been "originally considered Turonian in age".
beds:
  - name: Tadi
    period: [Late Cretaceous]
    stages: [Turonian]
    references:
      - id: mateus2011a
        notes: >
          Gives the Angolatitan horizon as "Tadi Beds, Itombe Formation, Late
          Turonian (around 90 M.a.), Late Cretaceous", the beds being "about 50 m
          thick" and dated late Turonian on their fish fauna, after an original
          reading that made them the base of the 'Senonian' (= Coniacian). Antunes
          and Cappetta (2002) place them in the Itombe Formation.
      - id: antunes2002a
      - id: mateus2019a
        notes: >
          Reports that Angolatitan, from Iembe, was "originally considered
          Turonian in age but following the discovery of the ammonite Protexanites
          sp. at Iembe, it is now considered Coniacian", and gives the Iembe fauna
          as "of Coniacian age (~88 Ma)". Names neither the bed nor the formation,
          so the Coniacian dates the Iembe locality, not the beds.
