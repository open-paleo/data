name: Itombe
rank: formation
period: [Late Cretaceous]
stages: [Turonian, Coniacian]
references:
  - id: mateus2011a
    notes: >
      Records how the Tadi Beds came to be placed in it: Antunes and Cappetta
      (2002) "reconfirm the late Turonian age of these beds, and place them
      in the 'Itombe Formation'", against an original reading that made them
      the base of the 'Senonian'.
  - id: antunes2002a
  - id: mateus2019a
    notes: >
      Reports that the Angolatitan locality at Iembe, which Mateus and
      colleagues (2011) place in the Tadi Beds of this formation, is "now
      considered Coniacian" after "the discovery of the ammonite Protexanites
      sp. at Iembe", having been "originally considered Turonian in age".
