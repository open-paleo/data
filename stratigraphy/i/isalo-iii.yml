name: Isalo III
rank: formation
period: [Middle Jurassic]
stages: [Bathonian]
references:
  - id: rauhut2009a
    notes: >
      Late Middle Jurassic, Archaeodontosaurus "from the Isalo III Formation
      seems to be a very basal form ... , almost surprisingly basal for a late
      Middle Jurassic taxon", with Lapparentosaurus "from the same unit" and
      much harder to place. Its sauropods stand apart from northern Africa,
      the Jobaria and Atlasaurus group showing no "close relationship with
      roughly contemporaneous sauropod faunas from the Cañadón Asfalto
      Formation of Argentina, or (as far as can be said) the Isalo III
      Formation of Madagascar", a split that might follow from aridity across
      central Gondwana. The southern Gondwanan pattern of uniformly more basal
      dinosaurs "might be true for the Isalo III Formation of Madagascar,
      though some uncertainty remains, due to the problematic phylogenetic
      position of Lapparentosaurus".
  - id: royo-torres2020a
    notes: >
      Gives a type horizon in "the middle part of the Isalo III Formation
      (Bathonian, Middle Jurassic)" on the Loza River, north-western
      Madagascar.
  - id: mannion2010a
    notes: >
      Independently gives "the Bathonian Isalo III Formation" near the Kamoro
      River.
  - id: buffetaut2005a
    notes: >
      Uses the subdivision "Isalo IIIb Formation, Bathonian", the age resting
      on "fossiliferous marine intercalations".
