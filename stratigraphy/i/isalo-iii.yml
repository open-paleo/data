name: Isalo III
rank: formation
informal: true
period: [Middle Jurassic]
stages: [Bathonian]
references:
  - id: rauhut2009a
    notes: >
      Compares the unit's sauropods with northern African ones:
      *Archaeodontosaurus* is "almost surprisingly basal for a late Middle
      Jurassic taxon", and *Lapparentosaurus* is hard to place.
  - id: royo-torres2020a
    notes: >
      Gives a type horizon in "the middle part of the Isalo III Formation
      (Bathonian, Middle Jurassic)" on the Loza River, north-western
      Madagascar.
  - id: mannion2010a
    notes: >
      Independently gives "the Bathonian Isalo III Formation" near the Kamoro
      River.
  - id: buffetaut2005a
    notes: >
      Uses the subdivision "Isalo IIIb Formation, Bathonian", the age resting
      on "fossiliferous marine intercalations".
