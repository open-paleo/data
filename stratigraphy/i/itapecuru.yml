name: Itapecuru
rank: formation
period: [Early Cretaceous]
stages: [Aptian, Albian]
references:
  - id: carvalho2003a
    notes: >
      Gives the Amazonsaurus type as from "Aptian-Albian strata of the
      Itapecuru Formation, Parnaíba Basin, Maranhão State, northern Brazil".
  - id: mayer2026a
    notes: >
      Records that the age is being refined: the fossil record "indicates a
      general referral to the Aptian-Albian, but more recently gathered
      palynological data narrow the age of its lower portion to the late
      Aptian".
  - id: lindoso2019a
    notes: >
      Notes the faunal overlap with its neighbor, "many common taxa ...
      recorded in the Alcântara and Itapecuru formations", suggesting "a
      homogeneous paleocommunity".
