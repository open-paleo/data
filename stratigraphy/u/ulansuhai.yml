name: Ulansuhai
rank: formation
period: [Late Cretaceous]
stages: [Turonian, Coniacian, Santonian, Campanian]
references:
  - id: xu2013a
    notes: >
      Gives "Wulansuhai Formation, Campanian", spelling the name with an
      initial W.
  - id: xu2011c
    notes: >
      Treats Bayan Mandahu as the locality and this as the unit there,
      recording a specimen from "Bayan Mandahu, ''North Canyon'' locality,
      Wulatehouqi, Inner Mongolia; Wulansuhai" Formation. The Bayan Mandahu
      Formation of the Western literature is the same unit's eastern outcrop,
      not a separate one.
  - id: hao2025a
    notes: >
      Fossils from the Maortu locality in Chilantai "were mistakenly claimed
      to belong to" the Wulanhushao (Suhongtu), Dashuigou and Ulansuhai
      formations, but "this fossil-bearing unit ... actually belongs to the
      Miaogou Formation", so an age given for the Ulansuhai Formation at
      Maortu is an age for the Miaogou Formation. Its location map names the
      unit at Bayan Mandahu and Suhongtu the "Upper Cretaceous Ulansuhai
      Formation".
  - id: evans2021a
    notes: >
      Puts the formation after the Cenomanian with a hedge on how much after:
      its age "is constrained to be post-Cenomanian by radiometric dating of
      underlying basalts but may be as old as Turonian", after Kobayashi and
      colleagues (2003).
  - id: kobayashi2003b
    notes: >
      Gives the epoch and no stage: "the Upper Cretaceous Ulansuhai Formation
      in Nei Mongol". No stage term appears anywhere in the paper, so it
      supports none of this entry's four.
