name: Ulansuhai
rank: formation
period: [Late Cretaceous]
stages: [Turonian, Coniacian, Santonian, Campanian]
references:
  - id: xu2013a
    notes: >
      Applies the name, spelled Wulansuhai, to the beds at Bayan Mandahu, "the
      Bayan Mandahu beds (the Wulansuhai Formation)", and dates them
      Campanian. Those beds are entered as Bayan Mandahu, and the Campanian is
      theirs, not this unit's.
  - id: xu2011c
    notes: >
      Records a specimen from "Bayan Mandahu, 'North Canyon' locality,
      Wulatehouqi, Inner Mongolia; Wulansuhai" Formation, the same usage.
  - id: hao2024a
    notes: >
      Fossils from the Maortu locality in Chilantai "were mistakenly claimed
      to belong to" the Wulanhushao (Suhongtu), Dashuigou and Ulansuhai
      formations, but "this fossil-bearing unit ... actually belongs to the
      Miaogou Formation", so an age given for the Ulansuhai Formation at
      Maortu is an age for the Miaogou Formation. It places outcrops of this
      unit at both Bayan Mandahu and Suhongtu, citing a master's thesis by Tan
      (2016) for Bayan Mandahu.
  - id: evans2021a
    notes: >
      Puts the formation after the Cenomanian with a hedge on how much after:
      its age "is constrained to be post-Cenomanian by radiometric dating of
      underlying basalts but may be as old as Turonian", after Kobayashi and
      colleagues (2003). Hypothesizes, "based on proximity and lithology", a
      correlation with the red beds at Bayan Mandahu, above the lower part of
      this unit.
  - id: tan2016a
  - id: kobayashi2003b
    notes: >
      Gives the epoch and no stage: "the Upper Cretaceous Ulansuhai Formation
      in Nei Mongol". No stage term appears anywhere in the paper.
