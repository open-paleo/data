name: Ulaanoosh
rank: formation
variants: [Ulaanuush]
period: [Early Cretaceous, Late Cretaceous]
stages: [Aptian, Albian, Cenomanian]
references:
  - id: yu2020a
    notes: >
      Gives the span and the distribution: "The age of the Ulaanoosh Formation
      ranges from late Early to early Late Cretaceous (Albian-Cenomanian)
      based on vertebrate and invertebrate fossils such as dinosaurs, dinosaur
      eggs, molluscs, ostracods, and turtles", the unit being "distributed in
      the areas of Ulaanoosh, Alguu Ulaan Tsav, Baruunbayan, and Zuunbayan".
      Of its two members, it dates "The lower member (Aptian-Albian)". Beds
      once mapped as the Baruunbayan Formation "are now considered to be part
      of the Ulaanoosh Formation".
  - id: khand2000a
    notes: >
      Reports a K-Ar age of 126 ± 3 Ma on the basalt covering "the red beds of
      the Baruunbayan Formation" at Uush mountain, where "Some authors ...
      established in this basin a new formation named the Ulaanuush
      Formation", the beds Yu and colleagues (2020) place in this unit. On
      that date "the volcanic formation of this area was formed in the
      Neocomian Stage and the isotopic age of the basalt is not consistent
      with the previous age assignment". The same paper reports an ostracod
      study of the section that makes the Baruunbayan "transitional between
      the Lower and the Upper Cretaceous, and the Age is Albian-Cenomanian".
      The Neocomian is not carried.
