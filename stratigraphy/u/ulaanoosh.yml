name: Ulaanoosh
rank: formation
variants: [Ulaanuush]
period: [Early Cretaceous, Late Cretaceous]
stages: [Aptian, Albian, Cenomanian]
references:
  - id: yu2020a
    notes: >
      Gives the span and the distribution: "The age of the Ulaanoosh Formation
      ranges from late Early to early Late Cretaceous (Albian-Cenomanian)
      based on vertebrate and invertebrate fossils such as dinosaurs, dinosaur
      eggs, molluscs, ostracods, and turtles", the unit being "distributed in
      the areas of Ulaanoosh, Alguu Ulaan Tsav, Baruunbayan, and Zuunbayan".
      Of its two members, it dates "The lower member (Aptian-Albian)". Beds
      once mapped as the Baruunbayan Formation "are now considered to be part
      of the Ulaanoosh Formation".
