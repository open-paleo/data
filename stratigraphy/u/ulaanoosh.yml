name: Ulaanoosh
rank: formation
variants: [Ulaanuush]
period: [Early Cretaceous, Late Cretaceous]
stages: [Aptian, Albian, Cenomanian]
description: "The Ulaanoosh Formation, formerly Baruunbayan Formation, is a geologic formation in the Ömnögovi Province of southern Mongolia. The formation dates to the Albian to Cenomanian stages of the Cretaceous. The Ulaanoosh Formation has provided fossils of dinosaurs, turtles and dinosaur eggs assigned to Parafaveoloolithus sp. The neoceratopsian Beg tse was described from the alluvial sandstones, mudstones and conglomerates of the formation."
references:
  - id: yu2020a
    notes: >
      Gives the span and the distribution: "The age of the Ulaanoosh Formation
      ranges from late Early to early Late Cretaceous (Albian-Cenomanian)
      based on vertebrate and invertebrate fossils such as dinosaurs, dinosaur
      eggs, molluscs, ostracods, and turtles", the unit being "distributed in
      the areas of Ulaanoosh, Alguu Ulaan Tsav, Baruunbayan, and Zuunbayan".
      Of its two members, it dates "The lower member (Aptian-Albian)". Beds
      once mapped as the Baruunbayan Formation "are now considered to be part
      of the Ulaanoosh Formation".
  - id: khand2000a
    notes: >
      Reports a K-Ar age of 126 ± 3 Ma on the basalt overlying "the red
      beds of the Baruunbayan Formation" at Uush mountain, which covers the
      beds and so gives them a minimum age rather than a date, where "Some authors ...
      established in this basin a new formation named the Ulaanuush
      Formation", the beds Yu and colleagues (2020) place in this unit. On
      that date "the volcanic formation of this area was formed in the
      Neocomian Stage and the isotopic age of the basalt is not consistent
      with the previous age assignment". The same paper reports an ostracod
      study of the section that makes the Baruunbayan "transitional between the Lower and the Upper Cretaceous, and the Age is
      Albian-Cenomanian". On the ICS chart v2024/12, 126 ± 3 Ma runs from the
      Hauterivian into the Barremian, its central value in the latest
      Hauterivian; on GTS2020 that value is earliest Barremian.
