name: Ulaanoosh
rank: formation
variants: [Ulaanuush]
lithology: mudstone, conglomerate and sandstone, reddish in the upper member
period: [Early Cretaceous, Late Cretaceous]
stages: [Aptian, Albian, Cenomanian]
references:
  - id: yu2020a
    notes: >
      Dates the formation Albian–Cenomanian on fossils and its lower member
      Aptian–Albian, and places beds once mapped as the Baruunbayan Formation in
      it. Source of the lithology.
  - id: khand2000a
    notes: >
      Reports a K-Ar age of 126 ± 3 Ma on basalt covering red beds at Uush
      mountain that it assigns to the Baruunbayan Formation, takes the
      volcanism as Neocomian and the red beds as unable to belong to the upper
      Lower Cretaceous, and reports an ostracod dating of the same formation
      as "Albian-Cenomanian".
