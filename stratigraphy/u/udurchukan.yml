name: Udurchukan
rank: formation
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
lithology: fine- to coarse-grained sandstone, with muddy diamictite and
  conglomerate
references:
  - id: godefroit2011a
    notes: >
      Places holotypes from both Blagoveschensk and Kundur in the "Udurchukan
      Formation, Maastrichtian, Upper Cretaceous".
  - id: xing2022a
    notes: >
      Narrows it to "Udurchukan Formation (middle Maastrichtian)". Source of the
      lithology.
  - id: alifanov2010a
    notes: >
      Describes Arkharavia from grayish green clays in "the roof of the
      Udurchukan Formation" at Kundur, and dates it to the Maastrichtian.
  - id: bolotsky1991a
  - id: nessov1997a
