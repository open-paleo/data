name: Udurchukan
rank: formation
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
references:
  - id: godefroit2011a
    notes: >
      Places holotypes from both Blagoveschensk and Kundur in the "Udurchukan
      Formation, Maastrichtian, Upper Cretaceous".
  - id: xing2022a
    notes: >
      Narrows it to "Udurchukan Formation (middle Maastrichtian".
  - id: alifanov2010a
    notes: >
      The Kundur remains come from grayish green clays in "the roof of the
      Udurchukan Formation (previously referred to as the Tsagayan Formation
      or Lower Tsagayan Formation)". The bone-bearing beds of the Amur Region
      "were dated to the Campanian–Maastrichtian boundary" by Bolotsky and
      Kurzanov (1991), "or a wide range from the Late Campanian to the Middle
      Maastrichtian" by Nessov (1997), while more recent work places them
      variously in the early, middle or late Maastrichtian; the paper puts its
      own material at "Upper Cretaceous, Maastrichtian, Udurchukan Formation".
