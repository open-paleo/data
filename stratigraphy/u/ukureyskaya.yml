name: Ukureyskaya
rank: formation
variants: [Ukurey]
period: [Middle Jurassic, Late Jurassic]
references:
  - id: godefroit2014a
    notes: >
      Gives the Kulindadromeus horizon as "the base of the Ukureyskaya
      Formation, dated as Middle to Late Jurassic", at the Kulinda locality in
      the Chernyshevsky District of the Chita Region, southeastern Siberia.
      The age is hedged across an epoch boundary.
  - id: li2019a
    notes: >
      Gives the narrower reading, "the Middle Jurassic Ukureyskaya Formation
      of Chita Region, Russia".
  - id: cincotta2019a
    notes: >
      Dates the lower part of the unit radiometrically and from both sides.
      Concordia ages "constrain the maximum age of the volcaniclastic deposits
      at 172.8 plus or minus 1.6 Ma, corresponding to the Aalenian (Middle
      Jurassic)", while the palynological assemblage "includes taxa that are
      correlated to Bathonian palynozones from western Siberia, and therefore
      constrains the minimum age of the deposits". Both are stated of the
      deposits rather than of the animal, although the abstract's headline
      sentence makes the taxon the subject. The conclusions give "a Bathonian
      age for the deposits, corresponding to an age ranging between 168.3 and
      166.1 Ma". This holds for the lower part only - "The excavated sections
      at Kulinda belong to the lower part of the Ukurey Formation" - and the
      paper widens the unit rather than redating it: "The stratigraphic range
      of the Ukurey Formation is therefore wider than previously assumed, its
      lower part extending to the Middle Jurassic", which is "older than the
      previous Late Jurassic to Early Cretaceous ages tentatively based on
      local stratigraphic correlations". Prints the name Ukurey Formation
      throughout.
