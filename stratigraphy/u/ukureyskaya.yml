name: Ukureyskaya
rank: formation
variants: [Ukurey]
lithology: sandstone, conglomerate and siltstone, with breccia, tuff and
  andesitic to basaltic lavas
period: [Middle Jurassic, Late Jurassic]
stages: [Bathonian]
references:
  - id: godefroit2014a
    notes: >
      Gives the Kulindadromeus horizon as "the base of the Ukureyskaya
      Formation, dated as Middle to Late Jurassic", at the Kulinda locality in
      the Chernyshevsky District of the Chita Region, southeastern Siberia.
      The age is hedged across an epoch boundary and cited to the paper's own
      supplementary materials, for the same basal beds that Cincotta and
      colleagues (2019) have since dated Bathonian.
  - id: li2021a
    notes: >
      Gives the narrower reading, "the Middle Jurassic Ukureyskaya Formation
      of Chita Region, Russia".
  - id: cincotta2019a
    notes: >
      Dates the lower part of the formation at Kulinda Bathonian, between a
      172.8 Ma zircon maximum and a Bathonian palynological assemblage,
      extending it into the Middle Jurassic; its Late Jurassic for the rest of
      the formation is relayed from earlier K–Ar dates and faunal
      comparisons. Source of the lithology.
