name: Upper Dinosaur
rank: member
parent: Tendaguru
period: [Late Jurassic, Early Cretaceous]
stages: [Kimmeridgian, Tithonian, Berriasian]
variants: [Upper Saurian Bed]
references:
  - id: mannion2019a
    notes: >
      Gives both the name and its alternate: "Upper Dinosaur Member (Upper
      Saurian Bed), Tendaguru Formation; Tithonian, Late Jurassic".
  - id: rauhut2011a
    notes: >
      Places the member in the "late Tithonian-earliest Cretaceous", following
      Bussert and colleagues (2009), and narrows its locality MW to the "upper
      Tithonian".
  - id: bussert2009a
    notes: >
      Leaves open whether the member reaches into the Cretaceous: "More work
      is needed to decide unambiguously whether the Upper Dinosaur Member is
      wholly Late Jurassic or, in part, Early Cretaceous." U-Pb dating of a
      Brachiosaurus brancai pelvic bone from the member gave Romer (2001) "an
      age range from ca. 140 to 150 Ma", falling approximately in the
      Tithonian and the Berriasian, while the absence of Cicatricosisporites
      reported by Schrank (2005) "could indicate a Tithonian age".
  - id: schrank2005a
    notes: >
      Radiometric work on dinosaur bone from the Upper Saurian Bed "did not
      allow a precise age determination, but resulted in a possible minimum
      age of 140 to 150 Ma ... that corresponds to Berriasian to Tithonian",
      the dating after Romer (2001) and the conversion to stages after Haq and
      Van Eysinga (1998).
  - id: romer2001a
    notes: >
      A uranium-lead study of Brachiosaurus brancai bone, which uses the
      alternate name Upper Saurian Bed and disclaims its own precision: "No
      precise age can be determined from the data, although the most
      consistent solution falls in the range of 140 to 150 Ma." The method
      gives a floor rather than an age - "Diagenetic incorporation of uranium
      into bone material establishes a minimum age for the fossil" - and the
      paper notes that unrecognized additions of radiogenic lead produce "an
      overestimation of the age". So the figure permits a Berriasian without
      asserting one.
  - id: wild1991a
    notes: >
      Gives the Janenschia robusta stratum typicum as "Upper Saurian marl,
      upper Kimmeridgian", following Janensch (1961).
