name: Upper Weald Clay
rank: formation
parent: Weald Clay
period: [Early Cretaceous]
stages: [Barremian]
references:
  - id: norman2013a
    notes: >
      Puts the formation at the top of the Weald Sub-basin succession, which
      runs "from the upper Berriasian (Ashdown Beds Formation) to the top of
      the Barremian (Upper Weald Clay Formation)", and dates its exposures at
      Smokejacks Brickworks near Ockley, Surrey, and at Henfield, West
      Sussex, as "middle Barremian (~128 Ma)" after Batten (2011).
  - id: barker2023a
    notes: >
      Gives the formation and its stage together for the Baryonyx walkeri
      holotype, which is "from the Barremian Upper Weald Clay Formation of
      Surrey". Most British spinosaurid skeletal material comes from "the
      Barremian strata of Surrey (Upper Weald Clay Formation)".
  - id: raven2020a
    notes: >
      Barremian, and coeval with the Wessex Formation of the neighboring
      sub-basin: "The Upper Weald Clay Formation of the Weald Sub-basin and
      the Wessex Formation of the Wessex Sub-basin overlap temporally (both
      are Barremian; Batten, 2011)."
