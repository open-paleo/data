name: Rio Paraná
rank: formation
parent: Caiuá
period: [Early Cretaceous]
stages: [Aptian, Albian]
dispute:
  summary: >
    Arai and Dias-Brito (2023) date the formation Aptian–Albian by extending
    to it the age of pterosaurs and a noasaurid from the interdigitated
    Goioerê Formation, and Soto Núñez and colleagues (2026) call it "upper
    Lower Cretaceous". Langer and colleagues (2019) call it "the likely early
    Late Cretaceous Rio Paraná Formation", and Dias and colleagues (2010)
    refer to "the 90-100 Ma old sediments of the Rio Paraná Formation"
    without giving a source or basis for the figure.
references:
  - id: langer2019a
    notes: >
      Calls it "the likely early Late Cretaceous Rio Paraná Formation" at the
      Vespersaurus type locality, but states no stage for it. Following some
      stratigraphic schemes, places it in its group as one of "three coeval
      units: the Rio Paraná, Goio Erê, and Santo Anastácio formations", and
      reassigns a site to it: the Cruzeiro do Oeste deposits had been put in
      the Goio Erê, "but the site is located in an area more commonly mapped
      as covered by sediments of the Rio Paraná Formation. This assignment is
      confirmed here, based on a recent in loco revaluation".
  - id: sotonúñez2026a
    notes: >
      Calls it "the upper Lower Cretaceous Rio Paraná Formation", the
      exception among the mostly upper Late Cretaceous units it compares, and
      attributes the distinct composition of its fauna to "its older age (e.g.
      presence of tapejarids, absence of saltasaurines)".
  - id: arai2023a
    notes: >
      "The Caiuá Group is here sustained as the Aptian–Albian", on pterosaurs
      and the noasaurid Berthasaura leopoldinae from the Goioerê Formation,
      whose age "pode ser estendida para as formações Rio Paraná ... e
      Pirapozinho ..., já que, segundo tais autores, as unidades se encontram
      interdigitadas" (can be extended to the Rio Paraná and Pirapozinho
      formations since, according to those authors, the units are
      interdigitated, translated).
  - id: fernandes1994a
    notes: >
      Credits the split of the old Caiuá Formation to Fernandes (1992), which
      "divided the Caiuá unit into the Goio Erê and Rio Paraná formations",
      and proposes "the formal definition of the Caiuá Group as the grouping
      of the Goio Erê, Rio Paraná and Santo Anastácio formations"
      (translated). Designates the stratotypes: "The cuts of the lock of the
      Porto Primavera hydroelectric plant (Pontal do Paranapanema, SP) are
      designated here as the holostratotype of the Rio Paraná Formation"
      (translated), with a parastratotype at km 501 of highway BR 376 near
      Paranavaí. The formation reaches about 250 m, has transitional contacts
      with the Goio Erê and Santo Anastácio formations and an erosive base on
      the Serra Geral Formation. Its only age is for the whole basin.
  - id: fernandes2000a
    notes: >
      Keeps the formation in the Caiuá Group with its type section from
      Fernandes and Coimbra (1994), resting on the Serra Geral basalts across
      an unconformity and in "gradual lateral contact with the Goio Erê
      Formation" (translated).
  - id: batezelli2015a
    notes: >
      Stacks the group's formations rather than treating them as coeval: "The
      Caiuá Group consists of three formations (in ascending stratigraphic
      order ...): the Goio Erê Formation (margins of Draa), the Rio Paraná
      Formation (inner Draa) and the Santo Anastácio Formation (Paleosols)".
      Its ages are for the group as a whole.
  - id: fernandes1992a
  - id: dias2010a
    notes: >
      Dates detrital zircons from four samples in São Paulo State by fission
      track and U-Th-Pb, as evidence of source areas and of the thermal
      history of the source rocks, not of deposition; it computes no maximum
      depositional age. States without a source that the sediments were
      "formed between 90 to 100 Ma old before present", and estimates the
      group's age at 100 to 80 Ma, also without a source. Places the formation
      in the Bauru Group: "Rio Paraná Formation, which is part of the Bauru
      Group".
