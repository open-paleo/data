name: Ruby Ranch
rank: member
parent: Cedar Mountain
period: [Early Cretaceous]
stages: [Aptian, Albian]
lithology: massive mudstone with large carbonate nodules
references:
  - id: kirkland2016a
    notes: >
      Gives that the member "ranges in age from approximately middle Aptian to
      middle Albian".
  - id: carpenter2001a
    notes: >
      Independently gives "Ruby Ranch Member (Aptian-Albian)".
  - id: sprinkel2012a
    notes: >
      Gives "Aptian to middle Albian" as the member's tentative age "based on
      dinosaur biostratigraphy", and holds it "unwarranted" to carry the member
      names into northeastern Utah.
  - id: kirkland2007a
    notes: >
      Dates the member by its dinosaur faunas, after Kirkland, Lucas and Estep
      (1998), as formed "115-105 million years ago".
  - id: mori2009a
    notes: >
      A master's thesis whose detrital zircons "coarsely bracket the temporal
      span of the Ruby Ranch Member between about 115 Ma to 111 Ma".
  - id: kirkland1998e
  - id: burton2006a
  - id: ludvigson2010b
    notes: >
      Source of the lithology.
