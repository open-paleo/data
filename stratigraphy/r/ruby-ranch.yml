name: Ruby Ranch
rank: member
parent: Cedar Mountain
period: [Early Cretaceous]
stages: [Aptian, Albian]
references:
  - id: kirkland2016a
    notes: >
      Gives that the member "ranges in age from approximately middle Aptian to
      middle Albian".
  - id: carpenter2001a
    notes: >
      Independently gives "Ruby Ranch Member (Aptian-Albian)".
  - id: sprinkel2012a
    notes: >
      "Aptian to middle Albian for the Ruby Ranch Member", one of the
      tentative ages the lower three members of the Cedar Mountain Formation
      were initially assigned "based on dinosaur biostratigraphy". Around
      Dinosaur National Monument the bulk of the formation "best fit the Ruby
      Ranch Member", although the paper holds that it is "unwarranted" to
      carry the central Utah member names into northeastern Utah.
  - id: kirkland2007a
    notes: >
      Dates the member by its dinosaur faunas, following Kirkland, Lucas and
      Estep (1998): "Similar dinosaur faunas are known across much of North
      America, suggesting these rocks formed 115-105 million years ago", a
      span within the Aptian and Albian on the ICS chart v2024/12. Carbonate-nodule isotope work forms "a basis for
      chronostratigraphic correlations within the Aptian-Albian time
      interval". Detrital zircon ages of 109 to 116 Ma from near the Price
      River II Quarry, from Burton and colleagues (2006), are reported and
      then doubted, on a personal
      communication, as reworked grains, because the samples lie above a
      calcrete that was "mistakenly interpreted as the base of Ruby Ranch
      Member".
  - id: mori2009a
    notes: >
      A master's thesis. Detrital zircons "coarsely bracket the temporal span
      of the Ruby Ranch Member between about 115 Ma to 111 Ma", which its
      summary widens to "120 - 117 Ma to 111 Ma (Late Aptian to earliest
      Albian)". Both rest on maximum depositional ages, 117.2 Ma near the base
      at the Bodily nodosaur site and 115.0 Ma for the lower 35 m at the Long
      Walk quarry, with the top inferred from grains reworked into the
      overlying Mussentuchit Member.
  - id: kirkland1998e
  - id: burton2006a
