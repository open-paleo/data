name: Romualdo
rank: formation
period: [Early Cretaceous]
stages: [Aptian, Albian]
dispute:
  summary: >
    Formation or member, depending on how the Santana is treated. Arai and
    Assine (2020) use formation rank and report that the unit "has been
    extended into the Albian"; Sues and colleagues (2002) write "Romualdo
    Member is probably younger than early Albian". A member of the Santana
    Formation becomes a formation wherever the Santana itself is read as a
    group.
references:
  - id: naish2004a
    notes: >
      The Mirischia holotype's horizon is "Romualdo Member of the Santana
      Formation, Araripe Group. Lower Cretaceous (Martill and Wilby, 1993). A
      ?late Albian age is inferred by Pons et al. (1990)", and the paper's
      title carries the same "?Albian, Early Cretaceous" reading. The member
      is treated as the concretion-bearing part of the Santana Formation,
      deposited under brackish or quasi-marine conditions, with the dinosaur
      material allochthonous.
  - id: sayão2020a
    notes: >
      Carries both Early Cretaceous readings at once: the title dates the unit
      Albian, while the horizon statement assigns the new theropod to the
      lower strata of the formation, Aptian, in dark shale about 2.5 m above
      the contact with the Ipubi Formation and some 30 m below the concretion
      level. On rank it reports a settled view, that "there is a consensus to
      consider the former Santana Formation ... as the Santana Group, that is
      further divided from base to top, into the Barbalha, Crato, Ipubi and
      Romualdo formations".
  - id: sales2017a
    notes: >
      Reads the unit as Albian: "geological data indicate a transitional
      depositional setting for the majority of the stratigraphic sequence of
      the Romualdo Formation and a late Early Cretaceous (Albian) age", with
      the holotypes of Irritator and Angaturama both placed in "Romualdo
      Formation; Albian, Lower Cretaceous". Formation rank is adopted
      explicitly, following Valença and colleagues, for "the
      lithostratigraphic unit of the concretion-bearing beds", and the paper
      records marine strata with echinoids and mollusks in the western part of
      the formation above those beds.
  - id: delcourt2025a
    notes: >
      Calls the unit "a world-famous Early Cretaceous (Aptian) fossil
      Konservat Lagerstätte that crops out along the margins of the Araripe
      Plateau", using formation rank throughout. The theropods it revises come
      from "The upper carbonate concretion levels of the Romualdo Formation
      (Aptian, Brazil)", the same beds that yielded the spinosaurids, while
      Aratasaurus "was recovered from the lower levels of that unit".
  - id: arai2020a
    notes: >
      Uses formation rank and extends its range into the Albian.
  - id: sues2002a
    notes: >
      Uses member rank, and dates it only relatively, "probably younger than
      early Albian".
