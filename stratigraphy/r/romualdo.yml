name: Romualdo
rank: formation
parent: Santana
period: [Early Cretaceous]
stages: [Aptian, Albian]
lithology: shale, marl and limestone, with abundant carbonate concretions
references:
  - id: naish2004a
    notes: >
      Gives the Mirischia horizon as "Romualdo Member of the Santana Formation,
      Araripe Group", Lower Cretaceous, with a ?late Albian age inferred by Pons
      and colleagues (1990).
  - id: sayão2020a
    notes: >
      Dates the formation Albian in its title but places Aratasaurus in its
      "lower strata", Aptian, in dark shale about 2.5 m above the contact with
      the Ipubi Formation.
  - id: sales2017a
    notes: >
      Places the Irritator and Angaturama holotypes in "Romualdo Formation;
      Albian, Lower Cretaceous", a unit of concretion-bearing shale, marl and
      limestone. Source of the lithology.
  - id: delcourt2025a
    notes: >
      Dates the formation Aptian, with Santanaraptor and Mirischia from its
      "upper carbonate concretion levels" and Aratasaurus from its lower levels.
  - id: arai2020a
    notes: >
      Uses formation rank, reports that the unit "has been extended into the
      Albian" by earlier work, and concludes from palynology that it "is
      almost entirely Aptian in age".
  - id: sues2002a
    notes: >
      Uses member rank, and dates it only relatively, "probably younger than
      early Albian".
  - id: pons1990a
    notes: >
      Cited by Naish and colleagues (2004) for a ?late Albian age for the
      Romualdo Member.
  - id: martill1993a
    notes: >
      Cited by Naish and colleagues (2004) for the Romualdo Member's place in
      the Santana Formation and its Early Cretaceous age.
