name: Reynolds Point
rank: member
parent: Wahweap
period: [Late Cretaceous]
stages: [Campanian]
references:
  - id: beveridge2022a
    notes: >
      Formalizes it as the second of the Wahweap Formation's four members,
      above the Last Chance Creek and below the Coyote Point, and places the
      Last Chance Creek to Reynolds Point boundary at 81.55 Ma and the
      Reynolds Point to Coyote Point boundary at 80.61 Ma, against a formation
      base of 82.17 Ma. Re-dates the Star Seep bentonite at the member's base
      by CA-ID-TIMS at about 81.47 Ma, "significantly older (~0.9 to 1.6 Myr)
      than previous ages for what is interpreted to be the same horizon
      (SS07-B = 79.9 Ma, CF05-B = 80.6 Ma – Jinnah et al., 2009; Jinnah,
      2013)".
  - id: kirkland2010a
    notes: >
      Under the unit's earlier informal name, dates a level near its base from
      the 40Ar/39Ar date Jinnah and colleagues (2007) obtained on "an ash near
      the base of the middle mudstone member of the Wahweap Formation, 54 m
      above the base of the formation", which "indicates an early Middle
      Campanian age". The Diabloceratops type locality, near the middle of the
      member, "would date at ~79.57 Ma, well into the Middle Campanian". The
      full paper by Jinnah and colleagues (2008) puts that ash about 40 m
      above the formation's base.
  - id: jinnah2008a
    notes: >
      Reports "the first 40Ar-39Ar age for the Wahweap Formation, obtained
      from a devitrified volcanic ash horizon (bentonite)", which "crops out
      in the middle member (Fig. 3), approximately 40 m above the base of the
      Wahweap Formation" and yields 80.1 ± 0.3 Ma.
  - id: jinnah2013a
    notes: >
      Recalculates that bentonite against a revised Fish Canyon Tuff standard
      to 80.6 Ma, and dates a second ash about 10 m higher "(~60-m level) in
      the same Star Seep field area" at "a concordant age of 79.9 ± 0.3 Ma".
