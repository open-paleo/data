name: Reynolds Point
rank: member
parent: Wahweap
period: [Late Cretaceous]
stages: [Campanian]
references:
  - id: beveridge2022a
    notes: >
      Formalizes it as the second of the Wahweap Formation's four members,
      above the Last Chance Creek and below the Coyote Point, and places the
      Last Chance Creek to Reynolds Point boundary at 81.55 Ma against a
      formation base of 82.17 Ma.
  - id: kirkland2010a
    notes: >
      Under the unit's earlier informal name, dates a level near its base from
      the 40Ar/39Ar date Jinnah and colleagues (2007) obtained on "an ash near
      the base of the middle mudstone member of the Wahweap Formation, 54 m
      above the base of the formation", which "indicates an early Middle
      Campanian age". The Diabloceratops type locality, near the middle of the
      member, "would date at ~79.57 Ma, well into the Middle Campanian".
  - id: jinnah2007a
    notes: >
      A conference abstract, and the source of the date this member's age
      rests on. It reports the first radiometric dating of the Wahweap
      Formation, by laser-fusion single-crystal 40Ar/39Ar on sanidine
      phenocrysts from a bentonite 54 m above the base of the roughly 400 m
      thick formation, yielding an age of 80.1 plus or minus 0.3 Ma.
      Combined with a previously dated ash of about 75.9 Ma at the base of
      the overlying Kaiparowits Formation it gives a sediment accumulation
      rate of about 8.2 cm per thousand years. The dated horizon lies within
      this member, which Kirkland and colleagues (2010) reach under its
      earlier informal name, the middle mudstone member.
