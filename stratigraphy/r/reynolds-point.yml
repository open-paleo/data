name: Reynolds Point
rank: member
parent: Wahweap
period: [Late Cretaceous]
stages: [Campanian]
lithology: mudstone
references:
  - id: beveridge2022a
    notes: >
      Formalizes it as the second of the Wahweap Formation's four members, and
      re-dates the Star Seep bentonite near its base by CA-ID-TIMS at about
      81.47 Ma.
  - id: kirkland2010a
    notes: >
      As the middle mudstone member, gives it "an early Middle Campanian age"
      from the 80.1 Ma ash that Jinnah and colleagues (2007) dated near its
      base.
  - id: jinnah2008a
    notes: >
      Reports "the first 40Ar-39Ar age for the Wahweap Formation, obtained from
      a devitrified volcanic ash horizon (bentonite)", which "crops out in the
      middle member (Fig. 3), approximately 40 m above the base of the Wahweap
      Formation" and yields 80.1 ± 0.3 Ma. Source of the lithology.
  - id: jinnah2013a
    notes: >
      Recalculates that bentonite against a revised Fish Canyon Tuff standard
      to 80.6 Ma, and dates a second ash about 10 m higher "(~60-m level) in
      the same Star Seep field area" at "a concordant age of 79.9 ± 0.3 Ma".
  - id: jinnah2007a
    notes: >
      Abstract reporting the first 40Ar/39Ar date from the Wahweap Formation,
      the source Kirkland and colleagues (2010) cite for the ash near the
      member's base.
