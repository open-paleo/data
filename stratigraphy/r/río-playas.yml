name: Río Playas
rank: formation
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
references:
  - id: apesteguía2020a
    notes: >
      Describes Yamanasaurus from "rocks of the Río Playas Formation, which
      is regarded as Campanian-Maastrichtian in age", in the Alamor-Lancones
      Basin of southern Ecuador.
  - id: santucci2022a
    notes: >
      Gives "Río Playas Formation, late Maastrichtian (Upper Cretaceous)" for
      the Yamana region of Loja Province, citing Apesteguía and colleagues
      (2020), who give the formation as Campanian-Maastrichtian; the
      narrower age is not argued.
