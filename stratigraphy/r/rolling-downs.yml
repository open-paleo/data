name: Rolling Downs
rank: group
period: [Early Cretaceous, Late Cretaceous]
references:
  - id: vine1967a
    notes: >
      Divides the group into the Wilgunya Sub-group, of the Wallumbilla
      Formation, Toolebuc Limestone and Allaru Mudstone, and the Manuka Sub-
      group, of the Mackunda and Winton formations.
  - id: exon1976a
    notes: >
      Places the Griman Creek Formation in the group in the Surat Basin:
      "Within the Rolling Downs Group the major aquifers are the Coreena
      Member and the lower part of the Griman Creek Formation".
