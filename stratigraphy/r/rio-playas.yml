name: Río Playas
rank: formation
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
references:
  - id: apesteguía2020a
    notes: >
      Describes Yamanasaurus from "rocks of the Río Playas Formation, which
      is regarded as Campanian-Maastrichtian in age", in the Alamor-Lancones
      Basin of southern Ecuador.
  - id: santucci2022a
    notes: >
      Narrows the occurrence to "Río Playas Formation, late Maastrichtian
      (Upper Cretaceous)" in the Yamana region of Loja Province.
