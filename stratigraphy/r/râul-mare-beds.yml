name: Râul Mare Beds
rank: formation
informal: true
period: [Late Cretaceous]
stages: [Maastrichtian]
references:
  - id: díezdíaz2025a
    notes: >
      Lists the beds among the "as yet not formally defined sedimentary
      successions" of the Hațeg Basin, in its west-central area, "probably
      'middle' to upper Maastrichtian", and draws them as a stratigraphic
      column separate from the Sînpetru Formation. The Nălaț-Vad locality
      "belongs to the 'Râul Mare Beds', a not yet formally defined
      lithostratigraphical unit that either represents the uppermost part of
      the Sînpetru Formation … or is a distinct unit".
  - id: augustin2022a
    notes: >
      Maps "Sînpetru Formation-correlative units ('Râul Mare Beds' in the
      central part of the basin, 'Pui Beds' in the eastern part)", and gives
      the rocks exposed along the Râul Mare River near Nălaț-Vad and Totești
      as "likely 'middle' to late Maastrichtian in age".
  - id: csiki-sava2016a
    notes: >
      Describes the "Raul Mare Valley succession, tentatively referred to the
      Sînpetru Formation", records the proposal that it belongs to the
      Densuș-Ciula Formation instead, and treats it "as a separate entity".
  - id: magyar2026a
    notes: >
      Reports Zalmoxes "both in the Sînpetru Formation … and in the 'Râul
      Mare Beds'".
  - id: albert2025a
    notes: >
      Sets "the uppermost Cretaceous Sînpetru Formation or the coeval 'Raul
      Mare beds'" side by side.
  - id: stoicescu2024a
    notes: >
      Keeps the outcrops in the Sânpetru Formation, which it says "is exposed
      in outcrops along the Râul Mare riverbed at Totești … and Nălaț-Vad".
