name: Reuchenette
rank: formation
period: [Late Jurassic]
stages: [Kimmeridgian]
references:
  - id: comment2015a
    notes: >
      The formation "covers almost the entire Kimmeridgian (Upper Jurassic) of
      Ajoie", where it "is subdivided into four members: the Vabenau Member
      ..., the Banné Member ... known for its richness in invertebrates, the
      Courtedoux Member ... with several dinosaur trace fossil levels, and the
      Chevenez Member (nov.), in the upper part of the formation". At the type
      locality "the thickness of the formation is approximately 150 m".
  - id: jank2006a
    notes: >
      Builds a biostratigraphic frame for the formation from seventeen closely
      spaced sections, "based on seven species of ammonites and corroborated
      by ostracodes", and assigns the record to "the Late Oxfordian to Late
      Kimmeridgian sensu gallico (middle Eudoxus-Zone)". The stages are the
      Gallic ones, and the title hedges the older end as "?Oxfordian", so the
      span is not directly comparable with the international stages this
      entry records.
  - id: carrano2012a
    notes: >
      Places the Amanzia material, from the "'Virgulian' Basse Montagne
      quarry near Moutier, Kanton Bern, Switzerland", in what is "now known
      to belong to the lower Reuchenette Formation (early Kimmeridgian)".
