name: Reuchenette
rank: formation
period: [Late Jurassic]
stages: [Kimmeridgian]
lithology: bedded limestone with a few thin marl intercalations
references:
  - id: comment2015a
    notes: >
      Divides the formation in the Ajoie into four members, naming the Chevenez
      Member, and finds that it covers almost the whole Kimmeridgian there.
  - id: jank2006a
    notes: >
      Dates the formation by ammonites from "the (? Planula) Platynota- to the
      Eudoxus-Zones", a span it calls Late Oxfordian to Late Kimmeridgian sensu
      gallico. Source of the lithology.
  - id: carrano2012a
    notes: >
      Places the Amanzia material, from the "'Virgulian' Basse Montagne
      quarry near Moutier, Kanton Bern, Switzerland", in what is "now known
      to belong to the lower Reuchenette Formation (early Kimmeridgian)".
  - id: hesselbo2020a
