name: Rock Point
rank: member
parent: Chinle
period: [Late Triassic]
stages: [Norian, Rhaetian]
dispute:
  summary: >
    Member or formation, and the split runs by scheme rather than by evidence.
    Nesbitt and colleagues (2020) name it outright: Lucas and Hunt (1993) and
    Rinehart and colleagues (2009) "proposed correlation with the Rock Point
    Member of that formation ('Rock Point Formation' in their nomenclature)".
    Hunt and colleagues use Member eight times in 1991 and Formation nine
    times in 1998, either side of the revision that raised it.
    The age is separately disputed, between a Norian and a Rhaetian reading.
    Long and Murry (1995) give "?Early Norian", Litwin and colleagues (1991)
    read an early Norian from palynology, and Rinehart and colleagues (2009),
    weighing magnetostratigraphy against two biostratigraphies, "favor the
    late Norian age"; against them Martz and colleagues place most of the
    member in an Apachean holochronozone falling "during the Rhaetian", and
    Novas and colleagues (2021) write of "the Rhaetian Rock Point Member".
    Several papers carry both without choosing, and Nesbitt and colleagues
    (2020) still report the question open. A late Rhaetian to Hettangian
    reading is sometimes attributed to this unit and should not be: its
    source is not held, the paper that relays it does so to reject it, and
    the nearest Hettangian in the literature belongs to the Glen Canyon
    Group, from which Olsen and Galton expressly exclude these beds.
references:
  - id: nesbitt2020a
    notes: >
      Uses member rank and identifies formation rank as the other scheme's
      house style.
  - id: hunt1991a
    notes: >
      Uses member rank, placing the famous Whitaker quarry "in the Rock Point
      Member of the Chinle Formation at Ghost Ranch, New Mexico".
  - id: long1995a
    notes: >
      Uses member rank inside a Chinle Formation and gives "?Early Norian",
      setting it beside the upper Petrified Forest and Siltstone Members.
  - id: cather2013a
    notes: >
      Declines the rename for the New Mexico beds it was applied to: "Lucas
      and Hunt (1992) renamed these beds the Rock Point Formation for a unit
      at the top of the Chinle in the Four Corners area that they regarded to
      be correlative. Subsequent magnetostratigraphic analysis, however, has
      called into question this correlation ... Until this controversy is
      resolved, we favor a return to the use of the term siltstone member for
      these beds."
  - id: lucas1993a
    notes: >
      Carries the Rhaetian only inside the title of a work it cites, Hunt's
      "Redonda Formation and Rock Point Member of the Chinle Formation
      (southwestern United States): are they Rhaetian (latest Triassic) in
      age?"
  - id: rinehart2009a
    notes: >
      Dates the Whitaker quarry within the member and declines to settle it:
      on magnetostratigraphy and two biostratigraphies "the quarry is of
      Apachean (late Norian-Rhaetian) age", and "Clearly, the Whitaker quarry
      is Late Triassic in age (not Hettangian), and either late Norian or
      Rhaetian. We favor the late Norian age". Records a third reading against
      both: Zeigler and Geissman (2009) "assigned a late Rhaetian-Hettangian
      age to the Rock Point Formation in the Chama basin" on paleopole
      similarity.
  - id: lucas1992a
    notes: >
      Gives the unit a phytosaur of "late Norian/Rhaetian" age, using
      formation rank.
  - id: hunt1998a
    notes: >
      Dates the unit by faunachron rather than by stage, and the two are
      never adjacent in the text: the formation is assigned to the Apachean
      five times, and the calibration is given separately - "four separate
      faunachrons: the Otischalkian (late Carnian: early Tuvalian), Adamanian
      (late Carnian: late Tuvalian), Revueltian (early-late Norian:
      Lacian-Sevatian) and Apachean (Rhaetian)". So it is a Rhaetian reading
      for this unit, reachable only through that equivalence, and the
      calibration is credited to Lucas and Hunt (1993) rather than
      established here.
