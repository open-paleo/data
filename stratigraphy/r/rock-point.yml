name: Rock Point
rank: member
parent: Chinle
period: [Late Triassic]
stages: [Rhaetian]
references:
  - id: nesbitt2020a
    notes: >
      Uses member rank and identifies formation rank as the other scheme's
      house style.
  - id: hunt1991a
    notes: >
      Uses member rank, placing the famous Whitaker quarry "in the Rock Point
      Member of the Chinle Formation at Ghost Ranch, New Mexico".
  - id: long1995a
    notes: >
      Uses member rank inside a Chinle Formation and gives "?Early Norian",
      setting it beside the upper Petrified Forest and Siltstone Members.
  - id: cather2013a
    notes: >
      Declines the name for the north-central New Mexico beds it was applied to,
      since their correlation with the Rock Point was "called into question",
      and favors "a return to the use of the term siltstone member".
  - id: lucas1993b
    notes: >
      Cited by Hunt and colleagues (1998), with Lucas and Hunt (1993), for the
      Chinle Group's late Carnian to Rhaetian range; they credit the
      Apachean's Rhaetian to Lucas and Hunt alone.
  - id: lucas1993a
    notes: >
      Names the Apachean faunachron, finds it "in the Rock Point Formation" of
      New Mexico, Utah and Colorado, and dates it Rhaetian, though "it might be
      of late Norian age".
  - id: rinehart2009a
    notes: >
      Dates the Whitaker quarry, near the middle of the member in the Chama
      Basin, as Apachean, "either late Norian or Rhaetian", and favors the late
      Norian.
  - id: lucas1992a
    notes: >
      Gives the unit a phytosaur of "late Norian/Rhaetian" age, using
      formation rank.
  - id: hunt1998a
    notes: >
      Assigns the unit, as a formation, to the Apachean land-vertebrate
      faunachron, which it equates with the Rhaetian after Lucas and Hunt
      (1993).
  - id: novas2021a
    notes: >
      Writes of "the Rhaetian Rock Point Member".
  - id: zeigler2009a
  - id: litwin1991a
  - id: martz2017a
    notes: >
      Places the member in the Apachean holochronozone, which "encompasses
      most of the Redonda Formation of the Dockum Group, most of the Owl Rock
      Member, Rock Point Member, and Church Rock Member", and puts the
      Apachean estimated holochron at "about 207 to 202 Ma (an interval of
      about 5 million years) during the Rhaetian".
  - id: hunt1991b
