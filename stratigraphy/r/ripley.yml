name: Ripley
rank: formation
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
references:
  - id: baird1979a
    notes: >
      Dates it by way of the member inside it, "the McNairy Sand Member of the
      Ripley Formation, considered early Maestrichtian in age".
  - id: gilmore1945a
    notes: >
      Places it beneath the Owl Creek Formation in southeastern Missouri, and
      gives the horizon of the Glen Allen vertebrae as "McNairy sand member,
      Ripley formation, Upper Cretaceous".
  - id: brett-surman1989a
    notes: >
      Lists it among the world's formations with hadrosaurian remains as
      "Ripley Fm, Campanian".
  - id: sohl1960a
    notes: >
      Traces the name to Conrad (1858), who "informally proposed" a Ripley
      group for the strata on Owl Creek near Ripley, Tippah County,
      Mississippi; "It remained for Hilgard (1860, p. 83) to more formally
      designate and ascribe limits to the Ripley sequence", and Stephenson and
      Monroe (1937) later split off the Owl Creek. "In northern Mississippi
      the formation can be divided into five units, which are, from oldest to
      youngest, transitional clay, Coon Creek tongue, McNairy sand member,
      sand of the upper part of the Ripley, and the Keownville limestone
      member", and "The base of the Ripley is gradational downward to the
      Demopolis chalk". Places the Campanian-Maastrichtian boundary,
      tentatively, "close to the base of the Ripley".
  - id: puckett2005a
    notes: >
      On planktonic foraminifera, the Globotruncana aegyptiaca Interval Zone
      "occurs in the lower part of the Ripley Formation" in Alabama and
      Mississippi, and the E. pinochii ostracode zone, present in the Ripley,
      ranges "from the middle to upper Campanian Stage". The
      Campanian-Maastrichtian boundary lies somewhere in the overlying
      Gansserina gansseri Zone and "cannot be determined".
