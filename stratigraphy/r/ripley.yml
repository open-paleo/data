name: Ripley
rank: formation
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
references:
  - id: baird1979a
    notes: >
      Dates it by way of the member inside it, "the McNairy Sand Member of the
      Ripley Formation, considered early Maestrichtian in age".
  - id: gilmore1945a
    notes: >
      Places it beneath the Owl Creek Formation in southeastern Missouri, and
      gives the horizon of the Glen Allen vertebrae as "McNairy sand member,
      Ripley formation, Upper Cretaceous".
  - id: brett-surman1989a
    notes: >
      Lists it among the world's formations with hadrosaurian remains as
      "Ripley Fm, Campanian".
