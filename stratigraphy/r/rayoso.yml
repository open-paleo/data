name: Rayoso
rank: formation
period: [Early Cretaceous]
stages: [Aptian, Albian]
references:
  - id: canudo2018a
    notes: >
      Calls it "one of the Lower Cretaceous units that outcrop in the Neuquén
      Basin" and names its four members around Agrio del Medio, "from the
      oldest to youngest these are the Rincón, Quili Malal, Pichi Neuquén, and
      Cañadón de la Zorra members".
  - id: averianov2021b
    notes: >
      Tabulates the Lavocatisaurus occurrence in the formation as
      "Aptian-Albian".
  - id: vanderlinden2025a
    notes: >
      Places Lavocatisaurus agrioensis in "the Aptian to lower Albian part of
      the Rayoso Formation", which it elsewhere calls the "Lower Cretaceous
      Rayoso Formation of Argentina".
