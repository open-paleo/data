name: Rio Piranhas
rank: formation
period: [Early Cretaceous]
stages: [Berriasian, Valanginian, Hauterivian, Barremian]
references:
  - id: carvalho2017a
    notes: >
      Describes Triunfosaurus and gives the span, "The age of the Rio Piranhas
      Formation is considered to range from Berriasian to early Hauterivian",
      with its horizon as "Rio Piranhas Formation, Triunfo Basin. Lower
      Cretaceous (Berriasian-lower Hauterivian)".
  - id: averianov2025b
    notes: >
      Gives the unit two readings: Triunfosaurus is "similarly aged
      (Berriasian-Hauterivian)" to Ninjatitan, "from the Rio Piranhas
      Formation of Brazil", while an isolated fibula comes from "the
      Hauterivian-Barremian Rio Piranhas Formation of Paraiba, Northeast
      Brazil".
