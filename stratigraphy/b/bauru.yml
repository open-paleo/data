name: Bauru
rank: group
period: [Late Cretaceous]
stages: [Turonian, Coniacian, Santonian, Campanian, Maastrichtian]
lithology: sandstone, conglomerate and mudstone
references:
  - id: soares2020a
    notes: >
      Keeps the Caiuá as a separate group, lists the Bauru Group's formations,
      and raises the Serra da Galga and Ponte Alta members of the Marília to the
      Serra da Galga Formation.
  - id: iori2021a
    notes: >
      Dates the group's deposition Coniacian–Maastrichtian after Fernandes and
      Coimbra (2000), keeps the Caiuá a separate group, and calls the ages of
      its formations "not consensual".
  - id: brum2021a
    notes: >
      Divides the group into an Aptian aeolian interval and a
      Santonian–Maastrichtian alluvial and fluvial one, following Soares and
      colleagues (1980) as updated by Pinheiro and colleagues (2018).
  - id: machado2013a
    notes: >
      Dates the group by way of one of its formations, giving "Adamantina
      Formation (Turonian-Santonian ...)".
  - id: cavalcanti2026a
    notes: >
      Gives the contents: "the Bauru Group is divided into the Adamantina,
      Uberaba, Marília, and Serra da Galga formations".
  - id: santucci2022a
    notes: >
      Dates its units, the Adamantina "Campanian-early Maastrichtian" and the
      Marília Maastrichtian, and relates the group's development to "the
      extensive alkaline magmatism in the north/northeast area of the basin".
  - id: arai2023a
    notes: >
      Places the Early Cretaceous in the separate Caiuá Group: "The Caiuá
      Group is here sustained as the Aptian–Albian."
  - id: fernandes2000a
  - id: fernandes1992a
  - id: fernandes1994a
  - id: pinheiro2018a
    notes: >
      Source of the lithology.
  - id: soares1980a
