name: Bauru
rank: group
period: [Early Cretaceous, Late Cretaceous]
stages: [Aptian, Albian, Cenomanian, Turonian, Coniacian, Santonian,
  Campanian, Maastrichtian]
references:
  - id: soares2020a
    notes: >
      Keeps the Caiuá as a group of its own, recording that Fernandes (1992)
      and Fernandes and Coimbra (1994) "further separated the basin succession
      into two groups: the Caiuá Group and the Bauru Group", and gives the
      latter's contents as "the vertically superposed Araçatuba, Uberaba,
      Adamantina, and Marília formations". The age stated here is the basin's
      rather than the group's: "The basin evolved from the Coniacian to the
      Maastrichtian". It also raises the Serra da Galga and Ponte Alta members
      of the Marília Formation to the Serra da Galga Formation, restricted to
      the northeastern margin.
  - id: iori2021a
    notes: >
      Dates the whole group "between the Coniacian and Maastrichtian ages",
      after Fernandes and Coimbra (2000), and keeps the Caiuá outside it: "The
      Bauru Basin is composed by Caiuá and Bauru groups." It adds that "The
      exact age of the formations included within the Bauru Group is not
      consensual", the Marília Formation being the agreed exception, and that
      "The hierarchical organization of the units of the Bauru Group is not
      yet consensual".
  - id: brum2021a
    notes: >
      Divides the group in two by age, the first interval "formed by aeolian
      to fluvial-aeolian sandstones of the Aptian, and the second by alluvial
      and fluvial conglomerates, sandstones and mudstones dating from the
      Santonian to the Maastrichtian". The scheme followed is that of Soares
      and colleagues (1980) as updated by Pinheiro and colleagues (2018), with
      eight formations, so the Aptian aeolian sandstones sit inside the group
      rather than in a separate Caiuá Group. The same paper elsewhere places
      "the Caiuá desert, which is primarily Aptian" outside the group,
      surrounding it, so both circumscriptions appear here side by side.
  - id: machado2013a
    notes: >
      Dates the group by way of one of its formations, giving "Adamantina
      Formation (Turonian-Santonian".
  - id: cavalcanti2026a
    notes: >
      Gives the contents: "the Bauru Group is divided into the Adamantina,
      Uberaba, Marília, and Serra da Galga formations".
  - id: santucci2022a
    notes: >
      Dates its units, the Adamantina "Campanian-early Maastrichtian" and the
      Marília Maastrichtian, and relates the group's development to "the
      extensive alkaline magmatism in the north/northeast area of the basin".
