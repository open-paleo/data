name: Blackleaf
rank: formation
period: [Early Cretaceous, Late Cretaceous]
stages: [Albian, Cenomanian]
references:
  - id: varricchio2007a
    notes: >
      Gives "the mid-Cretaceous Blackleaf Formation of southwest Montana" for
      the Oryctodromeus burrow, the first trace and body fossil evidence of
      burrowing in a dinosaur.
  - id: tykoski2023a
    notes: >
      Cites work on "a vertebrate microsite in the mid-Cretaceous
      (Albian-Cenomanian) Blackleaf Formation, southwest Montana", and groups
      it with the Twin Mountains and Cloverly as older deposits each
      preserving a small-bodied ornithopod.
  - id: bonde2022a
    notes: >
      Dates it Cenomanian, "the Cenomanian Wayan and Blackleaf formations",
      and sets the unit beside the Mussentuchit Member and the Wayan Formation
      as contemporaneous western North American units.
  - id: ullmann2011a
    notes: >
      Writes of "the Albian-Cenomanian Blackleaf Formation" in a study of its
      BL1 microsite, which lies "102 m above the Kootenai-Blackleaf contact,
      a stratigraphic position within the Flood Member within this outcrop
      region". The Lima Peaks outcrops "primarily represent the early
      Cenomanian siliciclastic and volcaniclastic Vaughn Member", with the
      lower Flood Member locally exposed, and the zircon dates it reports
      suggest "the underlying Flood Member is the latest Albian in the Lima
      Peaks area".
