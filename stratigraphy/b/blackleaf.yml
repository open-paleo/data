name: Blackleaf
rank: formation
period: [Early Cretaceous, Late Cretaceous]
stages: [Albian, Cenomanian]
references:
  - id: varricchio2007a
    notes: >
      Gives "the mid-Cretaceous Blackleaf Formation of southwest Montana" for
      the Oryctodromeus burrow, the first trace and body fossil evidence of
      burrowing in a dinosaur.
  - id: tykoski2023a
    notes: >
      Groups the Blackleaf with the Twin Mountains and Cloverly as "Older
      deposits" than the Cenomanian faunas, each preserving a small-bodied
      ornithopod, and gives it no stage; its "Albian-Cenomanian" is the title
      of Ullmann and colleagues' paper in its reference list.
  - id: bonde2022a
    notes: >
      Dates it Cenomanian, "the Cenomanian Wayan and Blackleaf formations",
      and sets the unit beside the Mussentuchit Member and the Wayan Formation
      as contemporaneous western North American units.
  - id: ullmann2011a
    notes: >
      Dates the formation "Albian–Cenomanian" and places the BL1 microsite in
      the Flood Member, which it dates latest Albian, below the early Cenomanian
      Vaughn Member of the Lima Peaks outcrops.
