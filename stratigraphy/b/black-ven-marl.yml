name: Black Ven Marl
rank: member
parent: Charmouth Mudstone
period: [Early Jurassic]
stages: [Sinemurian]
variants: [Black Ven Marls]
references:
  - id: norman2019a
    notes: >
      Gives the Scelidosaurus range as "Charmouth Mudstone Formation (Upper
      Sinemurian), Black Ven Marl Member, Asteroceras obtusum Zone, Obtusum
      Subzone", and records that nearly all well-provenanced specimens come
      "from either the Topstones or Stonebarrow Flatstones Beds (upper
      Sinemurian) in the Black Ven Marls on The Spittles-Black Ven cliff".
  - id: norman2020a
    notes: >
      Repeats the same range and zone for further material.
