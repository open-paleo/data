name: Belly River
rank: group
period: [Late Cretaceous]
stages: [Santonian, Campanian]
references:
  - id: eberth2005a
    notes: >
      Gives the rank, the contents and the span. At Dinosaur Provincial Park
      "the complete Belly River Group (outcrop and subsurface) is
      approximately 280 m thick and consists of the Foremost (170 m), Oldman
      (40 m), and Dinosaur Park (70 m) formations", and "the entire Belly
      River Group ... ranges in age from 80.0 to 74.2 Ma". Records that the
      name began as Dawson's (1883) Belly River "series", which
      "unintentionally included within it the underlying Pakowki marine
      shales".
  - id: lull1942a
    notes: >
      Treats it as the Belly River formation, "equivalent in age to the Judith
      River", and sets it beside the Lance among the formations "of the late
      Cretaceous". Divides it into "the Milk River, Pakowki, Foremost, and
      Pale beds", the Pale beds forming its upper part.
  - id: brown2013a
    notes: >
      Says the group "spans 80-75 Ma in age" and belongs to the Judith River
      clastic wedge of southern Alberta, which represents the western margin
      of the Western Interior Basin "throughout much of the Campanian".
  - id: dawson1883a
    notes: >
      Names the unit and positions it, and gives no stage. It works entirely
      in North American series terms - Laramie, Pierre, Fox Hills, Niobrara,
      Judith River, Fort Union, St. Mary River, Willow Creek - and its
      correlation table puts the "Belly River series", of "Sandstones, shales
      and sandy clays" with fresh and brackish water molluscs, below the
      Pierre and against a queried Niobrara. The rank is series here, and the
      correlation carries the author's own question mark.
  - id: rozhdestvensky1968a
    notes: >
      The most ancient and most plentiful North American hadrosaur remains
      "were found in the Belly River Formation which has been dated to the
      Campanian and Upper Santonian", older than those of "the Maastrichtian
      Edmonton Formation". Uses the name at formation rank and treats the unit
      as corresponding to the Two Medicine Formation.
