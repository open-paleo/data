name: Balabansai
rank: formation
period: [Middle Jurassic, Late Jurassic]
stages: [Bathonian, Callovian, Oxfordian]
references:
  - id: rauhut2024a
    notes: >
      Gives the span and how it is arrived at: the formation "is currently
      dated by palynomorphs and vertebrate assemblages as late Middle Jurassic
      (Bathonian-Callovian".
  - id: averianov2005a
    notes: >
      Uses the Russian rank word and the narrower age, "Balabansai Svita
      (Callovian". The svita-or-formation duality is the same as for the
      Bostobe and the Baynshiree.
  - id: nessov1995a
    notes: >
      Red sandstone and grey clays "at the base of the Balabansai Formation"
      are "Middle Jurassic, upper Bathonian", and the "Upper part of the
      Balabansai Formation (interval 6-9 m from its top)" at Dzhiddasai I is
      "Middle -?Upper Jurassic, Callovian - ?Oxfordian".
