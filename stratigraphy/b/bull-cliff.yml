name: Bull Cliff
rank: member
parent: Blue Lias
period: [Late Triassic, Early Jurassic]
stages: [Rhaetian, Hettangian]
lithology: tabular limestone with subordinate mudstone
references:
  - id: martill2016a
    notes: >
      Places the *Dracoraptor* horizon "within the lower Bull Cliff Member" and
      argues that it is Early Hettangian, not Late Rhaetian as these beds were
      traditionally dated.
  - id: simms2004d
    notes: >
      At Lavernock, takes the top of the member "at the base of the lowest
      nodular limestone, termed the 'Dual Bed'", and records that "The first
      Psiloceras planorbis, marking the base of the Jurassic System, was
      recorded about 1.4 m above the Dual Bed" (p. 115), so the member lies in
      the beds the book calls the uppermost Triassic. Source of the lithology.

