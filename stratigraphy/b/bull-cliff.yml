name: Bull Cliff
rank: member
parent: Blue Lias
period: [Late Triassic, Early Jurassic]
stages: [Rhaetian, Hettangian]
references:
  - id: martill2016a
    notes: >
      Constrains the Dracoraptor horizon "on lithological grounds to one of
      two limestone horizons within the Blue Lias Formation of the Lower Lias
      Group ... and specifically within the lower Bull Cliff Member
      (stratigraphic terminology follows that of Simms)" in the Bristol
      Channel Basin. Records that aragonitic bivalves are absent from the
      member, whose assemblage "is thus a chemical lag dominated by calcitic
      fossils". Dates that horizon, which lies below the first Psiloceras
      planorbis and above the last Triassic conodont, against the traditional
      reading: "these strata have traditionally been regarded as Late Rhaetian
      age and are informally called the Pre-Planorbis Beds", but on isotopic,
      lithological, faunal and pollen evidence "the new dinosaur should be
      regarded as being of Early Hettangian age".
  - id: simms2004a
    notes: >
      At Lavernock, takes the top of the member "at the base of the lowest
      nodular limestone, termed the 'Dual Bed'", and records that "The first
      Psiloceras planorbis, marking the base of the Jurassic System, was
      recorded about 1.4 m above the Dual Bed" (p. 115), so
      the member lies in the beds the book calls the uppermost Triassic.

