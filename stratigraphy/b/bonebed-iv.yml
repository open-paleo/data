name: Bonebed IV
rank: bed
informal: true
parent: Kitadani
period: [Early Cretaceous]
references:
  - id: shibata2015b
    notes: >
      Gives the Koshisaurus horizon as the fourth bone bed of the quarry,
      which it abbreviates BB IV: "This lenticular horizon has a limited
      exposure of approximately four square-meters in the quarry", the
      elements all from one size class and none duplicated. Writes the lowest
      bonebed in full as "Bonebed I (BB I)".
