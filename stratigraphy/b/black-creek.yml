name: Black Creek
rank: formation
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
references:
  - id: baird1979a
    notes: >
      The dedicated treatment of the North Carolina dinosaurs, giving "Late
      Cretaceous dinosaurs from the Black Creek Formation (Campanian) of
      Sampson and Bladen counties". It quotes Brett and Wheeler (1961) that
      upstream and updip from Elizabethtown the formation "was, without doubt,
      deposited during Taylor time represented by the Exogyra ponderosa zone
      (or older near the base)", and concludes that the dinosaurs "are
      Tayloran, i.e. Campanian, late Cretaceous, in age".
  - id: molnar1990b
    notes: >
      Independently gives "the Campanian Black Creek Formation of Bladen and
      Sampson counties, North Carolina".
  - id: brett-surman1989a
    notes: >
      Lists "Black Creek Fm, Campanian-Maastrichtian" among the formations
      with hadrosaurian remains.
  - id: brett1961a
