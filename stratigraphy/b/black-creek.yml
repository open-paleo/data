name: Black Creek
rank: formation
period: [Late Cretaceous]
stages: [Campanian]
lithology: poorly indurated clayey silt, silty clay, dark clay and coarse sand
references:
  - id: baird1979a
    notes: >
      Describes the formation's dinosaurs from Sampson and Bladen counties and,
      after Brett and Wheeler (1961), dates them "Tayloran, i.e. Campanian".
      Source of the lithology.
  - id: molnar1990b
    notes: >
      Independently gives "the Campanian Black Creek Formation of Bladen and
      Sampson counties, North Carolina".
  - id: brett-surman1989a
    notes: >
      A doctoral thesis. Lists "Black Creek Fm, Campanian-Maastrichtian" among
      the formations with hadrosaurian remains; no published work read places
      any part of the formation in the Maastrichtian.
  - id: brett1961a
  - id: gallagher1993a
    notes: >
      Names Exogyra ponderosa a zone fossil for the Black Creek Formation of
      North Carolina among units that "are late Campanian in age".
  - id: stephenson1914a
    notes: >
      Places the formation's marine beds in the Exogyra ponderosa zone and the
      Exogyra costata zone in the overlying Peedee sand; it names no stage.
