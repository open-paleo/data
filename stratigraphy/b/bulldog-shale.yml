name: Bulldog Shale
rank: formation
parent: Marree
period: [Early Cretaceous]
stages: [Aptian, Albian]
lithology: dark gray mudstone with minor siltstone and very fine-grained
  sandstone
references:
  - id: barrett2010b
    notes: >
      Places the Coober Pedy and Andamooka opal beds "within the Bulldog Shale",
      not the Cadna-owie or Marree Formation that earlier lists offered, and
      dates them "Aptian: Lower Cretaceous".
  - id: poropat2014a
    notes: >
      Gives the fuller span, "the lower Aptian to lower Albian Bulldog Shale
      of South Australia", deposited in cool marine conditions on the
      evidence of glendonites and lonestones.
  - id: alexander2007a
    notes: >
      Gives Freytag's (1966) definition, the shale between the Cadna-owie
      Formation and the Coorikiana Sandstone, and dates it "Early Aptian – mid
      Albian" on palynozones. Source of the lithology.
  - id: burger1980a
    notes: >
      Dates palynological zones whose reference sections lie in the formation:
      "most of the Aptian" for one, early Albian and "(middle?) Albian" for
      those above.
  - id: freytag1966a
