name: Bulldog Shale
rank: formation
parent: Marree
period: [Early Cretaceous]
stages: [Aptian, Albian]
references:
  - id: barrett2010b
    notes: >
      Settles which unit the Coober Pedy and Andamooka opal beds belong to:
      lithostratigraphic work "has now firmly placed the Coober Pedy and
      Andamooka opaliferous beds within the Bulldog Shale (a constituent of
      the Marree Subgroup, which was formerly called the Marree Formation)",
      against earlier readings that offered the Cadna-owie or Marree
      Formations as alternatives. Dates it "Aptian: Lower Cretaceous".
  - id: poropat2014a
    notes: >
      Gives the fuller span, "the lower Aptian to lower Albian Bulldog Shale
      of South Australia", deposited in cool marine conditions on the
      evidence of glendonites and lonestones.
  - id: alexander2007a
    notes: >
      Defined by Freytag (1966), with a type section in "outcrop 8 km south of
      Bulldog Creek", conformable on the Cadna-owie Formation and beneath the
      Coorikiana Sandstone; the Wallumbilla Formation is its lateral equivalent,
      the name used depending on whether the Toolebuc Formation is present.
      Dates it "Early Aptian – mid Albian" on spore-pollen and dinoflagellate
      zones. The printed zone codes, "PK2.1–PK3.1", do not match the chapter's
      own chart.
  - id: burger1980a
    notes: >
      Gives the formation no age of its own but dates the palynological zones
      whose reference sections lie in it, in Santos Oodnadatta No. 1: the
      Cyclosporites hughesii Subzone, whose middle and upper parts equal a zone
      "considered to represent most of the Aptian"; the Crybelosporites striatus
      Zone, which "lies within the Bulldog Shale", with "an early Albian age";
      the Coptospora paradoxa Zone, "(middle?) Albian", in its upper part and the
      basal Oodnadatta Formation; and the Odontochitina operculata dinoflagellate
      Zone, which also lies within it and "is regarded as of Barremian to Aptian
      age". The zone ages rest on evidence from the Surat and Eromanga basins.
  - id: freytag1966a
