name: Baruungoyot
rank: formation
period: [Late Cretaceous]
stages: [Santonian, Campanian, Maastrichtian]
variants: [Barun Goyot, Barungoyot, Lower Nemegt Beds, Barungoyotskaya]
dispute:
  summary: >
    The older limit is contested and both readings are current. Gradzinski and
    colleagues (1977) confine the formation to the "?middle Campanian", and
    Kielan-Jaworowska (1974) and Averianov and Lopatin (2022) likewise give it
    as Campanian. Shuvalov (2000) instead dates it Santonian-Campanian from
    basalts within the svita, Karczewska and Ziembinska-Tworzydlo (1983) reach a
    "?Late Santonian" from charophytes, and the Santonian is still applied to
    the formation by Alifanov and Barsbold (2009) and by Chinzorig and
    colleagues (2017). Van Itterbeeck and colleagues (2005) treat the question
    as closed against the Santonian, but the source they rely on does not
    support them.
references:
  - id: gradziński1977a
    notes: >
      Assigns the Gobi formations as "best guesses": the Djadokhta "?upper
      Santonian and/or ?lower Campanian", this formation "?middle Campanian",
      and the Nemegt "?upper Campanian and ?lower Maastrichtian". This is the
      assignment Karczewska and Ziembinska-Tworzydlo (1983) relay when they
      date the unit.
  - id: khand2000a
    notes: >
      Leaf prints of Ginkgo, Platanus, Trochodendroides, Nelumbo and Quereuxia
      come from "The Santonian-Campanian deposits of the Baruungoyot Formation
      in the Altan uul-4", while Table 2 sets the formation against the
      Campanian alone and the mollusc scheme of Martinson (1982) makes the
      Baruungoyotian Campanian. Shuvalov and Stankevich (1977) had applied the
      name to the eastern Gobi red beds this paper calls the Javkhlant
      Formation. It closes by conceding that "The position of some
      stratigraphic divisions, for example, Bayanshiree, Baruungoyot and
      others, more lower divisions remain to be quite unclear."
  - id: gradziński1974a
    notes: >
      Redefines the unit and dates it: the formation, "previously termed Lower
      Nemegt Beds", is "composed of clastic continental sediments of red-beds
      type; it is probably of Campanian age", exceeds 110 m, and is overlain
      gradationally by the Nemegt Formation, "probably of Maastrichtian age".
      It records that Martinson and colleagues (1969) had introduced
      "Barungoyotskaya svita" for the same beds.
  - id: averianov2022a
    notes: >
      Gives the unit as Campanian, placing the Ondogurvel holotype at Nemegt
      in the "Barungoyot Formation, Upper Cretaceous (Campanian)".
  - id: pittman2020a
    notes: >
      Pairs the "Campanian Djadokhta Formation (and the similar Wulansuhai
      (Bayan Mandahu) Formation in China)" with the "Campanian-Maastrichtian
      Barun Goyot".
  - id: vanitterbeeck2005b
    notes: >
      Records that Karczewska and Ziembinska-Tworzydlo (1983) "proposed a
      Santonian age for the Barun Goyot Formation; however, radiometric
      calibrations ... have provided a Campanian age for this formation", and
      on that basis rejects their age for the overlying Nemegt Formation. The
      calibrations are credited to Shuvalov (2000), who dates the svita
      Santonian-Campanian rather than Campanian, so this rejection does not
      carry the weight it is given here. Elsewhere the paper reads the unit as
      an equivalent of the North American Judithian and so "mid- and Late
      Campanian", and it notes that the Campanian is "supported by the
      radiometric ages of the volcanic layers within the Barun Goyot
      Formation".
  - id: shuvalov2000a
    notes: >
      Heads the section "Baruungoyot Svita (Santonian-Campanian)" and
      concludes in its own voice, "Hence, we date the Baruungoyot Svita as
      Santonian-Campanian". Reports basalt dates of 75 plus or minus 7 Ma from
      the upper part of the svita at Chuluut Uul in the South Gobi and 80 Ma
      from North Mongolia, and records that most researchers give a Senonian
      and most likely Campanian age while Kielan-Jaworowska lowered the
      Djadokhta to Coniacian-Santonian on mammal remains. The svita as used
      here unites the Djadokhta Formation with other red-bed units, so it is
      broader than the formation of the Polish-Mongolian usage.
  - id: alifanov2009a
    notes: >
      Gives the Ceratonykus oculatus holotype horizon at Khermiin Tsav in the
      Nemegt Depression as "Upper Cretaceous, ?Lower Santonian, Baruungoyot
      Formation".
  - id: chinzorig2017a
    notes: >
      Sets the formation above the Djadokhta and gives it as
      "Santonian-Campanian", the Djadokhta in turn unconformably overlying the
      "Bayanshiree Formation (Cenomanian-Turonian)".
  - id: fanti2012a
    notes: >
      Collects the Nemegtomaia barsboldi nesting specimen "from the upper beds
      of the Baruungoyot Formation (Campanian-Maastrichtian)" along the
      Northern Sayr, and describes the Nemegt Basin exposures as "the upper
      Campanian - lower Maastrichtian Baruungoyot and Nemegt formations". The
      mechanism it gives for the young end is the "Baruungoyot-Nemegt
      interfingering interval", which matches the gradational contact
      Gradzinski and Jerzykiewicz (1974) describe.
  - id: fowler2020b
    notes: >
      Gives Parvicursor and Ceratonykus as from the "Barun Goyot Formation
      (lower Maastrichtian)", beside the "Nemegt Formation (~upper Campanian
      to ~lower Maastrichtian)".
  - id: karczewska1983a
    notes: >
      "The Barun Goyot Formation (and its stratigraphic equivalent red beds of
      Khermeen Tsav) is probably of ?Late Santonian age", which agrees with
      what Kielan-Jaworowska (1974) read from the development of the
      multituberculates. Charophytes put the overlying Nemegt Formation no
      younger than the Lower Campanian, so that among the Upper Cretaceous
      continental deposits of the Gobi Desert the "underlying Barun Goyot
      Formation and Djadokhta Formations must be older than the Lower
      Campanian".
  - id: kielan-jaworowska1974a
    notes: >
      Dates the unit Campanian in its own voice, without attribution: "In the
      younger Asiatic Barun Goyot Formation, which is of Campanian age, the
      multituberculate fauna so far described consists of" three genera, and
      the paper adds that "The post-Campanian multituberculate records are
      very scanty in Asia". It names no Santonian for this formation; its one
      Santonian is an alternative for the Djadokhta that the paper declines.
