name: Baruungoyot
rank: formation
period: [Late Cretaceous]
stages: [Santonian, Campanian, Maastrichtian]
variants: [Barun Goyot, Barungoyot, Lower Nemegt Beds, Barungoyotskaya]
lithology: poorly cemented sandstone, with subordinate siltstone and claystone
dispute:
  summary: >
    The older limit is contested and both readings are current. Gradzinski and
    colleagues (1977) confine the formation to the "?middle Campanian", and
    Kielan-Jaworowska (1974) and Averianov and Lopatin (2022) likewise give it
    as Campanian. Shuvalov (2000) instead dates it Santonian-Campanian,
    because molluscs, ostracods and turtles "do not allow an age greater than
    Santonian" and K–Ar dates from basalts in the middle and upper svita are
    78–80 Myr (Campanian); Karczewska and Ziembinska-Tworzydlo (1983) reach a
    "?Late Santonian" from charophytes, and the Santonian is still applied to
    the formation by Alifanov and Barsbold (2009) and by Chinzorig and
    colleagues (2017). Van Itterbeeck and colleagues (2005) treat the question
    as closed against the Santonian, but the source they rely on does not
    support them.
references:
  - id: gradziński1977a
    notes: >
      Assigns the Gobi formations as "best guesses": the Djadokhta "?upper
      Santonian and/or ?lower Campanian", this formation "?middle Campanian",
      and the Nemegt "?upper Campanian and ?lower Maastrichtian". This is the
      assignment Karczewska and Ziembinska-Tworzydlo (1983) relay when they
      date the unit.
  - id: khand2000a
    notes: >
      Reviews the Cretaceous of Mongolia, calling the formation
      Santonian–Campanian in its text but setting it against the Campanian alone
      in its table of fossil assemblages and its mollusc scheme.
  - id: gradziński1974a
    notes: >
      Redefines the formation, "previously termed Lower Nemegt Beds", as
      "probably of Campanian age" and over 110 m thick, passing gradually into
      the Nemegt Formation above. Source of the lithology.
  - id: averianov2022a
    notes: >
      Gives the unit as Campanian, placing the Ondogurvel holotype at Nemegt
      in the "Barungoyot Formation, Upper Cretaceous (Campanian)".
  - id: pittman2020c
    notes: >
      Pairs the "Campanian Djadokhta Formation (and the similar Wulansuhai
      (Bayan Mandahu) Formation in China)" with the "Campanian-Maastrichtian
      Barun Goyot".
  - id: vanitterbeeck2005b
    notes: >
      Treats the formation as Campanian, "mid- and Late Campanian" as an
      equivalent of the North American Judithian, and rejects a Santonian age
      for it on radiometric grounds.
  - id: shuvalov2000a
    notes: >
      Dates the Baruungoyot Svita "Santonian–Campanian" in its own voice, from
      its molluscs, ostracods and turtles and from K–Ar dates on basalts within
      it.
  - id: alifanov2009a
    notes: >
      Gives the Ceratonykus oculatus holotype horizon at Khermiin Tsav in the
      Nemegt Depression as "Upper Cretaceous, ?Lower Santonian, Baruungoyot
      Formation".
  - id: chinzorig2017a
    notes: >
      Sets the formation above the Djadokhta and gives it as
      "Santonian-Campanian", the Djadokhta in turn unconformably overlying the
      "Bayanshiree Formation (Cenomanian-Turonian)".
  - id: fanti2012a
    notes: >
      Collects the Nemegtomaia barsboldi nest "from the upper beds of the
      Baruungoyot Formation (Campanian-Maastrichtian)" along the Northern Sayr
      at Nemegt.
  - id: fowler2020b
    notes: >
      Gives Parvicursor and Ceratonykus as from the "Barun Goyot Formation
      (lower Maastrichtian)", beside the "Nemegt Formation (~upper Campanian
      to ~lower Maastrichtian)".
  - id: karczewska1983a
    notes: >
      Dates the formation "probably of ?Late Santonian age" from charophytes,
      which put the overlying Nemegt Formation no younger than the Lower
      Campanian.
  - id: kielan-jaworowska1974a
    notes: >
      Gives the formation as Campanian in its own voice: "the younger Asiatic
      Barun Goyot Formation, which is of Campanian age".
  - id: martinson1982a
  - id: shuvalov1977a
  - id: martinson1969a
