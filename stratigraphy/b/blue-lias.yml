name: Blue Lias
rank: formation
parent: Lias
period: [Late Triassic, Early Jurassic]
stages: [Rhaetian, Hettangian, Sinemurian]
references:
  - id: cox1999a
    notes: >
      Defines the formation in the Lias Group, with the chronostratigraphy
      "Uppermost Triassic (Rhaetian) to Lower Jurassic, Sinemurian; upper
      boundary markedly diachronous".
  - id: simms2004a
    notes: >
      The formation "encompasses the highest part of the Triassic Rhaetian
      Stage, the Hettangian Stage and the lowest part of the Sinemurian
      Stage" (p. 55), its base in the Pre-Planorbis Beds, placed below the
      first Psiloceras.
  - id: hillebrandt2013a
    notes: >
      Defining the base of the Jurassic, expects that "The boundary should be
      expected to occur in the lowest few meters of the Blue Lias Formation".
  - id: baron2024a
    notes: >
      Gives "Blue Lias Formation, Lower Lias Group, Charmouth, UK" at
      "Hettangian-Sinemurian, Early Jurassic".
  - id: martill2016a
    notes: >
      Places a specimen "close to the base of the Blue Lias Formation (Lower
      Jurassic, Hettangian)", making it "the oldest known Jurassic dinosaur",
      and notes that a lithological change at its base "historically was used
      by some workers as a lithological definition of the base of the
      Jurassic".
  - id: ezcurra2020a
    notes: >
      Resolves material within it by ammonite zone, to "the upper part of the
      Rugby Limestone Member (liasicus up to semicosatum zones)" and to "the
      angulata zone".
