name: Bungil
rank: formation
period: [Early Cretaceous]
stages: [Valanginian, Hauterivian, Barremian, Aptian]
references:
  - id: molnar1980b
    notes: >
      Gives the Minmi horizon as "Minmi Member of the Bungil Formation" near
      Roma, southeast Queensland, at "Lower Cretaceous, probably Aptian",
      the material preserved in calcareous concretions and articulated when
      found.
  - id: leahey2015a
    notes: >
      Tabulates the Minmi holotype as "Minmi Member, Bungil Formation
      (Valanginian-Barremian)".
  - id: agnolín2010a
    notes: >
      Gives both readings in one paper, listing the Roma locality as "Bungil
      Formation, Aptian" in its locality map and the horizon as "Bungil
      Formation (Barremian-Valanginian: Early Cretaceous ...)" in the
      systematic section, the latter after Scheibner and Basden (1998), a
      range that carries the formation through the Hauterivian.
  - id: scheibner1998a
  - id: exon1976a
    notes: >
      Defines the formation as including "the Kingull, Nullawurt Sandstone,
      and Minmi Members of Day (1964)", the Minmi uppermost and of early
      Aptian age, and concludes that "The age of the formation is thus, on
      fossil evidence, Neocomian to early Aptian". The Neocomian spans the
      Berriasian to Hauterivian on GTS2020. The Berriasian is not carried:
      the formation "rests conformably on the Mooga Sandstone and Southlands
      Formation", and no source here places it that low.
  - id: burger1980a
    notes: >
      Dates the uppermost member: "The Minmi Member, dated as lower Aptian,
      is restricted to the Surat Basin."
