name: Bungil
rank: formation
period: [Early Cretaceous]
stages: [Valanginian, Hauterivian, Barremian, Aptian]
lithology: fine-grained lithic sandstone, siltstone and mudstone, with
  subordinate quartzose sandstone
references:
  - id: molnar1980b
    notes: >
      Gives the Minmi horizon as "Minmi Member of the Bungil Formation" near
      Roma, southeast Queensland, at "Lower Cretaceous, probably Aptian",
      the material preserved in calcareous concretions and articulated when
      found.
  - id: leahey2015a
    notes: >
      Gives the Minmi holotype as "Minmi Member, Bungil Formation
      (Valanginian–Barremian)" in its Figure 1 caption.
  - id: agnolín2010a
    notes: >
      Gives both readings in one paper, listing the Roma locality as "Bungil
      Formation, Aptian" in its locality map and the horizon as "Bungil
      Formation (Barremian-Valanginian: Early Cretaceous ...)" in the
      systematic section, the latter after Scheibner and Basden (1998), a
      range that carries the formation through the Hauterivian.
  - id: scheibner1998a
    notes: >
      Its table gives the formation "Hauterivian-Aptian", while its
      correlation chart, adapted from earlier work, draws the base within the
      Valanginian.
  - id: exon1976a
    notes: >
      Describes the formation, with its Kingull, Claravale Sandstone, Nullawurt
      Sandstone and Minmi members, and dates it "Neocomian to early Aptian" on
      fossil evidence. Source of the lithology.
  - id: burger1980a
    notes: >
      Dates the uppermost member: "The Minmi Member, dated as lower Aptian,
      is restricted to the Surat Basin."
  - id: day1964a
    notes: >
      Cited by Exon (1976) as the source of the Kingull, Nullawurt Sandstone
      and Minmi members the Bungil Formation includes.
  - id: mollan1972a
    notes: >
      Cited by Exon (1976) as the source of the Claravale Sandstone Member,
      which the Bungil Formation includes.
  - id: gale2020a
