name: Bayn Dzak
rank: member
parent: Djadokhta
period: [Late Cretaceous]
stages: [Cenomanian, Turonian, Coniacian, Santonian, Campanian, Maastrichtian]
references:
  - id: khand2000a
    notes: >
      Barsbold (1972) used the name at formation rank for the whole of the
      Djadokhta, which this paper lists among its synonyms as the "Bayan Dzak
      Formation by Barsbold".
  - id: dashzeveg2005a
    notes: >
      Erects it as one of two: "The considerably enlarged formation comprises
      a lower Bayn Dzak Member, dominated by moderate reddish orange sands
      with subordinate mudstone units, and an upper Tugrugyin Member". Reviews
      the earlier ages for its fauna, which "has been reported to range from
      Cenomanian to Early Maastrichtian", from the "early Late Cretaceous" of
      Berkey and Morris (1927) and "a range between the Coniacian and the
      Santonian" from Polish authors to the Campanian of most later workers.
      Its own magnetostratigraphy through the member "suggests, but does not
      clearly establish, that the sediments were deposited during the rapid
      sequence of polarity changes in the late part of the Campanian
      incorporating the end of Chron 33 and Chron 32 between about 75 and 71
      Ma".
  - id: dingus2008a
    notes: >
      Uses it as a comparison rather than an assignment for Ukhaa Tolgod:
      "The strata at Ukhaa Tolgod are referred to the Djadokhta Formation. As
      seen in the Bayn Dzak Member at Bayn Dzak, facies E-1, E-2, S, and M
      dominate the lower part of the section at Ukhaa Tolgod". It does not
      place Ukhaa Tolgod in this member.
  - id: berkey1927a
