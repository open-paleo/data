name: Bayn Dzak
rank: member
parent: Djadokhta
period: [Late Cretaceous]
stages: [Campanian]
lithology: reddish-orange sandstone with subordinate mudstone
references:
  - id: khand2000a
    notes: >
      Barsbold (1972) used the name at formation rank for the whole of the
      Djadokhta, which this paper lists among its synonyms as the "Bayan Dzak
      Formation by Barsbold".
  - id: dashzeveg2005a
    notes: >
      Erects the member as the lower of two in the Djadokhta, "dominated by
      moderate reddish orange sands", and places it by magnetostratigraphy in
      the late Campanian, about 75 to 71 Ma. Source of the lithology.
  - id: dingus2008a
    notes: >
      Refers the strata at Ukhaa Tolgod, in the Nemegt Basin, to the member, on
      facies that match those of the member at Bayn Dzak.
  - id: berkey1927a
  - id: barsbold1972a
  - id: gale2020a
    notes: >
      Projects the base of the Maastrichtian "to about 88% in subchron
      C32n.2n", at 72.2 Ma.
