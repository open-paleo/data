name: Brushy Basin
rank: member
parent: Morrison
period: [Late Jurassic]
stages: [Kimmeridgian, Tithonian]
lithology: mudstone
references:
  - id: carrano2012a
    notes: >
      Allosaurus occurs in the "Salt Wash and Brushy Basin Members, Morrison
      Formation; Kimmeridgian–Tithonian, Late Jurassic", a span given for the
      two members together. Ceratosaurus comes from the "lower Brushy Basin
      Member, Morrison Formation; Kimmeridgian–Tithonian, Late Jurassic", and
      Marshosaurus from the "Brushy Basin Member, Morrison Formation;
      Kimmeridgian, Late Jurassic".
  - id: chure2000a
    notes: >
      Uses "Brushy Basin Member, Morrison Formation" with "AGE: Kimmeridgian,
      Late Jurassic" for the material it describes.
  - id: kowallis1998a
    notes: >
      Dates the member by 40Ar/39Ar on sanidine from ash beds, from 150.3 ± 0.3
      Ma near the base to 148.1 ± 0.5 Ma at the top, and reads it as
      Kimmeridgian–Tithonian. Source of the lithology.
  - id: kirkland2016a
    notes: >
      Relays a recalibrated 40Ar/39Ar age of 150.00 ± 0.52 Ma from near the top
      of the member, and places the Jurassic–Cretaceous boundary "just above the
      highest smectitic mudstone beds" of the member.
  - id: trujillo2015a
