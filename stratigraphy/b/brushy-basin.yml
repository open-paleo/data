name: Brushy Basin
rank: member
parent: Morrison
period: [Late Jurassic]
stages: [Kimmeridgian, Tithonian]
references:
  - id: carrano2012a
    notes: >
      Allosaurus occurs in the "Salt Wash and Brushy Basin Members, Morrison
      Formation; Kimmeridgian–Tithonian, Late Jurassic", a span given for the
      two members together. Ceratosaurus comes from the "lower Brushy Basin
      Member, Morrison Formation; Kimmeridgian–Tithonian, Late Jurassic", and
      Marshosaurus from the "Brushy Basin Member, Morrison Formation;
      Kimmeridgian, Late Jurassic".
  - id: chure2000a
    notes: >
      Uses "Brushy Basin Member, Morrison Formation" with "AGE: Kimmeridgian,
      Late Jurassic" for the material it describes.
  - id: kowallis1998a
    notes: >
      Dates the member by 40Ar/39Ar on sanidine from ash beds. The ages "range
      systematically between 148.1 ± 0.5 (1 std. error of mean) at the top of
      the member to 150.3 ± 0.3 Ma near the bottom", Kimmeridgian at the base and
      Tithonian at the top on the ICS chart v2024/12 (Tithonian base 149.2 Ma).
      The paper reads the member as Kimmeridgian–Tithonian on the timescales of
      its day, and calls one Montezuma Creek age, 147.82 ± 0.63 Ma, about 1 Ma
      too young.
  - id: kirkland2016a
    notes: >
      Relays "150.00 ± 0.52 Ma from near the top of the Brushy Basin Member, near
      little Cedar Mesa, Emery County, Utah, based on a recalibrated 40Ar/39Ar
      age (Trujillo and Kowallis, 2015)", Kimmeridgian on the ICS chart v2024/12,
      and concludes that "the top of the Morrison Formation dates to the lower
      third of the Tithonian Stage". Places the Jurassic–Cretaceous boundary
      "just above the highest smectitic mudstone beds of the Brushy Basin
      Member".
  - id: trujillo2015a
