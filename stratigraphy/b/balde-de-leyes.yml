name: Balde de Leyes
rank: formation
parent: Marayes
period: [Early Jurassic]
references:
  - id: colombi2015a
    notes: >
      Erects the unit: "The new stratigraphic unit is defined as the Balde de
      Leyes Formation, a name assigned due to its proximity to this locality",
      separating it from the Quebrada del Barro Formation below, so that "the
      age of the Quebrada del Barro Formation was defined as Late Triassic and
      that of the new unit as Early Jurassic, based on the precise
      stratigraphic position of the vertebrates found". The series comes from
      correlation: the formation "is assigned to the Early Jurassic by its
      correlation with the Cañón del Colorado Formation of the Mogna
      depocentre and the Upper Elliot Formation of the Karoo basin, South
      Africa". No stage is given.
  - id: martínez2017a
    notes: >
      Places it at the top of the Marayes Group in the Marayes-El Carrizal
      Basin of northwestern Argentina, above the Quebrada del Barro Formation,
      and gives only the series, Lower Jurassic.
  - id: apaldetti2011a
    notes: >
      Describes the Leyesaurus type from the Quebrada del Barro Formation,
      the unit this one was later separated from, and argues on the
      affinities of that taxon with Massospondylus for "a younger age for the
      Quebrada del Barro Formation than previously postulated".
