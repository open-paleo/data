name: Belle Fourche
rank: member
parent: Frontier
period: [Late Cretaceous]
stages: [Cenomanian, Turonian]
dispute:
  summary: >
    Member in the United States, formation in Canada. Carpenter and Kirkland
    (1998) give "Belle Fourche Member (Middle Cenomanian ...), Frontier
    Formation" and record the reassignment that produced it: "Merewether et
    al. (1983) and Merewether (1983) revised the Frontier Formation in
    Wyoming, and reidentified Dunbar's Frontier Formation as the Belle Fourche
    Member of the Frontier Formation". Their reference list has no Merewether
    and colleagues 1983; it gives Merewether (1983) and Merewether and
    colleagues under 1978, the paper printed in 1979. Pittman and colleagues
    (2020) tabulate a "Belle Fourche Formation" in Canada at the same
    Cenomanian age.
references:
  - id: carpenter1998c
    notes: >
      Gives the rank, parent and history of the name, and places Nodosaurus
      textilis in the "Middle Cenomanian" part of the member and Stegopelta
      landerensis at its base.
  - id: pittman2020c
    notes: >
      Uses formation rank for the Canadian occurrence.
  - id: merewether1979a
    notes: >
      Divides the Frontier of eastern Wyoming into three members, the oldest
      "the Belle Fourche Member of Cenomanian age", which grades eastward into
      the Belle Fourche Shale.
  - id: merewether1983a
  - id: singer2020a
    notes: >
      Dates the underlying Mowry Shale by argon-argon at 98.17 to 97.52 Ma and
      places the Albian–Cenomanian boundary below it.
  - id: cobban1990a
    notes: >
      The Frontier in Natrona County "conformably overlies the Mowry Shale",
      its oldest member being "the Belle Fourche Member of early to late
      Cenomanian age", and "Seven of the twelve established ammonite zones of
      middle and late Cenomanian age in the Western Interior can be
      recognized in the Belle Fourche Member."
  - id: merewether1996a
    notes: >
      Dates the middle and upper parts of the member in the Powder River Basin
      as middle Cenomanian to early Turonian, with a top that "probably reflects
      differential erosion".
  - id: merewether2010a
    notes: >
      Its ammonite zones put the member's top at "Zones 21 or 22 of the late
      late Cenomanian near Buffalo to Zones 16 or 17 of the early late
      Cenomanian" near Casper, the surface truncated by erosion during uplift
      in the early Turonian.
