name: Belle Fourche
rank: member
parent: Frontier
period: [Late Cretaceous]
stages: [Cenomanian, Turonian]
dispute:
  summary: >
    Member in the United States, formation in Canada. Carpenter (1998) gives
    "Belle Fourche Member (Middle Cenomanian ...), Frontier Formation" and
    records the reassignment that produced it: Merewether and colleagues
    (1979) "revised the Frontier Formation in Wyoming, and reidentified
    Dunbar's Frontier Formation as the Belle Fourche Member of the Frontier
    Formation". Pittman and colleagues (2020) tabulate a "Belle Fourche
    Formation" in Canada at the same Cenomanian age.
references:
  - id: carpenter1998c
    notes: >
      Gives the rank, parent and age, and the history of the reassignment. The
      age differs by level: the Nodosaurus textilis horizon is "Belle Fourche
      Member (Middle Cenomanian ...), Frontier Formation", after Merewether
      and colleagues (1979) and Merewether (1983), and the Stegopelta
      landerensis horizon is the "Base of Belle Fourche Member (latest Albian
      or earliest Cenomanian ...)", after Merewether (1983). The Albian
      reflects the former placement of the Albian–Cenomanian boundary at the
      top of the Mowry Shale, on which the member rests; Singer and
      colleagues (2020) place that boundary below the Mowry.
  - id: pittman2020a
    notes: >
      Uses formation rank for the Canadian occurrence.
  - id: merewether1979a
    notes: >
      The specialist treatment of the parent formation, which states the age
      plainly: "The Frontier Formation in eastern Wyoming
      is divided into as many as three members, which are, from older to
      younger, the Belle Fourche Member of Cenomanian age, the unnamed member
      of early and middle Turonian age, and the Wall Creek Member of late
      Turonian and early Coniacian age." It names no Albian anywhere.
      It also separates two units that share the name: in the Powder River
      Basin "the shale, siltstone, and sandstone of the Belle Fourche Member
      grade eastward into shale of the Belle Fourche Shale and calcareous
      shale of the lower part of the Greenhorn Formation". A third, the Belle
      Fourche Formation of Canada, is the unit Pittman and colleagues (2020)
      report.
  - id: merewether1983a
  - id: singer2020a
    notes: >
      Dates the Mowry Shale beneath the member by argon-argon: the "Clay Spur
      Bentonite, Mowry Shale, Casper, Wyoming, 98.17 ± 0.11 Ma" and the
      "Topmost Bentonite, Mowry Shale, Kaycee, Wyoming, USA, 97.52 ± 0.09 Ma",
      the Mowry passing up into "the overlying dark, non-siliceous sediment of
      the Belle Fourche Shale Member of the Frontier Formation". The Clay Spur
      had been used "as demarcating the Albian–Cenomanian boundary", but
      "Only recently ... has the placement of the Albian–Cenomanian boundary
      below the Mowry Shale/Fish Scales Formation been widely accepted", and
      the lower Cenomanian Newcastle Sandstone and the Shell Creek Shale
      "likely record the Albian–Cenomanian boundary". The whole Mowry is
      therefore Cenomanian, and the member above it is too.
  - id: cobban1990a
    notes: >
      The Frontier in Natrona County "conformably overlies the Mowry Shale",
      its oldest member being "the Belle Fourche Member of early to late
      Cenomanian age", and "Seven of the twelve established ammonite zones of
      middle and late Cenomanian age in the Western Interior can be
      recognized in the Belle Fourche Member."
  - id: merewether1996a
    notes: >
      In the Powder River Basin, ammonites and bivalves "of middle and late
      Cenomanian and early Turonian age have been collected from outcrops and
      core of the middle and upper parts of the Belle Fourche"; a lower part
      "could be either early Cenomanian or middle Cenomanian". The top varies
      "from early late Cenomanian (fig. 7, zone 13) in east-central Natrona
      County to early Turonian (fig. 7, zone 20 or 21) in southern and
      central Johnson County", which the author attributes to differential
      erosion. In Natrona and Converse counties the late Cenomanian top is
      "disconformably overlain by beds of middle Turonian age in the Emigrant
      Gap Member". The member's top is diachronous, so the late Cenomanian
      top that Cobban (1990) gives in Natrona County and the early Turonian
      top in Johnson County are two ends of one eroded surface.
