name: Belle Fourche
rank: member
parent: Frontier
period: [Early Cretaceous, Late Cretaceous]
stages: [Albian, Cenomanian]
dispute:
  summary: >
    Member in the United States, formation in Canada. Carpenter (1998) gives
    "Belle Fourche Member (Middle Cenomanian ...), Frontier Formation" and
    records the reassignment that produced it: Merewether and colleagues
    (1979) "revised the Frontier Formation in Wyoming, and reidentified
    Dunbar's Frontier Formation as the Belle Fourche Member of the Frontier
    Formation". Pittman and colleagues (2020) tabulate a "Belle Fourche
    Formation" in Canada at the same Cenomanian age.
references:
  - id: carpenter1998c
    notes: >
      Gives the rank, parent and age, and the history of the reassignment. The
      age differs by level: the Nodosaurus textilis horizon is "Belle Fourche
      Member (Middle Cenomanian ...), Frontier Formation", after Merewether
      and colleagues (1978) and Merewether (1983), and the Stegopelta
      landerensis horizon is the "Base of Belle Fourche Member (latest Albian
      or earliest Cenomanian ...)", after Merewether (1983).
  - id: pittman2020a
    notes: >
      Uses formation rank for the Canadian occurrence.
  - id: merewether1979a
    notes: >
      The specialist treatment of the parent formation, and the entry's
      plainest statement of age: "The Frontier Formation in eastern Wyoming
      is divided into as many as three members, which are, from older to
      younger, the Belle Fourche Member of Cenomanian age, the unnamed member
      of early and middle Turonian age, and the Wall Creek Member of late
      Turonian and early Coniacian age." It names no Albian anywhere.
      It also separates two units that share the name: in the Powder River
      Basin "the shale, siltstone, and sandstone of the Belle Fourche Member
      grade eastward into shale of the Belle Fourche Shale and calcareous
      shale of the lower part of the Greenhorn Formation". A third, the Belle
      Fourche Formation of Canada, is the unit Pittman and colleagues (2020)
      report. This entry is the Wyoming member.
  - id: merewether1983a
