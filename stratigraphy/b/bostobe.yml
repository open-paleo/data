name: Bostobe
rank: formation
period: [Late Cretaceous]
stages: [Santonian, Campanian]
variants: [Bostobin, Bostobinskaya, Bostobynskaya]
lithology: sand and clay, gray or red
references:
  - id: nessov1997a
    notes: >
      Dates the formation Santonian–early Campanian at every locality cataloged,
      preferring that to earlier datings of its clay lenses, and names a
      Baibishinskian complex from its upper half.
  - id: godefroit2012a
    notes: >
      Gives "Bostobinskaya Svita (Santonian-Campanian)", the Russian
      adjectival form of the name.
  - id: nessov1995a
    notes: >
      Gives "Bostobin Formation (Santonian - early Campanian)" and judges the
      Shakh-Shakh beds Santonian–early Campanian rather than the earlier
      Turonian datings.
  - id: norman1997a
    notes: >
      Reports that Shilin and Suslov (1982) assigned the Akkurgan beds to the
      formation on a general similarity of lithofacies, with a
      Santonian–Campanian age from paleobotanical comparison.
  - id: rozhdestvensky1964b
  - id: rozhdestvensky1967a
  - id: shilin1982a
    notes: >
      Ties the unit to its age in defining it: "The sand-clay deposits of the
      Santonian-Campanian predominantly gray-colored or red-colored in
      appearance, widely developed in the Lower Syr Darya uplift, are
      distinguished as the Bostobine Formation", and gives the Akkurgan holotype
      horizon as "Santonian-Campanian, Bostobine Formation". Source of the
      lithology.
  - id: rozhdestvensky1971a
  - id: rozhdestvensky1976a
    notes: >
      Does not name this formation. The text is a turtle description
      mentioning Kazakhstan, and contains no form of the unit's name.
  - id: zherikhin1978a
    notes: >
      Cited by Nessov (1997) for Turonian and late Coniacian to early
      Campanian datings of clay lenses at Kzyl-Dzhar and Taldysay.
