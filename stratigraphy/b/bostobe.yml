name: Bostobe
rank: formation
period: [Late Cretaceous]
stages: [Santonian, Campanian]
variants: [Bostobin, Bostobinskaya, Bostobynskaya, Bostobine, Bostoba]
references:
  - id: nessov1997a
    notes: >
      Gives the unit the same age at every locality cataloged, Santonian to
      lower Campanian, and separates it from a neighbor at Shakh-Shakh:
      "Bostobinskian Formation, but not Beleutinskian, Santonian-Lower
      Campanian. Finds predominantly from the lower half of the age interval."
      Earlier readings of the fossiliferous clay lenses are set against that
      and not adopted - at Kzyl-Dzhar a "Lens of gray clays in the
      Bostobinskian Formation, Turonian (Zherikhin, 1978, p. 78) or, most
      likely, Santonian-Lower Campanian", and at Taldysay a lens dated "Upper
      Coniacian-Lower Campanian (Zherikhin, 1978, p. 80) or Santonian-Lower
      Campanian". Resolved by horizon the lower part is Santonian alone, while
      near the Baibishe well "in the upper half of the formation, a rich
      vertebrate complex was found, named the Baibishinskian (Late
      Santonian-Early Campanian)".
  - id: godefroit2012a
    notes: >
      Gives "Bostobinskaya Svita (Santonian-Campanian", the Russian
      adjectival form of the name.
  - id: nessov1995a
    notes: >
      Gives "Bostobin Formation (Santonian - early Campanian", a third
      rendering of the same name. For the Shakh-Shakh beds it lists the
      earlier "upper Turonian - lower Santonian" dating of Rozhdestvensky
      (1964, 1971) and Rozhdestvensky and Khozatsky (1967), then judges them
      "more probably ... Santonian - lower Campanian rather than Cenomanian -
      Turonian (Rozhdestvensky, 1964b) or Turonian (Rozhdestvensky, 1976)".
  - id: norman1997a
    notes: >
      Records how the Akkurgan beds came to be assigned here, Shilin and
      Suslov (1982) allocating "this locality and its beds to the
      Bostobinskaya Svita ... on the basis of a general similarity of
      lithofacies with other outcrops of the Bostobinskaya Svita in this
      region" rather than by a traced correlation, with "A Late Cretaceous
      age ... proposed (Santonian-Campanian-87-74 Ma) on the basis of
      comparative palaeobotanical observations".
  - id: rozhdestvensky1964b
  - id: rozhdestvensky1967a
  - id: shilin1982a
    notes: >
      Ties the unit to its age in defining it: "The sand-clay deposits of the
      Santonian-Campanian predominantly gray-colored or red-colored in
      appearance, widely developed in the Lower Syr Darya uplift, are
      distinguished as the Bostobine Formation", and gives the Akkurgan
      holotype horizon as "Santonian-Campanian, Bostobine Formation".
  - id: rozhdestvensky1971a
  - id: rozhdestvensky1976a
    notes: >
      Does not name this formation. The text is a turtle description
      mentioning Kazakhstan, and contains no form of the unit's name, so it
      contributes nothing to the entry's age.
