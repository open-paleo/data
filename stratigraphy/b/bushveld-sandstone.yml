name: Bushveld Sandstone
rank: formation
period: [Late Triassic, Early Jurassic]
dispute:
  summary: >
    Which southern African unit this correlates with is unsettled, and the
    candidates are superposed rather than adjacent, so they cannot both hold.
    Van Heerden (1979) makes it "more or less the same age as the Elliot
    Formation farther south"; Smith and colleagues (1993) instead list it
    among equivalents of the Clarens, which overlies the Elliot. Haughton
    (1924) shows why the question is hard: he treats the name as covering the
    Transvaal Stormberg entire and undivided, with no Molteno, Elliot or
    Clarens separated inside it, so a correlation to any one of them is a
    correlation to part of what the name denotes.
references:
  - id: haughton1924a
    notes: >
      Uses it as a horizon name throughout, giving "Horizon. Bushveld
      Sandstone" for material from Wiepe and from Haakdoornbult in the
      Waterberg district, and sets out what the name covers: "The Stormberg
      Series in the Transvaal is preserved as a number of outliers, forming
      the Bushveld Series, of which the most important occur on the Springbok
      Flats".
  - id: vanheerden1979a
    notes: >
      Correlates it southward, noting that although "it is geographically far
      removed from other finds", "the Bushveld Sandstone is more or less the
      same age as the Elliot Formation farther south".
  - id: smith1993a
    notes: >
      Places it instead with the Clarens: "Biostratigraphic and lithofacies
      equivalents to the Clarens sandstone are present in the Lebombo belt
      north of Swaziland, northern Transvaal (Bushveld sandstone), Zimbabwe
      (Forest sandstone), Botswana (Bodibeng sandstone) and Namibia (Etjo
      sandstone), and a general Late Triassic to Early Jurassic age is
      inferred for these deposits as a whole."
  - id: vanhoepen1916a
    notes: >
      Places the unit rather than dating it, and works only in South African
      local units - Dwyka, Ecca, Beaufort, Stormberg, Karroo - naming no
      international stage or period anywhere. The limestone bed yielding
      Gigantoscelus "lies not far above the gravel bed of the
      'Coal-measures'" but "also apparently does not lie far from the
      Bushveld Sandstone and it may even be that it belongs to the uppermost
      part of the latter", from which the paper concludes that "Dwyka beds
      and Stormberg beds have been demonstrated in the Transvaal".
