name: Bajo Barreal
rank: formation
period: [Late Cretaceous]
stages: [Cenomanian, Turonian]
references:
  - id: ibiricu2013a
    notes: >
      Places the formation in the "Upper Cretaceous: Cenomanian-Turonian", and
      for the part that yielded Katepensaurus reports the settled position:
      "The age of the Lower Member of the Bajo Barreal Formation is widely
      regarded as Cenomanian-Turonian."
  - id: navarrete2011a
    notes: >
      Lists the four published ages for the formation - Senonian,
      Albian-Cenomanian, mid-Cenomanian to late Turonian and late Cenomanian
      to early Turonian - and prefers the Cenomanian-Turonian readings, which
      "would be the one that best fits these faunistic connections" with
      equivalent units in the Neuquén basin. Drusilasaura itself comes from
      "the Upper Member of the Bajo Barreal Formation (Cenomanian-Turonian)",
      high in that member and below the Laguna Palacios Formation, so its own
      range "could extend to the late Turonian and even to the Coniacian".
  - id: martínez2016a
    notes: >
      Holds the formation to the Cenomanian-Turonian, tabulating the "Fossil
      vertebrate fauna of the Upper Cretaceous (Cenomanian-Turonian) Bajo
      Barreal Formation of central Patagonia, Argentina" and resting that on
      radiometric dates from tuffs within the unit together with zircon ages
      supporting a Cenomanian Lower Member. It dismantles the younger reading:
      Clyde and colleagues "argued for a much younger (Campanian) age for the
      Bajo Barreal Formation", but the strata they investigated "have recently
      been reassigned" to the Lago Colhué Huapi Formation. The Albian in
      circulation comes from palynology of "a subsurface equivalent of the
      Bajo Barreal Formation, the Caleta Olivia Member of the Cañadón Seco
      Formation", not from this unit.
  - id: casal2015a
    notes: >
      Gives "Bajo Barreal Formation (middle Cenomanian-late Turonian", and
      erects the Lago Colhué Huapi Formation above it: that unit "overlies
      the Bajo Barreal Formation (Upper Member)" rather than replacing any
      part of it, so this formation lost no rock in the split. What moved
      were occurrences at the eastern localities, where "stratigraphic and
      chronological aspects of these levels have historically been confused".
  - id: casal2007a
    notes: >
      Carries the superseded reading. Assigns "a Campanian-Maastrichtian?
      age for the upper levels of this stratigraphic unit, outcropping in the
      southeast of Lago Colhué Huapi", on Aeolosaurus and "other
      paleontological records from the same locality, in addition to geologic
      observations", and calls it preliminary. The same research group
      separated those beds as the Lago Colhué Huapi Formation eight years
      later, so this is history rather than a competing age for the rock now
      called Bajo Barreal.
