name: Bajo Barreal
rank: formation
parent: Chubut
period: [Late Cretaceous]
stages: [Cenomanian, Turonian]
references:
  - id: ibiricu2013a
    notes: >
      Places the formation in the "Upper Cretaceous: Cenomanian-Turonian", and
      for the part that yielded Katepensaurus reports the settled position:
      "The age of the Lower Member of the Bajo Barreal Formation is widely
      regarded as Cenomanian-Turonian."
  - id: navarrete2011a
    notes: >
      Names Drusilasaura deseadensis from high in the Upper Member, and of four
      published ages for the formation prefers the Cenomanian-Turonian readings
      as the best fit to its faunal ties with the Neuquén basin.
  - id: martínez2016a
    notes: >
      Lists the vertebrate fauna of the "Upper Cretaceous (Cenomanian—Turonian)"
      formation, and rests that age on radiometric dates from its tuffs and
      zircons.
  - id: casal2015a
    notes: >
      Gives the formation as "middle Cenomanian–late Turonian", and erects the
      Lago Colhué Huapi Formation above its Upper Member.
  - id: casal2007a
    notes: >
      Assigns a preliminary "Campanian-Maastrichtian?" age to the upper levels
      of the formation southeast of Lago Colhué Huapi, from Aeolosaurus
      colhuehuapensis and other finds there.
