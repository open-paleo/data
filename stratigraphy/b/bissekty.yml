name: Bissekty
rank: formation
period: [Late Cretaceous]
stages: [Turonian, Coniacian, Santonian]
references:
  - id: sues2016a
    notes: >
      Dates it and its neighbor above: "Bissekty Formation (Upper
      Cretaceous: middle-upper Turonian) and Aitym Formation (Upper
      Cretaceous: upper Turonian - ?Coniacian".
  - id: kuzmin2020a
    notes: >
      Independently gives "Bissekty Formation (Turonian".
  - id: nessov1995a
    notes: >
      At Dzharakuduk the base of the formation is "Upper Cretaceous, upper
      Turonian", levels about 52 and 57 m above the base are Coniacian, and a
      "Level near the top of the Bissekty Formation (site CBI-7a) ... Upper
      Cretaceous, Coniacian-? lower Santonian". Notes that "Earlier, the
      entire formation was dated as late Turonian ... or as undivided late
      Turonian - Santonian".
