name: Bahariya
rank: formation
period: [Late Cretaceous]
stages: [Cenomanian]
description: "The Bahariya Formation (also transcribed as Baharija Formation) is a fossiliferous geologic formation dating back to the early Cenomanian, which outcrops within the Bahariya depression in Egypt, and is known from oil exploration drilling across much of the Western Desert where it forms an important oil reservoir."
references:
  - id: stromer1915a
    notes: >
      Gives "Baharîje Beds (lowermost Cenomanian)", using the German
      transliteration of the name.
  - id: stromer1931a
    notes: >
      Uses the same name and age in the later monograph.
  - id: smith2001a
    notes: >
      Gives "the Upper Cretaceous [Cenomanian: 93.5 to 99.0 million years ago
      (Ma)] Bahariya Formation" and places the Paralititan site in its coastal
      deposits.
