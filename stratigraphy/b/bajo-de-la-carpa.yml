name: Bajo de la Carpa
rank: formation
parent: Neuquén
period: [Late Cretaceous]
stages: [Santonian]
lithology: coarse-grained sandstone, with thin siltstone and claystone beds
references:
  - id: filippi2026a
    notes: Gives "Bajo de la Carpa Formation, Santonian".
  - id: porfiri2024a
    notes: >
      Independently, "the age of the Bajo de la Carpa Formation is interpreted
      as Santonian" within the Upper Cretaceous, and the formation belongs to
      the Neuquén Group. Bajo means low or depression and is part of the
      proper name; the mistranslation "Lower La Carpa" appears in some
      sources.
  - id: garrido2010a
    notes: >
      Dates the formation Santonian, on the 86 to 83 Ma of Legarreta and
      Gulisano (1989) and on the vertebrate fauna studied by Bonaparte (1991).
  - id: legarreta1989a
  - id: bonaparte1991a
  - id: hugo2001a
    notes: >
      Gives the formation a Santonian age after Bonaparte (1991), within a Río
      Colorado Subgroup of Santonian to lower Campanian age.
  - id: cruz1989a
    notes: >
      Treats the Bajo de la Carpa as the sandstone member of a Río Colorado
      Formation, within a framework of nine depositional sequences for the
      Neuquén Group.
  - id: martinelli2004a
    notes: >
      Coniacian-Santonian, presumed rather than measured: the formation's "age
      is presumed to be Coniacian-Santonian", after Legarreta and Gulisano
      (1989) and Bonaparte (1991). The same range accompanies its Dinilysia
      patagonica and Neuquensaurus australis records. Garrido (2010) reads the
      same two sources as Santonian.
  - id: pérez-moreno2023a
    notes: >
      Gives the Rinconsaurus caudamirus type locality "at the base of the Bajo
      de la Carpa Formation (middle Santonian–Campanian; Filippi 2015)", but
      Filippi (2015) gives the formation as Santonian, as this paper does
      elsewhere: "the Bajo de la Carpa Formation (Santonian)".
  - id: filippi2015a
    notes: >
      Places the Rinconsaurus site at the base of the formation and reassigns
      Overosaurus to it, both as Santonian after a personal communication from
      Garrido.
  - id: leanza2004a
    notes: >
      "According to Bonaparte (1991), the age of this unit is Santonian (see
      also Hugo and Leanza, 2001a)". Places it in the Río Colorado Subgroup,
      whose "Santonian–Early Campanian" covers the Anacleto as well, and notes
      that it is the only Neuquén Group unit resting on the basement of the
      North Patagonian Massif. Source of the lithology.
