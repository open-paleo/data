name: Bajo de la Carpa
rank: formation
parent: Neuquén
period: [Late Cretaceous]
stages: [Coniacian, Santonian, Campanian]
references:
  - id: filippi2026a
    notes: Gives "Bajo de la Carpa Formation, Santonian".
  - id: porfiri2024a
    notes: >
      Independently, "the age of the Bajo de la Carpa Formation is interpreted
      as Santonian" within the Upper Cretaceous, and the formation belongs to
      the Neuquén Group. Bajo means low or depression and is part of the
      proper name; the mistranslation "Lower La Carpa" appears in some
      sources.
  - id: garrido2010a
    notes: >
      Santonian, on two independent grounds: Legarreta and Gulisano (1989)
      give the deposits an age between 86 and 83 Ma, "placing it within the
      Santonian", and "a Santonian age is also attributed by Bonaparte (1991)
      on the basis of its paleontological content, a criterion later followed
      by Hugo & Leanza (2001) and which is also adopted in this work". Cruz
      and colleagues (1989) instead give the whole Río Colorado Subgroup, this
      formation and the Anacleto, "an age of 88.5 to 80 Ma, corresponding to
      the Coniacian–Early Campanian interval".
  - id: legarreta1989a
  - id: bonaparte1991a
  - id: hugo2001a
    notes: >
      Sets out the Neuquen Group's three subgroups with a span for each: "the
      Cenomanian-lower Turonian Limay Subgroup comprising the Candeleros,
      Huincul and Cerro Lisandro Formations; the upper Turonian-Coniacian Rio
      Neuquen Subgroup including the Portezuelo and Plottier Formations; and
      the Santonian-lower Campanian Rio Colorado Subgroup comprising the Bajo
      de la Carpa and Anacleto Formations." The statement is made twice in
      identical terms, and dates the group as a whole "from early Cenomanian
      (97 plus or minus 3 Ma) to early Campanian (74 plus or minus 3 Ma)".
  - id: cruz1989a
    notes: >
      A sequence-stratigraphic analysis that runs the whole scheme one rank
      below the registry: it gives "The Portezuelo (sandstones) and Plottier
      (pelites) members of the Rio Neuquen Formation" and "the members Bajo
      de la Carpa (sandstones) and Anacleto (pelites), of the Rio Colorado
      Formation", where the file and Hugo and Leanza (2001) make those two
      subgroups. Its own framework is Depositional Sequences I to IX, and its
      ages sit in a comparative stratigraphic chart rather than in the text,
      so it is a rank datum and a sequence framework rather than a dating.
  - id: martinelli2004a
    notes: >
      Coniacian-Santonian, presumed rather than measured: the formation's "age
      is presumed to be Coniacian-Santonian", after Legarreta and Gulisano
      (1989) and Bonaparte (1991). The same range accompanies its Dinilysia
      patagonica and Neuquensaurus australis records.
  - id: pérez-moreno2023a
    notes: >
      Carries the top into the Campanian: the Rinconsaurus caudamirus type
      locality "is located at the base of the Bajo de la Carpa Formation
      (middle Santonian–Campanian; Filippi 2015)". The abstract instead gives
      "the Bajo de la Carpa Formation (Santonian)".
