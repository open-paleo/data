name: Bayanshiree
rank: formation
period: [Late Cretaceous]
stages: [Cenomanian, Turonian, Coniacian, Santonian, Campanian, Maastrichtian]
variants: [Bayn Shireh, Bayn Shire, Bayn Shiree, Baynshire, Baynshiree, Baynshirenskaya]
references:
  - id: khand2000a
    notes: >
      Three ages sit side by side without reconciliation: "Fossil evidence
      suggests that the Bayanshiree Formation is Cenomanian-Santonian in age"
      in the eastern Gobi, "the Bayanshiree Formation (Cenomanian-Turonian)"
      where the Segnosaurus and Erlikosaurus material is discussed, and "the
      Bayanshiree Formation (Turonian-Santonian)" for the plant beds at Khar
      Khutul; Martinson's (1982) Bayanshireenian mollusc assemblage is "late
      Cenomanian-Santonian". The formation is taken as "the lowermost part of
      the Upper Cretaceous" once Shuvalov (1980) had placed the Baruunbayan
      Formation below it. The paper's own verdict is that the position of this
      division and the Baruungoyot "remain to be quite unclear".
  - id: eberth2009a
    notes: >
      Thickness and the faunal basis for the age: exposures of "the 280 m
      thick, buff-colored Baynshiree Formation/Svita" at Shine Us Khudag, Khar
      Khutul and Bayn Shiree "produce a rich assemblage of
      Cenomanian-Santonian vertebrate and invertebrate fossils". Records the
      unit as a formation and a svita in the same breath. Workers in the
      Eastern Gobi, it says, have shown the formation and the conformably
      overlying Shine Us Khudag redbeds together "to be Late Cretaceous in age
      (Cenomanian-Campanian)".
  - id: tsogtbaatar2019a
    notes: >
      "Baynshire Formation (Cenomanian-Santonian)". The age rests on fossils
      rather than dates: the beds at Bayshin Tsav, Khongil Tsav and Bayn
      Shire "are thought to be late Cenomanian to Santonian in age based on
      their molluscan, ostracode, and vertebrate faunas and named the
      Baynshire Svita".
  - id: hicks1999a
    notes: >
      Calls it the "lower Upper Cretaceous Bayn Shireh Formation", which has
      "been assigned a 'Baynshirenian' biostratigraphic age that may range
      from Cenomanian to early Campanian", an age "cited in the literature as
      ranging from the late Cenomanian to early Santonian ... and more
      recently from the Turonian to lower Campanian". Its own paleomagnetic
      results put the formation as "most likely deposited near the end of the
      Cretaceous Long Normal Interval, no later than the latest Santonian".
  - id: jin2012a
    notes: >
      Gives Garudimimus as "from the Bayanshiree Svita (Cenomanian-Campanian",
      crediting the age to Makovicky and colleagues (2004).
  - id: makovicky2004a
  - id: maryańska1977a
    notes: >
      Reports that Maleev (1952) regarded the Talarurus-bearing sediments at
      Bayn Shireh "as the youngest Cretaceous sediments in Mongolia, i.e.
      Maastrichtian in age", an opinion "not confirmed by later
      investigations", and judges "An Upper Cenomanian to Lower Santonian age
      ascribed to these sediments by Martinson (1973, 1975)" as "more
      probable".
