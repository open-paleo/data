name: Bayanshiree
rank: formation
period: [Late Cretaceous]
stages: [Cenomanian, Turonian, Coniacian, Santonian]
variants: [Bayn Shireh, Bayn Shire, Bayn Shiree, Baynshire, Baynshiree, Baynshirenskaya]
lithology: variegated claystone, sandstone and conglomerate
references:
  - id: khand2000a
    notes: >
      Dates the formation Cenomanian to Santonian on fossil evidence in the
      eastern Gobi, gives narrower ranges elsewhere in the text, and calls its
      position "quite unclear".
  - id: eberth2009a
    notes: >
      Describes the formation as 280 m thick at Shine Us Khudag, Khar Khutul and
      Bayn Shiree, yielding "a rich assemblage of Cenomanian-Santonian
      vertebrate and invertebrate fossils".
  - id: tsogtbaatar2019a
    notes: >
      "Baynshire Formation (Cenomanian-Santonian)". The age rests on fossils
      rather than dates: the beds at Bayshin Tsav, Khongil Tsav and Bayn
      Shire "are thought to be late Cenomanian to Santonian in age based on
      their molluscan, ostracode, and vertebrate faunas and named the
      Baynshire Svita".
  - id: hicks1999a
    notes: >
      Finds the formation normal in polarity and places it "near the end of the
      Cretaceous Long Normal Interval, no later than the latest Santonian".
  - id: jin2012a
    notes: >
      Gives Garudimimus as "from the Bayanshiree Svita
      (Cenomanian-Campanian ...)", crediting the age to Makovicky and
      colleagues (2004). Makovicky and colleagues (2004) tabulate the
      Garudimimus horizon as Cenomanian to Santonian, so the Campanian is
      not theirs.
  - id: makovicky2004a
    notes: >
      Tabulates Garudimimus brevipes from the Bayanshiree Svita as
      Cenomanian to Santonian.
  - id: maryańska1977a
    notes: >
      Reports that Maleev (1952) regarded the Talarurus-bearing sediments at
      Bayn Shireh "as the youngest Cretaceous sediments in Mongolia, i.e.
      Maastrichtian in age", an opinion "not confirmed by later
      investigations", and judges "An Upper Cenomanian to Lower Santonian age
      ascribed to these sediments by Martinson (1973, 1975)" as "more
      probable".
  - id: martinson1982a
  - id: shuvalov1980a
  - id: maleev1952b
  - id: jerzykiewicz2000a
    notes: >
      Gives "Bayanshiree Formation (Late Cenomanian–Coniacian to ?Early
      Santonian)", narrower than the "Baynshirenian (Turonian through early
      Campanian)" of Jerzykiewicz and Russell (1991). Source of the lithology.
  - id: shuvalov2000a
    notes: >
      Gives "Bayanshiree (Cenomanian–Santonian)" in its text and its
      correlation table.
  - id: jerzykiewicz1991a
    notes: >
      Gives the Baynshirenian as "Turonian through early Campanian", the wider
      age that Jerzykiewicz (2000) narrows.
  - id: martinson1973a
    notes: >
      Cited by Maryańska (1977) for a late Cenomanian to early Santonian age
      of the Bayn Shireh beds.
  - id: martinson1975a
    notes: >
      Cited by Maryańska (1977) for a late Cenomanian to early Santonian age
      of the Bayn Shireh beds.
