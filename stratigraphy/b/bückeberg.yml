name: Bückeberg
rank: formation
period: [Early Cretaceous]
stages: [Berriasian, Valanginian]
description: "The Bückeberg Formation preserves fossils dating back to the Berriasian of the Cretaceous period. The Bückeberg Formation has previously been considered to constitute the \"German Wealden\" in reference to its similarity to the Wealden Group in the United Kingdom. The plesiosaur Brancasaurus, an indeterminate ankylosaur referred to Hylaeosaurus, the turtle Dorsetochelys are known from the formation."
variants: [German Wealden]
references:
  - id: hornung2012a
    notes: >
      The dedicated treatment of its dinosaur tracks, giving "The Berriasian
      Bückeberg Formation", recording that it is "traditionally referred to
      as the 'German Wealden'", and running it from the middle Berriasian
      upward.
  - id: raven2020a
    notes: >
      Gives "the Lower Cretaceous Bückeberg Formation (early Valanginian) of
      Gronau, Westfalen, northwestern Germany".
  - id: bonde2012a
    notes: >
      Correlates the Danish Late Berriasian beds with "the middle part of the
      German Wealden (Middle Bückeberg Formation, W 3-W 4 ...)" and with the
      Durlston Beds of the Upper Purbeck.
