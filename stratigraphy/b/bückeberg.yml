name: Bückeberg
rank: formation
period: [Early Cretaceous]
stages: [Berriasian, Valanginian]
variants: [German Wealden]
references:
  - id: hornung2012a
    notes: >
      The dedicated treatment of its dinosaur tracks, giving "The Berriasian
      Bückeberg Formation", recording that it is "traditionally referred to
      as the 'German Wealden'", and running it from the middle Berriasian
      upward.
  - id: raven2020a
    notes: >
      Gives "the Lower Cretaceous Bückeberg Formation (early Valanginian) of
      Gronau, Westfalen, northwestern Germany".
  - id: bonde2012a
    notes: >
      Correlates the Danish Late Berriasian beds with "the middle part of the
      German Wealden (Middle Bückeberg Formation, W 3-W 4 ...)" and with the
      Durlston Beds of the Upper Purbeck.
