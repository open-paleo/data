name: Bayo Overo
rank: member
parent: Cerro Barcino
period: [Early Cretaceous, Late Cretaceous]
stages: [Albian, Cenomanian]
dispute:
  summary: >
    Carrano and colleagues (2012) give "Albian–Cenomanian"; Rauhut and
    colleagues (2003) write that "though frequently cited as being derived
    from the Aptian–Albian ... Chubutisaurus is thus most probably of Late
    Cretaceous age". Martinelli and colleagues (2007) give "Aptian-Albian,
    Bayo Overo Member" and credit it to Del Corro (1975) and to Rauhut and
    colleagues (2003), who place the member's Chubutisaurus in the Late
    Cretaceous.
references:
  - id: carrano2012a
    notes: >
      Gives the horizon of the Megalosaurus inexpectatus type, MACN 18.172, as
      "Bayo Overo Member, Cerro Barcino Formation; Albian–Cenomanian, late
      Early–early Late Cretaceous".
  - id: canale2014a
    notes: >
      Places it at the top of the formation, which "culminates with Bayo
      Overo Member".
  - id: martinelli2007b
    notes: >
      Dates it as Aptian to Albian in a table of Early Cretaceous continental
      tetrapods from Argentina, listing Chubutisaurus insignis from the
      "Aptian-Albian, Bayo Overo Member, Cerro Barcino Fm".
  - id: rauhut2003d
    notes: >
      Places the Bayo Overo among the "higher members" of the Cerro Barcino
      Formation, above the La Paloma and Cerro Castaño, with the Las Plumas
      and Puesto Manuel Arce; it "has yielded the sauropod Chubutisaurus".
      Gives the three higher members together as "probably latest Early–Late
      Cretaceous in age (?Albian–?Campanian)", following Cortiñas (1996).
