parent: Cerro Barcino
period: [Early Cretaceous, Late Cretaceous]
stages: [Aptian, Albian, Cenomanian]
references:
  - id: carrano2012a
    notes: >
      Gives the horizon of the Megalosaurus inexpectatus type, MACN 18.172, as
      "Bayo Overo Member, Cerro Barcino Formation; Albian–Cenomanian, late
      Early–early Late Cretaceous".
  - id: canale2014a
    notes: >
      Places it at the top of the formation, which "culminates with Bayo
