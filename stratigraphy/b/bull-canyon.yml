name: Bull Canyon
rank: formation
parent: Dockum
period: [Late Triassic]
stages: [Norian]
references:
  - id: nesbitt2007a
    notes: >
      Equates the two names and gives the occurrence, "Bull Canyon Formation
      (= Cooper Canyon Formation), Dockum Group, Quay County, New Mexico" at
      "Norian, Late Triassic", for Gojirasaurus. Martz and colleagues (2013)
      withdrew the equation, and the two are entered separately.
  - id: martz2013a
    notes: >
      Withdraws that correlation. The Post Quarry assemblage had been read as
      Revueltian "largely because the Cooper Canyon Formation was accepted as
      correlative with the Bull Canyon Formation of New Mexico"; "However,
      recent lithostratigraphic revisions (Martz 2008) have cast doubt on" it.
  - id: hunt1998a
    notes: >
      Uses the other containment, "the Bull Canyon Formation (Chinle Group:
      Norian), east-central New Mexico", and records that dinosaurs form only
      a small part of its fauna.
  - id: martz2008a
    notes: >
      Cited by Martz and colleagues (2013) for the lithostratigraphic revision
      that cast doubt on the Bull Canyon correlation.
  - id: cather2013a
    notes: >
      A formation of the Dockum Group between the Trujillo Sandstone and the
      Redonda Formation, "first used by Lucas and Hunt (1989)". It "is equivalent
      to the upper part (Martz, 2008) of the earlier-named Cooper Member of
      Chatterjee (1986) in Texas", whose name was preoccupied and was revised to
      Cooper Canyon Formation by Lehman and colleagues (1992) only after Lucas
      and Hunt had named the Bull Canyon, so "strictly speaking, the term Bull
      Canyon should have priority".
  - id: lucas1989a
  - id: chatterjee1986a
  - id: lehman1992a
