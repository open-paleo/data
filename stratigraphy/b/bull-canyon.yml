name: Bull Canyon
rank: formation
parent: Dockum
period: [Late Triassic]
stages: [Norian]
references:
  - id: nesbitt2007a
    notes: >
      Equates the two names and gives the occurrence, "Bull Canyon Formation
      (= Cooper Canyon Formation), Dockum Group, Quay County, New Mexico" at
      "Norian, Late Triassic", for Gojirasaurus. Martz and colleagues (2013)
      withdrew the equation, and the two are entered separately.
  - id: martz2013a
    notes: >
      Withdraws that correlation. The Post Quarry assemblage had been read as
      Revueltian "largely because the Cooper Canyon Formation was accepted as
      correlative with the Bull Canyon Formation of New Mexico"; "However,
      recent lithostratigraphic revisions (Martz 2008) have cast doubt on" it.
  - id: hunt1998a
    notes: >
      Uses the other containment, "the Bull Canyon Formation (Chinle Group:
      Norian), east-central New Mexico", and records that dinosaurs form only
      a small part of its fauna.
