name: Bayin-Gobi
rank: formation
period: [Early Cretaceous]
stages: [Aptian, Albian]
variants: [Bayin Gobi]
references:
  - id: pu2013a
    notes: >
      Gives "Bayin-Gobi Formation (Aptian-Albian)" and counts it among "the
      Lower Cretaceous deposits of China", setting it beside "Suzhousaurus
      megatherioides from Xinminpu Group (Albian".
  - id: russell1993b
    notes: >
      The Alxasaurus description, and the earliest direct dating of the unit
      cited here. The type locality is "situated in steeply inclined exposures
      of the Bayin Gobi Formation centred 1 km west of the abandoned village
      of Elesitai", in "lacustrine strata of Albian age in the Alxa
      ("Alashan") Desert of Inner Mongolia". The age rests on the associated
      fauna, turtles, Psittacosaurus and mammals "suggestive of an Albian age
      (cf. Jerzykiewicz and Russell 1991)"; the palynomorphs of angiospermous
      affinity it also mentions are reported by personal communication.
  - id: zanno2010a
    notes: >
      Gives the narrower "Bayin Gobi Formation (lacustrine facies), Inner
      Mongolia, Albian", spelling the name without the hyphen.
