name: Bajada Colorada
rank: formation
period: [Early Cretaceous]
stages: [Berriasian, Valanginian, Hauterivian]
references:
  - id: gallina2021a
    notes: >
      Gives "the Lower Cretaceous Bajada Colorada Formation
      (Berriasian-Valanginian", narrowing it to "late Berriasian-Valanginian"
      in the stratigraphic occurrence of Ninjatitan.
  - id: coria2019a
    notes: >
      Uses the narrower Valanginian.
  - id: riguetti2022a
    notes: >
      Thyreophoran remains come from "the Lower Cretaceous rocks of the Bajada
      Colorada Formation (Berriasian-Hauterivian)" of Neuquén Province, a
      diversity of osteoderms "showing either a mixture of thyreophorans at
      the site, or a new, still poorly understood lineage".
