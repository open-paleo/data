name: Bayan Mandahu
rank: formation
period: [Late Cretaceous]
stages: [Campanian]
references:
  - id: godefroit2008b
    notes: >
      Gives the age by correlation: the formation is "correlated with the
      Djadokhta Formation in Mongolia, Campanian".
  - id: longrich2010a
    notes: >
      Hedges the same reading, "considered to be Late Cretaceous in age,
      probably Campanian".
  - id: xu2013a
    notes: >
      Shows the other naming convention for the same rock, writing
      "Wulansuhai Formation of Bayan Mandahu" and treating Bayan Mandahu as
      the area. This name is the Western literature's for the eastern outcrop
      of the unit entered as Ulansuhai. The two names attach to different
      ground, this one to the eastern outcrop and Ulansuhai to the type area,
      so they are a geographic split rather than two spellings of one name.
