name: Bayan Mandahu
rank: formation
informal: true
period: [Late Cretaceous]
stages: [Campanian]
references:
  - id: godefroit2008b
    notes: >
      Gives the age by correlation: the formation is "correlated with the
      Djadokhta Formation in Mongolia, Campanian".
  - id: longrich2010a
    notes: >
      Hedges the same reading, "considered to be Late Cretaceous in age,
      probably Campanian".
  - id: xu2013a
    notes: >
      Calls these beds "the Bayan Mandahu beds (the Wulansuhai Formation)",
      the name Xu and colleagues use for them from 2010 on, without citing
      the Wulansuhai's definition. That unit was typified about 300 km to the
      west-southwest, in Alxa; that the beds at Bayan Mandahu belong to it is
      not established.
  - id: godefroit1999a
    notes: >
      The earliest use of the name among the works cited here, as "Bayan
      Mandahu Formation, correlative to the Djadokhta Formation", with no type
      section, boundaries or thickness.
  - id: czepiński2019a
    notes: >
      The strata at Bayan Mandahu "were considered equivalents of the
      Djadokhta Formation", "although sometimes are assigned to the distinct
      unit, Bayan Mandahu Formation".
