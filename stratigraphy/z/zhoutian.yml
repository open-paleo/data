name: Zhoutian
rank: formation
parent: Ganzhou
period: [Late Cretaceous]
stages: [Cenomanian, Turonian, Coniacian]
references:
  - id: xing2024a
    notes: >
      Gives a type horizon of "Zhoutian Formation, Ganzhou Group
      (Turonian-early Coniacian; Upper Cretaceous; 96-90 Ma)", from beds
      "from which no vertebrate body fossils have previously been reported".
  - id: han2024a
    notes: >
      Describes the lithology, "reddish siltstone and sandstone, with
      interbedded halite beds", and places the Gandititan type at Datangkeng,
      Ganxian District, Ganzhou City, Jiangxi Province. Following Li and
      colleagues (2017), "Palynological analysis suggests an early Late
      Cretaceous (Cenomanian–Turonian) age".
  - id: li2017a
