name: Zhoutian
rank: formation
parent: Ganzhou
period: [Late Cretaceous]
stages: [Cenomanian, Turonian]
references:
  - id: xing2024a
    notes: >
      Gives a type horizon of "Zhoutian Formation, Ganzhou Group
      (Turonian-early Coniacian; Upper Cretaceous; 96-90 Ma)", from beds
      "from which no vertebrate body fossils have previously been
      reported", and describes Datai as from "the Coniacian–Turonian
      (early Late Cretaceous)". The 96–90 Ma restates as a range what Li
      and colleagues (2018) give as a conditional floor. The Coniacian has
      no basis beyond that restated floor: even 90 Ma is Turonian on the
      ICS chart v2024/12, where the Coniacian begins at 89.8 Ma. It also
      relays that the formation may be "roughly contemporaneous but
      allogenic deposition with the overlying Hekou Formation".
  - id: han2024a
    notes: >
      Describes the lithology, "reddish siltstone and sandstone, with
      interbedded halite beds", and places the Gandititan type at Datangkeng,
      Ganxian District, Ganzhou City, Jiangxi Province. Following Li and
      colleagues (2017), "Palynological analysis suggests an early Late
      Cretaceous (Cenomanian–Turonian) age".
  - id: li2017a
  - id: li2018a
    notes: >
      Gives the Maodian's youngest detrital zircons and, from them, only a
      floor for the Zhoutian: "the youngest zircon of the middle Maodian
      Formation gave an age of 98.0±1.0 Ma ... This indicates that the
      earliest deposition of the Maodian Formation may have been later than
      101.0 Ma ... Correspondingly, if the Zhoutian Formation lies above the
      Maodian Formation, its deposition may have been later than 95–90 Ma."
  - id: xi2021a
    notes: >
      Dates the Zhoutian "to the late Albian–early Cenomanian", in a regional
      synthesis that gives no basis beyond its correlation chart, which draws
      the formation at about 106.5 to 100 Ma. An Albian Zhoutian cannot
      overlie a Maodian younger than about 101 Ma, as the zircons of Li and
      colleagues (2018) make it.
  - id: xi2018a
    notes: >
      Reports that "The age of the Lengshuiwu, Maodian and Zhoutian
      Formations was suggested as late early Cretaceous", citing earlier
      work, and its correlation chart draws the Zhoutian in the Albian. The zircons of Li and colleagues (2018) put the Maodian, and so
      the Zhoutian above it, in the Late Cretaceous.
