name: Zhengyang
rank: formation
period: [Late Cretaceous]
stages: [Santonian, Campanian, Maastrichtian]
lithology: brick-red calcareous conglomerate alternating with feldspathic quartz
  sandstone
references:
  - id: dai2024a
    notes: >
      Describes Qianjiangsaurus from the Zhengyang Formation of the Qianjiang
      district, southwest China, at Late Cretaceous. Gives only the series.
  - id: ma2026a
    notes: >
      Places a second hadrosauroid skull "from the top of the Upper
      Cretaceous Zhengyang Formation that is stratigraphically comparable to
      the horizon of the Q. changshengi holotype".
  - id: gu1997a
    notes: >
      Describes its rock: "Brick-red, medium-bedded to massive calcareous
      conglomerate alternating with medium- to thick-bedded feldspathic quartz
      sandstone in beds of unequal thickness; conglomerate predominates in the
      lower part, the pebbles being mainly sandy limestone, and the sandstone is
      often pebbly."
