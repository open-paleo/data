name: Zhiluo
rank: formation
period: [Middle Jurassic, Late Jurassic]
stages: [Bathonian, Callovian, Oxfordian]
references:
  - id: bajpai2023a
    notes: >
      Records the revision, the Lingwulong horizon having "recently been
      revised from the late Toarcian-Bajocian Yanan Formation to the
      Bathonian-Callovian Zhiluo Formation", and notes that Ren and
      colleagues assign the taxon a Callovian age.
  - id: dai2022a
    notes: >
      Gives the same revision with a younger upper age, the horizon moving
      "from Yan'an Formation (Aalenian-Bajocian) to Zhiluo Formation
      (Bathonian-early Oxfordian)".
