name: Zhiluo
rank: formation
period: [Middle Jurassic]
stages: [Bathonian, Callovian]
references:
  - id: you2019a
    notes: >
      The study the younger readings rest on, and it gives neither the stage
      nor the epoch they carry. Its local succession runs "Middle Jurassic
      Yan'an Formation (J2y) and Zhiluo Formation (J2z), and Upper Jurassic
      Anding Formation (J3a)", so this formation is Middle Jurassic and the
      Upper Jurassic belongs to the unit above it. No stage is named anywhere
      in the paper. Places the Lingwu dinosaurs "at the top of Member 2" of
      this formation, in fine- to medium-grained lithic quartz sandstones
      with trough cross-bedding, buried in "an abandoned channel on the
      floodplain of a meandering river".
  - id: bajpai2023a
    notes: >
      Records the revision, the Lingwulong horizon having "recently been
      revised from the late Toarcian-Bajocian Yanan Formation to the
      Bathonian-Callovian Zhiluo Formation", and notes that Ren and
      colleagues assign the taxon a Callovian age.
  - id: dai2022a
    notes: >
      Gives the revision with a younger upper age, the horizon moving "from
      Yan'an Formation (Aalenian-Bajocian) to Zhiluo Formation
      (Bathonian-early Oxfordian)", crediting You and colleagues (2019). Ren
      and colleagues (2023) relay the same span from the same source. That
      early Oxfordian is not in the work either of them cites, which names no
      stage and assigns this formation to the Middle Jurassic, so it is not
      recorded here.
