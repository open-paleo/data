name: Zhenzhuchong
rank: member
parent: Ziliujing
period: [Early Jurassic]
stages: [Sinemurian]
references:
  - id: dong1983a
    notes: >
      Gives Zhenzhuchong formation rank in the Sichuan Basin, after a spell as
      a member of the Ziliujing Group and, before that, as the Zhenzhuchong clays
      of Tan and Li (1933); at the 1978 Symposium on the Mesozoic Stratigraphy
      of Sichuan "There was agreement that this unit should be provided
      formational status with an age of Early Jurassic".
      The age rests on the Lufeng fauna the unit carries, Gyposaurus sinensis
      and Sinosaurus from Dafang County, Guizhou, and a plateosaurid ungual
      close to Lufengosaurus from Hulin, Weiyuan County, which "confirms
      that the Zhenzhucheng Fm. produces an Early Jurassic (Rhaeto-Liassic)
      Lufeng Fauna", the paper's one use of that spelling against sixteen of
      Zhenzhuchong, with a Cyathidites undulatisportes pollen zone and a
      Coniopteris-dominated macroflora read the same way. It sits above the
      Late Triassic Shunjiahe Formation and below the Ziliujing Formation,
      whose Dongyuemiao Member yields the Liassic Bishanopliosaurus.
  - id: han2024b
    notes: >
      "the Lower Jurassic Zhenzhuchong Member (possibly in Sinemurian),
      Ziliujing Formation". The age is hedged in the source.
  - id: wang2025a
    notes: >
      Independently gives "the Zhenzhuchong Member of the Ziliujing Formation
      of Pingba district of Guizhou Province".
  - id: tan1933a
  - id: yao2025a
    notes: >
      Ranks it a formation below the Ziliujing rather than one of its members:
      the Ziliujing "is positioned between the underlying Lower Jurassic
      Zhenzhuchong Formation and the overlying Middle Jurassic Xintiangou
      Formation" and "comprises three continuous members", the Dongyuemiao,
      Ma'anshan and Da'anzhai.
  - id: gu1997a
    notes: >
      The provincial lithostratigraphy adopts it as a member: "Zhenzhuchong
      Mem" is entry 323 of the units Sichuan adopts, credited to Tan and Li
      (1933), and the Ziliujing Formation is defined as five members, from
      the base the Qijiang, Zhenzhuchong, Dongyuemiao, Ma'anshan and
      Da'anzhai. The Zhenzhuchong Member is "mainly purplish-red mudstone
      (shale), with bands of pale gray thin-bedded quartz fine sandstone,
      50–260 m thick" (translated). The volume records the 1980–1982
      proposal that split off a "Zhenzhuchong Formation" and does not adopt
      it.
