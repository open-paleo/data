name: Zhenzhuchong
rank: member
parent: Ziliujing
period: [Early Jurassic]
stages: [Sinemurian]
lithology: purplish-red mudstone interbedded with thin light gray fine quartz
  sandstone
references:
  - id: dong1983a
    notes: >
      Ranks the unit a formation and dates it "Early Jurassic (Rhaeto-Liassic)"
      by its Lufeng fauna of prosauropods, with Early Jurassic pollen and
      plants.
  - id: han2024b
    notes: >
      "the Lower Jurassic Zhenzhuchong Member (possibly in Sinemurian),
      Ziliujing Formation". The age is hedged, and cited to Meng and
      colleagues (2003) and Franceschi and colleagues (2022).
  - id: wang2025a
    notes: >
      Independently gives "the Zhenzhuchong Member of the Ziliujing Formation
      of Pingba district of Guizhou Province".
  - id: tan1933a
  - id: yao2025a
    notes: >
      Ranks it a formation below the Ziliujing rather than one of its members:
      the Ziliujing "is positioned between the underlying Lower Jurassic
      Zhenzhuchong Formation and the overlying Middle Jurassic Xintiangou
      Formation" and "comprises three continuous members", the Dongyuemiao,
      Ma'anshan and Da'anzhai.
  - id: gu1997a
    notes: >
      Adopts the unit as the second of five members of the Ziliujing Formation,
      "mainly purplish-red mudstone (shale)" with pale gray quartz sandstone
      bands, 50–260 m thick (translated). Source of the lithology.
  - id: franceschi2022a
    notes: >
      Samples the upper part of the member at Dacao, at the base of an
      interval it dates "from the Sinemurian to the lowermost Toarcian" by
      carbon isotopes, and places the Sinemurian–Pliensbachian boundary
      within the overlying Dongyuemiao Member.
  - id: meng2003a
