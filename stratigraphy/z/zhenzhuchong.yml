name: Zhenzhuchong
rank: member
parent: Ziliujing
period: [Early Jurassic]
stages: [Sinemurian]
references:
  - id: dong1983a
    notes: >
      Zhenzhuchong is carried at formation rank here for the Sichuan Basin,
      after a spell as a member of the Ziliujing Group and, before that, as
      the Zhenzhuchong clays of Tan and Li (1933); at the 1978 Symposium on
      the Mesozoic Stratigraphy of Sichuan "There was agreement that this unit
      should be provided formational status with an age of Early Jurassic".
      The age rests on the Lufeng fauna the unit carries, Gyposaurus sinensis
      and Sinosaurus from Dafang County, Guizhou, and a plateosaurid ungual
      close to Lufengosaurus from Hulin, Weiyuan County, which "confirms
      that the Zhenzhucheng Fm. produces an Early Jurassic (Rhaeto-Liassic)
      Lufeng Fauna", the paper's one use of that spelling against sixteen of
      Zhenzhuchong, with a Cyathidites undulatisportes pollen zone and a
      Coniopteris-dominated macroflora read the same way. It sits above the
      Late Triassic Shunjiahe Formation and below the Ziliujing Formation,
      whose Dongyuemiao Member yields the Liassic Bishanopliosaurus.
  - id: han2023a
    notes: >
      "the Lower Jurassic Zhenzhuchong Member (possibly in Sinemurian),
      Ziliujing Formation". The age is hedged in the source.
  - id: wang2025a
    notes: >
      Independently gives "the Zhenzhuchong Member of the Ziliujing Formation
      of Pingba district of Guizhou Province". Elsewhere in the literature
      Zhenzhuchong is used at formation rank for the Sichuan Basin; both
      cited papers use member.
