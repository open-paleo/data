name: Ziliujing
rank: formation
period: [Early Jurassic]
stages: [Sinemurian, Pliensbachian, Toarcian]
lithology: purplish-red and yellowish-green mudstone, with thin fine sandstone,
  siltstone and limestone
references:
  - id: han2024b
    notes: >
      "the Lower Jurassic Zhenzhuchong Member ..., Ziliujing Formation", for
      the Qianlong type locality in Guizhou.
  - id: wang2025a
    notes: >
      Independently gives "the Lower Jurassic Ziliujing Formation of
      neighboring Guizhou Province". Gives only the series.
  - id: yao2025a
    notes: >
      Gives the Archaeocursor horizon as the Dongyuemiao Member, "late
      Sinemurian-Pliensbachian", and dates the formation's top member, the
      Da'anzhai, to the Toarcian.
  - id: dong1983a
    notes: >
      Calls the age "rather controversial, as bivalve and conchostracan
      workers recognize the age as Middle Jurassic" while "The crocodiles
      and fish are Early Jurassic elements", and "provisionally regards
      the Ziliujing Fm. as Early to Middle Jurassic predominantly based
      upon the bivalve data". The reading is provisional, and later
      schemes place the formation in the Lower Jurassic.
  - id: wang2019c
    notes: >
      Gives the regional succession as "the Lower Jurassic Zhenzhuchong
      and Ziliujing Formations, the Middle Jurassic Xintiangou Formation".
  - id: gu1997a
    notes: >
      Source of the lithology.
  - id: franceschi2022a
    notes: >
      Places the Sinemurian–Pliensbachian boundary in the upper Dongyuemiao
      Member, from a carbon-isotope excursion, and the Ma'anshan Member in the
      Pliensbachian.
  - id: xu2017c
    notes: >
      Dates the Da'anzhai Member's black shales at 180.3 ± 3.2 Ma by Re–Os,
      Toarcian on the ICS chart v2024/12, and ties them to the Toarcian anoxic
      event.
