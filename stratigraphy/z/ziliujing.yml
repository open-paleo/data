name: Ziliujing
rank: formation
period: [Early Jurassic, Middle Jurassic]
stages: [Sinemurian, Pliensbachian, Toarcian]
references:
  - id: han2023a
    notes: >
      "the Lower Jurassic Zhenzhuchong Member ..., Ziliujing Formation", for
      the Qianlong type locality in Guizhou.
  - id: wang2025a
    notes: >
      Independently gives "the Lower Jurassic Ziliujing Formation of
      neighboring Guizhou Province". Gives only the series.
  - id: yao2025a
    notes: >
      Gives the Archaeocursor horizon as the "Dongyuemiao Member of the
      Ziliujing Formation, Early Jurassic, late Sinemurian-Pliensbachian": the
      member "is generally accepted to be of Pliensbachian age", and
      geochemical and palynological data "even suggest a late Sinemurian to
      early Pliensbachian age for this member." For the top of the formation
      it says "The uppermost layer of the Ziliujing Formation, the Da'anzhai
      Member, has been solidly dated to the Toarcian stage".
  - id: dong1983a
    notes: >
      Calls the age "rather controversial, as bivalve and conchostracan
      workers recognize the age as Middle Jurassic" while "The crocodiles and
      fish are Early Jurassic elements", and "provisionally regards the
      Ziliujing Fm. as Early to Middle Jurassic predominantly based upon the
      bivalve data".
