name: Ziliujing
rank: formation
period: [Early Jurassic]
stages: [Sinemurian, Pliensbachian, Toarcian]
description: "The Ziliujing Formation (or Ziliujing Group if the Zhenzhuchong Formation is considered different) is a geological formation in China. It is Early Jurassic in age. It is part of the stratigraphy of the Sichuan Basin. The dinosaur Gongxianosaurus and indeterminate theropod material are known from the Dongyuemiao Member of the formation, as well as dinosaur footprints, Zizhongosaurus and indeterminate prosauropods from the Da'anzhai Member. The basal sauropod Sanpasaurus is known from the Maanshan Member. The deposition environment during the Da'anzhai Member in the lower Toarcian is thought to have been that of a giant freshwater lake encompassing the whole of the Sichuan basin, around 3 times larger than Lake Superior, coeval with the Toarcian Oceanic Anoxic Event around 183 Ma."
references:
  - id: han2024b
    notes: >
      "the Lower Jurassic Zhenzhuchong Member ..., Ziliujing Formation", for
      the Qianlong type locality in Guizhou.
  - id: wang2025a
    notes: >
      Independently gives "the Lower Jurassic Ziliujing Formation of
      neighboring Guizhou Province". Gives only the series.
  - id: yao2025a
    notes: >
      Gives the Archaeocursor horizon as the "Dongyuemiao Member of the
      Ziliujing Formation, Early Jurassic, late Sinemurian-Pliensbachian": the
      member "is generally accepted to be of Pliensbachian age", and
      geochemical and palynological data "even suggest a late Sinemurian to
      early Pliensbachian age for this member." For the top of the formation
      it says "The uppermost layer of the Ziliujing Formation, the Da'anzhai
      Member, has been solidly dated to the Toarcian stage".
  - id: dong1983a
    notes: >
      Calls the age "rather controversial, as bivalve and conchostracan
      workers recognize the age as Middle Jurassic" while "The crocodiles
      and fish are Early Jurassic elements", and "provisionally regards
      the Ziliujing Fm. as Early to Middle Jurassic predominantly based
      upon the bivalve data". The reading is provisional, and later
      schemes place the formation in the Lower Jurassic.
  - id: wang2019c
    notes: >
      Gives the regional succession as "the Lower Jurassic Zhenzhuchong
      and Ziliujing Formations, the Middle Jurassic Xintiangou Formation".
