name: Zhumapu
rank: formation
period: [Late Cretaceous]
stages: [Cenomanian, Turonian, Coniacian, Santonian, Campanian]
dispute:
  summary: >
    Wang and colleagues (2017) give the fossil quarry, in the lower part of
    the formation, an estimated Cenomanian age after the Shanxi regional
    survey, while Xi and colleagues (2021) give the formation a late Campanian
    to early Maastrichtian age. Wang and colleagues (2013) record that no
    radiometric age has been obtained for it.
references:
- id: pang1996a
  notes: >
    Cited by Xi and colleagues (2021) for the formation's late Campanian to
    early Maastrichtian age and its dinosaur and ostracod fossils.
- id: wang2013a
  notes: >
    Reaches 722 m in the Zuoyun area of Shanxi, overlying the Zuoyun
    Formation across a parallel unconformity and covered by Tertiary
    basalts. Dated to the early Late Cretaceous on biostratigraphic
    correlation from angiosperms, spores and pollen, ostracods and
    bivalves; no radiometric age has been obtained.
- id: wang2017c
  notes: >
    Reports a second hadrosauroid from the same locality and horizon and
    repeats the early Late Cretaceous age: "The fossil quarry occurs in the
    lower part of the formation, and its estimated age is Cenomanian (Shanxi
    Regional Geological Survey Team 1984)".
- id: xi2021a
  notes: >
    Records that the formation "yields relatively abundant macrofossils such
    as dinosaurs and microfossils such as ostracods, with a late Campanian to
    early Maastrichtian age (Pang Qiqing et al., 1996)". The work it cites
    concerns the dinosaur fauna of Tianzhen, not Zuoyun.
- id: jia2024a
  notes: >
    Places the sand-mudstone of the formation conformably above the Zuoyun
    Formation in the Yungang Basin.
- id: yao1989a
  notes: >
    Redefines the formation in the Zuoyun area, about 455 m, conformable on
    the Zuoyun Formation, moving its former lowest 265 m into the Zuoyun, and
    dates its lowest bed to the Cenomanian on charophytes and bivalves.
- id: chen2007a
  notes: >
    Lists the formation among the units with Pseudohyria bivalves and dates
    them together: "这些地层单位都应归晚白垩世中-晚期(Coniacian-Campanian 期)"
    [these stratigraphic units should all be placed in the middle to late Late
    Cretaceous (Coniacian–Campanian)].

