name: Zuunbayan
rank: formation
period: [Early Cretaceous]
stages: [Hauterivian, Barremian, Aptian, Albian]
variants: [Dzunbain, Dzun Bayn]
references:
  - id: khand2000a
    notes: >
      The name covers two units this paper keeps apart: the Shinekhudag
      Formation, whose "fossil record indicates the age as
      Hauterivian-Barremian", was "the lower Zuunbayan Formation" of Vasilev
      and colleagues (1959), and the Khukhteeg Formation, "considered to be
      Aptian-Albian in age", was "the upper Zuunbayan Formation". Khosbayar
      (1996) separately established a Zuunbayan Formation in the Tamtsag
      basin, "correlative with the Shinekhudag and Khukhteeg Formations in the
      basins of Dornogobi", but "the description of them was not published".
  - id: arbour2015a
    notes: >
      Leads with this spelling and lists the others, "Zuunbayan (= Dzun Bayn,
      Dzunbayn, Dzunbain) Formation (roughly equivalent to the
      Khukhtyk/Huhteg Svita), Aptian-Albian", for the Shamosaurus holotype at
      Khamryn-Us in the southeastern Gobi.
  - id: tumanova2018a
    notes: >
      Gives "the Dzunbain Formation (Aptian–Albian or Upper Aptian–Lower
      Albian)" at the Khamryn-Us locality on the Barun-Khadyn-Khyar Stony
      Plateau, about 160 km southeast of Sain Shand, and resolves the
      Mongolostegus holotype horizon further as "Lower Cretaceous,
      Aptian–Albian, Khukhtykskii Horizon, Dzunbain Formation".
  - id: xing2024a
    notes: >
      Independently gives "Dzunbain Formation, Aptian-Albian" for
      Shamosaurus.
  - id: sohn1979a
    notes: >
      Dates it as Barremian under the spelling Dzunbain, giving the horizon of
      the type species of the ostracod Limnocypridea, L. abscondida, as
      "Dzunbain Formation (Barremian), SE Mongolia".
  - id: vanitterbeeck2004a
    notes: >
      Under the name Dzun Bayn suite, the unit ranges "in age from Hauterivian
      to Albian", after Khand and colleagues (2000). Its ostracod fauna is the
      closest match to that of the Dashuiguo Formation of Inner Mongolia,
      which on ostracod evidence makes that formation Barremian–Albian.
