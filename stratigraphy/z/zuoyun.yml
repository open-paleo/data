name: Zuoyun
rank: formation
period: [Early Cretaceous]
stages: [Albian]
description: "The Zuoyun Formation is an Early Cretaceous (estimated Albian) geologic formation in Shanxi Province, China. Dinosaur fossils attributable to the genus level are known from this formation. During the Early Cretaceous, the Zuoyun area was generally dominated by an arid subtropical environment. There was irregular alternation of arid and humid climate, during which catastrophic flooding resulted in thick proluvial fan conglomerate-mudstone deposits."
references:
  - id: jia2024a
    notes: >
      Describes Yanbeilong from "the late Early Cretaceous Zuoyun Formation
      (Albian in age) of Zuoyun County, Shanxi Province", and describes the
      unit as purple-red conglomerate with mudstone, beneath the Zhumapu
      Formation.
