name: Zuoyun
rank: formation
period: [Early Cretaceous]
stages: [Albian]
lithology: purple-red conglomerate and mudstone, with some gray-green mudstone
references:
  - id: jia2024a
    notes: >
      Describes Yanbeilong from "the late Early Cretaceous Zuoyun Formation
      (Albian in age) of Zuoyun County, Shanxi Province", and describes the unit
      as purple-red conglomerate with mudstone, beneath the Zhumapu Formation.
      Describes its rock: "The Zuoyun Formation predominantly exhibits a
      sequence of purple-red conglomerate interspersed with mudstone layers of
      diverse thicknesses, accompanied by inclusions of grey-green mudstone".
  - id: sánchez-fenollosa2025a
    notes: >
      Independently gives "Ya. ultimus (Albian, Zuoyun Formation, China)".
