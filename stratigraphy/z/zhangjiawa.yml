name: Zhangjiawa
rank: member
parent: Lufeng
period: [Late Triassic, Early Jurassic]
stages: [Norian, Rhaetian, Hettangian, Sinemurian]
variants: [Deep Red Beds, Dark Red Beds]
references:
  - id: irmis2004a
    notes: >
      Records the formalization and the informal names it replaced: the Lufeng
      "was informally divided into two subunits, the lower 'Dark Purple Beds'
      and upper 'Deep Red Beds' (Bien 1941). Fang et al. (2000) formalized
      these units into the Shawan Member and Zhangjiawa Member, respectively."
  - id: zhang2026b
    notes: >
      Describes it as the upper of the two, "which consists of dark red
      siltstone facies", above the dark purple Shawan Member.
  - id: luo1994a
    notes: >
      Argues that the upper faunal assemblage from the Dark Red Beds is "Early
      Jurassic in age, most probably Sinemurian, and definitely no older than
      Hettangian", agreeing with Sun and colleagues (1985) on the Early
      Jurassic age.
  - id: young1948a
    notes: >
      Gives the Lukousaurus yini horizon as "Upper Triassic Dark Red Beds of
      the Lower Lufeng Series".
  - id: fang2000a
    notes: >
      Erects the nomenclature this entry uses and places all of it in the
      Lower Jurassic: the formal definitions sit under a Lower Jurassic
      heading and carry J1 symbols, with the Triassic units below them. The
      paper names no international stage anywhere, and no Norian, Rhaetian or
      Upper Triassic appears in it, so the Triassic stages on this entry are
      not from here.
  - id: bien1941a
  - id: sun1985a
  - id: barrett2012a
    notes: >
      Takes the Dark Red Beds as Early Jurassic after Luo and Wu (1994),
      giving the horizon of the Pachysuchus imperfectus holotype as "Dark Red
      Beds, Lower Lufeng Formation (? Hettangian-Sinemurian, Lower Jurassic".
      Reidentifying that holotype as an indeterminate sauropodomorph removes
      the phytosaur record that had been used to argue a Late Triassic age for
      the Lower Lufeng Formation.
  - id: carroll1977a
    notes: >
      The Fulengia youngi holotype from Ta Ti in the Lufeng Basin comes from
      the "Dark Red Beds, Lower Lufeng series, Upper Triassic, equivalent to
      the Norian or Rhaetic of Europe".
  - id: huang2005a
    notes: >
      A magnetostratigraphic study of the Jurassic in the Lufeng area, and it
      places this unit and its neighbors in the Lower Jurassic: its
      stratigraphic table carries the Fengjiahe and the Lufeng formations
      both as J1, with the Lufeng's Zhangjiaba and Shawan members beneath
      that heading and the Triassic units below them. It correlates the upper
      part of the Lufeng Formation with the upper Toarcian, reads sites low
      in the section as "roughly" middle Sinemurian, and records that the
      interval "from the base of the Zhangjiaba Member through the Shawan
      Member has unstable rock magnetism with disordered directions", so the
      members themselves are the part it cannot correlate. It concludes that
      the transitional Yubacun Formation, between the Upper Triassic Zhaijie
      and the Lower Jurassic Lufeng, "should be assigned to the Jurassic
      System". It names no Norian, and its single Rhaetian is a polarity zone
      below this unit. Note it spells the member Zhangjiaba, a third form
      beside Zhangjia'ao and Zhangjiawa.
