name: Zhanghe
rank: formation
period: [Middle Jurassic]
stages: [Aalenian, Bajocian, Bathonian]
references:
  - id: xing2013a
    notes: >
      Gives "Zhanghe Formation, the lower Middle Jurassic (Aalenian-Bajocian".
  - id: zou2025a
    notes: >
      Independently gives "Zhanghe Formation, early Middle Jurassic,
      Aalenian/Bajocian".
  - id: zhen1985a
    notes: >
      Relays that Chen and colleagues (1982), "on the basis of non-marine
      invertebrates assigned a Middle Jurassic (Bajocian-Bathonian) age to the
      Zhanghe Formation", the name now used for the beds Young (1951) called
      the "upper Lufeng series" or "variegated beds".
  - id: chen1982a
  - id: young1951a
