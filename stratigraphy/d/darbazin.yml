name: Darbazin
rank: formation
period: [Late Cretaceous]
stages: [Coniacian, Santonian, Campanian]
variants: [Dabrazinskaya]
dispute:
  summary: >
    The Kazaklambia holotype sits at a contact, which is why two unit names
    compete for it. The Stratigraphic Dictionary of the USSR has the Darbazin
    lying "transgressively on the Syuksyuk Formation", and records that
    according to Belenky (1966) "most of the S[yuksyuk] Formation corresponds
    to the Dinosaur Horizon, and its top to the base of the Lower Darbazin
    subformation". Rozhdestvensky (1964) puts the skeleton in "the lower part
    of the Darbaza Suite" following Belenky (1961); Bell and colleagues (2013)
    follow that reading. So the disagreement is over which side of a boundary
    the specimen lies on, not over which name a single unit takes. The age of
    the lower subformation is contested in the same source: its author
    "referred the lower subformation to the Cenomanian-Turonian; R. F.
    Muzafarova ... to the Coniacian-Santonian".
references:
  - id: nessov1997a
    notes: >
      Places the unit mainly in the Campanian, and is explicit that its lowest
      beds are hard to separate from the underlying Syuksyuk. At the "Grey
      Mesa" exposure the lower part is "Gray sandstones of the lower
      Darbazinsky Subsuite, lower Campanian?-middle Campanian", and nearby
      "Vertebrate remains come from gray sandstones of the lower part of the
      Darbaza Formation (Early?-Middle Campanian)." At the Darbaza locality
      the same interval is read lower: "Syuksyukian Formation or, more likely,
      lower part of the Darbazinian Formation, Santonian or Santonian-Lower
      Campanian." At Kazgurt the attribution runs the other way, the bone bed
      going to the "Upper part of the Syuksyukian Formation (Suslov, 1987),
      Santonian (apparently erroneously, the bone-bearing level is sometimes
      noted in the lower part of the Darbazinian Formation)". So the base of
      the unit sits in the Santonian in one part of the Pritashkent Chuly and
      in the lower Campanian in another.
  - id: vereshchagin1979a
    notes: >
      The dictionary entry, headed "Upper Cretaceous". "Named after Darbaza
      Station, Pritashkent district, Central Asia. N. E. Minakova, 1941",
      subdivided into three subformations, the upper of which is the Temirchin
      Formation. "Belongs to the Senonian, the upper subformation possibly to
      the Campanian as well"; Minakova put the lower subformation in the
      Cenomanian–Turonian, Muzafarova in the Coniacian–Santonian. The station
      name is why the adjectival form is Darbazinskaya.
  - id: rozhdestvensky1964a
    notes: >
      Places the dinosaur-bearing band "to the lower part of the Darbaza
      Suite ... no later than the Upper Turonian", on Belenky's authority, and
      describes the Syuk-Syuk site as 45 km north of Tashkent.
  - id: bell2013a
    notes: >
      Gives the type locality as "rocks of the Dabrazinskaya Svita at the
      Syuk-Syuk well site, 45 km northwest of Tashkent (Uzbekistan) in
      southeastern Kazakhstan", and records that the age of the unit "is
      poorly constrained; however, it is generally regarded as Santonian in
      age". Prints the unit name with r and b transposed.
  - id: belenky1961a
  - id: belenky1966a
  - id: minakova1941a
  - id: muzafarova1963a
  - id: nessov1995a
    notes: >
      Rejects the two oldest readings by name in one sentence, while
      reassigning the bed they rest on. Of the Syuk-Syuk wells locality it
      gives "Lower part of the Darbazin Formation (Rozhdestvensky, 1964a).
      Syuk-Syuk Formation (Stratigraphic Dictionary, 1979), rather than the
      Beleutin Formation ... Upper Cretaceous, Santonian. The age was earlier
      regarded as younger than that for Jaxartosaurus at Alymtau ... and was
      dated as early Santonian ..., but it is not late Turonian (Belenky and
      Mirkamalova, 1965) nor Cenomanian - Turonian (Rozhdestvensky, 1964b;
      Rozhdestvensky and Khozatsky, 1965)."
