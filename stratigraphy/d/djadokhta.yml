name: Djadokhta
rank: formation
variants: [Djadochta, Djadohta, Bayan Dzak, Bayanzag]
period: [Late Cretaceous]
stages: [Campanian]
references:
  - id: shuvalov2000a
    notes: >
      Treats Bayanzag as another name for the unit: his Baruungoyot Svita
      "unites the red sediments of the Djadokhta Formation …, the Djadokhta
      Svita (Barsbold, 1972, 1983), or the Bayanzag Svita (Khand, 1974)".
  - id: khand2000a
    notes: >
      "Fossil criteria indicate that the formation is Campanian in age", with
      Loope and colleagues (1998) and Lillegraven and McKenna (1986) cited for
      "late Campanian-early Maastrichtian"; Table 2 sets it instead against
      the Coniacian. Barsbold (1972) had called the same unit the Bayan Dzak
      Formation, and Berkey and Morris (1927) spelled it Djadohta. Because "No
      physical contact between the Djadokhta and Baruungoyot Formations has
      yet been discovered" and Dashzeveg and colleagues (1995) blur the two
      faunas, the authors keep both units "with assignment pending further
      publications".
  - id: tsogtbaatar2014a
    notes: >
      Gives "Djadokhta Formation (Campanian)", and the Plesiohadros horizon at
      Alag Teeg as "Djadokhta Formation, ?Upper Campanian, Upper Cretaceous".
      It cautions that "it is unknown if a Campanian age applies to the entire
      formation throughout the region."
  - id: handa2012a
    notes: >
      Independently assigns the Üüden Sair beds to the "Djadokhta Formation
      (Campanian)" and describes them as eolian cross-laminated sandstone.
  - id: norell2016a
    notes: >
      The Zos Canyon beds "conformably underlie the Campanian Djadokhta
      Formation at Ukhaa Tolgod, Omnogov Aimag, Mongolia". For Ukhaa Tolgod
      itself, Dingus and colleagues (2008) "carefully documented the geology
      of the Ukhaa Tolgod beds and suggested a Campanian age for these
      sediments", which this paper takes to be "in general agreement with
      previous studies of this and other Djadokhta localities".
  - id: dingus2008a
    notes: >
      Faunas from the formation "have been assigned a Campanian–Early
      Maastrichtian age by Lillegraven and McKenna (1986) and Averianov
      (1997), based primarily on biochronologic interpretations". Pending
      further evidence the paper itself takes the vertebrate fauna at Ukhaa
      Tolgod to reflect a Campanian age, and on the superposition proposed by
      Dashzeveg and colleagues (2005) the Tugrugyin Shireh fauna "must be
      somewhat younger than that from Bayn Dzak, although the extent of this
      age difference is presently uncertain".
  - id: dashzeveg2005a
    notes: >
      Gradziński and colleagues (1977) "estimated the age of the Djadokhta
      Formation as ?upper Santonian and/or ?lower Campanian", one of a
      spread of biochronologic readings of the Bayn Dzak fauna running
      "from Cenomanian to Early Maastrichtian", among which "there has
      historically been little consensus". The paper's own
      magnetostratigraphy of the Flaming Cliffs section suggests
      deposition "during the rapid sequence of polarity changes in the
      late part of the Campanian ... between about 75 and 71 Ma", a
      correlation it says "cannot yet be certainly established". On the
      ICS chart v2024/12 the base of the Maastrichtian falls at about 88%
      of subchron C32n.2n, 72.2 Ma, so the recalibrated window could reach
      the earliest Maastrichtian; none of these sources dates the unit
      there. The Cenomanian to Early Maastrichtian it reviews is a spread
      of earlier authors' readings, not a range anyone assigned, and no
      source places the unit in the Turonian.
  - id: barsbold1983a
    notes: >
      Following Kielan-Jaworowska, "the age of the Djadokhtaskaya horizon,
      i.e. actually the Djadokhtaskaya Svita, is defined as within the
      Coniacian-Santonian interval", from a primitive mammal fauna in the
      lower part of the horizon that fills the gap between the Albian forms of
      the Trinity Sandstone and the Campanian of the Judith River beds. The
      upper part of the horizon, the Barungoyotskaya Svita, is taken as
      Campanian by correlation with North America, so that "the lower and
      upper age limits of the Djadokhtaskaya horizon are considered to
      correspond to the Lower Senonian and Campanian". This biochronological
      Coniacian-Santonian, like Gradziński and colleagues' (1977) ?upper
      Santonian, predates the magnetostratigraphy, which places the unit in
      the late Campanian.
  - id: berkey1927a
  - id: gradziński1977a
  - id: barsbold1972a
  - id: dashzeveg1995a
  - id: lillegraven1986a
  - id: loope1998a
  - id: marjanović2021a
    notes: >
      Reviews the Gobi sequence: on Dashzeveg and colleagues' polarity
      correlation "The Djadokhta Fm thus corresponds to the end of the
      Campanian, the Baruungoyot Fm should have at most the same age", and
      later work that "disagreed with the stratigraphy by Dashzeveg et al.
      (2005)" did not dispute "their dating". No contact between the
      Djadokhta and the Baruungoyot has been found.
  - id: tucker2025a
    notes: >
      Dates eggshell from the Teel Ulaan Chaltsai nest horizon by calcite
      U-Pb at "75.35 ± 0.74/1.5 Ma", read as near syndepositional but "to be
      treated as a maximum depositional age", in beds "lithostratigraphically
      coeval with the Baruungoyot Formation". It is the only radiometric age
      in this part of the sequence, and it bears on the Djadokhta only
      through that correlation; there is no radiometric date from the
      Djadokhta itself.
  - id: gale2020a
    notes: >
      Projects the base of the Maastrichtian "to about 88% in subchron
      C32n.2n", at 72.2 Ma.
