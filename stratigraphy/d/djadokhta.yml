name: Djadokhta
rank: formation
variants: [Djadochta, Djadohta, Bayan Dzak, Bayanzag]
lithology: red sandstone, siltstone and conglomerate
period: [Late Cretaceous]
stages: [Campanian]
references:
  - id: shuvalov2000a
    notes: >
      Treats Bayanzag as another name for the unit: his Baruungoyot Svita
      "unites the red sediments of the Djadokhta Formation …, the Djadokhta
      Svita (Barsbold, 1972, 1983), or the Bayanzag Svita (Khand, 1974)".
  - id: khand2000a
    notes: >
      Dates the formation as Campanian on "fossil criteria", and gives Bayan
      Dzak Formation as Barsbold's (1972) name for it.
  - id: tsogtbaatar2014a
    notes: >
      Gives "Djadokhta Formation (Campanian)", and the Plesiohadros horizon at
      Alag Teeg as "Djadokhta Formation, ?Upper Campanian, Upper Cretaceous".
      It cautions that "it is unknown if a Campanian age applies to the entire
      formation throughout the region."
  - id: handa2012a
    notes: >
      Independently assigns the Üüden Sair beds to the "Djadokhta Formation
      (Campanian)" and describes them as eolian cross-laminated sandstone.
  - id: norell2016a
    notes: >
      The Zos Canyon beds "conformably underlie the Campanian Djadokhta
      Formation at Ukhaa Tolgod, Omnogov Aimag, Mongolia". For Ukhaa Tolgod
      itself, Dingus and colleagues (2008) "carefully documented the geology
      of the Ukhaa Tolgod beds and suggested a Campanian age for these
      sediments", which this paper takes to be "in general agreement with
      previous studies of this and other Djadokhta localities".
  - id: dingus2008a
    notes: >
      Refers the Ukhaa Tolgod beds to the formation and takes their vertebrate
      fauna to reflect a Campanian age, pending further evidence.
  - id: dashzeveg2005a
    notes: >
      Divides the formation into the Bayn Dzak and Tugrugyin Members and, on the
      magnetostratigraphy of the Flaming Cliffs section, places it in "the late
      part of the Campanian".
  - id: barsbold1983a
    notes: >
      Dates the Djadokhtaskaya Svita "within the Coniacian-Santonian interval"
      by correlating its primitive mammal fauna with North America.
  - id: berkey1927a
  - id: gradziński1977a
  - id: barsbold1972a
  - id: dashzeveg1995a
  - id: lillegraven1986a
  - id: loope1998a
    notes: >
      Source of the lithology.
  - id: marjanović2021a
    notes: >
      Reviews the Gobi sequence: on Dashzeveg and colleagues' polarity
      correlation "The Djadokhta Fm thus corresponds to the end of the
      Campanian, the Baruungoyot Fm should have at most the same age", and
      later work that "disagreed with the stratigraphy by Dashzeveg et al.
      (2005)" did not dispute "their dating". No contact between the
      Djadokhta and the Baruungoyot has been found.
  - id: tucker2025a
    notes: >
      Dates eggshell from the Teel Ulaan Chaltsai nest horizon, in beds it
      correlates with the Baruungoyot Formation, at 75.35 ± 0.74/1.5 Ma by
      calcite U-Pb, a maximum depositional age.
  - id: gale2020a
    notes: >
      Projects the base of the Maastrichtian "to about 88% in subchron
      C32n.2n", at 72.2 Ma.
  - id: averianov1997a
    notes: >
      Cited by Dingus and colleagues (2008) for a Campanian to early
      Maastrichtian age for Djadokhta faunas.
  - id: khand1974a
    notes: >
      Cited by Shuvalov (2000) for the name Bayanzag Svita for the unit.
