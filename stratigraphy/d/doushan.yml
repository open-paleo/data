name: Doushan
rank: formation
parent: Qingshan
period: [Early Cretaceous]
stages: [Aptian]
references:
  - id: averianov2006a
    notes: >
      Places it "in the upper part of Qingshan Group in Shandong Province,
      China", gives radiometric dates of 119 to 121 Ma, and argues that "This
      time interval is within the Aptian ..., not Barremian, as was thought
      by Gao & Cheng (1999) with reference to the same stratigraphic charts".
  - id: sereno2010a
    notes: >
      Gives the Psittacosaurus sinensis type horizon as "Qingshan Group,
      Doushan Formation; Doushan village, 5 km northwest of Laiyang, Shandong
      Province".
  - id: gao1999a
    notes: >
      Gives the horizon of its lizard as "the Early Cretaceous Doushan
      Formation (Cheng et al., 1995), Qingshan Group exposed at the Doushan
      Village, approximately 5 km northwest of the city of Laiyang". The group
      "is subdivided into the Zhujiazhuang, Shuimutuo, and Doushan
      formations", with the Shuimutuo "underlying" the Doushan. "The Doushan
      Formation has been dated as 119–121 Ma (Hu et al., 1982)", and with the
      Shuimutuo's 122.6 Ma the dates are read as Barremian, citing Harland
      and colleagues (1990). The Aptian on that chart begins before 121 Ma, as
      Averianov and colleagues (2006) point out, and on the ICS chart v2024/12
      it begins at 121.4 Ma, so all three Doushan dates are Aptian. The
      Shuimutuo's 122.6 Ma is late Barremian on ICS and is a floor for the
      Doushan, not an age for it. The works cited here give no uncertainty for
      the K-Ar dates of Hu and colleagues (1982), and 121 Ma lies 0.4 Myr
      after the base of the Aptian.
  - id: averianov2000a
    notes: >
      Places the Doushan in the Qingshan Group with the Shuimutou Formation,
      which lies "between the Doushan and Zhujiazhuang formations, both
      containing remains of Psittacosaurus" and "has a K/Ar date 122 Ma (early
      Aptian; Cheng et al. 1995)". The early Aptian label belongs to the older
      chart; on the ICS chart v2024/12, 122 Ma is late Barremian and dates the
      underlying unit.
  - id: hu1982a
    notes: >
      The K-Ar dates of 119 to 121 Ma for the Doushan Formation that Gao and
      Cheng (1999) cite.
  - id: harland1990a
    notes: >
      The time scale on which Gao and Cheng (1999) read the Qingshan Group
      dates as Barremian.
