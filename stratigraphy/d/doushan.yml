name: Doushan
rank: formation
parent: Qingshan
period: [Early Cretaceous]
stages: [Barremian, Aptian]
references:
  - id: averianov2006a
    notes: >
      Places it "in the upper part of Qingshan Group in Shandong Province,
      China", gives radiometric dates of 119 to 121 Ma, and argues that "This
      time interval is within the Aptian ..., not Barremian, as was thought
      by Gao & Cheng (1999) with reference to the same stratigraphic charts".
  - id: sereno2010a
    notes: >
      Gives the Psittacosaurus sinensis type horizon as "Qingshan Group,
      Doushan Formation; Doushan village, 5 km northwest of Laiyang, Shandong
      Province".
