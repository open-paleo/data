name: Dongxing
rank: formation
period: [Late Jurassic]
stages: [Kimmeridgian]
references:
  - id: ren2024a
    notes: >
      Erects Jingia, since renamed Jingiella, the first mamenchisaurid from
      the unit, from "purplish-red calcareous silty mudstones on the upper
      portion of the Lower Member of the Dongxing Formation" in Guangxi.
      Plants, palynomorphs and bivalves from the Lower Member "indicate the
      Late Jurassic age", and "the sauropod-bearing horizon perhaps belongs to
      the middle Late Jurassic (Kimmeridgian?)".
  - id: mo2025a
    notes: >
      Records the same occurrence while describing the second eusauropod from
      Guangxi.
