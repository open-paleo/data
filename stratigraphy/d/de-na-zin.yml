name: De-na-zin
rank: member
parent: Kirtland
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
references:
  - id: sullivan1999a
    notes: >
      Gives the Nodocephalosaurus horizon as "Kirtland Formation (De-na-zin
      Member), Upper Cretaceous (Upper Campanian)", a member "now considered
      to be late Campanian in age". It takes the 40Ar/39Ar ash dates of
      Fassett and Steiner (1997) as bracketing the member "at 73 ma, which
      correlates to the middle late Campanian".
  - id: jasinski2026a
    notes: >
      Places it in the Kirtland succession: it "is lithologically distinct
      from the underlying upper Campanian Hunter Wash and Farmington members
      of the Kirtland Formation and the disconformable overlying upper
      Maastrichtian" unit.
  - id: wiersma2018a
    notes: >
      Places Nodocephalosaurus in "the upper-most Campanian–lower-most
      Maastrichtian ... De-na-zin Member of the Kirtland Formation", citing
      ages of 73.04 ± 0.25 Ma from Fassett and Steiner (1997) and 73.49 ± 0.25
      Ma from Fowler (2017).
  - id: fassett1997a
    notes: >
      Never names this member; its work is at formation level and above, on
      the magnetic polarity of the Fruitland, Kirtland and Ojo Alamo section.
      Any age it supplies reaches this entry through the parent.
  - id: fowler2017a
    notes: >
      Never names this member either, working at Kirtland Formation level. It
      is a recalibration paper, recomputing earlier argon dates against a
      corrected standard, so its figures may differ from the same authors'
      published values without disagreeing about the rocks.
