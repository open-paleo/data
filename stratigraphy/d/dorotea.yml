name: Dorotea
rank: formation
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
references:
  - id: novas2019a
    notes: >
      Gives "the Dorotea Formation (Upper Cretaceous, Campanian-Maastrichtian)"
      and treats it as "partially equivalent to" the Chorrillo Formation across
      the border in Argentina, using "the equivalent Dorotea beds" to argue the
      lower Chorrillo is "late Campanian, at least".
  - id: alarcón-muñoz2023a
    notes: >
      Gives the Gonkoken nanoi horizon as "late Campanian to early
      Maastrichtian, Dorotea Formation", in the Río de las Chinas Valley,
      Magallanes Region.
