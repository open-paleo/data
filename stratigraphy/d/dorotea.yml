name: Dorotea
rank: formation
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
lithology: greenish-gray and reddish-brown sandstone with conglomerate and
  siltstone lenses, and mudstone
references:
  - id: novas2019a
    notes: >
      Gives "the Dorotea Formation (Upper Cretaceous, Campanian-Maastrichtian)"
      and treats it as "partially equivalent to" the Chorrillo Formation across
      the border in Argentina, using "the equivalent Dorotea beds" to argue the
      lower Chorrillo is "late Campanian, at least".
  - id: alarcón-muñoz2023a
    notes: >
      Gives the Gonkoken nanoi horizon as "late Campanian to early
      Maastrichtian, Dorotea Formation", in the Río de las Chinas Valley,
      Magallanes Region. Describes its rock: "The Dorotea Formation mainly
      comprises greenish gray and reddish brown sandstones with abundant
      conglomerate and siltstone lenses, thin beds of sandy calcareous
      concretions, and mudstones of 900 to 1200 m thickness".
