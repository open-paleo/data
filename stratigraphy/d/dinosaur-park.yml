name: Dinosaur Park
rank: formation
parent: Belly River
period: [Late Cretaceous]
stages: [Campanian]
description: "The Dinosaur Park Formation is the uppermost member of the Belly River Group (also known as the Judith River Group), a major geologic unit in southern Alberta. It was deposited during the Campanian stage of the Late Cretaceous, between about 76.5 and 74.4 million years ago. It was deposited in alluvial and coastal plain environments, and it is bounded by the nonmarine Oldman Formation below it and the marine Bearpaw Formation above it. The Dinosaur Park Formation contains dense concentrations of dinosaur skeletons, both articulated and disarticulated, which are often found with preserved remains of soft tissues. The formation has been named after Dinosaur Provincial Park, a UNESCO World Heritage Site where the formation is well exposed in the badlands that flank the Red Deer River."
references:
  - id: eberth2005a
    notes: >
      The uppermost of the three Belly River formations, 70 m thick at the
      Park, overlying the Oldman across a regional disconformity.
  - id: eberth1993b
    notes: >
      Erects the formation, bounded at its base by a regional discontinuity,
      and dates it from a 76 Ma bentonite at the top of the underlying Oldman
      Formation and a 74 Ma bentonite in the basal Bearpaw Formation just
      above it: "These radiometric ages indicate a late Campanian age for the
      Dinosaur Park Formation in the Dinosaur Provincial Park area."
  - id: vanderreest2017a
    notes: >
      Gives the Latenivenatrix horizon as "upper Dinosaur Park Formation,
      upper Campanian, Upper Cretaceous".
  - id: tong2021a
    notes: >
      "Dinosaur Park Fm. Late Cretaceous (Campanian)" is the formation and age
      given for Judithemys sukhanovi of Dinosaur Provincial Park, Alberta, in
      a compiled table of macrobaenid carapace lengths.
  - id: brown2013a
    notes: >
      The uppermost formation of the Belly River Group, transgressive and
      overlain by the Bearpaw. Its lower part at Dinosaur Provincial Park is
      time-equivalent to the upper Oldman at Milk River, across a disconformity
      that is "time transgressive from north to south". Measures no date on the
      formation.
