name: Dinosaur Park
rank: formation
parent: Belly River
period: [Late Cretaceous]
stages: [Campanian]
references:
  - id: eberth2005a
    notes: >
      The uppermost of the three Belly River formations, 70 m thick at the
      Park, overlying the Oldman across a regional disconformity.
  - id: eberth1993b
    notes: >
      Erects the formation, bounded at its base by a regional discontinuity,
      and dates it from a 76 Ma bentonite at the top of the underlying Oldman
      Formation and a 74 Ma bentonite in the basal Bearpaw Formation just
      above it: "These radiometric ages indicate a late Campanian age for the
      Dinosaur Park Formation in the Dinosaur Provincial Park area."
  - id: vanderreest2017a
    notes: >
      Gives the Latenivenatrix horizon as "upper Dinosaur Park Formation,
      upper Campanian, Upper Cretaceous".
  - id: tong2021a
    notes: >
      "Dinosaur Park Fm. Late Cretaceous (Campanian)" is the formation and age
      given for Judithemys sukhanovi of Dinosaur Provincial Park, Alberta, in
      a compiled table of macrobaenid carapace lengths.
