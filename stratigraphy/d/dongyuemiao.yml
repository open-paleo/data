name: Dongyuemiao
rank: member
parent: Ziliujing
period: [Early Jurassic]
stages: [Sinemurian, Pliensbachian, Toarcian]
references:
  - id: yao2025a
    notes: >
      Gives a type locality with coordinates in the "Dongyuemiao Member of the
      Ziliujing Formation, Early Jurassic, late Sinemurian-Pliensbachian",
      and records that the member "is generally accepted to be of
      Pliensbachian age based on regional stratigraphy".
  - id: mcphee2016a
    notes: >
      Says the "Gongxianosaurus-bearing Dongyuemiao Member" has "been regarded
      as Toarcian in age".
  - id: allain2008a
    notes: >
      Places it in sequence: Gongxianosaurus "comes from the Early Jurassic
      Dongyuemiao Member of the Ziliujing Formation, which postdates the
      probably basal Jurassic Lufeng fauna".
  - id: dong1983a
    notes: >
      The lowest member of the Ziliujing Formation, above the Zhenzhuchong
      Formation, first named as the "Dongyuemiao limestones" by Tan and Li
      (1933) and later a member of the Ziliujing Group: 15 to 58 m of clays
      and silty sands with freshwater bivalve limestones dominated by
      Pseudocardinia. It yields Bishanopliosaurus, which Dong calls a "Liassic
      taxon".
  - id: tan1933a
