name: Densuș-Ciula
rank: formation
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
lithology: tuffaceous volcanogenic rocks, silty mudstone, sandstone, and
  conglomerate
references:
  - id: norman2004a
    notes: >
      Lists the Densus-Ciula Formation of Hunedoara, Romania, as late
      Maastrichtian in a table, writing the name without diacritics.
  - id: ősi2012a
    notes: >
      Independently lists Zalmoxes material from the Densus Ciula Formation as
      late Maastrichtian, in a table.
  - id: augustin2022a
    notes: >
      States that "the Upper Cretaceous deposits from the northwestern part of
      the basin", the Hațeg Basin, "have been assigned to the Densus-Ciula
      Formation of early to late Maastrichtian age".
  - id: magyar2026a
    notes: >
      Gives the Middle Member, the formation's main fossil-bearing level and
      the source of Kryptohadros, as "representing probably the upper part of
      upper Campanian to lower part of upper Maastrichtian", after Albert and
      colleagues (2025) and Csiki-Sava and colleagues (2016).
  - id: albert2025a
    notes: >
      From mapping, zircon U-Pb dates and micropaleontology, finds that the
      lower formation, "previously thought to be restricted to the
      Maastrichtian", "covers a good part of the upper Campanian as well".
  - id: csiki-sava2016a
    notes: >
      Dates a basal tuff of the lower member to 69.8 ± 1.3 Ma, "within the early
      Maastrichtian", and the upper member, once referred to the Paleogene, to
      "the later part of the late Maastrichtian".
  - id: vasile2011a
    notes: >
      Source of the lithology.
