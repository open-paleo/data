name: Demopolis Chalk
rank: formation
period: [Late Cretaceous]
stages: [Campanian]
description: "The Demopolis Chalk is a geological formation in North America, within the U.S. states of Alabama, Mississippi, and Tennessee. The chalk was formed by pelagic sediments deposited along the eastern edge of the Mississippi embayment during the middle Campanian age of the Late Cretaceous. Dinosaur and mosasaur remains are among the fossils that have been recovered from the Demopolis Chalk."
references:
  - id: carr2005a
    notes: >
      Describes Appalachiosaurus from "the Late Cretaceous (Middle Campanian)
      Demopolis Formation of Alabama".
  - id: longrich2024d
    notes: >
      Tabulates the same taxon as early Campanian in the formation.
