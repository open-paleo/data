name: Demopolis Chalk
rank: formation
period: [Late Cretaceous]
stages: [Campanian]
lithology: gray fossiliferous marl and light gray to white chalk
references:
  - id: carr2005a
    notes: >
      Describes Appalachiosaurus from "the Late Cretaceous (Middle Campanian)
      Demopolis Formation of Alabama".
  - id: longrich2024d
    notes: >
      Tabulates the same taxon as early Campanian in the formation.
  - id: puckett2005a
    notes: >
      Describes its rock: "grading, from bottom to top, gray, fossiliferous marl
      of the Tibbee Creek Member to light gray and white chalk of the Muldrow
      Member to gray, fossiliferous marl of the Bluffport Marl Member."
