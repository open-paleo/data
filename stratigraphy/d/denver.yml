name: Denver
rank: formation
period: [Late Cretaceous]
stages: [Maastrichtian]
references:
  - id: carpenter2002a
    notes: >
      The dedicated treatment of the Denver Basin dinosaurs, which are "the
      southernmost part of the Triceratops-dominated Maastrichtian or Lancian
      fauna" and are unevenly distributed among the basin's formations,
      suggesting ecological segregation. Sets the Laramie Formation beside it
      as the distal lowland of the same basin.
  - id: claessens2016a
    notes: >
      Gives Ornithomimus velox as from the "late Maastrichtian Denver
      Formation". The type site lies "high in the Denver Formation" and is
      radiometrically constrained to between 67 and 66.5 Ma, after Raynolds
      and colleagues (2007).
  - id: gilmore1920a
    notes: >
      Lists the Ornithomimus velox type as from the "Denver Formation, Upper
      Cretaceous".
  - id: raynolds2007a
    notes: >
      Does not name this formation either: its many mentions of Denver are
      the basin and the museum. It works in D1 and D2 synthems rather than in
      formations, and its Maastrichtians are one sentence about
      Cretaceous-Paleogene boundary indicators and three reference-list
      titles.
  - id: holtz1995a
    notes: >
      Marsh (1890) named Ornithomimus velox, and on it Ornithomimidae, from
      "the Upper Cretaceous portion of the Denver Formation of Colorado".
  - id: marsh1890b
    notes: >
      Does not name this formation. It places the Triceratops material in
      "the so-called Laramie formation" and in "the Ceratops beds of
      Wyoming". Whether that Laramie covers what is now this unit is a
      correlation rather than a reading, since the name was used broadly in
      1890.
