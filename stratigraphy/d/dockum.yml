name: Dockum
rank: group
period: [Late Triassic]
stages: [Carnian, Norian]
references:
  - id: cather2013a
    notes: >
      Restores the group in New Mexico against the Chinle Group scheme,
      designating "all Upper Triassic strata east of 105.5° W in New Mexico as
      part of the Dockum Group".
  - id: martz2013a
    notes: >
      Uses group rank with the Cooper Canyon Formation inside it and calls the
      group Upper Triassic, giving only the series.
  - id: nesbitt2007a
    notes: >
      Gives the same containment for the Bull Canyon Formation in Quay
      County, New Mexico.
  - id: lehman2005a
    notes: >
      Correlates the group's tetrapods "only" with the Carnian and Norian, puts
      the stage boundary near the Trujillo–Cooper Canyon contact, and places the
      Anton Chico Formation beneath the group.
  - id: long1994a
    notes: >
      Carnian to Norian, at group rank: "Redbeds of the Upper Triassic
      (Carnian to Norian) Dockum Group are widely exposed around the Southern
      High Plains of the Texas Panhandle and adjacent eastern New Mexico",
      with the Trujillo Sandstone and Cooper Canyon Formation "in the upper
      Dockum".
  - id: lucas1993b
  - id: galton1985c
    notes: >
      Calls it the "Dockum Formation (Middle Triassic)" in figure captions
      crediting Chatterjee (1985), for a Postosuchus maxilla and a poposaurid
      ilium from Texas.
  - id: chatterjee1985a
