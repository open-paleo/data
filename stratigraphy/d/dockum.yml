name: Dockum
rank: group
period: [Late Triassic]
stages: [Carnian, Norian]
references:
  - id: cather2013a
    notes: >
      Records that the group's rank was set aside rather than disproved: Lucas
      and colleagues "abandoned the Dolores Formation in Colorado and Dockum
      Group in eastern New Mexico, despite their unquestionable priority over
      the Chinle, and restricted the Dockum in Texas to the sole formation
      within the Chinle Group. Extension of the term Chinle to Colorado and
      Texas has not been widely accepted." It designates "all Upper Triassic
      strata east of 105.5° W in New Mexico as part of the Dockum Group".
  - id: martz2013a
    notes: >
      Uses group rank with the Cooper Canyon Formation inside it and calls the
      group Upper Triassic, giving only the series.
  - id: nesbitt2007a
    notes: >
      Gives the same containment for the Bull Canyon Formation in Quay
      County, New Mexico.
  - id: lehman2005a
    notes: >
      Dates the group in Texas by its tetrapods: "the stratigraphic
      distribution of Dockum tetrapods supports only correlation with strata
      equivalent to the Carnian and Norian Stages of Germany", and "The
      boundary between the Trujillo and the Cooper Canyon Formations
      approximates the stage boundary." A Rb/Sr age of about 210 Ma that Long
      and Lehman (1994) obtained from the upper part of the Cooper Canyon
      Formation makes it "possible that strata correlative with the Rhaetian
      Stage are indeed present in the Dockum Group", though the paper adds
      that no direct biostratigraphic correlation with the Rhaetian can be
      made. In eastern New Mexico "the Anton Chico Formation, underlies the
      Dockum Group", so the older Triassic unit there lies beneath the group
      rather than in it.
  - id: long1994a
    notes: >
      Carnian to Norian, at group rank: "Redbeds of the Upper Triassic
      (Carnian to Norian) Dockum Group are widely exposed around the Southern
      High Plains of the Texas Panhandle and adjacent eastern New Mexico",
      with the Trujillo Sandstone and Cooper Canyon Formation "in the upper
      Dockum".
  - id: lucas1993b
  - id: galton1985c
    notes: >
      Middle Triassic and formation rank, in figure captions crediting
      Chatterjee (1985): a Postosuchus maxilla and a poposaurid ilium both
      come "from Dockum Formation (Middle Triassic) of Texas, U.S.A.". The
      caption is in error: Postosuchus comes from the Post Quarry in the
      Cooper Canyon Formation, whose assemblage Martz and colleagues (2013)
      date as "possibly late Lacian or earliest Alaunian (late early Norian
      or earliest middle Norian), between 220 and 215 Ma". The Middle
      Triassic is not carried.
  - id: chatterjee1985a
