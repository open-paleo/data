name: Douira
rank: formation
parent: Kem Kem
period: [Late Cretaceous]
stages: [Cenomanian]
references:
  - id: ibrahim2020a
    notes: >
      Erects it as the upper of the two formations of the Kem Kem Group,
      above the Gara Sbaa Formation, and correlates it with Dubar's Aoufous
      Formation of the eastern High Atlas. Places it in the Cenomanian,
      99.0-93.5 Ma.
  - id: kellermann2025a
    notes: >
      Records where the Carcharodontosaurus neotype now sits, the skull from
      the "Kem Kem Beds" of Morocco being "now referred to the Douira
      Formation of the Kem Kem Group".
  - id: cau2025a
    notes: >
      Distinguishes it from the Gara Sbaa by locality, the Carcharodontosaurus
      neotype coming "from the Douira Formation (sensu ...) found at Gara
      Sbaa locality" while other material comes from the base of the Gara
      Sbaa Formation at Taouz.
