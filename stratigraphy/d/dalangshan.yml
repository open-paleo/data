name: Dalangshan
rank: formation
period: [Late Cretaceous]
stages: [Maastrichtian]
references:
  - id: pittman2020a
    notes: >
      Gives "the Maastrichtian Dalangshan Formation of Guangdong, southern
      China" for the Heyuannia type, and tabulates the formation as Late
      Cretaceous, Maastrichtian.
  - id: zheng2024a
    notes: >
      Gives the "Maastrichtian Dalangshan Formation, Guangdong Province" and
      reports large tyrannosauroid teeth from it, citing Xing and colleagues
      (2024).
  - id: lü2002a
    notes: >
      Gives the Heyuannia type locality as "A quarry at Huangsha village,
      Heyuan City, Guangdong Province. Dalangshan Formation, Late Cretaceous,?
      Maastrichtian", taking the age from the Bureau of Geology and Mineral
      Resources of Guangdong Province (1988).
  - id: chen1994a
    notes: >
      Its correlation chart for the southeastern coastal provinces (Fig. 4,
      described rather than quoted) sets "Dalangshan Fm." in the Guangdong
      column in part of the Maastrichtian, above the Nanxiong Formation in the
      Campanian. The text qualifies the chart: "the correspondence between the
      local Chinese stratigraphy and the European standard stages is
      approximate only."
  - id: xing2024b
    notes: >
      Places "the exposed Upper Cretaceous Dalangshan Formation in the Sanshui
      Basin", after the Guangdong Bureau (1988), and reports tyrannosauroid
      teeth from "the second member of the Dalangshan Formation, in the
      southeastern district". Following Zhang (1984), that member "is
      comparable to the Pingling Member of the Shanghu Formation of the
      Nanxiong Group, with both belonging to the Maastrichtian stage and
      having nearly identical ostracod faunas".
