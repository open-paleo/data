name: Dawangzhangzi
rank: member
parent: Yixian
period: [Early Cretaceous]
stages: [Hauterivian, Barremian, Aptian]
variants: [Dakangpu]
dispute:
  summary: >
    Most sources write "Bed" for this unit; Chang and colleagues (2017)
    write unit, dividing the formation "from bottom to top into the Lujiatun
    Unit, Lower Lava Unit, Jianshangou Unit, Upper Lava Unit, Dawangzhangzi
    Unit and Jingangshan Unit" while arguing from new dates that the
    accepted order needs reinterpreting.
references:
  - id: wang2001a
    notes: >
      States the equivalence of the two names outright -- "The Dakangpu Bed is
      the same as the Dawangzhangzi Bed of the middle Yixian Formation" --
      having written "Dakangpu member, the middle part of the Yixian Formation
      (comparable to Dawangzhangzi Bed)" in its own horizon line. That line
      dates the horizon by the Jurassic-Cretaceous boundary used:
      "Hauterivian, Early Cretaceous (based on a 135 Ma J/K boundary) or
      Barremian, Early Cretaceous (a 144 Ma J/K boundary)".
  - id: wu2012a
    notes: >
      Gives the Bolong horizon as the "Dakangpu Member (equivalent to the
      Dawangzhangzi Beds) of the middle part of Yixian Formation, Late
      Barremian–Early Aptian".
  - id: qiu2019a
    notes: >
      Gives "The Dakangpu Bed (same horizon to Dawangzhangzi Bed) of Yixian
      Formation" for the Xingtianosaurus locality.
  - id: jin2008a
    notes: >
      Correlates it across provinces, referring material "to the
      Dawangzhangzi Bed of the Yixian Formation in Lingyuan, western
      Liaoning".
  - id: chang2017a
    notes: >
      Places it sixth in the formation's succession and writes unit rank
      throughout.
