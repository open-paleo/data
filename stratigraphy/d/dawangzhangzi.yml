name: Dawangzhangzi
rank: member
parent: Yixian
period: [Early Cretaceous]
stages: [Barremian]
variants: [Dakangpu]
references:
  - id: wang2001a
    notes: >
      States the equivalence of the two names outright — "The Dakangpu Bed is
      the same as the Dawangzhangzi Bed of the middle Yixian Formation" — having written "Dakangpu member, the middle part of the Yixian Formation
      (comparable to Dawangzhangzi Bed)" in its own horizon line. That line
      dates the horizon by the Jurassic-Cretaceous boundary used:
      "Hauterivian, Early Cretaceous (based on a 135 Ma J/K boundary) or
      Barremian, Early Cretaceous (a 144 Ma J/K boundary)". The Hauterivian
      depends on a Jurassic-Cretaceous boundary GTS2020 does not use.
  - id: wu2012a
    notes: >
      Gives the Bolong horizon as the "Dakangpu Member (equivalent to the
      Dawangzhangzi Beds) of the middle part of Yixian Formation, Late
      Barremian–Early Aptian", an Aptian on an older placement of the stage's
      base; on GTS2020 the member's dated ages are Barremian.
  - id: qiu2019a
    notes: >
      Gives "The Dakangpu Bed (same horizon to Dawangzhangzi Bed) of Yixian
      Formation" for the Xingtianosaurus locality.
  - id: jin2008a
    notes: >
      Correlates it across provinces, referring material "to the
      Dawangzhangzi Bed of the Yixian Formation in Lingyuan, western
      Liaoning".
  - id: chang2017a
    notes: >
      Places it sixth in the formation's succession, dividing the formation
      "from bottom to top into the Lujiatun Unit, Lower Lava Unit, Jianshangou
      Unit, Upper Lava Unit, Dawangzhangzi Unit and Jingangshan Unit", and
      writes unit throughout where most sources write "Bed".
  - id: gao2008a
    notes: >
      Gives the horizon as "Lower Cretaceous (c. 125 Ma) (He et al. 2004),
      upper Yixian Formation, Dawangzhangzi Bed".
  - id: arbour2015a
    notes: >
      Gives "Dawangzhangzi Bed of Yixian Formation, about 122 Ma (Xu & Norell
      2006)", Barremian on GTS2020.
  - id: qiu2025a
    notes: >
      Gives "The Dawangzhangzi bed of Yixian Formation, Lower Cretaceous (125
      Ma, Barremian)".
  - id: gale2020a
    notes: >
      Puts the base of the Aptian at 121.4 Ma.
