name: Dinosaur Beds
period: [Late Jurassic, Early Cretaceous]
stages: [Barremian, Aptian]
references:
  - id: gomani2005a
    notes: >
      The dedicated treatment of Malawisaurus, whose material all comes from
      "the same area of the Dinosaur Beds (Dixey 1928 ...) near Mwakasyunguti,
      Karonga District, northern Malawi". The unit is "considered to be of
      Early Cretaceous (?Aptian) age, based on biochronology". The paper uses
      no rank word with the name.
  - id: gorscak2019a
    notes: >
      Sets it beside the Mtuka Member of the Galula Formation as the
      "nearby Aptian? Dinosaur Beds of Malawi", hedging the stage in the same
      way.
  - id: widlansky2018a
    notes: >
      Records that the Malawi Dinosaur Beds "have traditionally been assigned
      an Aptian age, based on the vertebrate fauna as well as a lacustrine
      ostracod assemblage", and that the ostracods, tentatively referred to
      Horcquia, "constrain the age of the Dinosaur Beds to Late Jurassic –
      Aptian, with strongest support for a Barremian – Aptian age", after
      Colin and Jacobs (1990). Notes that the beds "lack rigorous age
      constraint from radiometric dating" and that no magnetostratigraphic
      study of them has been made.
  - id: dixey1928a
    notes: >
      The describing account - "it remains in this paper to offer an account
      of the Dinosaur Beds themselves" - and it names no international stage
      anywhere, its whole chronology being a handful of mentions of the
      Cretaceous and the Jurassic. What it gives is geography and structure:
      the beds "lie within the Nyasan Rift Valley at an average distance of
      about 8 miles from the north-western shores of Lake Nyasa", running
      from Florence Bay north-westwards to the Songwe River, resting mostly
      on crystalline rocks and locally on upper Karroo mudstones.
  - id: colin1990a
