name: Dinosaur Beds
period: [Early Cretaceous]
stages: [Barremian, Aptian]
lithology: friable sandstone, sandy marl and clay
references:
  - id: gomani2005a
    notes: >
      The dedicated treatment of Malawisaurus, whose material all comes from
      "the same area of the Dinosaur Beds (Dixey 1928 ...) near Mwakasyunguti,
      Karonga District, northern Malawi". The unit is "considered to be of
      Early Cretaceous (?Aptian) age, based on biochronology". The paper uses
      no rank word with the name.
  - id: gorscak2019a
    notes: >
      Sets it beside the Mtuka Member of the Galula Formation as the
      "nearby Aptian? Dinosaur Beds of Malawi", hedging the stage in the same
      way.
  - id: widlansky2018a
    notes: >
      Relays the ostracod evidence of Colin and Jacobs (1990), which gives
      "strongest support" to a Barremian–Aptian age, and notes that no
      radiometric or magnetostratigraphic date exists.
  - id: dixey1928a
    notes: >
      The describing account: sets out the beds' extent and structure in the
      Nyasan Rift Valley, from Florence Bay northwest to the Songwe River, and
      names no stage. Source of the lithology.
  - id: colin1990a
