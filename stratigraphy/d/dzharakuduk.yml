name: Dzharakuduk
rank: formation
period: [Late Cretaceous]
stages: [Cenomanian]
references:
  - id: averianov2016a
    notes: >
      Distinguishes it from the Bissekty Formation, which crops out at the
      Dzharakuduk wells: the Urbacodon dentary comes from "the Dzharakuduk
      Formation (Upper Cretaceous: lower Cenomanian) at the Itemir locality
      (IT-01) in the Itemir-Dzharakuduk Depression of the central Kyzylkum
      Desert". So the name serves both a formation and a locality complex,
      and the two occurrences are at different places and different ages.
