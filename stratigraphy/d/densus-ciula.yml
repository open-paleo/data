name: Densuș-Ciula
rank: formation
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
references:
  - id: norman2004a
    notes: >
      Tabulates the "Densus-Ciula Formation (Hunedoara), Romania | late
      Maastrichtian", writing the name without diacritics.
  - id: ősi2012a
    notes: >
      Independently gives "Densus Ciula Formation; late Maastrichtian" for
      Zalmoxes material.
  - id: augustin2022a
    notes: >
      States that "the Upper Cretaceous deposits from the northwestern part of
      the basin", the Hațeg Basin, "have been assigned to the Densus-Ciula
      Formation of early to late Maastrichtian age".
  - id: magyar2026a
    notes: >
      Gives the Middle Member, the formation's main fossil-bearing level and
      the source of Kryptohadros, as "representing probably the upper part of
      upper Campanian to lower part of upper Maastrichtian", after Albert and
      colleagues (2025) and Csiki-Sava and colleagues (2016).
  - id: albert2025a
    notes: >
      A dedicated revision, and the strongest source on the entry for its
      older stage. Combining geological mapping with zircon uranium-lead
      geochronology, sedimentology and micropalaeontology, it finds that the
      shift from marine to continental deposition in the western Hateg Basin
      "occurred significantly earlier (by middle late Campanian) than
      hitherto considered, and that the lower Densus-Ciula Formation -
      previously thought to be restricted to the Maastrichtian - covers a
      good part of the upper Campanian as well". Its title carries the same
      conclusion, evidence of late Campanian to early Maastrichtian
      syntectonic deposition. So it names the reading it overturns, which
      several of this entry's other references still give.
  - id: csiki-sava2016a
    notes: >
      A basal tuff of the formation's 'lower' subunit, near Rachitova, yielded
      "a K-Ar radiometric age of 69.8 ± 1.3 Ma, placing it within the early
      Maastrichtian", and the Densuș beds, which lie unconformably above upper
      Campanian flysch, are correlated with it. The upper part of the 'middle'
      subunit, near Tuștea, "can be constrained to the early part of the late
      Maastrichtian", while the 'upper' member, long referred to the lower
      Paleogene until volcanoclastic material and vertebrates were found in
      it, is "now also considered to be Maastrichtian" and, from its position
      overlying the 'middle' member, "can be constrained to the later part of
      the late Maastrichtian". The General Berthelot and Crăguiș localities
      high in the succession are "probable late Maastrichtian", "although more
      precise age constraints are still needed".
