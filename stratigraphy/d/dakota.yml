name: Dakota
rank: formation
period: [Early Cretaceous, Late Cretaceous]
stages: [Albian, Cenomanian]
references:
  - id: eaton1960a
    notes: >
      Describes the Silvisaurus type from "the Terra Cotta clay member of the
      Dakota Formation (Cretaceous), Ottawa County, Kansas", the site
      standing "midway in the Terra Cotta clay member ... hence about one
      third of the way up in the Dakota (now classified as uppermost Lower
      Cretaceous in the Kansas region)". Reads the setting as a low-relief
      coastal plain under warm-temperate deciduous forest.
  - id: tykoski2023a
    notes: >
      Sets the same taxon among the sparse Cenomanian dinosaurs of Appalachia.
  - id: kirkland2016a
    notes: >
      Equates it with the Naturita Formation, writing of strata "below the
      Naturita Formation (= Dakota Formation)" in northeastern Utah; on the
      Colorado Plateau these strata "are Upper Cretaceous and not Lower
      Cretaceous" and so are referred to the Naturita. Cites Sprinkel and
      colleagues (2012) for a Dakota of "Albian-Cenomanian" age: at Dinosaur
      National Monument palynomorphs and microfaunas support "an Albian age
      for ... at least the lower part of the Dakota Formation", and its base
      yields "middle to late Albian palynomorphs". Elsewhere in Utah the
      Naturita (= Dakota) holds microvertebrate faunas of "middle to late
      Cenomanian (95 to 93 Ma)" age.
  - id: sprinkel2012a
    notes: >
      "The Dakota Formation yields middle to late Albian palynoflora in
      northeastern Utah", from the basal mudstone and shale unit, which
      "contains an assemblage of dinoflagellate cysts that indicate a marine
      to marginal marine environment of middle to late Albian age", and from
      the carbonaceous shale unit; a bentonite in the middle carbonaceous
      interval gives a U-Pb zircon age of 101.4 ± 0.4 Ma, compatible with a
      late Albian age for that interval. "To the south, the Dakota Formation
      is Cenomanian based on the contained molluscan assemblage ...
      radiometric ages ... and palynology."
