name: Dharmaram
rank: formation
period: [Late Triassic, Early Jurassic]
stages: [Norian, Rhaetian, Hettangian, Sinemurian]
references:
- id: kutty2007a
  notes: >
    Gives the upper Dharmaram Formation of the Pranhita-Godavari Valley as
    Lower Jurassic, Sinemurian, and relates its fauna to those of the
    Upper Elliot and Clarens Formations of southern Africa, the Kayenta
    Formation of Arizona and the Lower Lufeng Group of China.
- id: novas2010a
  notes: >
    Dates the lower Dharmaram Formation "?latest Norian–Rhaetian, Late
    Triassic", agreeing "with previous authors in considering the Lower
    Dharmaram Formation as probably latest Norian–Rhaetian in age"; the Norian
    end of that reading is hedged in the original.
- id: bandyopadhyay2010a
  notes: >
    Tabulates the formation as "late Late Triassic to early Early Jurassic",
    and gives its upper part, which yielded Lamplughsaura, as early Early
    Jurassic, Hettangian.
