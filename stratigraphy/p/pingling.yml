name: Pingling
rank: formation
period: [Late Cretaceous]
stages: [Maastrichtian]
lithology: purple-red sandstone and conglomerate, with mudstone and siltstone
  interbeds
references:
  - id: lü2005a
    notes: >
      Gives the type locality of Shixinggia as "Pingling Formation,
      Maastrichtian, Late Cretaceous", citing Zhao and colleagues (1991), and
      lists "Upper Cretaceous, Pingling Formation, Nanxiong Basin, Guangdong
      Province of southern China" among its key words.
  - id: an2015a
    notes: >
      Sets it among the oviraptorosaur-bearing units of China, with the
      Yuliangzi, Wulansuhai, Gaogou and Majiacun Formations.
  - id: zhao1991a
    notes: >
      Places the Cretaceous–Paleogene boundary at the formation's top, its
      contact with the Shanghu Formation in chron 29R, and dates the egg
      assemblage it shares with the Yuanpu to the Maastrichtian.
  - id: yan2007a
    notes: >
      Source of the lithology.
