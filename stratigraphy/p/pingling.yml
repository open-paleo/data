name: Pingling
rank: formation
period: [Late Cretaceous]
stages: [Maastrichtian]
references:
  - id: lü2005a
    notes: >
      Gives the type locality of Shixinggia as "Pingling Formation,
      Maastrichtian, Late Cretaceous", citing Zhao and colleagues (1991), and
      lists "Upper Cretaceous, Pingling Formation, Nanxiong Basin, Guangdong
      Province of southern China" among its key words.
  - id: an2015a
    notes: >
      Sets it among the oviraptorosaur-bearing units of China, with the
      Yuliangzi, Wulansuhai, Gaogou and Majiacun Formations.
  - id: zhao1991a
    notes: >
      Puts the top of the formation at the Cretaceous-Paleogene boundary: the
      contact "between the Pingling Formation and the Shanghu Formation,
      located in the upper part of geomagnetic polarity zone 29R, has been
      determined to be the K/T boundary", and that chron "includes the upper
      part of the Pingling Formation and the base of the Shanghu Formation".
      The paper names a stage only for the eggshell assemblage the formation
      shares with the Yuanpu, "dating to the latest Late Cretaceous
      (Maastrichtian)".
