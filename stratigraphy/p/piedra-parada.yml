name: Piedra Parada
rank: member
parent: La Amarga
period: [Early Cretaceous]
stages: [Barremian, Aptian]
references:
  - id: salgado2006b
    notes: >
      Barremian to early Aptian, "Barremian-lower Aptian" in the abstract and
      "upper Barremian–lower Aptian" in the type horizon line, the latter
      after Leanza and Hugo (1997). The member's deposits "form a monotonous
      fluvial sequence composed of sandstones, conglomerates, sandy mudstones,
      and siltstones" over a thickness of 110 to 190 m, and until the
      Zapalasaurus holotype "paleontological records from these levels had not
      been previously documented".
  - id: apesteguía2007a
    notes: >
      Names it the uppermost of the formation's three members, "from base to
      top): Puesto Antigual Member, Bañados de Caichigüe Member, and Piedra
      Parada Member".
  - id: carballido2010a
    notes: >
      Places Zapalasaurus in it, "from more modern levels (Piedra Parada
      Member), dated as Barremian-Aptian".
  - id: leanza1995a
    notes: >
      Erects the member: "Piedra Parada Member nom. nov.: Constitutes the
      upper section of Formation La Amarga. It transitionally covers the
      Banados de Caichigue Member and is covered in unconformity by the Lohan
      Cura Formation", with the Piedra Parada area as its type locality, where
      it is 109.40 m thick. No stage is given for the member.
