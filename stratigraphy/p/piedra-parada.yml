name: Piedra Parada
rank: member
parent: La Amarga
period: [Early Cretaceous]
stages: [Barremian, Aptian]
lithology: sandstone, conglomerate, sandy mudstone and siltstone
references:
  - id: salgado2006b
    notes: >
      Describes the member as "a monotonous fluvial sequence" 110 to 190 m
      thick, gives an age of "Barremiano-Aptiano inferior" that its wording
      does not tie to the member rather than the formation, and reports the
      Zapalasaurus holotype as its first fossil. Source of the lithology.
  - id: apesteguía2007a
    notes: >
      Names it the uppermost of the formation's three members, which it lists
      "(from base to top)" as "Puesto Antigual Member, Bañados de Caichigüe
      Member, and Piedra Parada Member".
  - id: carballido2010a
    notes: >
      Places Zapalasaurus in it, "from more modern levels (Piedra Parada
      Member), dated as Barremian-Aptian".
  - id: leanza1995a
    notes: >
      Erects the member: "Piedra Parada Member nom. nov.: Constitutes the
      upper section of Formation La Amarga. It transitionally covers the
      Banados de Caichigue Member and is covered in unconformity by the Lohan
      Cura Formation", with the Piedra Parada area as its type locality, where
      it is 109.40 m thick. The text gives the member no stage; its chart sets
      it in the upper third of the Barremian.
  - id: leanza1997a
    notes: >
      Charts the member in the upper third of the Barremian, with the rest of
      the formation.
  - id: leanza2003a
    notes: >
      Correlates the member with the Salina Member of the Huitrín Formation,
      which it dates "Aptiano inferior", and draws it in the Aptian. The age
      sentence under the member's heading names the Puesto Quiroga Member of
      the overlying Lohan Cura instead, a slip.
