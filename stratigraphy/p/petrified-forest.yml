name: Petrified Forest
rank: member
parent: Chinle
period: [Late Triassic]
stages: [Norian]
references:
  - id: nesbitt2007a
    notes: >
      Uses member rank under the Chinle and gives the age as "Norian, Late
      Triassic".
  - id: hunt1998a
    notes: >
      Uses formation rank, with the Blue Mesa and Painted Desert as its
      members.
  - id: long1995a
    notes: >
      Dates the lower and upper parts separately in the distribution of
      Chindesaurus bryansmalli: "Late Carnian: Lower Petrified Forest Member,
      Chinle Formation; Apache County, Arizona" and "Early Norian: upper
      Petrified Forest Member, Chinle Formation". Both labels follow the
      calibration before the Norian was lengthened; the member's dated ages
      are Norian.
  - id: marsh2019a
    notes: >
      Brackets a locality high in the member between "two maximum deposition
      ages resulting from U-Pb detrital zircon analyses within the Black Forest
      bed (209.926 ± 0.072 Ma) and the Petrified Forest Member–Sonsela Member
      contact" (213.124 ± 0.069 Ma), both Norian.
  - id: nesbitt2015a
    notes: >
      "Given that the base of the Blue Mesa Member has been radiometrically
      dated to ~223 Ma", the lowest part of the unit in the formation-rank
      scheme of Hunt and colleagues (1998) is also Norian.
  - id: lucas1992a
    notes: >
      In the Chama basin the unit "includes three age-diagnostic taxa, the
      aetosaur Typothorax coccinarum and the phytosaurs Pseudopalatus
      pristinus and P. buceros", which "are restricted to strata of
      early-middle Norian age"; palynomorphs from it likewise "indicate a
      Norian age for the Petrified Forest and Rock Point Formations". Farther
      south, a large metoposaurid in the lower part of the unit near San
      Ysidro suggests that part is correlative with the Salitral, whose
      aetosaur Longosuchus is "restricted to late Carnian strata". Uses
      formation rank within the Chinle Group, and a figure caption gives
      "Upper Triassic Petrified Forest Formation".
  - id: martz2017a
    notes: >
      Treats it as a member of the Chinle Formation, above the Sonsela and below
      the Owl Rock Member. Puts the member in the Revueltian, which "extends from about 215 to
      207 Ma ... during the Alaunian and Sevatian (middle and late Norian)", with
      a date of 209.926 Ma at the Black Forest Bed and about 207.8 Ma from just
      below the lowermost Owl Rock carbonates (Ramezani and colleagues, 2011). Elsewhere
      it extends the Revueltian "to the Rhaetian" on the timescales of Muttoni
      and colleagues (2004) and Hüsing and colleagues (2011); on the ICS chart
      v2024/12
      (Rhaetian base 205.7 Ma) these dates are Norian.
  - id: cather2013a
    notes: >
      Uses the "Petrified Forest Member" of the Chinle Formation, between the
      Sonsela and Owl Rock members.
  - id: srivastava2026a
    notes: >
      At Ghost Ranch, New Mexico, the member lies below the informal 'siltstone
      member', and Hayden Quarry 2 in it "has been isotopically dated to c. 211.9
      ± 0.7 Ma to the upper Norian Stage (Irmis et al. 2007, 2011)", a date
      relayed rather than measured here.
  - id: ramezani2011a
  - id: irmis2007a
  - id: irmis2011a
  - id: muttoni2004a
  - id: hüsing2011a
