name: Portland
rank: formation
period: [Early Jurassic]
stages: [Hettangian, Sinemurian, Pliensbachian, Toarcian]
references:
  - id: kent2017a
    notes: >
      Dates the lower Portland by its own astrochronology, anchored by U-Pb on
      the oldest basalt: the Park River Member base at 200.69 Ma and the S.
      Hadley Falls Member base at 200.29 Ma, with the Hettangian–Sinemurian
      boundary at 199.5 Ma higher in the formation, near magnetozone H25r.
  - id: olsen2002z
    notes: >
      A meeting abstract: has the Hettangian cover "the uppermost New Haven
      through lower Portland formations" and the reversed zones in the upper
      part of the lower Portland reach the Sinemurian.
  - id: hendrickx2022a
    notes: >
      Gives "Portland Formation, Hettangian-Sinemurian; Lower Jurassic", for a
      crouching-theropod trace, after Gierlowski-Kordesch and Rust (1994), a
      work on the East Berlin Formation.
  - id: gierlowski-kordesch1994a
  - id: galton2004a
    notes: >
      Tabulates Anchisaurus polyzelus from the Portland Formation of
      Connecticut and of Massachusetts as "Pliensbachian or Toarcian", and
      gives Ammosaurus major as "from the Pliensbachian or Toarcian of
      Connecticut".
  - id: tykoski2004a
    notes: >
      Tabulates "?Portland Formation (Massachusetts)" as
      "Pliensbachian-Toarcian" and hedges the assignment itself.
  - id: olsen1984a
    notes: >
      Places the formation in the Early Jurassic: its protosuchians and
      anchisaurids "are associated with palynoflorules ranging in age from
      Pliensbachian to Toarcian".
