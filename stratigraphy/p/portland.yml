name: Portland
rank: formation
period: [Early Jurassic]
stages: [Hettangian, Sinemurian, Pliensbachian, Toarcian]
references:
  - id: hendrickx2022a
    notes: >
      Gives "Portland Formation, Hettangian-Sinemurian; Lower Jurassic", for a
      crouching-theropod trace from Massachusetts.
  - id: galton2004a
    notes: >
      Tabulates Anchisaurus polyzelus from the Portland Formation of
      Connecticut and of Massachusetts as "Pliensbachian or Toarcian", and
      gives Ammosaurus major as "from the Pliensbachian or Toarcian of
      Connecticut".
  - id: tykoski2004a
    notes: >
      Tabulates "?Portland Formation (Massachusetts)" as
      "Pliensbachian-Toarcian" and hedges the assignment itself.
  - id: olsen1984a
    notes: >
      The protosuchian crocodiles and anchisaurid prosauropods it shares with
      the upper Stormberg assemblage "are associated with palynoflorules
      ranging in age from Pliensbachian to Toarcian", and K/Ar dates of
      194-185 Ma from the basalt flows underlying the formation indicate "an
      Early Jurassic age for the basalts ... and overlying beds". A figure
      caption gives the type of Grallator cursorius as from the "Portland
      Formation (Sinemurian - Toarcian) of the Hartford Basin, Massachusetts".
