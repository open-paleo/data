name: Portland
rank: formation
period: [Early Jurassic]
stages: [Hettangian, Sinemurian, Pliensbachian, Toarcian]
description: "The Portland Formation is a geological formation in Connecticut and Massachusetts in the northeastern United States. It dates back to the Early Jurassic period. The formation consists mainly of sandstone laid down by a series of lakes (in the older half of the formation) and the floodplain of a river (in the younger half). The sedimentary rock layers representing the entire Portland Formation are over 4 kilometers (2.5 mi) thick and were formed over about 4 million years of time, from the Hettangian age (lower half) to the late Hettangian and Sinemurian ages (upper half)."
references:
  - id: hendrickx2022a
    notes: >
      Gives "Portland Formation, Hettangian-Sinemurian; Lower Jurassic", for a
      crouching-theropod trace from Massachusetts.
  - id: galton2004a
    notes: >
      Tabulates Anchisaurus polyzelus from the Portland Formation of
      Connecticut and of Massachusetts as "Pliensbachian or Toarcian", and
      gives Ammosaurus major as "from the Pliensbachian or Toarcian of
      Connecticut".
  - id: tykoski2004a
    notes: >
      Tabulates "?Portland Formation (Massachusetts)" as
      "Pliensbachian-Toarcian" and hedges the assignment itself.
  - id: olsen1984a
    notes: >
      The protosuchian crocodiles and anchisaurid prosauropods it shares
      with the upper Stormberg assemblage "are associated with
      palynoflorules ranging in age from Pliensbachian to Toarcian", and
      K/Ar dates of 194-185 Ma from the basalt flows underlying the
      formation indicate "an Early Jurassic age for the basalts ... and
      overlying beds". A figure caption gives the type of Grallator
      cursorius as from the "Portland Formation (Sinemurian - Toarcian) of
      the Hartford Basin, Massachusetts". The 194 to 185 Ma figures are
      K/Ar dates from before recalibration and do not set the formation's
      lower limit.
