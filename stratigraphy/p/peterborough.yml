name: Peterborough
rank: member
parent: Oxford Clay
period: [Middle Jurassic]
stages: [Callovian]
references:
  - id: ruiz-omeñaca2007a
    notes: >
      Records the renaming that created it: "Cox et al. (1992) renamed the
      lower Oxford Clay the Peterborough Member of the Oxford Clay Formation".
      Dates the Callovosaurus horizon as "Peterborough Member (=lower Oxford
      Clay), Middle Jurassic, middle Callovian (Jason Zone)", noting that the
      specimen has also been listed as upper or middle-upper Callovian.
  - id: barron2012a
    notes: >
      Treats its limits, downgrading a unit that had been given member status
      to a bed because "it is a natural part of the Peterborough Member - it
      contains typical Peterborough lithologies in places and passes into it
      laterally in a rather indefinite way".
