name: Peterborough
rank: member
parent: Oxford Clay
period: [Middle Jurassic]
stages: [Callovian]
description: "The Peterborough Member is a member of the Oxford Clay Formation in England. A fossiliferous organic-rich mudstone, it makes up the formation's lower facies, whose rocks are commonly known as lower Oxford Clay. The top of the Lower Oxford Clay shows a lithological change, where fissile shale changes to gray mudstone. Dinosaur eggs are stratigraphically present in the Lower Oxford Clay. Geographically, they are located in Cambridgeshire, England."
references:
  - id: ruiz-omeñaca2007a
    notes: >
      Records the renaming that created it: "Cox et al. (1992) renamed the
      lower Oxford Clay the Peterborough Member of the Oxford Clay Formation".
      Dates the Callovosaurus horizon as "Peterborough Member (=lower Oxford
      Clay), Middle Jurassic, middle Callovian (Jason Zone)", noting that the
      specimen has also been listed as upper or middle-upper Callovian.
  - id: barron2012a
    notes: >
      Treats its limits, downgrading a unit that had been given member status
      to a bed because "it is a natural part of the Peterborough Member - it
      contains typical Peterborough lithologies in places and passes into it
      laterally in a rather indefinite way".
  - id: cox1992a
    notes: >
      Cited by Ruiz-Omeñaca and colleagues (2007) for the renaming of the
      lower Oxford Clay as the Peterborough Member.
