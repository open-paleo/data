name: Penarth
rank: group
period: [Late Triassic]
stages: [Rhaetian]
description: "The Penarth Group is a Rhaetian age (Triassic) lithostratigraphic group (a sequence of rock strata) which is widespread in Britain. It is named from the seaside town of Penarth near Cardiff in south Wales where strata of this age are exposed in coastal cliffs southwards to Lavernock Point. This sequence of rocks was previously known as the Rhaetic or Rhaetic Beds."
references:
  - id: evans2025a
    notes: >
      Gives the group and its Rhaetian age with the Lilstock Formation inside
      it.
  - id: martill2016a
    notes: >
      Gives the cliff on the east side of Lavernock Point as exposing "the top
      of the Late Triassic Penarth Group", and uses the same containment for
      the Langport Member of the Lilstock Formation there.
