name: Pen
rank: formation
period: [Late Cretaceous]
stages: [Santonian, Campanian]
references:
  - id: lehman2024a
    notes: >
      Treats it as intertonguing with the Aguja Formation across the Big Bend
      region of west Texas, the two together recording four major
      depositional intervals, and cites work on the "Campanian Aguja and Pen
      Formations, south Texas".
  - id: rivera-sylva2018a
    notes: >
      Names Acantholipan gonzalezi on CPC 272 and gives its horizon as "the
      Pen Formation (Upper Cretaceous, Santonian)", at the Los Primos locality
      south of San Miguel, Coahuila.
  - id: rivera-sylva2011a
    notes: >
      Gives the horizon of nodosaurid specimen B (CPC 272) as "the shale of
      the marine member of the Pen Formation (Campanian), south of San Miguel,
      Coahuila, Mexico".
