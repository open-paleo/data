name: Puesto Antigual
rank: member
parent: La Amarga
period: [Early Cretaceous]
stages: [Barremian]
lithology: coarse-grained sandstone with conglomerate lenses, and intercalated
  pelite and siltstone
references:
  - id: leanza1995a
    notes: >
      Names the member, which "covers the Agrio Formation in unconformity"
      (translated), with its type locality at Puesto Antigual, and charts all
      three La Amarga members in the Barremian.
  - id: gallina2016a
    notes: >
      Gives "Puesto Antigual Member of the La Amarga Formation, Barremian,
      Lower Cretaceous".
  - id: pereda-suberbiola2013a
    notes: >
      Gives the stegosaur material as from the "basal Puesto Antigual Member, La
      Amarga Formation, Lower Cretaceous, Barremian–lower Aptian", citing Leanza
      and colleagues (2004).
  - id: leanza2004a
    notes: >
      Dates the La Amarga Formation as a whole "Barremian–Early Aptian" and
      gives the Puesto Antigual Member a thickness and lithology but no age.
  - id: leanza1997a
    notes: >
      Describes the member at its type locality north of cerro China Muerta:
      28.90 m of fluvial and lake beds on the Agrio Formation, yielding
      Amargasaurus cazaui.
  - id: salgado2006b
    notes: >
      The basal member of the formation, about 30 to 40 m of medium to coarse
      sandstones and mudstones laid down by high-energy rivers, overlain by
      the Bañados de Caichigüe Member.
  - id: leanza2003a
    notes: >
      Source of the lithology.
