name: Puesto Antigual
rank: member
parent: La Amarga
period: [Early Cretaceous]
stages: [Barremian]
references:
  - id: leanza1995a
    notes: >
      Names the member, "Covers the Agrio Formation in unconformity and passes
      gradually to the Bañados de Caichigüe Member", with its type locality at
      Puesto Antigual. The paper's proposed stratigraphic chart for the region
      (printed page 31) places all three La Amarga members in the Barremian,
      with a hiatus at the base of the Aptian below the Lohan Cura Formation.
      The text gives the formation "the upper Hauterivian / Barremian age
      usually assigned" to it.
  - id: gallina2016a
    notes: >
      Gives "Puesto Antigual Member of the La Amarga Formation, Barremian,
      Lower Cretaceous".
  - id: pereda-suberbiola2013a
    notes: >
      Gives the stegosaur material as from the "basal Puesto Antigual Member,
      La Amarga Formation, Lower Cretaceous, Barremian-lower Aptian", after
      Leanza and colleagues (2004). That is the formation's range relayed
      onto the member: Leanza and colleagues give it for the La Amarga as a
      whole and no age for this member, and the paper cites nothing else for
      it. The member's own source, Leanza and Hugo (1995), puts it in the
      Barremian.
  - id: leanza2004a
    notes: >
      Dates the parent formation and not this member. Under the heading for
      the La Amarga Formation the paper says that "this unit may be regarded
      as Barremian-Early Aptian in age", on "basin analysis, stratigraphical
      relationships and tectonosedimentary aspects" relayed from Leanza and
      Hugo, and only then introduces the three subunits of which this is the
      lowest. No member-level age is given here, and the formation's range is
      not biostratigraphic or radiometric.
