name: Popo Agie
rank: formation
period: [Middle Triassic, Late Triassic]
stages: [Carnian]
references:
  - id: lovelace2025a
    notes: >
      Describes the "oldest known equatorial dinosaur-bearing assemblage
      (mid-late Carnian Popo Agie FM, Wyoming, USA)", and reports its
      dinosauromorphs and detrital ages from "the Late Triassic (Carnian) Popo
      Agie Formation of Wyoming, USA".
  - id: martínez2025a
    notes: >
      Cites the same work for the mid-late Carnian age of the unit.
  - id: galton1985c
    notes: >
      Assigns the unit to the Middle Triassic in a figure caption,
      illustrating a Poposaurus ilium "from Popo Agie Beds (Middle Triassic)
      of Wyoming, U.S.A." after Galton (1977).
  - id: galton1977b
