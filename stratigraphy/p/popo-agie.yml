name: Popo Agie
rank: formation
period: [Late Triassic]
stages: [Carnian]
description: "The Popo Agie Formation is a Triassic geologic formation that crops out in western Wyoming, western Colorado, and Utah. It was deposited during the Late Triassic in fluvial (river) and lacustrine (lake) environments that existed across much of what is now the American southwest. The earliest known dinosaur of the Laurasian continent, Ahvaytum, is discovered from the Popo Agie Formation. Dinosaurian trace fossils and fragmentary fossils of prehistoric reptiles and amphibians, including pseudosuchian reptiles and temnospondyl amphibians, have also been reported from this formation."
references:
  - id: lovelace2025a
    notes: >
      Describes the "oldest known equatorial dinosaur-bearing assemblage
      (mid-late Carnian Popo Agie FM, Wyoming, USA)", and reports its
      dinosauromorphs and detrital ages from "the Late Triassic (Carnian) Popo
      Agie Formation of Wyoming, USA".
  - id: martínez2025a
    notes: >
      Cites the same work for the mid-late Carnian age of the unit.
  - id: galton1985c
    notes: >
      Assigns the unit to the Middle Triassic in a figure caption,
      illustrating a Poposaurus ilium "from Popo Agie Beds (Middle
      Triassic) of Wyoming, U.S.A." after Galton (1977). The caption
      repeats an older label; the unit is now dated Carnian, and the
      Middle Triassic does not date it.
  - id: galton1977b
