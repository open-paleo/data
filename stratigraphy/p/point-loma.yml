name: Point Loma
rank: formation
period: [Late Cretaceous]
stages: [Campanian]
references:
  - id: arbour2015a
    notes: >
      Gives the Aletopelta holotype locality in Carlsbad, California, SDNHM
      Locality 3392, and the horizon as "Point Loma Formation, upper
      Campanian".
  - id: ford2000a
    notes: >
      Independently gives "the Point Loma Formation, late Campanian, Late
      Cretaceous".
  - id: nilsen1981a
    notes: >
      Places the formation in the Rosario Group of the San Diego area, which
      Kennedy and Moore (1971) "subdivided ... in ascending order into the
      Lusardi, Point Loma, and Cabrillo Formations", with the Point Loma "83 m
      thick in its type section along the cliff at the southern end of the
      Point Loma Peninsula". Gives "a late Campanian–early Maestrichtian age"
      from San Diego megafossils (Sundberg, 1979), for the Point Loma and the
      overlying Cabrillo together rather than for this formation alone.
  - id: ford2001a
    notes: >
      Gives the Aletopelta type locality as "Point Loma Formation, Upper
      Campanian (Upper Cretaceous)", on College Boulevard in Carlsbad, SDNHM
      Locality 3392.
  - id: kennedy1971a
  - id: sundberg1979a
