name: Point Loma
rank: formation
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
lithology: siltstone and sandstone
references:
  - id: arbour2015a
    notes: >
      Gives the Aletopelta holotype locality in Carlsbad, California, SDNHM
      Locality 3392, and the horizon as "Point Loma Formation, upper
      Campanian".
  - id: ford2000a
    notes: >
      Independently gives "the Point Loma Formation, late Campanian, Late
      Cretaceous".
  - id: nilsen1981a
    notes: >
      Places the formation in the Rosario Group of the San Diego area, between
      the Lusardi and Cabrillo formations, with an 83 m type section at the
      southern end of the Point Loma Peninsula.
  - id: ford2001a
    notes: >
      Gives the Aletopelta type locality as "Point Loma Formation, Upper
      Campanian (Upper Cretaceous)", on College Boulevard in Carlsbad, SDNHM
      Locality 3392.
  - id: kennedy1971a
    notes: >
      Names the formation, with its type section at the southern end of the
      Point Loma Peninsula, and reports lower Maastrichtian foraminifera
      "about 30 m below the base of the Cabrillo Formation", after Sliter
      (1968). Source of the lithology.
  - id: sundberg1979a
  - id: sliter1968a
    notes: >
      Places the uppermost members of the La Jolla section, which Kennedy and
      Moore (1971) put in this formation, in his early Maastrichtian
      Rugoglobigerina rugosa Zone, and the upper beds at Point Loma itself in
      the latest Campanian, from his own foraminifera; he refers both to the
      Rosario Formation.
