name: Puesto Quiroga
rank: member
parent: Lohan Cura
period: [Early Cretaceous]
stages: [Aptian, Albian]
references:
  - id: carballido2012a
    notes: >
      Gives the Comahuesaurus horizon as the "Northern slope of Cerro Aguada
      del León" in the "La Picasa area, South Central Neuquén", "Lohan Cura
      Formation, Puesto Quiroga Member", and records that "The age of this
      member is considered as Aptian-Albian ..., and therefore has been
      correlated with the Rayoso Formation of the Bajada del Agrio Group in
      the central area of the basin".
  - id: wilson2015a
    notes: >
      Tabulates the same occurrence as "Lohan Cura (Puesto Quiroga M.)" at
      "Aptian/Albian".
  - id: salgado2004a
    notes: >
      Gives "the Lower Cretaceous (Aptian-Albian) Puesto Quiroga Member of the
      Lohan Cura Formation" and places its rebbachisaurid material in "the
      middle-upper section of the Puesto Quiroga Member, the basalmost unit of
      the Lohan Cura Formation".
  - id: leanza1995a
    notes: >
      Erects it as the "Puesto Quiroga Member nom. nov." (translated), the
      lower of the formation's two members, with its type locality on the
      northern slope of Cerro Lohan Cura a few meters above the Puesto Quiroga
      post, where it is 85 m thick: a 4 m basal conglomerate, sandstones and
      conglomerates, then 57 m of red and purple mudstones that are the
      "Facies China Muerta" of Roll (1939). The paper's chart places the
      member in the Aptian.
  - id: leanza1999a
    notes: >
      Gives the member as 85 m: a 4 m basal conglomerate, 24 m of red
      conglomeratic sandstones and siltstones, and 57 m of shales that belong
      "to the 'China Muerta Facies' of Roll (1939)".
  - id: roll1939a
