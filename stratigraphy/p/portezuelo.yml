name: Portezuelo
rank: formation
parent: Neuquén
period: [Late Cretaceous]
stages: [Turonian, Coniacian]
lithology: yellowish sandstone and red and green claystone, with minor
  conglomerate
references:
  - id: baiano2022a
    notes: >
      Gives "Portezuelo Formation (Turonian–Coniacian, Upper Cretaceous ...)"
      for the Elemgasem holotype, which comes from a red mudstone level 36 m
      above the base of the unit at Sierra del Portezuelo.
  - id: porfiri2024a
    notes: >
      Uses it as the older term of a stratigraphic contrast, against
      "the stratigraphically younger, larger-bodied Austroraptor cabazai from
      the Campanian-Maastrichtian".
  - id: calvo2004b
    notes: >
      Places the new Megaraptor specimen in red claystones at the top of the
      formation, which its abstract dates "Upper Turonian-Lower Coniacian".
      Source of the lithology.
  - id: leanza1999a
  - id: leanza2001a
  - id: garrido2010a
    notes: >
      Adopts a late Turonian to early Coniacian age for the formation, which has
      no absolute dates, and erects the Los Bastos and Sierra Barrosa formations
      from beds once included in it.
  - id: hugo2001a
    notes: >
      Attributes the formation to the upper Turonian, within a Río Neuquén
      Subgroup of upper Turonian to Coniacian age.
  - id: cruz1989a
    notes: >
      Treats the Portezuelo as the sandstone member of a Río Neuquén Formation,
      within a framework of nine depositional sequences for the Neuquén Group.
  - id: leanza2004a
  - id: herreroducloux1938a
    notes: >
      Cited by Garrido (2010) for the original scheme that called the Sierra
      Barrosa beds 'Upper Portezuelo'.
  - id: herreroducloux1939a
    notes: >
      Cited by Garrido (2010) for the original scheme that called the Sierra
      Barrosa beds 'Upper Portezuelo'.
