name: Portezuelo
rank: formation
parent: Neuquén
period: [Late Cretaceous]
stages: [Turonian, Coniacian, Santonian]
references:
  - id: baiano2022a
    notes: >
      Gives "Portezuelo Formation (Turonian–Coniacian, Upper Cretaceous" for
      the Elemgasem holotype, which comes from a red mudstone level 36 m above
      the base of the unit at Sierra del Portezuelo.
  - id: porfiri2024a
    notes: >
      Uses it as the older term of a stratigraphic contrast, against
      "the stratigraphically younger, larger-bodied Austroraptor cabazai from
      the Campanian-Maastrichtian".
  - id: calvo2004b
    notes: >
      Reports that its age "has been interpreted as Turonian through Santonian
      on the basis of sequence stratigraphy", following Leanza (1999) and
      Leanza and Hugo (2001); the abstract gives the narrower "Portezuelo
      Formation (Upper Turonian-Lower Coniacian)" for the new Megaraptor
      specimen, which came from red claystones at the top of the formation.
  - id: leanza1999a
  - id: leanza2001a
  - id: garrido2010a
    notes: >
      The unit "currently lacks absolute dating or biostratigraphic studies
      that would establish a reliable age", so the age adopted follows Hugo
      and Leanza (2001) and Leanza and colleagues (2004), who "tentatively
      place this unit between Late Turonian – Early Coniacian, a criterion
      also adopted in this work". Cruz and colleagues (1989) had assigned it
      90.5 to 88.5 Ma, "spanning from Middle Turonian to basal Early
      Coniacian".
  - id: hugo2001a
    notes: >
      Sets out the Neuquen Group's three subgroups with a span for each: "the
      Cenomanian-lower Turonian Limay Subgroup comprising the Candeleros,
      Huincul and Cerro Lisandro Formations; the upper Turonian-Coniacian Rio
      Neuquen Subgroup including the Portezuelo and Plottier Formations; and
      the Santonian-lower Campanian Rio Colorado Subgroup comprising the Bajo
      de la Carpa and Anacleto Formations." The statement is made twice in
      identical terms, and dates the group as a whole "from early Cenomanian
      (97 plus or minus 3 Ma) to early Campanian (74 plus or minus 3 Ma)".
  - id: cruz1989a
    notes: >
      A sequence-stratigraphic analysis that runs the whole scheme one rank
      below the registry: it gives "The Portezuelo (sandstones) and Plottier
      (pelites) members of the Rio Neuquen Formation" and "the members Bajo
      de la Carpa (sandstones) and Anacleto (pelites), of the Rio Colorado
      Formation", where the file and Hugo and Leanza (2001) make those two
      subgroups. Its own framework is Depositional Sequences I to IX, and its
      ages sit in a comparative stratigraphic chart rather than in the text,
      so it is a rank datum and a sequence framework rather than a dating.
  - id: leanza2004a
