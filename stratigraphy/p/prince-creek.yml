name: Prince Creek
rank: formation
period: [Late Cretaceous]
stages: [Coniacian, Santonian, Campanian, Maastrichtian]
references:
  - id: fiorillo2012a
    notes: >
      Gives that the "Prince Creek Formation ranges in age from latest
      Campanian" onward.
  - id: fiorillo2014a
    notes: >
      Describes it as "an alluvial unit comprised of sediments shed northward
      from the rising Brooks Range during late Campanian" time. Fiorillo and
      colleagues (2013) give the same wording, and Fiorillo and colleagues
      (2010) carry a Campanian-to-Maastrichtian range.
  - id: brett-surman1989a
    notes: >
      Lists "Prince Creek Fm, Coniacian ?" in a world list of formations with
      hadrosaurian remains, the age followed by a query.
  - id: fiorillo2010a
    notes: >
      Gives "The Late Cretaceous (Campanian-Maastrichtian) Prince Creek
      Formation". Pollen work by Frederiksen (1990) suggests the Ocean Point
      vertebrate deposits are "close to the Campanian-Maastrichtian boundary",
      and the paper's own pollen analyses near Kikak Creek "suggest an
      earliest Maastrichtian age" for the Kikak-Tegoseak Quarry bonebed.
  - id: fiorillo2013a
    notes: >
      Gives the unit as "an alluvial unit ... from late Campanian to
      Paleocene time", with "radioisotopic dates ... range from 68 Ma to 71
      Ma". It supports neither of the entry's two older stages.
  - id: frederiksen1990a
    notes: >
      Its title carries the age - a pollen zonation and correlation of
      Maastrichtian marine beds at the Ocean Point dinosaur locality - and it
      sets the unit in the Colville Group. The Turonian it gives belongs to
      the underlying Seabee Formation, dated "at least partly of Turonian
      age".
