name: Praia da Amoreira-Porto Novo
rank: member
parent: Lourinhã
period: [Late Jurassic]
stages: [Kimmeridgian, Tithonian]
variants: [Amoreira-Porto Novo, Porto Novo]
dispute:
  summary: >
    Rank is unsettled and the disagreement is current. Mateus and colleagues
    (2017) treat it as two members of the Lourinhã mapped together -- "The
    Porto Novo and the Praia da Amoreira Members (Hill, 1989) were mapped
    together by Manuppella et al. (1999) and we follow this approach in this
    work" -- while Mocho and colleagues (2019) and Malafaia and colleagues
    (2020), both later, write "Praia da Amoreira-Porto Novo Formation". The
    two cannot nest: no cited source puts the Lourinhã above formation rank,
    so treating this unit as a formation places it beside the Lourinhã rather
    than inside it.
references:
  - id: mocho2019a
    notes: >
      "Praia da Amoreira-Porto Novo Formation, upper Kimmeridgian-lowermost
      Tithonian".
  - id: malafaia2020a
    notes: >
      "Praia da Amoreira-Porto Novo Formation (upper Kimmeridgian)" in the
      locality and horizon line.
  - id: mateus2017a
    notes: >
      Treats it as two members mapped together and explains the history,
      crediting the original pair to Hill (1989) and the joint mapping to
      Manuppella and colleagues (1999).
  - id: antunes2003a
    notes: >
      Calls it a unit and gives the Ceratosaurus horizon as "Late Jurassic,
      ?Upper Kimmeridgian/ Tithonian, Amoreira - Porto Novo Unit"; for
      Dinheirosaurus it gives "Late Jurassic, Kimmeridgian to Tithonian,
      Amoreira-Porto Novo Unit and Bombarral Unit".
  - id: hill1989a
    notes: >
      The Praia da Amoreira member has "yielded no biostratigraphically useful
      palynomorphs, and its age can only be inferred from its stratigraphic
      position above the Abadia formation which is of late Oxfordian to
      mid-Kimmeridgian age (Ellwood 1987)"; with the overlying Praia Azul
      dated as basal Tithonian, "it is probable that the Praia da Amoreira
      member is of mid-to-late Kimmeridgian age". Its distal alluvial fan
      sediments were laid down "during a late Jurassic rifting phase", and the
      paper keeps the Praia da Amoreira and Porto Novo as separate members of
      the Lourinhã formation, the first succeeded on the coast by the second.
  - id: manuppella1999a
