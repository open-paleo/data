name: Poison Strip Sandstone
rank: member
parent: Cedar Mountain
period: [Early Cretaceous]
stages: [Hauterivian, Barremian, Aptian, Albian]
references:
  - id: tidwell2001a
    notes: >
      Uses the name throughout and records that the unit "was previously
      thought to correlate with the mid-Aptian Cloverly Formation".
  - id: kirkland2016a
    notes: >
      Describes it as "a complex of well-cemented sandstone beds that
      indicate deposition in amalgamated low-sinuosity" channels, using the
      rank word in place of the lithic term.
  - id: dicroce2001a
    notes: >
      Calls it the "Lower Cretaceous Poison Strip Member" and gives
      "Barremian-Aptian / Poison Strip Member" for Planicoxa venenica in its
      table, while the text concludes that "Most likely, this age is
      Barremian, the same as the Yellow Cat Member".
  - id: carpenter1999a
    notes: >
      Dates it from its ankylosaur: "Sauropelta suggests that the Poison Strip
      Sandstone is Aptian-Albian age because it is also present in the
      Cloverly Formation of Montana and Wyoming".
  - id: eberth2006a
    notes: >
      Dates the base of the unit from palynomorphs in "an organic-rich sample
      collected at the base of the overlying Poison Strip Sandstone", which
      "indicate an age range of latest Neocomian (Hauterivian) to Aptian, and
      probably Barremian", a result credited to G. Waanders as a personal
      communication.
  - id: sprinkel2012a
    notes: >
      Aptian: the lower three members of the Cedar Mountain Formation "were
      initially assigned tentative ages based on dinosaur biostratigraphy:
      Barremian for the Yellow Cat Member in the northern Paradox Basin,
      Aptian for the Poison Strip Member, and Aptian to middle Albian for the
      Ruby Ranch Member", a subdivision the paper credits to Kirkland and
      colleagues (1997, 1999).
  - id: kirkland1997a
  - id: kirkland1999a
  - id: kirkland2007a
    notes: >
      Gives no age in its text beyond "Overall, the fossils in the Poison
      Strip Sandstone suggest persistence of the Yellow Cat fauna". Its
      correlation chart, modified from Kirkland and colleagues (1999), plots
      the member in the upper Aptian, and a second chart near the
      Barremian–Aptian boundary. Records the mapping convention at the Green
      River, where "the UGS Geologic Mapping Program maps the basal
      conglomerate as Buckhorn west of the Green River and as Poison Strip
      east of the river".
  - id: mori2009a
    notes: >
      A master's thesis. Treats the member and the Yellow Cat as one "Yellow
      Cat/Poison Strip complex" and dates them together from detrital zircon
      maximum depositional ages: "the Yellow Cat and Poison Strip Members are
      124 to 122 M old", with a preliminary bracket of "125 to 121 Ma (Early
      Aptian)". On the ICS chart v2024/12 (Aptian base 121.4 Ma) that bracket
      is almost entirely Barremian.
  - id: joeckel2019a
    notes: >
      Relays that the member's dinosaur fauna is "considered to be early
      Aptian", with a "potential correlation" to the faunas of the Lakota
      Formation and the upper Wealden. Sets aside a detrital zircon maximum
      depositional age of 146 Ma that Ludvigson and colleagues (2010) report
      from the member: the sandstone
      sampled overlies "a carbonate bed that produced a U-Pb age of
      119.4±2.6 Ma, and thus those zircons were recycled from older Mesozoic
      strata".
  - id: ludvigson2010b
