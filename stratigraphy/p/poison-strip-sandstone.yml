name: Poison Strip Sandstone
rank: member
parent: Cedar Mountain
period: [Early Cretaceous]
stages: [Hauterivian, Barremian, Aptian, Albian]
references:
  - id: tidwell2001a
    notes: >
      Uses the name throughout and records that the unit "was previously
      thought to correlate with the mid-Aptian Cloverly Formation".
  - id: kirkland2016a
    notes: >
      Describes it as "a complex of well-cemented sandstone beds that
      indicate deposition in amalgamated low-sinuosity" channels, using the
      rank word in place of the lithic term.
  - id: dicroce2001a
    notes: >
      Calls it the "Lower Cretaceous Poison Strip Member" and gives
      "Barremian-Aptian / Poison Strip Member" for Planicoxa venenica in its
      table, while the text concludes that "Most likely, this age is
      Barremian, the same as the Yellow Cat Member".
  - id: carpenter1999a
    notes: >
      Dates it from its ankylosaur: "Sauropelta suggests that the Poison Strip
      Sandstone is Aptian-Albian age because it is also present in the
      Cloverly Formation of Montana and Wyoming".
  - id: eberth2006a
    notes: >
      Dates the base of the unit from palynomorphs in "an organic-rich sample
      collected at the base of the overlying Poison Strip Sandstone", which
      "indicate an age range of latest Neocomian (Hauterivian) to Aptian, and
      probably Barremian", a result credited to G. Waanders as a personal
      communication.
  - id: sprinkel2012a
    notes: >
      Aptian: the lower three members of the Cedar Mountain Formation "were
      initially assigned tentative ages based on dinosaur biostratigraphy:
      Barremian for the Yellow Cat Member in the northern Paradox Basin,
      Aptian for the Poison Strip Member, and Aptian to middle Albian for the
      Ruby Ranch Member", a subdivision the paper credits to Kirkland and
      colleagues (1997, 1999).
