name: Paja
rank: formation
period: [Early Cretaceous]
stages: [Barremian, Aptian]
description: "The Paja Formation is an Early Cretaceous geologic formation of central Colombia. The formation extends across the northern part of the Altiplano Cundiboyacense, the Western Colombian emerald belt and surrounding areas of the Eastern Ranges of the Colombian Andes. Well known fossiliferous outcrops of the formation occur near Villa de Leyva, also written as Villa de Leiva, and neighboring Sáchica. The Paja Formation overlies the Ritoque and Rosablanca Formations and is overlain by the San Gil Group and the Simití and Tablazo Formations. The Paja Formation comprises mudstones, shales and nodules of sandstones and limestones, deposited in an anoxic environment, in the warm and shallow sea that covered large parts of the present Colombian territory during the Cretaceous. The Paja Formation Lagerstätte is famous for its vertebrate fossils and is the richest Mesozoic fossiliferous formation of Colombia."
