name: Presidente Prudente
rank: formation
parent: Bauru
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
references:
  - id: bandeira2016a
    notes: >
      Calls it "the Late Cretaceous Presidente Prudente Formation (Bauru
      Group, Paraná Basin)" and gives the unit as "considered
      Campanian-Maastrichtian in age" for deposits of sandstones and mudstones
      near the Raposo Tavares road, São Paulo State.
  - id: fernandes2000a
    notes: >
      The revision that erected it, crediting it to Fernandes (1998) and
      listing it among the Bauru Group's formations.
  - id: fernandes1998a
  - id: pinheiro2018a
    notes: >
      Counts it among the formations added to the Bauru Group by recent work,
      credited to Fernandes and Coimbra (1996), and gives it "Campanian–Early
      Maastrichtian" in its synthesis of earlier studies. Its uppermost
      sequence at Alfredo Marcondes is "Late Campanian–Early Maastrichtian",
      from correlating its upper unconformity with the Adamantina–Marília
      contact. Draws the unit as lenses within the Adamantina.
  - id: santucci2022a
    notes: >
      Equates it with the older unit, "Adamantina Formation (=Presidente
      Prudente Formation), Campanian–early Maastrichtian", an age relayed for
      the Adamantina.
  - id: fernandes1996a
