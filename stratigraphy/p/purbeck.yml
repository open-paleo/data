name: Purbeck
rank: group
period: [Late Jurassic, Early Cretaceous]
stages: [Tithonian, Berriasian]
lithology: mudstone, limestone and evaporite
references:
  - id: clements1993a
    notes: >
      Bed-by-bed account of the type section at Durlston Bay, Swanage, with its
      gastropod and ostracod faunas; divides the group into the Durlston
      Formation above and the Lulworth below after Townson (1975).
  - id: barker2023a
    notes: >
      Gives the group as "Tithonian–Berriasian" and describes its three
      fault-bounded inliers north and northwest of Battle, East Sussex, where
      both formations are "principally Berriasian".
  - id: galton2009a
    notes: >
      Names the scheme by way of its upper part, giving the Owenodon horizon
      as "the Purbeck Limestone Formation (=Durlston Formation, Upper
      Purbeck, mid-Berriasian ...)". The Lulworth Formation is its lower
      division and is entered separately.
  - id: casey1963a
  - id: townson1975a
  - id: hopson2008a
    notes: >
      Source of the lithology.
