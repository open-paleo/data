name: Purbeck
rank: group
period: [Late Jurassic, Early Cretaceous]
stages: [Tithonian, Berriasian]
references:
  - id: clements1993a
    notes: >
      The bed-by-bed type-section account of the group at Durlston Bay,
      Swanage, which is the thickest well-exposed Purbeck section in the
      country, with the gastropod and ostracod faunas logged through it.
      Treats the strata as the Purbeck Limestone Group, divided into the
      Durlston Formation above and the Lulworth Formation below after Townson
      (1975), where others have ranked the same strata as a formation; the
      traditional Lower, Middle and Upper divisions rest partly on
      biostratigraphy and are kept only informally. Where the
      Jurassic/Cretaceous boundary falls within the sequence "remains very
      uncertain", the paleontological basis for Casey's (1963) placement of it
      having been challenged.
  - id: barker2023a
    notes: >
      The group is "a succession that underlies the Wealden Supergroup ... and
      spans the Jurassic-Cretaceous boundary (Tithonian–Berriasian ...)".
      Within the Weald sub-basin it reaches the surface in three fault-bounded
      inliers north and northwest of Battle in East Sussex, surrounded by the
      overlying Hastings Group and representing the oldest exposed rocks in
      the region; there it is represented by both the Lulworth and the
      Durlston Formations, "which are principally Berriasian in age".
  - id: galton2009a
    notes: >
      Names the scheme by way of its upper part, giving the Owenodon horizon
      as "the Purbeck Limestone Formation (=Durlston Formation, Upper
      Purbeck, mid-Berriasian ...)". The Lulworth Formation is its lower
      division and is entered separately.
