name: Pui Beds
rank: formation
informal: true
period: [Late Cretaceous]
stages: [Maastrichtian]
variants: [Bărbat]
references:
  - id: augustin2022a
    notes: >
      Calls the continental succession of the Bărbat River Valley section
      "informally also referred to as the 'Barbat Formation' (Therrien, 2005)
      or the 'Pui Beds'", correlative with the Sânpetru Formation in the
      eastern part of the Haţeg Basin, and gives it as "'middle' Maastrichtian
      in age, i.e., close to the early to late Maastrichtian boundary".
  - id: díaz2025a
    notes: >
      Lists the beds among the "as yet not formally defined sedimentary
      successions" of the Haţeg Basin, in its eastern-central area, and dates
      them to the "upper part of lower to lower part of upper Maastrichtian".
  - id: therrien2005a
    notes: >
      Finds the Pui beds distinct from the Sânpetru Formation and suggests
      they "may warrant their own formational recognition", "tentatively
      named the Bărbat Formation because Pui Formation is already in use".
