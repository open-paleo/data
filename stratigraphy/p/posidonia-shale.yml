name: Posidonia Shale
rank: formation
period: [Early Jurassic]
stages: [Toarcian]
description: "The Posidonia Shale is an Early Jurassic (Toarcian) geological formation in Germany, northern Switzerland, northwestern Austria, southern Luxembourg and the Netherlands. Posidonia Shale, which was deposited under strongly reducing conditions during the Toarcian oceanic anoxic event, trapped and exceptionally preserved complete fossils of marine fish and reptiles. The formation consists of oil shales formed of fine-grained sediments and bituminous limestones in fine, alternating layers. It crops out in several locations in southwestern Germany, although most remains are near the village of Holzmaden and Dotternhausen."
references:
  - id: haubold1990a
    notes: >
      Gives the Emausaurus ernsti horizon as "lowermost Lias epsilon, lower
      Toarcian, Dactylioceras tenuicostatum zone (equivalent to the Posidonia
      Shale), clay pit near Grimmen west of Greifswald,
      Mecklenburg-Vorpommern".
  - id: ansorge2025a
    notes: >
      Treats the Toarcian strata of the eastern North German Basin and
      distinguishes the newly named Grimmen Formation from the Posidonia Shale
      Formation, whose "facies and fauna are largely unknown in international
      literature" by comparison.
  - id: sues2025a
    notes: >
      Places the "Posidonia shales" of Germany above the Triassic succession
      that Alberti (1834) divided into Buntsandstein, Muschelkalk and Keuper,
      and gives them as "Early Jurassic in age".
  - id: vonalberti1834a
