name: Posidonia Shale
rank: formation
period: [Early Jurassic]
stages: [Toarcian]
references:
  - id: haubold1990a
    notes: >
      Gives the Emausaurus ernsti horizon as "lowermost Lias epsilon, lower
      Toarcian, Dactylioceras tenuicostatum zone (equivalent to the Posidonia
      Shale), clay pit near Grimmen west of Greifswald,
      Mecklenburg-Vorpommern".
  - id: ansorge2025a
    notes: >
      Treats the Toarcian strata of the eastern North German Basin and
      distinguishes the newly named Grimmen Formation from the Posidonia Shale
      Formation, whose "facies and fauna are largely unknown in international
      literature" by comparison.
  - id: sues2025a
    notes: >
      Places the "Posidonia shales" of Germany above the Triassic succession
      that Alberti (1834) divided into Buntsandstein, Muschelkalk and Keuper,
      and gives them as "Early Jurassic in age".
  - id: vonalberti1834a
