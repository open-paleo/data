name: Pichi Neuquén
rank: member
parent: Rayoso
period: [Early Cretaceous]
stages: [Aptian, Albian]
dispute:
  summary: >
    Two readings, neither superseded and neither testable against a date.
    Canudo and colleagues (2018) put it in the present tense: "There is no
    consensus regarding the age of this member, for no direct datings have
    been taken. Some authors place it in the Aptian (Musacchio and Vallati
    2000), whereas Leanza (2003) considers it to be rather more modern
    (lower Albian)." They decline to choose between them, and the Aptian
    to lower Albian range they go on to give is ascribed to the
    rebbachisaurid they describe rather than to the member. Neither
    disputant is read here; both are known through that account, and the
    Aptian side is credited to a five-page contribution to a congress on
    the Barremian-Aptian regression at Bajada del Agrio.
references:
  - id: canudo2018a
    notes: >
      Names it third of the formation's four members around Agrio del Medio,
      "from the oldest to youngest these are the Rincon, Quili Malal, Pichi
      Neuquen, and Canadon de la Zorra members". Gives the member's age as
      unsettled and says why: "There is no consensus regarding the age of this
      member, for no direct datings have been taken", the Aptian credited to
      Musacchio and Vallati (2000) and a "rather more modern (lower Albian)"
      reading to Leanza (2003). The range the paper itself gives, "an age
      range from Aptian to lower Albian", is ascribed to the new
      rebbachisaurid rather than to the member; its bones came "from the
      middle part of the Pichi Neuquen Member, approximately 44 metres from
      its base".
  - id: wilson2015a
    notes: >
      Tabulates the rebbachisaurid occurrence as "Rayoso (Pichi Neuquen M.)"
      at "Aptian/lower Albian".
