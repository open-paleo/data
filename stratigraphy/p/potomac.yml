name: Potomac
rank: group
period: [Early Cretaceous, Late Cretaceous]
references:
  - id: carrano2024a
    notes: >
      Retains "the official USGS nomenclatures", the Arundel Clay "of the
      Potomac Group", against the reduction of the group to a formation and of
      the Arundel to a facies.
  - id: frederickson2018a
    notes: >
      Treats the unit as a Potomac Formation "(reduced in rank from group)",
      after Kranz (1998), and gives it as "Lower to basal Upper Cretaceous".
  - id: stanford2011a
    notes: >
      Places the Patuxent Formation and the Arundel Clay in the Potomac Group.
  - id: kranz1998a
    notes: >
      Cited by Frederickson and colleagues (2018) for reducing the Potomac
      Group to a formation and the Arundel to a facies within it.
