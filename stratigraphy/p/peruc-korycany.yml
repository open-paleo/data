name: Peruc-Korycany
rank: formation
period: [Late Cretaceous]
stages: [Cenomanian]
references:
  - id: fejfar2005a
    notes: >
      Explains why the combined name exists. The Peruc and Korycany Beds are
      "of the local stratigraphic column", the boundary between them "is
      irregular, with paralic development of several marine incursions into
      terrestrial areas", and "Some marine deposits of the Korycany Beds and
      continental sediments of the Peruc Beds are considered to be
      isochronous" -- a facies relationship rather than superposition.
      "Therefore, we use the term Peruc-Korycany Formation to characterize
      the mixed lithologies deposited in this area". Places the dinosaur
      remains in "the near-shore marine sediments of the Peruc-Korycany
      Formation", at formation rank and no finer.
  - id: madzia2017a
    notes: >
      Refines the horizon to "the upper Cenomanian strata (Korycany Beds of
      the Peruc-Korycany Formation) of the Czech Republic". The Korycany Beds
      are a facies designation of the local column, not a mappable
      subdivision of the formation.
  - id: csiki-sava2015a
    notes: >
      Describes it as "upper Cenomanian rudist-bearing sandy beach deposits".
