name: Peruc-Korycany
rank: formation
period: [Late Cretaceous]
stages: [Cenomanian]
lithology: conglomerate and sandstone, with shale and marl in the upper part
references:
  - id: fejfar2005a
    notes: >
      Uses the combined name for the mixed Peruc and Korycany Beds, whose
      boundary "is irregular", and places the dinosaur remains in the
      formation's near-shore marine sediments.
  - id: madzia2017a
    notes: >
      Refines the horizon to "the upper Cenomanian strata (Korycany Beds of
      the Peruc-Korycany Formation) of the Czech Republic".
  - id: čech2011a
    notes: >
      By the lead author of the 1980 revision of the basin's stratigraphy,
      treats the units as members: "the Peruc Member" and "the Korycany and
      Pecínov members of the Peruc-Korycany Formation".
  - id: caracciolo2009a
    notes: >
      Uses the same members, the "shallow-marine Korycany Member" among "the
      Peruc and Korycany members". Source of the lithology.
  - id: csiki-sava2015a
    notes: >
      Describes it as "upper Cenomanian rudist-bearing sandy beach deposits".
