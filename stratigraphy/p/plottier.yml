name: Plottier
rank: formation
parent: Neuquén
period: [Late Cretaceous]
stages: [Coniacian, Santonian]
references:
  - id: filippi2011a
    notes: >
      Gives "Plottier Formation (Coniacian-Santonian", with the Petrobrasaurus
      quarry in "the mid-high part of the Plottier Formation", and states the
      horizon as "Claystones of the Plottier Formation. Santonian (Upper
      Cretaceous) of the Neuquén Basin."
  - id: salgado2023a
    notes: >
      Uses the narrower "Plottier Formation, Santonian".
  - id: garrido2010a
    notes: >
      Reads the microfossil work of Musacchio (2006) and Musacchio and Vallati
      (2007) as giving the formation "an age within the Coniacian–Santonian
      interval", and adopts the Late Coniacian of Hugo and Leanza (2001) as
      "the most probable, potentially extending to the Early Santonian". Under
      the scheme proposed here the unit is narrower than in the usage of
      Salgado and colleagues (2009), whose Plottier would also take in the Los
      Bastos and Sierra Barrosa Formations.
  - id: hugo2001a
    notes: >
      Contradicts the Santonian and places this formation within its
      subgroup. It states twice that the Rio Neuquen Subgroup, which contains
      the Portezuelo and this unit, is upper Turonian to Coniacian, and puts
      the Santonian to lower Campanian in the overlying Rio Colorado
      Subgroup. Its stratigraphic chart resolves the subgroup internally,
      with the Portezuelo against the Turonian and this formation against the
      Coniacian.
  - id: musacchio2006a
    notes: >
      The source of the Santonian, and it hedges the unit attribution twice.
      The assemblage is from brick-red mudstones at El Zampal in Mendoza,
      described as "very similar to those that are conspicuous for the
      Plottier Formation in other parts of the basin", with the name itself
      printed in quotation marks; the locality is far from the type area. The
      Turonian-Santonian assignment is itself tentative, the gyrogonites and
      ostracods having "not provided, on the basis of available material,
      firm correlation criteria".
  - id: musacchio2007a
    notes: >
      Reports the same Zampal and Calmu-Co material at greater length, "For
      the first time, a non marine microfossil assemblage containing
      charophytes, megaspores, seed remains and ostracods ... from the
      Plottier Formation", in the Malargue Department of southern Mendoza.
      The Santonian on this entry rests on this material and its companion
      paper rather than on the type area.
  - id: salgado2009b
    notes: >
      Gives the formation no age. It describes vertebrates from El Anfiteatro
      in northern Rio Negro recovered "in beds of Cerro Lisandro, Portezuelo,
      and Plottier formations", so it is a locality and containment record
      rather than a dating.
