name: Plottier
rank: formation
parent: Neuquén
period: [Late Cretaceous]
stages: [Coniacian, Santonian]
lithology: red pelite (mudstone), with interbedded siltstone and fine sandstone
references:
  - id: filippi2011a
    notes: >
      Describes Petrobrasaurus from "the mid-high part of the Plottier
      Formation" near Rincón de los Sauces, and gives the unit as
      Coniacian–Santonian, relaying earlier work.
  - id: simón2023a
    notes: >
      Uses the narrower "Plottier Formation, Santonian" for Notocolossus, in
      passing. It shortens the "upper Coniacian–lower Santonian" that
      González Riga and colleagues (2016) give for the basal beds that
      yielded the taxon, and is not a separate dating.
  - id: garrido2010a
    notes: >
      Dates the formation Late Coniacian, "potentially extending to the Early
      Santonian", in a scheme that adds the Los Bastos and Sierra Barrosa
      Formations to its subgroup. Source of the lithology.
  - id: hugo2001a
    notes: >
      Assigns the formation to the Coniacian, within a Río Neuquén Subgroup of
      late Turonian to Coniacian age, and places the Santonian in the overlying
      Río Colorado Subgroup.
  - id: musacchio2006a
    notes: >
      Reports a charophyte and ostracod association from "Plottier" mudstones at
      El Zampal, Mendoza, and dates it Turonian–Santonian by correlation with
      the Adamantina Formation of Brazil.
  - id: musacchio2007a
    notes: >
      Reports the first microfossil assemblage from the formation, at Zampal and
      Calmu-Có in southern Mendoza, and assigns it to "the interval
      Coniacian-Santonian".
  - id: salgado2009b
    notes: >
      Describes vertebrates from El Anfiteatro, Río Negro, and gives the
      formation as "middle to upper? Santonian" without citing a source.
  - id: gonzálezriga2016a
    notes: >
      Collects the Notocolossus holotype and referred specimen from the
      basal-most bed of the formation at Cerro Guillermo, southern Mendoza,
      dated "upper Coniacian–lower Santonian".
  - id: gale2020a
    notes: >
      Gives the base of the Santonian as 85.7 ± 0.2 Ma, against 86.3 Ma in
      GTS2012.
  - id: leanza2004a
    notes: >
      Gives the formation, in the Río Neuquén Subgroup, a "Late Coniacian" age
      after Hugo and Leanza (2001a), and records that fossils first reported from
      the top of the Portezuelo Formation at Sierra Barrosa were reassigned to the
      Plottier. The "Late Turonian–Coniacian" it gives covers the Portezuelo and
      Plottier together.
