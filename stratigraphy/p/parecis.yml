name: Parecis
rank: group
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
references:
  - id: delcourt2017a
    notes: >
      Records a reassignment out of a neighboring group: the Fazenda Roncador
      locality had been placed in the Bauru Group, but "recent work has shown
      that this locality is actually part of the Parecis Group and that it is
      of Campanian-Maastrichtian age".
  - id: weska2006a
    notes: >
      "The rocks of the Parecis and Bauru groups in Mato Grosso were deposited
      during the Upper Cretaceous", in erosive unconformity over the older
      Parecis and Paraná basins. Suggests one stratigraphic column for both
      basins, with the Bauru Group suppressed in Mato Grosso, so that "the
      Parecis Group can be characterized by the Paredão Grande, Salto das
      Nuvens, Cachoeira do Bom Jardim, and Utiariti formations".
