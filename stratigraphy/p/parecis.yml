name: Parecis
rank: group
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
lithology: volcanic, clastic and chemical rocks
references:
  - id: delcourt2017a
    notes: >
      Records a reassignment out of a neighboring group: the Fazenda Roncador
      locality had been placed in the Bauru Group, but "recent work has shown
      that this locality is actually part of the Parecis Group and that it is
      of Campanian-Maastrichtian age".
  - id: weska2006a
    notes: >
      Redefines the group to hold the Paredão Grande, Salto das Nuvens,
      Cachoeira do Bom Jardim and Utiariti formations, suppressing the Bauru
      Group in Mato Grosso. Relays an Ar–Ar date of 83.9 ± 0.4 Ma for one of
      the Raizinha lava flows of the Paredão Grande, from Weska (1996) and
      Gibson and colleagues (1997). Source of the lithology.
  - id: bittencourt2011a
    notes: >
      Gives "The basalts of the Paredão Grande Formation, at the base of the
      Parecis Group" an age of 83.9 ± 0.4 Ma, "Late Santonian", after Gibson
      and colleagues (1997), and the group's dinosaur fauna a
      Campanian–Maastrichtian age.
  - id: gibson1997a
  - id: weska1996a
