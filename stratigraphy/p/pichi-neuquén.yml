name: Pichi Neuquén
rank: member
parent: Rayoso
period: [Early Cretaceous]
stages: [Aptian, Albian]
lithology: red sandstone and mudstone
dispute:
  summary: >
    Canudo and colleagues (2018) report that "there is no consensus regarding
    the age of this member, for no direct datings have been taken", setting an
    Aptian reading credited to Musacchio and Vallati (2000) against a "rather
    more modern (lower Albian)" one they credit to Leanza (2003). Leanza gives
    the member as Albian by its position in the Rayoso Formation, whose "most
    probable age" Leanza estimates as "upper Aptian - Albian".
references:
  - id: canudo2018a
    notes: >
      Places the rebbachisaurid bones in the middle of the member, about 44 m
      above its base, and reports "no consensus" on its age, setting an Aptian
      reading against a lower Albian one.
  - id: wilson2015a
    notes: >
      Tabulates the rebbachisaurid occurrence as "Rayoso (Pichi Neuquen M.)"
      at "Aptian/lower Albian".
  - id: leanza2003a
    notes: >
      Credits the member to Weaver (1931), places it between the Quili Malal and
      Cañadón de la Zorra members of the Rayoso, and assigns it to the Albian.
      Source of the lithology.
  - id: weaver1931a
  - id: musacchio2000a
