name: Pichi Neuquén
rank: member
parent: Rayoso
period: [Early Cretaceous]
stages: [Aptian, Albian]
dispute:
  summary: >
    Canudo and colleagues (2018) report that "there is no consensus regarding
    the age of this member, for no direct datings have been taken", setting an
    Aptian reading credited to Musacchio and Vallati (2000) against a "rather
    more modern (lower Albian)" one they credit to Leanza (2003). Leanza gives
    the member as Albian by its position in the Rayoso Formation, whose "most
    probable age" Leanza estimates as "upper Aptian - Albian".
references:
  - id: canudo2018a
    notes: >
      Names it third of the formation's four members around Agrio del Medio,
      "from the oldest to youngest these are the Rincon, Quili Malal, Pichi
      Neuquen, and Canadon de la Zorra members". Gives the member's age as
      unsettled and says why: "There is no consensus regarding the age of this
      member, for no direct datings have been taken", the Aptian credited to
      Musacchio and Vallati (2000) and a "rather more modern (lower Albian)"
      reading to Leanza (2003). The range the paper itself gives, "an age
      range from Aptian to lower Albian", is ascribed to the new
      rebbachisaurid rather than to the member; its bones came "from the
      middle part of the Pichi Neuquen Member, approximately 44 metres from
      its base".
  - id: wilson2015a
    notes: >
      Tabulates the rebbachisaurid occurrence as "Rayoso (Pichi Neuquen M.)"
      at "Aptian/lower Albian".
  - id: leanza2003a
    notes: >
      Credits the member to Weaver (1931) and places it in the Rayoso
      Formation of the Bajada del Agrio Group, between the Quili Malal and the
      Cañadón de la Zorra: it "lies conformably above the Quili Malal Member
      and is similarly overlain by the Cañadón de la Zorra Member". Fluvial
      sandstones, 41.5 m thick at Cerro La Visera. From the age of the
      formation "it is maintained that the Member in question corresponds to
      the Albian".
  - id: weaver1931a
  - id: musacchio2000a
