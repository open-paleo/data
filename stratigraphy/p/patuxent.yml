name: Patuxent
rank: formation
period: [Early Cretaceous]
stages: [Aptian]
references:
  - id: d'emic2012a
    notes: >
      Finds the large theropod material from the formation's Arundel clay
      indeterminate: USNM 3049 may not be a theropod, and teeth such as USNM
      3121 resemble Acrocanthosaurus but are not referable to it.
  - id: oreska2013a
    notes: >
      Compares the formation's Arundel Clay fauna with three other Lower
      Cretaceous faunas and finds it the least similar, which it puts partly
      down to poor sampling.
  - id: stanford2011a
    notes: >
      Dates the formation Aptian by palynology, "evidently in the younger end of
      this interval", while giving the occurrence of Propanoplosaurus
      marylandicus as early Aptian.
  - id: arbour2015a
    notes: >
      Gives the Propanoplosaurus horizon as "the early Aptian Patuxent
      Formation of Maryland".
  - id: carrano2012a
    notes: >
      Gives the same unit with its facies, "the Early Cretaceous Patuxent
      Formation (Arundel Clay facies, Aptian) of Maryland".
  - id: harris1998a
