name: Patuxent
rank: formation
period: [Early Cretaceous]
stages: [Aptian]
references:
  - id: d'emic2012a
    notes: >
      Large-bodied theropod material from the Arundel clay of the Patuxent
      Formation is cut back to indeterminate here: USNM 3049, the incomplete
      caudal centrum Harris (1998b) read as a theropod distinct from
      Acrocanthosaurus, "does not possess any features unique to theropods, so
      it could pertain to an ornithischian or a sauropod rather than a
      theropod", and isolated teeth such as USNM 3121 are "similar to
      Acrocanthosaurus in proportions, denticulation, and the presence of weak
      banding" without being referable to it. D'Emic and colleagues treat the
      Maryland unit as one of three Lower Cretaceous North American sources of
      such fragments, alongside the Cedar Mountain and Cloverly formations,
      and name no stage for it.
  - id: oreska2013a
    notes: >
      Ten formally described genera are counted for the Patuxent, against 28
      for the Antlers and at least 46 for the Mussentuchit Member of the Cedar
      Mountain Formation, and the Patuxent fauna is the least similar of the
      four Lower Cretaceous assemblages Oreska and colleagues compare by
      Sørensen index: under their broader definition of taxonomic similarity,
      0.353 against the Cloverly, 0.373 against the Antlers and 0.253 against
      the Mussentuchit. They read that partly as real geographic or temporal
      separation and partly as sampling, since "In addition to being poorly
      sampled for vertebrates, the Patuxent Formation yields multiple taxa not
      identified below the family level, which were therefore omitted from the
      analysis." The formation enters the comparison through its Arundel Clay
      facies and carries no stage anywhere in the paper.
  - id: stanford2011a
    notes: >
      Palynologic assemblages make the Patuxent Formation "the oldest
      stratigraphic unit exposed in the Atlantic Coastal Plain of Maryland",
      of "an Aptian age, evidently in the younger end of this interval", while
      the occurrence given for Propanoplosaurus marylandicus reads "Patuxent
      Formation, Potomac Group (early Aptian in age)". The formation crops out
      in a narrow belt running south-southwest from the Delaware-Maryland
      border to Fredericksburg, Virginia, and its lithology varies markedly
      along that belt, dominated by medium to coarse sands, sandstones and
      pebble conglomerates interbedded with siderite-cemented sandstones, gray
      and red siltstones, lignite-bearing light gray clays and red clays laid
      down in distal deltaic fans and sluggish river floodplains. Stanford and
      colleagues place the Arundel Clay, source of every earlier Early
      Cretaceous dinosaur find in the region, as lenses at various
      stratigraphic levels within the Potomac Group rather than at one
      horizon.
  - id: arbour2015a
    notes: >
      Gives the Propanoplosaurus horizon as "the early Aptian Patuxent
      Formation of Maryland".
  - id: carrano2012a
    notes: >
      Gives the same unit with its facies, "the Early Cretaceous Patuxent
      Formation (Arundel Clay facies, Aptian) of Maryland".
