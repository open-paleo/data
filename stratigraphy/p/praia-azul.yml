name: Praia Azul
rank: member
parent: Lourinhã
period: [Late Jurassic]
stages: [Kimmeridgian, Tithonian]
references:
  - id: mateus2017a
    notes: >
      Describes it as "lower coastal plain alluvium with three
      brackish-marine faunally distinct transgressive carbonate levels" and
      dates it "uppermost Kimmeridgian to lowermost Tithonian". Pairs it with
      the Sobral, writing of the "Praia Azul/Sobral Member".
  - id: rotatori2022a
    notes: >
      Gives "Praia Azul Member of Lourinhã Formation, lower Tithonian".
  - id: hill1989a
    notes: >
      "The younger deltaic sediments of the Praia Azul member have been dated
      as basal Tithonian by Leinfelder (1987)", a date the paper then uses to
      cap the underlying Praia da Amoreira member. Treats it as one of the
      tongues of marine and deltaic facies intercalated to the south with the
      fluvial younger members of the Lourinhã formation.
