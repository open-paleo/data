name: Praia Azul
rank: member
parent: Lourinhã
period: [Late Jurassic]
stages: [Kimmeridgian, Tithonian]
references:
  - id: mateus2017a
    notes: >
      Describes it as "lower coastal plain alluvium with three
      brackish-marine faunally distinct transgressive carbonate levels" and
      dates it "uppermost Kimmeridgian to lowermost Tithonian". Pairs it with
      the Sobral, writing of the "Praia Azul/Sobral Member".
  - id: rotatori2022a
    notes: >
      Gives "Praia Azul Member of Lourinhã Formation, lower Tithonian".
  - id: hill1989a
    notes: >
      "The younger deltaic sediments of the Praia Azul member have been dated
      as basal Tithonian by Leinfelder (1987)", a date the paper then uses to
      cap the underlying Praia da Amoreira member. Treats it as one of the
      tongues of marine and deltaic facies intercalated to the south with the
      fluvial younger members of the Lourinhã formation.
  - id: leinfelder1987a
    notes: >
      Cited by Hill (1989) for dating the Praia Azul member as basal
      Tithonian.
  - id: schneider2009a
    notes: >
      Treats it as "the Praia Azul member of Hill (1989)", in which its own
      Arranhó beds at Santa Cruz form "a thin carbonate interval"
      characterized by a giant Protocardia; its strontium-isotope ages on
      oyster shells place that interval near the Kimmeridgian–Tithonian
      boundary, at about 150.9 Ma.
  - id: mateus2009b
    notes: >
      Places the contact between the Praia da Amoreira-Porto Novo Member and
      "the Sobral Formation (= Praia Azul Member)" at the upper of two 0.5 m
      Isognomon and Eomiodon carbonate beds, about 500 m north of Porto
      Dinheiro, a bed that carries dinosaur tracks and can be followed for
      several kilometers along the cliffs.
