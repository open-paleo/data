name: Phosphates of the Oulad Abdoun Basin
informal: true
period: [Late Cretaceous, Paleocene, Eocene]
stages: [Maastrichtian, Danian, Selandian, Thanetian, Ypresian]
references:
  - id: longrich2025a
    notes: >
      States that the unit is informal: "The phosphates span the Maastrichtian
      up into the Early Eocene. No formal formations or units have been
      designated, instead for the purposes of the local phosphate mining
      industry they are divided into a series of beds or 'couches' and
      'sillons'".
  - id: kocsis2013a
    notes: >
      Dates the succession by its selachian biozones and the mining company's
      sequence stratigraphy: "mega-sequence-A is Maastrichtian, B is
      Danian-Thanetian, C is Ypresian, while the fourth is above the phosphate
      series", with "no Lutetian phosphate occurrence in the basin". The
      succession therefore continues through the Paleocene into the Ypresian.
  - id: longrich2017a
    notes: >
      Lists the mining company's divisions, "Sillon B, Faisceau A, Couche 0,
      Couche 0' and Couche 1 (lower Eocene), Couche 2 (Paleocene), Couche III
      and Niveaux inferieurs (Maastrichtian)".
  - id: longrich2024a
    notes: >
      Uses the name "Phosphates of the Oulad Abdoun Basin".
