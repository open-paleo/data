name: Paw Paw
rank: formation
period: [Early Cretaceous]
stages: [Albian]
references:
  - id: lee1996a
    notes: >
      Gives "the Paw Paw Formation (late Albian), Tarrant County, Texas" as
      the Pawpawsaurus campbelli type horizon.
  - id: carpenter1998c
    notes: >
      Repeats the age and prints coordinates for two type localities in the
      formation, "~32°52'N, ~97°18'W" and "~97°20'W, 32°56'N", Tarrant County.
  - id: coombs1995a
    notes: >
      Gives the Texasetes pleurohalio horizon as "Paw Paw Formation (sandy
      member of Dennison Formation); Comanche Series, upper Albian, Lower
      Cretaceous", within the town limits of Blue Mound, north of Fort Worth.
