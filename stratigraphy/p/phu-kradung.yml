name: Phu Kradung
rank: formation
period: [Late Jurassic, Early Cretaceous]
stages: [Kimmeridgian, Tithonian, Berriasian, Valanginian]
references:
  - id: manitkoon2023a
    notes: >
      Titles its material as from "the Phu Kradung Formation (Upper Jurassic)
      of Northeastern Thailand" and elsewhere calls the unit Late
      Jurassic-Early Cretaceous.
  - id: nilpanapan2026a
    notes: >
      States the limit of what can be resolved: the evidence is "not
      sufficient to tightly constrain the age. Consequently, the formation is
      best regarded as spanning the latest Jurassic and possibly extending
      into the earliest Cretaceous (Berriasian)."
  - id: samathi2024a
    notes: >
      Reviews how the formation has been dated: it "was first considered Late
      Triassic to Early Jurassic age by Ward and Bunnag (1964)", Racey and
      colleagues (1996) later proposed a Late Jurassic or probably Early
      Cretaceous age, and Tong and colleagues (2021) suggested on the turtle
      Yakemys that its upper part is Early Cretaceous. The paper itself calls
      it the "Upper Jurassic Phu Kradung Formation".
  - id: ren2024a
    notes: >
      Dates it as Kimmeridgian, citing Jia and colleagues (2022), placing the
      mamenchisaurid teeth and posterior cervical vertebra reported by
      Suteethorn and colleagues (2013) "in Phu Kradung Formation
      (Kimmeridgian".
  - id: tucker2022a
    notes: >
      Notes that "the Phu Kradung Formation has been tentatively placed within
      the Middle to Late Jurassic", as an example of the poor and conflicting
      biostratigraphic age control on the units of the Khorat Group.
  - id: ward1964a
  - id: racey1996a
    notes: >
      Precise about the rest of the Khorat Group and explicitly imprecise
      about this unit. It dates the Nam Phong "accurately for the first time
      as late Norian to Rhaetian" and reassigns the Phra Wihan, Sao Khua, Phu
      Phan and Khok Kruat "to the Early Cretaceous (Berriasian to Aptian) on
      the basis of new palynological data" - but of this formation it says
      only that the age "is probably Late Jurassic or Early Cretaceous,
      although this cannot be determined with confidence". Two epochs offered
      as alternatives and disclaimed in the same sentence.
  - id: tong2021a
    notes: >
      "The evidence from the turtle assemblages seems to support a Late
      Jurassic age for the lower part of the formation and an Early Cretaceous
      age for its upper part", the macrobaenid Yakemys alongside Basilochelys
      in the upper part giving "further support for the Early Cretaceous age
      of the upper part of the Phu Kradung Formation". Following Racey (2009),
      that upper part is "basal Cretaceous (Berriasian–?Valanginian) in age",
      while the age of the formation as a whole "is still uncertain", the
      palynology and detrital zircon work indicating only that it "ranges from
      Late Jurassic to Early Cretaceous".
  - id: jia2022a
    notes: >
      Puts a floor under the unit that excludes every pre-Late Jurassic
      reading. Detrital zircon U-Pb on sample Nt17 gives youngest apparent
      ages of "154±6 Ma and 161±3 Ma", establishing a maximum possible
      depositional age of about 154 Ma, and the paper calls the unit the Late
      Jurassic or Upper Jurassic Phu Kradung throughout. Its paleomagnetic
      result for this formation passed the fold test, unlike its sampling of
      the Sao Khua. It records that Carter and Bristow (2003) had reached a
      Late Jurassic to Early Cretaceous depositional age by fission track and
      detrital zircon.
  - id: suteethorn2013a
    notes: >
      Gives the unit as "the Upper Jurassic-Lower Cretaceous Phu Kradung
      Formation" in its title and as "a Upper Jurassic to Lower Cretaceous
      continental unit" in its text, and records that "the age of the Phu
      Kradung Formation is controversial" while noting its vertebrate fauna
      resembles those of the Late Jurassic of China. Epochs only; it names no
      stage.
  - id: racey2009a
    notes: >
      Late Jurassic to Early Cretaceous, with the palynology and the
      vertebrates pulling apart: the palynological data of Racey and Goodall
      (2009) "indicate that most of the Phu Kradung Formation is Early
      Cretaceous", "whereas the vertebrate dating suggests that the Phu
      Kradung Formation is Late Jurassic (Tithonian) or Early Cretaceous in
      age". From a personal communication by Buffetaut that the gap between
      the Phu Kradung and Sao Khua vertebrate assemblages is wider than that
      between the Sao Khua and Khok Kruat, it infers that if the Khok Kruat
      Formation is Aptian and the Sao Khua therefore Barremian, "the Phu
      Kradung Formation would be earliest Cretaceous (Berriasian) or Latest
      Jurassic (Tithonian)".
