name: Purgatoire
rank: formation
period: [Early Cretaceous]
stages: [Aptian, Albian]
references:
  - id: brill2007a
    notes: >
      Gives the rank, the containment and the age together, the Theiophytalia
      skull coming from "the lower Lytle Member of the Purgatoire Formation
      (Dakota Group), which is of Aptian-Albian age", in the Colorado usage
      of a Dakota Group that takes in the units below the Dakota Formation.
  - id: mcdonald2010a
    notes: >
      Records the reassignment, the skull "formerly referred to the Late
      Jurassic iguanodontian Camptosaurus and recently determined to have
      been found in the Early Cretaceous Purgatoire Formation of Colorado".
  - id: noblett1987a
    notes: >
      Treats it as a separate formation: "In the Colorado Springs region, the
      Purgatoire Formation separates the Morrison and Dakota Formations".
  - id: mateer1987a
    notes: >
      Reviews the Dakota Group of northeastern New Mexico and southern
      Colorado and rejects "The twofold division of the Dakota Group
      (Purgatoire and Dakota formations)" for a fourfold one without the
      Purgatoire.

