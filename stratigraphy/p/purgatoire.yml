name: Purgatoire
rank: formation
period: [Early Cretaceous]
stages: [Aptian, Albian]
references:
  - id: brill2007a
    notes: >
      Gives the rank, the containment and the age together, the Theiophytalia
      skull coming from "the lower Lytle Member of the Purgatoire Formation
      (Dakota Group), which is of Aptian-Albian age". Other workers use the
      Dakota at formation rank, so the name carries both ranks in the
      literature.
  - id: mcdonald2010a
    notes: >
      Records the reassignment, the skull "formerly referred to the Late
      Jurassic iguanodontian Camptosaurus and recently determined to have
      been found in the Early Cretaceous Purgatoire Formation of Colorado".
