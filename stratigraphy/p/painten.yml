name: Painten
rank: formation
period: [Late Jurassic]
stages: [Kimmeridgian, Tithonian]
dispute:
  summary: >
    Niebuhr and Pürner (2014), defining the formation, give it as "Lower
    Tithonian" (hybonotum Zone) resting on the Arnstorf Subformation of the
    Torleite, whose top reaches the "highest beckeri zone ... near
    Schamhaupten and Painten"; Reisdorf and Wuttke (2012) treat a
    "Schamhaupten Member" as "part of the Painten Formation" of "Late
    Kimmeridgian age (Beckeri Zone, Ulmense Subzone)", and Foth and colleagues
    (2025) place a Schamhaupten specimen "in the lowermost part of the Painten
    Formation".
references:
  - id: reisdorf2012a
    notes: >
      Names two of its members and the ages they carry: the "Schamhaupten
      Member ..., which is classified as part of the Painten Formation", is
      given a "Late Kimmeridgian age (Beckeri Zone, Ulmense Subzone)", while
      material from Jachenhausen "can be considered to be from the Painten
      Formation (Zandt Member ...), and thus of an assumed Early Tithonian
      age".
  - id: foth2025a
    notes: >
      Places the Schamhaupten specimen "from the Kimmeridgian/Tithonian
      boundary in the lowermost part of the Painten Formation", and
      distinguishes it laterally from the Altmühltal: the "Solnhofen
      limestone" sensu stricto "is part of the Altmühltal Formation ...
      whereas the contemporaneous plattenkalks more to the east belong to the
      Painten Formation".
  - id: niebuhr2014a
    notes: >
      Defines the formation, "After the town of Painten", first description
      "Niebuhr (this work), based on Streim (1961a)": "Lower Tithonian", by
      ammonites "the lower Lower Tithonian (hybonotum Zone, lower and middle
      parts)", resting on the Arnstorf Subformation of the Torleite Formation,
      with Hennhüll and Zandt subformations and "More than 100 m in the type
      region".
