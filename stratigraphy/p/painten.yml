name: Painten
rank: formation
period: [Late Jurassic]
stages: [Kimmeridgian, Tithonian]
references:
  - id: reisdorf2012a
    notes: >
      Names two of its members and the ages they carry: the "Schamhaupten
      Member ..., which is classified as part of the Painten Formation", is
      given a "Late Kimmeridgian age (Beckeri Zone, Ulmense Subzone)", while
      material from Jachenhausen "can be considered to be from the Painten
      Formation (Zandt Member ...), and thus of an assumed Early Tithonian
      age".
  - id: foth2025a
    notes: >
      Places the Schamhaupten specimen "from the Kimmeridgian/Tithonian
      boundary in the lowermost part of the Painten Formation", and
      distinguishes it laterally from the Altmühltal: the "Solnhofen
      limestone" sensu stricto "is part of the Altmühltal Formation ...
      whereas the contemporaneous plattenkalks more to the east belong to the
      Painten Formation".
