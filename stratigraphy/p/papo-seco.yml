name: Papo Seco
rank: formation
period: [Early Cretaceous]
stages: [Barremian]
references:
  - id: mateus2011b
    notes: >
      Places Baryonyx material in "the Barremian (Papo Seco Formation) of
      Portugal", at Praia das Aguncheiras, Cabo Espichel, "in layers 36-38 of
      Choffat".
  - id: bertozzo2025a
    notes: >
      Gives "the Papo Seco Formation (lower Barremian)" at Praia do Areia do
      Mastro, Cabo Espichel, and calls it "the Early Cretaceous Papo Seco
      Formation of the Lusitanian Basin".
