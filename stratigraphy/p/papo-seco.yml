name: Papo Seco
rank: formation
period: [Early Cretaceous]
stages: [Barremian]
lithology: marl, with intermittent coarse-grained layers
references:
  - id: mateus2011b
    notes: >
      Places Baryonyx material in "the Barremian (Papo Seco Formation) of
      Portugal", at Praia das Aguncheiras, Cabo Espichel, "in layers 36-38 of
      Choffat". Describes its rock: "The Papo Seco Formation is predominantly
      composed of a series of marls representative of a saline lagoonal
      environment, with intermittent layers of coarse sediment [...]."
  - id: bertozzo2025a
    notes: >
      Gives "the Papo Seco Formation (lower Barremian)" at Praia do Areia do
      Mastro, Cabo Espichel, and calls it "the Early Cretaceous Papo Seco
      Formation of the Lusitanian Basin".
