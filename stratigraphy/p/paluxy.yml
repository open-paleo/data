name: Paluxy
rank: formation
parent: Trinity
period: [Early Cretaceous]
stages: [Aptian, Albian]
references:
  - id: d'emic2013a
    notes: >
      Gives the Astrophocaudia horizon as "the Trinity Group, uppermost part
      of the middle unit of the Paluxy Formation", "which is lower Albian
      (112.2-106 Ma) in age", while dating the formation as a whole, for the
      Cedarosaurus hind limb, "Paluxy Formation, Aptian-Albian".
  - id: britt2017a
    notes: >
      Independently gives "the lower Albian Paluxy Formation of the Trinity
      Group of Texas".
  - id: martínez2004a
    notes: >
      Gives the source of the titanosauriform SMU 61732 as the "Early
      Cretaceous Paluxy Formation of Texas".
  - id: musacchio1975a
    notes: >
      "The Paluxy Formation (Trinity Group) is referred by some authors to the
      Albian (Stephenson et al., 1942, and Scott, G., 1940)", a remark made in
      passing while comparing Argentine ostracod and charophyte associations
      with North American ones. Flabellochara harrisi in the Paluxy limestone
      "would extend the range of the species to the Albian".
