name: Vectis
rank: formation
parent: Wealden
period: [Early Cretaceous]
stages: [Barremian, Aptian]
references:
  - id: lockwood2021a
    notes: >
      At "40 m or more" thick after Radley and Barker (1998), it is a fraction
      of the roughly 180 m of Wessex Formation beneath it, and is built of
      "argillaceous deposits and occasional interbedded sandstone and shelly
      limestones" laid down in a shallow coastal lagoon. The Barremian–Aptian
      boundary lies "within the Shepherds Chine Member, which forms the
      youngest unit of the formation", after Kerth and Hailwood (1988) and
      Robinson and Hesselbo (2004).
  - id: bonsor2023a
    notes: >
      Magnetostratigraphy puts the base of the Aptian inside the formation's
      youngest member: "The Shepherd's Chine Member is younger than
      magnetostratigraphic cron CM-0, signifying that the base of the Aptian
      passes through the unit", after Kerth and Hailwood (1988). Three members
      make it up, "the Cowleaze Chine Member and the younger Shepherd's Chine
      Member, both dominated by grey dysaerobic mudstones, intercalated by a
      2–6 m thick arenaceous unit, the Barnes High Sandstone Member, deposited
      at the mouth-bar of a distributary river system as it entered a brackish
      lagoon", and it was "formerly known as the Wealden Shales".
  - id: lockwood2024a
    notes: >
      The Barremian-Aptian boundary falls inside the formation's youngest
      unit: "The overlying Vectis Formation has been shown to contain the
      Barremian–Aptian boundary within the Shepherds Chine Member, which forms
      the youngest unit of the formation", after Kerth and Hailwood (1988) and
      Robinson and Hesselbo (2004). The younger of the two formations the Isle
      of Wight Wealden Group is divided into, it is "approximately 40 m of
      clays and shales, with occasional interbedded sandstones and shelly
      limestones containing the bivalve Filosina gregaria and small oysters,
      deposited predominantly in a shallow coastal lagoon of varying
      salinity".
  - id: barker2020a
    notes: >
      Gives the age and what makes the unit unusual, only the Wealden fossils
      "in the Vectis Formation (Barremian to lower Aptian) come from strata
      with an obvious marine contribution".
  - id: barker2023a
    notes: >
      Places spinosaurid material in "the Isle of Wight (Wessex Formation and
      base of the Vectis Formation)".
