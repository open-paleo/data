name: Vectis
rank: formation
parent: Wealden
period: [Early Cretaceous]
stages: [Barremian, Aptian]
variants: [Wealden Shales]
lithology: clay and shale, with occasional sandstone and shelly limestone
references:
  - id: lockwood2021a
    notes: >
      Gives the formation as "40 m or more" of clays with occasional sandstones
      and shelly limestones from a shallow coastal lagoon, with the
      Barremian–Aptian boundary in its youngest member.
  - id: bonsor2023a
    notes: >
      Divides the formation, "formerly known as the Wealden Shales", into the
      Cowleaze Chine, Barnes High Sandstone and Shepherd's Chine Members, and
      puts the base of the Aptian in the last.
  - id: lockwood2024a
    notes: >
      Gives the formation as "approximately 40 m of clays and shales" from a
      shallow coastal lagoon, with the Barremian–Aptian boundary in its youngest
      member. Source of the lithology.
  - id: barker2020a
    notes: >
      Gives the age and what makes the unit unusual, only the Wealden fossils
      "in the Vectis Formation (Barremian to lower Aptian) come from strata
      with an obvious marine contribution".
  - id: barker2023a
    notes: >
      Places spinosaurid material in "the Isle of Wight (Wessex Formation and
      base of the Vectis Formation)".
  - id: kerth1988a
    notes: >
      Calls it "the Vectis Formation (formerly the Wealden Shales)". Its
      reverse-polarity "Vectis Magnetozone" correlates with Lower Aptian chron
      CM-0 or Lower Barremian chron CM-1, "with the former being the more
      likely", so that "the base of the Aptian stage ... must lie within the
      Vectis Formation, at least 25-30m beneath the top of the Shepherd's
      Chine Member".
  - id: robinson2004a
  - id: radley1998a
