name: Villar del Arzobispo
rank: formation
period: [Late Jurassic, Early Cretaceous]
stages: [Kimmeridgian, Tithonian, Berriasian]
lithology: sandstone and clay, with limestone and marl interbeds
dispute:
  summary: >
    What is disputed is the unit's upper boundary, and so its definition,
    rather than the age of any bed. Aurell and colleagues (2016) erect the
    Aguilar del Alfambra and Galve formations for beds previously counted as
    the upper Villar del Arzobispo, which leaves a restricted unit ending
    around the late Tithonian and moves the Las Zabacheras site, the source of
    Aragosaurus, into the Galve Formation. Campos-Soto and colleagues (2019)
    log the same sections afterwards, keep the unit in the broad sense and
    state outright that "there is not agreement on the age or on the
    nomenclature of the unit with Aragosaurus ischiaticus". Both frameworks are
    in current use, so the stages span the broad sense, and the restricted sense
    is noted rather than adopted.
references:
  - id: campos-soto2019a
    notes: >
      Logs the Las Zabacheras, Cedrillas and El Castellar sections, keeps the
      unit in the broad sense, and dates it by larger benthic foraminifera as
      Kimmeridgian–Tithonian, locally into the early Berriasian.
  - id: aurell2016a
    notes: >
      Erects the Aguilar del Alfambra and Galve formations from beds previously
      counted as the upper part of the unit, restricting it in the Galve
      sub-basin to the middle–upper Tithonian.
  - id: canudo2012a
    notes: >
      Dates the unit at Galve "middle Tithonian–upper part of the early
      Berriasian" and places Aragosaurus above its top, in the El Castellar
      Formation.
  - id: sánchez-fenollosa2023a
    notes: >
      Gives "Villar del Arzobispo Formation (upper Kimmeridgian-Tithonian)".
  - id: royo-torres2014a
    notes: >
      Gives the Aragosaurus type locality as "Villar del Arzobispo Formation
      (upper Tithonian-lower Berriasian)".
  - id: sánchez-fenollosa2025a
    notes: >
      Source of the lithology.
