name: Villar del Arzobispo
rank: formation
period: [Late Jurassic, Early Cretaceous]
stages: [Kimmeridgian, Tithonian, Berriasian]
dispute:
  summary: >
    What is disputed is the unit's upper boundary, and so its definition,
    rather than the age of any bed. Aurell and colleagues (2016) erect the
    Aguilar del Alfambra and Galve formations for beds previously counted as
    the upper Villar del Arzobispo, which leaves a restricted unit ending
    around the late Tithonian and moves the Las Zabacheras site, the source of
    Aragosaurus, into the Galve Formation. Campos-Soto and colleagues (2019)
    log the same sections afterwards, keep the unit in the broad sense and
    state outright that "there is not agreement on the age or on the
    nomenclature of the unit with Aragosaurus ischiaticus". Both frameworks
    are in current use, so the stages given here span the broad sense and the
    restricted sense is recorded rather than adopted.
references:
  - id: campos-soto2019a
    notes: >
      Logging the Las Zabacheras, Cedrillas and El Castellar sections after
      the Aguilar del Alfambra and Galve formations were erected, these authors
      keep the unit in the broad sense and record that "there is not agreement
      on the age or on the nomenclature of the unit with Aragosaurus
      ischiaticus". Larger benthic foraminifera date the dinosaur-bearing
      record of eastern Spain, which they correlate with the Villar del
      Arzobispo Formation, to the "Kimmeridgian–Tithonian" and "locally, in the Las
      Zabacheras-Galve area, a Kimmeridgian–Early Berriasian? age", against
      previous work that ran it from the Kimmeridgian into the Berriasian,
      Valanginian, Hauterivian, Barremian or even the Aptian-Albian. They
      record that "since the 90s, the Kimmeridgian age was discarded and they
      were assigned to the Tithonian–Berriasian", and that the unit has more
      recently been dated as Kimmeridgian at Benagéber and
      Kimmeridgian-Tithonian in the western Peñagolosa sub-basin. They propose
      redefining the formation on its Cedrillas parastratotype.
  - id: aurell2016a
    notes: >
      "Two new lithostratigraphic units are defined and characterized, the
      Aguilar del Alfambra and the Galve formations", replacing a framework
      that "considered only two lithostratigraphic units (the Villar del
      Arzobispo and El Castellar formations) bounded by a single regional
      unconformity, and this resulted in significant misinterpretations". The
      Aguilar del Alfambra takes beds previously counted as the upper Villar
      del Arzobispo, and the erosive unconformity between the two falls
      "around the late Tithonian", tied to a relative fall in sea level "at
      the end of the Jurassic in the studied Galve sub-basin". On this
      proposal "the site of Las Zabacheras is located in the lower part of the
      Galve Formation and the Las Cerradicas tracksite in the upper levels of
      the Villar del Arzobispo Formation", the Galve being "poorly constrained
      from late Berriasian to Hauterivian". The restricted unit is 140 to 170 m thick
      across most of the sub-basin and carries Anchispirocyclina lusitanica at
      several levels, a foraminifer they say ranges from the middle Tithonian
      to the earliest Berriasian. The framework they replace, with a single
      regional unconformity, had the formation running from the Tithonian to
      the middle Berriasian.
  - id: canudo2012a
    notes: >
      The unit at Galve is "middle Tithonian–upper part of the early
      Berriasian", with the "Jurassic–Cretaceous boundary" "assumed to be
      located near the top of the unit" on correlation with the more open
      eastern domains of the basin. A charophyte from a carbonate level close
      to the top near Las Zabacheras "characterizes a charophyte biochronozone
      that is from the upper part of the early Berriasian or middle Berriasian
      in age". Canudo and colleagues use that top, and the low-angle
      unconformity above it, to place Aragosaurus in the overlying El
      Castellar Formation instead.
  - id: sánchez-fenollosa2023a
    notes: >
      Gives "Villar del Arzobispo Formation (upper Kimmeridgian-Tithonian".
  - id: royo-torres2014a
    notes: >
      Gives the Aragosaurus type locality as "Villar del Arzobispo Formation
      (upper Tithonian-lower Berriasian)".
