name: Valle de la Luna
rank: member
parent: Ischigualasto
period: [Late Triassic]
stages: [Carnian, Norian]
references:
  - id: sciscio2017a
    notes: >
      Two 40Ar/39Ar dates on the member conflict: "(i) 40Ar/39Ar date of the
      Valle de la Luna Member (feldspars): 217.0±1.7 Ma by Shipman (2004);
      (ii) 40Ar/39Ar date of the Valle de la Luna Member (ISCH-6-611):
      225.9±0.9 Ma by Martínez et al. (2011)". Both come from the upper part
      of the member, whose beds underlie the Los Colorados Formation and are
      its "sole radiometric controls"; the mismatch is attributed to "the
      low-precision methods of 40Ar/39Ar dating, the complexity in
      underpinning a central age-date plateau, or ... other sedimentological
      complications".
  - id: ezcurra2010a
    notes: >
      A recalculated age of "about 219.4–220.4 ± 1.7 Ma" for an ash at its top
      locates "the top of the Valle de la Luna Member of the Ischigualasto Fm.
      in the mid-Norian". With the recalculated date from the lower part of
      the formation, it concludes that "the Carnian–Norian boundary should be
      located close to the middle of the formation probably within the Valle
      de la Luna Member".
  - id: peyredefabrègues2015a
    notes: >
      Uses it as the locality for Eoraptor in the Ischigualasto Formation of
      San Juan Province, Argentina.
