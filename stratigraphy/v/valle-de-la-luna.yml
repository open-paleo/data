name: Valle de la Luna
rank: member
parent: Ischigualasto
period: [Late Triassic]
stages: [Carnian, Norian]
dispute:
  summary: >
    Currie and colleagues (2009), who defined the member, give "a Carnian age
    of deposition for all of the lithostratigraphic members"; Ezcurra (2010)
    places the Carnian–Norian boundary "probably within the Valle de la Luna
    Member", and Martínez and colleagues (2012), from dates of 231.4 ± 0.3 Ma
    near the base of the formation and 225.9 ± 0.9 Ma near its top, have the
    formation laid down "during the late Carnian to early Norian".
references:
  - id: sciscio2017a
    notes: >
      Two 40Ar/39Ar dates on the member conflict: "(i) 40Ar/39Ar date of the
      Valle de la Luna Member (feldspars): 217.0±1.7 Ma by Shipman (2004);
      (ii) 40Ar/39Ar date of the Valle de la Luna Member (ISCH-6-611):
      225.9±0.9 Ma by Martínez et al. (2011)". Both come from the upper part
      of the member, whose beds underlie the Los Colorados Formation and are
      its "sole radiometric controls"; the mismatch is attributed to "the
      low-precision methods of 40Ar/39Ar dating, the complexity in
      underpinning a central age-date plateau, or ... other sedimentological
      complications".
  - id: ezcurra2010a
    notes: >
      A recalculated age of "about 219.4–220.4 ± 1.7 Ma" for an ash at its top
      locates "the top of the Valle de la Luna Member of the Ischigualasto Fm.
      in the mid-Norian". With the recalculated date from the lower part of
      the formation, it concludes that "the Carnian–Norian boundary should be
      located close to the middle of the formation probably within the Valle
      de la Luna Member".
  - id: peyredefabrègues2015a
    notes: >
      Uses it as the locality for Eoraptor in the Ischigualasto Formation of
      San Juan Province, Argentina.
  - id: currie2009a
    notes: >
      Designates the member formally, the third of "the La Peña Member, the
      Cancha de Bochas Member, the Valle de la Luna Member, and the Quebrada
      de la Sal Member": "250–470 m of mudstone and sandstone", with its type
      section in their Section 1 and its base "at the top of the upper-most
      calcareous paleosol in the Cancha de Bochas Member". States that
      "Vertebrate fossils and isotopic ages of volcanic rocks in the
      Ischigualasto Formation indicate a Carnian age of deposition for all of
      the lithostratigraphic members".
  - id: martínez2011a
    notes: >
      Gives the Eodromaeus horizon as "Ischigualasto Formation, Valle de la
      Luna Member (PVSJ 560 to 563), ~200 m from base of the formation".
  - id: martínez2012b
    notes: >
      Dates bentonite ISCH-6-611, "630 m above the base and 70 m below the top
      of the formation", at a final 225.9 ± 0.9 Ma, and with the 231.4 ± 0.3
      Ma date near the base has the formation laid down "during the late
      Carnian to early Norian".
