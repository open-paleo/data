name: Valle de la Luna
rank: member
parent: Ischigualasto
period: [Late Triassic]
stages: [Carnian, Norian]
lithology: mudstone and sandstone
dispute:
  summary: >
    Currie and colleagues (2009), who defined the member, give "a Carnian age
    of deposition for all of the lithostratigraphic members"; Ezcurra (2010)
    places the Carnian–Norian boundary "probably within the" Valle de la Luna
    Member, and Martínez and colleagues (2012), from dates of 231.4 ± 0.3 Ma
    near the base of the formation and 225.9 ± 0.9 Ma near its top, have the
    formation laid down "during the late Carnian to early Norian".
references:
  - id: sciscio2017a
    notes: >
      Lists two conflicting 40Ar/39Ar dates from the upper member, 217.0 ± 1.7
      and 225.9 ± 0.9 Ma, as the "sole radiometric controls" for the overlying
      Los Colorados Formation.
  - id: ezcurra2010a
    notes: >
      Recalculates an ash date from the top of the member to "about 219.4–220.4
      ± 1.7 Ma", placing that top "in the mid-Norian" and the Carnian–Norian
      boundary probably within the member.
  - id: currie2009a
    notes: >
      Designates the member, "250–470 m of mudstone and sandstone" with its
      type section in Section 1, and gives all four members "a Carnian age of
      deposition", reading its dates, among them 217.0 ± 1.7 Ma near the top
      of the member, on the time scale of Gradstein and colleagues (1995);
      217.0 Ma is Norian on the ICS chart v2024/12. Source of the lithology.
  - id: martínez2011a
    notes: >
      Gives the Eodromaeus horizon as "Ischigualasto Formation, Valle de la
      Luna Member (PVSJ 560 to 563), ~200 m from base of the formation".
      Brackets the formation between its own argon dates of 231.4 and 225.9 Ma
      and, interpolating between them, draws the Carnian–Norian boundary
      inside the member.
  - id: martínez2012b
    notes: >
      Dates bentonite ISCH-6-611, "630 m above the base and 70 m below the top
      of the formation", at a final 225.9 ± 0.9 Ma, and with the 231.4 ± 0.3
      Ma date near the base has the formation laid down "during the late
      Carnian to early Norian".
  - id: shipman2004a
    notes: >
      A doctoral thesis that names no members. Near the top of the formation it
      prints "611m, 223 Ma (Currie et al., 2001)" and its own date as "352m,
      218.5± 1.7 Ma".
  - id: currie2001a
  - id: gradstein1995a
