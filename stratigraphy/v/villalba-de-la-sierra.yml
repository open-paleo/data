name: Villalba de la Sierra
rank: formation
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
references:
- id: díezdíaz2016a
  notes: >
    Printed in full as the Margas, Arcillas y Yesos de Villalba de la
    Sierra Formation. The Lo Hueco site at Fuentes, Cuenca, lies in its
    upper part and is given as upper Campanian to lower Maastrichtian.
- id: mocho2024a
  notes: >
    Repeats the late Campanian to early Maastrichtian age for the Lo Hueco
    bonebed.
- id: csiki-sava2015a
  notes: >
    Places the formation's Lo Hueco assemblage among the late Campanian to
    early Maastrichtian faunas of Spain.
