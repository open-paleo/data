name: Villalba de la Sierra
rank: formation
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
variants: ["Margas, arcillas y yesos de Villalba de la Sierra"]
references:
- id: díezdíaz2016a
  notes: >
    Printed in full as the Margas, Arcillas y Yesos de Villalba de la Sierra
    Formation. The Lo Hueco site at Fuentes, Cuenca, lies in its upper part,
    in the "late Campanian-early Maastrichtian interval (Ortega et al.,
    2015)".
- id: mocho2024a
  notes: >
    Repeats the late Campanian to early Maastrichtian age for the Lo Hueco
    bonebed.
- id: csiki-sava2015a
  notes: >
    Places the formation's Lo Hueco assemblage among the late Campanian to
    early Maastrichtian faunas of Spain.
- id: vilas1982a
  notes: >
    Names the unit formally, "Formación Margas, arcillas y yesos de Villalba
    de la Sierra", replacing informal names that include the "Facies
    Garumniense". The type section lies 2.5 km north of Villalba de la
    Sierra, 157 m thick there and "from 0 to 500 m" across the area. It
    rests on the Brechas Dolomíticas de Cuenca, passes laterally
    southeastward into the Sierra Perenchiza Formation, and its upper limit
    is "transitional toward the Lower Tertiary materials in the El Santerón
    area and sharp and unconformable in the rest of the area". "The age of
    the Formation is Campanian-Maastrichtian", on charophytes.
- id: ortega2015a
  notes: >
    Places the Lo Hueco beds in "the upper part of the 'Margas, Arcillas y
    Yesos de Villalba de la Sierra' Formation (Vilas et al., 1982)", dated
    upper Campanian to lower Maastrichtian on palynology.
- id: gutiérrez1979a
  notes: >
    Describes the same continental series before its formal naming: its base
    lies "near the Santonian-Campanian boundary" and "The remainder of the
    unit, which presents abundant fragments of dinosaur eggs up to near the
    top, spans up to the upper Maastrichtian", while the detrital part
    above, "clearly discordant at Villalba de la Sierra, represents the
    Paleogene".
beds:
  - name: G1
    informal: true
    period: [Late Cretaceous]
    stages: [Campanian, Maastrichtian]
    references:
      - id: díezdíaz2016a
        notes: >
          Names the bed and its setting: "The bed in which the described specimen
          was collected was identified as G1 ..., corresponding to the proximal
          part of a flooded muddy plain, close to distributary channels", within
          the upper Villalba de la Sierra Formation at "The upper
          Campanian-lower Maastrichtian site of Lo Hueco". The string does double
          duty, the paper also
          using G1 for one of the site's excavation areas.
