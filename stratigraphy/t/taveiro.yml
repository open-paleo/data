name: Taveiro
rank: formation
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
lithology: reddish mudstone, with lenticular coarse sandstone beds
references:
  - id: antunes1991a
    notes: >
      Gives the Taveirosaurus type horizon as "Sands and clays of Taveiro,
      Late Campanian ? and Maestrichtian (the new taxon is Maestrichtian)", in
      Portugal: Maastrichtian, with a questioned late Campanian part. The
      Euronychodon entry repeats the age for the "Clays and sands of Taveiro".
  - id: kullberg2013a
    notes: >
      Describes its rock: "Sedimentation was essentially lutitic, consisting of
      successions of reddish mudstones with remains of small vertebrates (...)
      and terrestrial molluscs, among which coarse arenaceous levels were
      intercalated, frequently with lenticular geometry."
