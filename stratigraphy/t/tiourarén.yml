name: Tiourarén
rank: formation
parent: Irhazer
period: [Middle Jurassic, Late Jurassic]
stages: [Bathonian, Callovian, Oxfordian]
lithology: red to purple mudstone and siltstone, with rare channel sandstone and
  thin marly limestone
references:
  - id: mannion2025a
    notes: >
      Gives the current reading: Jobaria tiguidensis comes from "the
      Bathonian-Callovian Tiouraren Formation of Niger", crediting Rauhut and
      López-Arbarello (2009) alongside Sereno and colleagues (1999).
  - id: holtz2004a
    notes: >
      Carries the superseded Cretaceous reading, tabulating the formation as
      Barremian. Upchurch and colleagues (2004) give a similar
      Hauterivian-Barremian range in the same volume. The Jurassic redating
      has since been adopted, so this is history rather than a live
      disagreement.
  - id: remes2009a
    notes: >
      Places the Spinophorosaurus site below the formation, "at the base of the
      Irhazer Group", and follows Rauhut and López-Arbarello (2009) in a late
      Middle to early Late Jurassic age.
  - id: sereno1994a
    notes: >
      Suggests the fauna from the Tiourarén beds "may be somewhat older
      (Hauterivian or Barremian, 125 to 135 million years ago) because they
      lie stratigraphically below the Gadoufaoua fauna", which is regarded as
      Aptian or Albian.
  - id: upchurch2004a
    notes: >
      Tabulates Jobaria from the formation and the Farak Formation together,
      under one age for both, "Hauterivian-Barremian, ?late Albian-early
      Cenomanian".
  - id: rauhut2009a
    notes: >
      Reviews the fish, invertebrates and geological relations, and argues from
      the dinosaurs' relationships for "a pre-Kimmeridgian, probably late Middle
      Jurassic age".
  - id: sereno1999a
    notes: >
      Names Jobaria tiguidensis from the formation and dates it "Neocomian",
      about 140 to 130 million years ago, below the Aptian-Albian horizons of
      the Tegama Group.
  - id: rauhut2016a
    notes: >
      Follows Rauhut and López-Arbarello (2009) in a late Middle Jurassic age,
      and tabulates the formation as "?Bathonian-?Oxfordian".
  - id: devries2022a
    notes: >
      A methods paper co-written by Sereno that describes an armored
      dinosaur "excavated in the Jurassic horizons in Niger" and buried "in
      the Tiouraren Formation", so the describing group of the Cretaceous
      reading now treats the beds as Jurassic. It gives no stage and argues
      no age.
  - id: sánchez-hernández2014a
    notes: >
      Still gives "the Tiourarén Formation (?Hauterivian)" for Spinostropheus
      in 2014, relaying the earlier Cretaceous reading after 2009.
  - id: carrano2012a
    notes: >
      Gives the Afrovenator occurrence as "Middle–Late Jurassic or Neocomian,
      Early Cretaceous", listing both readings as alternatives without
      choosing.
  - id: serrano-martínez2014a
    notes: >
      Source of the lithology.
