name: Tugulu
rank: group
period: [Early Cretaceous]
stages: [Valanginian, Hauterivian, Barremian, Aptian, Albian]
references:
  - id: zheng2023a
    notes: >
      Treats it as "the Lower Cretaceous Tugulu Group" and concludes that "The
      Tugulu Group thus formed during the Early Cretaceous". Gives the group's
      order and dates its formations, which is what carries the older bound:
      "the Tugulu Group consists (in ascending order) of the Qingshuihe,
      Hutubihe, Shengjinkou, and Lianmuqin Formations". The Hutubihe
      sporopollen assemblage indicates "a Valanginian age", the paper "places
      the upper Shengjinkou Formation within the Valanginian Stage", and the
      Lianmuqin "could have been deposited as early as the Valanginian". A
      group's envelope has to admit the ages published for the units inside
      it.
  - id: sereno2010a
    notes: >
      Gives a type horizon line: "Tugulu Group (Aptian), Delunshan, Junggar
      Basin, Xinjiang Uygur Autonomous Region, People's Republic of China".
  - id: meso2024a
    notes: >
      Calls the unit the "Barremian-Aptian Tugulu Group", with Xiyunykus and
      Tugulusaurus from its "upper section".
  - id: tong2021a
    notes: >
      Dracochelys bicuspis comes from the "Tugulu Group (Early Cretaceous),
      Junggar Basin, China" and Wuguia from the "Hutubihe Fm. and Lianmuxin
      Fm., Tugulu Group (Early Cretaceous), Junggar Basin, Xinjiang, China".
      The occurrence table hedges one of those formations further, giving
      "Lianmuxin Fm. (Tugulu Group) Early Cretaceous (Aptian–Albian?)".
  - id: tucker2022a
    notes: >
      "Strata of the Tugulu Group (China) likely span the Valanginian;
      however, it is unclear which of its formations dates to this age", the
      Qingshuihe, Hutubihe and Lianmuqin all having "variably been dated to
      the Valanginian".
  - id: tumanova2018a
    notes: >
      Wuerhosaurus homheni comes from the Tugulu Group of northwestern China,
      whose deposits "were previously dated Neocomian–Albian" by Dong (1992)
      and "apparently correspond to the Tsagaantsav Horizon in Mongolia"; that
      horizon, dated Neocomian by Shuvalov (2000) and Barremian–Aptian by
      Lucas (2006), "more probably should be assigned to the
      Hauterivian–Barremian".
