name: Twin Mountains
rank: formation
parent: Trinity
period: [Early Cretaceous]
stages: [Aptian, Albian]
lithology: conglomerate and sandstone below, thinly interbedded sandstone and
  mudstone above
references:
  - id: andrzejewski2019a
    notes: >
      Gives "the Twin Mountains Formation (Aptian) of north-central Texas", and
      places the overlying Glen Rose "biostratigraphically near the
      Aptian-Albian boundary (~113 Ma)". Describes its rock: "The basal portion
      of the Twin Mountains Formation consists primarily of conglomerates and
      sandstones and the upper portion comprises thinly interbedded sands and
      mudstones".
  - id: d'emic2012c
    notes: >
      Gives the age and the correlation: "Early Cretaceous (Aptian-Albian)
      Twin Mountains Formation of north-central Texas", which "is laterally
      equivalent to the Antlers Formation".
