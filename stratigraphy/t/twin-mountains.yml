name: Twin Mountains
rank: formation
parent: Trinity
period: [Early Cretaceous]
stages: [Aptian, Albian]
references:
  - id: andrzejewski2019a
    notes: >
      Gives "the Twin Mountains Formation (Aptian) of north-central Texas",
      and places the overlying Glen Rose "biostratigraphically near the
      Aptian-Albian boundary (~113 Ma)".
  - id: d'emic2013a
    notes: >
      Gives the age and the correlation: "Early Cretaceous (Aptian-Albian)
      Twin Mountains Formation of north-central Texas", which "is laterally
      equivalent to the Antlers Formation".
