name: Twin Mountains
rank: formation
parent: Trinity
period: [Early Cretaceous]
stages: [Aptian, Albian]
description: "The Twin Mountains Formation, also known as the Twin Mak Formation, is a sedimentary rock formation, within the Trinity Group, found in Texas of the United States of America. It is a terrestrial formation of Aptian age (Lower Cretaceous), and is notable for its dinosaur fossils. Dinosaurs from this formation include the large theropod Acrocanthosaurus, the sauropod Sauroposeidon, as well as the ornithopods Tenontosaurus and Convolosaurus."
references:
  - id: andrzejewski2019a
    notes: >
      Gives "the Twin Mountains Formation (Aptian) of north-central Texas",
      and places the overlying Glen Rose "biostratigraphically near the
      Aptian-Albian boundary (~113 Ma)".
  - id: d'emic2012c
    notes: >
      Gives the age and the correlation: "Early Cretaceous (Aptian-Albian)
      Twin Mountains Formation of north-central Texas", which "is laterally
      equivalent to the Antlers Formation".
