name: Talarn
rank: formation
parent: Tremp
period: [Late Cretaceous]
stages: [Maastrichtian]
references:
  - id: serrano2021a
    notes: >
      Carries the formation in the "upper Maastrichtian", and dates the Sant
      Romà d'Abella strata inside it by magnetostratigraphy: "This locality
      corresponds to the upper Maastrichtian (C29r chron) strata of the Talarn
      Formation".
  - id: dallavecchia2020a
    notes: >
      Gives "the uppermost Maastrichtian Talarn Formation, which originated
      during the magnetochron C29r".
  - id: prieto-márquez2022a
    notes: >
      Places it in its group and dates it by magnetostratigraphy: "the Talarn
      Formation of the Tremp Group and isotopic, magnetostratigraphic, and
      biochronological calibrations indicate that the locality correlates with
      the middle part of the C29r magnetochron (latest Maastrichtian". This is
      also the statement that settles the Tremp's rank. The unit does not
      reach the western Tremp Syncline, where the coarser `group: Tremp` is
      the correct resolution; and it straddles the K-Pg, running from the
      latest Maastrichtian into the Danian, so the name alone does not fix a
      dinosaur-bearing horizon's age. About 3.85 Ma of section is missing
      between it and the Conques.
