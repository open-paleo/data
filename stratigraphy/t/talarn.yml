name: Talarn
rank: formation
parent: Tremp
period: [Late Cretaceous]
stages: [Maastrichtian]
references:
  - id: díez-canseco2014a
    notes: >
      Includes the formation in the Lower Red Unit, which its planktic
      foraminifera date as Maastrichtian: "the Lower Red Unit in the studied
      section may therefore be exclusively Maastrichtian".
  - id: serrano2021a
    notes: >
      Carries the formation in the "upper Maastrichtian", and dates the Sant
      Romà d'Abella strata inside it by magnetostratigraphy: "This locality
      corresponds to the upper Maastrichtian (C29r chron) strata of the Talarn
      Formation".
  - id: dallavecchia2020a
    notes: >
      Gives "the uppermost Maastrichtian Talarn Formation, which originated
      during the magnetochron C29r".
  - id: prieto-márquez2022a
    notes: >
      Places it in its group and dates it by magnetostratigraphy: "the Talarn
      Formation of the Tremp Group and isotopic, magnetostratigraphic, and
      biochronological calibrations indicate that the locality correlates with
      the middle part of the C29r magnetochron (latest Maastrichtian)". This is
      also the statement that settles the Tremp's rank. The unit does not
      reach the western Tremp Syncline, where the coarser `group: Tremp` is
      the correct resolution. Its site "occurs 25 m below the local K-Pg
      boundary", within the last 100,000 years of the Maastrichtian; the paper
      does not place the boundary inside the formation. About 3.85 Ma of
      section is missing between it and the Conques.
  - id: cuevas1992a
    notes: >
      Erects the unit as the "Formación Lutitas, Areniscas y Conglomerados de
      Talarn", with no members, in the Tremp Group. The type section is in the
      Barranco de La Mata, southeast of Gurp, about 140 m of red and variegated
      mudstones, sandstones and conglomerates in a fining-upward megasequence. Its
      top differs across the Noguera Pallaresa: the Esplugafreda Formation to the
      west, the Suterranya and Sant Salvador limestones to the east. Gives no age
      of its own.
  - id: fondevilla2019a
    notes: >
      Gives the formation no chron or age in its text; its section charts for
      the northern and central Isona sector place it in the upper Maastrichtian,
      in chron C29r, above a hiatus spanning chrons C31n to C30n.
  - id: pujalte2005a
    notes: >
      Concludes that "la Fm Talarn corresponde al Maastrichtiense
      superior-Daniense" (the Talarn Fm corresponds to the upper
      Maastrichtian–Danian, translated), after redefining the formation's top
      "exclusively by means of the lithohorizon criterion" (translated). In
      the Esplugafreda ravine that boundary moves beds previously assigned to
      the Esplugafreda Formation into the Talarn, and the Danian rests on the
      age of the Tremp-Colmenar horizon at the redefined top, relayed from
      Eichenseer (1988). The Danian belongs to the formation as redefined, not
      to the Talarn of Cuevas (1992).
  - id: eichenseer1988a
