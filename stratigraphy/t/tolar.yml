name: Tolar
rank: formation
period: [Late Cretaceous]
stages: [Cenomanian, Turonian, Coniacian, Santonian, Campanian, Maastrichtian]
references:
  - id: kellner2011a
    notes: >
      Describes titanosaur remains "collected in the Tolar Formation (Upper
      Cretaceous) at the Atacama Desert (Antofagasta Region), northern Chile".
      Gives only the series.
  - id: rubilar-rogers2021a
    notes: >
      Sets the same material beside Arackar and Yamanasaurus, from "the Upper
      Cretaceous Tolar Formation in the Atacama Desert".
  - id: santucci2022a
    notes: >
      Tabulates Atacamatitan from the "Tolar Fm., Chile" as
      "Cenomanian–Maastrichtian (LK)". The text adds that before Atacamatitan
      "the inferred age for the Tolar Formation had not been precisely
      defined", and that the specimen "implies a Cretaceous age at least for
      the outcrops of this formation near the city of Conchi Viejo".
