name: Tiantai
rank: group
period: [Early Cretaceous, Late Cretaceous]
stages: [Albian, Cenomanian, Turonian]
lithology: red beds interbedded with tuff
references:
- id: he2012a
  notes: >
    Cited by Xi and colleagues (2018) for SIMS zircon U-Pb ages of the Laijia
    and Chichengshan Formations.
- id: zheng2012a
  notes: >
    Names the group and its three constituent formations, the Tangshang,
    Liangtoutang and Chichengshan, in ascending sequence in the Tiantai
    Basin of Zhejiang.
- id: zheng2018a
  notes: >
    Gives the same three-formation succession where the group crops out in
    the Huzhen Basin, and calls it Cretaceous.
- id: xi2018a
  notes: >
    Relays zircon ages of 99–96 Ma for the Laijia and 94–91 Ma for the
    Chichengshan Formation from He and colleagues (2012), and calls the group
    late Early to early Late Cretaceous.
- id: yu2010a
  notes: >
    Dates volcanics in the lower Tangshang Formation, at the base of the group,
    to 109.2 Ma, and gives a 94 Ma zircon age for volcanics of the Chichengshan
    Formation.
- id: gale2020a
  notes: >
    Puts the base of the Albian at 113.2 Ma and the base of the Turonian at
    93.9 Ma.
- id: xi2021a
  notes: >
    Source of the lithology.
