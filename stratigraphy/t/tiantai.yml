name: Tiantai
rank: group
period: [Early Cretaceous, Late Cretaceous]
stages: [Albian, Cenomanian, Turonian]
references:
- id: zheng2012a
  notes: >
    Names the group and its three constituent formations, the Tangshang,
    Liangtoutang and Chichengshan, in ascending sequence in the Tiantai
    Basin of Zhejiang.
- id: zheng2018a
  notes: >
    Gives the same three-formation succession where the group crops out in
    the Huzhen Basin, and calls it Cretaceous.
- id: xi2018a
  notes: >
    Dates the group's upper formations, relaying "zircon SIMS U-Pb ages of
    99–96 and 94–91 Ma in the Laijia and Chichengshan Formations of the
    Tiantai Group, respectively", Cenomanian and latest Cenomanian to Turonian
    on the ICS chart v2024/12. The text credits these to "He et al. (2012)",
    but the work meant is the Tiantai Basin dating paper by He and colleagues
    in Journal of Asian Earth Sciences 62, which the reference list dates
    2013; its 2012 entry for He and colleagues is a Songliao Basin paper. At
    group level, "the Qujiang, Yongkang and Tiantai Groups are contemporaneous
    facies from the late early Cretaceous to early late Cretaceous".
- id: yu2010a
  notes: >
    Dates the lowest formation: "天台群塘上组下部沉积岩中化石是馆头组中常见的分子，火山岩同位素年龄为(109.2±1.9)Ma"
    ("the fossils in the sedimentary rocks of the lower Tangshang Formation of
    the Tiantai Group are elements common in the Guantou Formation, and the
    isotopic age of its volcanic rocks is (109.2±1.9) Ma", p. 98, translated),
    Albian on the ICS chart v2024/12. Also gives "天台群赤城山组中火山岩锆石U-Pb年龄为94 Ma"
    ("the zircon U-Pb age of the volcanic rocks of the Chichengshan Formation
    of the Tiantai Group is 94 Ma", p. 98, translated), a figure it takes from
    an unpublished 2004 regional geological survey report of the Nanjing
    Institute of Geology and Mineral Resources. The group thus runs Albian to
    Turonian.
- id: gale2020a
  notes: >
    Puts the base of the Albian at 113.2 Ma and the base of the Turonian at
    93.9 Ma.
