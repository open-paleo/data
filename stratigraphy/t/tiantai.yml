name: Tiantai
rank: group
period: [Early Cretaceous, Late Cretaceous]
stages: [Albian, Cenomanian, Turonian]
references:
- id: zheng2012a
  notes: >
    Names the group and its three constituent formations, the Tangshang,
    Liangtoutang and Chichengshan, in ascending sequence in the Tiantai
    Basin of Zhejiang.
- id: zheng2018a
  notes: >
    Gives the same three-formation succession where the group crops out in
    the Huzhen Basin, and calls it Cretaceous.
- id: xi2018a
  notes: >
    Dates the group's upper formations: "He et al. (2012) published zircon SIMS
    U-Pb ages of 99–96 and 94–91 Ma in the Laijia and Chichengshan Formations of
    the Tiantai Group, respectively", Cenomanian and latest Cenomanian to
    Turonian on the ICS chart v2024/12. At group level, "the Qujiang, Yongkang
    and Tiantai Groups are contemporaneous facies from the late early Cretaceous
    to early late Cretaceous".
- id: yu2010a
  notes: >
    Dates the lowest formation: fossils in "the lower Tangshang Formation of the
    Tiantai Group are elements common in the Guantou Formation, and the isotopic
    age of its volcanic rocks is (109.2±1.9) Ma", Albian on the ICS chart
    v2024/12. Also gives "the zircon U-Pb age of 94 Ma for the volcanic rocks of
    the Chichengshan Formation of the Tiantai Group". The group thus runs Albian
    to Turonian.
- id: gale2020a
  notes: >
    Puts the base of the Albian at 113.2 Ma and the base of the Turonian at
    93.9 Ma.
