name: Tendaguru
rank: formation
period: [Late Jurassic, Early Cretaceous]
stages: [Oxfordian, Kimmeridgian, Tithonian, Berriasian, Valanginian, Hauterivian]
lithology: siltstone and fine-grained sandstone, with bioclastic sandstone
references:
  - id: mannion2019a
    notes: >
      Treats only the Late Jurassic part, "The Late Jurassic
      (Kimmeridgian–Tithonian) Tendaguru Formation", and places every sauropod
      it treats in the Upper Dinosaur Member, dated Tithonian.
  - id: schrank2005a
    notes: >
      Dates the beds by dinoflagellate cysts, from an Oxfordian–Kimmeridgian
      assemblage in the Nerinea Bed to a late Valanginian–Hauterivian one
      probably from the Trigonia schwarzi Bed.
  - id: bussert2009a
    notes: >
      Raises the Tendaguru Beds to formation rank and dates it from the middle
      Oxfordian to "the Valanginian through Hauterivian or possibly Aptian".
      Source of the lithology.
  - id: rauhut2011a
    notes: >
      Gives the full span, "Tendaguru Formation, Tanzania (Oxfordian-
      Tithonian)". Narrower readings exist: Upchurch and colleagues (2004)
      tabulate it as Kimmeridgian.
  - id: upchurch2004a
