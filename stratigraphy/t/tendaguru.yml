name: Tendaguru
rank: formation
period: [Late Jurassic, Early Cretaceous]
stages: [Oxfordian, Kimmeridgian, Tithonian, Berriasian, Valanginian, Hauterivian]
references:
  - id: mannion2019a
    notes: >
      Works only in the Late Jurassic part, writing of "The Late Jurassic
      (Kimmeridgian-Tithonian) Tendaguru Formation" and, in its opening
      sentence, of "The Late Jurassic section of the Tendaguru Formation of
      southeastern Tanzania". Every sauropod treated is placed in the "Upper
      Dinosaur Member (Upper Saurian Bed), Tendaguru Formation; Tithonian,
      Late Jurassic", so the narrower age is the dinosaur-bearing interval
      rather than the formation's full span.
  - id: schrank2005a
    notes: >
      Dates the unit by its dinoflagellate cysts, recovered from "the
      dinosaur-bearing Tendaguru Beds (Upper Jurassic-Lower Cretaceous)", and
      resolves four assemblages running from "the Rigaudella
      aemula-Chlamydophorella wallala assemblage from the Nerinea Bed
      (Oxfordian to Kimmeridgian)" up to the Trigonia schwarzi Bed, for which
      the evidence "indicates a late Valanginian to Hauterivian age". The many
      Callovian records in the paper are ranges of individual species in
      Australia, Europe and elsewhere rather than ages for these beds.
  - id: bussert2009a
    notes: >
      Raises the Tendaguru Beds to formation rank and dates the unit end to
      end: "The age of the whole formation apparently ranges at least from the
      middle Oxfordian to the Valanginian through Hauterivian or possibly
      Aptian." In the type area that falls into a Late Jurassic lower part,
      "from the middle Oxfordian through the Tithonian (Lower to Upper
      Dinosaur Member)", and an Early Cretaceous top, "from the Valanginian
      through Hauterivian or possibly Aptian (Rutitrigonia bornhardti-schwarzi
      Member)". A Callovian age appears only as an older opinion of Dietrich's
      for the Lower Dinosaur Member, and the Jurassic/Cretaceous boundary
      within the formation is left "as yet uncertain".
  - id: rauhut2011a
    notes: >
      Gives the full span, "Tendaguru Formation, Tanzania (Oxfordian-
      Tithonian". Narrower readings exist: Upchurch and colleagues (2004)
      tabulate it as Kimmeridgian.
  - id: upchurch2004a
