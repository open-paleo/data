name: Taynton Limestone
rank: formation
parent: Great Oolite
period: [Middle Jurassic]
stages: [Bathonian]
variants: [Taynton Stone]
references:
  - id: barron2012a
    notes: >
      The formal entry, giving the parent as the Great Oolite Group and the
      age as "Bathonian, Progracilis" zone, and the original name: "Name
      introduced (as Taynton Stone) by Woodward ... for a 'freestone' within
      the Great Oolite sequence". Records that the "Stonesfield Slate Beds"
      "are now known to lie at three levels within the ooidal limestone beds
      of the Taynton Limestone Formation, necessitating their continued
      informal status".
  - id: benson2010c
    notes: >
      Gives the Megalosaurus type horizon as "one or more discrete horizons
      ('Stonesfield Slate' ...) within the Taynton Limestone Formation (middle
      Bathonian Procerites progracilis ammonite zone) of Stonesfield,
      Oxfordshire".
  - id: carrano2012a
    notes: >
      Places the Megalosaurus bucklandii type series in the "'Stonesfield
      Slate' facies of the Taynton Limestone Formation", and gives the
      Stonesfield ilium of Iliosuchus as from the "Taynton Limestone
      Formation, Bathonian, Middle Jurassic, England".
