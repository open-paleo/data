name: Taynton Limestone
rank: formation
parent: Great Oolite
period: [Middle Jurassic]
stages: [Bathonian]
variants: [Taynton Stone]
lithology: white to pale brown ooidal limestone, with thin calcilutite and
  calcareous sandstone beds
references:
  - id: barron2012a
    notes: >
      The formal entry, giving the parent as the Great Oolite Group and the age
      as "Bathonian, Progracilis" zone, and the original name: "Name introduced
      (as Taynton Stone) by Woodward ... for a 'freestone' within the Great
      Oolite sequence". Records that the "Stonesfield Slate Beds" "are now known
      to lie at three levels within the ooidal limestone beds of the Taynton
      Limestone Formation, necessitating their continued informal status".
      Describes its rock: "Lithology: White to pale brown, typically well-sorted
      medium- to coarse-grained, moderately to highly shell-detrital ooidal
      grainstone, locally fine- to very coarse-grained; medium to thickly
      well-bedded and cross-bedded, with thin shell-detrital calcilutite beds
      and locally calcareous sandstone beds."
  - id: benson2010c
    notes: >
      Gives the Megalosaurus type horizon as "one or more discrete horizons
      ('Stonesfield Slate' ...) within the Taynton Limestone Formation (middle
      Bathonian Procerites progracilis ammonite zone) of Stonesfield,
      Oxfordshire".
  - id: carrano2012a
    notes: >
      Places the Megalosaurus bucklandii type series in the "'Stonesfield
      Slate' facies of the Taynton Limestone Formation", and gives the
      Stonesfield ilium of Iliosuchus as from the "Taynton Limestone
      Formation, Bathonian, Middle Jurassic, England".
