name: Taynton Limestone
rank: formation
parent: Great Oolite
period: [Middle Jurassic]
stages: [Bathonian]
description: "The Taynton Limestone is a geological formation in Oxfordshire in the United Kingdom. It dates to the Middle Jurassic, mid-Bathonian stage. It predominantly consists of ooidal grainstone. The term \"Stonesfield Slate\" refers to slaty limestone horizons within the formation that during the 18th and 19th centuries were extensively quarried for use in roof tiling within the vicinity of Stonesfield, Oxfordshire. Previously these were thought to belong to the Sharp's Hill Formation, but boreholes and shaft sections suggest that at least three horizons within the Taynton Limestone were quarried for the slate. These horizons are well known for producing a diverse set of fossils including those of plants, insects as well as vertebrates, including some of the earliest known mammals, pterosaurs as well as those of first dinosaur ever described, Megalosaurus."
variants: [Taynton Stone]
references:
  - id: barron2012a
    notes: >
      The formal entry, giving the parent as the Great Oolite Group and the
      age as "Bathonian, Progracilis" zone, and the original name: "Name
      introduced (as Taynton Stone) by Woodward ... for a 'freestone' within
      the Great Oolite sequence". Records that the "Stonesfield Slate Beds"
      "are now known to lie at three levels within the ooidal limestone beds
      of the Taynton Limestone Formation, necessitating their continued
      informal status".
  - id: benson2010c
    notes: >
      Gives the Megalosaurus type horizon as "one or more discrete horizons
      ('Stonesfield Slate' ...) within the Taynton Limestone Formation (middle
      Bathonian Procerites progracilis ammonite zone) of Stonesfield,
      Oxfordshire".
  - id: carrano2012a
    notes: >
      Places the Megalosaurus bucklandii type series in the "'Stonesfield
      Slate' facies of the Taynton Limestone Formation", and gives the
      Stonesfield ilium of Iliosuchus as from the "Taynton Limestone
      Formation, Bathonian, Middle Jurassic, England".
