name: Tecovas
rank: formation
parent: Dockum
period: [Late Triassic]
stages: [Carnian, Norian]
references:
  - id: baron2018c
    notes: >
      Gives the Caseosaurus holotype as from "Tecovas Formation, Crosby
      County, Texas, USA; Carnian, Late Triassic".
  - id: hunt1998a
    notes: >
      Uses member rank instead, "Tecovas Member of Dockum Formation", for
      Crosby County, on the same Chinle-and-Dockum rank question as the Bull
      Canyon, Cooper Canyon, Colorado City and Rock Point.
  - id: novas2021a
    notes: >
      Places the "Caseosaurus crosbyensis" holotype in "the upper
      Carnian–lower Norian Tecovas Member (correlated with the Blue Mesa
      Member of the Chinle Formation, constrained to 225–218 Ma based on
      radioisotopic datings ...) of the Dockum Group", using member rank there
      but "Tecovas Formation/lower Cooper Canyon Formation" elsewhere.
