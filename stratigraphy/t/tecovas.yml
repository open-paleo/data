name: Tecovas
rank: formation
parent: Dockum
variants: [Garita Creek]
period: [Late Triassic]
stages: [Carnian, Norian]
dispute:
  summary: >
    Lehman and Chatterjee (2005) place the formation in the Carnian, relaying
    Cornet's (1993) "Middle to Late Carnian" from its palynomorphs and
    Chatterjee's (1986) tetrapod correlation, with the Carnian–Norian boundary
    between the Trujillo and the Cooper Canyon. Martz and colleagues (2013)
    hold that the Chinle Formation "is probably entirely post-Carnian", which
    "revises previous interpretations of the lower part of the Chinle
    Formation and Dockum Group as Carnian based on pollen and vertebrate
    fossils", and correlate the formation's Adamanian fauna with Chinle strata
    dated about 223–215 Ma, early Norian on the ICS chart v2024/12; they allow
    that the lowermost Tecovas may be Otischalkian.
references:
  - id: baron2018c
    notes: >
      Gives the Caseosaurus holotype as from "Tecovas Formation, Crosby
      County, Texas, USA; Carnian, Late Triassic".
  - id: hunt1998a
    notes: >
      Uses member rank instead, "Tecovas Member of Dockum Formation", for
      Crosby County, on the same Chinle-and-Dockum rank question as the Bull
      Canyon, Cooper Canyon, Colorado City and Rock Point.
  - id: novas2021a
    notes: >
      Places the "Caseosaurus crosbyensis" holotype in "the upper
      Carnian–lower Norian Tecovas Member (correlated with the Blue Mesa
      Member of the Chinle Formation, constrained to 225–218 Ma based on
      radioisotopic datings ...) of the Dockum Group", using member rank there
      but "Tecovas Formation/lower Cooper Canyon Formation" elsewhere.
  - id: chatterjee1985a
    notes: >
      Credits the unit to Gould (1907), who "recognized two units within the
      Dockum Group. The basal unit, the Tecovas Formation, consists of variegated
      shales overlain by magenta shales and locally intercalated with massive
      white fine-grained sandstone", well exposed in Palo Duro Canyon. Doubts
      that the formation names can be applied elsewhere in the Dockum "until
      detailed lithological mapping is completed". Gives no age beyond the Late
      Triassic of the group.
  - id: lehman2005a
    notes: >
      The second of four mappable units of the Dockum Group in its type area,
      between the Santa Rosa Sandstone and the Trujillo Sandstone, and the upper
      part of the Santa Rosa–Tecovas depositional sequence. Its charts place the
      formation in the Carnian, and the text relays a tetrapod correlation with
      the Carnian from Chatterjee (1986) and a "Middle to Late Carnian" age from
      palynomorphs (Cornet, 1993). Takes the Trujillo–Cooper Canyon boundary to
      approximate the Carnian–Norian boundary.
  - id: martz2013a
    notes: >
      Gives "Garita Creek (= Tecovas) Formations of New Mexico" and the formation
      as the lower mudstone-dominated unit of the Dockum Group, beneath the
      Trujillo. Assigns its fauna to the Adamanian and holds that the Chinle
      Formation "is probably entirely post-Carnian", which "revises previous
      interpretations of the lower part of the Chinle Formation and Dockum
      Group as Carnian", putting the Adamanian at about 223–215 Ma by
      correlation with dated Chinle strata, since "published high-resolution
      radioisotopic dates are unavailable from the Dockum Group". The lowermost
      Tecovas "may fall within the Otischalkian".
  - id: cather2013a
    notes: >
      Applies the name "to the mudstone-dominated strata between the Santa Rosa
      Sandstone and the Trujillo Sandstone in east-central New Mexico", a term
      "first used in Texas by Gould (1907)", in place of the Garita Creek
      Formation that Lucas and Hunt (1989) applied to the same strata. Places it
      in the Dockum Group.
  - id: gould1907a
  - id: chatterjee1986a
  - id: cornet1993a
  - id: lucas1989a
