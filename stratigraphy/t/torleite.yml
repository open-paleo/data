name: Torleite
rank: formation
period: [Late Jurassic]
stages: [Kimmeridgian]
references:
  - id: foth2025a
    notes: >
      Places the formation below the Painten: "the upper part of the Torleite
      Formation, which underlies the Painten Formation, yielded important
      vertebrate fossils as well". It gives the Torleite no age of its own.
  - id: foth2020a
    notes: >
      Gives "the Torleite Formation (upper Kimmeridgian) of the Jurassic
      limestones of Bavaria", the unit holding the Sciurumimus and Juravenator
      holotypes.
  - id: niebuhr2014a
    notes: >
      Defines the formation in the Weißjura Group, "Named after the Torleite,
      a hill southwest of the market town of Dollnstein", its original
      description "Niebuhr (this work), based on Zeiss (1964a, 1977)". Upper
      Kimmeridgian by ammonites, "upper pseudomutabilis zone to upper beckeri
      zone", with a diachronous top, "middle beckeri zone ... at its type
      locality – highest beckeri zone ... near Schamhaupten and Painten". It
      rests on the Treuchtlingen or Lower Frankenalb Formation, is overlain by
      the Geisental and Painten formations, and is "20 to over 70 m" thick,
      with the Netzstall and Arnstorf subformations. The Arnstorf's siliceous
      platy facies yielded Juravenator at Schamhaupten and Sciurumimus near
      Painten.
