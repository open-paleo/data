name: Torleite
rank: formation
period: [Late Jurassic]
stages: [Kimmeridgian]
lithology: bedded and platy micritic limestone
references:
  - id: foth2025a
    notes: >
      Places the formation below the Painten: "the upper part of the Torleite
      Formation, which underlies the Painten Formation, yielded important
      vertebrate fossils as well". It gives the Torleite no age of its own.
  - id: foth2020a
    notes: >
      Gives "the Torleite Formation (upper Kimmeridgian) of the Jurassic
      limestones of Bavaria", the unit holding the Sciurumimus and Juravenator
      holotypes.
  - id: niebuhr2014a
    notes: >
      Defines the formation in the Weißjura Group, named for a hill near
      Dollnstein, and dates it by ammonites to the "upper pseudomutabilis zone
      to upper beckeri zone" (translated). Source of the lithology.
  - id: zeiss1964a
    notes: >
      Cited by Niebuhr and Pürner (2014) as a basis of the Torleite
      Formation's original description.
  - id: zeiss1977a
    notes: >
      Cited by Niebuhr and Pürner (2014) as a basis of the Torleite
      Formation's original description.
