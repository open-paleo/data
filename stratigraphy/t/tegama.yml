name: Tegama
rank: group
period: [Early Cretaceous, Late Cretaceous]
stages: [Aptian, Albian, Cenomanian]
references:
  - id: sereno1999a
    notes: >
      Gives group rank and the survey subdivision laid over it: at Gadoufaoua
      "the Tegama Group was divided into eight GAD levels", of which "GAD 5
      corresponds with the upper part of the Elrhaz Formation and the lower
      part of the Echkar Formation". States no stage for the group as a whole.
  - id: sereno1998b
    notes: >
      "The Tegama Group is composed of terrestrial rocks of middle to late
      Cretaceous age. Three formations (Tazole, Elrhaz, and Echkar) have been
      recognized".
  - id: carrano2012a
    notes: >
      Dates two of the group's formations: "Elrhaz Formation, Tegama Group;
      Aptian–Albian?, Early Cretaceous", and "Echkar Formation, Tegama Group;
      Cenomanian, early Late Cretaceous". Together they run Aptian to
      Cenomanian.
  - id: carrano2008a
    notes: >
      Gives the Echkar as "Echkar Formation, Tegama Group; Cenomanian, Late
      Cretaceous". It also lists "Tiouraren Formation, Tegama Group;
      Neocomian", but the Tiourarén is the uppermost unit of the Irhazer Group
      beneath (Rauhut and López-Arbarello 2009), so that Neocomian does not
      date this group.
  - id: rauhut2009a
    notes: >
      "In the overlying Tegama Group, only the Elrhaz Formation, the second
      Formation in this group, is dated on the basis of abundant fossils from
      the Gadoufaoua locality", and it is "separated from the Tiouaren
      Formation by the lowermost unit of the Tegama Group, the Tazolé
      Formation". The Tazolé is undated, so the group's base may be older than
      the Aptian, though nothing here dates it.
