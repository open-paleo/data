name: Tatlatui
rank: member
informal: true
parent: Tango Creek
period: [Late Cretaceous]
stages: [Maastrichtian]
lithology: dark gray mudstone and chert-pebble arenite, with thin lignite seams
references:
  - id: arbour2019a
    notes: >
      Gives the Ferrisaurus horizon as "Tatlatui Member, Tango Creek
      Formation, Sustut Group", from the confluence of the Sustut River and
      Birdflat Creek.
  - id: ryan2023a
    notes: >
      Places the member across "the Campanian-Maastrichtian boundary in this
      part of the Sustut Basin", crediting Arbour and colleagues (2020), who
      give it no Campanian.
  - id: arbour2020a
    notes: >
      Assigns the Turtle Site, dated by pollen to the late Maastrichtian, to the
      member on its lithology of "dark grey mudstones, chert-pebble-bearing
      arenites" and thin lignite. Source of the lithology.
  - id: eisbacher1974a
