name: Tatlatui
rank: member
informal: true
parent: Tango Creek
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
references:
  - id: arbour2019a
    notes: >
      Gives the Ferrisaurus horizon as "Tatlatui Member, Tango Creek
      Formation, Sustut Group", from the confluence of the Sustut River and
      Birdflat Creek.
  - id: ryan2023a
    notes: >
      Places the member across "the Campanian-Maastrichtian boundary in this
      part of the Sustut Basin".
  - id: arbour2020a
    notes: >
      One of "the informal Niven and Tatlatui members" into which Eisbacher
      (1974) divided the Tango Creek Formation; it "includes dark grey
      mudstones, chert-pebble-bearing arenites, and local thin seams of
      lignite". The Turtle Site, "the most likely provenance of RBCM P900",
      yields palynomorphs "suggesting an age range of between 68.2 and 67.2
      Ma". The site is mapped as Brothers Peak Formation and is younger than
      the Tango Creek anywhere else in the basin, so it lies "either 1) in the
      Brothers Peak Formation rather than the Tango Creek Formation, or 2) the
      Tango Creek Formation extends into the Maastrichtian in this part of the
      basin"; the authors prefer the second, "because the lithology at this
      site more closely matches that of the Tatlatui Member".
