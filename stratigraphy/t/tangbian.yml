name: Tangbian
rank: formation
parent: Guifeng
period: [Late Cretaceous]
stages: [Campanian]
lithology: purplish-red sandstone, siltstone and mudstone, locally with pebbly
  sandstone and gypsum
references:
  - id: zhu2025a
    notes: >
      Describes Huaxiazhoulong from "the Upper Cretaceous Tangbian Formation
      of Jiangxi Province, southern China", and states, after Xi and
      colleagues (2018, 2021), that the "Tangbian Formation was deposited in
      Campanian". The Campanian comes from the correlation charts of those
      two papers rather than from their text.
  - id: xing2024a
    notes: >
      Places it second in the Guifeng Group, between the Hekou and the
      Lianhe.
  - id: xi2018a
    notes: >
      Its text lists the formation only as a member of the Guifeng Group. Its
      chart of the "Stratigraphic subdivision and correlation of Cretaceous
      strata in the north and southeast stratigraphic provinces" stacks the
      Hekou, Tangbian and Lianhe in the Jiangxi column, the Tangbian within
      the Campanian, above a Hekou running from the Coniacian into the
      Campanian.
  - id: xi2021a
    notes: >
      Its correlation chart for southeastern China draws the Tangbian at about
      80.5 to 73.5 Ma, wholly within the Campanian, between the Hekou and the
      Lianhe. Its text does not name the formation.
  - id: li2018a
    notes: >
      Treats the "Hekou and Tangbian formations" as "contemporaneous
      heterotopic facies in different environment, likely with lateral
      superimposition", and the "Hekou and Lianhe formations" as "probably the
      same sequences but named differently", rather than a stacked sequence.
  - id: jin2022a
    notes: >
      Dates the Hekou Formation near Ganzhou, below the Tangbian in the
      stacked order, as Maastrichtian by biostratigraphic correlation. That
      conflicts with a Campanian Tangbian only in the stacked scheme, and
      the Hekou of Xi and colleagues' charts is Coniacian to Campanian.
  - id: ling1996a
    notes: >
      Erects the formation from the middle part of the former Guifeng Formation,
      with its stratotype near Tangbian in Hengfeng County, and dates it only as
      Late Cretaceous. Source of the lithology.
