name: Tangbian
rank: formation
parent: Guifeng
period: [Late Cretaceous]
stages: [Campanian]
references:
  - id: zhu2024a
    notes: >
      Describes Huaxiazhoulong from "the Upper Cretaceous Tangbian Formation
      of Jiangxi Province, southern China", and states, after Xi and
      colleagues (2019, 2021), that the "Tangbian Formation was deposited in
      Campanian". The Campanian comes from the correlation charts of those
      two papers rather than from their text.
  - id: xing2024a
    notes: >
      Places it second in the Guifeng Group, between the Hekou and the
      Lianhe.
  - id: xi2018a
    notes: >
      Its text lists the formation only as a member of the Guifeng Group. Its
      chart of the "Stratigraphic subdivision and correlation of Cretaceous
      strata in the north and southeast stratigraphic provinces" stacks the
      Hekou, Tangbian and Lianhe in the Jiangxi column, the Tangbian within
      the Campanian, above a Hekou running from the Coniacian into the
      Campanian.
  - id: xi2021a
    notes: >
      Its text does not name the formation. Its chart of the
      "Lithostratigraphic division and correlation of the Cretaceous in the
      Southeast China Stratigraphic Povince", modified from Xi and colleagues
      (2019), draws the Tangbian at about 80.5 to 73.5 Ma, wholly within the
      Campanian, between a Hekou at about 89 to 80.5 Ma and a Lianhe from
      about 73.5 Ma upward. The boundaries are read from the chart and are
      approximate.
  - id: li2018a
    notes: >
      Treats the Hekou, Tangbian and Lianhe as "mainly contemporaneous
      heteropic formations", lateral equivalents rather than a stacked
      sequence.
  - id: jin2022a
    notes: >
      Dates the Hekou Formation near Ganzhou, below the Tangbian in the
      stacked order, as Maastrichtian by biostratigraphic correlation. That
      conflicts with a Campanian Tangbian only in the stacked scheme, and
      the Hekou of Xi and colleagues' charts is Coniacian to Campanian.
