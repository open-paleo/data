name: Tremp
rank: group
period: [Late Cretaceous, Paleocene]
stages: [Campanian, Maastrichtian, Danian, Selandian, Thanetian]
references:
  - id: fondevilla2019a
    notes: >
      Describes how Cuevas (1992) and Pujalte and Schmitz (2005) "redefined the
      Tremp Fm as Tremp Group, and divided it into different formations", the
      Maastrichtian Conques and Talarn below the Vallcebre limestones, "late
      Danian in the Tremp Syncline" and "likely early Danian" in the Vallcebre
      Syncline, and the Upper Red Garumnian, "dated as Selandian to Thanetian".
  - id: cuevas1992a
    notes: >
      Defines the group in the Conca de Tremp: the six formations, Posa,
      Conques, Talarn, Calizas de Suterranya y Sant Salvador de Toló,
      Esplugafreda and Claret, "se agrupan en una unidad de rango superior
      denominada «Grupo de Tremp»" (are grouped into a unit of higher rank
      called the Tremp Group, translated), between the Maastrichtian Arén
      Sandstone and the Ilerdian marine beds. Gives no stage for the
      formations.
  - id: díez-canseco2014a
    notes: >
      Dates the Lower Red Unit, the Conques and Talarn formations, as
      Maastrichtian and the Suterranya Limestone as late Danian from planktic
      foraminifera, so that "at least the first 4 Ma of the Danian are absent
      in the Tremp Formation"; the Cretaceous-Paleogene boundary lies at the
      top of the Lower Red Unit or within that hiatus.
  - id: rosell2001a
    notes: >
      Places the Cretaceous-Tertiary boundary near the top of the lower red
      unit, "muy cerca del contacto con las calizas" (very close to the
      contact with the limestones, translated), the Danian Vallcebre
      limestones, on the last dinosaur bones, a change in charophytes and the
      first Microcodium.
  - id: pujalte2005a
  - id: prieto-márquez2022a
    notes: >
      Gives group rank by naming a formation inside it, "the Talarn Formation
      of the Tremp Group". A unit that contains a named formation is a group.
  - id: pereda-suberbiola2009a
    notes: >
      Uses the coarser scheme, "the Maastrichtian of the Tremp Formation, in
      Lleida", and places the Blasi sites other than Blasi 1, which lies on
      top of the Aren Sandstone, in its lower part, giving the Arenysaurus
      type horizon as "lower part of the Tremp Formation; Late Cretaceous,
      Late Maastrichtian". This is not a competing claim: an older "Tremp
      Formation" and a newer "Talarn Formation" are the same rock at two
      resolutions, and the coarse reading is the correct one in the western
      syncline, where the Talarn does not reach and the Conques and Talarn
      criteria cannot be observed.
  - id: csiki-sava2015a
    notes: >
      Treats it at formation rank as the "transitional-to-continental"
      counterpart of the Arén Sandstone and calls both units diachronous, the
      Tremp ranging "from late Campanian to early Paleogene".
