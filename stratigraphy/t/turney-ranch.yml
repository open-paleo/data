name: Turney Ranch
rank: formation
period: [Early Cretaceous, Late Cretaceous]
stages: [Albian, Cenomanian]
references:
  - id: britt2017a
    notes: >
      Gives Sonorasaurus as a brachiosaurid from "the Albian-to-Cenomanian
      Turney Ranch Formation of Arizona".
  - id: ratkevich1998a
    notes: >
      Names Sonorasaurus thompsoni from the formation with "Age: Middle
      Cretaceous (Albian) ± 97 Ma", and concludes that the formation "does
      indeed span the Albian-Cenomanian boundary".
  - id: d'emic2016a
    notes: >
      Places the formation in the Bisbee Group and brackets the age of
      Sonorasaurus "between ca. 98 and ca. 110 Ma", near the Albian-Cenomanian
      boundary on biostratigraphic evidence.
  - id: scarborough2000a
    notes: >
      Cited by D'Emic and colleagues (2016) as an earlier Albian-Cenomanian
      age assignment for the formation.
