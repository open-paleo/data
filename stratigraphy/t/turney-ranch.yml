name: Turney Ranch
rank: formation
period: [Early Cretaceous, Late Cretaceous]
stages: [Albian, Cenomanian]
references:
  - id: britt2017a
    notes: >
      Gives Sonorasaurus as a brachiosaurid from "the Albian-to-Cenomanian
      Turney Ranch Formation of Arizona".
  - id: d'emic2016a
    notes: >
      Places it in the Bisbee Group and records that the taxon "potentially
      represents one of the youngest sauropods" of the North American
      Cretaceous record. Brackets its age: the formation "was regarded as
      Albian-Cenomanian by Ratkevitch (1998) and Scarbourough (2000) on the
      basis a K/Ar minimum age of about 98 Ma", is "likely younger than ~110
      Ma", and "radiometric dates bracket the age of Sonorasaurus between ca.
      98 and ca. 110 Ma; biostratigraphic evidence suggests that it lived
      sometime just before or after the Albian-Cenomanian boundary".
