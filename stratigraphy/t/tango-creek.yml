name: Tango Creek
rank: formation
parent: Sustut
period: [Early Cretaceous, Late Cretaceous]
stages: [Barremian, Aptian, Albian, Cenomanian, Turonian, Coniacian, Santonian, Campanian, Maastrichtian]
references:
  - id: arbour2019a
    notes: >
      Reassigns the Ferrisaurus skeleton, which "is likely from the Tango
      Creek Formation, rather than the Brothers Peak Formation as originally
      reported", on new stratigraphic and palynological data.
  - id: ryan2023a
    notes: >
      Gives the span, the Tatlatui Member of the formation straddling "the
      Campanian-Maastrichtian boundary in this part of the Sustut Basin".
  - id: arbour2020a
    notes: >
      The lower of the Sustut Group's two formations, which Eisbacher (1974)
      "further subdivided ... into the informal Niven and Tatlatui members".
      Relays Evenchick and colleagues (2003) that it "is Barremian or early
      Albian to late Campanian in age" and that "the top of the formation was
      never younger than late Campanian in all sampled sites", and proposes
      that near the Sustut River it "extends into the Maastrichtian", on a
      late Maastrichtian palynoflora at a site whose lithology matches the
      Tatlatui. The Barremian it credits to Evenchick and colleagues (2003) is
      not in that paper; it is in Sweet's reports printed by Evenchick and
      colleagues (2001).
  - id: evenchick2001a
    notes: >
      Prints A. R. Sweet's palynology reports for the formation sample by
      sample. The oldest, on NTS sheet 104H, are "Barremian to Early or Middle
      Albian", on the reasoning that "A lower limit of Barremian is imposed by
      the presence of monocolpate angiosperm pollen (Clavatipollenites
      minutus)". The youngest, on sheet 94D, is "Late Campanian, possibly
      Early Maastrichtian", and the reports between cover the Albian through
      the Campanian.
  - id: evenchick2003a
    notes: >
      Summarizes those reports as "Northwest of the study area the Tango Creek
      Formation is early Albian to late Campanian and Brothers Peak Formation
      late Campanian to early Maastrichtian (A. Sweet in Evenchick et al.
      (2001))", leaving out the Barremian lower limit the reports give.
