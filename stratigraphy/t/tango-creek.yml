name: Tango Creek
rank: formation
parent: Sustut
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
references:
  - id: arbour2019a
    notes: >
      Reassigns the Ferrisaurus skeleton, which "is likely from the Tango
      Creek Formation, rather than the Brothers Peak Formation as originally
      reported", on new stratigraphic and palynological data.
  - id: ryan2023a
    notes: >
      Gives the span, the Tatlatui Member of the formation straddling "the
      Campanian-Maastrichtian boundary in this part of the Sustut Basin".
