name: Trinity
rank: group
period: [Early Cretaceous]
stages: [Aptian, Albian]
lithology: sandstone, claystone and limestone
references:
  - id: hunt2018a
    notes: >
      "the Lower Cretaceous (Albian-Aptian) Trinity Group of Arkansas".
  - id: suarez2021a
    notes: >
      Gives the contents, which differ by state: in central Texas it "consists
      of the Twin Mountains, Glen Rose, and Paluxy formations, in ascending
      order", while in Oklahoma "it consists almost entirely of the Antlers
      Formation, although the Holly Creek Formation is present in extreme
      southeast McCurtain County". Source of the lithology.
  - id: stoyanow1949a
    notes: >
      Relays the correlation by Imlay (1939) of the lower Bisbee group of
      Arizona with "the Trinity group of Texas (Upper Aptian-Lower Albian)".
  - id: imlay1939a
    notes: >
      Cited by Stoyanow (1949) for Imlay's correlation of the Bisbee group
      with the Trinity group (upper Aptian to lower Albian).
