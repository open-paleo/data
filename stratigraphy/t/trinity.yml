name: Trinity
rank: group
period: [Early Cretaceous]
stages: [Aptian, Albian]
references:
  - id: hunt2018a
    notes: >
      "the Lower Cretaceous (Albian-Aptian) Trinity Group of Arkansas".
  - id: suarez2021a
    notes: >
      Gives the contents, which differ by state: in central Texas it
      "consists of the Twin Mountains, Glen Rose, and Paluxy formations, in
      ascending order", while in Oklahoma "it consists almost entirely of the
      Antlers Formation, although the Holly Creek Formation is present in
      extreme southeast McCurtain County".
  - id: stoyanow1949a
    notes: >
      "Imlay (1939a, p. 1738, Table 2) tentatively correlated the Glance,
      Morita, and the lower member of the Mural limestone with the Trinity
      group of Texas (Upper Aptian-Lower Albian), assigning the upper member
      of the Mural and the Cintura formation to the Fredericksburg (Middle
      Albian)." The upper Aptian to lower Albian age is Imlay's, relayed in
      this paper as part of the history of readings of the Bisbee group of
      southeastern Arizona rather than argued from the Texas section.
