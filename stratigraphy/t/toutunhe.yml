name: Toutunhe
rank: formation
period: [Middle Jurassic, Late Jurassic]
stages: [Bajocian, Bathonian, Callovian]
references:
  - id: arbour2015a
    notes: >
      Gives the Tianchisaurus horizon as "upper part of the Toutunhe
      Formation, Middle Jurassic", in the Sangonghe Valley of Fukang County,
      Xinjiang, 35 km northwest of Urumqi. Gives only the series.
  - id: averianov2005a
    notes: >
      Places it below the Qigu Formation in the southern Junggar Basin and
      records a similar vertebrate assemblage from it. "The Toutunhe Formation
      is dated on the basis of palynoflora as Bathonian", following Wang
      (2001), while Eberth and colleagues (2001) gave it as
      "Bathonian–Callovian", though "the reasons for this are not evident from
      their paper".
  - id: maisch2019a
    notes: >
      Notes that "The Toutunhe Formation has recently been regarded as Upper
      Jurassic", following Fang and colleagues (2015), whose syndepositional
      zircon dates of 151 to 161 Ma from the Toutunhe, Qigu and Kalaza
      formations "indicate that these three formations span most of the Upper
      Jurassic from the Oxfordian to the Tithonian".
  - id: wang2001b
  - id: eberth2001a
    notes: >
      At the Manas section, "A 200-m-thick variegated mudstone and sandstone
      alluvial interval at the base of the Toutunhe Formation, however,
      suggests an episode of increasing seasonal dryness during the Middle
      Jurassic (Bajocian)", while "Carbonaceous shales and carbonaceous roots
      and rootlets in the overlying portion of the Toutunhe Formation suggest
      a return to warm and humid conditions at the end of the Middle Jurassic
      (Callovian)". The base stays hedged: "a Bajocian or Bathonian age is
      equally likely for the lower redbeds section of the Toutunhe Formation
      at Manas", a reading the paper sets against "all previous
      interpretations that claim ... a late Middle Jurassic age
      (Bathonian–Callovian) for the Toutunhe Formation".
  - id: fang2015a
    notes: >
      The formation is one of "the Upper Jurassic Toutunhe, Qigu and Kalazha
      Formations" of the southern Junggar Basin, and "is the first to contain
      abundant late Jurassic magmatic zircons", which formed "nearly at the
      same time as the sedimentation age of the Toutunhe Formation (younger
      than 161.2 Ma)". From that the authors deduce "relatively large scale
      volcanic activity occurred during the deposition period of the Toutunhe
      Formation (late Jurassic)".
