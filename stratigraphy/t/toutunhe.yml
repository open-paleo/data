name: Toutunhe
rank: formation
period: [Middle Jurassic, Late Jurassic]
stages: [Bajocian, Bathonian, Callovian]
lithology: variegated glutenite, sandstone and mudstone
dispute:
  summary: >
    Averianov and colleagues (2005) give the formation as Bathonian on
    palynology, after Wang (2001), and Eberth and colleagues (2001) as
    Bajocian to Callovian, from correlating its basal redbeds with the
    Xishanyao Formation and from Bathonian fossils above them. Fang and
    colleagues (2015) call it Upper Jurassic and treat its youngest
    magmatic zircons, about 153 to 161 Ma, as syndepositional; their
    "younger than 161.2 Ma" is the ICS (2013) chart age of that Upper
    Jurassic assignment, not a date. Syndepositional zircons that young
    would exclude the Middle Jurassic.
references:
  - id: arbour2015a
    notes: >
      Gives the Tianchisaurus horizon as "upper part of the Toutunhe
      Formation, Middle Jurassic", in the Sangonghe Valley of Fukang County,
      Xinjiang, 35 km northwest of Urumqi. Gives only the series.
  - id: averianov2005a
    notes: >
      Places it below the Qigu Formation in the southern Junggar Basin and
      records a similar vertebrate assemblage from it. "The Toutunhe Formation
      is dated on the basis of palynoflora as Bathonian", following Wang
      (2001), while Eberth and colleagues (2001) gave it as
      "Bathonian–Callovian", though "the reasons for this are not evident from
      their paper".
  - id: maisch2019a
    notes: >
      Notes that "The Toutunhe Formation has recently been regarded as Upper
      Jurassic", following Fang and colleagues (2015), whose syndepositional
      zircon dates of 151 to 161 Ma from the Toutunhe, Qigu and Kalaza
      formations "indicate that these three formations span most of the Upper
      Jurassic from the Oxfordian to the Tithonian".
  - id: wang2001b
  - id: eberth2001a
    notes: >
      Dates the 200-m redbed interval at the base of the formation at Manas as
      Bajocian, or equally likely Bathonian, and its carbonaceous upper part as
      Callovian.
  - id: fang2015a
    notes: >
      Lists the formation as Upper Jurassic and reports in it the first abundant
      late Jurassic magmatic zircons of the southern Junggar Basin, the youngest
      about 153 to 161 Ma.
  - id: huang2018a
    notes: >
      Source of the lithology.
