name: Tidwell
rank: member
parent: Morrison
period: [Late Jurassic]
stages: [Oxfordian, Kimmeridgian]
references:
  - id: foster2016a
    notes: >
      Relocates and dates the Dystrophaeus type, further excavation having
      "confirmed that the specimen is from the lower half of the Tidwell
      Member, making it one of the lowest stratigraphic occurrences of
      vertebrate fossils in the Morrison Formation". "Preliminary U-Pb zircon
      dates indicate the site is Oxfordian in age, approximately 158 ± 3 Ma".
  - id: kirkland2016a
    notes: >
      Places it at the base of the formation, the section dropping "through
      the basal Tidwell Member of the Morrison Formation into the upper
      Summerville Formation of the San Rafael Group".
  - id: kowallis1998a
    notes: >
      Dates one ash bed "about 3 m above the J-5 unconformity", found in two
      sections, by 40Ar/39Ar on sanidine: "154.75 ± 0.54 Ma", "154.82 ± 0.58
      Ma", 154.87 ± 0.52 Ma (plateau) and "154.8 ± 1.4 Ma". The values straddle
      the Oxfordian–Kimmeridgian boundary of the ICS chart v2024/12 (154.8 Ma).
      Calls them "the most precise isotopic age data yet published from latest
      Oxfordian(?) to early Kimmeridgian-age sedimentary rocks", and relays from
      Schudack and colleagues (1998) "Oxfordian(?) fossils ... just above the
      level of the dated bentonite bed" and from them and Litwin and colleagues
      (1998) "Kimmeridgian charophytes and palynomorphs ... from higher strata in
      the Tidwell".
  - id: schudack1998a
  - id: litwin1998a
