name: Tuchengzi
rank: formation
period: [Middle Jurassic, Late Jurassic, Early Cretaceous]
stages: [Tithonian, Berriasian]
references:
  - id: butler2008b
    notes: >
      Gives the Chaoyangsaurus horizon as "the Tuchengzi Formation of Liaoning
      Province, China" and records the age as read two ways, "Middle or Late
      Jurassic: Middle Jurassic, Zhao et al. 1999; Tithonian, Weishampel et
      al. 2004b". The hedge crosses an epoch boundary.
  - id: averianov2006a
    notes: >
      Cites radiometric work on the unit, "New 40Ar/39Ar dating of the Yixian
      and Tuchengzi Formations", supporting a Cretaceous age for the
      feathered-dinosaur beds of Liaoning.
  - id: wang2016a
    notes: >
      Treats the formation as "?Jurassic-Early Cretaceous", saying it "yields
      definitive Early Cretaceous ages", after Chang and colleagues (2009),
      "but may extend into the Jurassic".
  - id: chang2009a
  - id: swisher2002a
    notes: >
      A tuff from the upper part of the formation "gave a mean 40Ar/39Ar age
      of 139.4 ± 0.19 (1SD) ± 0.05 (SE) Ma, based on 19 single sanidine
      crystal analyses". "This represents the first isotopic dating for the
      Tuchengzi Formation and although considered previously middle Jurassic
      in age, at least the upper part of the formation can be referred to the
      Early Cretaceous." On that result the continental Jurassic-Cretaceous
      boundary in northeastern China "must be sought for within the lower part
      of the Tuchengzi Formation or within underlying formations".
  - id: liu2012a
    notes: >
      The formation is "referred to the latest Jurassic (Tithonian) to the
      earliest Cretaceous (Berriasian)" deposits of northern North China, on
      previously published K–Ar, SHRIMP U–Pb and LA-ICP-MS ages of 156–139 Ma.
      Places it in the regional succession as "the Upper Jurassic-Lower
      Cretaceous Tuchengzi Formation (called the Houcheng Formation in Hebei
      Province)", between the Lanqi/Tiaojishan Formation below and the
      Zhangjiakou Formation above.
