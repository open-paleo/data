name: Tuchengzi
rank: formation
period: [Late Jurassic, Early Cretaceous]
stages: [Tithonian, Berriasian]
lithology: conglomerate with tuffaceous sandstone, siltstone and tuff
references:
  - id: butler2008b
    notes: >
      Gives the Chaoyangsaurus horizon as "the Tuchengzi Formation of Liaoning
      Province, China", and its age as "Middle or Late Jurassic", relaying two
      earlier readings.
  - id: averianov2006a
    notes: >
      Cites radiometric work on the unit, "New 40Ar/39Ar dating of the Yixian
      and Tuchengzi Formations", supporting a Cretaceous age for the
      feathered-dinosaur beds of Liaoning.
  - id: wang2016a
    notes: >
      Treats the formation as "?Jurassic-Early Cretaceous", saying it "yields
      definitive Early Cretaceous ages", after Chang and colleagues (2009),
      "but may extend into the Jurassic".
  - id: chang2009a
    notes: >
      Dates two tuffs from the uppermost formation by Ar–Ar on sanidine, to
      138.8 ± 0.3 and 139.5 ± 1.0 Ma.
  - id: swisher2002a
    notes: >
      Dates a tuff from the upper part of the formation to 139.4 Ma on sanidine,
      the first isotopic date for the formation, and refers at least that part
      to the Early Cretaceous.
  - id: liu2012a
    notes: >
      Refers the formation to the Tithonian to Berriasian on published
      radiometric ages, and places it between the Lanqi/Tiaojishan and
      Zhangjiakou formations. Source of the lithology.
