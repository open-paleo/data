name: Tolman
rank: member
parent: Horseshoe Canyon
period: [Late Cretaceous]
stages: [Maastrichtian]
references:
  - id: eberth2020a
    notes: >
      Dates the bonebed in it directly: "the Albertosaurus bonebed -- a
      monodominant assemblage of tyrannosaurids in the Tolman Member -- is
      assessed an age of 70.1 Ma", occurring "near the top of the Tolman
      Member ..., ~8 m below the Tolman-Carbon member contact".
  - id: fowler2020b
    notes: >
      Gives "Tolman Member, Horseshoe Canyon Formation, Alberta; lower
      Maastrichtian".
  - id: eberth2012a
    notes: >
      The revision that erected it, one of the formation's seven mappable
      members, with "stacked and multilateral sandstones, near the base of the
      Tolman Member" forming a resistant ridge.
  - id: boyd2015a
    notes: >
      Gives the Parksosaurus warreni holotype as "discovered in the Late
      Cretaceous Tolman Member of the Horseshoe Canyon Formation (Edmonton
      Group) of Alberta, Canada".
