name: Trossingen
rank: formation
period: [Late Triassic]
stages: [Norian, Rhaetian]
references:
  - id: galton2004a
    notes: >
      Uses formation rank and carries it "?into Rhaetic", listing it among the
      Norian prosauropod units of Germany. Elsewhere it has the formation as
      "upper Norian", with Plateosaurus skeletons in mass accumulations in the
      middle to late Norian at Trossingen.
  - id: yates2003b
    notes: >
      Uses Trossingen as a locality rather than a unit, giving "Trossingen,
      Baden-Württemberg, Germany; middle Löwenstein Formation, Middle Norian".
      The string does double duty, as with Sierra Barrosa and Gara Sbaa, and
      the Löwenstein is the unit below.
  - id: sues2025a
    notes: >
      Puts the "Untere Saurierschicht" of the formation, in the Middle Keuper
      Subgroup, in the "Late Triassic (Norian: Sevatian)".
