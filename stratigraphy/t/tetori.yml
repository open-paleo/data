name: Tetori
rank: group
period: [Middle Jurassic, Late Jurassic, Early Cretaceous]
stages: [Bajocian, Bathonian, Callovian, Oxfordian, Kimmeridgian,
  Tithonian, Berriasian, Valanginian, Hauterivian, Barremian, Aptian,
  Albian]
references:
  - id: averianov2005a
    notes: >
      Names the group by way of the Kuwajima Formation inside it, in central
      Japan.
  - id: chinzorig2025a
    notes: >
      Uses the same containment for the Lower Cretaceous Kuwajima Formation.
  - id: chure2000a
    notes: >
      Gives the "Katsuyamasaurus" horizon as "Akaiwa Subgroup, Tetori Group"
      and its age as "Valanginian through Albian", an age for the Akaiwa
      Subgroup rather than the whole group.
  - id: tong2021a
    notes: >
      "Macrobaenid remains have been reported from the Early Cretaceous Tetori
      Group, Japan, but the detailed systematic study is still outstanding."
      The age is given in passing, while reviewing the Asian macrobaenid
      record rather than dating the unit.
  - id: azuma2000a
    notes: >
      Divides the group into three subgroups, "Kuzuryu, Itoshiro, and Akaiwa",
      which together "range in time from Bajocian to Albian", following Maeda
      (1961).
  - id: sano2015a
    notes: >
      Treats the group in its broad sense as "The Middle Jurassic–Early
      Cretaceous Tetori (or Tedori) Group" and proposes dividing it in the
      Hakusan Region into a "Middle–Late Jurassic Kuzuryu Group" and an
      "unconformably overlying Early Cretaceous Tetori Group (sensu stricto)".
      The restricted group is dated "Early Cretaceous (Berriasian–Aptian)".
