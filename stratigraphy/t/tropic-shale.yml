name: Tropic Shale
rank: formation
period: [Late Cretaceous]
stages: [Turonian]
description: "The Tropic Shale is a Mesozoic geologic formation. Dinosaur remains are among the fossils that have been recovered from the formation, including Nothronychus graffami. The Tropic Shale is a stratigraphic unit of the Kaiparowits Plateau of south central Utah. It was first named in 1931, after the town of Tropic, Utah, where the type section is located. The Tropic Shale outcrops in Kane and Garfield counties, with large sections of exposure found in the Grand Staircase–Escalante National Monument."
references:
  - id: cullen2021a
    notes: >
      Gives Nothronychus graffami as from "the Upper Cretaceous Tropic Shale
      (early Turonian) of Utah".
  - id: hedrick2015a
    notes: >
      Independently gives "the Tropic Shale (early Turonian) in south-central
      Utah", and contrasts it with the middle Turonian Moreno Hill Formation.
