name: Tiaojishan
rank: formation
period: [Middle Jurassic, Late Jurassic]
stages: [Bathonian, Callovian, Oxfordian, Kimmeridgian]
variants: [Lanqi]
lithology: basic volcanic rocks and tuffaceous rocks, with sandstone and
  siltstone interbeds
references:
  - id: xu2016b
    notes: >
      Dates the formation "probably Oxfordian" on 40Ar/39Ar dates from the base
      and top of the Lanqi Formation, and draws the Oxfordian Linglongta phase
      of the Yanliao Biota from it.
  - id: sullivan2014a
    notes: >
      Reviews the radiometric dates on the formation, which "comfortably span
      the Middle–Late Jurassic boundary", and leaves open how the Daohugou
      strata relate to it.
  - id: peng2012a
    notes: >
      Dates the fossil-bearing strata at Linglongta, which it correlates with
      the formation, to the late Middle or early Late Jurassic, with a date of
      160.7 Myr on their basal andesites. Source of the lithology.
  - id: godefroit2013a
    notes: >
      Dates the formation "between the Callovian (Middle Jurassic) and the
      Kimmeridgian (Late Jurassic)" from SHRIMP ages of 165 to 153 Ma, and
      writes the name "Tiaojishan (= Lanqi)".
  - id: liu2012a
    notes: >
      SHRIMP U-Pb zircon dates tied to the fossil horizons themselves rather
      than to regional samples, giving weighted means of 160.5 +/- 0.99,
      161.0 +/- 1.44 and 158.5 +/- 1.6 Ma. Writes the unit "Lanqi/Tiaojishan".
  - id: yang2008a
    notes: >
      Dates a basalt from the "lower bed of the Lanqi Formation", the
      Tiaojishan under another name, by Ar–Ar to 166.1 ± 0.9 Ma, and has the
      lavas erupt "from 166 to 153 Ma"; its 166–148 Ma range for the formation
      takes the younger end from published ages relayed by Davis (2005).
  - id: zhang2008b
  - id: chang2009b
  - id: davis2005a
