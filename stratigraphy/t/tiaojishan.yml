name: Tiaojishan
rank: formation
period: [Middle Jurassic, Late Jurassic]
stages: [Callovian, Oxfordian, Kimmeridgian]
variants: [Lanqi]
references:
  - id: xu2016b
    notes: >
      Pins the unit to a single stage: "The Lanqi/Tiaojishan Formation is
      probably Oxfordian", supported by 40Ar/39Ar dates of 161.8 +/- 0.4 Ma
      from the basal portion and 159.5 +/- 0.6 Ma from the top of the Lanqi
      Formation of western Liaoning. The Daxishan Locality at Linglongta
      "exposes the Oxfordian Lanqi/Tiaojishan Formation", and the Oxfordian
      Linglongta phase of the Yanliao Biota, 164 to 159 million years ago, is
      drawn from it; the underlying Haifanggou/Jiulongshan Formation is
      Bathonian-Callovian.
  - id: sullivan2014a
    notes: >
      Reviews the radiometric control on the formation and finds it straddles
      the epoch boundary: the dating of Zhang and colleagues (2008) puts the
      upper boundary at 156-153 Ma and the lower boundary at about 165 Ma,
      "values that comfortably span the Middle-Late Jurassic boundary", while
      Yang and Li (2008) allow 166 to 148 Ma and Chang and colleagues (2009)
      put the lower bound at 160.7 +/- 0.4 Ma. The Daohugou strata are left
      unresolved: they "might either extend across the Jiulongshan-Tiaojishan
      boundary or be entirely referable to the upper Jiulongshan or lower
      Tiaojishan formation", so what the paper says about their age is not a
      date for this unit.
  - id: peng2012a
    notes: >
      Assigns the unit a late Middle to Late Jurassic age and reports a SHRIMP
      U-Pb zircon date of 160.7 Myr on basal andesites in the fossil-bearing
      succession at Linglongta, which the paper correlates with the formation.
      The wider figure sometimes quoted for the unit, "from the Middle
      Jurassic (Toarcian) to the latest Jurassic (Tithonian)", is the range
      across previously published estimates rather than the paper's own, and
      labels the Toarcian as Middle Jurassic; the dating results the paper
      accepts run 152 to 165 Myr in northern Hebei, western Liaoning and
      Daohugou.
  - id: godefroit2013a
    notes: >
      States the span. SHRIMP U-Th-Pb gives "ages between 165 +/- 1.2 Ma and
      153 +/- 2 Ma", and "these results indicate that the age of the
      Tiaojishan Formation is between the Callovian (Middle Jurassic) and the
      Kimmeridgian (Late Jurassic)". Writes the name "Tiaojishan (= Lanqi)".
  - id: liu2012a
    notes: >
      SHRIMP U-Pb zircon dates tied to the fossil horizons themselves rather
      than to regional samples, giving weighted means of 160.5 +/- 0.99,
      161.0 +/- 1.44 and 158.5 +/- 1.6 Ma. Writes the unit "Lanqi/Tiaojishan".
