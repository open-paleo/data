name: Tornhöj
rank: member
parent: Jydegaard
period: [Early Cretaceous]
stages: [Berriasian]
references:
  - id: christiansen2003a
    notes: >
      Puts the vertebrate-rich base of the member, at the Neomiodon Bed in Carl
      Nielsen's sandpit at Robbedale, and dates the basal beds "Late Berriasian
      to ?Early Valanginian, i.e. Ryazanian".
  - id: bonde2012a
    notes: >
      Without naming the member, dates the fossil beds at the base of the
      Jydegaard Formation in C. Nielsen's sandpit, the Neomiodon bed and the
      sand above it, as "Late Berriasian".
