name: Tornhöj
rank: member
parent: Jydegaard
period: [Early Cretaceous]
stages: [Berriasian]
references:
  - id: christiansen2003a
    notes: >
      Makes it the vertebrate-bearing part of the formation: "The most
      important part for vertebrate remains of the Jydegaard Formation is the
      basal part of the sandy Tornhöj Member, which rests directly on the
      Robbedale Formation, in the large 'Carl Nielsen's sandpit' at
      Robbedale", by far the richest vertebrate locality. Puts a marker bed at
      that base, "the one half meter thick Neomiodon Bed, named after the
      extremely abundant bivalve, is basal in the formation", and figures "the
      lower 8 meters of the Tornhöj Member, including the Neomiodon Bed (cross
      hatched) at the base". Dates that interval "Late Berriasian to ?Early
      Valanginian, i.e. Ryazanian in age", then withdraws the younger end in
      the same sentence, citing two authorities against the equivalence it
      rests on: "in ALLEN & WIMBLEDON [1991: Fig. 2] Ryazanian corresponds,
      however, to Mid-Late Berriasian; HORNE [1995: Fig. 5] uses Ryazanian for
      the entire Berriasian". The Valanginian it gives elsewhere belongs to
      the formation as a whole, which "supposedly includes most or all of the
      Valanginian".
  - id: bonde2012a
    notes: >
      Dates the same beds without naming the member, reaching them through the
      marker bed and the pit the two accounts share. The vertebrate fossils
      come from "the base of the Jydegaard Formation ... locally named the
      Neomiodon bed, and in the overlying 2-3 m of sand" at C. Nielsen's
      sandpit, and "The age of these sediments is Late Berriasian",
      correlated to the Middle Bückeberg Formation, the Durlston Beds of the
      Upper Purbeck and the lower Ashdown Formation. Both accounts also rebut
      the same claim about the same bed, that fossils occur below it. Puts the
      Valanginian above these beds rather than in them: "The remaining higher
      part of Jydegaard Formation might be of Valanginian age". Shares an
      author with Christiansen and Bonde (2003), so the two are one worker's
      account restated rather than independent readings.
