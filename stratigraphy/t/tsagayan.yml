name: Tsagayan
rank: group
period: [Late Cretaceous, Paleocene]
stages: [Maastrichtian, Danian]
references:
  - id: zherikhin1978a
    notes: >
      Treats the unit as the Tsagayan Formation and judges it safer to date it
      "в интервале маастрихт - даний" (within the Maastrichtian–Danian
      interval, translated).
  - id: vanitterbeeck2005a
    notes: >
      Gives the Udurchukan and Bureya formations as "the lower and middle part
      of the Tsagayan Group".
