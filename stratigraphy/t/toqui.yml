name: Toqui
rank: formation
period: [Late Jurassic]
stages: [Tithonian]
references:
  - id: carrano2012a
    notes: >
      Gives tetanuran material from "the Tithonian Toqui Formation of
      southern Chile".
  - id: mannion2019a
    notes: >
      Independently records that "A locality in the Tithonian Toqui Formation
      of southern Chile also demonstrates the presence of a diplodocine in
      the Late Jurassic of South America".
  - id: novas2015a
    notes: >
      Gives the Chilesaurus locality as "a fossil locality in the Upper
      Jurassic Toqui Formation of southern Chile", and the horizon as "Toqui
      Formation, Tithonian, latest Jurassic".
