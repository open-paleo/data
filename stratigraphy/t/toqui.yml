name: Toqui
rank: formation
period: [Late Jurassic, Early Cretaceous]
stages: [Tithonian, Berriasian, Valanginian, Hauterivian]
references:
  - id: carrano2012a
    notes: >
      Gives tetanuran material from "the Tithonian Toqui Formation of
      southern Chile".
  - id: mannion2019a
    notes: >
      Independently records that "A locality in the Tithonian Toqui Formation
      of southern Chile also demonstrates the presence of a diplodocine in
      the Late Jurassic of South America".
  - id: novas2015a
    notes: >
      Gives the Chilesaurus locality as "a fossil locality in the Upper
      Jurassic Toqui Formation of southern Chile", and the horizon as "Toqui
      Formation, Tithonian, latest Jurassic".
  - id: suárez2009a
    notes: >
      The basal unit of the Coihaique Group, whose ammonites "indicate
      Tithonian, early Berriasian and late Berriasian ages"; "The
      transgression of the Aisén Basin, mainly represented by the Toqui
      Formation, was diachronous during the Tithonian, Berriasian, Valanginian
      and early Hauterivian".
  - id: salgado2008b
    notes: >
      Gives the horizon of the first Late Jurassic dinosaur bones from Chile
      as "Toqui Formation (Tithonian), Aysén Basin", and records that the
      transgression "was diachronous, being Tithonian, Berriasian, Valanginian
      and early Hauterivian in different localities".
  - id: rivas2021a
    notes: >
      Revises the formation at its type locality, the El Toqui mine: "the
      Toqui Formation, at its type locality, ranges between the uppermost late
      Berriasian–early Valanginian", with Tithonian–Berriasian marine faunas
      known only from a 30 km radius in the wider vicinity of the mine.
  - id: suárez2016a
    notes: >
      Dates tuffs among the Chilesaurus bones at "148.7 ± 1.4, 147.9 ± 1.5 and
      147.0 ± 1.0" Ma by U–Pb SHRIMP, Tithonian, in a succession of sandstones
      and conglomerates "chronostratigraphically correlated with the Toqui
      Formation" rather than assigned to it.
  - id: salgado2015a
    notes: >
      Describes sauropod remains from the "Toqui Formation, late Tithonian" of
      Aysén.
