name: Terra Cotta Clay
rank: member
parent: Dakota
period: [Early Cretaceous, Late Cretaceous]
stages: [Albian, Cenomanian]
variants: [Terra Cotta]
lithology: gray claystone and red-mottled massive claystone, with siltstone and
  sandstone
references:
  - id: carpenter1998c
    notes: >
      Gives the Silvisaurus type horizon as "Terra Cotta Clay (Albian:
      Hamilton, 1994), Dakota Formation", in Ottawa County, Kansas, using the
      fuller name with its lithology word.
  - id: eaton1960a
    notes: >
      Places the type site "midway in the Terra Cotta clay member of the
      Dakota Formation, hence about one third of the way up in the Dakota (now
      classified as uppermost Lower Cretaceous in the Kansas region)", and
      gives the type specimen's horizon as "Terra Cotta clay member of the
      Dakota Formation, Lower Cretaceous".
  - id: hamilton1994a
    notes: >
      Splits the member at a mid-Dakota unconformity: the lower part with the
      late Albian lower Dakota, the upper part Upper Cretaceous, with "a maximum
      age of 95 Ma (Cenomanian)". Source of the lithology.
  - id: gale2020a
    notes: >
      Puts the base of the Cenomanian at 100.5 Ma.
  - id: ludvigson2010a
    notes: >
      Dates the member by palynostratigraphic units: the lower Terra Cotta in
      late Albian Unit 1, the upper Terra Cotta in Unit 2 and, locally in
      Nebraska and Kansas, in Cenomanian Unit 3.
  - id: brenner2000a
    notes: >
      Places the lower Terra Cotta in palynostratigraphic Unit 1, sampled in
      a Lincoln County, Kansas core, and agrees with earlier work "that the
      Albian–Cenomanian boundary lies above the top of the Kiowa Formation in
      Kansas".
  - id: bergen1990a
    notes: >
      Cited by Hamilton (1994) for a 97 to 99 Ma maximum age for the Dakota
      Formation.
  - id: plummer1942a
    notes: >
      Cited by Hamilton (1994) for dividing the Dakota Formation into the
      Terra Cotta Clay and Janssen Clay Members.
  - id: weimer1984a
    notes: >
      Cited by Hamilton (1994) for the 97 Ma maximum age of the Dakota
      Formation from dated Colorado unconformities.
