name: Terra Cotta Clay
rank: member
parent: Dakota
period: [Early Cretaceous, Late Cretaceous]
stages: [Albian, Cenomanian]
variants: [Terra Cotta]
references:
  - id: carpenter1998c
    notes: >
      Gives the Silvisaurus type horizon as "Terra Cotta Clay (Albian:
      Hamilton, 1994), Dakota Formation", in Ottawa County, Kansas, using the
      fuller name with its lithology word.
  - id: eaton1960a
    notes: >
      Places the type site "midway in the Terra Cotta clay member of the
      Dakota Formation, hence about one third of the way up in the Dakota (now
      classified as uppermost Lower Cretaceous in the Kansas region)", and
      gives the type specimen's horizon as "Terra Cotta clay member of the
      Dakota Formation, Lower Cretaceous".
  - id: hamilton1994a
    notes: >
      Gives the Dakota Formation in Kansas as consisting "of the Terra Cotta
      Clay and Janssen Clay Members (Plummer and Romary, 1942)", the Terra Cotta
      the lower. An unconformity "within the middle of the Dakota Formation"
      divides the member: its lower part belongs with the lower half of the
      Dakota among the Lower Cretaceous sequences, while "the upper one-half of
      the Dakota Formation in Kansas, including all of the Janssen Clay Member
      and the upper part of the Terra Cotta Clay Member, is Upper Cretaceous",
      with "a maximum age of 95 Ma (Cenomanian)". The contact with the Janssen
      above is a flooding surface, not a sequence boundary. It dates the whole
      formation from below: "The correlation of unconformities from Colorado
      where they are dated gives a maximum age for the Dakota Formation of 97 Ma
      (Weimer, 1984). This date is confirmed by Bergen et al. (1990) as 97 Ma to
      99 Ma." The 97 Ma comes from Weimer's unconformity scheme, where it is
      an estimate attached to an Albian break, not a measured date.
  - id: gale2020a
    notes: >
      Puts the base of the Cenomanian at 100.5 Ma.
  - id: ludvigson2010a
    notes: >
      Dates the member by palynostratigraphic units. Unit 1, with taxa "not
      known to range above the early Late Albian Kiowa–Skull Creek
      depositional cycle", includes the lower Terra Cotta; Unit 2, of strata
      "variously assigned to the lower Woodbury and upper Terra Cotta
      Members", has "No Cenomanian indicators"; the Cenomanian Unit 3
      "locally includes facies assigned to the upper Terra Cotta Member in
      areas of Nebraska and Kansas".
  - id: brenner2000a
    notes: >
      Places the lower Terra Cotta in palynostratigraphic Unit 1, sampled in
      a Lincoln County, Kansas core, and agrees with earlier work "that the
      Albian–Cenomanian boundary lies above the top of the Kiowa Formation in
      Kansas".
