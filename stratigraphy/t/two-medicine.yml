name: Two Medicine
rank: formation
period: [Late Cretaceous]
stages: [Campanian]
description: "The Two Medicine Formation is a geological formation, or rock body, in northwestern Montana and southern Alberta that was deposited between 82.4 Ma and 74.4 Ma, during Campanian (Late Cretaceous) time. It crops out to the east of the Rocky Mountain Overthrust Belt, and the western portion (about 600 meters or 2,000 feet thick) of this formation is folded and faulted while the eastern part, which thins out into the Sweetgrass Arch, is mostly undeformed plains. Below the formation are the nearshore (beach and tidal zone) deposits of the Virgelle Sandstone, and above it is the marine Bearpaw Shale. Throughout the Campanian, the Two Medicine Formation was deposited between the western shoreline of the Late Cretaceous Interior Seaway and the eastward advancing margin of the Cordilleran Overthrust Belt. The Two Medicine Formation is mostly sandstone, deposited by rivers and deltas."
