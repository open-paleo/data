name: Tiourarén
rank: formation
parent: Irhazer
period: [Middle Jurassic, Late Jurassic, Early Cretaceous]
stages: [Bathonian, Callovian, Oxfordian, Kimmeridgian, Tithonian,
  Berriasian, Valanginian, Hauterivian, Barremian]
references:
  - id: mannion2025a
    notes: >
      Gives the current reading: Jobaria tiguidensis comes from "the
      Bathonian-Callovian Tiouraren Formation of Niger", crediting Rauhut and
      López-Arbarello (2009) alongside Sereno and colleagues (1999).
  - id: holtz2004a
    notes: >
      Carries the superseded Cretaceous reading, tabulating the formation as
      Barremian. Upchurch and colleagues (2004) give a similar
      Hauterivian-Barremian range in the same volume. The Jurassic redating
      has since been adopted, so this is history rather than a live
      disagreement.
  - id: remes2009a
    notes: >
      Places it above the Irhazer Group, the site sitting "at the base of the
      Irhazer Group (''Argiles de l'Irhazer'' below the Tiourarén Formation)".
      On its age, it reports that "the pre-Aptian and post-Triassic age of the
      Tiourarén Formation has been critically discussed" by Rauhut and
      López-Arbarello (2009), "leading to the conclusion that the represented
      fauna fits more parsimoniously in a late Middle Jurassic to early Late
      Jurassic scene".
  - id: sereno1994a
    notes: >
      Suggests the fauna from the Tiourarén beds "may be somewhat older
      (Hauterivian or Barremian, 125 to 135 million years ago) because they
      lie stratigraphically below the Gadoufaoua fauna", which is regarded as
      Aptian or Albian.
  - id: upchurch2004a
    notes: >
      A distribution table row, and it gives two formations one age cell:
      Jobaria tiguidensis is listed against "Tiourare'n Formation (Agadez),
      Farak Formation (Tahoua), Niger" with the age "Hauterivian Barremian,
      ?late Albian early Cenomanian". The span therefore covers both units
      together and cannot be read as this one's. The paper's body says only
      that "Jobaria was found in the Tiourare'n Formation of Niger (Sereno et
      al. 1999)", with no age. The unit name is split by a line break inside
      the table cell, so a search for it returns nothing from either mention.
  - id: rauhut2009a
    notes: >
      The paper devoted to the question, and the source of the Jurassic
      reading. It finds that the formation itself "does not provide any
      evidence for such an age, and the geological relations only help to
      constrain the upper limit for the age of the formation (Aptian)",
      while "the described dinosaur taxa are phylogenetically nested with
      late Middle Jurassic to Early Late Jurassic taxa from other localities,
      and thus indicate a pre-Kimmeridgian, probably late Middle Jurassic age
      for the Tiouaren Formation". The Bathonian and Callovian come from the
      comparanda rather than from the rock: Afrovenator groups with the
      Bathonian Dubreuillosaurus and the Callovian Eustreptospondylus. Spells
      the unit Tiouaren throughout.
  - id: sereno1999a
    notes: >
      The describing paper, and the source of the Cretaceous reading it is
      usually cited for: the fossils come from "the Neocomian [~140 to 130
      million years ago (Ma)] Tiouraren Formation", against "Aptian-Albian
      (~115 to 105 Ma) horizons of the Tegama Group in the Gadoufaoua
      region". The age is given as a numeric interval with an archaic term
      rather than as stages, and no stage name for this unit appears in the
      paper.
  - id: rauhut2016a
    notes: >
      Uncertain in age, and Jurassic rather than Cretaceous: the formation
      "has traditionally been regarded as Early Cretaceous", but Rauhut and
      López-Arbarello (2009) "argued that it is considerably older, and
      probably Middle to earliest Late Jurassic in age", an assignment "widely
      accepted since" and adopted here, with most authors favoring a late
      Middle Jurassic age. A table of Middle Jurassic theropod records gives
      the formation as "?Bathonian-?Oxfordian".
