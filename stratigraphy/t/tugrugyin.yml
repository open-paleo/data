name: Tugrugyin
rank: member
parent: Djadokhta
period: [Late Cretaceous]
stages: [Campanian]
variants: [Toogreeg]
lithology: very pale orange to light gray sand and sandstone
references:
  - id: dashzeveg2005a
    notes: >
      Erects it as the upper of the formation's two members and orders the
      faunas by superposition: "the Bayn Dzak fauna lived somewhat earlier than
      that from Tugrugyin Shireh based on the superposition of the members, it
      is not clear how much earlier". New magnetostratigraphy runs "through the
      Bayn Dzak Member up into the basal Tugrugyin Member". Maps the oldest
      rocks at Tugrugyin Shireh as "Late Cretaceous sands, primarily
      representing the Tugrugyin Member of the Djadokhta Formation". Describes
      its rock: "The upper member is named the Tugrugyin Member and consists of
      very pale orange to light gray sands that also represent a crossbedded
      dune facies and a structureless sandslide facies."
  - id: turner2007a
    notes: >
      Gives "The Tugrugyin Member of the Djadokhta Formation (Campanian),
      Tugrugyin Shireh, Ömnögov, Mongolia" as the Mahakala type horizon.
  - id: gradziński1977a
    notes: >
      Treats the "beds of Toogreeg" as a unit apart from the Djadokhta
      Formation, which it restricts to Bayn Dzak and Khashaat, while holding
      that "the Toogreeg and Alag Teg beds are biostratigraphic equivalents of
      the Djadokhta Formation" on their shared vertebrates. It notes their
      "very large-scale cross-laminations", read as eolian dunes, and dates
      them with the Djadokhta, "?upper Santonian and/or ?lower Campanian",
      there being "not radiometric age data available".
