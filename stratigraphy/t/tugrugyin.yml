name: Tugrugyin
rank: member
parent: Djadokhta
period: [Late Cretaceous]
stages: [Campanian]
variants: [Toogreeg]
lithology: very pale orange to light gray sand and sandstone
references:
  - id: dashzeveg2005a
    notes: >
      Erects it as the upper of the formation's two members, overlying the Bayn
      Dzak Member, and finds its basal sands reversed in polarity like the top
      of the Bayn Dzak. Source of the lithology.
  - id: turner2007a
    notes: >
      Gives "The Tugrugyin Member of the Djadokhta Formation (Campanian),
      Tugrugyin Shireh, Ömnögov, Mongolia" as the Mahakala type horizon.
  - id: gradziński1977a
    notes: >
      Treats the "beds of Toogreeg" as a biostratigraphic equivalent of the
      Djadokhta Formation rather than part of it, and reads their
      cross-laminations as eolian dunes.
