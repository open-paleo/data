name: Tugrugyin
rank: member
parent: Djadokhta
period: [Late Cretaceous]
stages: [Campanian]
references:
  - id: dashzeveg2005a
    notes: >
      Erects it as the upper of the formation's two members and orders the
      faunas by superposition: "the Bayn Dzak fauna lived somewhat earlier
      than that from Tugrugyin Shireh based on the superposition of the
      members, it is not clear how much earlier". New magnetostratigraphy runs
      "through the Bayn Dzak Member up into the basal Tugrugyin Member". Maps
      the oldest rocks at Tugrugyin Shireh as "Late Cretaceous sands,
      primarily representing the Tugrugyin Member of the Djadokhta Formation".
  - id: turner2007a
    notes: >
      Gives "The Tugrugyin Member of the Djadokhta Formation (Campanian),
      Tugrugyin Shireh, Ömnögov, Mongolia" as the Mahakala type horizon.
