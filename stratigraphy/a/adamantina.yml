name: Adamantina
rank: formation
parent: Bauru
period: [Late Cretaceous]
stages: [Turonian, Coniacian, Santonian, Campanian, Maastrichtian]
dispute:
  summary: >
    The age is read two ways, a whole epoch apart at the older end. Santucci
    and colleagues (2022) give "Adamantina Formation, Campanian-early
    Maastrichtian"; Machado and colleagues (2013) give "Adamantina Formation
    (Turonian-Santonian".
references:
  - id: dias-brito2001a
    notes: >
      Dates the unit by charophytes and ostracods rather than by vertebrates.
      "Chara" barbosai and Ilyocypris cf. riograndensis from this formation
      are Turonian-Santonian, against a Maastrichtian assemblage in the Ponte
      Alta Member of the Marilia Formation above, the two separated by a
      hiatus of more than 11 Ma. Places the top of the formation at a sequence
      boundary, "the Adamantina Formation (Turonian-Santonian)".
  - id: santucci2022a
    notes: >
      Gives the younger reading and places it in the Bauru Group: "Bauru Group
      (Upper Cretaceous), Adamantina Formation, Campanian–early
      Maastrichtian", following Batezelli (2017) and Dias and colleagues
      (2020), and repeats it for the Presidente Prudente locality as
      "Adamantina Formation (=Presidente Prudente Formation), Campanian–early
      Maastrichtian".
  - id: machado2013a
    notes: >
      In the abstract the unit is the "Adamantina Formation
      (Turonian-Santonian, Bauru Basin)"; the introduction calls it "the Late
      Cretaceous Adamantina Formation whose age is disputed, being regarded as
      Turonian-Santonian ... or Campanian-Maastrichtian", following Dias Brito
      and colleagues (2001) for the older age and Gobbo Rodrigues and
      colleagues (1999) for the younger.
  - id: cavalcanti2026a
    notes: >
      Keeps the name in current use, listing it among the four formations into
      which "the Bauru Group is divided".
  - id: batezelli2015a
    notes: >
      Relays the younger of the two ostracod readings: Gobbo-Rodrigues (2001)
      identified five named ostracod species "in the Adamantina and Marilia
      formations", and "according to this author, the fossil assemblage can
      be compared to the Neuquen (Argentina) and Republic of Congo
      assemblages, with Campanian-Maastrichtian ages". Worth reading beside
      the Turonian-Santonian that Dias-Brito and colleagues published the
      same year, also on ostracods: the disagreement on this entry is not two
      kinds of evidence competing but one kind, contemporaneous, split four
      stages apart.
  - id: dias2020a
    notes: >
      Gives this formation no stage of its own: its one Campanian belongs to
      the Uberaba, "considered to have been deposited in the Campanian, based
      on lithostratigraphic relationships with the Adamantina and Marilia
      formations", and its one Maastrichtian to the Marilia, "the youngest
      among the Cretaceous formations of the region". What it supplies is a
      floor, relayed: "Castro et al. (2018) dated the youngest detrital
      zircon grain of the basal section of the Adamantina Formation at 87.78
      plus or minus 0.06 Ma (CA-ID-TIMS), giving the maximum depositional age
      for Adamantina Formation in the Triangulo Mineiro region." A maximum
      depositional age bounds only the old end, this one is scoped to the
      basal section in one region, and it is not this paper's own result.
      Also records the alternative name, the Adamantina being the "Vale do
      Rio do Peixe Formation in Paula e Silva et al., 2009".
