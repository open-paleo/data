name: Adamantina
rank: formation
parent: Bauru
period: [Late Cretaceous]
stages: [Turonian, Coniacian, Santonian, Campanian, Maastrichtian]
lithology: fine to very fine-grained sandstone alternating with mudstone,
  siltstone and muddy sandstone
dispute:
  summary: >
    Dias-Brito and colleagues (2001) date the formation by charophytes and
    ostracods as Turonian to Santonian, and Machado and colleagues (2013)
    follow them; Gobbo-Rodrigues (2001), relayed by Batezelli (2015), compares
    its ostracods with Campanian to Maastrichtian assemblages, and Santucci
    and Filippi (2022) give "Campanian–early Maastrichtian". Arai and
    Dias-Brito (2023), from the palynology of the São Carlos and Araçatuba
    formations and the units' arrangement, infer "a late Santonian to early
    Campanian age for the Adamantina/Uberaba formations". Castro and
    colleagues (2018) date one fossil bed, at General Salgado in São Paulo,
    no older than 87.78 Ma, which is Coniacian or younger at that site and
    fits either reading there.
references:
  - id: dias-brito2001a
    notes: >
      Dates the formation by charophytes and ostracods as "Turonian-Santonian",
      separated by a hiatus of more than 11 Ma from the Maastrichtian Marília
      Formation above.
  - id: santucci2022a
    notes: >
      Gives the younger reading and places it in the Bauru Group: "Bauru Group
      (Upper Cretaceous), Adamantina Formation, Campanian–early
      Maastrichtian", following Batezelli (2015) and Dias and colleagues
      (2020), and repeats it for the Presidente Prudente locality as
      "Adamantina Formation (=Presidente Prudente Formation), Campanian–early
      Maastrichtian".
  - id: machado2013a
    notes: >
      In the abstract the unit is the "Adamantina Formation
      (Turonian-Santonian, Bauru Basin)"; the introduction calls it "the Late
      Cretaceous Adamantina Formation whose age is disputed, being regarded as
      Turonian-Santonian ... or Campanian-Maastrichtian", following Dias-Brito
      and colleagues (2001) for the older age and Gobbo-Rodrigues and
      colleagues (1999) for the younger.
  - id: cavalcanti2026a
    notes: >
      Keeps the name in current use, listing it among the four formations into
      which "the Bauru Group is divided".
  - id: batezelli2015a
    notes: >
      Relays Gobbo-Rodrigues (2001), who compared the ostracods of the
      Adamantina and Marília formations with assemblages "with
      Campanian-Maastrichtian ages".
  - id: dias2020a
    notes: >
      Relays from Castro and colleagues (2018) a zircon maximum depositional age
      of 87.78 ± 0.06 Ma, which it assigns to the basal section of the formation
      in the Triângulo Mineiro.
  - id: castro2018a
    notes: >
      Dates the mammal-bearing bed at Buriti Farm, General Salgado, São Paulo,
      by zircon to no older than 87.782 ± 0.062 Ma, "late Coniacian–late
      Maastrichtian" at the site.
  - id: aureliano2021a
    notes: >
      Places a titanosaur fibula from Ibirá, São Paulo, in the formation, dated
      "ca. 85.2 ± 2.7 Ma, Santonian" with Castro and colleagues (2018) as the
      source.
  - id: gale2020a
    notes: >
      Puts the base of the Coniacian at 89.4 Ma. The ICS chart v2024/12
      puts it at 89.8 Ma; the 87.78 Ma bed at General Salgado is Coniacian
      on either.
  - id: gobbo-rodrigues1999a
  - id: gobbo-rodrigues2001a
  - id: soares1980a
    notes: >
      Erects the formation in the Bauru Group for facies marked by "the presence
      of beds of fine to very fine-grained sandstones" (translated). Source of
      the lithology.
  - id: fernandes2000a
    notes: >
      Divides the formation among the new Vale do Rio do Peixe, Araçatuba and
      Presidente Prudente formations, and leaves the name out of the Bauru
      Group.
  - id: pinheiro2018a
    notes: >
      Keeps the formation in the Bauru Group of Soares and colleagues (1980) and
      gives it "Turonian–Early Maastrichtian" from a synthesis of earlier
      studies.
  - id: arai2023a
    notes: >
      Infers "a late Santonian to early Campanian age for the Adamantina/Uberaba
      formations" from neighboring units, and keeps Adamantina over the Vale do
      Rio do Peixe Formation.
  - id: huene1933b
  - id: price1950a
  - id: soares1975a
