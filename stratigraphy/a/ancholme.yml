name: Ancholme
rank: group
period: [Middle Jurassic, Late Jurassic]
stages: [Callovian, Oxfordian, Kimmeridgian, Tithonian]
references:
  - id: barron2012a
    notes: >
      Names the group and its constituent formations north of Oxford, the
      Kellaways, Oxford Clay, West Walton, Ampthill Clay and Kimmeridge Clay
      in ascending order, and gives the span as "Callovian to Kimmeridgian".
      That is the British Kimmeridgian, which runs to the base of the
      Portland Sand and so takes in what is lower Tithonian internationally:
      Hesselbo and colleagues (2020) equate the British "Bolonian" with "the
      upper Kimmeridgian clay formation between the Kimmeridgian–Tithonian
      boundary and the Portland Sand". The span is therefore Callovian to
      early Tithonian, and no source gives the group a Berriasian.
      Records that the group and the Corallian Group "are mutually exclusive
      in geographical range".
  - id: gaunt1992a
    notes: >
      The defining memoir: "throughout the late Jurassic most of eastern
      England again became part of an extensive shallow open sea in which the
      thick and largely argillaceous Ancholme Clay Group was deposited", and
      "The open-marine environment was brought to an end in Portlandian times
      by widespread uplift".
  - id: cope1980a
    notes: >
      Records the two senses of the stage name: "In Britain it is customary
      to equate 'Kimmeridgian' with the Kimmeridge Clay and 'Portlandian' with
      the Portland Beds", whereas on the continent "the British Upper
      Kimmeridgian (elegans Zone upwards) is already Portlandian in France".
  - id: hesselbo2020a
    notes: >
      Explains how "a confusing equivalence of a 'Kimmeridgian Stage' with the
      'Kimmeridge Clay' formation ... became common usage in England", and
      places the international Kimmeridgian–Tithonian boundary below the top
      of the Kimmeridge Clay, "within the middle of Cope's expanded A.
      autissiodorensis Zone", below the elegans Zone (p. 974).
