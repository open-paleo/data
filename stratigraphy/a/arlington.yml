name: Arlington
rank: member
parent: Woodbine
period: [Late Cretaceous]
stages: [Cenomanian]
references:
  - id: head1998a
    notes: >
      Fixes the age by the unit above: the member "is capped by the Tarrant
      Member of the Eagleford Group, which is within the Conlinoceras
      tarrantense zone, at the base of the middle Cenomanian. Therefore the
      Arlington Member is 95.78 ± 0.61 Ma, at youngest". Gives the age of the
      type locality within it as "Woodbine Formation, early Late Cretaceous,
      Mid-Cenomanian, 95 Ma". Mudstone with thin sandstones grading up to
      massive sandstone, with two lignitic layers.
