name: Arlington
rank: member
parent: Lewisville
period: [Late Cretaceous]
stages: [Cenomanian]
lithology: sandstone
references:
  - id: head1998a
    notes: >
      Describes a 6 m section of the member at the type locality of its
      hadrosaurid, and dates the member by the Tarrant Member that caps it, "at
      the base of the middle Cenomanian".
  - id: tykoski2023a
    notes: >
      Places it in the Lewisville Formation of the Woodbine Group, following
      Denne and colleagues' revision: a site "in either the Arlington Member
      or Tarrant Member of the Lewisville Formation (Denne et al., 2016)".
  - id: denne2016a
    notes: >
      Cited by Tykoski and colleagues (2023) for the revision that makes the
      Woodbine a group with the Lewisville as its upper formation. Source of the
      lithology.
  - id: dodge1969a
    notes: >
      Names the member: the "uppermost fossiliferous sandstone unit" of Hill's
      Lewisville Beds, as the "Arlington Member" of the Woodbine Formation,
      above its Lewisville Member, with a type section on West Park Row
      Street, Arlington.
  - id: hill1901a
