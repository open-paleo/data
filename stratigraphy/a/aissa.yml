name: Aïssa
rank: formation
period: [Middle Jurassic, Late Jurassic]
stages: [Bathonian, Callovian, Oxfordian, Kimmeridgian]
dispute:
  summary: >
    The span is wide because the sources disagree about where this formation
    begins, not because one formation covers thirty million years. Under the
    unit-by-unit scheme of Kacemi (2005), the formation is
    Kimmeridgian-Portlandian and starts at unit 12, while the Lower Bathonian
    to Callovian-Oxfordian below it belongs to the Djara Formation. Mannion
    and colleagues (2019) and Läng and Mahammed (2010) instead place
    Chebsaurus in this formation and date it Callovian and Middle Jurassic
    respectively, the former citing a description that gives only "Middle
    Jurassic" and never names the unit. Läng and Mahammed take the Callovian
    from Kacemi while keeping the wider formation name, so the name and the
    age in that reading come from schemes that do not agree. Which formation
    yields Chebsaurus turns on the same question.
references:
  - id: amar-bekada2023a
    notes: >
      Places the Aïssa Formation in the Malm at "Kimmeridgian-Portlandian",
      with its lower member Kimmeridgian, "upper Jurassic", and its upper
      member Portlandian, while the Callovian-Oxfordian sits in the Djara
      Formation beneath it. The formation is about 625 m thick at Djebel
      Djeraouine, a regressive megasequence of deltaic sequences that builds
      the great anticlines of Djebel Aïssa and Djebel Mekther, and it is
      overlain by the Tiloula Formation. The section introducing the Malm is
      looser, calling it Oxfordian, Kimmeridgian and Portlandian and
      "represented largely by the Formation of Aissa".
  - id: kacemi2005a
  - id: mannion2019a
    notes: >
      Gives "the Callovian Aïssa Formation of Algeria" for Chebsaurus.
  - id: läng2010a
    notes: >
      Gives the coarser reading, "the Middle Jurassic Aïssa formation of the
      Naama Province, Algeria", for further material of the same taxon. For
      the Chebsaurus site itself it lists past datings of "'indeterminate
      Dogger'", Bathonian, Callovian "or Oxfordian to Portlandian", and,
      granting that "it is not so easy to determine clearly the age", supposes
      after Kacemi (2005) that Chebsaurus "should be dated from the
      Callovian".
