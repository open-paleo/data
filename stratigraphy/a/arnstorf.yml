name: Arnstorf
rank: member
parent: Torleite
period: [Late Jurassic]
stages: [Kimmeridgian]
references:
  - id: niebuhr2014a
    notes: >
      Defines the Torleite Formation with six subformations, which its English
      abstract calls members; the Arnstorf is the upper of the two in the
      eastern Southern Franconian Alb, above the Netzstall, and its siliceous-
      plate facies includes the sites at Schamhaupten and the Rygol quarry at
      Painten.
