name: Alagteeg
rank: formation
period: [Late Cretaceous]
stages: [Campanian]
dispute:
  summary: >
    Hasegawa and colleagues (2009), who define the formation, hold that it
    "should be correlated to the upper part of the Bayanshiree Formation on
    the basis of their similarities in the lithofacies and stratigraphic
    relationships", which would make it older than the overlying Campanian
    Djadokhta, though they name no stage for it. Penkalski and colleagues
    (2026) instead find the beds at Alag Teeg "roughly coeval with the
    lowermost beds at Bayn Dzak" by magnetostratigraphy, which are Campanian.
references:
  - id: hasegawa2009a
    notes: >
      Defines the formation: "We propose a new formation name for this
      stratigraphic unit as 'Alagteeg Formation'", the fluvial lower part of
      the Ulan Nuur succession, typified at Alag Teeg, about 15 m thick there,
      overlain by the Djadokhta, its base not exposed. It also includes the
      lowermost beds in the northern area of Bayan Zag.
  - id: penkalski2026a
    notes: >
      Correlates the Alag Teeg beds with "the lowermost beds at Bayn Dzak",
      on the magnetostratigraphy of Dashzeveg and colleagues (2005), and notes
      that the formation is time-transgressive.
  - id: dashzeveg2005a
  - id: tsogtbaatar2014a
    notes: >
      Before the split, gives the Alag Teeg locality as "Djadokhta Formation,
      ?Upper Campanian".
  - id: averianov2020a
    notes: >
      Gives the Abdarainurus type horizon as "Alagteeg Formation, Upper
      Cretaceous" and describes the lithology — "red-brown sandstone with
      gravel intercalated with grey sandstone and siltstone", fluvial, near
      the bottom of the section — but states the limit: "The geological age
      of the Alagteeg Formation is not well constrained".
  - id: averianov2021b
    notes: >
      Places Abdarainurus barsboldi in "the Campanian(?) Alagteeg Formation of
      Mongolia", with the stage queried and citing Averianov and Lopatin
      (2020), who leave the age unconstrained.
