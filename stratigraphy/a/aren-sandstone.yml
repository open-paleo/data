name: Arén Sandstone
rank: formation
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
references:
  - id: csiki-sava2015a
    notes: >
      Gives the name and the span: the "shallow marine-deltaic Arén
      Sandstone" and the Tremp Formation are the two units holding the
      uppermost Cretaceous of Huesca, Lleida and Barcelona, and are
      diachronous, the Arén Sandstone running "from late Campanian to late
      Maastrichtian".
  - id: prieto-márquez2013a
    notes: >
      Gives the relationship to the Tremp, which "overlies and is partly
      equivalent laterally to the upper Campanian-Maastrichtian Arén
      Sandstone", and records that its deposits have been read as
      barrier-island, beach or deltaic in origin.
  - id: cruzado-caballero2010a
    notes: >
      Uses the rank word in place of the lithic term, placing the Blasi 1
      locality of Arén, Huesca, in "the upper part of the Arén Formation, late
      Maastrichtian in age", and in the type horizon narrows that level to
      "Late Cretaceous, latest Maastrichtian (upper part of chron 30n)". Arén
      is also a town and the name of a Tremp-syncline sector, which the lithic
      form disambiguates.
