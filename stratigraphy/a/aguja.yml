name: Aguja
rank: formation
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
references:
  - id: lehman2024a
    notes: >
      The formation preserves deposits that "accumulated along the western
      shoreline of the Cretaceous Western Interior Seaway in the Big Bend
      region of Texas during Campanian time", but the post-pyroclastic
      interval in the uppermost Alto Shale, recording "renewed sedimentation
      at the end of Aguja deposition", "likely extends into early
      Maastrichtian time".
  - id: prieto-márquez2019b
    notes: >
      Independently gives "Aguja Formation (lower Campanian".
  - id: befus2008a
    notes: >
      The Peña Mountain pyroclastic deposits lie "within Upper Cretaceous
      floodplain deposits in the Aguja Formation"; the lower part of the upper
      shale member "contains a diverse assemblage of fossil mammals and
      reptiles (including dinosaurs) that indicate a Late Campanian age",
      while fossils are sparser in the upper part of that member, which "could
      extend into the Early Maastrichtian". The youngest concordant U-Pb
      analyses of zircon from three basaltic bombs yield "a weighted mean age
      of 76.9 ± 1.2 Ma, consistent with the presence of Late Campanian
      vertebrate fossils in the upper Aguja Formation".
