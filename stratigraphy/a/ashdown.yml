name: Ashdown
rank: formation
parent: Hastings Beds
period: [Early Cretaceous]
stages: [Berriasian, Valanginian, Hauterivian]
variants: [Ashdown Beds, Ashdown Sands]
references:
  - id: barker2023a
    notes: >
      Gives the position and the naming history: the Hastings Group is
      "comprised of the older (late Berriasian–early Valanginian) Ashdown
      Formation, followed by the Wadhurst Clay Formation (Valanginian) and
      Tunbridge Wells Formation (late Valanginian ...)". The term "Ashdown
      Sands" is "now defunct", having been introduced by Drew (1861) "before
      being formalised to Ashdown Formation by" Rawson (1992). Rejects the
      older "Ashdown Sand (Hauterivian)" provenance that Charig and Milner
      (1997) gave a spinosaurid crown from near Bexhill: the site exposes only
      the Wadhurst Clay, so the tooth "cannot be Hauterivian or from the
      Ashdown Formation".
  - id: taylor2007a
    notes: >
      Uses the intermediate name, "the Ashdown Beds Formation, which
      straddles the Berriasian/Valanginian boundary", and records that the
      part exposed at Ecclesbourne Glen is Berriasian.
  - id: taylor2018a
    notes: >
      Gives "the Berriasian-Valanginian (earliest Cretaceous) Ashdown
      Formation of the Wealden Supergroup of southern England".
  - id: charig1997a
    notes: >
      Dates the part at Bexhill-on-Sea as Hauterivian, recording a baryonychid
      tooth crown from the "Ashdown Sand, (Hauterivian) at Redlands Bricks,
      Ashdown Works, Scallets Wood, Turkey Road, Bexhill-on-Sea, East Sussex".
  - id: drew1861a
    notes: >
      Coins the name: the lower sands "make very high ground, are spread over
      a large area, and show a very great thickness on Ashdown Forest, which
      is the central part of all the Hastings Sand country: no name, I think,
      can be better for these than Ashdown Sands". The same paragraph names
      the Wadhurst Clay and the Grinstead Clay.
  - id: rawson1992a
