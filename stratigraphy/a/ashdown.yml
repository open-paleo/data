name: Ashdown
rank: formation
parent: Hastings Beds
period: [Early Cretaceous]
stages: [Berriasian, Valanginian]
variants: [Ashdown Beds, Ashdown Sands]
lithology: siltstone and silty fine-grained sandstone, with less shale and
  mudstone
references:
  - id: barker2023a
    notes: >
      Places the formation as "late Berriasian–early Valanginian" at the base of
      the Hastings Group, and traces its name from Drew's (1861) "Ashdown Sands"
      to Rawson's (1992) formation.
  - id: taylor2007a
    notes: >
      Uses the intermediate name, "the Ashdown Beds Formation, which
      straddles the Berriasian/Valanginian boundary", and records that the
      part exposed at Ecclesbourne Glen is Berriasian.
  - id: taylor2018a
    notes: >
      Gives "the Berriasian-Valanginian (earliest Cretaceous) Ashdown
      Formation of the Wealden Supergroup of southern England".
  - id: charig1997a
    notes: >
      Records a baryonychid tooth crown from the "Ashdown Sand, (Hauterivian)"
      at Ashdown Works, Turkey Road, Bexhill-on-Sea, giving the part there as
      Hauterivian.
  - id: drew1861a
    notes: >
      Coins the name: the lower sands "make very high ground, are spread over
      a large area, and show a very great thickness on Ashdown Forest, which
      is the central part of all the Hastings Sand country: no name, I think,
      can be better for these than Ashdown Sands". The same paragraph names
      the Wadhurst Clay and the Grinstead Clay.
  - id: rawson1992a
  - id: naish2007a
    notes: >
      Relays the Bexhill tooth's provenance after Charig and Milner (1997),
      as "the Hauterivian Ashdown Beds Formation of East Sussex", a reading
      Barker and colleagues (2023) reject.
  - id: hopson2008a
    notes: >
      Source of the lithology.
