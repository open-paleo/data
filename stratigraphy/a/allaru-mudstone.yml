name: Allaru Mudstone
rank: formation
period: [Early Cretaceous]
stages: [Albian]
description: "The Allaru Formation, also known as the Allaru Mudstone, and formerly known as the Allaru Member of the Wilgunya Formation, is a geological formation in Queensland, Australia, whose strata date back to the Early Cretaceous. Dinosaur remains are among the fossils that have been recovered from the formation, alongside those of the protostegid turtle Notochelone, the ichthyosaur Platypterygius, fishes, cephalopods, the crab Torynomma and the coral Mckenziephyllia. The formation consists of blue-gray mudstones, but also very fine sandstones and minute, tough interbeds of thin calcareous siltstone, which originated from volcanoes to the east."
references:
  - id: poropat2017a
    notes: >
      Places it above the Toolebuc and dates both: rare sauropod specimens
      come from "the Toolebuc Formation and the Allaru Mudstone, both of which
      constitute upper Albian marine ... deposits".
  - id: leahey2015a
    notes: >
      Records a recalibration: U-Pb dating of detrital zircons in the Rolling
      Downs Group "suggests that some of the palynomorph zones may need to be
      temporally recalibrated, with the deposition of the Allaru Mudstone
      restricted to the upper Albian".
  - id: bell2018a
    notes: >
      Places it below the Mackunda, Muttaburrasaurus sp. coming "from the
      underlying Allaru Mudstone" while the M. langdoni holotype "comes from
      the Mackunda Formation (late Albian-early Cenomanian)".
