name: Allaru Mudstone
rank: formation
period: [Early Cretaceous]
stages: [Albian]
references:
  - id: poropat2017a
    notes: >
      Places it above the Toolebuc and dates both: rare sauropod specimens
      come from "the Toolebuc Formation and the Allaru Mudstone, both of which
      constitute upper Albian marine ... deposits".
  - id: leahey2015a
    notes: >
      Records a recalibration: U-Pb dating of detrital zircons in the Rolling
      Downs Group "suggests that some of the palynomorph zones may need to be
      temporally recalibrated, with the deposition of the Allaru Mudstone
      restricted to the upper Albian".
  - id: bell2018a
    notes: >
      Places it below the Mackunda, Muttaburrasaurus sp. coming "from the
      underlying Allaru Mudstone" while the M. langdoni holotype "comes from
      the Mackunda Formation (late Albian-early Cenomanian)".
