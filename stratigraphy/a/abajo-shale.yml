name: Abajo Shale
rank: member
parent: Aguja
period: [Late Cretaceous]
stages: [Campanian]
lithology: dark gray and olive carbonaceous mudstone, with lignite and coal near
  the base
references:
  - id: lehman2024a
    notes: >
      Formally names the member, designates its type section on Rattlesnake
      Mountain, and places it between the La Basa Sandstone and Rattlesnake
      Mountain Sandstone members. Source of the lithology.
  - id: beveridge2022a
    notes: >
      Dates the member under its earlier informal name, comparing the Last
      Chance Creek Member fauna of the Wahweap Formation with that of the
      "early Campanian Lower Shale Member of the Aguja Formation".
  - id: prieto-márquez2020a
    notes: >
      Calls it the "lower shale member" of the Aguja Formation and dates the
      vertebrate fauna in its middle "between 81 and 80 Ma (early Campanian)"
      from ammonites in the beds below and above.
  - id: waggoner2006a
