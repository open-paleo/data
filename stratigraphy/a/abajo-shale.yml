name: Abajo Shale
rank: member
parent: Aguja
period: [Late Cretaceous]
stages: [Campanian]
references:
  - id: lehman2024a
    notes: >
      The dedicated stratigraphy of the Campanian Aguja Formation of West
      Texas, which designates a type section for the member in the
      southwestern foothills of Rattlesnake Mountain. Dark gray and olive
      carbonaceous mudstone with lignite and coal near the base, recessive
      and slope-forming, 70 to nearly 100 m thick in the western outcrop belt
      and thinning eastward, and divisible into three units where thickest.
      It sits above the La Basa Sandstone Member and below the Rattlesnake
      Mountain Sandstone Member.
  - id: beveridge2022a
    notes: >
      Dates the member under its earlier informal name, comparing the Last
      Chance Creek Member fauna of the Wahweap Formation with that of the
      "early Campanian Lower Shale Member of the Aguja Formation".
  - id: prieto-márquez2020a
    notes: >
      Calls it the "lower shale member" of the Aguja Formation, its only
      significant vertebrate fossils in a concretionary interval in its
      middle, and dates that fauna "between 81 and 80 Ma (early Campanian)"
      from ammonites in the beds below and above: Scaphites hippocrepis III in
      the underlying Pen Formation and Baculites haresi in the overlying
      Rattlesnake Mountain and Terlingua Creek sandstone members, both after
      Waggoner (2006).
  - id: waggoner2006a
