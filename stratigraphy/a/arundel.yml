name: Arundel
rank: formation
parent: Potomac
period: [Early Cretaceous]
stages: [Hauterivian, Barremian, Aptian, Albian]
lithology: lignite and dark gray massive mudstone, with limonite and siderite
references:
  - id: carrano2024a
    notes: >
      Confirms Acrocanthosaurus in "the Arundel Clay (or Arundel Formation) of
      the Potomac Group", and gives its Dinosaur Park locality near Muirkirk,
      Maryland, as late Aptian.
  - id: d'emic2012c
    notes: >
      Records that the unit's age was long misread: the first North
      American sauropod came from it and "was originally thought to be
      Late Jurassic in age". The Late Jurassic is that superseded reading
      and does not date the unit.
  - id: hunt2018a
    notes: >
      Gives the age of its fauna as "the Early Cretaceous Arundel fauna
      (Albian-Aptian ...)", citing Ostrom (1970) and Kirkland and colleagues
      (1998, 2016).
  - id: ostrom1970a
    notes: >
      Finds by faunal comparison "a somewhat greater age for the Arundel and
      Wealden beds" than for the Cloverly, which it gives as "probably Late
      Aptian and Early Albian".
  - id: kirkland1998c
  - id: kirkland2016a
    notes: >
      About a different unit on another continent — the Cedar Mountain
      Formation of east-central Utah — and it never names this one. It gives no
      information on this unit.
  - id: farke2014a
    notes: >
      The unit's age is imprecisely known, but an early Albian age is "far
      more likely" than the Barremian–Aptian boundary age proposed by
      Chinnery-Allgeier and Kirkland (2010): "no data known to us place it
      anywhere near the Barremian–Aptian boundary". The neoceratopsian teeth
      from the Arundel Clay of Maryland are "believed to be early Albian".
  - id: hunt1994a
    notes: >
      Its two Pleurocoelus species, Pleurocoelus nanus and Pleurocoelus altus,
      are listed under "Arundel Fm." at stage "Haut/Bar" — Hauterivian to
      Barremian — in a global tabulation of Early Cretaceous sauropod
      occurrences.
  - id: chinnery-allgeier2010a
  - id: brownstein2017a
    notes: >
      Source of the lithology.
