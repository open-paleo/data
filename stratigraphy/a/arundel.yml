name: Arundel
rank: formation
period: [Late Jurassic, Early Cretaceous]
stages: [Hauterivian, Barremian, Aptian, Albian]
references:
  - id: carrano2024a
    notes: >
      Gives the rank duality and the setting: "The Arundel Clay (or Arundel
      Formation) of the Potomac Group crops out intermittently in Maryland and
      the District of Columbia, and may persist in the subsurface in
      Virginia", and confirms Acrocanthosaurus in it, a taxon that "ranged
      across North America during Aptian–Albian time". Places the Dinosaur
      Park locality near Muirkirk in the "Arundel Clay, late Aptian, Lower
      Cretaceous", its palynoflora supporting "a late Aptian age for the
      vertebrate-bearing layer".
  - id: d'emic2013a
    notes: >
      Records that the unit's age was long misread: the first North American
      sauropod came from it and "was originally thought to be Late Jurassic in
      age".
  - id: hunt2018a
    notes: >
      Gives the age of its fauna as "the Early Cretaceous Arundel fauna
      (Albian-Aptian", citing Ostrom (1970) and Kirkland and colleagues (1998,
      2016).
  - id: ostrom1970a
    notes: >
      Dates this unit only relative to another, and the comparison runs
      against the entry's youngest stage. Comparing the Cloverly fauna with
      those of "the Arundel Formation of Maryland", the Glen Rose and the
      Wealden, it finds "at least partial contemporaneity of the Cloverly and
      Glen Rose Formations and a somewhat greater age for the Arundel and
      Wealden beds", the Cloverly itself being "probably Late Aptian and
      Early Albian". So the Arundel is placed older than a unit that is late
      Aptian to early Albian, which is a bound by comparison rather than a
      determination.
  - id: kirkland1998c
  - id: kirkland2016a
    notes: >
      About a different unit on another continent - the Cedar Mountain
      Formation of east-central Utah - and it never names this one. It
      contributes nothing to the entry.
  - id: farke2014a
    notes: >
      The unit's age is imprecisely known, but an early Albian age is "far
      more likely" than the Barremian–Aptian boundary age proposed by
      Chinnery-Allgeier and Kirkland (2010): "no data known to us place it
      anywhere near the Barremian–Aptian boundary". The neoceratopsian teeth
      from the Arundel Clay of Maryland are "believed to be early Albian".
  - id: hunt1995a
    notes: >
      Its two Pleurocoelus species, Pleurocoelus nanus and Pleurocoelus altus,
      are listed under "Arundel Fm." at stage "Haut/Bar" — Hauterivian to
      Barremian — in a global tabulation of Early Cretaceous sauropod
      occurrences.
