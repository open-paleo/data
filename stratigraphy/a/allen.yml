name: Allen
rank: formation
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
references:
  - id: coria2012a
    notes: >
      Gives "Allen Formation, Late Campanian/Early Maastrichtian".
  - id: bandeira2024a
    notes: >
      Independently tabulates it as "Allen Formation | Campanian -
      Maastrichtian".
  - id: powell2003a
    notes: >
      Places the lower member, source of the Cinco Saltos and Lago Pellegrini
      titanosaurs, in the "Late Cretaceous, Early Maastrichtian", following
      Ballent (1980), and reports that Uliana and Dellape (1981) "have
      estimated for this formation a Campanian-Maastrichtian age".
  - id: uliana1981a
  - id: ballent1980a
    notes: >
      A brackish-water ostracod fauna from a whitish-gray fossiliferous
      limestone near Lago Pellegrini, immediately below about 10 m of
      saccharoidal gypsum: "The microfauna is assigned to the Upper Cretaceous
      (Lower Maastrichtian)." "For the present association from the uppermost
      part of the Allen Formation, an age of lower Maastrichtian is
      suggested."
