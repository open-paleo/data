name: Argiles et Grès à Reptiles
rank: formation
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
dispute:
  summary: >
    Tabuce and colleagues (2013) place the Aix-en-Provence Basin localities in
    "an argillite formation ... (historically named Lower 'Argiles et Grès à
    Reptiles' Formation or Lower 'Argiles Rutilantes' Formation) dated from
    the Lower Rognacian", and the Aix-en-Provence geological map notice
    (Catzigras and colleagues, 1969) divides this unit at the Calcaire de
    Rognac into lower and upper parts, the lower forming "the base of the
    Rognacian series". Díez Díaz and colleagues (2018) place the Velaux-La
    Bastide Neuve locality in the formation, while the papers describing its
    taxa (Garcia and colleagues, 2010; Godefroit and colleagues, 2017; Díez
    Díaz and colleagues, 2021) give it only the "'Begudian' (local stage)",
    the stage below the Rognacian; the notice makes the Bégudian-Rognacian
    boundary "imprecise" in "the eastern part of the Arc basin from Trets".
references:
  - id: díezdíaz2018a
    notes: >
      The one read source that states the formation: the Velaux-La Bastide
      Neuve locality "is considered to be upper Campanian (Argiles et Grès à
      Reptiles Formation, Aix-en-Provence Basin)".
  - id: tabuce2013a
    notes: >
      Pairs the lower part of this name with the Lower Argiles Rutilantes as
      historical names for one formation, dated by the Lower Rognacian.
  - id: poropat2021a
    notes: >
      Tabulates the Atsinganosaurus velauciensis specimens MMS/VBN.09.41 and
      MMS/VBN.09.167 under the formation with an age spanning the Campanian
      and Maastrichtian, citing Díez Díaz and colleagues (2018).
  - id: garcia2010a
    notes: >
      Names no formation, reaching the unit only through the locality. The Atsinganosaurus velauciensis type locality is
      "La Bastide Neuve, Velaux; Aix-en-Provence Basin, Bouches-du-Rhone,
      France", and the type horizon "Glauconitic grainstone limestone, Upper
      Campanian (Begudian continental local stage) based on charophytes ...
      and dinosaur eggshells according the local biostratigraphical
      context".
  - id: díezdíaz2021a
    notes: >
      Names no formation either. The Garrigatitan meridionalis type locality
      is "La Bastide Neuve, Velaux; Aix-en-Provence Basin, Bouches-du-Rhone,
      France" and the type horizon "'Begudian' (local stage) sandstones,
      upper Campanian, Upper Cretaceous", the holotype and paratype from
      "level B3 of sequence 2, and the referred material from level B2 of the
      same sequence".
  - id: godefroit2017a
    notes: >
      The third describing paper to give a local stage and no formation. The
      Matheronodon provincialis horizon and locality are "'Begudian' (local
      stage) sandstones, late Campanian, Late Cretaceous. Velaux-La Bastide
      Neuve, Aix-en-Provence Basin, Bouches-du-Rhone, southern France.
  - id: allain2000a
    notes: >
      Names neither a formation nor a local stage in its text, giving the
      Pyroraptor material as from "La Boucharde, two kilometres to the
      south-east of Trets, Bouches-du-Rhône" in "the Arc Basin", the horizon
      "Fluvio-lacustrine sandstones, Begudian (Upper Campanian to Lower
      Maastrichtian)". Trets lies in the eastern part of the Arc basin, where
      the Aix-en-Provence map notice makes the Bégudian-Rognacian boundary
      imprecise within the lower unit.
  - id: catzigras1969a
    notes: >
      Maps the unit in two parts either side of the Calcaire de Rognac: "Lower
      Clays and Sandstones with Reptiles (250 to 300 m). They form, north of
      Fuveau, the base of the Rognacian series. However, in the eastern part
      of the Arc basin from Trets ... the Bégudian-Rognacian boundary becomes
      imprecise in the monotonous series of red clays with sandy lenses", with
      Rhabdodon and Hypselosaurus near Rousset; then the "Rognac Limestones
      (30 m)"; then the "Upper Clays and Sandstones with Reptiles (100 m)",
      "formerly considered Eocene", with dinosaur eggs north of Rousset and at
      Roques Hautes.
