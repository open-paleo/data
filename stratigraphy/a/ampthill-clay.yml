name: Ampthill Clay
rank: formation
parent: Ancholme
period: [Late Jurassic]
stages: [Oxfordian]
references:
  - id: maidment2020a
    notes: >
      Gives the age directly, contrasting Sarcolestes leedsi from "the
      Callovian Oxford Clay Formation" with Cryptosaurus eumerus from "the
      Oxfordian Ampthill Clay Formation".
  - id: barron2012a
    notes: >
      Gives the containment: north of Oxford the marine mudstone succession
      above the Great Oolite Group "is divided in ascending order the
      Kellaways, Oxford Clay, West Walton, Ampthill Clay and Kimmeridge Clay
      formations, which are assembled into the ... Ancholme Group".
  - id: naish2007a
    notes: >
      Records it as dinosaur-bearing, "The overlying Ampthill Clay of the
      Midlands has also yielded dinosaurs".
