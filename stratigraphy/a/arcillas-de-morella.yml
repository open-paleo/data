name: Arcillas de Morella
rank: formation
period: [Early Cretaceous]
stages: [Barremian, Aptian]
references:
  - id: santos-cubedo2023a
    notes: >
      Gives "Arcillas de Morella Formation (late Barremian" and describes it
      as "a stratigraphic unit from the Lower Cretaceous (upper Barremian)".
  - id: mocho2023a
    notes: >
      Independently gives "Arcillas de Morella Formation (upper Barremian".
  - id: malafaia2020b
    notes: >
      Reports the earlier lower Aptian dating: the deposits "were interpreted
      as belonging to the lower Aptian based on geomagnetic polarity data" by
      Salas and colleagues (1995), but more recent ammonite, palynological and
      strontium isotope work "indicate that the Arcillas de Morella Fm. should
      be placed in the upper Barremian".
  - id: salas1995a
