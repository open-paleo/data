name: Alcobaça
rank: formation
period: [Late Jurassic]
stages: [Oxfordian, Kimmeridgian, Tithonian]
references:
  - id: schneider2009a
    notes: >
      Dates the unit twice and not consistently: "The Alcobaca formation can
      be placed in the latest Late Oxfordian to Late Kimmeridgian" in one
      place, and "the earliest Kimmeridgian to Early Tithonian Alcobaca
      formation" in another. One range ends where the other begins, so the
      paper supports the Oxfordian through Tithonian span without settling
      where inside it the unit sits.
  - id: mateus2017a
    notes: >
      Gives "the upper Kimmeridgian shallow-marine to deltaic Alcobaça
      Formation, which underlies the Lourinhã Formation", and treats the two
      as "the units that contain the most vertebrate remains" in the
      Lusitanian Basin.
