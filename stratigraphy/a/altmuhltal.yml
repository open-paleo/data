name: Altmühltal
rank: formation
period: [Late Jurassic]
stages: [Kimmeridgian, Tithonian]
references:
  - id: foth2025a
    notes: >
      Gives the age and the position in the Bavarian succession: Archaeopteryx
      "is only known from the lower Tithonian of Bavaria, Germany, with nine
      out of eleven specimens ... unearthed from the Altmühltal Formation",
      the Mörnsheim Formation overlies it, and the Painten Formation below it
      reaches the Kimmeridgian-Tithonian boundary.
  - id: pittman2020a
    notes: >
      Equates the formation with the traditional name, tabulating
      Archaeopteryx horizons as "Solnhofen Limestone (Altmühltal Formation)"
      and dating them 152.1 to 148 Ma; its table of European occurrences gives
      the same unit as "Late Jurassic" and "Tithonian". Entered under both
      names, since both are in use.
