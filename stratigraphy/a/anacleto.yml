name: Anacleto
rank: formation
parent: Neuquén
period: [Late Cretaceous]
stages: [Coniacian, Santonian, Campanian]
references:
  - id: santucci2022a
    notes: >
      Gives "Anacleto Formation (lower-middle Campanian)".
  - id: gianechini2015a
    notes: >
      Independently gives the "Upper Cretaceous (Anacleto Formation, lower
      Campanian)".
  - id: martinelli2004a
    notes: >
      Lists "Anacleto (Santonian; Neuquén Province ...)" among the Patagonian
      formations with carcharodontosaurid remains, citing Alcober and
      colleagues (1998).
  - id: alcober1998a
    notes: >
      A conference abstract, on a page carrying several, and it does not name
      this unit. It reports "Exposures of the Late Cretaceous (ca. Cenomanian)
      Rio Colorado Formation in Mendoza Province", so its age statement is
      qualified by "ca.", attaches to a unit at a rank above this one, and
      concerns Mendoza rather than Neuquen.
  - id: garrido2010a
    notes: >
      Paleomagnetic work at Auca Mahuevo has the formation's lower deposits in
      a reversed-polarity interval correlated with C33R (83.5 to 79.5 Ma) and
      its upper levels in a normal-polarity interval correlated with C33N
      (79.5 to 74.5 Ma), so that "the age of the Fm. Anacleto would be
      situated in the Lower to Middle Campanian". Legarreta and Gulisano
      (1989) had given these deposits an age between 83 and 80 Ma, "situated
      within the Early Campanian".
  - id: legarreta1989a
  - id: coria1996a
    notes: >
      An older reading, and at member rank: the type horizon of Gasparinisaura
      cincosaltensis at Cinco Saltos is "Rio Colorado Formation, Anacleto
      Member, Upper Cretaceous: Coniacian-Santonian", following Cruz and
      colleagues (1989), Legarreta and Gulisano (1989) and Bonaparte (1991).
  - id: cruz1989a
  - id: bonaparte1991a
  - id: hugo2001a
    notes: >
      Places the formation at the top of the Neuquén Group, in the Río Colorado
      Subgroup, following Ramos (1981), who raised to formations the members of
      Cazau and Uliana's (1973) Río Colorado Formation. Brackets its age between
      the Santonian that Bonaparte (1991) gave the underlying Bajo de la Carpa and
      an orogenic phase "fixed at 74 ± 3 Ma", so that it "cannot be younger than
      lower Campanian": "Therefore, the Anacleto Formation is assigned to the
      upper Santonian - lower Campanian" (translated). The type locality is
      Aguada de Anacleto, on the southwest slope of cerro Senillosa.
  - id: leanza2004a
    notes: >
      Calls it "the highest unit of the Neuquén Group", in the Río Colorado
      Subgroup, and gives its own age: it is "considered to be Early Campanian",
      citing Leanza (1999), Dingus and colleagues (2000) and Hugo and Leanza
      (2001a, b). The Santonian–Early Campanian it gives the subgroup covers the
      Bajo de la Carpa as well.
  - id: ramos1981a
  - id: cazau1973a
  - id: leanza1999a
  - id: dingus2000a
  - id: hugo2001b
