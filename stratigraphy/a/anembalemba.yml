name: Anembalemba
rank: member
parent: Maevarano
period: [Late Cretaceous]
stages: [Maastrichtian]
lithology: fine- to coarse-grained clay-rich sandstone
references:
  - id: krause2007a
    notes: >
      Gives the member as 10 to 15 m thick and the source of the vast majority
      of Majungasaurus crenatissimus specimens, with some isolated teeth from
      the other two members.
  - id: rogers2000a
    notes: >
      Erects the member and dates it Maastrichtian, "rather than Campanian as
      previously reported", by correlating it with the foraminifera-dated
      Berivotra Formation. Source of the lithology.
  - id: carrano2008a
    notes: >
      Hedges the older bound, "Anembalemba Member, Maevarano Formation; ?upper
      Campanian-Maastrichtian, Late Cretaceous".
  - id: carrano2012a
    notes: >
      Gives the narrower "Anembalemba Member, Maevarano Formation;
      Maastrichtian".
