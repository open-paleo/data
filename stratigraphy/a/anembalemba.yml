name: Anembalemba
rank: member
parent: Maevarano
period: [Late Cretaceous]
stages: [Maastrichtian]
references:
  - id: krause2007a
    notes: >
      The member is 10 to 15 m thick and yielded the vast majority of the
      Majungasaurus crenatissimus specimens collected by the Mahajanga Basin
      Project, though "some specimens (primarily isolated teeth) were also
      found in the Mesorobe and Miadana members". It "preserves sediments
      deposited during flooding events between crystalline highlands to the
      east and the Mozambique Channel to the west in a lowland floodplain
      setting reflective of a highly seasonal, semiarid climate".
  - id: rogers2000a
    notes: >
      The revision the age rests on. The member is dated by correlation
      rather than by fossils of its own: "Regional thickness trends further
      suggest that exposures of the Anembalemba Member in the Berivotra field
      area correlate with exposures of the Berivotra Formation to the north",
      and planktonic foraminifera show "exposures of the formation in the
      Berivotra region are late Maastrichtian in age". On that basis "the
      most fossiliferous portions of the Maevarano Formation are Maastrichtian
      in age, rather than Campanian as previously reported", which is the
      reading the Campanian of earlier work predates.
  - id: carrano2008a
    notes: >
      Hedges the older bound, "Anembalemba Member, Maevarano Formation; ?upper
      Campanian-Maastrichtian, Late Cretaceous".
  - id: carrano2012a
    notes: >
      Gives the narrower "Anembalemba Member, Maevarano Formation;
      Maastrichtian".
