name: Argiles Rutilantes
rank: formation
period: [Late Cretaceous]
stages: [Campanian]
dispute:
  summary: >
    This name and "Argiles et Grès à Reptiles" may be two names for one unit.
    Tabuce and colleagues (2013) describe the Aix-en-Provence Basin
    localities as sitting in "an argillite formation characterized by
    fluviatile deposits and lacustrine beds (historically named Lower
    'Argiles et Grès à Reptiles' Formation or Lower 'Argiles Rutilantes'
    Formation) dated from the Lower Rognacian, a local continental stage",
    and add that the Rognacian "has been equivocally proposed to be
    equivalent to the late Campanian-Maastrichtian period". Whether the two
    historical names denote one unit or two is not settled by the sources
    read.
references:
  - id: tortosa2014a
    notes: >
      "Lower Argiles Rutilantes Formation, upper part of the Lower Rognacian,
      Late Campanian" for the Jas Neuf Sud locality near Pourrières, Var.
  - id: tabuce2013a
    notes: >
      Treats the name as one of two historical names for the same argillite
      formation, and dates it by the Lower Rognacian local stage rather than
      by an international one.
