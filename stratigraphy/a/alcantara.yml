name: Alcântara
rank: formation
period: [Late Cretaceous]
stages: [Cenomanian]
references:
  - id: kellner2011b
    notes: >
      The Laje do Coringa rocks on Cajual Island, which yielded the Oxalaia
      holotype, "belong to the Alcântara Formation, Itapecuru Group of the São
      Luís Basin whose age is regarded as Cenomanian (Late Cretaceous)", on
      Góes and Rossetti's authority. The paper's title carries the same date,
      "the Cretaceous (Cenomanian) Alcântara Formation".
  - id: bittencourt2011a
    notes: >
      Within the Itapecuru Group the Alcântara Formation was "deposited during
      the early Cenomanian in an estuarine environment", while the Albian
      belongs to the "Undifferentiated Unit" beneath it and the unit above
      runs from the Late Cretaceous into the Paleocene. Bittencourt and Langer
      follow Rossetti here, and treat the informal "Itapecuru Formation" of
      the Itapecuru-Mirim region as roughly the same rocks as that
      Undifferentiated Unit, which matters because the two are the source of
      the formation's dinosaur records at Ilha do Cajual and Praia da Baronesa
      on the one hand and Coroatá and Mata on the other.
  - id: lindoso2019a
    notes: >
      The type horizon of Itapeuasaurus cajapioensis is the "Alcântara
      Formation, São Luís Basin, lower Upper Cretaceous (Cenomanian)", and the
      Laje do Coringa bone bed at Cajual Island "records the Alcântara
      Formation (lower Cenomanian)". Lindoso and colleagues keep the Albian
      for the underlying Itapecuru Formation and the undifferentiated unit,
      which they call lower-middle Albian.
  - id: sales2017a
    notes: >
      Gives "the Alcântara Formation (Cenomanian, São Luís-Grajaú Basin)" and
      says what the age rests on: "due to its macrofossil and palynological
      content, the Alcântara Formation is usually regarded as the Cenomanian
      strata" of that basin.
  - id: bandeira2024a
    notes: >
      Tabulates it as "Albian - Cenomanian".
