name: Alemoa
rank: member
parent: Santa Maria
period: [Late Triassic]
stages: [Carnian]
lithology: red laminated to massive mudstone and fine to conglomeratic sandstone
references:
  - id: marsola2018a
    notes: >
      Describes Nhandumirim waldsangae from "the upper levels of the Alemoa
      Member" at Cerro da Alemoa, 1 to 1.5 m below the Caturrita Formation, and
      dates the site's fauna as late Carnian.
  - id: darosa2005a
    notes: >
      Maps post-depositional faulting in central Rio Grande do Sul by the offset
      of the member's contact with the overlying Caturrita Formation, about 90 m
      across the Vacacaí Mirim lineament.
  - id: langer2018a
    notes: >
      Describes the type section at Cerro da Alemoa, 20 m of massive reddish
      mudstones, and dates mudstone 5 m below the top of the member to a maximum
      depositional age of 233.23 Ma.
  - id: bittencourt2009a
    notes: >
      Gives "Alemoa Member of the Santa Maria Formation (Carnian ...)". Source
      of the lithology.
  - id: cabreira2016a
    notes: >
      Places it in its wider framework: "Alemoa Member, Santa Maria Formation;
      Candelária Sequence, Paraná Basin ...; Hyperodapedon Assemblage Zone,
      Carnian, Late Triassic".
  - id: andreis1980a
    notes: >
      Cited by Langer and colleagues (2018) for Cerro da Alemoa as the type
      section of the Alemoa Member.
  - id: philipp2013a
    notes: >
      A conference abstract. Thirteen detrital zircons from a siltstone of the
      member give a U-Pb age of 236 ± 3.5 Ma, which the authors take as the
      best indication of when the beds were deposited; for detrital grains the
      figure is a maximum depositional age.
  - id: colbert1970a
    notes: >
      Places Staurikosaurus in the fossiliferous zone of the Santa Maria
      Formation at Alemõa, without naming the member, and suggests a Carnian age
      for its fauna.
