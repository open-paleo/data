name: Alemoa
rank: member
parent: Santa Maria
period: [Late Triassic]
stages: [Carnian]
references:
  - id: marsola2018a
    notes: >
      Nhandumirim waldsangae comes from "the upper levels of the Alemoa Member
      of the Santa Maria Formation, 1-1.5 m below the contact with the
      overlying Caturrita Formation" at the Waldsanga, or Cerro da Alemoa,
      site in urban Santa Maria. Following da Rosa, Marsola and colleagues
      describe the member as exposed there in lower, intermediate and upper
      levels, the first two distal floodplain deposits and the third a
      proximal floodplain, and relate the site to the Hyperodapedon Assemblage
      Zone of the Candelária Sequence on the strength of its rhynchosaurs.
      Correlation with the Ischigualasto Formation makes that zone "late
      Carnian in age", an age they see corroborated by detrital dating of the
      mudstones at the Saturnalia tupiniquim level, "which has yielded a
      maximum age of ca. 233 Ma".
  - id: darosa2005a
    notes: >
      Pelites of the Alemoa Member are one of the two Mesozoic units da Rosa
      and Faccini use to map post-depositional faulting across central Rio
      Grande do Sul, and the contact they trace with the overlying Caturrita
      Formation shifts from one structural block to the next: about 90 m
      across the Vacacaí Mirim lineament, where it sits at 120 m northeast of
      Santa Maria and at 210 m in the São João do Polêsine block, and at least
      20 m across the Rio Botucaraí lineament. They caution that "The
      determination of the contact between the Alemoa Member and the Caturrita
      Formation is not secure, due to its recurrent character", and in the
      Candelária region they record the member carrying the Therapsida
      Cenozone at Sanga de Pinheiros and the Rhynchosauria Cenozone in the
      Cipriano region. The paper dates the deposits it maps only as Middle to
      Late Triassic, taking the Rosário do Sul Group as a whole.
  - id: langer2018a
    notes: >
      Cerro da Alemoa, in the eastern outskirts of Santa Maria, is "the
      type-section of the Alemoa Member of the Santa Maria Formation (Andreis
      et al., 1980), with a 20 meters-thick sequence of massive reddish
      mudstones, intercalated with fine sandstones", its most distinctive
      feature the calcareous concretions that locally form crusts of
      restricted lateral extent. Langer and colleagues sampled that section
      for U-Pb geochronology, from material that "represents the typical
      Alemoa Member mudstone and comes from 5 m below its top", and report the
      resulting 233.23 Ma weighted mean as a maximum depositional age for the
      Santa Maria Formation at the site; fossils in the upper 10 m are better
      preserved than those below, which calcitic cementation has distorted.
  - id: bittencourt2009a
    notes: >
      Gives "Alemoa Member of the Santa Maria Formation (Carnian".
  - id: cabreira2016a
    notes: >
      Places it in its wider framework: "Alemoa Member, Santa Maria Formation;
      Candelária Sequence, Paraná Basin ...; Hyperodapedon Assemblage Zone,
      Carnian, Late Triassic".
