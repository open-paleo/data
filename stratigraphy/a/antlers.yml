name: Antlers
rank: formation
parent: Trinity
period: [Early Cretaceous]
stages: [Aptian, Albian]
description: "The Antlers Formation is a stratum which ranges from Arkansas through southern Oklahoma into northeastern Texas. The stratum is 150 m (490 ft) thick consisting of silty to sandy mudstone and fine to coarse grained sandstone that is poorly to moderately sorted. Based on correlation with the Trinity Group of Texas, the Antlers Formation is estimated to be late Aptian-early Albian. This age range is supported by the presence of two dinosaurs that are also known from the Cloverly Formation, Deinonychus and Tenontosaurus."
references:
  - id: d'emic2012a
    notes: >
      Gives "Antlers Formation (Lower Cretaceous, Aptian-Albian)". D'Emic
      (2012) records that it is laterally equivalent to the Twin Mountains
      Formation.
  - id: suarez2021a
    notes: >
      Places it within its group by state: in Oklahoma and adjacent Texas the
      Trinity Group "consists almost entirely of the Antlers Formation,
      although the Holly Creek Formation is present in extreme southeast
      McCurtain County".
  - id: d'emic2012c
    notes: >
      Gives the Sauroposeidon holotype horizon as "Early Cretaceous
      (Aptian–Albian) Antlers Formation of southern Oklahoma, USA", and
      describes the unit as "a lateral equivalent of the Trinity Group of
      Texas".
