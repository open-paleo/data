name: Antlers
rank: formation
parent: Trinity
period: [Early Cretaceous]
stages: [Aptian, Albian]
references:
  - id: d'emic2012a
    notes: >
      Gives "Antlers Formation (Lower Cretaceous, Aptian-Albian". D'Emic
      (2013) records that it is laterally equivalent to the Twin Mountains
      Formation.
  - id: suarez2021a
    notes: >
      Places it within its group by state: in Oklahoma and adjacent Texas the
      Trinity Group "consists almost entirely of the Antlers Formation,
      although the Holly Creek Formation is present in extreme southeast
      McCurtain County".
  - id: d'emic2013a
    notes: >
      Gives the Sauroposeidon holotype horizon as "Early Cretaceous
      (Aptian–Albian) Antlers Formation of southern Oklahoma, USA", and
      describes the unit as "a lateral equivalent of the Trinity Group of
      Texas".
