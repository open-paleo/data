name: Ambolafotsy
rank: formation
informal: true
period: [Late Cretaceous]
stages: [Turonian]
references:
  - id: farke2013a
    notes: >
      Names the unit and marks it informal: the section containing the
      Dahalokely site "is informally termed the ''Ambolafotsy Formation,''
      and is divided into lower, middle ... and upper units". Turonian, near
      Ampandriambengy in the Diego (Ambilobe) Basin of northernmost
      Madagascar, and dated by the marine deposits that bracket it rather
      than by fossils of its own.
  - id: rauhut2016b
    notes: >
      Independently calls it "the informally termed 'Ambolafotsy Formation'
      (Turonian) of northern Madagascar".
