name: Ambolafotsy
rank: formation
informal: true
period: [Late Cretaceous]
stages: [Turonian]
references:
  - id: farke2013a
    notes: >
      Names the unit and marks it informal: the section containing the
      Dahalokely site "is informally termed the 'Ambolafotsy Formation,'
      and is divided into lower, middle ... and upper units". Turonian, near
      Ampandriambengy in the Diego (Ambilobe) Basin of northernmost
      Madagascar. Only the middle unit, which holds the Dahalokely site, lacks
      age-diagnostic fossils and is dated by the units that bracket it; the
      lower and upper units are dated by their own marine microfossils and
      ammonites.
  - id: rauhut2016b
    notes: >
      Independently calls it "the informally termed 'Ambolafotsy Formation'
      (Turonian) of northern Madagascar".
  - id: randrianasolo1989a
    notes: >
      Divides the Ambolafotsy into lower, middle and upper formations, all
      Turonian; the middle one, "containing no fossils of stratigraphic value",
      is dated by the beds that bracket it.
