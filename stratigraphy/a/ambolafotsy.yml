name: Ambolafotsy
rank: formation
informal: true
period: [Late Cretaceous]
stages: [Turonian]
references:
  - id: farke2013a
    notes: >
      Names the unit and marks it informal: the section containing the
      Dahalokely site "is informally termed the ''Ambolafotsy Formation,''
      and is divided into lower, middle ... and upper units". Turonian, near
      Ampandriambengy in the Diego (Ambilobe) Basin of northernmost
      Madagascar, and dated by the marine deposits that bracket it rather
      than by fossils of its own.
  - id: rauhut2016b
    notes: >
      Independently calls it "the informally termed 'Ambolafotsy Formation'
      (Turonian) of northern Madagascar".
  - id: randrianasolo1989a
    notes: >
      Divides the Ambolafotsy into three formations, each with its own
      members, where Farke and Sertich (2013) treat the section as one
      informal formation in three units. Planktonic foraminifera date "the
      marls of the lower Ambolafotsy" to the Lower Turonian and the upper
      Ambolafotsy to the Middle and Upper Turonian; the middle Ambolafotsy,
      "containing no fossils of stratigraphic value", is "dated by the marls
      of the lower Ambolafotsy and the sandstones of the upper Ambolafotsy
      that bracket it" and "corresponds to a large part of the middle
      Turonian".
