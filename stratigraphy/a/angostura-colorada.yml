name: Angostura Colorada
rank: formation
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
references:
  - id: leanza2004a
    notes: >
      Leanza and colleagues place the Angostura Colorada Formation among "the
      equivalent units in north-eastern Patagonia" and admit its taxa to their
      Allenian tetrapod assemblage because it and the Los Alamitos Formation
      "represent similar environments, age and faunas" as the Allen Formation,
      the Neuquén Basin's own carrier of that assemblage. From it they list
      Aeolosaurus sp. and related titanosaurs, and hadrosaurids including
      Kritosaurus australis, common at Laguna Carri-Laufquen; they also report
      Hugo and Leanza's (2001a) correlation of the basal member of the Allen
      Formation with this unit. The Late Campanian-Early Maastrichtian age
      they print is the Allenian assemblage's and covers five formations at
      once, and they warn that "tetrapod assemblages cannot be used in order
      to determine the age of a certain stratigraphic unit".
  - id: santucci2022a
    notes: >
      Gives "Angostura Colorada Formation (Upper Cretaceous, late
      Campanian-early Maastrichtian)" for the Aeolosaurus rionegrinus type at
      Casa de Piedra, Estancia Maquinchao, Río Negro.
  - id: powell2003a
    notes: >
      Gives the same horizon for that type as "Late Cretaceous, Late
      Senonian", and for other Río Negro localities "Senonian probably
      Campanian-Maastrichtian", noting that one fossiliferous level has also
      been read as the Coli Toro Formation.
