name: Altmühltal
rank: formation
period: [Late Jurassic]
stages: [Kimmeridgian, Tithonian]
variants: [Solnhofen Lithographic Limestone, Solnhofen Limestone, Solnhofen Formation]
lithology: lithographic plate limestone (plattenkalk) over bioturbated shale
references:
  - id: foth2025a
    notes: >
      Places nine of the eleven Archaeopteryx specimens in the formation and
      dates it by ammonites from the latest Kimmeridgian to the early Tithonian,
      below the Mörnsheim Formation.
  - id: ding2020a
    notes: >
      Equates the formation with the traditional name, tabulating
      Archaeopteryx horizons as "Solnhofen Limestone (Altmühltal Formation)"
      and dating them 152.1 to 148 Ma.
  - id: pittman2020c
    notes: >
      A table of European occurrences gives the same unit as "Late Jurassic"
      and "Tithonian".
  - id: niebuhr2014a
    notes: >
      Erects the formation for the plattenkalks formerly called the "Solnhofener
      Schichten" and dates it by ammonites from the uppermost Kimmeridgian to
      the lower Tithonian. Source of the lithology.
  - id: schweigert2007a
