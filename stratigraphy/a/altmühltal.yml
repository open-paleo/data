name: Altmühltal
rank: formation
period: [Late Jurassic]
stages: [Kimmeridgian, Tithonian]
variants: [Solnhofen Lithographic Limestone, Solnhofen Limestone, Solnhofen Formation]
lithology: lithographic plate limestone (plattenkalk) over bioturbated shale
references:
  - id: foth2025a
    notes: >
      Gives the age and the position in the Bavarian succession: Archaeopteryx
      "is only known from the lower Tithonian of Bavaria, Germany, with nine
      out of eleven specimens ... unearthed from the Altmühltal Formation",
      the Mörnsheim Formation overlies it, and the Painten Formation below it
      reaches the Kimmeridgian-Tithonian boundary. The "Solnhofen limestone"
      sensu stricto "is part of the Altmühltal Formation and restricted to the
      area northwest of Ingolstadt, whereas the contemporaneous plattenkalks
      more to the east belong to the Painten Formation".
  - id: ding2020a
    notes: >
      Equates the formation with the traditional name, tabulating
      Archaeopteryx horizons as "Solnhofen Limestone (Altmühltal Formation)"
      and dating them 152.1 to 148 Ma.
  - id: pittman2020c
    notes: >
      A table of European occurrences gives the same unit as "Late Jurassic"
      and "Tithonian".
  - id: niebuhr2014a
    notes: >
      Erects the formation for "the typical lithographic plattenkalks of the
      western Southern Franconian Alb, which formerly has been termed
      'Solnhofener Schichten'". Gives it as "Upper Kimmeridgian, Lower
      Tithonian", by ammonites "the uppermost Upper Kimmeridgian (uppermost
      beckeri zone) to lower Lower Tithonian (middle hybonotum zone)", and after
      Schweigert (2007) holds that "the plate limestones of Solnhofen,
      Eichstätt, and Pfalzpaint ... are not contemporaneous". "40-90 m at
      Solnhofen". Source of the lithology.
  - id: schweigert2007a
