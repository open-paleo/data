name: Andakhuduk
rank: formation
variants: [Andaikhudag, Andakhudag]
period: [Early Cretaceous]
stages: [Hauterivian, Barremian, Aptian]
references:
  - id: khand2000a
    notes: >
      "This fossil assemblage suggests the Hauterivian-Barremian age" for the
      150-700 m of bituminous paper shale, siltstone and aleurite, which the
      paper equates with the "Ondai Sayr by Berkey and Morris" (1927) and
      places above the Undurukhaa Formation and below the Khulsangol. Sinitsa
      (1993) is reported as referring the same formation in seven Valley of
      Lakes depressions to the Upper Jurassic, an assignment the authors
      neither adopt nor reject.
  - id: napoli2019a
    notes: >
      Gives the assignment and the age for the Ondai Sayr locality in the
      Tsaagan Nor basin of central Mongolia, which "has also been considered
      the Andakhuduk Formation", the age "generally considered to be
      Barremian".
  - id: jerzykiewicz1991a
    notes: >
      Characterizes it as the offshore lacustrine facies of the Gobi Basin,
      beneath the Khulsyngol (or Dushilin) Formation. Weighs two datings and
      takes the younger: "Although abundant molluscan and ostracod fossils
      have been cited as evidence of a Barremian to Hauterivian age ..., an
      Aptian age, suggested by similarities in plant megafossils to dated
      remains in eastern Siberia ..., is accepted here."
