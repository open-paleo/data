name: Andakhuduk
rank: formation
variants: [Andaikhudag, Andakhudag, Ondai Sair, Ondai Sayr]
lithology: bituminous paper shale, dark coal-bearing mudstone and sandstone,
  with sporadic limestone and marl
period: [Late Jurassic, Early Cretaceous]
stages: [Hauterivian, Barremian]
dispute:
  summary: >
    Sinitsa (1993) dates the formation Late Jurassic, from its ostracods,
    chiefly Cypridea unicostata, which he places in a Late Jurassic zone, and
    from its correlation with the Dund-Argalant Series and the Turga series of
    Transbaikalia. Khand and colleagues (2000) date it Hauterivian–Barremian
    from its fossil assemblage.
references:
  - id: khand2000a
    notes: >
      Describes the Andaikhudag ("= Ondai Sayr") between the Undurukhaa and
      Khulsangol formations and dates it to the Hauterivian–Barremian on its
      fossil assemblage, in a chapter that summarizes published data.
  - id: napoli2019a
    notes: >
      Gives the assignment and the age for the Ondai Sayr locality in the
      Tsaagan Nor basin of central Mongolia, which "has also been considered
      the Andakhuduk Formation", the age "generally considered to be
      Barremian", crediting Jerzykiewicz and Russell (1991), who report a
      Barremian–Hauterivian age only as an earlier view and accept an Aptian
      one.
  - id: jerzykiewicz1991a
    notes: >
      Treats it as the offshore lacustrine facies of the Gobi Basin, beneath the
      Khulsyngol (or Dushilin) Formation, and accepts the Aptian that Krassilov
      (1982) gives from plant megafossils. Source of the lithology.
  - id: sinitsa1993a
    notes: >
      Dates the formation Late Jurassic in its own voice, from its ostracods,
      chiefly Cypridea unicostata, which it places in a Late Jurassic zone,
      and from correlation with the Dund-Argalant and Transbaikalian Turga
      series.
  - id: krassilov1982a
  - id: berkey1927a
    notes: >
      Names "The Ondai Sair formation", with its type locality "the reëntrant
      of sediment on the east side of the Mount Uskuk block", of "gray
      sandstones and dark paper-shales, with a few beds of red sandy clay".
