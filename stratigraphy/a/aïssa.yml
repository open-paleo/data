name: Aïssa
rank: formation
period: [Middle Jurassic, Late Jurassic]
stages: [Bajocian, Bathonian, Callovian, Oxfordian, Kimmeridgian, Tithonian]
dispute:
  summary: >
    Kacemi and colleagues (2026) attribute the formation "by regional
    correlation" to "the Late Jurassic (Kimmeridgian-Portlandian)", yet find
    in its lower member, the Member of the Rouis el Djir Alternations,
    Lophinae ostracods "characteristic of the Middle Jurassic (Bajocian to
    Callovian)", and give the dinosaur and crocodilian biotope of that member
    as "the Callovian-Kimmeridgian"; the Chebsaurus bones come from the same
    member. Benddine and Benaouda (2022) weigh the same ostracods against the
    eastern sections and find "the Kimmeridgian age is much more probable".
    Under the earlier unit-by-unit scheme of Kacemi (2005) the formation is
    Kimmeridgian-Portlandian and starts at unit 12, with the Lower Bathonian
    to Callovian-Oxfordian below it in the Djara Formation, while Mannion and
    colleagues (2019) and Läng and Mahammed (2010) date Chebsaurus Callovian
    and Middle Jurassic respectively.
references:
  - id: amar-bekada2023a
    notes: >
      Places the Aïssa Formation in the Malm at "Kimmeridgian-Portlandian",
      with its lower member Kimmeridgian, "upper Jurassic", and its upper
      member Portlandian, while the Callovian-Oxfordian sits in the Djara
      Formation beneath it. The formation is about 625 m thick at Djebel
      Djeraouine, a regressive megasequence of deltaic sequences that builds
      the great anticlines of Djebel Aïssa and Djebel Mekther, and it is
      overlain by the Tiloula Formation. The section introducing the Malm is
      looser, calling it Oxfordian, Kimmeridgian and Portlandian and
      "represented largely by the Formation of Aissa". Hesselbo and colleagues
      (2020) record that the base of the Tithonian "corresponded closely with
      the boundary between the 'Portlandian' and Kimmeridgian Stages", so the
      Portlandian member is Tithonian in international stages.
  - id: kacemi2005a
  - id: mannion2019a
    notes: >
      Gives "the Callovian Aïssa Formation of Algeria" for Chebsaurus.
  - id: läng2010a
    notes: >
      Gives the coarser reading, "the Middle Jurassic Aïssa formation of the
      Naama Province, Algeria", for further material of the same taxon. For
      the Chebsaurus site itself it lists past datings of "'indeterminate
      Dogger'", Bathonian, Callovian "or Oxfordian to Portlandian", and,
      granting that "it is not so easy to determine clearly the age", supposes
      after Kacemi (2005) that Chebsaurus "should be dated from the
      Callovian".
  - id: hesselbo2020a
  - id: kacemi2026a
    notes: >
      Treats the formation as Upper Jurassic, attributing it "by regional
      correlation" to "the Late Jurassic (Kimmeridgian-Portlandian)", but
      reports Lophinae ostracods in its lower member, the Member of the Rouis
      el Djir Alternations, "characteristic of the Middle Jurassic (Bajocian
      to Callovian)", which is the source of the entry's Bajocian. The Djara
      Formation lies beneath it in the Larouia-Aourak-Oum El Arar syncline,
      and it was "in the Aïssa Formation that the remains of the Ksour
      dinosaur (Chebsaurus) were discovered in 2001".
  - id: benddine2022a
    notes: >
      A master's thesis supervised by Kacemi, so not independent of Kacemi and
      colleagues (2026). Puts the Chebsaurus level in unit 3 of the
      "Alternances de Rouis El Djir" (Aïssa Formation), levels 73 to 78, and
      holds that the Lophinae point to the Middle Jurassic but "the
      Kimmeridgian age is much more probable, if we refer to the 'Aïssa
      Formation' of the eastern region".
