name: Assenta
rank: member
parent: Lourinhã
period: [Late Jurassic, Early Cretaceous]
stages: [Tithonian, Berriasian]
references:
  - id: mateus2017a
    notes: >
      Names it as one of the upper members of the Lourinhã Formation and
      contrasts it with the Santa Rita Member to the northwest, a meandering
      fluvial system "with intercalations of shallow-marine lagoonal"
      carbonates exposed at the top of the section at Porto da Calada.
      Proposes "a late early Tithonian to earlier Berriasian age" for the
      member and, from the tentative magnetostratigraphy of Salminen and
      colleagues (2013), puts the Tithonian–Berriasian boundary near its top
      at Porto da Calada, so that "the last few meters of the Assenta Mb. can
      be considered as earliest Berriasian".
  - id: russo2021a
    notes: >
      Places it at "the uppermost part of the Lourinhã Formation" and gives
      an "uppermost lower Tithonian-upper Tithonian age".
  - id: rotatori2022a
    notes: >
      Records the lateral equivalence: in the Turcifal sub-basin "the only
      member outcropping is the Assenta Member, which is laterally equivalent
      to the Santa Rita Member", the Lourinhã elsewhere carrying the Porto
      Novo/Praia da Amoreira, Praia Azul and Santa Rita Members.
  - id: salminen2013a
    notes: >
      Dates this member directly by magnetostratigraphy, and ends at the
      Tithonian: "At the Porto da Calada section, the Assenta member of the
      Lourinha Formation is Tithonian in age", with the parent given as
      "Kimmeridgian-Tithonian in age". So it supports the Tithonian and not
      the Berriasian, which rests on the entry's other references.
