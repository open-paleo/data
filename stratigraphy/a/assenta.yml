name: Assenta
rank: member
parent: Lourinhã
period: [Late Jurassic, Early Cretaceous]
stages: [Tithonian, Berriasian]
description: "One of the most recent stratigraphies divides the formation into three members, from oldest to youngest: the Praia da Amoreira-Porto Novo Member, Praia Azul Member, and the Assenta Member. The Santa Rita Member in the Consolação sub-basin and its lateral equivalent in the Turcifal Basin, the Assenta Member, is around 300 m (980 ft) thick and predominantly consists of mudstones with frequent layers of caliche. The environment of deposition is interpreted as being an upper fluvial-dominated delta to meandering fluvial systems flowing on a paralic plain. The Assenta Member is thought to represent the upper delta-plain and fluvial domain of the Praia Azul Member."
references:
  - id: mateus2017a
    notes: >
      Names it as one of the upper members of the Lourinhã Formation and
      contrasts it with the Santa Rita Member to the northwest, a meandering
      fluvial system "with intercalations of shallow-marine lagoonal"
      carbonates exposed at the top of the section at Porto da Calada.
      Proposes "a late early Tithonian to earlier Berriasian age" for the
      member and, from the tentative magnetostratigraphy of Salminen and
      colleagues (2014), puts the Tithonian–Berriasian boundary near its top
      at Porto da Calada, so that "the last few meters of the Assenta Mb. can
      be considered as earliest Berriasian".
  - id: russo2021a
    notes: >
      Places it at "the uppermost part of the Lourinhã Formation" and gives
      an "uppermost lower Tithonian-upper Tithonian age".
  - id: rotatori2022a
    notes: >
      Records the lateral equivalence: in the Turcifal sub-basin "the only
      member outcropping is the Assenta Member, which is laterally equivalent
      to the Santa Rita Member", the Lourinhã elsewhere carrying the Porto
      Novo/Praia da Amoreira, Praia Azul and Santa Rita Members.
  - id: salminen2014a
    notes: >
      Dates this member directly by magnetostratigraphy, and ends at the
      Tithonian: "At the Porto da Calada section, the Assenta member of the
      Lourinha Formation is Tithonian in age", with the parent given as
      "Kimmeridgian-Tithonian in age". So it supports the Tithonian and not
      the Berriasian, which Mateus and colleagues (2017) propose.
  - id: hill1989a
    notes: >
      Names the "Assenta member" of an informal Lourinhã formation, one of its
      younger members, fluvial and "fine grained" beside the coarse Santa Rita
      member, and confined largely to south of Santa Cruz and the Torres
      Vedras–Montejunto high. Its Fig. 2 draws the member in the Tithonian,
      above the Praia Azul tongue.
