name: Agua de la Peña
rank: group
period: [Middle Triassic, Late Triassic, Early Jurassic]
stages: [Ladinian, Carnian, Norian, Rhaetian]
dispute:
  summary: >
    Shubin and Sues (1991) found the Los Colorados Formation's tetrapod
    assemblage "weakly clustered with those from the Early Jurassic", and left
    open whether it is an intermediate fauna or a sample mixing Late Triassic
    and Early Jurassic beds. Caselli and colleagues (2001) treat the group as
    a whole, give the Los Colorados as Late Triassic and map the Lower
    Jurassic Baldecitos Formation outside the group.
references:
  - id: caselli2001a
    notes: >
      Treats the group as a whole and gives its composition. The basin fill is
      grouped into the Talampaya and Tarjados formations "and the Agua de la
      Peña Group (Bossi 1971), within which the Los Colorados Formation
      represents the upper terms of the succession", deposited as continental
      sediments during the Middle to Late Triassic. The geological map
      brackets the Los Rastros, Chañares and Ischigualasto formations,
      assigned to the Middle Triassic, with the Los Colorados, assigned to
      the Upper Triassic, as the group, and places the Lower Jurassic
      Baldecitos Formation above and outside it. The Ischigualasto's Middle
      Triassic assignment there is older than the Carnian reading its own
      entry carries.
  - id: ezcurra2010a
    notes: >
      The Ischigualasto Formation crops out in the San Juan and La Rioja
      provinces of northwestern Argentina "as part of the Agua de la Peña
      Group of the Ischigualasto-Villa Unión Basin", a containment credited to
      Bossi (1971), and lies between the Los Rastros Formation below and the
      Los Colorados Formation above. A locality map of the group's
      southeastern outcrop covers both provinces.
  - id: arcucci2003a
    notes: >
      Places the Los Colorados Formation as "the upper part of the Agua de la
      Peña Group in the Ischigualasto-Villa Union Basin in western
      Argentina".
  - id: ezcurra2007b
    notes: >
      Gives the same containment for the Zupaysaurus horizon, "Los Colorados
      Formation (Norian ...), Agua de la Peña Group (La Esquina Fauna), in
      the Ischigualasto-Villa Unión Basin".
