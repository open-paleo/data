name: Agua de la Peña
rank: group
period: [Middle Triassic, Late Triassic]
stages: [Ladinian, Carnian, Norian]
references:
  - id: caselli2001a
    notes: >
      Groups the Los Rastros, Chañares, Ischigualasto and Los Colorados
      formations as the group, the Los Colorados forming "the upper terms of the
      succession" (translated).
  - id: ezcurra2010a
    notes: >
      Places the Ischigualasto Formation in the group, between "the Los Rastros
      Fm. (Ladinian-early Carnian) below and the Los Colorados Fm. (Norian)
      above".
  - id: arcucci2003a
    notes: >
      Places the Los Colorados Formation as "the upper part of the Agua de la
      Peña Group in the Ischigualasto-Villa Union Basin in western
      Argentina".
  - id: ezcurra2007b
    notes: >
      Gives the same containment for the Zupaysaurus horizon, "Los Colorados
      Formation (Norian ...), Agua de la Peña Group (La Esquina Fauna), in
      the Ischigualasto-Villa Unión Basin".
  - id: bossi1971a
  - id: shipman2004a
    notes: >
      Gives the group's age and membership: "the Middle to Late Triassic Agua
      de la Pena Group (containing the Chanares/Ischichuca Formations, the Los
      Rastros Formation, the Ischigualasto Formation, and the Los Colorados
      Formation)".
