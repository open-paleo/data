name: Alto Shale
rank: member
parent: Aguja
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
references:
  - id: lehman2024a
    notes: >
      The dedicated Aguja stratigraphy, which gives the rank and the parent: a
      progradational deltaic succession "includes the upper part of the
      McKinney Springs Tongue, Terlingua Creek Sandstone Member of the Aguja
      Formation, and lower part of the Alto Shale Member of the Aguja
      Formation". Gives no stage for the member itself; the drainage change
      evident in its upper part "persisted through Maastrichtian time during
      deposition of the Javelina Formation", which is the unit above.
  - id: lehman2019a
    notes: >
      The member's vertebrate fauna, under the informal name "upper shale
      member", "has been collected almost exclusively from levels well below
      the pyroclastic deposits, and so must have an age between 80 and 77 Ma
      (middle Campanian)". The pyroclastic deposits in the uppermost part of
      the member yield U/Pb ages from "c. 77 Ma", after Befus and colleagues
      (2008), to "c. 73 Ma", after Breyer and colleagues (2007).
  - id: befus2008a
    notes: >
      Dates the pyroclastic deposits inside the member by U-Pb, a weighted
      mean of 76.9 plus or minus 1.2 Ma across three basaltic bombs,
      "consistent with the presence of Late Campanian vertebrate fossils in
      the upper Aguja Formation". Its summary reading is "a Late Campanian
      (to possibly Early Maastrichtian) age for the pyroclastic deposits",
      and the Maastrichtian is hedged and confined to the top: fossils are
      "generally less abundant and diagnostic in the upper part of the upper
      shale member ... and that part of the member could extend into the
      Early Maastrichtian". Uses Lehman's informal name throughout and never
      the formal one, so a search on the member's name returns nothing from
      a paper that discusses it at length.
  - id: breyer2007a
    notes: >
      Gives a weighted mean concordia age of 72.6 plus or minus 1.5 Ma on
      zircons from a basaltic block. Its own independent constraint is a
      maximum rather than an age: a normal fault juxtaposes the Javelina
      Formation in the hanging wall against the pyroclastic rocks,
      "indicating the pyroclastic strata must be Maastrichtian or older". The
      "Upper Campanian/Lower Maastrichtian" it gives for the member is
      attributed in the same sentence to Lehman and is not its own. Also uses
      the informal name.
      Both this paper and Befus and colleagues calibrate against Ogg and
      colleagues (2004), "who place the upper boundary of the Campanian at
      70.6 plus or minus 0.6 Ma". Later timescales put that boundary at about
      72.1 Ma, so a determination that sat comfortably within the Campanian
      when published now straddles the boundary: the figure spans 71.1 to
      74.1 Ma at one sigma. The measurement is the datum and the stage name
      has moved beneath it, which is worth knowing before either number is
      read as a stage assignment.
