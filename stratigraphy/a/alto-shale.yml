name: Alto Shale
rank: member
parent: Aguja
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
lithology: mudstone with intercalated weakly consolidated sandstone beds
references:
  - id: lehman2024a
    notes: >
      Formally names the member, Lehman's (1985) "upper shale member", and dates
      it from about 80 Ma at the base to a top that "likely extends into early
      Maastrichtian time". Source of the lithology.
  - id: lehman2019a
    notes: >
      Dates the member's vertebrate fauna, collected well below its pyroclastic
      deposits, to 80–77 Ma, "middle Campanian".
  - id: befus2008a
    notes: >
      Dates the pyroclastic deposits in the upper member at Peña Mountain by
      U-Pb to 76.9 ± 1.2 Ma, and allows that the top "could extend into the
      Early Maastrichtian".
  - id: breyer2007a
    notes: >
      Dates a basaltic block from pyroclastic strata in the upper member to 72.6
      ± 1.5 Ma, and bounds the strata as "Maastrichtian or older" from a faulted
      contact with the Javelina.
  - id: ogg2004a
  - id: prieto-márquez2020a
    notes: >
      Gives the member, the source of "Nearly the entire fauna" of the
      formation, an age of 80 to 77 Ma (middle Campanian) for its fauna.
  - id: waggoner2006a
  - id: lehman1985a
