name: Agua de la Peña
rank: group
period: [Late Triassic, Early Jurassic]
stages: [Norian, Rhaetian]
references:
  - id: ezcurra2010a
    notes: >
      The Ischigualasto Formation crops out in the San Juan and La Rioja
      provinces of northwestern Argentina "as part of the Agua de la Peña
      Group of the Ischigualasto-Villa Unión Basin", a containment credited to
      Bossi (1971), and lies between the Los Rastros Formation below and the
      Los Colorados Formation above. A locality map of the group's
      southeastern outcrop covers both provinces.
  - id: arcucci2003a
    notes: >
      Places the Los Colorados Formation as "the upper part of the Agua de la
      Peña Group in the Ischigualasto-Villa Union Basin in western
      Argentina".
  - id: ezcurra2007b
    notes: >
      Gives the same containment for the Zupaysaurus horizon, "Los Colorados
      Formation (Norian ...), Agua de la Peña Group (La Esquina Fauna), in
      the Ischigualasto-Villa Unión Basin".
