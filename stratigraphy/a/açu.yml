name: Açu
rank: formation
period: [Early Cretaceous, Late Cretaceous]
stages: [Albian, Cenomanian]
references:
  - id: pereira2024a
    notes: >
      Gives "the Açu Formation (Albian-Cenomanian), Potiguar Basin, Ceará
      state, north-east Brazil" for the Tiamat type, the first Early
      Cretaceous titanosaur known from the unit.
  - id: mannion2025a
    notes: >
      Repeats the Albian to Cenomanian span and records rebbachisaurid
      material from it.
  - id: buffetaut2024a
    notes: >
      Independently gives "the Albian-Cenomanian Açu Formation of Brazil" for
      abelisaurid teeth.
