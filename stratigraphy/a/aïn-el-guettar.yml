name: Aïn el Guettar
rank: formation
period: [Early Cretaceous]
stages: [Aptian, Albian]
dispute:
  summary: >
    Benton and colleagues (2000) rank it "the Aïn el Guettar Group, with two
    formations, the Chenini Formation (early Albian), and the Oum ed Diab
    Formation (mid-Albian to Cenomanian)", with the Radouane above it; Fanti
    and colleagues (2012) treat it as a formation with Chenini and Oum ed Diab
    members and "include the Rhadouane Member within the Aïn El Guettar
    Formation rather than the Cenomanian Zebbag Formation".
references:
  - id: fanti2015a
    notes: >
      Places it in the Tataouine basin succession of southern Tunisia,
      "the overlying lower Albian Ain El Guettar (Chenini, Oum ed Diab and
      Rhadouane members)", above the Merbah el Asfer Group and below the
      Zebbag Formation. Prints the name without the diaeresis, a spelling
      rather than an alternate name.
  - id: fanti2013a
    notes: >
      Gives the Tataouinea horizon as "the Oum ed Diab Member of the Ain el
      Guettar Formation at the Jebel El Mra", the beds "dated as early Albian
      based on lateral correlation with marine units and associate vertebrate
      fauna".
  - id: mannion2025a
    notes: >
      Independently gives "the lower Albian Aïn el Guettar Formation of
      Tunisia" and treats it as contemporaneous with the Elrhaz Formation of
      Niger; its table dates Tataouinea hannibalis from the formation as
      "Early Albian (Early Cretaceous)".
  - id: ibrahim2020a
    notes: >
      Regards "the Aptian-Albian age as most likely, given the recent
      discovery of diagnostic remains of the giant crocodyliform Sarcosuchus
      ... and the smaller notosuchian Araripesuchus". Surveys the older
      readings in order to set them aside, giving the range as "as old as
      Barremian (Busson 1967, 1970) or as young as late Albian (Fanti et al.
      2015)" - though Fanti and colleagues in fact give the early Albian, in
      their abstract and in their type horizon block, and never the late
      Albian.
  - id: fanti2012b
    notes: >
      The stratigraphic revision of the Tataouine basin: "the Aïn El Guettar
      Formation (Chenini and Oum ed Diab members)" above the Merbah el Asfer
      Group, to which the paper later adds the Rhadouane, "we include the
      Rhadouane Member within the Aïn El Guettar Formation rather than the
      Cenomanian Zebbag Formation". Its upper limit is the "Barre
      Vraconnienne" of the Rhadouane, taken as late Albian; the Chenini is
      lower Albian and "the Oum ed Diab member ... is middle Albian in age".
      Reports earlier readings of "Barremian–Aptian" (Busson, 1967) and a
      palynological "upper Aptian–lower Albian age for the Aïn El Guettar
      Formation".
  - id: fanti2014a
    notes: >
      Gives "Ain el Guettar Formation (upper Aptian–Albian)", with the Chenini
      Member "referred to the uppermost Aptian-lowermost Albian".
  - id: benton2000a
    notes: >
      Ranks the unit a group: "the Aïn el Guettar Group, with two formations,
      the Chenini Formation (early Albian), and the Oum ed Diab Formation
      (mid-Albian to Cenomanian)". Palynomorphs "have suggested a late Aptian
      to early Albian age for the Aïn el Guettar Group".
