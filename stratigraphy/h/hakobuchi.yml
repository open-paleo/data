name: Hakobuchi
rank: formation
parent: Yezo
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
references:
  - id: kobayashi2019a
    notes: >
      Gives the Kamuysaurus horizon in "the Upper Cretaceous Hakobuchi
      Formation of the Yezo Group" as "the middle of IVb unit (early
      Maastrichtian) of the Hakobuchi Formation of the Yezo Group", from
      marine outer-shelf deposits along the Shirafunezawa Creek in the
      northern Hobetsu area of Mukawa town, Hokkaido.
  - id: takashima2004a
    notes: >
      Defines the formation, corresponding to the Hakobuchi Group of Matsumoto
      (1942), as a "Lower Campanian–Paleocene shallow-marine
      sandstone-conglomerate unit", "deposited during the Campanian–Early
      Maastrichtian and Late Paleocene interval". The Campanian age rests on
      Globotruncana rugosa in its lower part, with a Paleocene foraminifer in
      the upper part.
  - id: matsumoto1942a
