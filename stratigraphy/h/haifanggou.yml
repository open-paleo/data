name: Haifanggou
rank: formation
period: [Middle Jurassic]
stages: [Bathonian, Callovian]
variants: [Jiulongshan]
references:
  - id: xu2016b
    notes: >
      "The Haifanggou/Jiulongshan Formation has been widely accepted as Middle
      Jurassic in age", and radiometric data indicate "that the formation is
      partially Bathonian but mainly Callovian"; the Daohugou strata "belong
      mainly to the Bathonian-Callovian Haifanggou Formation", with the
      Oxfordian given to the overlying Lanqi/Tiaojishan.
  - id: chang2009b
    notes: >
      Names the unit "the Haifanggou Formation in Liaoning (also called the
      Jiulongshan Formation in Hebei Province)", and dates the base of the
      overlying Lanqi Formation to about 160.7 Ma: "the whole Lanqi Formation
      was deposited in the Late Jurassic; consequently, the underlying
      Haifanggou Formation ... [is] at least Middle Jurassic in age".
  - id: sullivan2014a
    notes: >
      Writes "the Jiulongshan (Haifanggou) Formation" and takes the lower
      boundary of the Tiaojishan Formation, 160 to 166 Ma, as the upper
      boundary of this one; leaves open whether the Daohugou strata belong to
      it or to the lower Tiaojishan.
  - id: wang2019a
    notes: >
      Gives "Haifanggou Formation, Yanliao Biota (Oxfordian stage, 163
      million years ago ...)" for the Ambopteryx horizon, a stratigraphic
      equivalent of the formation, and reports that "growing evidence
      suggests that the Haifanggou Formation preserves the early phase of
      this biota (early Oxfordian)". It also reports studies assigning the
      Wubaiding Village strata to the Haifanggou Formation, by which "the
      main salamander-bearing sediments were deposited during the
      Callovian age". The Oxfordian label for 163 million years belongs to
      an older chart; on the ICS chart v2024/12, whose Oxfordian begins at
      161.5 Ma, that figure is Callovian. The 163 million years is a
      personal communication, and Xu and colleagues (2016), cited for the
      early Oxfordian, give Bathonian-Callovian, so the paper adds no
      Oxfordian to the unit.
  - id: pittman2020a
    notes: >
      Places Pedopenna in "the Middle Jurassic Bathonian Haifanggou
      Formation", distinct from the "Late Jurassic Oxfordian Tiaojishan
      Formation" that yields Anchiornis, and elsewhere calls the unit the
      "Middle and Late Jurassic Haifanggou Formation".
