name: Haifanggou
rank: formation
period: [Middle Jurassic, Late Jurassic]
stages: [Bathonian, Callovian, Oxfordian]
references:
  - id: wang2019a
    notes: >
      Gives "Haifanggou Formation, Yanliao Biota (Oxfordian" for the
      Ambopteryx horizon, a stratigraphic equivalent of the formation, and
      reports that "growing evidence suggests that the Haifanggou Formation
      preserves the early phase of this biota (early Oxfordian)". It also
      reports studies assigning the Wubaiding Village strata to the Haifanggou
      Formation, by which "the main salamander-bearing sediments were
      deposited during the Callovian age".
  - id: pittman2020a
    notes: >
      Places Pedopenna in "the Middle Jurassic Bathonian Haifanggou
      Formation", distinct from the "Late Jurassic Oxfordian Tiaojishan
      Formation" that yields Anchiornis, and elsewhere calls the unit the
      "Middle and Late Jurassic Haifanggou Formation".
