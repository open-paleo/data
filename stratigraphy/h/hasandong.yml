name: Hasandong
rank: formation
period: [Early Cretaceous]
stages: [Aptian, Albian]
dispute:
  summary: >
    The trigonioidid bivalves place the formation in the Aptian: Sha (2007)
    correlates it, on Trigonioides (T.) quadratus, with the "mainly Aptian"
    Guilin Formation of Anhui, and Yun (2020) gives "Hasandong Formation
    (Lower Cretaceous; Aptian-Albian)". Lee and colleagues (2010) date its
    youngest detrital zircon at 109.0 ± 3.4 Ma, which on the ICS chart
    v2024/12 is Albian even at its older limit and would exclude the Aptian.
references:
  - id: dong2001a
    notes: >
      Describes Pukyongosaurus from the Early Cretaceous Hasandong
      Formation of the Gyeongsang Basin, Korea, on seven incomplete
      cervicals, a dorsal, a complete haemal arch and fragments from a
      single individual. Gives only the series for the formation, and
      relays that "The Sindong Group has generally been assigned to the
      Hauterivian on the basis of charophyte, spore and pollen study,
      although an early Aptian age was suggested from paleomagnetism". Lee
      and colleagues (2010) revise that older dating.
  - id: wilson2009a
    notes: >
      Its table of Cretaceous Asian sauropods dates the Hasandong
      occurrences, Pukyongosaurus millenniumi and the teeth of
      'Chiayusaurus asianensis' and unnamed titanosaurid and camarasaurid
      forms, as Barremian. The Barremian follows the older dating that Lee
      and colleagues (2010) revise.
  - id: carrano2012a
    notes: >
      Its table of unnamed tetanuran occurrences dates KS 7001, the
      megalosaurid material of Lim and colleagues (2002), as "Hasandong
      Formation; Hauterivian–Barremian; Early Cretaceous", and lists the
      allosaurid specimens KPE 8004 and 8005 of Park and colleagues (2000)
      from the same formation as "Barremian, Early Cretaceous". Both ages
      follow the older dating that Lee and colleagues (2010) revise.
  - id: lim2002a
  - id: park2000a
  - id: lee2010b
    notes: >
      Dates the formation by detrital zircon: "The youngest Cretaceous
      zircon age is 118.0 ± 3.0 Ma for the Nakdong Formation, 109.0 ± 3.4
      Ma for the Hasandong Formation, and 106.0 ± 1.9 Ma for the Jinju
      Formation", each "representing the maximum depositional age of the
      corresponding formation", and concludes that "the Sindong Group was
      deposited during the late Aptian to late Albian, which is younger
      than previously thought". The figure rests on the youngest grain and
      limits how old the formation can be rather than dating it. The paper
      also relays a U–Pb age of 115 ± 10 Ma on a dinosaur tooth from the
      formation, read as diagenetic.
  - id: sha2007a
    notes: >
      Reads the Guilin Formation of Anhui as "mainly Aptian" and
      correlates it with the "Yeonhwadong and Hasandong Formations of
      Korea", since all of them "contain T. (T.) quadratus which is the
      key member of the Barremian-Albian (mainly Aptian) trigonioidid
      assemblage 2". The Barremian–Albian is the range of the whole
      assemblage.
  - id: yun2020a
    notes: >
      Gives "the Hasandong Formation (Lower Cretaceous; Aptian-Albian)"
      for a theropod tooth from Daedo Island, Hadong County.
