name: Hasandong
rank: formation
period: [Early Cretaceous]
stages: [Hauterivian, Barremian]
references:
  - id: dong2001a
    notes: >
      Describes Pukyongosaurus from the Early Cretaceous Hasandong Formation
      of the Gyeongsang Basin, Korea, on seven incomplete cervicals, a dorsal,
      a complete haemal arch and fragments from a single individual. Gives
      only the series, not a stage.
  - id: wilson2009a
    notes: >
      Its table of Cretaceous Asian sauropods dates the Hasandong occurrences,
      Pukyongosaurus millenniumi and the teeth of 'Chiayusaurus asianensis'
      and unnamed titanosaurid and camarasaurid forms, as Barremian.
  - id: carrano2012a
    notes: >
      Its table of unnamed tetanuran occurrences dates KS 7001, the
      megalosaurid material of Lim and colleagues (2002), as "Hasandong
      Formation; Hauterivian–Barremian; Early Cretaceous", and lists the
      allosaurid specimens KPE 8004 and 8005 of Park and colleagues (2000)
      from the same formation as "Barremian, Early Cretaceous".
