name: Horseshoe Canyon
rank: formation
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
references:
  - id: larson2010a
    notes: >
      Gives the span and where the stage boundary falls within it: the
      formation "was deposited during late Campanian and early Maastrichtian
      time, with the boundary between these two stages approximately
      equivalent to the boundary between" the units it names, the Drumheller
      Marine Tongue being the marker.
  - id: eberth2012a
    notes: >
      The stratigraphic revision that gives "The Upper Cretaceous paralic to
      nonmarine Horseshoe Canyon Formation" its members: it "is divided into
      seven mappable members: Strathmore, Drumheller, Horsethief, Morrin,
      Tolman, Carbon, and Whitemud (bottom to top)". In its thickest and most
      complete sections the formation spans "approximately 7 million years,
      ranging from late Campanian (∼74.0 Ma; magnetochron 33n) to late
      Maastrichtian", about 67 Ma, following Lerbekmo and Braman (2002).
  - id: lerbekmo2002a
    notes: >
      Places the Campanian-Maastrichtian boundary inside the formation rather
      than at either of its limits, concluding that the boundary, "if placed
      at the base of the Hoploscaphites constrictus Zone, occurs at the top
      of 32n.1n", which is why the unit carries both stages.
      It also explains why other sources give the formation different tops:
      this paper counts the Whitemud and Battle as formations in their own
      right, listing "the overlying continental Edmonton Group (Horseshoe
      Canyon, Whitemud, Battle, and Scollard formations)", whereas Eberth and
      Braman (2012) make the Whitemud the topmost member of this formation.
      The two are describing the same rock with the boundary drawn in
      different places, not disagreeing about its age.
      Two cautions on its numbers. Its magnetostratigraphy reassigns the
      thick normal interval low in the formation, so that from the Drumheller
      Marine Tongue down to the middle of the basal sandstone the section
      "all belongs to magnetozone 32n", where earlier work had read it as
      33n. And its own radiometric anchor is not fully published: the Dorothy
      Bentonite, 20 m below the top of 33n, "has yielded a Rb/Sr date on
      biotite of 73.2 Ma (H. Baadsgaard and J.F. Lerbekmo, unpublished
      data)", the other anchor being an external date of 79.34 Ma for the
      base of that chron.
