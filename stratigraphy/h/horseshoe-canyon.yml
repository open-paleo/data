name: Horseshoe Canyon
rank: formation
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
lithology: sandstone, mudstone and coal
references:
  - id: larson2010a
    notes: >
      Gives the span and where the stage boundary falls within it: the
      formation "was deposited during late Campanian and early Maastrichtian
      time, with the boundary between these two stages approximately
      equivalent to the boundary between" the units it names, the Drumheller
      Marine Tongue being the marker.
  - id: eberth2012a
    notes: >
      Divides the formation into "seven mappable members", Strathmore to
      Whitemud, and gives it a span of about 74 to 67 Ma, late Campanian to late
      Maastrichtian, after Lerbekmo and Braman (2002).
  - id: lerbekmo2002a
    notes: >
      Places the Campanian–Maastrichtian boundary inside the formation: drawn at
      the base of the Hoploscaphites constrictus Zone, it "occurs at the top of
      32n.1n".
  - id: longrich2009b
    notes: >
      Source of the lithology.
