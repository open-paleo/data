name: Hall Lake
rank: formation
parent: McRae
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
dispute:
  summary: >
    The age of the lower part. Amato and colleagues (2017) date a tuff 10 to
    15 m above the base at 73.2 ± 0.7 Ma, late Campanian; Lucas and colleagues
    (2019) date the lower part "Lancian (late Maastrichtian)" from dinosaurs
    24–141 m above the base and "question its reliability".
references:
  - id: dalman2021b
    notes: >
      Describes Sierraceratops from the "Upper Cretaceous (uppermost
      Campanian–Maastrichtian) Hall Lake Formation of south-central New
      Mexico", and fixes the lower part by a U-Pb age reported by Amato and
      colleagues (2017) "of 73.2 ± 0.7 Ma on a tuff bed about 10 m above the
      base", which makes the dinosaurs of the 23 to 43 m interval above the
      base "likely late Campanian in age".
  - id: amato2017a
    notes: >
      Dates a tuff 10 to 15 m above the base at 73.2 ± 0.7 Ma, placing the lower
      part in the "late Campanian", and reports late Maastrichtian dinosaurs
      whose level in the unit is uncertain.
  - id: lucas2019a
    notes: >
      Raises the unit to a formation and dates its lower part "Lancian (late
      Maastrichtian)" from dinosaurs 24–141 m above the base, questioning the
      73.2 Ma tuff date.
