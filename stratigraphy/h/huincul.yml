name: Huincul
rank: formation
parent: Neuquén
period: [Late Cretaceous]
stages: [Cenomanian, Turonian]
dispute:
  summary: >
    Where the unit's top falls is unsettled and both readings are in current
    use. Hugo and Leanza (2001) confine it to the Cenomanian, placing the
    Turonian of the Rio Limay Subgroup in the Cerro Lisandro Formation above,
    and Leanza and colleagues (2004) follow them with "probably Late
    Cenomanian"; Bellardini and colleagues give "upper Cenomanian" in 2023 and
    again in 2025. Garrido (2010) instead makes a tentative assignment to the
    upper Cenomanian to Turonian, which most later work adopts. Simon and
    colleagues (2025) set the two out side by side rather than choosing. A
    third reading, Corbella and colleagues' fission-track date implying a
    Turonian to Santonian span, is not current: Garrido rejects the dated tuff
    as too altered and no later work follows it.
references:
  - id: lerzo2024a
    notes: >
      Sidersaura marae was found in "rocks of the Huincul Formation (upper
      Cenomanian – Turonian) of Neuquén Province, Argentina", in the basal
      levels of the unit at Barda Atravesada de Las Campanas near Villa El
      Chocón. For the unit as a whole the paper follows Garrido (2010), under
      whom "the age of the Huincul Formation corresponds to upper
      Cenomanian-Turonian".
  - id: nogueira2024a
    notes: >
      Chakisaurus nekul, the first named ornithischian from the unit, comes
      from "the Huincul Formation (Cenomanian-Turonian, Upper Cretaceous) at
      the Pueblo Blanco Natural Reserve, Río Negro province, Argentina". The
      geological setting repeats that span, placing the formation in the
      Neuquén Group after Garrido (2010), and describes it as yellowish and
      greenish fine- to medium-grained sandstones that are sometimes
      tuffaceous.
  - id: apesteguía2016a
    notes: >
      "The fossiliferous Huincul Formation (Late Cenomanian-Early Turonian) is
      widely exposed in Neuquen and Rio Negro provinces of northern Patagonia,
      Argentina", and the holotype of Gualicho shinyae comes from near its
      base on the Meseta de la Renteria. The age matters to the argument: it
      is what makes the Huincul dinosaur fauna comparable with the Kem Kem,
      Bahariya and Echkar assemblages of North Africa, and with the Bajo
      Barreal Formation and the Bayo Overo Member of the Cerro Barcino
      Formation in Patagonia.
  - id: bellardini2023a
    notes: >
      Places the articulated rebbachisaurid MAU-Pv-EO-629 in "the lower
      section of Huincul Formation (upper Cenomanian)" at El Orejano, where
      only the basal layers of the unit are exposed, and calls these "the
      Upper Cretaceous outcrops of the Huincul Formation (upper Cenomanian)".
      The surrounding stratigraphy is set out explicitly: the Rayoso Formation
      of the Bajada del Agrio Group below is Aptian-Albian, while the
      Candeleros, Huincul and Cerro Lisandro formations of the Neuquen Group
      are Cenomanian-Turonian.
  - id: simón2025a
    notes: >
      Sets out the competing age estimates for the unit at Villa El Chocon,
      where it overlies the Candeleros Formation and is overlain by the Cerro
      Lisandro Formation: late Cenomanian, between 93 and 91 Ma, after
      Legarreta and Gulisano (1989) and Leanza (1999), or upper Cenomanian to
      Turonian after Garrido (2010). The paper itself uses "upper
      Cenomanian-Turonian" throughout, takes the new rebbachisaurid from the
      lower levels, and reads the upper levels, "those that presumably
      correspond to the Turonian", as the interval that no longer yields
      rebbachisaurids.
  - id: bellardini2025a
    notes: Gives "Huincul Formation (upper Cenomanian".
  - id: cerroni2020a
    notes: >
      Gives "Huincul Formation (Cenomanian-Turonian".
  - id: baiano2020a
    notes: >
      Places the Huinculsaurus level at "the top of the Huincul Formation
      (upper Cenomanian-Turonian" at Aguada Grande, Neuquén Province,
      following Keidel (in Wichmann, 1927) and Garrido (2010).
  - id: wichmann1927a
  - id: garrido2010a
    notes: >
      "Although this unit has some palyno-floristic studies and radiometric
      data, the age of its deposits is not yet well established." Legarreta
      and Gulisano (1989) put it between 93 and 91 Ma, "between the upper
      Cenomanian and the lower Turonian", while Hugo and Leanza (2001) and
      Leanza and colleagues (2004) place it "exclusively within the upper
      Cenomanian", and an 88 ± 3 Ma tuff at the base of the unit at Cerro
      Policía, reported by Corbella and colleagues (2004), is too altered for
      the paper to accept without more data. Weighing these, the paper makes
      "a tentative assignment ... of the Huincul Fm. to an age between the
      Upper Cenomanian and the Turonian".
  - id: legarreta1989a
  - id: hugo2001a
    notes: >
      Assigns the Rio Limay Subgroup to the Cenomanian to lower Turonian
      while placing the Huincul Formation itself in the Cenomanian, the
      Turonian part of that span belonging to the Cerro Lisandro Formation
      above it. Dates the Neuquen Group as a whole from the early Cenomanian
      at 97 plus or minus 3 Ma to the early Campanian at 74 plus or minus 3
      Ma. This is the source behind the readings that keep the unit out of the
      Turonian.
  - id: corbella2004a
    notes: >
      Reports the first radiometric age for the Neuquen Group, a
      fission-track determination on an ash-flow tuff at the base of the unit,
      giving a mean of 88 plus or minus 3.9 Ma and a depositional range of
      84.1 to 91.9 Ma - from the base of the Turonian to the top of the
      Santonian. The authors read this as making the formation younger than
      previously thought, deposition beginning around the early Turonian and
      possibly persisting to the late Santonian if the error is taken at its
      full width, and add that this need not make the underlying Candeleros
      Formation much younger. Garrido (2010) declines the determination on the
      ground that the tuff is too altered.
  - id: leanza2004a
    notes: >
      "The age of the Huincul Formation is probably Late Cenomanian",
      following Hugo and Leanza (2001), while the Rio Limay Subgroup that
      contains it "can be regarded as Cenomanian to Early Turonian" and the
      overlying Cerro Lisandro Formation as "Late Cenomanian-Early Turonian".
      Describes the unit as yellowish and greenish fine- to medium-grained
      sometimes tuffaceous sandstones, 50 to 250 m thick, conformably between
      the Candeleros below and the Cerro Lisandro above, with a white tuff up
      to 2.5 m thick close to its base in the Cerro Policia region.
