name: Huincul
rank: formation
parent: Neuquén
period: [Late Cretaceous]
stages: [Cenomanian, Turonian]
dispute:
  summary: >
    Where the unit's top falls is unsettled and both readings are in current
    use. Hugo and Leanza (2001) confine it to the Cenomanian, placing the
    Turonian of the Rio Limay Subgroup in the Cerro Lisandro Formation above,
    and Leanza and colleagues (2004) follow them with "probably Late
    Cenomanian"; Bellardini and colleagues give "upper Cenomanian" in 2023 and
    again in 2025. Garrido (2010) instead makes a tentative assignment to the
    upper Cenomanian to Turonian, which most later work adopts. Simón and
    Salgado (2025) set the two out side by side rather than choosing. A
    third reading, Corbella and colleagues' fission-track date implying a
    Turonian to Santonian span, is not current: Garrido rejects the dated tuff
    as too altered and no later work follows it.
references:
  - id: lerzo2025a
    notes: >
      Sidersaura marae was found in "rocks of the Huincul Formation (upper
      Cenomanian – Turonian) of Neuquén Province, Argentina", in the basal
      levels of the unit at Barda Atravesada de Las Campanas near Villa El
      Chocón. For the unit as a whole the paper follows Garrido (2010), under
      whom "the age of the Huincul Formation corresponds to upper
      Cenomanian-Turonian".
  - id: nogueira2024a
    notes: >
      Names Chakisaurus nekul, the first ornithischian from the formation, from
      the Pueblo Blanco Natural Reserve in Río Negro Province, and dates the
      unit "Cenomanian-Turonian" after Garrido (2010).
  - id: apesteguía2016a
    notes: >
      Describes Gualicho shinyae from near the base of the formation on the
      Meseta de la Rentería, and dates the unit "Late Cenomanian-Early
      Turonian".
  - id: bellardini2023a
    notes: >
      Places the rebbachisaurid MAU-Pv-EO-629 in "the lower section of Huincul
      Formation (upper Cenomanian)" at El Orejano, where only the basal layers
      of the unit crop out.
  - id: simón2025a
    notes: >
      Names Cienciargentina sanchezi from the lower levels of the formation at
      Villa El Chocón, and uses "upper Cenomanian-Turonian" after Garrido (2010)
      beside a late Cenomanian reading.
  - id: bellardini2025a
    notes: Gives "Huincul Formation (upper Cenomanian)".
  - id: cerroni2020a
    notes: >
      Gives "Huincul Formation (Cenomanian-Turonian ...)".
  - id: baiano2020a
    notes: >
      Places the Huinculsaurus level at "the top of the Huincul Formation
      (upper Cenomanian-Turonian ...)" at Aguada Grande, Neuquén Province,
      following Keidel (in Wichmann, 1927) and Garrido (2010).
  - id: wichmann1927a
  - id: garrido2010a
    notes: >
      Weighs the earlier datings of the formation and makes a tentative
      assignment of it to the upper Cenomanian and the Turonian.
  - id: legarreta1989a
  - id: hugo2001a
    notes: >
      Assigns the formation to the upper Cenomanian, within a Río Limay Subgroup
      of Cenomanian to early Turonian age.
  - id: corbella2004a
    notes: >
      Reports a fission-track age of 88 plus or minus 3.9 Ma on zircons from an
      ash-flow tuff near the base of the formation, the first radiometric date
      for the Neuquén Group.
  - id: leanza2004a
    notes: >
      Dates the formation "probably Late Cenomanian" after Hugo and Leanza
      (2001), and describes it as yellowish and greenish, sometimes tuffaceous
      sandstones 50 to 250 m thick.
  - id: leanza1999a
