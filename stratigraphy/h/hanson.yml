name: Hanson
rank: formation
period: [Early Jurassic]
stages: [Sinemurian, Pliensbachian]
description: "The Hanson Formation (also known as the Shafer Peak Formation) is a geologic formation on Mount Kirkpatrick and north Victoria Land, Ross Dependency, Antarctica. It is one of the two major dinosaur-bearing rock groups found on Antarctica to date; the other is the Snow Hill Island Formation and related formations from the Late Cretaceous of the Antarctic Peninsula. The formation has yielded some Mesozoic specimens, but most of it is as yet unexcavated. The formation includes material from volcanic activity linked to the Karoo-Ferrar eruptions of the Lower Jurassic. The climate of the zone was similar to that of modern southern Chile, humid, with a temperature interval of 17–18 degrees Celsius (62.6-64.4 degrees Fahrenheit)."
references:
  - id: smith2007b
    notes: >
      Gives "the Early Jurassic Hanson Formation of the Central Transantarctic
      Mountains". Gives only the series, not a stage.
  - id: smith2007a
    notes: >
      Brackets it rather than dating it: Dicroidium odontopteroides in the
      Falla Formation "300 meters below the vertebrate bearing layers" and
      spore assemblages there "provide an upper bound of Carnian-Norian (Late
      Triassic) for the base of the Hanson Formation", while "a radiometric
      date of 177±2 Ma of the overlying Prebble Formation and Kirkpatrick
      Basalt" gives "a lower bound of Aalenian (earliest Middle Jurassic) for
      the top".
  - id: benson2010b
    notes: >
      Gives Cryolophosaurus ellioti as "from the Hanson Formation
      (Sinemurian–Pliensbachian) of Antarctica".
