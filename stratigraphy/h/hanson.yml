name: Hanson
rank: formation
period: [Early Jurassic]
stages: [Sinemurian, Pliensbachian]
lithology: interbedded sandstone and tuff
references:
  - id: smith2007b
    notes: >
      Gives "the Early Jurassic Hanson Formation of the Central Transantarctic
      Mountains". Gives only the series, not a stage.
  - id: smith2007a
    notes: >
      Brackets it between Late Triassic plant and spore records in the
      underlying Falla Formation and a 177±2 Ma date above, and calls its
      vertebrate-bearing lower part "probably middle Early Jurassic".
  - id: benson2010b
    notes: >
      Gives Cryolophosaurus ellioti as "from the Hanson Formation
      (Sinemurian–Pliensbachian) of Antarctica".
  - id: elliot2016a
    notes: >
      Source of the lithology.
