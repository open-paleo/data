name: Hongtuling
rank: formation
period: [Late Cretaceous]
dispute:
  summary: >
    Xue and colleagues (1996) give the Qinlingosaurus horizon as the "Upper
    Cretaceous Hongtuling Formation". Zhang (2009), the national lexicon of
    formation names, defines a Hongtuling Formation of brownish red sandy
    mudstone at the same type locality, Hongtuling in Luonan County, as
    Eocene, first
    named in a 1977 survey manuscript and published in 1989.
references:
  - id: zhao2008a
    notes: >
      Gives the unit as Early Cretaceous in a compiled distribution field,
      which stacks the locality "Hongtuling range, Luonan, Shaanxi", the unit
      "Hongtuling Formation" and the age on three separate lines rather than
      stating them in a sentence. Xue and colleagues give the same horizon at
      the same locality as Upper Cretaceous twice over, and the remarks
      closing Zhao and colleagues' own catalog entry cite Holtz and colleagues
      (2004), whose volume gives the occurrence as Late Cretaceous.
  - id: xue1996a
    notes: >
      Gives the Qinlingosaurus horizon as "Hongtuling, Luonan, Shaanxi; Upper
      Cretaceous Hongtuling Formation". Gives only the series, not a stage.
  - id: holtz2004a
  - id: zhang2009b
    notes: >
      Defines the unit: "Type locality: Hongtuling in Luonan County, Shaanxi
      Province. Definition: For brownish red sandy mudstone. Age: Eocene.",
      first appearing "in a 1977 manuscript by No.3 Petroleum Geological
      Survey Team" and published by the Shaanxi Bureau of Geology in 1989.
