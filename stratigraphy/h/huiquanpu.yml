name: Huiquanpu
rank: formation
period: [Late Cretaceous]
stages: [Cenomanian, Turonian, Coniacian, Santonian, Campanian]
lithology: conglomerate and purple-red mudstone
references:
  - id: pang2000a
    notes: >
      Gives "the Upper Cretaceous Huiquanpu Formation, Tianzhen County, Shanxi
      Province" for the Huabeisaurus type, and from the associated
      ankylosaurid Tianzhenosaurus, hadrosaurids, ostracods and charophytes
      takes "the Huabeisaurus-bearing beds" to be "Late Cretaceous probably
      Campanian in age".
  - id: pang2024a
    notes: >
      Places its new ankylosaur in "the second member" and dates the formation
      to the middle to late Late Cretaceous, the upper dinosaur-bearing beds to
      the Campanian. Source of the lithology.
  - id: pang1996a
    notes: >
      Dates both members Late Cretaceous from their dinosaurs, the upper
      member "may correspond roughly to the middle–late Campanian to early
      Maastrichtian" (translated); Pang and colleagues (2024) narrow that
      interval to the Campanian.
  - id: xi2021a
    notes: >
      Names the Huiquanpu as the earlier Hebei name of the Zhumapu Formation,
      to which it gives a late Campanian to early Maastrichtian age after Pang
      and colleagues (1996).
