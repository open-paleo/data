name: Huiquanpu
rank: formation
period: [Late Cretaceous]
stages: [Cenomanian, Turonian, Coniacian, Santonian, Campanian]
references:
  - id: pang2000a
    notes: >
      Gives "the Upper Cretaceous Huiquanpu Formation, Tianzhen County, Shanxi
      Province" for the Huabeisaurus type, and from the associated
      ankylosaurid Tianzhenosaurus, hadrosaurids, ostracods and charophytes
      takes "the Huabeisaurus-bearing beds" to be "Late Cretaceous probably
      Campanian in age".
  - id: pang2024a
    notes: >
      Resolves a specimen to "the second member of the Upper Cretaceous
      Huiquanpu Formation", a numbered member. Its charophyte assemblage shows
      "transitional features between the Early and Late Cretaceous, but with
      clear Late Cretaceous character, so it is appropriately assigned to the
      Cenomanian–Campanian of the Late Cretaceous"; the ostracods and the
      spore and pollen assemblage indicate the middle to late part of the Late
      Cretaceous, and paleomagnetic correlation places the upper
      dinosaur-bearing interval in the Campanian, at about 83 to 72 Ma.
