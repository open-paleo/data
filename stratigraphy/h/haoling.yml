name: Haoling
rank: formation
period: [Early Cretaceous]
stages: [Aptian, Albian]
lithology: purplish-red and greenish-gray conglomerate, interbedded with
  argillaceous siltstone and lithic sandstone
references:
  - id: han2024a
    notes: >
      Gives "Haoling Formation, Early Cretaceous (Aptian–Albian)".
  - id: sethapanichsakul2026a
    notes: >
      Gives "Haoling Formation, Aptian-Albian".
  - id: xu2012c
    notes: >
      Describes its rock: "The lower part of the Haoling Formation consists of
      light purplish-red conglomerate interbedded with brownish-red argillaceous
      siltstone, with interbedded grayish-white lithic sandstone; the middle
      part consists of greenish-gray conglomerate and sandy conglomerate
      interbedded with brownish-red argillaceous siltstone and silty
      mudstone...; the upper part consists of purplish-red and greenish-gray
      conglomerate and yellowish-green lithic sandstone interbedded with
      purplish-red argillaceous silty (fine) sandstone."
