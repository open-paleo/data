name: Hornitos
rank: formation
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
references:
  - id: rubilar-rogers2021a
    notes: >
      Describes Arackar from "the Upper Cretaceous (Campanian–Maastrichtian)
      beds of the Hornitos Formation, Atacama Region, northern Chile", the
      holotype coming from the lower to middle levels of the formation at La
      Higuera ravine.
  - id: powell2003a
    notes: >
      Describes the lithology, after Chong Diaz (1985), as "sandstones,
      mudstones, conglomerates and limestones, with intercalated andesitic
      flows and breccias", the material coming from a calcareous-marly bed,
      and gives the age from the same source as "Late Cretaceous?-Early
      Tertiary".
