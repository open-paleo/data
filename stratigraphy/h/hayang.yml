name: Hayang
rank: group
period: [Early Cretaceous, Late Cretaceous]
stages: [Albian, Cenomanian, Turonian, Coniacian, Santonian, Campanian]
references:
  - id: kim1983a
    notes: >
      Names the group by way of the Gugyedong Formation inside it, in the
      Cretaceous of Korea.
  - id: lee2010b
    notes: >
      Places the group second of the four Cretaceous groups of the Gyeongsang
      Basin, "from oldest to youngest, the Sindong, Hayang, Yucheon, and the
      Bulkuksa intrusive Groups", with the Sindong "overlain conformably by
      the Hayang Group". It reports that on palynology the group "was
      interpreted to have been deposited during the Aptian and Albian", a
      reading it sets aside. Detrital zircons put the top of the Sindong in the
      late Albian, so the Hayang "should be equal to or younger than late
      Albian"; with the tuff dated by Jwa and colleagues (2009) in its upper
      part and its top at 81–80 Ma, it "is interpreted to have been deposited
      during the Cenomanian to early Campanian". The late Albian floor
      stands, but later zircon ages from the lower group, in Choi and Kwon
      (2019) and Lee and Park (2020), put its start in the Albian rather than
      the Cenomanian. The 81 to 80 Ma top is early Campanian on GTS2020.
  - id: choi2019a
    notes: >
      Dates the group in the Euiseong subbasin by detrital zircon, above the
      Sindong Group's Jinju Formation at "about 106 Ma (Lee et al., 2010)":
      the lower formations give maximum depositional ages of "the Jeomgok
      Formation (180829-2; 104.9 Ma), the Sagok Formation (180828-6; 99.8
      Ma), and the Banyawol Formation (180828-2; 96 Ma)", and "the
      depositional age of the Sagok Formation can be constrained to about
      100–97 Ma". The lower group is thus Albian.
  - id: lee2020a
    notes: >
      Relays the maximum depositional ages from the Milyang subbasin: "109 Ma
      for the Chilgok Formation, 106 Ma for the Silla Conglomerate, 105 Ma for
      the Haman Formation, and 100 Ma for the Jindong Formation", all Albian
      or younger.
  - id: jwa2009a
    notes: >
      The Kusandong Tuff "occurs in the upper part of the Hayang Group". Its
      zircons give U-Pb ages of 97.1 ±2.0 and 97.3 ±1.8 Ma, "indicating that
      the tuffaceous bed formed during the middle Cenomanian".
  - id: gale2020a
    notes: >
      Puts the base of the Campanian at 83.7 Ma, so the group's 81 to 80 Ma
      top is early Campanian, and the base of the Albian at 113.2 Ma, below
      all the group's zircon maximum depositional ages.
