name: Hayang
rank: group
period: [Early Cretaceous, Late Cretaceous]
stages: [Aptian, Albian, Cenomanian, Turonian, Coniacian, Santonian, Campanian]
dispute:
  summary: >
    Lee and colleagues (2010) report that on palynology the group "was
    interpreted to have been deposited during the Aptian and Albian". Against
    that they set detrital zircons from the Sindong Group beneath it, a middle
    Cenomanian tuff in its upper part dated by Jwa and colleagues (2009), and
    a boundary with the overlying Yucheon Group at 81–80 Ma, and conclude that
    the group "should be equal to or younger than late Albian" and "is
    interpreted to have been deposited during the Cenomanian to early
    Campanian".
references:
  - id: kim1983a
    notes: >
      Names the group by way of the Gugyedong Formation inside it, in the
      Cretaceous of Korea.
  - id: lee2010b
    notes: >
      Places the group second of the four Cretaceous groups of the Gyeongsang
      Basin, "from oldest to youngest, the Sindong, Hayang, Yucheon, and the
      Bulkuksa intrusive Groups", with the Sindong "overlain conformably by
      the Hayang Group". Detrital zircons put the top of the Sindong in the
      late Albian, so the Hayang "should be equal to or younger than late
      Albian"; with the tuff dated by Jwa and colleagues (2009) in its upper
      part and its top at 81–80 Ma, it "is interpreted to have been deposited
      during the Cenomanian to early Campanian".
  - id: jwa2009a
    notes: >
      The Kusandong Tuff "occurs in the upper part of the Hayang Group". Its
      zircons give U-Pb ages of 97.1 ±2.0 and 97.3 ±1.8 Ma, "indicating that
      the tuffaceous bed formed during the middle Cenomanian".
