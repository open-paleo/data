name: Hayang
rank: group
period: [Early Cretaceous, Late Cretaceous]
stages: [Albian, Cenomanian, Turonian, Coniacian, Santonian, Campanian]
lithology: sandstone and mudrock, with minor conglomerate, marl and extrusive
  rocks
references:
  - id: kim1983a
    notes: >
      Names the group by way of the Gugyedong Formation inside it, in the
      Cretaceous of Korea.
  - id: lee2010b
    notes: >
      Places the group conformably above the Sindong Group, "equal to or younger
      than late Albian", and interprets it as "deposited during the Cenomanian
      to early Campanian".
  - id: choi2019a
    notes: >
      Gives detrital zircon maximum depositional ages of 104.9, 99.8 and 96 Ma
      for the Jeomgok, Sagok and Banyawol formations of the Euiseong subbasin,
      and dates the Sagok to about 100–97 Ma.
  - id: lee2020a
    notes: >
      Relays the maximum depositional ages from the Milyang subbasin: "109 Ma
      for the Chilgok Formation, 106 Ma for the Silla Conglomerate, 105 Ma for
      the Haman Formation, and 100 Ma for the Jindong Formation", all Albian
      or younger.
  - id: jwa2009a
    notes: >
      The Kusandong Tuff "occurs in the upper part of the Hayang Group". Its
      zircons give U-Pb ages of 97.1 ±2.0 and 97.3 ±1.8 Ma, "indicating that the
      tuffaceous bed formed during the middle Cenomanian". Source of the
      lithology.
  - id: gale2020a
    notes: >
      Puts the base of the Campanian at 83.7 Ma, so the group's 81 to 80 Ma
      top is early Campanian, and the base of the Albian at 113.2 Ma, below
      all the group's zircon maximum depositional ages.
