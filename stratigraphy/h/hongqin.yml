name: Hongqin
rank: formation
period: [Middle Jurassic]
references:
- id: huang2014a
  notes: >
    Middle Jurassic of Shexian, Huangshan, Anhui, and the source of the
    first Jurassic dinosaur described from the province.
- id: ren2018a
  notes: >
    Purple sandstones interbedded with purple shales in the Tunxi Basin of
    Anhui, assigned to the Middle Jurassic on invertebrates.
- id: li2025a
  notes: >
    Lists the formation among the Middle Jurassic units of China that
    yield mamenchisaurids.
