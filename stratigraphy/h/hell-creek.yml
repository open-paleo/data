name: Hell Creek
rank: formation
period: [Late Cretaceous]
stages: [Maastrichtian]
description: "The Hell Creek Formation is an intensively studied division of rocks in North America, named for exposures studied along Hell Creek, near Jordan, Montana. The formation stretches over portions of Montana, North Dakota, South Dakota, and Wyoming. It is a series of fresh and brackish-water clays, mudstones, and sandstones deposited by fluvial activity in fluctuating river channels and deltas and very occasional peaty swamp deposits along the low-lying eastern continental margin fronting the late Cretaceous Western Interior Seaway. The climate was mild; the presence of crocodilians along with palm trees suggests a subtropical and temperate climate with no prolonged freeze. The famous iridium-enriched Cretaceous–Paleogene boundary, which separates the Cretaceous from the Cenozoic, occurs as a discontinuous but distinct thin marker bedding above the formation, near its boundary with the overlying Fort Union Formation."
references:
  - id: arbour2017b
    notes: >
      Places its material "61-67 m below Cretaceous-Palaeogene boundary, late
      Maastrichtian".
  - id: sullivan2006a
    notes: Independently gives the formation as "late Maastrichtian".
  - id: woodruff2023a
    notes: >
      Gives the Sphaerotholus triregnum holotype as from "the lower half of
      the Hell Creek Formation (upper Maastrichtian, Upper Cretaceous)", about
      45 km southwest of Jordan in Garfield County, Montana.
