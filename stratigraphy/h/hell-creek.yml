name: Hell Creek
rank: formation
period: [Late Cretaceous]
stages: [Maastrichtian]
references:
  - id: arbour2017b
    notes: >
      Places its material "61-67 m below Cretaceous-Palaeogene boundary, late
      Maastrichtian".
  - id: sullivan2006a
    notes: Independently gives the formation as "late Maastrichtian".
  - id: woodruff2023a
    notes: >
      Gives the Sphaerotholus triregnum holotype as from "the lower half of
      the Hell Creek Formation (upper Maastrichtian, Upper Cretaceous)", about
      45 km southwest of Jordan in Garfield County, Montana.
