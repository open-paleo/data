name: Hekou
rank: group
period: [Early Cretaceous]
stages: [Berriasian, Valanginian, Hauterivian, Barremian, Aptian, Albian]
references:
  - id: you2006a
    notes: >
      "the Lower Cretaceous Hekou Group of the Lanzhou Basin, Gansu, China".
      No stage is given.
  - id: li2014a
    notes: >
      Scopes it to the wider basin: "the Hekou Group (Lower Cretaceous) of
      the Lanzhou-Minhe Basin, Gansu Province, China".
  - id: yang2013a
    notes: >
      Argues that the Hekou Group yielding Taohelong is probably equivalent in
      age to the Barremian, since its closest relatives, Polacanthus foxii
      from England and Gastonia burgei from North America, are both Barremian.
      The specimen comes from shallow lacustrine beds in the middle of the
      group, in the fifth of its eight informal lithostratigraphic units.
  - id: averianov2025b
    notes: >
      Places Daxiatitan in "the Aptian part of the Hekou Group in Gansu,
      China", following You and colleagues (2008).
  - id: you2008a
    notes: >
      Gives only the epoch, describing Daxiatitan binglingi as "discovered
      from the Lower Cretaceous Hekou Group of Lanzhou Basin, Gansu Province".
      No stage name and no numeric age appear anywhere in the paper.
  - id: oyabu2026a
    notes: >
      Reviewing the Asian nodosaurids, places Taohelong jinchengensis in "the
      Hekou Group (Valanginian–Albian ... ) in Gansu Province", taking that
      range from the Cretaceous timescale of Xi and colleagues (2018). Its
      Valanginian start differs from the 138 Ma Xi and colleagues give,
      which is Berriasian on the ICS chart v2024/12.
  - id: xi2018a
    notes: >
      Covers this Hekou, in the Xining-Lanzhou Basin: "the Lower Cretaceous
      Hekou Group (Zhujiatai, Yanguoxia, Honggucheng and Huazhuang Formations
      from oldest to youngest)", below the Upper Cretaceous Minhe Formation.
      It reports magnetostratigraphic work "showing that the Hekou and
      Liupanshan Groups date to 138–106 and 127–110 Ma, respectively"
      (p. 277), relayed from earlier studies. On the ICS chart v2024/12,
      whose Valanginian begins at 137.05 Ma, the 138 Ma end of that range
      falls in the latest Berriasian.
