name: Hunter Wash
rank: member
parent: Kirtland
period: [Late Cretaceous]
stages: [Campanian]
references:
  - id: dalman2025a
    notes: >
      Gives "Hunter Wash Member of the Kirtland Formation, Upper Cretaceous
      (late Campanian)".
  - id: jasinski2011a
    notes: >
      Independently dates the member late Campanian.
  - id: hunt1992a
    notes: >
      Erects the member: "We coin the name Hunter Wash Member for this
      stratigraphic unit", the strata Reeside (1924) called the "lower shale
      member" of the Kirtland. Its type section is along Hunter Wash, it is
      "about 375 m thick in its type area", and it lies between the Bisti and
      Farmington members. Dates the lower four members of the Kirtland
      together as "Edmontonian (early Maastrichtian)", citing ashes in the
      upper Fruitland and in this member that Brookins and Rigby (1987) found
      "all consistent with an age of 73.5 ± 2.2 Ma", with "The
      Campanian-Maastrichtian boundary ... currently placed at 74.0 Ma
      (Harland et al., 1990)". On the ICS chart v2024/12 (Maastrichtian base
      72.2 Ma) 73.5 Ma is late Campanian, so the Maastrichtian label belongs
      to the older chart.
  - id: reeside1924a
  - id: brookins1987a
  - id: harland1990a
