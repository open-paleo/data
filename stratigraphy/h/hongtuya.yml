name: Hongtuya
rank: formation
parent: Wangshi
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
references:
  - id: zhang1996a
    notes: >
      The provincial lithostratigraphy adopts it as the third of the Wangshi
      Group's five formations, named by Liu Mingwei and colleagues in 1994:
      "brick-red and purplish-red fine sandstone and siltstone interbedded
      with sandy conglomerate, lying conformably above the Xingezhuang
      Formation and below the Jingangkou Formation" (translated), with a
      basalt member around Zhucheng and Jiaozhou. The holostratotype is the
      Wujiazhuang–Hongtuya section at Guliu, Laiyang, 448.56 m; the
      Tianqiaotun–Jiangjunding section southwest of Laiyang, over 3,000 m, is
      a parastratotype. It holds the Laiyang and Zhucheng hadrosaur sites at
      Tianqiaotun, Jiangjunding, Jingangkou and Longgujian, and the
      Yangjialing and Taocun formations are rejected as synonyms of it.
  - id: an2015a
    notes: >
      The formation "was deposited during the Campanian", from a 77.3 Ma
      maximum depositional age for "the dinosaur bone beds of the Hongtuya
      Formation"; the paper also places it in "the Late Cretaceous Wangshi
      Group" and says it "was deposited in the latest Cretaceous".
  - id: yao2026a
    notes: >
      Narrows it to "middle to late Campanian".
  - id: zhang2019a
    notes: >
      Follows Hu and colleagues (2001), whose Jiangjunding and Jingangkou
      formations divide the beds the province places in the Hongtuya, and
      notes that Yan and Chen (2005) "obtained an isotope age of 73 Ma for the
      Jingangkou Formation (which they called the Hongtuya Formation) based on
      a basalt sample from the town of Daxizhuang in Jiaozhou City". The age
      is relayed, with no method or level given.
  - id: borinder2021a
    notes: >
      Uses the scheme of Hu and colleagues (2001), placing the Hongtuya
      beneath its Jiangjunding Formation, which it dates "Upper Cretaceous
      (upper Campanian–lower Maastrichtian)" after Xing and colleagues (2014)
      for the outcrops near the Tanius sinensis site, beds the province
      places in the Hongtuya. Relays "A radiometric date of 72.9–73.5 Ma ...
      from the uppermost section of the underlying Hongtuya Formation (Yan et
      al., 2005)".
  - id: xu2019a
    notes: >
      A field-trip note from the Shandong Institute of Geological Survey that
      visits "the Hongtuya Formation of the Wangshi Group between Jiangjuding
      and Jingangkou", the dinosaur sites of Zhucheng lying in the lower part
      of the formation, and orders the group Linjiazhuang, Xingezhuang,
      Hongtuya and Jiaozhou.
  - id: hu2001a
    notes: >
      Divides the beds into its own Jiangjunding Formation, about 1,000 m at
      Laiyang with Tanius sinensis, and a Jingangkou Formation about 680 m
      thick with Tsintaosaurus, above a Xingezhuang Formation that holds
      Shantungosaurus at Longgujian; the scheme follows a 1995 revision and
      does not use the Hongtuya.
  - id: prieto-márquez2013b
    notes: >
      Gives the Tsintaosaurus bonebed near Chingkankou as "Lower Campanian ...
      Jingangkou Formation, Wangshi Group", the beds the province places in
      the Hongtuya.
  - id: buffetaut1995a
    notes: >
      Records Young's (1958) placement of the locality that yielded the
      Tanius type "in the lower part of the Wangshi Group, below the
      Jingangkou" locality.
  - id: yan2005a
  - id: yan2005b
  - id: young1958a
  - id: xing2014b
  - id: tan1923a
