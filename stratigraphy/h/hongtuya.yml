name: Hongtuya
rank: formation
parent: Wangshi
period: [Late Cretaceous]
stages: [Campanian]
references:
  - id: an2015a
    notes: >
      The formation "was deposited during the Campanian", from a 77.3 Ma
      maximum depositional age for "the dinosaur bone beds of the Hongtuya
      Formation"; the paper also places it in "the Late Cretaceous Wangshi
      Group" and says it "was deposited in the latest Cretaceous".
  - id: yao2026a
    notes: >
      Narrows it to "middle to late Campanian". Where the unit sits within the
      Wangshi Group is contested.
  - id: zhang2019a
    notes: >
      Equates it with the Jingangkou Formation: Yan and Chen (2005) "obtained an
      isotope age of 73 Ma for the Jingangkou Formation (which they called the
      Hongtuya Formation) based on a basalt sample from the town of Daxizhuang in
      Jiaozhou City". The age is relayed, with no method or level given.
  - id: borinder2021a
    notes: >
      Places the formation beneath the Jiangjunding Formation: "A radiometric
      date of 72.9–73.5 Ma was obtained from the uppermost section of the
      underlying Hongtuya Formation (Yan et al., 2005), providing a maximum lower
      age limit for the succession."
  - id: xu2019a
    notes: >
      A field-trip note that visits "the Hongtuya Formation of the Wangshi Group
      between Jiangjuding and Jingangkou", the dinosaur sites of Zhucheng lying
      in the lower part of the formation; its chart places the formation in the
      Wangshi Group without a supporting argument.
  - id: yan2005a
  - id: yan2005b
