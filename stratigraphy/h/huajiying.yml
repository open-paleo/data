name: Huajiying
rank: formation
period: [Early Cretaceous]
stages: [Hauterivian, Barremian]
dispute:
  summary: >
    How Qiaotou relates to this unit is read three ways. Pittman and
    colleagues (2020) equate the names outright, writing "the
    Hauterivian-Barremian Huajiying (Qiaotou) Formation of Hebei, China". Ji
    and colleagues (2005) instead describe Jinfengopteryx from "the middle
    part of the Qiaotou Formation" as a unit in its own right. Xing and
    colleagues (2020) make it a member, placing the vertebrate fossils "in the
    lower part of the formation (Sichakou and Qiaotou members)".
references:
  - id: jin2008a
    notes: >
      Dates the formation Early Cretaceous and sets out its members: the
      bird-bearing beds and the underlying intermediate-basic volcanics are
      assigned to "the Early Cretaceous Huajiying Formation" as its second and
      first members in the Sichakou and Senjitu area, and the Senjitu bird
      localities lie in the Qiaotou sedimentary member of that formation. The
      Protopteryx-bearing lower assemblage is about 130.7 Ma, the earliest
      vertebrate assemblage known in the Jehol Biota, while the age of the
      Qiaotou assemblage "is not very clear yet by now" and the 122.1-126.9 Ma
      figures published for it are "not widely accepted due to lack of
      accuracy".
  - id: xing2020a
    notes: >
      Uses member rank for both the Sichakou and the Qiaotou inside this
      formation, and dates them by 40Ar/39Ar "to the weighted mean age of
      130.7 Mya" in the Sichakou Basin of Fengning Autonomous County, Hebei.
  - id: pittman2020a
    notes: >
      Equates the two names and dates the unit Hauterivian-Barremian, noting
      that Jinfengopteryx from it is the oldest Asian troodontid record and
      "was originally described as an avialan".
  - id: ji2005a
    notes: >
      Never names this unit, and uses a different rank for the part it does
      name. Jinfengopteryx is placed in "the middle part of the Qiaotou
      Formation in Waigoumen area, Fengning County", at formation rank,
      where the registry and the entry's other references make the Qiaotou a
      member within this formation. No stage appears anywhere in it, so the
      reference is a rank datum and a locality rather than an age.
