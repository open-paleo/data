name: Houcheng
rank: formation
period: [Late Jurassic, Early Cretaceous]
stages: [Tithonian, Berriasian]
references:
  - id: butler2011a
    notes: >
      Cites the Xuanhuaceratops description as from "the Upper Jurassic
      Houcheng Formation of Hebei, China". Gives only the series, not a stage.
  - id: han2015a
    notes: >
      Sets it among the Upper Jurassic ceratopsian-bearing units of China,
      though it places the formation in Liaoning rather than Hebei.
  - id: liu2012a
    notes: >
      Treats it as the Hebei name of "the Upper Jurassic-Lower Cretaceous
      Tuchengzi Formation (called the Houcheng Formation in Hebei Province)",
      and dates the Tuchengzi/Houcheng Formation from "the latest Jurassic
      (Tithonian) to the earliest Cretaceous (Berriasian)" on reported ages of
      156 to 139 Ma.
