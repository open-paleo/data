name: Horsethief
rank: member
parent: Horseshoe Canyon
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
references:
  - id: eberth2012a
    notes: >
      One of the "seven mappable members: Strathmore, Drumheller, Horsethief,
      Morrin, Tolman, Carbon, and Whitemud (bottom to top)". No stage is given
      for the member alone; the paper groups it with those above it as the
      interval during which "there were more complex and frequent changes in
      climate, volcanism, orogenesis, landscape weathering, and soil
      formation".
  - id: eberth2020a
    notes: >
      Provisionally places the Campanian–Maastrichtian boundary inside the
      member, in its upper part: "we propose that the C-M boundary lies in the
      upper Horsethief Member, and conservatively assign it an interpolated
      age range of 71.8–71.4 Ma". Interpolates its base at 72.2 ± 0.1 Ma and
      the overlying Horsethief-Morrin boundary at 71.5 ± 0.1 Ma.
