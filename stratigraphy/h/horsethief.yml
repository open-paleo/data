name: Horsethief
rank: member
parent: Horseshoe Canyon
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
lithology: organic-rich shale and coal, lenticular channel sandstone and
  mudstone
references:
  - id: eberth2012a
    notes: >
      One of the "seven mappable members: Strathmore, Drumheller, Horsethief,
      Morrin, Tolman, Carbon, and Whitemud (bottom to top)". No stage is given
      for the member alone; the paper groups it with those above it as the
      interval during which "there were more complex and frequent changes in
      climate, volcanism, orogenesis, landscape weathering, and soil formation".
      Source of the lithology.
  - id: eberth2020a
    notes: >
      Places the Campanian–Maastrichtian boundary in the upper part of the
      member, at an interpolated 71.8–71.4 Ma, and interpolates the member's
      base at 72.2 Ma and its top at 71.5 Ma.
