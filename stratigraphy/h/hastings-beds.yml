name: Hastings Beds
rank: group
parent: Wealden
period: [Early Cretaceous]
stages: [Berriasian, Valanginian, Hauterivian]
references:
  - id: taylor2007a
    notes: >
      Gives "the Berriasian-Valanginian Hastings Beds Group of Ecclesbourne
      Glen, East Sussex, England", and contrasts it with "the Barremian
      Wessex Formation of the Isle of Wight" as the older mainland Wealden.
  - id: barker2023a
    notes: >
      Gives the group's contents and their ages, "the older (late
      Berriasian-early Valanginian) Ashdown Formation, followed by the
      Wadhurst Clay Formation (Valanginian) and Tunbridge Wells Formation
      (late Valanginian)", and makes it "the basal unit of the Wealden
      Supergroup within the Weald sub-basin". Prints the shorter name Hastings
      Group.
  - id: norman2013a
    notes: >
      Heads its stratigraphic review "Hastings Group, Valanginian Stage",
      also using the shorter name.
  - id: galton2009a
    notes: >
      Puts the Grinstead Clay at the top of it -- the finds were made "from
      the Grinsted Clay Formation (later mid-Valangian ...) at the top of the
      Hastings Group" -- spelling both the clay Grinsted and the group
      Hastings.
  - id: naish2007a
    notes: >
      Places the group in the Lower Cretaceous: "the Lower Cretaceous of
      southern England is also noted for the dinosaur-bearing Hastings Beds
      Group, Weald Clay Group and Wealden Group of Kent, Sussex, and the Isle
      of Wight". Its exposures in West and East Sussex, with those of the
      Weald Clay Group, have yielded large theropod and iguanodontian
      material, and it also produces dinosaur remains in Kent.
