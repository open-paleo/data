name: Hupyeongdong
rank: formation
parent: Hayang
period: [Early Cretaceous]
stages: [Albian]
references:
  - id: choi2019a
    notes: >
      Places the formation second in the Hayang Group of the Euiseong
      subbasin, above the Iljik and below the Jeomgok, and divides it: "The
      Hupyeongdong Formation has a thickness of about 500 m and consists of
      the lower Gumidong Member and the upper Gugyedong Member". It dates the
      beds around it by detrital zircon. The underlying Sindong Group's
      Jinju Formation has a maximum depositional age "of about 106 Ma (Lee et
      al., 2010)", and above, "the samples ... from which a meaningful
      maximum depositional age can be obtained are those from the Jeomgok
      Formation (180829-2; 104.9 Ma), the Sagok Formation (180828-6; 99.8
      Ma), and the Banyawol Formation (180828-2; 96 Ma)", with "the
      depositional age of the Sagok Formation ... constrained to about
      100–97 Ma". The formation thus lies between about 106 and 100 Ma, late
      Albian on GTS2020.
  - id: gale2020a
    notes: >
      Puts the base of the Cenomanian at 100.5 Ma.
