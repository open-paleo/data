name: Hupyeongdong
rank: formation
parent: Hayang
period: [Early Cretaceous]
stages: [Albian]
lithology: purple mudstone and siltstone, with interbedded conglomerate and
  mudstone in the lower part
references:
  - id: choi2019a
    notes: >
      Places the formation second in the Hayang Group of the Euiseong subbasin,
      above the Iljik and below the Jeomgok, about 500 m thick, with a lower
      Gumidong and an upper Gugyedong Member. Source of the lithology.
  - id: gale2020a
    notes: >
      Puts the base of the Cenomanian at 100.5 Ma.
  - id: lee2010b
    notes: >
      Cited by Choi and Kwon (2019) for the Jinju Formation's maximum
      depositional age of about 106 Ma.
