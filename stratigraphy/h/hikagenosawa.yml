name: Hikagenosawa
rank: formation
parent: Yezo
period: [Early Cretaceous, Late Cretaceous]
stages: [Albian, Cenomanian]
references:
  - id: oyabu2026a
    notes: >
      Gives the nodosaurid skull as from "the upper part of the marine
      Hikagenosawa Formation (upper Cenomanian) in Yubari City, Hokkaido,
      Japan", preserved in a concretion, and places the unit in the Yezo
      Group, which is "mainly marine deposits" but has produced several
      dinosaurs.
  - id: hayakawa2005a
    notes: >
      The original description of the same specimen, from the Cenomanian of
      the same locality.
  - id: takashima2004a
    notes: >
      Defines it in the Yezo Group as the "Upper Albian-Middle Cenomanian
      mudstone-dominant unit". "The late Albian-middle Cenomanian ammonoids
      Mortoniceras rostratum (Sowerby), Mariella bergeri (Brongniart),
      Mantelliceras saxbii (Sharpe) and Cunningtoniceras cunningtoni (Sharpe)
      occur in the formation", and planktonic foraminifers from it indicate "a
      Late Albian-Late Cenomanian age". Its key-bed table dates the Kanajiri
      Sandstone Member, in the lower middle part of the formation, as latest
      Albian.
