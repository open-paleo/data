name: Hikagenosawa
rank: formation
parent: Yezo
period: [Early Cretaceous, Late Cretaceous]
stages: [Albian, Cenomanian]
lithology: dark gray mudstone, with a thin interbedded sandstone and
  conglomerate unit
references:
  - id: oyabu2026a
    notes: >
      Gives the nodosaurid skull as from "the upper part of the marine
      Hikagenosawa Formation (upper Cenomanian) in Yubari City, Hokkaido,
      Japan", preserved in a concretion, and places the unit in the Yezo
      Group, which is "mainly marine deposits" but has produced several
      dinosaurs.
  - id: hayakawa2005a
    notes: >
      The original description of the same specimen, from the Cenomanian of
      the same locality.
  - id: takashima2004a
    notes: >
      Redefines the formation in the Yezo Group as the "Upper Albian–Middle
      Cenomanian mudstone-dominant unit" and dates it by ammonoids and
      planktonic foraminifers. Source of the lithology.
