name: Himes
rank: member
parent: Cloverly
period: [Early Cretaceous, Late Cretaceous]
stages: [Albian, Cenomanian]
references:
  - id: tanaka2024a
    notes: >
      Gives "Himes Member of the Cloverly Formation in Wyoming, USA (Albian
      ...)".
  - id: d'emic2019a
    notes: >
      The flora of the Himes Member "dates to the middle Albian–earliest
      Cenomanian". Detrital zircons give maximum depositional ages of 107.0 ±
      1.3 Ma near the base of the member south of Cody and 103.6 ± 1.3 Ma for
      its fluvial sandbody northwest of Lovell, and the paper puts the Himes
      Member and Greybull Sandstone together in "the mid–late Albian to early
      Cenomanian (ca. 109–98 Ma)".
  - id: ostrom1970a
    notes: >
      Correlates the member with two of its own Cloverly units: "the Himes
      Member equals Units VI and VII", the member having been named by
      Moberly (1960) "based on exposures along the west limb of Little Sheep
      Anticline between Himes and Lovell, Wyoming". Dates the Cloverly "most
      probably" from "late Aptian (Unit V?) to Early Albian (Unit VII?)", the
      Aptian a probable maximum from ostracods and charophytes and the Middle
      Albian a minimum from the overlying Thermopolis Shale.
  - id: moberly1960a
