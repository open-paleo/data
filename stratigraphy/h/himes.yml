name: Himes
rank: member
parent: Cloverly
period: [Early Cretaceous, Late Cretaceous]
stages: [Albian, Cenomanian]
references:
  - id: tanaka2024a
    notes: >
      Gives "Himes Member of the Cloverly Formation in Wyoming, USA (Albian".
  - id: d'emic2019a
    notes: >
      The flora of the Himes Member "dates to the middle Albian–earliest
      Cenomanian". Detrital zircons give maximum depositional ages of 107.0 ±
      1.3 Ma near the base of the member south of Cody and 103.6 ± 1.3 Ma for
      its fluvial sandbody northwest of Lovell, and the paper puts the Himes
      Member and Greybull Sandstone together in "the mid–late Albian to early
      Cenomanian (ca. 109–98 Ma)".
