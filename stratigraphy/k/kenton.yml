name: Kenton
rank: member
parent: Morrison
period: [Late Jurassic]
stages: [Kimmeridgian, Tithonian]
references:
  - id: danison2024a
    notes: >
      Uses member rank, the Saurophaganax material having been "recovered
      from the Kenton 1 Quarry in the Kenton Member of the Upper Jurassic
      Morrison Formation of Oklahoma".
  - id: chure1995a
    notes: >
      Gives the same quarry without the member name, "Quarry 1, Morrison
      Formation, east of Kenton, Cimarron County, OK", the position "12.04m
      (39. 5feet) below top of the Morrison Fm."
  - id: carrano2012a
    notes: >
      Correlates that level, "Stovall Quarry 1, east of Kenton, Cimarron
      County, Oklahoma, USA; upper Brushy Basin Member equivalent,
      Morrison Formation; ?Tithonian, Late Jurassic". The queried
      Tithonian is an older chart's label. Kirkland and colleagues (2016)
      report 150.00 ± 0.52 Ma from near the top of the Brushy Basin Member in
      Utah, Kimmeridgian on the ICS chart v2024/12, and 148.96 Ma from an
      ash about 9 m below the base of the overlying Naturita Formation,
      Tithonian only at its central value; the dates reach this member
      through that correlation.
  - id: kirkland2016a
    notes: >
      Reports, from earlier work, the youngest Morrison ages in Utah: 148.96
      Ma "from a volcanic ash bed about 9 m below the base of the Naturita
      Formation", and 150.00 ± 0.52 Ma "from near the top of the Brushy Basin
      Member". These reach this member through its correlation with the upper
      Brushy Basin.
