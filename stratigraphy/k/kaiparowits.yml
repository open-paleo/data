name: Kaiparowits
rank: formation
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
description: "The Kaiparowits Formation is a sedimentary rock formation found in the Kaiparowits Plateau in Grand Staircase–Escalante National Monument, in the southern part of Utah in the western United States. It is over 2800 feet (850 m) thick, and is Campanian in age. This Upper Cretaceous formation was formed from alluvial floodplains of large rivers in coastal southern Laramidia; sandstone beds are the deposit of rivers, and mudstone beds represent floodplain deposits. It is fossiliferous, with most specimens from the lower half of the formation, but exploration is only comparatively recent, with most work being done since 1982. It has been estimated that less than 10% of the Kaiparowits formation has been explored for fossils."
references:
  - id: wiersma2018a
    notes: >
      Gives a "late Campanian" age for the formation.
  - id: sullivan2006c
    notes: >
      Assigns "a Campanian age based on analysis of palynomorphs and the
      absence of Maastrichtian" indicators.
  - id: loewen2013b
    notes: >
      Gives "the Upper Cretaceous Wahweap and Kaiparowits formations of
      southern Utah", the Kaiparowits "dating to ~76.6–74.5 Ma" and "divided
      into three informal units: lower, middle, and upper".
  - id: sullivan1999b
    notes: >
      "The Kaiparowits Formation has been correlated to the early
      Maastrichtian (Gregory and Moore, 1931) and the late Maastrichtian
      (Lohrengel, 1969) on the basis of invertebrates and pollen,
      respectively", but sides with Eaton (1991), for whom the palynomorph and
      mammal data "supported a Campanian age for this formation" and "the
      Kaiparowits is late early(?) to late Campanian". The lower third, source
      of two referred specimens of Parasaurolophus cyrtocristatus, "has been
      interpreted as Judithian age, but remains equivocal".
  - id: eaton1991a
  - id: gregory1931a
    notes: >
      Cited by Sullivan and Williamson (1999) for an early Maastrichtian
      correlation of the formation from invertebrates.
  - id: lohrengel1969a
    notes: >
      Cited by Sullivan and Williamson (1999) for a late Maastrichtian
      correlation of the formation from pollen.
