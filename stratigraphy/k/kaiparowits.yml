name: Kaiparowits
rank: formation
period: [Late Cretaceous]
stages: [Campanian]
lithology: friable sandstone and mudstone in about equal amounts
references:
  - id: wiersma2018a
    notes: >
      Gives a "late Campanian" age for the formation.
  - id: sullivan2006c
    notes: >
      Assigns "a Campanian age based on analysis of palynomorphs and the
      absence of Maastrichtian" indicators.
  - id: loewen2013b
    notes: >
      Gives "the Upper Cretaceous Wahweap and Kaiparowits formations of
      southern Utah", the Kaiparowits "dating to ~76.6–74.5 Ma" and "divided
      into three informal units: lower, middle, and upper".
  - id: sullivan1999b
    notes: >
      Reports early and late Maastrichtian correlations of the formation and
      Eaton's (1991) Campanian age, and calls the age of the lower third, which
      yielded two Parasaurolophus specimens, "equivocal".
  - id: eaton1991a
    notes: >
      Re-examines Lohrengel's (1969) pollen and dates the formation "middle to
      late Campanian", adding that "no evidence suggests that the Kaiparowits
      Formation is younger than Campanian". Source of the lithology.
  - id: gregory1931a
    notes: >
      Names the formation and gives it as "of very late Montana age",
      corresponding to the Fruitland, from its molluscs; it names no
      international stage.
  - id: lohrengel1969a
    notes: >
      Dates the formation from its pollen as "upper Lancian to Hell Creekian,
      or upper Maestrichtian"; Eaton (1991) re-examines the identifications
      and finds them Campanian.
