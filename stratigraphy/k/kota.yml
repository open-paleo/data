name: Kota
rank: formation
period: [Early Jurassic, Middle Jurassic]
stages: [Sinemurian, Pliensbachian, Toarcian, Aalenian]
lithology: coarse sandstone grading to siltstone and mudstone, with marl and
  limestone above
dispute:
  summary: >
    The age is unresolved and the estimates are not all stage-level.
    Bandyopadhyay and colleagues (2010) give "the Early Jurassic Kota
    Formation (Sinemurian to Pliensbachian) of India". Kareem and colleagues
    (2024) report that "the precise age of the Kota Formation has long
    remained unresolved" and that "most estimates ... are based on faunal data
    and range from the Early to Middle Jurassic".
references:
  - id: bandyopadhyay2010a
    notes: >
      Calls it "the Early Jurassic Kota Formation (Sinemurian to Pliensbachian)"
      in the abstract but also "Early to early Middle Jurassic". Records that
      "on the basis of fishes, the Kota Formation has long been considered to be
      of Liassic age", and that Bandyopadhyay and Roychowdhury (1996) and
      Bandyopadhyay and Sengupta (2006) suggested the Lower Kota ranges from
      Sinemurian to Pliensbachian, "while the age of the upper Kota is Toarcian
      and may even be extended to Middle Jurassic (?Aalenian)". Describes its
      rock: "shows a more or less uniform lithology throughout the valley (Table
      2). [...] divided the Kota Formation into two lithological units. The
      lower unit includes 15–25 m of thick, hard, compact and coarse sandstone,
      which is pebbly in places. This sandstone becomes finer and grades both
      laterally and vertically into finer siltstone and mudstones. The upper
      part of the Kota Formation includes marl and 1–2 m thick limestone beds".
  - id: kareem2024a
    notes: >
      States that the age remains unresolved and that most estimates rest on
      faunal data.
  - id: rincón2022a
    notes: >
      Reports that the formation's "age estimate has varied from Early
      Jurassic to Early Cretaceous depending upon the biostratigraphic
      indicator", and that an "Early–Middle Jurassic age is currently accepted
      for the upper part of the Kota Formation", where Kotasaurus and
      Barapasaurus were collected.
  - id: bandyopadhyay1996a
  - id: bandyopadhyay2006a
