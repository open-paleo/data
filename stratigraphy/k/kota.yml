name: Kota
rank: formation
period: [Early Jurassic, Middle Jurassic]
stages: [Sinemurian, Pliensbachian, Toarcian, Aalenian]
lithology: coarse sandstone grading to siltstone and mudstone, with marl and
  limestone above
references:
  - id: bandyopadhyay2010a
    notes: >
      Dates the formation "Early to early Middle Jurassic": the lower Kota,
      source of Barapasaurus, Sinemurian to Pliensbachian, and the upper Kota
      Toarcian, perhaps Aalenian. Source of the lithology.
  - id: kareem2024a
    notes: >
      States that the age remains unresolved and that most estimates rest on
      faunal data.
  - id: rincón2022a
    notes: >
      Reports that the formation's "age estimate has varied from Early
      Jurassic to Early Cretaceous depending upon the biostratigraphic
      indicator", and that an "Early–Middle Jurassic age is currently accepted
      for the upper part of the Kota Formation", where Kotasaurus and
      Barapasaurus were collected.
  - id: bandyopadhyay1996a
  - id: bandyopadhyay2006a
    notes: >
      Reports that Bandyopadhyay and Roy Chowdhury (1996) gave the formation
      an age "ranging from Hettangian to Toarcian", and itself dates the lower
      Kota Sinemurian to Pliensbachian and the upper Kota Toarcian to probably
      ?Aalenian.
