name: Kalazha
rank: formation
variants: [Kalaza, Karaza]
period: [Late Jurassic, Early Cretaceous]
stages: [Kimmeridgian, Tithonian]
dispute:
  summary: >
    Kimmeridgian, or Late Jurassic into the Early Cretaceous. Deng and
    colleagues (2015) date the formation late Kimmeridgian in the Honggou
    section on the Manas River, inferring the age from the dated top of the
    underlying Qigu Formation and the rapid deposition of alluvial-fan
    conglomerate, and find the Tithonian missing at the unconformity beneath
    the Tugulu Group. Eberth and colleagues (2001), in the Manas section, see
    a conformable passage up into the Qingshuihe Formation and its Early
    Cretaceous clam shrimp, and conclude that the Jurassic–Cretaceous boundary
    lies at the base of or within the formation, so that it "is not entirely
    Late Jurassic in age". Both works describe the Junggar Basin; none dates
    the Kalazha of the Turpan Basin, which yielded the taxa recorded here.
references:
  - id: deng2015a
    notes: >
      Dates the formation late Kimmeridgian in the Honggou section, Manas
      River, from the age of the underlying Qigu Formation, and finds the
      Tithonian missing at the unconformity with the Tugulu Group above.
  - id: eberth2001a
    notes: >
      Spells the unit Kalaza; its conformable contact with the Early Cretaceous
      Qingshuihe Formation at Manas "suggests that the Jurassic–Cretaceous
      boundary occurs at the base of or within the Kalaza Formation".
  - id: upchurch2021a
    notes: >
      Gives "Lower part of the Kalazha Formation (Upper Jurassic: upper
      Kimmeridgian-Tithonian) of Qiketai, Shanshan County, Turpan Basin", and
      records a provenance disagreement: the authors "have not been able to
      establish the basis for Xing et al.'s assertion that the Hudiesaurus
      specimens were found in the Qigu rather than the Kalazha Formation".
  - id: upchurch2004a
    notes: >
      Tabulates the Hudiesaurus type as Tithonian.
  - id: fang2015a
    notes: >
      Places the Kalazha at the top of the Upper Jurassic of the southern
      Junggar Basin and describes its conglomerates as alluvial fan deposits
      marking rapid uplift of the Tian Shan.
  - id: xing2015a
  - id: wings2012a
    notes: >
      Prints the unit in the Turpan Basin as "the Late Jurassic Karaza
      Formation", after Dong (1997).
  - id: dong1997d
