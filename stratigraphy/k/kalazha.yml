name: Kalazha
rank: formation
period: [Late Jurassic]
stages: [Kimmeridgian, Tithonian]
references:
  - id: upchurch2021a
    notes: >
      Gives "Lower part of the Kalazha Formation (Upper Jurassic: upper
      Kimmeridgian-Tithonian) of Qiketai, Shanshan County, Turpan Basin", and
      records a provenance disagreement: the authors "have not been able to
      establish the basis for Xing et al.'s assertion that the Hudiesaurus
      specimens were found in the Qigu rather than the Kalazha Formation".
  - id: upchurch2004a
    notes: >
      Tabulates the Hudiesaurus type as Tithonian.
  - id: fang2015a
    notes: >
      The youngest Jurassic unit of the southern Junggar Basin, the "Upper
      Jurassic Kalazha Formation" of a succession that consists of "the Lower
      Jurassic Badaowan Formation, the Middle Jurassic Sangonghe and Xishanyao
      Formations, and the Upper Jurassic Toutunhe, Qigu and Kalazha
      Formations". Its "thick, poorly sorted and matrix-supported
      conglomerates with a series of coarsening-upward sequences" are alluvial
      fan deposits that reworked the underlying sedimentary strata, marking
      rapid tectonic uplift of the Tian Shan and rapid lake regression.
