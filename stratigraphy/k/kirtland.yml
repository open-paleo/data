name: Kirtland
rank: formation
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
lithology: siltstone and sandstone
references:
  - id: dalman2025a
    notes: Gives "Kirtland Formation, Upper Cretaceous (late Campanian)".
  - id: ford2000a
    notes: >
      Gives "Kirtland Formation, Maastrichtian".
  - id: fassett1997a
    notes: >
      Dates the C33n–C32r polarity reversal in the Farmington Member at Hunter
      Wash to 73.50 ± 0.18 Ma, and judges the area's vertebrates of limited
      value for dating the formation.
  - id: hunt1992a
    notes: >
      Names the Bisti, Hunter Wash and De-na-zin Members, and dates the members
      below the Naashoibito "Edmontonian (early Maastrichtian)" and the
      Naashoibito Lancian. Source of the lithology.
  - id: baltz1966a
    notes: >
      Names the Naashoibito a member of the Kirtland Shale "because of
      lithologic and faunal similarity to the Kirtland", and dates the
      formation Montana, older than the Lance.
