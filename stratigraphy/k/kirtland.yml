name: Kirtland
rank: formation
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
references:
  - id: dalman2025a
    notes: Gives "Kirtland Formation, Upper Cretaceous (late Campanian".
  - id: ford2000a
    notes: >
      Gives "Kirtland Formation, Maastrichtian".
  - id: fassett1997a
    notes: >
      Hunt and Lucas (1992) concluded that "the lower Kirtland is Edmontonian
      (early Maestrichtian) in age", whose figure 11 shows all of the upper
      Kirtland Shale to be Edmontonian as well. Cautions that the abundant
      vertebrates near the Hunter Wash section, where the C33n-C32r polarity
      reversal falls within the Kirtland Shale, are of limited value in fixing
      its age, the faunal data being difficult to interpret "because of the
      endemic nature of taxa and uncertainties in differentiating between
      geographic and age differences in faunal assemblages".
  - id: hunt1992a
    notes: >
      Puts the whole formation in the Maastrichtian and declines to carry the
      Campanian up into it: "Diverse evidence indicates that the Fruitland is
      of Judithian (late Campanian) age, the pre-Naashoibito Kirtland is of
      Edmontonian (early Maastrichtian) age and the Naashoibito is of Lancian
      (late Maastrichtian) age." Of the marine invertebrates that date the
      Fruitland below, "it is not possible to further deduce that the marine
      invertebrates indicate that the entire Kirtland is also late Campanian
      in age". The reading of each vertebrate biochron as a stage is the
      paper's own. Names the Bisti, Hunter Wash and De-na-zin members and
      moves the Naashoibito here from the Fruitland.
