name: Kem Kem
rank: group
period: [Early Cretaceous, Late Cretaceous]
stages: [Albian, Cenomanian]
dispute:
  summary: >
    Two naming systems are live for these beds and both name real rock.
    Ibrahim and colleagues (2020) erect the Gara Sbaa and Douira formations
    for the Kem Kem itself, arguing the units there are mappable and
    distinctive, and correlate them with Dubar's Ifezouane and Aoufous, which
    were erected on the eastern flank of the High Atlas and applied to the
    Kem Kem by later workers including Smyth and colleagues (2020). So
    Ifezouane corresponds to Gara Sbaa and Aoufous to Douira, but they are
    correlatives from different areas rather than alternative spellings, and
    reading a source that says Ifezouane means applying the correlation. The
    age is unsettled in its own right: Smyth and colleagues report that it
    "remains controversial, with an Albian or Early Cenomanian age being
    considered likely by most recent workers".
references:
  - id: sereno1996a
    notes: >
      The beds take their name here: "We informally recognize this distinct,
      nonmarine deltaic facies as the Kem Kem beds, which can be divided
      equally into two units that together attain a maximum thickness of
      approximately 200 m", in place of the informal lower red sandstone unit
      and upper marly unit that Choubert described for the region. "Nine
      elasmobranch species strongly support a Cenomanian age for the deposit",
      about 93 million years ago, and the beds rest erosionally on Paleozoic
      strata beneath a carbonate platform of Late Cenomanian through Turonian
      age.
  - id: evers2015a
    notes: >
      Reads the Kem Kem as Cenomanian: after reviewing Choubert's, Dubar's and
      Cavin and colleagues' schemes for southeastern Morocco, it holds that
      "the Kem Kem assemblage is Cenomanian, and most likely Early Cenomanian
      in age", the traditional reading having been "Infracenomanien", at the
      base of the Cenomanian. Cavin and colleagues (2010) are followed in
      finding no evidence for pre-Cenomanian fossils at the base of the
      Cretaceous series, and the shark and dinosaur assemblages match the
      Early Cenomanian Bahariya Formation. The Albian ages that appear in the
      paper belong to Algerian localities such as Gara Samani, not to the Kem
      Kem.
  - id: ibrahim2020a
    notes: >
      The dedicated treatment, titled "Geology and paleontology of the Upper
      Cretaceous Kem Kem Group of eastern Morocco", which is where the group
      rank and the two-formation subdivision come from.
  - id: smyth2020a
    notes: >
      Uses the Ifezouane and Aoufous names, and states the age controversy
      quoted above.
