name: Kaladongar
rank: formation
period: [Early Jurassic, Middle Jurassic]
stages: [Pliensbachian, Toarcian, Aalenian, Bajocian]
lithology: basal conglomerate overlain by mixed siliciclastic and carbonate beds
references:
