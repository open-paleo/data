name: Kaladongar
rank: formation
period: [Early Jurassic, Middle Jurassic]
stages: [Pliensbachian, Toarcian, Aalenian, Bajocian]
references:
  - id: natarajan2026a
    notes: >
      Describes a diminutive neosauropod from "the ?upper Lower Jurassic
      (Pliensbachian) to Bajocian strata of the Kaladongar Formation (Khadir
      Uplift), Kachchh Basin, India". On the restructured lithostratigraphy of
      Fürsich and colleagues (2023), which divides the formation at the Khadir
      Uplift into the Cheriya Bet Conglomerate, Mouwana Variegated, Lower
      Flagstone and Middle Sandstone members, it spans "an age duration from
      the ? upper Lower Jurassic (poorly constrained; possibly as early as
      Pliensbachian) to upper Bajocian". The fossil-bearing section near
      Amrapar village, at the transition from the upper Mouwana Variegated
      Member to the Lower Flagstone Member, is itself "poorly constrained and
      may range from somewhere between ?upper Lower Jurassic to Bajocian".
  - id: weishampel2004a
    notes: >
      A reference work, tabulating the unit in Gujarat as Aalenian to
      Bathonian on Satyanarayana and colleagues (1999).
  - id: satyanarayana1999a
    notes: >
      The oldest stratigraphic unit of Kutch, a thick sequence of
      conglomerate, sandstone and shale exposed in the Kaladongar (black
      hills) range of Patcham Island, "referable to ?Aalenian-Early Bajocian
      age (earliest Middle Jurassic)" and subdivided on lithology into three
      informal members: the lowest Dingi Hill, the middle Kaladongar Sandstone
      and the upper Babia Cliff Sandstone. The dinosaur bones and petrified
      tree trunks reported here come from the lowest sandstone beds at Kuar
      Bet, rocks lithologically similar to the Dingi Hill Member although
      exact correlation is not possible for want of marker beds.
