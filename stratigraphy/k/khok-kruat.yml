name: Khok Kruat
rank: formation
period: [Early Cretaceous]
stages: [Barremian, Aptian, Albian]
lithology: siltstone, mudstone, sandstone and conglomerate, with calcareous
  nodules
references:
  - id: buffetaut2011a
    notes: >
      Gives "Khok Kruat Formation (Early Cretaceous, Aptian)".
  - id: sethapanichsakul2026a
    notes: >
      Gives the formation as Aptian–Albian: "Palynomorph data indicate an
      upper Aptian age, with the possibility that the upper part of the
      formation extends into the Albian based on the overlying
      Albian–Cenomanian Mahasarakham Formation". Its vertebrate fauna "shows
      similarities to that of the Aptian Xinlong Formation of China".
  - id: racey1996a
    notes: >
      Reassigns the Khorat Group formations to the Early Cretaceous on
      palynology, and suggests that the formation is "Lower Cretaceous (?Aptian)
      in age".
  - id: sattayarak1991a
  - id: shibata2011a
    notes: >
      Considers the formation's age undetermined "because of lack of any crucial
      fossils" and follows an Aptian age. Source of the lithology.
  - id: jia2022a
    notes: >
      Places the formation below an angular unconformity with the Maha Sarakham
      Formation, and calls it Cretaceous in its stratigraphic summary and Upper
      Cretaceous once in passing.
  - id: hasegawa2010a
  - id: ridd2011a
