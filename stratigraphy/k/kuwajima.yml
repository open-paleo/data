name: Kuwajima
rank: formation
parent: Tetori
period: [Early Cretaceous]
stages: [Berriasian, Valanginian, Hauterivian, Barremian]
references:
  - id: averianov2005a
    notes: >
      Cites the dedicated treatment of the site, "Fossils of the Kuwajima
      'Kaseki-kabe' (fossil-bluff). Scientific report on a Neocomian (Early
      Cretaceous) fossil assemblage from the Kuwajima Formation". Gives only a
      Neocomian age, an informal grouping of stages rather than a stage.
  - id: chinzorig2025a
    notes: >
      Cites the Albalophosaurus description as from "the Lower Cretaceous
      Kuwajima Formation of Japan".
  - id: sano2017a
    notes: >
      Infers a Barremian age for the Kaseki-kabe locality in the uppermost
      part of the formation because "it is younger than the age of the last
      brackish horizon (lower part of the Kuwajima Formation, late
      Hauterivian), and earlier than the Barremian-Aptian Akaiwa Formation".
  - id: ohashi2009a
    notes: >
      The formation is "tentatively regarded as Valanginian–Hauterivian in
      age", with the upper Itoshiro Subgroup placed in the Early Cretaceous
      from the ammonite-dated Kuzuryu Subgroup below, the uppermost Barremian
      to Aptian Kitadani Formation above, and a bivalve correlation with the
      Hauterivian Ryoseki Formation. The Albalophosaurus type comes from the
      "uppermost Kuwajima Formation, Lower Cretaceous
      (Valanginian–Hauterivian)".
  - id: wilson2005a
    notes: >
      Tabulates the formation, source of an unnamed titanosauriform, as
      "?Berriasian-?Hauterivian" after Barrett and colleagues (2002), with
      both bounds queried.
