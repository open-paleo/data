name: Kuwajima
rank: formation
parent: Tetori
variants: [Kuwashima]
lithology: alternating sandstone, mudstone and shale
period: [Early Cretaceous]
stages: [Berriasian, Valanginian, Hauterivian, Barremian]
references:
  - id: averianov2005a
    notes: >
      Cites the dedicated treatment of the site, "Fossils of the Kuwajima
      'Kaseki-kabe' (fossil-bluff). Scientific report on a Neocomian (Early
      Cretaceous) fossil assemblage from the Kuwajima Formation". Gives only a
      Neocomian age; Gale and colleagues (2020) resolve the Neocomian into
      "the Berriasian, Valanginian and Hauterivian".
  - id: chinzorig2025a
    notes: >
      Cites the Albalophosaurus description as from "the Lower Cretaceous
      Kuwajima Formation of Japan".
  - id: sano2017a
    notes: >
      Infers a Barremian age for the Kaseki-kabe locality in the uppermost
      part of the formation because "it is younger than the age of the last
      brackish horizon (lower part of the Kuwajima Formation, late
      Hauterivian), and earlier than the Barremian-Aptian Akaiwa Formation".
  - id: ohashi2009a
    notes: >
      Regards the formation as "tentatively" Valanginian–Hauterivian, from the
      units above and below it and a bivalve correlation with the Hauterivian
      Ryoseki Formation. Source of the lithology.
  - id: wilson2005a
    notes: >
      Tabulates the formation, source of an unnamed titanosauriform, as
      "?Berriasian-?Hauterivian" after Barrett and colleagues (2002), with
      both bounds queried.
  - id: barrett2002a
  - id: gale2020a
  - id: sano2015a
    notes: >
      Gives the name as "Kuwajima (or Kuwashima)" in the Tetori Group restricted
      to the Early Cretaceous, and assigns the Kaseki-kabe vertebrate bed in its
      upper part to the Barremian.
