name: Khodzhakul
rank: formation
period: [Early Cretaceous, Late Cretaceous]
stages: [Albian, Cenomanian]
references:
  - id: nessov1997a
    notes: >
      Splits the unit between two faunal assemblages: "In the Khodzhakul'skian
      suite of Southwestern Kyzylkums, two faunistic complexes are
      established: the Khodzhakul' complex (lower and middle parts of the
      suite) of the Late Albian, and the Shejkhdjejli complex (upper part of
      the suite) of the Early Cenomanian." The locality catalog follows that
      split, giving the upper part as lower Cenomanian at Sheikhdjeli II,
      Khodzhakul'sai, Ayazkala and Kyrkkyz, and the lower or middle part as
      upper Albian at Khodzhakul I and Parlykala. Records that "Until the
      discovery here of shark remains, the entire Khodzhakul Suite was dated
      to the Cenomanian", and corrects an earlier reading of the Chelpyk beds,
      placing them in the "Upper part of the Khodzhakul Formation (but not the
      lower part of the Beshtybinsk Formation, Nessov, 1977a), Cenomanian".
  - id: averianov2025c
    notes: >
      Gives "the lower Cenomanian Khodzhakul Formation" in Uzbekistan, the
      third ecosystem known to contain both carcharodontosaurid and
      tyrannosauroid apex predators.
  - id: nessov1995a
    notes: >
      Gives a holotype horizon in the "Upper Cretaceous, lower Cenomanian,
      upper part of the Khodzhakul Formation", at the northern edge of the
      Sheikhdzheili Mountains, and dates the lower part of the formation
      "Lower Cretaceous, lower middle Albian" and its lower or middle part
      "Lower Cretaceous, upper Albian".
  - id: tong2021a
    notes: >
      Cenomanian in a review of macrobaenid turtle occurrences:
      Tienfucheloides is placed in the "Khodzhakul Formation (Cenomanian),
      Uzbekistan" after Danilov and colleagues (2018), the same turtle being
      called elsewhere in the paper one "from the Late Cretaceous of
      Uzbekistan".
  - id: danilov2018a
