name: Klettgau
rank: formation
period: [Late Triassic]
stages: [Carnian, Norian, Rhaetian]
references:
  - id: sues2025a
    notes: >
      Gives "the Klettgau Formation (lower to middle Rhaetian) of
      Füllinsdorf-Schönthal ... near Basel", and treats the Swiss unit as
      correlative with the German Exter Formation.
  - id: rauhut2020a
    notes: >
      Says the type material most probably came from the uppermost part of
      what is "now called Gruhalde Member of the Klettgau Formation, uppermost
      Norian", after Jordan and colleagues (2016), and that the Bratelen
      Bonebeds on top of that member record an erosional event "at the end or
      after the deposition of the Gruhalde Member (late Norian?)". Contrasts
      them with the sandy bonebeds of the Belchen Member of the Klettgau
      Formation "in Canton Baselland and Solothurn", dated "by
      palynostratigraphy to lower, middle and upper Rhaetian".
  - id: jordan2016a
    notes: >
      Formally defines the unit and its six members, from the Ergolz Member at
      the base to the Belchen Member at the top, and gives its
      chronostratigraphic age as "Carnian to Rhaetian", after the Deutsche
      Stratigraphische Kommission and Kozur and Bachmann (2008); the abstract
      instead calls it "the Norian to Rhaetian Klettgau Formation". The
      Gansingen Member "starts with partly porous dolomite with Carnian
      bivalves".
