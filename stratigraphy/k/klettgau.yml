name: Klettgau
rank: formation
period: [Late Triassic]
stages: [Carnian, Norian, Rhaetian]
lithology: variegated silty shale and dolocrete, with sandstone and dolomite
references:
  - id: sues2025a
    notes: >
      Gives "the Klettgau Formation (lower to middle Rhaetian) of
      Füllinsdorf-Schönthal ... near Basel", and treats the Swiss unit as
      correlative with the German Exter Formation.
  - id: rauhut2020a
    notes: >
      Derives the type material of its new sauropodiform from the top of the
      Gruhalde Member, "uppermost Norian", and contrasts its bonebeds with the
      Rhaetian ones of the Belchen Member.
  - id: jordan2016a
    notes: >
      Formally defines the formation and its six members, from the Ergolz at the
      base to the Belchen at the top, and dates it "Carnian to Rhaetian". Source
      of the lithology.
  - id: kozur2008a
