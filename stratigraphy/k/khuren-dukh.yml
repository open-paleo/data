name: Khuren Dukh
rank: formation
period: [Early Cretaceous]
stages: [Barremian, Aptian, Albian]
references:
  - id: ito2006a
    notes: >
      Erects it: the Choyr Basin infill "is newly defined as the Khalzan Uul
      and Khuren Dukh formations based on detailed mapping of lateral and
      vertical variations in component lithofacies assemblages". Reports that
      earlier studies "concluded that the age of the Khuren Dukh Formation is
      either Aptian-Albian or middle-late Albian", later refined "as late
      Albian, based on new palynological data". The strata had previously been
      assigned to the Shinekhudag or Zuunbayan formations, a reassignment
      rather than a renaming.
  - id: makovicky2006a
    notes: >
      Reports that the Khuren Dukh beds "have been interpreted as Aptian–early
      Albian in age" but "have also been dated as Barremian" by Shuvalov
      (2000).
  - id: nichols2006a
    notes: >
      Takes a "latest Early Cretaceous (Albian) age for the Khuren Dukh
      Formation" from Asteropollis asteroides pollen, recovered in samples
      from its informal middle member, and says the pollen's co-occurrence
      with Tricolpites "confirms the age of the Khuren Dukh Formation as
      middle to late Albian".
  - id: shuvalov2000a
    notes: >
      Spells the locality Huren Dukh, which is why a search on the entry's
      form returns nothing, and gives no Barremian for it. Three independent
      lines all agree on the same span: "Iguanodon orientalis is similar to a
      specimen previously described from the Khamaryn Khural region ... from
      the Aptian-Albian", "The molluscs are characteristic of the
      Aptian-Albian", and the spore-pollen assemblage. So this reference
      supports the Aptian and Albian only.
