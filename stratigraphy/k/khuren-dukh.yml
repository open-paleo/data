name: Khuren Dukh
rank: formation
period: [Early Cretaceous]
stages: [Aptian, Albian]
variants: [Hüren Dukh]
lithology: coarse-grained and pebbly sandstone, with mudstone
references:
  - id: ito2006a
    notes: >
      Erects the formation for the Choyr Basin strata earlier mapped as the
      Shinekhudag Formation, and relays an age of Aptian–Albian or middle–late
      Albian. It credits Nichols and colleagues (2006) with "late Albian",
      narrower than the middle to late Albian they give the formation. Source
      of the lithology.
  - id: makovicky2006a
    notes: >
      Reports that the Khuren Dukh beds "have been interpreted as Aptian–early
      Albian in age" but "have also been dated as Barremian" by Shuvalov
      (2000). Shuvalov (2000) gives the Hüren Dukh succession as Aptian-Albian
      and dates no Khuren Dukh beds to the Barremian, so the attribution adds
      no stage.
  - id: nichols2006a
    notes: >
      Takes a "latest Early Cretaceous (Albian) age for the Khuren Dukh
      Formation" from Asteropollis asteroides pollen, recovered in samples
      from its informal middle member, and says the pollen's co-occurrence
      with Tricolpites "confirms the age of the Khuren Dukh Formation as
      middle to late Albian".
  - id: shuvalov2000a
    notes: >
      Spells the locality Huren Dukh, and gives no Barremian for it. Three
      independent lines all agree on the same span: "Iguanodon orientalis is
      similar to a specimen previously described from the Khamaryn Khural
      region ... from the Aptian-Albian", "The molluscs are characteristic of
      the Aptian-Albian", and the spore-pollen assemblage. So it supports the
      Aptian and Albian only.
