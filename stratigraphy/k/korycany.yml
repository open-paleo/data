name: Korycany
rank: member
parent: Peruc-Korycany
period: [Late Cretaceous]
stages: [Cenomanian]
references:
  - id: čech2011a
    notes: >
      Upper Cenomanian ammonite zones: "Ammonites of Calycoceras guerangeri and
      Metoicoceras geslinianum zones of the Upper Cenomanian are known from the
      Korycany and Pecínov members of the Peruc-Korycany Formation".
  - id: caracciolo2009a
    notes: >
      Describes the "shallow-marine Korycany Member" of the Peruc-Korycany
      Formation.
  - id: fejfar2005a
    notes: >
      Calls the unit the Korycany Beds "of the local stratigraphic column",
      late Cenomanian marine sandstones and organodetritic limestones whose
      boundary with the Peruc Beds "is irregular".
  - id: svoboda1989a
    notes: >
      Records that the rank of the Korycany beds was then unsettled: "the
      question of elevating the Korycan beds to formation rank remains
      unresolved" (translated), and uses an informal "sedimentary unit".
