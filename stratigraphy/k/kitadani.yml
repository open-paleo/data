name: Kitadani
rank: formation
period: [Early Cretaceous]
stages: [Hauterivian, Barremian, Aptian, Albian]
references:
  - id: azuma2010a
    notes: >
      Reports that its nonmarine molluscs "indicate that it belongs to
      Hauterivian to early Aptian in age", and that the formation "could be
      assigned to Barremian" on the occurrence of Nippononaia ryosekiana, the
      reading it uses for the type horizon, "The Kitadani Formation (Akaiwa
      subgroup, Tetori Group) of the Early Cretaceous (Barremian)".
  - id: you2009a
    notes: >
      Gives "Kitadani Formation (Aptian-Albian)".
beds:
  - name: Bonebed I
    informal: true
    period: [Early Cretaceous]
    stages: [Aptian]
    references:
      - id: shibata2015b
        notes: >
          Names it the lowest of the quarry's bonebeds: "At least four bonebeds
          are recognized at this locality", of which "The lowermost one, the
          Bonebed I (BB I), has yielded Fukuiraptor, Fukuisaurus, other dinosaur
          bones and teeth, and other vertebrates including crocodilians, turtles
          and fishes". Follows Behrensmeyer's (2007) definition of bonebed.
      - id: hattori2023a
        notes: >
          Gives the Tyrannomimus material as "collected from the same layer
          (Bonebed I)", at the Kitadani Dinosaur Quarry.
      - id: behrensmeyer2007a
      - id: sano2017a
        notes: >
          Dates the quarry: "Kaseki-kabe (upper part of the Kuwajima Formation)
          and Kitadani Dinosaur Quarry (Kitadani Formation) are assigned to the
          Barremian and the Aptian, respectively".
      - id: sano2015a
        notes: >
          "A vertebrate fossil-bearing stratum at the Kitadani Dinosaur Quarry
          in the Kitadani Formation can be considered as Aptian, because it is
          younger than the age of the last brackish horizon in this area".
  - name: Bonebed IV
    informal: true
    period: [Early Cretaceous]
    stages: [Aptian]
    references:
      - id: shibata2015b
        notes: >
          Gives the Koshisaurus horizon as the fourth bone bed of the quarry,
          which it abbreviates BB IV: "This lenticular horizon has a limited
          exposure of approximately four square-meters in the quarry", the
          elements all from one size class and none duplicated. Writes the lowest
          bonebed in full as "Bonebed I (BB I)".
      - id: sano2017a
        notes: >
          Dates the quarry: "Kaseki-kabe (upper part of the Kuwajima Formation)
          and Kitadani Dinosaur Quarry (Kitadani Formation) are assigned to the
          Barremian and the Aptian, respectively".
      - id: sano2015a
        notes: >
          "A vertebrate fossil-bearing stratum at the Kitadani Dinosaur Quarry
          in the Kitadani Formation can be considered as Aptian, because it is
          younger than the age of the last brackish horizon in this area".
