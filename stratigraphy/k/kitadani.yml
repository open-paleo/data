name: Kitadani
rank: formation
period: [Early Cretaceous]
stages: [Hauterivian, Barremian, Aptian, Albian]
references:
  - id: azuma2010a
    notes: >
      Reports that its nonmarine molluscs "indicate that it belongs to
      Hauterivian to early Aptian in age", and that the formation "could be
      assigned to Barremian" on the occurrence of Nippononaia ryosekiana, the
      reading it uses for the type horizon, "The Kitadani Formation (Akaiwa
      subgroup, Tetori Group) of the Early Cretaceous (Barremian)".
  - id: you2009a
    notes: >
      Gives "Kitadani Formation (Aptian-Albian".
