name: Kallamedu
rank: formation
period: [Late Cretaceous]
stages: [Maastrichtian]
lithology: medium to coarse-grained sandstone, with interbedded red and green
  clay
references:
  - id: galton2017a
    notes: >
      Gives "the Kallamedu Formation (Upper Cretaceous, Maastrichtian) of
      southern India" while rejecting a reported stegosaurian dermal plate
      from it on histological grounds.
  - id: longrich2017a
    notes: >
      Tabulates abelisaurid material from it as late Maastrichtian.
  - id: yadagiri1987a
    notes: >
      Describes its rock: "The lithology is medium to coarse-grained sandstones
      which are cross bedded, poorly consolidated, poorly sorted and vary in
      colour from light grey to white; the red and green clays are found
      interbedded in the sandstones".
