name: Kallamedu
rank: formation
period: [Late Cretaceous]
stages: [Maastrichtian]
description: "The Kallamedu Formation dates to the Maastrichtian of the Late Cretaceous. Dinosaur remains and petrified wood samples are among the known fossils recovered from this formation."
references:
  - id: galton2017a
    notes: >
      Gives "the Kallamedu Formation (Upper Cretaceous, Maastrichtian) of
      southern India" while rejecting a reported stegosaurian dermal plate
      from it on histological grounds.
  - id: longrich2017a
    notes: >
      Tabulates abelisaurid material from it as late Maastrichtian.
