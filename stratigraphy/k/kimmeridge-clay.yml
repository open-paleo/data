name: Kimmeridge Clay
rank: formation
parent: Ancholme
period: [Late Jurassic]
stages: [Kimmeridgian, Tithonian]
references:
  - id: hesselbo2020a
    notes: >
      Gives the conversion from British usage: "Cope (1967) subdivided the
      lowermost Tithonian portion of the Upper Kimmeridge Clay into several
      ammonite zones based on successive species of his reconstituted
      Pectinatites genus", and "The 'Bolonian' of Britain is equivalent to
      the upper Kimmeridgian clay formation between the Kimmeridgian–Tithonian
      boundary and the Portland Sand". The formation thus runs from the
      Kimmeridgian into the lower Tithonian.
  - id: cope1980a
    notes: >
      "In Britain it is customary to equate 'Kimmeridgian' with the Kimmeridge
      Clay ... so that the British Upper Kimmeridgian (elegans Zone upwards)
      is already Portlandian in France."
  - id: carrano2012a
    notes: >
      Places material in "unknown horizons of the Kimmeridge Clay Formation
      (Kimmeridgian–early Tithonian) at Swindon, Wiltshire".
  - id: maidment2023a
    notes: >
      Places Cumnoria "in the Kimmeridgian–Tithonian Kimmeridge Clay
      Formation, about 10 metres below the base of the overlying Lower
      Greensand Group".
  - id: benson2008b
    notes: >
      Dates Juratyrant's horizon by ammonite zone: "OUMNH J.3311 was
      collected from the Pectinatites pectinatus ammonite Zone, P.
      eatlecottensis subzone, Kimmeridge Clay, Late Jurassic (lower
      Tithonian), Dorset".
  - id: sánchez-fenollosa2023a
    notes: >
      Gives the formation a range rather than a single stage, placing
      Camptosaurus prestwichii "from the lower part of the Kimmeridge Clay
      Formation (Kimmeridgian-Berriasian) of UK". It gives no basis for the
      Berriasian; Hesselbo and colleagues (2020) and Benson (2008) put the
      upper formation in the lower Tithonian.
  - id: barron2012a
    notes: >
      Places it at the top of the Ancholme Group, above the Ampthill Clay
      Formation, and records that "in the south-west
      (Oxfordshire/Buckinghamshire) Kimmeridge Clay Formation overlain by
      Portland Formation".
  - id: sánchez-fenollosa2025a
    notes: >
      Gives "Kimmeridge Clay Formation, Upper Jurassic (Kimmeridgian)" for
      the Dacentrurus armatus holotype, from the lower part of the formation,
      and elsewhere ranges the species across the "Kimmeridgian–Tithonian,
      Kimmeridge Clay, Argiles d' Octeville, Lourinhã, and Villar del
      Arzobispo Formations".
  - id: ősi2012a
    notes: >
      Tabulates it as "Kimmeridge Clay; Kimmeridgian", which in British usage
      takes in the whole formation, its lower Tithonian upper part included.
