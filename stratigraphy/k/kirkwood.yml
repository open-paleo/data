name: Kirkwood
rank: formation
period: [Late Jurassic, Early Cretaceous]
stages: [Tithonian, Berriasian, Valanginian, Hauterivian]
lithology: variegated silty mudstone interbedded with sandy channel fill
references:
  - id: mcphee2016b
    notes: >
      Gives "Kirkwood Formation (lowermost Cretaceous,
      ?Berriasian–Hauterivian)", hedging the older end, and concludes that the
      fossiliferous sections "most reasonably date" to "the early Early
      Cretaceous". Reports that "Early research suggested that the basal-most
      deposits of the Kirkwood Formation were perhaps Late Jurassic in age".
  - id: galton1981a
    notes: >
      Reads it as diachronous: the formation "and the underlying Enon
      Conglomerate Formation are time transgressive and fall within the
      Berriasian to Lower Valanginian".
  - id: forster2023a
    notes: >
      Reports that Muir and colleagues (2017) "assigned a Tithonian to
      Valanginian age for the entire Kirkwood Fm", and argues from foraminiferal
      dating of the base of the Sundays River Formation that this "would
      indicate an Early Cretaceous age (early-mid Valanginian) for the Kirkwood
      Fm stratotype exposure and bone-bearing fossil site". Source of the
      lithology.
  - id: muir2017a
    notes: >
      Gives the formation as "constrained to Tithonian – Valanginian in the
      Algoa Basin" and describes it as conformable on the Enon Formation, with a
      gradational, locally interfingering contact.
  - id: dingle1983a
