name: Kirkwood
rank: formation
period: [Late Jurassic, Early Cretaceous]
stages: [Tithonian, Berriasian, Valanginian, Hauterivian]
references:
  - id: mcphee2016b
    notes: >
      Gives "Kirkwood Formation (lowermost Cretaceous,
      ?Berriasian–Hauterivian", hedging the older end, and concludes that the
      fossiliferous sections "most reasonably date" to "the early Early
      Cretaceous". Reports that "Early research suggested that the basal-most
      deposits of the Kirkwood Formation were perhaps Late Jurassic in age".
  - id: galton1981a
    notes: >
      Reads it as diachronous: the formation "and the underlying Enon
      Conglomerate Formation are time transgressive and fall within the
      Berriasian to Lower Valanginian".
  - id: forster2022a
    notes: >
      Reports that Muir and colleagues (2017) "assigned a Tithonian to
      Valanginian age for the entire Kirkwood Fm", and argues from
      foraminiferal dating of the base of the Sundays River Formation that
      this "would indicate an Early Cretaceous age (early-mid Valanginian) for
      the Kirkwood Fm stratotype exposure and bone-bearing fossil site".
  - id: muir2017a
    notes: >
      The formation "has been constrained to Tithonian – Valanginian in the
      Algoa Basin", which "by inference suggests a Cretaceous age for at least
      parts of the Enon Formation in that area", since Dingle and colleagues
      (1983) hold the two formations to have been deposited contemporaneously.
      Its "datable volcaniclastic layers ... may provide the best means to
      infer the age range of the Enon, but preliminary U-Pb analysis of zircon
      from these layers have yielded ages ranging from Middle Jurassic to
      Early Cretaceous". The mudstone- and sandstone-dominated Kirkwood
      generally conformably overlies the conglomeratic Enon but locally
      interfingers with it.
  - id: dingle1983a
