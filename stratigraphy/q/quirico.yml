name: Quiricó
rank: formation
period: [Early Cretaceous]
stages: [Barremian, Aptian]
references:
  - id: zaher2011a
    notes: >
      Gives "outcrops of Aptian age in the Quiricó Formation of the
      Sanfranciscana Basin", its lacustrine deposits sitting "in the lower
      part of the Sanfranciscana sequence".
  - id: zaher2020a
    notes: >
      Places it in its group, "the Quiricó Formation, Areado Group,
      Sanfranciscana Basin".
  - id: pereira2024a
    notes: >
      Gives the unit as "Barremian-Aptian".
  - id: martínez2016a
    notes: >
      Places Tapuiasaurus in "the Lower Cretaceous Quiricó Formation of
      Brazil" and notes it "was recovered from Aptian strata".
