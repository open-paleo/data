name: Qiaotou
rank: member
parent: Huajiying
period: [Early Cretaceous]
stages: [Hauterivian, Barremian]
references:
  - id: xing2020a
    notes: >
      Makes it one of the two members of the lower Huajiying Formation with
      the Sichakou, the vertebrate fossils occurring "in the lower part of
      the formation (Sichakou and Qiaotou members) dated by 40Ar/39Ar to the
      weighted mean age of 130.7 Mya".
  - id: pittman2020c
    notes: >
      Treats the name as a synonym of the formation instead, writing "the
      Hauterivian-Barremian Huajiying (Qiaotou) Formation of Hebei, China".
      Its table of the Mesozoic avialan record nonetheless lists the Qiaotou
      Formation separately from the Huajiying, as Barremian and Early
      Cretaceous.
  - id: ji2005a
    notes: >
      Treats the Qiaotou as a formation, places the Jinfengopteryx holotype in
      its middle part, below the Sinosauropteryx-bearing beds of the Yixian
      Formation, and calls its age "equivocal".
  - id: jin2008a
    notes: >
      Names it the "Qiaotou sedimentary member" of the Huajiying Formation
      and, on its fish fauna, correlates it with the Dawangzhangzi Bed of the
      Yixian Formation. The ages known for both, 122.1–126.9 Ma, are, the
      authors write, "not widely accepted".
