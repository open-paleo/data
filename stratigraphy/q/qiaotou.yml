name: Qiaotou
rank: member
parent: Huajiying
period: [Late Jurassic, Early Cretaceous]
stages: [Hauterivian, Barremian]
references:
  - id: xing2020a
    notes: >
      Makes it one of the two members of the lower Huajiying Formation with
      the Sichakou, the vertebrate fossils occurring "in the lower part of
      the formation (Sichakou and Qiaotou members) dated by 40Ar/39Ar to the
      weighted mean age of 130.7 Mya".
  - id: pittman2020a
    notes: >
      Treats the name as a synonym of the formation instead, writing "the
      Hauterivian-Barremian Huajiying (Qiaotou) Formation of Hebei, China".
      Its table of the Mesozoic avialan record nonetheless lists the Qiaotou
      Formation separately from the Huajiying, as Barremian and Early
      Cretaceous.
  - id: ji2005a
    notes: >
      "The age of the Qiaotou Formation is equivocal. It has been suggested to
      be Late Jurassic by some paleontologists, or Early Cretaceous by
      others", with isotopic dating still in process; the paper treats the
      unit at formation rank. The Jinfengopteryx holotype comes from the
      middle part of the unit, which is stratigraphically lower than the
      Sinosauropteryx-bearing beds of the Yixian Formation, and the associated
      fossils are common elements of the Jehol Biota.
