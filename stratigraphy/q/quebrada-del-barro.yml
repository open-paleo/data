name: Quebrada del Barro
rank: formation
parent: Marayes
period: [Late Triassic]
stages: [Norian, Rhaetian]
lithology: coarse sandstone and conglomerate interbedded with sandy claystone
references:
  - id: martínez2017a
    notes: >
      Gives "the late Norian-Rhaetian Quebrada del Barro Formation, northwestern
      Argentina". Source of the lithology.
  - id: apaldetti2011a
    notes: >
      Describes Leyesaurus from the "uppermost level" of the formation as then
      bounded, questions its Norian age, and suggests it "may be of Lower
      Jurassic age".
  - id: bossi1978a
  - id: martínez2015a
    notes: >
      Reports a new vertebrate assemblage from the formation and, from its
      comparison with the Los Colorados and other faunas, "tentatively"
      assesses "a late Norian–Rhaetian age", which Martínez and colleagues
      (2017) take up.
