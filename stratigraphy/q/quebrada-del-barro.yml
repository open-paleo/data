name: Quebrada del Barro
rank: formation
parent: Marayes
period: [Late Triassic]
stages: [Norian, Rhaetian]
references:
  - id: martínez2017a
    notes: >
      Gives "the late Norian-Rhaetian Quebrada del Barro Formation,
      northwestern Argentina".
  - id: apaldetti2011a
    notes: >
      Calls it "an Upper Triassic-Lower Jurassic unit", its age
      "originally proposed as Cretaceous ... and later as Upper Triassic".
      It lists the formation as "Norian?" and questions the Norian age
      that Bossi and Bonaparte (1978) based on a Riojasaurus referral,
      that record being "known only by a partial pes without any
      diagnostic features"; from Leyesaurus, found in its "uppermost
      level", it suggests "the Quebrada del Barro Formation may be of
      Lower Jurassic age". The beds that yielded Leyesaurus have since
      been separated as the Balde de Leyes Formation, which Martínez and
      Apaldetti (2017) give as Lower Jurassic, leaving this formation
      "upper Norian-Rhaetian".
  - id: bossi1978a
