name: Quantou
rank: formation
period: [Early Cretaceous, Late Cretaceous]
stages: [Aptian, Albian, Cenomanian]
dispute:
  summary: >
    The age is openly unsettled. Jin and colleagues (2009) record that
    "numerous authors have variously assigned Aptian, Albian, or Cenomanian
    ages to the Quantou Formation", and note that the Liufangzi locality "was
    assigned to the Quantou Formation primarily on the basis of the lithology
    ..., but to date, no microfossils that could be compared to the type
    section have been collected in this area". So both the age and some
    assignments to the unit rest on lithology alone.
references:
  - id: jin2009a
    notes: >
      States the three competing ages, "Numerous authors have variously
      assigned Aptian, Albian, or Cenomanian ages to the Quantou Formation",
      and the lithological basis of the Liufangzi assignment, giving the
      Liufangzi horizon as "Quantou Formation (late Early Cretaceous or early
      Late Cretaceous)".
