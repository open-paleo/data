name: Qigu
rank: formation
period: [Middle Jurassic, Late Jurassic]
dispute:
  summary: >
    The formation's age in the Turpan Basin is uncertain. Wu and colleagues
    (2013) call it Middle Jurassic on a Junggar Basin date, Zhang and
    colleagues (2018, 2022) Late Jurassic, and Upchurch and colleagues (2021)
    note that "there is currently no explicit evidence that the putative
    outcrops of the Qigu Formation in the Turpan Basin correlate with those in
    the Junggar Basin".
references:
  - id: wu2013a
    notes: >
      Places the Xinjiangtitan holotype in "the Middle Jurassic Qigu
      Formation" and lists the Shanshan succession "from bottom to top" as
      the Xishancun, Sanjianfang, Qiketai, Qigu and Kalazha formations.
  - id: zhang2018b
    notes: >
      Relays Wu and colleagues' Qigu for the Xinjiangtitan bed, "which is
      early Late Jurassic based (Deng et al. 2015)".
  - id: zhang2022a
    notes: >
      Puts the Xinjiangtitan horizon in "the middle beds of the Qigu
      Formation", and relays that "The lower part of the Qigu Formation has
      been dated 151 Ma, and the Jurassic-Cretaceous boundary is located in
      the upper part of the Qigu Formation".
  - id: upchurch2021a
    notes: >
      Reports that the formation "has been regarded as Late Jurassic
      (Oxfordian–early Kimmeridgian) by more recent studies", and that the
      evidence for a late Middle Jurassic age in the Turpan Basin "must be
      regarded as somewhat tentative".
  - id: xing2015a
    notes: >
      Lists Xinjiangtitan under QG, which its key resolves as the Qigu
      Formation, in its Middle Jurassic column.
  - id: deng2015a
    notes: >
      Cited by Zhang and colleagues (2018) for the early Late Jurassic age of
      the Qigu Formation.
