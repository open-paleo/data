name: Qigu
rank: formation
period: [Middle Jurassic, Late Jurassic]
stages: [Bathonian, Callovian, Oxfordian, Kimmeridgian]
dispute:
  summary: >
    The formation's age in the Turpan Basin is uncertain. Wu and colleagues
    (2013) call it Middle Jurassic on a Junggar Basin date, Zhang and
    colleagues (2018, 2022) Late Jurassic, and Upchurch and colleagues (2021)
    note that "there is currently no explicit evidence that the putative
    outcrops of the Qigu Formation in the Turpan Basin correlate with those in
    the Junggar Basin", following Wings and colleagues (2012), for whom "no
    explicit justification has been given for this correlation" and "the
    assignment of units to this formation is not transparent".
references:
  - id: wu2013a
    notes: >
      Places the Xinjiangtitan holotype in "the Middle Jurassic Qigu
      Formation" and lists the Shanshan succession "from bottom to top" as
      the Xishancun, Sanjianfang, Qiketai, Qigu and Kalazha formations.
  - id: zhang2018b
    notes: >
      Relays Wu and colleagues' Qigu for the Xinjiangtitan bed, "which is
      early Late Jurassic based (Deng et al. 2015)".
  - id: zhang2022a
    notes: >
      Puts the Xinjiangtitan horizon in "the middle beds of the Qigu
      Formation", and relays that "The lower part of the Qigu Formation has
      been dated 151 Ma, and the Jurassic-Cretaceous boundary is located in
      the upper part of the Qigu Formation".
  - id: upchurch2021a
    notes: >
      Reports that the formation "has been regarded as Late Jurassic
      (Oxfordian–early Kimmeridgian) by more recent studies", and that the
      evidence for a late Middle Jurassic age in the Turpan Basin "must be
      regarded as somewhat tentative".
  - id: xing2015a
    notes: >
      Lists Xinjiangtitan under QG, which its key resolves as the Qigu
      Formation, in its Middle Jurassic column.
  - id: deng2015a
    notes: >
      Cited by Zhang and colleagues (2018) for the early Late Jurassic age of
      the Qigu Formation.
  - id: wings2012a
    notes: >
      Assigns the Turpan Basin turtle bone bed to the formation with a hedge,
      "probably belongs to the late Middle Jurassic Qigu Formation", and
      doubts the name's use in that basin: "The Qigu Formation is well known
      in the Junggar Basin and has been also identified in the Turpan Basin,
      but no explicit justification has been given for this correlation".
  - id: wang1998b
    notes: >
      Dates the Turpan Basin's Sanjianfang and Qiketai formations, below the
      Qigu, from well palynology as "probably be mainly late Bathonian", and
      finds their assemblages "most similar to those of the Toutunhe Formation
      of the Junggar Basin", the unit below the Junggar Qigu.
  - id: greene2000a
    notes: >
      Gives a complete section of the underlying Qiketai Formation "At
      Qiketai (N42° 57', E90° 34')", and treats the Upper Jurassic red beds
      above it as a regional marker.
  - id: wang2012a
    notes: >
      Dates a tuff in the Junggar Basin Qigu at 164.6 ± 1.4 Ma by SHRIMP
      zircon U-Pb, and concludes that "the main age of the Qigu Fromation is
      Middle Jurassic Callovian period. The lower part of the formation might
      have entered late Late Bathonian period".
  - id: averianov2005a
    notes: >
      Relays a palynological dating: "The Toutunhe Formation is dated on the
      basis of palynoflora as Bathonian and the Qigu Formation as Callovian
      (Wang 2001)".
  - id: maisch2019a
    notes: >
      Gives a Junggar Basin tooth from "the middle Qigu Formation (Late
      Jurassic, ?Oxfordian-Kimmeridgian)", and recommends a different
      formation name for the Turpan Basin beds without proposing one.
  - id: wang2001b
    notes: >
      Cited by Averianov and colleagues (2005) for the Qigu's Callovian
      palynological age; the paper concerns the palynoflora of the Qaidam
      Basin.

