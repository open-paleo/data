name: Qiupa
rank: formation
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
description: "The Qiupa Formation is a Late Cretaceous Maastrichtian geologic formation in Henan Province, central China. It is rich in dinosaur eggs and bones, such as those of carnivorous and herbivorous dinosaurs. The Qiupa Formation is considered to be Late Maastrichtian in age, about 72 million and 66 million years ago."
references:
  - id: lü2018a
    notes: >
      Gives "Qiupa Formation (Late Maastrichtian)" and describes the skeleton
      as "discovered from the Late Cretaceous Qiupa Formation of Luanchuan".
  - id: pittman2020c
    notes: >
      Tabulates it across both stages, Campanian and Maastrichtian.
