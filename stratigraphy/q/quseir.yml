name: Quseir
rank: formation
period: [Late Cretaceous]
stages: [Campanian]
description: "The Quseir Formation is a geological formation in the vicinity of the Kharga Oasis in Egypt. It is Campanian in age. The lithology largely consists of soft shale with hard bands of sandstone, siltstone and phosphorite. The environment of deposition was nearshore to freshwater fluvio-lacustrine characterized by moist and aquatic habitats with a tropical warm-humid climate. The sauropod dinosaurs Mansourasaurus and Igai are known from the formation, as well as the proximal fibula of an indeterminate theropod and possible remains tentatively assigned to Spinosaurus."
variants: [Baris]
references:
  - id: gorscak2022a
    notes: >
      Gives "the Upper Cretaceous (Campanian) Quseir Formation of the Kharga
      Oasis, Egypt".
  - id: sallam2018a
    notes: >
      Gives the alternate name directly, writing "the Quseir (=Baris)
      Formation of Kharga Oasis", and places Mansourasaurus in the same unit
      at the Dakhla Oasis.
