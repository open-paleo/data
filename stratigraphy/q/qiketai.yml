name: Qiketai
rank: formation
period: [Middle Jurassic]
dispute:
  summary: >
    The formation's stratigraphic position is unsettled, and Maisch and Matzke
    (2019) say so directly: "The stratigraphic position of the Qiketai
    Formation remains controversial." Wu and colleagues (2013) place it in the
    Middle Jurassic, above the Sanjianfang Formation and below the Qigu.
    Maisch and Matzke read it instead as coeval with the Toutunhe Formation of
    the Junggar Basin, a comparison that would carry it into the Upper
    Jurassic on the dating they cite for that unit. Which formation yields
    Xinjiangtitan is a separate question turning on the same name: Upchurch
    and colleagues (2021) give the horizon as the "Lower part of the Kalazha
    Formation (Upper Jurassic: upper Kimmeridgian-Tithonian) of Qiketai,
    Shanshan County", treating Qiketai as the village rather than the
    formation.
references:
  - id: maisch2019a
    notes: >
      Attributes Xinjiangtitan to this formation, correcting Xing and
      colleagues (2015), and proposes it "is probably coeval to the Toutunhe
      Formation of the Junggar Basin and may therefore be lower Early Jurassic
      rather than Middle Jurassic in age". The direction printed there is not
      the one that comparison supports. Fang and colleagues (2015), cited in
      that same sentence, never name this formation, and place the comparator
      among "the Upper Jurassic Toutunhe, Qigu and Kalazha Formations" with
      sedimentation "younger than 161.2 Ma". The rest of the paper reads the
      same way: it calls Xinjiangtitan an "Upper Jurassic mamenchisaurid",
      heads its stratigraphic figure with the Upper Jurassic succession, and
      records that the Toutunhe Formation "has recently been regarded as Upper
      Jurassic". Also states that "The stratigraphic position of the Qiketai
      Formation remains controversial."
  - id: upchurch2021a
    notes: >
      Gives the competing Kalazha reading, treating Qiketai as the locality
      in Shanshan County, Turpan Basin, Xinjiang.
  - id: wu2013a
    notes: >
      Lists the Jurassic strata of the Shanshan area "from bottom to top" as
      "the Middle Jurassic Xishancun Formation, Sanjianfang Formation, Qiketai
      Formation, Qigu Formation, and the Upper Jurassic Kalazha Formation",
      placing the Qiketai Formation below the Middle Jurassic Qigu Formation
      that yields Xinjiangtitan.
  - id: xing2015a
    notes: >
      Never names this formation, and places the taxon that brings it here
      somewhere else: its table gives "Xinjiangtitan shanshanensis QG" and
      its abbreviation key resolves QG as the Qigu Formation, in the paper's
      Middle Jurassic column. So it contributes nothing to this unit's age,
      and it is a second vote for the Qigu attribution alongside Wu and
      colleagues (2013). Across the entry's references the horizon readings
      now stand at two for the Qigu, one for this formation and one for the
      Kalazha.
