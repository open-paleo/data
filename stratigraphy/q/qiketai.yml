name: Qiketai
rank: formation
period: [Middle Jurassic]
dispute:
  summary: >
    Which unit the Xinjiangtitan material comes from is contested, and the
    formation's own age with it. Maisch and Matzke (2019) place the taxon in
    "strata attributed to the Qiketai Formation, which is probably coeval to
    the Toutunhe Formation of the Junggar Basin and may therefore be lower
    Early Jurassic rather than Middle Jurassic in age". Upchurch and
    colleagues (2021) instead give the horizon as the "Lower part of the
    Kalazha Formation (Upper Jurassic: upper Kimmeridgian-Tithonian) of
    Qiketai, Shanshan County". So the same locality name attaches to a
    formation and to a village, and the two readings are an epoch apart.
references:
  - id: maisch2019a
    notes: >
      Attributes Xinjiangtitan to the Qiketai Formation, correcting Xing and
      colleagues (2015), and argues the unit "is probably coeval to the
      Toutunhe Formation of the Junggar Basin and may therefore be lower Early
      Jurassic rather than Middle Jurassic in age". The same paper calls
      Xinjiangtitan an "Upper Jurassic mamenchisaurid", notes that the
      Toutunhe Formation "has recently been regarded as Upper Jurassic", and
      says "The stratigraphic position of the Qiketai Formation remains
      controversial."
  - id: upchurch2021a
    notes: >
      Gives the competing Kalazha reading, treating Qiketai as the locality
      in Shanshan County, Turpan Basin, Xinjiang.
  - id: wu2013a
    notes: >
      Lists the Jurassic strata of the Shanshan area "from bottom to top" as
      "the Middle Jurassic Xishancun Formation, Sanjianfang Formation, Qiketai
      Formation, Qigu Formation, and the Upper Jurassic Kalazha Formation",
      placing the Qiketai Formation below the Middle Jurassic Qigu Formation
      that yields Xinjiangtitan.
  - id: xing2015a
    notes: >
      Never names this formation, and places the taxon that brings it here
      somewhere else: its table gives "Xinjiangtitan shanshanensis QG" and
      its abbreviation key resolves QG as the Qigu Formation, in the paper's
      Middle Jurassic column. So it contributes nothing to this unit's age,
      and it is a second vote for the Qigu attribution alongside Wu and
      colleagues (2013). Across the entry's references the horizon readings
      now stand at two for the Qigu, one for this formation and one for the
      Kalazha.
