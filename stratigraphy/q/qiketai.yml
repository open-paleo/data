name: Qiketai
rank: formation
period: [Middle Jurassic]
stages: [Bathonian]
dispute:
  summary: >
    The formation's stratigraphic position is unsettled, and Maisch and Matzke
    (2019) say so directly: "The stratigraphic position of the Qiketai
    Formation remains controversial." Wu and colleagues (2013) place it in the
    Middle Jurassic, above the Sanjianfang Formation and below the Qigu.
    Maisch and Matzke read it instead as coeval with the Toutunhe Formation of
    the Junggar Basin, a comparison that would carry it into the Upper
    Jurassic on the dating they cite for that unit. Qiketai is also a
    village name: Upchurch and colleagues (2021) give the Hudiesaurus horizon
    as the "Lower part of the Kalazha Formation (Upper Jurassic: upper
    Kimmeridgian-Tithonian) of Qiketai, Shanshan County".
references:
  - id: maisch2019a
    notes: >
      Attributes Xinjiangtitan to the formation, compares it with the Toutunhe
      Formation of the Junggar Basin, and states that its "stratigraphic
      position ... remains controversial".
  - id: upchurch2021a
    notes: >
      Uses Qiketai as the locality of Hudiesaurus, in the lower Kalazha
      Formation of Shanshan County, Turpan Basin.
  - id: wu2013a
    notes: >
      Lists the Jurassic strata of the Shanshan area "from bottom to top" as
      "the Middle Jurassic Xishancun Formation, Sanjianfang Formation, Qiketai
      Formation, Qigu Formation, and the Upper Jurassic Kalazha Formation",
      placing the Qiketai Formation below the Middle Jurassic Qigu Formation
      that yields Xinjiangtitan.
  - id: xing2015a
    notes: >
      Never names this formation, and places Xinjiangtitan in another: its
      table gives "Xinjiangtitan shanshanensis QG" and its abbreviation key
      resolves QG as the Qigu Formation, in the paper's Middle Jurassic
      column. So it gives no age for this unit, and it is a second source for
      the Qigu attribution alongside Wu and colleagues (2013).
  - id: fang2015a
  - id: wang1998b
    notes: >
      Dates the Sanjianfang and Qiketai together from well palynology in the
      Turpan Basin, "似应以巴通期晚期为主" ("should probably be mainly late
      Bathonian", translated); its English abstract gives the two
      assemblages "early to late Bathonian age, respectively".
  - id: greene2000a
    notes: >
      Gives the formation only as Middle Jurassic (J2q): it "marks the end of
      the Middle Jurassic" below the Upper Jurassic red beds of the Qigu.
