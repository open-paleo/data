name: Qingshan
rank: group
period: [Early Cretaceous]
stages: [Valanginian, Hauterivian, Barremian, Aptian, Albian]
references:
  - id: averianov2006a
    notes: >
      Places the Doushan Formation "in the upper part of Qingshan Group in
      Shandong Province, China", radiometrically dated at 119 to 121 Ma and
      so within the Aptian.
  - id: sereno2010a
    notes: >
      Gives the same containment for the Psittacosaurus sinensis type
      horizon.
  - id: xu2015b
    notes: >
      Lists the Jiaolai basin fill as "the Early Cretaceous Laiyang and
      Qingshan Formations (Groups) and the Late Cretaceous Wangshi
      Formation (Group)", and reports that volcanic rocks from the
      Qingshan in that basin "gave whole-rock 40Ar–39Ar ages clustering at
      120–105 Ma", Aptian to Albian on the ICS chart v2024/12. For the
      Qingshan of the Luxi area it relays that "the middle and the upper
      member yield 40Ar–39Ar ages of 124.3 ± 0.6 Ma" and 117.8 to 114.8
      Ma, the first of them Barremian on the ICS chart v2024/12. It also
      relays that "the lower member of the Qingshan Formation had U–Pb
      zircon ages ranging from 136 to 128 Ma", which would be Valanginian
      to Hauterivian on the same chart.
  - id: zhen1985a
    notes: >
      Treats the unit as the "Qingshan Formation in Shandong", whose
      Psittacosaurus fauna "is clearly of Early Cretaceous (probably
      Aptian-Albian) age based on the non-marine invertebrates from the
      Qingshan Formation", after Chen (1983).
  - id: xi2021a
    notes: >
      "该群中火山岩的年龄跨度较大, 但显示119 Ma和108 Ma两个主峰 ..., 该群的时代可能为巴雷姆期—阿尔布期早期"
      ("the ages of the volcanic rocks in this group span a wide range but
      show two main peaks at 119 Ma and 108 Ma ..., and the age of the group
      is possibly Barremian–early Albian", translated; p. 383).
  - id: chen1983a
  - id: zhu2010a
    notes: >
      Assigns the volcanic rocks of the Yishu grabens and the Mengyin and
      Pingyi basins of western Shandong to the unit: "The intermediate to
      acid volcanic rocks are all assigned to the Qingshan Formation in
      this region." Twelve samples there "yielded LA-ICPMS 206Pb/238U
      zircon weighted mean ages ranging from 135.6 ± 3.9 to 115.5 ± 0.9
      Ma", Valanginian to Aptian on the ICS chart v2024/12; the oldest
      reaches the Berriasian only at the edge of its uncertainty. For the
      Jiaolai Basin it gives the Qingshan only "LA-ICPMS zircon ages of
      119 and 120 Ma", which are Aptian.
  - id: ling2009a
    notes: >
      In the Mengyin basin, "eleven zircons comprise a mean 206Pb/238U age
      of 128.0 ± 1.6 Ma", and "the age of 128 Ma is interpreted as the
      timing of the Qingshan volcanic rocks in Mengyin basin", Hauterivian
      on the ICS chart v2024/12 across its whole uncertainty. In the
      western terrain the unit comprises only the Bamudi and Fanggezhuang
      formations. East of the Tan-Lu fault the abstract dates the unit
      younger: the Qingshan volcanic sequences of the Mengyin and Jiaozhou
      basins "were formed at 128± 2 and 106– 98 Ma", the Jiaozhou figures
      relayed from earlier zircon dating, "106±2,105±4 and 98±1 Ma for the
      lowest part of the Houkuang Fm and the lower and upper parts of the
      Shiqianzhuang Fm". On the ICS chart v2024/12, 98 ± 1 Ma is
      Cenomanian.
