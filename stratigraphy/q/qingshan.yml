name: Qingshan
rank: group
period: [Early Cretaceous]
stages: [Barremian, Aptian, Albian]
references:
  - id: averianov2006a
    notes: >
      Places the Doushan Formation "in the upper part of Qingshan Group in
      Shandong Province, China", radiometrically dated at 119 to 121 Ma and
      so within the Aptian.
  - id: sereno2010a
    notes: >
      Gives the same containment for the Psittacosaurus sinensis type
      horizon.
  - id: xu2015b
    notes: >
      Lists the Jiaolai basin fill as "the Early Cretaceous Laiyang and
      Qingshan Formations (Groups) and the Late Cretaceous Wangshi Formation
      (Group)", and reports that volcanic rocks from the Qingshan in that
      basin "gave whole-rock 40Ar–39Ar ages clustering at 120–105 Ma", Aptian
      to Albian on GTS2020. It also relays that "the lower member of the
      Qingshan Formation had U–Pb zircon ages ranging from 136 to 128 Ma".
  - id: zhen1985a
    notes: >
      Treats the unit as the "Qingshan Formation in Shandong", whose
      Psittacosaurus fauna "is clearly of Early Cretaceous (probably
      Aptian-Albian) age based on the non-marine invertebrates from the
      Qingshan Formation", after Chen (1983).
  - id: xi2021a
    notes: >
      "The ages of the volcanic rocks in this group span a wide range but show
      two main peaks at 119 Ma and 108 Ma ..., and the age of the group is
      possibly Barremian–early Albian".
  - id: chen1983a
