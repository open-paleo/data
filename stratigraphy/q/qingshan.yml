name: Qingshan
rank: group
period: [Early Cretaceous, Late Cretaceous]
stages: [Valanginian, Hauterivian, Barremian, Aptian, Albian, Cenomanian]
lithology: volcanic lava and volcaniclastic sedimentary rock
references:
  - id: averianov2006a
    notes: >
      Places the Doushan Formation "in the upper part of Qingshan Group in
      Shandong Province, China", radiometrically dated at 119 to 121 Ma and
      so within the Aptian.
  - id: sereno2010a
    notes: >
      Gives the same containment for the Psittacosaurus sinensis type
      horizon.
  - id: xu2015b
    notes: >
      Lists the unit in the Early Cretaceous fill of the Jiaolai Basin, where
      its volcanics give Ar–Ar ages of 120–105 Ma, and relays older ages for it
      in the Luxi area.
  - id: zhen1985a
    notes: >
      Treats the unit as the "Qingshan Formation in Shandong", whose
      Psittacosaurus fauna "is clearly of Early Cretaceous (probably
      Aptian-Albian) age based on the non-marine invertebrates from the
      Qingshan Formation", after Chen (1983).
  - id: xi2021a
    notes: >
      "该群中火山岩的年龄跨度较大, 但显示119 Ma和108 Ma两个主峰 ..., 该群的时代可能为巴雷姆期—阿尔布期早期" ("the ages
      of the volcanic rocks in this group span a wide range but show two main
      peaks at 119 Ma and 108 Ma ..., and the age of the group is possibly
      Barremian–early Albian", translated; p. 383). Source of the lithology.
  - id: chen1983a
  - id: zhu2010a
    notes: >
      Assigns all intermediate to acid volcanics of the Yishu grabens and the
      Mengyin and Pingyi basins to the unit, with zircon ages of 135.6 ± 3.9 to
      115.5 ± 0.9 Ma.
  - id: ling2009a
    notes: >
      Dates the unit's volcanics in the Mengyin Basin at 128.0 ± 1.6 Ma, and
      gives its sequences there and in the Jiaozhou Basin as formed "at 128± 2
      and 106– 98 Ma".
