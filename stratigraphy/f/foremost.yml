name: Foremost
rank: formation
parent: Belly River
period: [Late Cretaceous]
stages: [Campanian]
references:
  - id: eberth2005a
    notes: >
      Describes it as the lowest formation of the group, 170 m thick and
      "paralic to non-marine" over the Pakowki (Claggett), and dates its base to
      about 80 Ma in the Baculites asperiformis biozone.
  - id: eberth1993b
    notes: >
      Dates it with the Milk River as "the early to middle Campanian Milk
      River and Foremost formations", citing Leckie (1989) and Ogunyomi and
      Hills (1977) for northeastward sediment transport in their nonmarine
      portions.
  - id: leckie1989a
  - id: ogunyomi1977a
