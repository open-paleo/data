name: Foremost
rank: formation
parent: Belly River
period: [Late Cretaceous]
stages: [Campanian]
references:
  - id: eberth2005a
    notes: >
      The lowest of the three, 170 m thick, "paralic to non-marine" and
      gradationally overlying "marine shales of the Pakowki (Claggett)
      Formation". Contains the McKay and Taber coal zones at bottom and top
      and the Herronton Sandstone Zone above the Taber. Dated by the
      "Baculites asperiformis ammonite biozone ... estimated age of 80 Ma",
      concurring with 79.14 +/- 0.15 Ma from an ash 30 m above its base.
  - id: eberth1993b
    notes: >
      Dates it with the Milk River as "the early to middle Campanian Milk
      River and Foremost formations", citing Leckie (1989) and Ogunyomi and
      Hills (1977) for northeastward sediment transport in their nonmarine
      portions.
  - id: leckie1989a
  - id: ogunyomi1977a
