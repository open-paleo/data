name: Fort Crittenden
rank: formation
period: [Late Cretaceous]
stages: [Campanian]
references:
  - id: dalman2018a
    notes: >
      Describes Crittendenceratops from "the upper Campanian Fort Crittenden
      Formation of Adobe Canyon within the Santa Rita Mountains of
      southeastern Arizona", calling the deposits "Upper Cretaceous (Latest
      Campanian)"; the material came from "late Campanian shale beds (~73 Ma)"
      of the lower, shale member.
  - id: sullivan2006c
    notes: >
      Dates it from K/Ar ages on the volcanics above and below it: "These ages
      indicate a Campanian age for the Fort Crittenden Formation, and suggest
      it is about 74 Ma, within the Kirtlandian time interval." It recalls
      Stoyanow's (1949) report of fish, turtles and "Gorgosaurus" "from Upper
      Cretaceous strata (Fort Crittenden Formation)" in Adobe Canyon, and
      extends the late Campanian age of the Ringbone Formation of southwestern
      New Mexico to it "by correlation".
  - id: stoyanow1949a
    notes: >
      The naming paper, and it gives no stage: "The Sonoita group readily
      admits of two divisions: the lower - Fort Buchanan formation, and the
      upper - Fort Crittenden formation, both names adopted from the near-by
      ruins of two old forts." The unit is the upper division of the Sonoita
      Group, above the Fort Buchanan Formation and separated from it by a
      comparatively thin conglomeratic bed, and the group is correlated with
      the Cabullona Group of northeastern Sonora. Its only age statement is a
      floor reached from the presence of dinosaurs at all: "Like Schrader, I
      was inclined to regard these strata as Tertiary. However, a find of
      dinosaurian teeth and bones clearly indicates a pre-Eocene age for this
      unit." The Gorgosaurus that later papers recall from here is not an
      identification: Barnum Brown, by personal communication, compares two
      teeth to "a carnivorous dinosaur skull of about the size of a large
      specimen of Gorgosaurus libratus", which is a statement about size.
