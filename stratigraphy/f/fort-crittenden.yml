name: Fort Crittenden
rank: formation
period: [Late Cretaceous]
stages: [Campanian]
references:
  - id: dalman2018a
    notes: >
      Describes Crittendenceratops from "the upper Campanian Fort Crittenden
      Formation of Adobe Canyon within the Santa Rita Mountains of
      southeastern Arizona", calling the deposits "Upper Cretaceous (Latest
      Campanian)"; the material came from "late Campanian shale beds (~73 Ma)"
      of the lower, shale member.
  - id: sullivan2006c
    notes: >
      Dates the formation Campanian, "about 74 Ma", from K/Ar ages on the
      volcanics above and below it, and late Campanian by correlation with the
      Ringbone Formation of New Mexico.
  - id: stoyanow1949a
    notes: >
      Names the formation as the upper division of the Sonoita group, above the
      Fort Buchanan Formation, among "fresh-water Upper Cretaceous deposits",
      and gives no stage.
