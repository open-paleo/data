name: Figuerola
rank: formation
period: [Late Cretaceous]
stages: [Maastrichtian]
references:
  - id: prieto-márquez2021a
    notes: >
      Gives the Fylax dentary as from "uppermost Maastrichtian strata (within
      chron C29r) of the Figuerola Formation, in the Àger syncline of the
      southern Pyrenees in northeastern Spain". The Àger syncline is a
      separate minibasin from the Tremp syncline and carries its own unit
      names.
