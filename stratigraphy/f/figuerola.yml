name: Figuerola
rank: formation
parent: Fontllonga
period: [Late Cretaceous, Paleocene]
stages: [Maastrichtian, Danian]
dispute:
  summary: >
    Colombo and Cuevas (1993), who name the Fontllonga Group, place the
    Cretaceous–Tertiary boundary "en el tercio superior de la unidad terrígena
    de la Fm. Figuerola" (in the upper third of the terrigenous unit of the
    Figuerola Fm., translated). Fondevilla and colleagues (2019), recalibrating
    the formation's magnetozones, conclude that it "only records the late
    Maastrichtian", although the chrons they assign it, C31n to C29n, reach
    across the boundary.
references:
  - id: colombo1993a
    notes: >
      Places the formation, the "tramo detrítico inferior" of about 195 m,
      in the Fontllonga Group, and the Cretaceous-Tertiary boundary inside
      it: "ese evento se produce en el tercio superior de la unidad terrígena
      de la Fm. Figuerola" (this event occurs in the upper third of the
      terrigenous unit of the Figuerola Fm., translated), on magnetostratigraphy
      (chron C29r) and charophytes. The last dinosaurs and Cretaceous
      charophytes come about two million years before the boundary.
  - id: prieto-márquez2021a
    notes: >
      Gives the Fylax dentary as from "uppermost Maastrichtian strata (within
      chron C29r) of the Figuerola Formation, in the Àger syncline of the
      southern Pyrenees in northeastern Spain". The Àger syncline is a
      separate minibasin from the Tremp syncline and carries its own unit
      names.
  - id: fondevilla2019a
    notes: >
      Reinterprets the magnetozones that Galbrun and colleagues (1993) found in
      the formation, after re-dating the underlying La Maçana Formation: "the
      magnetozones found in the Figuerola Fm by Galbrun et al. (1993)
      represent chrons C31n-C29n instead of chrons C32n-C29n interval. Hence,
      the latter formation only records the late Maastrichtian". Chrons C29r
      and C29n span the Cretaceous–Paleogene boundary, and the paper's own
      chart of the section draws the 66 Ma line through the formation's upper
      part.
  - id: galbrun1993a
