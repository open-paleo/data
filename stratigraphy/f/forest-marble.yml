name: Forest Marble
rank: formation
parent: Great Oolite
period: [Middle Jurassic]
stages: [Bajocian, Bathonian]
references:
  - id: naish2007a
    notes: >
      Places Cetiosaurus oxoniensis in "the Bajocian-Bathonian Forest Marble
      Formation of Oxfordshire".
  - id: barron2012a
    notes: >
      Places it in the regional picture: in Wessex mudstone deposition
      "continued up to the late Bathonian (Frome Clay and Forest Marble
      formations)", and a late Bathonian sea-level rise "extended marine mud
      deposition even further north-east (Forest Marble Formation)".
  - id: upchurch2003a
    notes: >
      Gives the Cardiodon type tooth as coming "from the Middle Jurassic
      Forest Marble of Bradford-On-Avon, Wiltshire", and, following Phillips
      (1871), puts the Bletchingdon Station Cetiosaurus bones in "the Forest
      Marble (Bathonian ...) sediments immediately above the Great Oolite",
      taking the Bathonian age from Cope and colleagues (1980).
  - id: phillips1871a
    notes: >
      Names the unit once, in a measured section and in lower case, with no
      age attached: "The strata covering the solid oolite were thus noted,
      March 21, 1870: - Thin skerry beds of Forest marble and shaly clay." So
      it is a bed-by-bed record rather than a dating, although it is the
      source later work follows for the Cardiodon tooth.
  - id: cope1980a
  - id: cifelli2014a
    notes: >
      Lower molars of Palaeoxonodon "from the Forest Marble (Bathonian) of
      Britain" are very close in size and appearance to a stem zatherian from
      the Lakota Formation, the two separated by 25 Ma.
