name: Farmington
rank: member
parent: Kirtland
period: [Late Cretaceous]
stages: [Campanian]
references:
  - id: jasinski2026a
    notes: >
      Names it among the Kirtland's members, the De-na-zin being
      "lithologically distinct from the underlying upper Campanian Hunter Wash
      and Farmington members of the Kirtland Formation".
  - id: fassett1997a
    notes: >
      The C33n-C32r polarity reversal lies in the upper part of "the Upper
      Cretaceous continental Farmington Sandstone Member of the Kirtland
      Shale" at Hunter Wash, in the southwest San Juan Basin; ash beds
      bracketing that reversal "establish its age as 73.50 ± 0.18 Ma". Ash H,
      in the upper part of the member, dates to 73.37 ± 0.18 Ma and ash J,
      very near its top, to 73.04 ± 0.25 Ma.
