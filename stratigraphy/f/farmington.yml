name: Farmington
rank: member
parent: Kirtland
period: [Late Cretaceous]
stages: [Campanian]
references:
  - id: jasinski2026a
    notes: >
      Names it among the Kirtland's members, the De-na-zin being
      "lithologically distinct from the underlying upper Campanian Hunter Wash
      and Farmington members of the Kirtland Formation".
  - id: fassett1997a
    notes: >
      The C33n-C32r polarity reversal lies in the upper part of "the Upper
      Cretaceous continental Farmington Sandstone Member of the Kirtland
      Shale" at Hunter Wash, in the southwest San Juan Basin; ash beds
      bracketing that reversal "establish its age as 73.50 ± 0.18 Ma". Ash H,
      in the upper part of the member, dates to 73.37 ± 0.18 Ma and ash J,
      very near its top, to 73.04 ± 0.25 Ma.
  - id: hunt1992a
    notes: >
      Shortens the name: "Since the Farmington Sandstone Member also includes
      conglomerate, mudstone and siltstone, we refer to it as the Farmington
      Member", the only Kirtland member Bauer (1916) named, with its type
      section on the San Juan River, "where the unit is 139 m thick". It is a
      fluvial clastic wedge that pinches out to the southeast and interfingers
      with the Hunter Wash Member. Reports Newman's (1987) palynological
      conclusion that "a portion of the upper Farmington Member, the De-na-zin
      Member and the Naashoibito Member were early Maastrichtian in age", and
      dates the lower four members together as "Edmontonian (early
      Maastrichtian)" with the Campanian–Maastrichtian boundary at 74.0 Ma.
  - id: bauer1916a
  - id: newman1987a
