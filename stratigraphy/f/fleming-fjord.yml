name: Fleming Fjord
rank: group
period: [Late Triassic]
stages: [Norian, Rhaetian]
references:
  - id: clemmensen2020a
    notes: >
      Erects the group and gives its span and setting: "The Norian-early
      Rhaetian, lacustrine Fleming Fjord Group was deposited at about 41° N on
      the northern part of the supercontinent Pangaea", the dating resting on
      "sparse invertebrate fossils, land-derived palynomorphs, vertebrate
      remains, and palaeomagnetic data". The Malmros Klint Formation and the
      Carlsberg Fjord and Tait Bjerg Members lie inside it. Raises the Fleming
      Fjord Formation to a group of three formations, the Edderfugledal,
      Malmros Klint and Ørsted Dal, and gives its span and setting: "The
      Norian-early Rhaetian, lacustrine Fleming Fjord Group was deposited at
      about 41° N on the northern part of the supercontinent Pangaea", having
      "been dated to the Late Triassic (most likely Norian - early Rhaetian)
      based on sparse invertebrate fossils, land-derived palynomorphs,
      vertebrate remains, and palaeomagnetic data". Magnetochronological work
      by Kent and Clemmensen (1996) "supports that the vertebrate bearing red
      beds of the Fleming Fjord Group are of late Norian age".
  - id: kent1996a
    notes: >
      Magnetostratigraphy of a 210 m section through the Malmros Klint Member
      and the lowermost Carlsberg Fjord beds, correlated to the
      cyclostratigraphically calibrated Newark Basin polarity sequence,
      "suggests that the sampled interval represents about a 3.5 m.y. interval
      of the late Norian", running on that correlation from about 211 to about
      207.5 Ma. Conchostracans in the Edderfugledal and Malmros Klint Members
      "suggest a Late Triassic (?Carnian to ?Norian) age, while ostracods,
      pelecypods, and palynomorphs in the Tait Bjerg Beds indicate that the
      uppermost part of the Fleming Fjord Formation is Rhaetian in age".
