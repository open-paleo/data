name: Fleming Fjord
rank: group
period: [Late Triassic]
stages: [Norian, Rhaetian]
lithology: red mudstone and sandstone, with dolostone, conglomerate, marlstone
  and limestone
references:
  - id: clemmensen2020a
    notes: >
      Raises the Fleming Fjord Formation to a group of three formations, the
      Edderfugledal, Malmros Klint and Ørsted Dal, and dates it "most likely
      Norian – early Rhaetian". Source of the lithology.
  - id: kent1996a
    notes: >
      Correlates the magnetostratigraphy of 210 m of the Malmros Klint and
      lowest Carlsberg Fjord beds with the Newark sequence, giving "about a 3.5
      m.y. interval of the late Norian".
