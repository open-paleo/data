name: Frenchman
rank: formation
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
description: "The Frenchman Formation is a stratigraphic unit of Late Cretaceous (late Maastrichtian) age in the Western Canada Sedimentary Basin. It is present in southern Saskatchewan and the Cypress Hills of southeastern Alberta. The formation was defined from outcrops along the Frenchman River, between Ravenscrag and Highway 37. It contains the youngest of dinosaur genera, much like the Hell Creek Formation in the United States."
references:
  - id: brown2011a
    notes: >
      Describes Thescelosaurus assiniboiensis from "the Frenchman Formation
      (late Maastrichtian) of Saskatchewan".
  - id: boyd2015a
    notes: >
      Assigns Thescelosaurus assiniboiensis, known from a single specimen, to
      "the Late Cretaceous Frenchman Formation of Saskatchewan, Canada".
  - id: brett-surman1989a
    notes: >
      Campanian, in a world list of formations with hadrosaurian remains:
      "Frenchman Fm, Campanian".
