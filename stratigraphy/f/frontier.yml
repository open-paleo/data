name: Frontier
rank: formation
period: [Late Cretaceous]
stages: [Cenomanian, Turonian, Coniacian]
references:
  - id: carpenter1998c
    notes: >
      Gives the formation and its Belle Fourche Member at "Middle Cenomanian",
      and records that Merewether and colleagues "revised the Frontier
      Formation in Wyoming" in the course of erecting that member.
  - id: merewether1979a
    notes: >
      The specialist treatment, and the source of the formation's younger
      stages. Its abstract gives the eastern Wyoming section as containing
      "invertebrate fossils of Cenomanian, Turonian, and Coniacian age", and
      resolves the formation internally: it "is divided into as many as three
      members, which are, from older to younger, the Belle Fourche Member of
      Cenomanian age, the unnamed member of early and middle Turonian age,
      and the Wall Creek Member of late Turonian and early Coniacian age".
      The Albian appears nowhere in it.
  - id: merewether1984a
    notes: >
      Near the Moxa Arch the basal Chalk Creek Member "is largely of
      Cenomanian and earliest Turonian age and apparently is correlative with
      the Belle Fourche Shale and part of the Greenhorn Formation of
      northeastern Wyoming". It "conformably overlies the Lower Cretaceous
      Aspen Shale", and "the basal part of the Chalk Creek in some areas could
      be Early Cretaceous", where it seems to intertongue with the upper
      Aspen. That Early Cretaceous follows the former placement of the
      Albian–Cenomanian boundary at the top of the Mowry and its western
      equivalent the Aspen; Singer and colleagues (2020) place the boundary
      below the Mowry, which makes beds at that level Cenomanian.
  - id: cobban1990a
    notes: >
      In Natrona County the formation "conformably overlies the Mowry Shale"
      and consists of "the Belle Fourche Member of early to late Cenomanian
      age, the informal member of Emigrant Gap (formerly known as the unnamed
      member) of middle Turonian age, and the Wall Creek Member of late
      Turonian age".
  - id: singer2020a
    notes: >
      Dates the Mowry Shale beneath the formation at 98.17 ± 0.11 Ma (Clay
      Spur Bentonite) and 97.52 ± 0.09 Ma (topmost bentonite), and records
      that "the placement of the Albian–Cenomanian boundary below the Mowry
      Shale/Fish Scales Formation" has "Only recently" been "widely accepted",
      replacing the "historic usage" of the Clay Spur as the boundary.
  - id: merewether2010a
    notes: >
      In the Bighorn Basin, "A long-ranging ammonite, Metengonoceras sp.
      (Albian and early Cenomanian, D9818), was also found in a lower part of
      the formation". Its range takes in the early Cenomanian, so it does not
      require an Albian age.
  - id: gale2020a
    notes: >
      Puts the base of the Cenomanian at 100.5 Ma, older than the Mowry
      bentonite dates.
