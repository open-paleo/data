name: Fontllonga
rank: group
period: [Late Cretaceous, Paleocene]
stages: [Maastrichtian, Danian, Selandian, Thanetian]
references:
  - id: colombo1993a
    notes: >
      Names the group in the Àger sector for the continental beds between
      the marine Maastrichtian Bona Formation and the Ilerdian alveolina
      limestones of the Cadí Formation, naming them the "Grupo Fontllonga",
      in four units: the La Massana limestones, the Figuerola Formation, the Milla
      limestones and the Perauba Complex. Dates the succession "entre el
      Maastrichtiense y el Paleógeno inferior" (between the Maastrichtian and
      the lower Paleogene, translated), its section spanning "desde el
      Maastrichtiense inferior a Taneciense inferior" (from the lower
      Maastrichtian to the lower Thanetian, translated), with the
      Cretaceous-Tertiary boundary in the upper Figuerola.
  - id: fondevilla2019a
    notes: >
      "Colombo and Cuevas (1993) did the same for the Àger Syncline,
      replacing the Tremp Fm by the Fontllonga Group".
