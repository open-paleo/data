name: Fontllonga
rank: group
period: [Late Cretaceous, Paleocene]
stages: [Maastrichtian, Danian, Selandian, Thanetian]
references:
  - id: colombo1993a
    notes: >
      Names the Fontllonga Group for the continental beds of the Àger sector
      between the Bona and Cadí formations, and dates them from the lower
      Maastrichtian to the lower Thanetian.
  - id: fondevilla2019a
    notes: >
      "Colombo and Cuevas (1993) did the same for the Àger Syncline,
      replacing the Tremp Fm by the Fontllonga Group".
