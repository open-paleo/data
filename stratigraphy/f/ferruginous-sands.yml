name: Ferruginous Sands
rank: formation
parent: Lower Greensand
period: [Early Cretaceous]
stages: [Aptian]
lithology: dark gray sandy mud and muddy sand passing up into glauconitic sand
references:
  - id: barker2020a
    notes: >
      Places it in the Lower Greensand Group, the Vectaerovenator horizon
      being "formed of the three strata of the Lower Greensand Group: the
      uppermost members of the Ferruginous Sands Formation (late Aptian in
      age ...)" and the units above it.
  - id: hopson2008a
    notes: >
      Describes its rock: "The formation comprises a number of heavily
      bioturbated coarsening-upward units each comprising dark grey sandy muds
      or muddy sands passing up into fine- to medium-grained grey to green
      glauconitic sands."
