name: Forest Sandstone
rank: formation
period: [Early Jurassic]
lithology: fine- to medium-grained, well-sorted sandstone
references:
  - id: viglietti2018a
    notes: >
      Places the Vulcanodon horizon in the uppermost Forest Sandstone and
      correlates the upper formation with the Clarens Formation, making
      Vulcanodon "likely Sinemurian–Pliensbachian". Source of the lithology.
  - id: rauhut2003b
    notes: >
      Gives the occurrence as "Forest Sandstone, Matabeleland, Zimbabwe" and
      the range of Syntarsus rhodesiensis as "Early Jurassic
      (Hettangian-Sinemurian)".
  - id: bristowe2004a
    notes: >
      Gives "Early Jurassic: Hettangian ... Forest Sandstone Formation".
  - id: raath1969a
    notes: >
      Following Bond (1955), who correlated the unit at Southcote Farm,
      northwest of Bulawayo, "with the Upper part of the South African Red
      Beds" on the basis of its fossils, concludes: "The deposits are thus
      Upper Karroo (Upper Triassic) in age."
  - id: visser1984a
    notes: >
      Reviews the Stormberg Group under the name Cave Sandstone, listing the
      Forest Sandstone as its Zimbabwean correlative, and recognizes "Four Late
      Triassic depositional basins".
  - id: bond1955a
  - id: jourdan2008a
