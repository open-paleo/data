name: Forest Sandstone
rank: formation
period: [Late Triassic, Early Jurassic]
stages: [Rhaetian, Hettangian, Sinemurian, Pliensbachian]
references:
  - id: viglietti2018a
    notes: >
      Corrects the Vulcanodon horizon and dates the unit by correlation: the
      taxon "is from lower in the stratigraphy than previously documented,
      lying within the uppermost Forest Sandstone rather than the interbedded
      sandstones of the Batoka Basalt Formation", and "the upper part of the
      Forest Sandstone correlates with the Clarens Formation of the main Karoo
      Basin, implying that Vulcanodon is likely Sinemurian-Pliensbachian in
      age". Because Visser (1984) suggested that northern basins could be
      older than their main Karoo equivalents and that an unconformity may lie
      beneath the basalt, the Vulcanodon stratum "could be as old as the
      Rhaetian or as young as the Pliensbachian".
  - id: rauhut2003b
    notes: >
      Gives the occurrence as "Forest Sandstone, Matabeleland, Zimbabwe" and
      the range of Syntarsus rhodesiensis as "Early Jurassic
      (Hettangian-Sinemurian)".
  - id: bristowe2004a
    notes: >
      Gives "Early Jurassic: Hettangian ... Forest Sandstone Formation".
  - id: raath1969a
    notes: >
      Following Bond (1955), who correlated the unit at Southcote Farm,
      northwest of Bulawayo, "with the Upper part of the South African Red
      Beds" on the basis of its fossils, concludes: "The deposits are thus
      Upper Karroo (Upper Triassic) in age."
  - id: visser1984a
    notes: >
      A review of the Stormberg Group and Drakensberg Volcanics, in which
      this unit appears only in passing as the Zimbabwean correlative; the
      paper works throughout in the legacy name Cave Sandstone. It recognizes
      "Four Late Triassic depositional basins which were tectonically
      controlled", and gives the capping lavas as "the Drakensberg Volcanics
      with radiometric ages of 114 My to 194 My". That eighty-million-year
      span is 1984-vintage potassium-argon work; Jourdan and colleagues
      (2008) date the same Lesotho pile at 181.6 plus or minus 0.7 Ma by
      argon-argon, so the bracket here is superseded rather than open.
  - id: bond1955a
