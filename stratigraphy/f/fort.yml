name: Fort
rank: member
parent: Jaisalmer
period: [Middle Jurassic]
stages: [Bathonian]
references:
  - id: bajpai2023a
    notes: >
      Gives the Tharosaurus horizon as "a shale unit situated at the base of
      the early-middle Bathonian Fort Member" in the Jaisalmer Basin of
      Rajasthan, western India.
  - id: mannion2025a
    notes: >
      Places it below the "Bathonian Badabag Member of the Jaisalmer
      Formation, which overlies the Fort Member that yielded Tharosaurus", so
      the sibling above carries a stage while this member's own age comes from
      elsewhere.
  - id: vanderlinden2025a
    notes: >
      Places Tharosaurus indicus, described by Bajpai and colleagues (2023),
      "from the Middle Jurassic Fort Member of the Jaisalmer Formation of
      India".
  - id: pandey2012a
    notes: >
      Credits the member to Narayanan and colleagues (1961), an unpublished
      report, with its type area in the "fort-hill sections, just north of
      Jaisalmer city". It lies "above the Late Bajocian coral bearing horizon
      of the Joyan Member and below the Late Bathonian ammonite-bearing Bada
      Bag Member", in four facies units whose lowest is non-marine fine
      sandstone, and on that position "the age of the Fort Member can be
      safely assigned to the Early Bathonian to Middle Bathonian/?Late
      Bathonian". Of the bivalves and foraminifera behind older ages, "this
      fauna may also occur in Callovian, and it seems that these bivalves and
      foraminifers are not age-diagnostic".
  - id: kumar2022a
    notes: >
      Third of the Jaisalmer Formation's members, "Hamira, Joyan, Fort,
      Badabag, Kuldhar and Jajiya, in an ascending order", and 15 m thick near
      Jethwai village; "the age of the Fort Member can be safely described as
      early Bathonian to Middle/Late Bathonian".
  - id: ahmad2021a
    notes: >
      From its position above the Joyan and the record of the ammonite
      Clydoniceras, gives "the age of the Fort Member as
      Early-Middle/Early-Late Bathonian".
  - id: kulkarni2008a
    notes: >
      Reports three earlier readings: Kachhara and Jodhawat (1999) assigned
      the bivalve zone at the top of the Fort scarp "a Lower Callovian age",
      Dave and Chatterjee (1996) "a Lower Bathonian age to the entire Fort
      Member", and Khosla and colleagues (2006) "a Bajocian-Bathonian age".
      Concludes that the beds "are assigned ages ranging from Bathonian to
      Callovian".
