name: Fort
rank: member
parent: Jaisalmer
period: [Middle Jurassic]
stages: [Bathonian]
lithology: fine to medium-grained sandstone and sandy or oolitic limestone, with
  conglomerate
references:
  - id: bajpai2023a
    notes: >
      Gives the Tharosaurus horizon as "a shale unit situated at the base of
      the early-middle Bathonian Fort Member" in the Jaisalmer Basin of
      Rajasthan, western India.
  - id: mannion2025a
    notes: >
      Places it below the "Bathonian Badabag Member of the Jaisalmer Formation,
      which overlies the Fort Member that yielded Tharosaurus".
  - id: vanderlinden2025a
    notes: >
      Places Tharosaurus indicus, described by Bajpai and colleagues (2023),
      "from the Middle Jurassic Fort Member of the Jaisalmer Formation of
      India".
  - id: pandey2012a
    notes: >
      Credits the member to Narayanan and colleagues (1961), with its type area
      in the "fort-hill sections" north of Jaisalmer, and from its position
      dates it Early to Middle or ?Late Bathonian.
  - id: kumar2022a
    notes: >
      Third of the Jaisalmer Formation's members, "Hamira, Joyan, Fort, Badabag,
      Kuldhar and Jajiya, in an ascending order", and 15 m thick near Jethwai
      village; "the age of the Fort Member can be safely described as early
      Bathonian to Middle/Late Bathonian". Source of the lithology.
  - id: ahmad2021a
    notes: >
      From its position above the Joyan and the record of the ammonite
      Clydoniceras, gives "the age of the Fort Member as
      Early-Middle/Early-Late Bathonian".
  - id: kulkarni2008a
    notes: >
      Reports three earlier readings: Kachhara and Jodhawat (1999) assigned
      the bivalve zone at the top of the Fort scarp "a Lower Callovian age",
      Dave and Chatterjee (1996) "a Lower Bathonian age to the entire Fort
      Member", and Khosla and colleagues (2006) "a Bajocian-Bathonian age".
      Concludes that the beds "are assigned ages ranging from Bathonian to
      Callovian".
  - id: dave1996a
  - id: kachhara1999a
  - id: khosla2006a
  - id: narayanan1961a
