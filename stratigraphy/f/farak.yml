name: Farak
rank: formation
period: [Early Cretaceous, Late Cretaceous]
stages: [Albian, Cenomanian]
references:
  - id: sereno2026a
    notes: >
      Places the Spinosaurus mirabilis holotype in the formation, assigns the
      Jenguebi and Iguidi fossil areas to it, and dates their fauna
      "Early-Middle Cenomanian" by comparison with the Kem Kem Group.
  - id: hunt1994a
    notes: >
      Lists Rebbachisaurus tamesnensis and Aegyptosaurus baharijensis from the
      "Farak Fm." of Niger in its Early Cretaceous sauropod table, with the
      stage given as "Alb/Cen", Albian/Cenomanian.
  - id: faure1966a
