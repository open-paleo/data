name: Farak
rank: formation
period: [Early Cretaceous, Late Cretaceous]
stages: [Albian, Cenomanian]
references:
  - id: sereno2026a
    notes: >
      Gives the Spinosaurus mirabilis horizon as "Farak Formation; Cenomanian
      ~95 million years ago", at Sirig Taghat in the Jenguebi area of the
      Agadez Region of Niger, and places it among the four terrestrial
      formations of the Iullemeden Basin south of the Aïr Massif that were
      "initially informally described as 'Continentale intercalaire'".
      Its supplementary materials take the formation from Faure's section at
      the Farak falaise north of Tanout, below the Cenomanian–Turonian
      limestone, assign the Iguidi (In Abangharit) and Jenguebi fossil areas
      to it, and date its fauna "Early-Middle Cenomanian" by comparison with
      the Kem Kem Group.
  - id: hunt1994a
    notes: >
      Lists Rebbachisaurus tamesnensis and Aegyptosaurus baharijensis from the
      "Farak Fm." of Niger in its Early Cretaceous sauropod table, with the
      stage given as "Alb/Cen", Albian/Cenomanian.
  - id: faure1966a
