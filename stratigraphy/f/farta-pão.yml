name: Farta Pão
rank: formation
period: [Late Jurassic]
stages: [Kimmeridgian, Tithonian]
dispute:
  summary: >
    Schneider and colleagues (2009) date the formation by strontium isotopes
    on oyster shells "from the latest Kimmeridgian to the latest Tithonian",
    its topmost Freixial Member included, and Mateus and colleagues (2017)
    follow them. The same paper relays older micropaleontology under which
    "the top of the Farta Pão and Freixial units" were "both also considered
    as Berriasian based on foraminifera, ostracods and charophytes", the
    foraminifer Anchispirocyclina lusitanica "indicating a Tithonian to
    lowermost Cretaceous age".
references:
  - id: mateus2017a
    notes: >
      Explains the unit's current meaning and why its subdivisions changed
      rank: "The main change was the creation of a new meaning for the Farta
      Pão Formation, chosen (after Schneider et al., 2009) because it was the
      oldest available name uniting the (also proposed) Sobral, Arranhó I,
      Arranhó II, and Freixial Members." Gives "the Farta Pão Fm. (dated as
      latest Kimmeridgian to latest Tithonian, Schneider et al., 2009)", and
      separately relays "the top of the Farta Pão and Freixial units, both
      also considered as Berriasian based on foraminifera, ostracods and
      charophytes", placing beds of that age at "the top of the Farta Pão
      Formation (sensu Wilson, 1988)".
  - id: mocho2014a
    notes: >
      Gives the same history from the other side: Schneider, Fürsich and
      Werner (2009) "included as members of the Farta Pão Formation the
      previous Sobral, Arranhó (divided into the Arranhó I and II members),
      and Freixial Formations".
  - id: schneider2009a
    notes: >
      Dates the unit directly by Sr-isotope stratigraphy on oyster shells and
      erects its members: "The Farta Pao formation ranges from the latest
      Kimmeridgian to the latest Tithonian. The largely synchronous Sobral,
      Arranho I, and Arranho II members are overlain by the late Early to
      Late Tithonian Freixial Member", and "Herein, we propose four members
      for the Farta Pao formation". The topmost member is dated directly and
      comes out Jurassic: three of four samples near Chamboeira "indicate a
      Late Tithonian age, which corresponds to foraminiferal and
      dasycladacean data", and the Freixial is "obviously the youngest
      Jurassic lithostratigraphic unit of the area". The paper's three
      mentions of the Berriasian attach to other things — a basin-scale
      megasequence envelope, and an upper Alcobaca reading it reports and
      discounts because "the authors did not provide an explanation for this
      interpretation".
  - id: wilson1988a
    notes: >
      Names the unit once in its text, without a stage, as the cap of a
      Sintra-area carbonate slope system that "comprises the Ramalhaõ, Mem
      Martins and Farta Paõ formations".
