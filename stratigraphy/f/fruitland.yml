name: Fruitland
rank: formation
period: [Late Cretaceous]
stages: [Campanian]
lithology: sandstone, siltstone and carbonaceous shale, with coal
references:
  - id: jasinski2011a
    notes: >
      Gives "Fruitland Formation (Fossil Forest Member), late Campanian".
  - id: ford2000a
    notes: >
      Pairs it with its neighbor at the same age, "Fruitland Formation, late
      Campanian, Late Cretaceous" and "Kirtland Formation, late Campanian".
  - id: fassett1997a
    notes: >
      Dates ash beds in the formation by 40Ar/39Ar, from 75.56 ± 0.41 Ma near
