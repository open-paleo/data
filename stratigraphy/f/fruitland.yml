name: Fruitland
rank: formation
period: [Late Cretaceous]
stages: [Campanian]
references:
  - id: jasinski2011a
    notes: >
      Gives "Fruitland Formation (Fossil Forest Member), late Campanian".
  - id: ford2000a
    notes: >
      Pairs it with its neighbor at the same age, "Fruitland Formation, late
      Campanian, Late Cretaceous" and "Kirtland Formation, late Campanian".
  - id: fassett1997a
    notes: >
      The Hunter Wash traverse crossed "the upper part of the continental
      Upper Cretaceous Fruitland Formation, the Kirtland Shale, and the lower
      part of the Tertiary Ojo Alamo Sandstone". Its 40Ar/39Ar ages on ash
      beds in the formation run from 75.56 ± 0.41 Ma, for an ash in "the upper
      part of the stratigraphically lowest outcropping Fruitland Formation
      coal bed in the San Juan Basin", to 74.11 ± 0.62 Ma for one "at the top
      of a coal bed at the top of the Fruitland Formation".
