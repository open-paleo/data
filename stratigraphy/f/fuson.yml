name: Fuson
rank: member
parent: Lakota
period: [Early Cretaceous]
stages: [Valanginian, Hauterivian, Barremian]
references:
  - id: boyd2015b
    notes: >
      Relocates the Dakotadon type locality in unit L2, "lower Fuson Member
      equivalent", and gives it a late Valanginian to early Barremian age after
      Cifelli and colleagues (2014).
  - id: ostrom1970a
    notes: >
      Records the historical correlation across the region, Darton having
      written that "The Cloverly formation is believed to represent the
      Lakota sandstone, Fuson formation and Dakota sandstones of the Black
      Hills region".
  - id: cifelli2014a
    notes: >
      Dates the mammal site OMNH V1254 on Stagebarn Canyon Road by ostracods,
      which match the eastern sequences rather than the Chilson Member, to the
      "upper Valanginian–lower Barremian".
  - id: darton1906a
    notes: >
      Inert on age and about a different region. A survey folio of the
      Bighorn country, it reaches this unit only as a Black Hills
      correlative: "The Cloverly formation is believed to represent the
      Lakota sandstone, Fuson formation, and Dakota sandstone of the Black
      Hills region." It names no international
      stage at all, working only in Upper and Lower Cretaceous and Jurassic.
  - id: sohn1979a
    notes: >
      States that "The Lakota Formation consists, in ascending order, of the
      Chilson Member, the Minnewaste Limestone Member, and the Fuson Member".
      Eight ostracode collections from the Fuson in Fall River and Custer
      Counties hold three genera that "differ on the generic level" from the
      eight of the Chilson; Sohn's age for the formation, "Barremian or
      older", rests on the Chilson.
  - id: d'emic2019a
    notes: >
      Correlates the Minnewaste Limestone and the Fuson Member with the
      Little Sheep Mudstone of the Cloverly Formation, which its new zircon
      ages date, and gives these units as having been "deposited in both the
      Aptian and the Albian"; the Fuson is "unconformably overlain by the
      Fall River Formation". The age for the Fuson rests on the correlation,
      not on dates from the member.
