name: Fengjiahe
rank: formation
period: [Early Jurassic]
stages: [Hettangian, Sinemurian, Pliensbachian, Toarcian]
lithology: purplish and dark red mudstone and siltstone, with greenish siltstone
  and quartz sandstone
references:
  - id: yao2022a
    notes: >
      Describes Yuxisaurus from the upper part of the formation near
      Jiaojiadian, Yimen County, dated "late Sinemurian–Toarcian" after Huang
      and colleagues (2005). Source of the lithology.
  - id: sánchez-fenollosa2025a
    notes: >
      Independently gives "Fengjiahe Formation, late Sinemurian-Toarcian".
  - id: zhen1985a
    notes: >
      Identifies the formation with Young's (1951) "lower Lufeng series" and
      reports that Chen and colleagues (1982), on non-marine invertebrates,
      "assigned a Hettangian-Pliensbachian age" to it.
  - id: huang2005a
    notes: >
      A magnetostratigraphic study of the Lufeng area, whose correlation table
      lists the formation beside the Lufeng Formation in the Lower Jurassic.
  - id: chen1982a
  - id: young1951a
