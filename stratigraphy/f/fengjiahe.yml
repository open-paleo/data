name: Fengjiahe
rank: formation
period: [Early Jurassic]
stages: [Hettangian, Sinemurian, Pliensbachian, Toarcian]
references:
  - id: yao2022a
    notes: >
      Describes Yuxisaurus from "the Lower Jurassic Fengjiahe Formation of
      Yunnan Province", and gives the locality and span of the upper part:
      "Upper part of the Fengjiahe Formation, near Jiaojiadian village, Yimen
      County, Yuxi Prefecture, Yunnan Province, China; late
      Sinemurian–Toarcian", a span taken from the magnetostratigraphic age
      Huang and colleagues (2005) gave the laterally equivalent Lufeng
      Formation.
  - id: sánchez-fenollosa2025a
    notes: >
      Independently gives "Fengjiahe Formation, late Sinemurian-Toarcian".
  - id: zhen1985a
    notes: >
      Identifies it with the "lower Lufeng series" of Young (1951) and reports
      its dating from non-marine invertebrates: Chen and colleagues (1982)
      "assigned a Hettangian-Pliensbachian age to the Fengjiahe Formation".
      Identifies it with Young's "lower Lufeng series" and reports its dating
      from non-marine invertebrates: Chen and colleagues (1982) "assigned a
      Hettangian-Pliensbachian age to the Fengjiahe Formation".
  - id: huang2005a
    notes: >
      A magnetostratigraphic study of the Jurassic in the Lufeng area, and it
      places this unit and its neighbors in the Lower Jurassic: its
      stratigraphic table carries the Fengjiahe and the Lufeng formations
      both as J1, with the Lufeng's Zhangjiaba and Shawan members beneath
      that heading and the Triassic units below them. It correlates the upper
      part of the Lufeng Formation with the upper Toarcian, reads sites low
      in the section as "roughly" middle Sinemurian, and records that the
      interval "from the base of the Zhangjiaba Member through the Shawan
      Member has unstable rock magnetism with disordered directions", so the
      members themselves are the part it cannot correlate. It concludes that
      the transitional Yubacun Formation, between the Upper Triassic Zhaijie
      and the Lower Jurassic Lufeng, "should be assigned to the Jurassic
      System". It names no Norian, and its single Rhaetian is a polarity zone
      below this unit. Note it spells the member Zhangjiaba, a third form
      beside Zhangjia'ao and Zhangjiawa.
  - id: chen1982a
  - id: young1951a
