name: Yellow Cat
rank: member
parent: Cedar Mountain
period: [Early Cretaceous]
stages: [Berriasian, Valanginian, Hauterivian, Barremian]
references:
  - id: senter2012b
    notes: >
      Places it in its parent and hedges the Barremian: "Yellow Cat Member of
      the Cedar Mountain Formation (Early Cretaceous, Barremian? - Aptian)".
  - id: kirkland2016a
    notes: >
      Relays maximum depositional ages of about 124 and 122 Ma for the member
      (a "most widely cited age of 124.2 ± 2.6 Ma", and others near 122 Ma),
      Barremian on the current chart, and adds that "somewhat ambiguous
      chemostratigraphic profiles also suggest Barremian to Aptian age".
  - id: joeckel2019a
    notes: >
      Zircons from ten horizons give youngest single-grain ages "ranging from
      142.5±2.7 Ma to 133.7 ± 2.7 Ma (Berriasian–late Valanginian)", and a new
      palynoflora "is provisionally assigned to the middle Berriasian–early
      Hauterivian stages". The ages hold for the sections sampled: "Although
      earlier studies documented the presence of Barremian–Aptian strata in
      other parts of the Yellow Cat Member, the stratigraphic sections
      examined for this zircon U-Pb geochronologic study range through the
      Berriasian, Valanginian, and Hauterivian stages." The member is
      diachronous rather than fixed to those stages: the paper does not set
      aside the younger dates elsewhere, citing a 124 Ma age near Dalton Wells
      as "demonstrating that the unit ranges upward into the early Aptian", an
      older-chart stage for a figure that is Barremian on the current chart, and
      maximum depositional ages south of Green River putting parts of it no
      older than Barremian to Aptian, and concludes that "the stratigraphic
      architecture of the Yellow Cat Member is probably more complex than
      earlier conceptions based on lithostratigraphic perspectives". So the
      member's name alone does not fix a horizon's age.
  - id: joeckel2023a
    notes: >
      Dates a cryptotephra 36.35 m above the Morrison contact at Utahraptor
      Ridge to 135.10 ± 0.30 Ma by CA-ID-TIMS U-Pb, and reads the carbon
      isotope record as Berriasian below and Valanginian above, confirming
      "the Berriasian–Valanginian ages of part of the Yellow Cat Member".
  - id: sprinkel2012a
    notes: >
      "Barremian for the Yellow Cat Member in the northern Paradox Basin" is
      one of the tentative ages the lower three members of the Cedar Mountain
      Formation were initially assigned "based on dinosaur biostratigraphy".
      The member "extends below the interval of extensive calcretes
      development" to take in a strongly mottled, iron-stained interval with
      floating chert pebbles and an Early Cretaceous dinosaur fauna, and is
      "correlative, at least in part, with the Buckhorn Conglomerate".
