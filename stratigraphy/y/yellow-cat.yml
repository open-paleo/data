name: Yellow Cat
rank: member
parent: Cedar Mountain
period: [Early Cretaceous]
stages: [Berriasian, Valanginian, Hauterivian, Barremian]
lithology: drab variegated mudstone and limestone, with some sandstone lenses
references:
  - id: senter2012b
    notes: >
      Places it in its parent and hedges the Barremian: "Yellow Cat Member of
      the Cedar Mountain Formation (Early Cretaceous, Barremian? - Aptian)".
  - id: kirkland2016a
    notes: >
      Relays maximum depositional ages of about 124 and 122 Ma for the member (a
      "most widely cited age of 124.2 ± 2.6 Ma", and others near 122 Ma),
      Barremian on the current chart, and adds that "somewhat ambiguous
      chemostratigraphic profiles also suggest Barremian to Aptian age". Source
      of the lithology.
  - id: joeckel2019a
    notes: >
      Dates the sections it samples to the Berriasian–Hauterivian from zircons
      and a palynoflora, and finds the member's "stratigraphic architecture"
      more complex than lithostratigraphy suggests.
  - id: joeckel2023a
    notes: >
      Dates a cryptotephra 36.35 m above the Morrison contact at Utahraptor
      Ridge to 135.10 ± 0.30 Ma by CA-ID-TIMS U-Pb, and reads the carbon
      isotope record as Berriasian below and Valanginian above, confirming
      "the Berriasian–Valanginian ages of part of the Yellow Cat Member".
  - id: sprinkel2012a
    notes: >
      Relays the tentative Barremian age first given to the member, its
      extension below the calcretes, and its correlation, "at least in part",
      with the Buckhorn Conglomerate.
  - id: kirkland2007a
    notes: >
      Relays a fauna-based age of about 125–120 Ma, and the redefinition of the
      base "at the first occurrence of abundant chert pebbles above typical
      Morrison swelling clays".
  - id: mori2009a
    notes: >
      A master's thesis that dates the Yellow Cat and Poison Strip Members
      together, from detrital zircon maximum ages, as "124 to 122 M old".
  - id: kirkland1999a
  - id: kirkland1997a
  - id: kirkland1998e
  - id: greenhalgh2006a
