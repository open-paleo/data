name: Yan'an
rank: formation
period: [Early Jurassic, Middle Jurassic]
stages: [Toarcian, Aalenian, Bajocian]
variants: [Yanan]
references:
  - id: xu2018b
    notes: >
      The supplement reviews the formation's age: "no radiometric constraints
      have been obtained for the Yanan Formation itself", and biostratigraphy
      and its place between the Pliensbachian-early Toarcian Fuxian Formation
      below and the Zhiluo above make it "unlikely ... to be much older than
      late Toarcian" and "equally improbable for it to be younger than
      Bajocian". It records published estimates from late Toarcian to
      Aalenian-Bajocian, and divisions into four or five members.
  - id: you2019a
    notes: >
      Gives the local succession as "Middle Jurassic Yan'an Formation (J2y)
      and Zhiluo Formation (J2z)", the Zhiluo resting on the Yan'an's No. 1
      coal with a scour contact.
  - id: dai2022a
    notes: >
      Gives "Yan'an Formation (Aalenian–Bajocian)", in a sentence on the
      Lingwulong horizon.
  - id: mannion2025a
    notes: >
      Gives "the Aalenian (lower Middle Jurassic) Yan'an Formation".
