name: Yuliangzi
rank: formation
period: [Late Cretaceous]
stages: [Maastrichtian]
references:
  - id: xing2022a
    notes: >
      Gives "the upper Yuliangzi Formation (middle Maastrichtian)" and the
      correlation across the border: stratigraphic data "indicate that the
      Yuliangzi Formation is temporally and lithologically equivalent to the
      Udurchukan Formation". The Wulaga locality lies in the "Upper parts of
      the Udurchukan and Yuliangzi formations that are contemporaneous
      deposits both in the southern Zeya-Bureya Basin, middle Maastrichtian,
      Late Cretaceous".
  - id: yao2026a
    notes: >
      Hedges the older end, "the Yuliangzi Formation (?early to middle
      Maastrichtian) in Jiayin and Xunke, Heilongjiang Province".
  - id: godefroit2000a
    notes: >
      Reports the bonebeds "excavated in the Late Maastrichtian Yuliangze
      Formation near Jiayin (Heilongjang Province, northeastern China)",
      printing the name Yuliangze, and gives the type stratum as "Yuliangze
      Formation (Late Maastrichtian, Late Cretaceous)". It proposes the Late
      Maastrichtian age because preliminary palynological studies place the
      formation in the Wodehouseia spinata–Aquilapollenites subtilis
      palynozone.
