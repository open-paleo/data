name: Yuliangzi
rank: formation
period: [Late Cretaceous]
stages: [Maastrichtian]
lithology: fine- to coarse-grained sandstone, with muddy diamictite and
  conglomerate
references:
  - id: xing2022a
    notes: >
      Gives "the upper Yuliangzi Formation (middle Maastrichtian)" and the
      correlation across the border: stratigraphic data "indicate that the
      Yuliangzi Formation is temporally and lithologically equivalent to the
      Udurchukan Formation". The Wulaga locality lies in the "Upper parts of the
      Udurchukan and Yuliangzi formations that are contemporaneous deposits both
      in the southern Zeya-Bureya Basin, middle Maastrichtian, Late Cretaceous".
      Describes its rock: "Both the Yuliangzi and Udurchukan formations consist
      of meter-scale beds of green to brown fine- to medium-grained sandstone
      sometimes mixed with a muddy matrix, thick-bedded yellowish brown
      coarse-grained sandstone with gravels, and massive grayish green to brown
      muddy diamictite and conglomerates".
  - id: yao2026a
    notes: >
      Hedges the older end, "the Yuliangzi Formation (?early to middle
      Maastrichtian) in Jiayin and Xunke, Heilongjiang Province".
  - id: godefroit2000a
    notes: >
      Reports the bonebeds "excavated in the Late Maastrichtian Yuliangze
      Formation near Jiayin (Heilongjang Province, northeastern China)",
      printing the name Yuliangze, and gives the type stratum as "Yuliangze
      Formation (Late Maastrichtian, Late Cretaceous)". It proposes the Late
      Maastrichtian age because preliminary palynological studies place the
      formation in the Wodehouseia spinata–Aquilapollenites subtilis
      palynozone.
