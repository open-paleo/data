name: Yuliangzi
rank: formation
period: [Late Cretaceous]
stages: [Maastrichtian]
variants: [Yuliangze]
lithology: fine- to coarse-grained sandstone, with muddy diamictite and
  conglomerate
references:
  - id: xing2022a
    notes: >
      Dates the upper part of the formation to the middle Maastrichtian and
      treats the formation as "temporally and lithologically equivalent" to the
      Udurchukan Formation. Source of the lithology.
  - id: yao2026a
    notes: >
      Hedges the older end, "the Yuliangzi Formation (?early to middle
      Maastrichtian) in Jiayin and Xunke, Heilongjiang Province".
  - id: godefroit2000a
    notes: >
      Prints the name as Yuliangze and dates the formation to the Late
      Maastrichtian, placing it in the Wodehouseia spinata–Aquilapollenites
      subtilis palynozone.
