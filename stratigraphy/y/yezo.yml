name: Yezo
rank: group
period: [Early Cretaceous, Late Cretaceous]
stages: [Aptian, Albian, Cenomanian, Turonian, Coniacian, Santonian,
  Campanian, Maastrichtian]
references:
  - id: kobayashi2022a
    notes: >
      Describes the group as "composed of mainly Upper Cretaceous marine
      sediments and rich in invertebrate and vertebrate fossils, including
      sharks, plesiosaurs, mosasaurs, turtles, pterosaurs, non-avian
      dinosaurs, and birds", with the hedge in "mainly" left unexplained.
      Paralitherizinosaurus comes from "The Osoushinai Formation (early
      Campanian) of the Yezo Group" at Nakagawa.
  - id: takashima2004a
    notes: >
      Redefines the group at both ends. Its scheme runs "the Soashibetsugawa
      Formation (Lower Aptian mudstone unit)" upward through six more to "the
      Hakobuchi Formation (Lower Campanian Paleocene shallow-marine
      sandstone-conglomerate unit)", so the group begins in the Aptian rather
      than the upper Albian. The Hakobuchi is erected here as a formation that
      "corresponds to the Hakobuchi Group of Matsumoto", absorbing what
      earlier schemes kept above the group.
  - id: hayakawa2005a
    notes: >
      The superseded slicing: the Cretaceous strata comprise the group at
      "(Upper Albian-Santonian)" with "the Hakobuchi Group
      (Campanian-Paleocene)" above it as a separate group.
  - id: kobayashi2019a
    notes: >
      Follows the redefinition, describing Kamuysaurus from "the Late
      Cretaceous Hakobuchi Formation, Yezo Group".
  - id: suzuki2004a
    notes: >
      Records the renaming of the horizon rather than of the group: the
      "Upper Ammonites Bed" is "now Upper Yezo Group", and Matsumoto and
      Obata (1979) "advocated a late Santonian-early Campanian age, based on
      correlated molluscs". Note the source names the Upper Yezo Group
      specifically; whether the bare name should be read as that subdivision
      is unresolved, so no stages are recorded.
  - id: matsumoto1942a
  - id: matsumoto1979a
    notes: >
      Names the group once, and places it in the Japanese correlation-unit
      notation rather than in stages: plant fossils, pollen and other
      non-marine fossils are admixed in "the Yezo Group (K3-K5, part of
      K6a), the Izumi Group (K6), the Choshi Cretaceous (K2, K3a), and the
      Miyako Group (K3a to part of K3b)". No passage defines those units in
      stage terms, so the assignment is recorded as the paper gives it.
