name: Yubacun
rank: formation
period: [Late Triassic, Early Jurassic]
stages: [Rhaetian, Hettangian, Sinemurian]
references:
  - id: chen2026a
    notes: >
      In drill core WK23-1 at Wande, Kunming Basin, the formation runs from
      157.60 to 15.23 m, "yielding a total thickness of 142.37 m", and
      astronomical tuning "placed the Triassic–Jurassic boundary (TJB, 201.4
      Ma) at 111.29 m depth", so the lower part lies below the boundary. The
      Wudingloong horizon in the topmost beds falls at about 200.17 Ma. The
      paper names no stage for the beds below the boundary, which lie above
      the Norian-Rhaetian Shezi Formation.
  - id: pang2002a
    notes: >
      Erects the formation for the variegated beds between the Shezi and
      Fengjiahe formations and draws the Triassic-Jurassic boundary at its
      base: spores and pollen with no typical Triassic elements, plants and
      its own magnetostratigraphy make it Lower Jurassic, "roughly equivalent
      to the marine Hettangian–lower Sinemurian" (translated).
  - id: wang2025a
    notes: >
      Gives "Lower Jurassic Yubacun Formation (Hettangian to early
      Sinemurian, probably 200.17 Ma)", relaying Pang and colleagues (2002),
      Huang and colleagues (2005) and Chen and colleagues' preprint.
  - id: hu2026a
    notes: >
      Records that Wudingloong, "discovered from the Lower Jurassic Yubacun
      Formation, is considered the earliest-diverging sauropodomorph in East
      Asia". Gives only the series.
  - id: huang2005a
    notes: >
      On paleomagnetic correlation assigns "the variegated transitional bed
      from the Upper Triassic to the Lower Jurassic" to the Jurassic,
      "corresponding roughly to the Hettangian through lower Sinemurian". At
      the Yangjiazhuang section the upper part "corresponds to the lower part
      of the Early Jurassic Sinemurian and the top of the Hettangian", while
      lower samples from the formation there fall in a polarity zone "spanning
      the Early Jurassic Hettangian to the Late Triassic Rhaetian".
