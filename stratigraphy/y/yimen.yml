name: Yimen
rank: formation
period: [Early Jurassic, Middle Jurassic]
references:
  - id: li2010a
    notes: >
      Describes Tonganosaurus from "the Lower Jurassic Yimen Formation of
      Huili, Sichuan". Gives only the series.
  - id: maisch2019a
    notes: >
      Records that the taxon "from the Lower Jurassic Yimen Formation of
      southern Sichuan is currently the oldest known member" of
      Mamenchisauridae.
  - id: mcphee2016a
    notes: >
      Tabulates Tonganosaurus from it with a putative age of "?Lower–Middle
      Jurassic", and singles the unit out in recommending "caution in
      accepting the current age estimates" for the Early Jurassic
      sauropod-bearing units of China, since Tonganosaurus has been assigned
      to Mamenchisauridae, "a group otherwise restricted to the Middle–Late
      Jurassic".
