name: Yongkang
rank: group
period: [Early Cretaceous, Late Cretaceous]
stages: [Aptian, Albian, Cenomanian, Turonian]
references:
- id: chen2013a
  notes: >
    Names the group and its three mid-Cretaceous constituent formations,
    the Guantou, Chaochuan and Fangyan, in ascending sequence in the
    Yongkang Basin of Zhejiang.
- id: zhang2009b
  notes: >
    Gives the naming authority as "Ju Tianyin, Chen Qishi, 1989, Oil Geology
    of Zhejiang, (2). First appeared in a 1959 manuscript by Zhejiang Oil
    Geological Survey Team", with its type locality in "Yongkang County,
    Zhejiang Province", and defines the group "For the sum of Guantou
    Formation, Chaochuan Formation, Fangyan Conglomerate, Keshan Formation
    and Xiaopingtian Formation".
- id: luo2004a
  notes: >
    Traces the name to "the Yongkang Formation established in the Yongkang
    Basin by the Zhejiang Petroleum Geological Team (1959)", whose Guantou
    and Chaochuan members were raised to formations in 1962; "Ju Tianyin,
    Chen Qishi and others then grouped these three formations together as
    the Yongkang Group", the third being the Fangyan, and the Keshan and
    Xiaopingtian were later added from other basins. Volcanic rocks give
    Guantou ages "between 113 and 103 Ma" and Chaochuan ages of "101–96 Ma",
    and "The isotopic ages of the Yongkang Group thus lie between 113 and 90
    Ma, corresponding to the Aptian through the Turonian".
- id: li2014c
  notes: >
    Dates tuffs from the middle and lower parts of the group by SHRIMP
    zircon U-Pb, at 119 and 104 Ma in the Yongkang Basin and 124 Ma in the
    Tiantai Basin, and concludes that "the deposition of the Yongkang Group
    spanned an age range between 129 Ma and 91 Ma", the younger bound
    resting on dated tuffs in the Tiantai Basin. Gives no stage names.
- id: yu2010a
  notes: >
    From its entirely normal paleomagnetic polarity, places the group
    "between the Aptian of the late Early Cretaceous and the Santonian of
    the Late Cretaceous", a bracket rather than a dating.
