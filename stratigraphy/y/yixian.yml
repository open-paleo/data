name: Yixian
rank: formation
parent: Jehol
period: [Early Cretaceous]
stages: [Barremian]
lithology: andesite and basalt with tuff, tuffaceous sandstone, shale, mudstone,
  siltstone and conglomerate
references:
  - id: zhong2021a
    notes: >
      Dates zircons from tuffs at the bottom, middle and top of the formation in
      the Jin-Yang basin by CA-ID-IRMS U-Pb, bracketing it between 125.755 ±
      0.061 and 124.122 ± 0.048 Ma.
  - id: gale2020a
    notes: >
      "The Barremian Stage lasted 5.1 Myr from 126.5 ± 0.7 to 121.4 ± 0.6 Ma".
  - id: chang2017a
    notes: >
      Places the Dawangzhangzi beds inside the formation's sequence: "Wang et
      al. (1998, 2000) divided the Yixian Formation into (from bottom to top)
      the Lujiatun Unit, the Lower Lava Unit, the Jianshangou Unit, the Upper
      Lava Unit, the Dawangzhangzi Unit and the Jingangshan Unit."
  - id: zhou2006b
    notes: >
      Names Psittacosaurus lujiatunensis from the "lowest part of the Yixian
      Formation", which it dates Hauterivian on a 40Ar/39Ar date of 128.4 ± 0.2
      Ma; it gives that date for the lower Jianshangou sequence at Sihetun and,
      later, for the upper Lujiatun beds.
  - id: jiang2006a
    notes: >
      Dates the formation "late Hauterivian to early Barremian" from published
      radiometric ages, and correlates the fossil beds at Dawangzhangzi,
      Daxinfangzi and other sites with it.
  - id: pittman2020c
    notes: >
      Calls the formation "Barremian-Aptian" in a review of the pennaraptorans
      of the Jehol Biota, and gives it as "~125 Ma" elsewhere in the chapter.
  - id: wang2001c
    notes: >
      The 40Ar/39Ar date Zhou and colleagues (2006) relay. A basalt-andesite
      "collected from the low part of the bed 2 of the composite
      stratigraphic column" at Sihetun gives a plateau age of "128.2±0.8 Ma"
      and an isochron age of "128.4±0.2 Ma"; a diabase intruding beds 5 to 9
      gives a plateau age of "122.3±0.5 Ma". Superseded by the U-Pb ages of
      Zhong and colleagues (2021).
  - id: tong2021a
    notes: >
      Gives the Yixian records of Manchurochelys, Ordosemys liaoxiensis and
      Xiaochelys ningchengensis as "Early Cretaceous (Barremian–Aptian)".
  - id: jin2012a
    notes: >
      The "lowest more fluvial, volcanoclastic beds" of the formation, which
      yielded Hexing qingyi and, before it, Shenzhousaurus orientalis, are
      "Lower Valanginian–Lower Barremian, Lower Cretaceous" and "older than
      128 million years and younger than 139 million years", the dating
      following Swisher and colleagues (2002). Superseded by the U-Pb ages of
      Zhong and colleagues (2021).
  - id: sereno2010a
    notes: >
      Gives the type horizon of Psittacosaurus lujiatunensis and P. major as the
      "Lujiatun Beds, lowermost Yixian Formation", and puts those beds "no older
      than 123–125 Ma".
  - id: swisher2002a
    notes: >
      Dates sanidine from Yixian tuffs at Sihetun and Hengdaozi at 125.0 Ma by
      40Ar/39Ar, and a tuff in the underlying Tuchengzi Formation at 139.4 Ma.
  - id: he2006a
    notes: >
      One of the two dating papers Sereno (2010) cites for the lowermost
      beds. 40Ar/39Ar step heating of K-feldspar from the fossil-bearing
      tuff of the Lujiatun bed gives a weighted mean age of 123.2 ± 1.0 Ma,
      which "suggests the Lujiatun bed was most likely deposited at about
      the same time as the Jianshangou bed of the lower Yixian Formation".
      The date is Barremian on the ICS chart v2024/12.
  - id: zhou2007a
    notes: >
      The only Zhou and colleagues (2007) in Sereno's reference list, on
      psittacosaur endocranial anatomy; it gives no radiometric dates.
  - id: gradstein2004a
    notes: >
      The time scale behind the stage boundaries Sereno (2010) gives for the
      Liaoning psittacosaur beds.
  - id: wang1998a
    notes: >
      Cited by Chang and colleagues (2017) for dividing the formation into six
      units, including the Dawangzhangzi Unit.
  - id: wang2000a
    notes: >
      Cited by Chang and colleagues (2017) for dividing the formation into six
      units, including the Dawangzhangzi Unit.
  - id: yao2019a
    notes: >
      Gives the containment, "the Yixian Formation of Liaoning Province, which
      forms part of the Lower Cretaceous Jehol Group", beneath the overlying
      Jiufotang Formation, and leaves open whether the Sihedang beds belong to
      the Yixian or the Jiufotang.
  - id: chang2009a
    notes: >
      Source of the lithology.
