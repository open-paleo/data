name: Yixian
rank: formation
parent: Jehol
period: [Early Cretaceous]
stages: [Barremian]
references:
  - id: zhong2021a
    notes: >
      Dates single zircons from tuffs "collected from the top (CY18–20), middle
      (CY17–17) and bottom (CY17–18 and CY17–9) of the Yixian Formation in the
      Jin-Yang basin" by CA-ID-IRMS U-Pb: "Our new ages collectively provide
      very tight constraints on the onset at 125.755 ± 0.061 Ma (CY17–9) and
      termination at 124.122 ± 0.048 Ma (CY18–20) of the Yixian Formation,
      respectively, bracketing its duration to 1.633 ± 0.078 Myr." It names no
      stage. On the ICS chart v2024/12, whose Barremian begins at 125.77 Ma, the
      onset is Barremian at its central value but its uncertainty reaches the
      latest Hauterivian, and the rest of the bracket is Barremian; on GTS2020,
      whose Barremian begins at 126.5 Ma, the whole bracket is Barremian. It
      also finds that earlier ages "within individual units do not always show a
      consistency in stratigraphically upward deceasing trend".
  - id: gale2020a
    notes: >
      "The Barremian Stage lasted 5.1 Myr from 126.5 ± 0.7 to 121.4 ± 0.6 Ma".
  - id: chang2017a
    notes: >
      Places the Dawangzhangzi beds inside the formation's sequence: "Wang et
      al. (1998, 2000) divided the Yixian Formation into (from bottom to top)
      the Lujiatun Unit, the Lower Lava Unit, the Jianshangou Unit, the Upper
      Lava Unit, the Dawangzhangzi Unit and the Jingangshan Unit."
  - id: zhou2006b
    notes: >
      Places Psittacosaurus lujiatunensis in the "lowest part of the Yixian
      Formation (Hauterivian, Early Cretaceous)." It reports the 40Ar/39Ar
      date of Wang and colleagues (2001), first as "A basalt sample from the
      lower part of the Jianshangou sequence at Sihetun has yielded a
      40Ar/39Ar date of 128.4 ± 0.2 Ma" and later for "the upper parts of the
      Lujiatun beds of the Yixian Formation in western Liaoning", and
      concludes that "the age of these beds appears to be Hauterivian". The
      40Ar/39Ar Hauterivian is superseded by the U-Pb ages of Zhong and
      colleagues (2021).
  - id: jiang2006a
    notes: >
      Concludes from published radiometric ages, which mostly "range from 119
      to 133 Ma ... with a concentration around 125 Ma (Barremian)", that "The
      age of the Yixian Formation is, therefore, late Hauterivian to early
      Barremian." It correlates the outcrops beyond the type area with the
      formation: "Abundant vertebrate fossils have been recovered from what
      are clearly correlatable beds of the Yixian Formation in the
      Dawangzhangzi, Daxinfangzi, Songzhangzi, Ershilipu, Fanzhangzi, and
      Shanzhui areas".
  - id: pittman2020a
    notes: >
      Treats the formation as Barremian–Aptian, alongside the Aptian Jiufotang
      Formation: "The Barremian-Aptian Yixian Formation and Aptian Jiufotang
      Formation of northeastern China, which yield part of the Jehol Biota".
  - id: wang2001c
  - id: tong2021a
    notes: >
      Manchurochelys manchoukuoensis comes from the "Yixian Formation
      (Barremian–Aptian), Liaoning, China", and the occurrence table repeats
      "Yixian Fm. Early Cretaceous (Barremian–Aptian)" for it, for Ordosemys
      liaoxiensis of western Liaoning and for Xiaochelys ningchengensis of
      Inner Mongolia. The ages accompany the cited turtle records rather than
      being argued in this paper.
  - id: jin2012a
    notes: >
      The "lowest more fluvial, volcanoclastic beds" of the formation, which
      yielded Hexing qingyi and, before it, Shenzhousaurus orientalis, are
      "Lower Valanginian–Lower Barremian, Lower Cretaceous" and "older than
      128 million years and younger than 139 million years", the dating
      following Swisher and colleagues (2002). Superseded by the U-Pb ages of
      Zhong and colleagues (2021).
  - id: sereno2010a
    notes: >
      Type horizons for Psittacosaurus lujiatunensis and P. major read "Lujiatun
      Beds, lowermost Yixian Formation (late Barremian or earliest Albian)".
      Elsewhere the same lowermost beds, Lujiatun and Jianshangou, are "no older
      than 123–125 Ma, straddling the Barremian-Aptian boundary" on the
      radiometric dates of He and colleagues (2006) and Zhou and colleagues
      (2007), with the youngest Liaoning psittacosaurs lying below the
      Aptian-Albian boundary. The boundary is that of Gradstein and colleagues
      (2004); on the ICS chart v2024/12 the same ages fall in the Barremian. The
      Zhou and colleagues (2007) in its reference list is a study of
      psittacosaur endocranial anatomy, not a dating paper.
  - id: swisher2002a
  - id: he2006a
  - id: zhou2007a
    notes: >
      The only Zhou and colleagues (2007) in Sereno's reference list, on
      psittacosaur endocranial anatomy; it gives no radiometric dates.
  - id: gradstein2004a
    notes: >
      The time scale behind the stage boundaries Sereno (2010) gives for the
      Liaoning psittacosaur beds.
