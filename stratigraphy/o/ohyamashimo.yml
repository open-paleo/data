name: Ohyamashimo
rank: formation
period: [Early Cretaceous]
stages: [Albian]
references:
  - id: kubota2024a
    notes: >
      From zircon U–Pb ages at the base of the formation and in the overlying
      Sawada Formation, "the middle part of the Ohyamashimo Formation is
      assigned to be the early to middle Albian in age", the level where the
      Hypnovenator horizon likely lies. Hypnovenator "stands as the only Early
      Cretaceous troodontine troodontid".
  - id: tanaka2024a
    notes: >
      Independently gives the "Lower Cretaceous Albian Ohyamashimo Formation",
      and places the Miyada site in "the lower part of the Ohyamashimo
      Formation (early Albian; c. 112 Ma)".
