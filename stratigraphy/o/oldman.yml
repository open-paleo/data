name: Oldman
rank: formation
parent: Belly River
period: [Late Cretaceous]
stages: [Campanian]
variants: [Pale Beds]
references:
  - id: eberth2005a
    notes: >
      The middle of the three, 40 m thick at the Park, "made up of
      light-colored alluvial sandstones and mudstones that were first referred
      to as the 'Pale Beds' by Dowling (1916, 1917)". It "conformably overlies
      the Herronton Sandstone Zone at the top of the Foremost but is truncated
      at the top by a regional disconformity", and it "records the maximum
      regression of the Western Interior Seaway during the Campanian".
  - id: dowling1916a
    notes: >
      Cited by Eberth (2005) as the first to call these beds the 'Pale Beds'.
  - id: dowling1917a
    notes: >
      Cited by Eberth (2005) as the first to call these beds the 'Pale Beds'.
  - id: brown2013a
    notes: >
      The middle formation of the Belly River Group, divided into informal lower,
      middle and upper units after Eberth and Hamblin (1993). The upper Oldman at
      Milk River is "time-equivalent to the lower Dinosaur Park Formation" at
      Dinosaur Provincial Park, and the contact between the two formations is a
      disconformity that is "time transgressive from north to south". Measures no
      date on the formation.
  - id: eberth1993b
