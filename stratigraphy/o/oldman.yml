name: Oldman
rank: formation
parent: Belly River
period: [Late Cretaceous]
stages: [Campanian]
variants: [Pale Beds]
lithology: very fine- to fine-grained sandstone, with siliceous paleosols
references:
  - id: eberth2005a
    notes: >
      Describes the formation at Dinosaur Provincial Park, 40 m of pale alluvial
      sandstones and mudstones, which "records the maximum regression of the
      Western Interior Seaway during the Campanian".
  - id: dowling1916a
    notes: >
      Cited by Eberth (2005) as the first to call these beds the 'Pale Beds'.
  - id: dowling1917a
    notes: >
      Cited by Eberth (2005) as the first to call these beds the 'Pale Beds'.
  - id: brown2013a
    notes: >
      The middle formation of the Belly River Group, divided into informal lower,
      middle and upper units after Eberth and Hamblin (1993). The upper Oldman at
      Milk River is "time-equivalent to the lower Dinosaur Park Formation" at
      Dinosaur Provincial Park, and the contact between the two formations is a
      disconformity that is "time transgressive from north to south". Measures no
      date on the formation.
  - id: eberth1993b
    notes: >
      Source of the lithology.
