name: Oldman
rank: formation
parent: Belly River
period: [Late Cretaceous]
stages: [Campanian]
variants: [Pale Beds]
references:
  - id: eberth2005a
    notes: >
      The middle of the three, 40 m thick at the Park, "made up of
      light-colored alluvial sandstones and mudstones that were first referred
      to as the 'Pale Beds' by Dowling (1916, 1917)". It "conformably overlies
      the Herronton Sandstone Zone at the top of the Foremost but is truncated
      at the top by a regional disconformity", and it "records the maximum
      regression of the Western Interior Seaway during the Campanian".
