name: On Gong
rank: formation
period: [Early Cretaceous]
stages: [Aptian, Albian]
references:
  - id: mannion2011b
    notes: >
      The Mongolosaurus haplodon holotype came from "the Hu Khung Ulan
      locality in Inner Mongolia ... from the Lower Cretaceous On Gong
      Formation", collected by Walter Granger in 1928 on the Central Asiatic
      Expeditions, and the horizon is given as "Aptian-Albian (?), Early
      Cretaceous". That stage assignment is reached through correlation rather
      than from the unit itself: following Dong (1993) the formation "has been
      suggested to be approximately equivalent to the Ondai Sair Formation
      (included within the Hühteeg Svita Formation) of Mongolia", which
      Shuvalov (1974) and Weishampel and colleagues (2004) date as
      Aptian-Albian. Quoting Gilmore (1933), Mongolosaurus "is the only
      dinosaur so far found in the On Gong Formation".
  - id: averianov2025b
    notes: >
      Gives the Mongolosaurus material as from "the Aptian-Albian On Gong
      Formation of Inner Mongolia, China".
  - id: han2024a
    notes: >
      Tabulates the same occurrence at Hu Khung Ulan, Inner Mongolia, as Early
      Cretaceous, with the age hedged as Aptian and possibly Albian.
