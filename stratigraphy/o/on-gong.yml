name: On Gong
rank: formation
period: [Early Cretaceous]
lithology: deep red sandstone and claystone, with lenses of coarse gravel
references:
  - id: mannion2011b
    notes: >
      Gives the Mongolosaurus holotype as from the Hu Khung Ulan locality in the
      On Gong Formation, and its horizon as "Aptian-Albian (?)", reached by
      correlation with the Ondai Sair Formation.
  - id: averianov2025b
    notes: >
      Gives the Mongolosaurus material as from "the Aptian-Albian On Gong
      Formation of Inner Mongolia, China".
  - id: han2024a
    notes: >
      Tabulates the same occurrence at Hu Khung Ulan, Inner Mongolia, as Early
      Cretaceous, with the age hedged as Aptian and possibly Albian.
  - id: weishampel2004b
    notes: >
      Gives "Aptian-Albian (i.e., approximately equivalent with the Ondai Sair
      Formation; Dong 1993c)", the age of the Ondai Sair carried to the On Gong
      by correlation; Dong (1993) gives the equivalence but no stage.
  - id: gilmore1933b
    notes: >
      Lists the On Gong under the Lower Cretaceous and gives the Mongolosaurus
      horizon as "On Gong, Lower Cretaceous".
  - id: dong1993c
    notes: >
      Source of the lithology.
  - id: shuvalov1974a
    notes: >
      Cited by Weishampel and colleagues (2004) for the Aptian–Albian of the
      Ondai Sair, which it never names; it dates the deposits at Khobur and
      Khuren-Dukh.
