name: Osoushinai
rank: formation
period: [Late Cretaceous]
stages: [Campanian]
references:
  - id: kobayashi2022a
    notes: >
      Gives the Paralitherizinosaurus horizon as "the lower Campanian
      Osoushinai Formation in Nakagawa Town of Hokkaido Prefecture", and its
      title places the formation in the Upper Cretaceous. One passage,
      recounting Murakami and colleagues' (2008) description, instead calls it
      "the upper Campanian Osoushinai Formation".
