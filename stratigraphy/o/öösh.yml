name: Öösh
rank: formation
period: [Early Cretaceous]
stages: [Berriasian, Valanginian, Hauterivian, Barremian, Aptian, Albian]
variants: [Oshih]
dispute:
  summary: >
    Andres and Norell (2005) report that the formation "has most often been
    assigned to the Hüteeg Svita, Hüteeg Gorizont (Aptian-Albian), but, more
    recently authors have assigned it to the Öndörukhaa Svita, Tsagaantsav
    Gorizont (Berriasian-Valanginian)"; Turner and colleagues (2007) consider
    the deposits "Early Cretaceous (Berriasian–Barremian)", and Pittman and
    colleagues (2020) tabulate them as Berriasian-Barremian.
references:
  - id: andres2005a
    notes: >
      Describes the formation as "an approximately 600-m-thick Early
      Cretaceous succession" and reports that it "has most often been assigned
      to the Hüteeg Svita, Hüteeg Gorizont (Aptian–Albian), but, more recently
      authors have assigned it to the Öndörukhaa Svita, Tsagaantsav Gorizont
      (Berriasian-Valanginian)". For the pterosaur from the "cannonball" beds,
      which form the lowest part of the formation, it gives the age as "Early
      Cretaceous (Berriasian–Valanginian or Aptian–Albian)".
  - id: pittman2020a
    notes: >
      Tabulates "Öösh Formation | Mongolia | Cretaceous Early |
      Berriasian-Barremian".
  - id: cuenca-bescós2003a
    notes: >
      Correlates the unit, under the spelling Oshih, to the Tsagantsavian,
      which comprises "a basaltic layer of 130 Ma", and lists it in a
      paleogeographic figure of the Hauterivian as "4, Oshih (Hauterivian,
      Gobi, China)". Because the chronostratigraphy of the Lower Cretaceous
      "is still a matter of discussion", it adds that "Oshih can also be
      Valanginian or Barremian in age (sensu Gradstein et al. 1999)".
  - id: berkey1927a
    notes: >
      Names the "Oshih (Ashile) formation" of the depression north of Artsa
      Bogdo, in eight numbered units, the lowest the "cannonball" group, the
      "Psittacosaurus beds".
  - id: turner2007b
    notes: >
      Considers "The deposits at Öösh … Early Cretaceous
      (Berriasian–Barremian)", and reports after Shuvalov (2000) that rocks
      overlying the Öösh strata "have yielded dates of 141 ± 8 m.y. and 126 ±
      9 m.y. This indicates a Berriasian–Hauterivian stage for these strata",
      while noting that the "stratigraphic and temporal divisions for the
      deposits at Öösh are poorly constrained".
  - id: shuvalov2000a
