name: Oxford Clay
rank: formation
parent: Ancholme
period: [Middle Jurassic, Late Jurassic]
stages: [Callovian, Oxfordian]
references:
  - id: naish2007a
    notes: >
      Dates it by way of a member inside it, "Oxfordian Oxford Clay dinosaurs
      include Metriacanthosaurus parkeri from the Weymouth Member".
  - id: barron2012a
    notes: >
      Places it second in the Ancholme Group, above the Kellaways and below
      the West Walton Formation, and dates it "Mid to Late Jurassic, Early
      Callovian to Early Oxfordian, Calloviense Zone to Cordatum Zone". In the
      Cleveland Basin it "is represented here only by the uppermost part
      (Weymouth Member), which is entirely Upper Jurassic (Oxfordian)".
  - id: ősi2012a
    notes: >
      Gives "Oxford Clay Formation; Callovian".
  - id: norman2007a
    notes: >
      Narrows it to the "Oxford Clay (middle Callovian) of England", setting
      it beside the "Marnes à Belemnopsis latesulcata Formation (early
      Callovian)".
  - id: cox1992a
    notes: >
      "The Oxford Clay is a marine argillaceous deposit of Callovian-Oxfordian
      age. It is developed throughout southern, central and eastern England, and
      ranges up to about 185 m in thickness." This paper classifies it as a
      Formation, giving its three traditional subdivisions member status and
      renaming them the Peterborough, Stewartby and Weymouth members for the
      Lower, Middle and Upper Oxford Clay.
  - id: cope1980a
    notes: >
      Divides the unit by lithology: "the Callovian Oxford Clay may be divided,
      on lithological grounds, into Lower and Middle units", from the jason Zone
      to the lamberti Zone, and the Upper Oxford Clay is Lower Oxfordian, in the
      mariae and lower cordatum zones. The base falls at different subzones in
      different areas, and in Kent the 'Ornatus Beds' are broadly equivalent to
      the Lower Oxford Clay. Names no rank or parent.
