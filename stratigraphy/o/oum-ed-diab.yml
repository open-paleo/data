name: Oum ed Diab
rank: member
parent: Aïn el Guettar
period: [Early Cretaceous]
stages: [Albian]
references:
  - id: fanti2013a
    notes: >
      Gives the Tataouinea horizon and the setting: the member "represents
      sandy shoreface ... and tidal flat/foreshore deposits", its beds "dated
      as early Albian based on lateral correlation with marine units and
      associate vertebrate fauna".
  - id: fanti2015a
    notes: >
      Places it second of the formation's three members, between the Chenini
      below and the Rhadouane above, and fixes the Tataouinea level at about
      1.5 m above "the fossil-rich conglomerate that marks the erosive
      contact between the Chenini and the overlying Oum ed Diab members".
