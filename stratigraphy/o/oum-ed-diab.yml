name: Oum ed Diab
rank: member
parent: Aïn el Guettar
period: [Early Cretaceous]
stages: [Albian]
references:
  - id: fanti2013a
    notes: >
      Gives the Tataouinea horizon and the setting: the member "represents
      sandy shoreface ... and tidal flat/foreshore deposits", its beds "dated
      as early Albian based on lateral correlation with marine units and
      associate vertebrate fauna".
  - id: fanti2015a
    notes: >
      Places it second of the formation's three members, between the Chenini
      below and the Rhadouane above, and fixes the Tataouinea level at about
      1.5 m above "the fossil-rich conglomerate that marks the erosive
      contact between the Chenini and the overlying Oum ed Diab members".
  - id: bouaziz1989a
    notes: >
      Names the unit in the Oum ed Diab sector: "fine, pale, micaceous sands,
      which we call the sables d'Oum ed Diab, with, toward the base, a level
      rich in fish remains, which mark the passage to the Cenomanian".
  - id: fanti2012b
    notes: >
      Second member of the formation, above the Chenini across "an
      heterogeneous conglomerate rich in highly re-worked vertebrate remains",
      and below the late Albian "Barre Vraconnienne" of the Rhadouane; "the
      Oum ed Diab member and the vertebrate fauna recovered in this unit ...
      is middle Albian in age".
  - id: benton2000a
    notes: >
      Treats it as the "Oum ed Diab Formation (mid-Albian to Cenomanian)" of
      an Aïn el Guettar Group.
