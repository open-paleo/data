name: Eumeralla
rank: formation
period: [Early Cretaceous]
stages: [Hauterivian, Barremian, Aptian, Albian]
references:
  - id: herne2019a
    notes: >
      Places it in its group and basin, "Eumeralla Formation, Otway Group,
      Otway Basin (lower Aptian)".
  - id: agnolín2010a
    notes: >
      The Dinosaur Cove localities of the Eumeralla Formation, Otway Group,
      are "late Aptian-early Albian: late Early Cretaceous", after Wagstaff
      and McEwen Mason (1989).
  - id: bell2018a
    notes: >
      Treats the "Eumeralla Formation (late Hauterivian–Albian) in Victoria"
      as older than the early Cenomanian Griman Creek Formation at Lightning
      Ridge, and places Leaellynasaura in "the lower Albian of the Eumeralla
      Formation (Otway Basin)".
  - id: wagstaff1989a
    notes: >
      Never names this formation, and dates localities at group level: "the
      localities in Otway Group sediments are of late Aptian-early Albian age
      (Crybelosporites striatus Subzone ...) and the localities in the
      Strzelecki Group of Valanginian-Aptian age". So it supports neither the
      Hauterivian nor the Barremian here, and what it does support is
      narrower than the entry and about localities rather than the unit. Its
      own caveat belongs with it: "This age determination is dependent on the
      isochronicity of spore-pollen zones across eastern Australia."
