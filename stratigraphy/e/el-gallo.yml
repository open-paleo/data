name: El Gallo
rank: formation
period: [Late Cretaceous]
stages: [Campanian]
references:
  - id: prieto-márquez2012b
    notes: >
      Gives the Magnapaulia occurrence as "late Campanian strata of the El
      Gallo Formation, near the western coastline of the state of Baja
      California Norte, northwestern Mexico".
  - id: sullivan2006c
    notes: >
      Names its La Escarpa and El Disecado Members and ties the base of the
      former to the base of the Bearpaw Formation of Alberta.
  - id: molnar1974a
    notes: >
      Gives the local succession, the La Bocana Roja Formation unconformably
      underlying it and the Rosario Formation unconformably overlying it.
  - id: rivera-sylva2018a
    notes: >
      Reports a since-lost ankylosaurid osteoderm "from the 'El Gallo
      Formation' in Baja California (Campanian, Upper Cretaceous)", and a
      nodosaurid tooth from the El Jabón Creek locality in the El Disecado
      member.
