name: Escucha
rank: formation
period: [Early Cretaceous]
stages: [Aptian, Albian]
references:
- id: kirkland2013a
  notes: >
    Described in 1971 as the Formación Lignitos de Escucha, beneath the
    Formación Arenas de Utrillas, and divided in two by a regional
    unconformity. The formation has generally been read as early to middle
    Albian, overlying Aptian strata in central basinal settings and overlain
    by the upper Albian Utrillas Formation, but calcareous plankton and
    palynomorphs place the lower Escucha in the late Aptian, and marine
    ostracods confirm an Albian age for the upper part northeast of Teruel.
    Places Europelta in the Lower Cretaceous, in the lower Albian carbonaceous
    member of the lower Escucha near Ariño, where palynomorphs, ostracods and
    charophytes indicate that the site "is completely of early Albian age".
- id: mcdonald2012a
  notes: >
    Describes Proa from "the Lower Cretaceous (lower Albian) Escucha Formation
    of Teruel Province", from "lower Albian beds in the upper Aptian–lower
    Albian Escucha Formation" at Ariño, in the Middle Interval with Coal of
    the formation's Lower Sedimentary Succession.
- id: santos-cubedo2021a
  notes: >
    Places the Ariño occurrence in the Oliete sub-basin and dates it early
    Albian.
