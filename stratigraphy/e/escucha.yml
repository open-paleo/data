name: Escucha
rank: formation
period: [Early Cretaceous]
stages: [Aptian, Albian]
references:
- id: kirkland2013a
  notes: >
    Places Europelta in the lower Escucha near Ariño, at a site "completely of
    early Albian age", and reports a late Aptian age for the lower part of the
    formation from plankton and palynomorphs.
- id: mcdonald2012a
  notes: >
    Describes Proa from "the Lower Cretaceous (lower Albian) Escucha Formation
    of Teruel Province", from "lower Albian beds in the upper Aptian–lower
    Albian Escucha Formation" at Ariño, in the Middle Interval with Coal of
    the formation's Lower Sedimentary Succession.
- id: santos-cubedo2021a
  notes: >
    Places the Ariño occurrence in the Oliete sub-basin and dates it early
    Albian.
- id: degea2008a
  notes: >
    Dates the basal Escucha at Alcaine to the late Aptian from nannofossils
    (Rhagodicus angustus Zone) and planktonic foraminifera (Ticinella
    bejaouaensis Zone).
- id: peyrot2007a
  notes: >
    Its miospores suggest "an Upper Aptian age for the studied material", which
    reaches the top of the formation; dinocysts "indicate an Upper
    Aptian–Lower Albian age for the oldest level studied".
- id: peyrot2007b
  notes: >
    Samples "the Upper Aptian–lower Albian rocks of the Escucha Formation",
    relaying that age from Peyrot and colleagues (2007a).
