name: Elliot
rank: formation
period: [Late Triassic, Early Jurassic]
stages: [Carnian, Norian, Rhaetian, Hettangian, Sinemurian, Pliensbachian,
  Toarcian]
variants: [Red Beds]
dispute:
  summary: >
    The age of the lower part is contested four ways and the formation spans a
    system boundary. Galton and Upchurch (2004) list the readings for the
    Lower Elliot side by side -- "Carnian, Shubin and Sues 1991; Carnian
    and/or Norian, Olsen and Galton 1984; Norian, Lucas and Hancox 2001; early
    to mid-Norian, Harris et al. 2002" -- while Sereno (2012) puts the Upper
    Elliot in the "earliest Jurassic (202-197 Ma, Hettangian)". Bordy and
    colleagues (2020) are the first to date the succession radioisotopically
    and reach a narrower answer than any of the above.
references:
  - id: galton2004a
    notes: >
      Sets out the competing ages for the Lower Elliot, and places
      Euskelosaurus browni in it at "late Carnian or early Norian".
  - id: sereno2012a
    notes: >
      Gives the Upper Elliot as "predominantly red fluvial-aeolian ...
      (formerly part of Red Beds), the age of which is regarded as earliest
      Jurassic (202-197 Ma, Hettangian)", which is also the source for the
      legacy name. It contrasts that unit's "Massospondylus Range Zone" with
      the "Euskelosaurus Range Zone" of the "Upper Triassic Lower Elliot
      Formation".
  - id: bordy2020a
    notes: >
      The first radioisotopic framework for the upper Stormberg, from detrital
      zircon maximum depositional ages and magnetostratigraphy: "Our work
      suggests a mid-Norian-Rhaetian age for the lower Elliot Formation and a
      Hettangian-Sinemurian age for the upper Elliot Formation, although the
      precise stratigraphic position of the Triassic/Jurassic
      (Rhaetian/Hettangian) boundary remains somewhat uncertain."
  - id: sciscio2017a
    notes: >
      Its magnetostratigraphy supports "a Late Triassic-Early Jurassic age for
      the Elliot Formation", and its proposed correlation of the upper part of
      the upper Elliot with the Hartford Basin and St. Audrie's Bay "places
      the UEF EF6.2r – EF9n as Hettangian–Sinemurian in age". Reviewing
      earlier readings of the upper Elliot, it reports that Norman and
      colleagues (2011) speculated that its age "may be younger and either
      spans the Pliensbachian-Toarcian or the upper Sinemurian".
  - id: olsen1984a
    notes: >
      The lower Elliot's vertebrates — a traversodont cynodont and a
      rauisuchid, in a unit that is in part a red lateral equivalent of gray
      Molteno beds that have yielded Carnian plants — make up the lower
      Stormberg assemblage, and "the skeletal remains support a Late Triassic
      (Carnian and/or Norian) age for this deposit". Comparison with the
      European type section "strongly suggests that the lower Stormberg
      assemblage is Late Triassic (Carnian-Norian) in age while the upper
      Stormberg assemblage", the upper Elliot together with the Clarens, "is
      Early Jurassic (Hettangian-Pliensbachian) in age".
  - id: shubin1991a
    notes: >
      Argues in Romer Zones rather than stages, placing the "Upper Elliot and
      Clarens Formations, southern Africa" in "Romer Zone C: Absence of
      Carnian and Norian Families", alongside the McCoy Brook, the Kayenta
      and the Lower Lufeng - the same grouping Olsen and Galton (1984) reach
      by a different route. Also uses the Knollenmergel and the Lias.
  - id: lucas2001a
    notes: >
      Places the lower part in the Norian and caveats itself in the same
      breath: "the overlying lower Elliot Formation is most likely Norian in
      age. However, these are not strong correlations, and additional data
      are needed to confirm correlation of the southern African Upper
      Triassic strata." Calls the container "the now defunct 'Stormberg
      Group'".
  - id: harris2002a
    notes: >
      Reaches this unit as a comparison, and argues directly against the
      Carnian. Euskelosaurus browni, Blikanasaurus cromptoni and
      Melanorosaurus readi, "all from the lower Elliot Formation", are "of
      probable Revueltian (early-mid Norian) age", and "Previous reports
      placing the lower Elliot Formation in the Carnian ... were based on the
      mistaken assumption that traversodontid cynodonts, which co-occur with
      the South African prosauropods, are unknown from strata younger than
      Carnian." It argues in land-vertebrate faunachrons - Revueltian,
      Adamanian - rather than in stages.
  - id: norman2011a
    notes: >
      The upper part of the formation, "formerly 'upper Red Beds'", is
      "probably of Early Jurassic age", either "Hettangian-Sinemurian" after
      Olsen and Galton (1984) or "Pliensbachian-Toarcian" after Yates and
      colleagues (2004), though the paper prefers a narrower reading: "The
      most probable age for the upper part of the Elliot Formation is upper
      Sinemurian", on a personal communication from R. Irmis.
