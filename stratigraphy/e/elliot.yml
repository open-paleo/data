name: Elliot
rank: formation
parent: Stormberg
period: [Late Triassic, Early Jurassic]
stages: [Norian, Rhaetian, Hettangian, Sinemurian, Pliensbachian]
variants: [Red Beds]
lithology: alternating sandstone, siltstone and mudstone
references:
  - id: galton2004a
    notes: >
      Lists the competing ages of the lower Elliot side by side, from Carnian to
      early to mid-Norian, and places Euskelosaurus browni at "late Carnian or
      early Norian".
  - id: sereno2012a
    notes: >
      Gives the Upper Elliot as "predominantly red fluvial-aeolian ...
      (formerly part of Red Beds), the age of which is regarded as earliest
      Jurassic (202-197 Ma, Hettangian)", which is also the source for the
      legacy name. It contrasts that unit's "Massospondylus Range Zone" with
      the "Euskelosaurus Range Zone" of the "Upper Triassic Lower Elliot
      Formation".
  - id: bordy2020a
    notes: >
      Dates the formation by detrital zircon U-Pb and magnetostratigraphy,
      giving "a mid-Norian–Rhaetian age for the lower Elliot" and a
      Hettangian–Sinemurian age for the upper Elliot.
  - id: sciscio2017a
    notes: >
      Its magnetostratigraphy supports "a Late Triassic-Early Jurassic age for
      the Elliot Formation", and its correlation places the upper part of the
      upper Elliot in the Hettangian–Sinemurian.
  - id: olsen1984a
    notes: >
      Dates the lower Elliot assemblage Late Triassic, "Carnian and/or Norian",
      and the upper Elliot and Clarens assemblage Early Jurassic,
      "Hettangian-Pliensbachian".
  - id: shubin1991a
    notes: >
      Argues in Romer Zones rather than stages, placing the "Upper Elliot and
      Clarens Formations, southern Africa" in "Romer Zone C: Absence of
      Carnian and Norian Families", alongside the McCoy Brook, the Kayenta
      and the Lower Lufeng — the same grouping Olsen and Galton (1984) reach
      by a different route. Also uses the Knollenmergel and the Lias.
  - id: lucas2001a
    notes: >
      Dates the lower Elliot on its tetrapods as "most likely Norian", adding
      that "these are not strong correlations".
  - id: harris2002a
    notes: >
      Gives the prosauropods of the lower Elliot a "probable Revueltian
      (early-mid Norian) age" and rejects the earlier Carnian placement of the
      lower Elliot.
  - id: norman2011a
    notes: >
      The upper part of the formation, "formerly 'upper Red Beds'", is
      "probably of Early Jurassic age", either "Hettangian-Sinemurian" after
      Olsen and Galton (1984) or "Pliensbachian-Toarcian" after Yates and
      colleagues (2004), though the paper prefers a narrower reading: "The
      most probable age for the upper part of the Elliot Formation is upper
      Sinemurian", on a personal communication from R. Irmis.
  - id: yates2004b
  - id: hesselbo2020a
    notes: >
      Puts the base of the Pliensbachian at 192.9 Ma, against 190.8 Ma in
      GTS2012.
  - id: visser1984a
    notes: >
      Source of the lithology.
