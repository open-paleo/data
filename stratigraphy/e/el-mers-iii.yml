name: El Mers III
rank: formation
period: [Middle Jurassic]
stages: [Bathonian, Callovian]
references:
  - id: maidment2021a
    notes: >
      Gives "El Mers III Formation (Upper Bathonian/Callovian, Middle
      Jurassic: 168.3–163.5 million years ago)" for the Spicomellus site at
      Boulahfa, south of Boulemane. Maidment and colleagues (2020) had placed
      the horizon in the El Mers II Formation, but later field observations
      suggest "it may lie slightly higher in the stratigraphy".
  - id: zafaty2024a
    notes: >
      Independently gives "El Mers III Formation (Bathonian-?Callovian",
      hedging the younger end, and, following Charrière and colleagues (2011),
      gives the Thyreosaurus horizon as "El Mers III Formation, Middle
      Jurassic, Bathonian-?Callovian".
  - id: charrière2011a
