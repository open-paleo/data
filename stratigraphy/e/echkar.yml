name: Echkar
rank: formation
parent: Tegama
period: [Late Cretaceous]
stages: [Cenomanian]
references:
  - id: brusatte2007a
    notes: >
      Gives "the Late Cretaceous (Cenomanian) Echkar Formation of Niger, which
      is roughly coeval with Cenomanian beds elsewhere in northern Africa".
  - id: ibrahim2020a
    notes: >
      Sets it in its regional context, sharing vertebrate taxa with southern
      Algeria and with "the Echkar and Farak formations in Niger". Sereno and
      colleagues' GAD 5 survey level spans the upper Elrhaz and the lower
      part of this formation, crossing the boundary between the two.
