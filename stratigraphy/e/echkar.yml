name: Echkar
rank: formation
parent: Tegama
period: [Early Cretaceous, Late Cretaceous]
stages: [Albian, Cenomanian]
references:
  - id: brusatte2007a
    notes: >
      Gives "the Late Cretaceous (Cenomanian) Echkar Formation of Niger, which
      is roughly coeval with Cenomanian beds elsewhere in northern Africa".
  - id: ibrahim2020a
    notes: >
      Sets it in its regional context, sharing vertebrate taxa with southern
      Algeria and with "the Echkar and Farak formations in Niger".
  - id: sereno2026a
    notes: >
      Revisits its type section at Mount Echkar, after Faure (1966):
      "light-colored, crossbedded sandstones", where "we were unable to find
      fossils of any kind on Mount Echkar including petrified wood". It places
      "the barren Echkar Formation" at "the top of the Tegama Series (GAD7, 8)
      below the fossiliferous Farak Formation", and assigns the Iguidi beds,
      earlier attributed to this formation, to the Farak. The supplementary
      materials give it no age of its own.
  - id: faure1966a
