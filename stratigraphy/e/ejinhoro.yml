name: Ejinhoro
rank: formation
period: [Early Cretaceous]
stages: [Barremian, Aptian, Albian]
references:
  - id: russell1996a
    notes: >
      The Psittacosaurus neimongoliensis type locality, near Yangpo village in
      the Ordos region of Inner Mongolia, is an Ejinhoro Formation exposure of
      "greenish-yellow siltstones intercalated with reddish, locally
      chaotically bedded, ledge-forming sandstones", yielding Wuerhosaurus
      ordosensis, sauropod teeth and pterosaur bones alongside the
      psittacosaurs. Those strata "do not appear to conform to
      characterization of Ejinhoro Formation as 'brick red with greyish green
      clastics'" on the regional geological map, and that facies turns up
      instead at localities the map assigns to the Zhidan Group. No age is
      given for the unit, only the remark that the age of most of the new
      psittacosaur occurrences is uncertain.
  - id: pittman2020a
    notes: >
      Gives "the Aptian-Albian Ejinhoro Formation of Nei Mongol, China" as the
      Sinornithoides horizon.
  - id: jia2024a
    notes: >
      States that "the Ejinhoro Formation was interpreted as late Barremian in
      age (Cuenca-Bescos and Canudo)", for the Ordos Basin, Inner Mongolia.
  - id: maidment2008a
    notes: >
      Places the Wuerhosaurus ordosensis material in "the Lower Cretaceous
      Ejinhoro Formation of Yang-Paul, Ordos Basin, Inner Mongolia", after
      Dong (1993).
  - id: dong1993b
    notes: >
      The Wuerhosaurus ordosensis material was "collected in the Lower
      Cretaceous Ejinhoro Formation (Dong 1992) of the Ordos Basin, Inner
      Mongolia", whose "extensive exposures ... in this area are Lower
      Cretaceous and produce characteristic invertebrate and vertebrate
      fossils of the endemic central Asian Psittacosaurus fauna".
  - id: cuenca-bescós2003a
    notes: >
      Ejinhoro is the oldest of the three Gobiconodon localities restudied by
      Averianov and Skutchas (2000): "From bottom to top the localities
      Ejinhoro, Khoboor and Shestakovo range from the Barremian to the
      Albian". The paper's paleogeographic map labels the unit "Ejinhoro
      (Barremian, Gobi, China)".
  - id: averianov2000a
  - id: dong1992a
