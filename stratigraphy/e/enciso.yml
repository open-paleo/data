name: Enciso
rank: group
period: [Early Cretaceous]
stages: [Valanginian, Hauterivian, Barremian, Aptian]
lithology: mixed siliciclastic and carbonate deposits
dispute:
  summary: >
    Schudack and Schudack (2009), from their own ostracods, "prefer to propose
    a Valanginian age for the lower part of the Enciso group" and make the
    middle and upper parts "Hauterivian-Barremian in age, most probably
    Barremian in its upper part, but not Aptian". Suarez-Gonzalez and
    colleagues (2013), from dasycladales and foraminifera in two levels of the
    group and its lateral passage into the Leza Formation, give it as upper
    Barremian–lower Aptian.
references:
  - id: isasmendi2024a
    notes: >
      Erects Riojavenatrix from "the Enciso Group (uppermost Barremian–lower
      Aptian)" at Igea, and places its type locality "most likely" in the lower
      Aptian. Source of the lithology.
  - id: rauhut2025a
    notes: >
      Independently gives "the latest Barremian - Early Aptian Enciso Group
      of La Rioja province".
  - id: suarez-gonzalez2015a
    notes: >
      Dates the Leza Formation "upper Barremian–lower Aptian" and describes it
      as changing laterally into the Enciso Group.
  - id: hernán2018a
  - id: suarez-gonzalez2013a
    notes: >
      Finds marine microfossils in two levels of the group, and places it with
      the Leza and Jubera formations in one depositional sequence, "upper
      Barremian - lower Aptian in age".
  - id: schudack2009a
    notes: >
      From its own ostracods, dates the lower part of the group Valanginian
      and the middle and upper parts "Hauterivian-Barremian in age, most
      probably Barremian in its upper part, but not Aptian".
