name: Enciso
rank: group
period: [Early Cretaceous]
stages: [Barremian, Aptian]
references:
  - id: isasmendi2024a
    notes: >
      Erects Riojavenatrix from "the Enciso Group (uppermost Barremian–lower
      Aptian) from Igea (La Rioja, Spain)", which it also calls "the Early
      Cretaceous Enciso Group". After Suarez-Gonzalez and colleagues (2013,
      2015) and Hernán (2018), most of the group is "early Aptian in age, with
      likely lowermost upper Aptian deposits in the uppermost part of the
      group", and the type locality is "most likely to be lower Aptian".
  - id: rauhut2025a
    notes: >
      Independently gives "the latest Barremian - Early Aptian Enciso Group
      of La Rioja province".
  - id: suarez-gonzalez2015a
    notes: >
      The ages here are the Leza Formation's, not this group's: "The Leza
      Formation is a mixed carbonate-clastic unit, upper Barremian-lower
      Aptian in age". This group is reached only by lateral equivalence,
      which the paper states in both directions - "the Leza Fm changes
      laterally, towards the south, to the overlying Enciso Group" and
      "Towards the NE margin of the basin, the Enciso Group changes laterally
      to the Leza Fm". So the late Barremian to early Aptian that later
      papers attribute here is sound but indirect, and it constrains only the
      Leza-equivalent part; that is why the group is given as reaching higher
      than the Leza does. One of the paper's four mentions of the name is not
      the unit at all but the town, in a figure-legend key.
  - id: hernán2018a
  - id: suarez-gonzalez2013a
    notes: >
      Dates the group directly rather than by transfer from the Leza: the
      authors "re-examined the microfossil content of the Enciso Gr facies in
      the area surrounding Soto en Cameros" and "found previously unrecorded
      marine microfossils (dasycladales and foraminifers) in two levels of
      the Enciso Gr". Their conclusion is that "the Leza Fm, the Jubera Fm
      and the Enciso Gr belong to the same depositional sequence, upper
      Barremian - lower Aptian in age", the dasycladale Salpingoporella
      urladanasi and a foraminifer compared to Istriloculina constraining
      each end.
      The paper is also where the unit's fifty-year disagreement is
      tabulated, and the spread is wide: the group has been called
      Berriasian, early Valanginian, Hauterivian to Barremian, Barremian,
      Barremian to Aptian, and upper Valanginian to Barremian by different
      workers between 1966 and 2009. The one modern dissent, a revised
      ostracod biostratigraphy by Schudack and Schudack (2009) excluding the
      Aptian, is cited here and answered with the new microfossil data, and
      the Barremian-Aptian reading is what later work follows.
