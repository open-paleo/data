name: Enciso
rank: group
period: [Early Cretaceous]
stages: [Barremian, Aptian]
lithology: mixed siliciclastic and carbonate deposits
references:
  - id: isasmendi2024a
    notes: >
      Erects Riojavenatrix from "the Enciso Group (uppermost Barremian–lower
      Aptian)" at Igea, and places its type locality "most likely" in the lower
      Aptian. Source of the lithology.
  - id: rauhut2025a
    notes: >
      Independently gives "the latest Barremian - Early Aptian Enciso Group
      of La Rioja province".
  - id: suarez-gonzalez2015a
    notes: >
      Dates the Leza Formation "upper Barremian–lower Aptian" and describes it
      as changing laterally into the Enciso Group.
  - id: hernán2018a
  - id: suarez-gonzalez2013a
    notes: >
      Finds marine microfossils in two levels of the group, and places it with
      the Leza and Jubera formations in one depositional sequence, "upper
      Barremian - lower Aptian in age".
  - id: schudack2009a
