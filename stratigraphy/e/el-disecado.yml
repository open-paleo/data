name: El Disecado
rank: member
informal: true
parent: El Gallo
period: [Late Cretaceous]
stages: [Campanian]
references:
  - id: sullivan2006c
    notes: >
      Dates it by tuff, "The youngest tuff date, taken from within the El
      Disecado Member, is 73.59 ±0.09 Ma", and correlates the part above that
      date with the De-na-zin Member of the Kirtland Formation.
  - id: prieto-márquez2012b
    notes: >
      Places the Magnapaulia type strata at locality LACM 7253, which "pertain
      to the El Disecado Member", with "an estimated age of 73.6–73.0 million
      years".
  - id: rivera-sylva2011a
    notes: >
      Gives "El Disecado Member of the El Gallo Formation (Campanian), El
      Jabón ravine, Baja California, Mexico" for nodosaurid material.
  - id: renne1991a
    notes: >
      Dates tuffs in the member by 40Ar/39Ar on single sanidine grains: 74.46
      ±0.08 Ma for "the tuff (EG-35) at the base of the Disecado Member",
      74.25 ±0.07 and 74.20 ±0.15 Ma for one tuff about 400 m above the base
      of the formation, and 73.59 ±0.09 Ma for "the tuff (EG-42) approximately
      150 m below the top of the Disecado Member". Its stratigraphic column
      places the whole El Gallo Formation in the Campanian, below a
      Maastrichtian boundary in the overlying Rosario Formation. The ages
      rest on an older monitor standard; recalibration shifts them by well
      under the distance to either Campanian boundary, so the stage holds.
  - id: kane2022a
    notes: >
      "Kilmer (1963) divides the El Gallo Formation into three informal
      members", the El Disecado being "an overlying finer-grained fluvial to
      tidal member (840–1150 m thick)" above the La Escarpa, with an El
      Castillo member "contained within the El Disecado member".
