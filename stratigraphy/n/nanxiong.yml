name: Nanxiong
rank: formation
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
references:
  - id: zheng2024a
    notes: >
      Gives "Nanxiong Formation (Maastrichtian", and for the type locality at
      Shahe Town, Ganzhou, "Nanxiong Formation (Upper Cretaceous,
      Maastrichtian)".
  - id: foster2021a
    notes: >
      Independently gives the same.
  - id: dong1979a
    notes: >
      Dates it by faunal correlation: the Nanxiong fauna "is correlative with
      those from the Mongolian Nemegt Fm. and the Subashen Fm.", and so "The
      Nanxiong Fm. is thus correlated to the Senonian or Campanian".
