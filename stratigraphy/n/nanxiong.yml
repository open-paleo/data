name: Nanxiong
rank: formation
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
dispute:
  summary: >
    Among the works cited here, taxon descriptions use Nanxiong Formation and
    basin or stratigraphic studies use Nanxiong Group: Li and colleagues
    (2007) give "the uppermost Upper Cretaceous (Campanian-Maastrichtian)
    Nanxiong Group of Guangdong Province", while Dong (1979) and Zheng and
    colleagues (2024) use formation rank, and Jin and colleagues (2022) use
    both names in the same paper. Neither is the older usage. The name is also
    carried by two successions in two basins: the Nanxiong Basin of northern
    Guangdong, which reaches into western Xinfeng county in Jiangxi, and the
    Ganzhou Basin of Jiangxi, where the same beds are the Guifeng Group in the
    current local scheme.
references:
  - id: zheng2024a
    notes: >
      Gives "Nanxiong Formation (Maastrichtian)", and for the type locality at
      Shahe Town, Ganzhou, "Nanxiong Formation (Upper Cretaceous,
      Maastrichtian)".
  - id: foster2021a
    notes: >
      Independently gives the same.
  - id: jin2022a
    notes: >
      Equates the two names and names the taxa the equation covers: vertebrate
      fossils come from "the Nanxiong Formation (= Guifeng Group) that is
      exposed in the vicinity of the Gannan Basin", among them Banji long,
      Ganzhousaurus nankangensis, Jiangxisaurus ganzhouensis and Nankangia
      jiangxiensis. Its own material, from Ganzhou railway station and the
      Third High School of Ganxian County, is placed in the "Hekou Formation
      (Upper Cretaceous, Maastrichtian), Guifeng Group". The equation is
      credited to Liu (1997).
  - id: liu1997a
  - id: li2007a
    notes: >
      Uses group rank in the type area: "the uppermost Upper Cretaceous
      (Campanian-Maastrichtian) Nanxiong Group of Guangdong Province".
  - id: zhao1991a
    notes: >
      Gives the type area's extent across two provinces. The Nanxiong Basin
      "situated chiefly in northern Guangdong Province embodies Nanxiong and
      Shixing counties and the western part of Xinfeng county of Jiangxi
      Province", so a Jiangxi locality does not by itself place material in
      the Ganzhou Basin.
  - id: dong1979a
    notes: >
      Dates it by faunal correlation: the Nanxiong fauna "is correlative with
      those from the Mongolian Nemegt Fm. and the Subashen Fm.", and so "The
      Nanxiong Fm. is thus correlated to the Senonian or Campanian".
