name: Nemegt
rank: formation
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
references:
  - id: khand2000a
    notes: >
      In the eastern Gobi the formation rests on the Javkhlant and "appears to
      be of the Maastrichtian age"; at Bugiin Tsav the plant-bearing beds are
      given as "the Nemegt Formation (Campanian-Maastrichtian)". The beds
      Shuvalov (1974) had called the Nemegt Formation and Khand (1987) the
      Upper Nemegt Formation are separated here as the Nogoontsav Formation,
      20 m thick and conformably above the Nemegt. The authors add that "The
      uppermost Maastrichtian strata have not been documented in Mongolia."
  - id: osmólska1987a
    notes: >
      "Nemegt Formation, zone of Tarbosaurus bataar and Saurolophus
      angustirostris, ?Late Campanian or ?Early Maastrichtian" -- hedged on
      both sides.
  - id: evans2018a
    notes: >
      The Guriliin Tsav beds "have been assigned a Maastrichtian" age.
  - id: wilson2005a
    notes: >
      Gives the Nemegtosaurus mongoliensis occurrence as "Nemegt Formation,
      Upper Cretaceous (mid-Maastrichtian", following Jerzykiewicz and Russell
      (1991).
  - id: jerzykiewicz1991a
  - id: karczewska1983a
    notes: >
      Charophytes make the "Nemegt Formation (Upper Cretaceous)" older than
      had been supposed: the assemblage "cannot be considered younger than the
      Lower Campanian", standing between two Upper Cretaceous assemblages of
      the Chinese Red Beds and keeping taxa known from the Lower/Upper
      Cretaceous transition. That reading disagrees with Fox (1978), for whom
      the unit is "of the uppermost Campanian to Maastrichtian age", and with
      the "?Upper Campanian and/or ?Lower Maastrichtian" of Gradziński,
      Kielan-Jaworowska and Maryańska (1977).
  - id: fox1978a
  - id: gradziński1977a
