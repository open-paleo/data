name: Nemegt
rank: formation
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
lithology: light-colored sand, with subordinate sandy claystone, siltstone and
  intraformational conglomerate
references:
  - id: khand2000a
    notes: >
      Gives the formation as Maastrichtian in the eastern Gobi and
      Campanian-Maastrichtian at Bugiin Tsav, and separates the 20 m of beds
      above it there as the Nogoontsav Formation.
  - id: osmólska1987a
    notes: >
      "Nemegt Formation, zone of Tarbosaurus bataar and Saurolophus
      angustirostris, ?Late Campanian or ?Early Maastrichtian" — hedged on
      both sides.
  - id: evans2018a
    notes: >
      The Guriliin Tsav beds "have been assigned a Maastrichtian" age.
  - id: wilson2005a
    notes: >
      Gives the Nemegtosaurus mongoliensis occurrence as "Nemegt Formation,
      Upper Cretaceous (mid-Maastrichtian ...)", following Jerzykiewicz and
      Russell (1991).
  - id: jerzykiewicz1991a
  - id: karczewska1983a
    notes: >
      Finds from its charophytes that the formation "can not be considered
      younger than the Lower Campanian", a bound, older than earlier datings
      had placed it. Van Itterbeeck and colleagues (2005) reject the estimate,
      since the Nemegt overlies the Baruungoyot, which radiometric dates make
      Campanian.
  - id: fox1978a
  - id: gradziński1977a
  - id: khand1987a
  - id: shuvalov1974a
  - id: gradziński1974a
    notes: >
      Source of the lithology.
  - id: vanitterbeeck2005b
