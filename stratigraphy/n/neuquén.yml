name: Neuquén
rank: group
period: [Late Cretaceous]
stages: [Cenomanian, Turonian, Coniacian, Santonian, Campanian]
lithology: red sandstone, mudstone and graywacke, with minor conglomerate
references:
  - id: leanza2004a
    notes: >
      Dates the group from the Cenomanian to the Early Campanian, between the
      Main Miranican and Huantraiquican unconformities, and divides it into the
      Río Limay, Río Neuquén and Río Colorado subgroups.
  - id: bonaparte1979c
    notes: >
      Reviews the sauropods of the Neuquén and Chubut Groups and dates the
      Neuquén Group "Pre-Maastrichtian Senonian" after Cazau and Uliana (1973)
      and Bertels (1969).
  - id: hugo2001a
    notes: >
      Dates the group from the Lower Cenomanian to the Lower Campanian by the
      unconformities at its base and top, and gives an age to each of its three
      subgroups.
  - id: garrido2010a
    notes: >
      Dates the group "between the Lower Cenomanian and the Middle Campanian"
      and reorganizes it into three subgroups and nine formations. Source of the
      lithology.
  - id: gonzálezriga2013a
    notes: >
      Places Malarguesaurus in the Los Bastos Formation and Mendozasaurus in the
      upper levels of the Sierra Barrosa Formation, both in the middle levels of
      the group in Mendoza Province.
  - id: cazau1973a
  - id: stipanicic1968a
  - id: bertels1969a
