name: New Egypt
rank: formation
parent: Monmouth
period: [Late Cretaceous]
stages: [Maastrichtian]
references:
  - id: brett-surman1989a
    notes: >
      Tabulates "New Egypt Fm, Maastrichtian" among the North American
      hadrosaur-bearing units.
  - id: larson2010a
    notes: >
      Pairs it with the Hornerstown Formation of New Jersey and uses the
      shared fish fauna to argue a connection with the Horseshoe Canyon.
  - id: prieto-márquez2006a
    notes: >
      Gives the Hadrosaurus minor holotype horizon at Barnsboro, Gloucester
      County, New Jersey, as "New Egypt (Navesink) Formation, Upper Cretaceous
      (Maastrichtian)", using the New Egypt and Navesink names
      interchangeably.
  - id: gallagher1993a
    notes: >
      Places it in the Monmouth Group, after the Tinton under the group's
      heading, and records that "Olsson (1963) has assigned this downdip
      facies a separate unit name, the New Egypt Formation": it "is largely a
      down-dip deeper water facies" of the Navesink, Red Bank and Tinton.
      Gives Dryptosaurus aquilunguis from the "Navesink (= New Egypt) Fm. (=
      Chocolate Marl), Maastrichtian".
  - id: olsson1963a
    notes: >
      Cited by Gallagher (1993) as the work that named the down-dip facies the
      New Egypt Formation.
  - id: olsson1989a
    notes: >
      Treats the New Egypt, "a glauconitic clay", as "a middle shelf facies of
      the Redbank and Tinton Formations" in the highstand deposits of sequence
      KM 1, which lies within the Globotruncana gansseri to Abathomphalus
      mayaroensis zones. The Hornerstown Formation lies unconformably on "a
      burrowed surface of the New Egypt Formation".
