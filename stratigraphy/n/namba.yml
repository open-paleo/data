name: Namba
rank: member
parent: Galula
period: [Late Cretaceous]
stages: [Cenomanian, Turonian, Coniacian, Santonian, Campanian]
dispute:
  summary: >
    Campanian or considerably older. Gorscak and colleagues (2019) give "newly
    constrained ages for the Mtuka Member (Aptian-Cenomanian) and Namba Member
    (Campanian)"; the same group in 2022 writes that "although the Namba
    Member may potentially date to the Campanian, the possibility remains that
    this unit is somewhat older, perhaps Cenomanian-Santonian in age based on
    an alternative interpretation" of the paleontological data.
references:
  - id: gorscak2019a
    notes: >
      Gives the Campanian reading, alongside the Mtuka Member's
      Aptian-Cenomanian: new paleomagnetic data date "the overlying Namba
      Member as either Campanian or Cenomanian–Santonian", and its analyses
      adopt "the preferred hypothesis of late Campanian" of Widlansky and
      colleagues (2018).
  - id: gorscak2022a
    notes: >
      Calls it the "Upper Cretaceous Namba Member of the Galula Formation",
      which "may potentially date to the Campanian", and raises the older
      alternative, "perhaps Cenomanian-Santonian in age", a range through the
      Turonian and Coniacian. That reading rests on "an alternative
      interpretation of the paleomagnetic data derived from this unit".
  - id: widlansky2018a
    notes: >
      The first direct age determination for this member, by
      magnetostratigraphy rather than vertebrate biostratigraphy, and the
      source of all five stages as its own stated bracket: "We propose two
      potential correlations for relating these reversals to the GPTS, with
      the first one favored here: (1) These reversals may be equivalent to
      Chron C32 (Campanian), or (2) the reversals may represent short
      excursions during the upper part of the CNS (C34n). Together these
      interpretations constrain the age of the Namba Member to Cenomanian -
      Campanian, a significant refinement over previous constraints." The
      preferred correlation is the Campanian one, which is the reading later
      papers give. Its youngest independent constraint is doubly hedged and
      should not be cited as a determination: a single grain of about 118 Ma
      from the upper part of the member, "(E. M. Roberts, unpublished data)",
      suggesting deposition after the middle Early Cretaceous "if supported
      by subsequent observations".
