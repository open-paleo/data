name: Nyker
rank: group
period: [Late Jurassic, Early Cretaceous]
stages: [Tithonian, Berriasian, Valanginian]
references:
  - id: lindgren2008a
    notes: >
      The group's terrestrial to marginal marine strata are "principally Lower
      Cretaceous" and crop out in the Holsterhus, Nyker, Knudsker, Salene,
      Bøsthøj and Arnager-Sose fault blocks of southwestern Bornholm, blocks
      formed by repeated down-faulting and tilting along the Fennoscandian
      Border Zone during the Triassic and Jurassic. The succession "spans the
      Berriasian–Valanginian interval, although its lowermost parts may be of
      Tithonian age", after Christensen (1974). Its lowest formation, the
      Rabekke, divides into the Homanshald and Skyttegård Members, the former
      resting disconformably on the Lower Jurassic Hasle Formation.
  - id: christiansen2003a
    notes: >
      Gives the span and the contents: the group "spans from (Tithonian?)
      Berriasian to Valanginian in age, and has previously yielded vertebrate
      remains from particularly its youngest Formation, the Jydegaard
      Formation", on Bornholm.
