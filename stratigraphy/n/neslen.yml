name: Neslen
rank: formation
parent: Mesaverde
period: [Late Cretaceous]
stages: [Campanian]
references:
  - id: gates2014a
    notes: >
      Describes Rhinorex from "the Upper Cretaceous Neslen Formation of
      central Utah", and cites the tyrannosaurid record from the unit for
      "upper Campanian Laramidian biogeography".
  - id: loewen2013a
    notes: >
      Cites the same work for the formation, placing it in the Mesaverde
      Group of Utah at upper Campanian.
  - id: prieto-márquez2019b
    notes: >
      Places Rhinorex condrupus in "the Neslen Formation of eastern Utah, in
      late Campanian strata dated to 75-74.5 Ma", citing Gates and Scheetz
      (2014).
