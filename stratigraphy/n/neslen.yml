name: Neslen
rank: formation
parent: Mesaverde
period: [Late Cretaceous]
stages: [Campanian]
lithology: siliciclastic sediments and thick coal beds
references:
  - id: gates2014a
    notes: >
      Describes Rhinorex from "the Upper Cretaceous Neslen Formation of central
      Utah", and cites the tyrannosaurid record from the unit for "upper
      Campanian Laramidian biogeography". Describes its rock: "In addition to
      coal, the formation is comprised of a full complement of terrestrial to
      near marine siliciclastic sediments, delimited by two regional sequence
      boundaries".
  - id: loewen2013a
    notes: >
      Cites the same work for the formation, placing it in the Mesaverde
      Group of Utah at upper Campanian.
  - id: prieto-márquez2020a
    notes: >
      Places Rhinorex condrupus in "the Neslen Formation of eastern Utah, in
      late Campanian strata dated to 75-74.5 Ma", citing Gates and Scheetz
      (2014).
