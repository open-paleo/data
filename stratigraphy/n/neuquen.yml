name: Neuquén
rank: group
period: [Late Cretaceous]
stages: [Cenomanian, Turonian, Coniacian, Santonian, Campanian]
references:
  - id: leanza2004a
    notes: >
      The group "was laid down during nearly 20 myr from the Cenomanian
      through to the Early Campanian", above the Main Miranican unconformity
      and below the Huantraiquican one that separates it from the Malargüe
      Group. A section devoted to it repeats the span as "between the
      Cenomanian and Early Campanian, and thus represents a total duration of
      nearly 24.9 myr", credits Stipanicic and colleagues (1968) with first
      using the name for these strata, and divides it into the Río Limay, Río
      Neuquén and Río Colorado subgroups after Cazau and Uliana (1973). No
      radioisotopic dating was then available for the group, the ages coming
      instead from the unconformity-bounded intervals of the basin's
      tectonosedimentary evolution.
  - id: bonaparte1979c
    notes: >
      Reviews the sauropods of the Neuquén and Chubut Groups and their
      chronological relations, dating the Neuquén Group in the vocabulary of
      its day as "Pre-Maastrichtian Senonian" after Cazau and Uliana (1973)
      and Bertels (1969), and repeating that age for every specimen horizon
      within it. Argues that the sauropods of the Río Colorado and Río Neuquén
      Formations and those of the Laguna Palacios, Bajo Barreal and Castillo
      Formations of the Chubut Group are contemporaneous.
  - id: hugo2001a
    notes: >
      On the General Roca sheet the group is the oldest sedimentary cycle
      mapped, "accumulated in the Upper Cretaceous, more precisely between the
      Cenomanian and the lower Campanian": its base is the intercretaceous
      unconformity of the Main Miranic phase, placed in the Lower Cenomanian
      at 97 +/- 3 Ma, and its top the Huantraiquic unconformity at 74 +/- 3
      Ma, about 23 million years of deposition. Its three subgroups are
      assigned in turn to the Cenomanian to lower Turonian, the upper Turonian
      to Coniacian, and the Santonian to lower Campanian.
  - id: garrido2010a
    notes: >
      The group is a succession of non-marine fluvial, aeolian and shallow
      lacustrine deposits laid down "between the Lower Cenomanian and the
      Middle Campanian (Upper Cretaceous)", reaching a maximum thickness of
      about 1,200 m and bounded below by the Patagonidic unconformity and
      above by the Huantraiquic one, "placed at the base of the Cenomanian ...
      and in the Middle Campanian" respectively. This lithostratigraphic
      restatement reorganizes it into three subgroups and nine formations,
      erecting the Los Bastos and Sierra Barrosa Formations. The Albian is
      given to the underlying Lohan Cura Formation, below the group's basal
      unconformity.
  - id: gonzálezriga2013a
    notes: >
      Names the group and places two sauropod-bearing units within it, the
      Los Bastos Formation in its middle levels and the Sierra Barrosa
      Formation in its upper levels, in Mendoza Province.
