name: Nanyuan
rank: formation
period: [Late Jurassic]
stages: [Kimmeridgian, Tithonian]
references:
  - id: xu2023a
    notes: >
      Gives the horizon with a radiometric age: "Near Yangyuan Village,
      Zhenghe Country, Nanping City, Fujian Province; Upper Jurassic,
      Nanyuan Formation (Tithonian stage; 149.9-150.2 Ma)", the
      Fujianvenator-bearing beds being "black carbonaceous mudstone and
      shale, interstratified with tuffite". The stage is read off the
      paper's own dates: "concordant zircon U-Pb ages of 150.2 ± 1.1 Ma
      (PM702-1) and 149.9 ± 1.1 Ma (PM701-4)" for the fossil-bearing
      layers, and "150 ± 1.8 Ma (Bdx03) and 148 ± 1.9 Ma (Bdx04)" from
      ignimbrites, which "constrain the Zhenghe Fauna to a time interval
      of 148–150 Ma". The Tithonian label belongs to an older chart. On
      the ICS chart v2024/12 (Tithonian base 149.2 Ma) the dates from the
      fossil-bearing layers are Kimmeridgian at their central values, with
      uncertainties reaching the Tithonian, and the younger ignimbrite is
      Tithonian.
  - id: wang2026a
    notes: >
      Independently gives the same locality and horizon for a second paravian.
