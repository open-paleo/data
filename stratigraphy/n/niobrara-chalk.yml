name: Niobrara Chalk
rank: formation
period: [Late Cretaceous]
stages: [Turonian, Coniacian, Santonian, Campanian]
references:
  - id: carpenter2007b
    notes: >
      Gives the Coniacian for the Smoky Hill Chalk within it.
  - id: weishampel2004a
    notes: >
      A reference work, tabulating the "Niobrara Chalk Formation (Kansas),
      Niobrara Chalk Formation (Nebraska)" as "Coniacian-early Campanian".
      Prints the lithic term and the rank word together, which the
      stratigraphic codes treat as alternatives rather than as a pair.
  - id: huene1929a
    notes: >
      Gives the archaic reading, "Niobrara Formation (more or less Turonian",
      which nothing later supports.
  - id: carpenter1995a
    notes: >
      Calls its dinosaur fauna "the best known assemblage from the middle
      Santonian–early Campanian interval of the Late Cretaceous of North
      America", and dates these animals by the Smoky Hill Chalk Member, which,
      following Stewart (1990), "is Coniacian to Santonian in age" near
      Hackberry Creek and lies "near the Santonian–Campanian boundary" in
      Logan County.
  - id: sues2009a
    notes: >
      Gives the Niobrara Chalk Formation that yielded Claosaurus as "Late
      Coniacian to Early Santonian in age", following Carpenter and colleagues
      (1995).
  - id: stewart1990a
  - id: clarke2004a
    notes: >
      Calls the Ichthyornis horizon "the Late Cretaceous Niobrara Chalk of
      Kansas" and, following Stewart and colleagues (1990), gives "The entire
      Smoky Hill Chalk Member of the Niobrara Formation is upper
      Coniacian–lower Campanian in age". Most of the Yale Ichthyornis material
      "would appear to be from the late Santonian–early Campanian".
