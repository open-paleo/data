name: Navajo Sandstone
rank: formation
period: [Early Jurassic]
stages: [Sinemurian, Pliensbachian, Toarcian]
references:
  - id: nesbitt2007a
    notes: >
      Gives its relation to the unit below and a hedged age: "interfingering
      with and directly overlying the Kayenta Formation, the Navajo Sandstone
      (?Pliensbachian) contains a single small coelophysoid, Segisaurus
      halli". Notes that the scarcity of vertebrates in it "leaves a crucial
      gap in the theropod record".
  - id: kirkland1993a
    notes: >
      Sets the Navajo in the wider western succession alongside the other
      Lower Cretaceous and Jurassic units of the region.
  - id: sertich2010a
    notes: >
      Describes Seitaad ruessi from the base of the "Lower Jurassic Navajo
      Sandstone", which it gives as "the uppermost unit of the Glen Canyon
      Group with an age no earlier than Pliensbachian".
  - id: olsen1984a
    notes: >
      Early Jurassic, by way of a figured footprint: Navahopus falcipollex,
      traced from Baird (1980) and there suggested to have been produced by a
      prosauropod dinosaur, comes from "the Navajo Sandstone (E. Jurassic) of
      the Glen Canyon Group, Arizona".
  - id: baird1980a
    notes: >
      "This evidence suggests a Sinemurian to Pliensbachian age for the Navajo
      Sandstone", the evidence being a Corollina-dominated microflora from the
      Whitmore Point Member of the Moenave correlated with the lower Liassic;
      Olsen and Galton (1977) show the Glen Canyon Group beginning in the
      Hettangian and continuing through the Sinemurian until well along in the
      Pliensbachian, and Galton's (1971) correlation of the Navajo with the
      now lower Liassic Portland Formation stands. The Navahopus falcipollex
      type trackway comes from "Cross-stratified dune sand of the upper Navajo
      Sandstone, Glen Canyon Group, Lower Jurassic (Sinemurian-Pliensbachian)"
      on the Kaibito Plateau.
  - id: tykoski2004a
    notes: >
      Segisaurus halli, "the geologically youngest known, unequivocal
      coelophysoid", is based on a small incomplete skeleton "from the Navajo
      Sandstone (Pliensbachian-Toarcian) of northeastern Arizona".
