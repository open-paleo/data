name: Naashoibito
rank: member
parent: Ojo Alamo
period: [Late Cretaceous]
stages: [Maastrichtian]
dispute:
  summary: >
    Which formation contains it is contested. Sullivan and colleagues (2011)
    put it in the Ojo Alamo -- "Ojo Alamo Formation (Naashoibito Member),
    Alamo Wash local fauna (early Maastrichtian". Longrich and colleagues
    (2024) instead write "Naashoibito Member of the Kirtland Formation in
    New Mexico". The disagreement is about placement rather than about which
    units exist: both candidate parents are units in their own right.
references:
  - id: sullivan2011a
    notes: >
      Places it in the Ojo Alamo and dates the Alamo Wash local fauna early
      Maastrichtian.
  - id: longrich2024b
    notes: >
      Places the same member in the Kirtland Formation instead.
  - id: fowler2011a
    notes: >
      Gives its giant Alamosaurus specimens as all from "the Naashoibito
      Member (Lower Maastrichtian, Upper Cretaceous) of the Ojo Alamo
      Formation (San Juan Basin, New Mexico)", the type stratum of Alamosaurus
      sanjuanensis.
