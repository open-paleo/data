name: Naashoibito
rank: member
parent: Ojo Alamo
period: [Late Cretaceous]
stages: [Maastrichtian]
description: "The Naashoibito Member is a member of the Ojo Alamo Formation in New Mexico. It is the lower of the formation's two members and is separated from the upper Kimbeto Member by a large unconformity. Argon dating indicates the base of the Naashoibito Member is 66.5 million years old. Direct argon dating of two dinosaur fossil–bearing samples around 5 meters (16 ft) and 3.5 meters (11 ft) above the base of the member yielded maximum depositional ages of 66.87 ± 0.04 Ma and 66.38 ± 0.08 Ma, placing the strata of the Naashoibito Member preserving non-avian dinosaur fossils in the latest Maastrichtian. This finding has been interpreted as showing that a high diversity of North American dinosaurs lived before the Cretaceous–Paleogene extinction event, and that Maastrichtian dinosaur faunas from Laramidia were not uniform in the entire continent. The Naashoibito Member is believed to represent a short period of geologic time, only 500,000 years."
dispute:
  summary: >
    Which formation contains it is contested. Sullivan and colleagues (2011)
    put it in the Ojo Alamo — "Ojo Alamo Formation (Naashoibito Member),
    Alamo Wash local fauna (early Maastrichtian)". Longrich and colleagues
    (2024) instead write "Naashoibito Member of the Kirtland Formation in
    New Mexico". The disagreement is about placement rather than about which
    units exist: both candidate parents are units in their own right.
references:
  - id: sullivan2011a
    notes: >
      Places it in the Ojo Alamo and dates the Alamo Wash local fauna early
      Maastrichtian.
  - id: longrich2024b
    notes: >
      Places the same member in the Kirtland Formation instead.
  - id: fowler2011a
    notes: >
      Gives its giant Alamosaurus specimens as all from "the Naashoibito
      Member (Lower Maastrichtian, Upper Cretaceous) of the Ojo Alamo
      Formation (San Juan Basin, New Mexico)", the type stratum of Alamosaurus
      sanjuanensis.
