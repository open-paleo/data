name: Nam Phong
rank: formation
period: [Late Triassic, Early Jurassic, Middle Jurassic, Late Jurassic]
stages: [Norian, Rhaetian, Hettangian, Sinemurian, Pliensbachian,
  Toarcian, Aalenian, Bajocian, Bathonian, Callovian, Oxfordian,
  Kimmeridgian, Tithonian]
references:
  - id: jia2022a
    notes: >
      From detrital zircons in the Nakhon Thai Basin gives "maximum possible
      depositional ages of approximately 208 … Ma for the Nam Phong Formation",
      which it treats as Late Triassic.
  - id: buffetaut2000a
    notes: >
      Bounds the age rather than dating it directly: "The fluviatile Nam
      Phong Formation contains palynomorphs showing that it cannot be younger
      than Rhaetian", and it overlies the Huai Hin Lat Formation.
  - id: bandyopadhyay2010a
    notes: >
      Tabulates the Isanosaurus horizon as "Nam Phong Formation" of
      northeastern Thailand at "Late Triassic" and "(Norian-Rhaetian)".
  - id: rincón2022a
    notes: >
      Notes that the formation "was initially interpreted to be Late Triassic
      in age, but recent revisions have suggested an Early Jurassic age",
      following Laojumpon and colleagues (2017).
  - id: wang2025a
    notes: >
      Reports that Isanosaurus was described as a Late Triassic dinosaur, but
      that "the Nam Phong Formation was dated as Late Jurassic afterwards".
  - id: laojumpon2017a
    notes: >
      Splits the formation in two on seismic analysis: "The Lower Nam Phong
      Formation which was formed in Upper Triassic period" and "the Upper Nam
      Phong Formation, which is neither older than Pliensbachian nor younger
      than Late Jurassic period". Palynology makes the formation "not older
      than Pliensbachian (Late Early Jurassic period)", after Racey (2009),
      and its sauropods, judged "more similar to the Early Jurassic than
      Triassic dinosaurs", are placed in the upper part.
  - id: racey1996a
    notes: >
      "The Nam Phong Formation is dated accurately for the first time as late
      Norian to Rhaetian" on palynology: common Ovalipollis ovalis and
      undifferentiated striate bisaccate pollen indicate "an age no younger
      than Rhaetian and no older than Ladinian", and with the lack of Rhaetian
      markers suggesting a Norian age for the underlying Huai Hin Lat
      Formation, "the Nam Phong Formation must be late Norian or Rhaetian in
      age". Petrographically "the Triassic Nam Phong Formation" has more in
      common with the Huai Hin Lat below than with the Khorat Group above,
      from which a probable hiatus of unknown duration, possibly spanning the
      entire Jurassic, separates it.
  - id: racey2009a
    notes: >
      Splits the unit: "Because the Lower Nam Phong Formation is bounded by
      unconformities it cannot according to the code of lithostratigraphic
      nomenclature be assigned to the same formation as the Upper Nam Phong
      Formation", whose age "could fall anywhere between the Pliensbachian and
      the end of the Jurassic".
  - id: racey2009b
    notes: >
      "From subsurface seismic data it is clear that the Nam Phong Formation
      comprises two distinct units separated by an unconformity", a Lower Nam
      Phong of "Late Triassic (Rhaetian)" age and an Upper Nam Phong "no older
      than Pliensbachian and no younger than Late Jurassic", for which "a Late
      Jurassic age is tentatively proposed". The unconformity "has yet to be
      identified at outcrop, and as the red beds straddling the unconformity
      are lithologically similar it would be difficult to detect at outcrop",
      and the formation "at outcrop has, to date, yielded only Late Triassic
      (late Norian to Rhaetian) palynomorphs". The Hettangian and Sinemurian
      fall in the hiatus between the two parts rather than in either.
