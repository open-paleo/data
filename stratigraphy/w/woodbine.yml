name: Woodbine
rank: group
period: [Late Cretaceous]
stages: [Cenomanian]
dispute:
  summary: >
    Group or formation, and what sits inside it moves with the answer. Tykoski
    and colleagues (2023) use group rank, placing "the Lewisville Formation of
    the Woodbine Group (middle Cenomanian) of north Texas". Head (1998) and
    McDonald and colleagues (2017) use formation rank, the first with "the
    Arlington Member of the Woodbine Formation" and the second with "the
    Lewisville Member of the Woodbine Formation". Either way, the unit
    contains both the Arlington and the Lewisville.
references:
  - id: tykoski2023a
    notes: >
      Uses group rank with the Lewisville as a formation inside it, and dates
      its deposits "lower middle Cenomanian".
  - id: head1998a
    notes: >
      Uses formation rank with the Arlington as a member, and fixes the middle
      Cenomanian by the overlying Tarrant Member of the Eagleford Group. Gives
      the age of the Flower Mound type locality as "early Late Cretaceous,
      Mid-Cenomanian, 95 Ma".
  - id: mcdonald2017a
    notes: >
      Uses formation rank with the Lewisville as a member.
