name: Woodbine
rank: group
period: [Late Cretaceous]
stages: [Cenomanian]
description: "The Woodbine Group is a geological formation in east Texas whose strata date back to the Early to Middle Cenomanian age of the Late Cretaceous. It is the producing formation of the giant East Texas Oil Field (also known as the \"Black Giant\") from which over 5.42 billion barrels of oil have been produced. Dinosaur and crocodilian remains are among the fossils that have been recovered from the formation. This fossil formation preserves organisms that were endemic to Appalachia. The Woodbine represents ancient river and delta systems that originated from erosion of the Ouachita Uplift in modern-day Oklahoma and Arkansas and the Sabine Uplift in modern-day Texas and Louisiana."
references:
