name: Wonthaggi
rank: formation
period: [Early Cretaceous]
stages: [Valanginian, Hauterivian, Barremian, Aptian, Albian]
references:
  - id: herne2019a
    notes: >
      Places the Flat Rocks locality "in the Wonthaggi Formation (Strzelecki
      Group)" and gives its fauna a "late Barremian" age, from palynology
      reported as a personal communication.
  - id: agnolín2010a
    notes: >
      Carries the younger bound, "Wonthaggi Formation, early Aptian", which it
      glosses at its Victorian localities as "early Aptian: late Early
      Cretaceous". It also gives the full span, "the middle Valanginian-Aptian
      Wonthaggi Formation of the Strzelecki Group", which takes in the
      Hauterivian.
  - id: carrano2012a
    notes: >
      Treats the theropod ungual once referred to Megalosaurus (NMV P.10058)
      as coming from "the Valanginian–Albian Wonthaggi Formation".
  - id: wagstaff1989a
    notes: >
      Dates the vertebrate localities of the Strzelecki Group, to which the
      formation belongs, as "Valanginian–Aptian" by spores and pollen; it does
      not name the formation.
  - id: helby1987a
    notes: >
      Cited by Wagstaff and McEwen Mason (1989) for tying the zone's base to
      the base of the Valanginian.
  - id: lindsay1982a
    notes: >
      Cited by Wagstaff and McEwen Mason (1989) for a fission-track age of 128
      plus or minus 8 million years at Kilcunda.
