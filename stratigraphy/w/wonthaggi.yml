name: Wonthaggi
rank: formation
period: [Early Cretaceous]
stages: [Valanginian, Hauterivian, Barremian, Aptian, Albian]
references:
  - id: herne2019a
    notes: >
      Places it in its group and dates one locality in it: "The Flat Rocks
      locality in the Wonthaggi Formation (Strzelecki Group) of the Gippsland
      Basin, southeastern Australia, hosts fossils of a late Barremian
      vertebrate fauna". That late Barremian age rests on renewed
      palynological work; earlier palynology, following Wagstaff and McEwen
      Mason (1989), "suggested that the region of the Wonthaggi Formation
      encompassing the Flat Rocks locality was middle Valanginian–middle
      Barremian in age".
  - id: agnolín2010a
    notes: >
      Carries the younger bound, "Wonthaggi Formation, early Aptian", which it
      glosses at its Victorian localities as "early Aptian: late Early
      Cretaceous". It also gives the full span, "the middle Valanginian-Aptian
      Wonthaggi Formation of the Strzelecki Group", which takes in the
      Hauterivian.
  - id: carrano2012a
    notes: >
      Treats the theropod ungual once referred to Megalosaurus (NMV P.10058)
      as coming from "the Valanginian–Albian Wonthaggi Formation".
  - id: wagstaff1989a
    notes: >
      Never names this formation. The five apparent hits on its name are a
      spore epithet, Foraminisporis wonthaggiensis, named after the same
      town and appearing in the zone definitions and a range chart. What the
      paper dates is localities at group level: "the localities in Otway
      Group sediments are of late Aptian-early Albian age ... and the
      localities in the Strzelecki Group of Valanginian-Aptian age". This
      unit is a Strzelecki one, so the reference supports Valanginian to
      Aptian and not the Albian. The base of that zone is contested within
      the paper itself - the first appearance of the spore "has been dated as
      middle Valanginian ... However, Helby et al. (1987) correlate this
      first appearance with the base of the Valanginian stage" - and an
      independent tie-point is given, "Fission-track dating of Kilcunda
      (Lindsay 1982) gave an age of 128 plus or minus 8 m.y.". The paper's
      own condition travels with all of it: "This age determination is
      dependent on the isochronicity of spore-pollen zones across eastern
      Australia."
