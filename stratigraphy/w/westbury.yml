name: Westbury
rank: formation
parent: Penarth
period: [Late Triassic]
stages: [Rhaetian]
references:
  - id: evans2025a
    notes: >
      Places it beside the Cotham Member, the bivalve Protocardia crowcombeia
      "occurring in the Westbury Formation and Cotham Member of the Lilstock
      Formation of the Rhaetian".
  - id: ezcurra2007a
    notes: >
      Lists it among the well-represented Rhaetian sedimentary units of
      Europe, with the Lower Höganäs Formation of Sweden and the Rhaetian
      Beds of Wales.
  - id: galton1985a
    notes: >
      Gives the type horizon at Wedmore, Somerset, as "Wedmore Stone of
      Westbury Formation in Penarth Group (Rhaetic, Upper Triassic)".
