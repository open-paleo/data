name: Weymouth
rank: member
parent: Oxford Clay
period: [Late Jurassic]
stages: [Oxfordian]
lithology: pale-gray calcareous mudstone, with thin dark carbonaceous beds
references:
  - id: naish2007a
    notes: >
      Gives the Metriacanthosaurus horizon as "the Weymouth Member (formerly
      Upper Oxford Clay) of Weymouth, Dorset", and records that two reference
      works "incorrectly stated that M. parkeri is from the Corallian Oolite
      Formation".
  - id: smith1997a
    notes: >
      Records the formalization of the three Oxford Clay members by Cox and
      colleagues (1992), this being the uppermost, and calls it "The Oxfordian
      Weymouth Member".
  - id: cox1992a
    notes: >
      Erects the member for the Upper Oxford Clay, the uppermost of the
      formation's three, and describes it as "pale-grey, blocky,
      smooth-textured, calcareous mudstone". Source of the lithology.
  - id: barron2012a
    notes: >
      Places the member in the Mariae and Cordatum zones, early Oxfordian, and
      finds it the only member of the Oxford Clay in the Cleveland Basin,
      "entirely Upper Jurassic (Oxfordian)".
