name: Weymouth
rank: member
parent: Oxford Clay
period: [Late Jurassic]
stages: [Oxfordian]
references:
  - id: naish2007a
    notes: >
      Gives the Metriacanthosaurus horizon as "the Weymouth Member (formerly
      Upper Oxford Clay) of Weymouth, Dorset", and records that two reference
      works "incorrectly stated that M. parkeri is from the Corallian Oolite
      Formation".
  - id: barsbold1997a
    notes: >
      Records the formalization of the three Oxford Clay members by Cox and
      colleagues (1992), this being the uppermost, and calls it "The Oxfordian
      Weymouth Member".
  - id: cox1992a
    notes: >
      Erects the member. The Oxford Clay is classified as a formation and
      "The three traditional subdivisions - Lower, Middle and Upper - are
      endorsed as lithostratigraphic units and named the Peterborough Member,
      Stewartby Member and Weymouth Member, respectively", this being the
      uppermost, "(formerly termed Upper Oxford Clay)". Its lithology is
      "Predominantly pale-grey, blocky, smooth-textured, calcareous mudstone
      ... Generally rather poorly fossiliferous". The age here is the
      formation's and not the member's - "The Oxford Clay is a marine
      argillaceous deposit of Callovian-Oxfordian age" - so this supports the
      Oxfordian only through the parent. All three members run from Dorset to
      Humberside, and this one "is also present in North Yorkshire where it
      is the sole representative of the Oxford Clay Formation".
