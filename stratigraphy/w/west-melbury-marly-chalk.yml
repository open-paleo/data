name: West Melbury Marly Chalk
rank: formation
period: [Late Cretaceous]
stages: [Cenomanian]
lithology: soft marly chalk and hard gray limestone in couplets
references:
  - id: hopson2005a
    notes: >
      Defines the formation, "Upper Cretaceous, Cenomanian", from the erosion
      surface at the base of its Glauconitic Marl Member, and names Copt Point
      among its primary reference sections. Source of the lithology.
  - id: barrett2020a
    notes: >
      Gives "West Melbury Marly Chalk Formation (Upper Cretaceous;
      Cenomanian)" and notes that its vertebrate remains are "reworked from
      the underlying Gault Formation (Lower Cretaceous; upper Albian ...)".
  - id: raven2020a
    notes: >
      Independently gives "West Melbury Marly Chalk Formation (Cenomanian)".
