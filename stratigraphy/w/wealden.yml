name: Wealden
rank: supergroup
period: [Early Cretaceous]
stages: [Berriasian, Valanginian, Hauterivian, Barremian, Aptian]
dispute:
  summary: >
    Supergroup and group are both in current use for this unit. Mannion and
    colleagues (2019) write of "the earliest Cretaceous (Berriasian-
    Hauterivian) sections of the Wealden Supergroup", and Raven and
    colleagues (2020) title their revision "British Wealden Supergroup
    (Berriasian-Aptian) Ankylosaurs". Group rank is also in common use for
    it.
references:
  - id: mannion2019a
    notes: >
      Supergroup rank and the older half of the range, Berriasian to
      Hauterivian.
  - id: raven2020a
    notes: >
      Supergroup rank and the full span, Berriasian to Aptian, in its title,
      which its abstract repeats as "the Lower Cretaceous Wealden Supergroup
      (Berriasian–Aptian) of Britain". Within it, the Weald Sub-basin holds
      "the Hastings Beds Group (Berriasian–Valanginian)" and, after Batten and
      Austen (2011), "the Weald Clay Group (Hauterivian–Barremian ...)"; in
      the Wessex Sub-basin, where it ranks as a group, it holds "the Wessex
      (Valanginian–Barremian) and Vectis (Aptian) formations".
  - id: batten2011a
  - id: racey1996a
    notes: >
      Small theropods "tentatively referred to as spinosaurids are known only
      from the Cretaceous (Aptian-Albian) of North Africa and possibly also
      from the Wealden (Barremian) of southern England". The unit appears only
      as a faunal comparison for the Sao Khua Formation of northeastern
      Thailand.
