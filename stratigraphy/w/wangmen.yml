name: Wangmen
rank: formation
period: [Early Jurassic, Middle Jurassic]
references:
  - id: mo2025a
    notes: >
      Describes Huashanosaurus from "the Lower and Middle Jurassic Wangmen
      Formation of Ningming County, Guangxi, South China". It records that
      "Previous work showed that the Wangmen Fm. is early Early Jurassic in
      age", while "the new eusauropod discovery indicates that the Wangmen Fm.
      is probably somewhat younger Early–Middle Jurassic in age", the range
      Meng (2000) had proposed from charophytes. It gives series, not stages.
  - id: meng2000a
