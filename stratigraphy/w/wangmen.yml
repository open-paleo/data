name: Wangmen
rank: formation
period: [Early Jurassic, Middle Jurassic]
dispute:
  summary: >
    Meng (2000) dates the Wangmen of the Shiwandashan Basin as early Early
    Jurassic and gives Early–Middle Jurassic, the Middle Jurassic only
    possible, for beds in the smaller basins on its northern margin that had
    been assigned to the unit by lithology. Mo and colleagues (2025) apply
    that range to the formation as a whole, and place the Ningming quarry
    "in the Shiwandashan Basin" without taking up Meng's distinction between
    the basin and its margin basins.
references:
  - id: mo2025a
    notes: >
      Describes Huashanosaurus from "the Lower and Middle Jurassic Wangmen
      Formation of Ningming County, Guangxi, South China". It records that
      "Previous work showed that the Wangmen Fm. is early Early Jurassic in
      age", while "the new eusauropod discovery indicates that the Wangmen Fm.
      is probably somewhat younger Early–Middle Jurassic in age", the range
      Meng (2000) had proposed from charophytes. It gives series, not stages.
  - id: meng2000a
    notes: >
      On charophytes: "The Wangmen Formation in the Shiwandashan Basin is of
      early Early Jurassic age. Judging from the composition of the charophyte
      assemblage collected from the sections of the small and medium-sized
      basins on the northern margin of the basin, its geological age should
      provisionally be assigned to the Early–Middle Jurassic", and "This
      indicates that the upper part of this formation may be of Middle
      Jurassic age." It adds that "the Shiwandashan Basin and the small and
      medium-sized basins on its northern margin did not form at the same
      time; the latter may have been deposited somewhat later".
