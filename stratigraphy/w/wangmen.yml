name: Wangmen
rank: formation
period: [Early Jurassic, Middle Jurassic]
lithology: argillaceous siltstone, mudstone and fine sandstone
dispute:
  summary: >
    Meng (2000) dates the Wangmen of the Shiwandashan Basin as early Early
    Jurassic and gives Early–Middle Jurassic, the Middle Jurassic only
    possible, for beds in the smaller basins on its northern margin that had
    been assigned to the unit by lithology. Mo and colleagues (2025) apply
    that range to the formation as a whole, and place the Ningming quarry
    "in the Shiwandashan Basin" without taking up Meng's distinction between
    the basin and its margin basins.
references:
  - id: mo2025a
    notes: >
      Describes Huashanosaurus from the formation and, after Meng (2000), dates
      it "probably somewhat younger Early–Middle Jurassic", by series only.
      Source of the lithology.
  - id: meng2000a
    notes: >
      On charophytes, dates beds assigned to the formation in basins on the
      Shiwandashan Basin's northern margin Early–Middle Jurassic, against an
      early Early Jurassic Wangmen in the basin itself.
