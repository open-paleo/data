name: Woodbury
rank: formation
period: [Late Cretaceous]
stages: [Campanian]
description: "The Woodbury Formation is a Mesozoic geologic formation in New Jersey, United States. It primarily consists of massive dark gray clays and silts with carbonized wood fragments and pyrite, deposited in a marine setting. The remains of the dinosaur Hadrosaurus have been recovered from this formation. Using radio isotope dating of bivalve shells, the formation has been dated to between 80.5 and 78.5 million years ago."
references:
  - id: horner2004a
    notes: >
      A reference work, tabulating Hadrosaurus foulkii from the
      "Merchantville Formation, Woodbury Formation, Marshalltown Formation
      (New Jersey), United States" at Campanian.
  - id: brett-surman1989a
    notes: >
      Independently tabulates "Woodbury Fm, Campanian" among the North
      American hadrosaur-bearing units.
  - id: prieto-márquez2006a
    notes: >
      Gives the type horizon of Hadrosaurus foulkii at Haddonfield, New
      Jersey, as "Woodbury Formation, Campanian, Upper Cretaceous".
