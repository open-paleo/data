name: Wabiskaw
rank: member
parent: Clearwater
period: [Early Cretaceous]
stages: [Aptian, Albian]
references:
  - id: brown2017a
    notes: >
      Gives the Borealopelta horizon as "Wabiskaw Member, Clearwater
      Formation, Aptian stage" in the locality line and "the Albian-aged
      Wabiskaw Member" in the geological setting, the member overlying the
      bitumen-rich McMurray Formation.
  - id: brown2020b
    notes: >
      Places the specimen "near the base of a 3 m thick greenish-grey, very
      fine- to medium-grained glauconitic sandstone unit within the marine
      Wabiskaw Member", about 8 m above the McMurray Formation. Spells the
      name Wabiska in one table and Wabiskaw in the text.
