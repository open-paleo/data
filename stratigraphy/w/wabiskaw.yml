name: Wabiskaw
rank: member
parent: Clearwater
period: [Early Cretaceous]
stages: [Aptian, Albian]
references:
  - id: brown2017a
    notes: >
      Gives the Borealopelta horizon as "Wabiskaw Member, Clearwater
      Formation, Aptian stage" in the locality line and "the Albian-aged
      Wabiskaw Member" in the geological setting, the member overlying the
      bitumen-rich McMurray Formation.
  - id: brown2020b
    notes: >
      Places the specimen "near the base of a 3 m thick greenish-grey, very
      fine- to medium-grained glauconitic sandstone unit within the marine
      Wabiskaw Member", about 8 m above the McMurray Formation. Spells the
      name Wabiska in one table and Wabiskaw in the text.
  - id: badgley1952a
    notes: >
      Describes the member: "This member of the Clearwater, named from the
      Barnsdall West Wabiskaw No. 1 well, consists, where typically developed,
      of a massive sandstone unit", of glauconitic, predominantly marine
      greywackes, noting that it was "Referred to previously in a publication
      of the Alberta Government Petroleum and Natural Gas Conservation Board".
      Correlates it lithologically with the Islay member and the "Glauconitic
      sandstone", and with the Bluesky Formation to the northwest.
  - id: hein2006a
    notes: >
      The member "unconformably overlies the McMurray Formation (Badgley,
      1952)" and is informally divided into Wabiskaw A to D; on palynology,
      "Upper McMurray is Aptian, whereas Wabiskaw D is Early Albian".
  - id: hein2018a
    notes: >
      "The Wabiskaw Member of the Clearwater Formation has usually been
      assigned to the Albian. A precise age cannot be given based on the
      current data but if the ranges of the above species are valid, it is no
      older than mid Late Aptian, jacobii Zone", on dinocysts.
