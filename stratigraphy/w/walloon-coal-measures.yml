name: Walloon Coal Measures
rank: subgroup
period: [Middle Jurassic, Late Jurassic]
stages: [Bathonian, Callovian, Oxfordian, Kimmeridgian]
lithology: mudstone, siltstone, labile sandstone and coal
dispute:
  summary: >
    Rank is unsettled. Nair and Salisbury (2012) equate the unit with a
    subgroup — "Walloon Coal Measures (= Walloon Subgroup; coeval with the
    Birkhead Formation of the Eromanga Basin)" — while group rank is also in
    use for it.
references:
  - id: nair2012a
    notes: >
      Gives the subgroup equivalence and the Eromanga Basin correlative in its
      figure caption for the Rhoetosaurus type area. The Rhoetosaurus material
      comes from the lowermost section, whose age, "based on
      palynostratigraphy ... is late Bathonian-middle Callovian".
  - id: todd2019a
    notes: >
      Dates the Rhoetosaurus matrix to no older than 162.6 ± 1.1 Ma, correlates
      it with the base of the unit "just above the Eurombah Formation", and
      relays a Callovian to Tithonian age.
  - id: leahey2015a
    notes: >
      Places a queried stegosaurian footprint from the Balgowan Colliery on
      the Darling Downs, known from replica QM F5701, in the "Middle Jurassic
      (Bajocian–Bathonian) Walloon Coal Measures", following Hill, Playford
      and Woods (1966).
  - id: longman1926a
    notes: >
      Gives the Rhoetosaurus horizon as "Walloon Series, Jurassic,
      Freshwater" (p. 183). Its Lower Jurassic age is Walkom's, relayed
      rather than Longman's own: "In a later paper A. B. Walkom lists
      thirty-seven species from the Walloon Series and its equivalents,
      and states: 'There is no doubt that the age of this flora is Lower
      Jurassic.'"
  - id: hill1966a
  - id: exon1976a
    notes: >
      Source of the lithology.
  - id: wainman2018b
    notes: >
      Its own CA-TIMS U–Pb dates on tuffs in Walloon lithofacies run from
      167.56 Ma, Bathonian on the ICS chart v2024/12; its Table 1 gives a
      compiled "Aalenian to Callovian" biostratigraphic age.
  - id: wainman2018a
    notes: >
      Calibrates the spore-pollen zones against the same tuffs; its "early
      Tithonian" for a 150.77 Ma tuff in the upper Walloon is Kimmeridgian on
      the ICS chart v2024/12, and its 149.08 Ma tuff lies in the Springbok.
