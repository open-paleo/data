name: Walloon Coal Measures
rank: subgroup
period: [Early Jurassic, Middle Jurassic, Late Jurassic]
stages: [Bajocian, Bathonian, Callovian, Oxfordian, Kimmeridgian, Tithonian]
dispute:
  summary: >
    Rank is unsettled. Nair and Salisbury (2012) equate the unit with a
    subgroup -- "Walloon Coal Measures (= Walloon Subgroup; coeval with the
    Birkhead Formation of the Eromanga Basin)" -- while group rank is also in
    use for it.
references:
  - id: nair2012a
    notes: >
      Gives the subgroup equivalence and the Eromanga Basin correlative in its
      figure caption for the Rhoetosaurus type area. The Rhoetosaurus material
      comes from the lowermost section, whose age, "based on
      palynostratigraphy ... is late Bathonian-middle Callovian".
  - id: todd2019a
    notes: >
      The unit was considered Lower Jurassic when Longman (1926) placed the
      Rhoetosaurus horizon in it, but "presently the age of the unit is
      considered Middle to Upper Jurassic (Callovian to Tithonian) based on
      extensive new high-precision ID-TIMS U-Pb geochronology of volcanic
      tuffs from throughout the succession", against earlier palynology that
      "suggested a late Bathonian to middle Callovian age (~167-164 Ma)".
      Detrital zircon from the sandstone matrix of the Rhoetosaurus specimen
      gives a maximum depositional age of 162.6 ± 1.1 Ma, "no older than early
      Oxfordian", which correlates "with the base of the Walloon Coal
      Measures, just above the Eurombah Formation, in the western Surat
      Basin".
  - id: leahey2015a
    notes: >
      Places a queried stegosaurian footprint from the Balgowan Colliery on
      the Darling Downs, known from replica QM F5701, in the "Middle Jurassic
      (Bajocian–Bathonian) Walloon Coal Measures", following Hill, Playford
      and Woods (1966).
