name: Winton
rank: formation
parent: Manuka
period: [Early Cretaceous, Late Cretaceous]
stages: [Albian, Cenomanian, Turonian]
lithology: interbedded sandstone, siltstone, mudstone and coal, with minor
  intraformational conglomerate
dispute:
  summary: >
    Poropat and colleagues (2020) give "Cenomanian-lowermost Turonian";
    Tucker and colleagues (2013) hold that "the upper Winton Formation very
    likely continued into or past the early Turonian", and Hocknull and
    colleagues (2021) read detrital zircon maximum depositional ages as "Late
    Albian to earliest Turonian"; Korasidis and colleagues
    (2026), on palynology from two wells, find "a latest Albian to Cenomanian
    age for the Winton Formation in these wells, with no evidence of
    Turonian-aged assemblages".
references:
  - id: poropat2020a
    notes: >
      Gives "Winton Formation; Cenomanian-lowermost Turonian".
  - id: beeston2024a
    notes: >
      Hedges the younger end, "lower Upper Cretaceous (Cenomanian-?
      lowermost Turonian)".
  - id: hocknull2021a
    notes: >
      Relays a late Albian to Cenomanian palynological age, reads detrital
      zircon maximum depositional ages as "Late Albian to earliest Turonian",
      and dates the Australotitan horizon "Cenomanian-? Turonian".
  - id: hocknull2009a
    notes: >
      Reports that the formation "is approximately 1100 m thick and is
      ascribed a late Albian-Cenomanian age by Burger", with its lower section
      in an Albian and its upper section in a Cenomanian palynomorph zone.
      Dates the dinosaurs from "the basal portion of the Winton Formation" as
      "latest Albian", describing them as from the "late Early Cretaceous
      (latest Albian) Winton Formation".
  - id: monteil2006a
  - id: burger1986a
  - id: korasidis2026a
    notes: >
      Assigns 16 Winton samples from two Eromanga Basin petroleum wells,
      Tamarama-1 and Queenscliff-1, to the PK7 palynological zone, which
      "suggests a latest Albian to Cenomanian age for the Winton Formation in
      these wells, with no evidence of Turonian-aged assemblages".
  - id: tucker2013a
    notes: >
      From detrital zircon maximum depositional ages, puts the base of the
      formation "at or near the Albian/Cenomanian boundary" and its upper part
      "into or past the early Turonian"; its conclusions hold that the
      youngest zircon population "was likely deposited syndepositionally" and
      that deposition "occurred within the early-Turonian to
      Turonian–Cenomanian boundary".
  - id: gray2002a
    notes: >
      Dates the formation late Albian(?) to Cenomanian on spore-pollen
      assemblages, and has it conformably overlie the Mackunda Formation. Source
      of the lithology.
  - id: vine1967a
    notes: >
      Keeps the unit as a formation ("No change is proposed for the Winton and
      Mackunda Formations") and places it in a new subgroup with the
      Mackunda: "For this sequence we propose the term Manuka Sub-group."
      Gives no age.
