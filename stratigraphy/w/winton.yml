name: Winton
rank: formation
parent: Manuka
period: [Early Cretaceous, Late Cretaceous]
stages: [Albian, Cenomanian, Turonian]
references:
  - id: poropat2020a
    notes: >
      Gives "Winton Formation; Cenomanian-lowermost Turonian".
  - id: beeston2024a
    notes: >
      Hedges the younger end, "lower Upper Cretaceous (Cenomanian-?
      lowermost Turonian".
  - id: hocknull2021a
    notes: >
      Reviews the palynology of Monteil (2006) that gave the formation "a Late
      Albian to Cenomanian chronostratigraphic age", and treats the detrital
      zircon results cautiously, saying they "indicate a probable temporal age
      range of between 103 to 92 million years ago (Late Albian to earliest
      Turonian) for the maximal depositional ages of portions of the Winton
      Formation". Gives the Australotitan holotype horizon as "Cenomanian-?
      Turonian, Winton Formation."
  - id: hocknull2009a
    notes: >
      Reports that the formation "is approximately 1100 m thick and is
      ascribed a late Albian-Cenomanian age by Burger", with its lower section
      in an Albian and its upper section in a Cenomanian palynomorph zone.
      Dates the dinosaurs from "the basal portion of the Winton Formation" as
      "latest Albian", describing them as from the "late Early Cretaceous
      (latest Albian) Winton Formation".
  - id: monteil2006a
  - id: burger1986a
