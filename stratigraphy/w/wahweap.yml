name: Wahweap
rank: formation
period: [Late Cretaceous]
stages: [Campanian]
references:
  - id: lund2016a
    notes: >
      Calls it the "Upper Cretaceous (middle-late Campanian) Wahweap
      Formation" in the abstract and the "late Campanian Wahweap Formation" in
      the introduction.
  - id: beveridge2022a
    notes: >
      Treats the formation "and its constituent biotic assemblages" as a
      Campanian reference section. Its title calls it "the Upper Cretaceous
      Wahweap Formation", and its age model places the formation boundaries at
      about 82.17 and 77.29 Ma, "coinciding with the first half of the
      Campanian Stage".
  - id: jinnah2007a
    notes: >
      The Upper Cretaceous formation of southern Utah is a series of
      fossil-bearing fluvial and floodplain sandstones and mudstones laid down
      on a low-relief coastal to alluvial plain in the central Western
      Interior Basin. Single-crystal 40Ar/39Ar dating of sanidine from a
      bentonite near the base of the formation yields 80.1 ± 0.3 Ma, and with
      a previously dated ash at the base of the overlying Kaiparowits
      Formation gives an accumulation interval of about 80.8 to 76.1 Ma,
      making the unit "considerably younger than the Milk River Fm (84.5-83.5
      Ma)".
