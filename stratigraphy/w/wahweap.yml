name: Wahweap
rank: formation
period: [Late Cretaceous]
stages: [Campanian]
references:
  - id: lund2016a
    notes: >
      Calls it the "Upper Cretaceous (middle-late Campanian) Wahweap
      Formation" in the abstract and the "late Campanian Wahweap Formation" in
      the introduction.
  - id: beveridge2022a
    notes: >
      Treats the formation "and its constituent biotic assemblages" as a
      Campanian reference section. Its title calls it "the Upper Cretaceous
      Wahweap Formation", and its age model places the formation boundaries at
      about 82.17 and 77.29 Ma, "coinciding with the first half of the
      Campanian Stage".
  - id: jinnah2008a
    notes: >
      Gives the formation's first radiometric age, 80.1 ± 0.3 Ma by 40Ar-39Ar
      on a bentonite "approximately 40 m above the base of the Wahweap
      Formation", and concludes that "deposition of the Wahweap Formation, in
      the study area likely commenced somewhere between ~80.6–80.4 Ma and
      ended somewhere between ~77.5 and 76.1 Ma". Finds the lower and middle
      members "younger than the Milk River Formation". Beveridge and
      colleagues (2022) later re-date the same bentonite at about 81.47 Ma.
