name: Wahweap
rank: formation
period: [Late Cretaceous]
stages: [Campanian]
lithology: interbedded mudstone and sandstone in about equal proportions
references:
  - id: lund2016a
    notes: >
      Calls it the "Upper Cretaceous (middle-late Campanian) Wahweap
      Formation" in the abstract and the "late Campanian Wahweap Formation" in
      the introduction.
  - id: beveridge2022a
    notes: >
      Treats the formation "and its constituent biotic assemblages" as a
      Campanian reference section. Its title calls it "the Upper Cretaceous
      Wahweap Formation", and its age model places the formation boundaries at
      about 82.17 and 77.29 Ma, "coinciding with the first half of the
      Campanian Stage".
  - id: jinnah2008a
    notes: >
      Gives the first 40Ar-39Ar age for the formation, 80.1 ± 0.3 Ma on a
      bentonite about 40 m above its base, and places deposition between about
      80.6 and 76.1 Ma.
  - id: eaton1991a
    notes: >
      Source of the lithology.
