name: Woburn Sands
rank: formation
parent: Lower Greensand
period: [Early Cretaceous]
stages: [Aptian, Albian]
variants: [Potton Sands]
references:
  - id: casey1961a
    notes: >
      Places the unit in the Lower Greensand: north of Aylesbury "the Lower
      Greensand reappears in Bedfordshire, forming a thickness of 200 feet of
      predominantly yellow sands in the Woburn and Leighton Buzzard districts.
      These deposits are known as the Woburn or Potton Sands". Cites "An
      important Aptian flora" from them.
  - id: galton1981a
    notes: >
      Gives the Craterosaurus horizon as "the Woburn Sands (Neocomian, Lower
      Cretaceous) near Potton, Bedfordshire, England". Gale and colleagues
      (2020) resolve the Neocomian into "the Berriasian, Valanginian and
      Hauterivian".
  - id: galton1985d
    notes: >
      Places the Potton Nodule Bed inside this formation and says the fossils
      in it are not of its age. The Craterosaurus horizon is "old 'coprolite'
      workings for phosphatic nodules of the Potton Nodule Bed in upper part
      of Woburn Sands (Lower Cretaceous, probably reworked from beds of
      Neocomian age; Casey, 1961) from near Potton, Bedfordshire". The Potton
      Nodule Bed is a bed in the upper part of the formation, and a stage read
      from it dates the nodules' deposition and not the material they contain.
  - id: barron2012a
    notes: >
      Places it above the Kimmeridge Clay Formation in the
      Bedfordshire-Cambridgeshire succession.
  - id: seeley1874a
    notes: >
      Describes the Craterosaurus specimen as "found by Mr. Charlesworth in
      the Potton Sands, near Potton, in Bedfordshire", and equates the sands
      with this unit: "The bed of phosphatic nodules which there occurs in the
      brown sands, named by Conybeare and Fitton Woburn sands, is probably of
      the age of the Purbeck-Wealden formation, though there is also a
      possibility that it may be as new as the upper part of the Lower
      Greensand."
  - id: seeley1869b
    notes: >
      Catalogs material "From the Potton Sands", dinosaurs among it, and in
      its correlation table sets "Potton Sands and Wicken Beds" level with the
      Purbeck Series, below the Wealden and the Lower Greensand.
  - id: gale2020a
  - id: galton2009a
    notes: >
      Dates the deposit rather than its fossils: "~112 Ma (reworked into late
      Aptian-early Albian) for the Potton Sandstone of Bedfordshire", and a
      femur "came from the Phosphate bed, Potton Sandstone (reworked into late
      Aptian-early Albian, Rawson et al., 1978)". That is the Potton Nodule
      Bed in the upper part of the formation, so the formation may begin
      lower in the Aptian. The vertebrates in it are reworked from older
      beds and take their source age, not this one.
  - id: naish2007a
    notes: >
      "In Bedfordshire, the Aptian Potton Sands have yielded Iguanodon and the
      stegosaur Craterosaurus pottonensis".
beds:
  - name: Potton Nodule Bed
    period: [Early Cretaceous]
    stages: [Aptian, Albian]
    references:
      - id: galton1985d
        notes: >
          Names the bed and places it: the Craterosaurus holotype is "From old
          "coprolite" workings for phosphatic nodules of the Potton Nodule Bed
          in upper part of Woburn Sands (Lower Cretaceous, probably reworked
          from beds of Neocomian age; Casey, 1961) from near Potton,
          Bedfordshire".
      - id: galton2009a
        notes: >
          Calls it "the Phosphate bed, Potton Sandstone (reworked into late
          Aptian-early Albian, Rawson et al., 1978)", the age being that of the
          bed's deposition rather than of the reworked material in it.
