name: Woburn Sands
rank: formation
period: [Early Cretaceous]
references:
  - id: galton1981a
    notes: >
      Gives the Craterosaurus horizon as "the Woburn Sands (Neocomian, Lower
      Cretaceous) near Potton, Bedfordshire, England". The Neocomian is an
      informal grouping of stages rather than a stage.
  - id: barron2012a
    notes: >
      Places it above the Kimmeridge Clay Formation in the
      Bedfordshire-Cambridgeshire succession.
