name: Wallangulla Sandstone
rank: member
informal: true
parent: Griman Creek
period: [Early Cretaceous, Late Cretaceous]
stages: [Albian, Cenomanian]
description: "The Wallangulla Sandstone Member is an informal member of the Griman Creek Formation in northern New South Wales, Australia. In the vicinity of Lightning Ridge, it is the lower of the formation's two informal members and primarily consists of red fine grained sandstone, light siltstone and gray claystone and is up to 30 meters (98 ft) thick, while the overlying Coocoran Claystone consists of about 10 meters of claystone. Discontinuous clay lens beds within the Wallangulla Sandstone Member near Lightning Ridge, referred to as the Finch Clay Facies, are one of Australia's primary sources of commercial precious opal, with many mines dug in the area. These deposits are also the primary source of fossils within the formation, a large proportion of which are preserved as semi-precious opalized pseudomorphs. The fauna found in Lightning Ridge indicates that the depositional environment of the Finch Clay Facies was in near-coastal freshwater lagoons."
references:
  - id: agnolín2010a
    notes: >
      Gives the older reading and the parent, "Wallangulla Sandstone Member of
      the Griman Creek Formation (Albian: late Early Cretaceous)", at
      Lightning Ridge.
  - id: bell2018a
    notes: >
      Gives the younger reading and the wider frame, "Wallangulla Sandstone,
      GCF, Cenomanian, Rolling Downs Group of the Surat Basin", and the rank:
      the formation "is divided into two informal members, the Wallangulla
      Sandstone member and the overlying Coocoran Claystone member".
  - id: bell2019b
    notes: >
      Dates a volcanogenic claystone band in the member at Hard Hill, just above
      the highest fossil-bearing Finch Clay lens, by detrital zircon: the
      "preferred maximum depositional age range is early to mid-Cenomanian, with
      a range of 100.2–96.6 Ma", applied to the Lightning Ridge exposures and
      their fauna rather than to the whole formation. Records the member as one
      of two informal members of the Griman Creek Formation, after Moore (2002),
      below the Coocoran Claystone member across a sharp, unconformable contact.
  - id: moore2002a
