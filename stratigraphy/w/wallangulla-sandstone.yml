name: Wallangulla Sandstone
rank: member
informal: true
parent: Griman Creek
period: [Early Cretaceous]
stages: [Albian]
lithology: fine-grained clayey sandstone, with claystone lenses
references:
  - id: agnolín2010a
    notes: >
      Gives the older reading and the parent, "Wallangulla Sandstone Member of
      the Griman Creek Formation (Albian: late Early Cretaceous)", at
      Lightning Ridge.
  - id: bell2018a
    notes: >
      Gives the Lightning Ridge specimens as "Wallangulla Sandstone, GCF,
      Cenomanian", after the maximum depositional age of Bell and colleagues
      (2019), and the rank: the formation "is divided into two informal
      members, the Wallangulla Sandstone member and the overlying Coocoran
      Claystone member".
  - id: bell2019b
    notes: >
      Dates a volcanogenic claystone above the highest fossil-bearing claystone
      at Hard Hill, by detrital zircon, to an "early to mid-Cenomanian" maximum
      depositional age. Source of the lithology.
  - id: moore2002a
