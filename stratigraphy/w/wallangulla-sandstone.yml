name: Wallangulla Sandstone
rank: member
informal: true
parent: Griman Creek
period: [Early Cretaceous, Late Cretaceous]
stages: [Albian, Cenomanian]
references:
  - id: agnolín2010a
    notes: >
      Gives the older reading and the parent, "Wallangulla Sandstone Member of
      the Griman Creek Formation (Albian: late Early Cretaceous)", at
      Lightning Ridge.
  - id: bell2018a
    notes: >
      Gives the younger reading and the wider frame, "Wallangulla Sandstone,
      GCF, Cenomanian, Rolling Downs Group of the Surat Basin", and the rank:
      the formation "is divided into two informal members, the Wallangulla
      Sandstone member and the overlying Coocoran Claystone member".
  - id: bell2019b
    notes: >
      Dates a volcanogenic claystone band in the member at Hard Hill, just above
      the highest fossil-bearing Finch Clay lens, by detrital zircon: the
      "preferred maximum depositional age range is early to mid-Cenomanian, with
      a range of 100.2–96.6 Ma", applied to the Lightning Ridge exposures and
      their fauna rather than to the whole formation. Records the member as one
      of two informal members of the Griman Creek Formation, after Moore (2002),
      below the Coocoran Claystone member across a sharp, unconformable contact.
  - id: moore2002a
