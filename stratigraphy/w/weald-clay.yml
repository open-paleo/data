name: Weald Clay
rank: group
parent: Wealden
period: [Early Cretaceous]
stages: [Hauterivian, Barremian, Aptian]
description: "Weald Clay or the Weald Clay Formation is a Lower Cretaceous sedimentary rock unit underlying areas of South East England, between the North and South Downs, in an area called the Weald Basin. It is the uppermost unit of the Wealden Group of rocks within the Weald Basin, and the upper portion of the unit is equivalent in age to the exposed portion of the Wessex Formation on the Isle of Wight. It predominantly consists of thinly bedded mudstone. The un-weathered form is blue/gray, and the yellow/orange is the weathered form, it is used in brickmaking."
references:
  - id: norman2013a
    notes: >
      Uses group rank and gives the span, heading a section "Weald Clay
      Group, Barremian-Lower Aptian Stages", with an Upper Weald Clay
      Formation inside it.
  - id: barker2023a
    notes: >
      Names the constituent formation directly, the Baryonyx holotype coming
      from "the Barremian Upper Weald Clay Formation of Surrey".
  - id: raven2020a
    notes: >
      The Weald Clay Group is "Hauterivian–Barremian" in this paper, following
      Batten and Austen (2011): the Weald Sub-basin contains "the Weald Clay
      Group (Hauterivian–Barremian ... ), which contains the Upper and Lower
      Weald Clay formations". Horshamosaurus rudgwickensis comes from this group in
      West Sussex. Places the group, beside the Hastings Beds Group, in the
      Wealden Supergroup of the Weald Sub-basin.
  - id: harrison1973a
    notes: >
      Assigns the Weald Clay to the "Lower Cretaceous" and places the Wyleyia
      valdensis horizon at Henfield, Sussex, partway up it: ostracods
      "indicate that they lie about 500–600 feet below the top of the Weald
      Clay. This would establish the horizon as being in the middle of the
      Reeves Group II, in the Barremian Substage of the Neocomian Stage."
  - id: batten2011a
