name: Wangshi
rank: group
period: [Early Cretaceous, Late Cretaceous]
stages: [Coniacian, Santonian, Campanian, Maastrichtian]
dispute:
  summary: >
    Both the rank word and the internal order vary by source. Yu and
    colleagues (2018) write "the Upper Cretaceous Wangshi Group of
    Shandong"; Brusatte and colleagues (2013) write "Wangshi Series"; Dong
    (1978) writes "the Wangshi Formation of Laiyang". The internal order is
    contradictory too: Borinder and colleagues (2021) place the Hongtuya
    below the Jiangjunding, the Zhucheng literature puts the Hongtuya at the
    top of the group, and Zhang and colleagues (2019) leave it out of the
    Laiyang succession altogether. A single ordered column cannot be
    assembled without resolving that first: the Laiyang and Zhucheng basins
    may not share a scheme.
references:
  - id: yu2018a
    notes: Gives group rank and an Upper Cretaceous age for the Shandong beds.
  - id: brusatte2013a
    notes: >
      Calls it a series and dates it "Campanian-?Maastrichtian", citing
      Weishampel and colleagues (2004) and Zhao and colleagues (2008).
  - id: buffetaut1995a
    notes: >
      Relays two readings. After Sloan, as quoted by Dong (1992), "the Wangshi
      'Formation' may range in age from Coniacian to Maastrichtian"; after
      Chen (1983), "the upper part of the Wangshi Group may be correlated with
      the 'Belly River or Edmonton beds of North America', which means
      Campanian to Maastrichtian, while the lower part may be early Late
      Cretaceous in age".
  - id: xu2019a
    notes: >
      Places the lower part of the group in the Early Cretaceous: "The lower
      part of the Wangshi Group should be assigned to the upper Lower
      Cretaceous." It correlates the Malanggou and Tianjialou formations with
      the Linjiazhuang and Xingezhuang formations of the lower Wangshi Group.
  - id: weishampel2004b
  - id: dong1978b
  - id: borinder2021a
    notes: >
      Treats the unit at group rank and dates a formation within it: material
      comes from "Upper Cretaceous (upper Campanian-lower Maastrichtian)
      sediments in the Jiangjunding Formation, which is a subunit of the
      Wangshi Group". It also records a radiometric tie on the unit beneath,
      "A radiometric date of 72.9-73.5 Ma ... from the uppermost section of
      the underlying Hongtuya Formation".
  - id: zhang2019a
  - id: zhao2008a
    notes: >
      Uses formation rank and gives only the epoch, in a distribution line:
      Chingkankousaurus fragilis from "Laiyang, Shandong Wangshi Formation
      Late Cretaceous". The name appears once in the paper, so it is a
      listing rather than a treatment, and the rank follows the older usage
      this entry's other references record.
  - id: chen1983a
    notes: >
      "The Late Cretaceous Wangshi Group of E Shandong, composed of red beds,
      is well-known for its hadrosaurian fauna, which occurs in the upper part
      of this group", and on that fauna "the upper part of the Wangshi Group
      may correspond to the Belly River beds or Edmonton beds of Northern
      America". The lower part, on its ostracods, pelecypods, gastropods and
      conchostracans, "may be early Late Cretaceous in age".
  - id: dong1992a
  - id: rozhdestvensky1968a
    notes: >
      Coniacian to Santonian on hadrosaur evidence: Tanius is morphologically
      a later form than Bactrosaurus, so placing the unit in the Cenomanian
      below the Iren Dabasu Formation "is hardly proper", and "the most likely
      location of the Wangshih Formation is, as the layer with Jaxartosaurus,
      in the Coniacian–Santonian interval".
