name: Wadhurst Clay
rank: formation
parent: Hastings Beds
period: [Early Cretaceous]
stages: [Valanginian]
references:
  - id: norman2013a
    notes: >
      Heads its section "Hastings Group, Valanginian Stage" and treats the
      Wadhurst Clay Formation within it, with the large-bodied ornithopod
      material "distributed within the middle and upper-middle Valanginian".
  - id: galton2009a
    notes: >
      Places it in the succession, the Hastings Beds running "in descending
      order the Upper Tunbridge Wells Sands, Grinstead Clay, Lower Tunbridge
      Wells Sands, Wadhurst Clay, Ashdown Beds", and gives "~137 Ma (middle
      Valanginian) for the Wadhurst Clay of East Sussex".
  - id: norman2015a
    notes: >
      Gives the Hypselospinus fittoni horizon as "Lower Cretaceous, Hastings
      Group, Wadhurst Clay Formation", with the age "Valanginian: 139–137
      Mya".
  - id: drew1861a
    notes: >
      Coins the name, in the paragraph that also names the Ashdown Sands and
      the Grinstead Clay: the clay can be traced to the sands below and its
      position seen "in the cuttings at the ends of the Wadhurst Tunnel", so
      "I have on these accounts thought it well to take the name of Wadhurst
      Clay for the second stratum".
