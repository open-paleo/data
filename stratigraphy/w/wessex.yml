name: Wessex
rank: formation
parent: Wealden
period: [Early Cretaceous]
stages: [Berriasian, Valanginian, Hauterivian, Barremian]
variants: [Wealden Marls]
lithology: variegated mudstone with interbedded sandstone
references:
  - id: pond2023a
    notes: >
      "the Wessex Formation is considered Barremian", and describes its plant
      debris beds as lenses of organic-rich sediment "distributed apparently at
      random throughout the succession" — the horizons most Isle of Wight
      dinosaurs come from. Source of the lithology.
  - id: longrich2022a
    notes: >
      Independently gives "Wessex Formation (Lower Cretaceous, Barremian)",
      while its faunal table covers "the Early Cretaceous
      (Hauterivian-Barremian) Wessex Formation".
  - id: raven2020a
    notes: >
      Following Batten (2011), the Wealden Group of the Wessex Sub-basin
      "contains the Wessex (Valanginian-Barremian) and Vectis (Aptian)
      formations, although only Barremian-Aptian strata are exposed at the
      surface".
  - id: batten2011b
  - id: pittman2020c
    notes: >
      Gives the type of Ornithodesmus cluniculus, probably a dromaeosaurid, as
      from the "Berriasian-Barremian Wessex Formation"; its dromaeosaurid table
      dates the formation Barremian.
  - id: norman2012a
    notes: >
      The Iguanodon seelyi holotype from Brook Chine, Isle of Wight, comes
      from the "Wealden Group, Wessex Formation, (Late Barremian–Early
      Aptian)", while the Mantellisaurus atherfieldensis holotype from
      Atherfield Point is placed in the "Wealden Group, Wessex Formation
      (upper Barremian)". Kerth and Hailwood (1988) place the base of the
      Aptian within the overlying Vectis Formation.
  - id: robinson2004a
    notes: >
      On fossil-wood carbon isotopes finds the formation "largely
      Hauterivian–Barremian in age", with the Valanginian condensed at Worbarrow
      Bay.
  - id: kerth1988a
    notes: >
      Gives the Wessex Formation, "formerly the Wealden Marls", as the lower 170
      m of the Isle of Wight sections, and on magnetostratigraphy puts the base
      of the Aptian in the overlying Vectis.
  - id: hughes1990a
    notes: >
      On palynology, correlates the Coarse Quartz Grit of Worbarrow with "the
      Pine-raft of the Wealden Marls (Wessex Formation) of the western Isle of
      Wight", "close in time to the Hauterivian-Barremian boundary".
  - id: bgs2020a
    notes: >
      Gives the age range "Berriasian Age (KR) — Barremian Age (KB)", takes the
      base at the top of the Peveril Point Member, and names the type section at
      Bacon Hole and Mupe Bay, Dorset.
  - id: howse1993a
    notes: >
      Gives the Ornithodesmus cluniculus holotype as from the "Wealden Marls =
      Wessex Formation (Daley and Stewart 1979), Barremian, Lower Cretaceous",
      an age for the locality rather than the formation's range.
  - id: hughes1958a
    notes: >
      Cited by Kerth and Hailwood (1988) for a palynological Barremian age of
      the Wessex Formation on the coast.
  - id: daley1979a
    notes: >
      Cited by Howse and Milner (1993) for equating the Wealden Marls with the
      Wessex Formation.
beds:
  - name: Hypsilophodon Bed
    informal: true
    period: [Early Cretaceous]
    stages: [Barremian]
    references:
      - id: galton1974a
        notes: >
          Gives the age and why it is loose: "the absence of ostracods in the
          Marls and the lower part of the Shales makes it difficult to determine
          accurately the age of the Hypsilophodon Bed. It is probably Barremian
          ... but it might possibly be Early Aptian". Locates it "in the cliff at
          beach level about 100 yd west of Cowleaze Chine". The Early Aptian
          alternative is superseded: Galton (2009) dates the bed late Barremian,
          and Kerth and Hailwood (1988) place the base of the Aptian within the
          Vectis Formation above the Wessex.
      - id: galton2009a
        notes: >
          Places it "at top of Wessex Formation (=Wealden Marls)", and dates that
          upper part "~126 Ma (late Barremian)", its ages taken from the 2004 time scale ("dates from
          Ogg et al., 2005"). On the ICS chart v2024/12 that figure falls below
          the 125.77 Ma base of the Barremian, so the stage rests on the stated
          "late Barremian". Named after the taxon it yields, like the Carnosaur
          and Sauropod beds of the Lameta.
      - id: kerth1988a
        notes: >
          Places the base of the Aptian within the overlying Vectis Formation,
          which rules out the Early Aptian alternative for the bed.
  - name: L5
    informal: true
    period: [Early Cretaceous]
    references:
      - id: pond2023a
        notes: >
          Gives "Plant debris bed L5 (Gale ...), Wessex Formation, Wealden
          Group", and places the bed near the base of the exposed formation:
          "Plant debris bed L5 lies close to the base of the exposed Wessex
          Formation on the Island, which is thought to be earliest Barremian in
          age". The age is given for the base of the exposed formation, not for
          the bed. Cites the numbering to Gale in the horizon line and to
          Stewart later in the same paper, where Lockwood and colleagues credit
          Stewart throughout.
      - id: sweetman2010a
        notes: >
          Follows Stewart's (1978) bed numbers and figures "Bed L5 exposed
          north-east of Chilton Chine ... to show rapid transition from basal
          conglomerate to the overlying siltstone and gradual transition from this
          into the overlying mudstone facies", with "distinct laminations
          delineated by the concentration of fine carbonaceous material". A second
          exposure it figures, about 25 m away, is placed "north-west of Chilton
          Chine".
      - id: stewart1978a
  - name: L9
    informal: true
    period: [Early Cretaceous]
    references:
      - id: lockwood2021a
        notes: >
          Gives the bed the specimen came from, "a plant debris bed (L9 of
          Stewart ...) to the west of Grange Chine on the south coast of the
          Isle of Wight", and records that the specimen "was found associated
          with one of the UK's most complete theropods, Neovenator salerii". The
          "early Barremian" of its horizon line, "Wessex Formation, early
          Barremian, Lower Cretaceous", stands beside the formation, a sentence
          before the bed is named.
      - id: sweetman2010a
        notes: >
          Follows Stewart's (1978) bed numbers and gives L9 as one of the plant
          debris beds that "appear to be laterally continuous within the available
          outcrop (e.g. L9 north-west of Grange Chine)", and one in which sorting
          of vertebrate material by flowing water has been recorded.
      - id: stewart1978a
  - name: L11
    informal: true
    period: [Early Cretaceous]
    variants: [Black Band, Grange Chine Black Band]
    references:
      - id: naish2022a
        notes: >
          Places it in the scheme and in section: Stewart (1978) "assigned bed
          numbers to each of the plant debris beds within the Wessex Formation
          and E. lengi was recovered from L11, the plant debris bed above the
          Grange Chine Sandstone". The holotype came from "the L11 plant debris
          bed above the Grange Chine Sandstone of the Wessex Formation of the
          Wealden Supergroup", and the next sentence, "It dates to the
          Barremian", is said of the holotype, not the bed. The published name
          is "L11 plant debris bed", of which the bare numeral is a truncation.
      - id: lockwood2025a
        notes: >
          Gives the equation that makes Black Band a name for this bed rather than
          a separate one: MIWG 6643 came "from the 'Black Band' (bed L11 in
          Stewart ...), a plant debris bed cropping out c. 100 m east of Grange
          Chine, lying above the Grange Chine Sandstone in the Wessex Formation".
      - id: stewart1978a
      - id: sweetman2010a
        notes: >
          Names the bed in full in its account of the Wessex plant debris beds,
          "L11, the 'Grange Chine Black Band'", with "bed numbers for beds exposed
          on the south-west coast of the Isle of Wight follow Stewart (1978)" and
          the bed placed in section in its Fig. 3. The theropod Eotyrannus and the
          dryosaurid Valdosaurus were "found together in bed L11".
