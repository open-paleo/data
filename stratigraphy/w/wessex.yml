name: Wessex
rank: formation
parent: Wealden
period: [Early Cretaceous]
stages: [Berriasian, Valanginian, Hauterivian, Barremian]
variants: [Wealden Marls]
lithology: variegated mudstone with interbedded sandstone
references:
  - id: pond2023a
    notes: >
      "the Wessex Formation is considered Barremian", and describes its plant
      debris beds as lenses of organic-rich sediment "distributed apparently at
      random throughout the succession" — the horizons most Isle of Wight
      dinosaurs come from. Source of the lithology.
  - id: longrich2022a
    notes: >
      Independently gives "Wessex Formation (Lower Cretaceous, Barremian)",
      while its faunal table covers "the Early Cretaceous
      (Hauterivian-Barremian) Wessex Formation".
  - id: raven2020a
    notes: >
      Following Batten (2011), the Wealden Group of the Wessex Sub-basin
      "contains the Wessex (Valanginian-Barremian) and Vectis (Aptian)
      formations, although only Barremian-Aptian strata are exposed at the
      surface".
  - id: batten2011b
  - id: pittman2020c
    notes: >
      Gives the type of Ornithodesmus cluniculus, probably a dromaeosaurid, as
      from the "Berriasian-Barremian Wessex Formation"; its dromaeosaurid table
      dates the formation Barremian.
  - id: norman2012a
    notes: >
      The Iguanodon seelyi holotype from Brook Chine, Isle of Wight, comes
      from the "Wealden Group, Wessex Formation, (Late Barremian–Early
      Aptian)", while the Mantellisaurus atherfieldensis holotype from
      Atherfield Point is placed in the "Wealden Group, Wessex Formation
      (upper Barremian)". Kerth and Hailwood (1988) place the base of the
      Aptian within the overlying Vectis Formation.
  - id: robinson2004a
    notes: >
      On fossil-wood carbon isotopes finds the formation "largely
      Hauterivian–Barremian in age", with the Valanginian condensed at Worbarrow
      Bay.
  - id: kerth1988a
    notes: >
      Gives the Wessex Formation, "formerly the Wealden Marls", as the lower 170
      m of the Isle of Wight sections, and on magnetostratigraphy puts the base
      of the Aptian in the overlying Vectis.
  - id: hughes1990a
    notes: >
      On palynology, correlates the Coarse Quartz Grit of Worbarrow with "the
      Pine-raft of the Wealden Marls (Wessex Formation) of the western Isle of
      Wight", "close in time to the Hauterivian-Barremian boundary".
  - id: bgs2020a
    notes: >
      Gives the age range "Berriasian Age (KR) — Barremian Age (KB)", takes the
      base at the top of the Peveril Point Member, and names the type section at
      Bacon Hole and Mupe Bay, Dorset.
  - id: howse1993a
    notes: >
      Gives the Ornithodesmus cluniculus holotype as from the "Wealden Marls =
      Wessex Formation (Daley and Stewart 1979), Barremian, Lower Cretaceous",
      an age for the locality rather than the formation's range.
  - id: hughes1958a
    notes: >
      Dates "the exposed Wealden of the Isle of Wight" as "all Barremian or
      later in age" by spores and pollen, from the lowest sample, near Brook
      Point in the Wealden Marls.
  - id: daley1979a
    notes: >
      Cited by Howse and Milner (1993) for equating the Wealden Marls with the
      Wessex Formation.
beds:
  - name: Hypsilophodon Bed
    informal: true
    period: [Early Cretaceous]
    stages: [Barremian]
    references:
      - id: galton1974a
        notes: >
          Dates the bed "probably Barremian" and traces its exposure from beach
          level about 100 yd west of Cowleaze Chine, rising in the cliff to end
          just beyond Barnes High.
      - id: galton2009a
        notes: >
          Places the bed "at top of Wessex Formation (=Wealden Marls)" and dates
          that upper part of the formation late Barremian.
      - id: kerth1988a
        notes: >
          Places the base of the Aptian within the overlying Vectis Formation,
          which rules out the Early Aptian alternative for the bed.
  - name: L5
    informal: true
    period: [Early Cretaceous]
    references:
      - id: pond2023a
        notes: >
          Gives the Vectipelta barretti holotype as from plant debris bed L5,
          which it places close to the base of the exposed Wessex Formation on
          the Isle of Wight.
      - id: sweetman2010a
        notes: >
          Follows Stewart's (1978) bed numbers and figures L5 near Chilton
          Chine, passing up from a basal conglomerate through siltstone into
          mudstone, with laminations of fine carbonaceous material.
      - id: stewart1978a
  - name: L9
    informal: true
    period: [Early Cretaceous]
    references:
      - id: lockwood2021a
        notes: >
          Gives the Brighstoneus holotype as from "a plant debris bed (L9 of
          Stewart ...)" west of Grange Chine, where it lay with a skeleton of
          Neovenator salerii.
      - id: sweetman2010a
        notes: >
          Follows Stewart's (1978) bed numbers and gives L9, north-west of
          Grange Chine, as a plant debris bed that appears laterally continuous
          within the outcrop.
      - id: stewart1978a
  - name: L11
    informal: true
    period: [Early Cretaceous]
    variants: [Black Band, Grange Chine Black Band]
    references:
      - id: naish2022a
        notes: >
          Gives the Eotyrannus lengi holotype as from "the L11 plant debris bed
          above the Grange Chine Sandstone", in the bed numbering of Stewart
          (1978).
      - id: lockwood2025a
        notes: >
          Gives the equation that makes Black Band a name for this bed rather than
          a separate one: MIWG 6643 came "from the 'Black Band' (bed L11 in
          Stewart ...), a plant debris bed cropping out c. 100 m east of Grange
          Chine, lying above the Grange Chine Sandstone in the Wessex Formation".
      - id: stewart1978a
      - id: sweetman2010a
        notes: >
          Names the bed in full in its account of the Wessex plant debris beds,
          "L11, the 'Grange Chine Black Band'", with "bed numbers for beds exposed
          on the south-west coast of the Isle of Wight follow Stewart (1978)" and
          the bed placed in section in its Fig. 3. The theropod Eotyrannus and the
          dryosaurid Valdosaurus were "found together in bed L11".
