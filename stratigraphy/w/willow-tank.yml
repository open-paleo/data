name: Willow Tank
rank: formation
period: [Late Cretaceous]
stages: [Cenomanian]
description: "The Willow Tank Formation is a geologic formation which outcrops in the U.S. state of Nevada. Initially believed to be of Early Cretaceous (Albian) age, later studies have concluded that it was more likely to be of Late Cretaceous (Cenomanian) age, making it equivalent to the Wayan Formation and the Mussentuchit Member of the Cedar Mountain Formation. It was deposited in an anastomosed fluvial system."
references:
  - id: bonde2022a
    notes: >
      Describes Nevadadromeus from "the Upper Cretaceous (Cenomanian) Willow
      Tank Formation of Southern Nevada", and makes it one of only three
      formations preserving its fauna.
  - id: avrahami2024a
    notes: >
      Cites the same unit and age for that taxon.
