name: Wangjiashan
rank: formation
period: [Middle Jurassic]
stages: [Bathonian]
references:
  - id: ning2024a
    notes: >
      Describes Baiyinosaurus from "the Middle Jurassic Wangjiashan Formation
      of the Pingchuan District, Baiyin City, Gansu Province, China", and
      makes it one of the two Middle Jurassic lithostratigraphic units of the
      area with the Longfengshan Formation, above a disconformity with Upper
      Triassic rocks. The material is "from the upper part of the Straw-yellow
      Sandstone Member of the Wangjiashan Formation, whose age is considered
      to be Middle Jurassic, late Bathonian", a date based on the member's
      plants and palynoflora and the invertebrates of the overlying Oil Shale
      Member.
  - id: li1982a
    notes: >
      Gives the formation as "first named by the No. 133 Coalfield Exploration
      Team (1976), with its type locality at Shuidonggou", and divides it into
      a lower Straw-yellow Sandstone Member and an upper Oil Shale Member,
      above the Longfengshan Formation; Middle Jurassic.
  - id: zhang2009b
    notes: >
      Credits the name to "Li Baoxian, Xu Fuxiang, Ma Qihong, et al., 1982 ...
      First appeared in a 1976 manuscript by Gansu Coal Field Geological
      Exploration Team", with its type locality at "Wangjiashan close to
      Shuidonggou, northern part of Jingyuan County, Gansu Province"; "Age:
      Mid Jurassic."
