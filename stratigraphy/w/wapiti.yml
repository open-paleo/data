name: Wapiti
rank: formation
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
references:
  - id: bell2015a
    notes: >
      Gives "the upper Campanian Wapiti Formation, west-central Alberta".
  - id: currie2008a
    notes: >
      Calls it "the Campanian–Maastrichtian Wapiti Formation", from which only
      scrappy bones were known before the Pipestone Creek bone bed, and dates
      that bone bed Late Campanian.
  - id: fanti2009a
    notes: >
      The formation's stratigraphy: unit 1 is "lower–middle Campanian", and
      the Cutbank Coal Zone at the top includes "several Maastrichtian taxa"
      from earlier palynological work.
