name: Wapiti
rank: formation
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
description: "The Wapiti Formation is a geological formation of the Western Canada Sedimentary Basin in northwestern Alberta, and northeastern British Columbia, Canada. Its deposition spanned the time interval from the upper Campanian through to the lower Maastrichtian, between approximately 80 and 68 Ma. It was presumably named for exposures along the lower part of the Wapiti River and downstream along the Smoky River in Alberta. Dinosaur remains are among the fossils that have been recovered from the Cretaceous portion of the formation. The Wapiti Formation does not produce many fossils due to its limited surface exposure and accessibility, although two Pachyrhinosaurus bone beds have been productive."
references:
  - id: bell2015a
    notes: >
      Gives "the upper Campanian Wapiti Formation, west-central Alberta".
  - id: currie2008a
    notes: >
      Carries the younger bound, "the Campanian-Maastrichtian Wapiti
      Formation", and records that before the Pipestone Creek bone bed "only a
      waterworn hadrosaur pedal phalanx and fragmentary bones had been
      reported" from it. It dates the bone bed itself to the "Late Cretaceous,
      Late Campanian", with palynology from along the Wapiti River "consistent
      with a Late Campanian age for this section of the Wapiti Formation".
