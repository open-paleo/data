name: Wapiti
rank: formation
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
references:
  - id: bell2015a
    notes: >
      Gives "the upper Campanian Wapiti Formation, west-central Alberta".
  - id: currie2008a
    notes: >
      Carries the younger bound, "the Campanian-Maastrichtian Wapiti
      Formation", and records that before the Pipestone Creek bone bed "only a
      waterworn hadrosaur pedal phalanx and fragmentary bones had been
      reported" from it. It dates the bone bed itself to the "Late Cretaceous,
      Late Campanian", with palynology from along the Wapiti River "consistent
      with a Late Campanian age for this section of the Wapiti Formation".
