name: Menefee
rank: formation
period: [Late Cretaceous]
stages: [Santonian, Campanian]
lithology: mudstone, siltstone, sandstone and coal
references:
  - id: dalman2021a
    notes: >
      Gives "Menefee Formation (Upper Cretaceous, early Campanian)". Describes
      its rock: "The Cleary Coal Member is 31–61 m thick and consists of
      mudstone, siltstone, sandstone and coal beds.... The Allison Member is
      122–183 m thick and consists of mudstone, sandstone and siltstone beds...
      The unnamed upper coal member is as much as 160 m thick and is
      lithologically similar to the Cleary Coal Member."
  - id: sullivan1999b
    notes: >
      Independently gives "Menefee Formation (early Campanian)", and reasons
      that a holotype from the formation "would indicate a Santonian-early
      Campanian age for this specimen".
