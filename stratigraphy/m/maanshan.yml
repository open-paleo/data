name: Maanshan
rank: member
parent: Ziliujing
period: [Early Jurassic]
stages: [Pliensbachian, Toarcian]
references:
  - id: mcphee2016a
    notes: >
      Gives the Sanpasaurus horizon as "the Maanshan Member of the Ziliujing
      Formation, Weiyuan region, Sichuan Province", records the alternate
      rendering Ma'anshan, and places it "directly above the Dongyuemiao
      Member". Bounds rather than dates it: if the Dongyuemiao is Toarcian,
      "then the age of the Maanshan Member is no older than the late Early
      Jurassic".
  - id: dong1983a
    notes: >
      Gives the cetiosaurine sauropod material from Zizhong and Weiyuan
      counties as from the "Early Jurassic Maanshan Mem., Ziliujing Fm.", but
      holds that age as a correlation: the member's age "is provisionally
      regarded as Early Jurassic pending future confirmation", on the strength
      of its fauna and of Lepidotes in the overlying Daanzhai Member.
  - id: yao2025a
    notes: >
      Gives the order of the Ziliujing's members, "arranged in ascending
      order: Dongyuemiao Member, Ma'anshan Member, and Da'anzhai Member", and
      dates the two either side of this one: the Dongyuemiao "late Sinemurian
      to early Pliensbachian", the Da'anzhai "solidly dated to the Toarcian
      stage".
