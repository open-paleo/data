name: Magnesian Conglomerate
rank: formation
period: [Late Triassic]
stages: [Norian, Rhaetian]
references:
  - id: owen1842a
    notes: >
      Thecodontosaurus comes from "the dolomitic conglomerate at Redland near
      Bristol, a formation considered to belong to the oldest or lowest
      division of the new red sandstone series", with Palaeosaurus platyodon
      and P. cylindrodon from the same rock. Its reptiles rank among the
      oldest known: "The Monitors of the Thuringian Zechstein are older than
      the Labyrinthodonts of the Keuper; and among British Reptiles, the
      thecodont Lizards of the Magnesian conglomerate have equal claims to a
      more ancient origin." Both names serve for the one unit, "dolomitic
      conglomerate" in the description and "Magnesian conglomerate" in the
      discussion.
  - id: galton2007a
    notes: >
      The Durdham Down bone bed is not in this unit: the Clifton deposit was
      "long equated with the Magnesian Conglomerate, which occurs very close
      by", but on the recent literature summarized by Benton and colleagues
      (2000) it is "a Triassic (Rhaetian) dolomitized cave breccia or fissure
      fill (not in Magnesian/Dolomitic Conglomerate ... ) in Lower
      Carboniferous (Dinantian) marine limestone". That old equation carried
      an age with it, the rock having been "originally thought to represent
      the 'lower division of the New Red Sandstone' (so Permian ... )", which
      Etheridge (1870) replaced with a Muschelkalk or Lower Keuper
      correlation. Sanders (1862) "showed two outliers of the Magnesian
      Conglomerate (as N.R.S., for New Red Sandstone) in the northern part of
      Clifton", matching the two quarries mapped by Lavars in 1875.
  - id: galton1990a
    notes: >
      Gives the Thecodontosaurus occurrence as "Magnesian Conglomerate, Avon,
      England; Fissure Fillings, South Glamorgan, Wales" at "?Norian-Rhaetian",
      on more than 100 disarticulated elements.
  - id: peyredefabrègues2015a
    notes: >
      Uses formation rank and fixes the locality, "Magnesian Conglomerate
      Formation" at the "Quarry of Durdham Down, Clifton, Bristol England",
      Late Triassic, Norian to Rhaetian.
