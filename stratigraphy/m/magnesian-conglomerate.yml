name: Magnesian Conglomerate
rank: formation
period: [Late Triassic]
references:
  - id: owen1842a
    notes: >
      Gives Thecodontosaurus and two Palaeosaurus teeth from "the dolomitic
      conglomerate at Redland near Bristol", in the oldest division of the New
      Red Sandstone; also calls it "Magnesian conglomerate".
  - id: galton2007a
    notes: >
      Places the Durdham Down bone bed outside the unit, as a Rhaetian fissure
      fill in Carboniferous limestone "long equated with the Magnesian
      Conglomerate, which occurs very close by".
  - id: galton1990a
    notes: >
      Gives the Thecodontosaurus occurrence as "Magnesian Conglomerate, Avon,
      England; Fissure Fillings, South Glamorgan, Wales" at "?Norian-Rhaetian",
      on more than 100 disarticulated elements; the age is that of the
      Durdham Down fissure fill, which is not in this unit.
  - id: peyredefabrègues2015a
    notes: >
      Uses formation rank for the Thecodontosaurus locality, "Magnesian
      Conglomerate Formation" at the "Quarry of Durdham Down, Clifton, Bristol
      England", Late Triassic, Norian to Rhaetian; the Durdham Down bone bed
      is a fissure fill, not this unit.
  - id: benton2000b
  - id: etheridge1870a
  - id: sanders1862a
  - id: foffa2014a
    notes: >
      Dates the unit by epoch from the geological survey's map: "The
      Dolomitic conglomerate, Mercia Mudstone Group and Penarth Group are
      Late Triassic."

