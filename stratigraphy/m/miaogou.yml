name: Miaogou
rank: formation
period: [Early Cretaceous]
stages: [Barremian, Aptian, Albian]
references:
  - id: hao2025a
    notes: >
      Gives "Miaogou Formation (Aptian-Albian" and "the Lower Cretaceous
      Miaogou Formation", noting that the Maortu deposits "are consistently
      assigned to the upper Lower Cretaceous" and "further to the
      Barremian-Albian age proposed by" Van Itterbeeck and colleagues (2001).
      It also records what the formation absorbed: fossils from the Maortu
      locality in Chilantai "were mistakenly claimed to belong to" the
      Wulanhushao (Suhongtu), Dashuigou and Ulansuhai formations, but the unit
      "actually belongs to the Miaogou Formation, which incorporated the
      formerly abandoned Dashuigou Formation and Wulanhushao Formation". Those
      are reassignments and absorptions rather than alternate names for the
      Miaogou Formation.
  - id: vanitterbeeck2001a
    notes: >
      The source of the Barremian-Albian, argued from charophytes rather than
      relayed: "Based on the charophytan evidence, the continental strata in
      the Dashuiguo area are considered to be Barremian-Albian in age." The
      unit is never named here - the paper dates the Dashuiguo area, and
      reaches this formation only through Hao and colleagues' statement that
      the Miaogou incorporated the formerly abandoned Dashuigou Formation.
      Note the two sources spell that name differently, Dashuiguo here
      against Dashuigou there. Two further constraints the relay does not
      carry. The dinosaur-bearing locality is dated separately and more
      narrowly: at "the Moartu locality, situated in the vicinity of the
      studied area", Probactrosaurus gobiensis and P. alashanicus gave "an
      Aptian-Albian age ... based on the phylogenetic position of the
      described dinosaurs". And the correlated formations "belong to the
      Khukhetian 'Age' which according to Jerzykiewicz & Russell (1991) ends
      before the Late Albian, at about 100 Ma", which caps the young end.
