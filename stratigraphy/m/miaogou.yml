name: Miaogou
rank: formation
period: [Early Cretaceous]
stages: [Barremian, Aptian, Albian]
lithology: dark brownish-red muddy sandstone, with purplish-red conglomerate
  interbeds
references:
  - id: hao2024a
    notes: >
      Gives "Miaogou Formation (Aptian-Albian)", and says the formation
      incorporated the formerly abandoned Dashuigou and Wulanhushao Formations,
      to which the Maortu fossils had been assigned.
  - id: vanitterbeeck2001a
    notes: >
      Dates the continental strata of the Dashuiguo area as Barremian–Albian on
      charophytes, and relays an Aptian–Albian age for the nearby Moartu
      dinosaur locality from Rozhdestvensky (1966) and Norman and Weishampel
      (1990).
  - id: jerzykiewicz1991a
    notes: >
      Cited by Van Itterbeeck and colleagues (2001) for the Khukhetian age
      ending before the late Albian.
  - id: zhang2009b
    notes: >
      Source of the lithology.
  - id: rozhdestvensky1966a
    notes: >
      Cited by Van Itterbeeck and colleagues (2001) for an Aptian–Albian age of
      the Moartu strata, from the phylogenetic position of their iguanodonts.
  - id: norman1990a
    notes: >
      Cited by Van Itterbeeck and colleagues (2001) beside Rozhdestvensky
      (1966) for the same Aptian–Albian age.
