name: Maleri
rank: formation
period: [Late Triassic]
stages: [Carnian, Norian, Rhaetian]
references:
  - id: ezcurra2025a
    notes: >
      Treats the Lower and Upper Maleri as separate dinosaur-bearing
      formations of the Pranhita-Godavari Basin, dated "the Lower Maleri
      (middle-late Carnian), Upper Maleri (early Norian)". Places Maleriraptor
      in the Upper Maleri, "early Norian, Late Triassic", and elsewhere gives
      that upper unit's dinosaur assemblage as "early-middle Norian".
  - id: novas2010a
    notes: >
      Treats the unit as two formations: the Lower Maleri Formation,
      correlated with the Hyperodapedon Assemblage Zone, "is thus interpreted
      as Ischigualastian in age (i.e. late Carnian-early Norian)" after Langer
      (2005), while the overlying Upper Maleri Formation, for which earlier
      authors had advocated a Norian or early Norian age, is given as "?late
      Norian-earliest Rhaetian, Late Triassic".
  - id: cox1965a
    notes: >
      Rhynchosaurs occur in "the mid-Norian Maleri beds of India", which the
      paper raises as a possible relict occurrence, "the group persisting in
      an Indian continent which appears at that time to have been still in a
      more southerly and perhaps isolated position than it is today".
