name: Manuka
rank: subgroup
parent: Rolling Downs
period: [Early Cretaceous, Late Cretaceous]
stages: [Albian, Cenomanian, Turonian]
references:
  - id: gray2002a
    notes: >
      Places the Mackunda and Winton formations in the subgroup, within the
      Rolling Downs Group, and dates both on spore-pollen assemblages as late
      Albian to Cenomanian.
  - id: tucker2013a
    notes: >
      Dates the Winton Formation from detrital zircons, its base no earlier than
      latest Albian and its upper part "into or past the early Turonian".
  - id: bartholomai1981a
    notes: >
      Names the subgroup by way of the Mackunda Formation inside it, in
      Queensland, following Vine and colleagues.
  - id: vine1967a
    notes: >
      Erects the subgroup for the Mackunda and Winton formations, named for
      Manuka Station, 55 miles NNE of Winton, within the Rolling Downs Group.
      Gives no age for the subgroup.
  - id: whitehouse1955a
    notes: >
      Cited by Gray and colleagues (2002) as the author of the Rolling Downs
      Group that holds the subgroup.
