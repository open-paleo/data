name: Manuka
rank: subgroup
period: [Early Cretaceous, Late Cretaceous]
stages: [Albian, Cenomanian, Turonian]
references:
  - id: gray2002a
    notes: >
      Composes the subgroup and places it in the group above: the Mackunda and
      Winton formations "were made part of the newly-proposed Manuka Subgroup
      (Vine & others, 1967)", and "The Wilgunyah and Manuka Subgroups
      constitute the Rolling Downs Group of Whitehouse (1955)". Dates both
      members on spores and pollen: "The Mackunda Formation embraces
      mid-Cretaceous (late Albian–early Cenomanian) spore-pollen assemblages",
      and "Mid-Cretaceous [late Albian(?)–Cenomanian] palynofloras of the
      Winton Formation encompass spore-pollen assemblages attributable to
      palynological units APK6 and APK7".
  - id: tucker2013a
    notes: >
      Records the same composition, that Gray and colleagues (2002) "grouped
      the Winton together with the Mackunda Formation to form the Manuka
      Subgroup". From detrital zircons, "sedimentation of the Winton
      Formation commenced no earlier than latest Albian (~103.0–100.5 Ma)",
      and "the upper Winton Formation very likely continued into or past the
      early Turonian". The Turonian rests partly on maximum depositional ages,
      some from single grains that the paper says "may be erroneous".
  - id: bartholomai1981a
    notes: >
      Names the subgroup by way of the Mackunda Formation inside it, in
      Queensland, following Vine and colleagues.
  - id: vine1967a
    notes: >
      Erects the unit: "The overlying Mackunda and Winton Formations are
      characterized by the presence of beds of labile sandstone, deposition of
      which resulted from a major influx of volcanic detritus. For this
      sequence we propose the term Manuka Sub-group. The name is derived from
      Manuka Station, 55 miles NNE of Winton". "Together the Wilgunya and
      Manuka Sub-groups comprise the Rolling Downs Group of Whitehouse
      (1954)." Gives no age for the subgroup.
