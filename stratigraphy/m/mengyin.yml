name: Mengyin
rank: formation
period: [Late Jurassic, Early Cretaceous]
stages: [Tithonian, Berriasian, Valanginian, Hauterivian, Barremian, Aptian]
references:
  - id: mannion2019a
    notes: >
      Records the redating: the formation "(which yielded the clade specifier
      Euhelopus) is now thought to be earliest Cretaceous
      (Berriasian-Valanginian) in age".
  - id: mannion2026a
    notes: >
      Independently gives "the Berriasian" to "Valanginian Mengyin Formation
      of eastern China".
  - id: xu2015b
    notes: >
      Treats it as the "lowermost Cretaceous Mengyin Formation": its
      biostratigraphic age was once disputed among Late Jurassic, Late
      Jurassic–Early Cretaceous, and Early Cretaceous, but it "is currently
      regarded to be deposited during the Early Cretaceous". Its youngest
      detrital zircons (145 ± 4 Ma) and the maximum zircon age of the
      overlying Qingshan Formation volcanics (135.6 ± 3.9 Ma) constrain
      deposition to "145–136 Ma".
  - id: wilson2009a
    notes: >
      Reviews the formation's age: first considered "Early Cretaceous
      (?Neocomian)" by Wiman (1929), then given "a Late Jurassic age (early
      Tithonian)" that most authors accepted, while Barrett and Wang (2007)
      inferred "a possible Aptian age". Citing "a growing consensus that the
      Mengyin Formation is Early Cretaceous, rather than Late Jurassic", the
      paper ascribes a Barremian–Aptian range to Euhelopus zdanskyi.
  - id: wiman1929a
    notes: >
      Names the unit in a form the registry's headword cannot match -
      "Meng-Yin-Series", hyphenated and at series rank - and gives only an
      epoch, at second hand and hedged: "Following T'an, the dinosaurs come
      from three different formations: 1. The Meng-Yin-Series is from the
      Lower Cretaceous", after noting that "T'an made only a very cautious
      estimate of age determinations". This is the earliest reading the
      entry's later references review and set aside.
  - id: barrett2007b
  - id: tong2021a
    notes: >
      Once considered Late Jurassic by some authors, among them Dong (1992),
      the formation "has been recently dated using detrital zircons as 145–136
      Ma, corresponding to the Berriasian–lower Valanginian", after Xu and Li
      (2015); the turtle occurrences are tabulated as "Early Cretaceous
      (Berriasian–Valanginian)". Its Sinemys–Ordosemys turtle assemblage is
      treated as typical of the basal Cretaceous formations, and the
      Luohandong Formation of the Ordos Basin is correlated with it on
      vertebrate evidence.
  - id: dong1992a
  - id: moore2020a
    notes: >
      A stratigraphic series of non-conflicting detrital zircon ages from the
      Luxi Basin, after Xu and Li (2015), narrows the formation's
      long-uncertain age: "These data indicate that the Mengyin Formation is
      144–130.7Ma ... constraining the age of Euhelopus to the
      Berriasian–Hauterivian". Before that, the unit "has historically been
      considered Late Jurassic (early Tithonian) to Early Cretaceous in age",
      as late as the Aptian.
  - id: upchurch2015a
    notes: >
      Tabulates Euhelopus from the "Mengyin Formation (Barremian-Aptian),
      China" in its summary of putative Early Cretaceous non-titanosauriform
      macronarians and other broad-toothed sauropods, compiled "according to
      previous studies".
