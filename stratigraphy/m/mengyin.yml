name: Mengyin
rank: formation
period: [Early Cretaceous]
stages: [Berriasian, Valanginian]
references:
  - id: mannion2019a
    notes: >
      Records the redating: the formation "(which yielded the clade
      specifier Euhelopus) is now thought to be earliest Cretaceous
      (Berriasian–Valanginian) in age".
  - id: mannion2026a
    notes: >
      Independently gives "the Berriasian" to "Valanginian Mengyin Formation
      of eastern China".
  - id: xu2015b
    notes: >
      Treats it as the "lowermost Cretaceous Mengyin Formation": its
      biostratigraphic age was once disputed among Late Jurassic, Late
      Jurassic–Early Cretaceous, and Early Cretaceous, but it "is
      currently regarded to be deposited during the Early Cretaceous". Its
      youngest detrital zircons (145 ± 4 Ma) and the maximum zircon age of
      the overlying Qingshan Formation volcanics (135.6 ± 3.9 Ma)
      constrain deposition to "145–136 Ma". On the ICS chart v2024/12 the
      145 ± 4 Ma detrital zircons are a floor whose central value falls
      just before the Berriasian base of 143.1 Ma, and the 135.6 ± 3.9 Ma
      volcanic age above is Valanginian, so the bracket runs from the
      Berriasian to the Valanginian.
  - id: wilson2009a
    notes: >
      Reviews the formation's age: first considered "Early Cretaceous
      (?Neocomian)" by Wiman (1929), then given "a Late Jurassic age (early
      Tithonian)" that most authors accepted, while Barrett and Wang (2007)
      inferred "a possible Aptian age". Citing "a growing consensus that the
      Mengyin Formation is Early Cretaceous, rather than Late Jurassic", the
      paper ascribes a Barremian–Aptian range to Euhelopus zdanskyi.
  - id: wiman1929a
    notes: >
      Names the unit "Meng-Yin-Series", hyphenated and at series rank, and
      gives only an epoch, at second hand and hedged: "Following T'an, the
      dinosaurs come from three different formations: 1. The Meng-Yin-Series
      is from the Lower Cretaceous", after noting that "T'an made only a very
      cautious estimate of age determinations". Wilson and Upchurch (2009)
      review it as the first of the formation's readings.
  - id: barrett2007b
  - id: tong2021a
    notes: >
      Once considered Late Jurassic by some authors, among them Dong (1992),
      the formation "has been recently dated using detrital zircons as 145–136
      Ma, corresponding to the Berriasian–lower Valanginian", after Xu and Li
      (2015); the turtle occurrences are tabulated as "Early Cretaceous
      (Berriasian–Valanginian)". Its Sinemys–Ordosemys turtle assemblage is
      treated as typical of the basal Cretaceous formations, and the
      Luohandong Formation of the Ordos Basin is correlated with it on
      vertebrate evidence.
  - id: dong1992a
  - id: moore2020a
    notes: >
      A stratigraphic series of non-conflicting detrital zircon ages from
      the Luxi Basin, after Xu and Li (2015), narrows the formation's
      long-uncertain age: "These data indicate that the Mengyin Formation
      is 144–130.7Ma ... constraining the age of Euhelopus to the
      Berriasian–Hauterivian". Before that, the unit "has historically
      been considered Late Jurassic (early Tithonian) to Early Cretaceous
      in age", as late as the Aptian. Xu and Li (2015) give the bracket as
      145–136 Ma, so the 130.7 Ma end and the Hauterivian do not come from
      that source.
  - id: upchurch2015a
    notes: >
      Tabulates Euhelopus from the "Mengyin Formation (Barremian-Aptian),
      China" in its summary of putative Early Cretaceous non-titanosauriform
      macronarians and other broad-toothed sauropods, compiled "according to
      previous studies".
  - id: zhu2010a
    notes: >
      Places the formation beneath the volcanics: "the Mengyin Formation,
      which is overlain by volcanic rocks of the Qingshan Formation with
      LA-ICPMS zircon ages of 136–116 Ma". The oldest of those eruption
      ages, 135.6 ± 3.9 Ma, is Valanginian on the ICS chart v2024/12 and
      caps the formation; only the edge of its uncertainty reaches the
      Hauterivian.
