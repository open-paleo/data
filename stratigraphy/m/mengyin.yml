name: Mengyin
rank: formation
period: [Early Cretaceous]
stages: [Berriasian, Valanginian]
lithology: gray-green and purple-red sandstone, siltstone, mudstone and shale
references:
  - id: mannion2019a
    notes: >
      Records the redating: the formation "(which yielded the clade
      specifier Euhelopus) is now thought to be earliest Cretaceous
      (Berriasian–Valanginian) in age".
  - id: mannion2026a
    notes: >
      Independently gives "the Berriasian" to "Valanginian Mengyin Formation
      of eastern China".
  - id: xu2015b
    notes: >
      Brackets deposition at "145–136 Ma", between the formation's youngest
      detrital zircons and the oldest dated volcanics of the overlying Qingshan
      Formation, and calls the unit lowermost Cretaceous.
  - id: wilson2009a
    notes: >
      Reviews the earlier datings, from Lower Cretaceous to early Tithonian, and
      on "a growing consensus" for an Early Cretaceous age gives Euhelopus a
      Barremian–Aptian range.
  - id: wiman1929a
    notes: >
      Gives the unit as the "Meng-Yin-Series" and places it in the Lower
      Cretaceous, relaying an earlier survey's cautious estimate.
  - id: barrett2007b
  - id: tong2021a
    notes: >
      Dates the formation "Berriasian–lower Valanginian" after Xu and Li (2015),
      and correlates the Luohandong Formation with it on their shared
      Sinemys–Ordosemys turtle assemblage.
  - id: dong1992a
  - id: moore2020a
    notes: >
      Gives the formation as "144–130.7Ma", crediting Xu and Li (2015), and so
      places Euhelopus in the Berriasian–Hauterivian.
  - id: upchurch2015a
    notes: >
      Tabulates Euhelopus from the "Mengyin Formation (Barremian-Aptian),
      China" in its summary of putative Early Cretaceous non-titanosauriform
      macronarians and other broad-toothed sauropods, compiled "according to
      previous studies".
  - id: zhu2010a
    notes: >
      Places the formation beneath the volcanics: "the Mengyin Formation,
      which is overlain by volcanic rocks of the Qingshan Formation with
      LA-ICPMS zircon ages of 136–116 Ma". The oldest of those eruption
      ages, 135.6 ± 3.9 Ma, is Valanginian on the ICS chart v2024/12 and
      caps the formation; only the edge of its uncertainty reaches the
      Hauterivian.
  - id: lucas2001b
    notes: >
      Source of the lithology.
