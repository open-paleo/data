name: Maevarano
rank: formation
period: [Late Cretaceous]
stages: [Maastrichtian]
references:
  - id: rogers2000a
    notes: >
      Concludes that "the most fossiliferous portions of the Maevarano
      Formation are Maastrichtian in age, rather than Campanian as previously
      reported".
  - id: tykoski2004a
    notes: >
      Tabulates the formation as Campanian for Majunga, Madagascar, in a
      reference-work table that Rogers and colleagues (2000) supersede.
  - id: pittman2020a
    notes: >
      Tabulates the formation as Late Cretaceous, Maastrichtian, and gives
      Rahonavis ostromi as from "the Maastrichtian Maevarano Formation" of the
      Mahajanga Basin, Madagascar.
  - id: krause2007a
    notes: >
      Restricts it to the Maastrichtian: "Though previously regarded as
      ranging in age from Turonian to Campanian, there is no litho-, bio-, or
      magnetostratigraphic evidence to suggest anything other than a
      Maastrichtian age for the Maevarano Formation", following Rogers and
      colleagues in the same volume. The vast majority of the specimens
      collected by the Mahajanga Basin Project came from the "10- to 15-m
      thick Anembalemba Member".
