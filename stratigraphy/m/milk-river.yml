name: Milk River
rank: formation
period: [Late Cretaceous]
stages: [Santonian, Campanian]
references:
  - id: larson2013a
    notes: >
      Gives "the uppermost Santonian Milk River Formation (Upper Cretaceous),
      Alberta", and notes it is often indistinguishable faunally from the
      time-equivalent John Henry Member of the Straight Cliffs Formation of
      Utah.
  - id: averianov2019b
    notes: >
      Independently gives "the Milk River Formation (Santonian) of Alberta".
  - id: currie1990a
    notes: >
      Places it in the lower Campanian: all the tooth types of
      Saurornitholestes, Dromaeosaurus, Troodon, Richardoestesia and
      tyrannosaurids "are found in the Lower Campanian Milk River Formation of
      southern Alberta".
