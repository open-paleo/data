name: Milk River
rank: formation
period: [Late Cretaceous]
stages: [Santonian, Campanian]
description: "The Milk River Formation is a sandstone-dominated stratigraphic unit of the Western Canada Sedimentary Basin in southern Alberta, Canada. It was deposited in near-shore to coastal environments during Late Cretaceous (late Santonian to early Campanian) time. Based on uranium-lead dating, palynology and stratigraphic relationships, deposition occurred between ~84.1 and 83.6 Ma. The sandstones of the Virgelle Member in the center of the formation are well-exposed at Writing-on-Stone Provincial Park in southwestern Alberta, where they bear petroglyphs carved into them by First Nations people."
references:
  - id: larson2013a
    notes: >
      Gives "the uppermost Santonian Milk River Formation (Upper Cretaceous),
      Alberta", and notes it is often indistinguishable faunally from the
      time-equivalent John Henry Member of the Straight Cliffs Formation of
      Utah.
  - id: averianov2019b
    notes: >
      Independently gives "the Milk River Formation (Santonian) of Alberta".
  - id: currie1990a
    notes: >
      Places it in the lower Campanian: all the tooth types of
      Saurornitholestes, Dromaeosaurus, Troodon, Richardoestesia and
      tyrannosaurids "are found in the Lower Campanian Milk River Formation of
      southern Alberta".
