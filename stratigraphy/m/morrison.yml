name: Morrison
rank: formation
period: [Late Jurassic]
stages: [Oxfordian, Kimmeridgian, Tithonian]
variants: [Atlantosaurus beds]
references:
  - id: mannion2019a
    notes: >
      Gives the span: "the Late Jurassic (Oxfordian-Tithonian) Morrison
      Formation of the western USA".
  - id: kirkland2016a
    notes: >
      Dates the top with a U-Pb age of "148.96 +2.54 to -2.21 Ma" from an ash
      about 9 m below the Naturita Formation and an age of 150.00 ± 0.52 Ma near
      the top of the Brushy Basin Member.
  - id: chure2000a
    notes: >
      Works at "Kimmeridgian, Jurassic" throughout for the Salt Wash Member,
      the horizon of the material it describes.
  - id: darton1906a
    notes: >
      Places the formation in the Bighorn uplift on the Cretaceous side of a
      then-open question: "From stratigraphic evidence in other regions, the
      Morrison formation is provisionally classed in the early Cretaceous." Of
      its saurian remains, "Opinions are divided as to whether these are of
      late Jurassic or early Cretaceous age."
  - id: cifelli2014a
    notes: >
      Gives the formation as "mainly Kimmeridgian–Tithonian", possibly reaching
      into the late Oxfordian and early Berriasian, after Kowallis and
      colleagues (1998) and Miall and colleagues (2008).
  - id: kowallis1998a
    notes: >
      Dates the formation by argon on sanidine from about 155 to 148 Ma and
      concludes that it "is entirely Late Jurassic in age", its deposition
      having "ended before the end of the Jurassic".
  - id: miall2008a
    notes: >
      Says that the clastic wedge "constituting the Morrison and Kootenay
      formations, continued into the Berriasian", for the two formations
      together and citing other works, while calling the Morrison "Upper
      Jurassic (Oxfordian–Tithonian)" in the same chapter.
  - id: marsh1877c
    notes: >
      Names the deposits for their sauropods: "The deposits which contained
      them may be called the Atlantosaurus beds, from their most
      characteristic fossils".
  - id: gilmore1922a
    notes: >
      Uses the two names as one unit: "the Morrison formation (Atlantosaurus
      beds) of the west".

