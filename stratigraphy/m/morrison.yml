name: Morrison
rank: formation
period: [Late Jurassic, Early Cretaceous]
stages: [Oxfordian, Kimmeridgian, Tithonian, Berriasian]
references:
  - id: mannion2019a
    notes: >
      Gives the span: "the Late Jurassic (Oxfordian-Tithonian) Morrison
      Formation of the western USA".
  - id: kirkland2016a
    notes: >
      Dates the top. A recalibrated 40Ar/39Ar age of 150.00 +/- 0.52 Ma from
      near the top of the Brushy Basin Member puts "the top of the Morrison
      Formation ... to the lower third of the Tithonian Stage near but not to
      the end of the Jurassic".
  - id: chure2000a
    notes: >
      Works at "Kimmeridgian, Jurassic" throughout for the Salt Wash Member,
      the horizon of the material it describes.
  - id: darton1906a
    notes: >
      Places the formation in the Bighorn uplift on the Cretaceous side of a
      then-open question: "From stratigraphic evidence in other regions, the
      Morrison formation is provisionally classed in the early Cretaceous." Of
      its saurian remains, "Opinions are divided as to whether these are of
      late Jurassic or early Cretaceous age."
  - id: cifelli2014a
    notes: >
      Gives it as "mainly Kimmeridgian–Tithonian, though time of deposition
      for the unit as a whole may also include the late Oxfordian and early
      Berriasian", after Kowallis and colleagues (1998) and Miall and
      colleagues (2008). Across the Western Interior foreland basin it is the
      "nonmarine Upper Jurassic (to possibly lower Berriasian) strata" beneath
      the unconformity at the base of the Lower Cretaceous.
