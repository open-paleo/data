name: Morrison
rank: formation
period: [Late Jurassic, Early Cretaceous]
stages: [Oxfordian, Kimmeridgian, Tithonian, Berriasian]
references:
  - id: mannion2019a
    notes: >
      Gives the span: "the Late Jurassic (Oxfordian-Tithonian) Morrison
      Formation of the western USA".
  - id: kirkland2016a
    notes: >
      Dates the top with two ages placed on the 2013 ICS chart: "148.96
      +2.54 to -2.21 Ma" from zircons in an ash about 9 m below the base
      of the overlying Naturita Formation, and "150.00 ± 0.52 Ma from near
      the top of the Brushy Basin Member", so that "the top of the
      Morrison Formation dates to the lower third of the Tithonian Stage
      near but not to the end of the Jurassic". On the ICS chart v2024/12
      (Tithonian base 149.2 Ma) the second age is Kimmeridgian, and the
      first is Tithonian only at its central value, its uncertainty
      spanning both stages.
  - id: chure2000a
    notes: >
      Works at "Kimmeridgian, Jurassic" throughout for the Salt Wash Member,
      the horizon of the material it describes.
  - id: darton1906a
    notes: >
      Places the formation in the Bighorn uplift on the Cretaceous side of a
      then-open question: "From stratigraphic evidence in other regions, the
      Morrison formation is provisionally classed in the early Cretaceous." Of
      its saurian remains, "Opinions are divided as to whether these are of
      late Jurassic or early Cretaceous age."
  - id: cifelli2014a
    notes: >
      Gives it as "mainly Kimmeridgian–Tithonian, though time of
      deposition for the unit as a whole may also include the late
      Oxfordian and early Berriasian", after Kowallis and colleagues
      (1998) and Miall and colleagues (2008). Across the Western Interior
      foreland basin it is the "nonmarine Upper Jurassic (to possibly
      lower Berriasian) strata" beneath the unconformity at the base of
      the Lower Cretaceous. The top dated by Kirkland and colleagues
      (2016), about 149 to 150 Ma, lies some 6 Myr before the Berriasian
      base of 143.1 Ma on the ICS chart v2024/12, so the dates do not
      reach that stage.
  - id: kowallis1998a
  - id: miall2008a
