name: Mooreville Chalk
rank: formation
period: [Late Cretaceous]
stages: [Santonian, Campanian]
references:
  - id: prieto-márquez2016b
    notes: >
      Dates its base by nanoplankton: "the lower 32 m of the Mooreville Chalk
      in central Alabama falls within the upper Santonian", the material
      sitting "less than 24 cm above the conformable contact with the
      underlying Tombigbee Sand Member of the Eutaw" Formation.
  - id: gates2021a
    notes: >
      Places a horizon in the "unnamed lower member of the Mooreville Chalk
      Fm., approximately 10 m above the Santonian/Campanian boundary", and
      records that the boundary "occurs 105' (32m) above the contact of the
      Tombigbee Greensand Member of the Eutaw Formation".
  - id: pittman2020a
    notes: >
      Tabulates the "Mooreville Chalk Formation" of the United States as "Late
      Cretaceous", "Campanian", on the authority of Clarke (2004).
  - id: clarke2004a
    notes: >
      Early Campanian after Parris and Echols (1992), and "approximately the
      same age as or slightly younger than the uppermost deposits represented
      in the Niobrara Formation" after Martin and Stewart (1982). The
      Ichthyornis antecessor holotype comes from the top of the unit just
      below the base of the Arcola Limestone Member, at Hewletts Farm in
      Greene County, Alabama.
  - id: parris1992a
  - id: martin1982a
    notes: >
      A relay, at a different rank, and Campanian only: "Olson (1976)
      documented Ichthyornis antecessor from the Mooreville Formation (early
      Campanian) of Alabama." It says nothing about the Santonian, which
      rests on the entry's nannoplankton reference.
