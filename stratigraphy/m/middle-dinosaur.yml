name: Middle Dinosaur
rank: member
variants: [Middle Saurian Bed]
parent: Tendaguru
period: [Late Jurassic]
stages: [Kimmeridgian, Tithonian]
description: "The Middle Dinosaur Member is a member of the Tendaguru Formation in the Lindi Region of southeastern Tanzania. It is the third of the formation's six members from oldest to youngest, above the Nerinella Member and below the Indotrigonia africana Member. The sedimentological characteristics of the basal part of the Middle Dinosaur Member suggest deposition on tidal flats and in small tidal channels of a lagoonal paleoenvironment. The paleoenvironment of the ostracod assemblages of the Middle Dinosaur Member changed upsection from a marine setting in the basal parts through alternating marine-brackish conditions to freshwater conditions in the higher parts of this member. The upper parts of the formation, the Middle Dinosaur and Rutitrigonia bornhardti-schwarzi Members in particular, showed prevailing semiarid conditions with pronounced dry seasons, based on palynologic analysis."
references:
  - id: bussert2009a
    notes: >
      Says the member "was tentatively identified as late Kimmeridgian or
      Tithonian".
  - id: rauhut2011a
    notes: >
      Carries it "to late Tithonian".
  - id: sobral2012a
    notes: >
      Gives the member, "from which Dysalotosaurus was collected", a late
      Kimmeridgian, Late Jurassic age, citing Witzmann and colleagues (2008).
  - id: witzmann2008a
    notes: >
      Names the unit the "Middle Saurian Bed" and dates it to one stage:
      material comes from "the Middle Saurian Bed of Tendaguru ...
      (Kimmeridgian, Upper Jurassic)", repeated as "the Upper Jurassic Middle
      Saurian Bed (Kimmeridgian) of site 'dy'". It supports the Kimmeridgian
      and not the Tithonian.
  - id: schrank2005a
    notes: >
      Its dinoflagellate cysts "do not allow a precise age determination",
      their combined ranges meeting only in an "overlap in the Oxfordian to
      Kimmeridgian"; the bed's position "between a probably Oxfordian to
      Kimmeridgian unit below, and a Tithonian unit above suggests a late
      Kimmeridgian age".
