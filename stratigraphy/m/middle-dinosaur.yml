name: Middle Dinosaur
rank: member
variants: [Middle Saurian Bed]
parent: Tendaguru
period: [Late Jurassic]
stages: [Kimmeridgian, Tithonian]
references:
  - id: bussert2009a
    notes: >
      Says the member "was tentatively identified as late Kimmeridgian or
      Tithonian".
  - id: rauhut2011a
    notes: >
      Carries it "to late Tithonian".
  - id: sobral2012a
    notes: >
      Gives the member, "from which Dysalotosaurus was collected", a late
      Kimmeridgian, Late Jurassic age, citing Witzmann and colleagues (2008).
  - id: witzmann2008a
    notes: >
      Names the unit the "Middle Saurian Bed" and dates it to one stage:
      material comes from "the Middle Saurian Bed of Tendaguru ...
      (Kimmeridgian, Upper Jurassic)", repeated as "the Upper Jurassic Middle
      Saurian Bed (Kimmeridgian) of site 'dy'". It supports the Kimmeridgian
      and not the Tithonian.
  - id: schrank2005a
    notes: >
      Its dinoflagellate cysts "do not allow a precise age determination",
      their combined ranges meeting only in an "overlap in the Oxfordian to
      Kimmeridgian"; the bed's position "between a probably Oxfordian to
      Kimmeridgian unit below, and a Tithonian unit above suggests a late
      Kimmeridgian age".
