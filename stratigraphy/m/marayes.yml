name: Marayes
rank: group
period: [Middle Triassic, Late Triassic, Early Jurassic]
stages: [Carnian, Norian, Rhaetian]
references:
  - id: martínez2017a
    notes: >
      Names the group and its four constituent formations in the
      Marayes-El Carrizal Basin of northwestern Argentina, "from base to
      top, the Esquina Colorada (Middle Triassic), the Carrizal (upper
      Carnian-lower Norian), the Quebrada del Barro (upper
      Norian-Rhaetian) and the Balde de Leyes (Lower Jurassic)
      formations", crediting the group to Bossi (1976). The scheme dates two of the
      members to stage, the Carrizal and the Quebrada del Barro, and the
      Esquina Colorada and Balde de Leyes to epoch only.
  - id: bossi1976a
