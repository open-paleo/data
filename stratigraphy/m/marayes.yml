name: Marayes
rank: group
period: [Middle Triassic, Late Triassic, Early Jurassic]
stages: [Carnian, Norian, Rhaetian]
references:
  - id: martínez2017a
    notes: >
      Lists the group's four formations in the Marayes-El Carrizal Basin, from
      the Middle Triassic Esquina Colorada to the Lower Jurassic Balde de Leyes,
      and credits the group to Bossi (1976).
  - id: bossi1976a
  - id: colombi2015a
    notes: >
      Relays that Bossi (1976) "define el Grupo Marayes" with the Esquina
      Colorada, Carrizal and Quebrada del Barro formations, and erects the
      Balde de Leyes Formation on top of the Quebrada del Barro without saying
      whether it belongs to the group.
