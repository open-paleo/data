name: Marayes
rank: group
period: [Late Triassic, Early Jurassic]
stages: [Norian, Rhaetian]
references:
  - id: martínez2017a
    notes: >
      Names the group and its four constituent formations in the Marayes-El
      Carrizal Basin of northwestern Argentina, "from base to top, the
      Esquina Colorada (Middle Triassic), the Carrizal (upper Carnian-lower
      Norian), the Quebrada del Barro (upper Norian-Rhaetian) and the Balde
      de Leyes (Lower Jurassic) formations", crediting the group to Bossi
      (1976).
  - id: bossi1976a
