name: Marnes d'Auzas
rank: formation
period: [Late Cretaceous]
stages: [Maastrichtian]
description: "The Marnes d'Auzas Formation (Auzas Marls Formation) is a geological formation in southwestern France whose strata date back to the Late Maastrichtian, approximately 67.5 to 66 million years ago. It consists primarily of marls with some interbeds of sandstones and limestones. These sediments correspond to varied paleoenvironments where lagoons, coastal marshes and more continental environments (lakes, rivers and alluvial plains) coexist and/or follow one another. The Marnes d'Auzas Formation has yielded numerous fossils of aquatic and terrestrial invertebrates and vertebrates, including dinosaurs."
variants: [Auzas Marls]
references:
  - id: prieto-márquez2013a
    notes: >
      Gives the Canardia horizon as "the basal section of the upper
      Maastrichtian Marnes d'Auzas Formation" southwest of
      Marignac-Laspeyres in the Petites-Pyrénées, about 65 km southwest of
      Toulouse, Haute-Garonne.
