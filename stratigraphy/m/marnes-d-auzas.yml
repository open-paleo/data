name: Marnes d'Auzas
rank: formation
period: [Late Cretaceous]
stages: [Maastrichtian]
variants: [Auzas Marls]
lithology: marl and calcarenite
references:
  - id: prieto-márquez2013a
    notes: >
      Gives the Canardia horizon as "the basal section of the upper
      Maastrichtian Marnes d'Auzas Formation" southwest of
      Marignac-Laspeyres in the Petites-Pyrénées, about 65 km southwest of
      Toulouse, Haute-Garonne.
  - id: bilotte1983a
    notes: >
      Describes its rock: "They consist of five members, from bottom to top: the
      Mélat Marls, dark, silty and lignitic,... the Fond du Touc calcarenites...
      the Bioués marls, lignitic... the Sainte-Croix calcarenites... the
      Pentecôte marls".
