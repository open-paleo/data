name: Monmouth
rank: formation
period: [Late Cretaceous]
stages: [Maastrichtian]
references:
  - id: white1973a
    notes: >
      Gives the Ornithotarsus type horizon as "Upper Cretaceous, Monmouth
      Formation" in Monmouth County, New Jersey, at Union on Raritan Bay. No
      stage is given.
  - id: prieto-márquez2006a
    notes: >
      Records the competing readings for the same material: it was named
      "from the Monmouth Formation near Keyport, New Jersey", while both
      Cope and Lull and Wright "stated that the bones were discovered in the
      shores of Raritan Bay ..., from clays belonging to the Lower
      Cretaceous", and a later worker assigned it questionably to the
      Campanian Woodbury Formation. The Lower Cretaceous is the age those
      authors gave the bones, not a dating of the formation.
  - id: gallagher1993a
    notes: >
      Its table of "Chronostratigraphic and lithostratigraphic units of the
      New Jersey Coastal Plain" sets the Monmouth, at group rank, against the
      Maastrichtian, with the Tinton, Red Bank, Navesink and Mount Laurel
      formations, and its map shows the "Outcrop belt of Monmouth Group,
      Upper Cretaceous, New Jersey". It dates its lowest formation two ways,
      the Mount Laurel being "Late Campanian (Owens et al., 1970; Olsson,
      1989); early Maastrichtian (Olsson, 1975; Petters, 1976; Jordan and
      Smith, 1983)".
