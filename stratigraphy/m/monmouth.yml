name: Monmouth
rank: group
period: [Late Cretaceous]
stages: [Maastrichtian]
references:
  - id: white1973a
    notes: >
      Gives the Ornithotarsus type horizon as "Upper Cretaceous, Monmouth
      Formation" in Monmouth County, New Jersey, at Union on Raritan Bay, at
      formation rank. No stage is given.
  - id: prieto-márquez2006a
    notes: >
      Gives the *Ornithotarsus immanis* type as "from the Monmouth Formation
      near Keyport, New Jersey", and reports that earlier authors put the bones
      in Lower Cretaceous clays.
  - id: gallagher1993a
    notes: >
      Ranks the unit a group of the Mount Laurel, Navesink, Red Bank, Tinton and
      New Egypt formations in New Jersey, and sets it against the Maastrichtian.
  - id: sohl1960a
    notes: >
      Uses formation rank for the unit in Maryland, listing occurrences from
      the "Maryland: Monmouth formation".
  - id: owens1970a
    notes: >
      Cited by Gallagher (1993) for a late Campanian age of the Mount Laurel
      Formation.
  - id: olsson1989a
    notes: >
      Cited by Gallagher (1993) for a late Campanian age of the Mount Laurel
      Formation.
  - id: olsson1975a
    notes: >
      Cited by Gallagher (1993) for an early Maastrichtian age of the Mount
      Laurel Formation.
  - id: petters1976a
    notes: >
      Cited by Gallagher (1993) for an early Maastrichtian age of the Mount
      Laurel Formation.
  - id: jordan1983a
    notes: >
      Cited by Gallagher (1993) for an early Maastrichtian age of the Mount
      Laurel Formation.
