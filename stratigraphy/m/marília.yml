name: Marília
rank: formation
parent: Bauru
period: [Late Cretaceous]
stages: [Maastrichtian]
lithology: coarse to conglomeratic sandstone, with rare red mudstone and
  limestone layers
references:
  - id: soares2020a
    notes: >
      Restricts the formation to the southeastern and northwestern parts of the
      Bauru Basin, the former Echaporã Member, and names the northeastern
      deposits the Serra da Galga Formation.
  - id: arai2023a
    notes: >
      Treats the formation and the Serra da Galga as separate units, and gives
      both "a Maastrichtian (late Maastrichtian?) age" from charophytes and
      ostracods in the Serra da Galga.
  - id: iori2021a
    notes: >
      Places Kurupi's Monte Alto locality in the restricted formation and dates
      it Maastrichtian, assuming the age of the Serra da Galga from the lateral
      relationships of the former members.
  - id: iori2016a
    notes: >
      Describes crocodyliforms from the formation at Monte Alto, contributing
      "to the definition of the regional paleofauna during the Maastrichtian".
  - id: menegazzo2016a
    notes: >
      Dates the formation, in the sense that still included the Serra da Galga,
      as Maastrichtian on its fish, charophytes and ostracods.
  - id: bertini2001a
    notes: >
      Describes titanosaur material from the Echaporã Member at Monte Alto and,
      by correlation with the Serra da Galga Member, dates both members "Upper
      Campanian/Lower Maastrichtian".
  - id: martinelli2011a
    notes: >
      Re-examines the Brazilian titanosaur material referred to Aeolosaurus,
      including specimens from Monte Alto and Peirópolis, and finds no basis
      for the genus in Brazil, which removes the biochron behind the late
      Campanian readings.
  - id: cavalcanti2026a
    notes: >
      Lists it as one of four formations of the Bauru Group in the Triângulo
      Mineiro region, "the Adamantina, Uberaba, Marília, and Serra da Galga
      formations", and gives it no age of its own.
  - id: bertini2000a
  - id: soares1980a
    notes: >
      Defines the formation, in the broad sense that included the Serra da
      Galga, with its type section on the southern escarpment of the Marília
      Plateau. Source of the lithology.
  - id: fernandes2000a
    notes: >
      Keeps the "Marília Formation in the sense of Soares et al. (1980),
      subdivided into the Echaporã, Serra da Galga and Ponte Alta members"
      (translated), the broad sense, and equates its Echaporã Member with the
      unit Soares and colleagues "then treated as the Marília Formation"
      (translated). Gives no age for it beyond the Late Cretaceous.
