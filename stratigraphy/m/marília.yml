name: Marília
rank: formation
parent: Bauru
period: [Late Cretaceous]
stages: [Maastrichtian]
references:
  - id: soares2020a
    notes: >
      Restricts the unit. The paper "refers to the deposits of the Marília
      Formation exposed in the northeastern part of the Bauru Basin
      (traditionally subdivided in Serra da Galga and Ponte Alta members) as
      the Serra da Galga Formation. Consequently, the use of the term Marília
      Formation is here restricted to the southeastern and northwestern parts
      of the Bauru Basin, traditionally considered as the Echaporã Member."
      Most of the older literature on the Marília, and most of its dated
      material, comes from the northeastern area now in the Serra da Galga.
  - id: arai2023a
    notes: >
      A stratigraphic revision of the Bauru Supersequence that treats this
      unit and the Serra da Galga as separate formations. The direct dating
      is from the Serra da Galga, where charophytes and ostracods indicate
      "Maastrichtian (upper Maastrichtian?) strata"; with the units'
      arrangement this gives "a Maastrichtian (late Maastrichtian?) age for
      the Marília and Serra da Galga formations", above a hiatus that "would
      involve the mid-Campanian to early Maastrichtian time interval" at
      most.
  - id: iori2021a
    notes: >
      Uses the restricted unit, "reduced to the area of occurrence of the
      Echaporã Member", and gives Kurupi's Monte Alto locality as "Marília
      Formation, Bauru Group, Bauru Basin, Upper Cretaceous (Maastrichtian)".
      The age is carried over: "the majority of species used to formerly
      establish the relative dating of Marília Formation comes from the
      deposits now recognized as the new unit Serra da Galga Formation.
      Hence, considering the lateral relationships among the three formerly
      known members, a similar age is assumed."
  - id: iori2016a
    notes: >
      Describes crocodyliforms from the formation at Monte Alto, contributing
      "to the definition of the regional paleofauna during the Maastrichtian".
  - id: menegazzo2016a
    notes: >
      On its fish, charophytes and ostracods "Maastrichtian age is indicated
      for the Marília Formation", in the sense that still included the Serra
      da Galga, and it reports earlier ostracod and charophyte work giving
      "the Marília Formation" as "Maastrichtian". Records that "The genus
      Aeolosaurus has been used to attribute Campanian–Maastrichtian to the
      Adamantina and Marília formations", evidence it calls "inconclusive".
  - id: bertini2001a
    notes: >
      Describes titanosaur material from the Echaporã Member at Monte Alto
      and, by correlation with titanosaurs from the Serra da Galga Member,
      concludes: "An Upper Campanian/Lower Maastrichtian age is
      considered for the Echaporã and Serra da Galga members of the Marília
      Formation". The age is taken from the "neo-Campanian/eo-Maastrichtian
      age" the authors had given these units in earlier work, chiefly
      abstracts reporting Aeolosaurus, records that Martinelli and colleagues
      (2011) reject, finding "no characters indicating the presence of this
      Patagonian genus in the Late Cretaceous of Brazil".
  - id: martinelli2011a
    notes: >
      Re-examines the Brazilian titanosaur material referred to Aeolosaurus,
      including specimens from Monte Alto and Peirópolis, and finds no basis
      for the genus in Brazil, which removes the biochron behind the late
      Campanian readings.
  - id: cavalcanti2026a
    notes: >
      Lists it as one of four formations of the Bauru Group in the Triângulo
      Mineiro region, "the Adamantina, Uberaba, Marília, and Serra da Galga
      formations", and gives it no age of its own.
  - id: bertini2000a
