name: Marree
rank: subgroup
period: [Early Cretaceous]
stages: [Aptian, Albian]
variants: [Marree Formation]
references:
  - id: barrett2010b
    notes: >
      Gives the rank and the legacy name, the Bulldog Shale being "a
      constituent of the Marree Subgroup, which was formerly called the
      Marree Formation".
  - id: molnar1980a
    notes: >
      Ranks it as a formation and dates it: Kakuru comes "from the Aptian
      Marree Formation, at Andamooka, South Australia", and "The opalbearing
      horizon, the Marree Formation, is Aptian in age", after Carr and
      colleagues (1979).
  - id: carr1979a
  - id: alexander2007a
    notes: >
      Applies the name "to the shaly marine sequence where Coorikiana Sandstone
      is absent", the Coorikiana and the Oodnadatta Formation each passing into
      the subgroup toward the basin margin.
  - id: burger1980a
    notes: >
      Supports, from samples in the DFS Innamincka 1 well, an earliest Albian
      rather than Aptian age for the foraminiferal Herrgottella jonesi Zone of
      the lower "Marree Formation".
  - id: ludbrook1966a
  - id: evans1967a
