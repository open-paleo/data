name: Marree
rank: subgroup
period: [Early Cretaceous]
stages: [Aptian, Albian]
variants: [Marree Formation]
references:
  - id: barrett2010b
    notes: >
      Gives the rank and the legacy name, the Bulldog Shale being "a
      constituent of the Marree Subgroup, which was formerly called the
      Marree Formation".
  - id: molnar1980a
    notes: >
      Ranks it as a formation and dates it: Kakuru comes "from the Aptian
      Marree Formation, at Andamooka, South Australia", and "The opalbearing
      horizon, the Marree Formation, is Aptian in age", after Carr and
      colleagues (1979).
  - id: carr1979a
  - id: alexander2007a
    notes: >
      Defines the subgroup as the basin-margin equivalent of dated units:
      "The name Marree Subgroup is applied to the shaly marine sequence where
      Coorikiana Sandstone is absent", the Coorikiana and the Oodnadatta
      Formation each passing "into Marree Subgroup towards the basin margin".
      Those units are dated: "The Bulldog Shale is assigned to the Early
      Aptian – mid Albian PK2.1–PK3.1 and Cyclosporites hughesii – Coptospora
      paradoxa palynozones", "The Coorikiana Sandstone is Early Cretaceous
      (Albian)", and "The Oodnadatta Formation is Early Cretaceous
      (middle–late Albian)". Together they make the subgroup Aptian to
      Albian.
  - id: burger1980a
    notes: >
      On the lower part of the old Marree Formation, where the foraminiferal
      Herrgottella jonesi Zone is "associated with the lower 'Marree
      Formation' (equivalent to the Bulldog Shale ...)", records that the zone
      "could very well represent the earliest Albian", and that "My own
      examination of samples from the 'Marree Formation' in DFS Innamincka 1
      well, South Australia, corroborates their interpretation."
