name: Marnes de Dives
rank: formation
period: [Middle Jurassic]
stages: [Callovian]
references:
  - id: carrano2012a
    notes: >
      Gives the occurrence in full: "Vaches Noires cliffs, near Dives,
      Calvados, Basse-Normandie, France; Marnes de Dives; late Callovian,
      Middle Jurassic", for the Piveteausaurus braincase. Uses the name
      without a rank word. Gives Streptospondylus altdorfensis, from the same
      cliffs near Honfleur, a wider "late Callovian-early Oxfordian, late
      Middle-early Late Jurassic".
  - id: paul1988a
    notes: >
      Gives "Marnes de Dives Formation of France" at the "Upper Callovian of
      the Middle Jurassic", supplying the rank word the other source omits.
  - id: douvillé1881a
    notes: >
      Names the unit: the lowest system "between Dives and Beuzeval", forming
      "the base of the Houlgate cliff", "may be designated under the name: I.
      MARNES DE DIVES, or zone of A. Lamberti". It begins with a very
      fossiliferous bed at the "Mauvais pas" at the mouth of the Dives, and is
      followed above by "II. MARNES DE VILLERS, or zone of A. Mariæ".
  - id: lebrun2013a
    notes: >
      Credits Douvillé (1881) with the name, dividing the older Argile de
      Dives into the Marnes de Dives (Lamberti Zone) below and the Marnes de
      Villers (Mariae Zone) above. "only the final 6-7 m (out of 20 m) of the
      Marnes de Dives are 'visible' at the Vaches-Noires, the bulk of the
      formation being known further to the west, and only various successive
      faunas of the Lamberti Zone (terminal biochronological units of the
      Upper Callovian) are represented"; the Marnes de Villers above
      "represent all or part of the basal Oxfordian (Mariae Zone)".
  - id: taquet1977a
    notes: >
      Names Piveteausaurus from the Dives braincase, "Horizon: upper
      Callovian", without naming the formation.
  - id: allain2001a
    notes: >
      Gives the Streptospondylus horizon as the "upper Callovian or lower
      Oxfordian marls of the Vaches Noires cliffs", without naming the
      formation; the cliff marls take in both the Marnes de Dives and the
      overlying Oxfordian Marnes de Villers.
  - id: walker1964a
    notes: >
      Makes the Dives cranium the type of Eustreptospondylus divesensis and
      dates it "(Oxfordian)", following Piveteau (1923); Taquet and Welles
      (1977) later give its horizon as upper Callovian.
  - id: piveteau1923a
