name: Marnes de Dives
rank: formation
period: [Middle Jurassic, Late Jurassic]
stages: [Callovian, Oxfordian]
references:
  - id: carrano2012a
    notes: >
      Gives the occurrence in full: "Vaches Noires cliffs, near Dives,
      Calvados, Basse-Normandie, France; Marnes de Dives; late Callovian,
      Middle Jurassic", for the Piveteausaurus braincase. Uses the name
      without a rank word. Gives Streptospondylus altdorfensis, from the same
      cliffs near Honfleur, a wider "late Callovian-early Oxfordian, late
      Middle-early Late Jurassic".
  - id: paul1988a
    notes: >
      Gives "Marnes de Dives Formation of France" at the "Upper Callovian of
      the Middle Jurassic", supplying the rank word the other source omits.
