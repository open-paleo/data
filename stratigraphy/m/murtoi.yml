name: Murtoi
rank: formation
period: [Early Cretaceous]
stages: [Berriasian, Valanginian, Hauterivian, Barremian, Aptian]
description: "The Murtoi Formation is a geologic formation in vicinity of Lake Gusinoye in Russia. It was deposited in the late Valanginian to Early Hauterivian of the Early Cretaceous. Petrified wood remnants and rare fragmented dinosaur fossils can be found in the lower alluvial-proluvial Murtoi section of the Mogoito locality. The sauropod Tengrisaurus starkovi is the primary fossil."
references:
  - id: averianov2017a
    notes: >
      Describes Tengrisaurus from "the Lower Cretaceous (Barremian?) Murtoi
      Formation at Mogoito locality, near Gusinoe Lake in Buryatia, Russia".
  - id: averianov2019b
    notes: >
      Reports teeth from "the Barremian" to "Aptian Murtoi Formation of
      Buryatia, Russia".
  - id: averianov2021e
    notes: >
      Gives "Murtoi Formation, Lower Cretaceous (Barremian-Aptian)", and
      records the older dating: the formation "has traditionally been dated as
      Berriasian–Hauterivian", but "the studies based on vertebrates suggest a
      younger, late Barremian to middle Aptian age".
