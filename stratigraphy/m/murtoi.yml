name: Murtoi
rank: formation
period: [Early Cretaceous]
stages: [Berriasian, Valanginian, Hauterivian, Barremian, Aptian]
references:
  - id: averianov2017a
    notes: >
      Describes Tengrisaurus from "the Lower Cretaceous (Barremian?) Murtoi
      Formation at Mogoito locality, near Gusinoe Lake in Buryatia, Russia".
  - id: averianov2019b
    notes: >
      Reports teeth from "the Barremian" to "Aptian Murtoi Formation of
      Buryatia, Russia".
  - id: averianov2021e
    notes: >
      Gives "Murtoi Formation, Lower Cretaceous (Barremian-Aptian)", and
      records the older dating: the formation "has traditionally been dated as
      Berriasian–Hauterivian", but "the studies based on vertebrates suggest a
      younger, late Barremian to middle Aptian age".
