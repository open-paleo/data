name: McClelland Ferry
rank: member
parent: Judith River
period: [Late Cretaceous]
stages: [Campanian]
references:
  - id: ramezani2022a
    notes: >
      A Bayesian age-stratigraphic model built on three U-Pb bentonite ages
      constrains the member's base to 78.70 +2.0/-0.11 Ma and its top to
      76.269 +0.052/-0.34 Ma, the base treated as a maximum estimate because
      the correlated Taber coal zone "is expected to be time transgressive".
      Taken to the far ends of both error bars, 80.70 to 75.93 Ma, the member
      falls wholly within the Campanian on this project's own stage boundary
      table.
  - id: arbour2017a
    notes: >
      Gives its position and the surface that bounds it: "the mid-Judith
      discontinuity (MJD), which marks the boundary between the lower
      McClelland Ferry Member and the upper Coal Ridge Member of the Judith
      River Formation", identified "in the middle of the 180 m thick unit".
      The same paper dates the formation to about 4 Myr within the Campanian.
  - id: loewen2024a
    notes: >
      Places Lokiceratops in "the lower portion of the McClelland Ferry Member
      of the Judith River Formation in the Kennedy Coulee region along the
      Canada-USA border".
  - id: mallon2016a
    notes: >
      Treats it and the Coal Ridge as the two terrestrial members, listing
      taxa "from terrestrial McClelland Ferry or Coal Ridge members".
