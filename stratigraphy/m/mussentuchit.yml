name: Mussentuchit
rank: member
parent: Cedar Mountain
period: [Early Cretaceous, Late Cretaceous]
stages: [Albian, Cenomanian]
references:
  - id: kirkland2007a
    notes: >
      An ash bed places the member in the earliest Late Cretaceous: "A
      radiometric age of 98.37 + 0.07 million years, obtained by the Oklahoma
      Museum of Natural History (OMNH) from volcanic ash within the
      Mussentuchit Member, indicates an early Cenomanian age (Cifelli and
      others, 1997, 1999)". The Albian that earlier work read from its
      palynomorphs is explained as predating "the lower placement of the
      Albian-Cenomanian boundary based on ammonite correlations with the type
      Cenomanian in Europe".
  - id: mori2009a
    notes: >
      Carries the wider reading, from U-Pb detrital zircon ages at three
      measured sections: "the Mussentuchit Member ranges from about 109–105 Ma
      to 99 to 96 Ma (mid-Albian to mid-Cenomanian) and perhaps as young as 91
      Ma (Turonian)", with the young zircon ages from the overlying Dakota
      Sandstone raising the possibility that "the Mussentuchit Member, if not
      the Mussentuchit fauna itself, may range to late Cenomanian or early
      Turonian". The same thesis reports the sanidine dating of others as
      "early Cenomanian", so the Albian extension rests on the zircon ages
      alone.
  - id: kirkland2016a
    notes: >
      Radiometric ages confine the member to the earliest Late Cretaceous:
      dates of 96.7 to 98.2 Ma indicate that "the Mussentuchit Member was
      deposited over an interval of 1.5 Ma during the early Cenomanian", and
      the faunal turnover it preserves falls "at the base of the Cenomanian of
      Utah at about 100 to 98 Ma". The Albian read from its palynomorphs
      predates "the lower placement of the Albian-Cenomanian boundary based on
      ammonite correlations with the type Cenomanian in Europe", so it is the
      same rocks under an older boundary rather than an older age. The wider
      mid-Albian to Turonian bracket of Mori (2009) is set aside here, its
      detrital zircon ages carrying "stratigraphic misinterpretations relative
      to the stratigraphic framework presented herein and limited sample
      sizes".
  - id: zanno2013a
    notes: >
      Gives "Mussentuchit Member ... Upper Cretaceous (Cenomanian".
  - id: mcdonald2017a
    notes: >
      Places it in its parent, "the Mussentuchit Member of the Cedar Mountain
      Formation of Utah".
