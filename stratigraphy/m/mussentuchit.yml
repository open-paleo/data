name: Mussentuchit
rank: member
parent: Cedar Mountain
period: [Late Cretaceous]
stages: [Cenomanian]
lithology: drab gray smectitic mudstone
references:
  - id: kirkland2007a
    notes: >
      Dates the member early Cenomanian from a radiometric age of 98.37 Ma on
      volcanic ash within it, after Cifelli and colleagues (1997, 1999).
  - id: mori2009a
    notes: >
      A master's thesis. Brackets the member by detrital zircon ages at three
      sections, from mid-Albian to mid-Cenomanian and "perhaps as young as 91 Ma
      (Turonian)". Source of the lithology.
  - id: kirkland2016a
    notes: >
      Reads radiometric ages of 96.7 to 98.2 Ma as showing that "the
      Mussentuchit Member was deposited over an interval of 1.5 Ma during the
      early Cenomanian".
  - id: zanno2013a
    notes: >
      Gives "Mussentuchit Member ... Upper Cretaceous (Cenomanian)".
  - id: mcdonald2017a
    notes: >
      Places it in its parent, "the Mussentuchit Member of the Cedar Mountain
      Formation of Utah".
  - id: cifelli1997a
    notes: >
      Cited by Kirkland and Madsen (2007) for the radiometric date making the
      member early Cenomanian.
  - id: sprinkel2012a
    notes: >
      Relays sanidine ages of 98.5 to 97.2 Ma from the member and equates it, in
      its type area on the San Rafael Swell, with the Mowry Shale of Wyoming.
  - id: cifelli1999a
  - id: garrison2007a
