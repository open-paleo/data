name: Mulichinco
rank: formation
period: [Early Cretaceous]
stages: [Valanginian]
references:
  - id: coria2020a
    notes: >
      Gives the horizon of Lajasvenator as "Mulichinco Formation (upper
      Valanginian, Lower Cretaceous)", at the Pilmatué locality northeast of
      Las Lajas, Neuquén Province, where the formation's terrestrial levels
      are exposed.
  - id: coria2019a
    notes: >
      Independently gives "Mulichinco Formation (Valanginian, Lower
      Cretaceous, Neuquén Basin, Argentina)", with the horizon as "Mulichinco
      Formation, Valanginian, Lower Cretaceous".
