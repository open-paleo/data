name: Maastricht
rank: formation
period: [Late Cretaceous]
stages: [Maastrichtian]
references:
  - id: madzia2019a
    notes: >
      Places the Orthomerus dolloi material in it while recording that "the
      precise stratigraphical setting of the material is unknown" beyond that,
      and sets the unit at the top of the local sequence, running "from the
      Vijlen Member (Gulpen Formation) up to the uppermost unit of the
      Meerssen Member (Maastricht Formation)".
  - id: dallavecchia2020a
    notes: >
      Gives "the marine Maastricht Formation ('Chalk'; late Maastrichtian in
      age) of the Limburg (Belgium and the Netherlands)".
  - id: carrano2008a
    notes: >
      Tabulates Betasuchus bredai as "Maastricht Formation; Maastrichtian,
      Late", near Maastricht, Limburg.
