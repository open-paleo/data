name: Maastricht
rank: formation
period: [Late Cretaceous]
stages: [Maastrichtian]
description: "The Maastricht Formation, named after the city of Maastricht in the Netherlands, is a geological formation in the Netherlands and Belgium whose strata date back to the Late Cretaceous, within 500,000 years of the Cretaceous–Paleogene boundary, now dated at 66 million years ago. It crops out in southern parts of Dutch and Belgian Limburg and adjacent areas in Germany. It can be found in the subsurface of northern Belgium and southeastern Netherlands, especially in the Campine Basin and Roer Valley Graben. Dinosaur remains are among the fossils that have been recovered from the formation."
references:
  - id: madzia2019a
    notes: >
      Places the Orthomerus dolloi material in it while recording that "the
      precise stratigraphical setting of the material is unknown" beyond that,
      and sets the unit at the top of the local sequence, running "from the
      Vijlen Member (Gulpen Formation) up to the uppermost unit of the
      Meerssen Member (Maastricht Formation)".
  - id: dallavecchia2020a
    notes: >
      Gives "the marine Maastricht Formation ('Chalk'; late Maastrichtian in
      age) of the Limburg (Belgium and the Netherlands)".
  - id: carrano2008a
    notes: >
      Tabulates Betasuchus bredai as "Maastricht Formation; Maastrichtian,
      Late", near Maastricht, Limburg.
