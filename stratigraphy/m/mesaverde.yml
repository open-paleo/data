name: Mesaverde
rank: group
period: [Late Cretaceous]
stages: [Campanian]
references:
  - id: gates2014a
    notes: >
      Names the group by way of the Neslen Formation inside it, citing the
      record of "a tyrannosaurid dinosaur from the Mesa Verde Group (Neslen
      Formation) of Utah".
  - id: kirkland2007a
    notes: >
      Calls it "The Campanian Mesaverde Group" where it runs along the Coal
      Cliffs of the Wasatch Plateau, divided into "an upper Price River
      Formation and a lower coal-rich Black Hawk Formation separated by the
      Castlegate Sandstone".
  - id: wolfe1998a
    notes: >
      Refers to "the Upper Cretaceous Mesaverde Group of the San Juan Basin",
      with which Zuni basin strata were once thought to correlate in part.
