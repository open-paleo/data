name: Minmi
rank: member
parent: Bungil
period: [Early Cretaceous]
stages: [Aptian]
references:
  - id: molnar1980b
    notes: >
      Describes it as consisting of "medium to fine sands, silts and muds,
      with calcareous concretions", mapped near Roma in southeast Queensland,
      and dates the Minmi holotype horizon "Lower Cretaceous, probably
      Aptian".
  - id: leahey2015a
    notes: >
      Carries the older bound, "Minmi Member, Bungil Formation
      (Valanginian-Barremian)", a range that takes in the Hauterivian. Its
      text nonetheless describes the Minmi paravertebra holotype as "from the
      lower Aptian ... Minmi Member of the Bungil Formation near Roma". The
      table range is uncited, while the text cites the palynological work.
  - id: exon1976a
    notes: >
      The Bungil "includes the Kingull, Nullawurt Sandstone, and Minmi Members
      of Day (1964)", and the Minmi, "20 to 70 m of lithic to quartzose
      sandstone with subordinate siltstone and mudstone", "rests on the
      Nullawurt Sandstone Member", which is "probably of Neocomian age". The
      Minmi "contains 20 species of pelecypods ..., several gastropods, and
      one belemnite, and is of early Aptian age", with foraminifera "of Early
      Cretaceous (probably Aptian) age". Its lower part falls in the
      Murospora florida Zone with the members below, so the base may reach
      the latest Neocomian.
  - id: burger1980a
    notes: >
      "The Minmi Member, dated as lower Aptian, is restricted to the Surat
      Basin."
