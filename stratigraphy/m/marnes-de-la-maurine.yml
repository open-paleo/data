name: Marnes de la Maurine
rank: member
parent: Marnes Rouges Inférieures
variants: [Marnes Rouges de la Maurine]
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
dispute:
  summary: >
    Bilotte (1985) dates the member Maastrichtian on its dinosaur eggs and
    bones, with the Campanian confined to the Marnes rouges de Campagne two
    members below; Le Loeuff (2005) gives the Ampelosaurus horizon at its base
    as "upper Campanian to lower Maastrichtian", on the grounds that "the grès
    des Estous could also be of upper Campanian age (M. Bilotte, pers.
    comm.)".
references:
  - id: leloeuff1995a
    notes: >
      Names it as the member of the containing formation that holds the
      Ampelosaurus type, "member of the red marls of the Maurine (Bilotte,
      1985)", with the age "lower Maastrichtian (Bessière et al., 1989)".
  - id: bilotte1985a
    notes: >
      The third of the formation's four members, above the Grès des Estous and
      below the Poudingue fleuri, written both "Marnes de la Maurine" and
      "Marnes rouges de la Maurine". Dated to the Maastrichtian: "Dinosaur egg
      debris is very abundant there, as are remains of Maastrichtian
      Dinosaurs, notably near Campagne-sur-Aude".
  - id: leloeuff2005a
    notes: >
      Gives the Ampelosaurus horizon as "Marnes Rouges Inférieures Formation,
      Marnes de la Maurine member, upper Campanian to lower Maastrichtian
      (Bilotte 1985)", the locality being "situated at the bottom of the
      Marnes de la Maurine member". The upper Campanian rests on "the grès des
      Estous could also be of upper Campanian age (M. Bilotte, pers. comm.)",
      and the site's normal polarity is "consistent with either hypothesis".
