name: Marília
rank: formation
parent: Bauru
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
references:
  - id: santucci2022a
    notes: >
      Gives "Serra da Galga Member, Marília Formation, Bauru Group,
      Maastrichtian", and its table of South American titanosaurs lists each
      of the formation's species as "Maastrichtian (LK)", Late Cretaceous.
  - id: cavalcanti2026a
    notes: >
      Narrows it to the "Marília Formation (late Maastrichtian) at the
      paleontological site of Peirópolis in Minas Gerais State".
  - id: santucci2006a
    notes: >
      Reports that a "late Campanian / early Maastrichtian age" has been
      suggested for "the lower Marília Formation (Serra da Galga Member) in
      Uberaba", following Bertini and colleagues (2000) and Santucci and
      Bertini (2001).
  - id: bertini2000a
  - id: santucci2001a
    notes: >
      Scoped to a member and to its base: twelve of its twenty mentions of
      this formation are the Serra da Galga Member, and the claim is that
      "the base of the Serra da Galga Member ... indicates a Late
      Campanian/Early Maastrichtian age for this portion of the Bauru Group".
      It states the same age a second way, in the Latinate convention common
      in Brazilian stratigraphy - "indicative of Neocampanian/Eomaastrichtian
      age for the respective portions of these units" - where the prefixes
      mean late and early.
  - id: dias2020a
    notes: >
      "It is the youngest among the Cretaceous formations of the region, with
      a Maastrichtian age", following Dias-Brito and colleagues (2001), and
      corresponds to "conglomerates and coarse sandstones with calcite
      cementation", deposited by an anastomosed fluvial system that reworked
      coalescing alluvial fans.
  - id: dias-brito2001a
    notes: >
      Dates the unit by charophytes and ostracods rather than by vertebrates.
      Amblyochara sp. and Neuquenocypris minor mineira nov. subsp., from the
      Ponte Alta Member, are "Maastrichtian (probably Late Maastrichtian) in
      age", against a Turonian-Santonian assemblage in the Adamantina
      Formation below; "a hiatus, encompassing more than 11 Ma, separates
      those two formations." Treats the formation as the upper of two
      sequences, "[Maastrichtian (Neomaastrichtian?)]".
