name: Mesa Redondo
rank: member
parent: Chinle
period: [Late Triassic]
stages: [Carnian, Norian]
references:
  - id: nesbitt2007a
    notes: >
      Equates it with another member name and gives the age, the Camposaurus
      occurrence being in the "Bluewater Creek (= Mesa Redondo) Member of the
      Chinle Formation near Fort Wingate, New Mexico, USA" at "?Late Carnian,
      Late Triassic", on the calibration before the Norian was lengthened.
  - id: martz2017a
    notes: >
      "A radioisotopic date of about 227.6 Ma is available from the lower Mesa
      Redondo Formation", latest Carnian on the ICS chart v2024/12. Places
      the member in the Otischalkian holochronozone and reads that interval,
      "about 227–224 Ma", as "early Lacian (earliest early Norian)".
  - id: nesbitt2015a
    notes: >
      Dates the overlying member: "Given that the base of the Blue Mesa Member
      has been radiometrically dated to ~223 Ma", which is Norian, so the
      member runs from the latest Carnian into the Norian.
  - id: ogg2020a
    notes: >
      "the base-Norian, based on this working definition and Kent et al.
      (2017) chron ages, has a projected age of 227.3 Ma."
  - id: langer2018a
    notes: >
      Places it with the Shinarump among the basal members of the formation,
      and records that they fall in the Carnian-Norian gap in fossil
      preservation.
