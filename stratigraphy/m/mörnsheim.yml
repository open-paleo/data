name: Mörnsheim
rank: formation
period: [Late Jurassic]
stages: [Tithonian]
references:
  - id: rauhut2019b
    notes: >
      Places the unit above the plattenkalks of Bavaria: the Altmühltal and
      Painten formations "underly the Mörnsheim Formation", which differs from
      the Altmühltal "in the considerably higher amount of silicified
      limestones ('Kieselplattenkalke'), especially in its lower part".
      Biostratigraphically it "represents the uppermost horizon of the
      Hybonotum zone, the moernsheimensis horizon", of the Early Tithonian.
  - id: foth2025a
    notes: >
      Gives the same succession: "The geologically younger Mörnsheim Formation
      lies on top of both these formations", the Altmühltal and the Painten.
      Unlike the underlying Altmühltal, "most vertebrate fossils in the
      Mörnsheim Formation are at least partially disarticulated and often
      fragmentary, suggesting a different taphonomic context."
  - id: niebuhr2014a
    notes: >
      Gives the formation as "Lower Tithonian", by ammonites "the middle Lower
      Tithonian (upper hybonotum zone)", with the moernsheimensis fauna
      horizon of Schweigert (2007) in its lower part; "45-65 m" thick.
  - id: schweigert2007a
