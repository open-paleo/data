name: Mackunda
rank: formation
parent: Manuka
period: [Early Cretaceous, Late Cretaceous]
stages: [Albian, Cenomanian]
references:
  - id: herne2026a
    notes: >
      Gives the Muttaburrasaurus langdoni type horizon as "Mackunda Formation,
      Cenomanian-lower Turonian (96.3 ± 8.6 Ma to 93.51 ± 1.19 Ma)", southeast of Muttaburra in central
      western Queensland. Neither figure dates the formation: the first is a
      maximum depositional age, "the age of QML1817 (96.3 ± 8.6 Ma) represents
      the maximum depositional age of the Muttaburrasaurus langdoni holotype",
      and the second is the overlying Winton's, "The pooled detrital zircon
      age for the Winton Formation returned MLA of 93.5 ± 1.2 Ma". It places
      the taxon in the "mid-Cenomanian of the Mackunda Formation", and separately records that
      Tucker and colleagues (2016) dated the formation to the upper Albian,
      about 104 to 102 Ma.
  - id: agnolín2010a
    notes: >
      Gives the Muttaburrasaurus type horizon as "the upper part of the
      Mackunda Formation (late Albian-early Cenomanian)", near Rock Hole on
      the Thomson River, Queensland.
  - id: bartholomai1981a
    notes: >
      Places it "within the Manuka Sub-Group" and records the associated
      shallow-water marine invertebrates from nearby concretions.
  - id: bell2018a
    notes: >
      Repeats the late Albian to early Cenomanian span and sets it above the
      Allaru Mudstone.
  - id: tucker2016a
  - id: gray2002a
    notes: >
      "The Mackunda Formation embraces mid-Cretaceous (late Albian–early
      Cenomanian) spore-pollen assemblages conformable with units APK6 and
      APK7". Gives the type area as "the headwaters of Mackunda Creek on
      Gnalta Station", and the formation as conformable above the Allaru
      Mudstone and below the Winton Formation.
  - id: tucker2013a
    notes: >
      Detrital zircons "obtained just below the contact between the upper-most
      Mackunda Formation date around 102 Ma to 103 Ma", which the paper labels
      latest Albian. That is a maximum depositional age for the top of the
      formation rather than a date for it. Places the formation in the Manuka Subgroup following Gray
      and colleagues (2002), beneath the conformable Winton Formation.
  - id: vine1967a
    notes: >
      Keeps the unit as a formation and places it with the Winton in a new
      subgroup: "For this sequence we propose the term Manuka Sub-group." Its
      table puts the formation in the Tambo faunal division without a stage.
