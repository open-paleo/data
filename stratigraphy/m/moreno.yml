name: Moreno
rank: formation
period: [Late Cretaceous]
stages: [Maastrichtian]
description: "The Moreno Formation is a Mesozoic geologic formation located in San Joaquin Valley (California). Dinosaur remains diagnostic to the genus level are among the fossils that have been recovered from the formation."
references:
  - id: prieto-márquez2015a
    notes: >
      Gives the Augustynolophus horizon as the "upper Maastrichtian Moreno
      Formation, central California, USA".
  - id: ramírez-velasco2022a
    notes: >
      Lists it among the late Campanian to Maastrichtian hadrosaurid-bearing
      units of western North America.
