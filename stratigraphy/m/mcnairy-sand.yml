name: McNairy Sand
rank: member
parent: Ripley
period: [Late Cretaceous]
stages: [Maastrichtian]
dispute:
  summary: >
    Stephenson (1914) proposed the McNairy sand as a member of the Ripley
    formation, and Gilmore and Stewart (1945) place the Glen Allen bones in
    the "McNairy sand member of the Ripley formation"; Sohl (1960) reports
    that in Kentucky, Illinois and Missouri "the McNairy has been raised to
    formation rank (Stephenson, 1955, p. 98; Grohskopf, 1955, p. 20), as the
    other members of the Ripley are impossible to distinguish or are absent".
references:
  - id: baird1979a
    notes: >
      Gives the bed as "the McNairy Sand Member of the Ripley Formation,
      considered early Maestrichtian in age", and reassesses the vertebrae
      Gilmore compared with Hypsibema crassicauda.
  - id: gilmore1945a
    notes: >
      Reaches the same correlation from lithology, the material being
      "identical with the beds immediately underlying the Owl Creek formation
      (Upper Cretaceous) of southeastern Missouri. On this basis they would
      be correlated with the McNairy sand member of the Ripley formation".
  - id: sohl1960a
    notes: >
      "Stephenson (1914, p. 17, 18) originally proposed the McNairy sand as a
      member of the Ripley formation", with its type section at Big Hill,
      McNairy County, Tennessee; it is the third of the five units of the
      Ripley in northern Mississippi, above the transitional clay and the Coon
      Creek tongue. "To the north in Tennessee the member thickens but then
      thins in Kentucky, Illinois, and Missouri. In these areas the McNairy
      has been raised to formation rank (Stephenson, 1955, p. 98; Grohskopf,
      1955, p. 20), as the other members of the Ripley are impossible to
      distinguish or are absent."
  - id: stephenson1955a
    notes: >
      Lists "McNairy sand" as a unit in its own right in the southeastern
      Missouri sections, unconformably beneath the Owl Creek, and describes it
      as "a shallow water, possibly in part nonmarine, facies of the marine
      Ripley formation in Mississippi", adding that "the formation has yielded
      no marine organisms".
