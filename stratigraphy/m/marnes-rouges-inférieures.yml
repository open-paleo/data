name: Marnes Rouges Inférieures
rank: formation
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
references:
  - id: powell2003a
    notes: >
      Uses the French name and dates the unit: "The fossiliferous level is
      included in the 'Marnes Rouges inferieures' Formation, (Marnes Rouges de
      la Maurine Member). This unit is considered Maastrichtian in age and is
      considered to have been formed under fluvial conditions". Which unit
      "This unit" takes is slightly open, the nearest antecedent being the
      member named in the parenthesis.
  - id: leloeuff1995a
    notes: >
      Gives the Ampelosaurus type horizon as "Marnes Rouges Inférieures
      Formation, member of the red marls of the Maurine (Bilotte, 1985)" at
      Bellevue, Campagne-sur-Aude, and its age as "lower Maastrichtian
      (Bessière et al., 1989)".
  - id: bilotte1985a
    notes: >
      Credits the formation to Bilotte, Tambareau and Villatte (1983) and
      describes it as a "fluvial complex (200 m) in which 4 distinct members
      are recognized": from the base, the Marnes rouges de Campagne, "dated to
      the upper Campanian", the Grès des Estous, the Marnes de la Maurine and
      the Poudingue fleuri, the last three "rich in dinosaur egg fragments and
      bone remains and dated to the Maastrichtian". The Campagne member lies
      "directly superimposed on the Alet Sandstones" and is referred to the
      Campanian "essentially on grounds of position", with a palynoflora from
      the Couleurs stream.
