name: Mata Amarilla
rank: formation
period: [Late Cretaceous]
stages: [Cenomanian, Turonian, Coniacian, Santonian]
variants: [Pari Aike]
lithology: claystone and sandstone
dispute:
  summary: >
    Cenomanian, or no older than Campanian. Varela and colleagues (2012) date
    a primary tuff in the middle section of the formation, at Estancia Mata
    Amarilla east of Tres Lagos, at 96.23 ± 0.71 Ma, middle Cenomanian, and
    Novas and colleagues (2019) keep the formation Cenomanian on that date.
    Sickmann and colleagues (2018) take the terrestrial beds from Lago Viedma
    and Lago Argentino east past Tres Lagos, including rocks called Mata
    Amarilla, into their Cerro Fortaleza Formation. Their detrital-zircon
    maximum depositional ages are all Campanian, one of 82.1 ± 2.4 Ma from
    beds earlier assigned to the lower Mata Amarilla, and they conclude that
    these deposits "are no older than Campanian". They do not re-date the
    tuff, and Novas and colleagues cite the Campanian ages for the Cerro
    Fortaleza without taking up the case against the Cenomanian.
references:
  - id: novas2019a
    notes: >
      Dates the formation Cenomanian, "approximately 97my" after Varela and
      colleagues (2012), separately from the Campanian Cerro Fortaleza, and
      calls the correlation of these beds a matter of debate.
  - id: sickmann2018a
    notes: >
      Places rocks mapped as Mata Amarilla in the Cerro Fortaleza Formation,
      finds them "no older than Campanian" from detrital-zircon ages, and
      rejects the Cenomanian tuff date of Varela and colleagues (2012).
  - id: varela2012a
    notes: >
      Dates a tuff in the middle section at 96.2 +/- 0.7 Ma, "which corresponds
      to the middle Cenomanian", and gives the formation as Cenomanian to
      Santonian.
  - id: martínez2016a
    notes: >
      Gives "the Cenomanian" to "Coniacian Mata Amarilla Formation of Santa
      Cruz Province" and the angiosperm leaf assemblage recovered from it.
  - id: novas2013a
    notes: >
      Records the older name and gives the age of the Orkoraptor beds "(i.e.,
      Mata Amarilla Formation, former Pari Aike Formation)" as seemingly
      Cenomanian to Santonian.
  - id: bandeira2024a
    notes: >
      Tabulates Loncosaurus from the formation as Cenomanian.
  - id: kraemer1997a
  - id: arbe2002a
    notes: >
      Source of the lithology.
