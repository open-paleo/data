name: Mata Amarilla
rank: formation
period: [Late Cretaceous]
stages: [Cenomanian, Turonian, Coniacian, Santonian]
variants: [Pari Aike]
references:
  - id: novas2019a
    notes: >
      Keeps Mata Amarilla and Cerro Fortaleza apart and dates them separately:
      "the Mata Amarilla Formation is Cenomanian in age (approximately 97my;
      Varela et al., 2012), Cerro Fortaleza Formation is Campanian (around
      76.2Ma, based on studies by Sickman et al., 2018)". In the dinosaur
      succession of southwestern Santa Cruz the oldest assemblage is "the
      Cenomanian Mata Amarilla Formation", and carcharodontosaurid remains
      near the Shehuen River are said to agree with that age. The paper
      records that the correlations among these continental beds remain under
      intense debate.
  - id: sickmann2018a
    notes: >
      Folds the outcrops mapped as Mata Amarilla into the Cerro Fortaleza
      Formation and redates them: the "Cerro Fortaleza Formation" as delimited
      here "includes rocks that have sometimes been named 'Mata Amarilla
      Formation'", and thirteen detrital-zircon samples give maximum
      depositional ages showing the terrestrial deposits between Lago Viedma,
      Lago Argentino and Tres Lagos "are no older than Campanian". The single
      Cenomanian tuff age of Varela and colleagues (2012) is rejected on four
      grounds, among them that Cenomanian deep-marine facies lie between these
      terrestrial rocks and the Andean source to the west; the redefinition
      runs "from Cenomanian-Santonian to Campanian-Maastrichtian", though in
      the north of the basin "this age range may approach Santonian to
      Coniacian".
  - id: varela2012a
    notes: >
      Dates the middle section directly: twenty U-Pb laser-ablation spot
      analyses on zircons from a tuff 29 m above the lower/middle contact at
      Estancia Mata Amarilla give a concordia age of 96.2 +/- 0.7 Ma, "which
      corresponds to the middle Cenomanian", and the formation as a whole is
      "early Upper Cretaceous, extending from the Cenomanian to the
      Santonian". The onset of deposition of the lower section is bracketed to
      the "upper Albian-lower Cenomanian, ~100 Ma" because the underlying
      Piedra Clavada Formation is lower Albian. The paper was written because
      the invertebrate, dinosaur, fish, turtle, plesiosaur and floral evidence
      had given irreconcilable ages, among them a Maastrichtian assignment of
      the dinosaurs on the stratigraphic criteria of Kraemer and Riccardi
      (1997).
  - id: martínez2016a
    notes: >
      Gives "the Cenomanian" to "Coniacian Mata Amarilla Formation of Santa
      Cruz Province" and the angiosperm leaf assemblage recovered from it.
  - id: novas2013a
    notes: >
      Records the older name and gives the age of the Orkoraptor beds "(i.e.,
      Mata Amarilla Formation, former Pari Aike Formation)" as seemingly
      Cenomanian to Santonian.
  - id: bandeira2024a
    notes: >
      Tabulates Loncosaurus from the formation as Cenomanian.
