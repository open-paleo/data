name: Majiacun
rank: formation
period: [Late Cretaceous]
stages: [Cenomanian, Turonian, Coniacian, Santonian, Campanian, Maastrichtian]
references:
  - id: lü2010a
    notes: >
      Gives "Majiacun Formation (Upper Cretaceous: Coniacian-Campanian", with
      the Xixiasaurus type horizon in its "Mid-lower part", and infers from
      the troodontid's affinity with Byronosaurus that the formation "may be
      Campanian". Reviews the earlier readings: it "was described as
      Cenomanian to Turonian" by Zhou and colleagues (1983) on spores, pollen
      and dinosaur eggs, and on bivalves and gastropods "is regarded as
      Coniacian to Campanian ... and Santonian to Maastrichtian, respectively"
      by Chen and colleagues (2007) and Pan and colleagues (2007).
  - id: xing2014a
    notes: >
      Narrows the formation but resolves a bed within it: it "extends in age
      from the late Coniacian through to the end of the Santonian, the
      dinosaur-bearing bed very likely dates to the middle Santonian".
  - id: zhou1983a
  - id: chen2007a
  - id: pan2007a
