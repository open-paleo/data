name: Majiacun
rank: formation
period: [Late Cretaceous]
stages: [Turonian, Coniacian, Santonian, Campanian, Maastrichtian]
lithology: pebbly medium to coarse sandstone, fine sandstone and siltstone
references:
  - id: lü2010a
    notes: >
      Gives the formation as "Coniacian–Campanian", with the Xixiasaurus type
      horizon in its "Mid-lower part", and infers from the troodontid's affinity
      with Byronosaurus that it "may be Campanian".
  - id: xing2014a
    notes: >
      Narrows the formation but resolves a bed within it: it "extends in age
      from the late Coniacian through to the end of the Santonian, the
      dinosaur-bearing bed very likely dates to the middle Santonian".
  - id: zhou1983a
    notes: >
      Dates the formation "相当于土仑期至赛诺早期" ("corresponding to the
      Turonian to early Senonian", translated) from its dinosaur eggs, pollen
      and position. Source of the lithology.
  - id: chen2007a
  - id: pan2007a
  - id: wang2006a
    notes: >
      Cited by Lü and colleagues (2010) for correlating the formation with the
      Coniacian–Santonian.
