name: McRae
rank: group
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
lithology: fluvial channel and floodplain deposits
references:
  - id: lucas2019a
    notes: >
      Raises the McRae Formation to group rank, with the José Creek, Hall Lake
      and new Double Canyon formations, and dates the lower Hall Lake "Lancian
      (late Maastrichtian)" from its vertebrates. Source of the lithology.
  - id: amato2017a
    notes: >
      Dates the lower Jose Creek and the lowest Hall Lake late Campanian, from
      U–Pb dates of 75.0 ± 1.1 Ma on a dacite clast and 74.9 ± 1.1 to 73.2 ±
      0.7 Ma on four ash-fall tuffs.
