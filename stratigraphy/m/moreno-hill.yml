name: Moreno Hill
rank: formation
period: [Late Cretaceous]
stages: [Turonian]
lithology: thickly bedded mud and channel sandstone
references:
  - id: mcdonald2010a
    notes: >
      Gives "Moreno Hill Formation (middle Turonian)", with the horizon as
      "Lower member of the Moreno Hill Formation, middle Turonian, Upper
      Cretaceous".
  - id: wolfe1998a
    notes: >
      Independently gives "Moreno Hill Formation (Cretaceous, Turonian)".
  - id: cilliers2021a
    notes: >
      Describes its rock: "The Moreno Hill Formation, characterized by thickly
      bedded muds and associated channel sandstones, was originally named for
      deposits on the slopes of Zuni Plateau and Santa Rita Mesa (north of Zuni
      Salt Lake)".
