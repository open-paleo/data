name: Moreno Hill
rank: formation
period: [Late Cretaceous]
stages: [Turonian]
description: "The Moreno Hill Formation is a geological formation in western New Mexico whose strata were deposited in the Late Cretaceous. Dinosaur remains are among the fossils that have been recovered from the formation."
