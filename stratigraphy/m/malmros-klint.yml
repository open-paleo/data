name: Malmros Klint
rank: formation
parent: Fleming Fjord
period: [Late Triassic]
stages: [Norian]
references:
  - id: beccari2021a
    notes: >
      Gives "The Late Triassic (Norian) outcrops of the Malmros Klint
      Formation, Jameson Land (Greenland)", which "have yielded numerous
      specimens of non-sauropod sauropodomorphs".
  - id: clemmensen2020a
    notes: >
      Records that most vertebrate bones of the group "have been found in
      uppermost Malmros Klint Formation, and in the Carlsberg Fjord and Tait
      Bjerg Members".
