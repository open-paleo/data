name: Malmros Klint
rank: formation
parent: Fleming Fjord
period: [Late Triassic]
stages: [Norian]
lithology: brownish-red to grayish-red mudstone and fine-grained sandstone
references:
  - id: beccari2021a
    notes: >
      Gives "The Late Triassic (Norian) outcrops of the Malmros Klint
      Formation, Jameson Land (Greenland)", which "have yielded numerous
      specimens of non-sauropod sauropodomorphs".
  - id: clemmensen2020a
    notes: >
      Records that most vertebrate bones of the group "have been found in
      uppermost Malmros Klint Formation, and in the Carlsberg Fjord and Tait
      Bjerg Members". Source of the lithology.
  - id: kent1996a
    notes: >
      Ranks it a member of a Fleming Fjord Formation, 130 m thick at Tait Bjerg,
      and dates it to the late Norian by correlating its magnetostratigraphy
      with the Newark polarity sequence.
