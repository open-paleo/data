name: Malmros Klint
rank: formation
parent: Fleming Fjord
period: [Late Triassic]
stages: [Norian]
references:
  - id: beccari2021a
    notes: >
      Gives "The Late Triassic (Norian) outcrops of the Malmros Klint
      Formation, Jameson Land (Greenland)", which "have yielded numerous
      specimens of non-sauropod sauropodomorphs".
  - id: clemmensen2020a
    notes: >
      Records that most vertebrate bones of the group "have been found in
      uppermost Malmros Klint Formation, and in the Carlsberg Fjord and Tait
      Bjerg Members".
  - id: kent1996a
    notes: >
      Ranks it the Malmros Klint Member of a Fleming Fjord Formation, 130 m
      thick at Tait Bjerg. On the preferred correlation of its
      magnetostratigraphy with the Newark polarity sequence, the sampled
      section, the member and the lower Ørsted Dal Member, runs "from the just
      within magnetochron E16n (ca. 207.5 Ma) to magnetochron E19n (ca. 211
      Ma), representing a duration of about 3.5 m.y. in the late Norian", and
      the member "accumulated in a little more than 2 m.y.".
