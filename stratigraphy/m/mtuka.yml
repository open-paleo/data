name: Mtuka
rank: member
parent: Galula
period: [Early Cretaceous, Late Cretaceous]
stages: [Aptian, Albian, Cenomanian]
lithology: coarse sandstone and conglomerate interbedded with paleosol mudstone
references:
  - id: widlansky2018a
    notes: >
      Dates the member "likely Aptian – Cenomanian" from its dominantly normal
      polarity, consistent with the Cretaceous Normal Superchron, and its
      position below the Namba Member. Source of the lithology.
  - id: gorscak2019a
    notes: >
      Gives "newly constrained ages for the Mtuka Member (Aptian–Cenomanian)"
      and sets it below the younger Namba Member of the same formation.
  - id: bandeira2024a
    notes: >
      Calls the member Aptian in passing, listing Mnyamawamtuka "from the
      Aptian Mtuka Member of the Galula Formation" among titanosaurs with
      procoelous caudal vertebrae, with no argument for the age.
