name: Mtuka
rank: member
parent: Galula
period: [Early Cretaceous, Late Cretaceous]
stages: [Aptian, Albian, Cenomanian]
description: "The Mtuka Member is a member of the Galula Formation south of Lake Rukwa in Tanzania. Its age is poorly constrained; based on geomagnetic reversals it is likely Aptian to Cenomanian in age, while the Namba Member is Cenomanian to Campanian. It is 160–180 m thick in the type section, and is typified by coarser sandstone, a higher frequency of conglomerates, higher proportions of extraformational clasts, thicker and a greater frequency of overbank siltstone and mudstone lenses and a higher proportion of paleosols."
references:
  - id: widlansky2018a
    notes: >
      Magnetostratigraphy leaves the member spanning both epochs: it "is
      likely Aptian–Cenomanian given its normal polarity and stratigraphic
      position below the Namba Member", about 150 m of section "dominated by
      normal polarity, consistent with deposition in the lower portion of the
      CNS". The Late Cretaceous assignment in the same study belongs to the
      overlying Namba Member, "no older than Late Cretaceous
      (Cenomanian–Campanian)"; the paleomagnetic poles, which are calculated
      for the two members together and overlap ages from 100 to 30 Ma, are the
      one place the Mtuka is drawn into a Late Cretaceous reading.
  - id: gorscak2019a
    notes: >
      Gives "newly constrained ages for the Mtuka Member (Aptian–Cenomanian)"
      and sets it below the younger Namba Member of the same formation.
  - id: bandeira2024a
    notes: >
      Narrows the occurrence, Mnyamawamtuka coming from "the Aptian Mtuka
      Member of the Galula Formation".
