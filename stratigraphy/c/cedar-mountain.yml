name: Cedar Mountain
rank: formation
period: [Early Cretaceous, Late Cretaceous]
stages: [Berriasian, Valanginian, Hauterivian, Barremian, Aptian, Albian, Cenomanian]
lithology: silty to sandy mudstone in pastel colors, with a thin basal
  conglomeratic sandstone
references:
  - id: sprinkel2012a
    notes: >
      Dates the formation in northeastern Utah "early to late Albian" from a
      detrital zircon age near the Abydosaurus skull, and in central and
      southern Utah possibly Barremian to earliest Cenomanian.
  - id: mori2009a
    notes: >
      Gives detrital zircon age brackets for each member, from 125 to 121 Ma for
      the Yellow Cat and Poison Strip to mid-Albian to mid-Cenomanian for the
      Mussentuchit.
  - id: kirkland2007a
    notes: >
      Dates the formation Barremian to Albian on paleontological and geological
      evidence, and the Mussentuchit Member "early Cenomanian" from a volcanic
      ash.
  - id: kirkland2016a
    notes: >
      Recounts how Stokes (1952) renamed the Cedar Mountain Shale a formation
      with the Buckhorn Conglomerate as its basal member, on a type section at
      Cedar Mountain in the San Rafael Swell.
  - id: joeckel2019a
    notes: >
      Dates the Yellow Cat Member, low in the formation, from detrital zircons
      and a palynoflora, and assigns it "Berriasian-Hauterivian ages".
  - id: stokes1952a
    notes: >
      Cited by Kirkland and colleagues (2016) for renaming the shale the Cedar
      Mountain Formation with the Buckhorn as its basal member.
  - id: tschudy1984a
    notes: >
      Source of the lithology.
