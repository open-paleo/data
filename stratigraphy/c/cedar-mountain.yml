name: Cedar Mountain
rank: formation
period: [Early Cretaceous, Late Cretaceous]
stages: [Berriasian, Valanginian, Hauterivian, Barremian, Aptian, Albian, Cenomanian]
references:
  - id: sprinkel2012a
    notes: >
      In central and southern Utah the formation is "Barremian(?) to earliest
      Cenomanian based on dinosaur biostratigraphy" and radiometric data,
      while in northeastern Utah "Its age in northeastern Utah is early to
      late Albian", resting on a detrital zircon age of 104.46 +/- 0.95 Ma
      associated with the Abydosaurus skull and on palynology from the
      overlying Dakota Formation. Sprinkel and colleagues also hold that these
      northeastern beds are not time equivalent to the Mussentuchit Member of
      the western San Rafael Swell, so the Albian age applies to the region
      rather than to the whole unit.
  - id: mori2009a
    notes: >
      Detrital zircon brackets run member by member: "the Yellow Cat/Poison
      Strip Members range from 125 to 121 Ma (Early Aptian)", "the Ruby Ranch
      Member ranges from 120 - 117 Ma to 111 Ma (Late Aptian to earliest
      Albian)", and "the Mussentuchit Member ranges from about 109 - 105 Ma to
      99 to 96 Ma (mid-Albian to mid-Cenomanian) and perhaps as young as 91 Ma
      (Turonian)". Anomalously young zircons from the overlying Dakota
      Sandstone leave Mori willing to let the Mussentuchit fauna "range to
      late Cenomanian or early Turonian", a limit he says needs checking in a
      future study. Earlier plant biostratigraphy had put the whole formation
      "between Barremian and Cenomanian".
  - id: kirkland2007a
    notes: >
      Paleontological and geological evidence "suggests an age range of
      Albian-Barremian is represented in the Cedar Mountain Formation", while
      an ash within the uppermost Mussentuchit Member "indicates an early
      Cenomanian age" and correlates with the Mowry Shale "near the base of
      the Upper Cretaceous". Kirkland and Madsen argue against extending the
      name to the basal Cretaceous of southwestern Utah, because those
      conglomerates are not contiguous with the type area and were derived
      from different source areas.
  - id: kirkland2016a
    notes: >
      Gives the naming history and the basal member: "Stokes (1952) renamed
      the shale the Cedar Mountain Formation and included the Buckhorn
      Conglomerate Member as its basal member", on a type section "on the
      southwest flank of Cedar Mountain at the north end of the San Rafael
      Swell". Its southwestern Utah exposures are "of latest Albian to
      earliest Cenomanian" age; the formation as a whole is older at the base.
