name: Cerro Lisandro
rank: formation
parent: Neuquén
period: [Late Cretaceous]
stages: [Cenomanian, Turonian]
variants: [Lisandro]
lithology: red mudstone, with thin siltstone and fine sandstone beds
references:
  - id: leanza2004a
    notes: >
      Places it in its subgroup and dates it: the Río Limay Subgroup "is
      composed of the Candeleros, Huincul and Cerro Lisandro formations, with
      a thickness of at least 350 m", and "the age of the Cerro Lisandro
      Formation can be regarded as Late Cenomanian-Early Turonian".
  - id: gonzálezriga2013a
    notes: >
      Gives "the Cerro Lisandro Formation (middle-late Turonian, Upper
      Cretaceous)".
  - id: garrido2010a
    notes: >
      Assigns the formation tentatively to the middle to late Turonian on its
      stratigraphic relations, as no dates or biostratigraphy exist for it.
      Source of the lithology.
  - id: legarreta1989a
  - id: hugo2001a
    notes: >
      Assigns the formation to the late Cenomanian–early Turonian, and places it
      in a "Cenomanian-lower Turonian Limay Subgroup" of the Neuquén Group.
