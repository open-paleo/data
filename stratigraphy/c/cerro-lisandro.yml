name: Cerro Lisandro
rank: formation
parent: Neuquén
period: [Late Cretaceous]
stages: [Cenomanian, Turonian]
references:
  - id: leanza2004a
    notes: >
      Places it in its subgroup and dates it: the Río Limay Subgroup "is
      composed of the Candeleros, Huincul and Cerro Lisandro formations, with
      a thickness of at least 350 m", and "the age of the Cerro Lisandro
      Formation can be regarded as Late Cenomanian-Early Turonian".
  - id: gonzálezriga2013a
    notes: >
      Gives "the Cerro Lisandro Formation (middle-late Turonian, Upper
      Cretaceous)".
  - id: garrido2010a
    notes: >
      With neither absolute dates nor biostratigraphy for the unit, the age is
      taken from its stratigraphic relationships: "Fm. Cerro Lisandro is
      tentatively assigned in this work to the Middle – Upper Turonian". Hugo
      and Leanza (2001) and Leanza and colleagues (2004) instead "place this
      unit between the Late Cenomanian and the Early Turonian", and the 91 to
      90 Ma of Legarreta and Gulisano (1989) would make it Middle Turonian.
  - id: legarreta1989a
  - id: hugo2001a
    notes: >
      Sets out the Neuquen Group's three subgroups with a span for each: "the
      Cenomanian-lower Turonian Limay Subgroup comprising the Candeleros,
      Huincul and Cerro Lisandro Formations; the upper Turonian-Coniacian Rio
      Neuquen Subgroup including the Portezuelo and Plottier Formations; and
      the Santonian-lower Campanian Rio Colorado Subgroup comprising the Bajo
      de la Carpa and Anacleto Formations." The statement is made twice in
      identical terms, and dates the group as a whole "from early Cenomanian
      (97 plus or minus 3 Ma) to early Campanian (74 plus or minus 3 Ma)".
