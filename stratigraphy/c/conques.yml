name: Conques
rank: formation
parent: Tremp
period: [Late Cretaceous]
stages: [Maastrichtian]
references:
  - id: prieto-márquez2019a
    notes: >
      Places it in the "Conques Formation and uppermost Maastrichtian"
      interval. It is one of three formations of the Tremp Group defined and
      datable only in the eastern Tremp Syncline; facies alone will not
      separate it from the Talarn, both being red fluvial beds, so the
      magnetochron does the work — C31r with red fluvial floodplain is this
      unit, C29r is the Talarn.
  - id: augustin2023a
    notes: >
      Treats it as a member, placing the Pareisactus scapula in "the Upper
      Cretaceous (lower Maastrichtian) Conques Member of the Tremp Formation
      in north-eastern Spain".
  - id: cuevas1992a
    notes: >
      Erects the unit as the "Formación Lutitas, Areniscas y Conglomerados de
      Conques", with the Tossal d'Obà and Basturs Limestones members, in the Tremp
      Group. The type section is in the Barranco de Basturs, about 400 m thick, of
      variegated mudstones with lenticular sandstones; the base passes gradually
      into the Posa Formation and the top passes rapidly into the red mudstones of
      the Talarn. Gives no age of its own.
  - id: díez-canseco2014a
    notes: >
      Equates the Conques and Talarn formations together with its Lower Red
      Unit, after Cuevas (1992) and others, and dates that unit from planktonic
      foraminifera: "In situ assemblages indicate an early to late Maastrichtian
      age for the Grey Unit and the Lower Red Unit".
  - id: fondevilla2019a
    notes: >
      In the Orcau section of the northern Isona sector, places "the complete La
      Posa and Conques formations" in the early Maastrichtian, within chron C31r,
      on foraminiferal zones and magnetostratigraphy, and rejects the late
      Maastrichtian that earlier work gave them. In the southern Isona sector only
      the lower part of the formation is dated, likely within C31r.
  - id: pujalte2005a
    notes: >
      Assigns to the Conques the variegated mudstones at the base of the
      Esplugafreda section that Cuevas (1992) included in the Talarn, because they
      lack carbonate paleosols and Microcodium, and labels the formation
      Maastrichtian.
