name: Conques
rank: formation
parent: Tremp
period: [Late Cretaceous]
stages: [Maastrichtian]
references:
  - id: prieto-márquez2019a
    notes: >
      Places it in the "Conques Formation and uppermost Maastrichtian"
      interval. It is one of three formations of the Tremp Group defined and
      datable only in the eastern Tremp Syncline; facies alone will not
      separate it from the Talarn, both being red fluvial beds, so the
      magnetochron does the work -- C31r with red fluvial floodplain is this
      unit, C29r is the Talarn.
  - id: augustin2023a
    notes: >
      Treats it as a member, placing the Pareisactus scapula in "the Upper
      Cretaceous (lower Maastrichtian) Conques Member of the Tremp Formation
      in north-eastern Spain".
