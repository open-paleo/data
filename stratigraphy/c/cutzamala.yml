name: Cutzamala
rank: formation
period: [Late Cretaceous]
lithology: reddish to gray conglomerate and sandstone, with lesser shale and
  andesitic layers
dispute:
  summary: >
    Martini and colleagues (2009) find that "The age of the Cutzamala
    Formation is not well constrained": a lava flow in the basal beds gives 84
    Ma, "indicating a possible maximum age of late Santonian", pollen and
    hadrosaur remains put the lower part in the Maastrichtian and the Late
    Cretaceous, and for the upper part they "suggest a Paleocene and/or
    earliest Eocene age". Villanueva-Amadoz and colleagues (2014) set
    palynology from La Barranca de los Bonetes, reported by Martínez-Hernández
    and colleagues (2000), by which "the palynological association studied
    determines an age younger than the late Paleocene", against hadrosaur
    remains from the same section that Benammi and colleagues (2005)
    attributed "to the Late Cretaceous in a broad sense", the two readings
    resting partly on the same pollen association. Ramírez-Velasco (2022)
    gives the Huehuecanauhtlus horizon as "from the Late Santonian".
references:
  - id: martini2009a
    notes: >
      Divides the formation into a lower folded and an upper unfolded part, and
      finds its age "not well constrained": Late Cretaceous below, perhaps
      Paleocene or earliest Eocene above. Source of the lithology.
  - id: villanueva-amadoz2014a
    notes: >
      Reviews the long debate over a Late Cretaceous or Paleogene age, setting
      pollen read as younger than the late Paleocene against hadrosaur remains
      from the same section.
  - id: ramírez-velasco2022a
    notes: >
      Gives the Huehuecanauhtlus horizon as the Cutzamala Formation "exposed
      in Tuzantla, Michoacan, southern Mexico, from the Late Santonian", and
      resolves it further to the Barranca Los Bonetes Unit.
  - id: benammi2005a
    notes: >
      Reports hadrosaur remains from three levels at Barranca Los Bonetes and
      restudies pollen from a lower level of the same section; the pollen
      gives "a maximum age of Maastrichtian" (translated), and the hadrosaurs
      make the deposits Late Cretaceous.
  - id: ramírez-velasco2012a
    notes: >
      Describes Huehuecanauhtlus from Barranca Los Bonetes, in "an unnamed
      formation", and dates the beds Santonian, "between 86.8 and 84 Ma", from
      radiometric data and magnetostratigraphy it cites rather than reports:
      Benammi and colleagues (2006), a conference abstract, and Mariscal-Ramos
      (2006), a master's thesis.
  - id: benammi2006a
  - id: mariscal-ramos2006a
  - id: martínez-hernández2000a
  - id: campa-uranga1979a
    notes: >
      Cited by Martini and colleagues (2009) as the work that introduced the
      Cutzamala Formation.
