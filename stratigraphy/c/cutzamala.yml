name: Cutzamala
rank: formation
period: [Late Cretaceous]
stages: [Santonian]
references:
  - id: martini2009a
    notes: >
      The naming authority and the unit's own account of its age. The
      formation "was introduced by Campa-Uranga and Ramirez (1979) to describe
      a thick succession of continental red beds widely exposed along the
      Cutzamala River basin, east of the village of San Lucas", and is divided
      here "into a lower folded part and an upper unfolded part". "The age of
      the Cutzamala Formation is not well constrained": a lava flow
      interbedded in the basal beds near the dinosaur site gives 84 Ma,
      "indicating a possible maximum age of late Santonian", while pollen and
      hadrosaur remains put the lower part in the Maastrichtian and the Late
      Cretaceous. For the upper part, "No data are available", and the authors
      "suggest a Paleocene and/or earliest Eocene age".
  - id: villanueva-amadoz2014a
    notes: >
      Records the long disagreement over the age. The 1979 assignment to the
      Late Cretaceous "provoked a debate among different authors who disagreed
      between Late Cretaceous or Paleogene", and at La Barranca de los Bonetes
      two results from one section stand unreconciled: palynology, reported by
      Martínez-Hernández and colleagues (2000), by which "the palynological
      association studied determines an age younger than the late Paleocene",
      and the hadrosaur remains Benammi and colleagues (2005) found "in the
      same stratigraphic column (La Barranca de los Bonetes) where the
      aforementioned palynological samples were collected", which they
      attributed "to the Late Cretaceous in a broad sense". The two readings
      rest partly on the same material: that association "was restudied in
      greater detail by Benammi et al. (2005)", and the younger reading is
      "based according to Benammi et al. (2005) on the last occurrence of
      these taxa", where Martini and colleagues (2009) read Momipites from the
      same section on first occurrence.
  - id: ramírez-velasco2022a
    notes: >
      Gives the Huehuecanauhtlus horizon as the Cutzamala Formation "exposed
      in Tuzantla, Michoacan, southern Mexico, from the Late Santonian", and
      resolves it further to the Barranca Los Bonetes Unit.
