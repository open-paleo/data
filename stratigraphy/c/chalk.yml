name: Chalk
rank: group
period: [Late Cretaceous]
stages: [Cenomanian, Turonian, Coniacian, Santonian, Campanian, Maastrichtian]
lithology: chalk, with or without flint, and discrete marl, calcarenite and
  phosphatic beds
references:
  - id: hopson2005a
    notes: >
      The dedicated lithostratigraphy, which defines the group and its internal
      divisions including the Grey Chalk Subgroup that holds the West Melbury
      Marly Chalk, and gives the group's age as "Upper Cretaceous, Cenomanian to
      Maastrichtian." Records that the Hunstanton Formation, though a formation,
      is "not part of the newly defined Chalk Group, and as defined it is older
      than the major hiatus at the base of the Cenomanian". Describes its rock:
      "Chalk, with or without flint and discrete marl, sponge, calcarenite,
      phosphatic, hardground and fossil-rich beds."
