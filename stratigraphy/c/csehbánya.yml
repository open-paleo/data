name: Csehbánya
rank: formation
period: [Late Cretaceous]
stages: [Santonian]
description: "The Csehbánya Formation is a geological formation in the Transdanubian Mountains of Veszprém County, Hungary. The formation dates to the Late Santonian (around 85-84 million years ago) of the Late Cretaceous. It represents a floodplain environment as opposed to the swampy lacustrine environment of the simultaneous Ajka Coal Formation, though there is complete overlap in terms of fauna. It underlies the Jákó Marl Formation, and laterally transitions to the Ajka Coal Formation."
references:
  - id: ősi2005a
    notes: >
      States that the "Csehbanya Formation is Santonian" and gives the
      Hungarosaurus type horizon as "Csehbanya Formation, Upper Cretaceous
      (Santonian)", spelling the name without diacritics.
  - id: ősi2012a
    notes: >
      Independently gives the "Csehbánya Formation ... of Santonian" age, and
      describes Mochlodon vorosi from "the Upper Cretaceous (Santonian)
      continental deposits of the Csehbánya Formation of Iharkút, western
      Hungary".
