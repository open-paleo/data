name: Cancha de Bochas
rank: member
parent: Ischigualasto
period: [Late Triassic]
stages: [Carnian]
references:
  - id: martínez2025a
    notes: >
      Gives "Cancha de Bochas Member, Ischigualasto Formation, late Carnian".
  - id: alcober2010a
    notes: >
      The Sanjuansaurus type horizon, in the member "40 m above the base of
      the Ischigualasto Formation", is given as "Late Triassic, Carnian (ca.
      231.4 Ma)" and "lies at approximately the same level as the dated ash,
      which implies a late Carnian age for the specimen."
  - id: currie2009a
    notes: >
      Erects the member, the second of four in the formation: "The Cancha de
      Bochas Member consists of ~65–125 m of mudstone and sandstone, with rare
      interbeds of bentonite and basalt", named for the Cancha de Bochas area
      of Ischigualasto Provincial Park. "The base of the member is placed at
      the first mudstone containing calcareous nodules above the base of the
      formation", and its top at "the top of the upper most mudstone
      containing calcareous nodules in the lower 1/3 of the formation".
      Vertebrates and volcanic ages "indicate a Carnian age of deposition for
      all of the lithostratigraphic members", and its stratigraphic chart
      places the 227.8 ± 0.3 Ma sanidine date of Rogers and colleagues (1993)
      in the member.
  - id: ezcurra2010a
    notes: >
      The bentonite "sampled approximately 80 m above the base of the
      formation (Cancha de Bochas Member)" gave Rogers and colleagues (1993)
      227.8 ± 0.3 Ma, recalculated by Furin and colleagues (2006) to "about
      230.3–231.4 ± 0.3 Ma". Gives the Chromogisaurus holotype, from the lower
      member at Valle Pintado, as "late Carnian, 230.3–231.4 ± 0.3 Ma".
  - id: rogers1993a
  - id: furin2006a
