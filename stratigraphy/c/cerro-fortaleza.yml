name: Cerro Fortaleza
rank: formation
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
references:
  - id: novas2019a
    notes: >
      Gives the age and the open question beside it: the dinosaur-bearing
      deposits of the "Cerro Fortaleza Formation (radimetrically dated as
      Campanian; Sickman et al., 2018)", and asks whether the Chorrillo
      Formation is equivalent to it.
  - id: sickmann2018a
    notes: >
      Detrital zircon from samples "throughout the terrestrial Cerro Fortaleza
      Formation" between Lago Viedma and Lago Argentino gives "maximum
      depositional ages throughout the Campanian", the highest at 76.2 +/- 1.6
      Ma, and the paper calls the unit "Campanian-Maastrichtian(?)". In the
      southeast of its study area the Eocene Man Aike Formation rests
      unconformably "on Campanian to Maastrichtian rocks (Cerro Fortaleza
      Formation)".
  - id: santucci2022a
    notes: >
      Gives the Dreadnoughtus holotype and paratype as from the "Cerro
      Fortaleza Formation, Magallanes-Austral Basin, Campanian-Maastrichtian
      (Upper Cretaceous", following Sickmann and colleagues (2018), but the
      Puertasaurus type locality as "Cerro Fortaleza Formation (=Pari Aike
      Formation), Magallanes-Austral Basin, Campanian (Upper Cretaceous)".
