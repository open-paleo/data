name: Cannonball
rank: member
parent: Öösh
period: [Early Cretaceous]
stages: [Berriasian, Valanginian, Hauterivian, Barremian, Aptian, Albian]
variants: [Psittacosaurus beds]
lithology: greenish-gray sandstone and siltstone alternating with red siliceous
  clay and concretionary sandstone
references:
  - id: rougier2001a
    notes: >
      Gives the containment under the older spelling of the formation,
      "Cannonball Member of Oshih Formation of Berkey and Morris (1927),
      possibly equivalent of Tevsh Formation (Undurukhin),
      Valanginian-Neocomian", and places the mammal material in "the middle
      section of the gray-whitish Cannonball Member at the Oshih Depression".
  - id: andres2005a
    notes: >
      Dates the beds themselves rather than the formation, and as alternatives
      rather than a span: "LOCALITY AND HORIZON: 'Cannonball' beds of the Oosh
      Formation (type area) ... AGE: Early Cretaceous (Berriasian-Valanginian or
      Aptian-Albian)." The two ranges do not touch, and the paper holds them
      apart. Source of the lithology.
  - id: berkey1927a
    notes: >
      Names the unit as the "cannonball" group, the group nearest the base of
      the Oshih formation, and calls it the Cannonball member and the
      "Psittacosaurus beds".
  - id: prieto-márquez2012d
    notes: >
      Gives the modern rank and parent: "The lower part of the Öösh Formation
      also includes the Cannonball Member (Berkey & Morris 1927), which is
      characterized by large cannonball-shaped sandstone concretions".
