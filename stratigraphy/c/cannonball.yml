name: Cannonball
rank: member
parent: Öösh
period: [Early Cretaceous]
variants: [Psittacosaurus beds]
references:
  - id: rougier2001a
    notes: >
      Gives the containment under the older spelling of the formation,
      "Cannonball Member of Oshih Formation of Berkey and Morris (1927),
      possibly equivalent of Tevsh Formation (Undurukhin),
      Valanginian-Neocomian", and places the mammal material in "the middle
      section of the gray-whitish Cannonball Member at the Oshih Depression".
  - id: andres2005a
    notes: >
      Dates the beds themselves rather than the formation, and as alternatives
      rather than a span: "LOCALITY AND HORIZON: ''Cannonball'' beds of the
      Oosh Formation (type area) ... AGE: Early Cretaceous
      (Berriasian-Valanginian or Aptian-Albian)." The two ranges do not touch,
      and the paper holds them apart.
  - id: berkey1927a
    notes: >
      Names the unit as the first of the Oshih formation's groups: "A group of
      greenish-gray sandstones alternates with red, hard, siliceous clays and
      red, concretionary sandstones. This is the 'cannonball' group, in which
      spherical sandstone concretions are found. It is surely more than two
      hundred feet thick, lies nearer than any other unit to the base of the
      Oshih formation"; summarized as "The 'cannonball' group of sandstones
      and sandy clays, the 'Psittacosaurus beds'", and captioned "the
      Cannonball member of the Oshih formation (Psittacosaurus beds)".
  - id: prieto-márquez2012d
    notes: >
      Gives the modern rank and parent: "The lower part of the Öösh Formation
      also includes the Cannonball Member (Berkey & Morris 1927), which is
      characterized by large cannonball-shaped sandstone concretions".
