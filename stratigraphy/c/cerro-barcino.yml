name: Cerro Barcino
rank: formation
parent: Chubut
period: [Early Cretaceous, Late Cretaceous]
stages: [Aptian, Albian, Cenomanian, Turonian]
references:
  - id: carrano2012a
    notes: >
      Gives a member inside it, "the Albian-Cenomanian Bayo Overo Member of
      the Cerro Barcino Formation at Paso de Indios".
  - id: rauhut2004a
    notes: >
      Places it in its group and puts the probable source of Genyodectes in
      "the lower part of the Cerro Barcino Formation (Chubut Group;
      Aptian-Albian)". Dates its lower two units as "the Puesto la Paloma
      (Barremian-Aptian) and Cerro Castaño (Aptian-Albian) members", and gives
      the Genyodectes horizon as "?Cerro Castaño Member, Cerro Barcino
      Formation; Aptian-Albian, Lower Cretaceous".
  - id: canale2014a
    notes: >
      Uses the narrower "Cerro Barcino Formation (Albian ...)" for the Cerro
      Castaño Member, while the formation as a whole "has been regarded as
      Hauterivian to Senonian (Campanian?) in age" after Page and colleagues
      (1999), who give it no Hauterivian.
  - id: page1999a
    notes: >
      A synthesis chapter: relays a partly Senonian Puesto Manuel Arce, a
      Turonian–Coniacian Bayo Overo and a Barremian–Campanian formation, and
      infers a Campanian–lower Maastrichtian Puesto Manuel Arce from its
      conformable passage into the Salamanca Formation.
  - id: nullo1983a
    notes: >
      Maps two of its members on the Pampa de Agnia sheet, the Puesto La Paloma
      below and the Cerro Castaño above, in gradational contact, and gives
      their lithologies and thicknesses. Its member ages, a possibly Barremian
      lower Puesto La Paloma and a possibly Aptian Cerro Castaño, are relayed
      and hedged.
  - id: bonaparte1979c
    notes: >
      Uses an older scheme, a "Cerro Barcino Member" in "the upper part of the
      Gorro Frigio Formation", dated Aptian on the ostracods and charophytes
      of Musacchio and Chebli (1975); the authors find the primitive vertebrae
      of Chubutisaurus consistent with that age.
  - id: musacchio1975a
    notes: >
      Dates the member, as the Cerro Barcino Member of the Gorro Frigio
      Formation, by its own ostracods and charophytes at Paso de Indios: "a
      Lower Cretaceous age (near to or just Aptian)".
