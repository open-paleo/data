name: Cerro Barcino
rank: formation
parent: Chubut
period: [Early Cretaceous, Late Cretaceous]
stages: [Hauterivian, Barremian, Aptian, Albian, Cenomanian, Turonian,
  Coniacian, Santonian, Campanian]
references:
  - id: carrano2012a
    notes: >
      Gives a member inside it, "the Albian-Cenomanian Bayo Overo Member of
      the Cerro Barcino Formation at Paso de Indios".
  - id: rauhut2004a
    notes: >
      Places it in its group and puts the probable source of Genyodectes in
      "the lower part of the Cerro Barcino Formation (Chubut Group;
      Aptian-Albian)". Dates its lower two units as "the Puesto la Paloma
      (Barremian-Aptian) and Cerro Castaño (Aptian-Albian) members", and gives
      the Genyodectes horizon as "?Cerro Castaño Member, Cerro Barcino
      Formation; Aptian-Albian, Lower Cretaceous".
  - id: canale2014a
    notes: >
      Uses the narrower "Cerro Barcino Formation (Albian ...)" for the Cerro
      Castaño Member, while the formation as a whole "has been regarded as
      Hauterivian to Senonian (Campanian?) in age" after Page and colleagues
      (1999).
  - id: page1999a
  - id: nullo1983a
    notes: >
      Maps two of its members on the Pampa de Agnia sheet, the Puesto La
      Paloma below and the Cerro Castaño above, in gradational contact. The
      Puesto La Paloma, light green rhyodacitic tuffs, is 40.5 m thick at
      cañadón La Primavera; the Cerro Castaño, tuffites and tuffaceous
      sandstones, is a partial 54 m. The formation is overlain by the Bajo El
      Pajarito Formation or, where that is absent, by Tertiary basalts.
  - id: bonaparte1979c
    notes: >
      Uses an older scheme, a "Cerro Barcino Member" in "the upper part of the
      Gorro Frigio Formation", dated Aptian on the ostracods and charophytes
      of Musacchio and Chebli (1975); the authors find the primitive vertebrae
      of Chubutisaurus consistent with that age.
  - id: musacchio1975a
