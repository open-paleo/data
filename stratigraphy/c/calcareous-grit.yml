name: Calcareous Grit
rank: formation
informal: true
period: [Late Jurassic]
stages: [Oxfordian]
references:
  - id: galton1985d
    notes: >
      Gives the Priodontognathus maxilla as probably from "the Calcareous
      Grit (Oxfordian, Upper Jurassic) of Yorkshire", on Seeley (1893).
  - id: hoffstetter1957a
    notes: >
      Reaches the same unit from the matrix rather than the recorded horizon,
      Judd and Etheridge finding that the Pecten fibrosus it contains "appears
      to correspond to the Calcareous Grit (Corallian) of Yorkshire; this is the
      most probable estimate, in any case the only one resting on concrete
      argumentation".
  - id: barron2012a
    notes: >
      Uses the fuller name for the lower part, the "Lower Calcareous Grit
      Formation (Oldstead Oolite Member)", which in the Hambleton Hills rests
      unconformably on the Osgodby Formation.
  - id: seeley1893a
    notes: >
      The primary for the matrix attribution: the matrix "resembled Calcareous
      Grit" and held Pecten fibrosus, on which Judd and Etheridge suggested the
      Calcareous Grit of Yorkshire. Names no stage.
  - id: cope1980a
    notes: >
      Sets out a Lower Calcareous Grit Formation in the Lower Oxfordian and an
      Upper Calcareous Grit Formation in the Upper Oxfordian in its Yorkshire
      columns (Fig. 11b).
