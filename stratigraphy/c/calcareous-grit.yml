name: Calcareous Grit
rank: formation
period: [Late Jurassic]
stages: [Oxfordian]
references:
  - id: galton1985d
    notes: >
      Gives the Priodontognathus maxilla as probably from "the Calcareous
      Grit (Oxfordian, Upper Jurassic) of Yorkshire", on Seeley (1893).
  - id: hoffstetter1957a
    notes: >
      Reaches the same unit from the matrix rather than the record, Judd and
      Etheridge finding that the Pecten fibrosus it contains "appears to
      correspond to the Calcareous Grit (Corallian) of Yorkshire; this is the
      most probable estimate, in any case the only one resting on concrete
      argumentation".
  - id: barron2012a
    notes: >
      Uses the fuller name for the lower part, the "Lower Calcareous Grit
      Formation (Oldstead Oolite Member)", which in the Hambleton Hills rests
      unconformably on the Osgodby Formation.
  - id: seeley1893a
    notes: >
      Names no stage: the paper's terms are lithostratigraphic throughout -
      Coralline Oolite, Corallian, Calcareous Grit, Oxford Clay - and it
      contains no Oxfordian and no Jurassic. The parenthesis "(Oxfordian,
      Upper Jurassic)" that Galton (1985) attaches when citing this paper is
      his modernisation, not Seeley's wording.
      It is the primary for the matrix attribution: "There was no evidence of
      the stratigraphical position of the fossil other than the matrix in
      which it was contained which resembled Calcareous Grit, and a fossil
      within it which is a typical example of the variety of Pecten vagans,
      named P. fibrosus. On this evidence Professor Judd, F.R.S., and Mr. R.
      Etheridge, F.R.S. ... suggested that the fossil was from the Calcareous
      Grit of Yorkshire."
      The paper concerns two specimens and only one has a locality. The femur
      is from a quarry near Slingsby with an 1838 label quoted in full; the
      maxilla has no stratigraphic evidence beyond the matrix and no
      traceable earlier history. Seeley only raises the possibility that they
      are one animal - "It is possible that it may be a portion of the head
      of the Slingsby reptile ... If this suggestion should be supported by
      further evidence" - so the maxilla does not inherit the Slingsby
      locality.
