name: Calizas de La Huérguina
rank: formation
period: [Early Cretaceous]
stages: [Barremian]
variants: [La Huérguina]
references:
  - id: pittman2020a
    notes: >
      An appendix locality table gives "Calizas de la Huérguina Formation
      (128.5–125 Ma)" for the Las Hoyas enantiornithines, with no error stated
      on either end. Converted against this project's own stage boundary
      table, that span opens in the Hauterivian and closes in the Barremian,
      crossing the boundary at 125.77 Ma.
  - id: ortega2010a
    notes: >
      Gives "Calizas de La Huérguina Formation, Upper Barremian (Lower
      Cretaceous); La Cierva township, Cuenca, Spain", for the Las Hoyas site.
      In the Spanish construction "Calizas de" is the head noun, not an
      appended rank word. The disagreement that remains is below stage level:
      this reading is upper Barremian where Perez-Moreno and colleagues (1994)
      give lower.
  - id: carrano2012a
    notes: >
      Independently gives "Las Hoyas locality, La Cierva township, Cuenca,
      Spain; Calizas de La Huérguina Formation; late Barremian, Early
      Cretaceous".
  - id: pérez-moreno1994a
    notes: >
      Dates the Las Hoyas fossil site, which yielded the Pelecanimimus
      holotype, as "Calizas de La Huérguina Formation, Upper Hauterivian–Lower
      Barremian (Lower Cretaceous)". This is the only Hauterivian reading for
      the unit and nothing has re-asserted it since; later work places the
      site in the Barremian.
