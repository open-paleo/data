name: Cañadón Calcáreo
rank: formation
period: [Late Jurassic]
stages: [Oxfordian, Kimmeridgian, Tithonian]
lithology: sandstone, conglomerate, laminated shale and tuff
references:
  - id: rauhut2017a
    notes: >
      Dates the formation "Late Jurassic (Oxfordian–Tithonian)", and describes
      it as post-rift terrestrial fill of the Cañadón Asfalto Basin, lacustrine
      at the base and fluvial above.
  - id: reutter2026a
    notes: >
      Gives the Bicharracosaurus horizon as "Higher parts of the Cañadón
      Calcáreo Formation, Oxfordian-Kimmeridgian, Late Jurassic", following
      Cúneo and colleagues (2013), and says the base "was dated (157.4 Mya) to
      the Oxfordian-Kimmeridgian boundary".
  - id: carballido2011a
    notes: >
      Dates it "most probably Oxfordian-Tithonian".
  - id: cúneo2013a
    notes: >
      Rejects the Early Cretaceous reading, finding the palynoflora "entirely
      constrained to the Late Jurassic" and supported by new U–Pb dates. Source
      of the lithology.
