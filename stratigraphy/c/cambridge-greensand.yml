name: Cambridge Greensand
rank: member
parent: West Melbury Marly Chalk
period: [Late Cretaceous]
stages: [Cenomanian]
description: "The Cambridge Greensand is a geological unit in England whose strata are earliest Cenomanian in age. It lies above the erosive contact between the Gault Formation and the Chalk Group in the vicinity of Cambridgeshire, and technically forms the lowest member bed of the West Melbury Marly Chalk Formation. It is a remanié deposit, containing reworked fossils of late Albian age, including those of dinosaurs and pterosaurs."
references:
  - id: raven2020a
    notes: >
      Gives the rank and parent outright: "Cambridge Greensand Member of the
      West Melbury Marly Chalk Formation (Cenomanian)".
  - id: barrett2020a
    notes: >
      Gives the age and the reworking that makes its fauna older than its
      matrix: the member "(lower Cenomanian: Upper Cretaceous) has yielded a
      diverse fauna of terrestrial and marine tetrapods, whose remains are
      largely reworked from the underlying Gault Formation (upper Albian ...)".
  - id: hopson2005a
    notes: >
      Gives the member's age in the Chalk framework: "Upper Cretaceous,
      Cenomanian. Mantelliceras mantelli Zone, Neostlingoceras carcitanense
      Subzone."

