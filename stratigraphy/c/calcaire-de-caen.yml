name: Calcaire de Caen
rank: formation
period: [Middle Jurassic]
stages: [Bathonian]
variants: [Calcaires de Caen]
references:
  - id: holtz2004a
    notes: >
      Tabulates the Poekilopleuron bucklandii type as "Calcaire de Caen
      (Calvados), France | middle Bathonian", and elsewhere writes "Calcaire
      de Caen Formation" for the same unit. A reference work, and the only
      cited source giving the unit's rank and age together.
  - id: allain2002a
    notes: >
      Gives the Poekilopleuron? valesdunensis horizon as "Progracilis zone of
      the 'Calcaire de Caen' formation, Middle Jurassic (Middle Bathonian)",
      the holotype having come from the Pierre de Caen of the formation,
      "dated from the beginning of the Middle Bathonian".
