name: Chuanjie
rank: formation
period: [Middle Jurassic]
stages: [Aalenian, Bajocian, Bathonian]
lithology: purple-red mudstone and siltstone, with thin micritic limestone
references:
  - id: fang2000a
    notes: >
      Erects the formation for units 21–35 of its Lufeng section as Middle
      Jurassic, lying disconformably on the Lufeng Formation and yielding
      Chuanjiesaurus anaensis. Source of the lithology.
  - id: huang2005a
    notes: >
      On magnetostratigraphy correlates the formation with "the upper Aalenian
      through the lower Bathonian", above a hiatus that cuts out roughly the
      lower Aalenian.
  - id: zhang2026a
    notes: >
      Relays from Huang and colleagues (2021) that the formation is Middle
      Jurassic, "including the top of Toarcian to Bathonian", in a paragraph on
      the Zhanghe Formation.
  - id: huang2021a
    notes: >
      A national compilation whose correlation chart draws the formation in the
      Central Yunnan column from the 175 Ma line to the Bathonian–Callovian
      boundary; its text does not discuss it.
  - id: ren2020a
    notes: >
      Gives the narrower reading, that the formation "was regarded to be
      Middle Jurassic (Bajocian)".
