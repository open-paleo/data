name: Chuanjie
rank: formation
period: [Middle Jurassic]
stages: [Aalenian, Bajocian, Bathonian]
references:
  - id: fang2000a
    notes: >
      Fang and colleagues erect the Chuanjie Formation for units 21-35 of the
      Laochangqing-Dajianfeng section, carry it as J2 throughout, and give the
      type horizon of Chuanjiesaurus a'naensis as "Lower Middle Jurassic
      Chuanjie Fm. at Laochangqing, Chuanjie Township, Lufeng Co. Yunnan
      Province". The unit "disconformably overlies the Zhangjia'ao member of
      the Lufeng Fm. and is conformable with the overlying Laoluocun Fm.",
      which sets it above the beds Huang and colleagues later dated to the
      Toarcian.
  - id: huang2005a
    notes: >
      Magnetic polarity correlation makes the formation run from "the upper
      Aalenian through the lower Bathonian", with the overlying Laoluocun
      Formation covering the upper Bathonian through lower Callovian. The base
      is "a discontinuity surface, with roughly the lower part of the basal
      Aalenian Stage of the Middle Jurassic missing", and the interval cut out
      there is preserved in the green sandstone member of the Zhanghe
      Formation at Yubacun. Huang and colleagues put the Toarcian in the
      underlying Lufeng Formation, not in the Chuanjie.
  - id: zhang2026a
    notes: >
      Relays the span as "the top of Toarcian to Bathonian" for the Central
      Yunnan exposures, attributing it to Huang and colleagues (2021). The
      attribution is a stage too low: Huang's correlation chart puts this
      formation at Aalenian to Bathonian and gives the Toarcian to the Lower
      Lufeng Formation directly beneath it. The clause is subordinate, its
      main clause is Middle Jurassic, and the paragraph is about the Zhanghe
      Formation, which the Chuanjie enters only as a correlative.
  - id: huang2021a
    notes: >
      A national compilation whose text never treats Yunnan - the five
      stratigraphic regions and four detailed basin sections do not include
      it, and the formation's name appears only in the correlation chart for
      South China, West China and Tibet. In the Central Yunnan column of that
      chart the unit spans the Aalenian to the Bathonian, its top at the
      Bathonian-Callovian boundary and its base at the base of the Middle
      Jurassic, with the Toarcian below it belonging to the Lower Lufeng.
      Being a chart in a compilation rather than a determination, it
      corroborates rather than decides.
  - id: ren2020a
    notes: >
      Gives the narrower reading, that the formation "was regarded to be
      Middle Jurassic (Bajocian".
