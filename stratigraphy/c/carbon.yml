name: Carbon
rank: member
parent: Horseshoe Canyon
period: [Late Cretaceous]
stages: [Maastrichtian]
references:
  - id: eberth2012a
    notes: >
      An estimated age range of "∼68.4–67.5 Ma" spans the member, which
      "Ranges from the upper one-half of the 31n magnetochron to the lowermost
      30n magnetochron"; no error is published on either end. Both ends fall
      inside the Maastrichtian on this project's own stage boundary table.
  - id: eberth2020a
    notes: >
      Assesses Eotriceratops xerinsularis "from the Carbon Member" at 68.8
      Ma, and places the Albertosaurus bonebed near the top of the underlying
      Tolman Member, about 8 m below the Tolman-Carbon member contact.
