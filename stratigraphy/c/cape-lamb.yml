name: Cape Lamb
rank: member
parent: Snow Hill Island
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
dispute:
  summary: >
    Which formation contains it is not settled, and one paper gives both
    answers. Rozadilla and colleagues (2016) correlate an ornithopod level "to
    Snow Hill Island Formation, Cape Lamb Member, NG Sequence, Gunnarites
    Assemblage 10", and elsewhere in the same paper give a horizon as "Cape
    Lamb Member of the Lopez de Bertodano Formation (Maastrichtian)". Motta
    and colleagues (2025) use the Snow Hill Island reading.
references:
  - id: ely2019a
    notes: >
      Dates it directly: "The Cape Lamb Member on Vega Island ... contains the
      lower part of the Maastrichtian Stage in Antarctica, based on an
      isotopic date of 71.0 +/- 0.2 Ma".
  - id: rozadilla2016a
    notes: >
      Gives both parent formations, and dates the member early Maastrichtian
      on the Gunnarites antarcticus ammonite assemblage.
  - id: motta2026a
    notes: >
      Gives the Imperobator horizon in the James Ross Basin as "the Snow Hill
      Island Formation (Cape Lamb Member; late Campanian–early
      Maastrichtian)".
  - id: motta2025a
    notes: >
      Gives the lower Maastrichtian and no Campanian: the Imperobator
      antarcticus remains are "from the Cape Lamb Member (lower
      Maastrichtian) of the Snow Hill Island Formation, Antarctica", repeated
      in the Spanish abstract.
