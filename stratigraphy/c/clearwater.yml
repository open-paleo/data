name: Clearwater
rank: formation
period: [Early Cretaceous]
stages: [Aptian, Albian]
description: "The Clearwater Formation is a stratigraphic unit of Early Cretaceous (Albian) age in the Western Canada Sedimentary Basin in northeastern Alberta, Canada. It was first defined by R.G. McConnell in 1893 and takes its name from the Clearwater River near Fort McMurray. Impermeable marine shales in the Clearwater Formation provided part of the trapping mechanism for the underlying Athabasca oil sands in the McMurray Formation. Nearly complete specimens of plesiosaurs and ichthyosaurs, as well as one ankylosaur, have been recovered from the formation during oilsand mining."
references:
  - id: brown2017a
    notes: >
      Gives the Borealopelta horizon as "Wabiskaw Member, Clearwater
      Formation, Aptian stage" at the Suncor Millennium Mine near Fort
      McMurray, Alberta, while the same paper's geological setting calls it
      "the Albian-aged Wabiskaw Member of the Clearwater Formation overlying
      the bitumen-rich McMurray Formation".
  - id: brown2020b
    notes: >
      Places Borealopelta in "the Early Cretaceous (Clearwater Formation) of
      northern Alberta" and tabulates the same horizon as "Clearwater
      Formation (Albian)". Describes the unit as fully marine, which is why
      the specimen has no associated macroflora.
