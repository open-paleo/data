name: Clearwater
rank: formation
period: [Early Cretaceous]
stages: [Aptian, Albian]
references:
  - id: brown2017a
    notes: >
      Gives the Borealopelta horizon as "Wabiskaw Member, Clearwater
      Formation, Aptian stage" at the Suncor Millennium Mine near Fort
      McMurray, Alberta, while the same paper's geological setting calls it
      "the Albian-aged Wabiskaw Member of the Clearwater Formation overlying
      the bitumen-rich McMurray Formation".
  - id: brown2020b
    notes: >
      Places Borealopelta in "the Early Cretaceous (Clearwater Formation) of
      northern Alberta" and tabulates the same horizon as "Clearwater
      Formation (Albian)". Describes the unit as fully marine, which is why
      the specimen has no associated macroflora.
