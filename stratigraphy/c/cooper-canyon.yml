name: Cooper Canyon
rank: formation
parent: Dockum
period: [Late Triassic]
stages: [Norian]
lithology: red siltstone and mudstone, with lenses and sheets of sandstone
references:
  - id: lehman2005a
    notes: >
      Maps the Otis Chalk localities in the Cooper Canyon: "our mapping shows
      that these strata are actually within the upper part of the Cooper Canyon
      Formation", against their earlier assignment to a "Colorado City Member"
      (p. 346). Source of the lithology.
  - id: martz2013a
    notes: >
      Places the Post Quarry, low in the type section, in the Adamanian biozone
      rather than the Revueltian, at "late early Norian or earliest middle
      Norian"; the lowest beds may be Otischalkian.
  - id: carpenter1997a
    notes: >
      Gives the Gojirasaurus type locality as "Revuelto Creek, Quay County,
      New Mexico, Cooper Canyon Formation, Dockum Group", at "late Early
      Norian based on magnetostratigraphy", and elsewhere "middle Norian".
  - id: nesbitt2007a
    notes: >
      Equates it with the Bull Canyon Formation, writing "Bull Canyon (=
      Cooper Canyon) Formations" for the Protoavis occurrence in Garza
      County, Texas. Martz and colleagues (2013) withdrew the equation, and
      the two are entered separately.
  - id: martz2008a
    notes: >
      Cited by Martz and colleagues (2013) for the lithostratigraphic
      revisions that cast doubt on the Bull Canyon correlation.
  - id: cather2013a
    notes: >
      Records that Lehman and colleagues (1992) renamed Chatterjee's (1986)
      preoccupied Cooper Member as the Cooper Canyon Formation, and does not use
      the name in New Mexico.
  - id: chatterjee1986a
  - id: lehman1992a
  - id: martz2017a
    notes: >
      Places the Otischalkian, "the lowermost Cooper Canyon", at "about 227 to
      224 Ma … during the earliest Lacian (earliest early Norian)", within the
      Norian.
