name: Cooper Canyon
rank: formation
parent: Dockum
period: [Late Triassic]
stages: [Norian]
references:
  - id: martz2013a
    notes: >
      The dedicated re-evaluation of the Post Quarry assemblage, treating the
      unit as the "Cooper Canyon Formation (Dockum Group, Upper Triassic) of
      southern Garza County, western Texas" and noting that its lower unit,
      like the lowermost Tecovas Formation, may fall in the Otischalkian
      biozone. It also withdraws the correlation with the Bull Canyon: the
      assemblage had been read as Revueltian "largely because the Cooper
      Canyon Formation was accepted as correlative with the Bull Canyon
      Formation of New Mexico", but "recent lithostratigraphic revisions
      (Martz 2008) have cast doubt on" it.
  - id: carpenter1997a
    notes: >
      Gives the Gojirasaurus type locality as "Revuelto Creek, Quay County,
      New Mexico, Cooper Canyon Formation, Dockum Group", at "late Early
      Norian based on magnetostratigraphy", and elsewhere "middle Norian".
  - id: nesbitt2007a
    notes: >
      Equates it with the Bull Canyon Formation, writing "Bull Canyon (=
      Cooper Canyon) Formations" for the Protoavis occurrence in Garza
      County, Texas. Martz and colleagues (2013) withdrew the equation, and
      the two are entered separately.
