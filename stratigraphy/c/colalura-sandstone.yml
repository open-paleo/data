name: Colalura Sandstone
rank: formation
period: [Middle Jurassic]
stages: [Bajocian]
references:
  - id: long1998a
    notes: >
      Describes the Ozraptor type from "the Colalura Sandstone of Western
      Australia" at "Middle Jurassic (Bajocian)", the unit "referred to the
      Sowerbyi and perhaps Sauzei and Humphriesianium Zones of the European
      Middle Bajocian" and yielding abundant fossil wood and bivalves.
  - id: holtz2004a
    notes: >
      A reference work, tabulating the unit as Bajocian for the same taxon.
