name: Cerro Castaño
rank: member
parent: Cerro Barcino
period: [Early Cretaceous]
stages: [Aptian, Albian]
references:
  - id: rauhut2004a
    notes: >
      Places it in the formation's internal order: the outcropping Chubut
      Group includes "the lowermost Los Adobes Formation
      (Hauterivian-Barremian) and the lower two units of the Cerro Barcino
      Formation, the Puesto la Paloma (Barremian-Aptian) and Cerro Castaño
      (Aptian-Albian) members".
  - id: canale2014a
    notes: >
      Gives the Tyrannotitan type horizon as "Cerro Castaño Member, Cerro
      Barcino Formation, Albian", at the La Juanita farm.
  - id: carrano2012a
    notes: >
      Independently gives "Cerro Castaño Member, Cerro Barcino Formation;
      Aptian-Albian, Early Cretaceous".
