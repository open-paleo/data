name: Chipping Norton Limestone
rank: formation
parent: Great Oolite
period: [Middle Jurassic]
stages: [Bajocian, Bathonian]
lithology: fine- to medium-grained ooidal limestone, with thin marl and mudstone
  beds
references:
  - id: barron2012a
    notes: >
      The lithostratigraphic framework entry, giving the parent as the Great
      Oolite Group and the age as "Bajocian-Bathonian, Parkinsoni Zone to Zigzag
      Zone", and listing Chipping Norton Limestone and Chipping Norton Formation
      among previous names. Describes its rock: "Limestone, off-white to pale
      brown fine- to medium-grained ooidal and coated peloidal grainstone, with
      common fine burrows, medium- to coarse-grained shell debris and flakes of
      greenish grey mud and dark lignite and minor amounts of fine sand.
      Thick-bedded and cross-bedded or massive, weathering to flaggy or platy.
      Thin shell-detrital and ooidal marl and mudstone intercalations in
      places."
  - id: benson2010c
    notes: >
      Resolves material within it to a member and an ammonite zone, the "Hook
      Norton Limestone Member of the Chipping Norton Limestone Formation
      (lowest Bathonian, Zigzag ammonite zone) of New Park Quarry".
  - id: benson2010a
    notes: >
      Gives "the Chipping Norton Limestone Formation (Middle Jurassic: Lower
      Bathonian) of Cross Hands Quarry, near Little Compton, Warwickshire".
