name: Chipping Norton Limestone
rank: formation
parent: Great Oolite
period: [Middle Jurassic]
stages: [Bajocian, Bathonian]
references:
  - id: barron2012a
    notes: >
      The lithostratigraphic framework entry, giving the parent as the Great
      Oolite Group and the age as "Bajocian-Bathonian, Parkinsoni Zone to
      Zigzag Zone", and listing Chipping Norton Limestone and Chipping Norton
      Formation among previous names.
  - id: benson2010c
    notes: >
      Resolves material within it to a member and an ammonite zone, the "Hook
      Norton Limestone Member of the Chipping Norton Limestone Formation
      (lowest Bathonian, Zigzag ammonite zone) of New Park Quarry".
  - id: benson2010a
    notes: >
      Gives "the Chipping Norton Limestone Formation (Middle Jurassic: Lower
      Bathonian) of Cross Hands Quarry, near Little Compton, Warwickshire".
