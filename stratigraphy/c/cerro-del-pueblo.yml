name: Cerro del Pueblo
rank: formation
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
references:
  - id: longrich2024b
    notes: >
      The formation "is dated to the end of the Campanian".
  - id: serrano-brañas2025a
    notes: >
      Independently places the type locality of Mexidracon in "Campanian
      (Upper Cretaceous) strata of the Cerro del Pueblo Formation of the
      Difunta Group", and writes that the coastal plain in which the formation
      was deposited "developed during the Late Campanian (ca. 72.5 Ma)".
  - id: sullivan2006c
    notes: >
      Records that the formation, previously "considered early Maastrichtian
      in age", is "now considered to be of late Campanian age" on
      magnetostratigraphy and ammonite correlation. On its own revised
      Kirtlandian it is "early Edmontonian age (=latest Campanian)", with the
      lower part possibly correlative to the latest Kirtlandian.
