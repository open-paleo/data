name: Clarens
rank: formation
period: [Late Triassic, Early Jurassic]
stages: [Rhaetian, Hettangian, Sinemurian, Pliensbachian, Toarcian]
variants: [Cave Sandstone]
references:
  - id: sereno2012a
    notes: >
      Gives the legacy name and the age: the "predominantly cream-colored,
      playa-aeolian Clarens Formation (formerly Cave Sandstone), the age of
      which is regarded as Early Jurassic (ca. 195 Ma, Sinemurian)". Notes it
      is "less accessible and less fossiliferous" than the Upper Elliot below.
  - id: bordy2020a
    notes: >
      Carries it younger than Sereno does, on the same radioisotopic work that
      dates the Elliot below it: "A mainly Pliensbachian age is obtained for
      the Clarens Formation."
  - id: norman2011a
    notes: >
      Sets the competing readings out side by side in the Heterodontosaurus
      tucki provenance: "Clarens Formation (formerly 'Cave Sandstone',
      Stormberg Series): Hettangian-Sinemurian (Olsen & Galton, 1984),
      Pliensbachian-Toarcian (Yates et al., 2004). The most probable age for
      the Clarens Formation: latest Sinemurian-Pliensbachian (Jourdan et al.,
      2005, 2007, 2008)."
  - id: peyredefabrègues2015a
    notes: >
      Tabulates Heterodontosaurus at "Early Jurassic (Hettangian-
      Pliensbachian)" in this formation, independently of Norman.
  - id: bordy2015a
    notes: >
      Places it in the succession, the Elliot being "sandwiched between the
      underlying Molteno and overlying Clarens formations of the Stormberg
      Group".
  - id: simmons1965a
    notes: >
      Under the legacy name, gives Heterodontosaurus tucki as from "the
      transitional beds of the Upper Triassic Cave Sandstones, South Africa",
      reporting Crompton and Charig (1962). Its own account of the Stormberg
      succession dates "The overlying Cave Sandstone (Triassic-Jurassic)"
      above the Red Beds.
  - id: olsen1984a
    notes: >
      The dedicated treatment of the question, titled for it - a review of
      the Stormberg assemblages "with special emphasis on the footprints and
      the age of the Stormberg". It concludes that "the lower Stormberg
      assemblage is Late Triassic (Carnian-Norian) in age while the upper
      Stormberg assemblage is Early Jurassic (Hettangian-Pliensbachian) in
      age", and defines the upper Stormberg as the "upper Elliot and Clarens
      formations", correlating it with the upper Newark Supergroup, the Glen
      Canyon and the lower Lufeng Series. So it supports Hettangian to
      Pliensbachian here and neither the Rhaetian nor the Toarcian.
  - id: yates2004b
    notes: >
      An upper Elliot paper, which mentions this formation in passing as the
      unit above rather than dating it.
  - id: jourdan2005a
    notes: >
      Also never names this formation, and dates the Karoo magmatism rather
      than the sedimentary succession.
  - id: jourdan2007a
    notes: >
      A high-resolution argon geochronology of the Karoo large igneous
      province. It never names this formation and contains no stage name at
      all, working entirely in absolute ages - some sixty dated values. Its
      bearing on the entry is through the province it dates rather than
      through the unit.
  - id: jourdan2008a
    notes: >
      Dates the lavas above the formation rather than the formation, and is
      the only one of these three Karoo papers to name it: some intrusive
      events occurred "before the Lesotho lava-pile emplacement ... as
      attested by pipe-related deposits in the Clarens formation". The lava
      pile is given elsewhere in the same paper as "the 1.9 km-thick Lesotho
      lava pile (181.6 plus or minus 0.7 Ma)" and again as "dated at 181.6
      plus or minus 0.7 Ma", so the unit is older than about that figure.
      Note the sentence that names the Clarens prints the age as 81.6 rather
      than 181.6; the slip is the paper's own, and it gives the correct
      figure twice elsewhere.
  - id: crompton1962a
    notes: >
      The Heterodontosaurus tucki type description, and one of the two
      sources behind the Rhaetian. Its horizon line is hedged and uses the
      legacy name and a regional term rather than a stage: "In the
      transitional beds of the Cave Sandstone, below the basalt; probably of
      Upper Keuper age."
  - id: haughton1924a
    notes: >
      A Rhaetic age for the Cave Sandstone, on the archosaur evidence:
      Notochampsa istedana is read as a thecodont standing between Aetosaurus
      of the German Keuper and the Jurassic crocodilians, so "this would
      denote a Rhaetic age for the Cave Sandstone which has yielded the
      intermediate form". Concludes that Stormberg sedimentation "began in
      Middle Triassic time and ended in the Rhaetic".
