name: Clarens
rank: formation
parent: Stormberg
period: [Early Jurassic]
stages: [Pliensbachian]
variants: [Cave Sandstone, Bushveld Sandstone]
lithology: very fine- to medium-grained sandstone, mostly pale orange to white
references:
  - id: sereno2012a
    notes: >
      Gives the legacy name and the age: the "predominantly cream-colored,
      playa-aeolian Clarens Formation (formerly Cave Sandstone), the age of
      which is regarded as Early Jurassic (ca. 195 Ma, Sinemurian)". Notes it
      is "less accessible and less fossiliferous" than the Upper Elliot below.
  - id: bordy2020a
    notes: >
      Obtains "a mainly Pliensbachian age" for the formation from U-Pb dates on
      detrital zircons, and ends the upper Stormberg record in the early
      Toarcian.
  - id: norman2011a
    notes: >
      Sets the competing readings out side by side in the Heterodontosaurus
      tucki provenance: "Clarens Formation (formerly 'Cave Sandstone',
      Stormberg Series): Hettangian-Sinemurian (Olsen & Galton, 1984),
      Pliensbachian-Toarcian (Yates et al., 2004). The most probable age for
      the Clarens Formation: latest Sinemurian-Pliensbachian (Jourdan et al.,
      2005, 2007, 2008)."
  - id: peyredefabrègues2015a
    notes: >
      Tabulates Heterodontosaurus at "Early Jurassic (Hettangian-
      Pliensbachian)" in this formation, independently of Norman.
  - id: bordy2015a
    notes: >
      Places it in the succession, the Elliot being "sandwiched between the
      underlying Molteno and overlying Clarens formations of the Stormberg
      Group".
  - id: simmons1965a
    notes: >
      Under the legacy name, gives Heterodontosaurus tucki as from "the
      transitional beds of the Upper Triassic Cave Sandstones, South Africa",
      reporting Crompton and Charig (1962). Its own account of the Stormberg
      succession dates "The overlying Cave Sandstone (Triassic-Jurassic)"
      above the Red Beds.
  - id: olsen1984a
    notes: >
      Reviews the age of the Stormberg and dates the upper Elliot and Clarens
      assemblage, taken together, "Early Jurassic (Hettangian-Pliensbachian)".
  - id: yates2004b
    notes: >
      An upper Elliot paper, which mentions this formation in passing as the
      unit above rather than dating it.
  - id: jourdan2005a
    notes: >
      Also never names this formation, and dates the Karoo magmatism rather
      than the sedimentary succession.
  - id: jourdan2007a
    notes: >
      A high-resolution argon geochronology of the Karoo large igneous
      province. It never names this formation and contains no stage name at
      all, working entirely in absolute ages — some sixty dated values. It bears
      on this unit through the province it dates rather than through the unit
      itself.
  - id: jourdan2008a
    notes: >
      Dates the Lesotho lava pile above the formation to 181.6 ± 0.7 Ma, and
      names the Clarens for pipe-related deposits that predate the lavas.
  - id: crompton1962a
    notes: >
      The Heterodontosaurus tucki type description, and one of the two
      sources behind the Rhaetian. Its horizon line is hedged and uses the
      legacy name and a regional term rather than a stage: "In the
      transitional beds of the Cave Sandstone, below the basalt; probably of
      Upper Keuper age."
  - id: haughton1924a
    notes: >
      A Rhaetic age for the Cave Sandstone, on the archosaur evidence:
      Notochampsa istedana is read as a thecodont standing between Aetosaurus
      of the German Keuper and the Jurassic crocodilians, so "this would
      denote a Rhaetic age for the Cave Sandstone which has yielded the
      intermediate form". Concludes that Stormberg sedimentation "began in
      Middle Triassic time and ended in the Rhaetic".
  - id: sciscio2017a
    notes: >
      Reports that the magmatism of the Northern Free State, KwaZulu Natal
      and Antarctica falls "into the range 183±1.0 Ma", after Jourdan and
      colleagues (2007), and that "Given the intercalation of the uppermost
      Clarens Formation with the lowermost lava flows, it is conservative to
      assume that at least the topmost section of the Clarens Formation is
      contemporaneous with the lowermost KLIP age."
  - id: radermacher2021a
    notes: >
      Gives the Clarens as "conformably overlying" the upper Elliot and
      overlain by "the late Pliensbachian to early Toarcian Drakensberg
      Group".
  - id: hesselbo2020a
    notes: >
      Puts the base of the Toarcian at 184.2 Ma, so lavas of 183 ± 1 Ma that
      interfinger with the top of the formation are early Toarcian.
  - id: bordy2018a
    notes: >
      The committee lithostratigraphy of the formation. Gives the older names it
      replaces, among them "the Bushveld Sandstone in the Lebombo, Springbok
      Flats, Tshipise, Tuli and Ellisras/Lephalale Basins", and its "inferred
      Sinemurian to Pliensbachian (Early Jurassic) age", from the Elliot's
      vertebrates below and the dated lavas above. Source of the lithology.
  - id: smith1993a
    notes: >
      Lists the northern Transvaal "Bushveld sandstone" among the
      "Biostratigraphic and lithofacies equivalents to the Clarens
      sandstone".
  - id: vanheerden1979a
    notes: >
      Correlates the Bushveld Sandstone with the Elliot instead, as "more or
      less the same age as the Elliot Formation farther south".
  - id: vanhoepen1916a
    notes: >
      Places the Gigantoscelus limestone near the Bushveld Sandstone without
      dating it: it "also apparently does not lie far from the Bushveld
      Sandstone and it may even be that it belongs to the uppermost part of
      the latter".
  - id: jourdan2007b
    notes: >
      Cited by Sciscio and colleagues (2017) for the 183 ± 1 Ma ages of the
      lowest lavas, with which the top of the formation interfingers.
