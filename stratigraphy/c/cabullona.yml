name: Cabullona
rank: group
period: [Late Cretaceous]
stages: [Campanian]
references:
  - id: serrano-brañas2016a
    notes: >
      Names the group by way of the Packard Shale Formation inside it, in
      northeastern Sonora, Mexico, "Upper Cretaceous (Campanian)".
  - id: sullivan2006c
    notes: >
      Names the Corral de Enmedio and Packard Formations as its constituents
      in Sonora, and records that correlating them "to rocks of Judithian or
      Kirtlandian age is not possible at present".
