name: Cañadón Asfalto
rank: formation
period: [Early Jurassic, Middle Jurassic, Late Jurassic]
stages: [Toarcian, Aalenian, Bajocian, Bathonian, Callovian, Oxfordian]
references:
  - id: pol2020a
    notes: >
      Dates the base directly. The Bagualia bone bed, "positioned close to
      the base of the Cañadón Asfalto Formation", gives 179.17 +/- 0.12 Ma by
      CA-ID-TIMS on zircon -- "Early Jurassic, Toarcian".
  - id: cúneo2013a
    notes: >
      The older reading, and the top of the envelope: the formation "has been
      traditionally considered Middle to Late Jurassic (Callovian-Oxfordian)
      in age mainly based on its record of freshwater invertebrates" and
      plants. Reports Salani's (2007) whole-rock K-Ar date of 170.9 +/- 4.4 Ma
      (Aalenian-Bajocian) from the basal formation and U-Pb zircon dates of
      161 +/- 3 Ma. Its own U-Pb CA-TIMS dates give "a mid-late Toarcian to
      Aalenian (-Bajocian?) age for the Cañadón Asfalto Formation", and the
      middle to upper sections, above the uppermost basalt flow at Cerro
      Cóndor, "can now be considered essentially early Middle Jurassic in age
      (Aalenian to probably Bajocian)". Names two members, "lower
      lacustrine/tuffaceous (Las Chacritas)" and "upper siliciclastic fluvial
      (Puesto Almada)".
  - id: salani2007a
  - id: holwerda2021a
    notes: >
      "The early Middle Jurassic (Toarcian-Bajocian, possibly earliest
      Bathonian) Cañadón Asfalto Formation" conformably overlies the
      Pliensbachian to early Toarcian Lonco Trapial Formation, and "the
      youngest radiometric age for this formation has been given as
      Bajocian-Bathonian" by Cabaleri and colleagues (2010). The Patagosaurus
      holotype comes from Cerro Cóndor North, in beds "dated to latest
      Early–Middle Jurassic".
