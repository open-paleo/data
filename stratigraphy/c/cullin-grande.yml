name: Cullín Grande
rank: member
parent: Lohan Cura
period: [Early Cretaceous]
stages: [Aptian, Albian]
references:
  - id: martinelli2007b
    notes: >
      Early Albian, Leanza and Hugo (1995, 1997, 2001) having divided the
      formation "into two sub-units: the Puesto Quiroga Member (Late Aptian)
      and the Cullín Grande Member (Early Albian)", and Leanza (2002) having
      correlated the member with the Pichi Neuquén and Cañadón de la Zorra
      members of the upper Rayoso Formation "and assigned to the Early
      Albian". The member "includes 95 m of interstratified coarse-grained red
      sandstones, with intercalations of mudstone levels", a sandy meandering
      fluvial system at Cerro de Los Leones whose well-developed pedogenic
      calcrete points to "semi-arid conditions during the deposition of the
      Cullín Grande Member". Four fossiliferous levels are logged there, the
      sauropods concentrated in level 2 and turtles abundant in the lower
      pelitic level.
  - id: leanza2004a
    notes: >
      Names it one of the formation's two subunits, Leanza and Hugo (1995)
      having "divided the Lohan Cura Formation (177 m) into two subunits ...:
      the Puesto Quiroga and the Cullín Grande members".
  - id: bellardini2022a
    notes: >
      Makes it "the upper unit of the Lohan Cura Formation" and gives the
      lithology, the outcrops on the southern flank of the Cerro de los
      Leones being "composed of a thick succession of mudstones with thin
      intercalations of fine-grained sandstones".
  - id: bellardini2022b
    notes: >
      Places the Agustinia quarry in "the lower section of the Cullin Grande
      Member (Bajada del Agrio Group, Lohan Cura Formation, Lower Cretaceous,
      Albian)", writing the name without the diacritic here.
  - id: salgado2004a
    notes: >
      Gives both Agustinia and a titanosaurian from "the Aptian-Albian Cullín
      Grande Member of the Lohan Cura Formation".
  - id: bonaparte2006a
    notes: >
      Gives the discovery context, the Agustinia material coming from "the
      upper levels (Cullín Grande Member) of the Lohan Cura Formation" at
      Cerro de los Leones, 10 km west of Picún Leufú.
  - id: leanza1995a
    notes: >
      Erects the member: "Cullin Grande Member nom. nov.: Its type locality is
      found on the northwestern slope of the homonymous hill, where it shows
      92.20 m in thickness", the upper of the two the formation is divided
      into. It states no stage for the member itself; the Aptian it discusses
      is a maximum for the whole formation.
