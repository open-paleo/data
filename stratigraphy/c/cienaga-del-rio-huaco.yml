name: Ciénaga del Río Huaco
rank: formation
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
references:
- id: hechenleitner2020a
  notes: >
    Campanian to Maastrichtian red beds at Quebrada de Santo Domingo in
    the Andes of La Rioja, northwestern Argentina, yielding two
    titanosaurs from different stratigraphic positions and egg clutches in
    three levels spread over three kilometers.
- id: santucci2022a
  notes: >
    Repeats the Campanian to Maastrichtian span.
- id: velandia2025a
  notes: >
    Refers isolated abelisaurid teeth from the Quebrada Santo Domingo
    locality to the formation and calls it Upper Cretaceous.
