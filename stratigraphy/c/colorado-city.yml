name: Colorado City
rank: formation
parent: Dockum
period: [Late Triassic]
stages: [Carnian, Norian]
variants: [Iatan]
dispute:
  summary: >
    Lehman and Chatterjee (2005) write that Lucas and associates "have
    referred to these strata variously as the 'Iatan Member' or more recently
    as the 'Colorado City Member' of the Dockum. However, our mapping shows
    that these strata are actually within the upper part of the Cooper Canyon
    Formation". Lucas and Anderson (1995), answering Lehman's earlier
    correlation of the unit with the Tecovas, Trujillo and Bull Canyon, write
    that it "does not agree with the biostratigraphic evidence", and that
    tetrapods show the Colorado City Member "is older than most of the Tecovas
    Member and all of the Trujillo and Bull Canyon Members". Nesbitt and
    Ezcurra (2015) treat the correlation as unresolved, describing "somewhat
    of a compromise between the two entrenched hypotheses" that places the
    Otis Chalk localities "low in the Dockum Group". Hunt and colleagues
    (1998) and Martz and Parker (2017) use member rank within the Dockum;
    Sarıgül (2016) and Lovelace and colleagues (2025) use formation rank
    within the Dockum Group.
references:
  - id: sarigül2016a
    notes: >
      The Otis Chalk quarries of Howard County, Texas expose its middle part:
      "The Otis Chalk quarries include beds from the middle portion of the
      Colorado City Formation", after Lucas and Anderson (1993) and Lucas and
      colleagues (1993); Otis Chalk Quarry 3 yielded the holotype of
      Dromomeron gregorii. At formation rank within the Dockum Group, it is
      treated as "a correlate of the lower part of the Tecovas Formation",
      following Lucas and Anderson, while "Lithostratigraphic equivalency of
      the Dockum Group exposures south to Garza County in Texas is pending and
      needs more detailed studies".
  - id: lehman2005a
    notes: >
      The mapping that rejects the unit, placing the Otis Chalk strata in the
      upper Cooper Canyon Formation instead.
  - id: lovelace2025a
    notes: >
      Uses formation rank and brackets the age, restricting the Otis Chalk
      localities "to somewhere between the late Carnian (c. 231 Mya; this
      study) to no younger than early Norian".
  - id: hunt1998a
    notes: >
      Uses member rank under a Dockum Formation, and makes the Otis Chalk
      fauna of this unit the type fauna of the Otischalkian, which it calibrates
      as "the Otischalkian (late Carnian: early Tuvalian)". That calibration
      is the source of the entry's Carnian.
  - id: lucas1993c
    notes: >
      Coins the unit: "The name Iatan Member here is coined for the defunct
      railroad siding of Iatan ... in Mitchell County, Texas", as a member of
      the Dockum Formation with its type section at Rattlesnake Gap in Howard
      County. It "is of Late Triassic (late Carnian) age based on its
      vertebrate fossils", and the presence of Paleorhinus "suggests that most
      of the Iatan Member is older than the Tecovas Member of the Dockum
      Formation to the north".
  - id: lucas1994a
    notes: >
      Treats the Iatan Member as "a distinct lithosome overlain by the Tecovas
      Member". "A large vertebrate assemblage containing Paleorhinus is
      present in about the middle of the member", which "indicates that the
      lower half of the Iatan Member is older than the vertebrate-bearing
      strata of the Tecovas Member".
  - id: lucas1995a
    notes: >
      Renames the unit: "Colorado City Member is introduced here to replace
      the preoccupied name Iatan", keeping "the same type section at Iatan
      railroad siding". Lists it as the second of five members of the Dockum
      Formation of the Chinle Group, above the Camp Springs and below the
      Tecovas, and charts its tetrapods among "upper Carnian strata".
  - id: martz2017a
    notes: >
      Places the "Colorado City Member" in its Otischalkian estimated
      holochronozone, which falls "during the earliest Lacian (earliest early
      Norian)".
  - id: nesbitt2015a
    notes: >
      Holds that the correlation of the Otis Chalk area "to the rest of the
      Dockum Formation remains unresolved", and on current correlations places
      the localities "low in the Dockum Group". Gives the Lepidus type horizon
      only as "Otis Chalk area, Dockum Group, Upper Triassic", without naming
      this unit.
