name: Colorado City
rank: formation
parent: Dockum
period: [Late Triassic]
stages: [Carnian, Norian]
dispute:
  summary: >
    Whether the unit exists is the live question, not its rank. Lehman and
    Chatterjee (2005) map the Otis Chalk strata out of it altogether: the
    beds were thought older than the Tecovas "Because of the supposedly
    'primitive' elements of the Otis Chalk fauna", and were called the Iatan
    Member and then the Colorado City Member, but "our mapping shows that
    these strata are actually within the upper part of the Cooper Canyon
    Formation", so the fauna "actually occurs very high stratigraphically
    within the Dockum succession". That reasoning is circular if the fauna is
    then dated by the unit. Rank is the lesser question: Lovelace and
    colleagues (2025) write "the Colorado City Formation (lower Dockum
    Group)" and Hunt and colleagues (1998) "Colorado City Member of Dockum
    Formation".
references:
  - id: sarigül2016a
    notes: >
      The Otis Chalk quarries of Howard County, Texas expose its middle part:
      "The Otis Chalk quarries include beds from the middle portion of the
      Colorado City Formation", after Lucas and Anderson (1993) and Lucas and
      colleagues (1993); Otis Chalk Quarry 3 yielded the holotype of
      Dromomeron gregorii. At formation rank within the Dockum Group, it is
      treated as "a correlate of the lower part of the Tecovas Formation",
      following Lucas and Anderson, while "Lithostratigraphic equivalency of
      the Dockum Group exposures south to Garza County in Texas is pending and
      needs more detailed studies".
  - id: lehman2005a
    notes: >
      The mapping that rejects the unit, placing the Otis Chalk strata in the
      upper Cooper Canyon Formation instead.
  - id: lovelace2025a
    notes: >
      Uses formation rank and brackets the age, restricting the Otis Chalk
      localities "to somewhere between the late Carnian (c. 231 Mya; this
      study) to no younger than early Norian".
  - id: hunt1998a
    notes: >
      Uses member rank under a Dockum Formation, and makes the Otis Chalk
      fauna of this unit the type fauna of the Otischalkian.
