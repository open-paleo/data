name: Chorrillo
rank: formation
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
description: "The Chorrillo Formation is a Late Cretaceous (Maastrichtian age) geological formation in southern Patagonia, Argentina. The formation is more than 50 meters (160 ft) thick and underlies the Calafate Formation and rests on top of the La Irene Formation. It constitutes a significant uppermost Cretaceous continental sedimentary sequence within the Magallanes Basin, located in Santa Cruz Province, Argentina, approximately 30 km (19 mi) southwest of El Calafate. The formation correlates with the lower Dorotea Formation in Chile, sharing dinosaurian ecotypes, while both are clearly different from other northern Patagonian Maastrichtian units (e.g., Allen Formation, Los Alamitos Formation), which are dominated by saltasaurine sauropods and abelisaurids, suggesting potential temporal or environmental distinctions."
references:
  - id: novas2019a
    notes: >
      Gives "The Chorrillo Formation (Upper Cretaceous,
      Campanian-Maastrichtian ...)", crediting Arbe (2002) and Nullo and
      colleagues (2006), and sets it in the local succession as "the upper
      Campanian-lower Maastrichtian Chorrillo Formation". Leaves open whether
      it "is equivalent or not with the dinosaur-bearing, continental deposits
      of the Cerro Fortaleza Formation".
  - id: motta2026a
    notes: >
