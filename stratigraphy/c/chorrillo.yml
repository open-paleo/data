name: Chorrillo
rank: formation
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
references:
  - id: novas2019a
    notes: >
      Gives "The Chorrillo Formation (Upper Cretaceous,
      Campanian-Maastrichtian", crediting Arbe (2002) and Nullo and colleagues
      (2006), and sets it in the local succession as "the upper
      Campanian-lower Maastrichtian Chorrillo Formation". Leaves open whether
      it "is equivalent or not with the dinosaur-bearing, continental deposits
      of the Cerro Fortaleza Formation".
  - id: motta2026a
    notes: >
      Gives "Chorrillo Formation (Late Cretaceous, Maastrichtian".
