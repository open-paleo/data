name: Cabaços
rank: formation
period: [Middle Jurassic, Late Jurassic]
stages: [Callovian, Oxfordian, Kimmeridgian]
variants: [Cabaços Beds, Vale Verde, Valverde]
references:
  - id: mateus2009b
    notes: >
      Gives "Cabaços Fm., Oxfordian, Pedrógão" for the Alocodon type,
      crediting the age to Azerêdo and colleagues (2002).
  - id: mateus2017a
    notes: >
      Records the older name and scheme, Choffat (1901) having recognized the
      Lower Lusitanian of the southern Lusitanian Basin as divided into "the
      Cabaços Beds and the Montejunto Beds".
  - id: kullberg2013a
    notes: >
      Dates the formation "Middle Oxfordian, Plicatilis Zone", gives it 80 to
      200 m, and places it at the base of Choffat's Lusitanian.
  - id: azerêdo2002a
    notes: >
      Places the formation directly above the Middle–Upper Jurassic
      disconformity and gives it the Middle Oxfordian, with a base that may
      reach the uppermost Callovian.
  - id: choffat1901a
    notes: >
      Describes the Cabaço beds directly above the Callovian, about 500 m thick,
      and correlates them with the zone of Ammonites transversarius.
  - id: schneider2009a
    notes: >
      Derives "a Late Oxfordian to Early Kimmeridgian age" from strontium
      isotopes in oysters from two layers in the middle of the formation at
      Cesareda.
  - id: choffat1885a
    notes: >
      Cited by Kullberg and colleagues (2013) as one of the works in which
      Choffat defined the Lusitanian stage.
  - id: choffat1893a
    notes: >
      Cited by Kullberg and colleagues (2013) as one of the works in which
      Choffat defined the Lusitanian stage.
  - id: choffat1893b
    notes: >
      Cited by Kullberg and colleagues (2013) as one of the works in which
      Choffat defined the Lusitanian stage.
