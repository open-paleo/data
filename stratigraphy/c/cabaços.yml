name: Cabaços
rank: formation
period: [Middle Jurassic, Late Jurassic]
stages: [Callovian, Oxfordian, Kimmeridgian]
variants: [Cabaços Beds]
references:
  - id: mateus2009b
    notes: >
      Gives "Cabaços Fm., Oxfordian, Pedrógão" for the Alocodon type,
      crediting the age to Azerêdo and colleagues (2002).
  - id: mateus2017a
    notes: >
      Records the older name and scheme, Choffat (1901) having recognized the
      Lower Lusitanian of the southern Lusitanian Basin as divided into "the
      Cabaços Beds and the Montejunto Beds".
  - id: kullberg2013a
    notes: >
      Narrows the age to a zone and gives the naming lineage. The unit is
      "the Cabaços Formation [Middle Oxfordian, Plicatilis Zone] (highly
      variable, between 80 to 200 m; approximately 390 m in the Campelos-1
      borehole)", and it sits "at the base of the 'stage' Lusitanian, defined
      by Choffat (1885, 1893, 1893a)". Lists the earlier names it absorbs --
      Cabaço Member in part after Choffat, Cabaço Limestone after Atrops and
      Marques, and Cabaços Formation in part after Leinfelder and Wilson.
  - id: azerêdo2002a
    notes: >
      The lowermost Upper Jurassic deposits above the basinwide Middle-Upper
      Jurassic disconformity, 40 to 150 m of pedogenic limestones, ferruginous
      or lignitic marls and clays, and lacustrine, restricted-lagoonal and
      marginal-marine marls and limestones. It "lacks good biostratigraphical
      markers, but is traditionally attributed to the Middle Oxfordian", an
      age carried by the dasycladacean Heteroporella lusitanica, whose
      basinwide occurrence is succeeded by or lateral to levels with Middle
      Oxfordian ammonites; because that alga "is virtually absent in the
      lowermost part of the formation", the base "could also encompass the
      Lower Oxfordian or even the uppermost Callovian", reaching below the
      Middle-Late Jurassic boundary.
  - id: choffat1901a
    notes: >
      Prints the unit as "Cabaco beds", singular and at bed rank, which is
      why the entry's name returns nothing from it. Places them in his
      Lusitanian Stage against the Oxfordian, "(Zone with Ammonites
      bimammatus)", at about 500 m, concluding that "Considerations ... lead
      me to regard this member as representing the zone of Peltoceras
      bimammatum". His column puts a lacuna immediately beneath these beds,
      with the Callovian below it - "The upper bed of the Callovian is formed
      by thin strata containing Cosmoceras Dunkani" - so on his reading the
      Callovian lies under a gap rather than within this unit.
  - id: schneider2009a
    notes: >
      Two layers sampled from the middle part of the formation at the
      Cesareda-Serra d'El Rei plateau carry it into the Kimmeridgian: although
      the relative errors are large, "a Late Oxfordian to Early Kimmeridgian
      age (155.3–154.4 Ma; bimammatum-platynota zones) may be derived". The
      initial transgression at Cesareda, in brackish water below those marine
      horizons, most likely occurred during the Middle Oxfordian, following
      Azerêdo and colleagues (2002).
