name: Cloverly
rank: formation
period: [Early Cretaceous, Late Cretaceous]
stages: [Valanginian, Hauterivian, Barremian, Aptian, Albian, Cenomanian]
references:
  - id: kirkland1993a
    notes: >
      Gives "Cloverly Formation and related Aptian to Albian" units.
  - id: ostrom1970a
    notes: >
      Reaches the same span from three lines of evidence: the age "on the
      bases of fossil invertebrate and paleobotanical evidence, as well as
      the fossil vertebrates, is probably Late Aptian and Early Albian".
  - id: darton1906a
    notes: >
      Sandstones and sandy clays 100 to 200 feet thick lying on the Morrison
      along both flanks of the Bighorn Mountains, best exposed near Cloverly,
      Wyoming, "the locality from which the formation was given its name", and
      correlated with the Lakota sandstone, Fuson formation and Dakota
      sandstone of the Black Hills region. "So far the formation has not
      yielded any fossils which throw light on its age, for only a few
      fragments of leaves and pine needles have been observed. On the basis of
      the above correlation it represents the later deposits of the lower
      Cretaceous and the earliest deposits of the upper Cretaceous."
  - id: cuenca-bescós2003a
    notes: >
      The Gobiconodon ostromi skeleton from Montana comes from the formation,
      and "The age of the Cloverly fauna is Aptian–Albian", following Ostrom
      (1970); a paleogeographic map of the gobiconodontid localities labels it
      "Cloverly (Aptian–Albian, USA)".
  - id: d'emic2019a
    notes: >
      New U–Pb zircon dates and a reanalysis of published biostratigraphic,
      paleomagnetic and radiometric data "suggest that deposition of the
      Cloverly Formation spanned the Valanginian–Cenomanian stages (ca. 140
      Ma–98 Ma), a longer time interval than the commonly cited Aptian–Albian
      depositional timeframe". The basal Pryor Conglomerate was deposited ca.
      140 to 130 Ma, the interval of "fluvially dominated deposition during
      the Valanginian–Hauterivian", while the flora of the overlying Little
      Sheep Mudstone Member near Ten Sleep, Wyoming, "dates to the
      Barremian–early Albian". The Himes Member and Greybull Sandstone follow
      in the mid to late Albian to early Cenomanian, which "opens up the
      possibility that the uppermost Cloverly Formation and Greybull Sandstone
      were deposited in the earliest Cenomanian".
