name: Chubut
rank: group
period: [Early Cretaceous, Late Cretaceous]
stages: [Aptian, Albian, Cenomanian, Turonian, Coniacian, Santonian, Campanian, Maastrichtian]
dispute:
  summary: >
    Whether the group reaches above the Cenomanian. Suárez and colleagues
    (2014) date its youngest units, the Laguna Palacios Formation and the
    Manuel Arce Member, to the Cenomanian by U–Pb and call the group "not
    younger than the Cenomanian or the late Cenomanian-early Turonian"; Casal
    and colleagues (2015) reject that minimum age, placing their Coniacian to
    Maastrichtian Lago Colhué Huapi Formation below the Laguna Palacios.
references:
  - id: canale2014a
    notes: >
      Places the Cerro Barcino within it, giving "the Cerro Castaño Member of
      Cerro Barcino Formation (Albian; Chubut Group), Central Patagonia,
      Argentina".
  - id: bonaparte1979c
    notes: >
      Dates the group by region: Senonian before the Maastrichtian in the Sierra
      San Bernardo, from its sauropods, and older east of Paso de Indios, where
      the Cerro Barcino Member is Aptian.
  - id: casal2015a
    notes: >
      Has the group's lake and river systems developing from the Aptian to the
      Campanian, and names the Lago Colhué Huapi Formation within it, above the
      Bajo Barreal.
  - id: musacchio1975a
    notes: >
      Non-marine ostracods and charophytes of "Wealden aspect" from the Cerro
      Barcino Member, locally the oldest unit of the group, at Paso de Indios
      in Patagonia correspond in age to the associations of the Cloverly,
      Peterson and other equivalent formations of the Rocky Mountains: "The
      microfossils of Paso de Indios studied suggest a Lower Cretaceous age
      (near to or just Aptian)."
  - id: hechem1987a
  - id: hechem1990a
  - id: chebli1976a
  - id: martínez1998a
    notes: >
      Calls the group's age disputed but mostly agreed to be Late Cretaceous,
      lists the published readings, and orders its formations from the Aptian
      Matasiete up to the Laguna Palacios.
  - id: rauhut2004a
    notes: >
      Gives the group as "Hauterivian-Cenomanian" around the probable type
      locality of Genyodectes serus, after Lizuaín and colleagues' provincial
      map, and dates its lowest units nearby from the Hauterivian to the
      Albian, after Nullo (1983).
  - id: huene1929a
  - id: menéndez1959a
  - id: sciutto1994a
  - id: lizuaín1995a
  - id: nullo1983a
    notes: >
      Places the whole Los Adobes Formation in the Lower Cretaceous and the
      lowest Cerro Barcino in the "Cretácica inferior (Aptiano?)"; its
      "posiblemente barremiana" for the Puesto La Paloma or Bardas Coloradas is
      relayed from Codignotto and colleagues (1978).
  - id: lesta1980a
    notes: >
      Cited by Martínez (1998) as one of the older age assignments for the
      group, Barremian to Campanian.
  - id: suárez2014a
    notes: >
      SHRIMP U–Pb dates its youngest units, the Laguna Palacios Formation and
      Manuel Arce Member, to the Cenomanian, the group "not younger than the
      Cenomanian or the late Cenomanian-early Turonian".
  - id: codignotto1978a
