name: Chubut
rank: group
period: [Early Cretaceous, Late Cretaceous]
stages: [Hauterivian, Barremian, Aptian, Albian, Cenomanian, Turonian,
  Coniacian, Santonian, Campanian, Maastrichtian]
references:
  - id: canale2014a
    notes: >
      Places the Cerro Barcino within it, giving "the Cerro Castaño Member of
      Cerro Barcino Formation (Albian; Chubut Group), Central Patagonia,
      Argentina".
  - id: bonaparte1979c
    notes: >
      Splits the group's age by region. In the Sierra San Bernardo, earlier
      authors placed its formations in the Upper Cretaceous, and the sauropods
      of the Castillo, Bajo Barreal and Laguna Palacios formations there
      support a pre-Maastrichtian Senonian age; east of Paso de Indios the
      group is older, interpreted by Chebli and colleagues (1976) as spanning
      the Barremian-Aptian interval in part, with Musacchio and Chebli (1975)
      reporting Aptian microfossils from the Cerro Barcino Member of the Gorro
      Frigio Formation.
  - id: casal2015a
    notes: >
      Has the group's lacustrine and fluvio-lacustrine systems developing from
      the Aptian, following Hechem and colleagues (1987), to the Campanian,
      following Hechem and colleagues (1990). Names the Lago Colhué Huapi
      Formation within it, above the Bajo Barreal and below the Laguna
      Palacios or Salamanca, and argues that its fossils and position rule out
      the Cenomanian U-Pb ages of the Laguna Palacios as the group's minimum
      age.
  - id: musacchio1975a
    notes: >
      Non-marine ostracods and charophytes of "Wealden aspect" from the Cerro
      Barcino Member, locally the oldest unit of the group, at Paso de Indios
      in Patagonia correspond in age to the associations of the Cloverly,
      Peterson and other equivalent formations of the Rocky Mountains: "The
      microfossils of Paso de Indios studied suggest a Lower Cretaceous age
      (near to or just Aptian)."
  - id: hechem1987a
  - id: hechem1990a
  - id: chebli1976a
  - id: martínez1998a
    notes: >
      The group's age "is controversial although there is major agreement in
      assigning it to the Upper Cretaceous", the assignments listed being
      Senonian (Huene 1929; Sciutto and Martínez 1994), Maastrichtian
      (Menéndez 1959) and Senonian-pre-Maastrichtian (Bonaparte and Gasparini,
      1979), while "Older ages have been suggested by Lesta and Ferello
      (Valanginian - lower Senonian, 1972) and Lesta et al.
      (Barremian-Campanian, 1980)". Martínez reads the faunal assemblage of
      the Bajo Barreal Formation, especially the sauropods, as indicating a
      possible Cenomanian age, and orders the group from the Matasiete
      (Aptian) up through the Castillo, Bajo Barreal and Laguna Palacios
      formations.
  - id: rauhut2004a
    notes: >
      In the country between Laguna del Mate and Manantial Pelado, where the
      type of Genyodectes serus most likely came from, "the only Mesozoic
      sedimentary unit cropping out in this area is the Chubut Group
      (Hauterivian-Cenomanian", after the provincial geological map of Lizuaín
      and colleagues (1995). Its units outcropping just northwest of the
      Cañadón Grande include the lowermost Los Adobes Formation
      (Hauterivian-Barremian) and the Puesto la Paloma (Barremian-Aptian) and
      Cerro Castaño (Aptian-Albian) members of the Cerro Barcino Formation,
      following Nullo (1983).
