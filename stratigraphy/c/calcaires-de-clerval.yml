name: Calcaires de Clerval
rank: formation
period: [Late Jurassic]
stages: [Oxfordian]
references:
  - id: mannion2017a
    notes: >
      Gives the type horizon for Vouivria as "Calcaires de Clerval Formation,
      possibly from the Tidalites de Mouchard Member", at the Damparis quarry
      near Dole, Jura, eastern France, and dates the formation by ammonites,
      its deposition ranging "from the Rotoides to the Stenocycloides subzones
      in the region", which puts Vouivria at "late middle Oxfordian to early
      late Oxfordian, Late Jurassic". Before the fossils were assigned to this
      formation, Buffetaut (1988) "attributed the dinosaur assemblage to the
      upper Oxfordian" and Broin and colleagues (1991) "placed it in the lower
      Kimmeridgian", then in 1992 proposed "a middle Oxfordian age, at the top
      of the Transversarium zone".
  - id: buffetaut1988a
  - id: debroin1991a
  - id: debroin1992a
