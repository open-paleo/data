name: Charmouth Mudstone
rank: formation
period: [Early Jurassic]
stages: [Sinemurian, Pliensbachian]
references:
  - id: norman2019a
    notes: >
      Gives "Charmouth Mudstone Formation (Upper Sinemurian)" for
      Scelidosaurus, resolved within it to the Black Ven Marl Member and the
      Asteroceras obtusum Zone.
  - id: yao2022a
    notes: >
      Gives "Sinemurian-early Pliensbachian, Charmouth Mudstone Formation,
      UK".
  - id: naish2007a
    notes: >
      Records that ammonites place most Scelidosaurus specimens in "the
      Woodstone Nodule Bed in the Charmouth Mudstone Formation", and that the
      articulated skeleton came from the Black Ven landslip between Lyme
      Regis and Charmouth.
  - id: sánchez-fenollosa2025a
    notes: >
      Independently gives "Charmouth Mudstone Formation, late Sinemurian,
      UK".
