name: Charmouth Mudstone
rank: formation
period: [Early Jurassic]
stages: [Sinemurian, Pliensbachian]
references:
  - id: norman2019a
    notes: >
      Gives "Charmouth Mudstone Formation (Upper Sinemurian)" for
      Scelidosaurus, resolved within it to the Black Ven Marl Member and the
      Asteroceras obtusum Zone.
  - id: yao2022a
    notes: >
      Gives "Sinemurian-early Pliensbachian, Charmouth Mudstone Formation,
      UK".
  - id: naish2007a
    notes: >
      Records that ammonites place most Scelidosaurus specimens in "the
      Woodstone Nodule Bed in the Charmouth Mudstone Formation", and that the
      articulated skeleton came from the Black Ven landslip between Lyme
      Regis and Charmouth.
  - id: sánchez-fenollosa2025a
    notes: >
      Independently gives "Charmouth Mudstone Formation, late Sinemurian,
      UK".
  - id: page2009a
    notes: >
      Treats the formation as a whole on ammonites. Its base lies "within the
      Semicostatum Chronozone throughout most of the region", and on the
      Devon-Dorset coast "within the succeeding Scipionanum Subchronozone with
      a non-sequence below", above the Blue Lias Formation. The top 60 cm of
      the formation on the Dorset coast yields Amaltheus bifurcatus,
      "indicating ... the base of the Upper Pliensbachian"; in East Somerset
      "the sequence passes upwards into the Dyrham Silts Formation". Credits
      the name to Cox and colleagues (1998), as a replacement for "the
      informal term 'Lower Lias clays'".
  - id: cox1998a
