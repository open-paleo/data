name: Cañón del Colorado
rank: formation
period: [Late Triassic, Early Jurassic]
stages: [Hettangian, Sinemurian, Pliensbachian, Toarcian]
references:
  - id: martínez2009a
    notes: >
      Gives the Adeopapposaurus horizon as "the Upper Pelitic Member ... of
      the Lower Jurassic Cañón del Colorado Formation", from outcrops in the
      southwestern Sierra de Mogna, San Juan, northwestern Argentina. Gives
      only the series.
  - id: barrett2019a
    notes: >
      Independently gives "the Cañón del Colorado Formation (Lower Jurassic)
      of Argentina".
  - id: apaldetti2011a
    notes: >
      Sets it beside the Norian units of the region, the Los Colorados,
      Laguna Colorada and Quebrada del Barro, as the Lower Jurassic one.
  - id: martínez2011b
    notes: >
      Assigns the formation "an Early Jurassic age (Hettangian-Toarcian)",
      from the Adeopapposaurus remains in its middle member and the Hettangian
      to Toarcian biochron of Massospondylus, its sister taxon; the paper also
      formally divides the unit into lower, middle and upper members. It
      reviews the older Triassic reading, in which "Casamiquela and Miolano
      (1983) assigned it an Upper Triassic age" from prosauropod vertebrae and
      Milana and colleagues (1995) "assigned this formation to the Upper
      Triassic".
  - id: casamiquela1983a
  - id: milana1995a
    notes: >
      The formation "has been assigned a Tertiary age but lies above the
      Patquia Formation of Late Permian age". The paper reports its new Sierra
      de Mogna locality, 60 km north of San Juan, which has yielded two
      partial skeletons of a plateosaurid-type prosauropod, as of Upper
      Triassic-Lower Jurassic age: "Age determination is based on the known
      stratigraphic range of plateosaurids; however, the authors are inclined
      to a Late Triassic age assignment based on regional geologic
      considerations."
