name: Chinle
rank: formation
period: [Late Triassic]
stages: [Carnian, Norian, Rhaetian]
lithology: variegated bentonitic claystone, siltstone, and sandstone in the
  lower part, reddish siltstone in the upper part
references:
  - id: hunt1998a
    notes: >
      Gives the Chinle Group, a wider unit than the formation, a range "from
      late Carnian (early Tuvalian) to Rhaetian", across four land-vertebrate
      faunachrons.
  - id: martz2017a
    notes: >
      Puts the base of the formation roughly at the base of the Norian and its
      uppermost members in the Apachean, "during the Rhaetian", and relays a
      date of about 227.6 Ma from the lower Mesa Redondo.
  - id: ogg2020a
    notes: >
      "the base-Norian, based on this working definition and Kent et al.
      (2017) chron ages, has a projected age of 227.3 Ma."
  - id: lucas1992a
    notes: >
      Treats the unit at group rank in north-central New Mexico, and gives its
      Rock Point Formation a "late Norian/Rhaetian age".
  - id: cather2013a
    notes: >
      Rejects the group rank on the evidence of mapping: the Chinle "should be
      considered a formation, not a group, in much of New Mexico".
  - id: tykoski2004a
    notes: >
      Tabulates material from it at both "late Carnian" and "late Norian".
      The late Carnian follows the calibration of the vertebrate faunachrons
      before the Norian was lengthened, under which much of the lower
      formation counted as Carnian.
  - id: srivastava2026a
    notes: >
      Carries the youngest bound, the Chama Basin exposures being "of latest
      Triassic age, possibly Rhaetian".
  - id: sues2025a
    notes: >
      Pairs the formation with the Norian in the American Southwest.
  - id: kent2017a
    notes: >
      Cited by Ogg and colleagues (2020) for the Newark chron ages that put
      the base of the Norian at 227.3 Ma.
  - id: stewart1972a
    notes: >
      Source of the lithology.
