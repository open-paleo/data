name: Chinle
rank: formation
period: [Late Triassic]
stages: [Carnian, Norian, Rhaetian]
references:
  - id: hunt1998a
    notes: >
      Chinle Group strata "range from late Carnian (early Tuvalian) to
      Rhaetian in age", a span Hunt and colleagues credit to Lucas and divide
      into four land-vertebrate faunachrons running from the Otischalkian up
      to the Apachean, which they equate with the Rhaetian. They work at group
      rank throughout, uniting "All Upper Triassic nonmarine strata in the
      western United States" in the Chinle Group and dividing it into about 25
      formations; the name Chinle Formation appears in the paper only in the
      titles of works they cite.
  - id: martz2017a
    notes: >
      Puts the base of the Chinle Formation at roughly the base of the Norian,
      the Tr-3 unconformity beneath it being "a major erosional hiatus" that
      "may make the base of the Chinle Formation roughly equivalent to the
      base of the Norian stage". The Apachean interval that takes in the
      formation's uppermost members runs from about 207 to 202 Ma "during the
      Rhaetian", and the Triassic-Jurassic boundary, "well calibrated at 201.3
      Ma", "may lie between the Dinosaur Canyon Member and the overlying
      Whitmore Point Member ... or even higher in the Whitmore Point Member",
      both in the Moenave Formation above.
  - id: lucas1992a
    notes: >
      Treats the unit at group rank in the Chama Basin and north-central New
      Mexico and dates it outright: these strata "are assigned to the Middle
      Triassic Moenkopi Formation and the Upper Triassic Chinle Group". Its
      youngest division there, the Rock Point Formation, carries a new
      phytosaur genus and "a diverse body of evidence suggests that these
      strata are of late Norian/Rhaetian age", and the group is truncated
      above by post-Triassic, pre-Entrada erosion beneath the Middle Jurassic
      Entrada Sandstone.
  - id: cather2013a
    notes: >
      Tests the group-rank scheme against mapping and rejects it. Lucas and
      colleagues "raised the Chinle to group rank, broadened its geographic
      extent, and raised numerous units within it to formation rank.
      Subsequent mapping has demonstrated, however, that many of these new
      formation-rank units are not viable map units and that the Chinle
      should be considered a formation, not a group, in much of New Mexico."
      Even where the Chinle is divisible, the map units "do not correspond
      well to the various formations previously proposed by stratigraphers".
  - id: tykoski2004a
    notes: >
      Tabulates material from it at both "late Carnian" and "late Norian",
      which is most of the span.
  - id: srivastava2026a
    notes: >
      Carries the youngest bound, the Chama Basin exposures being "of latest
      Triassic age, possibly Rhaetian".
  - id: sues2025a
    notes: >
      Pairs the formation with the Norian in the American Southwest.
