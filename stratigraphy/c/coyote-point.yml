name: Coyote Point
rank: member
parent: Wahweap
period: [Late Cretaceous]
stages: [Campanian]
lithology: amalgamated sandstone, with minor fine-grained floodplain deposits
references:
- id: beveridge2022a
  notes: >
    Formalizes the former upper member of the Wahweap Formation as the Coyote
    Point Member, and models its base at 80.61 Ma and its top at 79.00 Ma.
    Source of the lithology.
- id: mcfeeters2026a
  notes: >
    Places the oldest known Laramidian lambeosaurine in the member.
- id: jinnah2008a
  notes: >
    Describes the member under its informal name: "the 80–100 m thick upper
    member consists of interbedded sandstone and mudstone with at least three
    laterally extensive sandstone bodies", and "The uppermost portion of the
    upper and the capping sandstone members of the Wahweap Formation correlate
    to the Oldman Formation and possibly with the very base of the Dinosaur
    Park Formation".
- id: lund2016a
  notes: >
    Places Machairoceratops in "the upper member (~200–350 m)" of the
    formation, in a calcareous mudstone, and dates it "between 77 to 80 ± 2
    Ma".
