name: Coyote Point
rank: member
parent: Wahweap
period: [Late Cretaceous]
stages: [Campanian]
references:
- id: beveridge2022a
  notes: >
    Formalizes the four widely used informal subdivisions of the Wahweap
    Formation on the Kaiparowits Plateau as the Last Chance Creek, Reynolds
    Point, Coyote Point and Pardner Canyon Members; this is the former upper
    member. A sequence boundary at its top is inferred to be the globally
    recognized 80 Ma boundary. A Bayesian age-stratigraphic model puts the
    member's base at 80.61 +0.39/-0.51 Ma and its top at 79.00 +0.98/-0.99
    Ma, the upper figure carrying "a large uncertainty window of
    approximately two million years" because a depositional hiatus sits at
    that contact. Pushed to the far ends of both windows, 81.00 to 78.01 Ma,
    the member stays within the Campanian on this project's own stage
    boundary table.
- id: mcfeeters2026a
  notes: >
    Places the oldest known Laramidian lambeosaurine in the member.
