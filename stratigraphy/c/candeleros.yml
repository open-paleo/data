name: Candeleros
rank: formation
parent: Neuquén
period: [Late Cretaceous]
stages: [Cenomanian]
lithology: fine- to coarse-grained quartzolithic sandstone with muddy matrix,
  purple to liver red
references:
  - id: calvo1999a
    notes: >
      Treats the unit as "the Candeleros Member of the Rio Limay Formation" and
      dates it Albian by faunal correlation, narrowing an Albian–Cenomanian from
      dinosaur tracks.
  - id: hugo2001a
    notes: >
      Assigns the formation to the lower Cenomanian because it postdates the
      Main Miránica unconformity, and places it at the base of the Río Limay
      Subgroup, dated Cenomanian–lower Turonian.
  - id: garrido2010a
    notes: >
      Assigns the formation a lower Cenomanian age above the Main Miránica
      unconformity, relaying a 98.6 ± 2.5 Ma maximum age on detrital zircons
      from Tunik and colleagues (2010), and sets aside an Albian from
      vertebrate tracks. Source of the lithology.
  - id: carballido2010a
    notes: >
      Traces a taxon to it and dates it: the formation "can with a good
      measure of certainty be pinpointed as the unit of origin of
      Rayososaurus agrioensis, inferring for this an age within the early
      Cenomanian".
  - id: riguetti2022a
    notes: >
      Independently gives "Candeleros Formation (Cenomanian)".
  - id: calvo1991b
  - id: leanza2004a
    notes: >
      Gives the formation's own age as "may be regarded as Early Cenomanian",
      the basal unit of the Neuquén Group and of the Río Limay Subgroup. Its
      "Cenomanian to Early Turonian" is the subgroup's, and its "probably
      Cenomanian–Early Turonian" covers the Candeleros, Huincul and Cerro Lisandro
      together.
  - id: tunik2010a
    notes: >
      Gives its own detrital-zircon "Maximum age of Candeleros" of 98.6 ± 2.5
      Ma in southern Mendoza, and 100.5 and 104.3 Ma at two other sites, as
      "the maximum age of sedimentation".
