name: Candeleros
rank: formation
parent: Neuquén
period: [Late Cretaceous]
stages: [Cenomanian]
references:
  - id: calvo1999a
    notes: >
      Dates the unit at member rank under the older scheme, as "the Candeleros
      Member of the Rio Limay Formation", whose "age of this Member has been
      dated as Albian based on the vertebrate fauna". The Albian-Cenomanian
      that dinosaur tracks had given the member is narrowed in the same
      paragraph, a more primitive vertebrate fauna and new African discoveries
      allowing the author "to confirm that this member is Albian in age", and
      an Araripesuchus closely related to a species from the Middle Albian
      Romualdo Member is taken to imply "an Albian age for the Candeleros
      Member". Every age given here is reached by faunal correlation rather
      than by dating the rock.
  - id: hugo2001a
    notes: >
      Assigns the Candeleros Formation to the Lower Cenomanian on the General
      Roca sheet: its base must post-date the Principal Miránica unconformity,
      correlated with a global discontinuity placed in the Lower Cenomanian at
      97 ± 3 Ma, and "consequently, this unit is assigned to the Lower
      Cenomanian". The sheet's stratigraphic chart carries the unit under the
      Cenomanian at the base of the Río Limay Subgroup, and the subgroup as a
      whole is assigned to the Cenomanian-lower Turonian.
  - id: garrido2010a
    notes: >
      Assigns the formation a Lower Cenomanian age - "On the basis of the
      existing information, the Candeleros Fm. is assigned a Lower Cenomanian
      age" - resting it on zircon dating that puts the start of deposition
      above the δ1 unconformity in the basal Cenomanian and on the Main
      Miranic (Patagonídica) Unconformity beneath it, placed in the
      Cenomanian. Calvo (1991) had put the same deposits in the Albian from
      vertebrate ichnology; that reading is reported and then set aside. A
      figure caption contrasts "the Candeleros Formation (Cenomanian) and the
      Lohan Cura Formation (Albian)", the Albian unit being the one it rests
      on south of the Huincul Ridge.
  - id: carballido2010a
    notes: >
      Traces a taxon to it and dates it: the formation "can with a good
      measure of certainty be pinpointed as the unit of origin of
      Rayososaurus agrioensis, inferring for this an age within the early
      Cenomanian".
  - id: riguetti2022a
    notes: >
      Independently gives "Candeleros Formation (Cenomanian".
