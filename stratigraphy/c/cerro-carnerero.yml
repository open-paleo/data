name: Cerro Carnerero
rank: member
parent: Lonco Trapial
period: [Early Jurassic]
stages: [Pliensbachian, Toarcian]
dispute:
  summary: >
    Nullo and Proserpio (1975) make it a member of the Lonco Trapial
    Formation, one of the formations of the former Lonco Trapial Group that
    article 7 of the Argentine code reduces to members. Rauhut (2003) and
    Pol and colleagues (2022) still write "Cerro Carnerero Formation", Rauhut
    as "the basal formation of the Lonco Trapial Group" and Pol and
    colleagues as a unit "overlain by the Lonco Trapial Formation".
references:
  - id: rauhut2003c
    notes: >
      Reviews the Amygdalodon type material, gives the Toarcian to Bajocian
      reading, and places the unit as "the basal formation of the Lonco
      Trapial Group". Citing Page and colleagues (1999) that volcanism in the
      area started in the Aalenian, it narrows the estimate: "a late Toarcian
      to Aalenian age seems to be most likely for the Cerro Carnerero
      Formation, but more data is needed to confirm this". These readings
      predate the U-Pb dating of the Lonco Trapial.
  - id: pol2022a
    notes: >
      Gives the older reading, "the Cerro Carnerero Formation
      (Pliensbachian–early Toarcian)", for the earliest South American
      Jurassic sauropod, from Cañadón Puelman southwest of Cerro Carnerero,
      Chubut. It notes the unit "has been regarded as Early to Middle Jurassic
      by different authors" and, from Pliensbachian ammonites in underlying
      horizons and the overlying Lonco Trapial Formation dated at 185 Ma,
      concludes it is likely that it "was deposited at some point during the
      Pliensbachian or the early Toarcian". The 185 Ma it attributes to Pol
      and colleagues (2020) does not match that paper's own date for the
      Lonco Trapial, 180.330 ± 0.068 Ma; the stage conclusion stands either
      way. It also cautions that the Lonco Trapial "may not be synchronous in
      all areas in which it has been recognized".
  - id: upchurch2004a
    notes: >
      A reference work, tabulating the unit as Bajocian, the age it was
      usually given before the U-Pb dating.
  - id: page1999a
  - id: nullo1975a
    notes: >
      Reduces it from a formation to a member: under article 7 of the code
      "the Formations that made up the Lonco Trapial Group should be
      considered as members", with the Cerro Carnerero Member between the
      Cajón de Ginebra and Pampa de Agnia members of the Lonco Trapial
      Formation.
  - id: pol2020a
