name: Cerro Carnerero
rank: formation
parent: Lonco Trapial
period: [Early Jurassic, Middle Jurassic]
stages: [Pliensbachian, Toarcian, Aalenian, Bajocian]
dispute:
  summary: >
    The age is openly unsettled and no radiometric date resolves it. Rauhut
    (2003) gives "the Cerro Carnerero Formation (Toarcian-Bajocian)" and
    records that the age "is still uncertain. Although usually cited as
    Bajocian ..., it has also been regarded as Early Jurassic by some
    authors". Pol and colleagues (2022) give "Pliensbachian-early Toarcian"
    and repeat that the unit "has been regarded as Early to Middle Jurassic by
    different authors". Upchurch and colleagues (2004) tabulate it as Bajocian
    alone.
references:
  - id: rauhut2003c
    notes: >
      Reviews the Amygdalodon type material, gives the Toarcian to Bajocian
      reading, and places the unit as "the basal formation of the Lonco
      Trapial Group". Citing Page and colleagues (1999) that volcanism in the
      area started in the Aalenian, it narrows the estimate: "a late Toarcian
      to Aalenian age seems to be most likely for the Cerro Carnerero
      Formation, but more data is needed to confirm this".
  - id: pol2022a
    notes: >
      Gives the older reading, "the Cerro Carnerero Formation
      (Pliensbachian–early Toarcian)", for the earliest South American
      Jurassic sauropod, from Cañadón Puelman southwest of Cerro Carnerero,
      Chubut. It notes the unit "has been regarded as Early to Middle Jurassic
      by different authors" and, from Pliensbachian ammonites in underlying
      horizons and the overlying Lonco Trapial Formation dated at 185 Ma,
      concludes it is likely that it "was deposited at some point during the
      Pliensbachian or the early Toarcian".
  - id: upchurch2004a
    notes: >
      A reference work, tabulating the unit as Bajocian.
  - id: page1999a
