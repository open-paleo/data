name: Cerro Carnerero
rank: member
parent: Lonco Trapial
period: [Early Jurassic]
stages: [Pliensbachian, Toarcian]
lithology: andesitic crystalline tuff
dispute:
  summary: >
    Nullo and Proserpio (1975) make it a member of the Lonco Trapial
    Formation, one of the formations of the former Lonco Trapial Group that
    article 7 of the Argentine code reduces to members. Rauhut (2003) and
    Pol and colleagues (2022) still write "Cerro Carnerero Formation", Rauhut
    as "the basal formation of the Lonco Trapial Group" and Pol and
    colleagues as a unit "overlain by the Lonco Trapial Formation".
references:
  - id: rauhut2003c
    notes: >
      Reviews the Amygdalodon type material and gives the unit as
      "Toarcian-Bajocian", narrowing it to "a late Toarcian to Aalenian age" as
      most likely while asking for more data.
  - id: pol2022a
    notes: >
      Dates the unit "Pliensbachian–early Toarcian", between Pliensbachian
      ammonites below and the overlying Lonco Trapial, for Amygdalodon from
      Cañadón Puelman, Chubut.
  - id: upchurch2004a
    notes: >
      A reference work, tabulating the unit as Bajocian, the age it was
      usually given before the U-Pb dating.
  - id: page1999a
  - id: nullo1975a
    notes: >
      Reduces it from a formation to a member: under article 7 of the code "the
      Formations that made up the Lonco Trapial Group should be considered as
      members", with the Cerro Carnerero Member between the Cajón de Ginebra and
      Pampa de Agnia members of the Lonco Trapial Formation. Source of the
      lithology.
  - id: pol2020a
  - id: riccardi1992a
    notes: >
      Gives the underlying Osta Arena and Mulanguiñeu Formations "late
      Pliensbachian–early Toarcian ammonites", with the Carnerero "probably"
      unconformable on them; no age of its own.
