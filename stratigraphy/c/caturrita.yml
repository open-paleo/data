name: Caturrita
rank: formation
period: [Late Triassic]
stages: [Norian]
references:
  - id: langer2018a
    notes: >
      Dates the fossil-rich basal sandstones at Linha São Luiz, the
      Guaibasaurus beds, by the single youngest of fourteen zircons, 225.42 ±
      0.37 Ma, "the maximum age of the Caturrita Formation", and reads it as
      early Norian (Lacian). The underlying Santa Maria Formation gives a
      maximum age of 233.23 Ma, late Carnian.
  - id: müller2023a
    notes: >
      Relays Langer and colleagues (2018): the formation "is considered early
      Norian (Late Triassic) according high-precision U–Pb zircon
      geochronology, which indicates a maximum age of 225.42 ± 0.37 Ma".
  - id: peyredefabrègues2015a
    notes: >
      Tabulates Guaibasaurus from it as "Late Triassic (Norian)", west of
      Candelária, Rio Grande do Sul.
  - id: leal2004a
    notes: >
      Gives the Unaysaurus site at Água Negra, near Santa Maria, as "Late
      Triassic (Carnian-Norian) Caturrita Formation", crediting Andreis and
      colleagues (1980), and puts the formation at "c. 225 million years old".
      Sets it above the Carnian Santa Maria Formation. The Carnian is the
      older reading, which the later zircon age supersedes.
  - id: andreis1980a
