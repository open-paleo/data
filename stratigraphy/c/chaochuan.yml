name: Chaochuan
rank: formation
parent: Yongkang
period: [Early Cretaceous, Late Cretaceous]
stages: [Aptian, Albian, Cenomanian]
dispute:
  summary: >
    Luo and Yu (2004) give the formation Rb-Sr ages of 101.5 to 96.3 Ma, all
    from volcanic rocks outside the Yongkang Basin, and call it "early Late
    Cretaceous (or possibly late Early Cretaceous to early Late
    Cretaceous)"; Ma and colleagues (2016) date a Chaochuan tuff in the
    Lishui Basin, where Zhejiangosaurus was found, at 118 ± 1 Ma, placing
    the Guantou and Chaochuan together at 124-112 Ma.
references:
- id: chen2013a
  notes: >
    Second of the three formations of the Yongkang Group in the Yongkang Basin
    of Zhejiang, above the Guantou and below the Fangyan, and a lacustrine
    purplish sandstone with interbedded igneous rock. Radiometric dates range
    from 105 to 96 Ma, an Albian to Cenomanian span, and fossil comparison
    places deposition in the early Late Cretaceous; the Dongyangopelta horizon
    is given as "Late Early to early Late Cretaceous (Albian - Cenomanian)".
- id: zheng2012a
  notes: >
    Reports dates of 101 to 96 Ma and treats the Chaochuan, Liangtoutang
    and Lanxi Formations as stratigraphically and temporally equivalent on
    faveoloolithid egg taxa, with paleomagnetic support for the Chaochuan
    to Liangtoutang correlation.
- id: oyabu2026a
  notes: >
    Repeats the Albian to Cenomanian span for the formation in Zhejiang.
- id: pond2023a
  notes: >
    Calls it "the Albian–Aptian Chaochuan Formation", the source of
    Zhejiangosaurus and Dongyangopelta.
- id: zhang2009b
  notes: >
    Gives the naming authority as "Ju Tianyin, Chen Qishi, 1960, Zhejiang
    Petroleum Geology, (2)", with its type locality at "The Chaochuan
    village in Yongkang County, Zhejiang Province", a formation "within the
    Yongkang Group".
- id: luo2004a
  notes: >
    Tabulates Rb-Sr ages of 101.5, 98.0, 97.2 and 96.3 Ma for Chaochuan
    volcanic rocks, from the Wencheng, Sanmen, Wuyi and Xinchang areas
    rather than the Yongkang Basin, and concludes that the formation "is
    early Late Cretaceous (or possibly late Early Cretaceous to early Late
    Cretaceous)".
- id: yu2010a
  notes: >
    Repeats the 101.5 to 96.3 Ma ages from Luo and Yu (2004), gives
    Zhejiangosaurus from the "Chaochuan Formation at Baiqian Village,
    Liancheng Town, Liandu District, Lishui City", and concludes that the
    dinosaur egg-bearing strata "range in age from the Albian stage of the
    late Early Cretaceous to the early Late Cretaceous".
- id: ma2016a
  notes: >
    Dates a Chaochuan tuff in the Lishui Basin, sample ZJ66, at 118 ± 1 Ma,
    and groups the Guantou and Chaochuan in a lower volcanic-sedimentary
    assemblage of 124-112 Ma, below the Fangyan at 104-91 Ma. Gives no stage
    names.
