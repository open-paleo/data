name: Camarillas
rank: formation
period: [Early Cretaceous]
stages: [Barremian]
references:
  - id: ruiz-omeñaca2012a
    notes: >
      Gives the "Camarillas Formation, which is Barremian".
  - id: verdú2017a
    notes: >
      Places it in the local succession as "Camarillas Formation (lower
      Barremian)", above the El Castellar and below the Artoles, Morella and
      Areniscas de las Parras de Martín formations. The Iguanodon galvensis
      material at Galve comes from its "lower Barremian (Lower Cretaceous)
      deposits", an age drawn from charophytes, ostracods and palynology.
