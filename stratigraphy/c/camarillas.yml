name: Camarillas
rank: formation
period: [Early Cretaceous]
stages: [Barremian]
description: "The Camarillas Formation is a geological formation in the Teruel Province of Aragón, Spain whose strata date back to the Early Cretaceous (Barremian stage). The sandstones, mudstones and conglomerates of the formation, that due to syn-sedimentary faulting varies greatly in thickness from 300 to 800 meters (980 to 2,620 ft), were deposited in fluvial, deltaic and lacustrine environments. The formation was deposited in the Galve Sub-basin of the Maestrazgo Basin in central-eastern Spain. The Camarillas Formation has provided a rich fossil assemblage of fossils of mammals, snakes, turtles, crocodylians, fish, dinosaurs and their eggs. Various tracksites of families of dinosaurs exist in the formation."
references:
  - id: ruiz-omeñaca2012a
    notes: >
      Gives the "Camarillas Formation, which is Barremian".
  - id: verdú2017a
    notes: >
      Places it in the local succession as "Camarillas Formation (lower
      Barremian)", above the El Castellar and below the Artoles, Morella and
      Areniscas de las Parras de Martín formations. The Iguanodon galvensis
      material at Galve comes from its "lower Barremian (Lower Cretaceous)
      deposits", an age drawn from charophytes, ostracods and palynology.
