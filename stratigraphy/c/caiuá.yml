name: Caiuá
rank: group
period: [Early Cretaceous, Late Cretaceous]
stages: [Aptian, Albian, Cenomanian]
lithology: sandstone
dispute:
  summary: >
    Fernandes and Coimbra (2000) place it in "the Upper Cretaceous
    sequence", and Langer and colleagues (2019) suggest "a
    younger (Late Cretaceous) age" from its inferred synchronicity with the
    Adamantina Formation. Arai and Dias-Brito (2023) hold that "The Caiuá
    Group is here sustained as the Aptian–Albian", from its pterosaurs and a
    noasaurid, and Dias and colleagues (2020) place it in an "Early
    Cretaceous Sequence 1" below a regional unconformity. Menegazzo and
    colleagues (2016) date it Cenomanian from the same pterosaur, a lizard
    and theropod footprints.
references:
  - id: fernandes2000a
    notes: >
      Divides the Upper Cretaceous sequence into two "partially contemporaneous"
      groups, the Caiuá, of the Rio Paraná, Goio Erê and Santo Anastácio
      formations, and the Bauru.
  - id: langer2019a
    notes: >
      Independently gives it as "composed of three coeval units: the Rio
      Paraná, Goio Erê, and Santo Anastácio formations".
  - id: dias2020a
    notes: >
      Places the group in Batezelli's (2015) Early Cretaceous Sequence 1, below
      the regional unconformity that separates it from the Late Cretaceous Bauru
      Group formations.
  - id: batezelli2015a
    notes: >
      Relays the Aptian–Albian suggested for the group by Fúlfaro and
      colleagues (1999) and Dias-Brito and colleagues (2001), and adopts it in
      its own voice, "the Aptian/Albian Sequence 1"; reports pterosaur bones,
      tentatively tapejarid, from the Goio Erê.
  - id: dias-brito2001a
  - id: fúlfaro1999a
  - id: arai2023a
    notes: >
      "The Caiuá Group is here sustained as the Aptian–Albian", on the ages
      suggested by the pterosaurs Caiuajara dobruskii and Keresdrakon vilsoni
      and the noasaurid Berthasaura leopoldinae from the Goioerê Formation.
  - id: fernandes1994a
    notes: >
      Source of the lithology.
  - id: menegazzo2016a
    notes: >
      Treats the unit as the Caiuá Formation and dates it Cenomanian from the
      pterosaur Caiuajara dobruskii, the lizard Gueragama sulamericana and
      theropod footprints.
