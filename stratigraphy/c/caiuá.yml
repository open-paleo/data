name: Caiuá
rank: group
period: [Early Cretaceous, Late Cretaceous]
stages: [Aptian, Albian]
dispute:
  summary: >
    Fernandes and Coimbra (2000) place it in "the Upper Cretaceous
    sequence", and Langer and colleagues (2019) suggest "a
    younger (Late Cretaceous) age" from its inferred synchronicity with the
    Adamantina Formation. Arai and Dias-Brito (2023) hold that "The Caiuá
    Group is here sustained as the Aptian–Albian", from its pterosaurs and a
    noasaurid, and Dias and colleagues (2020) place it in an "Early
    Cretaceous Sequence 1" below a regional unconformity.
references:
  - id: fernandes2000a
    notes: >
      Keeps it alongside the Bauru: "The Upper Cretaceous sequence is now
      divided in two groups, partially contemporaneous: Caiuá Group (Rio
      Paraná, Goio Erê and Santo Anastácio formations) and Bauru Group". The
      two groups are credited to Fernandes and Coimbra (1994): "A sequência
      suprabasáltica neocretácea é formada pelos grupos Bauru e Caiuá" (the
      suprabasaltic Upper Cretaceous sequence is formed by the Bauru and Caiuá
      groups, translated), and the three-formation subdivision is adopted from
      the same authors' earlier work. The Santo Anastácio Formation's sand
      sheets lie "marginais dos grandes complexos de dunas do sand sea
      (Deserto Caiuá)" (marginal to the great dune complexes of the sand sea,
      the Caiuá Desert, translated). No stage is stated for the group itself.
  - id: langer2019a
    notes: >
      Independently gives it as "composed of three coeval units: the Rio
      Paraná, Goio Erê, and Santo Anastácio formations".
  - id: dias2020a
    notes: >
      Belongs to the first of the two second-order sequences into which
      Batezelli (2015) divides the Bauru Basin, "an Early Cretaceous Sequence
      1 and a Late Cretaceous Sequence 2, separated by a regional unconformity
      (Unconformity K-1). Sequence 1 is represented by eolian and fluvial
      deposits of the Caiuá Group units", the younger sequence holding the
      Araçatuba, Adamantina, Uberaba and Marília formations.
  - id: batezelli2015a
    notes: >
      "Aptian-Albian ages to the Caiuá Group" have been suggested by some
      authors, "Based on stratigraphic relationship with Bauru Group, facies
      analysis and evidences of climatic variations", after Fúlfaro and
      colleagues (1999) and Dias-Brito and colleagues (2001). Its own fossil
      content is pterosaur bone fragments, tentatively tapejarid, from three
      horizons of reddish sandstone in the Goio Erê Formation.
  - id: dias-brito2001a
  - id: fúlfaro1999a
  - id: arai2023a
    notes: >
      "The Caiuá Group is here sustained as the Aptian–Albian", on the ages
      suggested by the pterosaurs Caiuajara dobruskii and Keresdrakon vilsoni
      and the noasaurid Berthasaura leopoldinae from the Goioerê Formation.
  - id: fernandes1994a
