name: Couche III
informal: true
parent: Phosphates of the Oulad Abdoun Basin
period: [Late Cretaceous]
stages: [Maastrichtian]
references:
  - id: longrich2017a
    notes: >
      Establishes what the name is. The phosphates "are divided locally by OCP
      into a series of beds or 'couches'... From top to bottom these are Sillon
      B, Faisceau A, Couche 0, Couche 0' and Couche 1 (lower Eocene), Couche 2
      (Paleocene), Couche III and Niveaux inferieurs (Maastrichtian)". A mining
      company's working subdivision of the phosphates rather than a formally
      erected unit.
  - id: longrich2026a
    notes: >
      Dates the upper part to the final million years of the Maastrichtian and
      the lower part, from its shark fauna, to the late but not latest
      Maastrichtian, separated by "≥1 Ma".
  - id: longrich2021a
    notes: >
      Dates the upper part: "Upper Couche III is late Maastrichtian based on
      selachian biostratigraphy (Noubhani and Cappetta, 1997); carbon and
      oxygen isotope chemostratigraphy constrain it to the final ~1 Ma of the
      Cretaceous (Kocsis et al., 2014)."
  - id: kocsis2013a
    notes: >
      Calls it "Bed III" and correlates its stable isotope values with the
      latest Maastrichtian global record.
  - id: noubhani1997a
    notes: >
      Cited by Longrich and colleagues (2021) for the selachian
      biostratigraphy dating upper Couche III to the late Maastrichtian.
