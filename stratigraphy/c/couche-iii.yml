name: Couche III
rank: bed
informal: true
period: [Late Cretaceous]
stages: [Maastrichtian]
references:
  - id: longrich2017a
    notes: >
      Establishes what the name is. The phosphates "are divided locally by OCP
      into a series of beds or 'couches'... From top to bottom these are Sillon
      B, Faisceau A, Couche 0, Couche 0' and Couche 1 (lower Eocene), Couche 2
      (Paleocene), Couche III and Niveaux inferieurs (Maastrichtian)". A mining
      company's working subdivision rather than a formally erected unit, which
      is why it carries `informal` and no parent: the papers name no formation
      above it, only "the phosphates" of the Ouled Abdoun Basin.
  - id: longrich2026a
    notes: >
      The fullest statement, and the only one reaching the lower part:
      "Couche III is late Maastrichtian, Couche II is Paleocene, and Couches 0
      and I are Early Eocene in age. Upper Couche III is of latest
      Maastrichtian age, and dates to the final million years of the
      Maastrichtian. Lower Couche III appears to be slightly older. Its
      precise age is unknown, but the shark fauna resembles that of Upper
      Couche III, suggesting it is late, but not latest, Maastrichtian in
      age." It puts the gap between the two parts at "A significant period of
      time (≥1 Ma)".
  - id: longrich2021a
    notes: >
      Dates the upper part: "Upper Couche III is late Maastrichtian based on
      selachian biostratigraphy (Noubhani and Cappetta, 1997); carbon and
      oxygen isotope chemostratigraphy constrain it to the final ~1 Ma of the
      Cretaceous (Kocsis et al., 2014)."
