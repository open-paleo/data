name: Csehbánya
rank: formation
period: [Late Cretaceous]
stages: [Santonian]
references:
  - id: ősi2005a
    notes: >
      States that the "Csehbanya Formation is Santonian" and gives the
      Hungarosaurus type horizon as "Csehbanya Formation, Upper Cretaceous
      (Santonian)", spelling the name without diacritics.
  - id: ősi2012a
    notes: >
      Independently gives the "Csehbánya Formation ... of Santonian" age, and
      describes Mochlodon vorosi from "the Upper Cretaceous (Santonian)
      continental deposits of the Csehbánya Formation of Iharkút, western
      Hungary".
