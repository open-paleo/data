name: Castrillo de la Reina
rank: formation
period: [Early Cretaceous]
stages: [Barremian, Aptian]
references:
  - id: torcidafernández-baldor2011a
    notes: >
      Gives "Castrillo de la Reina Formation (Late Barremian-Early Aptian),
      Burgos, Spain".
  - id: dieudonné2026a
    notes: >
      Independently gives "the upper Barremian to lower Aptian (Lower
      Cretaceous) Castrillo de la Reina Formation", whose continental
      sediments lie mostly near Salas de los Infantes, and supports that age
      through the laterally contiguous Leza Formation, whose marine-influenced
      top, following Suárez-González (2015), might correspond to sea-level
      peaks generally dated in the middle to upper part of the lower Aptian.
  - id: suárez-gonzález2015a
