name: Coal Ridge
rank: member
parent: Judith River
period: [Late Cretaceous]
stages: [Campanian]
references:
  - id: mallon2016a
    notes: >
      Gives "Coal Ridge Member of the Judith River Formation in Montana, USA,
      which dates to ~76 Ma (upper Campanian)".
  - id: warner-cowgill2025a
    notes: >
      Places a Daspletosaurus site about 13 m below the overlying Woodhawk
      Member in "the Upper Cretaceous (Late Campanian) Coal Ridge Member of
      the Judith River Formation". The member lies above the Judith
      River-Belly River discontinuity, dated by Rogers and colleagues to about
      76.3 Ma, and the paper brackets the site between a maximum model age of
      76.12 +0.14/-0.47 Ma and a minimum of 75.81 +0.33/-0.37 Ma, the latter
      judged the more reliable.
  - id: arbour2017a
    notes: >
      Places it as the upper, transgressive member of the formation, above the
      McClelland Ferry Member across the mid-Judith discontinuity, about 90 m
      thick at Havre and "broadly contemporaneous with the Dinosaur Park
      Formation". It relays from Rogers and colleagues (2016) that the member
      "was deposited between 76.2 and 75.2 Ma".
  - id: rogers2016a
