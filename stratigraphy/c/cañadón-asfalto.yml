name: Cañadón Asfalto
rank: formation
period: [Early Jurassic, Middle Jurassic]
stages: [Toarcian, Aalenian, Bajocian]
dispute:
  summary: >
    Whether the Late Jurassic Puesto Almada beds belong to the formation is
    unsettled. Rauhut and Pol (2017) report that other workers refer them to
    a "Puesto Almada Member of the Cañadón Asfalto Formation", while Cúneo
    and colleagues (2013) and Rauhut and Pol (2017) assign them to the
    overlying Cañadón Calcáreo Formation. The age of the beds is not in
    question: there is "agreement in the Late Jurassic age of these rocks".
    Without those beds the formation is Toarcian to Bajocian.
references:
  - id: pol2020a
    notes: >
      Dates the base directly. The Bagualia bone bed, "positioned close to
      the base of the Cañadón Asfalto Formation", gives 179.17 +/- 0.12 Ma
      by CA-ID-TIMS on zircon — "Early Jurassic, Toarcian". A second date,
      178.07 ± 0.21 Ma, comes "from the upper Cañadón Asfalto Formation in
      a nearby section".
  - id: cúneo2013a
    notes: >
      Reports the older reading, that the formation "has been
      traditionally considered Middle to Late Jurassic
      (Callovian-Oxfordian) in age mainly based on its record of
      freshwater invertebrates" and plants. Reports Salani's (2007)
      whole-rock K-Ar date of 170.9 +/- 4.4 Ma (Aalenian-Bajocian) from
      the basal formation and U-Pb zircon dates of 161 +/- 3 Ma. Its own
      U-Pb CA-TIMS dates give "a mid-late Toarcian to Aalenian
      (-Bajocian?) age for the Cañadón Asfalto Formation", and the middle
      to upper sections, above the uppermost basalt flow at Cerro Cóndor,
      "can now be considered essentially early Middle Jurassic in age
      (Aalenian to probably Bajocian)". Names two members, "lower
      lacustrine/tuffaceous (Las Chacritas)" and "upper siliciclastic
      fluvial (Puesto Almada)". A biotite K-Ar date of 147.1 ± 3.3 Ma,
      from a dacitic tuff, comes from what "has been described as the
      upper Puesto Almada Member"; the 161 ± 3 Ma dates are tied to no
      member. Much of the fluvial strata assigned to that member, it says,
      "arguably belongs to the overlying Cañadón Calcáreo Formation".
  - id: salani2007a
  - id: holwerda2021a
    notes: >
      "The early Middle Jurassic (Toarcian-Bajocian, possibly earliest
      Bathonian) Cañadón Asfalto Formation" conformably overlies the
      Pliensbachian to early Toarcian Lonco Trapial Formation, and "the
      youngest radiometric age for this formation has been given as
      Bajocian-Bathonian" by Cabaleri and colleagues (2010). The
      Patagosaurus holotype comes from Cerro Cóndor North, in beds "dated
      to latest Early–Middle Jurassic". The Bathonian rests only on that
      hedged relay.
  - id: cabaleri2010a
  - id: pol2022a
    notes: >
      Gives "The Cañadón Asfalto Formation (middle–late Toarcian)",
      extending the dates of Pol and colleagues (2020) from the
      fossiliferous interval to the whole unit.
  - id: rauhut2017a
    notes: >
      Assigns the Puesto Almada section to the overlying Cañadón Calcáreo
      Formation and notes that, "despite the differences in nomenclature,
      there is agreement in the Late Jurassic age of these rocks". "A tuff
      at the top of the lacustrine section at Puesto Almada has recently
      been dated at 157 Ma (latest Oxfordian; Cúneo et al., 2013)".
