name: Caiuá
rank: group
period: [Early Cretaceous, Late Cretaceous]
stages: [Aptian, Albian]
references:
  - id: fernandes2000a
    notes: >
      Erects it alongside the Bauru: the Upper Cretaceous sequence "is now
      divided in two groups, partially contemporaneous: Caiuá Group (Rio
      Paraná, Goio Erê and Santo Anastácio formations) and Bauru Group". Its
      deposits are "great dune complexes of the sand sea (Caiuá Desert)" with
      rarer "deposits of torrential rain runoff (wadis)". No stage is stated
      for the group itself.
  - id: langer2019a
    notes: >
      Independently gives it as "composed of three coeval units: the Rio
      Paraná, Goio Erê, and Santo Anastácio formations".
  - id: dias2020a
    notes: >
      Belongs to the first of the two second-order sequences into which
      Batezelli (2017) divides the Bauru Basin, "an Early Cretaceous Sequence
      1 and a Late Cretaceous Sequence 2, separated by a regional unconformity
      (Unconformity K-1). Sequence 1 is represented by eolian and fluvial
      deposits of the Caiuá Group units", the younger sequence holding the
      Araçatuba, Adamantina, Uberaba and Marília formations.
  - id: batezelli2015a
    notes: >
      "Aptian-Albian ages to the Caiuá Group" have been suggested by some
      authors, "Based on stratigraphic relationship with Bauru Group, facies
      analysis and evidences of climatic variations", after Fulfaro and
      colleagues (1999) and Dias-Brito and colleagues (2001). Its own fossil
      content is pterosaur bone fragments, tentatively tapejarid, from three
      horizons of reddish sandstone in the Goio Erê Formation.
