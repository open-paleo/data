name: Chilson
rank: member
parent: Lakota
period: [Early Cretaceous]
stages: [Berriasian, Valanginian]
references:
  - id: boyd2015b
    notes: >
      Names it the basal of the Lakota Formation's three members, before the
      Minnewaste Limestone and the Fuson, and equates it with "Unit L1 ...
      recognized by a predominance of interbedded siltstone and mudstone, and
      numerous coal beds".
  - id: farke2014a
    notes: >
      Suggests that the pre-Aptian basal part of the Cloverly Formation may
      correlate with "the lower Lakota (L1 interval or Chilson Member)
      Formation, Wyoming and South Dakota, and the lower Cedar Mountain
      (Yellow Cat Member) Formation, Utah, both of which may be as old as
      Berriasian–Valanginian".
  - id: sohn1979a
    notes: >
      Places the ostracode faunule that Roth (1933) assumed came from the
      Morrison Formation in this member: "the faunule is from Lower Cretaceous
      rocks and belongs in the Chilson Member of the Lakota Formation,
      probably Unit 2". It estimates the timespan of the member's
      ostracode-bearing rocks as "less than 10 m.y., somewhere between 118
      m.y. and 128 m.y. before the present".
  - id: roth1933a
  - id: cifelli2014a
    notes: >
      The type horizon of the new mammals from Hell Canyon, Fall River County,
      is the "Chilson Member, Lakota Formation (Lower Cretaceous: upper
      Berriasian–Valanginian)". The lower part of Chilson Member unit 2 in the
      southern Black Hills "has been comparatively well sampled
      micropaleontologically", and age constraints for that part of the
      section "are late Berriasian–Valanginian"; no ostracods or charophytes
      are known from unit 1 beneath it, and "upper age constraints for the
      member remain to be firmly established".
