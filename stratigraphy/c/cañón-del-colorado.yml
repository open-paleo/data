name: Cañón del Colorado
rank: formation
period: [Early Jurassic]
stages: [Hettangian, Sinemurian, Pliensbachian, Toarcian]
lithology: mudstone, sandy mudstone, conglomerate and sandstone
references:
  - id: martínez2009a
    notes: >
      Gives the Adeopapposaurus horizon as "the Upper Pelitic Member ... of
      the Lower Jurassic Cañón del Colorado Formation", from outcrops in the
      southwestern Sierra de Mogna, San Juan, northwestern Argentina. Gives
      only the series.
  - id: barrett2019a
    notes: >
      Independently gives "the Cañón del Colorado Formation (Lower Jurassic)
      of Argentina".
  - id: apaldetti2011a
    notes: >
      Sets it beside the Norian units of the region, the Los Colorados,
      Laguna Colorada and Quebrada del Barro, as the Lower Jurassic one.
  - id: martínez2011b
    notes: >
      Assigns the formation "a Lower Jurassic (Hettangian-Toarcian) age" from
      the biochron of Massospondylus, sister taxon of Adeopapposaurus, and
      divides it into three members. Source of the lithology.
  - id: casamiquela1983a
  - id: milana1995a
    notes: >
      Reports two specimens of "a new prosauropod of the plateosaurid type" from
      the formation in the Sierra de Mogna, and leans to a Late Triassic age on
      regional geology.
