name: Cañón del Colorado
rank: formation
period: [Early Jurassic]
stages: [Hettangian, Sinemurian, Pliensbachian, Toarcian]
references:
  - id: martínez2009a
    notes: >
      Gives the Adeopapposaurus horizon as "the Upper Pelitic Member ... of
      the Lower Jurassic Cañón del Colorado Formation", from outcrops in the
      southwestern Sierra de Mogna, San Juan, northwestern Argentina. Gives
      only the series.
  - id: barrett2019a
    notes: >
      Independently gives "the Cañón del Colorado Formation (Lower Jurassic)
      of Argentina".
  - id: apaldetti2011a
    notes: >
      Sets it beside the Norian units of the region, the Los Colorados,
      Laguna Colorada and Quebrada del Barro, as the Lower Jurassic one.
  - id: martínez2011b
    notes: >
      Assigns the formation, in the authors' English abstract, "a Lower
      Jurassic (Hettangian-Toarcian) age" (p. 96), from the Adeopapposaurus
      remains in its middle member and the Hettangian to Toarcian biochron of
      Massospondylus, its sister taxon (p. 106); the paper also formally
      divides the unit into lower, middle and upper members. It reviews the
      older Triassic reading: "Casamiquela y Miolano (1983) le asignaron una
      edad triásica superior" ("Casamiquela and Miolano (1983) assigned it an
      Upper Triassic age", translated), from prosauropod vertebrae, and
      "Milana et al. (1995) asignaron esta formación al Triásico Superior"
      ("Milana and colleagues (1995) assigned this formation to the Upper
      Triassic", translated; p. 97).
  - id: casamiquela1983a
  - id: milana1995a
    notes: >
      Reports a new locality in the Sierra de Mogna, 60 km north of San Juan,
      with two partial skeletons of "a new prosauropod of the plateosaurid
      type", from the formation, "which has been assigned a Tertiary ages
      [sic] but lies above the Patquia Formation of Late Permian age"
      (p. 44A). Its title gives an Upper Triassic to Lower Jurassic age, and
      the text leans to the Late Triassic: "Age determination is based on
      the known stratigraphic range of plateosaurids; however, the authors
      are inclined to a Late Triassic age assignment based on regional
      geologic considerations" (p. 45A). Martínez and Colombi (2011) report
      that as the older view and assign the Lower Jurassic.
