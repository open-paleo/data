name: Craie glauconieuse
rank: formation
period: [Late Cretaceous]
stages: [Cenomanian]
references:
  - id: hoyez2020a
    notes: >
      The dedicated stratigraphy of the Cenomanian of the Caux coast of
      Normandy, which distinguishes three formations bounded by hardgrounds
      and makes this the first, "bounded at its base by the Octeville erosion
      surface and at its top by the HG (hardground) Rouen 1", below the Rouen
      Chalk and the Antifer Chalk. The paper's English version renders the
      name Glauconitic Chalk.
  - id: buffetaut2024a
    notes: >
      Fixes the Caletodraco horizon within it by sequence and ammonite zone,
      the specimen referable "to the C3 sequence of Hoyez et al.,
      corresponding to the Mantelliceras dixoni zone of the lower Cenomanian
      glauconitic Chalk", and records that the unit of the Pays de Caux is a
      marine deposit.
