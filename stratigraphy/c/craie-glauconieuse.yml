name: Craie glauconieuse
rank: formation
period: [Late Cretaceous]
stages: [Cenomanian]
variants: [Craie glauconieuse de St. Jouin, St. Jouin]
references:
  - id: hoyez2020a
    notes: >
      The dedicated stratigraphy of the Cenomanian of the Caux coast of
      Normandy, which distinguishes three formations bounded by hardgrounds
      and makes this the first, "bounded at its base by the Octeville erosion
      surface and at its top by the HG (hardground) Rouen 1", below the Rouen
      Chalk and the Antifer Chalk. The paper's English version renders the
      name Glauconitic Chalk.
  - id: buffetaut2024a
    notes: >
      Fixes the Caletodraco horizon within it by sequence and ammonite zone,
      the specimen referable "to the C3 sequence of Hoyez et al.,
      corresponding to the Mantelliceras dixoni zone of the lower Cenomanian
      glauconitic Chalk", and records that the unit of the Pays de Caux is a
      marine deposit.
  - id: juignet1992a
    notes: >
      Treats the "St. Jouin glauconitic chalk" as one of the "Lower Cenomanian
      formations (Mantelli and Dixoni Zones)", lying above the "Octeville
      erosion surface"; it "often shows 6 minor sequences", each capped by a
      hardground.
  - id: robaszynski1998a
    notes: >
      First of the Cenomanian formations of the Pays de Caux, "(in ascending
      sequence): the Craie glauconieuse de St. Jouin (St. Jouin Formation),
      the Craie de Rouen (Rouen Formation), the Craie d'Antifer (Antifer
      Formation), and the base of the Craie noduleuse du Cap Fagnet (Cap
      Fagnet Formation)", the whole succession reaching "a maximum thickness
      of a modest 45 m".
