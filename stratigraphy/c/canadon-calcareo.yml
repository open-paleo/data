name: Cañadón Calcáreo
rank: formation
period: [Late Jurassic]
stages: [Oxfordian, Kimmeridgian, Tithonian]
references:
  - id: rauhut2017a
    notes: >
      The formation is a unit of terrestrial sediments deposited in the
      Cañadón Asfalto Basin during its post-rift phase, with a mainly
      lacustrine basal part followed by fluvial and overbank deposits, and is
      dated "Late Jurassic (Oxfordian–Tithonian)" — in the body,
      "Oxfordian–?Tithonian". A tuff at the top of the lacustrine section at
      Puesto Almada "has recently been dated at 157 Ma (latest Oxfordian;
      Cúneo et al., 2013)", and although other workers assign that section to
      a Puesto Almada Member of the Cañadón Asfalto Formation instead, "there
      is agreement in the Late Jurassic age of these rocks". Besides the
      theropod described here it has yielded diplodocoid and macronarian
      neosauropods, basal crocodylomorphs, and coccolepid and basal teleost
      fishes.
  - id: reutter2026a
    notes: >
      Gives the Bicharracosaurus horizon as "Higher parts of the Cañadón
      Calcáreo Formation, Oxfordian-Kimmeridgian, Late Jurassic", following
      Cúneo and colleagues (2013), and says the base "was dated (157.4 Mya) to
      the Oxfordian-Kimmeridgian boundary".
  - id: carballido2011a
    notes: >
      Dates it "most probably Oxfordian-Tithonian".
  - id: cúneo2013a
    notes: >
      Reports the Early Cretaceous reading and rejects it: the palynofloral
      assemblage "that was once considered to be early Cretaceous in age, is
      now entirely constrained to the Late Jurassic". Sets the two sides out
      first - Late Jurassic on the vertebrates, "Early Cretaceous on the basis
      of its palynofloral and invertebrate contents" - and then finds the Late
      Jurassic "supported by the new U-Pb geochronologic results".
