name: Xiagou
rank: formation
parent: Xinminpu
period: [Early Cretaceous]
stages: [Aptian, Albian]
references:
  - id: zhou2026a
    notes: >
      Places the formation in the "Lower Cretaceous (lower Aptian)", and
      following Suarez and colleagues (2013) says the bird-bearing quarries in
      the Changma Basin "were deposited during the early Aptian". It notes
      "recent arguments that the Xiagou Formation is actually late early
      Aptian to early Albian in age" but judges that the early Aptian dates
      cast doubt on the Changma fauna being younger than the other Jehol bird
      localities.
  - id: you2018a
    notes: >
      Maps beds to formations across two basins: the gray-variegated beds
      belong to the Xiagou "and have an Aptian age, the red beds in both the
      Yujingzi and Gongpoquan basins represent the beginning of the Zhonggou
      Formation with an early Albian" age.
  - id: suarez2013a
    notes: >
      Reaches its own determination chemostratigraphically, correlating
      carbon-isotope segments with the Selli Equivalent and oceanic anoxic
      event 1a, which "firmly places the age of the bird quarries in the
      early Aptian Age". The scope is the horizon rather than the formation -
      "the Xiagou lacustrine strata in this locality", "the age of the bird
      quarries" - so it dates a level, not the unit. It sets that against
      three earlier readings it reports: a Hauterivian from pollen, a
      Barremian from ostracodes and charophytes, and a Barremian-Aptian from
      similarity to the Jehol.
  - id: tong2021a
    notes: >
      Places the macrobaenid turtle Changmachelys bohlini in the "Xiagou Fm.
      (Aptian), Changma Basin, Gansu, China" after Brinkman and colleagues
      (2013), tabulating the same horizon as "Xiagou Fm. Early Cretaceous
      (Aptian)" and calling it elsewhere "the Lower Cretaceous Xiagou
      Formation, Gansu, China".
  - id: brinkman2013b
    notes: >
      "The age of the Xiagou Formation has been interpreted as Aptian on the
      basis of studies of stable carbon isotope chemostratigraphy", and the
      paper adopts that reading, giving its new turtle the age "Xiagou
      Formation, Early Cretaceous, Aptian." Treats the unit as the lower unit
      of the Xinminpu Group, correlates it with the Jiufotang Formation of
      Liaoning and places it above the Yixian.
