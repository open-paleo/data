name: Xiaoyan
rank: formation
period: [Late Cretaceous]
stages: [Campanian, Maastrichtian]
dispute:
  summary: >
    Hou (1977), describing Wannanosaurus from the upper member, concludes that
    "the age of the Xiaoyan Fm. should be early Late Cretaceous"; Chen and
    Chang's (1994) correlation chart places the formation in the Campanian,
    and Sullivan (2006) gives "?early Maastrichtian (Nemegtian)".
references:
  - id: butler2008b
    notes: >
      Gives the Wannanosaurus type as from "the Xiaoyan Formation of Anhui
      Province, China (Late Cretaceous: Campanian)".
  - id: butler2009b
    notes: >
      Gives "the Xiaoyan Formation (Campanian-?early Maastrichtian) of Anhui
      Province".
  - id: hou1977a
    notes: >
      Gives the Wannanosaurus horizon as "Red sandstones of the Late
      Cretaceous upper member of the Xiaoyan Fm. at the town of Yansi, Shexian
      Co., Anhui Province", and from comparison with English and Mongolian
      pachycephalosaurs concludes that "the age of the Xiaoyan Fm. should be
      early Late Cretaceous".
  - id: chen1994a
    notes: >
      Its correlation chart for the southeastern coastal provinces (Fig. 4,
      described rather than quoted) sets "Xiaoyan Fm." in the Campanian row of
      the southern Anhui column. The text qualifies the chart: "the
      correspondence between the local Chinese stratigraphy and the European
      standard stages is approximate only."
  - id: sullivan2006a
    notes: >
      Gives the Wannanosaurus horizon as "Xiaoyan Formation, Anhui Province,
      People's Republic of China; ?early Maastrichtian (Nemegtian)".
