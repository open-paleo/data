name: Xinminpu
rank: group
period: [Early Cretaceous]
stages: [Barremian, Aptian, Albian]
references:
  - id: tang2001b
    notes: >
      The dedicated lithostratigraphy, which gives the rank, the setting and
      the span: the group "was deposited in a fluviolacustrine setting in
      Mesozoic graben basins under a semi-arid, subtropical climate", and
      "sediments of the lower part ... are considered to be Late
      Barremian-Aptian in age, although the middle and upper parts could be
      as young as Albian". Prints the name Xinminbao.
  - id: you2005b
    notes: >
      Gives "the Early Cretaceous Xinminpu Group in the Gongpoquan Basin of
      Gansu Province, China", a series-level statement rather than a stage.
  - id: zanno2010a
    notes: >
      Places the uppermost part of the group, in the Gongpoquan Basin of
      the Mazongshan area, at "late Early or early Late Cretaceous", and
      gives the group in the Yujingzi Basin as Early Cretaceous,
      "Aptian-Albian", relaying both from Tang and colleagues (2001). Prints
      the name as "Xinminpu (= Xinminbao) Group". Tang and colleagues give
      no Late Cretaceous option: they find the angiosperm pollen too scarce
      for a Late Cretaceous assemblage, "thus precluding a Late Cretaceous
      age for the Xinminbao Group" (Tang and colleagues, 2001, p. 125), and
      let the middle and upper parts reach only the Albian.
  - id: chen1983a
    notes: >
      In the Yumen district "the Lower Cretaceous Xinminpu Group is subdivided
      into the Xiangou Formation (below) and the Zhonggou Formation (above)",
      conglomerates, sandstones, siltstones, mudstones and shales carrying
      conchostracans, ostracods, pelecypods, gastropods, an insect and a fish.
      Its relation "to the Upper Jurassic Chijinpu Formation is disconformable
      or unconformable in this district, but the aspect of their molluscan
      fossils is very close".
