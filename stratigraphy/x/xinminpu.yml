name: Xinminpu
rank: group
period: [Early Cretaceous]
stages: [Barremian, Aptian, Albian]
lithology: clay shale alternating with conglomerate, sandstone and muddy shale
references:
  - id: tang2001b
    notes: >
      The dedicated lithostratigraphy, which gives the rank, the setting and
      the span: the group "was deposited in a fluviolacustrine setting in
      Mesozoic graben basins under a semi-arid, subtropical climate", and
      "sediments of the lower part ... are considered to be Late
      Barremian-Aptian in age, although the middle and upper parts could be
      as young as Albian". Prints the name Xinminbao.
  - id: you2005b
    notes: >
      Gives "the Early Cretaceous Xinminpu Group in the Gongpoquan Basin of
      Gansu Province, China", a series-level statement rather than a stage.
  - id: zanno2010a
    notes: >
      Gives the "Xinminpu (= Xinminbao) Group" as Aptian-Albian in the Yujingzi
      Basin and "late Early or early Late Cretaceous" at its top in the
      Gongpoquan Basin, both after Tang and colleagues (2001).
  - id: chen1983a
    notes: >
      Divides the Lower Cretaceous group in the Yumen district into "the Xiangou
      Formation (below) and the Zhonggou Formation (above)", over the Upper
      Jurassic Chijinpu Formation.
  - id: zhang2009b
    notes: >
      Source of the lithology.
