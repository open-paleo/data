name: Xiaguan
rank: formation
period: [Early Cretaceous, Late Cretaceous]
stages: [Albian, Cenomanian, Turonian, Coniacian, Santonian, Campanian]
references:
  - id: wang2013c
    notes: >
      Formally establishes the unit, and records what it replaces. The
      egg-bearing red beds of the Xiaguan-Gaoqiu Basin in Neixiang and
      Zhenping Counties, southwestern Henan, had "variously been called the
      'Gaogou Formation,' 'Majiacun Formation,' 'Sangping Formation,' and
      'Xiaguan Formation,' but none of these names was based on a formally
      measured stratigraphic section", no invertebrate or plant fossils useful
      for dating having been found. A section measured in 2011 yielded
      ostracods, bivalves, gastropods, charophytes and plant megafossils,
      making it "possible to formally establish the 'Xiaguan Formation' as a
      formation-level stratigraphic unit". On age the paper hedges in one
      place, the formation "may be the early-middle Late Cretaceous, and most
      possibly to be the middle-late Turonian to the middle Campanian", and
      states in another that it "should be middle-late Turonian to middle
      Campanian".
  - id: xu2000a
    notes: >
      Dates the red beds of the Xiaguan Basin, under the name Sangping
      Formation, as Early Cretaceous on the evidence of Nanyangosaurus: the
      occurrence "supports an Early Cretaceous age of Xiaguan redbed", and
      "the Sangping Formation may represent Albian deposits".
