name: Xiaguan
rank: formation
period: [Late Cretaceous]
stages: [Turonian, Coniacian, Santonian, Campanian]
references:
  - id: wang2013c
    notes: >
      Formally establishes the unit, and records what it replaces. The
      egg-bearing red beds of the Xiaguan-Gaoqiu Basin in Neixiang and
      Zhenping Counties, southwestern Henan, have "been called Gaogou
      Formation and Majiacun Formation, Sangping Formation, Xiaguan
      Formation, but no survey has been conducted on theses stratigraphic
      sections", no invertebrate or plant fossils useful for dating having
      been found. A section measured in 2011 yielded ostracods, bivalves,
      gastropods, charophytes and plant megafossils, on which the Xiaguan
      Formation "of the formation level was established". On age the paper
      hedges in its English abstract, the formation "may be the early-middle
      Late Cretaceous, and most possibly to be the middle-late Turonian to the
      middle Campanian", and states in its Chinese abstract that it
      "应为土伦（Turonian）中—晚期至坎潘（Campanian）中期" (should be middle to
      late Turonian to middle Campanian, translated).
  - id: xu2000a
    notes: >
      Dates the red beds of the Xiaguan Basin, under the name Sangping
      Formation, as Early Cretaceous on the evidence of Nanyangosaurus: the
      occurrence "supports an Early Cretaceous age of Xiaguan redbed", and
      "the Sangping Formation may represent Albian deposits". That Albian was
      inferred from the hadrosauroid's evolutionary grade before the
      formation was defined, and is superseded.
  - id: wang2013a
    notes: >
      Answers the Early Cretaceous reading: the age of the red beds "was argued
      to be Early Cretaceous by Xu et al. ... based on the evolutionary grade of
      Nanyangosaurus", but "our results and those of another cladistic
      analysis ... suggest a more derived position for Nanyangosaurus", and
      "regional geological workers insist on an early Late Cretaceous age for
      the Nanyangosaurus-bearing red beds in Xiaguan Basin".
