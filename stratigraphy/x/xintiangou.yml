name: Xintiangou
rank: formation
period: [Early Jurassic, Middle Jurassic]
stages: [Toarcian, Aalenian, Bajocian]
references:
  - id: li2019a
    notes: >
      Gives both a biostratigraphic and a radiometric reading: on sporopollen
      and Euestheria the formation "is regarded as the early Middle Jurassic",
      while "preliminary U-Pb dating suggests the Xintiangou Formation ranges
      between 180 and 170 Ma, corresponding to the Aalenian-Toarcian age
      (Middle Jurassic to Early Jurassic)". Places it between the Ziliujing
      below and the Lower Shaximiao above.
  - id: li2011a
    notes: >
      Reaches the age by elimination, leaving "an Aalenian-Bajocian time for
      the underlying, Middle Jurassic Xintiangou Formation" once the
      Shunosaurus-Omeisaurus assemblage above is placed in the
      Bajocian-Bathonian.
  - id: dai2020a
    notes: >
      Gives a locality in it as "Laojun Village, Puan Township, Yunyang City,
      Chongqing, China", and notes a U-Pb date on the lowest beds of the
      overlying Shaximiao.
