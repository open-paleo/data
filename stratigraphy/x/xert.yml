name: Xert
rank: formation
period: [Early Cretaceous]
stages: [Barremian, Aptian]
references:
  - id: canudo2008a
    notes: >
      Describes Tastavinsaurus "from the Early Cretaceous (Aptian) of Spain",
      the holotype recovered "from the Arsis-1 site in Peñarroya de Tastavins
      (Teruel) at the base of the marine Xert Formation".
  - id: mocho2023a
    notes: >
      Dates the formation to the latest Barremian, following Bover-Arnal and
      colleagues (2016): the underlying Arcillas de Morella is "dated to the
      late Barremian, and Xert and Forcall formations to the latest Barremian
      and early Aptian, respectively". Records that the Arcillas de Morella
      "passes gradually to bioclastic limestones of the Calizas y Margas de
      Xert Fm." toward its top.
  - id: bover-arnal2016a
    notes: >
      A dedicated chronostratigraphy of the basin, constraining the unit from
      both ends and placing the system boundary above it. An ammonite
      assigned to the Late Barremian Martelites sarasini Zone was collected
      in the lowermost part of the formation, which "allows a precise age
      calibration of the lower part of the Xert Formation"; strontium ratios
      from oyster shells in its upper part "are consistent with a latest
      Barremian-earliest Aptian age"; and "The Barremian-Aptian boundary is
      tentatively placed close above the base of the succeeding transgressive
      marls of the Forcall Formation by analogy with nearby Tethyan basins".
      So on this paper the formation is essentially Barremian, with only its
      very top possibly reaching the earliest Aptian. It names the earlier
      vertebrate work it is re-dating, Canudo and colleagues (2008) among it.
