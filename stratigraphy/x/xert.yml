name: Xert
rank: formation
period: [Early Cretaceous]
stages: [Barremian, Aptian]
references:
  - id: bover-arnal2016a
    notes: >
      A dedicated chronostratigraphy of the basin. A Martelites ammonite found
      "above the contact between the Morella and Xert formations" at Torre
      Miró belongs "to the lower part of the Martelites sarasini Subzone",
      which "allows a precise age calibration of the lower part of the Xert
      Formation"; the authors take the zone as Late Barremian. Oyster shells
      from the upper part give a strontium-isotope value of 0.707425, "in
      accordance with a latest Barremian–earliest Aptian age (GTS2004)", and
      "The Barremian–Aptian boundary is tentatively placed close above the
      base of the succeeding transgressive marls of the Forcall Formation".
      The stage the lower Xert falls in depends on how the base of the Aptian
      is defined. On the ammonite zonation, which closes the Barremian with
      the M. sarasini Zone, it is latest Barremian. On the GTS2020 working
      definition, the base of magnetochron M0r, it is earliest Aptian, since
      Frau and colleagues (2017) correlate the lower M. sarasini Subzone with
      the topmost part of M0r. The paper names the earlier vertebrate work it
      re-dates, Canudo and colleagues (2008) among it.
  - id: frau2017a
    notes: >
      Re-identifies the ammonites from beneath, within and above magnetochron
      CM0r at Gorgo a Cerbara, the candidate section for the base of the
      Aptian, as Martelites, so that they "pinpoint the lower part of the M.
      sarasini Zone (M. sarasini Subzone) and correlate to the topmost part of
      magnetozone CM0r and lowermost part of magnetozone C34n". Because that
      zone "is unanimously considered to be the last ammonite zone of the
      Barremian", the authors question the base of CM0r as the datum for the
      base of the Aptian.
  - id: frau2018a
    notes: >
      Finds that strontium-isotope values between 0.707435 and 0.707410 form a
      "grey band" in which the method "is unreliable for separating the
      uppermost Barremian (M. sarasini Zone) from the lower Aptian pro parte",
      and that such values "can neither be used to prove nor to disprove the
      location of the putative Barremian/Aptian boundary based on
      biostratigraphy". The 0.707425 that Bover-Arnal and colleagues (2016)
      report from the upper Xert falls inside that band.
  - id: gale2020a
    notes: >
      "The GTS2020 scale retains the current Aptian/Barremian usage with its
      working boundary definition as the base of Chron M0r", taken at 121.4
      Ma. It records Frau and colleagues' (2017) re-identification of the
      Gorgo a Cerbara ammonites as M. sarasini Zone, and that the Aptian
      Working Group "is likely to recommend taking the maximum negative value
      of the basal excursion of OAE1a in the Gorgo a Cerbara section" as the
      boundary marker instead.
  - id: mocho2023a
    notes: >
      Dates the formation to the latest Barremian, following Bover-Arnal and
      colleagues (2016): the underlying Arcillas de Morella is "dated to the
      late Barremian, and Xert and Forcall formations to the latest Barremian
      and early Aptian, respectively". Records that the Arcillas de Morella
      "passes gradually to bioclastic limestones of the Calizas y Margas de
      Xert Fm." toward its top.
  - id: canudo2008a
    notes: >
      Describes Tastavinsaurus "from the Early Cretaceous (Aptian) of Spain",
      the holotype recovered "from the Arsis-1 site in Peñarroya de Tastavins
      (Teruel) at the base of the marine Xert Formation". The Aptian follows
      the regional scheme of the time, under which the underlying "Arcillas
      de Morella" Formation was itself "Lower Aptian".
