name: Xert
rank: formation
period: [Early Cretaceous]
stages: [Barremian, Aptian]
lithology: alternating sandstone, sandy limestone and marl, grading to massive
  limestone above
references:
  - id: bover-arnal2016a
    notes: >
      Dates the lower formation late Barremian by a Martelites ammonite at Torre
      Miró, and the upper part "latest Barremian – earliest Aptian" by strontium
      isotopes. Source of the lithology.
  - id: frau2017a
    notes: >
      Re-identifies the ammonites around magnetochron CM0r at Gorgo a Cerbara as
      lower M. sarasini Subzone, "the last ammonite zone of the Barremian", and
      so questions CM0r as the Aptian datum.
  - id: frau2018a
    notes: >
      Finds that strontium-isotope values between 0.707435 and 0.707410 form a
      "grey band" that cannot separate the uppermost Barremian from the lower
      Aptian.
  - id: gale2020a
    notes: >
      Keeps the base of Chron M0r, at 121.4 Ma, as the working definition of the
      base of the Aptian, and reports the challenge to it from the Gorgo a
      Cerbara ammonites.
  - id: mocho2023a
    notes: >
      Dates the formation to the latest Barremian, following Bover-Arnal and
      colleagues (2016): the underlying Arcillas de Morella is "dated to the
      late Barremian, and Xert and Forcall formations to the latest Barremian
      and early Aptian, respectively". Records that the Arcillas de Morella
      "passes gradually to bioclastic limestones of the Calizas y Margas de
      Xert Fm." toward its top.
  - id: canudo2008a
    notes: >
      Describes Tastavinsaurus "from the Early Cretaceous (Aptian) of Spain",
      the holotype recovered "from the Arsis-1 site in Peñarroya de Tastavins
      (Teruel) at the base of the marine Xert Formation". The Aptian follows
      the regional scheme of the time, under which the underlying "Arcillas
      de Morella" Formation was itself "Lower Aptian".
