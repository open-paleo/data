name: Xinlong
rank: formation
period: [Early Cretaceous]
stages: [Aptian, Albian]
lithology: purple-red and yellow-gray siltstone and fine sandstone, with some
  mudstone and sandy conglomerate
references:
  - id: ji2022a
    notes: >
      Reads the age narrowly, adopting the view of Mo and colleagues (2016)
      that "the geological age of the fossil-bearing Member 2 of the Xinlong
      Formation should be the Aptian, in the late Early Cretaceous".
  - id: sethapanichsakul2026a
    notes: >
      Gives "Xinlong Formation, Aptian-Albian".
  - id: mo2016a
    notes: >
      Gives the Aptian and not the Albian, which appears once in the paper and
      not for this unit. The age is reached by faunal correlation: the
      assemblage "seems to be particularly close to that from the Khok Kruat
      Formation, considered as Aptian in age, as shown especially by sharks and
      turtles and by the presence of iguanodontians. An Aptian age is therefore
      proposed for the Xinlong Formation." Note the correlation is onto a unit
      whose own Aptian is itself reported rather than established in this paper,
      and that the age is given for the formation; the division into members is
      a later paper's framing. Describes its rock: "the Xinlong Formation, which
      varies in thickness from 80 to 2445 m, consists of purple-red, yellow-grey
      siltstones, fine sandstones, some mudstones and sandy conglomerates, the
      latter being found in the lower part of the formation".
