name: Xinlong
rank: formation
period: [Early Cretaceous]
stages: [Aptian]
lithology: purple-red and yellow-gray siltstone and fine sandstone, with some
  mudstone and sandy conglomerate
references:
  - id: ji2022a
    notes: >
      Reads the age narrowly, adopting the view of Mo and colleagues (2016)
      that "the geological age of the fossil-bearing Member 2 of the Xinlong
      Formation should be the Aptian, in the late Early Cretaceous".
  - id: sethapanichsakul2026a
    notes: >
      Names the formation's age only in passing: "Aptian" on its second page,
      and "Aptian–Albian" in a table row and in a sentence on the fauna's
      likeness to that of the Khok Kruat Formation, which cites Manitkoon and
      colleagues (2022) and Cuny and colleagues (2017).
  - id: mo2016a
    notes: >
      Proposes an Aptian age for the formation, whose vertebrate assemblage
      "seems to be particularly close" to that of the Khok Kruat Formation.
      Source of the lithology.
  - id: manitkoon2022a
  - id: cuny2017a
