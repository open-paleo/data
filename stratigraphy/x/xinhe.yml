name: Xinhe
rank: formation
period: [Middle Jurassic]
stages: [Bathonian]
lithology: conglomerate, sandstone and siltstone with silty mudstone below,
  shale and mudstone above
references:
  - id: li2025a
    notes: >
      Describes a eusauropod from sandstone in the lower part of the formation
      and dates that horizon "late Bathonian" on its plants, palynoflora and
      lacustrine invertebrates. Source of the lithology.
  - id: gao2019a
    notes: >
      Places it in the local succession: "The Qingtujing Group has been
      divided into two lithostratigraphic units, the Longfengshan Formation
      and the Xinhe Formation", and gives a vertebrate locality "near the
      bottom of the upper part of the Xinhe Formation" at Qingtujing,
      Jinchang City, Gansu.
