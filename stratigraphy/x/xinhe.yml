name: Xinhe
rank: formation
period: [Middle Jurassic]
stages: [Bathonian]
lithology: conglomerate, sandstone and siltstone with silty mudstone below,
  shale and mudstone above
references:
  - id: li2025a
    notes: >
      Describes a non-neosauropod eusauropod from "the Middle Jurassic Xinhe
      Formation of Gansu Province, northwestern China", found in sandstone of
      the lower part of the formation. "The megafossil plants, palynoflora from
      the lower part, as well as the lacustrine invertebrate assemblage from the
      upper part of the Xinhe Formation ... indicate that the dinosaur-bearing
      horizon is late Bathonian in age." Describes its rock: "The Xinhe
      Formation, approximately 120 m thick, has a lower section composed of
      medium to thick-bedded straw-yellow conglomerate, sandstone, and siltstone
      interbedded with greenish-yellow silty mudstone. Its upper section is
      characterised by interbedded bluish-grey shale and mudstone, with a
      tuffaceous interlayer".
  - id: gao2019a
    notes: >
      Places it in the local succession: "The Qingtujing Group has been
      divided into two lithostratigraphic units, the Longfengshan Formation
      and the Xinhe Formation", and gives a vertebrate locality "near the
      bottom of the upper part of the Xinhe Formation" at Qingtujing,
      Jinchang City, Gansu.
