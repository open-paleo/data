name: Build

on:
  push:
    branches: [main]

permissions:
  contents: write

# Builds run one at a time: two pushes close together would otherwise build in
# parallel and the second build's push would be rejected.
concurrency:
  group: build-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate dictionary
        run: npm run generate-dictionary

      - name: Build outputs
        run: npm run build

      # Regenerate the typed bindings only when the JSON Schema they derive
      # from actually changed, so ordinary data pushes don't pay the Python
      # setup + generation cost or churn the bindings. Compares the schema at
      # the pre-push commit (github.event.before) with the current file;
      # regenerates on any difference, when that commit is unavailable
      # (force-push, first push), or when the bindings are missing.
      - name: Decide whether to regenerate bindings
        id: bindings
        run: |
          before="${{ github.event.before }}"
          generate=true
          if [ -f dist/bindings/open_paleo.py ] && [ -f dist/bindings/open-paleo.d.ts ] \
            && [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ] \
            && git fetch --depth=1 origin "$before" 2>/dev/null \
            && git cat-file -e "$before:schemas/open-paleo.schema.json" 2>/dev/null; then
            old="$(git show "$before:schemas/open-paleo.schema.json" | sha256sum | cut -d' ' -f1)"
            new="$(sha256sum schemas/open-paleo.schema.json | cut -d' ' -f1)"
            [ "$old" = "$new" ] && generate=false
          fi
          echo "generate=$generate" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        if: steps.bindings.outputs.generate == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install binding generator
        if: steps.bindings.outputs.generate == 'true'
        run: pip install datamodel-code-generator==0.45.0

      - name: Generate type bindings
        if: steps.bindings.outputs.generate == 'true'
        run: npm run generate-bindings

      # Records whether this commit changed dist/ and dist/references.bib, and
      # the SHA that landed on main, for the dispatches below. A commit can
      # change only dictionaries/, so dist_changed is not implied by a push.
      # The SHA is read after the push, so it is the commit on main even after
      # a rebase retry.
      - name: Commit build outputs
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist/ dictionaries/
          if [ -n "$(git status --porcelain dist/ dictionaries/)" ]; then
            if git diff --cached --quiet -- dist/; then
              dist=false
            else
              dist=true
            fi
            if git diff --cached --quiet -- dist/references.bib; then
              bib=false
            else
              bib=true
            fi
            git commit -m "build: update output files"
            # A data commit can land on main while this build runs. On a
            # rejected push, deepen the shallow checkout enough to find the
            # merge base, rebase the build commit onto main and try again.
            for attempt in 1 2 3; do
              if git push; then
                echo "dist_changed=$dist" >> "$GITHUB_OUTPUT"
                echo "bib_changed=$bib" >> "$GITHUB_OUTPUT"
                echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              git fetch --deepen=50 origin main
              git rebase origin/main
            done
            echo "Push still rejected after three attempts" >&2
            exit 1
          fi

      # open-paleo/corpus keeps a bundled copy of the bib, and its update-bib
      # workflow takes the bib from the commit named in the payload rather than
      # from main, which raw.githubusercontent.com can serve stale for minutes.
      # The built-in GITHUB_TOKEN cannot dispatch to another repository, so this
      # uses a fine-grained token scoped to open-paleo/corpus. A missed dispatch
      # must not fail the build; the corpus workflow can be run by hand. -f, not
      # -F, so an all-digit SHA is still sent as a string.
      - name: Tell the corpus repository the bib changed
        if: steps.commit.outputs.bib_changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.CORPUS_DISPATCH_TOKEN }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          gh api repos/open-paleo/corpus/dispatches \
            -f event_type=bib-updated -f "client_payload[sha]=$SHA"

      # open-paleo/web builds the site from dist/ at the commit named in the
      # payload, so it rebuilds when the outputs change. Like the corpus step,
      # it needs a fine-grained token scoped to that repository, and a missed
      # dispatch must not fail the build: the site also rebuilds nightly.
      - name: Tell the web repository the outputs changed
        if: steps.commit.outputs.dist_changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.WEB_DISPATCH_TOKEN }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          gh api repos/open-paleo/web/dispatches \
            -f event_type=data-updated -f "client_payload[sha]=$SHA"
