name: Build

# One build a day publishes the day's data. A manual run (Actions tab, or
# `gh workflow run build.yml`) publishes out of schedule: a fix to a broken
# build, or a timely addition such as a new genus or species. See
# docs/VERSIONING.md for how each publish is versioned and tagged.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Builds run one at a time: a manual run started during the scheduled one
# would otherwise pick the same version and race it to the push.
concurrency:
  group: build-main
  cancel-in-progress: false

jobs:
  build:
    # A manual run can name any branch; only main is published.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate dictionary
        run: npm run generate-dictionary

      # The version is the UTC date of the run. The day's first publish takes
      # the bare date, whether scheduled or manual; each later one takes the
      # next counter (.2, .3, ...) after the tags already on the remote. The
      # version is chosen before the build because the build writes it into
      # the output; a run that publishes nothing leaves it unused.
      - name: Choose the release version
        id: version
        run: |
          date="$(date -u +%Y.%m.%d)"
          count=0
          for tag in $(git ls-remote --tags --refs origin "refs/tags/$date*" | sed 's#.*refs/tags/##'); do
            suffix="${tag#"$date"}"
            if [ -z "$suffix" ]; then
              number=1
            elif [[ "$suffix" =~ ^\.([0-9]+)$ ]]; then
              number="${BASH_REMATCH[1]}"
            else
              continue
            fi
            [ "$number" -gt "$count" ] && count="$number"
          done
          if [ "$count" -eq 0 ]; then
            version="$date"
          else
            version="$date.$((count + 1))"
          fi
          echo "Release version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Paleocoordinates are reconstructed with pyGPlates before the build
      # merges them. The model and Natural Earth files are pinned by checksum
      # in scripts/plate-reconstruction/model.json and cached under that file's hash, so a
      # build downloads them only when the pins change.
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache plate model files
        uses: actions/cache@v6
        with:
          path: scratch/plate-reconstruction/cache
          key: plate-reconstruction-${{ hashFiles('scripts/plate-reconstruction/model.json') }}

      - name: Install reconstruction dependencies
        run: pip install -r scripts/plate-reconstruction/requirements.txt

      - name: Reconstruct paleocoordinates
        run: |
          npm run collect-reconstruction-points
          npm run reconstruct-points

      # Required here, so a missing or out-of-date reconstruction fails the
      # build instead of publishing a dataset without paleocoordinates.
      - name: Build outputs
        env:
          OPEN_PALEO_REQUIRE_PALEOCOORDINATES: "1"
          OPEN_PALEO_VERSION: ${{ steps.version.outputs.version }}
          OPEN_PALEO_COMMIT: ${{ github.sha }}
        run: npm run build

      # Regenerate the typed bindings only when the JSON Schema they derive
      # from changed since the last publish, so ordinary data publishes don't
      # pay the generation cost or churn the bindings. HEAD's
      # dist/open-paleo.schema.json is the copy the last publish shipped; the
      # bindings are also regenerated when either is missing.
      - name: Decide whether to regenerate bindings
        id: bindings
        run: |
          generate=true
          if [ -f dist/bindings/open_paleo.py ] && [ -f dist/bindings/open-paleo.d.ts ] \
            && git cat-file -e "HEAD:dist/open-paleo.schema.json" 2>/dev/null; then
            old="$(git show "HEAD:dist/open-paleo.schema.json" | sha256sum | cut -d' ' -f1)"
            new="$(sha256sum schemas/open-paleo.schema.json | cut -d' ' -f1)"
            [ "$old" = "$new" ] && generate=false
          fi
          echo "generate=$generate" >> "$GITHUB_OUTPUT"

      - name: Install binding generator
        if: steps.bindings.outputs.generate == 'true'
        run: pip install datamodel-code-generator==0.45.0

      - name: Generate type bindings
        if: steps.bindings.outputs.generate == 'true'
        run: npm run generate-bindings

      # Publishes only when the data changed: the build stamps built_at,
      # version and commit on every run, and a difference confined to those
      # fields is not a new release.
      - name: Decide whether to publish
        id: publish
        run: node .github/scripts/check-dist-changed.cjs

      # Commits the dictionary when it changed, and on a publish also dist/
      # with a tag named by the version. A run that does not publish restores
      # dist/ first, so its timestamp-only changes are never committed.
      # Records whether references.bib changed, and the SHA that landed on
      # main, for the dispatches below. The SHA is read after the push, so it
      # is the commit on main even after a rebase retry.
      - name: Commit build outputs
        id: commit
        env:
          PUBLISH: ${{ steps.publish.outputs.publish }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "$PUBLISH" != "true" ]; then
            git checkout HEAD -- dist/
            git clean -fdxq -- dist/
          fi
          git add -f dist/ dictionaries/
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          if git diff --cached --quiet -- dist/references.bib; then
            bib=false
          else
            bib=true
          fi
          if [ "$PUBLISH" = "true" ]; then
            git commit -m "build: release $VERSION"
            git tag -a "$VERSION" -m "Open Paleo $VERSION"
            refs=(HEAD:main "refs/tags/$VERSION")
          else
            git commit -m "build: update dictionary"
            refs=(HEAD:main)
          fi
          # A data commit can land on main while this build runs. On a
          # rejected push, deepen the shallow checkout enough to find the
          # merge base, rebase the build commit onto main, move the tag to
          # the rebased commit and try again. --atomic pushes the commit and
          # its tag together or not at all.
          for attempt in 1 2 3; do
            if git push --atomic origin "${refs[@]}"; then
              echo "published=$PUBLISH" >> "$GITHUB_OUTPUT"
              echo "bib_changed=$bib" >> "$GITHUB_OUTPUT"
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git fetch --deepen=50 origin main
            git rebase origin/main
            if [ "$PUBLISH" = "true" ]; then
              git tag -fa "$VERSION" -m "Open Paleo $VERSION"
            fi
          done
          echo "Push still rejected after three attempts" >&2
          exit 1

      # open-paleo/corpus keeps a bundled copy of the bib, and its update-bib
      # workflow takes the bib from the commit named in the payload rather than
      # from main, which raw.githubusercontent.com can serve stale for minutes.
      # The built-in GITHUB_TOKEN cannot dispatch to another repository, so this
      # uses a fine-grained token scoped to open-paleo/corpus. A missed dispatch
      # must not fail the build; the corpus workflow can be run by hand. -f, not
      # -F, so an all-digit SHA is still sent as a string.
      - name: Tell the corpus repository the bib changed
        if: steps.commit.outputs.bib_changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.CORPUS_DISPATCH_TOKEN }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          gh api repos/open-paleo/corpus/dispatches \
            -f event_type=bib-updated -f "client_payload[sha]=$SHA"

      # open-paleo/web builds the site from dist/ at the commit named in the
      # payload, so it rebuilds on each publish. Like the corpus step, it needs
      # a fine-grained token scoped to that repository, and a missed dispatch
      # must not fail the build: the site also rebuilds nightly.
      - name: Tell the web repository the outputs changed
        if: steps.commit.outputs.published == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.WEB_DISPATCH_TOKEN }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          gh api repos/open-paleo/web/dispatches \
            -f event_type=data-updated -f "client_payload[sha]=$SHA"
