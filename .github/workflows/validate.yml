name: Validate

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Validate data
        run: npm run validate | tee /tmp/validate-output.txt

      - name: Post flagged-references PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const run = require('./.github/scripts/flagged-references.cjs');
            await run({
                github,
                context,
                validatorOutputPath: '/tmp/validate-output.txt',
            });

      - name: Spell check
        run: npx cspell "genera/**/*.yml" "clades/**/*.yml" --no-progress
