name: Validate

on:
  pull_request:
    branches: [main]

# The job only reads the repository; it writes nothing but the
# flagged-references comment on the pull request.
permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # The default ref is the pull request's merge commit, which also exists
      # for a pull request from a fork; head_ref names a branch only the fork
      # has.
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # shell: bash makes GitHub add pipefail; without it the step's status is
      # tee's, and a failing validate run would pass.
      - name: Validate data
        shell: bash
        run: npm run validate | tee /tmp/validate-output.txt

      - name: Post flagged-references PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const run = require('./.github/scripts/flagged-references.cjs');
            await run({
                github,
                context,
                validatorOutputPath: '/tmp/validate-output.txt',
            });
