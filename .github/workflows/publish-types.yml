name: Publish bindings

# Publishes the bindings from the dist/ outputs committed on main, at the
# version in _metadata.schema_version: the TypeScript declarations to npm as
# @open-paleo/types and the Pydantic models to PyPI as open-paleo. Run by hand
# from the Actions tab once the Build workflow has finished for a schema
# change. The two registries are separate jobs, so one failing does not stop
# the other, and a version already on a registry is skipped rather than
# failing.
#
# Both registries authenticate this workflow through trusted publishing
# (GitHub OIDC), so no token is stored in the repository. The trusted
# publishers on npmjs.com, pypi.org and test.pypi.org name this file;
# renaming it breaks publishing until all three are updated. The npm dist-tag
# (next before 1.0.0) comes from publishConfig in packages/types/package.json.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Check npm's trusted publishing without publishing, and upload a .devN version to TestPyPI instead of PyPI
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-types
  cancel-in-progress: false

jobs:
  npm:
    # Only main carries the built dist/ outputs.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # registry-url writes the .npmrc that trusted publishing authenticates
      # against. Trusted publishing needs npm 11.5.1 or later, which Node 24
      # ships.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # The staging script uses only Node built-ins, so no npm ci.
      - name: Stage packages
        run: npm run stage-packages

      - name: Check whether this version is published
        id: check
        run: |
          name="$(node -p "require('./scratch/packages/types/package.json').name")"
          version="$(node -p "require('./scratch/packages/types/package.json').version")"
          published="$(npm view "$name@$version" version 2>/dev/null || true)"
          if [ -n "$published" ]; then
            echo "::notice::$name@$version is already on npm; nothing to do"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # npm applies publishConfig.tag on its own, but its log line reports the
      # --tag setting, so the tag is passed explicitly to keep the log true.
      #
      # A dry run goes ahead even for a version already published, since its
      # purpose is to test the trusted-publishing setup. npm refuses a
      # published version even in a dry run, so a dry run stages a throwaway
      # prerelease version (0.4.7-dry-run.<run number>) that nothing ever
      # publishes. npm treats the OIDC exchange as optional and a dry run only
      # warns when it has no credentials, so the step reads npm's verbose log
      # and fails unless the exchange produced a token.
      - name: Publish
        if: steps.check.outputs.publish == 'true' || inputs.dry-run
        working-directory: scratch/packages/types
        run: |
          set -o pipefail
          tag="$(node -p "require('./package.json').publishConfig.tag")"
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            npm version --no-git-tag-version "$(node -p "require('./package.json').version")-dry-run.$GITHUB_RUN_NUMBER"
            status=0
            npm publish --tag "$tag" --provenance --dry-run --loglevel verbose 2>&1 | tee "$RUNNER_TEMP/publish.log" || status=$?
            if ! grep -q "oidc Successfully retrieved and set token" "$RUNNER_TEMP/publish.log"; then
              echo "::error::npm trusted publishing did not authenticate this workflow; check the package's trusted publisher settings"
              exit 1
            fi
            exit "$status"
          else
            npm publish --tag "$tag" --provenance
          fi

  pypi:
    # Only main carries the built dist/ outputs.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Node runs the staging script, which stages the Python package too.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stage packages
        run: npm run stage-packages

      # PyPI has no dry run, so a dry run uploads to TestPyPI instead, as a
      # development release (0.4.7.dev<run number>) that cannot collide with a
      # version uploaded there before.
      - name: Choose version and index
        id: target
        run: |
          project=scratch/packages/python/pyproject.toml
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' "$project")"
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            version="$version.dev$GITHUB_RUN_NUMBER"
            sed -i "s/^version = \".*\"$/version = \"$version\"/" "$project"
            echo "index=https://test.pypi.org" >> "$GITHUB_OUTPUT"
          else
            echo "index=https://pypi.org" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is published
        id: check
        run: |
          status="$(curl -s -o /dev/null -w '%{http_code}' "${{ steps.target.outputs.index }}/pypi/open-paleo/${{ steps.target.outputs.version }}/json")"
          if [ "$status" = "200" ]; then
            echo "::notice::open-paleo ${{ steps.target.outputs.version }} is already on ${{ steps.target.outputs.index }}; nothing to do"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.check.outputs.publish == 'true'
        run: |
          pip install build==1.6.1 twine==7.0.0
          python -m build scratch/packages/python
          twine check --strict scratch/packages/python/dist/*

      # Uploads with the trusted publisher's token and attaches attestations
      # (PEP 740).
      - name: Publish
        if: steps.check.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          packages-dir: scratch/packages/python/dist/
          repository-url: ${{ steps.target.outputs.index == 'https://test.pypi.org' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
