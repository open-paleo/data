Rhoetosaurus brownei:
  - categories: [holotype]
    source: nair2012a
    verdict: corrected
    note: >
      "The syntype series (described in Longman, 1926) plus referred specimens
      ... are all assigned to QM F1659." Ours read QM F1695, a transposition.
      One registration number covers both the syntype series and the referred
