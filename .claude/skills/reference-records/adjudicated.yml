    Jones sauropod table is locally shifted: Astrophocaudia reads correctly
    (Paluxy Fm., United States), Australodocus carries "Udurchurkan Fm., Russia"
    (an Amur-region unit unrelated to it), and Austrosaurus carries Tendaguru,
    which is Australodocus's real occurrence. Ours are right throughout -
    Abrosaurus CN/Shaximiao, Australodocus TZ/Tendaguru, Austrosaurus AU.

Australodocus bohetii:
  categories: [occurrence]
  source: jones2026b
  verdict: ours-correct
  note: >
    Same shifted region of the Jones table; see Abrosaurus dongpoi.

Austrosaurus mckillopi:
  categories: [occurrence]
  source: jones2026b
  verdict: ours-correct
  note: >
    Same shifted region of the Jones table; see Abrosaurus dongpoi.

Linheraptor exquisitus:
  categories: [occurrence]
  source: jones2026c
  verdict: ours-correct
  note: >
    "Djadokhta Fm., Mongolia" gives the wrong country: the taxon is from
    Nuchidaba, Bayan Mandahu, Nei Mongol, China, in the Wulansuhai Formation.
    The Wulansuhai is commonly correlated with the Djadokhta, which is likely
    how the error arose, but the correlation does not move the locality across
    the border.

Raptorex kriegsteini:
  categories: [occurrence]
  source: jones2026c
  verdict: ours-correct
  note: >
    Not an artifact but a live dispute, and our record already carries it.
    Sereno et al. (2009) reported the holotype from the Lower Cretaceous of
    China; Fowler et al. (2011) rejected that provenance and argued for the Late
    Cretaceous Nemegt of Mongolia, which is the reading jones2026c follows. Our
    formation reads "Unknown (provenance uncertain)" and the dispute block names
    both hypotheses, so there is nothing to adopt.

Labocania anomala:
  categories: [holotype, occurrence]
  source: molnar1974a
  verdict: ours-correct
  note: >
    Recatalogued, not misrecorded. molnar1974a figures the quadrate as LACM
    20877; the material was later repatriated to Mexico and is now IGM 5307,
    which we hold. Separately, jones2026c's occurrence "Echkar Fm., Niger"
    belongs to C. iguidensis rather than the type species, whose neotype comes
    from the Kem Kem of Morocco. Candidate for former_ids under #2030.

Opisthocoelicaudia skarzynskii:
  categories: [holotype]
  source: borsukbialynicka1977a
  verdict: ours-correct
  note: >
    Recatalogued. The erecting paper gives ZPAL MgD-I/48, the Polish-Mongolian
    expedition number; the material returned to Ulaanbaatar and is now MPC-D
    100/404. Candidate for former_ids under #2030.

Stokesosaurus clevelandi:
  categories: [holotype]
  source: madsen1974a
  verdict: ours-correct
  note: >
    Recatalogued. "Type.-Left ilium, UUVP 2938." The University of Utah
    vertebrate palaeontology collection was transferred to the Natural History
    Museum of Utah and the specimen is now UMNH VP 7473. Candidate for
    former_ids under #2030.

Saurornitholestes langstoni:
  categories: [holotype]
  source: sues1978a
  verdict: ours-correct
  note: >
    Recatalogued. "Holotype. PMAA P74.10.5" - the Provincial Museum of Alberta
    number, superseded when the material moved to the Royal Tyrrell Museum as
    TMP 1974.010.0005. Candidate for former_ids under #2030.

Hesperosaurus mjosi:
  categories: [holotype]
  source: carpenter2001b
  verdict: ticketed
  note: >
    Unresolved. carpenter2001b writes HMNH 001 throughout, including its figure
    captions; we hold FPDM-V9674. The two are widely treated as the same
    specimen, the Fukui Prefectural Dinosaur Museum having acquired the
    material, but no source read so far states the transfer. Needs a paper that
    documents it before either number can be preferred; do not change on the
    reference works alone.

Abelisaurus comahuensis:
  categories: [holotype]
  source: bonaparte1985b
  verdict: corrected
  note: >
    "HOLOTYPE: Museo de Cipolleti, No. 11098". The number is ours; the prefix
    was bare MPCA, and Sabaj (2026) gives the current form as MPCA-PV. All 47
    MPCA ids in the dataset were normalized to that spelling in the same pass.
    The reference work's "MC 11098" abbreviates the museum differently again.

Abrictosaurus consors:
  categories: [holotype]
  source: sereno2012a
  verdict: corrected
  note: >
    The specimen is now at the Natural History Museum, London, not University
    College: NHMUK PV RU B54, with B54 kept as one token. jones2026a's
    "NHMUK RU B54" is right about the institution and omits the PV collection
    code, which every NHMUK record now carries.

Algoasaurus bauri:
  categories: [holotype]
  source: broom1904a
  verdict: ours-correct
  note: >
    AMNH FR 5631. FR is the Fossil Reptiles collection, which the reference work
    drops; the erecting paper predates the code and states no number at all.

Alxasaurus elesitaiensis:
  categories: [holotype]
  source: russell1993b
  verdict: ours-correct
  note: >
    "Type IVPP 88402 (larger individual)." No leading V, and no a/b suffixes
    were ever assigned - later work writes IVPP 88402a and 88402b, but many
    elements were never marked with the accession number at all. Recorded in the
    record's notes.

Aralosaurus tuberiferus:
  categories: [holotype]
  source: rozhdestvensky1968a
  verdict: ours-correct
  note: >
    "Holotype. Paleontological Institute No. 2229/1." PIN is current; the
    reference work's "AN SSR" is the superseded Soviet academy qualifier.

Atrociraptor marshalli:
  categories: [holotype]
  source: currie2004a
  verdict: ours-correct
  note: >
    The paper writes TMP 95.166.1; ours is the same number in the museum's own
    padded form, TMP 1995.166.0001, which every TMP record now uses.

Auroraceratops rugosus:
  categories: [holotype]
  source: you2005b
  verdict: ours-correct
  note: >
    Ours carries the institution code the paper gives in prose; jones2026a's
    bare "IG-2004-VD-001" omits it.

Baryonyx walkeri:
  categories: [holotype]
  source: charig1986a
  verdict: corrected
  note: >
    "Baryonyx walkeri holotype, no. R.9951". Ours read NHMUK VP R9951, with VP
    transposed: the NHM collection is PV, Palaeontology Vertebrates. This
    prompted a dataset-wide normalization to NHMUK PV <collection> <number>,
    53 ids across 32 genera. R denotes fossil reptiles within PV.

Betasuchus bredai:
  categories: [holotype]
  source: seeley1883a
  verdict: corrected
  note: >
    "For more certain reference, I give the British-Museum numbers on the
    specimens. Megalosaurus Bredai, Seeley. No. 42997." Normalized to
    NHMUK PV R 42997; see Baryonyx walkeri.

Caenagnathasia martinsoni:
  categories: [holotype]
  source: currie1993a
  verdict: ours-correct
  note: >
    The erecting paper writes CMGP 401/12457, but Sabaj (2026) gives CCMGE as
    the current code for the Chernyshev museum, which is what we hold.

Dacentrurus armatus:
  categories: [holotype]
  source: lucas1902a
  verdict: corrected
  note: >
    Normalized to NHMUK PV OR 46013; see Baryonyx walkeri. OR is retained rather
    than folded into R, since the NHM catalogue returns the same specimen for
    both and no source distinguishes them.

Demandasaurus darwini:
  categories: [holotype]
  source: torcidafernández-baldor2011a
  verdict: corrected
  note: >
    The holotype is a 59-element series - "the right (MDS-RVII,275) and left
    (MDS-RVII,332) premaxillae, left dentary (MDS-RVII,443), six isolated
    teeth ..." - of which we held only the last, the left femur MDS-RVII,16.
    jones2026b's "MDS-RVII series" was right in substance.

Dolichosuchus cristatus:
  categories: [holotype]
  source: huene1932a
  verdict: ours-correct
  note: >
    NHMUK PV OR 38058 already carried the collection code; molina-pérez2019a
    quotes the superseded BMNH form.

Dracopelta zbyszewskii:
  categories: [holotype]
  source: russo2021z
  verdict: corrected
  note: >
    Both numbers are the holotype: "MG 5787 (former IGM 5787), a partial rib
    cage with 12 dorsal vertebrae and articulated proximal ribs, and five
    different types of dermal armour (Galton, 1980), and MG 3 (IGM 3), an
    incomplete autopodium". We held only MG 3. The SGP -> IGM -> MG sequence is
    museum renaming, not renumbering, so it is not a former_ids case.

Eomamenchisaurus yuanmouensis:
  categories: [holotype]
  source: lü2008a
  verdict: corrected
  note: >
    "Holotype: CXMVZA 165." CPM is the current code for the Chuxiong
    Prefectural Museum, so the number moves to CPM 165. jones2026b's CZMVZA
    transposes the erecting paper's form.

Europelta carbonensis:
  categories: [holotype]
  source: kirkland2013a
  verdict: corrected
  note: >
    "the holotype AR-1/10". AR-1/10 designates individual 10 from site AR-1;
    Sabaj (2026) gives CPT as the current institution code, so the id becomes
    CPT AR-1/10. The paper writes the repository as FCPTD/MAP and jones2026a as
    PCPTD/MAP; both are registered as aliases.

Fabrosaurus australis:
  categories: [holotype]
  source: ginsburg1964a
  verdict: ours-correct
  note: >
    MNHN LES 9. The reference work's "MNHN No. LES 9" carries a redundant "No.",
    which is dropped from specimen ids throughout.

Gigantoscelus molengraaffi:
  categories: [holotype]
  source: vanhoepen1916a
  verdict: corrected
  note: >
    Sabaj (2026): "Ditsong National Museum of Natural History ... Formerly:
    Transvaal Museum (TM, TMP) ... Also as: TM (fossils)." van Heerden (1979)
    writes "Distal end of femur (TM 65)", so the id becomes TM 65 under DNMNH.
    The toe bone was also removed from material: it is not part of the holotype.

Hungarosaurus tormai:
  categories: [holotype]
  source: ősi2005a
  verdict: ours-correct
  note: >
    The erecting paper writes MTM Gyn/404; HNHM is the current code per Sabaj
    (2026). jones2026a's bare "TM" collides with the Transvaal Museum.

Hylaeosaurus armatus:
  categories: [holotype]
  source: raven2020a
  verdict: corrected
  note: >
    "Holotype-NHMUK PV OR3775." Normalized to NHMUK PV R 3775; see Baryonyx
    walkeri. jones2026a quotes the superseded BMNH form.

Hypsilophodon foxii:
  categories: [holotype]
  source: huxley1870a
  verdict: ours-correct
  note: >
    NHMUK PV R 197 already carried the collection code; jones2026a omits it.

Jiangxisaurus ganzhouensis:
  categories: [holotype]
  source: wei2013a
  verdict: corrected
  note: >
    jones2026c has the better-formed number. Ours read HGM41-HIII0421; the house
    form is HGM 41HIII-0421, which Beibeilong and Huanansaurus were also
    normalized to in the same pass.

Kakuru kujani:
  categories: [holotype]
  source: molnar1980a
  verdict: ours-correct
  note: >
    "South Australian Museum (SAM) P17926." SAMA is the current code per Sabaj
    (2026); bare SAM belongs to the South African Museum, a different body.

Kholumolumo ellenbergerorum:
  categories: [holotype]
  source: peyredefabrègues2019a
  verdict: ours-correct
  note: >
    "Holotype-MNHN.F.LES381m." jones2026b's "MNHN.ELES381m" is an OCR artifact
    for F.

Lapparentosaurus madagascariensis:
  categories: [holotype]
  source: bonaparte1986a
  verdict: ours-correct
  note: >
    "Muséum Nationale d'Histoire Naturelle, Paris, MAA. 91-92." Ours carries the
    modern MNHN.F prefix, F being the fossil collection.

Mamenchisaurus hochuanensis:
  categories: [holotype]
  source: young1972a
  verdict: ours-correct
  note: >
    CCG V 20401 confirmed. molina-pérez2020a's "IVPP 3" is a short-digit false
    match against prose, not a specimen number.

Mongolostegus exspectabilis:
  categories: [holotype]
  source: tumanova2018a
  verdict: ours-correct
  note: >
    "specimen PIN, no. 3779-15/3". Ours drops the redundant "no."; jones2026a
    keeps it.

Owenodon hoggii:
  categories: [holotype]
  source: norman2012a
  verdict: ours-correct
  note: >
    "NHMUK R2998 (the holotype)." Ours carries the PV collection code; see
    Baryonyx walkeri.

Pelecanimimus polyodon:
  categories: [holotype]
  source: pérez-moreno1994a
  verdict: corrected
  note: >
    "Holotype. LH 7777 (Museo de Cuenca, Cuenca, Spain)." LH is the Las Hoyas
    collection within MCCM, so the id becomes MCCM-LH 7777, which is what
    jones2026c gives.

Petrobrasaurus puestohernandezi:
  categories: [holotype]
  source: filippi2011a
  verdict: ours-correct
  note: >
    The 31 element numbers were expanded from the holotype statement in an
    earlier pass and match it. jones2026b's "HAU-Pv-PH-449" transposes MAU and
    cites the individual rather than its elements.

Prenocephale prenes:
  categories: [holotype]
  source: maryańska1974a
  verdict: ours-correct
  note: >
    "Type specimen: One specimen (Z. Pal. No. MgD-I/104)." ZPAL is the modern
    rendering of Z. Pal.; the "No." is dropped.

Rhabdodon priscus:
  categories: [holotype]
  source: matheron1869a
  verdict: corrected
  note: >
    MPLM 30 is right and jones2026a's MNPL transposes it. The material field was
    the error: it listed vertebrae, humerus, femur and tibia, where the lectotype
    is the partial left dentary alone.

Riabininohadros weberae:
  categories: [holotype]
  source: averianov2019a
  verdict: corrected
  note: >
    "Chernyshev Central Research Museum of Geology and Exploration (TsNIGR
    Museum) 5751." TsNIGR Museum is a dated rendering; CCMGE is the current
    code, giving CCMGE 5751.

Sonidosaurus saihangaobiensis:
  categories: [holotype]
  source: xu2006c
  verdict: ours-correct
  note: >
    LH V 0010 confirmed; jones2026b closes up the spacing.

Spinops sternbergorum:
  categories: [holotype]
  source: farke2011a
  verdict: ours-correct
  note: >
    "Holotype: NHMUK R16307." Ours carries the PV collection code; see Baryonyx
    walkeri.

Tazoudasaurus naimi:
  categories: [holotype]
  source: allain2004a
  verdict: corrected
  note: >
    "Holotype. To 2000-1, Musée des Sciences de la Terre, Rabat, Morocco." To is
    the TAZOUDA LOCALITY, not an institution, so it was dropped as an alias; the
    holder is SGM and the id becomes SGM To 2000-1. jones2026b's CPSGM is the
    fossil collection within SGM.

Thyreosaurus atlasicus:
  categories: [holotype]
  source: zafaty2024a
  verdict: corrected
  note: >
    HIIUC is right and jones2026a's HIUC drops an I, but the paper writes no
    dash: HIIUC BN00.

Unescoceratops koppelhusae:
  categories: [holotype]
  source: ryan2012b
  verdict: ours-correct
  note: >
    The paper writes TMP 95.12.6; ours is the same number padded to the museum's
    own form.

Wulong bohaiensis:
  categories: [holotype]
  source: poust2020a
  verdict: ours-correct
  note: >
    DNHM D2933; jones2026c drops the institution code.

Yunnanosaurus huangi:
  categories: [holotype]
  source: zhang2024a
  verdict: corrected
  note: >
    Rehoused. zhang2024a cites the specimen as "IVPP V 20/NJGM 004546",
    establishing that both numbers denote one specimen; barrett2005b and
    barrett2026a use NGMJ 004546 while fernández2022a and mooney2025a still
    write IVPP V20. Recorded as a former_ids rehousing with no source, since no
    paper read so far dates the transfer. NGMJ was added to the registry.

Yuzhoulong qurenensis:
  categories: [holotype]
  source: dai2022a
  verdict: ours-correct
  note: >
    The erecting paper prints CLGRP V00013 once, but the institution's other
    five specimens in the dataset all use CLGPR V000##, so ours follows the
    collection's own convention.

Afrovenator abakensis:
  categories: [holotype]
  source: carrano2012a
  verdict: corrected
  note: >
    "Holotype. MNN TIG1 (= UC OBA 1)." sereno1994a treats UC OBA 1 as a
    temporary designation for material on loan. MNN is superseded by MNBH per
    Sabaj, so the id becomes MNBH TIG1 and the change is recorded as a
    former_ids rehousing sourced to carrano2012a. All nine MNN ids in the
    dataset were moved to MNBH in the same pass.

Ligabuesaurus leanzai:
  categories: [holotype]
  source: bellardini2022a
  verdict: ours-correct
  note: >
    "the holotype MCF-PVPH-233." jones2026b's MCF-PHV-233 transposes it.

Macrocollum itaquii:
  categories: [holotype]
  source: müller2018a
  verdict: ours-correct
  note: >
    CAPPA/UFSM 0001a confirmed; molina-pérez2020a's 0001b is a different
    specimen of the three-individual assemblage.

Nigersaurus taqueti:
  categories: [holotype]
  source: sereno1999a
  verdict: ours-correct
  note: >
    The paper writes MNN CDF512 for a figured specimen, but the holotype is
    GAD512; the prefix moves to MNBH with the rest of the MNN records.

Panphagia protos:
  categories: [holotype]
  source: martínez2009b
  verdict: ours-correct
  note: >
    "Holotype. PVSJ 874." molina-pérez2020a's "PSVJ-874" transposes the code and
    adds a dash.

Yulong mini:
  categories: [holotype]
  source: lü2013d
  verdict: ours-correct
  note: >
    HGM 41HIII-0107 confirmed; molina-pérez2019a's 41HII drops an I.
