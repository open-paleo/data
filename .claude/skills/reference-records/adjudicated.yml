Micropachycephalosaurus hongtuyanensis:
  - categories: [stage]
    source: corpus-review
    verdict: corrected
    note: >
      Corrected to Campanian. Our Coniacian-Santonian is not supported; the
      horizon is Campanian under either stratigraphic scheme -- early to middle
      if Jiangjunding sits below the Hongtuya per Hu et al. (2001), late if
      xu2019z is right to fold it into the Hongtuya. The stage survives the
      later demotion of the formation field to Wangshi Group: butler2009b and
      sullivan2006a both give Campanian at group rank, so the age does not
      depend on resolving the subdivision.
  - categories: [formation]
    source: buffetaut1995z
    verdict: corrected
    note: >
      Changed Jiangjunding to Wangshi Group -- a sourced stop at group rank
      rather than an unresolved gap. buffetaut1995z, the paper butler2009b cites
      for this taxon's horizon, states that "dinosaur remains occur at several
      distinct levels in the Wangshi Group" with this species named among them,
      and that "its exact position within the Late Cretaceous is uncertain". It
      also shows why a finer value is unsafe: the group's own subdivision schemes
      disagree, one placing all dinosaur remains in a third member across an 800
      m spread. The describing paper gives a section at Hongtuya, the eponym of
      the Hongtuya Formation, which zhang2019a equates with the Jingangkou -- the
      unit ABOVE the Jiangjunding -- so the one positional hint available points
      away from our old value.
Shaochilong maortuensis:
  - categories: [stage]
    source: hao2025a
    verdict: corrected
    note: >
      Corrected to Barremian-Aptian. Three independent lines converge on the older
      reading: charophytes give Barremian-Aptian, ostracods Barremian-Albian, and
      palynomorphs Barremian-early Aptian, the last radiometrically calibrated on
      an overlying basalt at the nearby Tebch site. The source states it directly:
      "The Barremian age determined on palynological evidence is more accurate,
      and older, than the Aptian-Albian age based on dinosaur evidence." Our
      Aptian-Albian rested on the dinosaur evidence it supersedes, and the
      reference work's Turonian collapses on brusatte2009a's locality reasoning.
  - categories: [formation]
    source: hao2025a
    verdict: ours-correct
    note: >
      Same locality, paper and quotation as Gobisaurus domoculus: hao2025a names
      brusatte2009a's "Ulansuhai" among the mistaken assignments it corrects, and
      gives "Locality and horizon. Maortu locality ... Miaogou Formation
      (Aptian-Albian)".
Harpymimus okladnikovi:
  - categories: [stage]
    source: chinzorig2025a
    verdict: corrected
    note: >
      Corrected to Albian, which follows from the formation rather than from a
      stage argument. The specimen is from the Khuren Dukh Formation, Lower
      Member; chinzorig2025a distinguishes that unit from the Khukhteeg Formation
      on 2022-23 field survey, and the Shinekhudag/Khukhteeg/Khuren Dukh names
      have been actively disentangled in recent work.
  - categories: [formation]
    source: chinzorig2025a
    verdict: corrected
    note: >
      Shinekhudug -> Khuren Dukh; the stage follows from it.

Pendraig milnerae:
  - categories: [stage]
    source: corpus-review
    verdict: corrected
    note: >
      Widened to Norian-Rhaetian from Carnian.
  - categories: [formation]
    source: spiekman2021a
    verdict: ours-correct
    note: >
      Not a formation finding: "Wales" is a country. spiekman2021a gives "Fissure
      fills of Pant-y-ffynnon Quarry, southern Wales" -- karstic fills in
      Carboniferous Limestone, not a mapped formation. The South Wales fissure
      fills have no formation name in any paper. Same situation as Pantydraco
      caducus, and the two carry the same string.
Heyuannia huangi:
  - categories: [stage]
    source: lü2002a
    verdict: ours-correct
    note: >
      Maastrichtian stands and the recorded conflict does not exist: both cited
      sources say Maastrichtian in their own species tables. The Campanian is an
      extraction artifact -- our weishampel2004a record for this taxon reads
      "Dalangshan Formation People's Republic of China Djadokhta Formation" with a
      stage of "Late Cretaceous middle Campanian", having run together adjacent
      rows of a two-column OCR block. Our own sibling species H. yanshini is
      Campanian on the Barun Goyot, which is a second route by which the value
      could leak.
  
      Note the verdict is unanimous but not well founded: even the erecting paper
      qualifies it, "Dalangshan Formation, Late Cretaceous, ?Maastrichtian",
      inherited from a 1988 provincial regional-geology volume rather than from
      dating work. Nobody has revisited it.
  - categories: [formation]
    source: lü2002a
    verdict: corrected
    note: >
      Dongyuan -> Dalangshan. Nothing in the reference literature supports
      "Dongyuan" for Heyuan -- the only hits for that string are the unrelated
      ankylosaur Dongyuangopelta -- while the erecting paper and six later works
      give Dalangshan. The genus description already said Dalangshan, so the
      record contradicted itself.

Iguanodon bernissartensis:
  - categories: [stage]
    source: corpus-review
    verdict: ours-correct
    note: >
      Barremian-Aptian stands; the recorded conflict is spurious, the cited
      sources agreeing with us in their own species tables.
  - categories: [formation]
    source: norman2012a
    verdict: ours-correct
    note: >
      No rival claim exists. jones2026a's "Numerous localities across Europe" is
      a distribution string in an occurrence column, not a unit, and
      weishampel2004a lists the species under many English localities because it
      is cataloguing the genus. The type material comes from the Sainte-Barbe
      shaft of the Bernissart colliery -- boulenger1881a: "It was at the
      Sainte-Barbe shaft of the Bernissart coalmine ... that M. Latinis ...
      ascertained the existence of numerous bones" -- and norman2012a gives the
      unit: "The Belgian locality at Bernissart, assigned to the Sainte-Barbe
      Clays Formation".
Quilmesaurus curriei:
  - categories: [stage]
    source: corpus-review
    verdict: corrected
    note: >
