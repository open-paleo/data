Archaeopteryx lithographica:
  - categories: [formation]
    source: litholex
    verdict: ours-correct
    note: >
      LithoLex record 4012051, Altmuehltal-Formation, valid, defined by Niebuhr in
      Niebuhr & Puerner (2014) after Krumbeck (1928). Its "Synonyme und obsolete
      Einheiten" list includes "Solnhofener Schichten", "Solnhofen formation" and
      "Eichstaetter Schiefer-Serie", so the reference work's Solnhofen Fm. is the
      obsolete name for the unit we already hold, and our locality is the
      Blumenberg Quarry at Eichstaett. The alternative it offers, Moernsheim Fm.,
      is a separate valid formation (record 4012058) overlying the Altmuehltal and
      yielding other Archaeopteryx specimens, but not this one.

Anomalipes zhaoi:
  - categories: [formation]
    source: an2015z
    verdict: ours-correct
    note: >
      Rank, not identity: Hongtuya and Jingangkou are formations WITHIN the
      Wangshi Group, so the reference work's "Wangshi Grp." is the coarser
      container of the value we already hold. an2015z treats the two as nested
      throughout -- "the Hongtuya Formation of the Wangshi Group in the Zhucheng
      Basin". Ours is the finer and correct value; recording the group as well
      needs the rank field under discussion in #2012.

