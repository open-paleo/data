    "Amer. Mus. No. 973"; the holotype was sold to the Carnegie Museum in 1941.
    molina-perez2019a lists seven numbers, of which the rest are referred
    specimens.

Abrosaurus dongpoi:
  categories: [occurrence]
  source: jones2026b
