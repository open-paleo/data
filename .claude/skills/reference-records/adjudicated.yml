      dinosaur fossils, only found in the uppermost Upper Cretaceous strata, such
      as Sinoceratops zhuchengensis, Zhuchengtyrannus magnus, Tsintaosaurus
      spinorhinus, Tanius chinkankouenssi, and Tanius laiyangensis, have been
