Micropachycephalosaurus hongtuyanensis:
  - categories: [stage]
    source: corpus-review
    verdict: corrected
    note: >
      Corrected to Campanian. Our Coniacian-Santonian is not supported; the
      Jiangjunding horizon is Campanian under either stratigraphic scheme -- early
      to middle if Jiangjunding sits below the Hongtuya per Hu et al. (2001), late
      if xu2019z is right to fold it into the Hongtuya. The formation name stays
      as ours; which scheme is current is unsettled but does not change the
      stage.

Shaochilong maortuensis:
  - categories: [stage]
    source: hao2025a
    verdict: corrected
    note: >
      Corrected to Barremian-Aptian. Three independent lines converge on the older
      reading: charophytes give Barremian-Aptian, ostracods Barremian-Albian, and
      palynomorphs Barremian-early Aptian, the last radiometrically calibrated on
      an overlying basalt at the nearby Tebch site. The source states it directly:
      "The Barremian age determined on palynological evidence is more accurate,
      and older, than the Aptian-Albian age based on dinosaur evidence." Our
      Aptian-Albian rested on the dinosaur evidence it supersedes, and the
      reference work's Turonian collapses on brusatte2009a's locality reasoning.

Harpymimus okladnikovi:
  - categories: [stage]
    source: chinzorig2025a
    verdict: corrected
    note: >
      Corrected to Albian, which follows from the formation rather than from a
      stage argument. The specimen is from the Khuren Dukh Formation, Lower
      Member; chinzorig2025a distinguishes that unit from the Khukhteeg Formation
      on 2022-23 field survey, and the Shinekhudag/Khukhteeg/Khuren Dukh names
      have been actively disentangled in recent work.
  - categories: [formation]
    source: chinzorig2025a
    verdict: corrected
    note: >
      Shinekhudug -> Khuren Dukh; the stage follows from it.

Pendraig milnerae:
  - categories: [stage]
    source: corpus-review
    verdict: corrected
    note: >
      Widened to Norian-Rhaetian from Carnian.

Heyuannia huangi:
  - categories: [stage]
    source: lü2002a
    verdict: ours-correct
    note: >
      Maastrichtian stands and the recorded conflict does not exist: both cited
      sources say Maastrichtian in their own species tables. The Campanian is an
      extraction artifact -- our weishampel2004a record for this taxon reads
      "Dalangshan Formation People's Republic of China Djadokhta Formation" with a
      stage of "Late Cretaceous middle Campanian", having run together adjacent
      rows of a two-column OCR block. Our own sibling species H. yanshini is
      Campanian on the Barun Goyot, which is a second route by which the value
      could leak.
  
      Note the verdict is unanimous but not well founded: even the erecting paper
      qualifies it, "Dalangshan Formation, Late Cretaceous, ?Maastrichtian",
      inherited from a 1988 provincial regional-geology volume rather than from
      dating work. Nobody has revisited it.
  - categories: [formation]
    source: lü2002a
    verdict: corrected
    note: >
      Dongyuan -> Dalangshan. Nothing in the reference literature supports
      "Dongyuan" for Heyuan -- the only hits for that string are the unrelated
      ankylosaur Dongyuangopelta -- while the erecting paper and six later works
      give Dalangshan. The genus description already said Dalangshan, so the
      record contradicted itself.

