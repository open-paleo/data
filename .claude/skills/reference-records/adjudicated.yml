      two-id rule for a series registered under one number, which the record's
      notes field explains.
  - categories: [stage]
    source: todd2019z
    verdict: corrected
    note: >
      Corrected to Oxfordian by direct radiometric dating of the holotype's own
      matrix. todd2019z: "The Rhoetosaurus maximum depositional age determined is
      162.6 +/- 1.1 Ma, no older than early Oxfordian, demonstrating that the
      fossils are younger than expected". That outranks the palynological and
      biostratigraphic votes, which favoured Bathonian-Callovian. jones2026b was
      right, and right for the right reason.
  - categories: [formation]
    source: todd2019z
    verdict: ours-correct
    note: >
      The same paper confirms the formation while overturning the age: the fossils
      are "definitely recovered from the Walloon Coal Measures", and nair2012a's
      redescription gives "Walloon Coal Measures... Injune Creek Group, Surat
      Basin. The material derives from the lowermost section". weishampel2004a's
      Hutton Sandstone is superseded.



Sinosaurus triassicus:
  categories: [holotype]
