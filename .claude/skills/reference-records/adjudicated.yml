# Tier 1 findings settled against the erecting paper, and therefore suppressed
# from the reconciliation report.
#
# Only close a finding here when a PRIMARY paper has been read and quoted. A
# reference work disagreeing with us is not evidence that we are wrong -- of the
# first 20 series findings triaged, 5 were the reference work conflating the
# holotype with referred material, paratypes or hypodigm.
#
# Keyed by binomial; `categories` lists the finding prefixes to suppress.
# `verdict: ticketed` means the question is real but out of scope for this pass
# and tracked as a GitHub issue, so it should not resurface as a finding.

Aviatyrannis jurassica:
  categories: [holotype]
  source: rauhut2003a
  verdict: ours-correct
  note: >
    "Holotype. IPFUB Gui Th 1, almost complete right ilium." Gui Th 2 and Gui Th 3
    appear under "Referred material" (a fragmentary ilium and a partial right
    ischium), so the reference work's "Gui Th 1 through 3" folds referred
    material into the type.

Deinonychus antirrhopus:
  categories: [holotype]
  source: ostrom1969a
  verdict: ours-correct
  note: >
    "TYPE: YPM 5205, a complete left pes and an incomplete right pes. HYPODIGM:
    YPM 5201, 5202, and 5203 ..." The type is YPM 5205 alone; the reference
    work's "5205, 5203, 5206, 5210" lists the hypodigm.

Kileskus aristotocus:
  categories: [holotype]
  source: averianov2010a
  verdict: ours-correct
  note: >
    "Holotype. ZIN PH 5/117, incomplete right maxilla." A single element; the
    reference work's "5/117 through 12/117" spans the referred material.

Europasaurus holgeri:
  categories: [holotype]
  source: sander2006a
  verdict: ours-correct
  note: >
    "Holotype. DFMMh/FV 291: disarticulated left premaxilla; right maxilla; ...
    of one individual." One catalogue number covering many elements, so the
    reference work's "DFMMh/FV 291 series" is loose phrasing rather than a
    series of numbers.

Trigonosaurus pricei:
  categories: [holotype]
  source: campos2005a
  verdict: ours-correct
  note: >
    "Holotype - incomplete vertebral column ... (MCT 1488-R)". MCT 1719-R is
    explicitly the paratype.

Argyrosaurus superbus:
  categories: [holotype]
  source: mannion2012a
  verdict: ours-correct
  note: >
    "Holotype - MLP 77-V-29-1, a partly articulated left forelimb consisting of
    the humerus, ulna, radius, probably two carpals (now lost), and all five
    metacarpals." One catalogue number, not a series. lydekker1893a states no
    holotype in the modern sense, so this 2012 reappraisal is the fixing source.

Indosuchus raptorius:
  categories: [holotype]
  source: huene1933a
  verdict: ticketed
  issue: 2011
  note: >
    Type fixation unresolved. huene1933a founds the species on three specimens
    with no holotype designated ("Frontals-K 20/350 and K 27/690, and roof of
    skull K 27/685"), i.e. syntypes; Chatterjee (1978) designated the AMNH
    material as lectotype, which dalman2011z argues is invalid since that
    material lacks the diagnostic skull roof; Novas (2009) calls GSI K20/350 the
    holotype. Our record matches none of these. Needs Chatterjee (1978) read
    directly. Note jones2026c transposes the third element as GSI K20/690; the
    primary writes K 27/690.

Monkonosaurus lawulacus:
  categories: [formation]
  source: maidment2006a
  verdict: ours-correct
  note: >
    "Locality and horizon. Upper Jurassic to Lower Cretaceous Loe-ein Formation,
    Lawulashan, Monko, Qamdo District, eastern Tibet (Dong, 1990)." The
    redescription names Loe-ein, so the reference works' "Lura" is not adopted.
    Loe-ein overlies Lura, so the two are not interchangeable and the distinction
    depends on where in the section the type was collected.

Sarcosaurus woodi:
  categories: [formation, stage]
  source: ezcurra2020a
  verdict: ours-correct
  note: >
    "Type locality and horizon: Barrow upon Soar, Leicestershire, England, UK.
    Bucklandi zone of the Scunthorpe Mudstone Formation, Lias Group, Early
    Jurassic (lowermost Sinemurian)." The reference works' "Lower Lias" is the
    superseded name for the interval now divided into the Scunthorpe Mudstone and
    others, and their Hettangian age belongs to the Wilmcote material, which
    ezcurra2020a assigns to the Blue Lias Formation as a referred specimen rather
    than the holotype. Formation, locality and stage were corrected to match.
