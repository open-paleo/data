Efraasia minor:
  - categories: [formation]
    source: litholex
    verdict: ours-correct
    note: >
      LithoLex record 10000112 (the current version; 5000011 is superseded) lists
      "Synonyme und obsolete Einheiten: Loewensteiner Sandstein, Weisser Sandstein,
      Stubensandstein, Burgsandstein (ohne 'Heldburgstufe'), Loewenstein-Subfolge
      (ohne Knollenmergel)". Loewenstein-Formation is the valid name and
      Stubensandstein the obsolete one, so the reference work quotes the
      superseded form. Erected by SKPT decision of 19.07.1997, ratified in DSK
      (2005), Stratigraphie von Deutschland IV: Keuper, section 5.8.6.5
      "Stubensandstein- (Loewenstein-) Formation (km4)".

