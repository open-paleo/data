      joeckel2023z dates a tephra inside the upper Yellow Cat at 135.10 +/- 0.30
      Ma and ties a carbon-isotope excursion to the Valanginian Weissert Event, so
      the lower Yellow Cat is Berriasian into earliest Valanginian and the upper
      Yellow Cat is Valanginian. Ten of the twelve Cedar Mountain findings reduce
      to that one question, which formation-level vote counting could never have
      answered. The member is now recorded so the reasoning survives.

Martharaptor greenriverensis:
  - categories: [stage]
    source: joeckel2019z
    verdict: corrected
    note: >
      Corrected to Barremian; Hayden-Corbett site sits outside the dated belt, so the Yellow Cat framework does not reach it.

      Cedar Mountain ages are decided by position relative to Aubrey's (1998)
      marker calcrete, which separates the lower from the upper Yellow Cat Member.
      joeckel2023z dates a tephra inside the upper Yellow Cat at 135.10 +/- 0.30
      Ma and ties a carbon-isotope excursion to the Valanginian Weissert Event, so
      the lower Yellow Cat is Berriasian into earliest Valanginian and the upper
      Yellow Cat is Valanginian. Ten of the twelve Cedar Mountain findings reduce
      to that one question, which formation-level vote counting could never have
      answered. The member is now recorded so the reasoning survives.

Cedarosaurus weiskopfae:
  - categories: [stage]
    source: joeckel2023z
    verdict: corrected
    note: >
      Corrected to Valanginian from Barremian-Aptian; upper Yellow Cat Member.

      Cedar Mountain ages are decided by position relative to Aubrey's (1998)
      marker calcrete, which separates the lower from the upper Yellow Cat Member.
      joeckel2023z dates a tephra inside the upper Yellow Cat at 135.10 +/- 0.30
      Ma and ties a carbon-isotope excursion to the Valanginian Weissert Event, so
      the lower Yellow Cat is Berriasian into earliest Valanginian and the upper
      Yellow Cat is Valanginian. Ten of the twelve Cedar Mountain findings reduce
      to that one question, which formation-level vote counting could never have
      answered. The member is now recorded so the reasoning survives.

Cedrorestes crichtoni:
  - categories: [stage]
    source: corpus-review
    verdict: corrected
    note: >
      Corrected to Aptian, following a reassignment of the specimen to the Poison Strip Member.

Abydosaurus mcintoshi:
  - categories: [stage]
    source: corpus-review
    verdict: corrected
    note: >
      Corrected to Albian. The specimen is in the upper Ruby Ranch Member at DNM 16, not the Mussentuchit, per the field guide that maps its quarry.

Velociraptor mongoliensis:
  - categories: [stage]
    source: corpus-review
    verdict: ours-correct
    note: >
      Campanian stands; Djadokhta Formation at Bayn Dzak.

Erliansaurus bellamanus:
  - categories: [stage]
    source: currie1993z
    verdict: ours-correct
    note: >
      Campanian stands, at moderate confidence. currie1993z and vanitterbeeck2005z
      show the Iren Dabasu dispute is a genuine vertebrates-versus-microfossils
      split rather than a citation cascade, and that brochu2003a misreports Currie
      & Eberth.

Yizhousaurus sunae:
  - categories: [stage]
    source: corpus-review
    verdict: ours-correct
    note: >
      Sinemurian stands; Zhangjiacao Member of the Lufeng Formation.

Mononykus olecranus:
  - categories: [stage]
    source: corpus-review
    verdict: ours-correct
    note: >
      Maastrichtian stands; Nemegt Formation at Bugin Tsav.

Acantholipan gonzalezi:
  - categories: [stage]
    source: rivera-sylva2011z
    verdict: ours-correct
    note: >
      Campanian stands. This REVERSES a first-pass reading that our value had no
      source: rivera-sylva2011z, the original description of the holotype, gives
      "Pen Formation (Campanian)".

Sinocephale bexelli:
  - categories: [stage]
    source: corpus-review
    verdict: corrected
    note: >
      Corrected to Turonian-Santonian from Campanian-Maastrichtian; lower Ulansuhai Formation.

Adratiklit boulahfa:
  categories: [formation]
  source: maidment2021a
  verdict: ours-correct
  note: >
    maidment2021a is a signed self-correction by the erecting authors at the
    same site: "Maidment et al. reported the horizon as lying in the El Mers II
    Formation, but subsequent field observations at the site suggest that it
    may lie slightly higher in the stratigraphy", under a heading reading "El
    Mers III Formation ... Boulahfa". zafaty2024a and maidment2025b follow it;
    jones2026a is downstream of the uncorrected 2020 wording.

Altispinax dunkeri:
  categories: [formation]
  source: carrano2012a
  verdict: ours-correct
  note: >
    carrano2012a puts NHMUK R1828 "from the Hastings Beds Group (late
    Berriasian-Valanginian) of Battle, England", and Battle sits in the
    Wadhurst Clay outcrop. "Hastings" is the Group that contains the Wadhurst
    Clay Formation, so this is a rank difference, not a rival claim.

Amurosaurus riabinini:
  categories: [formation]
  source: xing2022a
  verdict: ours-correct
  note: >
    xing2022a gives the type locality as the "Blagoveschensk outcrop of the
    Udurchukan Formation". "Tsagaan/Tsagayan" is the Series the Udurchukan sits
    in; "Yuliangze" is the Chinese-side correlative that holds referred
    material only, and becomes relevant solely through the Sahaliyania
    synonymy. The Udurchurkan spelling is already a known variant.

Arenysaurus ardevoli:
  categories: [formation]
  source: prieto-márquez2021a
  verdict: ours-correct
  note: >
    prieto-márquez2021a places the type site in "the Blasi 3.4 locality of the
    upper Maastrichtian La Posa Formation". jones2026a is off by one unit
    upward: in the Tremp Group scheme the basal grey unit is the La Posa Fm and
    the overlying lower red unit is the Conques Fm, whose localities (Basturs
    Poble, Orcau-1) are different sites. The erecting paper's "lower part of
    the Tremp Formation" is the same horizon undivided.

Genusaurus sisteronis:
  categories: [formation]
  source: accarie1995a
  verdict: ours-correct
  note: >
    Not a formation dispute: Bevons is a commune. accarie1995a uses it
    throughout as a place name ("4.25 km SW of the village of Sisteron", "the
    Bevons site") and gives a lithological description -- "greenish clays and
    glauconitic sands" -- rather than a formal unit, which is why the reference
    works fell back on the locality. Those are the Aptian-Albian basinal marls
    of the Vocontian Basin, the Marnes Bleues.

Gobisaurus domoculus:
  categories: [formation]
  source: hao2025a
  verdict: ours-correct
  note: >
    hao2025a names the reference work's value as one of the errors it is
    correcting: the Maortu unit "actually belongs to the Miaogou Formation,
    which incorporated the formerly abandoned Dashuigou Formation and
    Wulanhushao Formation". It also shows the real Ulansuhai Fm crops out at
    Bayan Mandahu and Suhongtu, tens of km north, so applying it at Maortu is a
    geographic error and not a naming preference.

Heterodontosaurus tucki:
  categories: [formation]
  source: norman2011a
  verdict: ours-correct
  note: >
    Holotype-versus-hypodigm conflation. norman2011a gives the holotype
    SAM-PK-K337 as "Clarens Formation (formerly 'Cave Sandstone', Stormberg
    Series)" and places the referred SAM-PK-K1332 in the upper Elliot Fm,
    "stratigraphically lower than the horizon at which the holotype was found".
    The species is genuinely known from both units; location.formation tracks
    the type.

Huanansaurus ganzhouensis:
  categories: [formation]
  source: lü2015b
  verdict: corrected
  note: >
    Changed Hekou to Nanxiong. lü2015b: "Type locality and horizon. In the
    vicinity of the Ganzhou Railway Station ...; Nanxiong Formation (Upper
    Cretaceous)". Nothing in the literature assigns any Ganzhou oviraptorid to
    the Hekou Fm, and our own description field already said Nanxiong, so the
    record contradicted itself. The Guifeng Group revision is real but nobody
    has published which of its formations the Ganzhou-city quarries sit in.

Jaxartosaurus aralensis:
  categories: [formation]
  source: godefroit2003a
  verdict: corrected
  note: >
    Changed Dabrazhin to Syuksyuk. Two defects: the string names no real unit
    -- "Dabrazhin" occurs in no paper, and the Kazakh unit is the Darbazin Fm
    (Darbazinskaya Svita) -- and Darbazin is the wrong unit for this taxon in
    any case. godefroit2003a: "Jaxartosaurus aralensis, from the Syuksyuk
    Formation of Kazakhstan (Santonian)"; nessov1995a puts Kyrkkuduk I in the
    Syuk-Syuk Fm, Santonian, matching the age we hold. Only the adjacent
    Kyrkkuduk II site is lower Darbazin.

Kulindadromeus zabaikalicus:
  categories: [formation]
  source: godefroit2014a
  verdict: ours-correct
  note: >
    The erecting paper gives "the base of the Ukureyskaya Formation".
    Ukureyskaya is the Russian adjectival form and the reference work has
    stripped the ending, exactly as Baruungoyot/Barun Goyot and
    Udurchukan/Udurchurkan already do. Pair added to formation-variants.yml.

Paludititan nalatzensis:
  categories: [formation]
  source: díaz2025a
  verdict: corrected
  note: >
    Changed Râul Mare to Sânpetru, keeping Râul Mare Beds as the member.
    díaz2025a: the locality "belongs to the 'Râul Mare Beds', a not yet
    formally defined lithostratigraphical unit that either represents the
    uppermost part of the Sînpetru Formation ... or is a distinct unit".
    csiki2010a gives "Type horizon and locality: Sânpetru Formation,
    Nălaţ-Vad". Râul Mare is also the river the outcrop sits beside, which is
    the likely route into the formation field.

Protohadros byrdi:
  categories: [formation]
  source: tykoski2023a
  verdict: ours-correct
  note: >
    Denne et al. (2016) raised the Woodbine to Group and the Lewisville to
    Formation, with the erecting paper's Arlington now a member inside it.
    tykoski2023a: "The Lewisville Formation is the upper formation of the
    Woodbine Group following recent revision ... which we follow here", and
    counts Protohadros as a Lewisville taxon. weishampel2004a's "Woodbine" is
    the pre-2016 rank. Member populated as Arlington from head1998a.

Pycnonemosaurus nevesi:
  categories: [formation]
  source: delcourt2017z
  verdict: corrected
  note: >
    Both candidate values were wrong. delcourt2017z, the only full
    redescription of the holotype: "according to Kellner & Campos (2002), this
    locality is in the Bauru Group. However, recent work has shown that this
    locality is actually part of the Parecis Group". That removes Adamantina (a
    Bauru Group formation of the Paraná Basin) and our Cachoeira do Bom Jardim
    (a Bauru Group formation of Mato Grosso) together. Delcourt names no
    formation within the Parecis Group, so group rank is the honest value.

Rebbachisaurus garasbae:
  categories: [formation]
  source: wilson2015a
  verdict: ours-correct
  note: >
    The type locality of the formation itself -- epithet, butte and formation
    share the name. wilson2015a places the quarry "in the lower third of the
    height" of Gara Sbaa, i.e. the lower (Gara Sbaa) formation of the Kem Kem
    Group rather than the upper (Douira). "Kem Kem" is the Group. wilson2015a
    also records that the provenance "has been listed erroneously as 'Tegama
    Formation'" by weishampel2004a.

Sauroniops pachytholus:
  categories: [formation]
  source: cau2013a
  verdict: ours-correct
  note: >
    cau2013a: "Type horizon and locality. Ifezouane Formation (Cenomanian,
    Upper Cretaceous; Cavin et al., 2010). Southeast region of Taouz". "Kem
    Kem" is the Group. Note that Ifezouane (Cavin et al. 2010) and Gara Sbaa
    (Ibrahim et al. 2020) are competing names for the same lower Kem Kem unit
    and the repo currently uses both; choosing one scheme is held as a separate
    question.

Struthiosaurus austriacus:
  categories: [formation]
  source: csiki-sava2015a
  verdict: ours-correct
  note: >
    bunzel1870a's "Gosau formation" is pre-modern usage; in current Austrian
    lithostratigraphy the Gosau is a Group. csiki-sava2015a places the Grünbach
    coal measures "within the Grünbach Formation of the Lower Gosau Subgroup",
    and czepiński2025a ties the same Bunzel assemblage to "the Grünbach
    Formation, Muthmannsdorf (Austria)".

Tambatitanis amicitiae:
  categories: [formation]
  source: tanaka2024a
  verdict: ours-correct
  note: >
    Ohyamashimo is the modern name for the erecting paper's provisional
    "'Lower' Formation" -- saegusa2014a's own scare quotes mark a unit awaiting
    a name. tanaka2024a: "The Sasayama Group, comprising the Ohyamashimo and
    Sawada formations in ascending order", with Kamitaki as the Tambatitanis
    locality; kubota2024a calls the Ohyamashimo "the lower unit of the Sasayama
    Group". "Sasayama" is the Group.

Tongtianlong limosus:
  categories: [formation]
  source: lü2016a
  verdict: corrected
  note: >
    Changed Hekou to Nanxiong, identically to Huanansaurus ganzhouensis.
    lü2016a: "Type locality and horizon. The building site of the No. 3 high
    school of Ganxian ...; Nanxiong Formation (Maastrichtian, Upper
    Cretaceous)". Whether the Ganzhou Basin taxa should move to the Guifeng
    Group scheme is one question for all of them, not eight separate ones, and
    is not settled here.

Tugulusaurus faciles:
  categories: [formation]
  source: rauhut2005c
  verdict: ours-correct
  note: >
    The Lianmuqin is the uppermost formation of the Tugulu Group, so "Tugulu"
    is a rank difference. The dedicated redescription gives it explicitly:
    "Locality and Horizon -- Wuerho, Lianmugin [Lianmuqin] Formation, Xinjiang,
    China". The erecting paper named no formation at all, only field numbers.

Valdoraptor oweni:
  categories: [formation]
  source: carrano2012a
  verdict: ours-correct
  note: >
    "Hasting[s]" is the Group, and misspelled. carrano2012a: NHMUK R2559 is
    "from the Tunbridge Wells Sand Formation (Valanginian) of Cuckfield,
    Sussex". The type provenance is genuinely weak -- owen1858a records only
    "the Wealden matrix" and lydekker1889a's only stratigraphic remark is the
    negative one that the Wadhurst Clay metatarsals are "specifically distinct"
    from the type -- so carrano2012a's Cuckfield attribution is itself an
    inference, and the finer Grinstead Clay assignment that Cuckfield would
    imply is not carried here.

Xuanhuaceratops niei:
  categories: [formation]
  source: zhao2006a
  verdict: corrected
  note: >
    Changed Tuchengzi to Houcheng. The two are the same unit under provincial
    names, and the type locality is Yanjiagou in Hebei, where Houcheng applies.
    zhao2006a: "Horizon and Locality: Houcheng Formation ... Xuanhua Area,
    Hebei Province", adding that it "is generally considered to be Late
    Jurassic in age and laterally equivalent to the Tuchengzi Formation";
    zhou2017z writes "The Tuchengzi Formation (called Houcheng Formation in
    Hebei Province)". Not a spelling variant -- laterally equivalent strata
    under two valid regional names.

Zby atlanticus:
  categories: [formation]
  source: mateus2014a
  verdict: corrected
  note: >
    Changed Praia da Amoreira-Porto Novo to Lourinhã with member Amoreira-Porto
    Novo: a member had been recorded in the formation field. mateus2014a uses
    both ranks in one sentence -- "top of the Amoreira-Porto Novo Member of the
    Lourinhã Formation, late Kimmeridgian". Torvosaurus already carries this
    pair correctly and sets the spelling.

Berberosaurus liassicus:
  categories: [formation]
  source: montenat2005z
  verdict: corrected
  note: >
    Changed Azilal to Toundoute Continental Series. The Azilal assignment rests
    on one sentence in allain2008a -- "It is very likely that the Toundoute
    continental series ... is a lateral equivalent of the Toarcian Azilal and
    Wazzant formations (Montenat et al. 2005)" -- and montenat2005z says no
    such thing: the words Azilal and Wazzant appear nowhere in it, in either
    the French original or the translation. The correlation is Allain and
    Aquesbi's own inference, printed with a query mark in their own chart, and
    holwerda2018a and rincón2022a repeat it as though it were an assignment.
    montenat2005z divides the succession into "eight informal
    lithostratigraphic units, designated A to H" and erects no formation, so
    Toundoute Continental Series is the finest available value. Geography
    agrees: Azilal is defined in the central High Atlas ~150 km away across the
    range from Toundoute.

Echinodon becklesii:
  categories: [formation]
  source: clements1993z
  verdict: ours-correct
  note: >
    Formation confirmed and member populated. clements1993z is the Purbeck
    type-section paper, and its Table 1 settles the rank question directly: the
    Cherty Freshwater Member is the topmost member of the Lulworth Formation
    and the Cinder Member the basal member of the Durlston Formation.
    galton1978a places the material in the Dirt Bed (Mammal Bed), which
    clements1993z numbers DB83, twenty-eight beds below the Cinder Member at
    DB111. "Middle Purbeck" was never a rival value -- weishampel2004a itself
    defines it as straddling the two formations, so it cannot decide the
    question.

Irritator challengeri:
  categories: [formation]
  source: delcourt2025a
  verdict: ours-correct
  note: >
    A rank change, not a disagreement about the rock. The Santana Formation was
    raised to the Santana Group (Crato, Ipubi and Romualdo formations), so
    martill1996a's "Romualdo Member of the Santana Formation" and the current
    "Romualdo Formation of the Santana Group" name the same body. Every source
    writing Santana writes Romualdo in the same breath, so the count was
    counting one unit twice. Current usage is uniformly Romualdo Formation.

Lingwulong shenqi:
  categories: [formation]
  source: ren2023a
  verdict: ours-correct
  note: >
    Zhiluo retained, with lowered confidence. The reassignment from Yan'an
    traces to a single Chinese-language regional-geology paper (You, Li and Li
    2019) that is not held. Four later sauropod papers adopt it -- ren2023a:
    "the bone-bearing stratigraphic unit is revised from Yan'an Formation to
    Zhiluo Formation" -- but that is a citation cascade off one determination
    rather than four determinations, and mannion2025a, the 2025 diplodocoid
    revision, declines to choose. jones2026b prints Yanan in its table while
    its own body text concedes the Zhiluo revision. Zhiluo is what every worker
    who has committed since 2019 has committed to. Revisit with the stage field
    if the source surfaces: Yan'an is Toarcian-Bajocian, Zhiluo
    Bathonian-Callovian.

Lirainosaurus astibiae:
  categories: [formation]
  source: carrano2008a
  verdict: ours-correct
  note: >
    The rival value is a clerical error rather than a stratigraphic opinion.
    The Marnes Rouges Inférieures Formation is French -- the stratum typicum of
    Ampelosaurus atacis at Campagne-sur-Aude, Aude -- and jones2026b's own
    Ampelosaurus row lists it under France while its Lirainosaurus row lists it
    under Spain: two adjacent rows of one table crossed. Ours is thinly sourced
    in absolute terms, though: sanz1999a names no unit for the Laño quarry, the
    Díez Díaz papers work at locality level, and carrano2008a is the only
    in-corpus attestation tying Laño material to the Vitoria Formation.

Nipponosaurus sachalinensis:
  categories: [formation]
  source: suzuki2004a
  verdict: ours-correct
  note: >
    The rival value is self-refuting on its own citation: weishampel2004a gives
    Ryugase Group citing Suzuki and others 2004, and that paper says "Upper
    Ammonites Bed; now Upper Yezo Group". takasaki2017a agrees. Those two are
    the only papers to have re-examined the holotype. Group rank is deliberate
    and will not sharpen: the Kawakami colliery has been inaccessible since
    1945 and suzuki2004a records that the excavation field notes are lost.

Argentinosaurus huinculensis:
  - categories: [formation]
    source: bonaparte1993a
    verdict: ours-correct
    note: >
      A rank elevation, not a disagreement. bonaparte1993a says "Río Limay
      Formation, Huincul Member" throughout; modern Neuquén Basin usage raises
      Río Limay to Subgroup and Huincul to Formation, which every modern paper
      here follows. weishampel2004a, the only dissenting source, prints the
      containment in the same line -- "Río Limay Formation ... includes
      Candeleros, Huincul, and Cerro Lisandro formations" -- so it names ours as
      a contained unit rather than a rival.
Cetiosaurus oxoniensis:
  - categories: [formation]
    source: upchurch2003a
    verdict: corrected
    note: >
      Changed Rutland to Forest Marble. The record paired the referred Rutland
      skeleton's unit with the lectotype's locality. upchurch2003a gives the type
      horizon under its own heading: the Bletchingdon Station specimens "are
      often stated as being found in the Great Oolite ... Phillips (1871:247-248)
      noted, however, that the Cetiosaurus bones were actually found in the
      Forest Marble (Bathonian) sediments immediately above the Great Oolite".
      phillips1871a records the measured section from the quarry itself, with the
      bones lying on the bared oolite surface under the Forest Marble, and
      upchurch2009a -- the ICZN application granted as Opinion 2331 -- repeats
      it. LCM G468.1968, the Rutland specimen, is from Great Casterton some 200
      km away and is Bajocian; the record already carries it separately as a
      notable specimen.
Dinodocus mackesoni:
  - categories: [formation]
    source: woodward1908a
    verdict: ours-correct
    note: >
      Every technical source is on one side. woodward1908a, the only paper to
      re-examine the material, is titled "Note on Dinodocus Mackesoni, a
      Cetiosaurian from the Lower Greensand of Kent" and captions the humerus
      "from the Lower Greensand, near Hythe, Kent". owen1884a's own index reads
      "from a 'Greensand' formation at Hythe", and upchurch2004a agrees.
      jones2026b's Atherfield Clay has no trail in the literature and looks like
      a guess at a finer unit. Group rank is genuinely all that is known: the
      specimen was collected in 1840 with no recorded horizon.
Dystrophaeus viaemalae:
  - categories: [formation]
    source: foster2016a
    verdict: ours-correct
    note: >
      The Summerville assignment was retracted by the people who made it. It
      traces to Gillette 1993/1996, who relocated the lost type locality in 1987;
      Gillette is a co-author on foster2016a, reporting the re-excavation of that
      same site under the title "Dystrophaeus viaemalae Cope from the basal
      Morrison Formation of Utah". tschopp2015a independently lists the type as
      "low in Morrison Form.". The member is left empty deliberately: the lower
      Morrison there is the Tidwell Member and that is likely the eventual
      answer, but no source in the literature here says so.
Gondwanatitan faustoi:
  - categories: [formation]
    source: santucci2022a
    verdict: ours-correct
    note: >
      A competing lithostratigraphic scheme rather than a different rock body:
      santucci2022a writes the equivalence outright, "Adamantina Formation
      (=Presidente Prudente Formation)". Adamantina is Soares and others (1980);
      Presidente Prudente is Fernandes and Coimbra's later subdivision of the
      same interval and the minority usage. santucci2022a's systematic entry
      gives "Álvares Machado ... Adamantina Formation, Campanian-early
      Maastrichtian", citing current geochronology rather than repeating the
      erecting paper. Attested at second hand only: kellner1999a is not held,
      though four independent works report it as Adamantina.
Klamelisaurus gobiensis:
  - categories: [formation]
    source: moore2020a
    verdict: ours-correct
    note: >
      Wucaiwan is a superseded formation name. moore2020a, the redescription of
      the holotype, states it: the specimen came from strata "formerly called the
      'Wucaiwan Formation' and is now considered to constitute the lower beds of
      the Shishugou Formation (Clark et al. 2006)". weishampel2004a reproduces
      the erecting paper's usage as a section heading. Member left empty:
      Wucaiwan is now a locality some 95 km from the holotype site and an
      abandoned unit name, not a member of the Shishugou, and moore2020a says
      only "lower beds", which is informal.
Pachycephalosaurus wyomingensis:
  - categories: [formation]
    source: brown1943a
    verdict: corrected
    note: >
      Changed Hell Creek to Lance, with locality and region corrected and the
      coordinates removed. The record paired the right holotype with the wrong
      specimen's provenance. brown1943a catalogues it verbatim: "U.S.N.M. No.
      12031 ... type of this species ... Lance formation, 9 miles southwest of
      Warren P.O., Buck Creek, Niobrara County, Wyoming." The Ekalaka, Montana
      data belonged to AMNH 1696, holotype of the junior synonym P. grangeri,
      which brown1943a erects in the same paper and which this record already
      lists as a synonym. The species epithet and our own etymology field both
      said Wyoming while the region field said Montana. Coordinates were
      Ekalaka's and are removed rather than guessed; Niobrara County needs
      re-deriving. The Hell Creek count is explained by almost all
      Pachycephalosaurus material being Hell Creek -- none of it the type.
Thescelosaurus neglectus:
  - categories: [formation]
    source: gilmore1913a
    verdict: ours-correct
    note: >
      The erecting paper is titled "Osteology of Thescelosaurus, an orthopodous
      dinosaur from the Lance Formation of Wyoming", and its Summary of Known
      Material gives the type first: "Type, No. 7757, U.S.N.M. ... From Doegie
      Creek, Niobrara County, Wyoming." The rival values are genus-level
      distributions across referred material -- jones2026a's occurrence column
      omits the Lance entirely, which is a defect in it rather than evidence. The
      Canadian and Montanan material is already represented correctly as separate
      species in this file: T. assiniboiensis carries Frenchman and T. garbanii
      carries Hell Creek.
Unenlagia comahuensis:
  - categories: [formation]
    source: porfiri2024a
    verdict: ours-correct
    note: >
      The same rank elevation as Argentinosaurus huinculensis, in the same basin.
      novas1997a gives "Río Neuquén Formation, Sierra del Portezuelo"; modern
      usage raises Río Neuquén to Subgroup, containing the Portezuelo and
      Plottier formations, so ours is the same rock at the current rank -- and
      the erecting paper's own locality is that formation's type section.
      porfiri2024a gives "U. comahuensis, U. paynemili, Neuquenraptor argentinus,
      and Pamparaptor micros from the Turonian-Coniacian ... Portezuelo
      Formation". The congener U. paynemili already carries Portezuelo here, so
      changing this would split one genus across two schemes.
Alioramus remotus:
  categories: [formation]
  source: kurzanov1976b
  verdict: ours-correct
  note: >
    Survives, but not on the count -- "Nemegt 13" is inflated by A. altai,
    which really is Nemegt. Kurzanov divides the Nogon Tsav section in two and
    places the holotype in the lower half: the lower beds hold "many complete
    skulls, separate bones of tarbosaurs, ornithomimids, and claws of
    therizinosaurs", the upper red beds "only scattered fragments", and the
    type "occurs in the lower gray beds". That lower fauna is the Nemegt
    assemblage. barsbold1983a, who named the rival unit, puts "Nogon Tsav
    Svita" on the UPPER, dinosaur-poor half and lists Alioramus in the
    Nemegtskaya complex -- so the reference works are applying a locality name
    to the whole exposure. Residual uncertainty is real: brusatte2009b notes
    the correlation "ha[s] yet to be undertaken" and nobody has since done it,
    so this rests on faunal fit, not measured section.

Dyslocosaurus polyonychius:
  categories: [formation]
  source: mcintosh1992a
  verdict: ours-correct
  note: >
    Kept as a preference, not a determination, and the erecting paper says so:
    its Distribution line reads "Formation uncertain, probably from the
    Morrison Formation", and the discussion closes "in absence of more precise
    data on the collection site we cannot dismiss the possibility that Loomis's
    stratigraphic determination is correct". The Morrison case is indirect --
    diplodocids are unknown after the Early Cretaceous in North America, and
    the preservation matches Morrison material -- while the only documentary
    evidence, F. B. Loomis's museum entry, says Lance. tschopp2015a adds that
    at least one pedal phalanx was probably not collected with the rest.

Erectopus superbus:
  categories: [formation]
  source: allain2005b
  verdict: corrected
  note: >
    Changed La Penthièvre to La Penthiève -- the unit was right, the spelling
    wrong by one letter. allain2005b's formal horizon statement reads
    "Phosphate-bearing beds of La Penthiève, Mammilatum Zone, Lower Cretaceous,
    lower Albian", and carrano2012a's appendix 3 distinguishes the two words in
    adjacent columns of one row: the unit is "La Penthiève Beds", the locality
    "Bois de la Penthière". Note allain2005b is itself inconsistent, writing
    "La Penthièvre" once in narrative prose about the Pierson collection; the
    horizon line and the appendix are the places that name the bed, and both
    give Penthiève. The unit is informal and bed-rank, so jones2026c's "Beds
    Fm." is a rank collision of its own making, and weishampel2004a's "Unnamed
    unit" simply predates the lectotype redescription.

Graciliceratops mongoliensis:
  categories: [formation]
  source: barsbold1983a
  verdict: ours-correct
  note: >
    Not a disagreement: jones2026a's "Bayan Shireh Fm." is our value under
    another transliteration. The only genuine rival is weishampel2004a's
    "Shireegiin Gashuun Formation", the locality name promoted to formation
    rank -- its own index betrays it with "Bayanshiree Svita. See also
    Shireegiin [Gashuun Formation]". sereno2000a names no formation at all; the
    assignment comes from the regional literature, where barsbold1983a
    correlates the Shiregin Gashun deposits with the Bayanshirenskaya. Carry
    the caveat that the correlation is not airtight: currie1993z records
    "little overlap between the faunas of the two areas", and tumanova1987a
    that the section "includes deposits of several formations".

Machairasaurus leptonychus:
  categories: [formation]
  source: longrich2010a
  verdict: ours-correct
  note: >
    Not a disagreement: Bayan Mandahu and Wulansuhai are two names for one
    unit, the Upper Cretaceous redbeds at Bayan Mandahu, and the literature
    states the equivalence outright as "Bayan Mandahu Formation ( = Wulansuhai
    Formation)". The erecting paper is unambiguous on the type horizon:
    "Horizon and type locality. Bayan Mandahu Formation, Late Cretaceous
    (Campanian), Bayan Mandahu, Inner Mongolia." Flagged rather than resolved:
    the repo carries Wulansuhai on six species and Bayan Mandahu on four for
    the same rock, which is worse than either choice.

Megaraptor namunhuaiquii:
  categories: [formation]
  source: calvo2004b
  verdict: ours-correct
  note: >
    A rank change, not a conflict, and the same one as Argentinosaurus
    huinculensis in the same basin. novas1998a gives "Rio Neuquen Formation,
    Sierra del Portezuelo"; Río Neuquén was subsequently raised to Subgroup and
    now contains the Portezuelo below and the Plottier above, so ours is the
    finer current value and the erecting paper's own locality is that
    formation's type section. jones2026c prints Portezuelo Fm. and agrees with
    us.

Protoceratops hellenikorhinus:
  categories: [formation]
  source: lambert2001a
  verdict: ours-correct
  note: >
    The erecting paper settles it in its Stratum typicum line: "Bayan Mandahu
    Formation, ? correlated with the Djadokhta Formation in People's Republic
    of Mongolia" -- the Djadokhta offered as a correlation and carried with a
    query by the author who made it. weishampel2004a demotes that hedge into a
    flat assignment. longrich2010a assembles the case against it: "none of the
    material found at Bayan Mandahu can be definitively referred to species
    known from Bayn Dzak", citing this taxon as one of the endemics. Note P.
    andrewsi correctly stays on Djadokhta; the two species genuinely differ and
    this must not be "fixed" by unifying them.

Seitaad ruessi:
  categories: [formation]
  source: sertich2010a
  verdict: ours-correct
  note: >
    No disagreement existed. The record holds "Navajo Sandstone" and jones2026b
    prints "Navajo Ss." -- the same unit, which the reconciler failed to reduce
    because it did not know Ss. abbreviates Sandstone. Fixed in the tooling.
    sertich2010a fixes the position precisely: the holotype "was preserved in a
    bed of massive sandstone at the base of the Navajo Sandstone, one meter
    above an interbedded mudstone and sandstone facies of the Kayenta
    Formation". The Navajo has no formal members in southern Utah.

Shamosaurus scutatus:
  categories: [formation]
  source: arbour2015a
  verdict: ours-correct
  note: >
    The two names sit at different ranks rather than competing. arbour2015a
    states it for this holotype: "Khamryn-Us ( = Khamareen Us), southeastern
    Gobi, Mongolia; Zuunbayan ( = Dzun Bayn, Dzunbayn, Dzunbain) Formation
    (roughly equivalent to the Khukhtyk/Huhteg Svita), Aptian-Albian."
    tumanova2018a makes the relationship explicit for another taxon from the
    same locality -- "Khukhtykskii Horizon, Dzunbain Formation" -- so
    weishampel2004a's "Hühteeg Svita" is the horizon and ours is the formation
    within it. Tumanova, who erected the taxon, uses the formation name in her
    1987 monograph.

Shantungosaurus giganteus:
  categories: [formation]
  source: an2015z
  verdict: ours-correct
  note: >
    Ours is the finer rank and the erecting paper is consistent with it:
    hu1973a places the bones "belonging to the middle portion of the Wangshi
    Group", and the Hongtuya is the middle formation of the Zhucheng
    succession, between the Xingezhuang below and the Jinggangkou above.
    an2015z pins it, dating samples logged as K2h from Kugou-Longgujian --
    hu1973a's Longgujing between Xixiandun and Kugou, which our locality string
    already records. weishampel2004a's "Shanyang Formation" is not a rival type
    horizon: the cell reads "Wangshi Group (Shandong), Shanyang Formation
    (Shaanxi)", a two-province genus distribution of which only the Shandong
    half bears on the holotype.

Talarurus plicatospineus:
  categories: [formation]
  source: park2019a
  verdict: ours-correct
  note: >
    Not a disagreement -- "Bayanshiree Svita" is our unit with the Russian rank
    term attached. park2019a covers the holotype explicitly: "Holotype and all
    other materials are from the Upper Cretaceous (Cenomanian-Santonian)
    Bayanshiree Formation, Bayan Shiree cliffs, eastern Gobi Desert, Mongolia",
    adding that the new material came from the type section of the formation.

Transylvanosaurus platycephalus:
  categories: [formation]
  source: augustin2022a
  verdict: corrected
  note: >
    Changed Sînpetru to Pui Beds; this was misfiled as ours-correct and the
    reference work is right. augustin2022a places the holotype outside the
    Sînpetru in three places. Its Type Stratum line: LPB (FGGUB) R.2070 "was
    recovered ... from the middle part of the uppermost Cretaceous continental
    succession from the Bărbat River Valley section, informally also referred
    to as the 'Bărbat Formation' (Therrien, 2005) or the 'Pui Beds'". Its
    Figure 1 key separates them as different map units -- "3, Sînpetru
    Formation; 4, Sînpetru Formation-correlative units ('Râul Mare Beds' in the
    central part of the basin, 'Pui Beds' in the eastern part)". And it records
    the Sînpetru reading as superseded, held by Nopcsa 1905, Mamulea 1953 and
    Grigorescu 1992 against the more recent distinct-unit interpretation. Both
    names are informal; 'Pui Beds' is the more recent and is what the paper
    uses throughout.

Zalmoxes robustus:
  categories: [formation]
  source: weishampel2003a
  verdict: ours-correct
  note: >
    The unit is right and the spelling is held pending a repo-wide decision. On
    the unit: jones2026a's cell lists two formations because it describes the
    genus distribution -- its specimen column reads "numerous specimens" --
    while weishampel2003a separates them, giving the holotype as "Sanpetru,
    Hunedoara County, Romania. Sanpetru Formation (upper Maastrichtian)" and
    confining Densuș-Ciula to referred specimens. On the spelling,
    weishampel2003a flags the orthographic reform in its geology section: "in
    this post-Ceausescu era, some spellings in the Romanian language have
    changed, among them Sînpetru to Sânpetru". Sânpetru adopted repo-wide on
    that basis: the 1993 orthographic reform replaced î with â in this
    position, and all four reference works print Sânpetru. Eight records were
    flipped together rather than this one alone, since a single change would
    have deepened the split (six î against one â) rather than fixed it. The î
    form survives in some later literature, including augustin2022a in 2022,
    and is kept as a recognised variant in formation-variants.yml.

Coahuilaceratops magnacuerna:
  categories: [formation]
  source: loewen2010a
  verdict: corrected
  note: >
    Changed Cerro Huerta to Cerro del Pueblo, with part: middle. The record had
    captured the measuring datum instead of the host unit. loewen2010a gives
    the horizon as "the middle part (approximately 230 m level) of the
    Campanian Cerro del Pueblo Formation, the basal formation of the Difunta
    Group", and the Cerro Huerta appears in that paper exactly once, as the
    OVERLYING unit the sections were measured down from. rivera-sylva2017a,
    from the holding institution, independently gives Cerro del Pueblo. The
    Maastrichtian stage is not a defect: the bonebed is dated ~72.0 Ma, which
    reads as earliest Maastrichtian on the current scale even though
    loewen2010a calls it late Campanian.

Equijubus normani:
  categories: [formation]
  source: you2014a
  verdict: ours-correct
  note: >
    A group-versus-formation rank mismatch: Xinminbao and Xinminpu are the same
    group and the Zhonggou is a formation inside it. you2014a states both
    halves -- "The Xinminpu Group includes two formations: the lower Xiagou and
    the upper Zhonggou formations ... the dinosaur-bearing Xinminpu Group in
    the Mazongshan area belongs to Zhonggou Formation" and "Both
    Gongpoquansaurus and Equijubus are from the middle gray unit of the
    Xinminpu (= Xinminbao) Group in the Gongpoquan Basin". The describing paper
    predates the formation assignment and gives only the group. part: middle
    records the informal middle gray unit; you2014a added as the reference
    carrying the value.

Fusuisaurus zhaoi:
  categories: [formation]
  source: mo2016z
  verdict: ours-correct
  note: >
    Napai is the superseded name for the same rock, and the correction comes
    from the author of the describing paper: mo2016z states that "the name
    'Xinlong Formation' is more precise and has precedence over 'Napai
    Formation'". ji2022a records the supersession from outside, listing the
    pre-2010 users as Hou 1975, Mo 2006, Mo 2010 and Buffetaut 2008 -- so the
    reference work's "Napai Fm." is the 2006 describing paper unrevised, not
    independent evidence. Napai survives as the name of the BASIN, which is why
    the old formation name still appears in modern text. No member or part:
    mo2016z reviews this basin and does not subdivide the Xinlong at all, and
    the four-member mapping scheme puts its second member on the northern flank
    while this holotype came from Liubang in the southeast.

Gojirasaurus quayi:
  categories: [formation]
  source: carpenter1997a
  verdict: corrected
  note: >
    Changed Bull Canyon to Cooper Canyon, and recorded as genuinely contested
    rather than settled. The describing paper devotes a section to adjudicating
    the two names under the North American Stratigraphic Code and concludes
    that "the stratum from which the holotype Gojirasaurus quayi was collected
    should be referred to as the Cooper Canyon Formation of the Dockum Group".
    The two are laterally equivalent bodies -- nesbitt2007a writes "the Bull
    Canyon (=Cooper Canyon) Formation" -- so this is a nomenclatural preference
    between the Lucas-school New Mexico name and the Texas name. Same split as
    Lepidus praecisio at Otis Chalk and resolved the same way deliberately; the
    two must not diverge. The count was inflated: most corpus papers naming
    Cooper Canyon concern Texas localities and never mention this taxon.

Huanghetitan liujiaxiaensis:
  categories: [formation]
  source: you2006a
  verdict: corrected
  note: >
    Changed "Upper" to Hekou Group with part: upper. Neither side was right --
    our value was a stranded qualifier from "upper Hekou Group", not a unit
    name. you2006a names no formation-rank unit at all, giving "Lower
    Cretaceous Hekou Group", and li2014a places the Yongjinglong quarry less
    than a kilometre away in the "upper Hekou Group". No work subdivides the
    Hekou Group into named formations in this basin. The fix also makes the
    record consistent with Daxiatitan, Yongjinglong and Lanzhousaurus, which
    already carry Hekou Group. Not to be merged with the Hekou FORMATION of the
    Guifeng Group in Jiangxi, some 1,500 km away.

Kelmayisaurus petrolicus:
  categories: [formation]
  source: brusatte2012a
  verdict: ours-correct
  note: >
    A rank mismatch: the Lianmuqin is the uppermost formation of the Tugulu
    Group, so the reference work's group name contains our value rather than
    contradicting it. The reassessment gives "Type locality: Near Wuerho
    (Urdo), Junggar Basin, Xinjiang, China" and "Type horizon: Lianmugin
    Formation, Tugulu Group" -- Lianmugin being a romanisation variant of the
    pinyin Lianmuqin we hold. The describing paper gives only a field locality
    number. CAUTION: the corpus file under key brusatte2012a is this
    Kelmayisaurus reassessment, while the bib entry under that key is a
    different Brusatte 2012 paper.

Liubangosaurus hei:
  categories: [formation]
  source: mo2016z
  verdict: ours-correct
  note: >
    The same quarry and the same question as Fusuisaurus zhaoi -- mo2010a opens
    by noting that the Liubang quarry yielded both, "a very large one
    (described as Fusuisaurus zhaoi by Mo et al., 2006) and two smaller ones"
    -- so whatever unit one carries, the other must. Napai is the superseded
    name; see the Fusuisaurus entry for the priority statement. mo2016z places
    both taxa at "the Liubang quarry" in the Xinlong Formation and uses no
    member-rank subdivision, so member and part stay empty.

Malarguesaurus florenciae:
  categories: [formation]
  source: gonzálezriga2013a
  verdict: ours-correct
  note: >
    Ours is the newer value, not the outlier -- the count scored a
    restratification backwards. Los Bastos is González Riga's own later
    correction of his 2009 describing paper: gonzálezriga2013a states that
    "Malarguesaurus was found in strata assigned to Los Bastos Formation
    (early-middle Coniacian)". bellardini2022a documents the change from
    outside, which rules out a slip. The reference work reproduces the
    superseded 2009 Portezuelo value. gonzálezriga2013a added as the reference
    carrying the value. Flag not acted on: the restratification carries the age
    with it, so a Turonian stage would need to move to Coniacian.

Megalosaurus bucklandii:
  categories: [formation]
  source: benson2010c
  verdict: ours-correct
  note: >
    "Stonesfield Slate" is not a competing formation but the quarrymen's name
    for one or more horizons inside the Taynton Limestone, which benson2010c
    prints in scare quotes for that reason: "One or more discrete horizons
    ('Stonesfield Slate') within the Taynton Limestone Formation (middle
    Bathonian)". The count measures how often a famous informal horizon name is
    used, not disagreement about the formation. Not recorded as a member or
    bed: neither Boneham and Wyatt nor Benson fixes a single horizon, and the
    name has no formal status.

Proceratosaurus bradleyi:
  categories: [formation]
  source: carrano2012a
  verdict: ours-correct
  note: >
    Great Oolite is the group and the White Limestone Formation sits inside it,
    so this is a rank mismatch. carrano2012a gives "Minchinhampton Reservoir,
    Gloucestershire, England; White Limestone Formation, Great Oolite Group;
    middle-late Bathonian", matching our locality exactly. rauhut2010a, the
    redescription, keeps the older coarse usage rather than contradicting a
    formation. The count picks up the historical British habit of calling the
    whole Bathonian limestone succession "the Great Oolite". carrano2012a added
    as the reference carrying the value.

Scelidosaurus harrisonii:
  categories: [formation]
  source: norman2020a
  verdict: ours-correct
  note: >
    Lower Lias is the obsolete name: the Lias Group was formally subdivided by
    the BGS and the Charmouth Mudstone Formation is the current name for that
    interval on this coastline, so the count measures the long tail of
    pre-revision literature. The monograph fixes the member precisely --
    "Charmouth Mudstone Formation (Upper Sinemurian), Black Ven Marl Member,
    Asteroceras obtusum Zone" -- now populated. No bed recorded: norman2020a
    names the nodule beds only through a personal communication and a
    "perhaps".

Kazaklambia convincens:
  categories: [formation]
  source: bell2013a
  verdict: ours-correct
  note: >
    Not moved to Syuksyuk; the tally was a spelling artifact. The literature
    almost never writes "Darbazin" -- it writes the Russian adjectival form,
    usually with the r and b transposed as "Dabrazinskaya", which bell2013a
    uses four times against zero for Darbazin, so a substring search scores the
    describing paper as unsupported when it is the primary source. The Syuksyuk
    side of the count is largely the wrong taxon: godefroit2012a separates them
    in one sentence, giving Jaxartosaurus aralensis "from the Syusyuk Formation
    ... of the Alimtau range (=Kyrk-Kuduk)" and "the juvenile skeleton named
    Procheneosaurus convincens from the Dabrazinskaya Svita ... at the
    Syuk-Syuk Wells site". Since reference works sink P. convincens into
    Jaxartosaurus, a scorer following synonymy pulls the wrong rows in. The
    dispute block on the record stands: ours follows the describing papers, the
    alternative follows a stratigraphic revision, and both units are Santonian
    and adjacent so nothing turns on the choice.

Olorotitan arharensis:
  categories: [formation]
  source: vanitterbeeck2005a
  verdict: ours-correct
  note: >
    Neither alternative is a live reading. "Udurchurkan" is a typo, not a
    transliteration variant: Udurchukan occurs across 17 papers in the
    literature here, while Udurchurkan appears in exactly two files, both from
    one reference work. "Tsagayan Svita" is the superseded name --
    alifanov2010a, on the same Kundur bonebed, writes "the roof of the
    Udurchukan Formation (previously referred to as the Tsagayan Formation or
    Lower Tsagayan Formation)". vanitterbeeck2005a settles it and dissolves the
    apparent conflict with the describing paper: it heads a section "Exposure
    18 (Udurchukan Formation)", places the skeleton "3.25 m below the contact
    with the Bureya Formation", and states that "the dinosaur fossils are
    restricted to the Udurchukan Formation" -- while noting the Udurchukan IS
    the lower part of the Tsagayan Group, so godefroit2003a's "top of the basal
    part of the Tsagayan Formation" is the same statement at group rank. Added
    as the reference; the record previously cited only two works, both of which
    say Tsagayan.

Asylosaurus yalensis:
  categories: [formation]
  source: galton2007a
  verdict: corrected
  note: >
    Changed Magnesian Conglomerate to Durdham Down fissure fill; the erecting
    paper rejects the old value by name. galton2007a gives the deposit as "a
    Triassic (Rheatian [sic]) dolomitized cave breccia or fissure fill (not in
    Magnesian/ Dolomitic Conglomerate ...) in Lower Carboniferous (Dinantian)
    marine limestone", and explains how the name entered circulation: "It was
    long equated with the Magnesian Conglomerate, which occurs very close by."
    The host rock is Carboniferous limestone and the infill is Rhaetian with no
    lithostratigraphic name, so the reference work's "Uncertain" was closer to
    the literature than our named value. The string follows the convention
    already used for the Welsh equivalent at Pant-y-ffynnon. The record's own
    description field already said "Avon Fissure Fill" and "cave fill", so the
    value had been contradicting its own prose.

Chebsaurus algeriensis:
  categories: [formation]
  source: läng2010a
  verdict: ours-correct
  note: >
    Positively sourced rather than merely finer than a blank. The
    redescription, by the erecting author, gives "the Middle Jurassic Aïssa
    formation of the Naama Province, Algeria", and mannion2019a corroborates
    independently. Two cautions recorded rather than acted on: the erecting
    paper mahammed2005a names no formation at all, so a source citation should
    point at läng2010a rather than at it; and läng2010a contradicts itself, its
    abstract naming the Aïssa while its formal Locality and horizon paragraph
    gives only "Detrital continental series of indeterminate Middle Jurassic
    ... and probably Callovian age". A literal search for "Aïssa" in the corpus
    markdown fails -- it renders as a dotless i plus spacing diaeresis.

Euronychodon portucalensis:
  categories: [formation]
  source: kullberg2012z
  verdict: corrected
  note: >
    Changed Unnamed (Taveiro) to Taveiro: the unit is formally named, so the
    hedge was wrong in our favour's direction rather than against it.
    kullberg2012z, the regional lithostratigraphic synthesis, names "the base
    of the Taveiro Formation filling (Reis, 1983)" and lists this taxon among
    its fossils, which is a direct taxon-to-unit link rather than an inference.
    antunes1978z, the stratigraphic study of the type section by the author who
    later erected the taxon, names no formal formation -- only "deposits of
    Taveiro" -- which confirms Reis (1983) as the definer. Not Argilas de
    Aveiro: that is the Aveiro-area unit, and the holotype's TV prefix is the
    Taveiro series.

Kangnasaurus coetzeei:
  categories: [formation]
  source: dewit1992z
  verdict: corrected
  note: >
    Removed Kalahari Deposits; no lithostratigraphic unit exists at this
    locality. The only geological investigation of the site uses the word
    "Formation" nowhere at all, and uses "Kalahari" once, inside a cited
    reference title; it concludes the fossils are "likely to be associated with
    a crater facies deposit above an olivine-melilitite intrusion of Late
    Cretaceous age" -- a debris-flow volcaniclastic breccia and laminated
    mudrock, explicitly not fluvial. rogers1915z, the geological companion to
    the erecting paper, uses "Kalahari" only as a region ("the southern
    Kalahari", "the Kalahari region") and says outright that "the age of the
    bones is not known". haughton1915a names no unit and declines to venture an
    age. Every later use of "Kalahari Deposits" traces to Cooper 1985, which is
    not held -- one node, not five workers.

Pantydraco caducus:
  categories: [formation]
  source: galton2007b
  verdict: ours-correct
  note: >
    The value is not a stand-in for a formation nobody looked up -- it is what
    the literature says, nearly verbatim. The erecting paper gives "A Rhaetian
    (Upper Triassic) or Lower Jurassic fissure fill at the old Pant-y-ffynnon
    Quarry", and spiekman2021a, the newest paper from the quarry, gives
    "Fissure fills of Pant-y-ffynnon Quarry, southern Wales". There is no
    formation to find: the infill is a Rhaetian karst deposit with no
    lithostratigraphic name, and only the HOST rock is a named formation
    (whiteside2016z: the Black Rock Limestone Subgroup or Gully Oolite), which
    is Carboniferous and must not be recorded as the taxon's formation.
    Pendraig milnerae already carries the identical string for the identical
    quarry.

Tarascosaurus salluvicus:
  categories: [formation]
  source: csiki-sava2015a
  verdict: corrected
  note: >
    Removed Fuvelian Beds: "Fuvelian" is a regional continental
    chronostratigraphic stage of Provence, one of four erected by Matheron 1864
    in the series Valdonnian, Fuvelian, Begudian, Rognacian -- a time term, not
    a rock unit, so it filed an age in a lithostratigraphy field. tortosa2014a
    demonstrates the distinction within one paper, giving Arcovenator a
    formation and a local stage side by side while placing this taxon in "the
    Fuvelian local stage" with no formation; jones2026c prints it in scare
    quotes. The horizon is itself an inference: leloeuff1991a records the
    specimen's entire provenance as a label reading "Crétacé supérieur, Lambeau
    du Beausset", collector unknown, and reasons to the Fuvelian from matrix
    lithology alone.

Jingshanosaurus xinwaensis:
  categories: [holotype]
  source: zhang2020a
  verdict: ours-correct
  note: >
    The reference work has printed the FIELD number as the catalogue number.
    zhang2020a gives both in one line: "Holotype. LFGT-ZLJ0113 (field number:
    LV003), a well-preserved skeleton (around 9 m in total length)".
    LFGT-ZLJ0113 occurs seventy times in that paper against one occurrence of
    LV003, which is the parenthetical above. Ours is the catalogue number and
    is correct.

Thanatotheristes degrootorum:
  categories: [holotype]
  source: voris2020a
  verdict: corrected
  note: >
    Changed TMP 2018.016.0001 to TMP 2010.5.7; we had recorded the REFERRED
    specimen as the holotype. voris2020a: "Holotype. TMP 2010.5.7, a partial
    skull from a large subadult individual ... that includes the right maxilla,
    right jugal, right postorbital", which is our material field almost word
    for word. The number we held is a zero-padded rendering of TMP 2018.16.1,
    which that paper introduces two paragraphs later as "Referred specimen. TMP
    2018.16.1, a partial right maxilla from a subadult individual" found at a
    different locality. The holotype number occurs forty-one times in the
    paper; ours occurs nowhere. RTMP is already an alias of TMP, so the prefix
    was never the disagreement. Recorded fully padded as TMP 2010.005.0007, to
    match the YYYY.NNN.NNNN form the other Tyrrell numbers here use; the paper
    writes it TMP 2010.5.7.
