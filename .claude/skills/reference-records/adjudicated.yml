# Tier 1 findings settled against the erecting paper, and therefore suppressed
# from the reconciliation report.
#
# Only close a finding here when a PRIMARY paper has been read and quoted. A
# reference work disagreeing with us is not evidence that we are wrong -- of the
# first 20 series findings triaged, 5 were the reference work conflating the
# holotype with referred material, paratypes or hypodigm.
#
# Keyed by binomial; `categories` lists the finding prefixes to suppress.
# `verdict: ticketed` means the question is real but out of scope for this pass
# and tracked as a GitHub issue, so it should not resurface as a finding.

Aviatyrannis jurassica:
  categories: [holotype]
  source: rauhut2003a
  verdict: ours-correct
  note: >
    "Holotype. IPFUB Gui Th 1, almost complete right ilium." Gui Th 2 and Gui Th 3
    appear under "Referred material" (a fragmentary ilium and a partial right
    ischium), so the reference work's "Gui Th 1 through 3" folds referred
    material into the type.

Deinonychus antirrhopus:
  categories: [holotype]
  source: ostrom1969a
  verdict: ours-correct
  note: >
    "TYPE: YPM 5205, a complete left pes and an incomplete right pes. HYPODIGM:
    YPM 5201, 5202, and 5203 ..." The type is YPM 5205 alone; the reference
    work's "5205, 5203, 5206, 5210" lists the hypodigm.

Kileskus aristotocus:
  categories: [holotype]
  source: averianov2010a
  verdict: ours-correct
  note: >
    "Holotype. ZIN PH 5/117, incomplete right maxilla." A single element; the
    reference work's "5/117 through 12/117" spans the referred material.

Europasaurus holgeri:
  categories: [holotype]
  source: sander2006a
  verdict: ours-correct
  note: >
    "Holotype. DFMMh/FV 291: disarticulated left premaxilla; right maxilla; ...
    of one individual." One catalogue number covering many elements, so the
    reference work's "DFMMh/FV 291 series" is loose phrasing rather than a
    series of numbers.

Trigonosaurus pricei:
  categories: [holotype]
  source: campos2005a
  verdict: ours-correct
  note: >
    "Holotype - incomplete vertebral column ... (MCT 1488-R)". MCT 1719-R is
    explicitly the paratype.

Argyrosaurus superbus:
  categories: [holotype]
  source: mannion2012a
  verdict: ours-correct
  note: >
    "Holotype - MLP 77-V-29-1, a partly articulated left forelimb consisting of
    the humerus, ulna, radius, probably two carpals (now lost), and all five
    metacarpals." One catalogue number, not a series. lydekker1893a states no
    holotype in the modern sense, so this 2012 reappraisal is the fixing source.

Indosuchus raptorius:
  categories: [holotype]
  source: huene1933a
  verdict: ticketed
  issue: 2011
  note: >
    Type fixation unresolved. huene1933a founds the species on three specimens
    with no holotype designated ("Frontals-K 20/350 and K 27/690, and roof of
    skull K 27/685"), i.e. syntypes; Chatterjee (1978) designated the AMNH
    material as lectotype, which dalman2011z argues is invalid since that
    material lacks the diagnostic skull roof; Novas (2009) calls GSI K20/350 the
    holotype. Our record matches none of these. Needs Chatterjee (1978) read
    directly. Note jones2026c transposes the third element as GSI K20/690; the
    primary writes K 27/690.

Monkonosaurus lawulacus:
  categories: [formation]
  source: maidment2006a
  verdict: ours-correct
  note: >
    "Locality and horizon. Upper Jurassic to Lower Cretaceous Loe-ein Formation,
    Lawulashan, Monko, Qamdo District, eastern Tibet (Dong, 1990)." The
    redescription names Loe-ein, so the reference works' "Lura" is not adopted.
    Loe-ein overlies Lura, so the two are not interchangeable and the distinction
    depends on where in the section the type was collected.

Sarcosaurus woodi:
  categories: [formation, stage]
  source: ezcurra2020a
  verdict: ours-correct
  note: >
    "Type locality and horizon: Barrow upon Soar, Leicestershire, England, UK.
    Bucklandi zone of the Scunthorpe Mudstone Formation, Lias Group, Early
    Jurassic (lowermost Sinemurian)." The reference works' "Lower Lias" is the
    superseded name for the interval now divided into the Scunthorpe Mudstone and
    others, and their Hettangian age belongs to the Wilmcote material, which
    ezcurra2020a assigns to the Blue Lias Formation as a referred specimen rather
    than the holotype. Formation, locality and stage were corrected to match.

Animantarx ramaljonesi:
  categories: [stage]
  source: carpenter1999a
  verdict: corrected
  note: >
    Aptian dropped as far too old. carpenter1999a places the taxon in the
    Mussentuchit Member and dates that member "Late Albian or Early Cenomanian
    ... supported by ... a radiometric date of 98.39 +/- 0.07 million years ago".
    chure2010a dates sediments near the member's base at 104.46 +/- 0.95 Ma,
    which is Albian, and the type was collected just above the base. Recorded as
    Albian alone. CAVEAT: the chure2010a date is from Dinosaur National Monument,
    not the San Rafael Swell where Animantarx was found, so applying it is an
    inference across sections. Cenomanian is therefore not impossible, but the
    reference works' bare "Cenomanian" is not adopted.

Siamotyrannus isanensis:
  categories: [stage]
  source: buffetaut1996a
  verdict: corrected
  note: >
    Barremian replaced by Valanginian-Hauterivian. buffetaut1996a states only
    that "the Sao Khua Formation should be considered as ante-Aptian Early
    Cretaceous in age", which Barremian satisfied, so the primary alone does not
    settle it. The narrowing follows Tucker et al. (2022), which dates the
    formation to the Valanginian through Hauterivian, corroborated by jones2026c
    and weishampel2004a. NOTE: Tucker et al. (2022) is NOT in the corpus and has
    no reference entry, so this rests on a source we do not hold; obtain it.

Beipiaosaurus inexpectus:
  categories: [holotype]
  source: xu1999b
  verdict: ours-correct
  note: >
    "Holotype. IVPP V11559 (Institute of Vertebrate Paleontology &
    Paleoanthropology, Beijing, China)." The erecting paper includes the V of
    IVPP's vertebrate series, which both reference works drop.

Alectrosaurus olseni:
  categories: [holotype]
  source: mader1989a
  verdict: corrected
  note: >
    Was AMNH 6368 as holotype; now AMNH 6554 as lectotype. gilmore1933a founded
    the species on two cotypes, and mader1989a redescribes them: "One syntype,
    which includes a virtually complete hind limb, was correctly diagnosed by
    Gilmore as a tyrannosaur and is recognized here as the lectotype of the
    species." The AMNH 6368 forelimb material is excluded from the genus.

Ornithopsis hulkei:
  categories: [holotype]
  source: blows1995a
  verdict: corrected
  note: >
    The R is dropped: hulke1879a writes "No. 28632, Brit. Mus. Catal." and
    blows1995a "BMNH 28632 is the lectotype of Ornithopsis hulkei". Lectotype
    status is retained on blows1995a, which also excludes the Sussex vertebra
    NHMUK 2239 from the syntype series, so material now describes one centrum
    rather than two.

Vulcanodon karibaensis:
  categories: [holotype]
  source: cooper1984a
  verdict: corrected
  note: >
    The NMZ prefix is dropped. cooper1984a: "The type material ... is now housed
    in the National Museum of Zimbabwe, Bulawayo, and bears the catalogue number
    QG24." The institution stays NMZB; the catalogue number itself carries no
    institutional prefix.

Mosaiceratops azumai:
  categories: [holotype]
  source: zheng2015a
  verdict: ours-correct
  note: >
    "Holotype. ZMNH M8856 (housed in the collections of the Zhejiang Museum of
    Natural History, Hangzhou, China)". The reference work's ZHMN transposes the
    museum code.

Rocasaurus muniozi:
  categories: [holotype]
  source: salgado2000a
  verdict: ours-correct
  note: >
    "Holotype. MPCA-Pv 46: a juvenile individual represented by a cervical
    centrum ...". The reference work's MCPA-Pv transposes the museum code.

Shidaisaurus jinae:
  categories: [holotype]
  source: wu2009a
  verdict: ours-correct
  note: >
    "Holotype: Lufeng Dinosaur Museum-Lufeng Chuanjie A'na (LDM-LCA) 9701-IV, a
    partial skeleton". The paper expands the code, so LDM is Lufeng Dinosaur
    Museum and the reference work's DML-LCA is a transposition.

Sektensaurus sanjuanboscoi:
  categories: [holotype]
  source: ibiricu2019a
  verdict: ours-correct
  note: >
    The paper writes UNPSJB-PV throughout, e.g. "an incomplete dorsal centrum
    (UNPSJB-PV 1054/3) in left lateral ... views". The reference work's
    UNPSJB-PB substitutes B for V in the collection code.

Nanningosaurus dashiensis:
  categories: [holotype]
  source: mo2007a
  verdict: ours-correct
  note: >
    "Holotype: NHMG8142, disarticulated partial skeleton including relatively
    complete right and left maxillae ...". The reference work's NMG8142 drops
    the H. A space was inserted after the code to match the other six NHMG
    records; the paper itself writes it closed up.

Shixinggia oblita:
  categories: [holotype]
  source: lu2005a
  verdict: ours-correct
  note: >
    "Holotype: A nearly complete sacrum ... (The specimen is stored in the
    Beijing Natural History Museum: BPV-112)." The reference work's BVP-112
    transposes the collection code. NOTE: BPV is not registered in
    institutions.yaml as a key or alias of BMNHC, so the prefix check passes
    only because it stops at the first token.

Aniksosaurus darwini:
  categories: [holotype]
  source: martinez2006a
  verdict: ours-correct
  note: >
    The holotype is MDT-PV 1/48, an articulated right hindlimb; the remainder of
    the MDT-PV 1 bonebed is referred material. The reference work's bare
    "MTD-PV 1" both transposes the code and cites the whole assemblage.

Astrophocaudia slaughteri:
  categories: [holotype]
  source: demic2013a
  verdict: corrected
  note: >
    "Holotype. SMU 61732 and 203/73655; a tooth (SMU 203/73655), two cervical
    vertebrae, fragments of dorsal vertebrae, 24 caudal vertebrae, approximately
    20 fragmentary dorsal ribs, two chevrons, a distal scapular blade, part of a
    right ilium, and numerous fragments." Both numbers are the holotype; we held
    only 203/73655. SMU 61732 added and material rewritten to match.

Bissektipelta archibaldi:
  categories: [holotype]
  source: kuzmin2020a
  verdict: corrected
  note: >
    The redescription tabulates the holotype as ZIN PH 1/16 alongside the newly
    referred ZIN PH 281/16 and ZIN PH 2329/16. Ours read ZIN PH 1/6.

Callovosaurus leedsi:
  categories: [holotype]
  source: galton1980a
  verdict: ours-correct
  note: >
    "LYDEKKER (1889) described a left femur (Figs. 2, 3A-F, BMNH R1993) from
    Fletton ... as a new species of Camptosaurus, C. leedsi." R1993 is repeated
    throughout for the holotype; the reference work's R1933 transposes it.

Camarasaurus grandis:
  categories: [holotype]
  source: mcintosh1996a
  verdict: ours-correct
  note: >
    YPM 1901 is the holotype, originally assigned to Apatosaurus. GMNH 101 is a
    separate specimen McIntosh describes for its pathologies, and is already
    recorded under notable_specimens.

Camarillasaurus cirugedae:
  categories: [holotype]
  source: sanchez-hernandez2012a
  verdict: corrected
  note: >
    "In detail, the holotype consists of the apical part of a lateral tooth
    (MPG-KPC43), two almost complete sternal plates (MPG-KPC1, 2) ..." The paper
    enumerates 42 catalogue numbers (1-23, 30-39, 43-51); ours held the range
    string MPG-KPC1-46, which is both compressed and wrong at the upper bound.
    Expanded and material rewritten.

Lamplughsaura dharmaramensis:
  categories: [holotype]
  source: kutty2007a
  verdict: corrected
  note: >
    "Holotype, ISI R257, a partial associated postcranial skeleton of a nearly
    adult individual consisting of an almost complete neck ..." The holotype is
    the whole specimen; ours cited only the left scapula, ISI R257/36.

Mamenchisaurus youngi:
  categories: [holotype]
  source: pi1996a
  verdict: ours-correct
  note: >
    "Specimen No ZDM0083 is housed at the Zigong Dinosaur Museum." The reference
    work's ZDM 003 drops a digit.

Moabosaurus utahensis:
  categories: [holotype]
  source: britt2017a
  verdict: ours-correct
  note: >
    "BYU 14387, the holotype of Moabosaurus utahensis, two articulated, and one
    closely associated, anterior dorsal vertebrae." The reference work's BYU 7510
    is the BYU locality number for Dalton Wells Quarry, not a specimen.

Nambalia roychowdhurii:
  categories: [holotype]
  source: novas2010a
  verdict: ours-correct
  note: >
    "Holotype. Part of ISI R273, comprising the following elements found almost
    in articulation: a right ilium (ISI R273/1), left femur (ISI R273/2), and
    distal half of the left tibia and fibula with articulated astragalus and
    calcaneum (ISI R273/3)." The paper explicitly restricts the type to part of
    ISI R273, so our three element numbers are right and the reference work's
    "ISI R273 series" is too broad.

Nullotitan glaciaris:
  categories: [holotype]
  source: novas2019a
  verdict: corrected
  note: >
    "Holotype. MACN-PV 18644 and MPM 21542, the specimen consists of isolated
    cervical centrum (presumably Cv3; MACN-PV 18644) ..." Both numbers are the
    holotype; we held only MACN-PV 18644. Note the same paper separately lists
    MPM 21542 as referred material of an indeterminate titanosaur, which is a
    contradiction internal to the paper.

Paranthodon africanus:
  categories: [holotype]
  source: galton1981a
  verdict: corrected
  note: >
    BMNH 47337 is the holotype of the Permian pareiasaur Anthodon serrarius, not
    of Paranthodon. galton1981a: Broom "transferred the Bushmans River jaw
    fragment (BMNH 47338) from the Permian pareiasaur taxon Anthodon serrarius
    (holotype, BMNH 47337) to the armored dinosaur Palaeoscincus as the type of a
    new species, P. africanus", and the figure caption reads "Paranthodon
    africanus (BROOM), holotype BMNH 47338". A multi-taxon trap: our material
    field already described 47338.

Pulanesaura eocollum:
  categories: [holotype]
  source: mcphee2017a
  verdict: ours-correct
  note: >
    "it should be noted that the correct catalogue number for the holotypic
    anterior dorsal vertebra is BP/1/6982, and not BP/1/6882." The reference work
    reproduces the number the redescription explicitly corrects.

Rajasaurus narmadensis:
  categories: [holotype]
  source: wilson2003a
  verdict: corrected
  note: >
    "Holotype.- GSI Type No. 21141/1-33". Table 1 lists all 33 elements
    individually with no gaps, so the range was expanded to 33 ids and the
    redundant "Type No." dropped.

Rapetosaurus krausei:
  categories: [holotype]
  source: curryrogers2001a
  verdict: ours-correct
  note: >
    "Holotype. Universite d'Antananarivo UA 8698, adult skull ..." FMNH PR 2209
    appears under "Referred specimens", so the reference work folds referred
    material into the type.

Schleitheimia schutzi:
  categories: [holotype]
  source: rauhut2020a
  verdict: ours-correct
  note: >
    The specimen table reads "PIMUZ A/III 550 | Right ilium | Schleitheim;
    excavation Schutz | Schleitheimia schutzi; holotype". No PIMUZ A/III 350
    appears anywhere in the paper.

Xenotarsosaurus bonapartei:
  categories: [holotype]
  source: martinez1986a
  verdict: ours-correct
  note: >
    The type is "U. N. P. S. J. B. - Pv. 184 and U. N. P. S. J. B. - Pv. 612",
    both of which we hold. The reference work's "PVL 612" assigns the second
    number to the wrong institution.

Zizhongosaurus chuanchengensis:
  categories: [holotype]
  source: dong1983a
  verdict: ours-correct
  note: >
    "Specimens: A complete dorsal neural spine, a right humerus, a pubis, and
    several other fragments (V9067.1-3)." We list each element individually; the
    reference work gives the aggregate number. Both describe the same material.

Abditosaurus kuehnei:
  categories: [holotype]
  source: vila2022a
  verdict: corrected
  note: >
    The supplementary material lists the holotype element by element under
    "Present study". Ours held a blind contiguous range MCD 6718-6751, which
    included seven numbers the paper never assigns to the type (6726, 6727, 6737,
    6739, 6740, 6741, 6743) and omitted eight MCD numbers plus five MNCN ones.
    Replaced with the paper's actual 40 numbers. The reference work's "Various
    MNCN and MCD specimens" was, unusually, closer to right than we were.

Albertavenator curriei:
  categories: [holotype]
  source: evans2017a
  verdict: ours-correct
  note: >
    "The most complete specimen, TMP 1993.105.0001, is notably foreshortened and
    robust". The reference work's RTMP 93.105.1 uses the superseded prefix and
    the unpadded form of the same number.

Boreonykus certekorum:
  categories: [holotype]
  source: bell2015a
  verdict: ours-correct
  note: >
    "an isolated frontal (TMP 1989.055.0047)". As with Albertavenator, the
    reference work uses the superseded RTMP prefix and unpadded digits.

Gonkoken nanoi:
  categories: [holotype]
  source: alarcon-munoz2023a
  verdict: ours-correct
  note: >
    "Holotype - CPAP 3054, right ilium". The reference work's CPAP 2054 differs
    by a digit.

Goyocephale lattimorei:
  categories: [holotype]
  source: perle1982a
  verdict: ours-correct
  note: >
    "Holotype: GI SPS 100/1501, disarticulated skeleton including complete skull
    roof". The reference work drops the leading 1 of 1501.

Hualianceratops wucaiwanensis:
  categories: [holotype]
  source: han2015a
  verdict: ours-correct
  note: >
    "Holotype. IVPP V18641, articulated right maxilla, jugal, postorbital and
    partial squamosal". The reference work's V18541 differs by a digit.

Lourinhasaurus alenquerensis:
  categories: [holotype]
  source: mocho2014a
  verdict: corrected
  note: >
    "Lectotype: Partial skeleton (Fig. 2D) housed in MG LNEG composed by:
    cervical vertebrae remains (MG4956, MG30373, MG30377, and MG30379) ...". The
    lectotype is 30 catalogue numbers, of which we held one. Expanded, and the
    prefix follows the paper's MG rather than our MIGM alias.

Masiakasaurus knopfleri:
  categories: [holotype]
  source: sampson2001a
  verdict: ours-correct
  note: >
    "Holotype. Universite d'Antananarivo (UA) 8680, well-preserved right dentary
    with several teeth." FMNH PR 2481 falls under "Referred specimens", so the
    reference work again folds referred material into the type.

Narindasaurus thevenini:
  categories: [holotype]
  source: royo-torres2020a
  verdict: ours-correct
  note: >
    The holotype is restricted to MNHN MAJ 423-430, all eight of which we hold.
    The reference work's "MNHN MAJ 400-series" is far too broad.

Pukyongosaurus millenniumi:
  categories: [holotype]
  source: dong2001a
  verdict: ours-correct
  note: >
    "Type ... (Specimen numbers: PKNU-G.102~109) from the same quarry." All eight
    are held; the reference work's PKNUG-G transposes the institution code.

Rahiolisaurus gujaratensis:
  categories: [holotype]
  source: novas2010b
  verdict: corrected
  note: >
    "Holotype ISIR 550 (a right ilium), ISIR 554 (a right pubis), and ISIR 557 (a
    right femur) that were found in association." We held only ISIR 557, although
    our material field already described all three elements.

Riojavenatrix lacustris:
  categories: [holotype]
  source: isasmendi2024a
  verdict: corrected
  note: >
    "Holotype: A partial skeleton of a single individual, including: CPI 1637,
    left femur; CPI 1638, left tibia and astragalus; CPI 1639A-B, left fibula
    ... CPI 1677, fragment of a dorsal neural arch." Fifteen catalogue numbers,
    three of which are split into A and B parts, recorded here as 18 individual
    ids. We held only CPI 1637. The reference work's range was also wrong.

Siamraptor suwati:
  categories: [holotype]
  source: chokchaloemwong2019a
  verdict: ours-correct
  note: >
    NRRU-F01020008 is the holotype element; the reference work's
    "NRRU-F01020001 through 22" spans the whole recovered assemblage.

Tiamat valdecii:
  categories: [holotype]
  source: pereira2024a
  verdict: corrected
  note: >
    "Holotype: UFRJ-DG 636-R, UFRJ-DG 638-R, UFRJ-DG 606-R (anterior caudal
    vertebrae), UFRJ-DG 635-R, UFRJ-DG 591-R, UFRJ-DG 527-R, UFRJ-DG 704-R
    (middle caudal vertebrae), and UFRJ-DG 574-R (partial neural arch)." Ours
    carried UFRJ-DG 625-R, which appears nowhere in the paper, and UFRJ-DG 368-R,
    which appears once against six occurrences of 636-R and is very likely the
    paper's own transposition. Both removed and 635-R added.

Uberabatitan ribeiroi:
  categories: [holotype]
  source: salgado2008a
  verdict: corrected
  note: >
    "Holotype. Specimen A (CPP-UrHo): CPP-1058-UrHo, 1057-UrHo, 914-UrHo ...".
    The paper explains that each bone kept its own catalogue number and the UrHo
    acronym was appended to mark the holotype individual, so the type is 39
    numbers rather than the single CPPLIP-912 we held. The reference work's bare
    "CPP-UrHo" is the individual's acronym, not a catalogue number.

Vectiraptor greeni:
  categories: [holotype]
  source: longrich2022a
  verdict: corrected
  note: >
    "Holotype. IWCMS 2021.31.1-3; IWCMS 2021.31.2, anterior dorsal vertebra,
    IWCMS 2021.31.1, posterior dorsal vertebra, and IWCMS 2021.31.3 partial
    sacrum." Range expanded to three ids, and material corrected: it had recorded
    two dorsal vertebrae and omitted the sacrum.

Aegyptosaurus baharijensis:
  categories: [holotype]
  source: stromer1932a
  verdict: ours-correct
  note: >
    "The type is the skeletal remains described above of an individual (Munich
    No. 1912 VIII 61)." The reference work's 1912VIII161 inserts a digit.

Centrosaurus apertus:
  categories: [holotype]
  source: ryan2005a
  verdict: ours-correct
  note: >
    The emended diagnosis gives "TYPE SPECIMEN: NMC 971: a complete parietal."
    lambe1905a predates the catalogue number. The reference work's AMNH 3999 is a
    different specimen entirely.

Kinnareemimus khonkaenensis:
  categories: [holotype]
  source: buffetaut2009a
  verdict: ours-correct
  note: >
    "Holotype. An incomplete left third metatarsal, with the distal end and part
    of the shaft (PW5A-100)." The reference work's "SM-PW5A-100 through 131"
    spans the whole assemblage.

Magnamanus soriaensis:
  categories: [holotype]
  source: fuentesvidarte2016a
  verdict: corrected
  note: >
    "The fossils collected were inventoried according to the numbering provided
    by the Museo Numantino de Soria, MNS, with the following catalog numbers:
    2000/132, 2001/122, 2002/95, 2003/69 and 2004/54." Ours held MNS 200/132, a
    typo of 2000/132. specimen_type stays holotype: the paper carries a Holotype
    heading and states the material "belongs to a single adult individual", so a
    holotype was designated - it simply never received one catalog number. The
    ids are the subset the paper ties to a named holotype element. The five lot
    numbers are deliberately NOT recorded as ids, because lot 2001/122 also
    holds the Soriatitan golmayensis holotype from the same quarry.

Pelorosaurus brevis:
  categories: [holotype]
  source: taylor2007a
  verdict: ours-correct
  note: >
    "Four proximal caudal vertebrae (BMNH R2544-2547) and three chevrons (BMNH
    R2548-2550) from the Hastings Beds Group of Cuckfield ... were named
    Cetiosaurus brevis Owen, 1842", and Pelorosaurus conybeari is an objective
    synonym of 'C.' brevis. The reference work's NHMUK 28626 is the Mantell
    humerus, not the type series.

Plateosaurus engelhardti:
  categories: [holotype]
  source: moser2003a
  verdict: ours-correct
  note: >
    "In previous taxonomic discussions the sacrum (UEN 552) received the highest
    attention and is therefore fixed in this work as the lectotype of Plateosaurus
    engelhardti MEYER, 1837." meyer1837a fixes no type.

Pleurocoelus nanus:
  categories: [holotype]
  source: demic2013b
  verdict: ours-correct
  note: >
    "the type series of P. nanus consists of a cervical (USNM 5678), a dorsal
    (USNM 4968), a sacral (USNM 4969) and a caudal (USNM 4970) vertebral
    centrum". All four held; the reference work's USNM 2263 is not among them.

Rhoetosaurus brownei:
  categories: [holotype]
  source: nair2012a
  verdict: corrected
  note: >
    "The syntype series (described in Longman, 1926) plus referred specimens
    ... are all assigned to QM F1659." Ours read QM F1695, a transposition.
    One registration number covers both the syntype series and the referred
    material. Recorded as specimen_type: syntype since #2017 relaxed the
    two-id rule for a series registered under one number, which the record's
    notes field explains.

Sinosaurus triassicus:
  categories: [holotype]
  source: young1948a
