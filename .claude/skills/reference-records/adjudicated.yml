  - categories: [formation]
    source: galton2007a
    verdict: corrected
    note: >
      Changed Magnesian Conglomerate to Durdham Down fissure fill, on the same
      evidence as Asylosaurus yalensis and in the same commit -- the two are from
      one deposit, and galton2007a gives Asylosaurus the horizon "as for types of
      Thecodontosaurus antiquus". The erecting-era name is rejected by that paper
      by name: the deposit is "a Triassic (Rheatian [sic]) dolomitized cave
      breccia or fissure fill (not in Magnesian/ Dolomitic Conglomerate ...) in
      Lower Carboniferous (Dinantian) marine limestone". foffa2014z corroborates,
      placing the Durdham Down material in karstic "fissures and cave systems
      developed in the uplifted and steeply dipping Carboniferous limestones",
      and notes the exact 1830s quarry cannot now be identified -- which is why
      the looser locality-level string is preferred over a quarry-exact one.
