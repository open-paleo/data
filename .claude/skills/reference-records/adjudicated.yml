Conchoraptor gracilis:
  - categories: [holotype]
    source: funston2018a
    verdict: ours-correct
    note: >
      "Holotype MPC-D 100/20; nearly complete skull, partial mandible, and hand".
      jones2026c's IGM is the superseded institution code, which the
      redescription does not use.
  - categories: [stage]
    source: corpus-paper-count
    verdict: ours-correct
    note: >
      Unit-level decision for the Baruungoyot Formation, applied to every taxon in
      it. Counted across the reference literature, 22 papers give the formation a
      Campanian age alone -- commonly "mid-upper Campanian" or "middle-upper
      Campanian" -- and 12 allow Campanian-Maastrichtian, while NO paper gives it
      as Maastrichtian alone. The reference work's Maastrichtian therefore has no
      independent support, and ours is both the majority position and contained
      within the wider one.
  
      Deliberately NOT widened to Campanian-Maastrichtian. Widening is the right
      move when two positions each have literature behind them, as with the
      Shaximiao redating; here it would adopt a 17.6 Myr span that no paper
      asserts, to accommodate a single unsupported source.
  - categories: [formation]
    source: funston2018a
    verdict: ours-correct
    note: >
      funston2018a: "Holotype: MPC-D 100/20 ... Baruungoyot Formation, Hermiin
      Tsav, Mongolia". "Red Beds of Hermiin Tsav" is an informal locality name
      for that same type locality, not a rival formation, and "Barun Goyot" is an
      established spelling variant.
