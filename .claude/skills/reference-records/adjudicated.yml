      rival value by name: "[they] have referred to these strata variously as the
      Iatan Member or more recently as the Colorado City Member of the Dockum.
      However, our mapping shows that these strata are actually within the upper
      part of the Cooper Canyon Formation", with "Otis Chalk ... located in the
      Cooper Canyon Formation". The apparent support for Colorado City is not
      independent -- marsh2019a, hunt1998a and baron2018c all descend from Lucas
      and Anderson (1993), who inferred the unit from the perceived primitiveness
      of the fauna, which is circular for dating purposes. Martz (2008) and
      Stocker (2013a) also place Otis Chalk in the Cooper Canyon, differing only
      on the position within it. The erecting paper deliberately named no
      formation, so Dockum Group remains the uncontested fallback if the repo
      prefers not to take sides.
