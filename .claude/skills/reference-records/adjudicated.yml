  - categories: [formation]
    source: clements1993z
    verdict: corrected
    note: >
      Changed Durlston to Lulworth with member Cherty Freshwater. norman2012a
      gives the formation as Durlston but the horizon as the "Cherty freshwater
      beds", and clements1993z Table 1 shows those two statements are mutually
      exclusive: the Cherty Freshwater Member is the topmost member of the
      Lulworth Formation, the Cinder Member the basal member of the Durlston
      Formation. The bed-level datum is the more specific claim. galton2009a,
      which erected the genus, contradicts itself -- Lulworth on p. 92, Durlston
      on p. 444 -- and naish2008a, paul2008a and mcdonald2012b all give Lulworth.
      NHMUK R2998 and the Echinodon material came out of the same Beckles
      workings at Durlston Bay, so holding them in different formations could not
      have been right whichever way the boundary fell.
