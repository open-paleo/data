    note: >
      The name-bearing type is the neotype AMNH 7224, fixed under plenary power
      by iczn1996a Opinion 1842, so the type horizon is the Whitaker Quarry
      horizon at Ghost Ranch. rinehart2009a, the Whitaker Quarry monograph,
      places it: "The Whitaker quarry lies near the center of the Upper Triassic
      Rock Point Formation of the Chinle Group". The "Chinle Formation" answer is
      a rank difference -- Chinle is a Group and Rock Point a Formation to
      rinehart2009a, while hunt1991a writes "the Rock Point Member of the Chinle
      Formation" -- so ours is the finer value either way. Do not revert toward
      the Petrified Forest Formation: that is where Cope's 1881 Baldwin material
      came from, and the neotype designation is what moved the name to Rock
      Point.
