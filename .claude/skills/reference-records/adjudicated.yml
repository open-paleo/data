    BYU 9025, described as a right scapulocoracoid; Curtice et al. (2001)
    identify BYU 9025 as the left, meaning Jensen mis-stated either the number
    or the side. lovelace2008a names BYU 12962 as the holotype in prose while
    using BYU 9025 in its own tables and figures. We follow the erecting paper
    and record the conflict in the record's notes.

Tyrannosaurus rex:
