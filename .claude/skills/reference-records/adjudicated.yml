      from the "top of Anacleto Formation, early Campanian". Bajo de la Carpa is
      downstream of the old undivided Río Colorado Formation -- when that was
      split, the material went to Anacleto above rather than Bajo de la Carpa
      below -- and martinelli2004a cites powell1992a for it, which actually wrote
      Río Colorado. The "Lecho" half of the reference works' value is a cross-row
