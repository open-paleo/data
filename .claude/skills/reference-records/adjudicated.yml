# Tier 1 findings settled against the erecting paper, and therefore suppressed
# from the reconciliation report.
#
# Only close a finding here when a PRIMARY paper has been read and quoted. A
# reference work disagreeing with us is not evidence that we are wrong -- of the
# first 20 series findings triaged, 5 were the reference work conflating the
# holotype with referred material, paratypes or hypodigm.
#
# Keyed by binomial; `categories` lists the finding prefixes to suppress.
# `verdict: ticketed` means the question is real but out of scope for this pass
# and tracked as a GitHub issue, so it should not resurface as a finding.
#
# The quotation and the reasoning live in research/, not here. Each block's
# `research:` is the path of the research note that holds them: the record's
# value and its primary source under Evidence, and the reference work's reading
# under Ruled out. Write that entry first (research/README.md gives the form),
# then add the block. loadAdjudicated aborts on a path that does not exist. A
# block that still carries a `note:` is one whose conclusion disagrees with the
# record as it stands now, and is waiting for that to be decided.
#
# An entry may also be a LIST of blocks when one binomial needs adjudications
# resting on different papers -- a holotype closed against its erecting paper
# and a formation closed against the stratigraphic literature do not share a
# source or a research entry. Never write a second top-level block under the
# same key: YAML keeps the last and discards the first without saying so.

