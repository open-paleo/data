      C. brinkmani comes from. jones2026a was right.


Kinnareemimus khonkaenensis:
  - categories: [holotype]
    source: buffetaut2009a
    verdict: ours-correct
    note: >
      "Holotype. An incomplete left third metatarsal, with the distal end and part
      of the shaft (PW5A-100)." The reference work's "SM-PW5A-100 through 131"
      spans the whole assemblage.
  - categories: [stage]
    source: tucker2022z
    verdict: corrected
    note: >
      Corrected from Barremian to Valanginian-Hauterivian, with the whole Sao Khua
      Formation. tucker2022z is the first radiometric work on the unit and
      concludes a Valanginian-early Hauterivian age of 133.6-132.1 Ma; the recent
      literature has followed it. The Barremian it replaces is a citation cascade
      of sixteen papers resting on one source, tumpeesuwan2010z, whose own chain --
      a new bivalve species, to its only congener in Korea and Japan, to the
      Sebayashi faunal association -- does not support the "restricted to late
      Barremian" it is cited for.
  
      TWO CAVEATS, recorded rather than smoothed over. First, the date is a MAXIMUM
      depositional age, a one-sided bound: it excludes anything OLDER than ~133.8
      Ma and does not by itself exclude a Barremian Sao Khua, which requires
      accepting minimal lag between crystallisation and deposition. The paper's own
      wording inverts the usual sense of an MDA in places. Second, the samples come
      from the middle and upper formation, not from Phu Wiang or Nong Bua Lamphu,
      so no taxon here has a horizon-specific date. from_ma is therefore set to the
      hard bound of 133.8 rather than to the paper's preferred 133.6, and to_ma to
      the base of the Barremian, so the record states the stage assignment without
      inheriting the minimal-lag precision.


Magnamanus soriaensis:
  categories: [holotype]
  source: fuentesvidarte2016a
  verdict: corrected
  note: >
    "The fossils collected were inventoried according to the numbering provided
    by the Museo Numantino de Soria, MNS, with the following catalog numbers:
    2000/132, 2001/122, 2002/95, 2003/69 and 2004/54." Ours held MNS 200/132, a
    typo of 2000/132. specimen_type stays holotype: the paper carries a Holotype
    heading and states the material "belongs to a single adult individual", so a
    holotype was designated - it simply never received one catalog number. The
    ids are the subset the paper ties to a named holotype element. The five lot
    numbers are deliberately NOT recorded as ids, because lot 2001/122 also
    holds the Soriatitan golmayensis holotype from the same quarry.

Pelorosaurus brevis:
  - categories: [holotype]
    source: taylor2007a
    verdict: ours-correct
    note: >
      "Four proximal caudal vertebrae (BMNH R2544-2547) and three chevrons (BMNH
      R2548-2550) from the Hastings Beds Group of Cuckfield ... were named
      Cetiosaurus brevis Owen, 1842", and Pelorosaurus conybeari is an objective
      synonym of 'C.' brevis. The reference work's NHMUK 28626 is the Mantell
      humerus, not the type series.
  - categories: [formation]
    source: norman2013a
    verdict: corrected
    note: >
      Changed Tunbridge Wells Sand to Grinstead Clay, member Cuckfield Stone --
      the one entry in this pass where the reference work out-resolves us.
      norman2013a: the Whiteman's Green (Cuckfield) quarries "exposed Hastings
      Group Beds of the Grinstead Clay Formation ... upper-middle Valanginian",
      with the Cuckfield Stone Member named within it; blows1995a, naish2008a and
      raven2020a agree. Rank is unsettled between authors (norman2010a calls it a
      Member of the Tunbridge Wells Sand Fm), so our old value was coarser rather
      than false. Our Hylaeosaurus entry already carried Grinstead Clay from the
      same quarries.
Plateosaurus engelhardti:
  - categories: [holotype]
    source: moser2003a
    verdict: ours-correct
    note: >
      "In previous taxonomic discussions the sacrum (UEN 552) received the highest
      attention and is therefore fixed in this work as the lectotype of Plateosaurus
      engelhardti MEYER, 1837." meyer1837a fixes no type.
  - categories: [formation]
    source: litholex
    verdict: corrected
    note: >
      Corrected: the formation read Klettgau against a Heroldsberg, Bavaria
      lectotype whose own locality string says Feuerletten. LithoLex record
      5000008 lists Feuerletten among the "Synonyme und obsolete Einheiten" of the
      Trossingen-Formation, and a search returns no Klettgau-Formation in the
      German lexicon at all -- Klettgau is a Swiss unit, presumably carried over
      from the Frick material. weishampel2004a's "Feuerletten Formation" was right
      about the unit and obsolete only in its name; ours now reads Trossingen.


Pleurocoelus nanus:
  categories: [holotype]
  source: demic2013b
  verdict: ours-correct
  note: >
    "the type series of P. nanus consists of a cervical (USNM 5678), a dorsal
    (USNM 4968), a sacral (USNM 4969) and a caudal (USNM 4970) vertebral
