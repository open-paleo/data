  - categories: [stage]
    source: wang2018z
    verdict: ours-correct
    note: >
      Upper-member taxon, so the Shaximiao redating does not reach it: ours and
      the reference work both place Daanosaurus in the Late Jurassic and differ
      only over which stage. wang2018z bounds the LOWER member at a maximum
      depositional age of 159 +/- 2 Ma, which constrains what lies beneath this
      horizon rather than the horizon itself. Left as ours until a source dates
      the upper member directly.
  
      The lower-member records took the opposite treatment: rather than being
      held, their ranges were widened to Bajocian-Oxfordian, the span that stays
      true under both the traditional Middle Jurassic reading and wang2018z's
      Late Jurassic one. That follows the same rule the project uses for
      contested placement -- sit at the position agreed across all hypotheses --
      and it resolved ten stage findings outright instead of suppressing them.

