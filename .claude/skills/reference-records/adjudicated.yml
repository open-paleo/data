  - categories: [formation]
    source: dai2022a
    verdict: ours-correct
    note: >
      Unit-level decision applied to every Shaximiao taxon, not a per-genus
      reading. Current usage treats Shaximiao as one formation carrying lower and
      upper members: dai2022a is titled "New stegosaurs from the Middle Jurassic
      Lower Member of the Shaximiao Formation", moore2020a writes of "beds of the
      lower Shaximiao Formation" placing "the entirety of the Shaximiao Formation"
      within the Late Jurassic, and the Sichuan Basin petroleum literature numbers
      members inside one Shaximiao Formation. Xiashaximiao and Shangshaximiao as
      coordinate formations is the older Chinese scheme, which xing2015a
      reproduces from Peng et al. (2005) and which the reference work follows. The
      member distinction is real and worth recording, but as a rank rather than as
      a formation name (#2012).


