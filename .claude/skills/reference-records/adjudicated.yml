  verdict: ours-correct
  note: >
    "Holotype MPEF-PV ... 3400." MPEF-PV 3399 is explicitly a paratype.

Ruyangosaurus giganteus:
  categories: [holotype]
  source: lu2009a
  verdict: corrected
  issue: 2018
  note: >
    lu2009a prints 41HIII-0002, which collided with the holotype of
    Zhongyuansaurus luoyangensis (xu2007a) - a sauropod and an ankylosaur under
    one number. Resolved from the specimen itself: a photograph of the holotype
    material shows the inscribed number ending in 3, so Ruyangosaurus is HGM
    41HIII-0003 and the published 0002 is a typographical error, carried into
    lacovara2014a and sethapanichsakul2026a. Zhongyuansaurus keeps 41HIII-0002.
    The sensu labels used as a stopgap are removed.

Segnosaurus galbinensis:
  categories: [holotype]
  source: perle1979a
  verdict: ours-correct
  note: >
