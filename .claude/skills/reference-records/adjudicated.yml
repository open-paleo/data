Carcharodontosaurus saharicus:
  categories: [holotype, occurrence]
  source: brusatte2007a
  verdict: ours-correct
  note: >
    SGM-Din 1 is the neotype designated by brusatte2007a after the Stromer
    holotype was destroyed. Recorded as specimen_type neotype.
    Separately, jones2026c's occurrence "Echkar Fm., Niger" belongs to
    C. iguidensis, not to the type species, whose neotype comes from the Kem Kem
