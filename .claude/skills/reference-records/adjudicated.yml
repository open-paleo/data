      which bonaparte1999a cites and then rejects.

Muttaburrasaurus langdoni:
  - categories: [stage]
    source: herne2026a
    verdict: corrected
    note: >
      Widened to an Albian-Cenomanian straddle. herne2026a is the only work to
      date the locality -- a detrital-zircon MLA of 96.3 +/- 8.6 Ma at QML1817,
      with the formal horizon given as "Mackunda Formation, Cenomanian-lower
      Turonian" -- but the error on that date spans both stages, so Cenomanian
      alone would record as settled something that is not.

Janenschia robusta:
  - categories: [stage]
