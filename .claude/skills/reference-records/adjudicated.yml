Shuangmiaosaurus gilmorei:
  - categories: [stage]
    source: jiang2006z
    verdict: corrected
    note: >
      Widened to Albian-Cenomanian, which is genuinely unresolved and leans
      Cenomanian. jiang2006z's late Albian for the Sunjiawan Formation is
      explicitly tentative and its own K-Ar data permit a Turonian age. Recording
      a single stage would assert a precision the literature does not have.

Scansoriopteryx heilmanni:
  - categories: [stage]
    source: xu2016z
    verdict: corrected
    note: >
      Corrected to Bathonian-Callovian on the Haifanggou, matching Epidexipteryx
      hui and Pedopenna daohugouensis from the same locality. Our original
      Barremian/Aptian Yixian age rested only on czerkas2002a, the erecting
      paper, asserting it for a commercially acquired specimen.

      An intermediate correction to Oxfordian/Tiaojishan was applied and is
      superseded. It rested on a tally of papers giving "Tiaojishan --
      Oxfordian", which turns out to measure the LINGLONGTA phase, a different
      and younger horizon. xu2016z, by a co-author of both scansoriopterygid
      erecting papers, separates the two -- "the Bathonian-Callovian Daohugou
      phase (about 168-164 million years ago) and the Oxfordian Linglongta phase
      (164-159 million years ago)" -- and places Daohugou in the Haifanggou.
      Every corpus paper naming Scansoriopteryx also names Daohugou; none names
      Linglongta.

      Region, locality and coordinates moved with the formation: the record
      previously sat in Liaoning at the Yixian coordinates, which contradicts a
      Daohugou provenance in Ningcheng, Inner Mongolia. Scansoriopteryx and
      Epidendrosaurus are very probably the same animal, so they cannot carry
      different horizons. See also #2006.
  - categories: [formation]
    source: xu2016z
    verdict: corrected
    note: >
      Yixian -> Haifanggou, via a superseded intermediate of Tiaojishan; see the
      stage note. sullivan2014z holds the Jiulongshan-versus-Tiaojishan question
      for the Daohugou Beds to be unresolved on current data while favouring
      Jiulongshan/Haifanggou, so this is the better-supported reading rather
      than a settled one.


