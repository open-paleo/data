Ohmdenosaurus liasicus:
  - categories: [formation]
    source: litholex
    verdict: ours-correct
    note: >
      LithoLex record 4012098, Posidonienschiefer-Formation, valid, F. A. Roemer
      1836, Untertoarcium. Its synonymy is a list of historical German names and
      does NOT include Sachrang, which is an Alpine unit rather than another name
      for this one, so jones2026b names a different formation. weishampel2004a's
      "Posidonienschiefer" is the same unit as ours under its German name;
      "Posidonia Shale" is the form English-language papers print, which is what
      CONTRIBUTING.md's naming rule asks for.

Emausaurus ernsti:
  - categories: [formation]
    source: litholex
    verdict: ours-correct
    note: >
      Rank, not identity. "Lehmhagen Member" returns nothing in LithoLex, while
      Ciechocinek-Formation (record 4012021) is valid, Untertoarcium, and covers
      Mecklenburg-Vorpommern, where the Grimmen clay pit lies; its synonymy even
      reads "Aequivalente des Posidonienschiefers, unterer Teil". So Lehmhagen is
      an informal member of the formation jones2026a names, and ours is the finer
      value -- the same shape as Hongtuya within the Wangshi Group. Expressing
      both needs the rank field under discussion in #2012.

Tuebingosaurus maierfritzorum:
  - categories: [formation]
    source: fernández2022a
    verdict: corrected
    note: >
      Corrected: the erecting paper is titled "A new massopodan sauropodomorph
      from Trossingen Formation (Germany) hidden as 'Plateosaurus' for 100 years
      in the historical Tuebingen collection", and sues2025a gives "Type horizon.
      'Untere Saurierschicht,' Trossingen Formation, Middle Keuper Subgroup. Age:
      Late Triassic (Norian: Sevatian)". Ours read Loewenstein, the formation
      directly beneath. jones2026b was right.

Stegoceras validum:
  - categories: [formation]
    source: schott2016a
    verdict: ours-correct
    note: >
      schott2016a places it in the same formation we do: "Although F. brevis and
      St. validum co-occur within the Dinosaur Park Formation of southern
      Alberta, presumably within the same palaeoenvironment...". The paper's
      subject taxon is likewise "from the Upper Campanian Dinosaur Park Formation
      (Belly River Group) of Alberta". weishampel2004a's Oldman Formation is the
      underlying unit; jones2026a already agreed with us.

Gravitholus albertae:
  - categories: [formation]
    source: ryan2005z
    verdict: ours-correct
    note: >
      ryan2005z, the ornithischian chapter of the Dinosaur Provincial Park
      volume, is explicit about the holotype dome TMP 72.27.01: "The specimen was
      collected from the Oldman Formation near the Park (Sullivan 2003)." Both
      reference works give Dinosaur Park, which is the overlying unit. Note the
      same passage questions the taxon itself -- "Recent studies have questioned
      its validity suggesting that G. albertae is probably referable to Stegoceras
      (Williamson and Carr 2002), or is not diagnostic (Sullivan 2003)" -- which
      is a separate question from its horizon and is not settled here.

Rativates evadens:
  - categories: [formation]
    source: mcfeeters2016a
    verdict: corrected
    note: >
      Corrected against the erecting paper, which was in hand all along:
      mcfeeters2016a is titled "A new ornithomimid theropod from the Dinosaur Park
      Formation of Alberta, Canada" and its abstract gives the holotype as "ROM
      1790, from the lower Dinosaur Park Formation (upper Campanian) of Alberta".
      Ours read Oldman. jones2026c was right.

Breviceratops kozlowskii:
  - categories: [stage]
    source: corpus-paper-count
    verdict: ours-correct
    note: >
      Unit-level decision for the Baruungoyot Formation, applied to every taxon in
      it. Counted across the reference literature, 22 papers give the formation a
      Campanian age alone -- commonly "mid-upper Campanian" or "middle-upper
      Campanian" -- and 12 allow Campanian-Maastrichtian, while NO paper gives it
      as Maastrichtian alone. The reference work's Maastrichtian therefore has no
      independent support, and ours is both the majority position and contained
      within the wider one.
  
      Deliberately NOT widened to Campanian-Maastrichtian. Widening is the right
      move when two positions each have literature behind them, as with the
      Shaximiao redating; here it would adopt a 17.6 Myr span that no paper
      asserts, to accommodate a single unsupported source.

