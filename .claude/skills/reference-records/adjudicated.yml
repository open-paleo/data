Chubutisaurus insignis:
  - categories: [holotype]
    source: salgado1993a
    verdict: corrected
    note: >
      Neither suffix is supported: the redescription gives plain MACN 18222. Ours
      read MACN 18222/30, molina-perez2020a MACN 18222 S. delcorro1975a is not
