Sinoceratops zhuchengensis:
  - categories: [formation]
    source: an2015z
    verdict: ours-correct
    note: >
      an2015z, which dated these bone beds, names the taxa directly: "Many
      dinosaur fossils, only found in the uppermost Upper Cretaceous strata, such
      as Sinoceratops zhuchengensis, Zhuchengtyrannus magnus, Tsintaosaurus
      spinorhinus, Tanius chinkankouenssi, and Tanius laiyangensis, have been
      reported in recent years from the Hongtuya Formation". The paper's whole
      subject is "the dinosaur bone beds of the Hongtuya Formation in the Zhucheng
      Basin", dated between 77.3 and 73.5 Ma and so Campanian, which also
      corroborates our stage. The reference work's Xingezhuang Fm. is the
      underlying formation of the same group.

