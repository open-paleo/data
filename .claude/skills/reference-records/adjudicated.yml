    verdict: corrected
    note: >
      Narrowed from a four-stage envelope to Coniacian. wang2013z's correlation
      table sets out the history explicitly: Xu et al. (2000) placed the beds in
      the Sangping Formation at Albian; this paper places them in the Xiaguan
      Formation at Coniacian. Our Turonian-Campanian range was the formation
      envelope rather than the taxon's horizon, and xing2014a is the only source
      resolving its own bed, in the lower Xiaguan. The reference work's Albian
      descends from xu2000a, which inferred it phylogenetically -- "the systematic
      position of Nanyangosaurus suggests that the Sangping Formation MAY
      represent Albian deposits" -- not stratigraphically.
