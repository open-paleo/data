    verdict: corrected
    note: >
      Corrected to Aalenian, which is NEITHER our Toarcian nor the reference works' Bathonian/Callovian. Mid to upper Canadon Asfalto.

Volkheimeria chubutensis:
  - categories: [stage]
    source: corpus-review
    verdict: corrected
    note: >
      Corrected to Aalenian, on the same Canadon Asfalto horizon as Piatnitzkysaurus floresi.
  - categories: [formation]
    source: pol2022a
    verdict: ours-correct
    note: >
      A typo, not a stratigraphic claim. "Cañodon Asfalto" appears in
      mcintosh1990a's occurrence table in the first edition of The Dinosauria and
      was carried into the second as weishampel2004a -- the same misspelling in
      the same table cell, not an independent assertion. Every technical source
      spells it correctly: pol2022a "Volkheimeria chubutensis was found in the
      Cañadón Asfalto Formation", and holwerda2018a, rincón2022a and rauhut2009z
      likewise. The erecting paper bonaparte1979a names no formation at all.
      Member left empty: cúneo2013z records a Las Chacritas member and the
      sauropod beds are in the lower lacustrine part, but no source assigns this
      taxon to a named member, and rauhut2005b uses Las Chacritas as a locality.
Falcarius utahensis:
  - categories: [stage]
    source: joeckel2019z
    verdict: corrected
    note: >
      Corrected to Barremian. This reverses the first-pass reading: joeckel2019z
      accepts the Aptian dates kirkland2016z rejects and finds the Yellow Cat
      Member DIACHRONOUS, its "stratigraphic architecture ... probably more
      complex than earlier conceptions based on lithostratigraphic perspectives".
      Crystal Geyser sits outside the dated belt, so the member-level framework
      below does not reach it.

      Cedar Mountain ages are decided by position relative to Aubrey's (1998)
      marker calcrete, which separates the lower from the upper Yellow Cat Member.
      joeckel2023z dates a tephra inside the upper Yellow Cat at 135.10 +/- 0.30
      Ma and ties a carbon-isotope excursion to the Valanginian Weissert Event, so
      the lower Yellow Cat is Berriasian into earliest Valanginian and the upper
      Yellow Cat is Valanginian. Ten of the twelve Cedar Mountain findings reduce
      to that one question, which formation-level vote counting could never have
      answered. The member is now recorded so the reasoning survives.

