    note: >
      Tithonian stands, now confirmed from the member-defining source.

Tendaguria tanzaniensis:
  - categories: [stage]
    source: corpus-review
    verdict: ours-correct
    note: >
      Tithonian stands, confirmed at source.

Epidexipteryx hui:
  - categories: [stage]
    source: xu2016z
    verdict: corrected
    note: >
      Widened to Bathonian-Callovian, and the formation corrected with it. The
      Yanliao Biota has two phases that are routinely conflated: xu2016z, by a
      co-author of both erecting papers, divides it into "the Bathonian-Callovian
      Daohugou phase (about 168-164 million years ago) and the Oxfordian
      Linglongta phase (164-159 million years ago)", and states that "the strata
      exposed at the Daohugou Locality belong mainly to the Bathonian-Callovian
      Haifanggou Formation". This taxon is from Daohugou, so jones2026c's
      Oxfordian is the Linglongta age applied to the wrong phase, and our
      Tiaojishan was the Linglongta formation.
  
      The formation is not fully settled: sullivan2014z holds that whether the
      Daohugou Beds belong to the Jiulongshan or the Tiaojishan is "linked to, but
      distinct from" their numerical age and that current data are "insufficient
      to resolve the problem", while favouring Jiulongshan/Haifanggou. What is
      firm is that the Daohugou strata are OVERLAIN by the Tiaojishan, so the
      Tiaojishan assignment belongs to Linglongta.
  - categories: [formation]
    source: xu2016z
    verdict: corrected
    note: >
      Tiaojishan -> Haifanggou; see the stage note for the Daohugou/Linglongta distinction.

