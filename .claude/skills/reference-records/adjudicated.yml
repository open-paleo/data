Brasilotitan nemophagus:
  - categories: [holotype]
    source: machado2013a
    verdict: ours-correct
    note: >
      "Holotype: Right dentary, two cervical vertebrae ... all housed at the Museu
      de Paleontologia de Marilia (MPM 125R). Casts of the dentary are housed at
      the Museu Nacional/UFRJ (MN 7371-V)." jones2026b cites the cast.
  - categories: [formation]
    source: machado2013a
    verdict: ours-correct
    note: >
      A disagreement between nomenclatural schemes rather than about where the
      bones came from. Fernandes and Coimbra (1996) divide the Bauru Group into
      Adamantina, Uberaba and Marília; Fernandes (2004) replaces Adamantina with
      six units including Presidente Prudente. The erecting paper says the
      holotype was "recovered from a reddish fine-grained sandstone that is part
      of the Adamantina Formation", and santucci2022a (2022) still writes
      Adamantina for this taxon, elsewhere giving the pair as "Adamantina
      Formation (=Presidente Prudente Formation)". Adamantina is also what the
      other Bauru titanosaurs here carry.
Brontosaurus excelsus:
