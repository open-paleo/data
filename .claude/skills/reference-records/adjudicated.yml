Nedcolbertia justinhofmanni:
  - categories: [holotype]
    source: kirkland1998c
    verdict: ours-correct
    note: >
      "CEUM 5071, partial associated skeleton of a juvenile specimen".
  - categories: [stage]
    source: joeckel2023z
    verdict: ours-correct
    note: >
      Valanginian stands; upper Yellow Cat Member.

      Cedar Mountain ages are decided by position relative to Aubrey's (1998)
      marker calcrete, which separates the lower from the upper Yellow Cat Member.
      joeckel2023z dates a tephra inside the upper Yellow Cat at 135.10 +/- 0.30
      Ma and ties a carbon-isotope excursion to the Valanginian Weissert Event, so
      the lower Yellow Cat is Berriasian into earliest Valanginian and the upper
      Yellow Cat is Valanginian. Ten of the twelve Cedar Mountain findings reduce
      to that one question, which formation-level vote counting could never have
      answered. The member is now recorded so the reasoning survives.


Patagotitan mayorum:
  categories: [holotype]
