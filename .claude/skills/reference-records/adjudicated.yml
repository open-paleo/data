    note: >
      Corrected to Cenomanian. The disagreement is about which part of the
      Blackleaf Formation: the unit reaches into the Albian, but the Oryctodromeus
      interval is its Cenomanian top. varricchio2007a, the erecting paper:
      "Palynomorphs and radiometric dates indicate a Cenomanian age for this
      portion of the formation". No paper in the reference literature assigns
      Oryctodromeus itself an Albian age -- every Albian citation concerns the
      Wayan Formation broadly. avrahami2024a dates penecontemporaneous strata at
      99.674 to 98.905 Ma, squarely Cenomanian.

Erythrovenator jacuiensis:
  - categories: [stage]
    source: müller2020a
    verdict: corrected
    note: >
      Widened to Carnian-Norian. The erecting paper explicitly declines to pick a
      stage: müller2020a gives "the age of Erythrovenator jacuiensis is estimated
      between c. 233 Ma to c. 225 Ma (Carnian to early Norian)". Ours held only
      the older end of that published range. The paper's own reasoning leans
      younger -- the site is tentatively assigned to the Riograndia AZ and the
      fauna "seems younger than the Hyperodapedon AZ" -- so Carnian alone was the
      floor of an uncertainty envelope rather than a conclusion.
  - categories: [formation]
    source: pavanatto2018z
    verdict: ours-correct
    note: >
      Not a co-occurrence artifact in our favour by accident -- the describing
      paper states the unit twice, once as a formal type horizon: "Type horizon.
      Santa Maria Supersequence, Candelária Sequence, Paraná Basin." The tally
      missed it because "Santa Maria" occurs constantly for three unrelated
      reasons: the city, the institution code (CAPPA/UFSM = Universidade Federal
      de Santa Maria), and the Supersequence containing the Candelária.
      pavanatto2018z, which describes the Niemeyer Site itself, closes it at
      sequence rank by lithology alone and explains why no finer value is
      available: "no index fossils have been found at the Niemeyer Site
      precluding a secure assignation of this fauna to any known AZ".
      Neighbouring sites in the same structural block straddle both assemblage
      zones. The reference work's "Santa Maria or Caturrita" is the same
      uncertainty written lithostratigraphically; picking one would fabricate a
      determination two papers deliberately withheld.
Amygdalodon patagonicus:
  - categories: [stage]
    source: corpus-paper-count
    verdict: corrected
    note: >
      Corrected to Toarcian on the weight of the reference literature. Ours held
      Sinemurian-Pliensbachian, which the corpus does not support for this
      taxon.

Yimenosaurus youngi:
  - categories: [stage]
    source: corpus-paper-count
    verdict: corrected
    note: >
      Corrected to Pliensbachian. Ours held Hettangian, which appears once
      against three papers asserting Pliensbachian alone for the Fengjiahe
      Formation.

Dongyangosaurus sinensis:
  - categories: [stage]
    source: corpus-paper-count
    verdict: ours-correct
    note: >
      Kept. The raw count favours Albian, but the Albian votes are unit-level
      statements about the Jinhua Formation broadly rather than about this taxon's
      horizon. Ours stands at Cenomanian-Turonian.

Jiangshanosaurus lixianensis:
  - categories: [stage]
    source: corpus-paper-count
    verdict: ours-correct
    note: >
      Kept, on the same reasoning as Dongyangosaurus sinensis from the same
      formation: the Albian votes are unit-level rather than about this horizon.

Dakotadon lakotaensis:
  - categories: [stage]
    source: corpus-paper-count
    verdict: corrected
    note: >
      Widened to late Valanginian - early Barremian. Ours held Valanginian alone,
      which is the lower bound of the published range rather than the whole of
      it; the reference work's Barremian is the upper bound.

Isanosaurus attavipachi:
  - categories: [stage]
    source: corpus-paper-count
    verdict: corrected
    note: >
      Narrowed to Pliensbachian. Ours held Pliensbachian-Toarcian and the
      reference work gives Norian-Rhaetian; neither matches, and the literature
      supports Pliensbachian.

Leyesaurus marayensis:
  - categories: [stage]
    source: martínez2015z
    verdict: corrected
    note: >
      Corrected to Rhaetian, now resting on the primary rather than on a range.
      Ours spanned Hettangian through Toarcian.

Jobaria tiguidensis:
  - categories: [stage]
    source: rauhut2009z
    verdict: corrected
    note: >
      Corrected to Bathonian-Callovian, which is NEITHER our value
      (Oxfordian-Tithonian) nor the reference work's (Hauterivian-Cenomanian).
      A case where both sides were wrong and a mechanical straddle would have
      produced a span covering neither the truth nor either claim.

Nhandumirim waldsangae:
  - categories: [stage]
    source: langer2018z
    verdict: corrected
    note: >
      Corrected to Carnian, and the formation with it. langer2018z dates the
      Santa Maria Formation at 233.23 +/- 0.73 Ma and gives 225.42 +/- 0.37 Ma as
      the maximum age of the Caturrita -- Carnian and early Norian respectively.
      Ours held Norian on a Caturrita assignment that the horizon does not
      support; the taxon is from the upper Santa Maria.
  - categories: [formation]
    source: langer2018z
    verdict: corrected
    note: >
      Caturrita -> Santa Maria. Fixing the stage alone would have left the fault
      latent, since the age follows from the unit.

Nanyangosaurus zhugeii:
  - categories: [stage]
    source: wang2013z
    verdict: corrected
    note: >
      Narrowed from a four-stage envelope to Coniacian. wang2013z's correlation
      table sets out the history explicitly: Xu et al. (2000) placed the beds in
      the Sangping Formation at Albian; this paper places them in the Xiaguan
      Formation at Coniacian. Our Turonian-Campanian range was the formation
      envelope rather than the taxon's horizon, and xing2014a is the only source
      resolving its own bed, in the lower Xiaguan. The reference work's Albian
      descends from xu2000a, which inferred it phylogenetically -- "the systematic
      position of Nanyangosaurus suggests that the Sangping Formation MAY
      represent Albian deposits" -- not stratigraphically.
  - categories: [formation]
    source: wang2013z
    verdict: corrected
    note: >
      Majiacun -> Xiaguan. No paper places this taxon in the Majiacun, which is
      the Xixia Basin unit; Nanyangosaurus is from the neighbouring
      Xiaguan-Gaoqiu Basin. wang2013z's table shows Majiacun as a separate unit,
      so ours was a different formation rather than a synonym.

Hoplitosaurus marshi:
  - categories: [stage]
    source: boyd2015z
    verdict: corrected
    note: >
      Corrected to Berriasian-Valanginian. The Barremian tradition inverts a
      ceiling into an age: sohn1979z says "Barremian or older", "pre-Aptian" and
      "probably not younger than the Barremian", all of which are maxima
      compatible with Berriasian-Valanginian, and Sohn never resolves the age by
      member. The holotype is from the Chilson Member, the basal unit, which
      boyd2015z and farke2014a place at Berriasian-Valanginian.

Osmakasaurus depressus:
  - categories: [stage]
    source: boyd2015z
    verdict: corrected
    note: >
      Corrected to Berriasian-Valanginian, matching Hoplitosaurus marshi: the two
      holotypes came out of the SAME two blocks of rock at Calico Canyon, per
      lucas1901a and gilmore1909a, so they cannot carry different stages. Ours
      read Barremian/Aptian, which mcdonald2011a sourced to Tschudy et al. (1984)
      -- a palynological study of the Cedar Mountain and Burro Canyon formations
      on the Colorado Plateau, a different region and different units. There is
      no Lakota data behind that date.

Vectidromeus insularis:
  - categories: [stage]
    source: corpus-review
    verdict: corrected
    note: >
      Stage unchanged at Barremian; the Ma range was on GTS2012 (129.4-125.0),
      which on the current scale sits almost entirely in the Hauterivian and is
      the likely origin of the reference work's Hauterivian. from_ma is now the
      ICS base of 125.77, matching the 91 records that already use it. to_ma
      stays at the GTS2012 value of 125.0 because schema.yml's stage table is
      itself on GTS2012 and the period-consistency check rejects anything
      outside it -- the true ICS Barremian top of 121.4 cannot be written until
      that table is updated.

Lexovisaurus durobrivensis:
  - categories: [stage]
    source: corpus-review
    verdict: ours-correct
    note: >
      Callovian stands. Its from_ma of 166.1 was the GTS2012 Bathonian/Callovian
      boundary, which now falls inside the Bathonian; corrected to 165.3, which
      also brings it into line with Loricatosaurus priscus from the same
      formation, which already held 165.3.

Borealopelta markmitchelli:
  - categories: [stage]
    source: brown2020z
    verdict: corrected
    note: >
      Corrected to Albian. Our Aptian traced to a single header line; brown2020z
      confirms the Albian for the horizon. from_ma is the schema's Albian base of
      113.0 rather than the current ICS 113.2, which the period-consistency check
      rejects while schema.yml remains on GTS2012 (#2044).

Zephyrosaurus schaffi:
  - categories: [stage]
    source: demic2019z
    verdict: corrected
    note: >
      Corrected to Aptian, and the reason is member-level. demic2019z rewrote the
      Cloverly member ages -- the Little Sheep Mudstone Member becomes ca. 124-109
      Ma, spanning Barremian to earliest Albian, where farke2014a had it at
      104-109 Ma and wholly Albian. zanno2023a then places Zephyrosaurus in the
      MIDDLE of that member at a mean age of ~116.5 Ma, which is Aptian. Under the
      older framework the member did not matter; under the new one it decides the
      answer.

Sibirotitan astrosacralis:
  - categories: [stage]
    source: corpus-review
    verdict: corrected
    note: >
      Widened to Barremian-Aptian, the two-stage span the primary literature
      itself asserts for the Ilek horizon. Ours held Aptian alone; the reference
      work gives Barremian alone. Aptian remains the best single stage if one is
      ever required.

Ingentia prima:
  - categories: [stage]
    source: corpus-review
    verdict: corrected
    note: >
      Widened to Norian-Rhaetian, the span the literature asserts for the Quebrada
      del Barro horizon. Ours held Norian, the reference work Rhaetian.

Wannanosaurus yansiensis:
  - categories: [stage]
    source: butler2009b
    verdict: corrected
    note: >
      Corrected to Campanian. NO source asserts a Maastrichtian age for this
      taxon: the only Maastrichtian in play is the question-marked tail of
      butler2009b's "Campanian-?early Maastrichtian", and sullivan2006a's "late
      Campanian-late Maastrichtian" is about flat-headed pachycephalosaurs as a
      group rather than this horizon. Everything else converges on Campanian,
      including chinzorig2025a, where the age is load-bearing to its argument
      rather than incidental. The erecting paper hou1977a says "early Late
      Cretaceous", older than either candidate, and has been abandoned since.

Brachytrachelopan mesai:
  - categories: [stage]
    source: corpus-review
    verdict: ours-correct
    note: >
      Kimmeridgian-Tithonian stands. The apparent straddle was formation-broad
      statements about the Canadon Calcareo being counted against taxon-horizon
      ones.

Albalophosaurus yamaguchiorum:
  - categories: [stage]
    source: sano2015z
    verdict: ours-correct
    note: >
      Barremian stands. sano2015z and sano2017z both assign the Kaseki-kabe
      horizon of the Kuwajima Formation to the Barremian; the earlier reading that
      our value had no traceable support was an artefact of those papers being
      absent from the literature scanned.

Rayososaurus agrioensis:
  - categories: [stage]
    source: corpus-review
    verdict: ours-correct
    note: >
      Cenomanian stands; the reference work's Aptian belongs to the Rayoso Formation rather than the Candeleros.
  - categories: [formation]
    source: carballido2010a
    verdict: ours-correct
    note: >
      Settled by a purpose-built relocation study that re-walked the outcrop, cut
      stratigraphic profiles and matched the matrix still adhering to the
      holotype bones: "This allows us to rule out for a start the Rayoso
      Formation as the possible unit of origin of the holotype ... the
      bone-bearing level corresponds to the upper section of the Candeleros
      Formation". The reference works are downstream of Bonaparte 1996.
Guaibasaurus candelariensis:
  - categories: [stage]
    source: langer2018z
    verdict: ours-correct
    note: >
      Early Norian stands. langer2018z gives 225.42 +/- 0.37 Ma as the maximum age
      of the Caturrita Formation, against 233.23 +/- 0.73 Ma for the Santa Maria --
      early Norian and Carnian respectively. Contrast Nhandumirim waldsangae, which
      was corrected the other way because it is from the Santa Maria, not the
      Caturrita.

Tehuelchesaurus benitezii:
  - categories: [stage]
    source: cúneo2013z
    verdict: ours-correct
    note: >
      Oxfordian-Tithonian stands. cúneo2013z dates a tuff in the Canadon Calcareo
      Formation at 157.449 +/- 0.056 Ma and states that the unit, "once considered
      to be early Cretaceous in age, is now entirely constrained to the Late
      Jurassic". The reference work's Toarcian is far outside that.
  - categories: [formation]
    source: carballido2011a
    verdict: ours-correct
    note: >
      The redescription of the type says so directly. carballido2011a: the taxon
      "was described by Rich et al. (1999) based on a partially articulated
      skeleton, allegedly found in the Middle Jurassic Cañadón Asfalto Formation
      ... Thus, the type of Tehuelchesaurus comes from the Cañadón Calcáreo
      Formation sensu Proserpio (1987)", and devotes its Geological Context
      section to the re-assignment. rauhut2005b independently records the same
      correction. jones2026b follows the superseded erecting paper and carries
      its superseded age with it.
Venenosaurus dicrocei:
  - categories: [stage]
    source: corpus-review
    verdict: ours-correct
    note: >
      Aptian stands. Note the evidence originally cited for it was mis-stated by
      the paper relaying it; the verdict survives on other grounds.

Dreadnoughtus schrani:
  - categories: [stage]
    source: sickmann2018z
    verdict: ours-correct
    note: >
      Campanian stands. sickmann2018z gives the Cerro Fortaleza Formation
      "maximum depositional ages throughout the Campanian ... EP-13 providing a
      YC1s MDA of 76.2 +/- 1.6 Ma". The reference works' Cenomanian belongs to the
      Mata Amarilla Formation, which varela2012z dates at 96.23 +/- 0.71 Ma; the
      two units were both once called the Pari Aike Formation, which is the source
      of the confusion.
  - categories: [formation]
    source: novas2019a
    verdict: ours-correct
    note: >
      One question with Orkoraptor burkei and Talenkauen santacrucensis -- all
      three come from the same outcrop around Cerro Los Hornos. The reference
      works are frozen on a 2012-2013 interlude: varela2012z dated beds near Tres
      Lagos at 96.2 Ma and called them Mata Amarilla, and Novas and others
      adopted that in 2013. sickmann2018z overturned it with 13 detrital-zircon
      maximum depositional ages, all Campanian or younger, noting its Cerro
      Fortaleza delineation "includes rocks that have sometimes been named Mata
      Amarilla Formation". novas2019a then places Talenkauen, Orkoraptor,
      Puertasaurus and Dreadnoughtus in the Cerro Fortaleza beds himself,
      reserving Mata Amarilla for the Cenomanian beds near the Sheuen River.
Orkoraptor burkei:
  - categories: [stage]
    source: sickmann2018z
    verdict: ours-correct
    note: >
      Campanian stands. sickmann2018z gives the Cerro Fortaleza Formation
      "maximum depositional ages throughout the Campanian ... EP-13 providing a
      YC1s MDA of 76.2 +/- 1.6 Ma". The reference works' Cenomanian belongs to the
      Mata Amarilla Formation, which varela2012z dates at 96.23 +/- 0.71 Ma; the
      two units were both once called the Pari Aike Formation, which is the source
      of the confusion.
  - categories: [formation]
    source: novas2019a
    verdict: ours-correct
    note: >
      Shares its reasoning with Dreadnoughtus schrani and Talenkauen
      santacrucensis. egerton2013a interprets the "Pari Aike Formation" of the
      erecting paper as the Cerro Fortaleza Formation; aranciagarolando2022a and
      novas2019a both use Cerro Fortaleza for this taxon specifically. The age
      remains contested even though the formation is not.
Puertasaurus reuili:
  - categories: [stage]
    source: sickmann2018z
    verdict: ours-correct
    note: >
      Campanian stands. sickmann2018z gives the Cerro Fortaleza Formation
      "maximum depositional ages throughout the Campanian ... EP-13 providing a
      YC1s MDA of 76.2 +/- 1.6 Ma". The reference works' Cenomanian belongs to the
      Mata Amarilla Formation, which varela2012z dates at 96.23 +/- 0.71 Ma; the
      two units were both once called the Pari Aike Formation, which is the source
      of the confusion.
  - categories: [formation]
    source: novas2019a
    verdict: ours-correct
    note: >
      "Pari Aike" was abandoned and its outcrops partitioned, which is where the
      Mata Amarilla answer comes from -- but the Cerro Los Hornos beds went to
      the Cerro Fortaleza. egerton2013a lists Puertasaurus among the taxa from
      beds "which we interpret as the Cerro Fortaleza Formation", and novas2019a
      places Talenkauen, Orkoraptor, Puertasaurus and Dreadnoughtus in the Cerro
      Fortaleza beds at that site. The reference works applied the right split to
      the wrong taxon: novas2013a moved Orkoraptor to the Mata Amarilla, not this
      one. jones2026b also pairs Mata Amarilla with a Cenomanian age, a further
      15 Myr from the Campanian-Maastrichtian everyone else gives.
Talenkauen santacrucensis:
  - categories: [stage]
    source: sickmann2018z
    verdict: ours-correct
    note: >
      Campanian stands. sickmann2018z gives the Cerro Fortaleza Formation
      "maximum depositional ages throughout the Campanian ... EP-13 providing a
      YC1s MDA of 76.2 +/- 1.6 Ma". The reference works' Cenomanian belongs to the
      Mata Amarilla Formation, which varela2012z dates at 96.23 +/- 0.71 Ma; the
      two units were both once called the Pari Aike Formation, which is the source
      of the confusion.
  - categories: [formation]
    source: novas2019a
    verdict: ours-correct
    note: >
      Shares its reasoning with Dreadnoughtus schrani and Orkoraptor burkei; see
      that entry for the Mata Amarilla history. bandeira2024a and novas2019a both
      give Cerro Fortaleza for this taxon.
Irisosaurus yimenensis:
  - categories: [stage]
    source: huang2005z
    verdict: ours-correct
    note: >
      Pliensbachian stands. huang2005z correlates the upper Lufeng Formation to
      the upper Toarcian and sites 21-14 to the middle Sinemurian; Pliensbachian
      sits inside that window, confirming the magnetostratigraphic basis.

Lingyuanosaurus sihedangensis:
  - categories: [stage]
    source: he2004z
    verdict: ours-correct
    note: >
      Aptian stands. he2004z dates the Jiufotang Formation at 120.3 +/- 0.7 Ma:
      "This result confirms an Aptian age for the Jiufotang Formation".
  - categories: [formation]
    source: yao2019a
    verdict: corrected
    note: >
      Changed Jiufotang to Jehol Group; neither side of the finding was
      supportable. The describing paper declines the question in as many words:
      "Horizon and Locality: Jehol Group, Lower Cretaceous. Sihedang Locality ...
      The fossil-bearing strata at Sihedang have been assigned to the Yixian
      Formation in some studies, but to the Jiufotang Formation in others.
      Resolving this stratigraphic issue is beyond the scope of the present
      paper." It is still open in 2026, with zhou2026a listing five papers per
      side, and neither side ever argued the case -- the founding claims
      (wang2012z for Jiufotang, zhou2014z for Yixian) both simply assert a
      formation in a locality line, and zhou2014z's supporting citation is a
      dating paper that never mentions Sihedang. Note the Jiufotang claim was
      published first and was never rebutted, so a count over this literature
      measures publication volume rather than evidence. Our own description field
      already said the formation is unknown, so the old value contradicted the
      record.
Zhongjianosaurus yangi:
  - categories: [stage]
    source: he2004z
    verdict: ours-correct
    note: >
      Aptian stands, on the same Jiufotang date as Lingyuanosaurus
      sihedangensis.
  - categories: [formation]
    source: yao2019a
    verdict: corrected
    note: >
      Changed Jiufotang to Jehol Group, matching Lingyuanosaurus sihedangensis.
      Nothing places this taxon in the Jiufotang, so the old value was unsourced;
      but the describing paper does not support a flat Yixian either, hedging
      three times -- "Possibly Yixian Formation" in the horizon line, and "this
      assignment needs confirmation by additional stratigraphical,
      paleontological, and chronological data". Both taxa come from the Sihedang
      locality on identical coordinates, so recording one at formation rank and
      the other at group rank would assert a stratigraphic difference between two
      specimens from one outcrop that nobody has claimed. Group rank is the
      finest unit the two readings share. The age carries the same uncertainty,
      the Jiufotang overlying the Yixian.
Tachiraptor admirabilis:
  - categories: [stage]
    source: corpus-review
    verdict: ours-correct
    note: >
      Hettangian stands.

Tengrisaurus starkovi:
  - categories: [stage]
    source: corpus-review
    verdict: ours-correct
    note: >
      Valanginian stands, but with LOWER confidence than the other rows here:
      averianov2021z, which was expected to justify the Valanginian, argues
      Barremian-Aptian instead. Left as ours pending a better source rather than
      adopted from the reference work, which gives Barremian-Aptian.

Loricatosaurus priscus:
  - categories: [stage]
    source: corpus-review
    verdict: ours-correct
    note: >
      Callovian stands, matching Lexovisaurus durobrivensis from the same formation.

Anoplosaurus curtonotus:
  - categories: [stage]
    source: corpus-review
    verdict: ours-correct
    note: >
      No disagreement exists. The finding is doubly stale: it reports a YAML value
      we no longer hold, and weishampel2004a in fact agrees with our Albian.
  - categories: [formation]
    source: seeley1879a
    verdict: ours-correct
    note: >
      Orthography, not a dispute. The erecting paper writes "Cambridge Greensand"
      closed and never "Green Sand"; pereda-suberbiola1999a and barrett2020a do
      the same across 65 occurrences. Pair added to formation-variants.yml.
  - categories: [holotype]
    source: pereda-suberbiola1999a
    verdict: ours-correct
    note: >
      The reference work folds a paralectotype into the type.
      pereda-suberbiola1999a, which made the designation, separates them:
      "Designated lectotype. SMC B55731, a partial right scapula. Anoplosaurus
      curtonotus was erected on the basis of 77 syntypes (Seeley 1879). No
      holotype specimen was designated by Seeley (1879)." SMC B55670 appears in
      the very next line under "Paralectotypes. SMC B55670, partial left
      dentary", alongside roughly seventy other numbers. Our lectotype and its
      material -- a partial right scapula -- match exactly. SMC is an alias of
      CAMSM in institutions.yaml, so the prefix difference is already resolved.
Losillasaurus giganteus:
  - categories: [stage]
    source: campos-soto2019z
    verdict: ours-correct
    note: >
      Kimmeridgian-Tithonian stands. campos-soto2019z: "a Kimmeridgian age has
      been demonstrated recently at least locally", correlated with "other
      Kimmeridgian-Tithonian dinosaur-bearing deposits of Iberia".
  - categories: [formation]
    source: royo-torres2020a
    verdict: ours-correct
    note: >
      A stale-reference-work artifact rather than a disagreement. weishampel2004a
      printed "Unnamed unit" because in 2004 nobody had assigned the site:
      casanovas2001a gives only "Levels of micaceous arenite". Royo-Torres and
      others made the assignment in 2006, two years after that work went to
      press, and the taxon's own 2020 redescription places it "in the same
      geological unit as Turiasaurus". campos-soto2019z, the dedicated
      stratigraphic revision, puts the Losilla-Alpuente sites in the Villar del
      Arzobispo and dates it Kimmeridgian-Tithonian, matching our stages. The
      2026 reference work agrees with us. Caution: the reference work lists a
      second, Portuguese unit for this taxon because it folds in referred
      material; the type locality is Spanish.
Phuwiangosaurus sirindhornae:
  - categories: [stage]
    source: tucker2022z
    verdict: corrected
    note: >
      Corrected from Barremian to Valanginian-Hauterivian, with the whole Sao Khua
      Formation. tucker2022z is the first radiometric work on the unit and
      concludes a Valanginian-early Hauterivian age of 133.6-132.1 Ma; the recent
      literature has followed it. The Barremian it replaces is a citation cascade
      of sixteen papers resting on one source, tumpeesuwan2010z, whose own chain --
      a new bivalve species, to its only congener in Korea and Japan, to the
      Sebayashi faunal association -- does not support the "restricted to late
      Barremian" it is cited for.
  
      TWO CAVEATS, recorded rather than smoothed over. First, the date is a MAXIMUM
      depositional age, a one-sided bound: it excludes anything OLDER than ~133.8
      Ma and does not by itself exclude a Barremian Sao Khua, which requires
      accepting minimal lag between crystallisation and deposition. The paper's own
      wording inverts the usual sense of an MDA in places. Second, the samples come
      from the middle and upper formation, not from Phu Wiang or Nong Bua Lamphu,
      so no taxon here has a horizon-specific date. from_ma is therefore set to the
      hard bound of 133.8 rather than to the paper's preferred 133.6, and to_ma to
      the base of the Barremian, so the record states the stage assignment without
      inheriting the minimal-lag precision.
  - categories: [holotype]
    source: suteethorn2009a
    verdict: corrected
    note: >
      The type is a numbered series and we held a single truncated identifier.
      The reference work is not folding referred material in here -- it is
      quoting the erecting paper verbatim: martin1994a gives "Type : A partial
      skeleton n° P.W.1-1 to P.W.1-21". suteethorn2009a gives the modern
      catalogue form, "Holotype. SM PW1-0001 to SM PW1-0022; partly articulated
      skeleton including three cervical vertebrae, three dorsal vertebrae,
      scapulae, left humerus, left ulna, ilia, pubes, ischia, femora, left
      fibula, coracoid, chevron and rib", and its four-digit padded form matches
      the other SM specimens in the literature (SM PW1-0002, SM K11-0021). The 22
      elements are now listed individually rather than as a range. Two residuals
      recorded rather than acted on: the element count differs between the two
      papers (21 against 22), and our material field says four dorsal vertebrae
      where suteethorn2009a says three.
Phuwiangvenator yaemniyomi:
  - categories: [stage]
    source: tucker2022z
    verdict: corrected
    note: >
      Corrected from Barremian to Valanginian-Hauterivian, with the whole Sao Khua
      Formation. tucker2022z is the first radiometric work on the unit and
      concludes a Valanginian-early Hauterivian age of 133.6-132.1 Ma; the recent
      literature has followed it. The Barremian it replaces is a citation cascade
      of sixteen papers resting on one source, tumpeesuwan2010z, whose own chain --
      a new bivalve species, to its only congener in Korea and Japan, to the
      Sebayashi faunal association -- does not support the "restricted to late
      Barremian" it is cited for.
  
      TWO CAVEATS, recorded rather than smoothed over. First, the date is a MAXIMUM
      depositional age, a one-sided bound: it excludes anything OLDER than ~133.8
      Ma and does not by itself exclude a Barremian Sao Khua, which requires
      accepting minimal lag between crystallisation and deposition. The paper's own
      wording inverts the usual sense of an MDA in places. Second, the samples come
      from the middle and upper formation, not from Phu Wiang or Nong Bua Lamphu,
      so no taxon here has a horizon-specific date. from_ma is therefore set to the
      hard bound of 133.8 rather than to the paper's preferred 133.6, and to_ma to
      the base of the Barremian, so the record states the stage assignment without
      inheriting the minimal-lag precision.

