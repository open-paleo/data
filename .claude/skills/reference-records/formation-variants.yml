# Formation spellings already compared against the reference works and found to be
# variants of one name rather than different units. REVIEWED 2026-07-30; the choice
# of a canonical form is deferred to #2012, which proposes a formations registry.
#
# Findings matching a pair here are reported under a separate REVIEWED heading so
# they stay visible without being re-triaged. A variant NOT listed here is new and
# does need review.
#
# Keyed by our spelling; the list is the reference-work forms seen.
#
# CANONICAL FORM CHOSEN: Sânpetru, not Sînpetru. The 1993 Romanian
# orthographic reform replaced î with â in this position; weishampel2003a
# flags it in its own geology section ("among them Sînpetru to Sânpetru"),
# and all four reference works print Sânpetru. The î form is kept as a
# variant because it survives in some later literature (augustin2022a).
#
# DELIBERATELY EXCLUDED: Shaximiao vs Xiashaximiao / Shangshaximiao. Xia and
# shang are Chinese for lower and upper, so those name a subunit rather than a
# spelling of the same unit -- a substantive difference that must stay in the
# active findings. Watch for the same trap in other Chinese formation names.

"Bahariya": ["Baharija Fm."]
"Baharîje": ["Baharija Fm.", "Baharija Formation"]
"Baruungoyot": ["Barun Goyot Fm."]
"Bayangobi": ["Bayan Gobi Fm.", "Bayingobi Fm."]
"Baynshire": ["Bayan Shireh Fm.", "Bayanshiree Svita"]
"Calcaires de Caen": ["Calcaire de Caen", "Calcaire du Caen"]
"Cambridge Greensand": ["Cambridge Green Sand"]
"Cerro Carnerero": ["Cerro Carnereo Fm."]
"Chipping Norton Limestone": ["Chipping Norton Ls."]
"Pawpaw": ["Paw Paw Formation"]
"Sânpetru": ["Sînpetru Fm.", "Sînpetru", "Sanpetru Fm."]
"Udurchukan": ["Udurchurkan Fm."]
"Ukureyskaya": ["Ukurey Fm."]
"Xiagou": ["Xiaogou Fm."]
"Yuliangzi": ["Yuliangze Fm.", "Yuliangze Formation"]
"Ziliujing": ["Zilujing Fm."]
