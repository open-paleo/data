# Institution registry: canonical code -> name, location and aliases.
#
# ALIASES ARE APPEND-ONLY. Never remove one because nothing currently uses it --
# that is exactly when it earns its keep, by resolving a code that appears only
# in the literature. A code is removed only when it was wrong in the first
# place, never because it looks unused. When two entries are merged, the losing
# entry's code and all of its aliases move onto the survivor.
#
# Aliases carry superseded institution codes (BMNH for NHMUK), sub-collection
# codes (MCF-PVPH within MCF) and spelling variants alike; they are not ordered
# and do not by themselves record which form a given paper printed. A specimen
# that was renumbered or rehoused records that per record, not here.

