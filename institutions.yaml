# Institution registry for vertebrate palaeontology.
# Sources: Wedel et al. crowdsourced vert-palaeo list; Sabaj 2023 MASTER LIST v9.8.
# Format: keyed by canonical abbreviation with name, location, and aliases.
#
# Disambiguation policy. When two institutions share an abbreviation,
# every entry sharing that abbreviation must carry an ISO-3166-1 alpha-2
# country suffix: <CODE>-<ISO>. No bare key may remain when a collision
# exists (mirrors the citation-key disambiguation policy in the bib).
# Within-country collisions are extended with a hyphenated city or
# institution-type suffix (e.g. MNCN-ES-MAD vs MNCN-ES-BCN, hypothetical).
# Colocate disambiguated entries so the collision is visible at the source.

