genus: Jingiella
parent: Mamenchisauridae
etymology: Named for the Jing region or Jingia locality in Guangxi, China (diminutive '-ella' suffix), originally named 'Jingia' before a nomenclatural amendment.
description: Jingiella is an extinct genus of mamenchisaurid sauropod dinosaur
  from the Late Jurassic Dongxing Formation of Guangxi, China. The genus
  contains a single species, J. dongxingensis, known from vertebrae and limb
  bones. The original description of Jingiella referred to it using the name
  "Jingia" which was preoccupied by a moth genus named in 1983, and an amendment
  was published shortly thereafter, establishing Jingiella as the new
  replacement name.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
appearance:
  features:
    - elongate neck
  integument: scaled
  evidence: inferred
diagnostic_features:
  - Ratio of neural spine length to narrowest width of the neural arch of the
    dorsal vertebra is about 4.4 (autapomorphy)
  - Sacral centrum is opisthocoelous with a shallow depression on the lateral
    surface
  - Centra of the anterior caudal vertebrae are amphicoelous, with transversely
    compressed articular surfaces
  - Anterolateral and anteromedial processes of the ulna are generally
    perpendicular to each other in proximal view
  - Femoral head is medially oriented
  - Middle portions of both the anterior and posterior surfaces of the femur are
    slightly concave
