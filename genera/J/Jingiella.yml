genus: Jingiella
parent: Mamenchisauridae
etymology: Named for the Jing region or Jingia locality in Guangxi, China (diminutive '-ella' suffix), originally named 'Jingia' before a nomenclatural amendment.
description: Jingiella is an extinct genus of mamenchisaurid sauropod dinosaur
  from the Late Jurassic Dongxing Formation of Guangxi, China. The genus
  contains a single species, J. dongxingensis, known from vertebrae and limb
  bones. The original description of Jingiella referred to it using the name
  "Jingia" which was preoccupied by a moth genus named in 1983, and an amendment
  was published shortly thereafter, establishing Jingiella as the new
  replacement name.
