genus: Jianianhualong
parent: Sinovenatorinae
dispute:
  summary: >
    Jianianhualong is consistently recovered as a basal troodontid and is placed
    in Sinovenatorinae by Hartman et al. (2019) and Jones et al. (2026), the
    placement adopted here, although Cau and Madzia (2021) recover it outside that
    subfamily and its describers placed it in a polytomy near Sinusonasus.
  history:
    - date: "2026-07-01"
      note: Placed in Sinovenatorinae following Hartman et al. (2019); the membership instability of Sinovenatorinae is recorded on the clade file.
etymology: Named after Jianianhua (the company that funded the research) combined with Chinese long (dragon); meaning "Jianianhua dragon"
description: Jianianhualong is a genus of troodontid theropod dinosaur from the
  Early Cretaceous of China. It contains a single species, Jianianhualong tengi,
  named in 2017 by Xu Xing and colleagues based on an articulated skeleton
  preserving feathers. The feathers at the middle of the tail of Jianianhualong
  are asymmetric, being the first record of asymmetrical feathers among the
  troodontids. Despite aerodynamic differences from the flight feathers of
  modern birds, the feathers in the tail vane of Jianianhualong could have
  functioned in drag reduction while the animal was moving. The discovery of
  Jianianhualong supports the notion that asymmetrical feathers appeared early
  in the evolutionary history of the Paraves.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
  - forested
appearance:
  features:
    - feathered tail
  integument: feathered
diagnostic_features:
  - Maxillary rostral ramus triangular in outline and relatively high
    dorsoventrally
  - Maxillary ascending process extending posterodorsally at high angle (~45° to
    maxillary ventral margin)
  - Long manual phalanx II-1 with prominent proximoventral heel and large groove
    along medial surface
  - Highly elongated manual phalanx III-2 (slightly longer than metacarpal III)
  - Ilium with slightly concave dorsal margin in lateral view
  - Metatarsal IV without prominent ventral flange
