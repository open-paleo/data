genus: Jiangjunosaurus
parent: Stegosaurinae
etymology: Named after Jiangjunmiao ('temple of the general'), an abandoned town
  near the discovery site in Xinjiang, China, with Chinese jiangjun meaning
  'general', combined with Greek sauros (lizard); meaning 'general's temple
  lizard'
pronunciation:
  phonetic: jee-AHNG-joo-no-SOR-us
description: Jiangjunosaurus is an extinct genus of herbivorous stegosaurian
  dinosaurs from the Oxfordian-age (Upper Jurassic) Shishugou Formation of the
  Junggar Basin, Xinjiang, China.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Tooth crowns symmetrical and proportionally wide mesiodistally (basal-apical
    length subequal to mesiodistal width)
  - Sub-rectangular axial neural spine in lateral view with tall anterior margin
  - Large openings (enlarged nutrient foramina) on lateral surfaces of posterior
    cervical centra
appearance:
  features:
    - dermal plates
  integument: armored
  evidence: direct
identifiers:
  - source: pbdb
    id: "153944"
  - source: wikidata
    id: Q135221
