genus: Jiangjunosaurus
parent: Stegosauridae
etymology: Named after Jiangjunmiao ('temple of the general'), an abandoned town near the discovery site in Xinjiang, China, with Chinese jiangjun meaning 'general', combined with Greek sauros (lizard); meaning 'general's temple lizard'
description: Jiangjunosaurus is an extinct genus of herbivorous stegosaurian
  dinosaurs from the Oxfordian-age (Upper Jurassic) Shishugou Formation of the
  Junggar Basin, Xinjiang, China.
diet: herbivore
