references:
  - id: göhlich2006a
    notes: Named Juravenator and recovered it within Compsognathidae.
  - id: jones2026c
    notes: Source of the mass and hip height estimates, and the appearance
      features.
  - id: rauhut2012a
    notes: Described the juvenile as a basal tetanuran/megalosauroid, questioning Juravenator's compsognathid affinities.
  - id: chiappe2010a
    notes: Described Juravenator as a small basal coelurosaur near Compsognathus, within Compsognathidae
  - id: foth2020a
    notes: Assigns the holotype to the Torleite Formation, following Niebuhr
      and Pürner; the describing paper names none. Also places it near
      Megalosauroidea, reading its coelurosaurian traits as juvenile.
  - id: cau2024a
    notes: Places Juravenator among the allosauroids.
