genus: Juravenator
parent: Coelurosauria
placement: incertae sedis
dispute:
  summary: >
    The affinities of Juravenator are uncertain because the holotype is an
    immature individual. It was described as a small basal coelurosaur close to
    Compsognathus, loosely within Compsognathidae (Chiappe and Göhlich, 2010), and
    Jones et al. (2026) place it there. However, Rauhut et al. (2012) and Foth et
    al. (2020) showed that its coelurosaurian characters may be juvenile
    artifacts, that it is drawn toward the base of Tetanurae as the sister taxon of
    the megalosauroid Sciurumimus when both juveniles are analyzed together, and
    that its supposed tail "scales" are better interpreted as adipocere. It is
    placed conservatively at Coelurosauria incertae sedis.
  history:
    - date: "2026-07-01"
      note: Placed at Coelurosauria incertae sedis; compsognathid-grade (Chiappe and Göhlich, 2010) versus basal-tetanuran/megalosauroid juvenile-artifact (Rauhut et al., 2012; Foth et al., 2020) hypotheses unresolved.
etymology: Named after the Franconian Jura region of Germany (where it was
  found) combined with Latin venator (hunter); meaning 'Jura hunter'
description: Juravenator is a genus of tetanuran theropod dinosaur which lived
  about 152 or 151 million years ago in modern day Franconian Jura of Germany
  (Torleite Formation) during the Late Jurassic. It is known from a single,
  juvenile specimen measuring about 75 cm (2.46 ft) in length.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - marine
  - coastal
diagnostic_features:
  - Eight maxillary teeth with no premaxillary-maxillary diastema
  - Posterior serrations on premaxillary teeth
  - Proportionally short feet relative to body size
  - Proximally high manual claws that taper abruptly at midpoint
  - Ventrally notched premaxillary-maxillary contact
  - Bow-like zygapophyses in mid-caudal vertebrae
appearance:
  features:
