genus: Juravenator
parent: Coelurosauria
etymology: Named after the Franconian Jura region of Germany (where it was
  found) combined with Latin venator (hunter); meaning 'Jura hunter'
description: Juravenator is a genus of tetanuran theropod dinosaur which lived
  about 152 or 151 million years ago in modern day Franconian Jura of Germany
  (Torleite Formation) during the Late Jurassic. It is known from a single,
  juvenile specimen measuring about 75 cm (2.46 ft) in length.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - marine
  - coastal
diagnostic_features:
  - Eight maxillary teeth with no premaxillary-maxillary diastema
  - Posterior serrations on premaxillary teeth
  - Proportionally short feet relative to body size
  - Proximally high manual claws that taper abruptly at midpoint
  - Ventrally notched premaxillary-maxillary contact
  - Bow-like zygapophyses in mid-caudal vertebrae
appearance:
  features:
    - enlarged caniniform teeth
  integument: feathered
  evidence: direct
