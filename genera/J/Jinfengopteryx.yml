genus: Jinfengopteryx
parent: Jinfengopteryginae
etymology: From Chinese Jinfeng (golden phoenix, the queen of birds in Chinese folklore) and Ancient Greek pteryx (feather, wing); meaning 'golden phoenix feather'
description: Jinfengopteryx is a genus of maniraptoran dinosaur. It was found in
  the Qiaotou Member of the Huajiying Formation of Hebei Province, China, and is
  therefore of uncertain age. The Qiaotou Member may correlate with the more
  well-known Early Cretaceous Yixian Formation, and so probably dates to around
  122 Ma (122 million years) ago.
diet: carnivore
locomotion: bipedal
