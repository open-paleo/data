genus: Jinfengopteryx
parent: Jinfengopteryginae
dispute:
  summary: >
    Jinfengopteryx was originally described as a basal avialan/archaeopterygid (Ji
    et al., 2005) but is now generally recovered as a troodontid, and is the type
    genus of Jinfengopteryginae (Turner et al., 2012; Sellés et al., 2021). Its
    finer position is unstable — Hartman et al. (2019) recover it equally in
    Sinovenatorinae or with the jinfengopterygines, and some analyses shift it
    stemward as a basal paravian.
  history:
    - date: "2026-07-01"
      note: Placed in Jinfengopteryginae (its type genus) following Turner et al. (2012) and Sellés et al. (2021); original avialan and basal-paravian readings noted. Clade-level monophyly dispute recorded on the Jinfengopteryginae file.
etymology: From Chinese Jinfeng (golden phoenix, the queen of birds in Chinese
  folklore) and Ancient Greek pteryx (feather, wing); meaning 'golden phoenix
  feather'
pronunciation:
  phonetic: jin-feng-OP-tuh-rix
description: Jinfengopteryx is a genus of maniraptoran dinosaur. It was found in
  the Qiaotou Member of the Huajiying Formation of Hebei Province, China, and is
  therefore of uncertain age. The Qiaotou Member may correlate with the more
  well-known Early Cretaceous Yixian Formation, and so probably dates to around
  122 Ma (122 million years) ago.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
diagnostic_features:
  - "More and closely packed teeth than Archaeopteryx: 18 teeth in both lower
    and upper jaws respectively, with no interdental plates between dentary
    teeth"
  - Relatively shorter and higher preorbital portion of the skull compared to
    Archaeopteryx
  - Relatively shorter metacarpal II compared to metacarpal I (metacarpal II
    ~2.5x length of metacarpal I, versus >3x in Archaeopteryx)
  - Comparatively longer and more robust hindlimb with forelimb-to-hindlimb
    ratio of 0.62
  - Teeth fewer and unserrated compared to troodontids; conical tooth with
    D-shaped cross-section
appearance:
  features:
    - sickle claw
    - feathered tail
  integument: feathered
  evidence: direct
