genus: Jainosaurus
parent: Lithostrotia
etymology: Named after Indian paleontologist Sohan Lal Jain, who made significant contributions to the study of Indian dinosaurs, combined with Greek sauros (lizard); meaning 'Jain's lizard'
description: Jainosaurus is a genus of titanosaurian sauropod dinosaur of India
  and wider Asia, which lived in the Maastrichtian (approximately 68 million
  years ago). It is thought to have been about the same size as its contemporary
  relative Isisaurus, measuring 18 metres (59 ft) long and weighing 15 metric
  tons (17 short tons). The humerus of the type specimen is 134 centimetres
  long.
