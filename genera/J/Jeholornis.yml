genus: Jeholornis
parent: Avialae
pronunciation:
  phonetic: juh-HOHL-OR-nis
etymology: From the Jehol Group (the Lower Cretaceous geological
  unit of western Liaoning, named after the historical region of
  Jehol/Rehe) plus Greek 'ornis' (bird); meaning 'Jehol bird'.
description: >
  Jeholornis is a genus of avialan dinosaurs that lived between
  approximately 122 and 120 million years ago during the early
  Cretaceous Period in China. Fossil Jeholornis were first
  discovered in the Jiufotang Formation in Hebei Province, China
  (in what was previously Rehe Province, also known as Jehol —
  hence the name) and additional specimens have been found in
  the older Yixian Formation.
dispute:
  summary: >
    The synonymy with Shenzhouraptor Ji et al., 2002 is actively
    contested. Most workers (Ji et al. 2003; Zhou and Zhang 2006,
    2007; Li et al. 2010; Lefèvre et al. 2014) accept the
    synonymy: Shenzhouraptor sinensis and Jeholornis prima are
    treated as the same species, with Jeholornis having ICZN
    priority because Nature carries a specific publication date
    (25 July 2002) while the Geological Bulletin of China is a
    monthly journal without a specific issue date. Wang et al.
    (2020) dissented, identifying multiple distinguishing
    characters and recovering Shenzhouraptor sinensis
    phylogenetically outside Jeholornis sensu stricto. The
    intake follows the majority position (Jeholornis senior,
    Shenzhouraptor junior synonym) while flagging the dispute.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
diagnostic_features:
  - Lachrymal T-shaped with two vertical, elongated pneumatic
    fossae.
  - Mandibles robust with well-ossified (fused) symphysis.
  - First phalanx of third manual digit approximately twice the
    length of the second phalanx, forming a bow-shaped structure
    together.
  - Tail with at least twenty elongated caudal vertebrae behind
    the transition point, bearing distinctively elongated
    prezygapophyses and chevrons.
  - Lateral trabecula of the sternum bearing a rounded fenestra
    at its distal end.
  - Forelimb-to-hindlimb ratio (humerus + ulna + carpometacarpus
    over femur + tibiotarsus + tarsometatarsus) approximately 1.2.
appearance:
  integument: feathered
identifiers:
  - source: pbdb
    id: "119246"
  - source: wikidata
    id: Q133956
  - source: gbif
    id: "4848036"
synonyms:
  - name: Shenzhouraptor
    type: junior subjective
    reason: Ji et al. (2002) erected Shenzhouraptor sinensis for
      LPM 0193 in the same Jiufotang Formation, only days before
      (and in a less precisely dated journal than) Zhou and Zhang's
      Jeholornis prima Nature paper. Ji et al. 2003, Zhou and Zhang
      (2006, 2007), Li et al. (2010), and Lefèvre et al. (2014)
      treat Shenzhouraptor sinensis as a junior subjective synonym
      of Jeholornis prima with Jeholornis given priority on ICZN
      grounds (specific Nature publication date over monthly
      Geological Bulletin of China). Wang et al. (2020) dissent
      (see dispute field).
species:
  - name: Jeholornis prima
    etymology: From Latin 'prima' (first), in reference to the
      primitive appearance of the tail.
    status: valid
    type_species: true
    period:
      name:
        - Early Cretaceous
      stage:
        - Aptian
    location:
      country: CN
      locality: Dapingfang, Chaoyang City
      region: CN-LN
      formation: Jiufotang
    type_specimen:
      specimen_id:
        - IVPP V13274
      specimen_type: holotype
      institution: IVPP
      material: Nearly completely articulated skeleton preserved
        on five slabs, including a partially articulated skull
        and nearly complete postcranial bones; >50 ovules
        (Carpolithus) preserved in the stomach region as direct
        evidence of seed-eating.
      completeness: complete
    erected_in: zhou2002a
  - name: Jeholornis palmapenis
    etymology: From Latin 'palma' (palm) and 'penis' (tail), in
      reference to the palm-tree-like appearance of the
      preserved caudal rectrices.
    status: valid
    period:
      name:
        - Early Cretaceous
      stage:
        - Aptian
    location:
      country: CN
      locality: Jianchang
      region: CN-LN
      formation: Jiufotang
    type_specimen:
      specimen_id:
        - SDM 20090109.1
      specimen_type: holotype
      institution: SDM
      material: Nearly fully articulated but incomplete skeleton
        (slab SDM 20090109.1 + counter slab SDM 20090109.2),
        missing pectoral girdle and forelimbs, with complete
        caudal integument.
      completeness: partial
    erected_in: oconnor2012a
  - name: Jeholornis curvipes
    etymology: From Latin 'curvus' (curved) and 'pes' (foot), in
      reference to the lateral deviation of the distal
      metatarsals in the holotype YFGP-yb2.
    status: valid
    period:
      name:
        - Early Cretaceous
      stage:
        - Aptian
    location:
      country: CN
      locality: Yizhou Fossil and Geology Park
      region: CN-LN
      formation: Yixian
      member: Dawangzhangzi
    type_specimen:
      specimen_id:
        - YFGP-yb2
      specimen_type: holotype
      institution: YFGP
      material: Almost completely articulated skeleton (housed at
        the Yizhou Fossil and Geology Park, specimen YFGP-yb2)
        including a partial caudal series; rostral skull, right
        forelimb and right hindlimb distal autopodia were
        reconstructed during preparation.
      completeness: complete
    size:
      weight_kg:
        min: 0.59
        max: 0.59
    erected_in: lefèvre2014a
notable_specimens:
  - specimen_id: [STM2-51]
    institution: STM
    category: reproductive
    significance: "Referred specimen that preserves round structures in the body cavity interpreted as ovaries, offering rare evidence of the reproductive anatomy of this early avialan."
    references: [zheng2013a]
references:
  - id: zhou2002a
    notes: Original description of Jeholornis prima on holotype IVPP V13274 from
      the Jiufotang Formation; the type specimen preserved >50 stomach-region
      seeds documenting seed-eating.
  - id: ji2002a
    notes: Describes Shenzhouraptor sinensis on LPM 0193 from the Jiufotang
      Formation; most subsequent workers treat Shenzhouraptor as a junior
      subjective synonym of Jeholornis.
  - id: zhou2003a
    notes: Comparative anatomy of two new juvenile Jeholornis prima specimens
      (IVPP V13553, V13550), documenting progressive tooth reduction and tail
      morphology relative to Archaeopteryx.
  - id: oconnor2012a
    notes: Erects Jeholornis palmapenis on SDM 20090109.1, diagnosed by toothed
      maxilla, strongly convex ilium dorsal margin, and a fan of 11
      palm-frond-shaped caudal rectrices.
  - id: lefèvre2014a
    notes: Erects Jeholornis curvipes on YFGP-yb2 from the Yixian Dakangpu
      Member (~124.6 Ma); synonymises Shenzhouraptor sinensis with J. prima.
  - id: wang2020b
    notes: Describes Kompsornis longicaudus and re-evaluates Shenzhouraptor
      sinensis as a distinct valid species outside Jeholornis sensu stricto; the
      dissenting view in the synonymy debate.
  - id: zheng2013a
  - id: zhou2006a
    notes: Reviewed Mesozoic birds of China, including Jeholornis.
