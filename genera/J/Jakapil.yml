genus: Jakapil
parent: Thyreophora
etymology: "From 'Ja-Kapïl', a Puelchean word meaning 'shield bearer', in reference to its thyreophoran armor. The species name 'kaniukura' means 'crest stone' in Mapudungun."
description: Jakapil is a genus of basal thyreophoran dinosaur from the Late
  Cretaceous (Cenomanian-aged) Candeleros Formation of Argentina. The type
  species is Jakapil kaniukura.
