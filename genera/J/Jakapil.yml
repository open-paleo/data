genus: Jakapil
parent: Thyreophora
etymology: "From 'Ja-Kapïl', a Puelchean word meaning 'shield bearer', in reference to its thyreophoran armor. The species name 'kaniukura' means 'crest stone' in Mapudungun."
pronunciation:
  phonetic: ja-ka-pill
description: Jakapil is a genus of basal thyreophoran dinosaur from the Late
  Cretaceous (Cenomanian-aged) Candeleros Formation of Argentina. The type
  species is Jakapil kaniukura.
dispute:
  summary: >
    Jakapil is a Late Cretaceous Patagonian thyreophoran. Its describers
    recovered it as a basal thyreophoran closely related to Scelidosaurus
    (Riguetti and others, 2022), and Jones (2026) follows this.
    Alternative matrices place it as a stem-eurypodan or basal ankylosaur,
    and Raven and others (2023) suggested marginocephalian affinities; the
    describers explicitly rejected a parankylosaur relationship.
  history:
    - date: "2026-06-29"
      note: Placed at Thyreophora (basal grade) following Riguetti and others (2022) and Jones (2026) (P2); stem-ankylosaur and marginocephalian alternatives are recorded.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - arid
diagnostic_features:
  - Large ventral crest on posterior lower jaw composed of dentary, angular, and
    splenial
  - Dorsomedially directed process on short retroarticular process
  - Leaf-shaped tooth crowns with prominent mesial edge on labial surface
  - Maxillary teeth pointed and strongly asymmetrical; dentary teeth slightly
    curved distally with rounded contour
  - Elongated and slender postzygapophyses in dorsal vertebrae
  - Strongly reduced humerus relative to femur with deep proximal fossa
  - Very large fibula relative to femur
  - Flattened and thin disk-like postcranial osteoderms
appearance:
