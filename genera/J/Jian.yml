genus: Jian
parent: Microraptorinae
etymology: From Chinese 'jiān' (鹣), a mythical one-winged bird; alluding to the
  bird-like, probably volant nature of this microraptorine.
description: Jian changmaensis is an extinct species of microraptorine theropod
  dinosaur known from the Early Cretaceous (Aptian age) Xiagou Formation of
  China. J. changmaensis is the only species in the genus Jian, known from a
  pectoral girdle and partial forelimb. After the discovery of more than 100
  bird fossils in the formation, this specimen is the first non-avian dinosaur
  to be described from it.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
appearance:
  integument: feathered
  evidence: inferred
diagnostic_features:
  - Coracoid proportionally longer relative to humerus than in any other
    microraptorine (~36% of humerus length).
  - Humeral distal condyles developed primarily on the cranial surface of the
    bone rather than the craniodistal surface.
  - Well-developed foramen on the ventral (proximoventral) aspect of the
    proximal radius, not described in other dromaeosaurids.
