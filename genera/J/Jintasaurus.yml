genus: Jintasaurus
parent: Hadrosauroidea
etymology: "Named for Jinta County in Gansu, China, where the fossils were discovered, combined with Chinese 'long' meaning 'dragon', hence 'Jinta County dragon'."
pronunciation:
  phonetic: JEEN-tah-SOR-us
description: Jintasaurus is a genus of hadrosauriform dinosaur that lived during
  the Early Cretaceous of what is now Jiuquan, Gansu, northwestern China. The
  type species is J. meniscus, described by Hai-Lu You and Da-Qing Li in 2009.
  The holotype and only known specimen includes the postorbital skull, lacking
  the jugal and quadratojugal, whose discovery supports the theory that
  hadrosaurs originated in Asia.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - lacustrine
diagnostic_features:
  - Extremely long pendant and crescentic paroccipital processes with ventral
    tips projecting far beyond occipital condyle level
  - Relatively long squamosal process of postorbital
  - Vertical posterior surface of supraoccipital (not steeply forward-inclined)
  - Paroccipital process directs ventrally (not anteriorly curved)
appearance:
  integument: scaled
  evidence: inferred
