genus: Jingshanosaurus
parent: Sauropodiformes
placement: incertae sedis
pronunciation:
  phonetic: JING-SHAHN-o-SAWR-us
etymology: Named after the town of Jingshan ("Golden Hill") near the fossil
  locality in Lufeng County, Yunnan, China; meaning "Jingshan lizard"
description: Jingshanosaurus is a genus of sauropodomorph dinosaurs from the
  early Jurassic period (201.4 to 196.5 million years ago, Hettangian age) of
  China. The type and only species is Jingshanosaurus xinwaensis. Its maximum
  weight was around 4.3 t (4.7 short tons) with an adult femur length of 845 mm
  (33.3 in). The genus grew up to 5 m (16 ft) long.
dispute:
  summary: >
    Jingshanosaurus xinwaensis is most commonly recovered among the
    basalmost Sauropodiformes (Jones, 2026), but Rauhut and others (2020)
    place it within Massospondylidae.
  history:
    - date: "2026-06-29"
      note: Placed at Sauropodiformes incertae sedis following the prevailing view and Jones (2026); the Massospondylidae alternative is recorded.
locomotion: facultative
paleoenvironment:
  - fluvial
  - lacustrine
diet: herbivore
diagnostic_features:
  - Caudal margin of the external naris caudal to the mid-length of the
    maxillary tooth row and to the rostral margin of the antorbital fenestra
  - Ventrally constricted subtriangular orbit
  - Rostrocaudally shortened jugal plate at the suborbital region
  - Height-to-length ratio of the dentary greater than 0.2
  - Distally recurved long axis of the tooth crowns
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "64137"
  - source: wikidata
    id: Q18607055
  - source: gbif
    id: "4967176"
synonyms:
  - name: Chuxiongosaurus
    type: junior subjective
    reason: Zhang and others (2020) synonymized Chuxiongosaurus lufengensis with
      Jingshanosaurus xinwaensis, referring its holotype to the species and
      rejecting three of the four characters proposed to distinguish it.
species:
  - name: Jingshanosaurus xinwaensis
    etymology: "Named for Xinwa Village, about 6 km from Jingshan Town in northeast
      Lufeng, Yunnan Province, China."
    status: valid
    type_species: true
    period:
      name:
        - Early Jurassic
      stage:
        - Hettangian
    location:
      country: CN
      locality: Xinwa, Jinshan
      region: CN-YN
      formation: Lufeng
      member: Shawan
    type_specimen:
      specimen_id: [ LFGT-ZLJ0113 ]
      specimen_type: holotype
      institution: ZLJ
      material: A well-preserved, nearly complete skeleton (~9 m) with skull and
        mandibles, cervical, dorsal, sacral, and caudal vertebrae, and a nearly
        complete appendicular skeleton.
      completeness: complete
    size:
      weight_kg:
        min: 1600
        max: 1600
      hip_height_m:
        min: 2.3
        max: 2.3
      length_m:
        min: 5.0
        max: 5.0
    erected_in: zhang1995a
    described_in: zhang2020a
references:
  - id: zhang1995a
  - id: zhang2020a
    notes: Redescription of the cranium; gives the holotype as LFGT-ZLJ0113 (field
      number LV003) and provides an emended cranial diagnosis.
  - id: jones2026b
    notes: Source of the mass and hip height estimates.
  - id: rauhut2020a
    notes: New sauropodomorph description placed Jingshanosaurus within Massospondylidae.
