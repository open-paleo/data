genus: Jingshanosaurus
parent: Sauropodiformes
placement: incertae sedis
pronunciation:
  phonetic: JING-SHAHN-o-SAWR-us
etymology: Named after the town of Jingshan ("Golden Hill") near the fossil
  locality in Lufeng County, Yunnan, China; meaning "Jingshan lizard"
description: Jingshanosaurus is a genus of sauropodomorph dinosaurs from the
  early Jurassic period (201.4 to 196.5 million years ago, Hettangian age) of
  China. The type and only species is Jingshanosaurus xinwaensis. Its maximum
  weight was around 4.3 t (4.7 short tons) with an adult femur length of 845 mm
  (33.3 in). The genus grew up to 5 m (16 ft) long.
dispute:
  summary: >
    Jingshanosaurus xinwaensis is recovered on the sauropod side of
    Massospondylidae, within Sauropodiformes as McPhee and colleagues (2014)
    define it, in most analyses of the Yates matrix and its successors,
    often as the sister of Seitaad (McPhee and colleagues, 2014; Zhang and
    colleagues, 2020; Fernández and Werneburg, 2022; Hu and colleagues,
    2026). Rauhut and colleagues (2020) instead recover it with Seitaad and
    Yunnanosaurus within Massospondylidae, a result Fernández and Werneburg
    (2022) did not recover on a version of the same matrix, and Chapelle and
    Choiniere (2018) recover Jingshanosaurus and Seitaad outside both
    Massospondylidae and Sauropodiformes.
  history:
    - date: "2026-06-29"
      note: Placed at Sauropodiformes incertae sedis following the prevailing view and Jones (2026); the Massospondylidae alternative is recorded.
    - date: "2026-10-19"
      note: >
        Retained at Sauropodiformes on the analyses that recover it
        there; supersedes the 2026-06-29 note's reliance on the
        prevailing view and Jones (2026).
locomotion: facultative
paleoenvironment:
  - fluvial
  - lacustrine
diet: herbivore
diagnostic_features:
  - Caudal margin of the external naris caudal to the mid-length of the
    maxillary tooth row and to the rostral margin of the antorbital fenestra
  - Ventrally constricted subtriangular orbit
  - Rostrocaudally shortened jugal plate at the suborbital region
  - Height-to-length ratio of the dentary greater than 0.2
  - Distally recurved long axis of the tooth crowns
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "64137"
  - source: wikidata
    id: Q18607055
  - source: gbif
    id: "4967176"
synonyms:
  - name: Chuxiongosaurus
    type: junior subjective
    reason: Zhang and colleagues (2020) synonymized Chuxiongosaurus lufengensis with
      Jingshanosaurus xinwaensis, referring its holotype to the species and
      rejecting three of the four characters proposed to distinguish it.
species:
  - name: Jingshanosaurus xinwaensis
    etymology: "Named for Xinwa Village, about 6 km from Jinshan Town in northeast
      Lufeng, Yunnan Province, China."
    status: valid
    type_species: true
    period:
      name:
        - Early Jurassic
      stage:
        - Hettangian
    location:
      country: CN
      locality: Xinwa, Jinshan
      region: CN-YN
      formation: Lufeng
      member: Shawan
    type_specimen:
      specimen_id: [ LFGT-ZLJ0113 ]
      specimen_type: holotype
      institution: ZLJ
      material: A well-preserved, nearly complete skeleton (~9 m) with skull and
        mandibles, cervical, dorsal, sacral, and caudal vertebrae, and a nearly
        complete appendicular skeleton.
      completeness: complete
    size:
      weight_kg:
        min: 1600
        max: 1600
      hip_height_m:
        min: 2.3
        max: 2.3
      length_m:
        min: 5.0
        max: 5.0
    erected_in: zhang1995a
    described_in: zhang2020a
references:
  - id: zhang1995a
  - id: zhang2020a
    notes: Redescription of the cranium; gives the holotype as LFGT-ZLJ0113 (field
      number LV003), provides an emended cranial diagnosis, and recovers
      Jingshanosaurus among the earliest-diverging sauropodiforms.
  - id: jones2026b
    notes: Source of the mass and hip height estimates.
  - id: rauhut2020a
    notes: Recovered Jingshanosaurus with Seitaad and Yunnanosaurus as a
      subclade within Massospondylidae.
  - id: mcphee2014a
    notes: Defined Sauropodiformes as all taxa closer to Saltasaurus than to Massospondylus, and recovered Jingshanosaurus as the sister of Seitaad within it.
  - id: fernández2022a
    notes: Recovered Jingshanosaurus at the base of Sauropodiformes on a version of the Rauhut and colleagues (2020) matrix.
  - id: hu2026a
    notes: Recovered Jingshanosaurus and Seitaad as the sister group of Sauropodiformes in the narrower sense, on the sauropod side of Massospondylidae.
  - id: chapelle2018a
    notes: Recovered Jingshanosaurus and Seitaad as the sister of Massospondylidae plus Sauropodiformes.
