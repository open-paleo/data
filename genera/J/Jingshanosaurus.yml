genus: Jingshanosaurus
parent: Sauropodiformes
pronunciation:
  phonetic: JING-SHAHN-o-SAWR-us
etymology: Named after the town of Jingshan ("Golden Hill") near the fossil
  locality in Lufeng County, Yunnan, China; meaning "Jingshan lizard"
description: Jingshanosaurus is a genus of sauropodomorph dinosaurs from the
  early Jurassic period (201.4 to 196.5 million years ago, Hettangian age) of
  China. The type and only species is Jingshanosaurus xinwaensis. Its maximum
  weight was around 4.3 t (4.7 short tons) with an adult femur length of 845 mm
  (33.3 in). The genus grew up to 5 m (16 ft) long.
dispute:
  summary: >
    Jingshanosaurus xinwaensis is most commonly recovered among the
    basalmost Sauropodiformes (Jones, 2026), but Rauhut and others (2020)
    place it within Massospondylidae.
  history:
    - date: "2026-06-29"
      note: Placed at Sauropodiformes incertae sedis following the prevailing view and Jones (2026) (P3); the Massospondylidae alternative is recorded.
locomotion: facultative
