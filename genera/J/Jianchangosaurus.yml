genus: Jianchangosaurus
parent: Therizinosauria
etymology: Named after Jianchang County, Liaoning Province, China, where the type specimen was discovered; meaning "lizard from Jianchang County"
pronunciation:
  phonetic: JEE-EN-CHAN-go-SOR-us
description: Jianchangosaurus is a genus of therizinosaurian dinosaur that lived
  approximately 126 million years ago during the early part of the Cretaceous
  Period from the Yixian Formation in what is now China. The type specimen, a
  juvenile, was discovered in Jianchang County, in the western part of Liaoning
  Province. It was described in 2013 by a team of paleontologists from the
  Henan Museum, who determined that it was among the most basal therizinosaurs.
dispute:
  summary: >
    Jianchangosaurus is consistently recovered as one of the most basal
    therizinosaurs (Pu et al., 2013; Hartman et al., 2019), and that placement is
    not in question. Its validity, however, is contested: Cau (2024) argued that
    the genus is a junior synonym of Beipiaosaurus, treating its holotype as an
    immature individual, but this synonymy rests on a single analysis and has not
    been adopted by subsequent workers or reference works (e.g. Jones, 2026),
    which continue to treat Jianchangosaurus as a valid, distinct genus.
  history:
    - date: "2026-07-01"
      note: >
        Retained as a valid basal therizinosaurian within Therizinosauria; the
        synonymy with Beipiaosaurus proposed by Cau (2024) is noted but not
        adopted pending broader corroboration.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
  - forested
diagnostic_features:
  - 27 Tightly packed maxillary teeth aligned along lateral edge
  - Edentulous premaxilla
  - Short diastema in anterior dentary tip
  - Dentary teeth posterior to 7th position with reversed morphology (concave
    labial, convex lingual surfaces)
  - Down-turned anterior dentary with rostral gap and inset tooth row by shelf
  - Anterior caudal centra with oval cross-section and articular facets as tall
    as wide
  - Anterior caudal neural spines with anterior and posterior alae
  - Lack of prominent hypapophyses in anterior dorsal vertebrae
  - Manual unguals weakly curved with weak flexor tubercles
  - Straight ulnar shaft (not bowed)
  - Jugal not participating in antorbital fenestra margin
appearance:
  features:
    - downturned snout
    - keratinous beak
    - enlarged manual claws
  integument: feathered
  evidence: direct
