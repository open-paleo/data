references:
  - id: pu2013a
    notes: Named Jianchangosaurus from a juvenile skeleton and recovered it as
      the sister of Therizinosauroidea.
  - id: jones2026c
    notes: Source of the appearance features. Treats Jianchangosaurus as a valid
      basal therizinosaur.
  - id: cau2024a
    notes: Coded the Jianchangosaurus holotype in the Beipiaosaurus unit as an
      immature individual, regarding Jianchangosaurus as a junior synonym.
  - id: hartman2019a
    notes: Recovered Falcarius, Jianchangosaurus, Beipiaosaurus and Alxasaurus as
      successively closer to therizinosaurids.
  - id: liao2026a
    notes: Recovered Jianchangosaurus between Eshanosaurus and Kayrasaurus, apart from Beipiaosaurus.
  - id: kobayashi2025a
    notes: Retains Jianchangosaurus as a separate terminal.
