genus: Jeyawati
parent: Hadrosauromorpha
etymology: From the Zuni language meaning "grinding mouth"
pronunciation:
  phonetic: HEY-a-WAH-tee
description: Jeyawati is a genus of hadrosauroid dinosaur which lived during the
  Turonian stage of the Late Cretaceous. The type species, J. rugoculus, was
  described in 2010, based on fossils recovered in the U.S. state of New Mexico.
  The holotype, MSM P4166, was discovered in the Moreno Hill Formation.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
diagnostic_features:
  - Rugose texture covering entire lateral surface of postorbital from orbital
    rim to base of squamosal process
  - Large neurovascular foramen at base of jugal process of postorbital
  - Extremely slender dentary with rostrocaudal length/depth ratio of 5.6
  - Coronoid process with pronounced rostral expansion
  - High number (32) of tooth alveoli in dentary
  - Caudal extent of tooth row even with apex of coronoid process
appearance:
  integument: scaled
  evidence: inferred
