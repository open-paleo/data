genus: Juratyrant
parent: Tyrannosauroidea
etymology: "From Latin 'Jura' referring to the Jurassic period and 'tyrant',
  hence 'Jurassic tyrant'. The species name honours fossil collector Peter
  Langham, who discovered the specimen."
description: Juratyrant is a genus of tyrannosauroid dinosaur from the late
  Jurassic period (early Tithonian age) of England. The genus contains a single
  species, Juratyrant langhami, which was once classified as a species of
  Stokesosaurus.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - marine
diagnostic_features:
  - Ischial apron with folded appearance
  - Fibular flange continuing as distinct low ridge to proximal end of tibia
  - Ischial tubercle expressed as convex bulge
  - Deep fossa on lateral surface of pubis ventral to acetabulum
