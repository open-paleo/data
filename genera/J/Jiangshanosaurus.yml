genus: Jiangshanosaurus
parent: Somphospondyli
etymology: Named for Jiangshan County in Zhejiang Province, China, where the
  fossils were found, combined with Greek 'sauros' meaning 'lizard'.
pronunciation:
  phonetic: jee-AHNG-shah-no-SOR-us
description: Jiangshanosaurus is a genus of herbivorous titanosauriform sauropod
  dinosaur that lived in China approximately 92-88 million years ago, during the
  Turonian and Coniacian stages of the Late Cretaceous.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Neural arch of dorsal vertebrae with concave upper surface; laminar
    structures well developed with thin margins
  - Anterior processes of dorsal vertebrae well developed, hemispherical in
    shape; ventral surface of centrum deeply concave
  - Sternal ribs broad and flat, with conspicuous central cavity
  - Acromion of scapula relatively broad; anteroposterior width approximately
    150% of minimum scapular shaft width
  - Scapular glenoid surface inclined medially; coracoid glenoid surface
    inclined laterally; glenoid opening at right angle
  - Supracoracoideus fossa large, flat, slightly ovoid
  - Coracoid foramen positioned near center of coracoid, relatively far from
    scapular articulation
  - Anterior caudal vertebrae strongly procoelous; middle caudal vertebrae
    mildly procoelous
  - Neural arches of caudal vertebrae attached to anterior part of centrum;
    lateral fossae on caudal centra absent
