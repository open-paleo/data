genus: Jinyunpelta
parent: Ankylosaurinae
etymology: Jinyun shield
description: Jinyunpelta is a genus of herbivorous ankylosaurine thyreophoran
  dinosaur from the Cretaceous Liangtoutang Formation of Jinyun County,
  Zhejiang, China; it has one species, the type species J. sinensis. This
  species is the basalmost ankylosaur known to have had a proper tail club.
diet: herbivore
