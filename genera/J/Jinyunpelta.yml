genus: Jinyunpelta
parent: Ankylosaurinae
etymology: Named after Jinyun County, Zhejiang, China combined with Greek pelta (shield); meaning "Jinyun shield"
pronunciation:
  phonetic: JIN-yun-PEL-tuh
description: Jinyunpelta is a genus of herbivorous ankylosaurine thyreophoran
  dinosaur from the Cretaceous Liangtoutang Formation of Jinyun County,
  Zhejiang, China; it has one species, the type species J. sinensis. This
  species is the basalmost ankylosaur known to have had a proper tail club.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - lacustrine
diagnostic_features:
  - Two paranasal apertures C1 and C2 located posterior to external naris at
    same level with external naris
  - Triangular fossa on anterodorsal edge of maxilla
  - Postorbital excluded from posterior rim of orbit
  - Anterior portion of prearticular underlying posterior portion of splenial
  - Prominent scar present mediodorsal to medial condyle of femur
  - Tail club knob roughly hexagonal in dorsal view with widest point close to
    distal end
