genus: Jobaria
parent: Eusauropoda
placement: incertae sedis
dispute:
  summary: >
    Jobaria is most often recovered as a derived non-neosauropodan
    eusauropod (Sereno et al., 1999, outside the neosauropod radiation;
    Mannion et al., 2019, as sister to Cetiosauriscus), with Zhang et al.
    (2026) and Jones (2026) placing it close to or within Turiasauria; some
    analyses instead recover it as a basal macronarian (Nair and Salisbury,
    2012).
  history:
    - date: "2026-06-29"
      note: >
        Retained at Eusauropoda incertae sedis following the prevailing non-
        neosauropod view (Jones, 2026); the Turiasauria and basal-Macronaria
        alternatives are unresolved.
pronunciation:
  phonetic: joh-BAHR-ee-uh
etymology: Named after Jobar, a mythical giant beast from local Tuareg tradition in Niger, whose bones local people believed the fossils to be
description: Jobaria is a genus of sauropod dinosaur that lived in what is now
  Niger during the middle Jurassic Period, between 164 and 161 million years
  ago. Jobaria is currently the only known valid sauropod from the Tiouraren,
  where it was discovered in 1997.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Cervical prezygapophyses with accessory anterior process
  - Cervical neural arches with deep fossa between centropostzygapophyseal and
    intrapostzygapophyseal laminae
  - Dorsal prezygapophyses with broad pendant flange
  - Dorsal neural arches with fossa between parapophyses and diapophyses
  - Anterior caudal neural spines with circular fossa at base of prespinal lamina
  - Cervical ribs 3-6 with accessory anterior process
  - U-shaped first chevron
  - Midcaudal chevrons with rugose ridge across distal end of blade
