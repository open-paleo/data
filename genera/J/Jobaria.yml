etymology: Named after Jobar, a mythical giant beast from local Tuareg tradition in Niger, whose bones local people believed the fossils to be
description: Jobaria is a genus of sauropod dinosaur that lived in what is now
  Niger during the middle Jurassic Period, between 164 and 161 million years
  ago. Jobaria is currently the only known valid sauropod from the Tiouraren,
  where it was discovered in 1997.
