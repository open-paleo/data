genus: Jinbeisaurus
parent: Tyrannosauroidea
etymology: "Named for Jinbei, the northern part of Shanxi Province in China, combined with Greek 'sauros' meaning 'lizard', hence 'northern Shanxi Province lizard'."
description: Jinbeisaurus is an extinct genus of tyrannosauroid dinosaurs from
  the Upper Cretaceous Huiquanpu Formation of Shanxi Province in China. The type
  and only species is Jinbeisaurus wangi. It is the first non-avian theropod
  named from Shanxi.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Broad interfenestral strut covers >85% of cranio-caudal length of maxillary
    fenestra in lateral view
  - Antorbital fossa below fenestra deeper than subcutaneous surface posterior
    to tooth row
  - Promaxillary recess posteroventral end stops above fifth maxillary alveolus
  - Septum between promaxillary recess and maxillary antrum bears deep fossa at
    base
  - Anterior maxillary antrum nearly as large as maxillary fenestra
  - Dorsal row of dentary foramina positioned at midheight of dentary along its
    length
  - Both anterior and posterior carinae possess ~16 denticles per 5mm in maxilla
    and dentary teeth
  - Posterior process of pubic foot forms acute angle (~70°) relative to shaft
