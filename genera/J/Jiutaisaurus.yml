genus: Jiutaisaurus
parent: Titanosauriformes
etymology: "Named for Jiutai, the discovery site in Jilin, China, combined with
  Greek 'sauros' meaning 'lizard', hence 'Jiutai lizard'."
description: Jiutaisaurus is a genus of sauropod dinosaur from the Quantou
  Formation of Jilin, China. The formation dates from the Early - Late
  Cretaceous boundary. The type species, Jiutaisaurus xidiensis, was described
  by Wu et al. in 2006, and is based on eighteen vertebrae. It probably lived
  alongside Changchunsaurus and Helioceratops.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Longitudinal ridge developed on both sides of the upper lateral surface of
    middle caudal centra
  - Anterior and middle caudal vertebrae amphicoelous, with posterior cavity
    slightly deeper
  - Neural arch positioned on anterior half of centrum, occupying approximately
    half of centrum length
  - Chevrons unforked (not bifurcated) at their distal ends
  - Haemal canal of chevrons deep, length exceeding half the total chevron length
  - Caudal centra with highly porous, cancellous (honeycomb) internal bone
    texture
