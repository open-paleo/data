genus: Jiutaisaurus
parent: Titanosauriformes
etymology: "Named for Jiutai, the discovery site in Jilin, China, combined with
  Greek 'sauros' meaning 'lizard', hence 'Jiutai lizard'."
description: Jiutaisaurus is a genus of sauropod dinosaur from the Quantou
  Formation of Jilin, China. The formation dates from the Early - Late
  Cretaceous boundary. The type species, Jiutaisaurus xidiensis, was described
  by Wu et al. in 2006, and is based on eighteen vertebrae. It probably lived
  alongside Changchunsaurus and Helioceratops.
diet: herbivore
locomotion: quadrupedal
