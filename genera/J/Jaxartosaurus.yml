genus: Jaxartosaurus
parent: Lambeosaurinae
pronunciation:
  phonetic: jak-SAHR-to-SAWR-us
etymology: Named after the Jaxartes (ancient Greek name for the Syr Darya river
  in Kazakhstan); meaning "Jaxartes lizard"
description: Jaxartosaurus is a genus of hadrosaurid dinosaur similar to
  Corythosaurus which lived during the Late Cretaceous. Its fossils were found
  in Kazakhstan.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
appearance:
  features:
    - hollow cranial crest
  integument: scaled
  evidence: inferred
diagnostic_features:
  - Anterior end of the dentary strongly drawn downward, bearing a rounded
    projection along its anterior edge, unlike other lambeosaurines
  - Dentary bearing 34–35 tooth rows
  - Ischium with a closed, oval obturator foramen (round in Hypacrosaurus)
  - Humerus with a narrow, non-expanded proximal end, unlike Mandschurosaurus or
    Tanius
identifiers:
  - source: pbdb
    id: "38773"
  - source: wikidata
    id: Q134818
  - source: gbif
    id: "4823233"
species:
  - name: Jaxartosaurus aralensis
    etymology: "Named for the Aral Sea, near the discovery locality in Kazakhstan."
    status: valid
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Coniacian
        - Santonian
    location:
      country: KZ
      locality: Kyrkkuduk I
      region: KZ-61
      formation: Syuksyuk
    size:
      length_m:
        min: 9
        max: 9
    type_specimen:
      specimen_id: [ CCMGE 1/5009 ]
      specimen_type: lectotype
      institution: CCMGE
      material: Incomplete skull lacking the snout.
      notes: >-
        Riabinin (1939) founded the species on a series from collection 5009:
        the posterior part of a skull, a dentary, a surangular, vertebrae and
        limb bones. Rozhdestvensky (1968) designated the skull, No. 1/5009, at
        the museum of the Central Science and Research Institute for Geological
        Exploration in Leningrad, as the lectotype. Bell and Brink (2013) write
        it as PIN 1/5009 and report the other elements lost.
    erected_in: riabinin1937a
    described_in: riabinin1939a
references:
  - id: rozhdestvensky1968a
    notes: Designates the skull No. 1/5009 as the lectotype, at "The Museum of the
      Central Science and Research Institute for Geological Exploration
      (Leningrad)".
  - id: bell2013a
    notes: Gives the specimen as PIN 1/5009, of which "Only the skull is currently
      available for study".
  - id: riabinin1937a
  - id: riabinin1939a
  - id: jones2026a
    notes: Source of the appearance features.
  - id: nessov1995a
    notes: Gives the locality for Jaxartosaurus as Kyrkkuduk I, and the formation
      as the Syuksyuk.
