genus: Jaxartosaurus
parent: Lambeosaurinae
pronunciation:
  phonetic: jak-SAHR-to-SAWR-us
etymology: Named after the Jaxartes (ancient Greek name for the Syr Darya river
  in Kazakhstan); meaning "Jaxartes lizard"
description: Jaxartosaurus is a genus of hadrosaurid dinosaur similar to
  Corythosaurus which lived during the Late Cretaceous. Its fossils were found
  in Kazakhstan.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
appearance:
  features:
    - hollow cranial crest
  integument: scaled
  evidence: inferred
diagnostic_features:
  - Anterior end of the dentary strongly drawn downward, bearing a rounded
    projection along its anterior edge, unlike other lambeosaurines
  - Dentary bearing 34–35 tooth rows
  - Ischium with a closed, oval obturator foramen (round in Hypacrosaurus)
  - Humerus with a narrow, non-expanded proximal end, unlike Mandschurosaurus or
    Tanius
