genus: Judiceratops
parent: Chasmosaurinae
etymology: Named after the Judith River Formation (where it was found) combined with Greek ceratops (horned face); meaning "Judith River horned face"
pronunciation:
  phonetic: JOO-dee-SERR-uh-tops
  ipa: /ˌdʒuːdiːˈsɛrətɒps/
description: Judiceratops is an extinct horned dinosaur. It lived around 78
  million years ago, during the Late Cretaceous Period in what is now Montana,
  United States. Like other horned dinosaurs, Judiceratops was a large,
  quadrupedal herbivore. It is the oldest known chasmosaurine.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Caudal margin of parietal strongly convex, lacking emargination, with
    moderately thickened margin
  - Epiparietals low and lying in plane of frill
  - Anterior episquamosals enlarged; lateral episquamosals imbricated
  - Postorbital horns moderately elongate, weakly curved posteriorly, strongly
    inclined anterolaterally, with teardrop-shaped cross section
appearance:
  features:
    - brow horns
    - epoccipitals
  integument: scaled
  evidence: inferred
