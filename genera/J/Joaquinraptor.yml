genus: Joaquinraptor
parent: Megaraptoridae
pronunciation:
  phonetic: wah-KEEN-rap-tor
etymology: Named after San Joaquín, a locality in Chubut Province, Argentina, near where the fossils were found, combined with Latin raptor (thief); meaning 'Joaquín thief'
description: Joaquinraptor is an extinct genus of megaraptorid theropod
  dinosaurs known from the Late Cretaceous Lago Colhué Huapi Formation of
  Argentina. The genus contains a single species, Joaquinraptor casali,
  representing the youngest (most recent) definitive megaraptoran. It is known
  from a partially articulated, incomplete skeleton including vertebrae and
  bones of the skull, forelimbs and hindlimbs, and pectoral girdle, making it
  one of the most completely known members of the Megaraptora. It was likely at
  least 7 meters (23 ft) long.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Parietals strongly compressed transversely, narrower than frontals
  - Anterior margin of supratemporal fossa with sigmoid contour
  - Middle or posterior caudal vertebral centra with well-marked elliptical
    lateral fossae occupying more than half lateral surfaces
  - Humerus with subrectangular deltopectoral crest
  - Ulna with proximodistally enlarged olecranon process
  - Distal end of radius crescent-shaped
