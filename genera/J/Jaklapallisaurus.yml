genus: Jaklapallisaurus
parent: Unaysauridae
etymology: Named after Jaklapal village in Telangana, central India, near where the fossils were discovered, combined with Greek sauros (lizard); meaning 'Jaklapal lizard'
pronunciation:
  phonetic: yak-luh-pah-lee-sor-us
description: Jaklapallisaurus is a genus of unaysaurid sauropodomorph dinosaur.
  It lived during the Late Triassic period (early to middle Norian) in what is
  now Telangana, central India. The genus is monotypic, only including the
  species Jaklapallisaurus asymmetricus.
locomotion: bipedal
paleoenvironment:
  - fluvial
diet: herbivore
dispute:
  summary: >
    Jaklapallisaurus asymmetricus was one of the three founding members of
    Unaysauridae (Müller and others, 2018), and the redescription of its holotype
    by Ezcurra and others (2023) recovered it as a unaysaurid at the base of
    Plateosauria, in a clade sister to Plateosauridae. Support for that framework
    is weak even within the study that provides it: resampling frequencies for
    Unaysauridae and for the Unaysauridae plus Plateosauridae clade fall below
    30%, and Jaklapallisaurus was flagged as one of the unstable terminals,
    although the Jaklapallisaurus plus Macrocollum pairing itself scored higher.
    Two later analyses do not recover the taxon as a unaysaurid at all, instead
    placing it among early-branching sauropodomorphs outside Plateosauria: Wang
    and others (2025), and Barrett and others (2026), who recover a monophyletic
    Unaysauridae that excludes it.
  history:
    - date: "2026-08-04"
      note: Kept in Unaysauridae following the redescription of Ezcurra and
        others (2023), the only study dedicated to the taxon; the failure of two
        later analyses to recover it there is recorded here rather than by
        attaching the genus to a less resolved parent.
diagnostic_features:
  - Femur with distal transverse width more than 1.5 times the anteroposterior
    depth across the medial condyle
  - Medial distal condyle of the femur sub-triangular in distal view
  - Distal end of the femur with a straight anterior margin
  - Proximal end of the tibia with poorly asymmetric posterior condyles
  - Distal end of the tibia with a concave posteromedial border
  - Astragalus with the medial condyle strongly developed anteriorly (medial end
    1.6 times deeper than the lateral) and a tuber on the lateral half of the
    ventral surface
appearance:
  integument: scaled
  evidence: inferred
