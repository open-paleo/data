genus: Jaklapallisaurus
parent: Unaysauridae
etymology: Named after Jaklapal village in Telangana, central India, near where the fossils were discovered, combined with Greek sauros (lizard); meaning 'Jaklapal lizard'
pronunciation:
  phonetic: yak-luh-pah-lee-sor-us
description: Jaklapallisaurus is a genus of unaysaurid sauropodomorph dinosaur.
  It lived during the Late Triassic period (early to middle Norian) in what is
  now Telangana, central India. The genus is monotypic, only including the
  species Jaklapallisaurus asymmetricus.
locomotion: bipedal
paleoenvironment:
  - fluvial
diet: herbivore
diagnostic_features:
  - Femur with distal transverse width more than 1.5 times the anteroposterior
    depth across the medial condyle
  - Medial distal condyle of the femur sub-triangular in distal view
  - Distal end of the femur with a straight anterior margin
  - Proximal end of the tibia with poorly asymmetric posterior condyles
  - Distal end of the tibia with a concave posteromedial border
  - Astragalus with the medial condyle strongly developed anteriorly (medial end
    1.6 times deeper than the lateral) and a tuber on the lateral half of the
    ventral surface
