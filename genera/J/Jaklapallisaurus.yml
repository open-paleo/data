genus: Jaklapallisaurus
parent: Unaysauridae
etymology: Named after Jaklapal village in Telangana, central India, near where the fossils were discovered, combined with Greek sauros (lizard); meaning 'Jaklapal lizard'
pronunciation:
  phonetic: yak-luh-pah-lee-sor-us
description: Jaklapallisaurus is a genus of unaysaurid sauropodomorph dinosaur.
  It lived during the Late Triassic period (late Norian to earliest Rhaetian) in
  what is now Telangana, central India. The genus is monotypic, only including
  the species Jaklapallisaurus asymmetricus.
locomotion: bipedal
paleoenvironment:
  - fluvial
diet: herbivore
diagnostic_features:
  - Distal femur with widely transversely open popliteal fossa in distal view
  - Medial condyle of distal femur sub-triangular in distal view
  - Distal femur with straight anterior margin
  - Distal tibia with concave posteromedial border
  - Astragalar body with straight dorsal edge in posterior view
  - Medial condyle of astragalus strongly developed anteriorly, 1.6 times deeper
    than lateral
appearance:
  integument: scaled
  evidence: inferred
