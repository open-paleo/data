genus: Jinchuanloong
parent: Eusauropoda
etymology: From 'Jinchuan' (the district of Jinchang City, Gansu Province,
  where the holotype was found) and Mandarin Chinese 'loong' (dragon).
description: Jinchuanloong is an extinct genus of non-neosauropod eusauropod
  sauropod from the late Bathonian (Middle Jurassic) lower Xinhe Formation of
  Jinchuan District, Jinchang City, Gansu Province, north-western China. The
  single species, Jinchuanloong niedu, is known from a single subadult
  individual (estimated body length ~10 m) preserving a nearly complete skull
  with mandible articulated with the atlas-axis complex and the first five
  cervicals, plus 29 articulated middle and posterior caudal vertebrae. The
  phylogenetic analysis of Li et al. (2025) recovers Jinchuanloong outside
  Mamenchisauridae as the sister taxon to a Turiasauria + Neosauropoda clade.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Small, dorsoventrally elongated foramen present at the base of the nasal
    process (ascending process) of the maxilla in lateral view.
  - Anterodorsal surface of the prefrontal bears a small round aperture near the
    bifurcation of its anterior and lateral processes.
  - Postorbital very robust in lateral view; ratio of anteroposterior length to
    dorsoventral height of the posterior process of the postorbital is 0.9.
  - Posteroventral process of the jugal contributes only 22% of the ventral
    margin of the infratemporal fenestra; dorsal process of the jugal contacts
    the lacrimal and makes a small contribution to the antorbital fenestra.
