genus: Jinchuanloong
parent: Eusauropoda
pronunciation:
  phonetic: jin-CHWAHN-loong
etymology: From 'Jinchuan' (the district of Jinchang City, Gansu Province,
  where the holotype was found) and Mandarin Chinese 'loong' (dragon).
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Small, dorsoventrally elongated foramen present at the base of the nasal
    process (ascending process) of the maxilla in lateral view.
  - Anterodorsal surface of the prefrontal bears a small round aperture near the
    bifurcation of its anterior and lateral processes.
  - Postorbital very robust in lateral view; ratio of anteroposterior length to
    dorsoventral height of the posterior process of the postorbital is 0.9.
  - Posteroventral process of the jugal contributes only 22% of the ventral
    margin of the infratemporal fenestra; dorsal process of the jugal contacts
    the lacrimal and makes a small contribution to the antorbital fenestra.
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "519530"
  - source: wikidata
    id: Q134552006
species:
  - name: Jinchuanloong niedu
    etymology: From Mandarin Chinese 'nie' (nickel) and 'du' (city), referring
      to Jinchang's status as China's largest nickel-mining center.
    pronunciation:
      phonetic: NYEH-doo
    status: valid
    type_species: true
    period:
      name:
        - Middle Jurassic
      stage:
        - Bathonian
    location:
      country: CN
      region: CN-GS
      formation: Xinhe
      part: lower
    type_specimen:
      specimen_id:
        - JCMF 0132
      specimen_type: holotype
      institution: JCMF
      material: Nearly complete skull with mandible, five anteriormost cervical
        vertebrae (atlas–axis complex plus cervicals 3–5), 29 articulated middle
        and posterior caudal vertebrae, some fragmented caudal ribs and haemal
        arches.
      completeness: partial
    size:
      length_m:
        min: 10
        max: 10
      skull_length_m:
        min: 0.31
        max: 0.31
    erected_in: li2025a
references:
