genus: Jeholosaurus
parent: Jeholosauridae
pronunciation:
  phonetic: juh-HOH-lo-SAWR-us
etymology: Named after Jehol, a historical province in northeastern China
  (western Liaoning and northern Hebei), combined with Greek sauros (lizard);
  meaning 'Jehol lizard'
description: Jeholosaurus is a genus of small neornithischian dinosaur from the
  Early Cretaceous-aged Yixian Formation of what is now China.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
  - forested
diagnostic_features:
  - Six premaxillary teeth (versus higher numbers in derived ornithopods)
  - Few foramina on dorsal surface of nasal
  - Large quadrate foramen on lateral side of quadratojugal
  - Predentary about 1.5 times as long as premaxillary main body
  - Anterior intercondylar groove of femur absent
  - Metatarsals not in the same plane
  - Pedal phalanx III-4 longer than other phalanges of pedal digit III
  - Lack of external mandibular fenestra
appearance:
  features:
    - keratinous beak
  integument: scaled
  evidence: inferred
