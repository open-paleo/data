genus: Jeholosaurus
parent: Jeholosauridae
pronunciation:
  phonetic: juh-HOH-lo-SAWR-us
etymology: Named after Jehol, a historical province in northeastern China
  (western Liaoning and northern Hebei), combined with Greek sauros (lizard);
  meaning 'Jehol lizard'
description: Jeholosaurus is a genus of small neornithischian dinosaur from the
  Early Cretaceous-aged Yixian Formation of what is now China.
diet: herbivore
locomotion: bipedal
