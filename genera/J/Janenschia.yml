genus: Janenschia
parent: Eusauropoda
pronunciation:
  phonetic: yah-NEN-shee-a
etymology: Named in honor of German paleontologist Werner Janensch, who
  conducted extensive research on dinosaurs from the Tendaguru Formation of
  Tanzania
description: Janenschia is a genus of large herbivorous sauropod dinosaur from
  the Late Jurassic (around 155 to 145 million years ago) Tendaguru Formation of
  Lindi Region, Tanzania.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - coastal
diagnostic_features:
  - Astragalus low and platy, unlike that of all other sauropods
  - Anterior caudal vertebrae with strongly convex posterior and strongly
    concave anterior articular surfaces, lacking pleurocoels
  - Middle caudal vertebrae strongly pinched laterally, with weakly biconvex
    articular surfaces and a high-elliptical cross-section
  - Anterior dorsal vertebrae with nearly completely reduced neural spines and
    very robust diapophyses
  - Manus phalangeal formula 2-2-1-1-1, with only the first digit bearing a very
    large claw
  - Pes with clawed first three toes, phalangeal formula 2-3-3-2-1, and a short,
    proximally very broad metatarsal V
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "66641"
  - source: wikidata
    id: Q133039
  - source: gbif
    id: "3238566"
synonyms:
  - name: Nteregosaurus
    type: nomen nudum
    reason: Informal name used for material now considered referable to Janenschia.
