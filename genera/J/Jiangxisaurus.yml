genus: Jiangxisaurus
parent: Heyuanninae
etymology: The genus name Jiangxisaurus, refers to the Jiangxi Province of
  southern China. The specific name ganzhouensis, is derived from Ganzhou, the
  locality where the specimen was discovered. Jiangxisaurus was described and
  named by Wei Xuefang, Pu Hanyong, Xu Li, Liu Di, and Lü Junchang in 2013 and
  the type species is Jiangxisaurus ganzhouensis.
description: Jiangxisaurus is an extinct genus of oviraptorid theropod dinosaur
  from the Late Cretaceous Nanxiong Formation of southern China.
diet: omnivore
