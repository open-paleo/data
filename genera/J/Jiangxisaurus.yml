genus: Jiangxisaurus
parent: Heyuanninae
etymology: "Named after Jiangxi Province of southern China, where the specimen was found"
description: Jiangxisaurus is an extinct genus of oviraptorid theropod dinosaur
  from the Late Cretaceous Nanxiong Formation of southern China.
diet: omnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Weakly downturned mandibular symphysis (rostrum only slightly downturned,
    contrasting with strongly downturned rostrum of most oviraptorids)
  - Surangular with an elongated and concave lateral surface
  - Much elongated mandible with height-to-length ratio of approximately 20%
    (vs. 36% in Nemegtomaia)
  - Length ratio of radius to humerus approximately 70% (lowest range among
    oviraptorids)
