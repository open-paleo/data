genus: Jiangxititan
parent: Somphospondyli
etymology: Named for Jiangxi Province, China, where the fossils were found, combined with Greek 'titan' meaning 'giant'.
pronunciation:
  phonetic: jee-AHNG-shee-TIE-tuhn
description: Jiangxititan is an extinct genus of somphospondylan titanosauriform
  dinosaur from the Late Cretaceous Nanxiong Formation of China. The genus
  contains a single species, J. ganzhouensis, known from several articulated
  vertebrae with ribs. Originally described as a titanosaur, Jiangxititan was
  later suggested to be a non-titanosaurian somphospondylan.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Posterior cervical and anterior dorsal centra strongly compressed
    dorsoventrally
  - Accessory horizontal laminae within anterior dorsal pleurocoels
  - Posterior cervical and anterior dorsal neural arches low
  - Posterior cervical and anterior dorsal neural spines deeply bifurcated and
    widely separated
  - Inverted 'V' lamina present at anterior margin of bifid point in
    posteriormost cervical and anteriormost dorsal neural spines
  - Postzygapophyses in posterior cervical vertebrae fan-shaped
  - Medial and lateral spinopostzygapophyseal laminae in anterior dorsal
    vertebrae
  - Anterior dorsal rib short and gracile
