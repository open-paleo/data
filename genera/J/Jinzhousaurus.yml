genus: Jinzhousaurus
parent: Iguanodontidae
pronunciation:
  phonetic: jeen-joh-SAWR-us
etymology: Named for the town of Jinzhou in Liaoning, China, where the fossils were found, combined with Greek 'sauros' meaning 'lizard'.
description: Jinzhousaurus is a genus of hadrosauroid dinosaur of the Early
  Cretaceous of China. The type species is Jinzhousaurus yangi. The generic name
  refers to the town Jinzhou. The specific name honours Yang Zhongjian is the
  founder of Chinese paleontology. It was first described by Wang Xiao-lin and
  Xu Xing in 2001.
diet: herbivore
locomotion: facultative
