genus: Jinzhousaurus
parent: Iguanodontidae
pronunciation:
  phonetic: jeen-joh-SAWR-us
etymology: Named for the town of Jinzhou in Liaoning, China, where the fossils were found, combined with Greek 'sauros' meaning 'lizard'.
description: Jinzhousaurus is a genus of hadrosauroid dinosaur of the Early
  Cretaceous of China. The type species is Jinzhousaurus yangi. The generic name
  refers to the town Jinzhou. The specific name honors Yang Zhongjian is the
  founder of Chinese paleontology. It was first described by Wang Xiao-lin and
  Xu Xing in 2001.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - lacustrine
  - forested
diagnostic_features:
  - Antorbital fenestra absent (unique among iguanodontids, similar to
    hadrosaurids)
  - Frontal excluded from orbital formation, extending anteriorly close to
    orbit's anterior border
  - Fused frontals with sinuous posterior suture to parietal
  - Triangular maxilla in lateral view with long narrow rostral extension
  - Curved quadrate shaft
  - Supratemporal fenestra oval, narrower anteriorly, long axis anterolaterally
    oriented
  - Predentary with very weakly bifurcated ventral process
  - Dentary with straight dorsal and ventral margins (more than 16 dentary teeth
    increasing posteriorly)
appearance:
  features:
    - keratinous beak
    - thumb spike
