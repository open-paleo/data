genus: Jaculinykus
parent: Parvicursorinae
etymology: Named after Jaculus (a mythical jumping serpent) combined with Greek onyx/nykus (claw); meaning "Jaculus claw", referring to the hypertrophied first digit
pronunciation:
  phonetic: jak-yoo-lin-eye-kus
description: Jaculinykus is an extinct genus of alvarezsaurid theropod dinosaur
  from the Late Cretaceous Baruungoyot Formation of Mongolia. The genus contains
  a single species, J. yaruui, known from a nearly complete articulated skeleton
  including bones of the skull. Jaculinykus is notable for its unique hand,
  which has a hypertrophied first digit and greatly reduced second digit, which
  is intermediate between the tridactyl hand of Shuvuuia and monodactyl hand of
  Linhenykus.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - arid
diagnostic_features:
  - Dorsoventrally high narial opening of the premaxilla
  - Medially curved parasagittal crest on the parietal
  - Slender and nearly straight dentaries
  - Triangular-shaped deltopectoral crest separated from humeral head by a notch
  - Strong medial tab of metacarpal I
  - Weakly developed proximodorsal process of phalanx I-1
  - Robust medial condyle of tibia relative to fibular condyle
  - Sharply indented base of ascending process of astragalus
appearance:
  features:
    - reduced forelimbs
  integument: feathered
  evidence: inferred
