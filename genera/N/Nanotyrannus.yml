genus: Nanotyrannus
parent: Tyrannosaurinae
etymology: Originally proposed by Bakker, Williams and Currie
  (1988) as Latin nano ("small") plus tyrannus ("tyrant"); the
  derivation is now usually corrected to Greek nanos ("dwarf"
  or "pygmy") and tyrannos ("king"), in reference to the small
  body size relative to other tyrannosauroids.
pronunciation:
  ipa: /ˌnænoʊˈtaɪrænəs/
  phonetic: NAN-oh-tye-RAN-us
description: >
  Nanotyrannus is a genus of tyrannosauroid dinosaur that lived
  in what is now western North America during the Maastrichtian
  age of the Late Cretaceous, 67 to 66 million years ago. Its
  fossils are known from the Hell Creek Formation. It was one
  of the last-known non-avian dinosaurs and lived until the
  Cretaceous-Paleogene extinction event. The first named
  species, N. lancensis, was described as a new species of
  Gorgosaurus in 1946 by Charles W. Gilmore based on a single
  skull. Re-examination of the specimen in 1988 by Robert T.
  Bakker, Michael Williams and Philip J. Currie moved the
  species to a new genus of tyrannosaurid, named Nanotyrannus
  in reference to its small body size compared to other
  tyrannosaurids.
dispute:
  summary: >
    The validity of Nanotyrannus is actively contested. After the
    1988 erection of the genus, Carr (1999) and Woodward et al.
    (2020) argued that the holotype CMNH 7541 is an immature
    Tyrannosaurus rex, citing tooth-grain immaturity and femoral
    osteohistology. Longrich and Saitta (2024), Zanno and Napoli
    (2025) — who erected a second species, N. lethaeus — and
    Griffin et al. (2025, ceratobranchial histology) reaffirmed
    Nanotyrannus as a distinct, skeletally mature taxon. No broad
    consensus yet.
  history:
    - date: "2026-06-25"
      note: Placed at Tyrannosaurinae — the least-inclusive clade accepted whether Nanotyrannus is a distinct tyrannosaurine or a juvenile Tyrannosaurus; validity unresolved.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - wetland
diagnostic_features:
  - Muzzle width greatly constricted, only one fourth the
    width of the temporal region.
  - Extraordinarily wide basicranium between basitubera and
    basipterygoid processes.
  - Two large pneumatic foramina placed one behind the other
    near the midline of the basisphenoid.
  - Dorsal surface of the nasal lacks strong ridges and
    striae.
  - Parietal wing of the occiput with a sharp angle between
    dorsal and lateral edges.
  - Basicranial boxwork with flat ventral floor.
