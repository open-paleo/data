    erected_in: zanno2025a
notable_specimens:
  - nickname: Bloody Mary
    specimen_id: [NCSM 40000]
    institution: NCSM
    species: Nanotyrannus lancensis
    category: iconic
    significance: "Virtually complete Hell Creek skeleton, the most complete known specimen of the genus and part of the Dueling Dinosaurs. Histology shows 25 cyclical growth marks and skeletal maturity, with death at age 17-22, central evidence that Nanotyrannus is a valid, mature taxon distinct from Tyrannosaurus."
    discovered:
      year: 2006
    references: [zanno2025a]
references:
  - id: bakker1988b
    notes: Erects Nanotyrannus lancensis on CMNH 7541 (transferred from
      Gorgosaurus lancensis Gilmore 1946); diagnosed on muzzle constriction,
      ziphodont maxillary teeth, and basicranial pneumatic pattern.
  - id: gilmore1946a
    notes: Original description of CMNH 7541 as Gorgosaurus lancensis on a
      nearly complete skull collected by D.H. Dunkle in 1942 from Carter County,
      Montana; published posthumously.
  - id: carr1999a
    notes: "Anti-validity: 'I thus consider Nanotyrannus lancensis Bakker et al., 1988 a subjective junior synonym of Tyrannosaurus rex.' Cites immature bone grain + 13 T. rex synapomorphies in CMNH 7541."
  - id: woodward2020a
    notes: "Anti-validity histology: femur/tibia osteohistology of BMRP 2002.4.1 and 2006.4.4 shows woven-parallel cortex to periosteum with no EFS, interpreted as skeletally immature juvenile T. rex."
  - id: longrich2024d
    notes: "Pro-validity: distinct taxon differing from T. rex in >150 characters; histology interpreted as mature subadults; phylogenetic analyses suggest Nanotyrannus may lie outside Tyrannosauridae."
  - id: zanno2025a
    notes: Pro-validity. NCSM 40000 ("Bloody Mary") interpreted as mature N.
      lancensis (~700 kg); erects N. lethaeus on BMRP 2002.4.1 ("Jane"); erects
      Nanotyrannidae.
  - id: voris2025a
    notes: Excludes N. lancensis from phylogenetic analysis as "problematic";
      argues prior scoring on immature specimens confounded interrelationships
      (re Longrich and Saitta, 2024).
  - id: paul2025b
    notes: Pro-validity under the Multiple Small Theropod Taxa Hypothesis;
      treats Hell Creek small graciles as multiple non-tyrannosaurid
      eutyrannosaurs; provisional diagnoses for Nanotyrannus and Stygivenator.
  - id: griffin2025a
    notes: "Pro-validity: ceratobranchial I histology of CMNH 7541 indicates the specimen was nearing or had reached skeletal maturity, supporting taxonomic distinctness from coeval Tyrannosaurus rex."
  - id: woodward2026a
    notes: BMRP 2002.4.1 and 2006.4.4 "do not fit with other Tyrannosaurus
      specimens"; authors note data "do not directly bear on the Nanotyrannus or
      multi-taxic proposals" — agnostic but compatible.
  - id: currie1987a
    notes: Mentioned the manuscript name Clevelanotyrannus before peer review.
