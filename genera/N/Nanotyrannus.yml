        - -104.4
    holotype:
      specimen_id:
        - CMNH 7541
      specimen_type: holotype
      institution: CMNH
      material: A nearly complete skull with tightly articulated
        lower jaws (~57 cm premaxilla-to-quadrate); the right
        squamosal, postfrontal, quadratojugal and upper half of
        the right quadrate are missing, and many teeth are
        incomplete. Collected by D.H. Dunkle on 16 August 1942.
    described: 1988
    authors: Bakker, Williams & Currie
    described_in: bakker1988
  - name: Nanotyrannus lethaeus
    etymology: From Latin Lethaeus, the adjective of Lethe (the
      mythological river of forgetfulness flowing through the
      Greco-Roman underworld); the name references both the
      Hell Creek Formation and the river's mythological role.
    status: valid
    type_species: false
    period:
      name:
        - Late Cretaceous
      stage:
        - Maastrichtian
      from_ma: 67.0
      to_ma: 66.0
    location:
      country: US
      region: Montana
      formation: Hell Creek
      coordinates:
        - 45.9
        - -104.5
    holotype:
      specimen_id:
        - BMRP 2002.4.1
      specimen_type: holotype
      institution: BMRP
      material: Partial skeleton ("Jane") including skull,
        axial column, pelvic and hindlimb elements; estimated
        body mass at death ~819 kg, asymptotic adult mass
        modeled at ~1,264 kg.
    described: 2025
    authors: Zanno & Napoli
    described_in: zanno2025
