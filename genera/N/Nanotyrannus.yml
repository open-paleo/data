        - -104.4
    type_specimen:
      specimen_id:
        - CMNH 7541
      specimen_type: holotype
      institution: CMNH
      material: A nearly complete skull with tightly articulated lower jaws (~57 cm
        premaxilla-to-quadrate); the right squamosal, postfrontal, quadratojugal and
        upper half of the right quadrate are missing, and many teeth are incomplete.
      completeness: partial
    erected_in: bakker1988b
  - name: Nanotyrannus lethaeus
    etymology: From Latin Lethaeus, the adjective of Lethe (the
      mythological river of forgetfulness flowing through the
      Greco-Roman underworld); the name references both the
      Hell Creek Formation and the river's mythological role.
    status: valid
    type_species: false
    period:
