synonyms:
  - name: Gorgosaurus lancensis
    type: reassigned
    reason: Original combination established by Gilmore (1946)
      for CMNH 7541, based on apparent affinities with G.
      sternbergi and G. libratus. Bakker, Williams and Currie
      (1988) reassigned the species to a new genus
      Nanotyrannus, yielding Nanotyrannus lancensis (Gilmore,
      1946).
  - name: Clevelanotyrannus
    type: nomen nudum
    reason: Name appearing on the original submitted manuscript
      and mentioned by Currie (1987) before peer-review
      feedback led the authors to rewrite the description; the
      published 1988 paper used Nanotyrannus instead and
      Clevelanotyrannus was never validly published.
species:
  - name: Nanotyrannus lancensis
    etymology: From Latin lancensis ("of the Lance"), referring
      to the Lance Formation — Gilmore's (1946) original (and
      mistaken) attribution of the holotype's geological
      context; the actual horizon is the Hell Creek Formation.
    status: valid
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Maastrichtian
      from_ma: 67.0
      to_ma: 66.0
    location:
