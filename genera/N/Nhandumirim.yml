genus: Nhandumirim
parent: Saurischia
etymology: From Tupi nhandú ('rhea') and mirim ('small'), meaning 'small rhea'
description: Nhandumirim is a genus of basal sauropodomorph dinosaur from the
  Carnian age of Late Triassic Brazil. It is currently considered a saturnaliid
  sauropodomorph. The type and only species, Nhandumirim waldsangae, is known
  from a single immature specimen including vertebrae, a chevron, pelvic
  material, and a hindlimb found in the Santa Maria Formation in Rio Grande do
  Sul.
locomotion: bipedal
paleoenvironment:
  - fluvial
diet: carnivore
diagnostic_features:
  - Sharp longitudinal keels on ventral surfaces of proximal caudal centra
  - Brevis fossa extending for less than three-quarters of postacetabular ala
  - Dorsolateral trochanter ending well distal to femoral head level
  - Mediolaterally expanded distal tibia with tuberosity on cranial surface
  - Tabular caudolateral flange on distal tibia
  - Craniomedially oriented semicircular articular facet on distal fibula
  - Straight metatarsal IV
