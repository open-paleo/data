genus: Nemegtonykus
parent: Alvarezsauridae
dispute:
  summary: >
    Nemegtonykus citus was described as a parvicursorine forming a polytomy with
    other Gobi alvarezsaurids (Lee et al., 2019). Its position is unsettled: Kubo
    et al. (2023) recovered it outside Parvicursorinae as a successive sister
    taxon, and Meso et al. (2024) found it unstable and treated it as a junior
    synonym of Mononykus — a synonymy rejected by Lee et al. (2019) and by the
    reference-work treatment of Jones (2026), which retain it as a valid genus.
  history:
    - date: "2026-07-01"
      note: Placed at Alvarezsauridae, the least-inclusive uncontested node, following Kubo et al. (2023); its Parvicursorinae membership and the proposed Mononykus synonymy remain unresolved.
etymology: Named after the Nemegt Formation of Mongolia where it was found, combined with Greek 'onyx' (claw); meaning 'Nemegt claw'.
description: Nemegtonykus is a genus of alvarezsaurid dinosaur from the Late
  Cretaceous ( Maastrichtian) Nemegt Formation of Mongolia. The type and only
  species is Nemegtonykus citus. It is the second alvarezsaurid known from the
  Nemegt Formation, preceded by Mononykus.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Anteroposteriorly elongate and subtrapezoidal lamina on first sacral
    vertebra, co-ossified with preacetabular ilium
  - Second sacral centrum directly co-ossified with ilium without sacral rib
    contribution
  - Posterodorsally oriented postacetabular process of ilium
  - Partial plantar co-ossification between distal shafts of metatarsals II and
    IV
  - Prominent wedge-shaped tubercle on posterolateral margin of tibiotarsus near
    distal end
  - Partially co-ossified scapulocoracoid
