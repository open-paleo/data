genus: Nemegtonykus
parent: Alvarezsauroidea
etymology: Nemegt claw
description: Nemegtonykus is a genus of alvarezsaurid dinosaur from the Late
  Cretaceous ( Maastrichtian) Nemegt Formation of Mongolia. The type and only
  species is Nemegtonykus citus. It is the second alvarezsaurid known from the
  Nemegt Formation, preceded by Mononykus.
