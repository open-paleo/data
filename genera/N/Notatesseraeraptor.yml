genus: Notatesseraeraptor
parent: Neotheropoda
etymology: From Latin 'nota' (feature), 'tesserae' (mosaic tiles), and 'raptor' (thief); meaning 'feature mosaic tile thief', referencing the mixture of features from dilophosaurids and coelophysoids.
description: Notatesseraeraptor is a genus of carnivorous theropod dinosaur that
  lived during the Late Triassic of what is now Switzerland. It was found in the
  Gruhalde Member of the Klettgau Formation. It was an early member of
  Neotheropoda with affinities to Dilophosaurus and Averostra. The new genus and
  species Notatesseraeraptor frickensis was named by Marion Zahner and
  colleagues in 2019.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Supratemporal fossa restricted to posterior half of parietal (autapomorphy)
  - Four exceptionally long, slender premaxillary tooth crowns with fine
    serrations
  - Two recesses in maxillary antorbital fossa (promaxillary foramen and
    maxillary fossa)
  - Three distinct articular processes (medial, dorsolateral, dorsal)
  - Markedly low-rectangular neural spines on posterior dorsal vertebrae
  - Flattened ventral surfaces of sacral centra
  - Pronounced distal expansions ('boots') of pubis and ischium, ischial larger
    than pubic
  - Anterior caudals with longitudinal fossae on centra and neural arches
