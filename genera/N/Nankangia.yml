genus: Nankangia
parent: Oviraptoridae
etymology: Named after Nankang County (now Nankang District), Ganzhou City, Jiangxi Province, China, where the specimen was found
description: Nankangia is an extinct genus of caenagnathoid oviraptorosaurian
  dinosaur known from the Upper Cretaceous Nanxiong Formation of Nankang County,
  Ganzhou City of Jiangxi Province, southeastern China. It contains a single
  species, Nankangia jiangxiensis. N. jiangxiensis coexisted with at least four
  other caenagnathoids, including but not limited to Corythoraptor, Banji,
  Ganzhousaurus and Jiangxisaurus. The relatively short dentary and
  non-downturned mandibular symphysis of Nankangia suggest that it may have been
  more herbivorous than carnivorous. Its diet consisted of leaves and seeds.
diet: omnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Mandibular symphysis rostral end not downturned, ventral margin of dentary
    nearly straight
  - Neural spines of cranial caudal vertebrae wider transversely than
    anteroposteriorly, forming large posterior fossa with rugose central area
  - Femoral neck extending dorsomedially at angle of approximately 90 degrees to
    shaft
  - Femur and tibia approximately equal in length (ratio 0.95)
  - Two infradiapophysial fossae on ventral surface near base of transverse
    process of dorsal vertebrae
  - Pneumatic fossae on sacral vertebrae slit-like
  - Large infraprezygapophysial fossa on anterior surface and infradiapophysial
    fossa on ventral surface of base of transverse process of cranial caudals
  - Femur longer than ilium, shared with Yulong and Khaan
  - Height to length ratio of ilium 0.36
