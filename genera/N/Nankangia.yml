genus: Nankangia
parent: Oviraptoridae
etymology: Named after Nankang County (now Nankang District), Ganzhou City, Jiangxi Province, China, where the specimen was found
description: Nankangia is an extinct genus of caenagnathoid oviraptorosaurian
  dinosaur known from the Upper Cretaceous Nanxiong Formation of Nankang County,
  Ganzhou City of Jiangxi Province, southeastern China. It contains a single
  species, Nankangia jiangxiensis. N. jiangxiensis coexisted with at least four
  other caenagnathoids, including but not limited to Corythoraptor, Banji,
  Ganzhousaurus and Jiangxisaurus. The relatively short dentary and
  non-downturned mandibular symphysis of Nankangia suggest that it may have been
  more herbivorous than carnivorous. Its diet consisted of leaves and seeds.
diet: omnivore
locomotion: bipedal
