genus: Ngwevu
parent: Massospondylidae
etymology: "From Xhosa 'ngwevu' meaning 'grey' and 'intloko' meaning 'skull', giving the combined meaning 'grey skull'."
description: Ngwevu is a genus of massospondylid sauropodomorph dinosaur from
  the Lower Jurassic of South Africa. The genus contains one species, Ngwevu
  intloko.
locomotion: bipedal
paleoenvironment:
  - fluvial
  - arid
diet: herbivore
diagnostic_features:
  - cranium wider than high with width to height ratio of ±1.7
  - wide skull relative to length with width to length ratio ±0.6
  - robust postorbital
  - frontals wider than long with width to length ratio 1.15
  - proportionally wide parietals with width to length ratio 0.7
  - broad U-shaped jaw
  - procumbent dentary teeth
  - no more than 14 vertebrae between cervicodorsal transition and sacral
    vertebrae
