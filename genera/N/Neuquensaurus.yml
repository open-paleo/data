genus: Neuquensaurus
parent: Saltasaurinae
pronunciation:
  phonetic: nayoo-ken-SAWR-us
etymology: "Named for the Neuquén Province and Neuquén River of Argentina where
  its fossils were recovered, combined with Greek 'sauros' meaning 'lizard'."
description: Neuquensaurus is a genus of saltasaurid sauropod dinosaur that
  lived in the Late Cretaceous, about 80 million years ago in Argentina in South
  America. Its fossils were recovered from outcrops of the Anacleto Formation
  around Cinco Saltos, near the Neuquén river from which its name is derived.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - arid
appearance:
  integument: armored
  evidence: direct
diagnostic_features:
  - Posterior caudal centra dorsoventrally flattened
  - Fibular lateral tuberosity strongly developed
identifiers:
  - source: pbdb
    id: "64317"
  - source: wikidata
    id: Q284931
  - source: gbif
    id: "4967371"
  - source: eol
    id: "4657966"
species:
  - name: Neuquensaurus australis
    etymology: "From Latin 'australis' meaning 'southern', in reference to the South
      American provenance of the fossils."
    status: valid
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Santonian
        - Campanian
        - Maastrichtian
    location:
      country: AR
      locality: Sierra Roca
      region: AR-Q
      formation: Bajo de la Carpa
    type_specimen:
      specimen_id:
        - MLP-Ly 1
        - MLP-Ly 2
        - MLP-Ly 3
        - MLP-Ly 4
        - MLP-Ly 5
        - MLP-Ly 6
      specimen_type: holotype
      institution: MLP
      material: Six caudal vertebrae; the girdle and limb material often referred
        to the species was not directly associated with these type caudals.
      completeness: fragmentary
    size:
      hip_height_m:
        min: 2
        max: 2
      length_m:
        min: 7
        max: 9
      weight_kg:
        min: 1800
        max: 3500
    synonyms:
      - name: Titanosaurus australis
        type: reassigned
        reason: Originally described as Titanosaurus australis by Lydekker (1893);
          reassigned to the new genus Neuquensaurus by Powell (1992).
    erected_in: powell1992a
    described_in: otero2010a
references:
  - id: lydekker1893a
    notes: Original description of the species as Titanosaurus australis.
  - id: powell1986a
    notes: Unpublished doctoral dissertation that first proposed the name
      Neuquensaurus; as a thesis the name was nomenclaturally unavailable and
      the genus was formally established by Powell (1992).
  - id: powell1992a
    notes: Validly established the genus Neuquensaurus (type species Neuquensaurus
      australis), which had appeared earlier as a nomen ex dissertatione.
  - id: otero2010a
    notes: Redescription of the appendicular skeleton of Neuquensaurus.
  - id: jones2026b
    notes: Source of the hip height estimate.
  - id: leanza2004a
    notes: Places the Bajo de la Carpa at formation rank within the Río
      Colorado Subgroup, above the member rank Powell used.
