genus: Neuquensaurus
parent: Saltasaurini
etymology: "Named for the Neuquén Province and Neuquén River of Argentina where its fossils were recovered, combined with Greek 'sauros' meaning 'lizard'."
description: Neuquensaurus is a genus of saltasaurid sauropod dinosaur that
  lived in the Late Cretaceous, about 80 million years ago in Argentina in South
  America. Its fossils were recovered from outcrops of the Anacleto Formation
  around Cinco Saltos, near the Neuquén river from which its name is derived.
diet: herbivore
