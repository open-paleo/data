genus: Nemegtosaurus
parent: Nemegtosauridae
pronunciation:
  phonetic: NAY-meg-to-SAWR-us
etymology: "Named for the Nemegt Basin in the Gobi Desert of Mongolia where the
  skull was discovered, combined with Greek 'sauros' meaning 'lizard'."
description: Nemegtosaurus was a sauropod dinosaur from the Late Cretaceous
  Period of what is now Mongolia. Measuring an estimated 12-13 m (39-43 ft) long
  and weighing 20 t (44,000 lb), it was named after the Nemegt Basin in the Gobi
  Desert, where the remains - a single skull - were found. The skull resembles
  diplodocoids in being long and low, with pencil-shaped teeth. However, recent
  work has shown that Nemegtosaurus is in fact a titanosaur, closely related to
  animals such as Saltasaurus, Alamosaurus, and Rapetosaurus.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Skull strongly elongated and lightly built with long snout bent downwards
  - Accessory preorbital foramen absent
  - Palatine bones very narrow and strongly elongated longitudinally
  - Ectopterygoid absent
  - Lacrimal extensive, contributing to margin of external naris
  - Orbit very large with prefrontal entering margin of orbit and external naris
  - Supratemporal fossa very small, elongated transversely, open dorsally
  - Parietal crest very prominent
  - Occipital condyle placed far anteriorly, directed ventroanteriorly at ~100°
    to horizontal
  - Lower jaw very light with mandibular vacuity present (unique among sauropods)
  - Teeth lanceolate with crown/root length ratio of 2:1
