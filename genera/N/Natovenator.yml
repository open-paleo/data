genus: Natovenator
parent: Halszkaraptorinae
etymology: From Latin nato ('to swim') and venator ('hunter'), meaning 'swimming hunter', reflecting the proposed semi-aquatic lifestyle of this halszkaraptorine
pronunciation:
  phonetic: NAY-toe-VEN-uh-tuh
description: Natovenator is a genus of halszkaraptorine dromaeosaurid dinosaur
  from the Late Cretaceous Barun Goyot Formation of Mongolia. The genus is known
  from a single species, N. polydontus. Natovenator is crucial to the
  understanding of halszkaraptorines due to it providing more support for the
  semi-aquatic lifestyle that has been proposed for this clade. This discovery
  is important as the semi-aquatic lifestyles of halszkaraptorines (mainly
  Halszkaraptor) was contested in early 2022.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - arid
diagnostic_features:
  - Wide groove delimited by ridges on anterodorsal surface of premaxilla
  - Premaxilla with elongated internarial process overlying nasal and extending
    posterior to external naris
  - 13 premaxillary teeth with large incisiviform crowns
  - First three anteriormost maxillary teeth greatly reduced and clustered
    together
  - Anteroposteriorly long external naris (about 30% of preorbital skull length)
  - Paroccipital process with anteroposteriorly broad dorsal surface
  - Elongate maxillary process of palatine extending anteriorly beyond
    mid-antorbital fenestra
  - Pterygoid with deep fossa on medial surface of quadrate ramus
  - Posterolaterally oriented projection on lateral surface of atlas
  - Absence of pleurocoels in cervical vertebrae
  - Posterolaterally oriented and nearly horizontal proximal shafts in dorsal
    ribs
  - Hourglass-shaped metacarpal II with distinctly concave medial and lateral
    surfaces
