genus: Nemegtomaia
parent: Heyuanninae
etymology: "Named for the Nemegt Basin of Mongolia where the fossils were found,
  combined with Greek 'maia' meaning 'good mother', in reference to the brooding
  behavior of oviraptorids."
description: Nemegtomaia is a genus of oviraptorid dinosaur from what is now
  Mongolia that lived in the Late Cretaceous Period, about 72 to 70 million
  years ago. The first specimen was found in 1996, and became the basis of the
  new genus and species N. barsboldi in 2004. The original genus name was
  Nemegtia, but this was changed to Nemegtomaia in 2005, as the former name was
  preoccupied. The first part of the generic name refers to the Nemegt Basin,
  where the animal was found, and the second part means "good mother", in
  reference to the fact that oviraptorids are known to have brooded their eggs.
  The specific name honors the paleontologist Rinchen Barsbold. Two more
  specimens were found in 2007, one of which was found on top of a nest with
  eggs, but the dinosaur had received its genus name before it was found
  associated with eggs.
diet: omnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Nasopremaxillary crest with anterior margin nearly vertical
  - Nasal process of premaxilla barely exposed in dorsal view
  - Frontal anteroposterior length approximately one-quarter that of parietals
  - Prefrontal present
  - Quadrate process with convex surface projecting into quadratojugal cotyla
  - Mandibular condyles of quadrate situated rostrally to occipital condyle
