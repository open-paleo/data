notable_specimens:
  - nickname: Mary
    specimen_id: [MPC-D 107/15]
    institution: MPC
    species: Nemegtomaia barsboldi
    category: reproductive
    significance: "Referred nesting specimen found atop a probable ring of eggs with arms folded across them in a brooding posture, making Nemegtomaia the fourth oviraptorid genus found on a nest. The skeleton bears feeding traces showing it was scavenged by skin beetles."
    discovered:
      year: 2007
      by: "Federico Fanti"
    references: [fanti2012a]
