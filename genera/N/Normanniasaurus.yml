genus: Normanniasaurus
parent: Eutitanosauria
pronunciation:
  ipa: /nɔːrˈmæniəˌsɔːrəs/
  phonetic: nor-man-eye-ah-sor-us
etymology: "Derived from Normannia, the Latin name for Normandy (northwestern
  France, where the bones were discovered), and Greek sauros meaning 'lizard';
  meaning 'Normandy lizard'"
description: Normanniasaurus is an extinct genus of basal titanosaur sauropod
  known from the Early Cretaceous (Albian stage) Poudingue Ferrugineux of
  Seine-Maritime, northwestern France.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - coastal
diagnostic_features:
  - presacral vertebrae with hyposphene-hypantrum articulation
  - internal texture of presacral vertebrae cancellous
  - anterior caudal vertebrae deeply procoelous with antepostzygapophysial
    foramen
  - deep postspinal and prespinal fossae in caudals with axially elongated
    neural spine
  - middle caudal vertebrae amphicoelous with cranially inserted neural arch
  - dorsal projection of spinoprezygapophysial lamina in mid-caudals
  - ilium with craniolaterally expanded blade
appearance:
  integument: scaled
  evidence: inferred
