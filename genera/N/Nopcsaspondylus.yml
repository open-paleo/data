genus: Nopcsaspondylus
parent: Rebbachisauridae
dispute:
  summary: >
    Nopcsaspondylus is known only from a now-lost dorsal vertebra preserved in
    Nopcsa's original illustrations. It is regarded as a probable rebbachisaurid
    on the basis of those figures (Apesteguia, 2007; Royo-Torres et al., 2020),
    but the loss of the specimen and the absence of clear autapomorphies leave
    its position within the family unresolved and its validity tentative.
  history:
    - date: "2026-06-30"
      note: >
        Moved from Khebbashia to Rebbachisauridae; the lost holotype cannot be
        resolved more finely than a basal rebbachisaurid.
pronunciation:
  phonetic: NOP-chuh-SPON-dih-lus
etymology: "Named for Baron Franz Nopcsa, the paleontologist who first described the fossil material, combined with Greek 'spondylos' meaning 'vertebra'; translates as 'Nopcsa's vertebra'."
description: Nopcsaspondylus is a dubious genus of rebbachisaurid sauropod
  dinosaur from the Cenomanian-aged (Upper Cretaceous) Candeleros Formation of
  Neuquén, Argentina. It is based on a now-lost back vertebra described by
  Nopcsa in 1902 but not named at the time. The specimen had a small vertebral
  body and large hollows, now known to be typical of rebbachisaurids.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - arid
diagnostic_features:
  - mid to posterior dorsal vertebrae with very reduced centra
  - forked medial centropostzygapophyseal lamina
  - lateral lamina of the neural spine formed by spinodiapophyseal lamina plus
    lateral spinopostzygapophyseal lamina
