genus: Nopcsaspondylus
parent: Rebbachisauridae
placement: incertae sedis
pronunciation:
  phonetic: NOP-chuh-SPON-dih-lus
etymology: "Named for Baron Franz Nopcsa, the paleontologist who first described the fossil material, combined with Greek 'spondylos' meaning 'vertebra'; translates as 'Nopcsa's vertebra'."
description: Nopcsaspondylus is a dubious genus of rebbachisaurid sauropod
  dinosaur from the Upper Cretaceous of Neuquén, Argentina. It is based on a now-lost back vertebra described by
  Nopcsa in 1902 but not named at the time. The specimen had a small vertebral
  body and large hollows, now known to be typical of rebbachisaurids.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - arid
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "140520"
  - source: wikidata
    id: Q2102851
  - source: gbif
    id: "4967479"
species:
  - name: Nopcsaspondylus alarconensis
    etymology: "Named for Barda Alarcón, in Neuquén, Argentina, the locality to which the holotype vertebra was long attributed."
    status: nomen dubium
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Cenomanian
    location:
      country: AR
      locality: near Villa El Chocón
      region: AR-Q
      notes: Canale and colleagues place the 1889 discovery near Villa El
        Chocón from Zapalowicz's own report and travel diary, displacing
        the Barda Alarcón that entered the literature with Huene. They
        presume the basal Huincul where Apesteguía presumed the
        Candeleros, and neither is stated outright.
    type_specimen:
      specimen_type: holotype
      institution: IPUW
      status: lost
      material: Single dorsal vertebra figured by Nopcsa (1902); never formally cataloged
      completeness: fragmentary
    erected_in: apesteguía2007a
references:
  - id: apesteguía2007a
  - id: canale2024a
  - id: nopcsa1902a
  - id: lerzo2026a
    notes: Finds no autapomorphy in the vertebra, its features being widespread
      among rebbachisaurids, and rules the genus a nomen dubium.
