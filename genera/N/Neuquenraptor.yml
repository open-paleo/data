genus: Neuquenraptor
parent: Unenlagiinae
etymology: Meaning 'Neuquén thief'; from Neuquén Province, Argentina, where it was found, combined with Latin raptor ('thief' or 'plunderer')
pronunciation:
  phonetic: NEW-kin-RAP-tuhr
description: Neuquenraptor is a genus of unenlagiine theropod dinosaurs that
  lived in South America during the Late Cretaceous in what is now the
  Portezuelo Formation of Argentina. It is one of the first dromaeosaurids found
  in the Southern Hemisphere.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - metatarsal II with lateral expansion over caudal surface of metatarsal III
    (autapomorphic)
  - metatarsal III proximally pinched
  - extensor sulcus on proximal half of metatarsus
  - distal end of metatarsal III incipiently ginglymoid (lesser degree than
    other dromaeosaurids)
  - pedal digit II with phalanges 1 and 2 sub-equal in length bearing trenchant
    ungual phalanx
