genus: Nagatitan
parent: Euhelopodidae
etymology: From Nāga, the mythological serpent-like creature of various
  Asian cultures (especially northeastern Thailand), and Greek 'titan'
  meaning 'giant'.
pronunciation:
  phonetic: NA-guh-TIE-tuhn
description: Nagatitan is an extinct genus of euhelopodid sauropod
  dinosaur known from the Early Cretaceous (Aptian–Albian) Khok Kruat
  Formation of Thailand. The genus contains a single species, Nagatitan
  chaiyaphumensis, known from a partial postcranial skeleton. With an
  estimated body length of about 27 meters and a mass of 25–28 tonnes,
  it is the largest dinosaur currently known from Southeast Asia.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - arid
diagnostic_features:
  - Hyposphene of middle dorsal vertebrae triangular, becoming a vertical
    ridge in posterior dorsal vertebrae (two distinct hyposphene
    morphologies within the dorsal series).
  - Triangular anterior aliform processes on posterior dorsal neural
    spines, formed by the convergence of the SPRL and aSPDL at the
    ventral margin of the process.
  - Spinopostzygapophyseal laminae of middle and posterior dorsal neural
    spines divided into lateral and medial branches throughout their
    entire length.
  - Prominent bulge on the posterolateral margin of the humerus,
    approximately level with the deltopectoral crest, interrupting the
    lateral humeral margin in anterior view.
  - Distal end of pubis transversely expanded along the lateral surface
    relative to the shaft.
  - Proximal third of femur with anteroposteriorly narrowed lateral
    margin forming a flange-like trochanteric shelf bounded medially by
    a vertical ridge.
