genus: Niobrarasaurus
parent: Nodosauridae
pronunciation:
  phonetic: nie-o-BRAHR-a-SAWR-us
etymology: Named after the Niobrara Formation of Kansas where its fossils were found, combined with Greek 'sauros' (lizard); meaning 'Niobrara lizard'.
description: Niobrarasaurus is an extinct genus of nodosaurid ankylosaurian
  dinosaur which lived during the Late Cretaceous, around 87 to 82 million years
  ago. Its fossils were found in the Smoky Hill Chalk Member of the Niobrara
  Formation, in western Kansas, which would have been near the middle of the
  Western Interior Seaway during the Late Cretaceous. It was probably closely
  related to Nodosaurus.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - marine
diagnostic_features:
  - Armor on snout composed of two pairs of elongated scutes rather than one
    pair as in other nodosaurids
  - Secondary palate extending caudally further than in other nodosaurids
  - Caudal vertebral neural spines short and terminating in expanded knob,
    resembling Edmontonia
  - Anterior caudal vertebral transverse processes projecting backwards rather
    than forwards
  - Humerus with shallower olecranon notch between radial and ulnar condyles
    compared to similar nodosaurids
  - Deltopectoral crest undifferentiated from humeral head by a step
  - Fourth trochanter on femur with medial expansion approximately one-third
    down shaft
  - Large triangular armor spines with hollow rather than solid base
