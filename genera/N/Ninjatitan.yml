genus: Ninjatitan
parent: Titanosauria
pronunciation:
  phonetic: NIN-juh-TIE-tan
etymology: "Named for 'Ninja', a nickname of Argentine paleontologist Sebastian Apesteguia, combined with Latin 'titan' meaning 'giant'; translates as 'Ninja giant'."
description: Ninjatitan is an exinct genus of titanosaurian sauropod dinosaur
  from the Early Cretaceous (Berriasian-Valanginian age) Bajada Colorada
  Formation of Argentina. The genus contains a single species, Ninjatitan
  zapatai, which was named and described in 2021 based on a partial postcranial
  skeleton discovered in 2014. Its generic name comes from a nickname of
  Argentine paleontologist Sebastian Apesteguia, and the specific name comes
  from technician Rogelio Zapata.
dispute:
  summary: >
    Placed within Titanosauria as incertae sedis. Potentially the oldest known
    titanosaur, Ninjatitan is known from fragmentary remains and its precise
    position is poorly resolved: the describing authors (Gallina et al., 2021)
    recovered two hypotheses, a very basal titanosaur or a lognkosaurian, and a
    later analysis (Moreno et al., 2023) recovered it within Rinconsauria. A
    basal position within Titanosauria is currently favored, as a derived (Late
    Cretaceous) subfamily placement would be hard to reconcile with its Early
    Cretaceous age.
  history:
    - date: "2026-06-30"
      note: >
        Placed at Titanosauria incertae sedis; basal-titanosaur, lognkosaurian,
        and rinconsaurian positions have all been recovered.
diet: herbivore
locomotion: quadrupedal
