genus: Ninjatitan
parent: Titanosauria
placement: incertae sedis
pronunciation:
  phonetic: NIN-juh-TIE-tan
etymology: "Named for 'Ninja', a nickname of Argentine paleontologist Sebastian Apesteguia, combined with Latin 'titan' meaning 'giant'; translates as 'Ninja giant'."
description: Ninjatitan is an exinct genus of titanosaurian sauropod dinosaur
  from the Early Cretaceous (Berriasian-Valanginian age) Bajada Colorada
  Formation of Argentina. The genus contains a single species, Ninjatitan
  zapatai, which was named and described in 2021 based on a partial postcranial
  skeleton discovered in 2014. Its generic name comes from a nickname of
  Argentine paleontologist Sebastian Apesteguia, and the specific name comes
  from technician Rogelio Zapata.
dispute:
  summary: >
    Placed within Titanosauria as incertae sedis. Potentially the oldest known
    titanosaur, Ninjatitan is known from fragmentary remains and its precise
    position is poorly resolved: the describing authors (Gallina et al., 2021)
    recovered two hypotheses, a very basal titanosaur or a lognkosaurian, and a
    later analysis (Pérez Moreno et al., 2023) recovered it within Rinconsauria.
    Mannion and Carvalho (2026) instead recovered Ninjatitan outside Titanosauria
    altogether and raised the possibility that its holotype is a chimera. A basal
    position within Titanosauria is currently favored, as a derived (Late
    Cretaceous) subfamily placement would be hard to reconcile with its Early
    Cretaceous age.
  history:
    - date: "2026-06-30"
      note: >
        Placed at Titanosauria incertae sedis; basal-titanosaur, lognkosaurian,
        and rinconsaurian positions have all been recovered, and Mannion and
        Carvalho (2026) recover it outside Titanosauria.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
appearance:
  integument: scaled
  evidence: inferred
diagnostic_features:
  - Anterior-middle dorsal vertebra with well-developed lateral and medial
    centropostzygapophyseal laminae enclosing a marked, deep
    centropostzygapophyseal fossa
  - Anterior-middle dorsal vertebra with the medial centropostzygapophyseal
    lamina dorsally and ventrally widened, extending to contact the dorsal rim
    of the cotyle
  - Anterior dorsal vertebra with the medial centropostzygapophyseal lamina
    delimiting a single fossa in which the neural canal is inset
  - Anterior-middle dorsal vertebra with a dorsally acuminate neural canal fossa
  - Middle dorsal vertebra with three keels and two longitudinal shallow grooves
    on the ventral surface of the centrum
