genus: Nedcolbertia
parent: Coelurosauria
pronunciation:
  phonetic: ned-kohl-BER-tee-a
etymology: Named in honour of Edwin H. 'Ned' Colbert, the prominent American
  vertebrate paleontologist
description: Nedcolbertia is a genus of theropod dinosaur from the Early
  Cretaceous (Valanginian-aged) Cedar Mountain Formation of Utah. The type and
  only described species so far is N. justinhofmanni, known from at least three
  partial skeletons.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Small, lightly built cursorial theropod with simple pneumatic dorsal
    vertebrae
  - Manus with long slender phalanges and deep raptorial first manual ungual
    with prominent flexor tubercle
  - Slender second manual ungual indicating differentiated manual unguals
  - Femur medially bowed with femoral head inclined below greater trochanter
  - Fourth trochanter well developed on proximal half of femur
  - Tibia and fibula longer than femur
  - Metatarsals closely appressed except at distal end with third metatarsal
    narrowed proximally
  - Pes unguals long, asymmetrical, triangular in cross-section with ventral pits
