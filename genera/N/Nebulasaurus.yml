genus: Nebulasaurus
parent: Eusauropoda
etymology: misty cloud lizard
description: Nebulasaurus is an extinct genus of basal eusauropod dinosaur known
  from the early Middle Jurassic Zhanghe Formation (Aalenian or Bajocian stage)
  of Yunnan Province, China. It is known only from the holotype braincase
  LDRC-v.d.1. A phylogenetic analysis found Nebulasaurus to be a sister taxon to
  Spinophorosaurus from the Middle Jurassic of Africa. This discovery is
  significant paleontologically because it represents a clade of basal
  eusauropods previously unknown from Asia.
diet: herbivore
