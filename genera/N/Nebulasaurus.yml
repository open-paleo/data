genus: Nebulasaurus
parent: Eusauropoda
etymology: "From Latin 'nebulae' meaning 'misty cloud', in reference to Yunnan Province (meaning 'southern misty cloudy province') where the fossil was found, combined with Greek 'sauros' meaning 'lizard'."
pronunciation:
  phonetic: NEB-yuh-luh-SOR-us
description: Nebulasaurus is an extinct genus of basal eusauropod dinosaur known
  from the early Middle Jurassic Zhanghe Formation (Aalenian or Bajocian stage)
  of Yunnan Province, China. It is known only from the holotype braincase
  LDRC-v.d.1. A phylogenetic analysis found Nebulasaurus to be a sister taxon to
  Spinophorosaurus from the Middle Jurassic of Africa. This discovery is
  significant paleontologically because it represents a clade of basal
  eusauropods previously unknown from Asia.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Exoccipitals nearly excluding supraoccipital from foramen magnum
    (supraoccipital forming <10% of margin)
  - Supraoccipital not expanded laterally between parietal and exoccipital
  - Frontoparietal fenestra larger than postparietal foramen, both present at
    midline
  - Incipient crista interfenestralis incompletely partitioning fenestra ovalis
    and jugular foramen
  - Craniopharyngeal foramen posterior to basal tubera
