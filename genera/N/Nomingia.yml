genus: Nomingia
parent: Caenagnathidae
pronunciation:
  ipa: /noʊˈmɪŋɡiə/
  phonetic: no-MING-gee-uh
etymology: Named after the Nomingiin Gobi (one of the 'Thirty-Three Gobis' of
  the Gobi Desert) where the holotype was found
description: Nomingia is a genus of oviraptorosaurian theropod dinosaur known
  from the Late Cretaceous Bugin Tsav Beds of Mongolia.
dispute:
  summary: >
    Nomingia was originally described as an oviraptorid but is now generally
    recovered as a caenagnathid (Funston et al., 2018; Funston, 2020). Its
    validity is also questioned: Funston et al. (2021) suggested that Nomingia is
    a junior synonym of Elmisaurus, in which case the older name would take
    priority, and Hao et al. (2025) followed this by merging its scores into
    Elmisaurus. It is retained here as a valid caenagnathid pending broader
    acceptance of the synonymy.
  history:
    - date: "2026-07-01"
      note: >
        Placed at Caenagnathidae; the proposed synonymy with Elmisaurus (Funston
        et al., 2021) is noted but not adopted.
diet: omnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Tail composed of only 24 vertebrae with last five fused into dagger-like
    pygostyle
  - Chevrons wide and dorsoventrally elongate on most caudals, equilateral
    rectangles on last three or four
  - Pelvis weakly propubic with pubic axis at ~20° to vertical
  - Dorsal iliac margin convex along preacetabular process, horizontal along
    postacetabular process
  - Preacetabular process approximately 25% longer than postacetabular process
  - Postacetabular process equally deep along entire length
  - Iliac process of pubis twice as long as iliac process of ischium
  - Pneumatized proximal caudals
  - Deep cervicodorsal hypapophyses
appearance:
  integument: feathered
  evidence: inferred
