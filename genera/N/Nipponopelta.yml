genus: Nipponopelta
parent: Nodosauridae
pronunciation:
  phonetic: NIP-on-o-PEL-tuh
etymology: "From Japanese 'Nippon' (Japan) and Greek 'pelta' (shield); meaning
  'Japanese shield'."
description: Nipponopelta is an extinct genus of nodosaurid ankylosaurian
  dinosaur known from the Late Cretaceous (Cenomanian age) Hikagenosawa
  Formation of the Yezo Group in Japan. The genus contains a single species,
  Nipponopelta yezoensis, known from a partial skull and fragmentary associated
  remains. It is the first ankylosaur to be named from Japan.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - coastal
diagnostic_features:
  - Quadrate anterior surface is lateromedially concave, giving the quadrate an
    overall half-pipe shape.
  - Paroccipital process bears a well-developed ridge forming a slightly
    horizontal shelf together with the supraoccipital.
  - Paroccipital processes extend posterolaterally in ventral view.
  - Lateral surface of the braincase bears a prominent, gently swollen ridge
    running anteroposteriorly.
  - Maxillary and dentary tooth crown striations are not confluent with the
    denticles.
  - Teeth have large crowns and sigmoid roots.
  - Anterior margin of the neural arch of the atlas is concave.
appearance:
  features:
    - osteoderms
  integument: armored
  evidence: direct
