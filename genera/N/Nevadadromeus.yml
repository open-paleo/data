genus: Nevadadromeus
parent: Thescelosaurinae
etymology: Named after Nevada, the US state where it was found, combined with Greek 'dromeus' (runner); meaning 'Nevada runner'.
pronunciation:
  phonetic: nuh-VAH-duh-DROH-me-us
description: Nevadadromeus is an extinct genus of small thescelosaurine
  ornithischian dinosaur, from the Willow Tank Formation of Nevada, United
  States. The genus contains a single species, N. schmitti, which represents the
  first non-avian dinosaur named from Nevada.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Femoral head projects from plane of shaft at angle slightly more obtuse than
    100° and sits slightly above level of greater trochanter
  - Femoral neck with little constriction nor tuberosities
  - Greater trochanter anteroposteriorly expanded, robust, and slightly concave
    on lateral surface
  - Lesser trochanter separated from greater trochanter by prominent and deep
    intertrochanteric notch, reaching triangular apex at roughly same level as
    top of greater trochanter
  - Lesser trochanter base projects anteriorly away from greater trochanter,
    sweeping posteriorly toward it along its length
appearance:
  integument: scaled
  evidence: inferred
