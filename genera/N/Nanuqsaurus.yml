genus: Nanuqsaurus
parent: Tyrannosaurinae
etymology: "From Inupiaq 'nanuq' (polar bear) and Greek 'sauros' (lizard); meaning 'polar bear lizard', referring to its Arctic Alaska discovery locality."
pronunciation:
  phonetic: na-nook-SOR-us
description: Nanuqsaurus is a genus of tyrannosaurine theropod dinosaur known
  from the Late Cretaceous (Latest Campanian age) Prince Creek Formation of the
  North Slope of Alaska. It contains a single species, Nanuqsaurus hoglundi,
  known from a partial skull and multiple undescribed postcranial and teeth
  elements.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - polar
diagnostic_features:
  - Thin, rostrally-forked median spur of fused parietals that overlaps and
    separates frontals within sagittal crest
  - Frontal with long, rostrally-pointed process separating prefrontal and
    lacrimal facets
  - First two dentary teeth/alveoli much smaller than teeth 3-9 in mature
    individuals; alveolus 1 less than 35% mesiodistal length of alveolus 3 and
    25% or less of alveolus 4; alveolus 2 less than 50% of alveolus 3 and 33% or
    less of alveolus 4
appearance:
  integument: feathered
  evidence: direct
