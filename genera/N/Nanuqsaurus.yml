genus: Nanuqsaurus
parent: Tyrannosaurinae
etymology: "From Inupiaq 'nanuq' (polar bear) and Greek 'sauros' (lizard); meaning 'polar bear lizard', referring to its Arctic Alaska discovery locality."
description: Nanuqsaurus is a genus of tyrannosaurine theropod dinosaur known
  from the Late Cretaceous (Latest Campanian age) Prince Creek Formation of the
  North Slope of Alaska. It contains a single species, Nanuqsaurus hoglundi,
  known from a partial skull and multiple undescribed postcranial and teeth
  elements.
diet: carnivore
