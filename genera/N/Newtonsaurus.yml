genus: Newtonsaurus
parent: Neotheropoda
dispute:
  summary: >
    Newtonsaurus cambrensis was revalidated as a distinct neotheropod,
    tentatively a coelophysoid, by Evans and others (2025), who reject
    earlier megalosauroid referrals; Jones (2026) still treats it as a nomen
    dubium.
  history:
    - date: "2026-06-30"
      note: >
        Placed at Neotheropoda following the dedicated redescription.
etymology: From 'Newton' (honoring British paleontologist Edwin Tully Newton,
  1840-1930, of the Geological Survey, who first described the holotype) and
  Greek 'sauros' (lizard).
pronunciation:
  phonetic: NYOO-ton-SOR-us
description: Newtonsaurus is an extinct genus of large neotheropod dinosaur
  from the Rhaetian (Late Triassic) Cotham Member of the Lilstock Formation,
  Penarth Group, recovered at Stormy Down near Bridgend in South Wales. The
  single species, Newtonsaurus cambrensis, is known from a natural mold of a
  left dentary preserved as two blocks of sandstone (basionym 'Zanclodon'
  cambrensis Newton 1899); Evans, Howells, Wintle and Benton (2025)
  re-evaluated the holotype and erected the new genus, recovering the taxon
  tentatively as a coelophysoid with morphological affinity to Dilophosaurus,
  although a stem-averostran position cannot be excluded. The estimated body
  length of 5-7 m, derived from a ~28 cm preserved dentary representing
  roughly half the mandible, makes Newtonsaurus a candidate for the largest
  known Late Triassic theropod. The genus name had been used as a nomen nudum
  in private compilations since 1999 and is formally established by this
  paper.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - coastal
  - marine
diagnostic_features:
  - Anterior tip of dentary modestly expanded but not bulbous, forming a low
    dorsal convexity with its apex at the third tooth position.
  - 16-17 dentary alveoli present, with the third (second as preserved)
    alveolus distinctly enlarged and subcircular in outline.
  - Lateral foramina along the labial groove anteroposteriorly elongated
    (elliptical, ~1.5 cm long) rather than circular.
  - Single Meckelian foramen at the anterior terminus of the Meckelian groove,
    level with the third alveolus.
  - Unfused, sub-pentagonal interdental plates separated from the medial
    dentary wall by a narrow paradental groove open for its entire length.
  - Relative mandible depth (depth/length ratio ~17.8%) intermediate between
    that of shallow coelophysoid forms and deeper-jawed forms.
