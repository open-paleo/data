genus: Nodocephalosaurus
parent: Ankylosaurinae
pronunciation:
  phonetic: NOH-do-SEF-a-lo-SAWR-us
etymology: From Latin 'nodus' (knob), Greek 'kephale' (head), and Greek 'sauros' (lizard); meaning 'knob headed lizard', referring to the nodular ornamentation on its skull.
description: Nodocephalosaurus is a monospecific genus of ankylosaurid dinosaur
  from New Mexico that lived during the Late Cretaceous (late Campanian to early
  Maastrichtian stage, 73.49 to 72 Ma) in what is now the De-na-zin member of
  the Kirtland Formation. The type and only species, Nodocephalosaurus
  kirtlandensis, is known only from a partial skull. It was named in 1999 by
  Robert M. Sullivan. Nodocephalosaurus has an estimated length of 4.5 meters
  (15 feet) and weight of 1.5 tonnes (3,306 lbs). It is closely related and
  shares similar cranial anatomy to Akainacephalus.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Semi-inflated to bulbous polygonal osteoderms fused to nasal, frontal and
    supraorbital regions of skull
  - Prominent quadratojugal protuberance directed anteroventrally
  - Prominent post-maxillary/lacrimal ridge (osteoderm) unique to this taxon
