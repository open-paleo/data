genus: Nanshiungosaurus
parent: Therizinosauridae
etymology: Nanxiong's lizard
description: Nanshiungosaurus is a genus of therizinosaurid that lived in what
  is now Asia during the Late Cretaceous of South China. The type species,
  Nanshiungosaurus brevispinus, was first discovered in 1974 and described in
  1979 by Dong Zhiming. It is represented by a single specimen preserving most
  of the cervical and dorsal vertebrae with the pelvis. A supposed and unlikely
  second species, "Nanshiungosaurus" bohlini, was found in 1992 and described in
  1997. It is also represented by vertebrae but this species however, differs in
  geological age and lacks authentic characteristics compared to the type,
  making its affinity to the genus unsupported.
diet: herbivore
