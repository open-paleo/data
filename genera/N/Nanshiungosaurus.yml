genus: Nanshiungosaurus
parent: Therizinosauridae
pronunciation:
  phonetic: NAHN-SHYUNG-o-SAWR-us
etymology: Named after Nanxiong (formerly romanized as Nanshiung), a city in
  Guangdong Province, China, where it was discovered, combined with Greek
  'sauros' (lizard); meaning 'Nanxiong's lizard'.
description: Nanshiungosaurus is a genus of therizinosaurid that lived in what
  is now Asia during the Late Cretaceous of South China. The type species,
  Nanshiungosaurus brevispinus, was first discovered in 1974 and described in
  1979 by Dong Zhiming. It is represented by a single specimen preserving most
  of the cervical and dorsal vertebrae with the pelvis. A supposed and unlikely
  second species, "Nanshiungosaurus" bohlini, was found in 1992 and described in
  1997. It is also represented by vertebrae but this species however, differs in
  geological age and lacks authentic characteristics compared to the type,
  making its affinity to the genus unsupported.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
appearance:
  integument: feathered
  evidence: inferred
diagnostic_features:
  - Cervical centra platycoelous anteriorly and opisthocoelous posteriorly, with
    undeveloped pleurocoels and low, non-bifid neural spines; cervical centra
    about 2.5 times the length of the dorsals
  - Dorsal centra platycoelous and roughly as high as long, with shallow
    pleurocoels and low neural spines transversely broadened into a thick apex
  - Five solidly fused sacral centra with short, fused neural spines bearing
    inflated, saddle-shaped apices
  - Ilium low and elongated with a strongly developed, narrow, elongated
    preacetabular process and a straight, robust pubic peduncle
  - Pubis linear with a thick lateral margin and a closed obturator foramen;
    ischium a thin plate with expanded, distally fused ends
