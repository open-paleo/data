genus: Nothronychus
parent: Therizinosauridae
pronunciation:
  phonetic: noh-THRON-i-kus
etymology: "From Greek 'nothros' meaning 'slothful' and 'onyx' meaning 'claw';
  translates as 'slothful claw', a reference to its therizinosaur-like elongated
  claws and presumed slow-moving herbivorous habits."
description: Nothronychus is a genus of therizinosaurid theropod dinosaurs that
  lived in North America during the Late Cretaceous period. The type species,
  Nothronychus mckinleyi, was described by James Kirkland and Douglas G. Wolfe
  in 2001. It was recovered near New Mexico's border with Arizona, in an area
  known as the Zuni Basin, from rocks assigned to the Moreno Hill Formation,
  dating to the Turonian stage of the Late Cretaceous. A second specimen,
  described in 2009 as a second species, Nothronychus graffami, was found in the
  Tropic Shale of Utah, dating to between one million and 500,000 years older
  than N. mckinleyi.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Distinctly subcircular obturator process of the ischium.
  - Ovoid, dorsoventrally elongate obturator foramen, its maximum length more
    than 200% of its maximum width.
  - Contact between the pubis and ischium restricted to the proximal half of the
    obturator process.
  - Deep notch between the ventral aspect of the obturator process and the
    cranial ischial shaft.
  - In the type species N. mckinleyi, the ventral notch between the obturator
    process and the iliac shaft is craniocaudally narrow (wide in N. graffami),
    the cranial caudal centra are platycoelous, and the caudal centra bear a
    hypertrophied caudoventral heel about one-third the centrum length.
  - In N. mckinleyi, the glenoid lacks a caudal buttress and the caudal process
    of the ischium is poorly defined and elongate, extending to the shaft
    opposite the obturator process.
