      stage:
        - Turonian
      from_ma: 93.9
      to_ma: 89.8
    location:
      country: US
      region: US-UT
      formation: Tropic Shale
      locality: Kaiparowits Basin, Kane County
    type_specimen:
      specimen_id:
        - UMNH VP 16420
      specimen_type: holotype
      institution: UMNH
      material: Nearly complete postcranial skeleton, including cervical, dorsal,
        sacral and caudal vertebrae, pectoral girdle, forelimbs, pelvis,
        hindlimbs and pes; skull not preserved
    diagnostic_features:
      - Cranial caudal vertebral centra strongly amphicoelous (platycoelous in
        N. mckinleyi)
      - Caudoventral aspect of the caudal centra poorly developed (hypertrophied
        heel about one-third the centrum depth in N. mckinleyi)
      - Glenoid with a pronounced caudal buttress (absent in N. mckinleyi)
      - Ventral notch between the obturator process and iliac shaft
        craniocaudally wide (narrow in N. mckinleyi)
      - Pubic boot with a diminutive caudal process bearing a dorsally convex
        ventral margin
      - Subtriangular caudal process of the ischium diminutive (less than 5% of
        ischium length), located proximal to the obturator foramen
    erected_in: zanno2009a
    described_in: hedrick2015a
