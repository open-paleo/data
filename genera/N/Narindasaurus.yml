genus: Narindasaurus
parent: Turiasauria
etymology: Named after Narinda Bay in northwestern Madagascar, where its fossils were collected, combined with Greek 'sauros' (lizard); meaning 'Narinda Bay lizard'.
description: Narindasaurus is a genus of turiasaurian sauropod dinosaur from the
  Middle Jurassic Isalo III Formation of Madagascar. The type and only species
  is Narindasaurus thevenini. The only known specimen of the genus was first
  described in 1907, but it was not formally named as a distinct species until
  2020.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Middle-anterior caudal vertebrae with asymmetric lateral fossa set in
    posterior position
  - Longitudinal ridge on lateral face of pubis from obturator foramen to distal
    end
  - Perpendicular angle between ischial articulation and posterior pubic
    symphysis
  - Distal end of pubis with obtuse angle between ventral and anterior surfaces
  - Outwardly developed triangular lateral trochanter of fibula
