genus: Nullotitan
parent: Lithostrotia
etymology: Named in honor of geologist Francisco Nullo, combined with Greek 'titan' (giant); meaning 'Nullo's giant'.
description: Nullotitan is an extinct genus of lithostrotian titanosaur
  dinosaurs from the Late Cretaceous Chorrillo Formation of Santa Cruz Province,
  Argentina. The genus contains a single species, Nullotitan glaciaris. It was a
  contemporary of the ornithopod Isasicursor, which was described in the same
  paper.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Anterior caudal centra notably anteroposteriorly short with transverse
    diameter duplicating anteroposterior length
  - Proximal and mid-caudal centra with lateral and ventral surfaces profusely
    excavated by large blind depressions
  - Mid-caudal vertebrae with large tabicate fossa below transverse process
  - All caudal vertebrae centra lacking pneumatization
  - Mid-caudals with deep ventral longitudinal furrow surrounded by thick
    longitudinal ridges
  - Fibula with pronounced sigmoid curvature in anterior or posterior view
  - Distal tibia end strongly anteroposteriorly compressed and more transversely
    expanded than other titanosaurs
