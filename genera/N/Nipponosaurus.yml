      confirms Nipponosaurus as a valid lambeosaurine and provides a revised
      diagnosis.
  - id: takasaki2017a
    notes: Osteohistology confirms a juvenile holotype; provides an
      ontogeny-independent amended diagnosis and recovers a basal lambeosaurine
      position, unlike Suzuki et al. 2004.
