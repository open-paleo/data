genus: Nipponosaurus
parent: Lambeosaurinae
pronunciation:
  phonetic: NIP-on-o-SAWR-us
etymology: "Named for Nippon (Japan), the country that controlled Sakhalin
  Island where the fossils were found at the time of description, combined with
  Greek 'sauros' meaning 'lizard'."
description: Nipponosaurus is a lambeosaurine hadrosaur from sediments of the
  Yezo Group, in Sinegorsk on the island of Sakhalin, which was part of Japan at
  the time of the species' classification. The type and only species is N.
  sachalinensis, known only from a single juvenile specimen discovered in 1934
  and named in 1936, by Takumi Nagao, with further material of the same
  individual found in 1937. Since then, the taxon has been largely ignored, and
  its validity has been doubted, with synonymy with other Asian hadrosaurs or
  status as a nomen dubium being suggested. Redescriptions from 2004 and 2017,
  however, have supported recognition as a distinct species. Dating the only
  specimen has been difficult, but based on associated mollusc taxa, the species
  likely lived sometime in the upper Santonian or lower Campanian, around 80
  million years ago.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - coastal
diagnostic_features:
  - Flat lateral (buccal) shelf of the dentary, anterior to the coronoid
    process (absent in hadrosaurids; retained from non-hadrosaurid
    hadrosauroids).
  - Dorsally projecting coronoid process, its base on the dorsal surface of the
    dentary body and projecting nearly vertically (unlike the dorsolateral
    projection seen in other hadrosaurids).
  - Lateroventral protrusion at the distal end of the manual first phalanx of
    digit IV.
  - Relatively short ulna compared with the femur (ulna/femur ratio ~0.49, well
    below the lambeosaurine average).
