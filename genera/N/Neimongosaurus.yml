genus: Neimongosaurus
parent: Therizinosauroidea
etymology: Named after Nei Mongol (Inner Mongolia), the Chinese autonomous
  region where it was found, combined with Greek 'sauros' (lizard); meaning 'Nei
  Mongol lizard'.
pronunciation:
  phonetic: nay-MOHN-go-SOR-us
description: Neimongosaurus is a genus of herbivorous therizinosaurian theropod
  dinosaur that lived in China during the Late Cretaceous period. Its fossils
  are known from the strata of the Iren Dabasu Formation. It is known from two
  specimens, discovered in 1999 by researchers from the Ministry of Land and
  Resources and described two years later. One species, N. yangi, is known,
  named after Chinese paleontologist Yang Zhongjian.
dispute:
  summary: >
    Neimongosaurus is an intermediate-grade therizinosaur whose family-level
    assignment depends on how Therizinosauridae is defined. Under the narrow
    node-based definition of Zanno (2010) it lies outside Therizinosauridae as an
    intermediate therizinosauroid, a result followed by Hartman et al. (2019) and
    the Princeton Encyclopedia (Jones, 2026). Under the broader
    Therizinosaurus-anchored definition of Kobayashi et al. (2022, 2025) it is
    drawn into Therizinosauridae, recovered with Erliansaurus as the family's
    most basal clade. It is placed conservatively in Therizinosauroidea.
  history:
    - date: "2026-07-01"
      note: >
        Placed at Therizinosauroidea (outside Therizinosauridae) following Zanno
        (2010), Hartman et al. (2019) and Jones (2026); Kobayashi et al. (2022,
        2025) include it in a more broadly defined Therizinosauridae.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Anterior caudal vertebrae with circular fossa under transverse process
  - Radius with prominent biceps tuberosity
  - Proximal pedal phalanges with well-developed heels
  - Tibia with extremely long fibular crest exceeding half tibia length
  - Lateral surface of preacetabular process twisted to face dorsally
  - Caudal vertebrae with widely divergent prezygapophyses
appearance:
  features:
    - elongate neck
    - keratinous beak
  integument: feathered
  evidence: direct
