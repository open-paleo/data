genus: Neimongosaurus
parent: Therizinosauridae
etymology: Nei Mongol lizard
description: Neimongosaurus is a genus of herbivorous therizinosaurian theropod
  dinosaur that lived in China during the Late Cretaceous period. Its fossils
  are known from the strata of the Iren Dabasu Formation. It is known from two
  specimens, discovered in 1999 by researchers from the Ministry of Land and
  Resources and described two years later. One species, N. yangi, is known,
  named after Chinese palaeontologist Yang Zhongjian.
diet: herbivore
locomotion: bipedal
