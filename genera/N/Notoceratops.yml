genus: Notoceratops
parent: Ceratopsia
etymology: From Greek 'notos' (southern), 'keras' (horn), and 'ops' (face);
  meaning 'southern horned face', referring to its discovery in the southern
  part of South America.
pronunciation:
  phonetic: not-o-SEH-ruh-tops
description: Notoceratops is a dubious genus of extinct ornithischian dinosaur.
  The genus was described based on an incomplete, toothless left dentary (now
  lost) from the Late Cretaceous of Patagonia (in Argentina), probably dating to
  the Campanian or Maastrichtian. Initially classified as a putative ceratopsian
  found in the Lago Colhué Huapi Formation, the lost fragmentary holotype
  precludes confident referral of this taxon within ornithischians, with some
  researchers suggesting that it belongs to a hadrosaur instead.
dispute:
  summary: >
    Notoceratops bonarellii is based on a now-lost dentary; its
    ceratopsian identity has been both supported and questioned (some
    regard it as possibly hadrosaurian), and it is treated as a nomen
    dubium.
  history:
    - date: "2026-06-27"
      note: Placed at Ceratopsia incertae sedis; nomen dubium (P2).
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Well-delimited masseteric insertion standing out strongly in relief on
    lateral surface of dentary
  - Three lateral vascular perforations situated anteriorly and very close
    together near predental contact, plus a single large vascular perforation in
    the middle
  - Lateral longitudinal ridge (approximately 40 cm long) running forward from
    near coronoid process; no ridge extending from coronoid process itself
  - Anterior tip of dentary forms an articular roll with flat vertical lateral
    surface at predental contact, edge forming a circular arc segment
  - Especially small ceratopsid with total estimated lower jaw length of
    approximately 35 cm
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "38779"
  - source: wikidata
    id: Q141611
  - source: gbif
    id: "4823252"
species:
  - name: Notoceratops bonarelli
    etymology: "Named for Guido Bonarelli (1871-1951), who advised Augusto Tapia in
      his study of the find."
    status: valid
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Maastrichtian
      from_ma: 72.1
      to_ma: 66
    location:
      country: AR
      locality: northwest of Lago Colhué Huapí
      region: Chubut
      formation: Lago Colhué Huapi
      coordinates:
        - -45.620422
        - -68.587898
    holotype:
      specimen_type: holotype
      institution: UNSJ
      status: lost
      material: Incomplete left dental (lower jaw fragment), broken posteriorly and
        along medial half, with tooth row and Meckelian cartilage canal; coronoid
        process partially preserved
      completeness: fragmentary
    erected_in: tapia1919a
references:
