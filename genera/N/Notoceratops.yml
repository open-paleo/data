genus: Notoceratops
parent: Ceratopsia
placement: incertae sedis
etymology: From Greek 'notos' (southern), 'keras' (horn), and 'ops' (face);
  meaning 'southern horned face', referring to its discovery in the southern
  part of South America.
pronunciation:
  phonetic: not-o-SEH-ruh-tops
description: Notoceratops is a dubious genus of extinct ornithischian dinosaur.
  The genus was described based on an incomplete, toothless left dentary (now
  lost) from the Late Cretaceous of Patagonia (in Argentina), probably dating to
  the Campanian or Maastrichtian. Initially classified as a putative ceratopsian
  found in the Lago Colhué Huapi Formation, the lost fragmentary holotype
  precludes confident referral of this taxon within ornithischians, with some
  researchers suggesting that it belongs to a hadrosaur instead.
dispute:
  summary: >
    Notoceratops bonarellii is based on a now-lost dentary; its
    ceratopsian identity has been both supported and questioned (some
    regard it as possibly hadrosaurian), and it is treated as a nomen
    dubium.
  history:
    - date: "2026-06-27"
      note: Placed at Ceratopsia incertae sedis; nomen dubium.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
appearance:
  integument: scaled
  evidence: inferred
identifiers:
