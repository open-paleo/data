genus: Notoceratops
parent: Cerapoda
placement: incertae sedis
etymology: From Greek 'notos' (southern), 'keras' (horn), and 'ops' (face);
  meaning 'southern horned face', referring to its discovery in the southern
  part of South America.
pronunciation:
  phonetic: not-o-SEH-ruh-tops
description: Notoceratops is a dubious genus of extinct ornithischian dinosaur.
  The genus was described based on an incomplete, toothless left dentary (now
  lost) from the Late Cretaceous of Patagonia (in Argentina), probably dating to
  the Campanian or Maastrichtian. Initially classified as a putative ceratopsian
  found in the Lago Colhué Huapi Formation, the lost fragmentary holotype
  precludes confident referral of this taxon within ornithischians, with some
  researchers suggesting that it belongs to a hadrosaur instead.
dispute:
  summary: >
    Tapia (1919) described Notoceratops bonarellii on an incomplete dentary,
    now lost (Brett-Surman, 1989), as a ceratopsid, and Bonaparte (1984) and
    Brett-Surman (1989) keep it ceratopsian. Powell (2003) raises the
    possibility that it belongs to a hadrosaur, and recent work hedges:
    Ibiricu and colleagues (2019) call it the supposed ceratopsian and
    Bandeira and colleagues (2024) list it with a query. It is treated as a
    nomen dubium at Cerapoda incertae sedis.
  history:
    - date: "2026-06-27"
      note: Placed at Ceratopsia incertae sedis; nomen dubium.
    - date: "2026-10-16"
      note: >
        Moved from Ceratopsia to Cerapoda incertae sedis, the level
        shared by the ceratopsian and hadrosaurian readings; summary
        rewritten with its sources.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "38779"
  - source: wikidata
    id: Q141611
  - source: gbif
    id: "4823252"
species:
  - name: Notoceratops bonarellii
    etymology: "Named for Guido Bonarelli (1871-1951), who advised Augusto Tapia
      in Tapia's study of the find."
    status: nomen dubium
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Maastrichtian
    location:
      country: AR
      locality: the bluffs northwest of Lago Colhué Huapí, in the vicinity of the source of the Río Chico
      region: AR-U
      formation: Lago Colhué Huapi
      notes: None of the papers cited for this taxon assigns the holotype to a formation. Casal and
        colleagues place Tapia's find on the Río Chico in southern Chubut,
        where the only Cretaceous continental unit exposed is the interval they
        later removed from the Bajo Barreal to erect the Lago Colhué Huapi.
    type_specimen:
      specimen_type: holotype
      institution: UNSJ
      status: lost
      material: Incomplete left dental (lower jaw fragment), broken posteriorly and
        along medial half, with tooth row and Meckelian cartilage canal; coronoid
        process partially preserved
      completeness: fragmentary
    erected_in: tapia1919a
references:
  - id: tapia1919a
    notes: Names Notoceratops bonarellii in a brief note, without a full
      description.
  - id: huene1929a
    notes: In Spanish. Provides the description of Notoceratops bonarellii (named
      by Tapia, 1919).
  - id: casal2007a
  - id: casal2015a
  - id: bonaparte1984a
    notes: Finds the dentary's characters strongly indicative of Ceratopsidae.
  - id: brett-surman1989a
    notes: Reports the holotype lost and keeps the genus ceratopsian,
      rejecting a hadrosaurid assignment as circular.
  - id: powell2003a
    notes: Raises the possibility that the illustrated dentary belongs to a
      hadrosaur.
  - id: ibiricu2019a
    notes: Calls Notoceratops the supposed ceratopsian and notes the loss of
      the holotype.
  - id: bandeira2024a
    notes: Lists Notoceratops bonarellii with a query under Ceratopsia.
