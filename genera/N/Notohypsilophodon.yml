genus: Notohypsilophodon
parent: Thescelosaurinae
pronunciation:
  phonetic: NOT-o-hip-si-LOF-o-don
etymology: "From Greek 'notos' meaning 'south wind' (indicating its southern
  provenance in South America) combined with the genus name Hypsilophodon,
  indicating its similarity to that ornithopod."
description: Notohypsilophodon is a genus of ornithopod dinosaur from the Late
  Cretaceous of Argentina. It was described as the only "hypsilophodont" known
  from South America, although this assessment is not universally supported, and
  Gasparinisaura is now believed to have been a basal euornithopod as well.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Humerus without deltopectoral crest
  - Tibia with marked anteromedial longitudinal enlargement in proximal third
  - Fibula with abrupt anteroposterior narrowing in mid-shaft
  - Astragalus with proximal articular surface divided into two levels by marked
    step
  - Calcaneum with strong marked posterodistal projection
  - Ungual phalanges with flat ventral surfaces
appearance:
  integument: scaled
  evidence: inferred
