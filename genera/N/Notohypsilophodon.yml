  - id: ibiricu2014a
    notes: Restudy of the holotype providing an emended diagnosis; recovers
      Notohypsilophodon as a basal ornithopod, more basal than Gasparinisaura.
  - id: rozadilla2016a
    notes: Recovered Notohypsilophodon within Elasmaria in Gondwanan ornithopod analysis.
  - id: madzia2017a
    notes: Recovered Notohypsilophodon within Thescelosaurinae in basal ornithopod phylogenetic matrix.
  - id: jones2026a
    notes: Placement and assessment in the Princeton Encyclopedia of Dinosaurs.
  - id: boyd2015a
    notes: Its matrix places Notohypsilophodon within Thescelosaurinae.
