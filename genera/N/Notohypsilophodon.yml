genus: Notohypsilophodon
parent: Elasmaria
pronunciation:
  phonetic: NOT-o-hip-si-LOF-o-don
etymology: "From Greek 'notos' meaning 'south wind' (indicating its southern
  provenance in South America) combined with the genus name Hypsilophodon,
  indicating its similarity to that ornithopod."
description: Notohypsilophodon is a genus of ornithopod dinosaur from the Late
  Cretaceous of Argentina. It was described as the only "hypsilophodont" known
  from South America, although this assessment is not universally supported, and
  Gasparinisaura is now believed to have been a basal euornithopod as well.
dispute:
  summary: >
    Notohypsilophodon is recovered within Elasmaria by dedicated analyses
    of Gondwanan ornithopods (Rozadilla and others, 2016) and is treated
    as an elasmarian by Jones (2026). Earlier matrices derived from Boyd
    (2015), including Madzia and others (2017, 2021), instead place it
    within Thescelosaurinae.
  history:
    - date: "2026-06-29"
      note: Placed at Elasmaria following Rozadilla and others (2016) and Jones (2026) (P3, recency and dedicated sampling); the Thescelosaurinae alternative is recorded.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Anteromedial bulge on the proximal extremity of the tibia
  - Calcaneum with a pronounced posterodistal projection
  - Distal tip of the sacral neural spine strongly projected posteriorly
  - Sternal process of the coracoid markedly reduced
appearance:
  integument: scaled
  evidence: inferred
