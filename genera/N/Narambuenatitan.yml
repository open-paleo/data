genus: Narambuenatitan
parent: Lithostrotia
etymology: Refers to Puesto Narambuena, the locality in northern Patagonia, Argentina, where the fossil was found, combined with Greek Titan (a giant)
pronunciation:
  phonetic: na-ram-bweh-na-tie-tuhn
description: Narambuenatitan is a genus of lithostrotian titanosaur sauropod
  from late Cretaceous (lower-middle Campanian stage) deposits of northern
  Patagonia of Argentina. Narambuenatitan is known from the holotype
  MAU-Pv-N-425, an incomplete skeleton. It was collected in 2005 and 2006 from
  the Anacleto Formation (Neuquén Group) in northern Patagonia. It was first
  named by Leonardo S. Filippi, Rodolfo A. García and Alberto C. Garrido in 2011
  and the type species Narambuenatitan palomoi. The generic name refers to
  Puesto Narambuena. The specific name honors the discoverer, Salvador Palomo.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Great participation of frontal to rostral border of supratemporal fossa
  - Absence of ornamentation on supraorbital or lateral borders of frontal
  - Lamina joining each parietal crest with rostral surface of supratemporal
  - Pleurocoel dorsal border defined by prominent convex bony edge in posterior
    dorsal vertebrae
  - Distal enlargement of prespinal lamina in posterior dorsal vertebrae with
    laterally enlarged neural spine
  - Kidney-shaped prezygapophysis in posterior dorsal vertebrae
  - Numerous pneumatic cavities posterior to centroparapophyseal and
    centrodiapophyseal laminae in posterior dorsal vertebrae
  - Middle-anterior caudal vertebrae with anterodorsal border of neural spine
    anteriorly inclined
  - Middle caudal vertebra with slender prezygapophysis and neural arch
appearance:
