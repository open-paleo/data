genus: Nanningosaurus
parent: Hadrosauromorpha
etymology: Refers to the city of Nanning in Guangxi, China, located close to the
  excavation site, combined with Greek sauros meaning 'lizard'
pronunciation:
  phonetic: nah-NING-oh-SOR-us
description: Nanningosaurus is a genus of hadrosauromorph dinosaur from the
  upper Late Cretaceous of the Nalong Basin, Guangxi, China.
dispute:
  summary: >
    Nanningosaurus dashiensis was tentatively described as a basal
    lambeosaurine, but this is widely regarded as erroneous; it is now
    regarded as a non-hadrosaurid hadrosauromorph (Jones, 2026).
  history:
    - date: "2026-06-27"
      note: Placed at Hadrosauromorpha; the original lambeosaurine
        interpretation reflected, not adopted.
diet: herbivore
locomotion: facultative
diagnostic_features:
  - Tall and sharply peaked dorsal process of the maxilla with reduced process
    of the jugal and distinct lacrimal facet
  - Gracile humerus with low, rounded deltopectoral crest
  - Mandibular condyle of the quadrate transversely broad with weakly developed
    paraquadrate notch
  - Dentary tooth with sinuous median carina and subsidiary ridge
  - Relatively few tooth positions in dental battery
  - Ischial shaft straight along most of its distance, but curves dorsally and
    expands at distal end before ischial foot begins
paleoenvironment:
  - lacustrine
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "153946"
  - source: wikidata
    id: Q2537541
  - source: eol
    id: "10629413"
