genus: Nanyangosaurus
parent: Hadrosauromorpha
pronunciation:
  phonetic: nahn-yahng-o-SAWR-us
etymology: Named for Nanyang, a city in Henan Province, China near where it was
  found, combined with Greek '-saurus' meaning 'lizard'.
description: Nanyangosaurus is a genus of herbivorous ornithopod dinosaur
  belonging to the Hadrosauromorpha that lived in the Late Cretaceous of
  present-day Henan Province, China.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Second metacarpal exceeds 90% the length of third and fourth metacarpals
  - Fourth metacarpal exceptionally robust distally with marked distal
    transverse expansion
  - Manual phalanx IV-1 with distal transverse width greater than phalangeal
    length
  - Second metatarsal dorsoventral length greater than third metatarsal
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "68242"
  - source: wikidata
    id: Q134000
  - source: gbif
    id: "4823240"
  - source: eol
    id: "52570643"
species:
  - name: Nanyangosaurus zhugeii
    etymology: "Named for Zhuge Liang, the legendary strategist and one of the most
      famous historic inhabitants of Nanyang, the city near the discovery site."
    status: valid
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Turonian
        - Coniacian
        - Santonian
        - Campanian
    location:
      country: CN
      locality: Donggouling, Angou Village
      region: CN-HA
      formation: Xiaguan
      part: lower
      notes: >-
        Wang and colleagues (2013) place the holotype low in the Xiaguan
        Formation, which they date as a whole, noting that no fossils useful
        for dating have yet been found in its lower strata. The "early to
        middle Coniacian" of Xing and colleagues (2014) cites only that paper.
    type_specimen:
      specimen_id: [ IVPP V11821 ]
      specimen_type: holotype
      institution: IVPP
      material: "Incomplete skeleton: partial dorsal vertebrae, complete sacral
        vertebrae, numerous caudal vertebrae, partial ischium, and nearly complete
        fore- and hindlimbs"
      completeness: partial
    size:
      length_m:
        min: 4
        max: 5
    erected_in: xu2000a
references:
  - id: xing2014a
    notes: Gives the horizon as "the early to middle Coniacian lower portion of
      the Xiaguan Formation", citing Wang and colleagues (2013).
  - id: xu2000a
  - id: wang2013c
    notes: Erects the Xiaguan Formation on measured sections and places the
      holotype in it, superseding the Sangping Formation of the describing
      paper.
