genus: Nambalia
parent: Sauropodomorpha
etymology: Derived from Nambal village, located near the discovery site in Telangana, central India
pronunciation:
  phonetic: nam-BAH-lee-uh
description: Nambalia is a genus of basal sauropodomorph dinosaur. It lived
  during the Late Triassic period (late Norian to earliest Rhaetian) in what is
  now Telangana, central India. It is known from the holotype ISIR 273, parts
  1-3, partially articulated postcranial material and from the paratypes ISIR
  273, parts 4-29, including partial postcrania of at least two individuals of
  different sizes found closely associated and one of them is nearly the same
  size as the holotype.
locomotion: bipedal
paleoenvironment:
  - fluvial
diet: herbivore
diagnostic_features:
  - Femur with almost transversely unexpanded distal end and shallow distal
    anterior intercondylar groove
  - Astragalus with pit on anterior surface of ascending process
  - Astragalar anterolateral process larger than posterolateral process in
    dorsal view
  - Astragalar ventral margin straight in anterior view
  - Astragalus with sub-triangular medial condyle in anterior view
appearance:
  integument: scaled
  evidence: inferred
