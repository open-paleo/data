genus: Nanosaurus
parent: Ornithopoda
pronunciation:
  phonetic: NAY-no-SAWR-us
etymology: From Greek 'nanos' (small or dwarf) and 'sauros' (lizard); meaning 'small or dwarf lizard'.
description: Nanosaurus is an extinct genus of neornithischian dinosaur that
  lived about 155 to 148 million years ago, during the Late Jurassic in North
  America. Its fossils are known from the Morrison Formation of the
  south-western United States. The type and only species, Nanosaurus agilis, was
  described and named by Othniel Charles Marsh in 1877. The taxon has a
  complicated taxonomic history, largely the work of Marsh and Peter M. Galton,
  involving the genera Laosaurus, Hallopus, Drinker, Othnielia, and
  Othnielosaurus, the latter three now being considered to be synonyms of
  Nanosaurus. It had historically been classified as a hypsilophodont or
  fabrosaur, types of generalized small bipedal herbivore, but more recent
  research has abandoned these groupings as paraphyletic and Nanosaurus is today
  considered a basal member of Neornithischia.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Diminutive size, not larger than a cat
  - Third trochanter present on femur
  - Femur shorter than tibia
  - Tooth crowns apparently compressed with distinct sockets
  - Most bones hollow with thin walls
