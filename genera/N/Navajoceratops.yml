genus: Navajoceratops
parent: Chasmosaurinae
etymology: Named after the Navajo people of the American Southwest, combined
  with Greek 'keras' (horn) and 'ops' (face); meaning 'Navajo horned face'.
pronunciation:
  phonetic: NA-vuh-ho-SEH-ruh-tops
description: Navajoceratops is a genus of ceratopsid dinosaur from the late
  Cretaceous Period of what is now North America. The genus contains a single
  species, N. sullivani, named after Robert M. Sullivan, leader of the
  expeditions that recovered the holotype.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Lateral rami of parietal posterior bar meet medially at acute angle (~60°)
  - Median embayment of parietal posterior bar especially deep, extending
    anterior to posteriormost extent of parietal fenestrae
  - Lateral rami of posterior bar broadly rounded rather than angular
  - Arches of M-shaped posterior bar with apices occurring between ep2 and ep3
  - Posterior bar anteroposteriorly expanded laterally at ep3 locus
appearance:
  features:
    - neck frill
  integument: scaled
  evidence: inferred
