genus: Nyana
parent: Massopoda
placement: incertae sedis
etymology: From Xhosa and Sesotho 'nyana', meaning 'son' or 'child' in Xhosa and
  'small' or 'little' in Sesotho, for the holotype's early ontogenetic stage.
description: Nyana rooiwalensis is an extinct species of early massopodan
  sauropodomorph dinosaur known from the Late Triassic (Norian–Rhaetian ages)
  Elliot Formation of South Africa. It is the only species in the genus Nyana,
  and is known from a partial articulated skull and associated fragmentary
  skeleton of a juvenile individual.
dispute:
  summary: >
    Moopen and colleagues (2026) recover Nyana within Massopoda in each of their
    reduced consensus trees, but in three positions, with low support across
    the tree: inside Massospondylidae as the sister of Sarahsaurus or of
    Ngwevu, or as the sister of Sarahsaurus outside Massospondylidae.
locomotion: bipedal
diagnostic_features:
  - Ascending ramus of the maxilla extending at about 40 degrees from the long
    axis of the maxilla
  - Postorbital mediolaterally thickened, with straight rami
  - A foramen on the posteromedial surface of the jugomaxillary ramus of the
    palatine
identifiers:
  - source: wikidata
    id: Q135042445
species:
  - name: Nyana rooiwalensis
    etymology: Named for Rooiwal, the tribal administrative area of the Eastern Cape
      in which the fossil site lies.
    status: valid
    type_species: true
    period:
      name:
        - Late Triassic
      stage:
        - Norian
        - Rhaetian
    location:
      country: ZA
      locality: Qhemegha, Sterkspruit District
      region: ZA-EC
      formation: Elliot
      part: lower
      notes: >
        Moopen and colleagues (2026) place the holotype in the upper half of
        the lower Elliot, about 140 m above the contact with the Molteno
        Formation.
    type_specimen:
      specimen_id:
        - BP/1/8468
      specimen_type: holotype
      institution: BP
      material: Partial articulated skull, posterior right mandible, both proatlases,
        six cervical and dorsal vertebrae, sacral and caudal centra, and partial
        ulna, femur, tibia and manual and pedal phalanges.
    erected_in: moopen2026a
references:
