genus: Nuthetes
parent: Coelurosauria
dispute:
  summary: >
    Nuthetes destructor is widely regarded as a nomen dubium. It was originally
    described as a monitor-like lizard (Owen, 1854), later referred to
    Dromaeosauridae/Velociraptorinae on tooth and jaw characters (Milner, 2002),
    and subsequently noted to resemble proceratosaurid tyrannosauroids (Rauhut et
    al., 2010). It is retained provisionally at Dromaeosauridae incertae sedis.
  history:
    - date: "2026-07-01"
      note: Retained at Dromaeosauridae incertae sedis; nomen dubium with a shifting history (lizard, dromaeosaurid, proceratosaurid).
    - date: "2026-07-14"
      note: Moved to Coelurosauria incertae sedis; the dromaeosaurid and
        proceratosaurid-tyrannosauroid hypotheses are equally supported by the
        fragmentary material.
etymology: "From Koine Greek 'nouthetes' meaning 'one who admonishes' or 'a monitor', referring to the similarity of its teeth to those of a modern monitor lizard."
pronunciation:
  phonetic: nuth-EE-teez
description: Nuthetes is a genus of coelurosaurian theropod dinosaur, either a
  dromaeosaurid or tyrannosauroid, known only from fossil teeth and jaw
  fragments found in rocks of the middle Berriasian age (Early Cretaceous) in
  the Cherty Freshwater Member of the Lulworth Formation in England and also the
  Angeac-Charente bonebed in France. If it was a dromaeosaurid, Nuthetes would
  have been a small predator.
diet: carnivore
locomotion: bipedal
