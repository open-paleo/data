genus: Nuthetes
parent: Dromaeosauridae
etymology: "From Koine Greek 'nouthetes' meaning 'one who admonishes' or 'a monitor', referring to the similarity of its teeth to those of a modern monitor lizard."
pronunciation:
  phonetic: nuth-EE-teez
description: Nuthetes is a genus of coelurosaurian theropod dinosaur, either a
  dromaeosaurid or tyrannosauroid, known only from fossil teeth and jaw
  fragments found in rocks of the middle Berriasian age (Early Cretaceous) in
  the Cherty Freshwater Member of the Lulworth Formation in England and also the
  Angeac-Charente bonebed in France. If it was a dromaeosaurid, Nuthetes would
  have been a small predator.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - coastal
  - lacustrine
diagnostic_features:
  - Teeth with enamelled crowns that are moderately long, slender, compressed,
    pointed, and slightly recurved, with well-marked serrated margins both
    before and behind
  - Teeth thickest towards the anterior part, closely resembling in miniature
    the teeth of Megalosaurus
  - Inner alveolar ridge of jaw not more developed than in modern Varani, with
    no rudiments of alveolar divisions
  - Bases of teeth anchylosed to the outer wall and completely exposed on the
    inner side of the jaw
  - Ramus compressed, scarcely 2 lines across at thickest part, with exterior
    surface smooth and polished, impressed by fine longitudinal linear markings
appearance:
