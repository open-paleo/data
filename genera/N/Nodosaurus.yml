genus: Nodosaurus
parent: Nodosauridae
etymology: From Latin nodus ('knob' or 'node') and Greek sauros ('lizard'), meaning 'knobbed lizard', in reference to the knobby armour on its body
description: Nodosaurus is a genus of herbivorous nodosaurid ankylosaurian
  dinosaur from the Late Cretaceous, the fossils of which were found in Niobrara
  County, Wyoming, in the Lance Formation.
