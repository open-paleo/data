genus: Nodosaurus
parent: Nodosauridae
pronunciation:
  phonetic: NOHD-o-SAWR-us
etymology: From Latin nodus ('knob' or 'node') and Greek sauros ('lizard'), meaning 'knobbed lizard', in reference to the knobby armor on its body
description: Nodosaurus is a genus of herbivorous nodosaurid ankylosaurian
  dinosaur from the Late Cretaceous, the fossils of which were found in Niobrara
  County, Wyoming, in the Frontier Formation.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - coastal
diagnostic_features:
  - Dermal armor complete and closely covering sides, supported by specially
    strengthened ribs
  - Dermal ossifications arranged in regular series of rounded knobs in rows
  - Dermal ossicles near head quadrangular in form, with interwoven surface
    texture resembling coarse cloth
  - Fore limbs massive and powerful, resembling Jurassic Stegosaurus with five
    well-developed digits
  - Ribs T-shaped in transverse section, specially adapted to support armor
  - Caudal vertebrae more elongate than Stegosaurus, with median groove on lower
    surface of centrum in middle caudals
appearance:
  features:
    - dermal plates
    - body armor
  integument: armored
  evidence: direct
