genus: Nigersaurus
parent: Rebbachisaurinae
etymology: Named after Niger, the African country where it was discovered, combined with Latin 'saurus' (lizard); meaning 'Niger reptile'.
pronunciation:
  phonetic: nee-ZHAYR-SAWR-us
  ipa: /niːˈʒɛərsɔːrəs, ˈnaɪdʒərsɔːrəs/
description: Nigersaurus is a genus of rebbachisaurid sauropod dinosaur that
  lived during the middle Cretaceous period, about 115 to 105 million years ago.
  It was discovered in the Elrhaz Formation in an area called Gadoufaoua, in
  Niger. Fossils of this dinosaur were first described in 1976, but it was only
  named Nigersaurus taqueti in 1999 after further and more complete remains were
  found and described. The genus name means "Niger reptile", and the specific
  name honours the palaeontologist Philippe Taquet, who discovered the first
  remains.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Elongate frontal bone, much narrower than long, with marked cerebral fossa
  - Transversely oriented upper and lower tooth rows extending lateral to the
    plane of the lower jaw ramus
  - Tooth crowns with prominent medial and lateral marginal ridges and highly
    asymmetric enamel
  - Dorsal vertebrae with paired pneumatic spaces at base of neural spines
  - Prominent rugosity on medial aspect of scapular blade base
