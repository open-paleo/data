genus: Notocolossus
parent: Lognkosauria
etymology: From Greek notos (νότος, 'south wind') and kolossos (κολοσσός, 'giant statue'), meaning 'giant of the south', referring to its southern hemisphere provenance and enormous size
pronunciation:
  phonetic: NOT-o-cuh-LOSS-us
description: Notocolossus is a genus of titanosaurian sauropod dinosaur from
  late Cretaceous strata of Mendoza Province, Argentina.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Anterior dorsal vertebra with parapophyseal centrodiapophyseal fossa
    subdivided by two 'accessory' laminae
  - Anterior caudal vertebrae with laminae converging ventrally on anterior
    surface of neural spine, forming V-shaped conformation in anterior view
  - Humerus with greatly expanded proximomedial process positioned well medial
    to humeral midshaft
  - Humerus with proportionally wide proximal end (proximal width:midshaft width
    ≈ 2.9)
  - Humerus with proximolaterally–distomedially oriented ridge bounding distal
    edge of coracobrachialis fossa
  - Metatarsal I with proximal dorsoventral diameter greater than proximodistal
    length of bone
  - Metatarsal III relatively short (only 1.2 times length of metatarsal I)
  - Proximal phalanges more than half as wide as their corresponding metatarsals
    are long
  - Pedal unguals reduced, rugose, and distally truncated
