genus: Naashoibitosaurus
parent: Saurolophinae
pronunciation:
  phonetic: nah-ah-sho-ee-BEE-to-SAWR-us
etymology: From Navajo naʼashǫ́ʼii bitooh, meaning 'creek lizard'; named after
  the Naashoibito Member of the Kirtland Formation where the specimen was
  thought to have been found
description: Naashoibitosaurus is a genus of hadrosaurid dinosaur that lived
  about 73 million years ago, in the Late Cretaceous, and was found in the
  Kirtland Formation of the San Juan Basin in New Mexico, United States. Only a
  partial skeleton has been found to date. It was first described as a specimen
  of Kritosaurus by Jack Horner, and has been intertwined with the taxon since
  its description.
dispute:
  summary: >
    Naashoibitosaurus ostromi is sometimes regarded as conspecific with
    or a junior synonym of Kritosaurus, but Prieto-Márquez (2013)
    recovered it as a valid kritosaurin distinguished by premaxillonasal
    and prefrontal morphology. Kept valid within Saurolophinae.
  history:
    - date: "2026-06-27"
      note: Placed at Saurolophinae following Prieto-Márquez (2013);
        proposed synonymy with Kritosaurus reflected but not adopted.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
diagnostic_features:
  - Nasal arch rises above anterior end of orbits, distinguishing from other
    hadrosaurids except Gryposaurus
  - Nasals bifurcate posteriorly with frontals extending anteriorly between
    nasals along midline, differs from Gryposaurus
  - Posterior processes of nasals overlapped by extensive medial prefrontal
    wings so nasal transverse width narrower than prefrontal width in dorsal
    view
appearance:
  integument: scaled
  evidence: inferred
