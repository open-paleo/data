genus: Neosodon
parent: Sauropoda
etymology: From Greek 'neos' (new) and 'odon' (tooth); meaning 'new tooth'.
description: Neosodon was a genus of sauropod dinosaur from the late
  Tithonian-aged (Upper Jurassic) Sables et Gres a Trigonia gibbosa of
  Pas-de-Calais department, France. It has never been formally given a species
  name, but is often seen as N. praecursor, which actually comes from a
  different animal. Often in the past, it had been assigned to the wastebasket
  taxon Pelorosaurus, but restudy has suggested that it could be related to
  Turiasaurus, a roughly contemporaneous giant Spanish sauropod. It is only
  known from six teeth.
diet: herbivore
