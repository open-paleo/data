genus: Nasutoceratops
parent: Centrosaurinae
etymology: "From Latin 'nasutus' meaning 'large-nosed' and Latinized Greek 'ceratops' meaning 'horned face'; translates as 'large-nosed horned face', referring to its distinctive enlarged nasal region."
pronunciation:
  phonetic: nuh-SU-toe-SEH-ruh-tops
description: Nasutoceratops is a genus of ceratopsid dinosaur that lived in
  North America during the Late Cretaceous period, about 76.0-75.5 million years
  ago. The first known specimens were discovered in Utah in the Kaiparowits
  Formation of the Grand Staircase-Escalante National Monument (GSENM) from 2006
  onwards, including a subadult skull with both a partial postcranial skeleton
  and rare skin impressions, and two other partial skulls. In 2013, the subadult
  was made the holotype of the new genus and species Nasutoceratops titusi; the
  generic name means "large-nosed horned face", and the specific name honors the
  paleontologist Alan L. Titus for his work at the GSENM. The dinosaur was noted
  for its large nose in news reports, and later featured in Jurassic World
  films.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - wetland
diagnostic_features:
  - Hypertrophied narial region (approx. 75% of preorbital skull length)
  - Pneumatic nasal ornamentation with internal pneumatic cavities in the nasal
  - Abbreviated snout, shorter rostrocaudally than in other ceratopsids
  - Elongate, rostrolaterally directed supraorbital horncores, distinctively
    curved and twisted distally
  - Double faceted medially directed flange on maxilla
  - Subrectangular parietosquamosal frill broadest in mid-region, relatively
    unadorned
  - Pronounced dorsolateral ridge on squamosal
appearance:
  features:
    - brow horns
    - neck frill
    - epoccipitals
  integument: scaled
  evidence: direct
