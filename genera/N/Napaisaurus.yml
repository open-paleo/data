genus: Napaisaurus
parent: Styracosterna
pronunciation:
  phonetic: nah-PIE-SAWR-us
etymology: From 'Napai' (the Napai Basin in Fusui County, Guangxi, where the
  holotype was discovered) and Greek 'sauros' (lizard).
description: Napaisaurus is an extinct genus of basal iguanodontian ornithopod
  from the Aptian (Early Cretaceous) second member of the Xinlong Formation,
  Napai Basin, Fusui County, Guangxi Zhuang Autonomous Region, southern China.
  The single species, Napaisaurus guangxiensis, is known from a partial right
  pelvis (right ilium and ischium of a single individual). Ji and Zhang (2022)
  identify it as the first formally named basal iguanodontian dinosaur from
  southern China.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
  - fluvial
diagnostic_features:
  - Preacetabular process of the ilium strongly curved ventrally and slightly
    inclined laterally, with a very long pubic peduncle extending
    anteroventrally, forming a narrow and deep U-shaped preacetabular notch
    with nearly parallel lateral margins.
  - Depth-to-length ratio of the iliac body is approximately 1; postacetabular
    process length is approximately 0.7 times the iliac body length.
  - Supraacetabular process expanded and thickened dorsoventrally, with its
    anteroposterior length occupying approximately the anterior half of the
    total postacetabular process length.
  - Posterior portion of the postacetabular process expands significantly
    medially in the transverse direction, forming a short, wide brevis shelf
    on the ventral surface.
  - Articular surface of the ischial peduncle of the ilium is broad and
    concave.
  - Iliac peduncle of the ischium shows significant lateral thickening toward
    the distal end, with a strongly convex distal articular surface.
