genus: Nqwebasaurus
parent: Ornithomimosauria
description: Nqwebasaurus is a probable ornithomimosaurian theropod from the
  Early Cretaceous of South Africa. The genus contains a single species,
  Nqwebasaurus thwazi, representing the oldest known coelurosaur in Africa and
  the evidence for basal coelurosaurian dinosaurs inhabiting Gondwana since the
  earliest Cretaceous period.
