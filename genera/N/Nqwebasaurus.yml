genus: Nqwebasaurus
parent: Ornithomimosauria
dispute:
  summary: >
    The placement of Nqwebasaurus is contested. Most recent analyses recover it as
    the basalmost ornithomimosaur (Choiniere et al., 2012; Serrano-Brañas et al.,
    2020), but it has also been recovered outside Ornithomimosauria, near the base
    of Alvarezsauroidea (Hartman et al., 2019), and it was originally described as
    a coelurosaur of uncertain affinities (de Klerk et al., 2000). It is placed
    conservatively as the basalmost ornithomimosaur.
  history:
    - date: "2026-06-30"
      note: >
        Retained at Ornithomimosauria following the recent majority; the
        alvarezsauroid alternative of Hartman et al. (2019) is recorded as
        unresolved.
pronunciation:
  phonetic: en-KWEB-ah-SAWR-us
etymology: "From Xhosa 'Nqweba', the local name for the Kirkwood district in the
  Eastern Cape of South Africa where the specimen was found, combined with Greek
  'sauros' meaning 'lizard'."
description: Nqwebasaurus is a probable ornithomimosaurian theropod from the
  Early Cretaceous of South Africa. The genus contains a single species,
  Nqwebasaurus thwazi, representing the oldest known coelurosaur in Africa and
  the evidence for basal coelurosaurian dinosaurs inhabiting Gondwana since the
  earliest Cretaceous period.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Ginglymus of metacarpal I very robust and asymmetrical with greatly enlarged
    lateral (ulnar) condyle
  - Manual ungual phalanx of digit I elongate (four times proximal depth) and
    mediolaterally compressed
  - Fibular shaft reduced distally to thin splint
  - Metatarsal IV reduced in width to approximately half that of metatarsal III
appearance:
  features:
    - enlarged manual claws
  integument: feathered
  evidence: inferred
