genus: Nedoceratops
parent: Triceratopsini
etymology: From Russian 'nedo' (insufficient) and Greek 'keratops'
  (horned face); meaning 'insufficient horned face', in reference
  to the absence of a prominent nasal horn on the holotype skull.
description: >
  Nedoceratops is a controversial genus of ceratopsid dinosaur
  from the Late Cretaceous period Lance Formation of North
  America. It is known only from a single skull discovered in
  Wyoming. Its status is the subject of ongoing debate among
  paleontologists: some authors consider Nedoceratops a valid,
  distinct taxon, while others consider it to be an unusual
  specimen of Triceratops.
dispute: >
  The validity of Nedoceratops is actively contested. Scannella
  & Horner (2010, 2011) and Scannella et al. (2014) treated
  USNM 2412 as a transitional or ontogenetic morph within
  Triceratops, arguing that Triceratops, Torosaurus, and
  Nedoceratops together represent different growth stages of a
  single anagenetic lineage. Farke (2011) and Maiorino et al.
  (2013) rebutted this, treating Nedoceratops as a distinct
  chasmosaurine genus diagnosed by an undifferentiated nasal
  horncore, near-vertical postorbital horncores, and small
  parietal fenestrae. No broad consensus has been reached.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Nasal horncore nearly completely undifferentiated from the
    nasal bone, appearing as a poorly defined swelling rather
    than a discrete horn or knob.
  - Greater portion of the procurved postorbital horncores forms
    approximately a 90-degree angle with the tooth row.
  - Parietal fenestrae extremely small, occupying less than five
    percent of the total surface area of the parietal.
  - Ventral extremity of the squamosal positioned well above the
    alveolar process of the maxilla.
