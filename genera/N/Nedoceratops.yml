genus: Nedoceratops
parent: Chasmosaurinae
etymology: From Russian 'nedo' (insufficient) and Greek 'keratops'
  (horned face); meaning 'insufficient horned face', in reference
  to the absence of a prominent nasal horn on the holotype skull.
pronunciation:
  phonetic: ned-o-SEH-ruh-tops
description: >
  Nedoceratops is a controversial genus of ceratopsid dinosaur
  from the Late Cretaceous period Lance Formation of North
  America. It is known only from a single skull discovered in
  Wyoming. Its status is the subject of ongoing debate among
  paleontologists: some authors consider Nedoceratops a valid,
  distinct taxon, while others consider it to be an unusual
  specimen of Triceratops.
dispute:
  summary: >
    The validity of Nedoceratops is actively contested. Scannella
    and Horner (2010, 2011) treated
    USNM 2412 as a transitional or ontogenetic morph within
    Triceratops, arguing that Triceratops, Torosaurus, and
    Nedoceratops together represent different growth stages of a
    single anagenetic lineage. Farke (2011) rebutted this, treating
    Nedoceratops as a distinct chasmosaurine genus diagnosed by an
    undifferentiated nasal horncore, near-vertical postorbital horncores,
    and small parietal fenestrae; Maiorino et al. (2013) found its
    morphometric affinities equivocal, with the squamosal and frill within
    Triceratops morphospace though overall skull shape is ambiguous. No broad
    consensus has been reached.
  history:
    - date: "2026-06-26"
      note: Placed at Chasmosaurinae, the least-inclusive clade accepted whether Nedoceratops is a valid chasmosaurine or a growth stage of Triceratops; tribes dropped. Validity unresolved.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Nasal horncore nearly completely undifferentiated from the
    nasal bone, appearing as a poorly defined swelling rather
    than a discrete horn or knob.
  - Greater portion of the procurved postorbital horncores forms
    approximately a 90-degree angle with the tooth row.
  - Parietal fenestrae extremely small, occupying less than five
    percent of the total surface area of the parietal.
  - Ventral extremity of the squamosal positioned well above the
    alveolar process of the maxilla.
appearance:
  features:
    - brow horns
    - neck frill
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "139255"
  - source: wikidata
    id: Q132602
  - source: gbif
    id: "4965810"
synonyms:
  - name: Diceratops
    type: preoccupied
    reason: Original generic combination, preoccupied by Diceratops
      Förster, 1869 (a hymenopteran wasp in Ichneumonidae). The
      dinosaur was renamed Nedoceratops by Ukrainsky (2007).
  - name: Diceratus
    type: junior objective
    reason: Independent replacement name proposed by Mateus
      (2008) for the preoccupied Diceratops Lull, 1905, but
      Ukrainsky (2007) had already published Nedoceratops with
      priority. Diceratus is therefore an unused junior objective
      synonym of Nedoceratops.
species:
  - name: Nedoceratops hatcheri
    etymology: Honors John Bell Hatcher, who collected the
      holotype skull in 1891; the original combination
      Diceratops hatcheri was published by Lull (1905) from
      Hatcher's posthumous description.
    status: disputed
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Maastrichtian
    location:
      country: US
      region: US-WY
      formation: Lance
    type_specimen:
      specimen_id:
        - USNM 2412
      specimen_type: holotype
      institution: USNM
      material: Nearly complete cranium approximately 1.8 m in
        greatest length; lacks the caudal margin of the parietal
        and most of the right postorbital horncore. Nearly all
        cranial sutures are obliterated by co-ossification,
        indicating an old adult individual.
      completeness: partial
    size:
      length_m:
        min: 3.9
        max: 3.9
    erected_in: hatcher1905a
references:
  - id: hatcher1905a
    notes: Erects Diceratops hatcheri (= Nedoceratops) on skull USNM 2412; the
      name is Lull's (published posthumously, 1905, from Hatcher's manuscript).
      Later renamed Nedoceratops by Ukrainsky (2007).
  - id: lull1905a
    notes: Lull's companion Restoration of the horned dinosaur Diceratops;
      interpreted it as distinct from Torosaurus but closely allied to
      Triceratops in the same lineage.
  - id: ukrainsky2007a
    notes: Single-page note proposing Nedoceratops as a replacement (nomen
      novum) for the preoccupied Diceratops Lull, 1905; type species
      Nedoceratops hatcheri (Lull, 1905).
  - id: farke2011b
    notes: Pro-validity reassessment of Nedoceratops hatcheri (USNM 2412),
      diagnosing the genus by an undifferentiated nasal horncore, near-vertical
      postorbital horncores, and small parietal fenestrae.
  - id: mateus2008a
    notes: Independent replacement-name proposal coining Diceratus for
      Diceratops Lull, 1905; Mateus was unaware of Ukrainsky's earlier
      Nedoceratops, making Diceratus a junior objective synonym.
  - id: olshevsky1991a
    notes: Treats Diceratops as a valid genus distinct from Triceratops,
      following Forster's 1990 SVP work; predates the recognition of the
      Diceratops preoccupation and the Ukrainsky (2007) replacement.
  - id: jones2026a
    notes: Source of the body length estimate, and the appearance features.
  - id: scannella2010a
    notes: Treated Nedoceratops as an ontogenetic morph within Triceratops.
  - id: scannella2011a
    notes: Treated USNM 2412 (Nedoceratops) as an ontogenetic Triceratops morph within the Torosaurus-Triceratops synonymy argument.
  - id: maiorino2013a
    notes: Morphometric study with equivocal results for Nedoceratops — squamosal and frill fall within Triceratops morphospace, though overall skull shape is ambiguous.
