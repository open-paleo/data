synonyms:
  - name: Diceratops
    type: preoccupied
    reason: Original generic combination, preoccupied by Diceratops
      Förster, 1869 (a hymenopteran wasp in Ichneumonidae). The
      dinosaur was renamed Nedoceratops by Ukrainsky (2007).
  - name: Diceratus
    type: junior objective
    reason: Independent replacement name proposed by Mateus
      (2008) for the preoccupied Diceratops Lull, 1905, but
      Ukrainsky (2007) had already published Nedoceratops with
      priority. Diceratus is therefore an unused junior objective
      synonym of Nedoceratops.
species:
  - name: Nedoceratops hatcheri
    etymology: Honors John Bell Hatcher, who collected the
      holotype skull in 1891; the original combination
      Diceratops hatcheri was published by Lull (1905) from
      Hatcher's posthumous description.
    status: disputed
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Maastrichtian
      from_ma: 68.0
      to_ma: 66.0
    location:
      country: US
      region: Niobrara County, Wyoming, near Lightning Creek
      formation: Lance Formation
    holotype:
      specimen_id:
        - USNM 2412
      specimen_type: holotype
      institution: NMNH
      material: Nearly complete cranium approximately 1.8 m in
        greatest length; lacks the caudal margin of the parietal
        and most of the right postorbital horncore. Nearly all
        cranial sutures are obliterated by co-ossification,
        indicating an old adult individual.
    described: 1905
    authors: Lull
    described_in: lull1905
