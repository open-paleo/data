genus: Ningyuansaurus
parent: Maniraptora
placement: incertae sedis
etymology: Derived from Ningyuan, an ancient name for Xingcheng City in western
  Liaoning Province, China, combined with Greek sauros meaning 'lizard'
dispute:
  summary: >
    The affinities of Ningyuansaurus are unresolved and it may lie outside
    Oviraptorosauria. The original description (Ji and colleagues, 2012) recovered it as
    the basalmost oviraptorosaur, but Hartman and colleagues (2019) instead recovered it
    as a halszkaraptorine dromaeosaurid (sister to Mahakala), and Cau and Madzia
    (2021) recovered it under equal weighting as a basal troodontid within
    Sinovenatorinae, shifting to a basal oviraptorosaur only under implied
    weighting. It is therefore placed conservatively at Maniraptora.
diet: omnivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
  - forested
diagnostic_features:
  - At least 10 upper and 14 lower jaw teeth on each side
  - Femur much longer than ilium
  - Distal caudal vertebrae much elongated
appearance:
  integument: feathered
  evidence: inferred
identifiers:
  - source: pbdb
    id: "261035"
  - source: wikidata
    id: Q6580233
  - source: gbif
    id: "8446236"
species:
  - name: Ningyuansaurus wangi
    etymology: Named for Wang Qiuwu, who provided the specimen for scientific
      study.
    pronunciation:
      phonetic: WAHNG-eye
    status: valid
    type_species: true
    period:
      name:
        - Early Cretaceous
      stage:
        - Barremian
    location:
      country: CN
      locality: Lamadong
      region: CN-LN
      formation: Yixian
    type_specimen:
      specimen_type: holotype
      institution: CDM
      status: uncataloged
      material: Nearly complete skeleton with skull and lower jaw, preserved as slab
        and counter-slab
      completeness: complete
    erected_in: ji2012a
references:
