  - id: hartman2019a
    notes: New paravian dinosaur study recovered Ningyuansaurus as a halszkaraptorine dromaeosaurid.
  - id: cau2021a
    notes: Phylogenetic affinities study recovered Ningyuansaurus as a basal troodontid under equal weighting.
