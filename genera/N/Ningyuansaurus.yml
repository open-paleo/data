genus: Ningyuansaurus
parent: Maniraptora
placement: incertae sedis
etymology: Derived from Ningyuan, an ancient name for Xingcheng City in western
  Liaoning Province, China, combined with Greek sauros meaning 'lizard'
description: Ningyuansaurus is a pennaraptoran dinosaur genus. It contains the
  single species Ningyuansaurus wangi, known from a fossil specimen from the
  Early Cretaceous Yixian Formation (Aptian stage, 124.6 Ma ago) of Jianchang,
  western Liaoning Province, People's Republic of China. It was originally
  thought to be the basalmost species of oviraptorosaur, based on its long skull
  and a greater number of teeth in comparison to any other known oviraptorosaur.
  However, later analyses have variously recovered it outside Oviraptorosauria,
  as a halszkaraptorine or a basal troodontid, and its affinities remain
  unresolved. The
  generic name Ningyuansaurus is derived from Ningyuan, an ancient name for
  Xingcheng City. The specific name honors Wang Qiuwu, the private owner of the
  specimen who donated it for scientific study. The specimen is now in the
  Confuciusornis Museum in Xingcheng.
dispute:
  summary: >
    The affinities of Ningyuansaurus are unresolved and it may lie outside
    Oviraptorosauria. The original description (Ji et al., 2012) recovered it as
    the basalmost oviraptorosaur, but Hartman et al. (2019) instead recovered it
    as a halszkaraptorine dromaeosaurid (sister to Mahakala), and Cau and Madzia
    (2021) recovered it under equal weighting as a basal troodontid within
    Sinovenatorinae, shifting to a basal oviraptorosaur only under implied
    weighting. It is therefore placed conservatively at Maniraptora.
  history:
    - date: "2026-07-01"
      note: >
        Evicted from Oviraptorosauria and placed at Maniraptora; the
        oviraptorosaur, troodontid, and halszkaraptorine hypotheses are all
        supported by different analyses and none prevails.
    - date: "2026-07-01"
      note: >
        Retained at Maniraptora incertae sedis; placement remains unresolved.
