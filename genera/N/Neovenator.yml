genus: Neovenator
parent: Neovenatoridae
description: "Neovenator is an extinct genus of carcharodontosaurian theropod
  dinosaur. It is known primarily from several skeletons found in the Early
  Cretaceous (Hauterivian–Barremian) Wessex Formation on the south coast of the
  Isle of Wight, southern England. The first remains of Neovenator were
  discovered in 1978 alongside those of the ornithopod Brighstoneus, after the
  collapse of part of Grange Chine. In 1996, Steve Hutt, David Martill and
  Michael Barker named the genus Neovenator. One species is known: the type
  species, N. salerii, after the Salero family who owned the site on which its
  remains were discovered."
diet: carnivore
