references:
  - id: hutt1996a
  - id: brusatte2008a
    notes: Comprehensive osteological monograph of the holotype with a formal
      diagnosis; recovers Neovenator as the basalmost carcharodontosaurid.
  - id: carrano2012a
    notes: Recovers Carcharodontosauria as Carcharodontosauridae plus
      Neovenatoridae, with Neovenator in the latter.
  - id: rauhut2024a
    notes: Recovers a Neovenatoridae of Neovenator and Chilantaisaurus within
      Allosauria.
  - id: tanaka2021a
    notes: Recovers Neovenator within Carcharodontosauria in both of its
      analyses.
  - id: aranciagarolando2024a
    notes: Recovers Neovenator as the sister of Carcharodontosauridae
      (supplementary information).
  - id: kellermann2025a
    notes: Recovers Carcharodontosauria under some weightings only; under the
      others Neovenator falls lower in Allosauroidea with Chilantaisaurus.
  - id: apesteguía2016a
    notes: Recovers Neovenator outside Allosauroidea, near coelurosaurs, after
      modifying the matrix, and calls the result in need of further testing.
  - id: aranciagarolando2022a
    notes: Places the megaraptorans, once grouped with Neovenator, in
      Coelurosauria.
