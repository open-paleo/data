genus: Neovenator
parent: Neovenatoridae
pronunciation:
  phonetic: NEE-oh-ve-NAY-tor
etymology: From Latin neo- ('new') and venator ('hunter'), meaning 'new hunter'
description: "Neovenator is an extinct genus of carcharodontosaurian theropod
  dinosaur. It is known primarily from several skeletons found in the Early
  Cretaceous (Hauterivian-Barremian) Wessex Formation on the south coast of the
  Isle of Wight, southern England. The first remains of Neovenator were
  discovered in 1978 alongside those of the ornithopod Brighstoneus, after the
  collapse of part of Grange Chine. In 1996, Steve Hutt, David Martill and
  Michael Barker named the genus Neovenator. One species is known: the type
  species, N. salerii, after the Salero family who owned the site on which its
  remains were discovered."
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Premaxilla with an accessory peg-and-socket interpremaxillary articulation in
    the dorsal symphyseal region
  - Maxilla with an enlarged maxillary fenestra about one-sixth the length of the
    maxillary tooth row
  - Scapulocoracoid glenoid fossa wider mediolaterally than long
    anteroposteriorly
  - Distal ischial boot with the left and right ischia conjoined anteriorly but
    diverging posterolaterally
  - Femoral head oriented anteromedially and inclined proximally
  - Thumbprint-shaped depression on the posterior femoral shaft lateral to the
    proximal end of the fourth trochanter
  - Robust suboval ridge on the external surface of the lesser trochanter of the
    femur
