genus: Norellraptor
parent: Microraptorinae
etymology: Named in honor of the American paleontologist Mark Allen Norell, with
  Latin 'raptor' (robber), a frequent suffix in dromaeosaurid names.
description: Norellraptor is an extinct monotypic genus of dromaeosaurid that
  lived in East Asia during the Early Cretaceous epoch.
locomotion: bipedal
diagnostic_features:
  - Premaxilla with the length of the prenarial part half the depth of the
    subnarial body.
  - Large promaxillary fenestra occupying the whole rostral third of the
    antorbital fossa, with its long axis inclined 35 degrees caudodorsally.
  - Pila promaxillaris narrower than the pila interfenestralis, both narrower
    than half the diameter of the maxillary fenestra.
  - Pubis gently curved caudoventrally, with a small foot whose posterior
    projection is less than the diameter of the pubic shaft.
appearance:
  features:
    - hindlimb feathers
    - feathered tail
  integument: feathered
  evidence: direct
species:
