genus: Noasaurus
parent: Noasaurinae
pronunciation:
  phonetic: NOH-ah-SAWR-us
etymology: Named after the Noroeste Argentino (northwestern Argentina) region,
  combined with Greek 'sauros' (lizard); meaning 'Northwestern Argentina
  lizard'.
description: Noasaurus is a genus of ceratosaurian theropod dinosaur from the
  Maastrichtian (Late Cretaceous) of Argentina. The type and only species is N.
  leali. The fragmentary holotype specimen of Noasaurus, PVL 4061, consisting of
  a few cranial and postcranial bones, was discovered from strata from the Lecho
  Formation of Southern Salta in 1975 by a team led by José Fernando Bonaparte.
  When described by Bonaparte and in PhD student Jaime Powell in 1980, it was
  believed to be a coelurosaur theropod and assigned to a family of its own;
  this family, Noasauridae, still exists, though has been reassigned to
  Ceratosauria.
diet: carnivore
locomotion: bipedal
