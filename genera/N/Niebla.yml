genus: Niebla
parent: Abelisaurinae
etymology: "From Spanish 'niebla' meaning 'mist', referring to the foggy days during the excavation of the fossil."
pronunciation:
  phonetic: nyeh-blah
description: Niebla antiqua is an extinct species of abelisaurid theropod
  dinosaurs from the Late Cretaceous (Maastrichtian) of Río Negro province,
  Argentina. Niebla antiqua is the only species in the genus Niebla, known from
  a partial, non-articulated skeleton. The holotype, found in the Allen
  Formation, represents an adult individual about nine years old in minimum age.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - frontals with deep longitudinal groove surrounding the supraorbital swelling
  - anteroposteriorly elongate supratemporal fenestra
  - parietal with posterolaterally oriented parietal alae
  - nuchal wedge of supraoccipital bone subequal in dorsoventral depth to the
    dorsoventral height of the occipital condyle
  - associated groove of the postemporal foramen completely enclosed by parietal
    and exoccipital-opisthotic bones
  - bony plate below the occipital condyle subrectangular in contour and
    dorsoventrally taller than transversely wide
appearance:
  features:
    - reduced forelimbs
  integument: scaled
  evidence: inferred
