genus: Niebla
parent: Abelisaurinae
etymology: Spanish for mist
description: Niebla antiqua is an extinct species of abelisaurid theropod
  dinosaurs from the Late Cretaceous (Maastrichtian) of Río Negro province,
  Argentina. Niebla antiqua is the only species in the genus Niebla, known from
  a partial, non-articulated skeleton. The holotype, found in the Allen
  Formation, represents an adult individual about nine years old in minimum age.
diet: carnivore
locomotion: bipedal
