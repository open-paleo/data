genus: Sirindhorna
parent: Hadrosauroidea
etymology: Named in honor of Princess Maha Chakri Sirindhorn of Thailand, in recognition of her support of Thai paleontology.
pronunciation:
  phonetic: sih-rin-DHOR-nuh
description: Sirindhorna is a genus of hadrosauroid ornithopod dinosaur from
  Early Cretaceous deposits of northeastern Thailand.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
diagnostic_features:
  - Sagittal crest extending along entire dorsal surface of parietal and
    reaching frontoparietal suture
  - Relatively straight frontoparietal suture
  - Caudodorsally faced supraoccipital
  - No participation of supraoccipital in foramen magnum
  - Antorbital fossa of maxilla not visible in lateral view
  - Simple troughs for dentary alveoli with vertical walls and tooth
    crown-shaped base
appearance:
  integument: scaled
  evidence: inferred
identifiers:
