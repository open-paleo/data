genus: Sinocoelurus
parent: Tetanurae
etymology: "From Latin/Greek 'Sino-' meaning 'Chinese' and Greek 'koilos' meaning 'hollow' and 'oura' meaning 'tail'; meaning 'Chinese hollow tail', referencing both the discovery location and the hollow-tailed genus Coelurus."
pronunciation:
  phonetic: SIEN-o-see-LOOR-us
description: Sinocoelurus is a genus of theropod dinosaur from the
  Oxfordian-?Tithonian-age Upper Jurassic Kyangyan Series of Sichuan, China. It
  is an obscure tooth taxon.
diet: carnivore
locomotion: bipedal
diagnostic_features:
  - Teeth long and slender with moderate compression and curvature
  - Both anterior and posterior sides ridged with no serrations
  - Enamel very thin; posterior ridge more prominent than anterior ridge
paleoenvironment:
  - fluvial
  - lacustrine
