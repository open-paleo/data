genus: Sinocoelurus
parent: Tetanurae
placement: incertae sedis
dispute:
  summary: >
    Sinocoelurus fragilis is a nomen dubium based on four isolated, unserrated
    teeth; its theropod identity has even been questioned. It is placed
    conservatively at Tetanurae incertae sedis.
  history:
    - date: "2026-07-02"
      note: Placed at Tetanurae incertae sedis; regarded as a nomen dubium.
etymology: "From Latin/Greek 'Sino-' meaning 'Chinese' and Greek 'koilos' meaning 'hollow' and 'oura' meaning 'tail'; meaning 'Chinese hollow tail', referencing both the discovery location and the hollow-tailed genus Coelurus."
pronunciation:
  phonetic: SIEN-o-see-LOOR-us
description: Sinocoelurus is a genus of theropod dinosaur from the Late
  Jurassic of Sichuan, China, known from teeth found at the top of the beds
  Young (1942) called the Kuangyuan Series, at Locality 47 south of Guangyuan.
  It is an obscure tooth taxon.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "38533"
  - source: wikidata
    id: Q871971
  - source: gbif
    id: "4822578"
species:
  - name: Sinocoelurus fragilis
    etymology: "From Latin 'fragilis' meaning 'fragile' or 'thin', referencing the very thin enamel on the fossilized teeth."
    status: nomen dubium
    type_species: true
    period:
      name:
        - Late Jurassic
    location:
      country: CN
      locality: Locality 47
      region: CN-SC
      notes: >
        Young (1942) collected the teeth "all from the rich shell-bearing
        layer at the top of the Kuangyuan Series", at Locality 47, "belonging
        to the top part of the Kuangyuan Series and immediately below the
        Chentsianyen conglomerate". Young and colleagues (1943) place the
        Kuangyuan Series concordantly above the Tsienfuyen Series and date the
        two together to "Upper Jurassic time (Purbeckian)", with the overlying
        conglomerate "tentatively regarded as of Cretaceous in age by its
        stratigraphic position". Dong and colleagues (1983) write that the
        region's red clastics "were formerly referred to as the Guangyuan
        Group", and their header gives these teeth the Chungking (Guangyuan)
        Group. In discussion they reassign the teeth to the Qianfoya
        Formation, against their own statement that "Overlying the Qianfoya
        Fm. are the red beds of the Chungking (Guangyuan) Group". Li and
        colleagues (2011) list the
        species in the upper Shaximiao Formation. Weiyuan, some 200 km away,
        is a separate area Young compares against this one.
    erected_in: young1942a
    type_specimen:
      specimen_id:
        - IVP AS V232
        - IVP AS V233
        - IVP AS V234
      specimen_type: syntype
      institution: IVPP
      material: Four isolated partial teeth
      completeness: fragmentary
references:
  - id: young1942a
  - id: dong1983a
    notes: Proposes the Qianfoya Formation for this material in discussion, while its
      own header gives the Chungking (Guangyuan) Group.
  - id: young1943a
    notes: Places the Kuangyuan Series concordantly above the Tsienfuyen Series, below a conglomerate tentatively dated Cretaceous, and dates the two series Upper Jurassic.
  - id: li2011a
    notes: Lists the species in the upper member of the Shaximiao Formation in a basin-wide faunal list, without discussing the Guangyuan locality.
