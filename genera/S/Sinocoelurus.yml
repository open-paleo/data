genus: Sinocoelurus
parent: Tetanurae
placement: incertae sedis
dispute:
  summary: >
    Sinocoelurus fragilis is a nomen dubium based on four isolated, unserrated teeth;
    its theropod identity has even been questioned. It is placed conservatively at
    Tetanurae incertae sedis.
  history:
    - date: "2026-07-02"
      note: Placed at Tetanurae incertae sedis; regarded as a nomen dubium.
etymology: "From Latin/Greek 'Sino-' meaning 'Chinese' and Greek 'koilos' meaning 'hollow' and 'oura' meaning 'tail'; meaning 'Chinese hollow tail', referencing both the discovery location and the hollow-tailed genus Coelurus."
pronunciation:
  phonetic: SIEN-o-see-LOOR-us
description: Sinocoelurus is a genus of theropod dinosaur from the
  Oxfordian-?Tithonian-age Upper Jurassic Kyangyan Series of Sichuan, China. It
  is an obscure tooth taxon.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "38533"
  - source: wikidata
    id: Q871971
  - source: gbif
    id: "4822578"
species:
  - name: Sinocoelurus fragilis
    etymology: "From Latin 'fragilis' meaning 'fragile' or 'thin', referencing the very thin enamel on the fossilized teeth."
    status: nomen dubium
    type_species: true
    period:
      name:
        - Late Jurassic
      stage:
        - Tithonian
    location:
      country: CN
      locality: Locality 47
      region: CN-SC
      notes: Young (1942) collected the teeth from a shell-bearing layer at the top
        of the Kuangyuan Series, an old rank term with no modern equivalent
        settled. Dong and colleagues (1983) propose the Qianfoya Formation in
        one passage and the Chungking Group in another; the Penglaizhen,
        Suining and Shaximiao formations have each been suggested elsewhere.
        Weiyuan, some 200 km away, is a separate area Young compares against
        this one.
    erected_in: young1942a
    type_specimen:
      specimen_id:
        - IVP AS V232
        - IVP AS V233
        - IVP AS V234
      specimen_type: syntype
      institution: IVPP
      material: Four isolated partial teeth
      completeness: fragmentary
references:
  - id: young1942a
  - id: dong1983a
    notes: Proposes the Qianfoya Formation for this material in discussion, while its
      own header gives the Chungking (Guangyuan) Group.
