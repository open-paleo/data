genus: Shanag
parent: Dromaeosauridae
dispute:
  summary: >
    Shanag is a small basal dromaeosaurid whose finer placement is unsettled. It
    is most often recovered among the basal dromaeosaurids, between Microraptorinae
    and Eudromaeosauria (Turner et al., 2012; Jones et al., 2026), but is sometimes
    recovered within Microraptorinae, and Agnolin and Novas (2013) suggested it may
    be a basal averaptoran closer to birds. It is placed at Dromaeosauridae
    incertae sedis pending resolution.
  history:
    - date: "2026-07-01"
      note: Moved from Microraptorinae to Dromaeosauridae incertae sedis (least-inclusive uncontested clade); basal-dromaeosaurid, microraptorine, and averaptoran hypotheses proposed.
etymology: Named after the 'shanag', the black-hatted dancers who perform in the
  Buddhist Cham ceremonial dance, referring to the locality in Mongolia where it
  was found.
description: Shanag is a genus of paravian theropod dinosaur from the Early
  Cretaceous Period of Mongolia. It may be a dromaeosaurid, but some researchers
  are skeptical of this classification. The type species is S. ashile.
diet: carnivore
locomotion: bipedal
