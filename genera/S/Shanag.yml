genus: Shanag
parent: Microraptorinae
etymology: Named after the 'shanag', the black-hatted dancers who perform in the Buddhist Cham ceremonial dance, referring to the locality in Mongolia where it was found.
description: Shanag is a genus of paravian theropod dinosaur from the Early
  Cretaceous Period of Mongolia. It may be a dromaeosaurid, but some researchers
  are skeptical of this classification. The type species is S. ashile.
diet: carnivore
locomotion: bipedal
