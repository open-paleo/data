genus: Sinopeltosaurus
parent: Thyreophora
placement: incertae sedis
pronunciation:
  phonetic: SY-no-PEL-to-SAWR-us
etymology: From Greek 'sino-' (Chinese, after the Sinae) and
  'peltē' (small shield) plus 'sauros' (lizard); meaning
  approximately 'Chinese small-shielded lizard', a replacement
  name for the preoccupied Sinopelta Ulansky, 2014a.
description: >
  Sinopeltosaurus is a dubious genus of extinct thyreophoran
  ornithischian dinosaur described by Roman Ulansky for the
  articulated ankle specimen FMNH CUP 2338 from the Lower
  Jurassic Lufeng Formation of Yunnan, China. The type and only
  species is S. minimus. The specimen was originally described
  by Irmis and Knoll (2008) as an indeterminate basal ornithischian
  and was later identified as a nomen dubium by Galton
  and Carpenter (2016), who listed it as Ornithischia indet.,
  possibly Thyreophora indet. Ulansky's companion paper used the
  variant name 'Sinopelta minima' for the same animal; Galton
  and Carpenter (2016) acted as first revisers under the ICZN and
  selected Sinopeltosaurus minimus as the official combination.
dispute:
  summary: >
    Sinopeltosaurus, based on an articulated tarsus from the Early
    Jurassic of China, is a nomen dubium; the material was originally
    described as an indeterminate ornithischian (Irmis and Knoll, 2008)
    and is most plausibly an early-diverging thyreophoran (Galton and
    Carpenter, 2016; Jones, 2026), though the original naming did not meet
    ICZN requirements.
  history:
    - date: "2026-06-29"
      note: Retained at Thyreophora incertae sedis; nomen dubium based on an isolated tarsus.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Foot elements considerably more massive than those of any lesothosaur or
    heterodontosaur
  - Metatarsals much shorter and thicker than other early ornithischians, though
    not to the degree of Scelidosaurus
  - Calcaneus and talus larger and more robust than in many other early
    ornithischian dinosaurs
  - Lower hind limb massive and short with widely separated digits despite small
    body size (~1.5–2 m)
appearance:
  integument: armored
  evidence: inferred
identifiers:
  - source: pbdb
    id: "374231"
  - source: wikidata
    id: Q24025946
synonyms:
  - name: Sinopelta
    type: preoccupied
    reason: Ulansky originally proposed Sinopelta minima for the
      FMNH CUP 2338 material in his companion DINOLOGIA paper
      (Ulansky, 2014a), but the name Sinopelta was preoccupied by
      Sinopelta Xue and Zhang, 1996 (Diptera). Ulansky (2014b)
      coined Sinopeltosaurus as the replacement name in a second
      DINOLOGIA paper the same year. Both Ulansky (2014) papers are
      treated as nomina dubia by Galton and Carpenter (2016).
species:
  - name: Sinopeltosaurus minimus
    etymology: From Latin 'minimus' (smallest), in reference to
      the small overall size of the type specimen.
    status: nomen dubium
    type_species: true
    period:
      name:
        - Early Jurassic
      stage:
        - Sinemurian
    location:
      country: CN
      locality: Hei Koa Peng
      region: CN-YN
      formation: Lufeng
      member: Zhangjiawa
    type_specimen:
      specimen_id:
        - FMNH CUP 2338
      specimen_type: holotype
      institution: FMNH
      material: Articulated left tarsus comprising the distal
        tibia, distal fibula, astragalus, calcaneum, distal
        tarsals III and IV, metatarsals II–IV, and several partial
        phalanges (Irmis and Knoll, 2008).
      completeness: fragmentary
    erected_in: ulansky2014b
references:
  - id: irmis2008a
    notes: Original peer-reviewed description of FMNH CUP 2338 as Ornithischia
      indet., from the Lower Jurassic Lufeng Formation; predates Ulansky's
      informal naming.
  - id: ulansky2014a
    notes: Informal DINOLOGIA-series classification table in which Ulansky
      proposed the (later preoccupied) name Sinopelta minima for FMNH CUP 2338.
      Treated as nomen dubium by Galton and Carpenter (2016).
  - id: ulansky2014b
    notes: In Russian. Informal DINOLOGIA monograph in which Ulansky replaces
      the preoccupied Sinopelta with Sinopeltosaurus; declared a nomen dubium by
      Galton and Carpenter (2016) on ICZN Art. 13 grounds.
  - id: galton2016a
    notes: Declares Ulansky's 2014 Sinopelta and Sinopeltosaurus nomena nuda
      (ICZN Art. 13 + venue) and nomina dubia (no autapomorphies); acts as first
      reviser selecting Sinopeltosaurus.
  - id: jones2026a
    notes: Placement and assessment in the Princeton Encyclopedia of Dinosaurs.
