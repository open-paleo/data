genus: Sinopeltosaurus
parent: Thyreophora
etymology: From Greek 'sino-' (Chinese, after the Sinae) and
  'peltē' (small shield) plus 'sauros' (lizard); meaning
  approximately 'Chinese small-shielded lizard', a replacement
  name for the preoccupied Sinopelta Ulansky, 2014a.
description: >
  Sinopeltosaurus is a dubious genus of extinct thyreophoran
  ornithischian dinosaur described by Roman Ulansky for the
  articulated ankle specimen FMNH CUP 2338 from the Lower
  Jurassic Lufeng Formation of Yunnan, China. The type and only
  species is S. minimus. The specimen was originally described
  by Irmis and Knoll (2008) as an indeterminate basal ornithischian
  and was later identified as a nomen dubium by Galton
  and Carpenter (2016), who listed it as Ornithischia indet.,
  possibly Thyreophora indet. Ulansky's companion paper used the
  variant name 'Sinopelta minima' for the same animal; Galton
  and Carpenter (2016) acted as first revisers under the ICZN and
  selected Sinopeltosaurus minimus as the official combination.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Foot elements considerably more massive than those of any lesothosaur or
    heterodontosaur
  - Metatarsals much shorter and thicker than other early ornithischians, though
    not to the degree of Scelidosaurus
  - Calcaneus and talus larger and more robust than in many other early
    ornithischian dinosaurs
  - Lower hind limb massive and short with widely separated digits despite small
    body size (~1.5–2 m)
