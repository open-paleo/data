genus: Sasayamagnomus
parent: Neoceratopsia
etymology: "Named for the Sasayama Basin in Hyōgo Prefecture, Japan, where the fossils were found, combined with Latin 'gnomus' meaning 'gnome'; meaning 'gnome from Sasayama.'"
pronunciation:
  phonetic: SAS-uh-YAH-muh-NO-mus
description: Sasayamagnomus is an extinct genus of neoceratopsian dinosaur from
  the Early Cretaceous (Albian age) Ohyamashimo Formation of Hyōgo Prefecture,
  Japan. The genus contains a single species, Sasayamagnomus saegusai. The
  holotype individual is estimated to reach 80 centimeters (2.6 ft) long,
  although this specimen is not fully grown.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Jugal with pronounced caudally expanded articular surface for the squamosal
  - Cranially oriented medial process of the squamosal with an acute angle
    (~10°) relative to the rostral process
  - Coracoid with prominent biceps tubercle on the lateral surface
  - "Lacrimal with unique combination: fungiform dorsal expansion, prominent
    ridge at ventral margin, and deep antorbital fossa"
