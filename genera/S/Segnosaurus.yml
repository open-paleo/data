genus: Segnosaurus
parent: Therizinosauridae
pronunciation:
  phonetic: SEG-no-SAWR-us
etymology: "From Latin 'segnis' meaning 'slow' and Greek 'sauros' meaning
  'lizard'; meaning 'slow lizard.' The specific name galbinensis refers to the
  Galbin region of the Gobi Desert."
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Lower jaw long and thin with closely positioned teeth
  - Anterior teeth morphologically similar to theropods but much smaller than
    carnosaur teeth
  - Deltopectoral crest of humerus prodigally developed
  - Forelimb claw sharply curved, pointed and laterally compressed
  - Ilia with broad anterior lobes and short posterior lobes with massive
    posterodorsal thickening
  - Metatarsus short and massive, does not narrow proximally
appearance:
  features:
    - enlarged pedal claws
  integument: feathered
  evidence: inferred
identifiers:
  - source: pbdb
    id: "38711"
  - source: wikidata
    id: Q131102
  - source: gbif
    id: "4822732"
  - source: eol
    id: "47458463"
species:
  - name: Segnosaurus galbinensis
    etymology: "Named for the Galbin region of Mongolia, the area where the holotype
      was discovered."
    pronunciation:
      phonetic: GAL-bi-NEN-sis
    status: valid
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Cenomanian
        - Turonian
    location:
      country: MN
      locality: Amtgai
      region: MN-053
      formation: Bayanshiree
    type_specimen:
      specimen_id: [ IGM 100/80 ]
      specimen_type: holotype
      institution: MPC
      material: Lower jaws, incomplete humerus, complete radius and ulna, separate
        phalanges and forelimb claw, almost complete pelvis, incomplete right femur, 6
        sacrals, 10 anterior caudals, 15 posterior caudals, first abdominal rib,
        dorsal rib fragments
      completeness: partial
    size:
      hip_height_m:
        min: 1.6
        max: 1.6
      length_m:
        min: 6.0
        max: 7.0
      weight_kg:
        min: 1300
        max: 1300
    erected_in: perle1979a
references:
