genus: Segnosaurus
parent: Therizinosauridae
pronunciation:
  phonetic: SEG-no-SAWR-us
etymology: "From Latin 'segnis' meaning 'slow' and Greek 'sauros' meaning
  'lizard'; meaning 'slow lizard.' The specific name galbinensis refers to the
  Galbin region of the Gobi Desert."
description: Segnosaurus is a genus of therizinosaurid dinosaur that lived in
  what is now southeastern Mongolia during the Late Cretaceous, about 102-86
  million years ago. Multiple incomplete but well-preserved specimens were
  discovered in the Gobi Desert in the 1970s, and in 1979 the genus and species
  Segnosaurus galbinensis were named. The generic name Segnosaurus means "slow
  lizard" and the specific name galbinensis refers to the Galbin region. The
  known material of this dinosaur includes the lower jaw, neck and tail
  vertebrae, the pelvis, shoulder girdle, and limb bones. Parts of the specimens
  have gone missing or become damaged since they were collected. Remains from
  Japan originally assigned to Allosaurus were reassigned to Segnosaurus sp. (of
  unspecified species) in 2025.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Lower jaw long and thin with closely positioned teeth
  - Anterior teeth morphologically similar to theropods but much smaller than
    carnosaur teeth
  - Deltopectoral crest of humerus prodigally developed
  - Forelimb claw sharply curved, pointed and laterally compressed
  - Ilia with broad anterior lobes and short posterior lobes with massive
    posterodorsal thickening
  - Metatarsus short and massive, does not narrow proximally
