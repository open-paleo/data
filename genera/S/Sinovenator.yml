genus: Sinovenator
parent: Sinovenatorinae
etymology: From Latin Sinae, "Chinese", combined with Latin venator, "hunter" -
  means "Chinese hunter"
description: Sinovenator is a genus of troodontid dinosaur from China. It is
  from the early Cretaceous Period.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
  - forested
diagnostic_features:
  - Straight and vertical anterior margin of antorbital fenestra
  - Frontal with vertical lamina bordering the lacrimal
  - Surangular T-shaped in cross-section with medial edge significantly lower
    than lateral edge
  - Prominent lateral cnemial crest continuous with the fibular crest
  - Long and slender posterior process of premaxilla excluding maxilla from
    external naris
  - Five sacrals instead of six as in other troodontids
