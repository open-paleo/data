genus: Skorpiovenator
parent: Brachyrostra
etymology: From Greek skorpios, "scorpion", combined with Latin venator, "hunter" - means "scorpion hunter", named because the excavation site was infested with scorpions
pronunciation:
  phonetic: SKOHR-pee-o-VEN-uh-tuh
description: Skorpiovenator is a genus of abelisaurid theropod dinosaur from the
  Late Cretaceous (Cenomanian to Turonian) Huincul Formation of Argentina. The
  sole species of Skorpiovenator, S. bustingorryi, was named in honor of Manuel
  Bustingorry, the late owner of the farm on which the type specimen was
  discovered. Formally described in 2009, the type specimen is one of the most
  complete and informative abelisaurids yet known, described from a nearly
  complete and articulated skeleton. A tibia fragment was assigned to
  Skorpiovenator in 2022.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Ascending process of maxilla homogeneously wide rostrocaudally
  - Maxillary horizontal ramus dorsoventrally deep with subparallel dorsal and
    ventral margins
  - 19 maxillary teeth, the highest maxillary tooth count of any abelisaurid
  - Angular with rostral end dorsoventrally deep, fitting between the splenial
    and prearticular
  - Antorbital fossa restricted to the maxilla, absent from the nasal and
    lacrimal
  - Double dorsal protuberances over each frontal
  - Quadratojugal with a thick jugal process, rounded in cross-section,
    laterally procumbent and covered by strong external rugosities
  - 21 dentary teeth, the highest dentary tooth count of any abelisaurid
  - Retroarticular fossa of the articular anteroposteriorly longer than
    lateromedially wide, divided by a strongly oblique crest
  - Dorsal margin of the central iliac blade convex in lateral view
  - Preacetabular blade subrectangular in lateral contour
  - Subvertically oriented swelling of the iliac blade at the level of the
    acetabulum
  - Tibial lateral condyle one-third wider than the medial condyle, with a
    flattened caudal margin in proximal view
  - Rounded, deep pit on the proximolateral surface of pedal digit IV phalanges
    1-3
