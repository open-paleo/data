genus: Skorpiovenator
parent: Brachyrostra
etymology: scorpion hunter
description: Skorpiovenator is a genus of abelisaurid theropod dinosaur from the
  Late Cretaceous (Cenomanian to Turonian) Huincul Formation of Argentina. The
  sole species of Skorpiovenator, S. bustingorryi, was named in honour of Manuel
  Bustingorry, the late owner of the farm on which the type specimen was
  discovered. Formally described in 2009, the type specimen is one of the most
  complete and informative abelisaurids yet known, described from a nearly
  complete and articulated skeleton. A tibia fragment was assigned to
  Skorpiovenator in 2022.
diet: carnivore
