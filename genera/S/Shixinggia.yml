genus: Shixinggia
parent: Heyuanninae
etymology: Named for Shixing County, Guangdong, China, where the fossil was discovered.
description: Shixinggia is a genus of oviraptorosaurian dinosaur from the Late
  Cretaceous period of Shixing County, Guangdong, China, for which it was named.
  While no skull was recovered, the specimen (BVP-112) is known from a fair
  amount of post-cranial material that shows it was a fairly derived
  oviraptorosaur of superfamily Caenagnathoidea.
dispute:
  summary: >
    Shixinggia is known only from postcranial material, and whether it is an
    oviraptorid or a caenagnathid is unresolved. Its describers (Lü and Zhang,
    2005) and a later analysis (Funston et al., 2020) place it within
    Oviraptoridae, the latter as the basalmost member of Heyuanninae, but the
    incompleteness of the specimen leaves open the possibility that it is instead
    a caenagnathid.
  history:
    - date: "2026-07-01"
      note: >
        Placed at Heyuanninae following Funston et al. (2020); its oviraptorid
        versus caenagnathid identity is not firmly established.
diet: omnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Preacetabular process of ilium shorter than postacetabular process, both
    ends obtuse in shape
  - Ventral margins of preacetabular and postacetabular processes higher than
    dorsal margin of acetabulum
  - Ratio of ilium height to length is 0.32
  - Large opening on anteromedial surface near proximal end of femur
  - Relatively small opening on proximal end of tibia
appearance:
