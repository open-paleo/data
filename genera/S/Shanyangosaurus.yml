genus: Shanyangosaurus
parent: Avetheropoda
pronunciation:
  phonetic: shahn-yahng-o-SAWR-us
etymology: Named after the Shanyang Formation (Shanyang County, Shaanxi, China) where it was found, combined with Greek sauros, "lizard" - means "Shanyang lizard"
description: Shanyangosaurus is a genus of theropod dinosaur found in Shaanxi,
  China, and known only from a partial sacrum, partial scapula, humeri, femur,
  tibia, metatarsals, and phalanges found in the Maastrichtian aged Shanyang
  Formation. The bones are reportedly hollow; this, along with other features of
  the femur and known foot bones, suggest it is a member of the coelurosauria,
  but a specific family cannot be determined without more material. Holtz et al.
  assigned Shanyangosaurus to Avetheropoda.
diet: carnivore
locomotion: bipedal
