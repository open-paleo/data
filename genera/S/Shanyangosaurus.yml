genus: Shanyangosaurus
parent: Avetheropoda
dispute:
  summary: >
    Shanyangosaurus niupanggouensis is known from a partial postcranium and is poorly
    constrained. It has been assigned to Avetheropoda (Holtz et al., 2004) and, in a
    more recent analysis, recovered as a basal oviraptorosaur close to Caudipteryx
    (Hartman et al., 2019), though that result is regarded as far from definitive. It
    is placed conservatively at Avetheropoda incertae sedis.
  history:
    - date: "2026-07-02"
      note: Placed at Avetheropoda incertae sedis; a more precise coelurosaurian (possibly oviraptorosaurian) affinity is unresolved.
pronunciation:
  phonetic: shahn-yahng-o-SAWR-us
etymology: Named after the Shanyang Formation (Shanyang County, Shaanxi, China) where it was found, combined with Greek sauros, "lizard" - means "Shanyang lizard"
description: Shanyangosaurus is a genus of theropod dinosaur found in Shaanxi,
  China, and known only from a partial sacrum, partial scapula, humeri, femur,
  tibia, metatarsals, and phalanges found in the Maastrichtian aged Shanyang
  Formation. The bones are reportedly hollow; this, along with other features of
  the femur and known foot bones, suggest it is a member of the coelurosauria,
  but a specific family cannot be determined without more material. Holtz et al.
  assigned Shanyangosaurus to Avetheropoda.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
appearance:
  integument: feathered
  evidence: direct
diagnostic_features:
  - Femur lacking a fourth trochanter
  - Femur distinctly curved anteriorly, relatively short, with a deep, wide
    intercondylar groove at the distal end
  - Tibia slender and twisted, with an elongated, flattened cnemial crest and a
    flattened distal end lacking deep grooves
  - Lesser trochanter of the femur in the form of a narrow ridge, with a small,
    shallow caudofemoral attachment scar lacking distinct margins
  - Tibia longer than the femur (ratio about 126%) and the metatarsus greatly
    elongated (about 53% of femur length)
