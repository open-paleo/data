genus: Sarcolestes
parent: Ankylosauria
etymology: From Ancient Greek sarx (flesh) and lestes (robber); meaning "flesh robber".
pronunciation:
  phonetic: SAHR-ko-LES-teez
description: Sarcolestes is an extinct genus of ankylosaurian ornithischian dinosaur
  from the Oxford Clay of England. The current type and only species is S. leedsi,
  and the holotype is a single partial left mandible. The genus and species were
  named in 1893 by Richard Lydekker, who thought they belonged to a theropod.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - marine
diagnostic_features:
  - Mandibular symphysis with marked deflection, deflected portion falling away
    to extremity of shallow symphysis
  - Alveolar margin with abrupt deflection near middle, penetrated by
    approximately 19 complete dental alveoli extending to symphysis extremity
  - Teeth with laterally compressed crowns, trenchant serrated fore-and-aft
    edges, and sharp point; marginal serrations relatively large and oblique to
    long axis
  - Tooth crown recurved with prominent vertical ridge on outer surface
    continuing to summit
  - Dental succession with replacing teeth perforating jaw internally,
    subsequently breaking into main alveoli (unlike crocodilians)
  - "Theropod characters: quadratic cavity narrower than crocodilians, articular
    production behind cavity less pronounced, surangular upper margin rises
    above quadratic cavity plane"
