genus: Sinoceratops
parent: Centrosaurinae
etymology: From Latin Sinae, "Chinese", combined with Greek keras, "horn", and ops, "face" - means "Chinese horned face"
pronunciation:
  ipa: /ˌsaɪnoʊˈsɛrətɒps/
description: Sinoceratops is an extinct genus of ceratopsian dinosaur that lived
  from 77.3 to 73.5 million years ago during the latter part of the Cretaceous
  Period in what is now Shandong province in China. It was named in 2010 by Xu
  Xing et al. for three skulls from Zhucheng, China. The name of the type
  species Sinoceratops zhuchengensis means "Chinese horned face from Zhucheng",
  after the location of its discovery. Sinoceratops was a medium-sized,
  averagely-built, ground-dwelling, quadrupedal herbivore. It could grow up to
  an estimated 5 meters (16 ft) in length and weigh up to 2 tonnes (2.0 long
  tons; 2.2 short tons).
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Large centrosaurine ceratopsid with at least ten robust, strongly curved
    horn-like processes along the posterior margin of the parietals and at least
    four horn-like processes on the squamosals
  - Large accessory fenestra anterior to the antorbital fenestra
  - Weakly undulated external margin of the parietals
  - Broadly based epoccipitals
