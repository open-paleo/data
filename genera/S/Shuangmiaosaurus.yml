genus: Shuangmiaosaurus
parent: Hadrosauromorpha
pronunciation:
  phonetic: shwahng-MYOW-SAWR-us
etymology: Named after the village of Shuangmiao in Beipiao, Liaoning Province,
  China, the site of discovery, combined with Greek 'sauros' (lizard).
description: Shuangmiaosaurus is a genus of herbivorous iguanodontian ornithopod
  dinosaur which lived in China during the Late Cretaceous Period, about 100
  million years ago.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - lacustrine
diagnostic_features:
  - Butt-jointed maxilla-jugal suture, distinguishing it from other basal
    hadrosauroids
  - Antorbital fenestra positioned on anterior dorsal margin of maxilla
  - Expanded, laterally flattened dorsal process of the maxilla
  - Elongate lozenge-shaped maxillary crowns with curved, mammillated denticles
    on mesial and distal margins
  - Dentary with dentary ramus parallel-sided and coronoid process laterally
    offset with horizontal shelf separating dentition from process
  - Tooth roots partially cemented with rugose, angular-sided roots
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "84661"
  - source: wikidata
    id: Q28554416
  - source: eol
    id: "52570645"
species:
  - name: Shuangmiaosaurus gilmorei
    etymology: "Named for the American paleontologist Charles Whitney Gilmore."
    status: valid
    type_species: true
    period:
      name:
        - Early Cretaceous
        - Late Cretaceous
      stage:
        - Albian
        - Cenomanian
    location:
      country: CN
      locality: Shuangmiao Village, Beipiao
      region: CN-LN
      formation: Sunjiawan
      notes: The only printed position near the site is Dong's (2002) GPS fix
        for the Shuangmiao fossil site of the batch he identified as
        Crichtonsaurus; You and colleagues (2003) give the holotype only as
        from the Sunjiawan Formation "near Shuangmiao Village", and no source
        ties it to that point.
    type_specimen:
      specimen_id: [ LPM 0165 ]
      specimen_type: holotype
      institution: LPM
      material: Complete left maxilla with partial articulated premaxilla and lacrimal
      completeness: fragmentary
    size:
      length_m:
        min: 7.5
        max: 7.5
      weight_kg:
        min: 2500
        max: 2500
    erected_in: you2003b
references:
  - id: you2003b
  - id: madzia2019a
    notes: Recovered Shuangmiaosaurus as the sister of Plesiohadros, outside
      Hadrosauridae, in the majority-rule trees of both runs; the strict
      consensus of the second run leaves it in an unresolved polytomy.
  - id: dong2002a
    notes: Gives a GPS fix for the Shuangmiao locality, and places it in Xiafu
      Township, Beipiao City.
