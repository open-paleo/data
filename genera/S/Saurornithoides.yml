genus: Saurornithoides
parent: Troodontinae
pronunciation:
  ipa: /sɔːˌrɔːrnɪˈθɔɪdiːz/
  phonetic: saw-ROR-ni-THOY-deez
etymology: "From Greek 'sauros' meaning 'lizard', 'ornis' (stem 'ornith')
  meaning 'bird', and 'eidos' meaning 'form' or 'resemblance', referring to its
  bird-like skull."
description: Saurornithoides is a genus of troodontid maniraptoran dinosaur,
  which lived during the Late Cretaceous period. These creatures were predators,
  which could run fast on their hind legs and had excellent sight and hearing.
  The name is derived from the Greek stems saur~ (lizard), ornith~ (bird) and
  eides (form), referring to its bird-like skull.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - arid
diagnostic_features:
  - Diapsid skull with five craniofacial fenestrations and one mandibular
    fenestration
  - Long pointed rostrum suggesting avian affinities but reptilian/megalosaurian
    in form
  - Teeth subhomodont, flattened, serrate on posterior borders only (unlike
    Velociraptor)
  - Four premaxillary and fifteen maxillary teeth with uniform replacement and
    closely compacted crowns
  - Hind limb with four digits of typical megalosaurian type; terminal claw 30
    mm recurved
appearance:
  features:
    - sickle claw
  integument: feathered
  evidence: inferred
identifiers:
  - source: pbdb
    id: "38573"
  - source: wikidata
