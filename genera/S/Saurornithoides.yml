genus: Saurornithoides
parent: Saurornithoidini
pronunciation:
  ipa: /sɔːˌrɔːrnɪˈθɔɪdiːz/
  phonetic: saw-ROR-ni-THOY-deez
etymology: "From Greek 'sauros' meaning 'lizard', 'ornis' (stem 'ornith')
  meaning 'bird', and 'eidos' meaning 'form' or 'resemblance', referring to its
  bird-like skull."
description: Saurornithoides is a genus of troodontid maniraptoran dinosaur,
  which lived during the Late Cretaceous period. These creatures were predators,
  which could run fast on their hind legs and had excellent sight and hearing.
  The name is derived from the Greek stems saur~ (lizard), ornith~ (bird) and
  eides (form), referring to its bird-like skull.
diet: carnivore
