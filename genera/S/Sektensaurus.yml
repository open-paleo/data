genus: Sektensaurus
parent: Elasmaria
etymology: From Tehuelche sekten, meaning "island", combined with Greek sauros, "lizard" - means "island lizard"
pronunciation:
  phonetic: SEK-ten-SOR-us
description: Sektensaurus is a genus of ornithopod dinosaur, possibly an
  elasmarian, from the Late Cretaceous (Maastrichtian) of Patagonia, Argentina.
  Its remains were uncovered in the fluvial tuffs of the Lago Colhué Huapí
  Formation in the Golfo San Jorge Basin. The type and only species is S.
  sanjuanboscoi. Sektensaurus is the first non-hadrosauroid ornithopod of
  central Patagonia. The discovery of the genus increases the anatomical
  knowledge of ornithopods and adds new data on the compositions of dinosaur
  faunas that lived in Patagonia close to Antarctica at the end of the
  Cretaceous.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Well developed lip on articular surfaces of dorsal vertebrae
  - Sacral vertebrae with transversally narrow ventral surfaces, keeled first
    sacral, wide unkeeled last sacrals
  - Fifth sacral vertebra postzygapophyses facets with thin border
  - Humerus with almost straight distal end and slightly marked incisura
  - Distal humeral condyles nearly equal in size
appearance:
  integument: scaled
  evidence: inferred
