genus: Santanaraptor
parent: Coelurosauria
placement: incertae sedis
dispute:
  summary: >
    The placement of Santanaraptor is contested. It has been recovered as a
    tyrannosauroid (a rare Gondwanan record) by several authors, an arrangement
    followed by Jones et al. (2026) but not universally accepted. Delcourt et al.
    (2025) recovered it as an early-branching megaraptoran within Tyrannosauroidea
    under equal weights, but preferred an earliest-branching Maniraptoromorpha
    position (with Tanycolagreus and Mirischia) under implied weights, explicitly
    rejecting tyrannosauroid and compsognathid affinities. The holotype is a
    juvenile with much missing data. It is placed conservatively at Coelurosauria
    incertae sedis.
  history:
    - date: "2026-07-01"
      note: Placed at Coelurosauria incertae sedis (least-inclusive uncontested clade); tyrannosauroid, megaraptoran-within-Tyrannosauroidea, and earliest-maniraptoromorph hypotheses proposed (Delcourt et al., 2025).
pronunciation:
  phonetic: sahn-TAHN-uh-RAP-tor
etymology: Named after the Santana Formation of Brazil where the fossil was
  found, combined with Latin raptor (thief); meaning "Santana Formation thief".
description: Santanaraptor is a genus of coelurosaurian theropod dinosaur that
  lived in South America during the Early Cretaceous (late Aptian-early Albian),
  about 112 million years ago.
diet: carnivore
locomotion: bipedal
