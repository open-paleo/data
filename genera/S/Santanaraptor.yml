references:
  - id: kellner1996a
    notes: Reports preserved muscle tissue and possible blood vessels in the
      Santanaraptor holotype.
  - id: kellner1999b
    notes: Named Santanaraptor.
  - id: hendrickx2022a
    notes: Documents preserved epidermis in the Santanaraptor holotype.
  - id: delcourt2025a
    notes: Recovered Santanaraptor as an early megaraptoran within
      Tyrannosauroidea under equal weights, and as an earliest-branching
      maniraptoromorph under implied weights, the preferred result.
  - id: jones2026c
    notes: Reports the tyrannosauroid placement and its alternatives.
  - id: holtz2004b
    notes: Suggested Santanaraptor may be a tyrannosauroid, without an analysis.
  - id: porfiri2014a
    notes: Recovered Santanaraptor as the first branch of a tyrannosauroid clade holding megaraptorans and the tyrannosaurid lineage.
  - id: delcourt2018a
    notes: Recovered Santanaraptor as a tyrannosauroid on three matrices.
  - id: dalsasso2011a
    notes: Recovered Santanaraptor as a basal maniraptoran, above Ornitholestes.
  - id: novas2012a
    notes: Found Santanaraptor unstable between a basal tyrannosauroid and a basal maniraptoriform, and pruned it.
  - id: rauhut2010a
    notes: Regard the characters Holtz (2004) gave as showing only a non-maniraptoran basal coelurosaur.
