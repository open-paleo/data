genus: Santanaraptor
parent: Coelurosauria
pronunciation:
  phonetic: sahn-TAHN-uh-RAP-tor
etymology: Named after the Santana Formation of Brazil where the fossil was
  found, combined with Latin raptor (thief); meaning "Santana Formation thief".
description: Santanaraptor is a genus of coelurosaurian theropod dinosaur that
  lived in South America during the Early Cretaceous (late Aptian-early Albian),
  about 112 million years ago.
diet: carnivore
locomotion: bipedal
