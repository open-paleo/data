genus: Santanaraptor
parent: Coelurosauria
placement: incertae sedis
dispute:
  summary: >
    The placement of Santanaraptor is contested. Holtz (2004) suggested it
    may be a tyrannosauroid, and Porfiri and colleagues (2014) and Delcourt
    and Grillo (2018) recover it as one; Delcourt and colleagues (2025)
    recover it as an early megaraptoran within Tyrannosauroidea under equal
    weights, but prefer an earliest-branching maniraptoromorph position,
    with Tanycolagreus, under implied weights. Dal Sasso and Maganuco (2011)
    recover it as a basal maniraptoran, and Novas and colleagues (2012) find
    it unstable between a basal tyrannosauroid and a basal maniraptoriform
    and prune it.
pronunciation:
  phonetic: sahn-TAHN-uh-RAP-tor
etymology: Named after the Santana Formation of Brazil where the fossil was
  found, combined with Latin raptor (thief); meaning "Santana Formation thief".
description: Santanaraptor is a genus of coelurosaurian theropod dinosaur that
  lived in South America during the Early Cretaceous (late Aptian-early Albian),
  about 112 million years ago.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - marine
  - coastal
appearance:
  integument: scaled
  evidence: direct
