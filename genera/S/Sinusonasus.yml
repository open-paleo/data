genus: Sinusonasus
parent: Troodontidae
etymology: From Latin 'sinus' (wave, curve, bay) + Latin 'nasus' (nose), meaning 'wavy nose' or 'sinuous nose', referring to the sinusoid (wave-like) form of the nasal bones in lateral view.
description: Sinusonasus is a genus of dinosaurs from the Early Cretaceous
  Period, recovered from the Yixian Formation. It lived in what is now the
  Liaoning Province of China. Sinusonasus was a theropod, specifically a
  troodontid dinosaur.
diet: carnivore
locomotion: bipedal
paleoenvironment:
