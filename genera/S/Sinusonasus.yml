genus: Sinusonasus
parent: Troodontidae
placement: incertae sedis
dispute:
  summary: >
    Sinusonasus is a basal troodontid whose grouping varies. Shen and
    colleagues (2017) and Pei and colleagues (2020) recover it within
    Sinovenatorinae, but other analyses place it outside that subfamily,
    often as the sister of Xixiasaurus (Xu and colleagues, 2012; Hartman and
    colleagues, 2019; Cau and Madzia, 2021; Sellés and colleagues, 2021;
    Kubota and colleagues, 2024).
  history:
    - date: "2026-07-01"
      note: Moved from Troodontidae to Sinovenatorinae following Shen and colleagues (2017); the derived-position alternative (Hartman and colleagues, 2019) is noted.
    - date: "2026-10-21"
      note: >
        Parent widened to Troodontidae; analyses split on membership in
        Sinovenatorinae.
etymology: From Latin 'sinus' (wave, curve, bay) + Latin 'nasus' (nose), meaning
  'wavy nose' or 'sinuous nose', referring to the sinusoid (wave-like) form of
  the nasal bones in lateral view.
pronunciation:
  phonetic: sih-NOO-soh-NAH-sus
description: Sinusonasus is a genus of dinosaurs from the Early Cretaceous
  Period, recovered from the Yixian Formation. It lived in what is now the
  Liaoning Province of China. Sinusonasus was a theropod, specifically a
  troodontid dinosaur.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
  - forested
diagnostic_features:
  - Sinusoid nasal in lateral view
  - Absence of a passage connecting the antorbital and maxillary fenestrae
  - Relatively large teeth compared to other troodontids
  - Plate-like chevrons forming a band-like structure along most of the tail
  - Long neck between the femoral head and shaft
appearance:
  integument: feathered
  evidence: inferred
identifiers:
  - source: pbdb
    id: "84667"
  - source: wikidata
    id: Q690483
  - source: gbif
    id: "4966269"
synonyms:
  - name: Sinucerasaurus
    type: junior objective
    reason: Not a separate taxon but a misspelling. A later paper by the same
      author rendered the genus as Sinucerasaurus, so the name carries the same
      type specimen as Sinusonasus.
species:
  - name: Sinusonasus magnodens
    etymology: "From Latin 'magnus' meaning 'large' and 'dens' meaning 'tooth',
      referring to the notably large middle maxillary teeth of this troodontid."
    status: valid
    type_species: true
    period:
      name:
        - Early Cretaceous
      stage:
        - Barremian
    location:
      country: CN
      locality: Lujiatun, Beipiao
      region: CN-LN
      formation: Yixian
    type_specimen:
      specimen_id: [ IVPP V11527 ]
      specimen_type: holotype
      institution: IVPP
      material: An articulated skeleton missing the presacral vertebrae, shoulder
        girdles and forelimbs.
      completeness: partial
    size:
      hip_height_m:
        min: 0.3
        max: 0.3
      length_m:
        min: 1.0
