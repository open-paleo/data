genus: Sinusonasus
parent: Sinovenatorinae
dispute:
  summary: >
    Sinusonasus was recovered within Sinovenatorinae by its subfamily's erecting
    analysis (Shen et al., 2017), the placement adopted here, but Hartman et al.
    (2019) instead recover it in a more derived position (paired with Xixiasaurus,
    near Hesperornithoides), and Jones et al. (2026) note its position is unstable.
  history:
    - date: "2026-07-01"
      note: Moved from Troodontidae to Sinovenatorinae following Shen et al. (2017); the derived-position alternative (Hartman et al., 2019) is noted.
etymology: From Latin 'sinus' (wave, curve, bay) + Latin 'nasus' (nose), meaning
  'wavy nose' or 'sinuous nose', referring to the sinusoid (wave-like) form of
  the nasal bones in lateral view.
pronunciation:
  phonetic: sih-NOO-soh-NAH-sus
description: Sinusonasus is a genus of dinosaurs from the Early Cretaceous
  Period, recovered from the Yixian Formation. It lived in what is now the
  Liaoning Province of China. Sinusonasus was a theropod, specifically a
  troodontid dinosaur.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
  - forested
diagnostic_features:
  - Sinusoid nasal in lateral view
  - Absence of a passage connecting the antorbital and maxillary fenestrae
  - Relatively large teeth compared to other troodontids
  - Plate-like chevrons forming a band-like structure along most of the tail
  - Long neck between the femoral head and shaft
appearance:
  integument: feathered
  evidence: inferred
