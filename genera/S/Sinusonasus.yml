    notes: Named Sinusonasus as a troodontid.
  - id: jones2026c
    notes: Source of the hip height estimate.
  - id: hartman2019a
    notes: Recovered Sinusonasus as the sister of Xixiasaurus, outside
      Sinovenatorinae.
  - id: shen2017b
    notes: Recovered Sinusonasus within Sinovenatorinae, as the sister of
      Daliansaurus.
  - id: pei2020a
    notes: Recovered Sinusonasus within Sinovenatorinae.
  - id: xu2012b
    notes: Recovered Sinusonasus as the sister of a clade of derived troodontines.
  - id: cau2021a
    notes: Recovered Sinusonasus as the sister of Sinornithoides.
  - id: sellés2021a
    notes: Recovered Sinusonasus as the sister of Xixiasaurus.
  - id: kubota2024a
    notes: Recovered Sinusonasus as the sister of Xixiasaurus.
