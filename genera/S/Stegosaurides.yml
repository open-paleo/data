genus: Stegosaurides
parent: Thyreophora
etymology: "From 'Stegosaurus' and Greek '-ides' meaning 'resembling' or 'shaped
  like'; meaning 'Stegosaurus-shaped', referencing its similarity in armoring to
  Stegosaurus."
pronunciation:
  phonetic: STEG-oh-suh-RYE-deez
description: Stegosaurides is a genus of herbivorous thyreophoran (perhaps
  ankylosaurid or possibly stegosaurian) dinosaur. It lived during the
  Cretaceous. Its fossils were found in the Xinminbao Group near Heishan in
  Gansu Province in China. These fossils consist of fragmentary material,
  including dermal spine elements. The genus is occasionally misspelled as
  "Stegosauroides".
dispute:
  summary: >
    Stegosaurides is a nomen dubium based on fragmentary thyreophoran
    remains from the Cretaceous of China that cannot be assigned to either
    Stegosauria or Ankylosauria with confidence (Jones, 2026).
  history:
    - date: "2026-06-29"
      note: Retained at Thyreophora incertae sedis (P2); nomen dubium, indeterminate thyreophoran.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Vertebral centra large, compact, almost cubical; cross-section at midpoint
    and end surfaces square
  - Vertebrae slightly amphicoelous with moderately wide neural canal
  - Dermal spine basal expansion asymmetrical; lower surface slightly convex,
    smooth centrally and rugose marginally
  - Dermal spine base bears two deep smooth-walled cavities separated by a
    narrow lamella rising from a posterior corner
  - Dermal spine surface smooth, rising from base at approximately 45 degrees
appearance:
  integument: armored
  evidence: inferred
