genus: Stegosaurides
parent: Thyreophora
placement: incertae sedis
etymology: "From 'Stegosaurus' and Greek '-ides' meaning 'resembling' or 'shaped
  like'; meaning 'Stegosaurus-shaped', referencing its similarity in armoring to
  Stegosaurus."
pronunciation:
  phonetic: STEG-oh-suh-RYE-deez
description: Stegosaurides is a genus of herbivorous thyreophoran (perhaps
  ankylosaurid or possibly stegosaurian) dinosaur. It lived during the
  Cretaceous. Its fossils were found in the Xinminpu Group near Heishan in
  Gansu Province in China. These fossils consist of fragmentary material,
  including dermal spine elements. The genus is occasionally misspelled as
  "Stegosauroides".
dispute:
  summary: >
    Bohlin (1953) provisionally placed Stegosaurides excavatus in
    Stegosauridae, but later reviews refer it to Ankylosauria (Maryańska,
    1977; Coombs, 1978; Vickaryous and colleagues, 2004), and Arbour and
    Currie (2015) find its affinities impossible to determine beyond a
    questionable thyreophoran, since the spine base occurs in both
    stegosaurs and ankylosaurs.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
appearance:
  integument: armored
  evidence: inferred
identifiers:
  - source: pbdb
    id: "38841"
  - source: wikidata
    id: Q1956529
  - source: gbif
    id: "4823336"
species:
  - name: Stegosaurides excavatus
    etymology: "From Latin 'excavatus' meaning 'hollowed out', referring to two
      large depressions, one on each side of the spine base."
    status: nomen dubium
    type_species: true
    period:
      name:
        - Early Cretaceous
      stage:
        - Barremian
        - Aptian
        - Albian
    location:
      country: CN
      locality: Hui-hui-p'u
      region: CN-GS
      group: Xinminpu
    type_specimen:
      specimen_type: holotype
      status: unknown
      material: A couple of vertebrae and the base of a dermal spine
      completeness: fragmentary
    erected_in: bohlin1953a
references:
  - id: bohlin1953a
    notes: Named Stegosaurides for two vertebrae and the base of a dermal spine,
      provisionally in Stegosauridae.
  - id: jones2026a
    notes: Lists the genus among nomina dubia, as an indeterminate thyreophoran.
  - id: maryańska1977a
    notes: Treated Stegosaurides as a nomen dubium on very incomplete, badly preserved material, a questionable ankylosaur.
  - id: coombs1978a
    notes: Listed Stegosaurides in Ankylosauridae; examined a cast of the type, AMNH 2070.
  - id: carpenter2001d
    notes: Listed Stegosaurides among ankylosaur taxa whose material does not allow a diagnosis.
  - id: vickaryous2004a
    notes: Listed Stegosaurides excavatus among the nomina dubia of Ankylosauria.
  - id: arbour2015a
    notes: Found the affinities of Stegosaurides impossible to determine; nomen dubium, ?Thyreophora indet.
