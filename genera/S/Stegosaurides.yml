genus: Stegosaurides
parent: Thyreophora
placement: incertae sedis
etymology: "From 'Stegosaurus' and Greek '-ides' meaning 'resembling' or 'shaped
  like'; meaning 'Stegosaurus-shaped', referencing its similarity in armoring to
  Stegosaurus."
pronunciation:
  phonetic: STEG-oh-suh-RYE-deez
description: Stegosaurides is a genus of herbivorous thyreophoran (perhaps
  ankylosaurid or possibly stegosaurian) dinosaur. It lived during the
  Cretaceous. Its fossils were found in the Xinminpu Group near Heishan in
  Gansu Province in China. These fossils consist of fragmentary material,
  including dermal spine elements. The genus is occasionally misspelled as
  "Stegosauroides".
dispute:
  summary: >
    Stegosaurides is a nomen dubium based on fragmentary thyreophoran
    remains from the Cretaceous of China that cannot be assigned to either
    Stegosauria or Ankylosauria with confidence (Jones, 2026).
  history:
    - date: "2026-06-29"
      note: Retained at Thyreophora incertae sedis; nomen dubium, indeterminate thyreophoran.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
appearance:
  integument: armored
  evidence: inferred
identifiers:
  - source: pbdb
    id: "38841"
  - source: wikidata
    id: Q1956529
  - source: gbif
    id: "4823336"
species:
  - name: Stegosaurides excavatus
    etymology: "From Latin 'excavatus' meaning 'hollowed out', referring to two
      large depressions, one on each side of the spine base."
    status: nomen dubium
    type_species: true
    period:
      name:
        - Early Cretaceous
      stage:
        - Barremian
        - Aptian
    location:
      country: CN
      locality: Hui-hui-p'u
      region: CN-GS
      group: Xinminpu
    type_specimen:
      specimen_type: holotype
      status: unknown
      material: A couple of vertebrae and the base of a dermal spine
      completeness: fragmentary
    erected_in: bohlin1953a
references:
