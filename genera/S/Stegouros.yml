genus: Stegouros
parent: Parankylosauria
etymology: "From Greek 'stegos' meaning 'roof' and 'oura' meaning 'tail'; meaning 'roofed tail', referring to the roof-like covering of osteoderms over the tail."
pronunciation:
  ipa: /ˌstɛɡəˈjʊərɒs/
  phonetic: steh-GOO-ross
description: Stegouros is an extinct genus of ankylosaurian dinosaurs from the
  Late Cretaceous Dorotea Formation of southern Chile. The genus contains a
  single species, Stegouros elengassen, known from a semi-articulated,
  near-complete skeleton. Stegouros is a member of the Parankylosauria, a clade
  of small Gondwanan armored dinosaurs. It is characterized by its small body
  size and distinct arrangement of fused osteoderms forming a macuahuitl-like
  tail weapon.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
appearance:
  features:
    - osteoderms
    - tail club
  integument: armored
diagnostic_features:
  - Short tail with no more than 26 vertebrae (lowest among armored dinosaurs)
  - Seven pairs of large laterally-projecting osteoderms covering distal tail
  - Distalmost five osteoderms fused into flat composite unit forming frond-like
    structure
  - Medially bowed dentary tooth rows with 14 alveoli
  - Strongly medially inset maxillary tooth rows
  - Maxilla with medial process forming secondary palate
