  - name: Scolosaurus thronus
    etymology: From Latin 'thronus' (elevated seat, throne), for the species'
      high stratigraphic position in the Dinosaur Park Formation and its quarry
      atop a butte.
    status: valid
    type_species: false
    period:
      name:
        - Late Cretaceous
      stage:
        - Campanian
      from_ma: 76.5
      to_ma: 75.5
    location:
      country: CA
      region: Alberta
      formation: Dinosaur Park
      locality: Sternberg Quarry 112, Red Deer River (~40 m above the Oldman
        contact)
    type_specimen:
      specimen_id:
        - ROM 1930
      specimen_type: holotype
      institution: ROM
      material: Partially articulated skeleton with skull and teeth, dorsal
        vertebrae, a complete synsacrum, sacral ribs, most caudals, scapula,
        partial ilia, humerus, a cervical half-ring, osteoderms, and skin.
    diagnostic_features:
      - Eight vertebrae in the synsacrum (4-2-2, plus cd1), one fewer than in
        the type species
      - Proximal caudal neural spines craniocaudally compressed and curved
        cranially, unlike the erect, tapering spines of more distal caudals
      - Several osteoderm shapes with no counterparts in the type species,
        including more pronounced radial ribbing or fluting on some postcervical
        osteoderms
      - Proximal caudal osteoderms more strongly keeled
      - A large (28 cm), high osteoderm that is weakly mammillary, keeled
        cranially, and ribbed, with an open subconical apex
    erected_in: penkalski2018a
references:
  - id: nopcsa1928a
