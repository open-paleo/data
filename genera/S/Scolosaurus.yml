genus: Scolosaurus
parent: Euoplocephalini
etymology: From Greek 'skolos' (stake, thorn, prickle) + 'sauros' (lizard),
  meaning 'thorn lizard' or 'spiked lizard', referring to the spiky armor
  projections.
pronunciation:
  phonetic: SKOH-lo-SOR-us
description: Scolosaurus is an extinct genus of ankylosaurid dinosaurs within
  the subfamily Ankylosaurinae. It is known from the lower levels of the
  Dinosaur Park Formation and upper levels of the Oldman Formation in the Late
  Cretaceous (latest middle Campanian stage, about 76.5 Ma ago) of Alberta,
  Canada. The genus contains two species, S. cutleri and S. thronus. The type
  species, S. cutleri, measured up to 5.6 meters (18 ft) in length and 2.2
  metric tons (2.4 short tons) in body mass.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Glenoidal cavity elongated cranio-caudally (long axis at right angles to
    scapula axis, 13 cm long by 7 cm short axis), forcing humerus to move in
    horizontal plane only
  - Humerus slightly longer than tibia (ratio ~100:93); humerus twice as long as
    radius; femur to humerus ratio 2:3
  - Dermal armor of neck consisting of two pairs of tuberculated nuchal plates
    and separate crested lateral plates (not fused into a solid shield)
  - Dorsal back and tail transversely segmented, with anterior median region
    bearing a double row of blunt spines grading to flat round discs posteriorly
  - Tail carries two longitudinal rows of dermal spines that diminish in number
    but increase in size distally
  - Forelimb (humerus) protected by imbricated dermal bones bearing alternating
    pointed spines and sharp crests
