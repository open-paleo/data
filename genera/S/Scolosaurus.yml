genus: Scolosaurus
parent: Euoplocephalini
description: Scolosaurus is an extinct genus of ankylosaurid dinosaurs within
  the subfamily Ankylosaurinae. It is known from the lower levels of the
  Dinosaur Park Formation and upper levels of the Oldman Formation in the Late
  Cretaceous (latest middle Campanian stage, about 76.5 Ma ago) of Alberta,
  Canada. The genus contains two species, S. cutleri and S. thronus. The type
  species, S. cutleri, measured up to 5.6 metres (18 ft) in length and 2.2
  metric tons (2.4 short tons) in body mass.
diet: herbivore
locomotion: quadrupedal
