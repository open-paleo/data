genus: Scolosaurus
parent: Ankylosaurinae
etymology: From Greek 'skolos' (stake, thorn, prickle) + 'sauros' (lizard),
  meaning 'thorn lizard' or 'spiked lizard', referring to the spiky armor
  projections.
pronunciation:
  phonetic: SKOH-lo-SOR-us
description: Scolosaurus is an extinct genus of ankylosaurid dinosaurs within
  the subfamily Ankylosaurinae. It is known from the lower levels of the
  Dinosaur Park Formation and upper levels of the Oldman Formation in the Late
  Cretaceous (latest middle Campanian stage, about 76.5 Ma ago) of Alberta,
  Canada. The genus contains two species, S. cutleri and S. thronus. The type
  species, S. cutleri, measured up to 5.6 meters (18 ft) in length and 2.2
  metric tons (2.4 short tons) in body mass.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Osteoderms predominantly conical, subconical, or mammillary in shape, with
    a virtual absence of the oval to subrectangular, low-keeled osteoderms seen
    in Dyoplosaurus and Euoplocephalus
  - Presacral rod of four dorsosacral vertebrae with noticeably constricted
    intervertebral faces
  - Ilia weakly divergent; ischium with an unusually straight proximal border
    and a slight posterior inflection of the shaft distally
  - Forelimb well armored with conical spines; humerus more robust with a more
    distally expanded deltopectoral crest, and radius more elongate and
    sigmoidal, than in Euoplocephalus
  - First cervical half-ring anteroposteriorly broad, its osteoderms with a
    posteriorly situated apex and a rugose, perforate surface texture
  - Oval sacral fenestrae and hoof-shaped pedal unguals, contrasting with the
    larger fenestrae and more triangular unguals of Dyoplosaurus
