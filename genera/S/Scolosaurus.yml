  - id: penkalski2013b
    notes: Reinstates Scolosaurus as a valid ankylosaurid distinct from
      Euoplocephalus and Dyoplosaurus, with a revised diagnosis based on
      osteoderm, cervical half-ring, forelimb, and pelvic characters.
  - id: jones2026a
