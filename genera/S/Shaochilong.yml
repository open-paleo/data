genus: Shaochilong
parent: Carcharodontosauridae
etymology: shark toothed dragon
description: Shaochilong is an extinct genus of tetanuran theropod dinosaurs
  from the Early Cretaceous (Barremian to Albian stages) Miaogou Formation of
  China, though a more restrictive suggestion from the Aptian to the Albian has
  been suggested based on faunal composition. It was usually described as a
  carcharodontosaurid, but other phylogenies have suggested a different position
  as a tyrannosauroid or as a member of polytomic allosauroid. The genus
  contains a single species, Shaochilong maortuensis, which was originally
  placed in the genus Chilantaisaurus as C. maortuensis, but was re-described
  and reclassified in 2009.
diet: carnivore
