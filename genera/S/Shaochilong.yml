genus: Shaochilong
parent: Carcharodontosauridae
dispute:
  summary: >
    Shaochilong maortuensis has been recovered as a derived carcharodontosaurid, the
    first from Asia (Brusatte et al., 2009; Carrano et al., 2012; Jones et al.,
    2026), but Kellermann et al. (2025) instead recover it within Tyrannosauroidea in
    all analyses, rebutting the proposed carcharodontosaurid characters. It is
    retained conservatively at Carcharodontosauridae incertae sedis pending
    corroboration of the tyrannosauroid hypothesis.
  history:
    - date: "2026-07-01"
      note: Retained at Carcharodontosauridae incertae sedis (prevailing view; P5), with the recent tyrannosauroid hypothesis (Kellermann et al., 2025) reflected but not adopted.
etymology: "From Chinese '鲨齿' (shāchǐ) meaning 'shark tooth' and '龙' (lóng) meaning 'dragon'; meaning 'shark-toothed dragon', referring to its shark-like serrated teeth."
pronunciation:
  phonetic: Sha-chi-long
description: Shaochilong is an extinct genus of tetanuran theropod dinosaurs
  from the Early Cretaceous (Barremian to Albian stages) Miaogou Formation of
  China, though a more restrictive suggestion from the Aptian to the Albian has
  been suggested based on faunal composition. It was usually described as a
  carcharodontosaurid, but other phylogenies have suggested a different position
  as a tyrannosauroid or as a member of polytomic allosauroid. The genus
  contains a single species, Shaochilong maortuensis, which was originally
  placed in the genus Chilantaisaurus as C. maortuensis, but was re-described
  and reclassified in 2009.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Maxillary antorbital fossa reduced in extent and nearly absent
  - Paradental groove on medial surface of maxilla absent
  - Deep, dorsoventrally oriented grooves located dorsally on maxillary
    interdental plates
  - Pneumatic recess penetrates to posterior end of nasal
  - Sagittal crest on frontal
  - Large pneumatic foramen at anterodorsal corner of dorsal tympanic recess of
    prootic
  - Frontal sagittal crest rises from broad dorsal surface unlike in
    coelurosaurs and abelisaurids
