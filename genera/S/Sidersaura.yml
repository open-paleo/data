genus: Sidersaura
parent: Rebbachisauridae
etymology: "From Latin 'sidus/sideris' meaning 'star', referencing the star-like shape of the preserved haemal arches, combined with Greek 'saura' (feminine form of 'sauros') meaning 'lizard'; meaning 'star lizard.'"
description: Sidersaura is an extinct monotypic genus of rebbachisaurid sauropod
  dinosaur from the Late Cretaceous Huincul Formation of Argentina. The genus
  contains a single species, S. marae, known from the remains of four
  individuals. Sidersaura represents one of the largest known rebbachisaurids.
diet: herbivore
locomotion: quadrupedal
