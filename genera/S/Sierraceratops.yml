genus: Sierraceratops
parent: Chasmosaurinae
etymology: Named after Sierra County, New Mexico, where fossils were found, combined with Greek keras, "horn", and ops, "face" — means "Sierra horned face"
description: Sierraceratops is a genus of chasmosaurine ceratopsian from the
  Late Cretaceous Hall Lake Formation of New Mexico, United States. The genus
  contains a single species, Sierraceratops turneri, known from a partial
  skeleton discovered in 1997.
