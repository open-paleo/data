genus: Sierraceratops
parent: Chasmosaurinae
pronunciation:
  phonetic: see-EH-ruh-SERR-uh-tops
etymology: Named after Sierra County, New Mexico, where fossils were found, combined with Greek keras, "horn", and ops, "face" - means "Sierra horned face"
description: Sierraceratops is a genus of chasmosaurine ceratopsian from the
  Late Cretaceous Hall Lake Formation of New Mexico, United States. The genus
  contains a single species, Sierraceratops turneri, known from a partial
  skeleton discovered in 1997.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Posterior episquamosals small and triangular; lateral episquamosals low and
    long with width nearly four times their length
  - Median parietal bar with D-shaped cross-section, bar approximately as deep
    as wide
  - Postorbital horncore short, robust, and strongly mediolaterally compressed
  - "Jugal with two pronounced anterior flanges: one ventral to the
    jugal/maxilla contact, one anterior to the epijugal contact"
  - "Jugal with two processes for articulation with the epijugal horncore:
    anteroventral (long) and posteroventral (short)"
  - Epijugal horncore massive, pyramid-shaped, and longer than tall
appearance:
  integument: scaled
  evidence: inferred
