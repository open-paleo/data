genus: Shingopana
parent: Aeolosaurini
etymology: "From Swahili 'shingo' meaning 'neck' and 'pana' meaning 'wide'; meaning 'wide neck', in reference to the animal's broad neck."
pronunciation:
  phonetic: SHEEN-go-PAH-nah
description: Shingopana is a genus of titanosaurian sauropod from the Upper
  Cretaceous (late Campanian-early Maastrichtian age) Galula Formation of
  Tanzania. It is known from only the type species, S. songwensis. Gorscak &
  O'Connor's phylogenetic testing suggest Shingopana is more closely related to
  the South American titanosaur family of Aeolosaurini than any of the
  titanosaurs found so far in North and South Africa.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Middle-to-posterior cervical vertebrae with divided spinoprezygapophyseal
    lamina forming a spinoprezygapophyseal lamina fossa near the base of an
    expanded neural spine.
  - Bulbous lateral expansion of the neural spine in middle-to-posterior
    cervical vertebrae.
  - Camellate internal texturing of cervical vertebrae.
  - Elongated cervical rib shaft extending past succeeding vertebra.
  - Proximal region of dorsal ribs with pneumatic foramina.
  - Squared proximolateral corner of humerus.
