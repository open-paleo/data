    institution: BYU
    species: Supersaurus vivianae
    category: largest-individual
    significance: "A large cervical vertebra measuring 1.38 meters in length, the longest cervical known, from the Dry Mesa Quarry and reassigned to Supersaurus. One estimate gives an approximate length up to 50 meters, which would have made it the longest animal to ever live."
