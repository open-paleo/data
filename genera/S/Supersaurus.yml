genus: Supersaurus
parent: Diplodocinae
etymology: super lizard
description: Supersaurus is a genus of diplodocid sauropod dinosaur that lived
  in North America during the Late Jurassic period. The type species, S.
  vivianae, was first discovered by Vivian Jones of Delta, Colorado, in the
  middle Morrison Formation of Colorado in 1972. The fossil remains came from
  the Brushy Basin Member of the formation, dating between 153 and 145 million
  years ago. It is among the longest dinosaurs ever discovered, with the three
  known specimens reaching 33–40 meters (108–131 ft) in length, with the largest
  individual possibly exceeding 40 meters (130 ft) in size. Mass estimates for
  the WDC and BYU specimens tend to be around 35–44 metric tons (39–49 short
  tons) in body mass. A potential second species, S. lourinhanensis
  (Dinheirosaurus), is known from Portugal and has been dated to a similar time.
diet: herbivore
locomotion: quadrupedal
