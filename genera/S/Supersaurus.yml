synonyms:
  - name: Ultrasauros
    type: junior subjective
    reason: Now widely treated as a junior synonym of Supersaurus.
  - name: Dystylosaurus
    type: junior subjective
    reason: D. edwini, originally described from a dorsal vertebra found near the
      Supersaurus quarry, is now considered referable to Supersaurus.
  - name: Jensenosaurus
    type: nomen nudum
    reason: Informal name used for material now considered referable to Supersaurus.
