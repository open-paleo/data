genus: Sauroposeidon
parent: Somphospondyli
etymology: "From Greek 'sauros' meaning 'lizard' and Poseidon (Ποσειδών), the Greek god of the sea also associated with earthquakes; meaning 'lizard earthquake god', referencing the notion that the animal's immense weight shook the ground."
pronunciation:
  ipa: /ˌsɔːroʊpoʊˈsaɪdən/
description: Sauroposeidon is a genus of sauropod dinosaur known from several
  incomplete specimens including a bone bed and fossilized trackways that have
  been found in the U.S. states of Oklahoma, Wyoming, and Texas.
