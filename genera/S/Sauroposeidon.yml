genus: Sauroposeidon
parent: Somphospondyli
etymology: "From Greek 'sauros' meaning 'lizard' and Poseidon (Ποσειδών), the Greek god of the sea also associated with earthquakes; meaning 'lizard earthquake god', referencing the notion that the animal's immense weight shook the ground."
pronunciation:
  phonetic: SOR-o-po-SY-duhn
  ipa: /ˌsɔːroʊpoʊˈsaɪdən/
description: Sauroposeidon is a genus of sauropod dinosaur known from several
  incomplete specimens including a bone bed and fossilized trackways that have
  been found in the U.S. states of Oklahoma, Wyoming, and Texas.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Cervical centra extremely elongate; centrum length more than five times
    posterior centrum height
  - Well-defined centroparapophysial laminae extending to posterior ends of
    centra
  - Diapophyses located approximately one third of centrum length behind
    anterior condyles
  - Deeply excavated neural spines which are perforate in anterior cervicals
  - Neural spines occupy anterior nine-tenths of centra and are not bifurcate
  - Cervical ribs slender and elongated with long robust anterior processes
    extending nearly to anterior condyles
