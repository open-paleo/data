genus: Staurikosaurus
parent: Herrerasauridae
pronunciation:
  phonetic: STAWR-i-ko-SAWR-us
etymology: From Greek stauros ('cross') and sauros ('lizard'); meaning 'Southern
  Cross lizard', after the Southern Cross constellation visible from Brazil
  where it was found
description: Staurikosaurus is a genus of herrerasaurid dinosaur from the Late
  Triassic of Brazil, found in the Santa Maria Formation.
locomotion: bipedal
paleoenvironment:
  - fluvial
diet: carnivore
diagnostic_features:
  - Craniomedial region of the distal pubis distinctly beveled
  - Femoral cranial trochanter reduced in size
  - Distal end of the tibia subcircular in distal view
  - Dorsoventrally oriented sulcus on the medial surface of the proximal third of
    the fibula
appearance:
  integument: unknown
identifiers:
  - source: pbdb
    id: "38508"
  - source: wikidata
    id: Q131145
  - source: gbif
    id: "4823522"
  - source: eol
    id: "47459256"
species:
  - name: Staurikosaurus pricei
    etymology: "Named for Llewellyn Ivor Price, the Brazilian paleontologist who
      discovered the holotype specimen in 1936."
    status: valid
    type_species: true
    period:
      name:
        - Late Triassic
      stage:
        - Carnian
    location:
      country: BR
      locality: Sanga Grande
      region: BR-RS
      formation: Santa Maria
      member: Alemoa
    type_specimen:
      specimen_id: [MCZ 1669]
      specimen_type: holotype
      institution: MCZ
      material: Incomplete skeleton comprising both mandibular rami with tooth
        fragments in place, six cervical, 15 dorsal, three sacral and 34 caudal
        vertebrae, rib fragments, the distal left scapula, the ilia, ischia and
        pubes, the femora, tibiae and fibulae, and unidentified fragments.
      completeness: partial
    size:
      length_m:
        min: 2.1
        max: 2.3
      weight_kg:
        min: 12
        max: 12
    synonyms:
      - name: Teyuwasu
        type: junior subjective
        reason: Tentatively treated as a junior synonym of Staurikosaurus pricei pending
          further research.
    erected_in: colbert1970a
    described_in: bittencourt2009a
references:
  - id: colbert1970a
  - id: bittencourt2009a
    notes: Redescribes the holotype and gives the type locality as Sanga Grande,
      an outcrop of the Alemoa Member of the Santa Maria Formation.
