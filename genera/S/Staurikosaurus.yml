genus: Staurikosaurus
parent: Herrerasauridae
pronunciation:
  phonetic: STAWR-i-ko-SAWR-us
etymology: From Greek stauros ('cross') and sauros ('lizard'); meaning 'Southern
  Cross lizard', after the Southern Cross constellation visible from Brazil
  where it was found
description: Staurikosaurus is a genus of herrerasaurid dinosaur from the Late
  Triassic of Brazil, found in the Santa Maria Formation.
locomotion: bipedal
paleoenvironment:
  - fluvial
diet: carnivore
diagnostic_features:
  - Vertebral centra spool-shaped/platycoelous with expanded ends and
    constricted middles
  - Three sacral vertebrae
  - Tail with minimum 35 caudal vertebrae
  - Femur shorter than tibia with strong fourth trochanter positioned one-third
    from proximal end
  - Tibia straight and slender with prominent cnemial crest
  - Pubis long and narrow, about three-fourths femur length, meeting in long
    symphysis
appearance:
  integument: unknown
identifiers:
  - source: pbdb
    id: "38508"
  - source: wikidata
    id: Q131145
  - source: gbif
    id: "4823522"
  - source: eol
    id: "47459256"
species:
  - name: Staurikosaurus pricei
    etymology: "Named for Llewellyn Ivor Price, the Brazilian paleontologist who
      discovered the holotype specimen in 1936."
    status: valid
    type_species: true
    period:
      name:
        - Late Triassic
      stage:
        - Carnian
    location:
      country: BR
      locality: Sanga Grande
      region: BR-RS
      formation: Santa Maria
      member: Alemoa
    type_specimen:
      specimen_id: [MCZ 1669]
      specimen_type: holotype
      institution: MCZ
      material: Partial skeleton including most of vertebral column (absent anterior
        region), pelvis, hind limb, and mandible.
      completeness: partial
    size:
      length_m:
        min: 2.1
        max: 2.3
      weight_kg:
        min: 12
        max: 12
    synonyms:
      - name: Teyuwasu
        type: junior subjective
        reason: Tentatively treated as a junior synonym of Staurikosaurus pricei pending
          further research.
    erected_in: colbert1970a
