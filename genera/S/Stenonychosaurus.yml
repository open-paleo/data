genus: Stenonychosaurus
parent: Troodontini
etymology: "From Greek 'stenos' meaning 'narrow', 'onyx/onychos' meaning 'claw',
  and 'sauros' meaning 'lizard'; meaning 'narrow claw lizard', referring to the
  narrow enlarged claw on the second toe."
description: Stenonychosaurus is a disputed genus of troodontid dinosaur from
  the Late Cretaceous Dinosaur Park Formation of Alberta, Canada, as well as
  possibly the Two Medicine Formation. The type and only species, S. inequalis,
  was named by Charles Mortram Sternberg in 1932, based on a foot, fragments of
  a hand, and some caudal vertebrae from the Late Cretaceous of Alberta. S.
  inequalis was reassigned in 1987 by Phil Currie to the genus Troodon, which
  was reverted by the recognition of Stenonychosaurus as a separate genus from
  the possibly dubious Troodon in 2017 by Evans et al. and also later in the
  same year by Van der Reest and Currie.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Inequality in length of the three functional digits of the hind foot
  - Ungual phalanges of the pes strongly laterally compressed
  - Specialized digit II with moderately sized, slightly curved, laterally
    compressed ungual
  - Metatarsal II much shorter than metatarsals III and IV
  - Caudal vertebrae amphiplatyan with well-developed longitudinal groove on
    inferior surface
  - Thick bone walls in phalanges of the manus, thicker than in Chirostenotes
