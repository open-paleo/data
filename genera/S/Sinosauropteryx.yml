genus: Sinosauropteryx
parent: Coelurosauria
pronunciation:
  phonetic: SIEN-o-saw-ROP-te-riks
etymology: "From Latin/Greek 'Sino-' meaning 'Chinese', Greek 'sauros' meaning
  'reptile' or 'lizard', and 'pteryx' meaning 'wing'; meaning 'Chinese reptilian
  wing.'"
description: Sinosauropteryx is an extinct genus of coelurosaurian theropod
  dinosaurs. Described in 1996, it was the first dinosaur taxon outside of
  Avialae (birds and their immediate relatives) to be found with evidence of
  feathers. It was covered with a coat of very simple filament-like feathers.
  Structures that indicate the color pattern have also been preserved in some
  of its feathers, which show that Sinosauropteryx had a countershading pattern
  in its body with a banded tail. The reddish brown coloration previously
  inferred for Sinosauropteryx is based on the melanosomes preserved in the
  specimen of a separate genus, Huadanosaurus. Some contention has arisen with
  an alternative interpretation of the filamentous impression as remains of
  collagen fibers, but this has not been widely accepted.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
  - forested
appearance:
  features:
    - tail bristles
  integument: feathered
diagnostic_features:
  - Extremely short, primitive, uniform feathers unlike later avian forms
  - Over 50 extremely elongated caudal vertebrae constituting 60% of body length
  - Forelimb extremely short (approximately two-fifths hind limb length) with
    short thick humerus (~20 mm)
  - Relatively high, blunt-rostrum skull with elliptical but not enlarged
    antorbital fenestra
  - Robust acute dentition with over 50 extremely developed teeth
  - Long robust hind limb with unfused proximal metatarsals and tarsals separated
