genus: Scansoriopteryx
parent: Scansoriopterygidae
dispute:
  summary: >
    Scansoriopteryx heilmanni and Epidendrosaurus ningchengensis were described
    nearly simultaneously and are widely regarded as the same taxon; the name in
    use depends on which publication is judged to have priority, with most workers
    (and Jones et al., 2026) treating Scansoriopteryx as the senior synonym. It is
    retained as a valid scansoriopterygid pending resolution.
  history:
    - date: "2026-07-01"
      note: Placed at Scansoriopterygidae (type genus); the Epidendrosaurus synonymy and priority question flagged for review.
etymology: "From Latin 'scansorius' meaning 'climbing' and Greek 'pteryx'
  meaning 'wing'; meaning 'climbing wing', in reference to its arboreal
  adaptations."
pronunciation:
  phonetic: san-SOH-ree-OP-tuh-riks
description: Scansoriopteryx is a genus of maniraptoran dinosaur. Described from
  only a single juvenile fossil specimen found in Liaoning, China,
  Scansoriopteryx is a sparrow-sized animal that shows adaptations in the foot
  indicating an arboreal (tree-dwelling) lifestyle. It possessed an unusual,
  elongated third finger which may have supported a membranous wing, much like
  the related Yi qi. The type specimen of Scansoriopteryx also contains the
  fossilized impression of feathers.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
  - forested
appearance:
  features:
    - orbital crest
    - elongate forelimbs
    - membranous wing
  integument: feathered
diagnostic_features:
  - Third digit of manus elongated to nearly twice that of second digit with
    robust, hypertrophied metacarpal
  - Elongate ventral process of postorbital in definite contact with ascending
    process of jugal
  - Large fenestra in lower jaw
  - Expanded/flared posterior end of scapula
  - Separate clavicles instead of furcula
  - Small, unexpanded pubic peduncle with short, non-retroverted pubis
  - Longer ischia and nearly closed acetabulum unlike archaeopterygids
  - Anisodactyl pes with longer hallux and reduced middle phalanges in digits
    III and IV
  - Semilunate distal carpal block with bird-like wrist articulation
