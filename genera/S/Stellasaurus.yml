genus: Stellasaurus
parent: Centrosaurinae
etymology: From Latin stella, "star", combined with Greek sauros, "lizard" - means "star lizard", in reference to the star-shaped head ornamentation and as a tribute to David Bowie's song "Starman"
pronunciation:
  phonetic: STELL-uh-SOR-us
description: Stellasaurus is a genus of centrosaurine ceratopsid dinosaur that
  lived in Montana during the Late Cretaceous. The type and only species is
  Stellasaurus ancellae. Its remains have been found in the late Campanian-aged
  Two Medicine Formation, the same geological unit which its relatives
  Rubeosaurus (now seen as a synonym of Styracosaurus), Einiosaurus, and
  Achelousaurus were discovered in.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Elongate, erect and recurved nasal horncore
  - Diminutive supraorbital ornamentation with pointed apex
  - Parietal with elongate, straight P3 processes
  - Partially elongate P4 processes less than half as long as P3
  - Non-elongate P5, P6 and P7 processes
  - Unique P4 elongation intermediate between S. albertensis and E.
    procurvicornis
appearance:
  features:
    - neck frill
    - frill spikes
  integument: scaled
  evidence: inferred
