genus: Silutitan
parent: Euhelopodidae
etymology: Named after the Silk Road (the ancient trade route through the region where it was found) combined with Greek titan, "giant" - means "Silk Road giant"
description: Silutitan is a genus of euhelopodid sauropod dinosaur from the
  Early Cretaceous Shengjinkou Formation of Xinjiang, China. It contains only
  the type species, Silutitan sinensis.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - lacustrine
diagnostic_features:
  - Ventrolaterally bifurcated postzygodiapophyseal laminae (PODL) in middle to
    posterior cervical vertebrae
  - Anteriorly bifurcated posterior centrodiapophyseal laminae (PCDL) on four
    posterior-most cervical vertebrae
  - Parapodiapophyseal laminae (PPDL) forming developed ventral flanges
  - Contact surface of diapophysis and tuberculum constricted on anterior and
    posterior faces
