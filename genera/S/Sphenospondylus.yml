genus: Sphenospondylus
parent: Iguanodontia
placement: incertae sedis
etymology: From Greek 'sphen' ('wedge') and 'spondylos' ('vertebra'), for the
  wedge-shaped base of the compressed centra.
description: Sphenospondylus is a dubious genus of iguanodontian ornithopod
  dinosaur from the Early Cretaceous Wealden of the Isle of Wight, England.
  Seeley (1883) erected the genus on a short series of dorsal vertebrae without
  naming a species, and Lydekker (1888) later added the epithet gracilis. The
  material cannot be diagnosed or associated with any other taxon, so the name
  is treated as a nomen dubium.
diet: herbivore
identifiers:
  - source: pbdb
    id: "66547"
species:
  - name: Sphenospondylus gracilis
    status: nomen dubium
    type_species: true
    period:
      name:
        - Early Cretaceous
    location:
      country: GB
      region: GB-IOW
      locality: Brook, Isle of Wight
      notes: Seeley (1883) records no provenance for the holotype, R142, in the Fox
        Collection; he suspects many of its vertebrae belonged to the same
        individual as the Brook material he founded the genus on, and that
        inference is what places it at Brook. Norman (2013) maps the upper
        Wessex Formation against the base of the Vectis Formation along this
        stretch of coast, so the unit would be the Wessex if the attribution
        holds.
    type_specimen:
      specimen_id:
        - NHMUK PV R 142
      specimen_type: holotype
      institution: NHMUK
      material: Series of six incomplete dorsal vertebrae, the centra strongly
        compressed laterally and the neural arches depressed.
      completeness: fragmentary
      notes: Seeley (1883) founded the genus on a series of six vertebrae in
        the Woodwardian Museum at Cambridge and declined to name a species,
        writing that he had refrained from doing so pending the question of
        whether the material belonged with Iguanodon seelyi. Lydekker (1888)
        added the epithet gracilis, and White (1973) and McDonald (2012) both
        give the type of that species as the London specimen recorded here.
    erected_in: lydekker1888a
erected_in: seeley1883b
references:
  - id: seeley1883b
    notes: Erects the genus on six dorsal vertebrae from the Wealden of Brook,
      Isle of Wight, without naming a species.
  - id: lydekker1888a
    notes: Adds the species epithet gracilis to Seeley's genus.
  - id: norman1986a
    notes: Judges the material an indeterminate series of dorsal vertebrae.
  - id: white1973a
    notes: Gives the type of the type species as BMNH R142, several dorsal
      vertebrae from the Wealden of the Isle of Wight.
  - id: norman2004a
    notes: Lists the species inside the Iguanodon atherfieldensis synonymy, a
      reading later withdrawn.
  - id: mcdonald2012b
    notes: Finds the type undiagnostic and not associable with any other taxon,
      and treats the species as a nomen dubium.
  - id: norman2013a
    notes: Records the dubious status of the species alongside Vectisaurus
      valdensis and Proplanicoxa galtoni.
