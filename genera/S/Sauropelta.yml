genus: Sauropelta
parent: Nodosauridae
pronunciation:
  phonetic: SOR-oh-PEL-tuh
  ipa: /ˌsɔːroʊˈpɛltə/
etymology: "From Greek 'sauros' (lizard) + 'pelte' (small shield), meaning
  'lizard shield', referring to the bony armor covering the body."
description: Sauropelta is a genus of nodosaurid dinosaur that existed in the
  Early Cretaceous Period of North America. One species (S. edwardsorum) has
  been named. Anatomically, Sauropelta is one of the most well-understood
  nodosaurids, with fossilized remains recovered in the U.S. states of Wyoming,
  Montana, and possibly Utah. It is also the earliest known genus of
  nodosaurine; most of its remains are found in a section of the Cloverly
  Formation dated to 108.5 million years ago.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Long mandibular tooth row with 25-27 alveoli extending close to symphysis,
    distinct from nodosaurs with fewer alveoli
  - Unfused atlas-axis with odontoid only fused to axis centrum, a primitive
    acanthopholid condition not seen in nodosaurs
  - Dermal armor consisting of hollow-based plates with concave to deeply
    hollowed inferior surfaces, more delicate than nodosaurs
  - Unfused ribs to dorsal vertebrae and unfused chevrons to caudal centra,
    distinct from nodosaur condition
  - Long slender femur relative to humerus with well-rounded internal condyles
    projecting far backward
  - Long narrow anterior iliac blade extending forward with long preacetabular
    process, characteristic of acanthopholids
appearance:
  features:
    - body armor
    - osteoderms
    - shoulder spikes
    - neck spines
  integument: armored
  evidence: direct
