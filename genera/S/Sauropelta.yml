genus: Sauropelta
parent: Nodosauridae
pronunciation:
  phonetic: SOR-oh-PEL-tuh
  ipa: /ˌsɔːroʊˈpɛltə/
etymology: "From Greek 'sauros' (lizard) + 'pelte' (small shield), meaning 'lizard shield', referring to the bony armour covering the body."
description: Sauropelta is a genus of nodosaurid dinosaur that existed in the
  Early Cretaceous Period of North America. One species (S. edwardsorum) has
  been named. Anatomically, Sauropelta is one of the most well-understood
  nodosaurids, with fossilized remains recovered in the U.S. states of Wyoming,
  Montana, and possibly Utah. It is also the earliest known genus of
  nodosaurine; most of its remains are found in a section of the Cloverly
  Formation dated to 108.5 million years ago.
diet: herbivore
locomotion: quadrupedal
