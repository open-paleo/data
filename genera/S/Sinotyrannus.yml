genus: Sinotyrannus
parent: Proceratosauridae
etymology: From Latin 'Sinae' (a classical name for the Chinese) and Greek
  'tyrannos' (tyrant); meaning 'Chinese tyrant'.
description: Sinotyrannus is an extinct genus of large proceratosaurid
  tyrannosauroid theropod from the Aptian (Early Cretaceous) lower Jiufotang
  Formation of Kazuo County, western Liaoning Province, China — part of the
  Jehol Biota. The single species, Sinotyrannus kazuoensis, is known from a
  disarticulated skeleton (KZV-001) including the anterior skull and
  mandibles, three articulated dorsal vertebrae, ribs, partial ilia, and
  manual phalanges. Originally placed within Tyrannosauroidea (and tentatively
  Tyrannosauridae) by Ji et al. (2009), subsequent phylogenetic analyses
  (Loewen et al. 2013, and others) recovered Sinotyrannus as a basal
  proceratosaurid. With an estimated body length of ~9-10 m, it is one of
  the largest known Early Cretaceous tyrannosauroids. Cau and Paterna (2025)
  proposed Sinotyrannus as the adult morphotype of the coeval compsognathid
  Huaxiagnathus, but that hypothesis is single-paper-recent and not yet a
  community consensus; the genus is treated as valid here.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
diagnostic_features:
  - Proportionally large external naris, long-oval in shape with a long axis
    of 212 mm.
  - Anterior portion of the dorsal margin of the maxilla slightly concave.
  - Maxillary fenestra reaches past the rostral margin of the antorbital
    fossa but stays separated from its ventral margin.
  - Preacetabular blade of the ilium short and lacking a ventrally expanded
    anterior hook.
