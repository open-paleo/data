genus: Saltasaurus
parent: Saltasaurinae
pronunciation:
  phonetic: SAHL-tah-SAWR-us
etymology: Named after Salta Province in northwestern Argentina, where the
  fossils were found, combined with Greek 'sauros' (lizard), meaning 'lizard
  from Salta'.
description: Saltasaurus is a genus of saltasaurid dinosaur of the Late
  Cretaceous period of Argentina. Small among sauropods, though still heavy by
  the standards of modern creatures, Saltasaurus was characterized by a short
  neck and stubby limbs. It was the first genus of sauropod known to possess
  armor of bony plates embedded in its skin. Such small bony plates, called
  osteoderms, have since been found on other titanosaurians.
diet: herbivore
locomotion: quadrupedal
