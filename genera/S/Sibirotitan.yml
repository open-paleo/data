genus: Sibirotitan
parent: Somphospondyli
pronunciation:
  phonetic: si-BEER-o-TIE-tan
etymology: From 'Siberia' (the Russian region where it was found) + 'Titan' (the giant beings of Greek mythology, commonly used for large sauropods), meaning 'Siberian titan'.
description: Sibirotitan is a genus of somphospondyl sauropod from the Early
  Cretaceous (Barremian age) Ilek Formation of Russia. The type and only species
  is S. astrosacralis.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - High hyposphene ridge on middle dorsal vertebrae extending between neural
    canal and postzygapophyses
  - Only five sacral vertebrae, differing from all other Somphospondyli
  - Sacral ribs converge towards middle of sacrum in dorsal view, resembling
    star rays
  - Thin horizontal epipophyseal-prezygapophyseal lamina on cervical vertebrae
  - Reduced cervical neural arch lamination within Somphospondyli
