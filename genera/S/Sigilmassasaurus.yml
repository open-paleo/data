genus: Sigilmassasaurus
parent: Spinosaurinae
etymology: From 'Sigilmassa', the ancient city and former capital of the
  Tafilalt that was a center of Saharan commerce, and Greek 'sauros'
  ('lizard'); meaning 'Sigilmassa lizard'.
pronunciation:
  ipa: /siːdʒɪlˌmɑːsəˈsɔːrəs/
description: Sigilmassasaurus is a controversial genus of spinosaurid dinosaur
  that lived approximately 100 to 94 million years ago during the Late
  Cretaceous Period in what is now northern Africa. Named in 1996 by Canadian
  paleontologist Dale Russell, it contains a single species, Sigilmassasaurus
  brevicollis. The identity of the genus has been debated by scientists, with
  some considering its fossils to represent material from the closely related
  species Spinosaurus aegyptiacus, while others have classified it as a separate
  taxon, forming the clade Spinosaurini with Spinosaurus as its sister taxon.
dispute:
  summary: >
    The validity of Sigilmassasaurus is actively contested, and the genus is
    known only from isolated vertebrae that were never found in association.
    Russell (1996) erected it on a single vertebra he identified as a
    mid-cervical. Evers and others (2015) reappraised the material, reinterpreted
    the holotype as a first dorsal, gave the genus an emended diagnosis, and
    rejected its referral to Spinosaurus aegyptiacus; Chiarenza and Cau (2016)
    concurred, and Arden and others (2019) recovered it as the sister taxon of
    Spinosaurus in a clade Spinosaurini. Against this, Ibrahim and others (2020)
    rebutted the emended diagnosis, reporting the ventral platform character in
    Spinosaurus aegyptiacus as well, and Smyth and others (2020) rejected every
    proposed autapomorphy in turn, attributing the variation to axial position
    and ontogeny within a single taxon and treating the genus as a junior
    synonym of Spinosaurus aegyptiacus. Rauhut and others (2025) tested that
    single-taxon hypothesis in a sensitivity analysis. No consensus has emerged,
    so the species is marked disputed and the genus retained at Spinosaurinae.
    Which taxon the vertebrae of Spinosaurus maroccanus belong to is contested
    on the same evidence: Evers and others (2015) refer them to Sigilmassasaurus
    brevicollis as a different axial position of one animal, whereas Ibrahim and
    others (2020) reject that referral and keep the name with Spinosaurus
    aegyptiacus. The name is therefore carried as a possible synonym of both
    species, asserting neither destination.
  history:
    - date: "2026-08-07"
      note: >
        Intaken at Spinosaurinae with the species marked disputed. The genus
        was absent from the dataset entirely after an unsupported synonymy was
        removed from Spinosaurus; see the orphaned-taxa audit.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Neural spines of cervical vertebrae short, wider transversely than
    anteroposteriorly long
  - Intercentral articulations of cervical vertebrae wider than high, exceeding
    centrum length in width
  - Cervical series strongly arched into a U-shaped curve in lateral aspect
  - Parapophyses project ventrolaterally beyond the rim of the intercentral
    articulations
  - Hypapophyses most powerfully developed at the mid-cervical region,
    diminishing toward the cervico-dorsal transition
  - Posterior cervical centrum broad, with posterior width to length ratio of
    about 1.46, a small pleurocoel, and a greatly enlarged hypapophyseal
    peduncle
  - Mid-cervical vertebrae with an offset, transversely convex, strongly rugose
    triangular platform at the posterior end of the ventral side, confluent with
    a ventral keel anteriorly
  - Anteriorly broad centroprezygapophyseal lamina with no or strongly reduced
    centroprezygapophyseal fossa already present in anterior mid-cervical
    vertebrae
  - Reduced neural arch lamination with no or incomplete distinction between
    anterior and posterior centrodiapophyseal laminae in posterior cervical and
    first dorsal vertebrae
  - Small elongate fossa on either side of the base of the neural spine in the
    last cervical and first dorsal vertebrae
identifiers:
  - source: pbdb
    id: "66916"
  - source: wikidata
    id: Q18602106
  - source: gbif
    id: "4822973"
species:
  - name: Sigilmassasaurus brevicollis
    etymology: From Latin 'brevis' ('short') and 'collum' ('neck'), alluding to
      the shortness of the cervical centra.
    status: disputed
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Cenomanian
    location:
      country: MA
      locality: Kem Kem area, probably near Taouz
      region: MA-08
      group: Kem Kem
    type_specimen:
      specimen_id:
        - CMN 41857
      specimen_type: holotype
      institution: CMN
      material: Single isolated vertebra with a fairly complete neural arch,
        lacking part of the right transverse process and the tip of the neural
        spine.
      completeness: fragmentary
    synonyms:
      - name: Spinosaurus maroccanus
        type: possible subjective
        reason: Erected by Russell (1996) in the same paper as Sigilmassasaurus
          brevicollis, on CMN 50791, an isolated mid-cervical vertebra. Evers
          and others (2015) found a morphological continuum between the two
          holotypes, listed CMN 50791 among the referred material of
          Sigilmassasaurus as a mid-cervical of the same animal, and kept
          brevicollis as the species epithet because neither name has page
          priority. Ibrahim and others (2020) reject that referral and retain
          the name under Spinosaurus aegyptiacus, so the destination of the name
          is contested.
    erected_in: russell1996b
references:
  - id: russell1996b
    notes: Erects the genus and species on an isolated vertebra from the
      Tafilalt, identified as a mid-cervical.
  - id: evers2015a
    notes: Reappraises the material, reinterprets the holotype as a first dorsal,
      emends the diagnosis, rejects referral to Spinosaurus aegyptiacus, and
      gives the type horizon as Ifezouane or Aoufous.
  - id: smyth2020a
    notes: Rejects every proposed autapomorphy and treats the genus as a junior
      synonym of Spinosaurus aegyptiacus.
  - id: ibrahim2020a
    notes: Rebuts the emended diagnosis, reporting the ventral platform character
      in Spinosaurus aegyptiacus, and rejects the referral of Spinosaurus
      maroccanus.
  - id: arden2019a
    notes: Recovers the genus as the sister taxon of Spinosaurus in a clade
      Spinosaurini.
  - id: chiarenza2016a
    notes: Concurs that the genus is a distinct spinosaurid rather than referable
      to Spinosaurus aegyptiacus.
  - id: rauhut2025a
    notes: Tests the single-taxon hypothesis for the Kem Kem spinosaurid material
      in a sensitivity analysis.
  - id: kellermann2025a
    notes: Notes the claimed shared occurrence of the genus in the Bahariya
      Formation and the Kem Kem Group as warranting reexamination.
