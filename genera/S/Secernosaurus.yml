genus: Secernosaurus
parent: Kritosaurini
pronunciation:
  phonetic: see-SER-no-SAWR-us
etymology: "From Latin 'secerno' meaning 'to separate' or 'sever' and Greek 'sauros' meaning 'lizard'; meaning 'severed lizard', referring to its geographic separation from other hadrosaurs in South America."
description: Secernosaurus is a genus of herbivorous hadrosaurid dinosaur that
  lived during the Late Cretaceous of what is now Argentina. This genus and its
  close relatives lived in South America, unlike most hadrosaurids, which lived
  in the Laurasian continents of Eurasia and North America. It has been
  suggested that the ancestors of Secernosaurus crossed into South America when
  a land bridge temporarily formed between North and South America during the
  Late Cretaceous and allowed biotic interchange between the two continents.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Postacetabular process of ilium greatly deflected dorsomedially and
    elongate, unlike any hadrosaurian or iguanodont
  - Preacetabular process of ilium deflected ventrally at an angle greater than
    in Hadrosaurus
  - Antitrochanter relatively smaller than in any hadrosaurian of the same size
