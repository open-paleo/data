genus: Sarmientosaurus
parent: Diamantinasauria
dispute:
  summary: >
    Sarmientosaurus was originally described as a basal lithostrotian
    titanosaur (Martinez et al., 2016), but recent analyses recover it as the
    earliest-diverging member of Diamantinasauria (Poropat et al., 2023;
    Beeston et al., 2024). The position of Diamantinasauria relative to
    Titanosauria is treated in the clade entry.
  history:
    - date: "2026-06-30"
      note: >
        Placed in Diamantinasauria following the recent dedicated analyses;
        the original lithostrotian placement is noted.
etymology: Named after the town of Sarmiento in Chubut Province, Argentina, near where the fossils were discovered, combined with Greek 'sauros' (lizard).
pronunciation:
  phonetic: sahr-me-en-toe-sor-us
description: Sarmientosaurus is a genus of titanosaurian sauropod dinosaur
  belonging to the Titanosauria. It lived in what is now South America,
  specifically Argentina, during the Upper Cretaceous Period about 95 million
  years ago. The type species is Sarmientosaurus musacchioi.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Maximum diameter of orbit nearly 40% rostrocaudal length of cranium
  - Complex maxilla-lacrimal articulation with ascending ramus embedded in
    lacrimal dorsal process
  - Medial edge of maxillary ascending ramus bordering bony nasal aperture with
    low but well-defined ridge
  - "'Tongue-like' ventral process of quadratojugal overlapping quadrate
    caudally"
  - Separate foramina for all three branches of trigeminal nerve
  - Absence of median venous canal connecting infundibular region to ventral
    brainstem
  - Middle cervical vertebrae with 'strut-like' centroprezygapophyseal laminae
  - Extremely elongate and slender ossified tendon extending along cervical
    series ventrolateral to vertebrae and ribs
appearance:
  features:
    - elongate snout
    - procumbent teeth
  integument: scaled
  evidence: inferred
