genus: Sarcosaurus
parent: Neotheropoda
dispute:
  summary: >
    Sarcosaurus woodi has been referred to Coelophysoidea or basal
    Ceratosauria but is recovered as a non-coelophysoid neotheropod on the
    stem leading to Averostra by Ezcurra and others (2020), followed by
    Jones (2026).
  history:
    - date: "2026-06-30"
      note: >
        Placed at Neotheropoda following the most recent dedicated revision.
pronunciation:
  phonetic: SAHR-ko-SAWR-us
etymology: From Greek 'sarx'/'sarkos' (flesh, meat) + 'sauros' (lizard), meaning 'flesh lizard'.
description: Sarcosaurus is a genus of basal neotheropod dinosaur, roughly 3.5
  meters (11 ft) long. It lived in what is now England and maybe Ireland and
  Scotland during the Hettangian-Sinemurian stages of the Early Jurassic, about
  199-196 million years ago. Sarcosaurus is one of the earliest known Jurassic
  theropods, and one of only a handful of theropod genera from this time period.
  Along with Dracoraptor hanigani it is one of the two described neotheropods
  from the lowermost Jurassic of the United Kingdom.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - marine
diagnostic_features:
  - Ilium with the main axis of the preacetabular process strongly
    anteroventrally oriented in lateral view (also in Eoabelisaurus).
  - Ilium with an only slightly posteriorly projecting ischiadic peduncle
    (autapomorphy).
  - Ilium without a laterally exposed ventromedial margin of the brevis fossa,
    only a short portion of its base exposed (also in Cryolophosaurus).
  - Ilium with a poorly transversely expanded brevis fossa (also in
    non-coelophysid neotheropods).
  - Femur with a dorsolateral trochanter on the proximal end (also in the
    referred WARMS G667-690 and other non-averostran neotheropods).
  - Femoral fourth trochanter poorly posteriorly expanded, raised as a low ridge
    (also in WARMS G667-690, coelophysids, and early ceratosaurians).
appearance:
  integument: scaled
  evidence: inferred
