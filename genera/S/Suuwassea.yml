genus: Suuwassea
parent: Dicraeosauridae
etymology: "From the Crow language, derived from 'suuwassa' meaning 'the first
  thunder heard in spring'; the root 'suu' means 'thunder' and 'wassa' means
  'ancient', evoking the 'thunder lizard' epithet often applied to sauropods."
pronunciation:
  phonetic: SOO-oo-WAH-see-uh
description: Suuwassea is a genus of dicraeosaurid sauropod dinosaur found in
  Upper Jurassic strata of the Morrison Formation, located in southern Carbon
  County, Montana, United States. The fossil remains were recovered in a series
  of expeditions during a period spanning the years 1999 and 2000 and were
  described by J.D. Harris and Peter Dodson in 2004. They consist of a
  disarticulated but associated partial skeleton, including partial vertebral
  series and limb bones.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - supraoccipital with ventral end drawn out into narrow, elongate process
    contributing minimally to foramen magnum margin
  - basioccipital not contributing to dorsal side of occipital condylar neck
  - antotic processes of laterosphenoid separated from frontals by deep notches
  - cranial cervical neural spines restricted to caudal halves of centra,
    craniocaudally compressed, expanded distally, and not bifurcate
  - distal caudal centra ("whiplash" form) amphiplatyan
  - dorsal tuberculum of humerus well developed
  - proximal articular surface of tibia wider mediolaterally than long
    craniocaudally
  - calcaneus spheroidal
  - pedal phalanges longer proximodistally than wide mediolaterally
