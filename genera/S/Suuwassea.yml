genus: Suuwassea
parent: Dicraeosauridae
etymology: the first thunder heard in spring
description: Suuwassea is a genus of dicraeosaurid sauropod dinosaur found in
  Upper Jurassic strata of the Morrison Formation, located in southern Carbon
  County, Montana, United States. The fossil remains were recovered in a series
  of expeditions during a period spanning the years 1999 and 2000 and were
  described by J.D. Harris and Peter Dodson in 2004. They consist of a
  disarticulated but associated partial skeleton, including partial vertebral
  series and limb bones.
diet: herbivore
