genus: Spinostropheus
parent: Ceratosauria
etymology: From Latin spina ('spine') and Greek stropheus ('vertebra'), referring to the epipophyseal processes of the vertebrae
description: Spinostropheus is a genus of theropod dinosaur from the Tiourarén
  Formation of Niger. The type and only species is S. gautieri. Its age has been
  disputed, with estimates ranging from the Berriasian to the Cenomanian.
diet: carnivore
locomotion: bipedal
