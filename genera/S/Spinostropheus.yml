genus: Spinostropheus
parent: Ceratosauria
dispute:
  summary: >
    The ceratosaurian affinities of Spinostropheus rest on the referred
    specimen MNBH TIG6; Rauhut and Carrano (2016) argued that the type
    material of S. gautieri lacks ceratosaurian synapomorphies and may
    represent a basal tetanuran, and Hendrickx and colleagues (2024)
    likewise excluded the type from their analyses.
  history:
    - date: "2026-06-30"
      note: >
        Placed at Ceratosauria following the referred material and Carrano
        and Sampson (2008), pending resolution of the type material.
etymology: From Latin spina ('spine') and Greek stropheus ('vertebra'), referring to the epipophyseal processes of the vertebrae
pronunciation:
  phonetic: SPY-no-STROH-fee-us
description: Spinostropheus is a genus of theropod dinosaur from the Tiourarén
  Formation of Niger. The type and only species is S. gautieri. Its age has been
  disputed, with estimates ranging from the Berriasian to the Cenomanian.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Mid-cervical vertebrae with strongly canted anterior articular face on
    centrum (30° angle to posterior centrum face)
  - Partitioned anterior pleurocoels
  - Dorsoventrally flattened epipophyseal processes
  - Broad subrectangular neural spines
appearance:
  integument: scaled
  evidence: inferred
