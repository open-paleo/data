genus: Saurophaganax
parent: Allosauridae
dispute:
  summary: >
    Saurophaganax maximus has historically been treated as a giant allosaurid,
    either a distinct genus or a species of Allosaurus (A. maximus; Smith, 1998).
    Danison et al. (2024) argued that the referred material is a chimera of a large
    Allosaurus and a diplodocid sauropod and that the holotype neural arch is
    undiagnostic, rendering Saurophaganax a nomen dubium; they erected Allosaurus
    anax for the theropod material. Pending broad acceptance of that reassessment,
    the genus is retained conservatively at Allosauridae.
  history:
    - date: "2026-07-02"
      note: Retained at Allosauridae; the chimera and nomen dubium argument of Danison et al. (2024), and the proposed transfer of the valid theropod material to Allosaurus anax, are noted but not yet adopted.
pronunciation:
  phonetic: SAWR-o-FAG-a-naks
etymology: "From Greek 'sauros' meaning 'lizard', 'phagein' meaning 'to eat',
  and 'anax' meaning 'ruler' or 'lord'; meaning 'lord of lizard-eaters.'"
description: Saurophaganax is a dubious, chimeric genus of large saurischian
  dinosaur, possibly a sauropod, from the Late Jurassic (Kimmeridgian) Morrison
  Formation of Oklahoma, United States. This taxon was historically considered
  to represent a species of Allosaurus or very large allosaurid. However,
  re-examinations of the attributed specimens suggested that it is a chimera of
  multiple dinosaur genera, since some specimens most likely belong to a
  diplodocid sauropod, while the other referred specimens could be reassigned to
  a novel species of Allosaurus.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Horizontal lamina along base of each side of neural spine, arising from
    spine base cranially but free caudally
  - Atlas lacks prezygapophyses for proatlas and does not roof over neural canal
  - Chevrons craniocaudally expanded distally
