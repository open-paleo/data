genus: Saurophaganax
parent: Allosauridae
pronunciation:
  phonetic: SAWR-o-FAG-a-naks
etymology: "From Greek 'sauros' meaning 'lizard', 'phagein' meaning 'to eat', and 'anax' meaning 'ruler' or 'lord'; meaning 'lord of lizard-eaters.'"
description: Saurophaganax is a dubious, chimeric genus of large saurischian
  dinosaur, possibly a sauropod, from the Late Jurassic (Kimmeridgian) Morrison
  Formation of Oklahoma, United States. This taxon was historically considered
  to represent a species of Allosaurus or very large allosaurid. However,
  re-examinations of the attributed specimens suggested that it is a chimera of
  multiple dinosaur genera, since some specimens most likely belong to a
  diplodocid sauropod, while the other referred specimens could be reassigned to
  a novel species of Allosaurus.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
