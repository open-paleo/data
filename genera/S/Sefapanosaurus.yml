genus: Sefapanosaurus
parent: Sauropodiformes
etymology: From Sesotho 'sefapano' (cross) + Greek 'sauros' (lizard), meaning 'cross lizard', referring to the distinctive cross-shaped astragalus (ankle bone).
description: Sefapanosaurus was an early, herbivorous sauropodomorph dinosaur
  occurring in the southern regions of Gondwana some 200 million years ago in
  the Late Triassic or Early Jurassic. The sauropodomorphs were the dominant
  terrestrial herbivores throughout much of the Mesozoic Era, from their origins
  in the mid-Triassic (approximately 230 Ma) until their decline and fall at the
  end of the Cretaceous (approximately 66 Ma). A distinctive feature of this
  dinosaur is the cross-shaped astragalus or talus bone in its ankle. The
  generic name is derived from the Sesotho word sefapano, meaning 'cross' and
  the Greek word saurus, meaning 'lizard'. The specific name refers to Zastron,
  the type locality, where the specimen was discovered.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
  - arid
diagnostic_features:
  - Tall ascending process of astragalus, 35% of mediolateral length of
    astragalar body
  - T-shaped, triradiate cross-section of ascending process of astragalus
  - Ascending process of astragalus framed by well-developed, straight, thick
    ridges with subcircular cross-sections
  - Slit-shaped posterior dorsal neural canal
  - Length of proximal neural spine base greater than half the neural arch length
  - Square-shaped cross-section of distal caudal centra
  - Long ridge from craniodorsal coracoid margin to coracoid foramen
  - Craniomedial ulnar process twice as long as craniolateral process and
    distally tapered
