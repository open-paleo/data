genus: Sefapanosaurus
parent: Sauropodiformes
description: Sefapanosaurus was an early, herbivorous sauropodomorph dinosaur
  occurring in the southern regions of Gondwana some 200 million years ago in
  the Late Triassic or Early Jurassic. The sauropodomorphs were the dominant
  terrestrial herbivores throughout much of the Mesozoic Era, from their origins
  in the mid-Triassic (approximately 230 Ma) until their decline and fall at the
  end of the Cretaceous (approximately 66 Ma). A distinctive feature of this
  dinosaur is the cross-shaped astragalus or talus bone in its ankle. The
  generic name is derived from the Sesotho word sefapano, meaning ‘cross’ and
  the Greek word saurus, meaning 'lizard'. The specific name refers to Zastron,
  the type locality, where the specimen was discovered.
diet: herbivore
