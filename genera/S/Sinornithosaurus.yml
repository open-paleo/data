genus: Sinornithosaurus
parent: Microraptorinae
pronunciation:
  phonetic: SIEN-or-nith-o-SAWR-us
etymology: From Latin 'Sinae' (China) + Greek 'ornis' (bird) + Greek 'sauros' (lizard), meaning 'Chinese bird-lizard', reflecting its Chinese origin and bird-like features.
description: Sinornithosaurus is a genus of feathered dromaeosaurid dinosaur
  from the early Cretaceous Period (late Barremian) of the Yixian Formation in
  what is now China. It was the fifth non-avian feathered dinosaur genus
  discovered by 1999. The original specimen was collected from the Sihetun
  locality of western Liaoning. It was found in the Jianshangou beds of the
  Yixian Formation, dated to 124.5 million years ago. Additional specimens have
  been found in the younger Dawangzhangzi bed, dating to around 122 million
  years ago.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
  - forested
appearance:
  features:
    - feathered wings
    - hindlimb feathers
    - enlarged pedal claws
    - feathered tail
  integument: feathered
diagnostic_features:
  - Ornament-like pits and ridges on anterolateral surface of antorbital fossa
  - Posterolateral process of parietal turning sharply posteriorly
  - Dentary bifurcated posteriorly
  - Unserrated premaxillary teeth
  - Supracoracoid fenestra of coracoid
  - Manual phalanx III-1 more than twice the length of phalanx III-2
  - Pronounced tubercle near midshaft of pubis
  - Posterodorsal process of ischium
  - Partially arctometatarsalian metatarsal III
