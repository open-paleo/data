genus: Serikornis
parent: Anchiornithidae
dispute:
  summary: >
    Serikornis sungei was erected as a distinct basal paravian, the sister taxon
    of Eosinopteryx (Lefèvre et al., 2017), but its status as a separate genus
    has been challenged. Agnolín et al. (2019) rejected each of its proposed
    autapomorphies — arguing that the enlarged anterior maxillary teeth are loose
    and of variable size, that the distinctive ischial process is taphonomically
    distorted, and that the coracoid character rests on a surface not exposed in
    the holotype — and concluded that it is a junior synonym of Anchiornis
    huxleyi. That synonymy has not been adopted by subsequent workers, who
    continue to score Serikornis as a distinct taxon in phylogenetic analyses
    (e.g. Foth et al., 2025); it is retained here as a valid anchiornithid.
  history:
    - date: "2026-07-01"
      note: Placed at Anchiornithidae with the other Anchiornis-like taxa; validity relative to Anchiornis remains unresolved, and the clade-level position debate is recorded on Anchiornithidae.
    - date: "2026-07-21"
      note: Dispute reframed as valid-versus-synonym and sourced — the sole
        synonymy proposal (Agnolín et al., 2019) has not been adopted, with
        later analyses (Foth et al., 2025) continuing to score Serikornis as a
        distinct taxon; status kept valid.
etymology: From Greek 'serikos' (silken, of silk) + 'ornis' (bird), meaning 'silk bird', likely referring to the soft, silky appearance of the preserved feathers.
pronunciation:
  phonetic: SAY-ree-KOR-niss
description: Serikornis is a genus of small, feathered anchiornithid dinosaur
  from the Upper Jurassic Tiaojishan Formation of Liaoning, China. It is
  represented by the type species Serikornis sungei. Some researchers believe it
  is a junior synonym of Anchiornis.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
  - forested
appearance:
  features:
    - feathered wings
    - hindlimb feathers
  integument: feathered
diagnostic_features:
  - Four anterior maxillary teeth twice as long as others regarding crown height
  - Ventrodistal process of ischium narrow, hook-like, strongly deflected
    caudodorsally at distal end
  - Coracoid tuber well-developed and laterally projected, forming subglenoid
    shelf along caudoventral margin
  - Distal end of lateral process of coracoid thickened, forming ventral rounded
    bump
  - Smooth ventral side of coracoid devoid of small pits
