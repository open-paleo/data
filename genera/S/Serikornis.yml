genus: Serikornis
parent: Anchiornithidae
dispute:
  summary: >
    Serikornis sungei was recovered by its describers as a basal paravian outside
    Eumaniraptora, the sister taxon of Eosinopteryx (Lefèvre et al., 2017), and
    some workers have suggested it may be a junior synonym of Anchiornis. It is
    treated here as a valid anchiornithid pending revision.
  history:
    - date: "2026-07-01"
      note: Placed at Anchiornithidae with the other Anchiornis-like taxa; validity relative to Anchiornis flagged for review, and the clade-level position debate is recorded on Anchiornithidae.
etymology: From Greek 'serikos' (silken, of silk) + 'ornis' (bird), meaning 'silk bird', likely referring to the soft, silky appearance of the preserved feathers.
pronunciation:
  phonetic: SAY-ree-KOR-niss
description: Serikornis is a genus of small, feathered anchiornithid dinosaur
  from the Upper Jurassic Tiaojishan Formation of Liaoning, China. It is
  represented by the type species Serikornis sungei. Some researchers believe it
  is a junior synonym of Anchiornis.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
  - forested
appearance:
  features:
    - feathered wings
    - hindlimb feathers
  integument: feathered
diagnostic_features:
  - Four anterior maxillary teeth twice as long as others regarding crown height
  - Ventrodistal process of ischium narrow, hook-like, strongly deflected
    caudodorsally at distal end
  - Coracoid tuber well-developed and laterally projected, forming subglenoid
    shelf along caudoventral margin
  - Distal end of lateral process of coracoid thickened, forming ventral rounded
    bump
  - Smooth ventral side of coracoid devoid of small pits
