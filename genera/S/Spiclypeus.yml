genus: Spiclypeus
parent: Chasmosaurinae
etymology: "From Latin 'spica' meaning 'spike' and 'clypeus' meaning 'shield'; meaning 'spike shield', referring to the large spike-like horn ossifications on the frill margin."
pronunciation:
  phonetic: spick-LIP-ee-us
description: Spiclypeus is an extinct genus of chasmosaurine ceratopsian
  dinosaur known from the Late Cretaceous Judith River Formation (late Campanian
  stage) of Montana, United States.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Rugose nasal contact on the lateral surface of the dorsal process of the
    premaxilla (autapomorphic)
  - Postorbital horncores project dorsolaterally
  - All six epiparietals fused at bases
  - Epiparietals P1 and P2 curl anteriorly from posterior margin of frill
  - Epiparietal P3 projects posterodorsally
appearance:
  features:
    - brow horns
    - epoccipitals
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "340978"
  - source: wikidata
    id: Q24091046
