  - name: Spinosaurus maroccanus
    type: junior subjective
    reason: Erected by Russell (1996) on Kem Kem cervical vertebrae; synonymised
      with S. aegyptiacus by Ibrahim et al. (2014) on the basis of associated
      material from the FSAC-KK 11888 neotype skeleton.
species:
  - name: Spinosaurus aegyptiacus
    etymology: From Latin aegyptiacus, "of Egypt", after the country where Stromer's
      original type material was found at Bahariya.
    status: valid
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Cenomanian
      from_ma: 100.5
      to_ma: 93.9
    location:
      country: EG
      region: Matruh
      formation: Bahariya
      locality: Gebel el Dist
      coordinates:
        - 28.43
        - 28.91
    size:
      hip_height_m:
        min: 2.5
        max: 2.5
      length_m:
        min: 14
        max: 15
      weight_kg:
        min: 6500
        max: 9000
    holotype:
      specimen_id:
        - FSAC-KK 11888
      specimen_type: neotype
      institution: FSAC
      material: Partial skeleton including portions of the skull, cervical, dorsal,
        sacral and caudal vertebrae, ilium, manual phalanges, femur, tibia and
        pedal elements; subadult.
      completeness: partial
      notes: Designated as neotype by Ibrahim et al. (2014) after the destruction
        of Stromer's original holotype (BSP 1912 VIII 19, Munich) in 1944. The
        designation is contested; Evers et al. (2015) argued it does not meet ICZN
        Article 75 requirements (unverified commercial provenance, a Kem Kem
        locality far from Stromer's Bahariya type locality, and possible multiple
        Kem Kem spinosaurid taxa). The ICZN has not ruled, and FSAC-KK 11888
        remains in widespread use as the de facto neotype.
    erected_in: stromer1915
    described_in: ibrahim2014
  - name: Spinosaurus mirabilis
    etymology: From Latin 'mirabilis' meaning 'astonishing', in reference to
      the hypertrophied scimitar-shaped nasal-prefrontal crest of the
      holotype.
    status: valid
    type_species: false
    period:
      name:
        - Late Cretaceous
      stage:
        - Cenomanian
      from_ma: 100
      to_ma: 95
    location:
      country: NE
      region: Agadez Region
      formation: Farak
      locality: Sirig Taghat, Jenguebi area
      coordinates:
        - 16.97349
        - 8.06629
    holotype:
      specimen_id:
        - MNBH JEN1
      specimen_type: holotype
      institution: MNBH
      material: Associated right premaxilla, both maxillae, base and bottom
        half of the fused nasal crest with portions of both prefrontals,
        alveolar edge of the right dentary, and five maxillary teeth.
      completeness: fragmentary
    diagnostic_features:
      - Low snout with parallel dorsal and ventral margins in lateral profile.
      - Greater spacing of posterior maxillary and opposing dentary teeth.
      - Scimitar-shaped nasal-prefrontal crest arching upward and backward
        with a lateral eminence offset toward the anterior margin; the crest
        is proportionally taller, exceeding cranium height at the orbits
        (lower and more fluted in S. aegyptiacus).
      - Postaxial cervical pleurocoels with greater anteroposterior diameter
        than adjacent parapophyseal articular facets.
      - Tibial articular depression for the ascending process of the
        astragalus reduced in area, with the medial malleolus edge exposed
        in anterior view.
    erected_in: sereno2026
