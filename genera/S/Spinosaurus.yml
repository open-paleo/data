genus: Spinosaurus
parent: Spinosaurinae
etymology: From Latin spina (spine, thorn) and Greek sauros (lizard);
  meaning "spine lizard", named for the conspicuously tall neural
  spines of the trunk vertebrae that supported a dorsal sail.
pronunciation:
  phonetic: SPIEN-o-SAWR-us
  ipa: /ˌspaɪnəˈsɔːrəs/
description: Spinosaurus is the type genus of Spinosauridae and one of
  the most distinctive Cretaceous theropods, recognized for the
  enormously tall neural spines of its dorsal vertebrae that supported
  a dorsal sail or hump. The genus was erected by Ernst Stromer in 1915
  on a partial skeleton recovered in 1912 by his collector Richard
  Markgraf from the Bahariya beds of the Western Desert of Egypt
  (specimen BSP 1912 VIII 19 in the Bayerische Staatssammlung in
  Munich). The original type material — including the iconic mandibles
  and elongate-spined dorsals — was destroyed in the British bombing of
  Munich in April 1944, leaving only Stromer's plates and descriptions.
  Stromer (1934) added more material, including a smaller specimen he
  treated informally as "Spinosaurus B" (later partly the basis of
  Russell's 1996 S. maroccanus). Ibrahim et al. (2014) designated
  FSAC-KK 11888, a partial skeleton from the Kem Kem beds of
  southeastern Morocco, as the neotype of S. aegyptiacus, and proposed
  on the basis of pachyostotic limb bones, retracted nostrils, and
  reduced hindlimbs that Spinosaurus was a semi-aquatic predator
  capable of obligate quadrupedal locomotion on land. Subsequent work
  (notably Ibrahim et al. 2020 on the paddle-tail and Sereno et al.
  2022 in response) has continued to debate the degree of aquatic
  adaptation, but the broad picture of a piscivorous, river-dwelling
  spinosaurid with reduced hindlimbs and dense limb bones is now widely
  accepted.
diet: piscivore
locomotion: facultative
paleoenvironment:
  - fluvial
  - deltaic
  - coastal
appearance:
  integument: scaled
  evidence: inferred
diagnostic_features:
  - Dentary rami long and low-set in the middle, bearing about 15
    awl-shaped teeth per ramus, with strongly heterodont positions
    (large 2nd-4th, small 5th-10th, larger 11th-14th).
  - Teeth straight to gently curved, sub-circular in cross-section,
    with smooth (non-serrated) anterior and posterior keels.
  - Fleshy nostril retracted to a posteriorly placed narial fossa on
    the skull, far from the snout tip.
  - Free dorsal vertebral centra elongate, hourglass-shaped in dorsal
    view, and strongly opisthocoelous, lacking a ventral keel.
  - Neural spines of dorsal vertebrae extraordinarily tall (up to ~8x
    centrum height), laterally compressed, broadened ventrally and
    dorsally, supporting a dorsal sail.
  - Anterior dorsal centra exceptionally broad and concavoconvex,
    creating a horizontal cervicodorsal hinge.
  - Long bones (femur, tibia, manual phalanges) with solid shafts
    lacking an open medullary cavity; bone density 30-40% greater than
    in other large theropods (pachyostosis).
  - Femur substantially shorter than tibia and hindlimb length only
    ~19% of body length; iliac blade reduced to roughly half the
    surface area of other comparably sized theropods.
