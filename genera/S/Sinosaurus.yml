genus: Sinosaurus
parent: Neotheropoda
placement: incertae sedis
dispute:
  summary: >
    Sinosaurus triassicus is a basal neotheropod of uncertain position. With
    corrected character coding it is recovered as a stem-averostran ("pre-tetanuran")
    near Dilophosaurus and Cryolophosaurus, outside Averostra (Rauhut, 2003; Wang and
    others, 2017; Jones and Viola, 2026), though earlier work placed it as a basal
    tetanuran inside Averostra (Carrano and others, 2012). It is placed conservatively
    at Neotheropoda incertae sedis. The species "Dilophosaurus" sinensis is referred
    to Sinosaurus.
  history:
    - date: "2026-06-30"
      note: Reparented to Averostra.
    - date: "2026-07-02"
      note: Moved from Averostra to Neotheropoda incertae sedis and placed; recovered as a stem-averostran basal neotheropod near Cryolophosaurus, with a basal-tetanuran alternative unresolved.
etymology: From Latin Sinae, "Chinese", combined with Greek sauros, "lizard" -
  means "Chinese lizard"
pronunciation:
  phonetic: SIEN-o-SOR-us
description: Sinosaurus is an extinct genus of basal theropod dinosaur which
  lived during the Early Jurassic (Hettangian-Sinemurian). Fossils of the animal
  have been found in the Lufeng Formation, in the Yunnan Province of China. The
  type species, S. triassicus, was named by Chung Chieng Young in 1940. A second
  species, S. sinensis, was originally assigned to Dilophosaurus, but was later
  reassigned to Sinosaurus. Sinosaurus is morphologically similar to
  Dilophosaurus including the presence of a similarly shaped cranial crest,
  though its precise taxonomic position is uncertain, and the two genera may not
  be closely related.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Maxilla high
  - Teeth with long massive roots, compressed, sharply pointed, and curving
    backwards
  - Fine serrations on both the anterior and posterior edges of the teeth
appearance:
  integument: scaled
  evidence: inferred
