    institution: LFKL
    species: Sinosaurus triassicus
    category: complementary
    significance: "A near-complete Sinosaurus triassicus skull with a total length of 51.96 cm from premaxilla to quadratojugal, preserving the paired nasal-lacrimal crests and skull anatomy far beyond the fragmentary type material."
    references: [zhang2023]
  - specimen_id: [ZLJT01]
    institution: ZLJ
    category: ontogeny
    significance: "A juvenile individual referred to Sinosaurus, comprising cranial elements including both frontals, parietals, an incomplete braincase and dentary, plus an atlantal intercentrum and other postcranial fragments, documenting an early growth stage of the taxon."
    references: [xing2012b]
  - specimen_id: [ZLJ 0003, ZLJ 0057]
    institution: ZLJ
    category: most-complete
    significance: "Two specimens referred to Sinosaurus that are each almost complete, providing the most complete known skeletal data for the genus after most historically referred postcrania were reassigned to other genera."
