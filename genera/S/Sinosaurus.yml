genus: Sinosaurus
parent: Theropoda
etymology: Chinese lizard
description: Sinosaurus is an extinct genus of basal theropod dinosaur which
  lived during the Early Jurassic (Hettangian-Sinemurian). Fossils of the animal
  have been found in the Lufeng Formation, in the Yunnan Province of China. The
  type species, S. triassicus, was named by Chung Chieng Young in 1940. A second
  species, S. sinensis, was originally assigned to Dilophosaurus, but was later
  reassigned to Sinosaurus. Sinosaurus is morphologically similar to
  Dilophosaurus including the presence of a similarly shaped cranial crest,
  though its precise taxonomic position is uncertain, and the two genera may not
  be closely related.
diet: carnivore
