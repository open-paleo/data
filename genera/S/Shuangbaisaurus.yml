genus: Shuangbaisaurus
parent: Neotheropoda
placement: incertae sedis
dispute:
  summary: >
    Shuangbaisaurus anlongbaoensis is a basal neotheropod described as a
    distinct crested theropod close to Sinosaurus and Dilophosaurus (Wang
    and colleagues, 2017). Its suggested synonymy with Sinosaurus triassicus
    is unpublished, and Zhang and colleagues (2023) keep it valid. It tracks
    the uncertain position of Sinosaurus and is placed conservatively at
    Neotheropoda incertae sedis.
etymology: From "Shuangbai" (Shuangbai County in Yunnan, China, where the
  holotype was found) and Greek "sauros" (lizard); meaning "Shuangbai lizard".
pronunciation:
  phonetic: SHONG-by-SOR-us
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Parasagittal crests present at least along the orbital dorsal rims
    (supraorbital crests spanning the entire dorsal rims of the orbits)
  - Premaxillary body higher than long, with ventral border of the preserved
    dorsal rim approximately level with the ventral border of the antorbital
    fenestra
  - Ventral edge of the premaxilla notably elevated, higher than the ventral
    edge of the maxilla, placing the last two premaxillary teeth above the
    maxillary ventral edge
  - Small, round upper temporal fenestra with diameter shorter than the
    transverse width of the parietals in between and about half the length of
    the skull table posterior to the orbit
  - Quadratojugal and posterior process of jugal directed posteroventrally
appearance:
  features:
    - orbital crest
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "370735"
  - source: wikidata
    id: Q29051703
species:
  - name: Shuangbaisaurus anlongbaoensis
    etymology: Named for Anlongbao Town in Shuangbai County, near where the
      holotype was recovered; the name literally means "dragon-placing fort".
    pronunciation:
      phonetic: AHN-lohng-bow-EN-sis
    status: disputed
    type_species: true
    period:
      name:
        - Early Jurassic
      stage:
        - Hettangian
    location:
      country: CN
      region: CN-YN
      locality: Liuna Village, Anlongbao Town
      formation: Fengjiahe
      part: lower
    size:
      skull_length_m:
        min: 0.54
        max: 0.54
    type_specimen:
      specimen_id:
        - CPM C2140ZA245
      specimen_type: holotype
      institution: CPM
      material: Partial skull with associated lower jaw, missing the nasals and
        the dorsal portions of the premaxillae, maxillae, and lacrimals.
      completeness: partial
    erected_in: wang2017b
references:
