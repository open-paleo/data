genus: Shuangbaisaurus
parent: Theropoda
etymology: From "Shuangbai" (Shuangbai County in Yunnan, China, where the
  holotype was found) and Greek "sauros" (lizard); meaning "Shuangbai lizard".
pronunciation:
  phonetic: SHONG-by-SOR-us
description: Shuangbaisaurus is a genus of theropod dinosaur, possibly a junior
  synonym of Sinosaurus. It lived in the Early Jurassic of Yunnan Province,
  China, and is represented by a single species, S. anlongbaoensis, known from a
  partial skull. Like the theropods Dilophosaurus and Sinosaurus,
  Shuangbaisaurus bore a pair of thin, midline crests on its skull. Unusually,
  these crests extended backwards over the level of the eyes, which, along with
  the unusual orientation of the jugal bone, led the describers to name it as a
  new genus. However, Shuangbaisaurus also possesses a groove between its
  premaxilla and maxilla, a characteristic which has been used to characterize
  Sinosaurus as a genus. Among the two morphotypes present within the genus
  Sinosaurus, Shuangbaisaurus more closely resembles the morphotype that is
  variably treated as a distinct species, S. sinensis, in its relatively tall
  skull.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Parasagittal crests present at least along the orbital dorsal rims
    (supraorbital crests spanning the entire dorsal rims of the orbits)
  - Premaxillary body higher than long, with ventral border of the preserved
    dorsal rim approximately level with the ventral border of the antorbital
    fenestra
  - Ventral edge of the premaxilla notably elevated, higher than the ventral
    edge of the maxilla, placing the last two premaxillary teeth above the
    maxillary ventral edge
  - Small, round upper temporal fenestra with diameter shorter than the
    transverse width of the parietals in between and about half the length of
    the skull table posterior to the orbit
  - Quadratojugal and posterior process of jugal directed posteroventrally
