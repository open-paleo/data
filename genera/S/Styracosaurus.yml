genus: Styracosaurus
parent: Centrosaurinae
etymology: From Ancient Greek styrax, "spike at the butt-end of a spear-shaft",
  combined with Greek sauros, "lizard" - means "spiked lizard"
pronunciation:
  phonetic: sti-RAK-uh-SOR-uhs
  ipa: /stɪˌrækəˈsɔːrəs/
description: Styracosaurus is an extinct genus of herbivorous dinosaur from the
  Late Cretaceous (Campanian stage) of North America. It had four to six long
  parietal spikes extending from its neck frill, a smaller jugal horn on each of
  its cheeks, and a single horn protruding from its nose, which may have been up
  to 60 centimeters (2 feet) long and 15 centimeters (6 inches) wide. The
  function or functions of the horns and frills have been debated for many
  years.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Nasal horn-core large, upright, straight, rising from back of nasals and
    positioned remotely from acute rostral apex
  - Spike-shaped projections on posterior margin of frill (three pairs on each
    side, tapering, projecting obliquely backward and outward)
  - Postfrontal fontanelle large and long
  - Squamosals quadrangular, entering largely into front part of frill
  - Supratemporal fossae opening widely behind
  - Supraorbital horn-core incipient (small smooth depression indicating minute
    horn-core)
appearance:
  features:
    - neck frill
    - frill spikes
    - nasal horn
  integument: scaled
  evidence: inferred
