genus: Shantungosaurus
parent: Edmontosaurini
pronunciation:
  phonetic: SHAHN-DUNG-o-SAWR-us
etymology: Named after Shandong (historically romanised as Shantung) Province in
  China, where fossils were found, combined with Greek 'sauros' (lizard),
  meaning 'Shandong lizard'.
description: Shantungosaurus is an extinct genus of very large herbivorous
  saurolophine hadrosaurid dinosaur found in the Late Cretaceous Wangshi Group
  of the Shandong Peninsula in China, containing a single species,
  Shantungosaurus giganteus. The stratigraphic interval of Shantungosaurus
  ranges from the top of the Xingezhuang Formation to the middle of the Hongtuya
  Formation, middle to late Campanian in age. Shantungosaurus is so far the
  largest hadrosauroid taxon in the world, with size estimates around 15-17
  meters (49-56 ft) in length and 13-16 metric tons (14-18 short tons) in body
  mass.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Sacral vertebrae composed of more than nine vertebral centra (exceeding all
    other Hadrosaurinae genera), with a relatively deep ventral groove
  - Dorsal surface of skull relatively flat with ventral concavity from
    posterior supratemporal fenestra forward to middle of frontal bone
  - Long dental battery with a single dental groove and a long toothless region
    anterior to the dentary
  - Ischium straight and long with extremely weak, small apical expansion at
    terminal end
  - Exceptionally large body size with total assembled length exceeding the
    known Hadrosaurinae
appearance:
  features:
    - elongate snout
    - keratinous beak
    - square snout
