genus: Soriatitan
parent: Brachiosauridae
etymology: Named after Soria province, Spain, where the fossils were found, combined with Greek titan, "giant" — means "Soria titan"
description: Soriatitan is a genus of brachiosaurid sauropod from the Early
  Cretaceous of Spain. It is known from one species, S. golmayensis, found in
  the Golmayo Formation. It lived between 130 and 125 million years ago, and was
  identified by a team of paleontologists in Spain.
diet: herbivore
locomotion: quadrupedal
