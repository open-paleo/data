genus: Soriatitan
parent: Brachiosauridae
etymology: Named after Soria province, Spain, where the fossils were found, combined with Greek titan, "giant" - means "Soria titan"
pronunciation:
  phonetic: SOH-ree-yah-TIE-tuhn
description: Soriatitan is a genus of brachiosaurid sauropod from the Early
  Cretaceous of Spain. It is known from one species, S. golmayensis, found in
  the Golmayo Formation. It lived between 130 and 125 million years ago, and was
  identified by a team of paleontologists in Spain.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Caudal ribs with pointed anterior ridge in middle
  - Posterior caudal vertebra with large postzygapophyses longer than
    anteroposterior spine length
  - Lateral fossa in postzygapophyses in posterior caudal vertebra
  - Large ventral rectangular ridge below preacetabular process of ilium
  - Ischiadic peduncle in ilium three times longer lateromedially than
    anteroposteriorly
  - Pubic peduncle and distal shaft in ischia of same length
  - Two lateral ridges in lateral area of deltopectoral crest of humerus
appearance:
  integument: scaled
  evidence: inferred
