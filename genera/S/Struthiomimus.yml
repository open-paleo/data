genus: Struthiomimus
parent: Ornithomimidae
etymology: "From Greek 'stroutheios' (στρούθειος) meaning 'of the ostrich' and 'mimos' (μῖμος) meaning 'mimic' or 'imitator'; meaning 'ostrich mimic', referring to its long-legged, ostrich-like build."
description: Struthiomimus is a genus of ornithomimid dinosaurs from the Late
  Cretaceous of what is now western North America. They were long-legged,
  bipedal, ostrich-like dinosaurs with toothless beaks. The type species,
  Struthiomimus altus, is one of the more common, smaller dinosaurs found in
  Dinosaur Provincial Park. Their overall abundance, in addition to their
  toothless beak, suggests that these animals were mainly herbivorous or (more
  likely) omnivorous, rather than purely carnivorous. Similar to the modern
  ostriches, emus, and rheas (among other birds), these dinosaurs likely lived
  as opportunistic omnivores, supplementing a largely plant-based diet with a
  variety of small mammals, reptiles, amphibians, insects, invertebrates, and
  anything else they could fit into their mouth, as they foraged.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - coastal
