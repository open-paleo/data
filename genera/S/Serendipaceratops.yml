genus: Serendipaceratops
parent: Ceratopsia
etymology: "From 'serendipitous', referencing the unexpected nature of the find
  (a ceratopsian found in Australia), and Greek 'keras' meaning 'horn' and 'ops'
  meaning 'face'; meaning 'serendipitous horned face.'"
description: Serendipaceratops is a genus of herbivorous ornithischian dinosaur,
  possibly an ankylosaur, from the early Cretaceous Period of Australia. The
  type species, S. arthurcclarkei, was named in 2003.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - polar
diagnostic_features:
  - Coronoid process extends further forward with anterior edge forming a
    greater angle to shaft axis; narrower in anterior view with parallel
    medial/lateral sides rather than V-shaped
  - Lateral tubercle much more robust and mediolaterally inflated; anterolateral
    surface of distal ulna more inflated in ventral view
  - Shaft more recurved near ventral end when viewed posteriorly
  - Shorter dorsoventral length of bone relative to anteroposterior depth
    compared to other protoceratopsians
