genus: Serendipaceratops
parent: Ornithischia
placement: incertae sedis
etymology: "From 'serendipitous', referencing the unexpected nature of the find
  (a ceratopsian found in Australia), and Greek 'keras' meaning 'horn' and 'ops'
  meaning 'face'; meaning 'serendipitous horned face.'"
pronunciation:
  phonetic: seh-ren-DIP-uh-SEH-ruh-tops
description: Serendipaceratops is a genus of herbivorous ornithischian dinosaur,
  possibly an ankylosaur, from the early Cretaceous Period of Australia. The
  type species, S. arthurcclarkei, was named in 2003.
dispute:
  summary: >
    Serendipaceratops arthurcclarkei is based on a single ulna from
    Australia; its referral to Ceratopsia has been disputed, with some
    workers suggesting the bone is not diagnostic or may pertain to an
    ankylosaur. Treated as a nomen dubium.
  history:
    - date: "2026-06-27"
      note: Placed at Ceratopsia incertae sedis; nomen dubium, possible
        non-ceratopsian identity reflected.
    - date: "2026-07-14"
      note: Moved to Ornithischia incertae sedis; ceratopsian affinity not
        supported (single deformed, non-diagnostic ulna; possible ankylosaur).
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - polar
appearance:
  integument: scaled
  evidence: inferred
