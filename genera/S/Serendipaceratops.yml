genus: Serendipaceratops
parent: Genasauria
placement: incertae sedis
etymology: "From 'serendipitous', referencing the unexpected nature of the find
  (a ceratopsian found in Australia), and Greek 'keras' meaning 'horn' and 'ops'
  meaning 'face'; meaning 'serendipitous horned face.'"
pronunciation:
  phonetic: seh-ren-DIP-uh-SEH-ruh-tops
description: Serendipaceratops is a genus of herbivorous ornithischian dinosaur,
  possibly an ankylosaur, from the early Cretaceous Period of Australia. The
  type species, S. arthurcclarkei, was named in 2003.
dispute:
  summary: >
    Rich and Vickers-Rich (2003) tentatively referred the ulna to
    Neoceratopsia. Agnolin and colleagues (2010) find no neoceratopsian
    synapomorphy, note proportions closer to ankylosaurs, and consider it a
    nomen dubium diagnosable only to Genasauria. Rich and colleagues (2014)
    answer with a morphometric study, finding the extreme compression of the
    ulnar midshaft a synapomorphy of Ceratopsia and the species valid on an
    emended diagnosis; Ryan and colleagues (2023) still describe the
    referral as challenged. Its validity and placement are both unsettled,
    and it is placed at Genasauria incertae sedis.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - polar
diagnostic_features:
  - Ulnar midshaft extremely compressed mediolaterally (midshaft width ratio
    2.06)
  - Ulna long relative to its mediolateral width but short relative to its
    craniocaudal depth at the sigmoid fossa rim
  - Proximal sigmoid region of the ulna narrow relative to the minimum
    transverse diameter of the midshaft
  - Coronoid process projecting strongly anteriorly, at a high angle to the
    shaft
  - Ulnar shaft narrow, with parallel medial and lateral sides
  - Robust, mediolaterally inflated lateral tubercle and inflated anterolateral
    surface on the distal end of the ulna
appearance:
  integument: scaled
  evidence: inferred
