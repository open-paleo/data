references:
  - id: rich2003a
  - id: agnolín2010a
    notes: Finds no neoceratopsian synapomorphy in the ulna, notes proportions
      closer to ankylosaurs, and considers the genus a nomen dubium
      diagnosable only to Genasauria.
  - id: poropat2014a
    notes: Reports that a 2014 study renewed support for a ceratopsian
      identity after it had been met with skepticism.
  - id: ryan2023a
    notes: Notes that the leptoceratopsid-like affinities reported for the
      ulnae have been challenged.
  - id: rich2014a
    notes: Finds the ulnar midshaft compression a ceratopsian synapomorphy,
      rejects the nomen dubium, and gives an emended diagnosis; source of the
      diagnostic features.
