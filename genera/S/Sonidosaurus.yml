genus: Sonidosaurus
parent: Titanosauria
dispute:
  summary: >
    Sonidosaurus was described as a relatively derived titanosaur (Xu et al.,
    2006) and has been suggested to be a non-saltasaurid lithostrotian with
    possible saltasaurid affinities (Jones, 2026).
  history:
    - date: "2026-06-30"
      note: >
        Moved to Titanosauria following its describers; finer placement within
        Titanosauria remains unresolved.
etymology: Named after Sonid, the large geographical area in Inner Mongolia that
  includes the type locality, combined with Greek sauros, "lizard" - means
  "Sonid lizard"
description: Sonidosaurus is a genus of sauropod dinosaur from the Late
  Cretaceous. It was a titanosaur which lived in what is now Inner Mongolia. The
  type species, Sonidosaurus saihangaobiensis, was described by Xu, Zhang, Tan,
  Zhao, and Tan in 2006. It was a small titanosaur, about 9 meters (30 ft) long.
  It was first discovered in the Saihangaobi, Iren Dabasu (Erlian) Formation, in
  2001 in a quarry which would later yield the remains of Gigantoraptor.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Thick ridge extending ventrally from postzygapophysis on lateral surface of
    neural arch of posterior dorsal vertebrae
  - Transversely oriented accessory lamina between anterior centroparapophyseal
    lamina and lateral centroprezygapophyseal lamina of posterior dorsal
    vertebrae
  - Long, anteroventrally directed caudal rib with two distinctive fossae on
    posterior margin on anterior caudal vertebrae
  - Prominent vertical ridge above pubic peduncle on medial surface of ilium
