genus: Siamraptor
parent: Carcharodontosauria
placement: incertae sedis
dispute:
  summary: >
    Siamraptor suwati is recovered as a basal member of Carcharodontosauria, often as
    sister to Concavenator (Chokchaloemwong et al., 2019; Kellermann et al., 2025);
    in analyses that do not recover a monophyletic Carcharodontosauria it falls
    instead within Metriacanthosauridae. It is placed at Carcharodontosauria incertae
    sedis.
  history:
    - date: "2026-07-01"
      note: Placed at Carcharodontosauria incertae sedis; the metriacanthosaurid alternative is unresolved.
pronunciation:
  phonetic: SY-am-RAP-tor
etymology: From 'Siam', the former name of Thailand, combined with Latin 'raptor' (thief, plunderer), meaning 'Siamese plunderer' or 'thief from Siam'.
description: Siamraptor is an extinct genus of carcharodontosaurian dinosaur,
  containing the single species S. suwati, known from the Khok Kruat Formation
  of Thailand. It is the first definitive named carcharodontosaurian species
  known from Southeast Asia.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Jugal with straight ventral margin and dorsoventrally deep anterior process
    below orbit
  - Surangular with deep oval concavity at posterior end of lateral shelf and
    four posterior surangular foramina
  - Long and narrow groove along suture between surangular and prearticular
  - Articular with foramen at notch of suture with prearticular
  - Anterior cervical vertebra with additional pneumatic foramen excavating
    parapophysis
  - Cervical and posterior dorsal vertebra penetrated by pair of small foramina
    bilaterally at base of neural spine
appearance:
  integument: scaled
  evidence: inferred
