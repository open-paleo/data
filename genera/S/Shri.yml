genus: Shri
parent: Velociraptorinae
pronunciation:
  ipa: /ʃriː/
  phonetic: shree
etymology: "Named after Palden Lhamo (Shri Devi), a Buddhist deity."
description: Shri is an extinct genus of small dromaeosaurid dinosaurs that
  lived in what is now Mongolia during the Late Cretaceous.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - arid
diagnostic_features:
  - Epipophysis on first dorsal vertebra large and overhanging posterior margin
    of postzygapophysis
  - Two dorsoventrally aligned pleurocoels on first and second dorsal vertebrae
  - Posteriorly inclined scar on lateral surface of neural arch
  - Proportionally longer metatarsus (44% femur length)
  - Proportionally larger ungual phalanx on pedal digit 2 (1.01% MT II length)
  - Prominence of neurocentral sutures on dorsal vertebrae marked by raised
    rugose scar
appearance:
  features:
    - sickle claw
  integument: feathered
  evidence: inferred
