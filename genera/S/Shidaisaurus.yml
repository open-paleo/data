genus: Shidaisaurus
parent: Metriacanthosauridae
dispute:
  summary: >
    Shidaisaurus jinae is a basal metriacanthosaurid. Carrano, Benson and Sampson
    (2012) allowed for the possibility that it belongs to Metriacanthosaurinae, and
    Jones and Viola (2026) place it there, but dedicated analyses more often recover
    it in an unresolved basal position within Metriacanthosauridae (Zou et al.,
    2025). It is placed conservatively at Metriacanthosauridae incertae sedis.
  history:
    - date: "2026-07-02"
      note: Placed at Metriacanthosauridae incertae sedis; its possible assignment to Metriacanthosaurinae is unresolved.
pronunciation:
  phonetic: shih-DYE-SAWR-us
etymology: "Named for the Jin-Shidai ('Golden Age') Company, which oversaw excavation and inspection of the Jurassic World Park near the discovery site, combined with Greek 'sauros' meaning 'lizard'."
description: Shidaisaurus is a genus of metriacanthosaurid dinosaur. Its fossil
  was found in early Middle Jurassic-age rocks of the Chuanjie Formation in
  Yunnan, China. It is known from a partial skeleton, holotype DML-LCA 9701-IV,
  found at the bottom of an assemblage of nine dinosaur individuals, lacking
  most of the tail vertebrae, ribs, pectoral girdle, and limb bones.
  Shidaisaurus was described in 2009 by Wu and colleagues. The type species is
  Shidaisaurus jinae. Generic name and specific name in combination refer to the
  Jin-Shidai ("Golden Age") Company that oversaw excavation and inspection of
  the Jurassic World Park near the site.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Supraoccipital excluded from foramen magnum by exoccipitals
  - Paroccipital process downturned approximately 110° from vertical
  - Axis with large, sharply pointed epipophysis and thin lamina between
    epipophysis and neural spine broader than in other theropods
  - Anteroventral to dorsoposterior pubic length nearly equal to height of iliac
    blade
  - Lacks ventral notch distal to obturator process on ischium
  - Ischium relatively long (more than 96% the length of pubis)
  - Absence of pleurocoels in axis and anterior dorsal vertebrae
appearance:
