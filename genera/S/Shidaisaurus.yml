    etymology: Derived from 'Jin', the first word of the name of the Jin-Shidai
      Company, the Chinese word for gold, which is often used in company names to
      suggest a lasting enterprise.
    pronunciation:
      phonetic: JIN-ee
    status: valid
    type_species: true
    period:
      name:
        - Middle Jurassic
      stage:
        - Bajocian
    location:
      country: CN
      locality: Quarry 1, Laochangqing
      region: CN-YN
      formation: Chuanjie
    type_specimen:
      specimen_id: [LDM-LCA 9701-IV]
      specimen_type: holotype
      institution: LDM
      material: Partial skeleton lacking most caudal vertebrae, ribs, pectoral
