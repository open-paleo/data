genus: Sanpasaurus
parent: Sauropoda
etymology: "Named for Sanpa (Shanba), the locality in Sichuan, China, where the fossils were found, combined with Greek 'sauros' meaning 'lizard'; meaning 'Sanpa lizard.'"
description: Sanpasaurus is a poorly known sauropod dinosaur from the Early
  Jurassic of Sichuan, China. The type species, S. yaoi, was described by Chung
  Chien Young, in 1944. The type remains, IVPP V.156, consists of 20 vertebrae,
  scapulae, forelimbs, and some hindlimb bones.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - lacustrine
diagnostic_features:
  - Vertebrae massive with sacrum apparently not fused
  - Anterior limbs comparatively long
  - Scapula distal end rather thin
  - Ulna and radius long and slender, only slightly longer than one another
  - Ulna and radius facets of humerus not well differentiated
  - End phalanx curved and depressed
