genus: Stenopelix
parent: Chaoyangsauridae
pronunciation:
  phonetic: ste-NOP-e-liks
etymology: From Greek stenos, "narrow", combined with Greek pelyx, "pelvis" -
  means "narrow pelvis", referring to the characteristic narrow hips
description: Stenopelix is a genus of basal ceratopsian from the Early
  Cretaceous (late Berriasian stage, approximately 140 million years ago) of
  Germany. The genus is based on a partial skeleton lacking the skull, and its
  classification is based on characteristics of the hips.
dispute:
  summary: >
    Stenopelix valdensis has been placed variously as a basal
    pachycephalosaur, a basal marginocephalian, and a basal ceratopsian;
    Fonseca and others (2024) recover it within Chaoyangsauridae as sister to
    Yinlong, and Jones (2026) follows this; Yu and others (2020) also recovered
    it within Chaoyangsauridae but discounted that placement as unreliable given
    its ambiguous status.
  history:
    - date: "2026-06-27"
      note: Placed at Chaoyangsauridae following Fonseca and others (2024)
        and Jones (2026); Yu and others (2020) recovered the same but regarded
        it as unreliable; earlier pachycephalosaurian placements not adopted.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Weakly biconcave vertebral bodies only slightly longer than high or wide
  - Pelvis with narrow elongate form, width less than half length, ilium
    extending posteriorly into stalk-like process
  - Pubis and ischium as broad rib-shaped bones; ischium notably narrow and
    elongate without fan-like expansion
  - Four toes with phalangeal count 3.4.5.6; all toes possessing claw phalanges
    of equal perfection
  - Claw phalanges straight and pyramidal, not flat or curved
  - Forearm only half the length of the shank; no osteoderms discernible despite
    skeleton completeness
appearance:
  integument: armored
  evidence: direct
