synonyms:
  - name: Pleuropeltus
    type: junior subjective
    reason: Reduced to a junior synonym of Struthiosaurus following taxonomic review that also consolidated Crataeomus and Hoplosaurus.
  - name: Leipsanosaurus
    type: junior subjective
    reason: Now considered referable to Struthiosaurus, alongside Danubiosaurus.
  - name: Hoplosaurus
    type: junior subjective
    reason: Reduced to a junior synonym of Struthiosaurus alongside Pleuropeltus and Crataeomus following taxonomic review.
  - name: Danubiosaurus
    type: junior subjective
    reason: Treated as a junior synonym of Struthiosaurus, alongside Leipsanosaurus.
  - name: Crataeomus
    type: junior subjective
    reason: Reduced to a junior synonym of Struthiosaurus alongside Pleuropeltus and Hoplosaurus following taxonomic review.
