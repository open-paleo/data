          incertae sedis.
  - name: Struthiosaurus transylvanicus
    status: valid
    type_species: false
    period:
      name:
        - Late Cretaceous
      stage:
        - Maastrichtian
      from_ma: 72.1
      to_ma: 66
    location:
      country: RO
      region: RO-HD
      formation: Sânpetru
      locality: Sânpetru (Szentpéterfalva), Hațeg Basin
    type_specimen:
      specimen_id:
        - BMNH R4966
      specimen_type: holotype
      institution: NHMUK
      material: Partial skull (braincase, frontal, parietal, postfrontal, quadrate),
        atlas, cervical and dorsal vertebrae, anterior caudal vertebrae, ribs,
        and a scapula, from associated remains found at Szentpéterfalva.
    diagnostic_features:
      - Skeleton overall much more robust than in Struthiosaurus austriacus.
      - Base of the skull markedly more robustly constructed than in S.
        austriacus.
      - Anterior ribs T-shaped in cross-section but more moderately developed
        than in the Gosau (S. austriacus) material.
      - Postcranial bone surfaces bearing a distinctive sculpture resembling
        intersecting fibers.
    erected_in: nopcsa1915a
  - name: Struthiosaurus languedocensis
    etymology: From Languedoc, the region of southern France where the holotype
      was found.
    status: valid
    type_species: false
    period:
      name:
        - Late Cretaceous
      stage:
        - Campanian
      from_ma: 73.5
      to_ma: 72.1
    location:
      country: FR
      region: FR-34
      locality: L'Olivet Quarry, Villeveyrac-Mèze Basin
    type_specimen:
      specimen_id:
        - UM2 OLV-D50 A-G CV
      specimen_type: holotype
      institution: USTL
      material: Complete synsacrum and pelvic girdle, plus the four caudal-most dorsal
        vertebrae.
    size:
      length_m:
        min: 2.5
        max: 3
    diagnostic_features:
      - Distal dorsal centra strongly compressed laterally and hourglass-shaped
        in ventral view, more so than in S. transylvanicus.
      - Ischium directed immediately caudal from the acetabulum, with a robust
        shaft that does not taper distally and ends in a blunt knob (slender and
        tapering in S. austriacus).
      - Synsacrum of ten co-ossified vertebrae (five dorsals, four sacrals, and
        one caudal).
    erected_in: garcia2003a
