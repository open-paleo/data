genus: Struthiosaurus
parent: Nodosauridae
etymology: From Latin struthio ('ostrich') and Greek sauros ('lizard'), meaning 'ostrich lizard'
description: Struthiosaurus is a genus of nodosaurid dinosaurs from the Late
  Cretaceous period (Santonian-Maastrichtian) of Austria, Romania, France, and
  possibly Hungary. It was a small dinosaur, measuring 2–3 m (6.6–9.8 ft) in
  length and weighing 300–400 kg (660–880 lb).
diet: herbivore
locomotion: quadrupedal
