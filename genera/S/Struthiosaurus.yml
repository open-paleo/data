genus: Struthiosaurus
parent: Nodosauridae
pronunciation:
  phonetic: STROOTH-ee-o-SAWR-us
etymology: From Latin struthio ('ostrich') and Greek sauros ('lizard'), meaning 'ostrich lizard'
description: Struthiosaurus is a genus of nodosaurid dinosaurs from the Late
  Cretaceous period (Santonian-Maastrichtian) of Austria, Romania, France, and
  possibly Hungary. It was a small dinosaur, measuring 2-3 m (6.6-9.8 ft) in
  length and weighing 300-400 kg (660-880 lb).
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Single occipital condyle with temporal fossa resembling a Crocodile
  - Convex occiput with gentle passage into skull roof, without forming an angle
    as in other reptiles
  - Transverse ridge in the occipital region
  - Absence of sutures between bones; globular condyle form
  - Horizontality of skull base with ascending clivus
  - Large brain-cavity; overall resemblance to bird skulls rather than typical
    Dinosaurian type
appearance:
  features:
    - body armor
    - osteoderms
    - shoulder spikes
  integument: armored
  evidence: direct
