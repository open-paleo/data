genus: Shishugounykus
parent: Alvarezsauroidea
dispute:
  summary: >
    Shishugounykus inexpectus was described as an early-diverging alvarezsaurian
    (Qin et al., 2019) and recovered as the earliest-diverging member of the
    group by Meso et al. (2024). Agnolín et al. (2021) questioned this, arguing
    that the Jurassic Chinese "alvarezsauroids" (Shishugounykus with Haplocheirus
    and Aorun) may instead have ornithomimosaur or compsognathid affinities.
  history:
    - date: "2026-07-01"
      note: Placed at Alvarezsauroidea following Qin et al. (2019) and Meso et al. (2024); the non-alvarezsauroid hypothesis has not been tested by a numerical analysis.
pronunciation:
  phonetic: shih-shoo-GOH-NY-kus
etymology: Named after the Shishugou Formation where it was found, combined with Greek onyx/onykos, "claw" - means "Shishugou claw"
description: Shishugounykus is a genus of basal alvarezsaurian dinosaur from the
  Shishugou Formation of Xinjiang, China. The type and only species is
  Shishugounykus inexpectus. The specific name refers to the unexpected
  discovery of another species of alvarezsaur from the Shishugou Formation
  (other alvarezsaurs from this formation include Haplocheirus and possibly
  Aorun). Its affinities to alvarezsaurs have subsequently been questioned.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Scapula with hollow acromial process but without lateral concavities
  - Humeral internal tuberosity mediolaterally constricted distally, giving it a
    pinched appearance
  - Iliac medial surface with step-wise transition from ischial peduncle to
    pubic peduncle
  - Distal end of metatarsal II asymmetrically ginglymoid
  - Supratemporal fossa occupying large portion of frontal with indistinct
    anterior border
  - Metacarpal III straight in dorsal view
  - Ungual III-3 subequal in size to ungual II-2
appearance:
  integument: feathered
  evidence: direct
