genus: Saturnalia
parent: Saturnaliidae
pronunciation:
  phonetic: sat-uhr-NAY-lee-uh
etymology: Named after the ancient Roman festival of Saturn (Saturnalia), held in December, in reference to the festive time of year during which the fossils were collected.
description: Saturnalia is an extinct genus of basal sauropodomorph dinosaur known
  from the Late Triassic Santa Maria Formation of Rio Grande do Sul, southern Brazil.
  It contains one species, Saturnalia tupiniquim. It is one of the earliest known
  dinosaurs.
diet: omnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - 1.5-meter-long gracile dinosaur with skull length approximately one-third of
    femur length
  - Lanceolate teeth with degree of heterodonty, anterior teeth higher than
    posterior
  - Deltopectoral crest extending for more than 50% of humeral length
  - Anterior blade of ilium short and pointed
  - Deep proximal portion of pubes with lateral border robust and triangular in
    distal view
  - Femur subequal in length to tibia with well-developed trochanteric shelf on
    proximal femur
  - Ascending process of astragalus broad and laterally elongated, separated
    from anterior margin by platform
appearance:
  integument: scaled
  evidence: inferred
