genus: Sauroniops
parent: Carcharodontosauridae
etymology: From Sauron, the fictional character created by
  J.R.R. Tolkien, and Greek 'ops' (eye); meaning 'eye of Sauron'.
pronunciation:
  phonetic: sor-on-ee-ops
description: >
  Sauroniops is a controversial genus of carnivorous
  carcharodontosaurid theropod dinosaurs known from the Late
  Cretaceous (Cenomanian stage) of Morocco. It is known from the
  Gara Sbaa Formation of the Kem Kem beds and contains a single
  species, S. pachytholus.
dispute: >
  The validity of Sauroniops is actively contested. Ibrahim et
  al. (2020) argued that S. pachytholus is a junior synonym of
  Carcharodontosaurus saharicus, interpreting the holotype as an
  immature C. saharicus frontal and finding the diagnostic
  characters unconvincing. Paterna and Cau (2022) rebutted this,
  reaffirming the diagnosis and reporting additional Kem Kem
  carcharodontosaurid material distinct from C. saharicus.
  Kellermann, Cuesta and Rauhut (2025) declined the synonymy but
  treated Sauroniops as a nomen dubium, holding that erecting a
  taxon on a single frontal is inappropriate pending more
  material.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Dorsoventrally thickened frontal with body depth ranging 28%
    (medial suture) to 38% (anteromedial margin of supratemporal
    fossa) of bone length.
  - Thick dome-like eminence in the anterolateral corner of the
    dorsal surface of the frontal at the level of the
    prefrontal-lacrimal articulations.
  - Prefrontal facet of the frontal trapezoidal, mostly restricted
    to the anterodorsal margin of the lateral surface, not
    participating in the orbital fossa.
  - Frontal with interdigitate suture for prefrontal restricted to
    the anteroventral corner of the facet, formed by a low shelf
    and a small finger-like projection.
  - Hypertrophied 'D-shaped' lacrimal facet with maximum depth
    four times the depth of the anterior half of the postorbital
    facet.
  - Dorsal surface of frontal anterior to supratemporal fossa
    raised and facing anterodorsally, forming a saddle-shaped
    concavity with the anterolateral dome, confluent with
    anteromedial rugosities posterior to the nasal facet.
