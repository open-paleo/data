genus: Siluosaurus
parent: Neornithischia
pronunciation:
  phonetic: suh-LOO-o-SAWR-us
description: Siluosaurus is a genus of ornithischian dinosaur from the Early
  Cretaceous (Barremian-Albian) Xinminbao Group of Gansu, China. It is based on
  the specimen IVPP V.11117 (1-2), which consists of two teeth. It is an obscure
  genus, with no papers doing more than mentioning it since it was described in
  1997. The type species is S. zhanggiani.
etymology: "Named for the Silk Road (Chinese 'Silu'), referencing the discovery
  location in Gansu, China, along the historic Silk Road corridor, combined with
  Greek 'sauros' meaning 'lizard'; meaning 'Silk Road lizard.'"
dispute:
  summary: >
    Siluosaurus is based on two isolated teeth from the Early Cretaceous
    of China and is generally regarded as a nomen dubium; it was
    originally referred to the now-abandoned Hypsilophodontidae. Its
    describing paper was not available for this assessment.
  history:
    - date: "2026-06-29"
      note: Placed at Neornithischia incertae sedis; fragmentary, tooth-based nomen dubium not placeable more precisely.
diet: herbivore
locomotion: bipedal
