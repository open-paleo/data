references:
  - id: dong1997b
    notes: Original description of Siluosaurus zhanggiani as a hypsilophodontid,
      based on two teeth from the Xinminbao Group.
  - id: butler2008b
    notes: Excluded Siluosaurus from its ornithischian phylogeny as a
      questionable tooth-based taxon.
  - id: makovicky2011a
    notes: Treated Siluosaurus as a dubious tooth-based taxon.
  - id: fonseca2024a
    notes: Found the teeth comparable to both ornithopods and ceratopsians and
      placed Siluosaurus no more precisely than Cerapoda indeterminate.
