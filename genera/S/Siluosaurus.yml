genus: Siluosaurus
parent: Cerapoda
placement: incertae sedis
pronunciation:
  phonetic: suh-LOO-o-SAWR-us
description: Siluosaurus is a genus of ornithischian dinosaur from the Early
  Cretaceous (Barremian-Albian) Xinminbao Group of Gansu, China, founded on two
  small teeth. The type species is S. zhanggiani.
etymology: "Named for the Silk Road (Chinese 'Silu'), referencing the discovery
  location in Gansu, China, along the historic Silk Road corridor, combined with
  Greek 'sauros' meaning 'lizard'; meaning 'Silk Road lizard.'"
dispute:
  summary: >
    Siluosaurus is a nomen dubium based on two isolated teeth from the Early
    Cretaceous of China. Dong (1997) named it as a hypsilophodontid — a
    now-abandoned grouping — and described the teeth as the smallest ornithopod
    teeth then known. It has since been treated as a dubious, tooth-based taxon
    (Butler et al., 2008; Makovicky et al., 2011), and Fonseca et al. (2024)
    found its teeth resemble those of both an ornithopod (Convolosaurus) and a
    ceratopsian (Archaeoceratops), placing it no more precisely than Cerapoda
    indeterminate.
  history:
    - date: "2026-06-29"
      note: Placed at Neornithischia incertae sedis; fragmentary, tooth-based nomen dubium not placeable more precisely.
    - date: "2026-07-20"
      note: Status set to nomen dubium and placement refined to Cerapoda
        indeterminate following Fonseca et al. (2024).
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
appearance:
  integument: scaled
  evidence: inferred
