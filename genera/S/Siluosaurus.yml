genus: Siluosaurus
parent: Ornithopoda
description: Siluosaurus is a genus of ornithischian dinosaur from the Early
  Cretaceous (Barremian-Albian) Xinminbao Group of Gansu, China. It is based on
  the specimen IVPP V.11117 (1-2), which consists of two teeth. It is an obscure
  genus, with no papers doing more than mentioning it since it was described in
  1997. The type species is S. zhanggiani.
etymology: "Named for the Silk Road (Chinese 'Silu'), referencing the discovery location in Gansu, China, along the historic Silk Road corridor, combined with Greek 'sauros' meaning 'lizard'; meaning 'Silk Road lizard.'"
diet: herbivore
locomotion: bipedal
