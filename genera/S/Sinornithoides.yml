genus: Sinornithoides
parent: Troodontinae
etymology: Chinese bird form
description: Sinornithoides is a genus of troodontid theropod dinosaurs that
  lived during the Early Cretaceous (Aptian or Albian stage, around 113 million
  years ago) of Inner Mongolia, China. It contains only a single species, S.
  youngi. Sinornithoides measured approximately 1 metre (3.3 ft) long, and
  probably ate invertebrates and other small prey.
diet: carnivore
