genus: Sinornithoides
parent: Troodontidae
placement: incertae sedis
dispute:
  summary: >
    Sinornithoides is recovered near the base of the troodontine radiation but
    outside a stably defined Troodontinae — as an outgroup to the derived
    Saurornithoides-Zanabazar-Troodon clade (Norell et al., 2009), just stemward of
    Troodontinae when that subfamily was erected (van der Reest and Currie, 2017),
    or in a basal polytomy (Yin et al., 2018). It is placed at Troodontidae
    incertae sedis.
  history:
    - date: "2026-07-01"
      note: Moved from Troodontinae to Troodontidae incertae sedis (least-inclusive uncontested clade); recovered just stemward of Troodontinae.
pronunciation:
  phonetic: sie-NOR-ni-THOI-deez
etymology: From Latin Sinae, "Chinese", Greek ornis, "bird", and Greek -oides, "form/resembling" - means "Chinese bird form"
description: Sinornithoides is a genus of troodontid theropod dinosaurs that
  lived during the Early Cretaceous (Aptian or Albian stage, around 113 million
  years ago) of Inner Mongolia, China. It contains only a single species, S.
  youngi. Sinornithoides measured approximately 1 meter (3.3 ft) long, and
  probably ate invertebrates and other small prey.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - arid
  - fluvial
  - lacustrine
diagnostic_features:
  - Skull shorter than Saurornithoides by factor of 0.7, relative to proximal
    caudal and pedal length
  - Nasomaxillary suture angled 20° to alveolar margin (vs steeper in relatives)
  - Temporal region narrower than orbit
  - Orbital rim frontal directed laterally at 20° to midsagittal plane
  - Tibia exceeds femur by factor of 1.4
  - Third metatarsal lacks well-developed posteroventral tongue-like extension
  - Lacks Borogovia pedal specializations (short fourth digit, unrecurved
    unguals)
appearance:
  features:
    - sickle claw
  integument: feathered
  evidence: direct
