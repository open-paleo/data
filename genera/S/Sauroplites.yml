genus: Sauroplites
parent: Nodosauridae
etymology: From Greek sauros (lizard) and hoplites (armed foot soldier,
  hoplite); meaning "saurian hoplite".
description: Sauroplites is a genus of herbivorous ankylosaurian dinosaur from
  the Early Cretaceous of China.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Transverse rows of large dermal plates with at least six plates per side in
    at least one row (vs. three in Palaeoscincus), circular to rhombic in
    outline with marginal pit-and-ridge zones for connective-tissue attachment
  - Large plate M with a deep V-shaped cross-section (upper and lower lamellae
    separated by a deep pocket) and a serrated keel bearing at least six small
    marginal spines posteriorly
  - Composite plate F with a central near-circular main portion fused with
    peripheral smaller ossicles and a deep central concavity on the internal
    surface
  - Ribs bearing a pronounced rugose dorsal surface from ~6 cm above the
    tuberculum, functioning as integument-attachment surface, with strongly
    broadened cross-section in that zone
  - Fused pelvic armor of co-ossified polygonal plates (~10 cm diameter)
    interspersed with rows of much smaller, variably sized plates; no external
    elevations on individual pelvic plates
