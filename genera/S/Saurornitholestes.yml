genus: Saurornitholestes
parent: Saurornitholestinae
pronunciation:
  phonetic: SAWR-or-NITH-o-LES-teez
etymology: From Greek sauros (lizard), ornithos (bird), and lestes (thief);
  meaning "lizard-bird thief".
description: "Saurornitholestes is a genus of carnivorous dromaeosaurid theropod
  dinosaur from the late Cretaceous of Canada (Alberta and Saskatchewan) and the
  United States (Montana, New Mexico, Alabama, and South Carolina). Two species
  have been named that are regarded as valid: Saurornitholestes langstoni in
  1978 and Saurornitholestes sullivani in 2015. Saurornitholestes was a small,
  bipedal, meat-eating dinosaur, equipped with a sickle-like claw on each foot."
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Very small, lightly built theropod with frontal triangular and not basined
    between median suture and orbital rim
  - Posterior frontal well-rounded and slightly inflated, without frontoparietal
    crest
  - Lateral walls of anterior endocranial cavity flaring laterally
  - Ectopterygoid complex with ventral pocket
  - Teeth with well-developed denticles (24-26 per 5mm) on posterior carinae and
    tiny denticles (c.35 per 5mm) on anterior carinae
appearance:
