genus: Stephanosaurus
parent: Hadrosauridae
placement: incertae sedis
etymology: From Greek 'stephanos' ('crown') and 'sauros' ('lizard'), for the
  crested skull Lambe referred to the species.
description: Stephanosaurus is a dubious genus of hadrosaurid dinosaur from the
  Late Cretaceous of Alberta, Canada. Lambe (1914) proposed it for the species
  he had described in 1902 as Trachodon marginatus, and referred a crested skull
  to it. That skull was later shown to belong to a different animal, and the
  type material of the species cannot be diagnosed, so the name is treated as a
  nomen dubium and the modern literature discusses the taxon under its original
  combination.
diet: herbivore
identifiers:
  - source: pbdb
    id: "56159"
species:
  - name: Stephanosaurus marginatus
    status: nomen dubium
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Campanian
    location:
      country: CA
      region: CA-AB
      locality: Red Deer River
    type_specimen:
      specimen_id:
        - NMC 419
      specimen_type: holotype
      institution: CMN
      material: Left humerus, ulna and radius, a pedal metatarsal and phalanges,
        cervical zygapophyses, ribs, tooth fragments, ossified tendons and
        impressions of the integument.
      completeness: fragmentary
      notes: Lambe (1914) cited a lower jaw ramus and a maxilla as the type,
        but Gilmore (1924) showed from the 1902 description that the type is
        the associated individual recorded here, and that the maxilla and
        dentary came from two different animals collected three weeks apart.
        The fore limb has the humerus longer than the radius, the proportion of
        the non-crested hadrosaurs, so it cannot belong with the crested skull
        Lambe referred to the species. The specimen is also cited as GSC 419.
    erected_in: lambe1914a
references:
  - id: lambe1914a
    notes: Proposes the genus for the species described in 1902 as Trachodon
      marginatus, and refers a crested skull to it.
  - id: parks1923a
    notes: Holds that the name can apply only to the original type material,
      and erects Lambeosaurus lambei for the referred crested skulls.
  - id: gilmore1924b
    notes: Re-examines the type, shows the referred maxilla and dentary come
      from different individuals, and treats the genus as a junior synonym of
      Kritosaurus on priority.
  - id: white1973a
    notes: Gives the type as NMC 419, limb bones with fragments of vertebrae,
      ribs and teeth from the Belly River of the Red Deer River.
  - id: brett-surman1989a
    notes: Records the type species as generically indeterminate.
  - id: horner2004a
    notes: Lists the species among hadrosaurid nomina dubia under its original
      combination.
  - id: jones2026a
    notes: Records that the skull fragments included in the description were
      later found to come from different animals.
