genus: Siats
parent: Megaraptora
description: Siats is an extinct genus of large theropod dinosaurs known from
  the Late Cretaceous Cedar Mountain Formation (Mussentuchit Member) of Utah,
  United States. The genus contains a single species, Siats meekerorum. It was
  initially classified as a megaraptoran, a clade of large theropods with
  controversial relationships. Alternative positions within the Neovenatoridae,
  Allosauroidea, and Tyrannosauroidea have also been proposed.
diet: carnivore
locomotion: bipedal
