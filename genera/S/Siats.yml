genus: Siats
parent: Megaraptora
dispute:
  summary: >
    Siats was originally described as a megaraptoran within Neovenatoridae
    (Allosauroidea). Its position has since been contentious: it has been recovered
    as a tyrannosauroid, as a non-megaraptoran neovenatorid, and as a coelurosaur
    of uncertain placement, and Jones et al. (2026) tentatively retain it in
    Neovenatoridae. The recent allosauroid analysis of Kellermann et al. (2025)
    recovers it firmly within Megaraptora, where it is placed here; its position
    relative to Megaraptoridae is unresolved, so it is left in Megaraptora
    incertae sedis.
  history:
    - date: "2026-07-01"
      note: Placed at Megaraptora incertae sedis following Kellermann et al. (2025); non-megaraptoran and neovenatorid alternatives noted. The Megaraptora higher-position debate is recorded on the Megaraptora clade file, not here.
etymology: Named after Siats, a man-eating monster from the mythology of the Ute people of Utah, near where the fossil was found.
pronunciation:
  phonetic: see-atch
description: Siats is an extinct genus of large theropod dinosaurs known from
  the Late Cretaceous Cedar Mountain Formation (Mussentuchit Member) of Utah,
  United States. The genus contains a single species, Siats meekerorum. It was
  initially classified as a megaraptoran, a clade of large theropods with
  controversial relationships. Alternative positions within the Neovenatoridae,
  Allosauroidea, and Tyrannosauroidea have also been proposed.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Craniocaudally expanded centrodiapophyseal laminae lacking well-developed
    infradiapophyseal fossae on proximal caudals
  - Transversely flattened, axially concave ventral surface yielding
    subtriangular cross-section on distal caudal vertebrae
  - Transversely concave acetabular rim of iliac pubic peduncle
  - Truncated lateral brevis shelf with notched caudal end
  - Abbreviated, transversely broad neural spines on dorsal vertebrae (height
    ~50% maximum centrum height)
