genus: Sonorasaurus
parent: Brachiosauridae
pronunciation:
  phonetic: so-NOR-a-SAWR-us
etymology: Named for the Sonora River in the Sonoran Desert of Arizona, USA,
  where its fossils were first found, combined with Greek 'sauros' meaning
  'lizard', thus meaning 'Sonora lizard'.
description: Sonorasaurus is a genus of brachiosaurid sauropod dinosaur from the
  Early to Late Cretaceous (Albian to Cenomanian stages, around 112 to 93
  million years ago). Its fossils have been found in southern Arizona, United
  States. Its name, which means "Sonora lizard", comes from the Sonora River
  that flows in the Sonoran Desert where its fossils were first found. The type
  species is S. thompsoni, described by Ratkevich in 1998.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Slender, splayed fibula distinctive in lateral profile
  - Tibia with broad triangular proximal end and robust distal end
  - Long slender metacarpals with gracile proportions
  - Reduced claws present only on pedal phalanges I and II
  - Dorsal vertebrae with curled postzygapophysis and deep lateral pleurocoels
  - Caudal vertebrae lacking pleurocoels with posteriorly angled transverse
    processes
  - Caudal neural spines simple without ligament-accommodating fork
  - Medium-sized sauropod estimated 15 m long and 8 m tall
appearance:
  integument: scaled
  evidence: inferred
