genus: Sonorasaurus
parent: Brachiosauridae
pronunciation:
  phonetic: so-NOR-a-SAWR-us
etymology: Named for the Sonora River in the Sonoran Desert of Arizona, USA,
  where its fossils were first found, combined with Greek 'sauros' meaning
  'lizard', thus meaning 'Sonora lizard'.
description: Sonorasaurus is a genus of brachiosaurid sauropod dinosaur from the
  Early to Late Cretaceous (Albian to Cenomanian stages, around 112 to 93
  million years ago). Its fossils have been found in southern Arizona, United
  States. Its name, which means "Sonora lizard", comes from the Sonora River
  that flows in the Sonoran Desert where its fossils were first found. The type
  species is S. thompsoni, described by Ratkevich in 1998.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - semiarid
  - forested
diagnostic_features:
  - Ulnar condyle of the humerus extended posteriorly into a triangular process
  - Funnel-shaped but gracile metatarsal V, proximal breadth 0.6 of its length
appearance:
  integument: scaled
  evidence: inferred
identifiers:
