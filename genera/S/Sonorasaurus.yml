genus: Sonorasaurus
parent: Brachiosauridae
description: Sonorasaurus is a genus of brachiosaurid sauropod dinosaur from the
  Early to Late Cretaceous (Albian to Cenomanian stages, around 112 to 93
  million years ago). Its fossils have been found in southern Arizona, United
  States. Its name, which means "Sonora lizard", comes from the Sonora River
  that flows in the Sonoran Desert where its fossils were first found. The type
  species is S. thompsoni, described by Ratkevich in 1998.
diet: herbivore
