genus: Siamodon
parent: Hadrosauroidea
etymology: Named after Siam (the historical name for Thailand) where it was found, combined with Greek odon, "tooth" - derived from the country of origin
pronunciation:
  phonetic: si-am-o-don
description: Siamodon is an extinct genus of iguanodontian ornithopod dinosaur
  from Early Cretaceous deposits of northeastern Thailand.
dispute:
  summary: >
    Siamodon nimngami is a hadrosauroid diagnosed by maxillary
    characters and most similar to Probactrosaurus; recent work treats
    it as distinct from the contemporaneous Ratchasimasaurus (Jones,
    2026). Norman (2014) earlier regarded it as a nomen dubium pending
    more material.
  history:
    - date: "2026-06-27"
      note: Placed at Hadrosauroidea; nomen dubium.
    - date: "2026-07-14"
      note: Retained as valid; the maxillary diagnosis is upheld by
        recent literature (Jones, 2026), with Norman's (2014) nomen
        dubium view treated as a minority opinion.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
diagnostic_features:
  - Maxilla shaped like isosceles triangle with dorsal process located at
    approximately mid-length of bone
  - Tab-like jugal process on lateral maxillary surface
  - Strong longitudinal bulge on medial surface of maxilla, forming prominent
    shelf-like ridge anteriorly
  - At least 25 maxillary teeth bearing prominent median primary ridge with weak
    or absent subsidiary ridges
  - Mamillated denticles on crown margins of maxillary teeth
appearance:
  integument: scaled
  evidence: inferred
