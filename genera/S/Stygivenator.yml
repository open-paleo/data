genus: Stygivenator
parent: Eutyrannosauria
placement: incertae sedis
etymology: From Styx, the river of the Greek underworld, and Latin 'venator'
  ('hunter'), alluding to the Hell Creek Formation.
description: Stygivenator, also known as the "Jordan theropod", is a dubious
  genus of tyrannosauroid dinosaur from the Hell Creek Formation; the type
  species is Stygivenator molnari. Originally considered a species of
  Aublysodon, another dubious genus, and then a juvenile of Tyrannosaurus, its
  specific identity cannot presently be determined because its poor preservation
  makes it impossible to rule out an identity as either a specimen of
  Tyrannosaurus or Nanotyrannus.
dispute:
  summary: >
    Molnar (1978) described LACM 28471 as a new theropod, Paul (1988)
    named it Aublysodon molnari, and Olshevsky, Ford and Yamamoto (1995) moved
    it to a genus of its own. Against that, Brochu (2003) regarded the specimen
    as an immature Tyrannosaurus rex, holding that the features distinguishing
    it are the same ones claimed for Nanotyrannus; Currie and others (2003)
    reached the same conclusion, Carr and others (2005) listed the genus among
    invalid taxa, and Carr (2020) treats the specimen as a two-year-old juvenile
    referable to T. rex. More recent work has reopened the question rather than
    closing it. Longrich and Saitta (2024) find the type differs from
    Nanotyrannus lancensis in the antorbital fossa, the maxilla and the tip of
    the mandible, raising the possibility of two distinct lineages while
    stating that further work and more fossils are needed. Paul (2025) gives the
    genus a systematic entry among the small gracile tyrannosaurs but calls its
    diagnosis provisional and the data insufficient. Zanno and Napoli (2025)
    instead regard it as a nomen dubium, impossible to assign to either
    Tyrannosaurus or Nanotyrannus. Placed at Eutyrannosauria incertae sedis,
    the least inclusive clade common to these readings.
diet: carnivore
