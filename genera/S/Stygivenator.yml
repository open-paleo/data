species:
  - name: Stygivenator molnari
    etymology: Honors Ralph E. Molnar, who first described the specimen.
    status: disputed
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Maastrichtian
    location:
      country: US
      region: US-MT
      locality: F. S. McKeever Ranch near Jordan, Garfield County
      formation: Hell Creek
    type_specimen:
      specimen_id:
        - LACM 28471
      specimen_type: holotype
      institution: LACM
      material: Both maxillae with teeth, nasals, frontals and anteromedial
        fragments of the parietal, the anterior dentaries, a fragment of the
        surangular, and a partial endocranial mold taken from the frontals and
        parietals.
      completeness: fragmentary
      notes: Collected in 1966 by Harley Garbani. Described by Molnar (1978)
        without a name, given the epithet molnari by Paul (1988) under
        Aublysodon, and made the type of this genus by Olshevsky, Ford and
        Yamamoto (1995).
    synonyms:
      - name: Aublysodon molnari
        type: reassigned
        reason: The original combination, published by Paul (1988) for the
          specimen Molnar had described in 1978. Olshevsky, Ford and Yamamoto
          (1995) moved the species to a genus of its own.
    erected_in: olshevsky1995a
erected_in: olshevsky1995a
references:
  - id: olshevsky1995a
    notes: Erects the genus for Aublysodon molnari.
  - id: molnar1978a
    notes: Original description of the type specimen, then unnamed, from the
      Hell Creek Formation of Garfield County, Montana.
  - id: paul1988a
    notes: Names the species Aublysodon molnari for the specimen Molnar had
      described.
  - id: brochu2003a
    notes: Regards the specimen as an immature Tyrannosaurus rex, the features
      distinguishing it being those claimed for Nanotyrannus.
  - id: currie2003a
    notes: Treats the material as probably a juvenile Tyrannosaurus rex.
  - id: carr2005a
    notes: Lists the genus among taxa the authors consider invalid.
  - id: carr2020a
    notes: Scores the type as a two-year-old juvenile referable to
      Tyrannosaurus rex in a growth series.
  - id: longrich2024d
    notes: Finds the type differs from Nanotyrannus lancensis in several
      cranial characters, raising the possibility of a distinct lineage.
  - id: zanno2025a
    notes: Regards the taxon as a nomen dubium that cannot be assigned to
      either Tyrannosaurus or Nanotyrannus.
  - id: paul2025b
    notes: Gives the genus a systematic entry among small gracile tyrannosaurs
      while calling its diagnosis provisional.
  - id: jones2026c
    notes: Lists the genus as a subjective synonym of Tyrannosaurus rex.
