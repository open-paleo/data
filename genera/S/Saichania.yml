genus: Saichania
parent: Ankylosaurinae
etymology: From Mongolian saihan (beautiful); meaning "beautiful one".
description: Saichania is a genus of herbivorous ankylosaurid dinosaur from the
  Late Cretaceous period of Mongolia and China. The first fossils of Saichania
  were found in the early 1970s in the Baruungoyot Formation. In 1977, the type
  species Saichania chulsanensis was named.
diet: herbivore
locomotion: quadrupedal
