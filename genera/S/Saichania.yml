genus: Saichania
parent: Ankylosaurinae
pronunciation:
  phonetic: sie-KAHN-ee-a
etymology: From Mongolian saihan (beautiful); meaning "beautiful one".
description: Saichania is a genus of herbivorous ankylosaurid dinosaur from the
  Late Cretaceous period of Mongolia and China. The first fossils of Saichania
  were found in the early 1970s in the Baruungoyot Formation. In 1977, the type
  species Saichania chulsanensis was named.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - arid
diagnostic_features:
  - Large external nostrils situated terminally, divided by horizontal septum
    separating large suboval foramen of true air passage from ventro-medially
    positioned passage leading to premaxillary sinus
  - Occipital condyle weakly convex, directed ventrally
  - Orbits anteriorly and posteriorly closed by partly neomorphic bones
  - Palatal region with strongly developed anterior and posterior maxillary
    shelves
  - Atlas and axis fused
  - One opening for nerves IX-XII
  - Pectoral girdle and fore limbs very massive with shortest metacarpals of any
    Asian ankylosaurid
