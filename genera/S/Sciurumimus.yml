genus: Sciurumimus
parent: Megalosauroidea
dispute:
  summary: >
    Sciurumimus albersdoerferi is based on a juvenile skeleton, and its
    affinities are contested. It was described as a basal megalosauroid (Rauhut
    et al., 2012) and recovered within Megalosauroidea by later analyses (Cau,
    2024), but the maniraptoromorph analysis of Hartman et al. (2019), followed
    by Jones (2026), instead recovered it as a compsognathid coelurosaur.
  history:
    - date: "2026-07-01"
      note: Placed at Megalosauroidea following the describing paper and Cau (2024) (P2/P3); the compsognathid alternative (Hartman et al., 2019) remains unresolved given the juvenile holotype.
etymology: Named for its squirrel-like tail; from Latin Sciurus (the tree squirrel genus) and Greek mimos, meaning "mimic" - the name means "squirrel mimic"
pronunciation:
  phonetic: SIGH-oor-uh-MIEM-us
description: Sciurumimus is an extinct genus of tetanuran theropod from the Late
  Jurassic Torleite Formation of Germany. It is known from a single juvenile
  specimen representing the type species, Sciurumimus albersdoerferi, which was
  found in a limestone quarry close to Painten in Lower Bavaria. The specimen
  was preserved with traces of feather-like filaments.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - marine
diagnostic_features:
  - Anterior dorsal lip of the ilium (autapomorphy)
  - Complete absence of the fourth digit of the manus
  - Type 1 filamentous plumage preserved at tail base and body parts
  - Slender and unserrated premaxillary teeth; strongly recurved maxillary teeth
    with distal serrations only
  - Medially closed maxillary fenestra; offset of maxillary fenestra from
    anterior rim of antorbital fossa
appearance:
  features:
    - tail bristles
  integument: feathered
  evidence: direct
