genus: Silvisaurus
parent: Nodosauridae
pronunciation:
  phonetic: SIL-vi-SAWR-us
etymology: From Latin 'silva' (woodland, forest) + Greek 'sauros' (lizard),
  meaning 'woodland lizard', reflecting the forested environment it likely
  inhabited.
description: Silvisaurus, from the Latin silva "woodland" and Greek sauros
  "lizard", is a nodosaurid ankylosaur from the Early to Late Cretaceous period.
  It is the only known dinosaur species named from terrestrial deposits in
  Kansas and was designated the official state land fossil in 2023.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Skull pear-shaped, about three-fourths as wide as long, widest at posterior
    margins of orbits
  - Dermal armor concealing antorbital and temporal fenestrae without prominent
    processes
  - Premaxillary teeth eight or nine, bluntly conical, slightly serrate, lacking
    cingulum
  - Maxillary teeth 17-18 with spatulate crowns, margins having 7-9 serrations
  - Sacrum with 6 fused vertebrae plus presacral rod of 5 additional fused
    vertebrae
  - Pterygoids expanded posteriorly but not fusing with quadrates; thin-walled
    posterior pouches forming resonance chambers
appearance:
  features:
    - keratinous beak
    - osteoderms
    - body armor
