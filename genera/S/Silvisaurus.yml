genus: Silvisaurus
parent: Nodosauridae
etymology: From Latin 'silva' (woodland, forest) + Greek 'sauros' (lizard), meaning 'woodland lizard', reflecting the forested environment it likely inhabited.
description: Silvisaurus, from the Latin silva "woodland" and Greek sauros
  "lizard", is a nodosaurid ankylosaur from the Early to Late Cretaceous period.
  It is the only known dinosaur species named from terrestrial deposits in
  Kansas and was designated the official state land fossil in 2023.
diet: herbivore
locomotion: quadrupedal
