genus: Syngonosaurus
parent: Iguanodontia
description: Syngonosaurus is an extinct genus of ornithopod dinosaur from the
  Early Cretaceous. It was an iguanodontian discovered in the Cambridge
  Greensand of England and was first described in 1879. The type species, S.
  macrocercus, was described by British paleontologist Harry Seeley in 1879 and
  it was later synonymised with Acanthopholis, but the genus was reinstated in a
  2020 study, when Syngonosaurus and Eucercosaurus were reinterpreted as basal
  iguanodontians.
diet: herbivore
locomotion: bipedal
