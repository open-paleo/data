genus: Syngonosaurus
parent: Iguanodontia
pronunciation:
  phonetic: sin-GON-oh-SAWR-us
etymology: "From Greek 'syngonos' meaning 'congenital' or 'related by birth', combined with Greek 'sauros' meaning 'lizard', likely referring to the fused or closely associated bones in the specimen."
description: Syngonosaurus is an extinct genus of ornithopod dinosaur from the
  Early Cretaceous. It was an iguanodontian discovered in the Cambridge
  Greensand of England and was first described in 1879. The type species, S.
  macrocercus, was described by British paleontologist Harry Seeley in 1879 and
  it was later synonymised with Acanthopholis, but the genus was reinstated in a
  2020 study, when Syngonosaurus and Eucercosaurus were reinterpreted as basal
  iguanodontians.
dispute:
  summary: >
    Syngonosaurus macrocercus, long synonymized with the ankylosaur
    Acanthopholis, was reinstated as a basal iguanodontian (McDonald and
    others, 2020); it is based on Cambridge Greensand composites and is
    treated as an indeterminate iguanodontian.
  history:
    - date: "2026-06-29"
      note: Placed at Iguanodontia incertae sedis; nomen dubium (P2).
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - marine
diagnostic_features:
  - Early dorsal vertebrae remarkably compressed laterally throughout the centrum
  - Sharp keel developed on sacral vertebral centra
  - Caudal vertebrae with oblique, slightly procoelous articular faces
    indicating stiff tail
  - Large facets on caudal vertebrae for chevron bones arranged as sutural
    surfaces
  - Tail vertebrae compressed below transverse processes with well-rounded
    visceral surface
