genus: Similicaudipteryx
parent: Caudipterygidae
etymology: From Latin 'similis' (similar, resembling) + the genus name
  Caudipteryx (itself from Latin 'cauda', tail, + Greek 'pteryx', feather/wing),
  meaning 'similar to Caudipteryx'.
pronunciation:
  phonetic: SIH-mih-li-cow-DIP-tuh-riks
description: Similicaudipteryx, meaning "similar to Caudipteryx" (which itself
  means "tail feather"), is a genus of theropod dinosaur of the family
  Caudipteridae.
diet: omnivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
diagnostic_features:
  - Dagger-like pygostyle with last two caudals co-ossified
  - Shape of ilium most similar to caudipterids
  - Ratio of pubis to ilium length is 1.46
  - Two large and deep hypapophyses on first and second dorsal vertebrae
  - Last five caudals co-ossified into pygostyle, unlike other caudipterids
  - Pleurocoels on last cervical and all preserved dorsals
appearance:
  integument: feathered
  evidence: direct
