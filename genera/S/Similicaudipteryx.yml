genus: Similicaudipteryx
parent: Caudipterygidae
etymology: From Latin 'similis' (similar, resembling) + the genus name Caudipteryx (itself from Latin 'cauda', tail, + Greek 'pteryx', feather/wing), meaning 'similar to Caudipteryx'.
description: Similicaudipteryx, meaning "similar to Caudipteryx" (which itself
  means "tail feather"), is a genus of theropod dinosaur of the family
