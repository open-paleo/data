genus: Sinornithomimus
parent: Ornithomimidae
etymology: From Latin 'Sinae' (China) + Greek 'ornis' (bird) + Latin 'mimus' (mimic, imitator), meaning 'Chinese bird mimic', reflecting its Chinese origin and ornithomimid (bird-mimicking) classification.
description: Sinornithomimus is a genus of ornithomimid dinosaur that lived in
  the Late Cretaceous Ulansuhai Formation of Alshanzuo Banner, Inner Mongolia,
  northern China. The first remains were found in 1997 and described six years
  later in 2003 as the new genus and species Sinornithomimus dongi.
diet: herbivore
locomotion: bipedal
