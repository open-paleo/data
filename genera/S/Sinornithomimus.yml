genus: Sinornithomimus
parent: Ornithomimidae
pronunciation:
  phonetic: sy-nor-NITH-oh-MY-mus
etymology: From Latin 'Sinae' (China) + Greek 'ornis' (bird) + Latin 'mimus'
  (mimic, imitator), meaning 'Chinese bird mimic', reflecting its Chinese origin
  and ornithomimid (bird-mimicking) classification.
description: Sinornithomimus is a genus of ornithomimid dinosaur that lived in
  the Late Cretaceous Ulansuhai Formation of Alshanzuo Banner, Inner Mongolia,
  northern China. The first remains were found in 1997 and described six years
  later in 2003 as the new genus and species Sinornithomimus dongi.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - arid
diagnostic_features:
  - Depression on dorsolateral surface of posterior process of parietal
  - Fenestra within quadratic fossa divided into two by vertical lamina
  - Low ridge on ventral surface of parasphenoid bulla
  - Loss of posterolateral extension of the proatlas
appearance:
  features:
    - keratinous beak
  integument: feathered
  evidence: inferred
