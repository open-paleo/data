genus: Siamosaurus
parent: Spinosauridae
dispute:
  summary: >
    Siamosaurus suteethorni is based solely on isolated teeth, and both its
    affinities and its validity have been contested. Buffetaut and Ingavat
    (1986) tentatively referred it to Spinosauridae, but Sues et al. (2002)
    considered the material insufficient to establish even dinosaurian
    affinities, and Weishampel et al. (2004) placed it no more precisely than
    Theropoda indeterminate. Its spinosaurid identity has since gained support:
    Buffetaut et al. (2008) cited converging lines of evidence — including a
    spinosaurid skeleton from the tooth-bearing Khok Kruat Formation — and
    Carrano et al. (2012) referred the teeth to ?Spinosauridae. Nonetheless the
    genus is widely treated as a nomen dubium, because its teeth cannot be
    distinguished from those of other spinosaurids (Holtz et al., 2004; Sales
    and Schultz, 2017; Smyth et al., 2020); associated skeletal material may
    eventually permit a more secure identification.
  history:
    - date: "2026-07-01"
      note: Placed at Spinosauridae following Carrano et al. (2012); retained as a nomen-dubium-grade, teeth-based taxon that cannot be resolved to a subfamily.
    - date: "2026-07-20"
      note: Dispute expanded across the literature — its affinity has ranged
        from non-dinosaurian (Sues et al., 2002) to spinosaurid (Buffetaut et
        al., 2008; Carrano et al., 2012), while its tooth-based validity remains
        widely regarded as a nomen dubium.
pronunciation:
  phonetic: sie-AM-o-SAWR-us
etymology: "Named for Siam, the ancient name of Thailand, where the fossils were
  found, combined with Greek 'sauros' meaning 'lizard'; meaning 'Siam lizard.'"
description: Siamosaurus is a potentially dubious genus of spinosaurid dinosaur
  that lived in what is now Thailand and possibly China during the Early
  Cretaceous period (Barremian to Aptian) and is the first reported spinosaurid
  from Asia. It is confidently known only from tooth fossils; the first were
  found in the Sao Khua Formation, with more teeth later recovered from the
  younger Khok Kruat Formation. The only species Siamosaurus suteethorni, whose
  name honors Thai paleontologist Varavudh Suteethorn, was formally described
  in 1986. In 2009, four teeth from China previously attributed to a
  pliosaur-under the species "Sinopliosaurus" fusuiensis-were identified as
  those of a spinosaurid, possibly Siamosaurus. It is yet to be determined if
  two partial spinosaurid skeletons from Thailand and an isolated tooth from
  Japan also belong to Siamosaurus.
