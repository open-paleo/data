        - -108.166946
    size:
      length_m:
        min: 2
        max: 2
      weight_kg:
        min: 40
        max: 40
    type_specimen:
      specimen_id:
        - NMMNH P-27403
      specimen_type: holotype
      institution: NMMNH
      material: Partial skull with nearly complete frontoparietal, right supraorbital
        2, right postorbital, right squamosal, and much of the basicranium
      completeness: partial
    erected_in: williamson2003a
  - name: Sphaerotholus buchholtzae
    etymology: Honors Emily A. Buchholtz for her contributions to
      pachycephalosaurian research.
    status: valid
    type_species: false
    period:
      name:
        - Late Cretaceous
      stage:
        - Maastrichtian
    location:
      country: US
      region: US-MT
      formation: Hell Creek
      locality: Western Carter County
    type_specimen:
      specimen_id:
        - TMP 1987.113.0003
      specimen_type: holotype
      institution: TMP
      material: Partial skull
    diagnostic_features:
      - Parietal widely exposed between the squamosals and wide enough to bear
        parietosquamosal nodes.
      - Caudal margin of the parietosquamosal shelf shallows to a greater degree
        than in S. goodwini.
      - Lateral corner node reduced in size relative to S. goodwini and
        positioned above the ventral margin of the parietosquamosal bar.
      - Nodes along the lateral margin of the parietosquamosal shelf are reduced
        on the squamosal and coalesce into a ridge on the postorbital.
    erected_in: williamson2003a
    described_in: woodruff2023a
  - name: Sphaerotholus edmontonensis
    etymology: Named for the Edmonton Formation (now the Horseshoe Canyon
      Formation) of Alberta, the horizon of the type series.
    status: valid
    type_species: false
    period:
      name:
        - Late Cretaceous
      stage:
        - Maastrichtian
    location:
      country: CA
      region: CA-AB
      formation: Horseshoe Canyon
      locality: Red Deer River, below Scollard Ferry
    type_specimen:
      specimen_id:
        - GSC 8830
      specimen_type: holotype
      institution: CMN
      material: Frontoparietal (dome) region of an adult skull
    diagnostic_features:
      - Frontoparietal dome oval in outline in dorsal view, low and gently
        arched in the adult.
      - Parieto-squamosal shelf only slightly developed.
      - Frontals low and narrow where in contact with the nasals, not set off
        from the rest of the frontals by lateral grooves.
      - Dorsal region of the endocranial cavity relatively longer and wider than
        in other species of the genus.
      - Base of the parietals behind the endocranial cavity not downcurved.
      - Inner walls of the lateral temporal openings indicate these were not as
        dorsoventrally compressed as in other species.
    erected_in: brown1943a
  - name: Sphaerotholus lyonsi
    etymology: Honors Randy Lyons, a long-time TMP Field Experience Program
      participant who discovered the holotype in 2002.
    status: valid
    type_species: false
    period:
      name:
        - Late Cretaceous
      stage:
        - Campanian
    location:
      country: CA
      region: CA-AB
      formation: Dinosaur Park
      locality: Dinosaur Provincial Park, near the base of the Lethbridge Coal
        Zone
    type_specimen:
      specimen_id:
        - TMP 2002.012.0063
      specimen_type: holotype
      institution: TMP
      material: Nearly complete right squamosal, missing only the lateral surface and
        ventral processes.
    diagnostic_features:
      - Squamosal bears two posterior node rows, with a ventral row occurring
        below the primary row and medial to the corner node, versus a single
        posterior row in S. buchholtzae and S. goodwini and three rows in S.
        triregnum.
      - Posterior region of the squamosal bar is thickened ventrally to support
        the accessory second row of nodes.
      - Strongly posteriorly pronounced 'lip' on the parietosquamosal shelf that
        tapers laterally more gradually than in other Sphaerotholus.
      - Medialmost node is not bisected by the parietosquamosal suture,
        indicating the squamosal lacks a true parietosquamosal node, unlike S.
        buchholtzae.
    erected_in: woodruff2023a
  - name: Sphaerotholus triregnum
    etymology: From triregnum, the three-crowned Papal tiara, referencing the
      domed frontoparietal and the three crown-like rows of peripheral nodes.
    status: valid
    type_species: false
    period:
      name:
        - Late Cretaceous
      stage:
        - Maastrichtian
    location:
      country: US
      region: US-MT
      formation: Hell Creek
      locality: Garfield County, ~45 km southwest of Jordan
    type_specimen:
      specimen_id:
        - ROM 53583
      specimen_type: holotype
      institution: ROM
      material: Nearly complete, well-preserved isolated left squamosal; no
        frontoparietal dome known
    diagnostic_features:
      - Squamosal bears three posterior and three lateral node rows, versus a
        single row of each in S. buchholtzae, S. goodwini and S. edmontonensis
      - W-shaped (rotated) postorbital sulcus on the squamosal, an autapomorphy
        unique among known pachycephalosaurines
      - Medialmost node of the primary posterior node row has a prominent
        pyramidal medial process but is not bisected by the parietosquamosal
        suture, unlike S. buchholtzae and S. edmontonensis
      - Lacks a parietosquamosal node, as in S. lyonsi and S. goodwini, rather
        than possessing one as in S. buchholtzae and S. edmontonensis
    erected_in: woodruff2023a
references:
  - id: williamson2003a
    notes: Erects the genus Sphaerotholus with type species S. goodwini and the
      second species S. buchholtzae.
  - id: brown1943a
    notes: Erects the basionym Troodon edmontonensis (now Sphaerotholus
      edmontonensis) on domes from the Edmonton (Horseshoe Canyon) Formation.
  - id: woodruff2023a
    notes: Erects S. lyonsi and S. triregnum and revises the genus.
