genus: Sphaerotholus
parent: Pachycephalosaurinae
etymology: From Greek 'sphaira' (sphere, ball) + Greek 'tholos' (dome, domed
  building), meaning 'spherical dome' or 'ball dome', referring to the
  characteristic rounded domed skull of this pachycephalosaurid.
pronunciation:
  phonetic: SFEE-ro-THO-luss
description: "Sphaerotholus is a genus of pachycephalosaurid dinosaur from the
  Upper Cretaceous of the western United States and Canada. To date, five
  species have been described: the type species, S. goodwini, from the
  Den-na-zin Member of the Kirtland Formation and possibly the Fossil Forest
  Member of the Fruitland Formation (Late Campanian) of San Juan County, New
  Mexico, USA; S. buchholtzae, from the Hell Creek Formation (Late
  Maastrichtian) of western Carter County, Montana, USA and the Frenchman
  Formation of Saskatchewan, Canada; S. edmontonensis, from the Horseshoe Canyon
  Formation of Alberta, Canada; S. lyonsi, from the Dinosaur Park Formation
  (Campanian) of Alberta, Canada; and S. triregnum from the Hell Creek Formation
  of Garfield County, Montana, USA."
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Parietosquamosal bar that reduces in depth laterally to a lesser extent than
    S. buchholtzae
  - Parietal reduced to a thin slip between the squamosals in caudal view
  - High, wide, and convex dome that incorporates the lateral marginal bones
  - One row of large and conical nodes along the caudodorsal and lateral margins
    of the squamosal
  - Dorsotemporal fenestrae closed
  - Parietosquamosal shelf small, inflated, and does not include the parietals
  - Broad nuchal shelf that overhangs the occipital region
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "67681"
  - source: wikidata
    id: Q134104
