genus: Sanjuansaurus
parent: Herrerasauridae
etymology: Named after San Juan Province in Argentina where it was found,
  combined with Greek sauros (lizard); meaning "San Juan Province lizard".
pronunciation:
  phonetic: san-hwan-SOR-us
description: Sanjuansaurus is a genus of herrerasaurid dinosaur from the Late
  Triassic (Carnian) Ischigualasto Formation of the Ischigualasto-Villa Unión
  Basin in northwestern Argentina.
locomotion: bipedal
paleoenvironment:
  - fluvial
diet: carnivore
diagnostic_features:
  - Shelf-like, posterolaterally directed transverse processes on posterior
    cervical vertebrae
  - Neural spines of sixth to eighth dorsal vertebrae bearing acute anterior and
    posterior processes
  - Everted lateral margins of the glenoid of scapula and coracoid
  - Short pubis (63% of femoral length)
  - Pronounced, rugose scar on medial surface of femur at level of fourth
    trochanter
