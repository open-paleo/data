    species: Stegoceras validum
    category: most-complete
    significance: "The most complete known individual of Stegoceras, a complete skull with associated postcranial remains and the basis of most scientific understanding of the genus. Its preservation includes ossified soft tissue in the nasal cavity, and it is the model for dome, feeding, and limb studies."
    discovered:
      year: 1926
      by: "George F. Sternberg"
    references: [gilmore1924c, sullivan2003c]
  - specimen_id: [AMNH 5450]
    institution: AMNH
    species: Stegoceras validum
    category: ontogeny
    significance: "A flattened dome long central to the ontogeny and dimorphism debate. Originally the female morph of Stegoceras, then made holotype of the flat-headed Ornatotholus, it is now interpreted as a juvenile S. validum documenting the flat-to-domed growth transition."
    discovered:
