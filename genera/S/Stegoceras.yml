genus: Stegoceras
parent: Pachycephalosauridae
pronunciation:
  phonetic: ste-GOS-er-as
etymology: "From Greek 'stege' (στέγη) meaning 'roof' and 'keras' (κέρας)
  meaning 'horn'; meaning 'horn roof', referring to the domed skull."
description: Stegoceras is a genus of pachycephalosaurid (dome-headed) dinosaur
  that lived in what is now North America during the Late Cretaceous period,
  about 77.5 to 74 million years ago (mya). The first specimens from Alberta,
  Canada, were described in 1902, and the type species Stegoceras validum was
  based on these remains. The generic name means "horn roof", and the specific
  name means "strong". Several other species have been placed in the genus over
  the years, but these have since been moved to other genera or deemed junior
  synonyms. Currently only S. validum and S. novomexicanum, named in 2011 from
  fossils found in New Mexico, remain. The validity of the latter species has
  also been debated, and it may not even belong to the genus Stegoceras.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Dome-shaped upper surface of cranial bones
  - Transverse suture dividing bones into anterior and posterior halves
  - Symmetrical, compact paired bones situated in median line ahead of nasals
  - Anterior end produced forward with two projections on larger specimen
  - Nodose surface texture on anterior and lateral-posterior regions
