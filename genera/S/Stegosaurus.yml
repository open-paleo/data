references:
  - id: maidment2015a
  - id: marsh1877a
    notes: Erects the genus Stegosaurus and the order Stegosauria on a partial
      Morrison-Formation skeleton; original type species S. armatus, later
      superseded by S. stenops.
  - id: marsh1887a
    notes: Erects Stegosaurus stenops on USNM 4934, later designated the type
      species of Stegosaurus under ICZN Opinion 2320.
  - id: marsh1879a
    notes: Erects Stegosaurus ungulatus on YPM 1853 from the Morrison Formation
      of Como Bluff, Wyoming.
  - id: gilmore1914b
    notes: Foundational monograph on USNM 4934 (the future neotype- equivalent
      holotype of S. stenops). Establishes the alternating plate arrangement and
      supplies the first detailed osteology of the genus.
  - id: maidment2008a
    notes: Alpha-level revision of Stegosauria; sinks Hesperosaurus and Wuerhosaurus
      into Stegosaurus (as S. mjosi and S. homheni). Both synonymies are
      contested in subsequent literature.
  - id: iczn2013a
    notes: Resolves Case 3536 (Galton, 2010). Sets aside all prior type-species
      fixations under plenary power and designates S. stenops Marsh, 1887
      (holotype USNM 4934) as the new type species. Vote 22-3.
  - id: paul2024a
    notes: Source of the appearance features.
  - id: marsh1881b
    notes: Erected Diracodon laticeps, later synonymized with Stegosaurus.
