genus: Stegosaurus
parent: Stegosaurinae
etymology: From Greek stegos (roof) and sauros (lizard); meaning "roof lizard",
  in reference to the parasagittal rows of large dermal plates that Marsh
  initially interpreted as forming a roof-like carapace over the back of the
  animal.
pronunciation:
  phonetic: STEG-o-SAWR-us
  ipa: /ˌstɛɡəˈsɔːrəs/
description: Stegosaurus is the type genus of Stegosauridae and one of the most
  readily recognized dinosaurs, characterized by two parasagittal rows of large,
  erect dermal plates running from the cervicodorsal junction to near the tail
  tip and by four long tail spines (the "thagomizer") at the distal end of the
  tail. Marsh erected the genus and the order Stegosauria in 1877 on a partial
  skeleton from the Morrison Formation of Colorado, originally naming S. armatus
  as the type species. C. W. Gilmore's 1914 monograph on USNM 4934 (Felch Quarry
  No. 1, Garden Park, Colorado) supplied the first detailed osteology of the
  genus and resolved decades of argument over the plate arrangement,
  demonstrating from articulated evidence that the plates of the two rows
  alternate rather than pair. Because Marsh's S. armatus material is too
  fragmentary to anchor the genus, ICZN Opinion 2320 (2013) set aside all prior
  type-species fixations under plenary power and designated S. stenops Marsh,
  1887, with USNM 4934 as its holotype, as the new type species — the form on
  which most of our modern picture of the genus rests. Besides the type species,
  S. ungulatus (Marsh, 1879) is also widely recognized as valid; other named
  forms are subsumed in Stegosaurus (S. duplex as a junior synonym of S.
  ungulatus, and Diracodon laticeps), while the synonymies of Hesperosaurus and
  Wuerhosaurus proposed by Maidment et al. (2008) remain contested in subsequent
  literature and are not accepted here.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - wetland
appearance:
  features:
    - dermal plates
    - tail spikes
  integument: armored
  evidence: direct
diagnostic_features:
  - Skull comparatively very small with a brain cavity proportionally among the
    smallest of any large terrestrial vertebrate.
  - Sacrum with an enormously enlarged neural canal forming a chamber many times
    the cranial capacity, fully roofed over by bone.
  - Two parasagittal rows of erect, flattened, kite-shaped dermal plates
    extending from the cervicodorsal junction to near the tail tip; plates of
    opposite rows alternating rather than paired.
  - Tail bearing four large dermal spines arranged in two pairs near the distal
    end (thagomizer); roughly 20-22 dermal plates total.
  - Pes tetradactyl with digit IV reduced to a vestigial metatarsal; digit V
    absent.
  - Tibia distinctive in having the greatest diameter of both ends lying
    approximately in the same plane.
  - Postzygapophyses on the posterior cervical vertebrae elongate posteriorly,
    overhanging the back of the centrum.
  - Supra-acetabular process of the ilium diverging at approximately 90 degrees
    from the anterior process.
