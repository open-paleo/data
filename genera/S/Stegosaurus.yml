        - USNM 4934
      specimen_type: holotype
      institution: USNM
      material: Articulated and largely complete skeleton with skull, lower jaws, full
        presacral and sacral columns, 22 caudal vertebrae, both pectoral and
        pelvic girdles, fore- and hindlimbs, 17 dermal plates, one dermal spine,
        and numerous dermal ossicles.
      completeness: complete
    erected_in: marsh1887a
  - name: Stegosaurus ungulatus
    etymology: From Latin 'ungulatus' meaning 'hoofed', in reference to the
      hoof-like unguals of the type specimen.
    status: valid
    type_species: false
    period:
      name:
        - Late Jurassic
      stage:
        - Kimmeridgian
        - Tithonian
    location:
      country: US
      region: US-WY
      formation: Morrison
      locality: Como Bluff (Quarry 12/13, near Robber's Roost)
    type_specimen:
      specimen_id:
        - YPM 1853
      specimen_type: holotype
      institution: YPM
      material: Partial skull, several vertebrae, an ischium, partial limbs, several
        dermal plates, and four tail spikes (thagomizers).
      completeness: partial
    size:
      length_m:
        min: 7
        max: 7.5
      weight_kg:
        min: 3800
        max: 5000
    diagnostic_features:
      - Longer hind limb (femur) and hip bones than in S. stenops
      - Plates proportionately smaller and more pointed, with wide bases and
        narrow tips, rather than the large broad plates of S. stenops
      - A pair of small, flattened, spine-like plates positioned just before the
        tail spikes, mirrored in shape and arranged in pairs
      - Sacral centra broad and rounded, lacking the ventral keel present in the
        sacrals of S. stenops
      - Spinous processes of the sacral vertebrae taller than in S. stenops
    synonyms:
      - name: Stegosaurus duplex
        type: junior subjective
        reason: Type specimen (YPM 1858) is one of the cotypes upon which Marsh founded
          S. ungulatus (Gilmore, 1914); now regarded as synonymous with S.
          ungulatus.
    erected_in: marsh1879a
    described_in: gilmore1914b
