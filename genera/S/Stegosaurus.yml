synonyms:
  - name: Stegosaurus duplex
    type: junior subjective
    reason: Erected by Marsh (1887) on a sacrum and other elements
      from Como Bluff, Wyoming; treated by Lull and by Gilmore (1914)
      as conspecific with the cotype of S. ungulatus and therefore
      invalid.
  - name: Diracodon laticeps
    type: junior subjective
    reason: Erected by Marsh (1881) on jaw fragments from Como Bluff,
      Wyoming; Gilmore (1914) argued the type was juvenile Stegosaurus
      material and referred its caudal vertebrae and spines to S.
      stenops, treating the genus as invalid.
species:
  - name: Stegosaurus stenops
    etymology: From Greek stenos (narrow) and ops (face); "narrow
      face", referring to the relatively narrow rostrum compared with
      other Stegosaurus material recognised at the time of Marsh's
      1887 description.
