synonyms:
  - name: Diracodon laticeps
    type: junior subjective
    reason: Erected by Marsh (1881) on two imperfect maxillae from Como Bluff,
      Wyoming (YPM 1885). Gilmore (1914) found the genus to rest entirely on
      teeth and maxillary characters that agree with Stegosaurus, and the
      carpal and tarsal characters Marsh added later to be features of
      immaturity. The caudal vertebrae and spines Marsh figured under the name
      in 1887 were referred to S. stenops, but Gilmore expressly excluded the
      1881 name from that species synonymy, so the binomial attaches to the
      genus rather than to any one species.
