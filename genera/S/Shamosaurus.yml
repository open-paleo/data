genus: Shamosaurus
parent: Ankylosauridae
pronunciation:
  phonetic: SHAH-maw-SAWR-us
etymology: From Mandarin Chinese 'sha mo' (sand desert, the Chinese name for the
  Gobi Desert) + Greek 'sauros' (lizard), meaning 'Gobi desert lizard'.
description: Shamosaurus is an extinct genus of herbivorous basal ankylosaurid
  ankylosaur from Early Cretaceous (Aptian to Albian stage) deposits of Höövör,
  Mongolia.
diet: herbivore
locomotion: quadrupedal
