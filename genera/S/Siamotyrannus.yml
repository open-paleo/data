genus: Siamotyrannus
parent: Metriacanthosaurinae
dispute:
  summary: >
    Siamotyrannus isanensis was described as an early tyrannosaurid
    (Buffetaut and colleagues, 1996), but analyses since recover it among
    the allosauroids (Rauhut, 2003), as a metriacanthosaurine (Carrano,
    Benson and Sampson, 2012; Rauhut and colleagues, 2024). Samathi and
    colleagues (2019) regard it as an avetheropod, possibly a basal
    coelurosaur rather than a basal allosauroid.
  history:
    - date: "2026-07-02"
      note: Placed at Metriacanthosaurinae following Carrano, Benson and Sampson (2012) and Rauhut and colleagues (2024); the original tyrannosaurid identification is rejected and a minority megaraptoran affinity is noted.
    - date: "2026-10-20"
      note: >
        Alternative credited to Samathi and colleagues (2019), who
        regard it as a possible basal coelurosaur.
pronunciation:
  phonetic: sie-AM-o-ti-RAN-us
etymology: From the old Thai kingdom of Siam combined with Latinised Greek tyrannus, "tyrant" — means "Siamese tyrant"
description: Siamotyrannus is a genus of possibly allosauroid theropod dinosaur
  from the Early Cretaceous Sao Khua Formation of Thailand.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Long and relatively low ilium with incipient subhorizontal medioventral
    shelf on anterior blade
  - Pubis with long straight shaft terminating in massive distal boot, more
    developed anteriorly than posteriorly
  - Obturator foramen of pubis open ventrally but largely encircled by proximal
    bony hook
  - Ischium slender and curved with well-defined scar on proximodorsal edge for
    flexor tibialis internus insertion
  - Anterior caudal vertebrae with tall slender neural spines
  - Mid-caudal vertebrae with small dorsal process on neural arch anterior to
    main neural spine
  - Anterior chevrons long straight and slender
appearance:
  integument: scaled
  evidence: inferred
