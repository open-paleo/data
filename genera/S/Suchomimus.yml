genus: Suchomimus
parent: Baryonychinae
pronunciation:
  phonetic: SOOK-o-MIEM-us
etymology: From Greek souchos ('crocodile') and Latin mimus ('mimic'), meaning 'crocodile mimic', alluding to its elongated skull and piscivorous adaptations
description: Suchomimus is a genus of large theropod dinosaur that lived in what
  is now Niger during the Aptian to Albian stages of the Early Cretaceous
  period, 112 million years ago. The only known species is S. tenerensis,
  originally described in 1998 by paleontologist Paul Sereno and colleagues from
  several fossils discovered one year earlier in the Elrhaz Formation. Although
  these fossils come from multiple specimens, they represent one of the most
  anatomically well-documented spinosaurids. The animal's generic name, which
  means "crocodile mimic", alludes to its elongated skull and piscivorous
  adaptations, while the specific name refers to the Ténéré Desert, where the
  fossils were discovered.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Elongate posterolateral premaxillary process that nearly excludes maxilla
    from external naris
  - Broadened and heightened posterior dorsal, sacral, and anterior caudal
    neural spines
  - Robust humeral tuberosities
  - Hypertrophied ulnar olecranon process offset from humeral articulation
  - Hook-shaped radial ectepicondyle
