genus: Suskityrannus
parent: Tyrannosauroidea
etymology: From Zuni suski, "coyote", combined with Greek tyrannos, "tyrant" - means "coyote tyrant"
pronunciation:
  phonetic: SOO-skee-TY-ran-us
description: Suskityrannus is a genus of small tyrannosauroid theropod from the
  Late Cretaceous of southern Laramidia. It contains a single species,
  Suskityrannus hazelae, and the type specimen was found in the Turonian-aged
  Moreno Hill Formation of the Zuni Basin in western New Mexico.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Distal femoral condyles strongly mediolaterally compressed with crista
    tibiofibularis merging smoothly into lateral condyle
  - Medial condyle of proximal tibia hooked posteromedially
  - D-shaped, incisiform and carinate premaxillary teeth
  - Anteroposteriorly shortened premaxilla (less than 10% of maxilla length)
  - Cervical vertebrae neural arches X-shaped in dorsal view with
    anteroposteriorly short neural spine
  - Arctometatarsalian pes with metatarsal III pinched between II and IV
    (earliest record in tyrannosauroids)
