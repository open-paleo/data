genus: Savannasaurus
parent: Diamantinasauria
etymology: From English 'savanna', referring to the open grassland/savanna landscape of Queensland, Australia where its fossils were found, combined with Greek 'sauros' meaning 'lizard'.
pronunciation:
  phonetic: suh-VAN-uh-SOR-us
description: Savannasaurus is a genus of titanosaurian sauropod dinosaur from
  the Late Cretaceous Winton Formation of Queensland, Australia. It contains one
  species, Savannasaurus elliottorum, named in 2016 by Stephen Poropat and
  colleagues. The holotype and only known specimen, originally nicknamed "Wade",
  is the most complete specimen of an Australian sauropod, and is held at the
  Australian Age of Dinosaurs museum. Dinosaurs known from contemporary rocks
  include its close relative Diamantinasaurus and the theropod Australovenator;
  associated teeth suggest that Australovenator may have fed on the holotype
  specimen.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Undulating anterior articular surface of the anterior caudal centra (concave
    dorsally, convex ventrally)
  - Anteriormost caudal centra with shallow lateral pneumatic fossae (local
    autapomorphy within Somphospondyli)
  - Sternal plate with a straight lateral margin (reversal) and lacking an
    anteroposteriorly elongate ridge along the anterior part of the ventral
    surface
  - Metacarpal IV with an hourglass-shaped distal end; pubis with a ridge
    extending anteroventrally from the ventral margin of the obturator foramen on
    the lateral surface
  - Ischium with the proximal plate's anteroposterior length greater than 40% of
    the element's overall proximodistal length
  - Astragalus taller proximodistally than wide mediolaterally or long
    anteroposteriorly, with mediolateral width and anteroposterior length
    essentially equal
