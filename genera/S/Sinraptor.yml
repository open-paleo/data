genus: Sinraptor
parent: Metriacanthosaurinae
pronunciation:
  phonetic: sien-RAP-tor
  ipa: /sɪnˈræptər/
etymology: "From Latin 'Sinae' (China) + Latin 'raptor' (thief, plunderer),
  meaning 'Chinese plunderer' or 'thief from China', reflecting its discovery in
  China."
description: Sinraptor is a genus of metriacanthosaurid theropod dinosaur from
  the Shishugou Formation China. Sinraptor and its close relatives were among
  the earliest members of the Jurassic carnosaurian radiation. Sinraptor still
  remains the best-known member of the family Metriacanthosauridae, with some
  older sources even using the name "Sinraptoridae" for the family.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Quadratojugal process of jugal divided into three prongs
  - Pronounced postorbital rugosity forming lateral margin of relatively large,
    triangular space on dorsal surface of skull
  - Jugal ramus of palatine extends ventrally below level of maxillary suture in
    a distinct process
  - Hollow interior of ectopterygoid confluent with anteroventral pneumatic
    opening medial to jugal contact
  - Exoccipitals extend ventrally below basal tubera; occipital condyle oriented
    posteroventrally
  - Inflection in atlas-axis complex brings vertebral column under back of skull
    more markedly than in Yangchuanosaurus
appearance:
  integument: scaled
  evidence: inferred
