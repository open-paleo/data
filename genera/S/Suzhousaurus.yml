genus: Suzhousaurus
parent: Therizinosauroidea
pronunciation:
  phonetic: soo-JOH-SAWR-us
etymology: Named after Suzhou (a region in Gansu Province, China) where the
  fossils were found, combined with Greek sauros, "lizard" — means "Suzhou
  lizard"
description: Suzhousaurus is an extinct genus of large therizinosaurs
  from the Early Cretaceous of China. The genus is known from two specimens
  discovered in the Xiagou and Zhonggou Formations, both part of the Xinminpu
  Group. These findings were made during fieldwork in 1999 and 2004.
dispute:
  summary: >
    Suzhousaurus is a large therizinosaur whose position relative to
    Therizinosauridae differs between analyses. Zanno (2010) and Liao and
    colleagues (2026) recover it as the sister of Therizinosauridae, just
    outside the family. Kobayashi and colleagues (2022, 2025) recover it in
    an unresolved polytomy with Therizinosaurus and other derived
    therizinosaurs, inside the family under either definition, as do Pu and
    colleagues (2013) and Sues and Averianov (2016). It is placed in
    Therizinosauroidea.
  history:
    - date: "2026-07-01"
      note: >
        Placed at Therizinosauroidea (outside Therizinosauridae) following Zanno
        (2010) and Jones (2026), who treat it as the most derived
        therizinosauroid; Kobayashi and colleagues (2022, 2025) include it in a more
        broadly defined Therizinosauridae.
    - date: "2026-10-19"
      note: >
        Summary revised: the assignment differs by topology, since
        Kobayashi and colleagues (2022, 2025) recover it within the
        derived clade under either definition; placement unchanged.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
diagnostic_features:
  - Shallow, poorly demarcated glenoid fossa with prominent rounded and striated
    tumescence on dorsomedial surface of scapular portion
  - Pubis with strongly concave cranial margin
  - Large therizinosauroid (humeral proximodistal length 550 mm)
appearance:
  features:
    - enlarged manual claws
  integument: feathered
  evidence: direct
