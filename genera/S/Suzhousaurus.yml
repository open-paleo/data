    notes: Source of the hip height estimate, and the appearance features.
  - id: zanno2010a
    notes: Re-evaluated Therizinosauria, recovering Suzhousaurus just outside Therizinosauridae.
  - id: kobayashi2022a
    notes: Recovered Suzhousaurus in a polytomy with Therizinosaurus and other derived therizinosaurs.
  - id: you2018a
    notes: Places the holotype in the gray-variegated beds of the Yujingzi Basin
      and correlates those beds with the upper Xiagou Formation.
  - id: suarez2018a
    notes: Characterizes the Zhonggou fauna as including this genus, which
      reflects the referred red-beds specimen rather than the holotype.
  - id: kobayashi2025a
  - id: liao2026a
    notes: Recovered Suzhousaurus as the sister of Therizinosauridae.
  - id: pu2013a
    notes: Recovered Suzhousaurus within an unresolved Therizinosauridae.
  - id: sues2016a
    notes: Recovered Suzhousaurus within an unresolved Therizinosauridae.
