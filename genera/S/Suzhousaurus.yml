genus: Suzhousaurus
parent: Therizinosauridae
etymology: Named after Suzhou (a region in Gansu Province, China) where the fossils were found, combined with Greek sauros, "lizard" — means "Suzhou lizard"
description: Suzhousaurus is an extinct genus of large therizinosaurid dinosaurs
  from the Early Cretaceous of China. The genus is known from two specimens
  discovered in the Xiagou and Zhonggou Formations, both part of the Xinminbao
  Group. These findings were made during fieldwork in 1999 and 2004.
diet: herbivore
locomotion: bipedal
