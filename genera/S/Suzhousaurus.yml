genus: Suzhousaurus
parent: Therizinosauroidea
pronunciation:
  phonetic: soo-JOH-SAWR-us
etymology: Named after Suzhou (a region in Gansu Province, China) where the
  fossils were found, combined with Greek sauros, "lizard" - means "Suzhou
  lizard"
description: Suzhousaurus is an extinct genus of large therizinosaurs
  from the Early Cretaceous of China. The genus is known from two specimens
  discovered in the Xiagou and Zhonggou Formations, both part of the Xinminbao
  Group. These findings were made during fieldwork in 1999 and 2004.
dispute:
  summary: >
    Suzhousaurus is a large, latest-diverging intermediate therizinosaur whose
    family-level assignment depends on how Therizinosauridae is defined. Zanno
    (2010) recovers it just outside Therizinosauridae as the most derived
    therizinosauroid, a result followed by the Princeton Encyclopedia (Jones,
    2026); under the broader Therizinosaurus-anchored definition of Kobayashi et
    al. (2022, 2025) it is drawn into Therizinosauridae, within a derived
    subclade alongside Therizinosaurus and Paralitherizinosaurus. It is placed
    conservatively in Therizinosauroidea.
  history:
    - date: "2026-07-01"
      note: >
        Placed at Therizinosauroidea (outside Therizinosauridae) following Zanno
        (2010) and Jones (2026), who treat it as the most derived
        therizinosauroid; Kobayashi et al. (2022, 2025) include it in a more
        broadly defined Therizinosauridae.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
diagnostic_features:
  - Shallow, poorly demarcated glenoid fossa with prominent rounded and striated
    tumescence on dorsomedial surface of scapular portion
  - Pubis with strongly concave cranial margin
  - Large therizinosauroid (humeral proximodistal length 550 mm)
appearance:
  features:
    - enlarged manual claws
  integument: feathered
  evidence: direct
