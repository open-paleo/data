species:
  - name: Suzhousaurus megatherioides
    etymology: "From Greek '-oides' meaning 'resembling', indicating a resemblance
      to the giant ground sloth Megatherium, in reference to the animal's large
      size and robust build."
    status: valid
    type_species: true
    period:
      name:
        - Early Cretaceous
      stage:
        - Aptian
        - Albian
    location:
      country: CN
      locality: Yujingzi Basin
      region: CN-GS
      formation: Xiagou
      part: upper
      notes: The holotype is from the gray-variegated beds and a second
        specimen from the overlying red beds, so sources that list this genus
        among the Zhonggou fauna are describing the referred material. Li and
        colleagues (2007) put the type site in white to grey sandy shale.
    type_specimen:
      specimen_id: [ FRDC-GSJB-99 ]
      specimen_type: holotype
      institution: FRDC
      material: Associated partial postcranial skeleton including 10 partial to nearly
        complete dorsal vertebrae, incomplete dorsal ribs, nearly complete right
        scapulocoracoid, complete right humerus, left and fragmentary right pubes
      completeness: partial
    size:
