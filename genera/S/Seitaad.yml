genus: Seitaad
parent: Sauropodiformes
etymology: "From Navajo 'seit'aad', a sand-swallowing monster from Navajo mythology, referring to the specimen being preserved entombed in the Navajo Sandstone."
pronunciation:
  phonetic: SAY-eet-AWD
description: Seitaad is a genus of sauropodomorph dinosaur which lived during
  the Early Jurassic period in what is now southern Utah, United States.
dispute:
  summary: >
    Seitaad ruessi is recovered outside Massospondylidae among basal
    Sauropodiformes by Apaldetti and others (2011) but within
    Massospondylidae by Rauhut and others (2020).
  history:
    - date: "2026-06-29"
      note: Placed at Sauropodiformes incertae sedis; the Massospondylidae alternative is recorded.
locomotion: facultative
paleoenvironment:
  - arid
diet: herbivore
diagnostic_features:
  - Plate-like medial process of the scapula contributing posteriorly to glenoid
    surface
  - Prominent deltopectoral crest offset proximally from head of humerus by
    distinct proximally directed hook
  - Proximally convex and laterally expanded proximal surface of metacarpal I
  - Mid-dorsal neural arches subequal to or taller than respective centra
  - Pubis with transversely narrow and elongate apron and relatively small
    obturator foramen
  - Enlarged pedal ungual present on digit II
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "165044"
  - source: wikidata
    id: Q2451962
  - source: eol
    id: "47459231"
species:
  - name: Seitaad ruessi
    etymology: "Named for Everett Ruess, a young artist, poet, and naturalist who mysteriously disappeared in 1934 while exploring southern Utah near where the holotype was found."
    status: valid
    type_species: true
    period:
      name:
