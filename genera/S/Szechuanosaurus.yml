genus: Szechuanosaurus
parent: Theropoda
etymology: Szechuan lizard
description: Szechuanosaurus is an extinct genus of carnivorous theropod
  dinosaur from China. Its type species is based on several undiagnostic teeth
  from the Kuangyuan Series. Potential specimens referred to the genus span from
  the Early Triassic through the Late Triassic. Additional possible specimens
  were also reported from the Kalaza Formation.
