references:
  - id: young1942a
  - id: carrano2012a
    notes: Tetanurae phylogeny supporting reassignment of Szechuanosaurus material
      to Yangchuanosaurus.
  - id: dong1983a
    notes: Restates the type specimens' position as the Chungking Group and
      uses the modern spelling Guangyuan for the city and unit.
  - id: molnar1974a
    notes: Independently gives the type locality's unit as the Kuangyuan Series,
      at series rank.
  - id: young1943a
    notes: Places the Kuangyuan Series concordantly above the Tsienfuyen Series, below a conglomerate tentatively dated Cretaceous, and dates the two series Upper Jurassic.
species:
  - name: Szechuanosaurus campi
    etymology: Honors paleontologist Charles Lewis Camp, who first described a
      carnivorous dinosaur from the Red Basin of Szechuan
    status: nomen dubium
    type_species: true
    period:
      name:
        - Late Jurassic
    location:
      country: CN
      region: CN-SC
      locality: Locality 47 (Chentsianyen escarpment), south of Kuangyuan city
      notes: >
        Young (1942) gives Locality 47 as "belonging to the top part of the
        Kuangyuan Series and immediately below the Chentsianyen conglomerate";
        Young and Molnar (1974) both write Series, never Formation. Young and
        colleagues (1943) place the Kuangyuan Series concordantly above the
        Tsienfuyen Series and date the two together to "Upper Jurassic time
        (Purbeckian)", with the overlying conglomerate "tentatively regarded
        as of Cretaceous in age by its stratigraphic position". Dong and
        colleagues (1983) write that the region's red clastics "were formerly
        referred to as the Guangyuan Group", and their header gives these
        teeth the Chungking (Guangyuan) Group. The type teeth are not the
        referred skeleton from the upper Shaximiao Formation at Zigong.
    type_specimen:
      specimen_id:
        - IVPP V235
        - IVPP V236
        - IVPP V238
        - IVPP V239
      specimen_type: syntype
      institution: IVPP
      material: "Six isolated teeth: two broken, three fragmentary, and one nearly
        complete; crowns compressed and moderately curved, with anterior and
        posterior denticulations."
    erected_in: young1942a
