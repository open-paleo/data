genus: Szechuanosaurus
parent: Tetanurae
placement: incertae sedis
dispute:
  summary: >
    Szechuanosaurus campi is a nomen dubium based on undiagnostic teeth;
    referred skeletal material formerly placed in the genus has been reassigned
    to Yangchuanosaurus (Carrano, Benson and Sampson, 2012). It is placed
    conservatively at Tetanurae incertae sedis.
  history:
    - date: 2026-06-30
      note: Reparented to Tetanurae.
    - date: 2026-07-02
      note: Confirmed placement at Tetanurae incertae sedis; remains a nomen dubium.
pronunciation:
  phonetic: SUH-CHWAHN-o-SAWR-us
etymology: Named after the Szechuan (Sichuan) Province of China where fossils
  were found, combined with Greek sauros, "lizard" — means "Szechuan lizard"
description: Szechuanosaurus is an extinct genus of carnivorous theropod
  dinosaur from China. Its type species is based on several undiagnostic teeth
  from the top of the beds Young (1942) called the Kuangyuan Series, at
  Locality 47 south of Guangyuan, Sichuan. Potential specimens referred to the
  genus span from
  the Late Jurassic through the Early Cretaceous. Additional possible specimens
  were also reported from the Kalaza Formation.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "38586"
  - source: wikidata
    id: Q637535
  - source: gbif
    id: "4822585"
