genus: Szechuanosaurus
parent: Tetanurae
dispute:
  summary: >
    Szechuanosaurus campi is a nomen dubium based on undiagnostic teeth; referred
    skeletal material formerly placed in the genus has been reassigned to
    Yangchuanosaurus (Carrano, Benson and Sampson, 2012). It is placed conservatively
    at Tetanurae incertae sedis.
  history:
    - date: "2026-06-30"
      note: Reparented to Tetanurae.
    - date: "2026-07-02"
      note: Confirmed placement at Tetanurae incertae sedis; remains a nomen dubium.
pronunciation:
  phonetic: SUH-CHWAHN-o-SAWR-us
etymology: Named after the Szechuan (Sichuan) Province of China where fossils were found, combined with Greek sauros, "lizard" - means "Szechuan lizard"
description: Szechuanosaurus is an extinct genus of carnivorous theropod
  dinosaur from China. Its type species is based on several undiagnostic teeth
  from the Kuangyuan Series. Potential specimens referred to the genus span from
  the Early Triassic through the Late Triassic. Additional possible specimens
  were also reported from the Kalaza Formation.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Teeth of Allosaurus-type, distinctly compressed with anterior and posterior
    denticulations
  - Teeth are pointed and moderately curved
  - Anterior denticulations fine and disappear above base; posterior
    denticulations coarse, extending to tooth base
  - General shape and characteristics fit well with Junghsien tooth, smaller and
    more curved
appearance:
  integument: scaled
  evidence: inferred
