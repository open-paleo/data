genus: Spinops
parent: Centrosaurini
etymology: From Latin 'spina' (spine, thorn) + Greek 'ops' (face, appearance), meaning 'spine face' or 'thorn face', referring to the prominent spines and horns on the frill of this ceratopsian.
description: Spinops is an extinct genus of centrosaurine ceratopsian dinosaur
  from the Late Cretaceous of Alberta, southern Canada. It was a medium-sized
  ceratopsian, reaching 4.5 meters (15 ft) in length and 1.3 metric tons (1.4
  short tons) in body mass.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Procurving hook (P1 epiparietal) on caudal margin of parietal with straight,
    caudally-projecting spike immediately lateral
  - Short postorbital horncores that project dorsally
  - Nasal horn core longer than postorbital horncores
  - P1 hooks and their proximity to caudally-projecting spike unique among
    ceratopsids except Centrosaurus
  - Caudally-projecting spike distinguishes from Centrosaurus spp.
