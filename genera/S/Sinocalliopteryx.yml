genus: Sinocalliopteryx
parent: Compsognathidae
etymology: From Latin 'Sinae' (China) + Greek 'kalos' (beautiful) + Greek
  'pteryx' (feather, wing), meaning 'Chinese beautiful feather'.
description: Sinocalliopteryx is a genus of carnivorous coelurosaurian theropod
  dinosaurs from the Lower Cretaceous Yixian Formation of China (Jianshangou
  Beds, dating to 124.6 Ma). While similar to the related Huaxiagnathus,
  Sinocalliopteryx were larger. In 2007, the type specimen was the largest known
  compsognathid exemplar, at 2.37 meters (7.8 ft) in length. In 2012, an even
  larger specimen was reported.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
  - forested
diagnostic_features:
  - Very large compsognathid (2.37 m long) with 49 caudal vertebrae
  - Manus as long as humerus plus radius, with very large and subequally long
    manual unguals I and II
  - Smaller proximal transverse width of the first metacarpal and reduced
    olecranon process on the ulna
  - Long maxillary process of premaxilla not extending to the vertical level of
    the maxillary antorbital fossa
  - Proportionally longer ulna than Huaxiagnathus (humerus:ulna ratio 114% vs.
    160%); preacetabular wing of ilium bending downward at anteroventral margin;
    distally unfused ischia
appearance:
  features:
    - snout hornlets
    - tail bristles
  integument: feathered
  evidence: direct
