genus: Sarahsaurus
parent: Massospondylidae
etymology: "Named in honor of Sarah (Mrs. Ernest) Butler, an Austin philanthropist who helped fund the 'Dino Pit' exhibit at the Austin Nature and Science Center, combined with Greek 'sauros' meaning 'lizard'."
description: Sarahsaurus is a genus of basal sauropodomorph dinosaur which lived
  during the Early Jurassic period in what is now northeastern Arizona, United
  States.
