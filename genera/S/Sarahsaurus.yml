genus: Sarahsaurus
parent: Massopoda
etymology: "Named in honor of Sarah (Mrs. Ernest) Butler, an Austin philanthropist who helped fund the 'Dino Pit' exhibit at the Austin Nature and Science Center, combined with Greek 'sauros' meaning 'lizard'."
pronunciation:
  phonetic: SAH-ruh-SOR-us
description: Sarahsaurus is a genus of basal sauropodomorph dinosaur which lived
  during the Early Jurassic period in what is now northeastern Arizona, United
  States.
dispute:
  summary: >
    Sarahsaurus aurifontanalis is recovered just outside Massospondylidae
    as a basal massopodan by Apaldetti and others (2011) but within
    Massospondylidae by Chapelle and others (2019); Jones (2026) leaves it
    unresolved between the two.
  history:
    - date: "2026-06-29"
      note: Placed at Massopoda incertae sedis; Massospondylidae membership (Chapelle and others, 2019) is recorded but not adopted.
locomotion: bipedal
paleoenvironment:
  - fluvial
  - arid
diet: herbivore
diagnostic_features:
  - Low wall between basicranial tubera with central anterior fossa
  - Spine tables on dorsal vertebrae
  - Manual phalangeal formula of 2-3-4-2-2
  - Presence of pubic foramen
appearance:
  features:
    - downturned snout
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "171910"
  - source: wikidata
    id: Q135107
  - source: gbif
    id: "8632677"
  - source: eol
    id: "47459254"
species:
  - name: Sarahsaurus aurifontanalis
    etymology: "From Latin 'aurum' meaning 'gold' and 'fontanalis' meaning 'of the spring', referring to Gold Spring, Arizona, where the holotype was discovered."
    status: valid
    type_species: true
    period:
      name:
        - Early Jurassic
      stage:
        - Sinemurian
        - Pliensbachian
      from_ma: 199.3
      to_ma: 184.2
    location:
      country: US
      locality: Dilophosaurus Quarry
      region: Arizona
      formation: Kayenta
      coordinates:
        - 35.689445
        - -111.289444
    size:
      length_m:
        min: 4.0
        max: 4.0
      weight_kg:
        min: 200
        max: 200
    erected_in: rowe2010a
    holotype:
      specimen_id: [TMM 43646-2]
      specimen_type: holotype
      institution: TMM
      material: Partial skull (premaxilla, frontal, quadrate, braincase) and nearly
        complete postcranial skeleton.
      completeness: complete
notable_specimens:
  - specimen_id: [MCZ 8893]
    institution: MCZ
    species: Sarahsaurus aurifontanalis
    category: complementary
    significance: "Referred nearly complete skull, originally identified as Massospondylus sp., that supplies cranial anatomy missing from the holotype, whose skull is fragmentary and disarticulated. Its open braincase sutures mark a less mature individual than the mature holotype."
    references: [rowe2010a, attridge1985a]
references:
