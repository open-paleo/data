genus: Suchosaurus
parent: Baryonychinae
etymology: From Greek 'souchos' (crocodile, after the Egyptian crocodile-god
  Sobek) and 'sauros' (lizard); meaning 'crocodile lizard'.
description: Suchosaurus is a dubious genus of large theropod dinosaur that
  lived during the Early Cretaceous in what is now Europe. The type species, S.
  cultridens, was first mentioned by Richard Owen at the British Association
  meeting in 1841 and formally described in his 1842 Report on British Fossil
  Reptiles, based on a chimeric assemblage of fossil teeth and vertebrae
  discovered in the Tilgate Forest of Sussex, England, in sediments of the
  Wealden Supergroup.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Crown laterally compressed and subincurved, with two opposite trenchant
    edges on concave and convex outlines (unlike gavials where compression is
    antero-posterior)
  - Crown sides traversed by a few longitudinal parallel ridges with regular
    intervals of ~1 line breadth, subsiding before reaching apex and sooner on
    convex side
  - Edges of crown not serrated (distinguishing it from Megalosaurus and
    Argenton Crocodile)
  - Referred vertebrae have biconcave articular ends, compressed wedge-shaped
    body with sides gently convex, and finely striated silky external surface at
    mid-body
