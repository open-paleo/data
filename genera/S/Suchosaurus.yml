genus: Suchosaurus
parent: Baryonychinae
dispute:
  summary: >
    Suchosaurus cultridens and S. girardi are based on isolated teeth reidentified
    as spinosaurid; Carrano and colleagues (2012) refer the material to Baryonychinae but
    regard it as a nomen dubium, and Mateus and colleagues (2011) likewise treat both
    species as nomina dubia, with Suchosaurus a possible senior synonym of
    Baryonyx.
  history:
    - date: "2026-07-01"
      note: Placed at Baryonychinae following Carrano and colleagues (2012); retained as a nomen-dubium-grade, teeth-based taxon.
pronunciation:
  phonetic: SOO-ko-SAWR-us
etymology: From Greek 'souchos' (crocodile, after the Egyptian crocodile-god
  Sobek) and 'sauros' (lizard); meaning 'crocodile lizard'.
description: Suchosaurus is a dubious genus of large theropod dinosaur that
  lived during the Early Cretaceous in what is now Europe. The type species, S.
  cultridens, was first mentioned by Richard Owen at the British Association
  meeting in 1841 and formally described in Owen's 1842 Report on British Fossil
  Reptiles, based on a chimeric assemblage of fossil teeth and vertebrae
  discovered in the Tilgate Forest of Sussex, England, in sediments of the
  Wealden Supergroup.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "36610"
  - source: wikidata
    id: Q3472673
  - source: gbif
    id: "4822234"
species:
  - name: Suchosaurus cultridens
    etymology: From Latin 'culter' (knife) and 'dens' (tooth); meaning
      'knife-toothed'.
    status: nomen dubium
    type_species: true
    period:
      name:
        - Early Cretaceous
      stage:
        - Valanginian
    location:
      country: GB
      locality: Tilgate Forest, near Cuckfield
      region: GB-WSX
      formation: Grinstead Clay
    type_specimen:
      specimen_id:
        - NHMUK PV R 36536
      specimen_type: holotype
      institution: NHMUK
      material: A single tooth; laterally compressed crown with two trenchant edges and
        longitudinal parallel ridges.
      completeness: fragmentary
    synonyms:
      - name: Crocodilus cultridens
        type: reassigned
        reason: Prior combination of the species cultridens under Crocodilus;
          Owen (1842) erected Suchosaurus as a distinct sub-genus to hold it.
    erected_in: owen1842a
references:
  - id: owen1842a
    notes: Original sub-genus erection by Owen, interpreting the material as
      crocodilian; spinosaurid affinity was not recognized until Milner (2003).
  - id: mateus2011b
    notes: Declares Suchosaurus cultridens a nomen dubium — NHMUK PV R 36536 lacks
      autapomorphies distinguishing it from other baryonychines and rejects
      Milner's (2003) Baryonyx senior-synonymy proposal.
  - id: carrano2012a
    notes: Referred Suchosaurus material to Baryonychinae but regarded it as a nomen dubium.
  - id: barker2021a
    notes: Assigns the holotype tooth to the Grinstead Clay Formation.
  - id: milner2003a
  - id: barker2023a
    notes: Records that the Grinstead Clay, source of the type specimen, is
      ranked as a formation in some schemes and as a member of the Tunbridge
      Wells Sand in others.
