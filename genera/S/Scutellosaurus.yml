genus: Scutellosaurus
parent: Thyreophora
pronunciation:
  ipa: /skuːˌtɛloʊˈsɔːrəs/
  phonetic: skoo-TEL-oh-SOR-uhs
etymology: "From Latin 'scutellum' (diminutive of 'scutum', shield; small
  shield) + Greek 'sauros' (lizard), meaning 'little shield lizard', referring
  to the small scutes covering its body."
description: Scutellosaurus is a genus of basal thyreophoran dinosaur that lived
  approximately 196 million years ago during the early part of the Jurassic
  Period in what is now Arizona, USA. It is classified in Thyreophora, the
  armored dinosaurs; its closest relatives may have been Emausaurus and
  Scelidosaurus, another armored dinosaur which was mainly a quadrupedal
  dinosaur, unlike bipedal Scutellosaurus. It is one of the earliest
  representatives of the armored dinosaurs and the basalmost form discovered to
  date. Scutellosaurus was a small, lightly-built, ground-dwelling herbivore,
  that could grow up to an estimated 1.3 meters (4.3 ft) long.
diet: herbivore
locomotion: bipedal
