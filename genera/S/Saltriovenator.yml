genus: Saltriovenator
parent: Ceratosauria
etymology: "Named for Saltrio, the town in northern Italy where the fossils were found in a marble quarry, combined with Latin 'venator' meaning 'hunter'; meaning 'Saltrio hunter.'"
description: Saltriovenator is a genus of ceratosaurian dinosaur that lived
  during the Sinemurian stage of the Early Jurassic in what is now Italy. The
  type and only species is Saltriovenator zanellai; in the past, the species had
  been known under the informal name "saltriosaur". Although a full skeleton has
  not yet been discovered, Saltriovenator is thought to have been a large,
  bipedal carnivore similar to Ceratosaurus.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - marine
diagnostic_features:
  - Humerus with deltopectoral crest protruding craniomedially for more than
    twice the shaft diameter, with distal lamina forming an abrupt 90-degree
    corner with humeral shaft
  - Metacarpal II with hypertrophied semicircular extensor lip protruding over
    condylar level and bordering very deep and wide extensor pit
  - Phalanx II-1 with deep and narrow flexor palmar groove bearing distinct bump
    distal to dorsal extensor process
  - Manual ungual III with prominent flexor tubercle distinctly separated from
    articular facet by concave cleft
  - Mosaic of ceratosaurian and tetanuran features including fully functional
    hand with four digits
  - Mid-to-large ceratosaurian from early Sinemurian (lowermost Jurassic)
