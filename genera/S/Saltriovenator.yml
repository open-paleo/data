genus: Saltriovenator
parent: Ceratosauria
etymology: Saltrio hunter
description: Saltriovenator is a genus of ceratosaurian dinosaur that lived
  during the Sinemurian stage of the Early Jurassic in what is now Italy. The
  type and only species is Saltriovenator zanellai; in the past, the species had
  been known under the informal name "saltriosaur". Although a full skeleton has
  not yet been discovered, Saltriovenator is thought to have been a large,
  bipedal carnivore similar to Ceratosaurus.
diet: carnivore
locomotion: bipedal
