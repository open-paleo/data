genus: Smitanosaurus
parent: Dicraeosauridae
etymology: "Meaning 'smith lizard' (from Old Saxon 'smitan'), referring to J. August Smith, who excavated and sketched the holotype USNM 5384, and to the Smithsonian Institution where the remains are stored."
description: Smitanosaurus is a genus of dicraeosaurid sauropod dinosaur from
  the Late Jurassic of Colorado. The genus contains one species, S. agilis,
  originally assigned to the defunct genus Morosaurus.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - atlas lacking the 'lip' on the anteroventral margin (interpreted as a
    reversal)
  - axial neural spine both tall and subvertically oriented
  - axis with postzygapophyseal articular surfaces facing ventrally rather than
    posteroventrally
  - small but conspicuous posteriorly projecting spur on the squamosal
  - supratemporal fenestrae narrower than the maximum height of foramen magnum
  - sharp-lipped pneumatic fossa on the lateral surface of the axial intercentrum
