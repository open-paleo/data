genus: Scipionyx
parent: Compsognathidae
dispute:
  summary: >
    Scipionyx is known only from a hatchling, complicating its classification. Dal
    Sasso and Maganuco (2011) recovered it as a basal compsognathid, and Jones et
    al. (2026) follow this. Cau (2024), however, recovered it as an immature
    spinosaurid within Megalosauroidea, arguing its compsognathid-grade appearance
    reflects juvenile morphology rather than affinity. It is retained in
    Compsognathidae pending study of adult material.
  history:
    - date: "2026-07-01"
      note: Retained at Compsognathidae; the immature-spinosaurid reinterpretation (Cau, 2024) is reflected but not adopted.
pronunciation:
  ipa: /ˈʃɪˌpiːoʊnɪks, ˌʃɪpiːˈoʊ-/
  phonetic: SHIH-pee-oh-nicks
etymology: "From the Roman name Scipio (after the Roman general Scipio
  Africanus, as the fossil was found in Italy) + Greek 'onyx' (claw), meaning
  'Scipio's claw'."
description: Scipionyx was a genus of theropod dinosaur from the Early
  Cretaceous Pietraroja Formation of Italy, around 113 million years ago.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - marine
diagnostic_features:
  - Five premaxillary teeth
  - Sinusoidal ridge of the supratemporal fossa at the frontoparietal contact
  - Descending process of the squamosal distally squared
  - Carpus of only two stacked, well-ossified bones (radiale and distal carpal
    1+2), the distal carpal lenticular, proximodistally compressed,
    non-semilunate, and fused without trace of a suture
  - Manual digit III markedly longer (123%) than digit I
  - Preacetabular blade of the ilium with its cranial concavity facing cranially
    and only slightly developed
  - Prominent ischial obturator process squared distally
appearance:
  integument: unknown
