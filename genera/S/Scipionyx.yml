      specimen_type: holotype
      institution: SBA-SA
      material: Nearly complete, articulated skeleton with exceptional
        soft-tissue preservation, including the intestine, muscle fibers,
        trachea, liver remains, and mesenteric blood vessels.
      completeness: complete
      notes: The only known specimen (nicknamed "Ciro"); dal Sasso and Maganuco
