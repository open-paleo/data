genus: Scipionyx
parent: Compsognathidae
pronunciation:
  ipa: /ˈʃɪˌpiːoʊnɪks, ˌʃɪpiːˈoʊ-/
  phonetic: SHIH-pee-oh-nicks
etymology: "From the Roman name Scipio (after the Roman general Scipio
  Africanus, as the fossil was found in Italy) + Greek 'onyx' (claw), meaning
  'Scipio's claw'."
description: Scipionyx was a genus of theropod dinosaur from the Early
  Cretaceous Pietraroja Formation of Italy, around 113 million years ago.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - marine
diagnostic_features:
  - Accessory transverse postorbital ridge at fronto-parietal contact, unique
    among Maniraptoriformes
  - Compressed radiale and semilunate carpal
  - Retention of large prefrontal and pronounced scapular acromion (primitive)
  - Rounded coracoid caudal end (primitive)
  - "Juvenile specimen: skull/presacral ratio 0.48, higher than known adults"
  - Soft tissue preservation including muscles, intestine, and possible liver
    remains
