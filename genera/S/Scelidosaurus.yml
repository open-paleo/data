genus: Scelidosaurus
parent: Thyreophora
pronunciation:
  phonetic: SKEL-i-do-SAWR-us
  ipa: /ˌsɛlɪdoʊˈsɔːrəs/
etymology: "From Greek 'skelis'/'skelidos' (rib of beef, hind leg) + 'sauros'
  (lizard), intended to mean 'limb lizard'; the name references the animal's
  robust limbs."
description: Scelidosaurus is a genus of herbivorous armored ornithischian
  dinosaur from the Jurassic of England.
dispute:
  summary: >
    Scelidosaurus is a well-known basal thyreophoran. Most analyses
    recover it as the sister taxon of Eurypoda (Stegosauria plus
    Ankylosauria), basal to both (Sereno, 1986; Maidment and others, 2008;
    Jones, 2026). Norman (2020) instead placed it on the line leading to
    Ankylosauria, after the divergence of Stegosauria.
  history:
    - date: "2026-06-29"
      note: Placed at Thyreophora (basal grade) following the prevailing sister-to-Eurypoda topology (P3); the sister-to-Ankylosauria placement of Norman (2020) is recorded.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - coastal
  - marine
appearance:
  features:
    - osteoderms
    - snout hornlets
  integument: armored
diagnostic_features:
  - Large and hollow limb-bones
  - Femur with third inner trochanter
  - Metacarpal and phalangial bones adapted for movement on land
