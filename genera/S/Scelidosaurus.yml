genus: Scelidosaurus
parent: Thyreophora
pronunciation:
  phonetic: SKEL-i-do-SAWR-us
  ipa: /ˌsɛlɪdoʊˈsɔːrəs/
etymology: "From Greek 'skelis'/'skelidos' (rib of beef, hind leg) + 'sauros'
  (lizard), intended to mean 'limb lizard'; the name references the animal's
  robust limbs."
description: Scelidosaurus is a genus of herbivorous armored ornithischian
  dinosaur from the Jurassic of England.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - coastal
  - marine
appearance:
  features:
    - osteoderms
    - snout hornlets
  integument: armored
diagnostic_features:
  - Large and hollow limb-bones
  - Femur with third inner trochanter
  - Metacarpal and phalangial bones adapted for movement on land
