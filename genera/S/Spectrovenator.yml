genus: Spectrovenator
parent: Abelisauridae
etymology: From Latin spectrum, "ghost" or "apparition", combined with Latin venator, "hunter" — means "ghost hunter"
description: Spectrovenator is a genus of basal abelisaurid theropod dinosaur
  that lived during the early Cretaceous period in what is now Brazil. The type
  and only known species is S. ragei, representing a small abelisaurid about
  1.42–2.2 metres (4.7–7.2 ft) long.
diet: carnivore
locomotion: bipedal
