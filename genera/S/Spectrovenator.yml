genus: Spectrovenator
parent: Abelisauridae
etymology: From Latin spectrum, "ghost" or "apparition", combined with Latin venator, "hunter" - means "ghost hunter"
pronunciation:
  phonetic: SPEC-tro-VEN-uh-tuh
description: Spectrovenator is a genus of basal abelisaurid theropod dinosaur
  that lived during the early Cretaceous period in what is now Brazil. The type
  and only known species is S. ragei, representing a small abelisaurid about
  1.42-2.2 meters (4.7-7.2 ft) long.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
diagnostic_features:
  - Posterior ramus of maxilla ornamented with vertically oriented grooves
    except for smooth region anterior to maxilla-jugal suture
  - Lacrimal lateral surface rugose except for smooth ventral region
  - Ventrally bowed posterior process of jugal
  - Nuchal crest with thin and smooth dorsal margin
  - Straight ventral margin of dentaries with deep sulcus on lateral surface
  - Dorsal margin of surangular slightly convex
  - Longitudinal ridge along posteroventral end of mandibular ramus
appearance:
  integument: scaled
  evidence: inferred
