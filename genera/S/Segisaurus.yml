genus: Segisaurus
parent: Coelophysinae
etymology: Named after Tsegi Canyon, Arizona, where the only known specimen was discovered, combined with Greek sauros, "lizard" — means "Tsegi Canyon lizard"
description: Segisaurus is a genus of small coelophysid theropod dinosaur, that
  measured approximately 1 metre (3.3 feet) in length. The only known specimen
  was discovered in early Jurassic strata in Tsegi Canyon, Arizona, for which it
  was named. Segisaurus is the only dinosaur to have ever been excavated from
  the area.
diet: carnivore
