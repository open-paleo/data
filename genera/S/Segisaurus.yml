genus: Segisaurus
parent: Coelophysinae
pronunciation:
  phonetic: SAYG-ee-SAWR-us
etymology: Named after Tsegi Canyon, Arizona, where the only known specimen was
  discovered, combined with Greek sauros, "lizard" - means "Tsegi Canyon lizard"
description: Segisaurus is a genus of small coelophysid theropod dinosaur, that
  measured approximately 1 meter (3.3 feet) in length. The only known specimen
  was discovered in early Jurassic strata in Tsegi Canyon, Arizona, for which it
  was named. Segisaurus is the only dinosaur to have ever been excavated from
  the area.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - arid
diagnostic_features:
  - Well-developed clavicle retained (persistent clavicle unique among known
    coelurosaurs at time of description)
  - Incompletely enclosed pubic fenestra (obturator notch rather than fully
    enclosed foramen)
  - Completely enclosed ischial fenestra (not seen in other dinosaurs)
  - Solid vertebral centra and solid limb bones (fibula with only slight marrow
    cavity; tibia and centra fully solid)
  - Midcaudal vertebrae bearing a supplementary anterior neural spine in
    addition to the principal spine
  - Hind foot with vestigial first and fifth digits; forefoot third digit
    slender and compressed, lying closely parallel to and nearly equal in length
    to second digit
