genus: Schleitheimia
parent: Sauropodiformes
placement: incertae sedis
pronunciation:
  phonetic: shlyt-HY-mee-uh
etymology: Named after Schleitheim, the Swiss locality (in the canton of Schaffhausen) where the type material was found, with the Latinised suffix '-ia'.
description: Schleitheimia is an extinct genus of sauropodiform sauropodomorph
  dinosaur, from the Gruhalde Member of Klettgau Formation of Switzerland. The
  type species, Schleitheimia schutzi was formally described in 2020.
dispute:
  summary: >
    Schleitheimia schutzi is recovered as the immediate sister taxon of
    Sauropoda (or in a polytomy of direct outgroups to Sauropoda) by
    Rauhut and others (2020).
  history:
    - date: "2026-06-29"
      note: Placed at Sauropodiformes incertae sedis; recovered as sister to
        Sauropoda.
locomotion: facultative
paleoenvironment:
  - fluvial
diet: herbivore
diagnostic_features:
  - Medial brevis shelf of ilium developed as dorsoventrally broad, rounded
    ridge just below mid-height of iliac blade on medial side, ending in large
    round expansion at posterior end
  - Fourth trochanter of femur very robust, arising gradually from posterior
    surface at about mid-width towards apex at posteromedial margin
  - Crista tibiofibularis of femur exceptionally broad and only very slightly
    offset medially from lateral margin of shaft, with no posteriorly facing
    shelf present lateral to crista
appearance:
  integument: scaled
  evidence: inferred
