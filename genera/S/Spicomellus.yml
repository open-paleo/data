genus: Spicomellus
parent: Ankylosauria
placement: incertae sedis
etymology: "From Latin 'spica' meaning 'spike' and Latin 'mellum' meaning
  'collar', referring to the spiked osteoderms fused to the rib of the holotype
  specimen"
description: Spicomellus is an extinct genus of unusual early ankylosaurian
  dinosaur from the El Mers III Formation (Bathonian age) of Morocco. The genus
  contains a single species, Spicomellus afer, representing the oldest named
  definitive ankylosaur. The species was initially described in 2021 based on a
  single rib with fused osteoderms, rendering its life appearance and
  relationships uncertain. In 2025, several additional bones, including
  osteoderms and cranial and postcranial remains, were described, revealing that
  it bears a unique array of spines over the body, including extremely elongated
  spikes around the neck and pelvis. It likely had a tail weapon, making it the
  oldest known ankylosaur with this structure.
dispute:
  summary: >
    Spicomellus is the earliest known definitive ankylosaur, but its position is unresolved; Maidment et al. (2025) recover it as an early-diverging ankylosaurid while reference works leave it unplaced to family. It is retained at Ankylosauria incertae sedis.
  history:
    - date: "2026-06-26"
      note: Placed at Ankylosauria incertae sedis, family placement of this earliest ankylosaur not firmly resolved.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
appearance:
  features:
    - dorsal spines
    - body armor
  integument: armored
diagnostic_features:
  - T-shaped dorsal ribs in cross-section with fused rod-like osteoderm on
    dorsal surface
  - Series of co-ossified conical dermal spines projecting from osteoderm
  - Plywood-like arrangement of structural fiber bundles in osteoderm
    (orthogonal pattern, ~90° crossing)
  - Spines rounded in cross-section, projecting dorsally from rod
