genus: Shuvuuia
parent: Parvicursorinae
description: Shuvuuia is a genus of bird-like theropod dinosaur from the late
  Cretaceous period of Mongolia. It is a member of the family Alvarezsauridae,
  small coelurosaurian dinosaurs which are characterized by short but powerful
  forelimbs specialized for digging. The type (and only known) species is
  Shuvuuia deserti, or "desert bird". The name Shuvuuia is derived from the
  Mongolian word shuvuu (шувуу) meaning "bird".
diet: carnivore
