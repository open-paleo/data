genus: Spondylosoma
parent: Aphanosauria
dispute:
  summary: >
    Spondylosoma absconditum was historically considered a basal dinosaur or
    herrerasaurid relative but is referred to the non-dinosaurian archosaur
    clade Aphanosauria (Nesbitt and others, 2017).
  history:
    - date: "2026-06-30"
      note: >
        Placed at Aphanosauria; non-dinosaurian (P1).
pronunciation:
  phonetic: SPON-dil-o-SOHM-a
etymology: From Greek spondylos, "vertebra", combined with Greek soma, "body" -
  means "vertebra body"
