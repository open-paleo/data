genus: Sinankylosaurus
parent: Dinosauria
placement: incertae sedis
pronunciation:
  phonetic: sin-AN-ky-lo-SAWR-us
etymology: "From Latin/Greek 'Sina' meaning 'China' or 'Chinese', Greek
  'ankylos' meaning 'fused' or 'bent', and 'sauros' meaning 'lizard'; meaning
  'Chinese fused lizard.'"
description: Sinankylosaurus is a dubious dinosaur genus known from the Late
  Cretaceous Hongtuya Formation of China. The genus contains a single species,
  Sinankylosaurus zhuchengensis, known from a partial right ilium (a pelvic
  bone). This specimen was originally described as belonging to an ankylosaur,
  although later research has disputed this identification, noting the lack of
  anatomical characters uniting Sinankylosaurus with this group.
dispute:
  summary: >
    Sinankylosaurus zhuchengensis was named as an ankylosaur on a partial
    ilium (Wang and colleagues, 2020). Zheng and colleagues (2021) find no
    ankylosaur features in it, as the supposed acetabulum lacks a cuplike
    structure and peduncles and there is no preacetabular ridge, and consider
    it a nomen dubium and not an ankylosaur, without proposing another
    identity. It is placed at Dinosauria incertae sedis.
  history:
    - date: "2026-06-26"
      note: Placed at Ankylosauria incertae sedis, nomen dubium of uncertain diagnosability.
    - date: "2026-10-09"
      note: Type species set to nomen dubium and diagnostic features removed, following Zheng and colleagues (2021), and reparented from Ankylosauria to Dinosauria incertae sedis, the nearest parent both readings accept. The citation for that study now points to the right paper.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
appearance:
  integument: armored
  evidence: inferred
