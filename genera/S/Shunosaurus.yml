genus: Shunosaurus
parent: Eusauropoda
pronunciation:
  phonetic: SHOO-no-SAWR-us
etymology: From 'Shu', an ancient name for Sichuan Province, China, combined
  with Greek 'sauros' (lizard), meaning 'lizard from Sichuan'.
description: Shunosaurus is a genus of sauropod dinosaur from Late Jurassic
  (Oxfordian) beds in Sichuan Province in China, from 161 to 157 Million years
  ago. The name derives from "Shu", an ancient name for the Sichuan province.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Moderate-sized primitive sauropod with body length ~11 m
  - Skull moderately high with spoon-shaped teeth
  - Cervical vertebrae solid with long pleurocoel lacking laminae
  - Cervical centra maintain ventral keel and ventrolateral ridge
  - Incipient bifurcation of posterior cervical neural spines
  - Dorsal vertebrae weakly amphicoelous to nearly opisthocoelous, lacking
    pleurocoels
appearance:
  features:
    - tail club
    - tail spikes
  integument: armored
  evidence: direct
