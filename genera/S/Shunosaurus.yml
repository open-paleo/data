genus: Shunosaurus
parent: Eusauropoda
pronunciation:
  phonetic: SHOO-no-SAWR-us
etymology: From 'Shu', an ancient name for Sichuan Province, China, combined
  with Greek 'sauros' (lizard), meaning 'lizard from Sichuan'.
description: Shunosaurus is a genus of sauropod dinosaur from Late Jurassic
  (Oxfordian) beds in Sichuan Province in China, from 161 to 157 Million years
  ago. The name derives from "Shu", an ancient name for the Sichuan province.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Skull relatively heavy, with paired nares placed at the front of the face
  - Teeth spatulate
  - Presacral vertebrae solidly constructed; cervicals opisthocoelous with short
    centra, low neural spines, and small pleurocoels on the sides of the centrum
  - Dorsal vertebrae platycoelous with high neural spines and reduced lamellar
    structure on the neural arch and spines; cervical centra 1.5 times the
    length of the dorsal centra
  - Anterior caudal vertebrae moderately platycoelous, becoming amphicoelous
    posteriorly, with chevrons forking in the mid-caudal region
  - 13 cervical, 12 dorsal, and 4 sacral vertebrae; limb bones graviportal and
    rather flat in cross section
appearance:
  features:
    - tail club
    - tail spikes
  integument: armored
  evidence: direct
