genus: Stegopelta
parent: Nodosauridae
etymology: From Greek stegos, "roof", combined with Greek pelte, "shield" - means "roofed shield"
pronunciation:
  phonetic: STEG-o-PEL-tuh
description: Stegopelta is a genus of struthiosaurin nodosaurid dinosaur based
  on a partial skeleton from the Cretaceous (latest Albian-earliest Cenomanian)
  Belle Fourche Member of the Frontier Formation of Fremont County, Wyoming,
  USA.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - coastal
diagnostic_features:
  - Heavy bony carapace, 2+ inches thick, covered with pentagonal dermal plates
    arranged in mosaic pattern similar to Glyptodon
  - Pentagonal dermal bony plates approximately 4 inches in diameter,
    scrobiculate with elevated middle portions
  - Series of large transverse bony plates with prominent longitudinal keel,
    each about hand-sized
  - Flattened bony scutes approximately 3 inches in diameter distributed across
    body
  - About half the size of Stegosaurus with front legs smaller than hind legs
  - Solid skeleton bones with amphiplatyan dorsal centra and elevated neural
    arches
appearance:
  features:
    - body armor
    - osteoderms
  integument: armored
  evidence: direct
