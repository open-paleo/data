genus: Shenzhousaurus
parent: Ornithomimosauria
etymology: Named after Shenzhou, a poetic name for China, combined with Greek sauros, "lizard" — means "Shenzhou lizard"
description: Shenzhousaurus is a genus of basal ornithomimosaurian theropod
  dinosaur from the Lower Cretaceous of China.The holotype (NGMC 97–4–002,
  National Geological Museum of China) was collected from near the bottom
  (fluvial beds) of the Yixian Formation (Aptian) at the Sihetun fossil site,
  Beipiao, western Liaoning Province. This specimen consists of a partial
  skeleton preserved on a sandstone slab in a "death pose," its head above the
  torso. The distal parts of the hindlimbs, distal portion of the tail, and the
  forelimbs (except for part of the right hand) and the pectoral girdle are
  missing. The head is crushed, exposing the left side obliquely.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
  - forested
