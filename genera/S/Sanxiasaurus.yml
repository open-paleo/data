genus: Sanxiasaurus
parent: Neornithischia
etymology: "Named for Sanxia (Three Gorges) of the Yangtze River in China, near the type locality, combined with Greek 'sauros' meaning 'lizard'; meaning 'Sanxia lizard.'"
pronunciation:
  phonetic: san-zee-uh-SOR-us
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
diagnostic_features:
  - At least four sacrals (vs. two in basal ornithischians)
  - Humerus strongly bowed laterally along its length
  - Obturator process located at mid-length of ischial shaft
  - Lesser trochanter of femur broadened, wing-shaped, subequal in
    anteroposterior width to greater trochanter
  - Distal tibia with elongate posterolateral process
appearance:
  integument: scaled
  evidence: inferred
