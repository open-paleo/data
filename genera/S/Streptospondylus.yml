references:
  - id: cuvier1808a
    notes: In French. First scientific description of the theropod vertebrae,
      then interpreted as crocodilian material from the Normandy Jurassic.
  - id: meyer1832a
    notes: In German. Erects Streptospondylus altdorfensis from Geoffroy
      Saint-Hilaire's (1825) Steneosaurus rostromajor; first binomial referring
      to a theropod.
  - id: owen1842a
    notes: Argues Meyer was incorrect in changing the original specific name and
      creates the combination Streptospondylus rostromajor for what Meyer had
      called Streptospondylus altdorfensis.
  - id: walker1964a
    notes: Refers the entire theropod material from Cuvier's series to the new
      species Eustreptospondylus divesensis (later moved to Piveteausaurus by
      Taquet 1977).
  - id: allain2001a
    notes: In French. Designates the postcranial theropod material as the
      lectotype, confirming altdorfensis as the valid epithet and
      Streptospondylus as a theropod genus.
  - id: jones2026c
    notes: Source of the hip height estimate.
  - id: carrano2012a
    notes: Recovered Streptospondylus as Megalosauria incertae sedis.
  - id: benson2010c
    notes: Recovered it more basally as Tetanurae incertae sedis, not confidently megalosauroid
