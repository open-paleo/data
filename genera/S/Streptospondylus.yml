genus: Streptospondylus
parent: Megalosauria
placement: incertae sedis
dispute:
  summary: >
    Streptospondylus altdorfensis, stabilized as a valid theropod by the
    lectotype designation of Allain (2001), is a fragmentary taxon recovered as
    Megalosauria incertae sedis by Carrano et al. (2012) — unresolved between
    Megalosauridae and Spinosauridae, and possibly a basal member of either.
    Benson (2010) recovered it more basally, as Tetanurae incertae sedis.
  history:
    - date: "2026-07-01"
      note: Placed at Megalosauria, the least-inclusive uncontested node, following Carrano et al. (2012); its finer position is unresolved.
pronunciation:
  phonetic: STREP-to-SPON-di-lus
etymology: From Ancient Greek streptós, "twisted", combined with Greek spóndulos, "vertebra" - means "twisted vertebra"
description: Streptospondylus is a genus of megalosaurid theropod dinosaur known
  from the Late Jurassic period of France, 161 million years ago. It was a
  medium-sized predator with an estimated length of 6 meters (19.5 ft) and a
  weight of 500 kg (1,100 lbs).
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - marine
appearance:
  integument: scaled
  evidence: inferred
diagnostic_features:
  - Two hypapophyses on the anterior dorsal vertebrae
  - Anterior dorsal centra strongly opisthocoelous and flattened ventrally;
    posterior dorsal centra platycoelous
  - Centra of the middle and posterior dorsal vertebrae elongate
  - Osseous ridge overhanging the dorsomedial edge of the astragalar ascending
    process not extending laterally to the middle of the distal tibia
  - Broad depression at the base of the ascending process of the astragalus
  - Astragalus lacking a posteromedial process
