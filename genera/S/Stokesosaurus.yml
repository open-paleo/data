genus: Stokesosaurus
parent: Tyrannosauroidea
pronunciation:
  phonetic: STOHK-so-SAWR-us
etymology: "Named for Utah geologist William Lee Stokes, who excavated at the
  Cleveland-Lloyd Dinosaur Quarry where the fossils were found, combined with
  Greek 'sauros' meaning 'lizard'; meaning 'Stokes' lizard.'"
description: Stokesosaurus is a genus of early tyrannosauroid theropod dinosaurs
  from the late Jurassic period of Utah, United States. They were small, bipedal
  predators measuring around 3 to 4 meters (9.8 to 13.1 ft) in length.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Median vertical ridge extending from acetabular hood to dorsal blade margin
  - Knob on articular surface of pubic peduncle (posterior half, subtriangular)
  - Premaxilla with height roughly twice anteroposterior length (60mm x 32mm)
    indicating extremely short snout
  - Four alveoli in premaxilla with sub-cylindrical teeth bearing serrate edges
  - Small theropod not exceeding ~4m adult length; ilium blade thin (1mm on
    medial ridge sides)
