genus: Stokesosaurus
parent: Tyrannosauroidea
etymology: "Named for Utah geologist William Lee Stokes, who excavated at the Cleveland-Lloyd Dinosaur Quarry where the fossils were found, combined with Greek 'sauros' meaning 'lizard'; meaning 'Stokes' lizard.'"
description: Stokesosaurus is a genus of early tyrannosauroid theropod dinosaurs
  from the late Jurassic period of Utah, United States. They were small, bipedal
  predators measuring around 3 to 4 meters (9.8 to 13.1 ft) in length.
diet: carnivore
locomotion: bipedal
