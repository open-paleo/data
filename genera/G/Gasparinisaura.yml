genus: Gasparinisaura
parent: Parksosauridae
pronunciation:
  phonetic: gas-pah-REEN-ee-SAWR-a
etymology: Gasparini's lizard; named in honor of Argentine paleontologist Zulma Brandoni de Gasparini, combined with Greek sauros (lizard)
description: Gasparinisaura is a genus of herbivorous ornithopod dinosaur from
  the Late Cretaceous. The first fossils of Gasparinisaura were found in 1992
  near Cinco Saltos in Río Negro Province, Argentina. The type species,
  Gasparinisaura cincosaltensis, was named and described in 1996 by Rodolfo
  Coria and Leonardo Salgado. The generic name honors Argentine paleontologist
  Zulma Brandoni de Gasparini. The specific name refers to Cinco Saltos.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Anterior process of jugal wedged between maxilla and lacrimal (posterior
    process of lacrimal wedges between maxilla and jugal)
  - Ascending process of jugal anteroposteriorly wide (uniquely broadened
    relative to all other ornithopods)
  - Ventral portion of infratemporal fenestra V-shaped, ventroposteriorly
    directed, and completely surrounded by the quadratojugal
  - Mid-caudal vertebrae with flag-shaped, anteroposteriorly expanded,
    asymmetrical chevrons
  - Greater and lesser trochanters of femur fully fused with smooth lateral
    surface on lesser trochanter
  - Condylid of femur laterally placed, directed posterolaterally, continuous
    with lateral surface of distal condyle
appearance:
  integument: scaled
  evidence: inferred
