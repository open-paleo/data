genus: Gasparinisaura
parent: Elasmaria
pronunciation:
  phonetic: gas-pah-REEN-ee-SAWR-a
etymology: Gasparini's lizard; named in honor of Argentine paleontologist Zulma Brandoni de Gasparini, combined with Greek sauros (lizard)
description: Gasparinisaura is a genus of herbivorous ornithopod dinosaur from
  the Late Cretaceous. The first fossils of Gasparinisaura were found in 1992
  near Cinco Saltos in Río Negro Province, Argentina. The type species,
  Gasparinisaura cincosaltensis, was named and described in 1996 by Rodolfo
  Coria and Leonardo Salgado. The generic name honors Argentine paleontologist
  Zulma Brandoni de Gasparini. The specific name refers to Cinco Saltos.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Lacrimal with a dorsoventrally expanded prefrontal process.
  - Postorbital process of the jugal with a massive, quadrangular
    posteroventral process directed into the infratemporal fenestra.
  - Posterior process of the jugal narrowing below the squamosal bar into a
    posteroventrally directed infratemporal slot, with an open foramen along
    its dorsal margin and an enclosed foramen in its posterior part.
  - Squamosal strongly convex dorsally, its postorbital and postquadratic
    processes meeting at about 100 degrees, with the apex of the postorbital
    process behind the jaw articulation.
  - Frontal with discoid-tessellate ornamentation on its lateral margin, and
    parietal with straplike lateral ornamentation.
  - Opisthotic extending much farther laterally than the postquadratic
    process of the squamosal, with a very large paroccipital fossa.
  - Exits of the vagus and both hypoglossal branches closely grouped in a
    triangle, the vagus foramen directed posteriorly and hidden in lateral
    view.
  - Prootic and basal tubera visible in lateral view behind the quadrate.
  - Laterosphenoid with a free, laterally projecting postorbital process,
    contacting the skull roof only through the parietal.
