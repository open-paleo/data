genus: Genusaurus
parent: Abelisauridae
dispute:
  summary: >
    The placement of Genusaurus is contentious. It has been assigned to
    Coelophysoidea originally, then to Noasauridae (Carrano and Sampson,
    2008), and to Abelisauridae by most subsequent analyses (Tortosa and
    colleagues, 2014; Rauhut and Carrano, 2016); it is often unstable, and Pol
    and colleagues (2024) could not place it, pruning it from their consensus
    as an unstable taxon. Buffetaut (2026) revised the type material and
    argued it is an early member of the abelisaurid clade Furileusauria, the
    earliest known, though it may prove an indeterminate furileusaurian.
  history:
    - date: "2026-06-30"
      note: >
        Placed at Abelisauridae following the prevailing recent
        analyses.
    - date: "2026-07-02"
      note: >
        Buffetaut (2026) revised the type material and interpreted Genusaurus
        as an early furileusaurian; retained at Abelisauridae pending broader
        acceptance of the finer placement.
etymology: Knee lizard; from Latin genu (knee) and Greek sauros (lizard),
  referring to distinctive features of the knee region
pronunciation:
  phonetic: JEN-yuu-SOR-uhs
  ipa: /ˌdʒɛnjʊˈsɔːrəs/
description: Genusaurus is a genus of abelisaurid theropod from the Early
  Cretaceous. Its fossils were found in France. Genusaurus is believed to have
  lived during the Albian stage, around 112-100 million years ago.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - marine
diagnostic_features:
  - Hatchet-shaped cnemial crest of the tibia, expanded both proximally and
    distally (now regarded as a character of Furileusauria rather than an
    autapomorphy of the genus).
  - Pubic bar extremely oblique towards the front.
  - Deep lateral sulcus on the tibia at the base of the tibio-fibular crest.
  - Deep sulcus on the medial surface of the proximal end of the fibula.
appearance:
  integument: scaled
  evidence: inferred
