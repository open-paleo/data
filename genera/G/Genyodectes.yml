genus: Genyodectes
parent: Ceratosauria
etymology: Jaw bite; from Greek genys (jaw) and dektes (bite)
description: Genyodectes and dektes ("bite")) is a genus of ceratosaurian
  theropod dinosaur from the Lower Cretaceous (Aptian) of South America. The
  holotype material (MLP 26–39, Museo de La Plata, La Plata, Argentina) was
  collected from the Cerro Barcino Formation, Cañadón Grande, Departamento Paso
  de Indios in the Chubut Province of Argentina and consists of an incomplete
  snout, including the premaxillae, portions of both maxillas, the right and
  left dentary, many teeth, a fragment of the left splenial, and parts of the
  supradentaries. These elements are generally poorly preserved and some are in
  articulation. The premaxilla of Genyodectes possesses relatively large and
  protruding teeth, similar to those of Ceratosaurus. The specific name, serus,
  means "late". In 2016 it was estimated to be 6.25 meters (20.5 ft) in length
  and 790 kg (1,740 lb) in weight.
diet: carnivore
locomotion: bipedal
