genus: Genyodectes
parent: Ceratosauridae
etymology: Jaw bite; from Greek genys (jaw) and dektes (bite)
pronunciation:
  phonetic: JEN-ee-o-DEK-teez
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Premaxillary teeth closely spaced and arranged in an overlapping en-echelon
    pattern (shared, if at all, only with Ceratosaurus).
  - Longest maxillary tooth crowns exceeding the minimal dorsoventral depth of
    the mandible in apicobasal length (shared, if at all, only with
    Ceratosaurus).
  - Four premaxillary teeth, versus three in Ceratosaurus.
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "38611"
  - source: wikidata
    id: Q134643
  - source: gbif
    id: "4822608"
  - source: eol
    id: "4531437"
species:
  - name: Genyodectes serus
    etymology: "From Latin 'serus' meaning 'late', likely in reference to the Cretaceous age of the specimen relative to other ceratosaurian theropods."
    pronunciation:
      phonetic: SEER-us
    status: valid
    type_species: true
    period:
      name:
        - Early Cretaceous
      stage:
        - Aptian
        - Albian
    location:
      country: AR
      locality: Cañadón Grande
      region: AR-U
      formation: Cerro Barcino
      notes: Rauhut (2004) narrows the horizon no further than the Cerro Barcino
        Formation, calling the Cerro Castaño Member the most likely
        candidate rather than a stated fact. Huene's account placing the
        site on the Rio Chubut near Gaiman is rejected there, no Mesozoic
        sediments cropping out within some 50 km of that town.
    size:
      length_m:
        min: 6.3
        max: 6.3
      weight_kg:
        min: 790
        max: 790
    erected_in: woodward1901a
    described_in: rauhut2004a
    type_specimen:
      specimen_id: [MLP 26-39]
      specimen_type: holotype
      institution: MLP
      material: Partial snout including both nearly complete premaxillae,
        fragments of both maxillae, both dentaries (all with teeth), parts of
        both supradentaries, and fragments of the left splenial.
      completeness: fragmentary
references:
  - id: woodward1901a
  - id: rauhut2004a
    notes: Redescription of the reprepared holotype MLP 26-39; gives the first
      formal diagnosis, argues ceratosaurid affinities, and assesses the
      provenance as Aptian-Albian, Cerro Barcino Formation.
