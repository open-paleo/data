genus: Gasosaurus
parent: Tetanurae
dispute:
  summary: >
    Gasosaurus constructus is most likely a basal tetanuran of indeterminate position
    (Carrano, Benson and Sampson, 2012). It has variously been interpreted as a basal
    coelurosaur or a basal carnosaur, and has been suggested to be synonymous with the
    contemporaneous Kaijiangosaurus lini from the same formation. It is placed
    conservatively at Tetanurae incertae sedis.
  history:
    - date: "2026-07-02"
      note: Placed at Tetanurae incertae sedis; its finer position and the possible synonymy with Kaijiangosaurus are unresolved.
pronunciation:
  phonetic: GAS-o-SAWR-us
  ipa: /ˌɡæsoʊˈsɔːrəs/
etymology: "From English 'gasoline' and Greek 'sauros' meaning 'lizard', named
  for the gasoline company whose workers discovered the fossils."
description: Gasosaurus is a genus of tetanuran theropod that lived
  approximately 171.6 to 161.2 million years ago during the middle of the
  Jurassic Period. The name "Gasosaurus" is derived from the English "gasoline"
  and the Greek σαῦρος (sauros) ("lizard / generic reptile"). Only one species
  is currently recognized, G. constructus, from which the specific name honors
  the gasoline company that found the Dashanpu fossil quarry in Sichuan
  Province, China, now named as the Lower Shaximiao Formation.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Cervical vertebrae platycoelous with non-sloping ventral surface and weakly
    developed ventral keel
  - Dorsal vertebrae with low neural arch; neural spines plate-like with no
    nodule at apex
  - Five sacral vertebrae fused to form sacrum, anterior four firmly coalesced
    with partially fused neural arches but free neural spines
  - Nutrient foramen present on medial surface of humerus below distal margin of
    humeral head
  - Ilium low with weakly developed anterior process
  - Pubis and ischium with circular shaft cross-section and lacking boot-shaped
    distal process, distally unfused
