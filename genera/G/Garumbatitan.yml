genus: Garumbatitan
parent: Somphospondyli
pronunciation:
  phonetic: gah-ROOM-buh-TIE-tan
etymology: Garumba giant; named after the Garumba river near the discovery site in Spain, combined with Titan from Greek mythology
description: Garumbatitan is an extinct genus of somphospondylan sauropod
  dinosaur from the Early Cretaceous Arcillas de Morella Formation of Spain. The
  genus contains a single species, G. morellensis, known from multiple partial
  skeletons.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Depression near anterior edge of centrum above lateral crest in
    middle-posterior caudal vertebrae
  - Middle-posterior caudal vertebral pedicels covered by complex of three
    anteroposteriorly elongated ridges
  - Middle-posterior caudal neural spines expanded posteriorly resulting in
    lateral rounded boss
  - Femur with markedly developed lateral bulge representing 44% of transverse
    minimal width of femoral shaft
  - Trochanteric shelf with proximolaterally-to-distolaterally orientation
  - Metatarsals II, III, and IV more gracile and longer than metatarsals I and V
    with abrupt transition, causing retraction of most medial and lateral toes
appearance:
  integument: scaled
  evidence: inferred
