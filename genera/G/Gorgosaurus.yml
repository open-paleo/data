genus: Gorgosaurus
parent: Albertosaurinae
pronunciation:
  phonetic: GOR-guh-SOR-uhs
  ipa: /ˌɡɔːrɡəˈsɔːrəs/
etymology: "From Greek gorgos (dreadful, fierce) and sauros (lizard); meaning
  'dreadful lizard'"
description: Gorgosaurus is a genus of tyrannosaurid theropod dinosaur that
  lived in western North America during the Late Cretaceous Period (Campanian),
  between about 76.5 and 75 million years ago. Fossil remains have been found in
  the Canadian province of Alberta and the U.S. state of Montana.
  Paleontologists recognize only the type species, G. libratus, although other
  species have been erroneously referred to the genus.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - First maxillary tooth similar in shape and size to premaxillary teeth,
    unlike other known Cretaceous carnivorous dinosaur genera
  - Premaxillary teeth long and slender with a keel on each side of a slightly
    convex lingual surface, laterally compressed with fore-aft diameter slightly
    greater than breadth
  - No triangular alveolar plates on the inner sides of the jaws
  - A foramen present in the surangular, positioned far back and near its upper
    border; no presplenial
  - Manus reduced to two digits (II and III) with metacarpal IV represented only
    by a proximal vestigial bone; humerus twice the length of the ulna
  - Metatarsal III nearly two-thirds the length of the femur; metatarsal I
    represented distally by a short vestigial bone giving digit I a forwardly
    directed position
appearance:
  integument: scaled
  evidence: direct
