genus: Gorgosaurus
parent: Albertosaurinae
pronunciation:
  phonetic: GOR-gə-SOR-əs
  ipa: /ˌɡɔːrɡəˈsɔːrəs/
etymology: "From Greek gorgos (dreadful, fierce) and sauros (lizard); meaning 'dreadful lizard'"
description: Gorgosaurus is a genus of tyrannosaurid theropod dinosaur that
  lived in western North America during the Late Cretaceous Period (Campanian),
  between about 76.5 and 75 million years ago. Fossil remains have been found in
  the Canadian province of Alberta and the U.S. state of Montana.
  Paleontologists recognize only the type species, G. libratus, although other
  species have been erroneously referred to the genus.
diet: carnivore
locomotion: bipedal
