species:
  - name: Gorgosaurus libratus
    etymology: "From Latin 'libratus', the past participle of 'librare' meaning 'to
      balance', likely referring to the animal's balanced build."
    status: valid
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Campanian
    location:
      country: CA
      locality: 3.5 miles below the mouth of Berry Creek, south side of the Red Deer River
      region: CA-AB
      formation: Dinosaur Park
      notes: Lambe (1914) names only the Belly River formation, which predates
        its division; Brochu (2003) places the holotype in the Dinosaur Park
        Formation. Russell (1970) gives the site as Sternberg's quarry 36,
        the only quarry number published for this specimen.
    type_specimen:
      specimen_id: [ NMC 2120 ]
      specimen_type: holotype
      institution: CMN
      material: Nearly complete skeleton including skull, most of vertebral column,
        pectoral and pelvic arches, complete fore-limb, both complete hind-limbs,
        ribs, and entire abdominal rib series; cervicals and tail tip absent
      completeness: complete
    size:
      length_m:
        min: 8.0
        max: 9.0
      weight_kg:
        min: 2000
        max: 3000
    erected_in: lambe1914a
notable_specimens:
  - specimen_id: [TMP 2009.012.0014]
    institution: TMP
    category: gut-contents
    significance: "Juvenile Gorgosaurus preserving in situ stomach contents of two roughly one-year-old Citipes juveniles, with only their hindlimbs and caudal vertebrae present. Provides direct dietary evidence reinforcing the theory of an ontogenetic dietary shift in tyrannosaurids."
    references: [therrien2023a]
  - specimen_id: [TCMI 2001.89.1]
    institution: TCMI
    category: pathology
    significance: "Specimen from Montana showing severe pathologies: healed leg, rib, and vertebral fractures, osteomyelitis at the tip of the lower jaw resulting in permanent tooth loss, and possibly a brain tumor."
    references: [pickrell2003a]
  - specimen_id: [TMP 1991.036.0500]
    institution: TMP
    category: pathology
    significance: "Very complete sub-adult preserving face-bite injuries, a thoroughly healed right fibula fracture, a healed dentary fracture, and a mushroom-like hyperostosis of a right pedal phalanx; preserved in a characteristic death pose."
    references: [rothschild2001a]
references:
