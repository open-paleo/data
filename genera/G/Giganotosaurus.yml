genus: Giganotosaurus
parent: Carcharodontosauridae
pronunciation:
  ipa: /ˌɡɪɡəˌnoʊtəˈsɔːrəs/
  phonetic: GIG-uh-NOH-tuh-SOR-uhs
etymology: "From Greek gigas/gigantos, 'giant', + Greek notos, 'south/southern', + Greek sauros, 'lizard'; means 'giant southern lizard', referring to its enormous size and South American origin"
description: Giganotosaurus is a genus of large theropod dinosaur that lived in
  what is now Argentina, during the early Cenomanian age of the Late Cretaceous
  period, approximately 99.6 to 95 million years ago. The holotype specimen was
  discovered in the Candeleros Formation of Patagonia in 1993 and is almost 70%
  complete. The animal was named Giganotosaurus carolinii in 1995; the genus
  name translates to "giant southern lizard", and the specific name honors the
  discoverer, Ruben Carolini. A dentary bone, a tooth, and some tracks,
  discovered before the holotype, were later assigned to this animal. The genus
  attracted much interest and became part of a scientific debate about the
  maximum sizes of theropod dinosaurs.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - arid
diagnostic_features:
  - Dorsoventrally wide main body of the maxilla, with subparallel dorsal and
    ventral edges.
  - Eave-like supraorbital lacrimal-postorbital contact.
  - Two pneumatic foramina on the internal side of the quadrate.
  - Symphysial end of the dentary dorsoventrally expanded, bearing a ventral
    process.
  - Proximal end of the scapula forwardly projected above the coracoid;
    tubercle-like triceps insertion on the ventral border of the scapula.
  - Lobule-shaped obturator process of the ischium; dorsally projected femoral
    head; posterior intercondylar groove in the proximal end of the tibia.
