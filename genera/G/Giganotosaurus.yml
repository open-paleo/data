species:
  - name: Giganotosaurus carolinii
    etymology: "Named for Rubén Darío Carolini, the amateur fossil hunter who discovered the holotype specimen in the Neuquén province of Patagonia, Argentina."
    pronunciation:
      phonetic: kar-oh-LEE-nee-eye
    status: valid
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Cenomanian
    location:
      country: AR
      locality: 15 km south of Villa El Chocón
      region: AR-Q
      formation: Candeleros
      notes: Coria and Salgado (1995) name the horizon the Candeleros Member of
        the Rio Limay Formation; Leanza and colleagues (2004) treat the Rio
        Limay as a subgroup and raise Candeleros to formation rank.
    type_specimen:
      specimen_id: [MUCPv-CH-1]
      specimen_type: holotype
      institution: UNCo
      material: "Disarticulated skeleton: partial skull, most of the vertebral column,
        complete pectoral and pelvic girdles, both femora, left tibia and fibula."
      completeness: partial
    size:
      length_m:
        min: 13.0
