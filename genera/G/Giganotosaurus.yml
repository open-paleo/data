    institution: UNCo
    species: Giganotosaurus carolinii
    category: largest-individual
    significance: "Referred partial left dentary about 8% larger than the holotype's at 62 cm, from a supposedly larger individual. It has been used to extrapolate a maximum length of 13.2 meters and a 1.95-meter skull, central to the debate over the largest theropods."
    discovered:
      year: 1987
      by: "Jorge O. Calvo"
    references: [calvo1998a]
  - specimen_id: [MUCPv-52]
    institution: UNCo
    species: Giganotosaurus carolinii
    category: historic
    significance: "An incomplete tooth referred to Giganotosaurus, discovered near Lake Ezequiel Ramos Mexia in 1987, making it the first known fossil of the genus, predating the holotype."
    discovered:
      year: 1987
      by: "A. Delgado"
    references: [calvo1999a]
