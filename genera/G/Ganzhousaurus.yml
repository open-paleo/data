genus: Ganzhousaurus
parent: Heyuanninae
etymology: Ganzhou lizard
description: Ganzhousaurus is an extinct genus of oviraptorid dinosaur known
  from the Late Cretaceous Nanxiong Formation of Nankang County, Ganzhou City of
  Jiangxi Province, southern China. It was found in a Maastrichtian deposit and
  contains a single species, Ganzhousaurus nankangensis. It is distinguished by
  a combination of primitive and derived features.
diet: omnivore
