genus: Ganzhousaurus
parent: Heyuanninae
etymology: Ganzhou lizard; named after Ganzhou City in Jiangxi Province, China, combined with Greek sauros (lizard)
pronunciation:
  phonetic: kan-jo-SOR-us
description: Ganzhousaurus is an extinct genus of oviraptorid dinosaur known
  from the Late Cretaceous Nanxiong Formation of Nankang County, Ganzhou City of
  Jiangxi Province, southern China. It was found in a Maastrichtian deposit and
  contains a single species, Ganzhousaurus nankangensis. It is distinguished by
  a combination of primitive and derived features.
diet: omnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Relatively shallow dentary with length-to-depth ratio of 1.90, shallower
    than in other oviraptorids such as Citipati (1.50) and Nemegtomaia (1.38).
  - Absence of fossa or pneumatopore on lateral surface of dentary, in contrast
    to Gigantoraptor, Chirostenotes, and Caenagnathasia.
  - Ventral border of external mandibular fenestra formed mainly by angular,
    unlike other oviraptorids where the dentary posteroventral branch forms most
    of the ventral border.
  - Angular anterior process wider transversely than deep dorsoventrally,
    unknown in other oviraptorosaurs.
  - Shallow longitudinal groove along medial surface of dentary posteroventral
    process, condition uncertain in most other oviraptorosaurs.
  - Prominent ventral flange along distal half of metatarsal II, giving bone a
    subtriangular mid-shaft cross-section; absent in Citipati and Heyuannia.
appearance:
  integument: feathered
  evidence: inferred
