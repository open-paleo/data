genus: Galleonosaurus
parent: Elasmaria
pronunciation:
  phonetic: GAL-ee-on-o-SAWR-us
etymology: Galleon lizard; named for the resemblance of the upper jaw bone to an upturned galleon, combined with Greek sauros (lizard)
description: Galleonosaurus is a genus of basal ornithopod dinosaur from the
  Wonthaggi Formation of the Gippsland region of Victoria, Australia. The type
  and only species is Galleonosaurus dorisae.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - polar
diagnostic_features:
  - Ascending ramus of maxilla has two slot-like foramina on the anterior margin
    that communicate with the neurovascular tract
  - Neurovascular tract bifurcates internally to exit at two anteroventral
    maxillary foramina
  - Lingual margin of maxillary tooth roots in midregion of tooth row form an
    S-bend at their bases
  - Posterior third of maxilla on some specimens deflects posterolaterally at an
    abrupt kink
  - Lateral end of palatine lateral ramus forms a hatchet-shaped flange
appearance:
  integument: scaled
  evidence: inferred
