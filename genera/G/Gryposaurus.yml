genus: Gryposaurus
parent: Kritosaurini
etymology: From Greek grypos (hook-nosed, curved) and sauros (lizard); meaning 'hooked-nosed lizard', referring to its arched nasal profile
description: 'Gryposaurus (meaning "hook-nosed lizard"; sometimes incorrectly translated
  as "griffin (Latin gryphus) lizard") was a genus of duckbilled dinosaur that lived about
  80 to 75 million years ago, in the Late Cretaceous (late Santonian to late
  Campanian stages) of North America. Named species of Gryposaurus are known
  from the Dinosaur Park Formation in Alberta, Canada, and two formations in the
  United States: the Lower Two Medicine Formation in Montana and the Kaiparowits
  Formation of Utah. A possible additional species from the Javelina Formation
  in Texas may extend the temporal range of the genus to 66 million years ago.'
diet: herbivore
locomotion: facultative
