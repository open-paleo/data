genus: Gryposaurus
parent: Saurolophinae
pronunciation:
  phonetic: GRIP-o-SAWR-us
etymology: From Greek grypos (hook-nosed, curved) and sauros (lizard); meaning
  'hooked-nosed lizard', referring to its arched nasal profile
description: 'Gryposaurus (meaning "hook-nosed lizard"; sometimes incorrectly
  translated as "griffin (Latin gryphus) lizard") was a genus of duckbilled
  dinosaur that lived about 80 to 75 million years ago, in the Late Cretaceous
  (late Santonian to late Campanian stages) of North America. Named species of
  Gryposaurus are known from the Dinosaur Park Formation in Alberta, Canada, and
  two formations in the United States: the Lower Two Medicine Formation in
  Montana and the Kaiparowits Formation of Utah. A possible additional species
  from the Javelina Formation in Texas may extend the temporal range of the
  genus to 66 million years ago.'
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Nasals highly arched, rising to extraordinary height a short distance in
    advance of the orbits; nasal apex as high as the summit of the squamosal
    behind the supratemporal fossa.
  - Skull uniquely deep anteriorly among Trachodontidae; depth at apex of nasal
    bones equal to about half the maximum skull length.
  - Lower anterior border of premaxillae expanded laterally and notched in a
    regular manner on each side of the median sutural union.
  - Predentary expanded laterally, deflected in its hinder half, and posteriorly
    bifurcated below at the midline into two processes received into excavations
    of the dentaries.
  - Orbit much smaller than the lateral temporal fossa; lateral temporal fossa
    more than twice as high as wide.
  - Body covered with small, polygonal, non-imbricating, tuberculate scales of
    rather uniform size, varying from 1/8 to 3/8 inch diameter with no definite
    pattern arrangement.
