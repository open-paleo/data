genus: Gryposaurus
parent: Saurolophinae
pronunciation:
  phonetic: GRIP-o-SAWR-us
etymology: From Greek grypos (hook-nosed, curved) and sauros (lizard); meaning
  'hooked-nosed lizard', referring to its arched nasal profile
description: 'Gryposaurus (meaning "hook-nosed lizard"; sometimes incorrectly
  translated as "griffin (Latin gryphus) lizard") was a genus of duckbilled
  dinosaur that lived about 80 to 75 million years ago, in the Late Cretaceous
  (late Santonian to late Campanian stages) of North America. Named species of
  Gryposaurus are known from the Dinosaur Park Formation in Alberta, Canada, and
  two formations in the United States: the Lower Two Medicine Formation in
  Montana and the Kaiparowits Formation of Utah. A possible additional species
  from the Javelina Formation in Texas may extend the temporal range of the
  genus to 66 million years ago.'
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Nasals highly arched, rising to extraordinary height a short distance in
    advance of the orbits; nasal apex as high as the summit of the squamosal
    behind the supratemporal fossa.
  - Skull uniquely deep anteriorly among Trachodontidae; depth at apex of nasal
    bones equal to about half the maximum skull length.
  - Lower anterior border of premaxillae expanded laterally and notched in a
    regular manner on each side of the median sutural union.
  - Predentary expanded laterally, deflected in its hinder half, and posteriorly
    bifurcated below at the midline into two processes received into excavations
    of the dentaries.
  - Orbit much smaller than the lateral temporal fossa; lateral temporal fossa
    more than twice as high as wide.
  - Body covered with small, polygonal, non-imbricating, tuberculate scales of
    rather uniform size, varying from 1/8 to 3/8 inch diameter with no definite
    pattern arrangement.
appearance:
  features:
    - midline spike row
  integument: scaled
  evidence: direct
identifiers:
  - source: pbdb
    id: "53014"
  - source: wikidata
    id: Q385949
  - source: gbif
    id: "4823293"
  - source: eol
    id: "4531707"
synonyms:
  - name: Hadrosauravus
    type: nomen nudum
    reason: Informal name introduced for material now considered referable to
      Gryposaurus.
species:
  - name: Gryposaurus notabilis
    etymology: From Latin 'notabilis' meaning 'notable' or 'remarkable', in
      reference to the distinctive hooked nasal arch that sets this dinosaur
      apart from other hadrosaurs.
    status: valid
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Campanian
    location:
      country: CA
      region: CA-AB
      formation: Dinosaur Park
      notes: Lambe (1914) names no site beyond the Belly River formation on the
        Red Deer River. Lull and Wright (1942) give Sandhill Creek for the
        Kritosaurus incurvimanus holotype, a different specimen.
    size:
      length_m:
        min: 7.5
        max: 8.2
      weight_kg:
        min: 2500
        max: 3000
      skull_length_m:
        min: 0.99
        max: 0.99
    type_specimen:
      specimen_id:
        - NMC 2278
      specimen_type: holotype
      institution: CMN
      material: Skull with approximately twenty feet of vertebral column, most of the
        pectoral arch, about half of the ribs, the pelvic arch, one hind limb
        with part of the foot, and skin impressions from between the femur and
        base of the tail.
      completeness: partial
    synonyms:
      - name: Kritosaurus incurvimanus
        type: junior subjective
        reason: Named by Parks (1919) from the Dinosaur Park Formation. Gates and
          Sampson (2007) rediagnosed it as a valid species, but Prieto-Márquez
          (2010) found its characters either shared with G. notabilis or
          indicative of subadults, and treats its specimens as subadult G.
          notabilis.
      - name: Gryposaurus incurvimanus
        type: reassigned
        reason: Combination used for Parks's species once it was referred to
          Gryposaurus, including by Gates and Sampson (2007).
    erected_in: lambe1914b
  - name: Gryposaurus monumentensis
    etymology: Named for Grand Staircase-Escalante National Monument in southern
      Utah, where all referred material has been recovered.
    status: valid
    type_species: false
    period:
      name:
        - Late Cretaceous
      stage:
        - Campanian
    location:
      country: US
      region: US-UT
      formation: Kaiparowits
      part: middle
      notes: The Kaiparowits Formation's middle unit is informal, and Gates and
        Sampson (2007) place the holotype no more precisely than within the
        Grand Staircase-Escalante National Monument.
    type_specimen:
      specimen_id:
        - RAM 6797
      specimen_type: holotype
      institution: RAM
      material: Largely articulated skull lacking most of the right side.
    diagnostic_features:
      - Infratemporal fenestra anteroposteriorly narrow, about half the width of
        the orbit (subequal to or larger than the orbit in other species).
      - Anterodorsal process of maxilla visible through the external naris.
      - Predentary oral margin with large, pronged, clover-shaped denticles.
      - Anterior portion of the dentary sharply downturned.
      - Surangular with a distinct dorsal process on its median ridge.
      - Mandibular foramen ovoid (subcircular in other species).
    erected_in: gates2007b
  - name: Gryposaurus latidens
    etymology: From Latin 'latus' (wide) and 'dens' (tooth), for the unusually wide
      dentary tooth crowns.
    status: valid
    type_species: false
    period:
      name:
        - Late Cretaceous
      stage:
        - Campanian
    location:
      country: US
      region: US-MT
      formation: Two Medicine
      locality: Near the Two Medicine River, 19 km southwest of Cut Bank, Glacier
        County
    size:
      length_m:
        min: 7.5
        max: 7.5
      weight_kg:
        min: 3000
        max: 3000
    type_specimen:
      specimen_id:
        - AMNH FARB 5465
      specimen_type: holotype
      institution: AMNH
      material: Partial skeleton with nearly complete articulated premaxillae,
        partial nasals, left and fragmentary right dentaries, left surangular,
        left splenial, cervical, dorsal, sacral and caudal vertebrae, right
        sternal, both coracoids and nearly complete scapulae, left and partial
        right humeri, partial left ilium, nearly complete left pubis, left radius
        and right fibula.
      completeness: partial
    diagnostic_features:
      - Dentary tooth crowns wide and short (apicobasal length/mesiodistal width
        1.7–2.2), most with a single median carina, and with coarse marginal
        denticulation of large papillae in the ventral and anterior dental
        battery.
      - Deep, oval depression on the posterior region of the ventral surface of
        the premaxilla.
      - Shallow lacrimal process of the rostral process of the jugal.
      - Anterolateral oral margin of the premaxilla wider and more smoothly
        arcuate.
      - Posterior margin of the narial fenestra wider than the depth of the
        proximal narial bar, with the nasal crest rising above the frontals in
        adults and sitting above that margin.
      - Posteroventral margin of the rostral process of the jugal wide and
        shallow.
      - Angle between the proximal margin of the dentary and the alveolar edge
        of the tooth row greater than 150°.
      - Proximal constriction of the scapula narrower (minimum/maximum proximal
        width less than 0.60).
    erected_in: horner1992a
    described_in: prieto-márquez2012c
references:
  - id: lambe1914b
  - id: gates2007b
    notes: Erects Gryposaurus monumentensis on skull RAM 6797 from the late
      Campanian Kaiparowits Formation of southern Utah.
  - id: lull1942a
  - id: parks1920a
    notes: Describes a row of large dermal callosities along the midline of the
      back in the holotype of Kritosaurus incurvimanus, now regarded as a
      subadult G. notabilis.
  - id: prieto-márquez2010d
    notes: Revises the genus, sinking G. incurvimanus into G. notabilis as subadult
      specimens and rebutting the diagnosis of Gates and Sampson (2007).
  - id: horner1992a
    notes: Names G. latidens from the lower Two Medicine Formation of Montana.
  - id: prieto-márquez2012c
    notes: Redescribes the G. latidens holotype and referred material, with a
      revised diagnosis.
  - id: paul2024a
    notes: Source of the G. latidens body length and mass estimates.
  - id: parks1919a
