genus: Gobititan
parent: Euhelopodidae
etymology: Named for the Gobi Desert region where the fossils were found,
  combined with the Titans of Greek mythology, in reference to the animal's
  large body size.
description: Gobititan is a genus of herbivorous sauropod dinosaur from the
  Aptian faunal stage of the Early Cretaceous. The name of this genus is derived
  from the Gobi Desert region and the Titans of Greek mythology, which is a
  reference to its large body size. The specific name shenzhouensis, is derived
  from "Shenzhou", an ancient name for China.
