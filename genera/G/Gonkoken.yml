genus: Gonkoken
parent: Hadrosauroidea
etymology: Similar to a wild duck or swan; from the Aonikenk (Tehuelche) language of Patagonia
description: Gonkoken is an extinct genus of hadrosauroid ornithopod dinosaur
  from the Late Cretaceous Dorotea Formation of Chilean Patagonia. The genus
  contains a single species, Gonkoken nanoi, known from disarticulated bones of
  multiple individuals.
