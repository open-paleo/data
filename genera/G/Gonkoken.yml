genus: Gonkoken
parent: Hadrosauroidea
etymology: Similar to a wild duck or swan; from the Aonikenk (Tehuelche) language of Patagonia
pronunciation:
  phonetic: gon-KO-ken
description: Gonkoken is an extinct genus of hadrosauroid ornithopod dinosaur
  from the Late Cretaceous Dorotea Formation of Chilean Patagonia. The genus
  contains a single species, Gonkoken nanoi, known from disarticulated bones of
  multiple individuals.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
diagnostic_features:
  - Scapula with an anteroventrally curved pseudoacromion process
  - Ilium with a medioventrally and anteroposteriorly well-developed sacral
    crest extending posterior to the base of the postacetabular process
  - Maxilla with a jugal articular surface bearing a prominent and caudally
    projecting dorsal tubercle, unlike Hadrosauridae
  - Dentary with a short diastema, oblique mandibular symphysis, and fewer than
    30 tooth positions not extending beyond the coronoid process
  - Deltopectoral crest with a rounded laterodistal end extending less than 48%
    of total humerus length
  - Tibia with a cnemial crest extending less than 50% of total bone length
appearance:
  features:
    - keratinous beak
