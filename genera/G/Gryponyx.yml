genus: Gryponyx
parent: Massospondylidae
placement: incertae sedis
etymology: "Hooked-claw; from Greek grypos (hooked) and onyx (claw)"
pronunciation:
  phonetic: GRIP-on-iks
description: Gryponyx is an extinct genus of massopod sauropodomorph known from
  southern Free State, central South Africa.
dispute:
  summary: >
    Gryponyx africanus, known from a largely complete postcranial skeleton,
    was treated as a junior synonym of Massospondylus carinatus (Galton,
    1990) and later as a nomen dubium (Galton and Upchurch, 2004).
    Vasconcelos and Yates (2004) revived it as a basal massospondylid, and
    McPhee and colleagues (2017) note that it may be distinct from
    Massospondylus, though Yates and colleagues (2011) report lingering
    doubts. Barrett and colleagues (2019) observe that the earlier decisions
    rested on provenance rather than on detailed consideration of anatomy.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - arid
diagnostic_features:
  - Iliac crest much straighter than in Plateosaurus or Teratosaurus, with an
    unusually small anterior iliac spine
  - Pubes and ischia form a complete symphysis with no opening from front of
    pubis to posterior end of ischium
  - Femur with trochanter minor smaller and third trochanter positioned more to
    the inner side of the bone compared to Plateosaurus
  - Carpus with seven elements including a very large first distal carpale (56
    mm length) articulating with most of the first metacarpal
  - Pollex ungual phalanx huge (~105 mm), with large bony process for flexor
    tendon insertion and marked vascular groove on radial side
  - Claw of second pedal digit with sharp outer side and rounded inner side,
    forming a combing or scraping edge
appearance:
  integument: scaled
  evidence: inferred
