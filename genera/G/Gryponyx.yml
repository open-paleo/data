    etymology: "From Latin 'africanus' meaning 'African', after Africa, where the
      holotype was discovered in South Africa."
    status: disputed
    type_species: true
    period:
      name:
        - Early Jurassic
      stage:
        - Hettangian
        - Sinemurian
    location:
      country: ZA
      region: ZA-FS
      locality: Foutani farm, near Fouriesburg
      formation: Elliot
    size:
