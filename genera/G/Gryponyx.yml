genus: Gryponyx
parent: Prosauropoda
etymology: Gryponyx was first named by Robert Broom in 1911 and the type species
  is Gryponyx africanus. The generic name is derived from grypos, Greek for
  "hooked" and onyx, Greek for "claw". The specific name refers to Africa, where
  the holotype was discovered.
description: Gryponyx is an extinct genus of massopod sauropodomorph known from
  southern Free State, central South Africa.
diet: herbivore
locomotion: bipedal
