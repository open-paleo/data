genus: Gojirasaurus
parent: Neotheropoda
dispute:
  summary: >
    Gojirasaurus quayi was originally described as a coelophysoid
    (Carpenter, 1997) but is recovered on the stem lineage to Averostra by
    Ezcurra and others (2020); it is regarded as a possible chimera and
    nomen dubium by Nesbitt and others (2007).
  history:
    - date: "2026-06-30"
      note: >
        Placed at Neotheropoda, the least-inclusive clade the sources
        support.
pronunciation:
  phonetic: go-JEER-a-SAWR-us
etymology: "Godzilla lizard; named after the giant monster movie character Godzilla (known as Gojira in Japanese), combined with Greek sauros (lizard)"
description: Gojirasaurus is a genus of coelophysoid theropod dinosaur named
  after the giant monster movie character Godzilla. It lived in the Late
  Triassic Period, containing a single known species, Gojirasaurus quayi.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Tooth serrations closely spaced, restricted to carina, with cutting edges
    curving upwards toward the tip (as in Saurornitholestes).
  - Neural spine very tall relative to centrum height (x1.4), in contrast to
    Coelophysis, Liliensternus, Syntarsus, and Herrerasaurus.
  - Pubis with single large oval obturator fenestra (not doubled as in
    Syntarsus, nor notched as in Liliensternus); pubic apron narrow.
  - Medial tibial condyle larger than lateral condyle (condyles equal in
    Dilophosaurus, Staurikosaurus, Syntarsus; lateral larger in Herrerasaurus).
  - Astragalar facet offset approximately 35° relative to anteroposterior axis
    of tibia (vs. 58° in Staurikosaurus and 30° in Dilophosaurus).
  - Astragalar facet well developed as a distinct 'step', unlike the closed pit
    condition in Herrerasaurus.
