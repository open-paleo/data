genus: Gojirasaurus
parent: Coelophysoidea
etymology: The generic name Gojirasaurus is derived from the name of the giant
  Japanese movie monster "Gojira" (Godzilla) and the Greek word "" () meaning
  "lizard"; thus, "Godzilla lizard". Carpenter (1997) selected "Gojira" in
  reference to the relatively large size of this theropod, which exceeded that
  of its Triassic counterparts. The specific name quayi is a reference to Quay
  County.
description: Gojirasaurus is a genus of coelophysoid theropod dinosaur named
  after the giant monster movie character Godzilla. It lived in the Late
  Triassic Period, containing a single known species, Gojirasaurus quayi.
diet: carnivore
