genus: Gojirasaurus
parent: Neotheropoda
placement: incertae sedis
dispute:
  summary: >
    Originally described as a large coelophysoid (Carpenter, 1997), Gojirasaurus
    quayi rests on a composite holotype (UCM 47221) of fragmentary, largely
    non-diagnostic elements. Nesbitt and others (2007) found that only some
    components — the tibia and pubis — are clearly coelophysoid and distinct from
    the co-occurring pseudosuchian Shuvosaurus, whereas others (the scapula and
    vertebrae) are indistinguishable from it and the serrated tooth could belong
    to any large carnivorous archosaur. Even the coelophysoid elements lack
    unambiguous autapomorphies — the robust tibia matches Coelophysis-like
    material apart from its larger size — so the taxon is widely treated as a
    metataxon and nomen dubium. Ezcurra and others (2020) recovered it on the
    stem lineage to Averostra; it is placed conservatively at Neotheropoda
    incertae sedis.
  history:
    - date: "2026-06-30"
      note: >
        Placed at Neotheropoda, the least-inclusive clade the sources
        support.
    - date: "2026-07-03"
      note: >
        Status set to nomen dubium: the holotype is a composite of fragmentary,
        largely non-diagnostic elements (a metataxon per Nesbitt and others,
        2007), with scapula and vertebrae indistinguishable from the co-occurring
        Shuvosaurus and no unambiguous autapomorphies even in the coelophysoid
        tibia and pubis. Extended the dispute summary, removed the contested
        diagnostic_features, and wired in the Nesbitt and others (2007) and
        Ezcurra and others (2020) papers.
pronunciation:
  phonetic: go-JEER-a-SAWR-us
etymology: "Godzilla lizard; named after the giant monster movie character Godzilla (known as Gojira in Japanese), combined with Greek sauros (lizard)"
description: Gojirasaurus is a genus of coelophysoid theropod dinosaur named
  after the giant monster movie character Godzilla. It lived in the Late
  Triassic Period, containing a single known species, Gojirasaurus quayi.
