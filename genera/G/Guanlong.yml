genus: Guanlong
parent: Proceratosauridae
description: Guanlong is an extinct genus of proceratosaurid tyrannosauroid
  dinosaur from the Late Jurassic (Oxfordian) Shishugou Formation of China. It
  was first described in 2006 by Xu Xing and colleagues, who found it to
  represent a new taxon related to Tyrannosaurus. Two individuals are currently
  known, consisting of a partially complete adult and a nearly complete
  juvenile.
diet: carnivore
