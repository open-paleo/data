genus: Guanlong
parent: Proceratosauridae
etymology: From Chinese guan (crown) and long (dragon); meaning 'crown dragon',
  referring to its prominent cranial crest
description: Guanlong is an extinct genus of proceratosaurid tyrannosauroid
  dinosaur from the Late Jurassic (Oxfordian) Shishugou Formation of China. It
  was first described in 2006 by Xu Xing and colleagues, who found it to
  represent a new taxon related to Tyrannosaurus. Two individuals are currently
  known, consisting of a partially complete adult and a nearly complete
  juvenile.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Deep and narrow groove along the anterior margin of the premaxilla.
  - Complex, highly pneumatic nasal crest consisting of a thin median crest
    (~1.5 mm thick) with four supporting lateral laminae.
  - Dorsally flattened parietal with two parallel sagittal crests.
  - Femoral greater trochanter much narrower anteroposteriorly than the lesser
    trochanter.
  - Distinct fossa on posterodistal surfaces of astragalus and calcaneum.
  - Pedal phalanx II-1 with prominent paired ventral processes proximally.
