genus: Glishades
parent: Saurolophinae
etymology: Concealed in mud; from Latin glis (mud) and Greek Hades (lord of the underworld, meaning unseen), referring to being found in sedimentary strata
description: Glishades is a genus of hadrosauroid dinosaur that lived in the
  Late Cretaceous in North America. It is based on AMNH 27414, two partial
  premaxillae discovered in the Upper Cretaceous rocks of the upper Two Medicine
  Formation in Montana, dated to about 74.5 million years ago. Cladistic
  analysis conducted by Prieto-Márquez suggests that Glishades is a
  non-hadrosaurid hadrosauroid, probably a sister taxon to Bactrosaurus
  johnsoni. The type species is Glishades ericksoni. In 2012, Campione et al.
  suggest the holotype specimen of Glishades might actually be an indeterminate
  juvenile saurolophine hadrosaurid and consider it to be a nomen dubium.
diet: herbivore
locomotion: facultative
