genus: Glishades
parent: Hadrosauroidea
placement: incertae sedis
etymology: Concealed in mud; from Latin glis (mud) and Greek Hades (lord of the underworld, meaning unseen), referring to being found in sedimentary strata
pronunciation:
  phonetic: glee-SHAY-deez
dispute:
  summary: >
    Glishades ericksoni was described as a non-hadrosaurid hadrosauroid
    (Prieto-Márquez, 2010) but Campione and colleagues (2012) refer the
    holotype to an indeterminate juvenile saurolophine and regard the name
    as a nomen dubium.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "167451"
  - source: wikidata
    id: Q1932493
  - source: gbif
    id: "9441828"
species:
  - name: Glishades ericksoni
    etymology: "Named for Gregory M. Erickson, an American paleontologist recognized for work on archosaur paleobiology."
    pronunciation:
      phonetic: ER-ik-sun-eye
    status: nomen dubium
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Campanian
    location:
      country: US
      locality: South Milk River, 30 miles west of Sweetgrass
      region: US-MT
      formation: Two Medicine
      notes: Brown, Kaisen and Johnson collected the holotype around 1915, and
        Campione and colleagues (2012) record that its exact locality is
        unknown.
    erected_in: prieto-márquez2010a
    type_specimen:
      specimen_id: [AMNH 27414]
      specimen_type: holotype
      institution: AMNH
      material: Partial left and right premaxillae.
      completeness: fragmentary
references:
  - id: prieto-márquez2010a
  - id: jones2026a
    notes: Treats Glishades as a nomen dubium.
  - id: campione2012a
    notes: Referred the Glishades holotype to an indeterminate juvenile
      saurolophine and regarded the name as a nomen dubium.
