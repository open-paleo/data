genus: Glishades
parent: Hadrosauroidea
etymology: Concealed in mud; from Latin glis (mud) and Greek Hades (lord of the underworld, meaning unseen), referring to being found in sedimentary strata
pronunciation:
  phonetic: glee-SHAY-deez
description: Glishades is a genus of hadrosauroid dinosaur that lived in the
  Late Cretaceous in North America. It is based on AMNH 27414, two partial
  premaxillae discovered in the Upper Cretaceous rocks of the upper Two Medicine
  Formation in Montana, dated to about 74.5 million years ago. Cladistic
  analysis conducted by Prieto-Márquez suggests that Glishades is a
  non-hadrosaurid hadrosauroid, probably a sister taxon to Bactrosaurus
  johnsoni. The type species is Glishades ericksoni. In 2012, Campione et al.
  suggest the holotype specimen of Glishades might actually be an indeterminate
  juvenile saurolophine hadrosaurid and consider it to be a nomen dubium.
dispute:
  summary: >
    Glishades ericksoni was excluded from Hadrosauridae by
    Prieto-Márquez (2010), who recovered it as a non-hadrosaurid
    hadrosauroid; Campione and others (2012) further regarded it as a
    nomen dubium possibly representing a juvenile saurolophine.
  history:
    - date: "2026-06-27"
      note: Reparented from Hadrosauridae to Hadrosauroidea incertae
        sedis following Prieto-Márquez (2010); nomen dubium status noted
        (P1).
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
diagnostic_features:
  - Absence of recurvature ('reflection') of the oral margin of the premaxilla
  - Arcuate oral margin with wide and straight, obliquely oriented, and
    undeflected anterolateral corner
  - Foramina on anteromedial surface of premaxilla above oral edge and adjacent
    to proximal end of narial bar
  - Grooved transversal thickening on ventral surface of premaxilla posterior to
    denticulate oral margin
