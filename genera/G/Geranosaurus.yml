genus: Geranosaurus
parent: Heterodontosauridae
etymology: ancestor
description: Geranosaurus is a genus of heterodontosaurid ornithischian dinosaur
  that lived during the Early Jurassic, between 191.1 and 187.5 million years
  ago. It is known from a single species, G. atavus, that was named in 1911 by
  Robert Broom for partial jaws found during road-cutting in South Africa. The
  genus name is likely derived from the word for "crane" in reference to the
  bird-like limb bones, while the species name means "ancestor" likely in
  reference to its position as an early ornithischian. The limited material and
  poor preservation of Geranosaurus have rendered it difficult to diagnose, with
  authors accepting it as a dubious name though differentiable from its relative
  Heterodontosaurus, the only other heterodontosaurid known from the Clarens
  Formation.
diet: herbivore
