genus: Geranosaurus
parent: Heterodontosauridae
placement: incertae sedis
etymology: From Ancient Greek 'geranos' meaning 'crane' and Greek 'sauros'
  meaning 'lizard', giving 'crane lizard'; the name refers to the bird-like limb
  bones.
pronunciation:
  phonetic: juh-RAN-o-SOR-us
dispute:
  summary: >
    Geranosaurus is a nomen dubium based on fragmentary jaw material from
    the Early Jurassic of South Africa; it shows heterodontosaurid
    features, but they are not diagnosable (Norman and colleagues, 2011),
    and Sereno (2012) judges them inadequate for taxonomic recognition.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - arid
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "38724"
  - source: wikidata
    id: Q1930184
  - source: gbif
    id: "4823097"
species:
  - name: Geranosaurus atavus
    etymology: "From Latin 'atavus' meaning 'ancestor', likely referencing its
      position as one of the earliest known ornithischian dinosaurs."
    pronunciation:
      phonetic: AT-uh-vus
    status: nomen dubium
    type_species: true
    period:
      name:
        - Early Jurassic
      stage:
        - Sinemurian
        - Pliensbachian
    location:
      country: ZA
      region: ZA-EC
      locality: road-cutting near the summit of Barkly Pass, Farm Tulloch, Elliot
      formation: Clarens
      part: lower
      coordinates:
        - -31.450001
        - 27.85
      notes: The coordinate is the road-cutting's, published by Kitching and
        Raath in 1984 and reprinted by Norman and colleagues (2011), who
        also place the exposure on Farm Tulloch. Broom (1911) names the unit
        only as the Cave sandstone of the Stormberg Series.
    size:
      length_m:
        min: 1.2
        max: 1.2
    type_specimen:
      specimen_id: [ SAM-PK-1871 ]
      specimen_type: holotype
      institution: SAM
      material: Partial lower jaws with teeth
      completeness: fragmentary
    erected_in: broom1911a
references:
  - id: broom1911a
  - id: sereno2012a
    notes: Assessed Geranosaurus among heterodontosaurids.
  - id: jones2026a
    notes: Treats Geranosaurus as a dubious heterodontosaurid.
  - id: norman2011a
    notes: Places the type locality on Farm Tulloch at Barkly Pass and reprints
      the coordinate Kitching and Raath published in 1984.
  - id: bordy2020a
    notes: Dates the Clarens to a mainly Pliensbachian age on detrital zircons.
