genus: Geranosaurus
parent: Heterodontosauridae
etymology: "From Ancient Greek 'geranos' meaning 'crane' and Greek 'sauros'
  meaning 'lizard', giving 'crane lizard'; the name refers to the bird-like limb
  bones, while the specific name atavus is Latin for 'ancestor', referencing its
  position as an early ornithischian."
description: Geranosaurus is a genus of heterodontosaurid ornithischian dinosaur
  that lived during the Early Jurassic, between 191.1 and 187.5 million years
  ago. It is known from a single species, G. atavus, that was named in 1911 by
  Robert Broom for partial jaws found during road-cutting in South Africa. The
  genus name is likely derived from the word for "crane" in reference to the
  bird-like limb bones, while the species name means "ancestor" likely in
  reference to its position as an early ornithischian. The limited material and
  poor preservation of Geranosaurus have rendered it difficult to diagnose, with
  authors accepting it as a dubious name though differentiable from its relative
  Heterodontosaurus, the only other heterodontosaurid known from the Clarens
  Formation.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - arid
diagnostic_features:
  - Predentary present, with concave upper surface and sharp outer/anterior
    edges forming a horny beak
  - Most anterior mandibular tooth enlarged (canine-like), diameter 5 mm vs 3-4
    mm for remaining teeth
  - Mandibular teeth with rounded roots in sockets; maxillary teeth with flat
    chisel-shaped crowns and feebly ridged outer face
  - Dentary bears 9 teeth in anterior half only, total dental series length 35
    mm over 73 mm jaw length
  - Earliest known member of the Predentata (ornithischians) from the Lower
    Jurassic Cave Sandstone of the Stormberg
