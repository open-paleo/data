      material: Type and paratype adult individuals; elements include premaxillae,
        mandibles, teeth, cervical, dorsal, sacral and caudal vertebrae, pectoral and
        pelvic girdles, fore- and hindlimbs, sterna, ribs, and gastralia
      completeness: partial
    erected_in: he1998a
