genus: Gongxianosaurus
parent: Sauropodiformes
pronunciation:
  phonetic: GOONG-shyen-o-SAWR-us
etymology: Named for Gongxian County in Sichuan Province, China, where the
  fossils were found, combined with Greek 'sauros' meaning 'lizard'.
description: "Gongxianosaurus is a genus of basal sauropod dinosaur from the
  early Jurassic Period (Sinemurian-Pliensbachian stage). The only species is
  Gongxianosaurus shibeiensis. Based on four fragmentary to complete specimens
  found in the Ziliujing Formation, China (Sichuan Province), it is one of the
  most completely known early sauropods. The skeleton is known in large part,
  missing both the hand and the majority of the skull. Gongxianosaurus was
  firstly named and described in a short note published in 1998; however, a
  comprehensive description has yet to be published. Gongxianosaurus shibeiensis
  was named for the place it was found, near the village Shibei in Gong County
  (珙县; Pinyin: Gǒng Xiàn)."
dispute:
  summary: >
    Gongxianosaurus shibeiensis is recovered among the basalmost sauropods
    by Jones (2026) and others, but as a non-sauropodan sauropodiform near
    the Sauropoda boundary under more restrictive definitions.
  history:
    - date: "2026-06-29"
      note: >
        Placed at Sauropodiformes incertae sedis; the basal-Sauropoda
        placement is recorded, but the boundary remains unresolved.
locomotion: facultative
paleoenvironment:
  - lacustrine
diet: herbivore
diagnostic_features:
  - Premaxilla has well-developed posterior process on posterodorsal region in
    addition to the anterodorsal process
  - Cervical ribs extremely short, only two-thirds the centrum length
  - Dorsal vertebrae bear two nearly parallel transversely extended ventral
    laminae or spines resembling ventral diapophyseal plates
  - Anterior caudal neural spines broad and plate-shaped with extremely
    well-developed diapophyses that are broad anteroposteriorly and thin
    dorsoventrally; no caudal haemal arch is bifurcated
  - Forelimb length 70-75% the length of the hindlimb
  - Pes phalanges thick and short, lacking proximolateral ligament depressions;
    unguals lack dorsolateral longitudinal grooves
appearance:
  integument: scaled
  evidence: inferred
