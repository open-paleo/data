  - name: Galeamopus pabsti
    etymology: Honors Dr. Ben Pabst, who discovered the holotype and led its
      preparation and mounting at the Sauriermuseum Aathal.
    status: valid
    type_species: false
    period:
      name:
        - Late Jurassic
      stage:
        - Kimmeridgian
        - Tithonian
    location:
      country: US
      region: US-WY
      formation: Morrison
      locality: Howe-Scott Quarry
    type_specimen:
      specimen_id:
        - SMA 0011
      specimen_type: holotype
      institution: SMA
      material: Partial skull; 13 cervical and 8 dorsal vertebrae; partial
        sacrum; ribs; both scapulae, coracoids, and humeri; left forearm and
        manus; right ilium and pubis; left ischium and hind limb with pes
    diagnostic_features:
      - Horizontal canal on the maxilla connecting the posterior margin of the
        preantorbital fossa and the ventral margin of the antorbital fenestra
      - Sagittal nuchal crest on the supraoccipital marked by a vertical midline
        groove
      - Anterior cervical vertebrae much taller than wide, with a
        height-to-width ratio greater than 1.2
      - Mid- and posterior cervical vertebrae with a large foramen connecting
        the postzygapophyseal centrodiapophyseal fossa and the
        spinopostzygapophyseal fossa
      - Very robust humerus (robusticity index over 0.33) bearing a laterally
        displaced, rugose tubercle on the concave proximal portion of the
        anterior surface
      - Ascending process of the astragalus with a concave posteroventral
        margin, producing two distinct, rounded posterior processes in ventral
        view
    erected_in: tschopp2017a
