genus: Galeamopus
parent: Diplodocinae
pronunciation:
  phonetic: GAY-lee-uh-MOH-pus
etymology: "From Latin 'galeam' (accusative of 'galea', 'helmet') and 'opus' meaning 'need'; intended as a translation of 'Wil-helm' ('want helmet'), honoring the first names of Utterback and Holland, and alluding to the brittle braincase of the type specimen being in need of a helmet."
description: Galeamopus is a genus of herbivorous diplodocid sauropod dinosaurs.
  It contains two known species - Galeamopus hayi, known from the Late Jurassic
  lower Morrison Formation (Kimmeridgian age, about 155 million years ago) of
  Wyoming, United States, and Galeamopus pabsti, known from Wyoming and Colorado.
  The type species is known from one of the well-preserved diplodocid fossils, a
  nearly complete skeleton with an associated skull.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Dorsoventral height of parietal occipital process low, subequal to less than
    diameter of foramen magnum (unique among Diplodocinae)
  - Basipterygoid processes widely diverging (>60°; unique among Diplodocinae)
  - Ulna to humerus length ratio of more than 0.76 (unique within Diplodocoidea)
  - Distal articular surface for the ulna on the radius reduced and relatively
    smooth (unique within Diplodocidae)
  - Distal condyle of the radius beveled at least 15° to the long axis of the
    shaft (unique within Diplodocinae)
  - Lateral edge of proximal end of tibia forms a pinched out projection
    posterior to the cnemial crest (unique among Diplodocidae)
appearance:
  features:
    - elongate neck
    - whiplash tail
  integument: scaled
  evidence: inferred
