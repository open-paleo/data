genus: Gnathovorax
parent: Herrerasauridae
etymology: From Greek gnathos (jaw) and Latin vorax (voracious, devouring); meaning 'devouring jaw', referring to its predatory nature
description: Gnathovorax is a genus of herrerasaurid saurischian dinosaur from
  the Santa Maria Formation in Rio Grande do Sul, Brazil. The type and only
  species is Gnathovorax cabreirai, described by Pacheco et al. in 2019. The
  type specimen comprises a mostly complete and well-preserved articulated
  skeleton (considered one of the best herrerasaurid skeletons ever discovered),
  which fossilized in close association with rhynchosaur and cynodont remains.
  The discovery of this superb specimen has shed light onto poorly understood
  aspects of herrerasaurid anatomy such as endocranial soft tissues.
locomotion: bipedal
diet: carnivore
