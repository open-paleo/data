genus: Gigantosaurus
parent: Sauropoda
etymology: From Ancient Greek gigas (giant) and sauros (lizard);
  meaning "giant lizard".
pronunciation:
  phonetic: jih-GAN-toe-SOR-us
description: >
  Gigantosaurus is a dubious genus of sauropod dinosaur from the
  Late Jurassic Kimmeridge Clay Formation of England. The type
  species, Gigantosaurus megalonyx, was named and described by
  Harry Govier Seeley in 1869.
diet: herbivore
locomotion: quadrupedal
diagnostic_features:
  - Cervical vertebra centrum very slightly concave anteriorly and very slightly
    convex posteriorly, with interarticular surface approximately 8.5 inches
    deep and circular
  - Large impressed rib facets on each side of the centrum below the pedicles,
    subdivided by a transverse ridge into a small upper and large lower portion
  - Deep large pneumatic-like holes penetrating far into the centrum, lined with
    smooth bone surface, interpreted as possible air-cells
  - Claw-phalanges much compressed from side to side, with rugose convex
    articular surface; 5.5 inches long at base
  - Fibula 27 inches long, somewhat flattened, curved toward tibia, expanded
    laterally at both ends; proximal end reniform, distal end long ovate
  - Tibia proximal end sub-rhomboid and flattened, 9 by 5.5 inches, bearing a
    patelloid prominence
paleoenvironment:
  - marine
appearance:
  integument: armored
  evidence: direct
