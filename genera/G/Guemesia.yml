genus: Guemesia
parent: Brachyrostra
dispute:
  summary: >
    Guemesia was tentatively placed in Brachyrostra by its describers, who
    noted a puzzling mix of majungasaurine and basal-abelisaurid features;
    Pol and colleagues (2024) recovered it within Furileusauria, while
    others suggest it could represent a distinct lineage.
  history:
    - date: "2026-06-30"
      note: >
        Placed at Brachyrostra, the least-inclusive uncontested node (P2).
etymology: Named after Martín Miguel de Güemes, an Argentine independence hero whose death bicentenary was in 2021
pronunciation:
  phonetic: gweh-MAY-see-uh
description: Guemesia is a genus of abelisaurid dinosaur from the Late
  Cretaceous Los Blanquitos Formation of Salta Province, Argentina. The type and
  only species is Guemesia ochoai, known from a nearly complete braincase. It is
  one of the smallest abelisaurids currently known.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Ornamentation of frontals with median row of superficial and large pits
    (autapomorphy)
  - Orbital region of each frontal highly pneumatized by a passage communicating
    the orbital margin of the bone with the dorsal surface of the skull roof
    (autapomorphy)
  - Foramen magnum transversely wider than dorsoventrally tall, forming a
    subrectangular opening
  - Basipterygoid process elongate with distal end posteroventrally oriented and
    projected below basal tubera level
  - Basal tubera delicate and not thickened, distally separated from each other
    by a notch in the basituberal web
appearance:
  integument: scaled
  evidence: inferred
