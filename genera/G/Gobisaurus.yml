genus: Gobisaurus
parent: Ankylosauridae
etymology: From the Gobi Desert (where it was found) combined with Greek sauros (lizard); meaning 'Gobi lizard'
description: Gobisaurus is an extinct genus of herbivorous basal ankylosaurid
  ankylosaur from the Lower Cretaceous of China (Nei Mongol Zizhiqu). The genus
  is monotypic, containing only the species Gobisaurus domoculus.
