genus: Gobisaurus
parent: Ankylosauridae
etymology: From the Gobi Desert (where it was found) combined with Greek sauros
  (lizard); meaning 'Gobi lizard'
description: Gobisaurus is an extinct genus of herbivorous basal ankylosaurid
  ankylosaur from the Lower Cretaceous of China (Nei Mongol Zizhiqu). The genus
  is monotypic, containing only the species Gobisaurus domoculus.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Orbits 20% of cranial length and external nares 23% of cranial length (large
    prominent openings)
  - Robust basipterygoid processes not fused to main pterygoid body (unfused
    basipterygoid-pterygoid contact)
  - Elongate premaxillary processes of vomers visible in palatal view
  - Cranium longer than wide (cranial length exceeds cranial width)
  - Lacks discernible cranial sculpturing over antorbital area
  - Maximum premaxillary rostrum width greater than distance between the
    posteriormost maxillary teeth
