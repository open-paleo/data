genus: Gilmoreosaurus
parent: Hadrosauromorpha
pronunciation:
  phonetic: GIL-mohr-o-SAWR-us
etymology: Charles Whitney Gilmore's lizard; named in honor of American paleontologist Charles Whitney Gilmore, combined with Greek sauros (lizard)
description: Gilmoreosaurus is a genus of hadrosauromorphan dinosaur from the
  Late Cretaceous of Asia. The type species is Gilmoreosaurus mongoliensis,
  known from the Iren Dabasu Formation of Inner Mongolia, of latest Campanian
  to early Maastrichtian age. Additional specimens have been described as
  distinct species, including G. atavus from the Khodzhakul Formation of
  Uzbekistan, and G. arkhangelskyi from the Bissekty Formation, also of
  Uzbekistan. However, these are based on very fragmentary remains, and their
  classification is dubious. An additional species, G. kysylkumense, also from
  the Bissekty Formation, is sometimes included, though it has also been
  referred to the related genus Bactrosaurus.
diet: herbivore
locomotion: facultative
diagnostic_features:
  - Paddle-shaped postacetabular process of the ilium, less than 70% of the
    length of the iliac central plate.
  - Ilium combining an ischial tuberosity with a supraacetabular process whose
    apex lies posterodorsal to the ischial peduncle (a unique combination
    within Hadrosauroidea).
  - Manual phalanx III-1 with a strongly asymmetrical distal articular surface.
paleoenvironment:
  - fluvial
appearance:
  integument: scaled
  evidence: inferred
