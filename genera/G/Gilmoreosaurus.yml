genus: Gilmoreosaurus
parent: Hadrosauroidea
etymology: Charles Whitney Gilmore's lizard
description: Gilmoreosaurus is a genus of hadrosauromorphan dinosaur from the
  Late Cretaceous of Asia. The type species is Gilmoreosaurus mongoliensis,
  known from the Iren Dabasu Formation of Inner Mongolia, dating to 96 million
  years ago. Additional specimens have been described as distinct species,
  including G. atavus from the Khodzhakul Formation of Uzbekistan, and G.
  arkhangelskyi from the Bissekty Formation, also of Uzbekistan. However, these
  are based on very fragmentary remains, and their classification is dubious. An
  additional species, G. kysylkumense, also from the Bissekty Formation, is
  sometimes included, though it has also been referred to the related genus
  Bactrosaurus.
diet: herbivore
