genus: Gilmoreosaurus
parent: Hadrosauroidea
pronunciation:
  phonetic: GIL-mohr-o-SAWR-us
etymology: Charles Whitney Gilmore's lizard; named in honor of American paleontologist Charles Whitney Gilmore, combined with Greek sauros (lizard)
description: Gilmoreosaurus is a genus of hadrosauromorphan dinosaur from the
  Late Cretaceous of Asia. The type species is Gilmoreosaurus mongoliensis,
  known from the Iren Dabasu Formation of Inner Mongolia, dating to 96 million
  years ago. Additional specimens have been described as distinct species,
  including G. atavus from the Khodzhakul Formation of Uzbekistan, and G.
  arkhangelskyi from the Bissekty Formation, also of Uzbekistan. However, these
  are based on very fragmentary remains, and their classification is dubious. An
  additional species, G. kysylkumense, also from the Bissekty Formation, is
  sometimes included, though it has also been referred to the related genus
  Bactrosaurus.
diet: herbivore
locomotion: facultative
diagnostic_features:
  - Maxillary dental series with only 29 vertical tooth rows in adults.
  - Maxillary apex of triangular outline located near mid-length of bone.
  - Maxillary teeth spatulate with a low, sharp-edged median carina and
    papillae present on all teeth of the maxillary series.
  - Dorsal vertebrae with relatively short spinous processes (approximately
    2.25 times centrum height) without transverse club-shaped thickening, and
    centra with a longitudinal ventral keel.
  - Sacral spinous processes broad fore-aft (widest measuring 82 mm) without
    upward thickening, with posterior sacral centra traversed by a median
    longitudinal ventral channel.
  - Scapula with a nearly straight upper border and only moderately expanded
    blade; predentary strongly U-shaped with a transverse ventral depression
    at the anterior end and no posteriorly directed median process.
paleoenvironment:
  - fluvial
appearance:
  integument: scaled
  evidence: inferred
