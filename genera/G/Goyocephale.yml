genus: Goyocephale
parent: Pachycephalosaurinae
pronunciation:
  phonetic: GOH-yo-SEF-a-lee
etymology: From Mongolian goyo (decorated, ornate) and Ancient Greek kephale
  (head); meaning 'decorated head'
description: Goyocephale is an extinct genus of pachycephalosaurian
  ornithischian that lived in Mongolia during the Late Cretaceous about 76
  million years ago. It was first described in 1982 by Altangerel Perle, Teresa
  Maryańska and Halszka Osmólska for a disarticulated skeleton with most of a
  skull, part of the forelimb and hindlimb, some of the pelvic girdle, and some
  vertebrae. Perle et al. named the remains Goyocephale lattimorei, from the
  Mongolian гоё (goyo), meaning "decorated", and the Ancient Greek κεφαλή
  (kephale), for head. The species name honors Owen Lattimore.
diet: herbivore
locomotion: bipedal
diagnostic_features:
  - Supratemporal fenestra longitudinally oval with narrow interfenestral bridge
    about one third the transverse width of the fenestra
  - Occiput weakly concave with a relatively small occipital condyle
  - Ventral maxillary edge weakly arched laterally along its posterior portion
  - Medial portion of cranial roof indistinctly ornamented
  - Sacrum includes only four weakly coossified vertebrae
  - Dorsal surface of preacetabular process of ilium flat and bent angularly
    along medial and lateral margins; medial iliac flange short
    anteroposteriorly; postacetabular process straight and subrectangular in
    lateral view
paleoenvironment:
  - fluvial
appearance:
  features:
    - enlarged caniniform teeth
    - cranial bosses
  integument: scaled
  evidence: inferred
