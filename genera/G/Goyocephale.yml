genus: Goyocephale
parent: Pachycephalosauria
etymology: From Mongolian goyo (decorated, ornate) and Ancient Greek kephale (head); meaning 'decorated head'
description: Goyocephale is an extinct genus of pachycephalosaurian
  ornithischian that lived in Mongolia during the Late Cretaceous about 76
  million years ago. It was first described in 1982 by Altangerel Perle, Teresa
  Maryańska and Halszka Osmólska for a disarticulated skeleton with most of a
  skull, part of the forelimb and hindlimb, some of the pelvic girdle, and some
  vertebrae. Perle et al. named the remains Goyocephale lattimorei, from the
  Mongolian гоё (goyo), meaning "decorated", and the Ancient Greek κεφαλή
  (kephale), for head. The species name honours Owen Lattimore.
diet: herbivore
locomotion: bipedal
