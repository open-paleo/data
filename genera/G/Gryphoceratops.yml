genus: Gryphoceratops
parent: Leptoceratopsidae
etymology: From Greek 'gryphos' meaning 'griffin' (a mythological creature) and 'keratops' meaning 'horned face' (from 'keras' meaning 'horn' and 'ops' meaning 'face'), meaning 'griffin horned face'.
pronunciation:
  phonetic: GRIF-o-SEH-ruh-tops
description: Gryphoceratops is an extinct genus of leptoceratopsid ceratopsian
  dinosaur known from the Late Cretaceous of Alberta, southern Canada.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Deepest dentary at midpoint relative to tooth row length among all
    leptoceratopsids
  - Sigmoidally curved posterior margin of the predentary symphysial contact
    that terminates as a butt suture almost perpendicular to the ventral dentary
    margin at the midpoint of the tooth row
  - Dentary ramus proportionally much shorter and deeper than all other
    leptoceratopsids
appearance:
  integument: scaled
  evidence: inferred
