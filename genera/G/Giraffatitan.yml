genus: Giraffatitan
parent: Brachiosauridae
etymology: Titanic giraffe; from the animal name giraffe and Greek Titan,
  referring to its enormous size and giraffe-like long neck
description: Giraffatitan is a genus of sauropod dinosaur that lived during the
  late Jurassic Period (Kimmeridgian-Tithonian stages) in what is now Lindi
  Region, Tanzania. Only one species is known, G. brancai, named in honor of
  German paleontologist Wilhelm von Branca, who was a driving force behind the
  expedition that discovered it in the Tendaguru Formation. Giraffatitan brancai
  was originally described by German paleontologist Werner Janensch as a species
  of the North American sauropod Brachiosaurus from the Morrison Formation, as
  Brachiosaurus brancai. Recent research shows that the differences between the
  type species of Brachiosaurus and the Tendaguru material are so large that the
  African material should be placed in a separate genus.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - coastal
diagnostic_features:
  - Gracile overall build; 25 presacrals and 12 dorsals
  - Mid dorsal centra approximately same length as posterior dorsal centra
  - Anterior dorsal spines and transverse processes much taller and wider than
    those of posterior dorsals, forming shoulder withers
  - Neural arches short vertically and fore and aft; transversely broad
    transverse processes forming a shallow V
  - Dorsal column less than twice humerus length and short relative to vertebra
    height; body mass relatively modest relative to limbs
  - Dorsal centra pleurocoels moderate in size
appearance:
  features:
    - elongate neck
  integument: scaled
  evidence: inferred
