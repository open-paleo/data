genus: Giraffatitan
parent: Brachiosauridae
etymology: Titanic giraffe; from the animal name giraffe and Greek Titan, referring to its enormous size and giraffe-like long neck
description: Giraffatitan is a genus of sauropod dinosaur that lived during the
  late Jurassic Period (Kimmeridgian–Tithonian stages) in what is now Lindi
  Region, Tanzania. Only one species is known, G. brancai, named in honor of
  German paleontologist Wilhelm von Branca, who was a driving force behind the
  expedition that discovered it in the Tendaguru Formation. Giraffatitan brancai
  was originally described by German paleontologist Werner Janensch as a species
  of the North American sauropod Brachiosaurus from the Morrison Formation, as
  Brachiosaurus brancai. Recent research shows that the differences between the
  type species of Brachiosaurus and the Tendaguru material are so large that the
  African material should be placed in a separate genus.
diet: herbivore
locomotion: quadrupedal
