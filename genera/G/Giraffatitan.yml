erected_in: paul1988b
species:
  - name: Giraffatitan brancai
    etymology: "Named for Wilhelm von Branca, director of the Museum für Naturkunde
      in Berlin and a driving force behind the Tendaguru expedition that
      recovered the holotype material."
    pronunciation:
      phonetic: BRAHN-kah-eye
    status: valid
    type_species: true
    period:
      name:
        - Late Jurassic
      stage:
        - Kimmeridgian
        - Tithonian
    location:
      country: TZ
      locality: Site S
      region: TZ-12
      formation: Tendaguru
      member: Middle Dinosaur
      notes: Bussert and colleagues (2009) raised Tendaguru to formation rank and
        renamed its Middle Saurian Bed the Middle Dinosaur Member, placing
        Site S within it. Taylor (2009) gives only a species-wide range
        across the Middle and Upper members.
    type_specimen:
      specimen_id: [ MB.R.2180 ]
      specimen_type: lectotype
      institution: ZMB
      material: Skull and cervical vertebrae 2-7.
      completeness: partial
    size:
      hip_height_m:
        min: 4
        max: 4
      length_m:
        min: 21.8
        max: 26.0
      weight_kg:
        min: 14800
        max: 78258
    erected_as: Brachiosaurus brancai
    erected_in: janensch1914a
    described_in: taylor2009a
notable_specimens:
  - specimen_id: [HMN XV2]
    institution: ZMB
    species: Giraffatitan brancai
    category: largest-individual
    significance: "Largest known individual of the taxon, represented by a fibula 13 percent larger than the corresponding bone of the subadult paralectotype SII; it shows the animal grew beyond the standard size estimates, to roughly 23-26 meters long and about 40-48 metric tons."
    references: [paul1988b, taylor2011b]
pronunciation:
  phonetic: ji-raf-a-tie-tan
references:
  - id: janensch1914a
  - id: paul1988b
  - id: taylor2009a
    notes: Separates Giraffatitan generically from Brachiosaurus and gives the
      revised diagnosis distinguishing the two.
  - id: taylor2011b
    notes: Corrects the lectotype designation of the 2009 re-evaluation,
      exchanging lectotype and paralectotype and giving their current numbers
      as MB.R.2180 and MB.R.2181.
  - id: jones2026b
    notes: Source of the hip height estimate, and the appearance features.
  - id: bussert2009a
    notes: Raises Tendaguru to formation rank and places Site S, which yielded
      the lectotype, in its Middle Dinosaur Member.
