genus: Gongbusaurus
parent: Ornithischia
etymology: "Named for the imperial Chinese ministry of public works (gong bu),
  honoring the Tang dynasty poet Du Fu who served in that ministry after 760 AD
  as a 'junior consultant' (shi yi), combined with Greek 'sauros' meaning
  'lizard'."
pronunciation:
  phonetic: GUNG-boo-SOR-us
description: Gongbusaurus is a genus of ornithischian, perhaps ornithopod,
  dinosaur that lived between about 160 and 157 million years ago, in the Late
  Jurassic period. A small herbivore, it is very poorly known. Two species have
  been assigned to it, but as the original name is based on teeth, there is no
  concrete evidence to connect the two species. Its fossils have been found in
  China.
dispute:
  summary: >
    Gongbusaurus is based on isolated teeth from the Jurassic of China,
    and the type species is an indeterminate basal ornithischian (Jones,
    2026); a second referred species may represent a separate taxon. It
    was formerly placed in the deprecated Fabrosauridae.
  history:
    - date: "2026-06-29"
      note: Reparented from the deprecated Fabrosauridae to Ornithischia incertae sedis; tooth-based nomen dubium.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Premaxillary tooth crown rounded, slightly curved posteriorly, oval,
    asymmetrical, and laterally convex with a subcircular root cross-section
  - Anterior and posterior carinae bear laminar ridges with very small, tightly
    packed denticles
  - Lingual side of premaxillary crown ornamented with folded laminae compressed
    from root to apex
  - Cheek tooth laterally compressed with both sides enamel-covered and a medial
    inflated ridge extending to form a sharp medial cusp
  - Cheek tooth lacks both a cingulum and longitudinal laminae on the crown
appearance:
  integument: scaled
  evidence: inferred
