genus: Gongbusaurus
parent: Ornithischia
placement: incertae sedis
etymology: "Named for the imperial Chinese ministry of public works (gong bu),
  honoring the Tang dynasty poet Du Fu who served in that ministry after 760 AD
  as a 'junior consultant' (shi yi), combined with Greek 'sauros' meaning
  'lizard'."
pronunciation:
  phonetic: GUNG-boo-SOR-us
description: Gongbusaurus is a genus of ornithischian, perhaps ornithopod,
  dinosaur that lived between about 160 and 157 million years ago, in the Late
  Jurassic period. A small herbivore, it is very poorly known. Two species have
  been assigned to it, but as the original name is based on teeth, there is no
  concrete evidence to connect the two species. Its fossils have been found in
  China.
dispute:
  summary: >
    Gongbusaurus shiyii was named for two isolated teeth from the Shaximiao
    Formation and first placed in Fabrosauridae (Dong and colleagues, 1983).
    Later reviews treat it as a nomen dubium, an indeterminate ornithischian
    (Weishampel and Witmer, 1990; Norman and colleagues, 2004), and Galton
    (2007) finds the teeth closer to ankylosaurs than to ornithopods. Butler
    and colleagues (2008) and Boyd (2015) exclude it from their analyses as
    a taxon based only on teeth. The referred species "G." wucaiwanensis,
    from Xinjiang, rests on postcranial material whose holotype is now
    unlocated (Butler and colleagues, 2008).
  history:
    - date: "2026-06-29"
      note: Reparented from the deprecated Fabrosauridae to Ornithischia incertae sedis; tooth-based nomen dubium.
    - date: "2026-10-19"
      note: >
        Species status set to nomen dubium, matching the 2026-06-29
        note, following Galton (2007).
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Premaxillary tooth crown rounded, slightly curved posteriorly, oval,
    asymmetrical, and laterally convex with a subcircular root cross-section
  - Anterior and posterior carinae bear laminar ridges with very small, tightly
    packed denticles
  - Lingual side of premaxillary crown ornamented with folded laminae compressed
    from root to apex
  - Cheek tooth laterally compressed with both sides enamel-covered and a medial
    inflated ridge extending to form a sharp medial cusp
  - Cheek tooth lacks both a cingulum and longitudinal laminae on the crown
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "38719"
  - source: wikidata
    id: Q1656761
  - source: gbif
    id: "4571692"
species:
  - name: Gongbusaurus shiyii
    etymology: "Named for the rank of shi yi ('junior consultant') held by the Tang
      dynasty poet Du Fu while working in Sichuan for the imperial ministry of
      public works; the epithet also puns on a secondary meaning of 'register of
      lost objects', alluding to the teeth being found separately among the
      collected bones."
    status: nomen dubium
    type_species: true
    period:
      name:
        - Middle Jurassic
        - Late Jurassic
      stage:
        - Bajocian
        - Bathonian
        - Callovian
        - Oxfordian
    location:
      country: CN
      locality: Huangtong Elementary School, Duxin Commune
      region: CN-SC
      formation: Shaximiao
      part: upper
    size:
      length_m:
        min: 1.3
        max: 1.5
    type_specimen:
      specimen_id: [ IVPP V9069 ]
      specimen_type: holotype
      institution: IVPP
      material: Complete isolated left premaxillary tooth lacking its root, and a single
        laterally compressed cheek tooth (two isolated teeth total).
      completeness: fragmentary
    erected_in: dong1983a
references:
  - id: dong1983a
    notes: Named Gongbusaurus shiyii for two isolated teeth and placed it in
      Fabrosauridae.
  - id: jones2026a
    notes: Lists the genus among nomina dubia, as an indeterminate basal
      ornithischian.
  - id: weishampel1990a
    notes: Listed Gongbusaurus shiyii among nomina dubia, on two isolated teeth.
  - id: norman2004c
    notes: Listed Gongbusaurus shiyii among nomina dubia and as Ornithischia indet.
  - id: galton2007c
    notes: Called Gongbusaurus shiyii a nomen dubium, probably an ankylosaur rather than an ornithopod.
  - id: butler2008b
    notes: Excluded Gongbusaurus shiyii as a tooth taxon; reported the holotype of 'G.' wucaiwanensis unlocated.
  - id: boyd2015a
    notes: Excluded Gongbusaurus shiyii as of dubious validity, being based solely on two isolated teeth.
