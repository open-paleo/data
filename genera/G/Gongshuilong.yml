genus: Gongshuilong
parent: Saurolophinae
pronunciation:
  phonetic: gohng-SHWAY-long
etymology: From "Gongshui" (the Gong River, near the discovery site in Jiangxi,
  China) and Chinese "long" (dragon); meaning "Gong River dragon".
description: Gongshuilong is an extinct genus of saurolophine hadrosaurid
  dinosaur known from the Late Cretaceous (Maastrichtian age) Lianhe Formation
  of China. The genus contains a single species, Gongshuilong fanwei, known from
  a bonebed representing the disarticulated remains of at least two individuals.
  Gongshuilong is a member of the group Brachylophosaurini within the
  Hadrosauridae, and it is the second member of this otherwise North American
  clade, following Wulagasaurus, found in Asia. It is also the first hadrosaurid
  to be named from fossils found in South China. Gongshuilong is characterized
  by the uniquely elongated and curved neural spines of the vertebrae at the end
  of the tail, forming a tall, sail-like structure.
diet: herbivore
locomotion: facultative
