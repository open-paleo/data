genus: Gannansaurus
parent: Somphospondyli
dispute:
  summary: >
    Gannansaurus is known from very limited material and was placed within
    Somphospondyli, allied to Euhelopus, by its describers (Lu et al., 2013).
    Jones (2026), citing similar anatomy in later-described titanosaurs,
    instead considers it most likely a titanosaur.
  history:
    - date: "2026-06-30"
      note: >
        Placed conservatively at Somphospondyli following the original
        description; the titanosaurian alternative (Jones, 2026) is noted.
etymology: Gannan lizard; named after the Gannan region (Ganzhou Basin) of
  Jiangxi Province, China, combined with Greek sauros (lizard)
pronunciation:
  phonetic: ga-nan-SOR-us
description: Gannansaurus is an extinct genus of somphospondylan sauropod
  dinosaur known from the latest Cretaceous Nanxiong Formation of Ganzhou Basin,
  Jiangxi Province of southern China. It is known from specimen GMNH F10001
  which consists of a single, nearly complete dorsal vertebra and a mid-caudal
  vertebra. Gannansaurus was first named by Lü Junchang, Yi Laiping, Zhong Hui
  and Wei Xuefang in 2013 and the type species is Gannansaurus sinensis.
  Gannansaurus shares some characters with Euhelopus, indicating that it is more
  closely related to it rather than to other titanosauriforms.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Two centroprezygapophyseal lamina fossae, with neural canal and distinct
    openings separately located at the bottom and upper portion of the large
    square-shaped concavity formed by centroprezygapophyseal laminae and dorsal
    margin of the centrum.
  - Large infraparapophysial fossa.
  - Large, round lateral concavity with an eye-shaped pleurocoel inset,
    occupying 65% the length of the centrum.
  - PCPL (posterior centroparapophysial lamina) and ACPL (anterior
    centroparapophysial lamina) weakly developed.
  - PCDL (posterior centrodiapophysial lamina) separated into two branches by an
    infradiapophysial fossa dorsally.
  - Wide and shallow ventral concavity on the caudal vertebra.
appearance:
