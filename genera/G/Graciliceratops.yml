genus: Graciliceratops
parent: Neoceratopsia
pronunciation:
  phonetic: GRAS-i-li-SAYR-a-tops
etymology: Slender horned face; from Latin gracilis (slender) and Greek keras
  (horn) and ops (face)
description: Graciliceratops is a genus of neoceratopsian dinosaurs that lived
  in Asia during the Late Cretaceous period.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Very slender median and posterior parietal frill margins, much more delicate
    than in related taxa
  - High tibiofemoral ratio (1.2:1)
  - Frill extends well posterior to occiput, with lateral margins formed by a
    well-developed posterior process of the squamosal
  - Well demarcated scar on the jugal and quadratojugal indicating a large
    epijugal was present
appearance:
  features:
    - keratinous beak
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "67673"
  - source: wikidata
    id: Q133140
  - source: gbif
    id: "4823257"
  - source: eol
    id: "4531827"
species:
  - name: Graciliceratops mongoliensis
    etymology: "Named for Mongolia, the country where the holotype was discovered in
      the Bayan Shireh Formation."
    status: valid
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Cenomanian
        - Turonian
        - Coniacian
        - Santonian
      resolution: unit
    location:
      country: MN
      locality: Shiregin Gashun
      region: MN-053
      formation: Baynshire
      coordinates:
        - 43.938889
        - 101.331947
      notes: No age has been published for this taxon independently of its
        formation. Shiregin Gashun lies roughly 600 km west of the main Bayan
        Shireh outcrops and is only "often included as a western extension" of
        them; Currie and Eberth (1993) report "little overlap between the faunas
        of the two areas, indicating that the Shiregin Gashun sites were
        temporally and/or environmentally distinct". No section has been
        published at the locality.
    size:
      length_m:
        min: 0.6
        max: 2.0
      weight_kg:
        min: 2
        max: 9
    type_specimen:
      specimen_id: [ ZPAL MgD-I/156 ]
      specimen_type: holotype
      institution: ZPAL
      material: Articulated skeleton, immature individual (disarticulated presacral
        neural arches and unfused sacral centra), including partial skull.
      completeness: partial
    erected_in: sereno2000a
references:
  - id: sereno2000a
    notes: Erects the genus on the articulated skeleton from Shireegiin Gashuun.
      Names no formation, and gives a Campanian age only in a summary table.
  - id: arbour2015a
    notes: Places Shiregin Gashun in the Bayanshiree Formation, for Maleevus from
      the same locality.
  - id: weishampel2004a
    notes: Lists the locality's fauna, including this species, under the
      Shireegiin Gashuun Formation and gives it a Cenomanian-Santonian age.
  - id: jones2026a
    notes: Source of the appearance features.
