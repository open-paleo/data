genus: Graciliceratops
parent: Neoceratopsia
pronunciation:
  phonetic: GRAS-i-li-SAYR-a-tops
etymology: Slender horned face; from Latin gracilis (slender) and Greek keras
  (horn) and ops (face)
description: Graciliceratops is a genus of neoceratopsian dinosaurs that lived
  in Asia during the Late Cretaceous period.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Very slender median and posterior parietal frill margins, much more delicate
    than in related taxa
  - High tibiofemoral ratio (1.2:1)
  - Frill extends well posterior to occiput, with lateral margins formed by a
    well-developed posterior process of the squamosal
  - Well demarcated scar on the jugal and quadratojugal indicating a large
    epijugal was present
appearance:
  features:
    - keratinous beak
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "67673"
  - source: wikidata
    id: Q133140
  - source: gbif
    id: "4823257"
  - source: eol
    id: "4531827"
species:
  - name: Graciliceratops mongoliensis
    etymology: "Named for Mongolia, the country where the holotype was discovered in
      the Bayan Shireh Formation."
    status: valid
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Cenomanian
        - Turonian
        - Coniacian
        - Santonian
      resolution: unit
    location:
      country: MN
      locality: Shireegiin Gashuun
      region: MN-053
      formation: Bayanshiree
      notes: Maryanska and Osmolska (1975) name the beds only as an informal
        Sheeregeen Gashoon formation, and Maryanska (1977) then assigns them
        to the Bayn Shireh svita. Jerzykiewicz and Russell (1991) list the
        locality among the formation's own, and Currie and Eberth (1993)
        keep it in a separate faunal column, finding little overlap between
        the two areas' faunas. Averianov and Sues (2020) still write of
        Sheeregeen Gashoon beds in quotation marks. No age has been
        published for this taxon independently of its formation.
    size:
      length_m:
        min: 0.6
        max: 2.0
      weight_kg:
        min: 2
        max: 9
    type_specimen:
      specimen_id: [ ZPAL MgD-I/156 ]
      specimen_type: holotype
      institution: ZPAL
      material: Articulated skeleton, immature individual (disarticulated presacral
        neural arches and unfused sacral centra), including partial skull.
      completeness: partial
    erected_in: sereno2000a
references:
  - id: sereno2000a
    notes: Erects the genus on the articulated skeleton from Shireegiin Gashuun.
      Names no formation, and gives a Campanian age only in a summary table.
  - id: arbour2015a
    notes: Places Shiregin Gashun in the Bayanshiree Formation, for Maleevus from
      the same locality.
  - id: weishampel2004a
    notes: Lists the locality's fauna, including this species, under the
      Shireegiin Gashuun Formation and gives it a Cenomanian-Santonian age.
  - id: jones2026a
    notes: Source of the appearance features.
  - id: jerzykiewicz1991a
    notes: Lists Shiregin Gashun among the Bayn Shiren Formation's localities,
      and reports the unit from the Shiregin Gashun depression.
  - id: maryańska1977a
    notes: Assigns the Sheeregeen Gashoon sediments to the Bayn Shireh svita, two
      years after co-coining the informal name for them.
  - id: averianov2020a
    notes: Still treats the beds as an informal Sheeregeen Gashoon unit rather
      than assigning them to a formation.
