genus: Gastonia
parent: Nodosauridae
description: Gastonia is a genus of herbivorous ankylosaurian dinosaur from the
  Early Cretaceous of North America, around 139 to 125.77 million years ago. It
  is often considered a nodosaurid closely related to Polacanthus. Gastonia has
  a sacral shield and large shoulder spikes.
