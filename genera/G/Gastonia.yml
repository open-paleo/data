genus: Gastonia
parent: Nodosauridae
pronunciation:
  phonetic: gas-TOH-nee-a
etymology: Named for American fossil collector Robert Gaston, who discovered the
  specimens.
description: Gastonia is a genus of herbivorous ankylosaurian dinosaur from the
  Early Cretaceous of North America, around 139 to 125.77 million years ago. It
  is often considered a nodosaurid closely related to Polacanthus. Gastonia has
  a sacral shield and large shoulder spikes.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Three sacral vertebrae (vs. four in Polacanthus); ilia with slender,
    anteriorly diverging preacetabular processes (vs. short and nearly parallel
    in Polacanthus).
  - Anterior trochanter fused to greater trochanter forming a ridge, unlike free
    anterior trochanter in Hoplitosaurus.
  - Tibia considerably shorter and more robust than in Polacanthus and
    Hylaeosaurus, with strongly flaring proximal and distal ends.
  - Dorsal armor uniquely characterized by scutes bordered by radially directed
    ridges around their margins.
  - Skull unique among all known ankylosaurs in having a broad premaxillary
    notch, posteriorly placed narial openings, and basisphenoid with elongate
    basipterygoid processes forming a gliding joint with the unfused pterygoids.
appearance:
  features:
    - body armor
    - osteoderms
    - shoulder spikes
    - tail spikes
  integument: armored
  evidence: direct
