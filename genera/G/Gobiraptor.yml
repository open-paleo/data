genus: Gobiraptor
parent: Heyuanninae
pronunciation:
  phonetic: GOH-bee-RAP-tor
etymology: From the Gobi Desert (where it was found) combined with Latin raptor (thief, plunderer); meaning 'Gobi thief'
description: Gobiraptor is a genus of oviraptorid maniraptoran dinosaur from the
  Maastrichtian-aged Nemegt Formation of Mongolia. The type and only species is
  Gobiraptor minutus, known from a single incomplete specimen-the holotype MPC-D
  102/111. It has been found not to be closely related to the other oviraptorids
  it shared its environment with.
diet: omnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Flat articular surface for the quadratojugal on the quadrate
  - Extremely thickened rostrodorsal end of the mandibular symphysis with a
    caudal expansion of its dorsal surface
  - Rudimentary lingual triturating shelf on each dentary bearing small occlusal
    foramina
  - Weakly developed lingual ridge on each lingual shelf
  - Rostral end of the coronoid bone wedging into the ventral surface of the
    dorsal ramus of the dentary
appearance:
  features:
    - keratinous beak
  integument: feathered
  evidence: direct
