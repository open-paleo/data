genus: Gigantoscelus
parent: Sauropodomorpha
placement: incertae sedis
pronunciation:
  phonetic: jy-GAN-to-SEE-lus
etymology: giant shin
description: Gigantoscelus is a dubious genus of basal sauropodomorph dinosaur
  from the Early Jurassic of South Africa.
dispute:
  summary: >
    Gigantoscelus molengraaffi is a nomen dubium based on a fragmentary
    femur from the Late Triassic of southern Africa (Galton and Upchurch,
    2004).
  history:
    - date: "2026-06-29"
      note: Reparented from the deprecated Prosauropoda to Sauropodomorpha incertae sedis; fragmentary nomen dubium.
diet: herbivore
locomotion: bipedal
diagnostic_features:
  - Femur distal width of 20 cm, substantially larger than Massospondylus but
    smaller than Euskelosaurus
  - Inner condyle broad and convex, terminating upward with a high ridge as in
    Euskelosaurus
  - Outer condyle narrow, projecting further backward than the inner condyle,
    with a ridge along the posterior-outer side that projects slightly over the
    outer surface
  - Intercondyloid groove 3.5 cm deep and 3 cm wide between the two condyles
  - Distal articular surface slightly convex and weakly concave in the extension
    of the intercondyloid groove, sloping slightly forward relative to the limb
    axis
paleoenvironment:
  - arid
  - fluvial
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "56616"
  - source: wikidata
    id: Q5879472
  - source: gbif
    id: "4821876"
species:
  - name: Gigantoscelus molengraaffi
    etymology: "Honors Prof. Gustaaf Molengraaff, Dutch geologist, whose
      investigations of the Transvaal Karroo beds led to important
      stratigraphic results, per van Hoepen (1916)."
    status: valid
    type_species: true
    period:
      name:
        - Early Jurassic
      stage:
        - Hettangian
        - Sinemurian
    location:
      country: ZA
      region: ZA-LP
      formation: Bushveld Sandstone
      coordinates:
        - -23.833332
        - 28.25
    type_specimen:
      specimen_id: [ TM 65 ]
      specimen_type: holotype
      institution: DNMNH
      material: Distal end of a right femur.
      completeness: fragmentary
    erected_in: vanhoepen1916a
references:
  - id: vanhoepen1916a
  - id: galton2004a
    notes: Treated Gigantoscelus as a nomen dubium.
