genus: Gobivenator
parent: Troodontidae
pronunciation:
  phonetic: GOH-bee-ven-AY-tor
etymology: From the Gobi Desert (where it was found) combined with Latin venator (hunter); meaning 'Gobi hunter'
description: Gobivenator is an extinct genus of troodontid theropod dinosaur
  known from the late Campanian Djadokhta Formation of central Gobi Desert,
  Mongolia. It contains a single species, Gobivenator mongoliensis. G.
  mongoliensis is known from a single individual, which represents the most
  complete specimen of a Late Cretaceous troodontid currently known.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - arid
diagnostic_features:
  - Fossa on the surangular in front of the posterior surangular foramen.
  - Pointed anterior end of the fused parietal that wedges into a V-shaped notch
    between the contralateral frontals.
  - Gracile anterior, posterior, and ventral rami of the postorbital.
  - Dorsoventrally elongated proximal chevrons up to 4.5 times as long as the
    height of the preceding caudal vertebrae.
  - Interfenestral bar between internal antorbital and maxillary fenestrae
    recessed medially from lateral surface of the maxilla.
  - Posterior margin of external naris lying farther anteriorly than the
    anterior border of the antorbital fossa.
