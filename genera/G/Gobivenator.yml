genus: Gobivenator
parent: Troodontidae
etymology: From the Gobi Desert (where it was found) combined with Latin venator (hunter); meaning 'Gobi hunter'
description: Gobivenator is an extinct genus of troodontid theropod dinosaur
  known from the late Campanian Djadokhta Formation of central Gobi Desert,
  Mongolia. It contains a single species, Gobivenator mongoliensis. G.
  mongoliensis is known from a single individual, which represents the most
  complete specimen of a Late Cretaceous troodontid currently known.
diet: carnivore
locomotion: bipedal
