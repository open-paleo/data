genus: Guaibasaurus
parent: Sauropodomorpha
pronunciation:
  phonetic: GWIE-bah-SAWR-us
etymology: Named after the Guaíba River region of Rio Grande do Sul, Brazil,
  where it was discovered, combined with Greek sauros (lizard); meaning 'Guaíba
  lizard'
description: Guaibasaurus is an extinct genus of basal saurischian dinosaur
  known from the Late Triassic Caturrita Formation of Rio Grande do Sul,
  southern Brazil. Most analyses recover it as a sauropodomorph, although there
  are some suggestions that it was a theropod instead. In 2016 Gregory S. Paul
  estimated it at around 2 meters long (6.6 ft) and 10 kg (22 lbs), whereas in
  2020 Molina-Pérez and Larramendi listed it at 3 meters (10 ft) and 35 kg (77
  lbs).
dispute:
  summary: >
    Guaibasaurus candelariensis has an unstable position: originally a
    basal theropod, it is recovered as a basal sauropodomorph by recent
    analyses (Novas and others, 2011, within Guaibasauridae; Hechenleitner
    and others, 2025, as sister to Bagualosauria). The family
    Guaibasauridae is not adopted here, being contested and effectively
    monotypic.
  history:
    - date: "2026-06-29"
      note: Placed at Sauropodomorpha incertae sedis (basal) following the recent sauropodomorph hypotheses (P2); the basal-theropod alternative and the deprecated Guaibasauridae are recorded.
locomotion: bipedal
paleoenvironment:
  - fluvial
diet: omnivore
appearance:
  integument: scaled
  evidence: inferred
diagnostic_features:
  - Midanterior dorsal neural arches with large pneumatic cavities opening below
    the base of the transverse process
  - Undivided infradiapophyseal lamina combined with a well-developed
    parapophyseal-prezygapophyseal lamina and a deep fossa below it
  - Acetabulum nearly closed, with only incipient reduction of the medial wall,
    plus an extremely large crista supracetabularis and a well-developed fossa
    brevis
  - Sacral centra of strongly unequal size, the anterior centrum about twice the
    volume of the next
  - Femur with a small anterior trochanter, a dorsolateral ridge above the
    anterior trochanter, and no trochanteric shelf
  - Calcaneum transversely narrow with a pronounced ventromedial process;
    metatarsal V strongly reduced and without phalanges while metatarsal I is
    unreduced
