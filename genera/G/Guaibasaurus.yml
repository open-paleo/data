genus: Guaibasaurus
parent: Guaibasauridae
description: Guaibasaurus is an extinct genus of basal saurischian dinosaur
  known from the Late Triassic Caturrita Formation of Rio Grande do Sul,
  southern Brazil. Most analyses recover it as a sauropodomorph, although there
  are some suggestions that it was a theropod instead. In 2016 Gregory S. Paul
  estimated it at around 2 meters long (6.6 ft) and 10 kg (22 lbs), whereas in
  2020 Molina-Pérez and Larramendi listed it at 3 meters (10 ft) and 35 kg (77
  lbs).
locomotion: bipedal
diet: omnivore
