genus: Gualicho
parent: Tyrannosauroidea
description: Gualicho is an enigmatic genus of theropod dinosaurs. The type
  species is Gualicho shinyae. It lived in what is now northern Patagonia, on
  what was then a South American island continent split off from the
  supercontinent Gondwana. The fossils were found in the Huincul Formation,
  dating to the late Cenomanian-early Turonian age of the upper Cretaceous
  Period, around 91 million years ago.
