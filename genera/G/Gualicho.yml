genus: Gualicho
parent: Avetheropoda
placement: incertae sedis
etymology: Named in reference to the gualichu, a malevolent supernatural entity in the mythology of the Mapuche and other Patagonian peoples
pronunciation:
  phonetic: gwah-LEE-cho
description: Gualicho is an enigmatic genus of theropod dinosaurs. The type
  species is Gualicho shinyae. It lived in what is now northern Patagonia, on
  what was then a South American island continent split off from the
  supercontinent Gondwana. The fossils were found in the Huincul Formation,
  dating to the late Cenomanian-early Turonian age of the upper Cretaceous
  Period, around 91 million years ago.
dispute:
  summary: >
    The position of Gualicho shinyae is highly unstable. Apesteguía et al. (2016)
    recovered it as a neovenatorid carcharodontosaurian (an allosauroid) sister to
    Deltadromeus, arguing its tyrannosaurid-like didactyl manus is convergent rather
    than evidence of tyrannosauroid affinity; other analyses instead place it within
    Coelurosauria (Porfiri et al., 2018) or as an early-branching ornithomimosaur
    alongside Deltadromeus (Delcourt et al., 2025), and ceratosaurian traits have also
    been noted (Jones and Viola, 2026). Because these hypotheses span Allosauroidea and
    Coelurosauria, it is placed conservatively at Avetheropoda incertae sedis. It is
    not a tyrannosauroid.
  history:
    - date: "2026-06-25"
      note: >
        Removed from Tyrannosauroidea and placed conservatively at
        Avetheropoda incertae sedis, pending resolution of its unstable
        position.
    - date: "2026-07-02"
      note: >
        Confirmed placement at Avetheropoda incertae sedis; the
        allosauroid-versus-coelurosaur-versus-ornithomimosaur position
        remains unresolved.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Posterior dorsal vertebrae very elongated with slit-like pneumatic openings
  - Scapular blade narrow with sinuous rostral margin marked by a shallow notch
    between the acromion process and blade
  - First and second metacarpals co-ossified proximally; third metacarpal
    reduced to a splint; forelimb functionally didactyl
  - Pubes with little or no pubic apron and blade-like boot
  - Fibula with large fossa and accessory flange on proximocaudal corner, and
    ridge-like m. iliofibularis tubercle
  - Third metatarsal with expanded proximal articulation with posterior edge
    wider than rostral edge (antarctometatarsal condition)
