genus: Glacialisaurus
parent: Massospondylidae
etymology: From Latin glacialis, 'icy' or 'frozen', + Greek sauros, 'lizard';
  means 'icy lizard' or 'frozen lizard', referring to its discovery in
  Antarctica
pronunciation:
  phonetic: glay-see-al-eye-sor-us
description: Glacialisaurus is a genus of sauropodomorph dinosaur from the Early
  Jurassic period of Antarctica. It is known from two specimens; the holotype
  (name-bearing specimen), a partial tarsus (ankle) and metatarsus, and a
  partial left femur (thigh bone). The fossils were collected by a team led by
  paleontologist William R. Hammer during a 1990-91 field expedition to the
  central region of the Transantarctic Mountains. They come from sedimentary
  rocks of the Hanson Formation and date to the Pliensbachian stage of the Early
  Jurassic, around 186 to 182 million years ago.
locomotion: bipedal
paleoenvironment:
  - fluvial
  - polar
diet: herbivore
diagnostic_features:
  - Robust medial epicondylar ridge on the distal femur
  - Robust adductor ridge extending from the proximal end of the femoral medial
    condyle
  - Second metatarsal with an anterior border that is weakly convex in proximal
    aspect
  - Hypertrophied lateral plantar flange on the proximal end of metatarsal II
  - Second metatarsal gently twisted medially about its long axis at the distal
    end of its shaft
  - Second metatarsal with a medial distal condyle that is more robust and
    well-developed than the lateral distal condyle
