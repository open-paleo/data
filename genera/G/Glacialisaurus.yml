genus: Glacialisaurus
parent: Massospondylidae
description: Glacialisaurus is a genus of sauropodomorph dinosaur from the Early
  Jurassic period of Antarctica. It is known from two specimens; the holotype
  (name-bearing specimen), a partial tarsus (ankle) and metatarsus, and a
  partial left femur (thigh bone). The fossils were collected by a team led by
  paleontologist William R. Hammer during a 1990–91 field expedition to the
  central region of the Transantarctic Mountains. They come from sedimentary
  rocks of the Hanson Formation and date to the Pliensbachian stage of the Early
  Jurassic, around 186 to 182 million years ago.
locomotion: bipedal
diet: herbivore
