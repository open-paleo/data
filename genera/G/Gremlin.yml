genus: Gremlin
parent: Leptoceratopsidae
etymology: "Named for the gremlin, a small troublesome mythical creature."
description: Gremlin is a genus of leptoceratopsid ceratopsian dinosaurs from the
  Campanian stage of the Cretaceous period, 77 million years ago. It contains one
  species, Gremlin slobodorum, named in 2023 by Michael J. Ryan and colleagues from
  a frontal bone found in the Oldman Formation of Alberta. It can be distinguished
  from other leptoceratopsids by a ridge on the frontal that runs transversely from
  the midline of the skull outwards to the top end of the orbit.
diet: herbivore
locomotion: quadrupedal
