genus: Gremlin
parent: Leptoceratopsidae
etymology: "Named for the gremlin, a small troublesome mythical creature."
pronunciation:
  phonetic: GREM-lin
description: Gremlin is a genus of leptoceratopsid ceratopsian dinosaurs from
  the Campanian stage of the Cretaceous period, 77 million years ago. It
  contains one species, Gremlin slobodorum, named in 2023 by Michael J. Ryan
  and colleagues from a frontal bone found in the Oldman Formation of Alberta.
diet: herbivore
locomotion: quadrupedal
diagnostic_features:
  - Transverse ridge on the frontal extends across the dorsal surface from the
    medial margin to the anterodorsal border of the orbit.
  - Transverse ridge separated from the raised, crescentic anterior border of
    the frontal depression by a narrow band of smooth bone that continues as
    the smooth surface of the depression.
  - Transverse ridge and anterior margin of the frontal depression both diverge
    from the same point on the slightly raised medial frontal margin.
  - Transverse ridge marks the point of maximum thickness of the frontal, from
    which the bone tapers anteriorly and sharply posteriorly across the frontal
    depression.
paleoenvironment:
  - fluvial
  - coastal
appearance:
  integument: scaled
  evidence: inferred
