genus: Garrigatitan
parent: Lirainosaurinae
pronunciation:
  phonetic: GARR-ih-guh-TIE-tan
etymology: Garrigue giant; named after garrigue, the type of scrubland habitat in the region of France where it was found, combined with Titan from Greek mythology
description: Garrigatitan is a genus of titanosaurian dinosaur from the late
  Cretaceous Period of the Grès à Reptiles Formation in France. The genus
  contains a single species, Garrigatitan meridionalis.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Hourglass-shaped humeri (proximal and distal thirds of almost the same
    transversal width) in anterior and posterior views
  - Ilium with a broad rounded hollow slightly posterior to the base of the
    pubic peduncle
  - Proximolateral margin of the femur only slightly medially deflected
  - Posterior cervical vertebrae with an anteroposteriorly compressed and
    paddle-shaped neural spine (not wider than the centrum)
  - Posterior cervical vertebrae with postzygapophyses widely separated and with
    laterally oriented articular surfaces
