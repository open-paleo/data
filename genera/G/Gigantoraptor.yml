genus: Gigantoraptor
parent: Caenagnathidae
etymology: From Greek gigas/gigantos, 'giant', + Latin raptor, 'thief/seizer';
  means 'giant thief', referring to its status as the largest known
  oviraptorosaur
description: Gigantoraptor is a genus of large oviraptorosaurian dinosaur that
  lived in Asia during the Late Cretaceous period. It is known from the Iren
  Dabasu Formation of Inner Mongolia, where the first remains were found in
  2005.
diet: omnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Short mandible less than 45% of femoral length, with a fossa on the lateral
    surface of the dentary close to the anterior end and a second fossa bounded
    dorsally by a lateral flange anterodorsal to the external mandibular
    fenestra.
  - Tail composed of opisthocoelous anterior caudal vertebrae, amphicoelous
    middle ones, and procoelous posterior ones, with pleurocoels on most caudal
    vertebrae and a pair of vertically arranged pneumatic openings on the
    lateral surface of anterior caudal centra.
  - Laterally bowed humerus with a prominent spherical humeral head, strongly
    medially curved deltopectoral crest, and a centrally constricted thick ridge
    along the posterior margin of the proximal half.
  - Metacarpal I with a medial condyle three times as high as and extending much
    more distally than the lateral one; metacarpal II with a prominent
    dorsolateral process on the proximal end and a longitudinal groove on the
    ventral margin of the proximal third of the shaft.
  - Femur with a constricted neck between the posteromedially oriented spherical
    femoral head and the anteroposteriorly wide trochanteric crest, and a
    patellar groove on the anterior surface of the distal end.
  - Small calcaneum obscured from anterior view by the wide astragalar main
    body; proximal projection on the lateral margin of distal tarsal IV;
    metatarsal III with ginglymoid distal end.
