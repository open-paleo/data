genus: Geminiraptor
parent: Coelurosauria
placement: incertae sedis
dispute:
  summary: >
    Geminiraptor, known from a single maxilla, was described as a troodontid
    (Senter et al., 2010), and later analyses disagreed on its position within
    Troodontidae (Hartman et al., 2019, within Troodontinae; Kubota et al., 2024,
    outside it). Freimuth et al. (2026) instead identify it as an early
    therizinosaurian: CT scans show replacement teeth like those of Falcarius,
    and their analyses recover it as the sister taxon of Falcarius utahensis,
    leading them to recombine it as Falcarius suarezarum. It is placed at
    Coelurosauria incertae sedis, the clade spanning both identifications.
  history:
    - date: "2026-07-01"
      note: Placed at Troodontidae incertae sedis (least-inclusive uncontested clade); single-maxilla holotype, position unresolved.
    - date: "2026-09-30"
      note: Moved to Coelurosauria incertae sedis after Freimuth et al. (2026) reidentified it as a therizinosaurian; their recombination into Falcarius is recorded but not adopted.
etymology: Twin seizer; from Latin gemini (twins) and raptor (seizer), referring to the twin geologists Marina and Celina Suarez who discovered the fossil site
pronunciation:
  phonetic: JEM-in-i-RAP-tor
description: Geminiraptor is a genus of theropod dinosaur that lived in North
  America during the Early Cretaceous period. Geminiraptor was a small,
  ground-dwelling bipedal theropod. The type species of Geminiraptor is G.
  suarezarum.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Extensive pneumatization of the maxilla internal to the antorbital fossa,
    inflating the bone to a triangular cross-section
  - Large, craniocaudally elongate maxillary fenestra
  - Promaxillary fenestra visible in lateral view
  - Craniocaudally narrow promaxillary strut and interfenestral strut
  - Small, square dental alveoli with bony septa between them
appearance:
  integument: feathered
  evidence: inferred
identifiers:
  - source: pbdb
    id: "235253"
  - source: wikidata
    id: Q1936000
  - source: eol
    id: "42332914"
species:
  - name: Geminiraptor suarezarum
    etymology: "Named for twin geologists Drs. Marina and Celina Suarez, who discovered the Suarez site from which the fossil was recovered."
    status: valid
    type_species: true
    period:
      name:
        - Early Cretaceous
      stage:
        - Valanginian
    location:
      country: US
      locality: Suarez Site
      region: US-UT
      formation: Cedar Mountain
      member: Yellow Cat
      part: lower
    size:
      length_m:
        min: 1.5
        max: 1.5
      weight_kg:
        min: 2
        max: 9
    erected_in: senter2010a
    type_specimen:
      specimen_id: [CEUM 7319]
      specimen_type: holotype
      institution: CEUM
      material: Maxilla
      completeness: fragmentary
      notes: Senter et al. (2010) give the holotype as CEUM 7319; Freimuth et al.
        (2026) give CEUM 73719 throughout, without mentioning a renumbering.
    synonyms:
      - name: Falcarius suarezarum
        type: reassigned
        reason: Combination proposed by Freimuth et al. (2026), who reidentify the
          holotype maxilla and the Suarez Site bonebed material as an early
          therizinosaurian and the sister taxon of Falcarius utahensis.
references:
  - id: senter2010a
  - id: hartman2019a
    notes: Recovered Geminiraptor within Troodontinae in paravian phylogenetic analysis.
  - id: kubota2024a
    notes: Placed Geminiraptor outside Troodontinae in troodontid phylogenetic analysis.
  - id: freimuth2026a
    notes: Reidentifies the holotype as a therizinosaurian from CT-imaged
      replacement teeth and phylogeny, and recombines it as Falcarius suarezarum.
