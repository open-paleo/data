genus: Geminiraptor
parent: Troodontidae
etymology: Twin seizer; from Latin gemini (twins) and raptor (seizer), referring to the twin geologists Marina and Celina Suarez who discovered the fossil site
description: Geminiraptor is a genus of troodontid theropod dinosaur that lived
  in North America during the Early Cretaceous period. Geminiraptor was a small,
  ground-dwelling bipedal carnivorous paravian. The type species of Geminiraptor
  is G. suarezarum.
