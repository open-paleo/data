genus: Geminiraptor
parent: Troodontidae
dispute:
  summary: >
    Geminiraptor is known only from a single maxilla and its position within
    Troodontidae is indeterminable — its describers recovered it in an unresolved
    basal polytomy (Senter et al., 2010), and later analyses disagree (Hartman et
    al., 2019, within Troodontinae; Kubota et al., 2024, outside it). It is placed
    at Troodontidae incertae sedis.
  history:
    - date: "2026-07-01"
      note: Placed at Troodontidae incertae sedis (least-inclusive uncontested clade); single-maxilla holotype, position unresolved.
etymology: Twin seizer; from Latin gemini (twins) and raptor (seizer), referring to the twin geologists Marina and Celina Suarez who discovered the fossil site
pronunciation:
  phonetic: JEM-in-i-RAP-tor
description: Geminiraptor is a genus of troodontid theropod dinosaur that lived
  in North America during the Early Cretaceous period. Geminiraptor was a small,
  ground-dwelling bipedal carnivorous paravian. The type species of Geminiraptor
  is G. suarezarum.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Extensive pneumatization of the maxilla internal to the antorbital fossa,
    inflating the bone to a triangular cross-section
  - Large, craniocaudally elongate maxillary fenestra
  - Promaxillary fenestra visible in lateral view
  - Craniocaudally narrow promaxillary strut and interfenestral strut
  - Small, square dental alveoli with bony septa between them
appearance:
  integument: feathered
  evidence: inferred
