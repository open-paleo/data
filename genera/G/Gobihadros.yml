genus: Gobihadros
parent: Hadrosauroidea
etymology: From the Gobi Desert (where it was found) combined with hadros (Greek for 'bulky' or 'stout'), the root of Hadrosauridae; meaning 'Gobi hadrosaur'
description: Gobihadros is a genus of basal hadrosauroid dinosaur that lived
  during the Late Cretaceous period in what is now the Bayanshiree Formation
  (dated to the Cenomanian-Santonian) of Mongolia. It contains only the type
  species Gobihadros mongoliensis, which has an estimated length of 7.5 m (25
  ft).
