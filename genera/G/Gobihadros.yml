genus: Gobihadros
parent: Hadrosauromorpha
pronunciation:
  phonetic: GOH-bee-HAD-ros
etymology: From the Gobi Desert (where it was found) combined with hadros (Greek for 'bulky' or 'stout'), the root of Hadrosauridae; meaning 'Gobi hadrosaur'
description: Gobihadros is a genus of basal hadrosauroid dinosaur that lived
  during the Late Cretaceous period in what is now the Bayanshiree Formation
  (dated to the Cenomanian-Santonian) of Mongolia. It contains only the type
  species Gobihadros mongoliensis, which has an estimated length of 7.5 m (25
  ft).
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
diagnostic_features:
  - "Premaxilla with a 'double-layer' oral margin: two rows of denticulations
    separated by a deep sulcus bearing vascular foramina (convergent in
    Hadrosauridae)."
  - Up to three functional teeth in the dentary tooth row (convergent in
    Hadrosauridae); other non-hadrosaurid hadrosauroids have only one or two
    functional teeth per position.
  - Sigmoidal dorsal outline of the ilium with a well-developed, fan-shaped
    posterior process.
  - Greater lateral expression of the supracetabular crest compared to
    Bactrosaurus, Probactrosaurus, Eolambia, Claosaurus, and Tethyshadros.
  - Spike-like manus digit 1, differing from Tethyshadros insularis,
    Plesiohadros djaktaensis, and Hadrosauridae.
appearance:
