genus: Galvesaurus
parent: Brachiosauridae
etymology: Galve lizard; named after Galve, the town in Spain where fossils were found, combined with Greek sauros (lizard)
description: Galvesaurus, or Galveosaurus (meaning "Galve lizard"), is a genus
  of brachiosaurid sauropod dinosaur from the Late Jurassic period. Fossils of
  the only known species, G. herreroi, were found in Galve, Spain, hence its
  generic name. The specific name herreroi honours the discoverer, José María
  Herrero. Some researchers suggest that the taxon might represent a junior
  synonym of the Portuguese genus Lusotitan.
diet: herbivore
locomotion: quadrupedal
