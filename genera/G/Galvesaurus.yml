genus: Galvesaurus
parent: Titanosauriformes
dispute:
  summary: >
    Galvesaurus has been recovered both as a non-neosauropod eusauropod within
    Turiasauria (Royo-Torres et al., 2006; Mocho et al., 2014) and as a basal
    titanosauriform or basal macronarian near the base of Titanosauriformes
    (Mannion et al., 2017; Perez-Pueyo et al., 2019; Jones, 2026). The more
    recent and dedicated analyses favor a basal titanosauriform position.
  history:
    - date: "2026-06-30"
      note: >
        Moved from Brachiosauridae to Titanosauriformes incertae sedis
        following the recent consensus (Mannion et al., 2017; Perez-Pueyo et
        al., 2019; Jones, 2026); the turiasaurian alternative is noted.
etymology: Galve lizard; named after Galve, the town in Spain where fossils were
  found, combined with Greek sauros (lizard)
pronunciation:
  phonetic: GAL-vay-SOR-us
description: Galvesaurus, or Galveosaurus (meaning "Galve lizard"), is a genus
  of titanosauriform sauropod dinosaur from the Late Jurassic period. Fossils of
  the only known species, G. herreroi, were found in Galve, Spain, hence its
  generic name. The specific name herreroi honors the discoverer, José María
  Herrero. Some researchers suggest that the taxon might represent a junior
  synonym of the Portuguese genus Lusotitan.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - coastal
diagnostic_features:
  - Elongation Index in mid-dorsal vertebrae is approximately 0.5.
  - In mid-dorsal vertebrae, centrum and neural arch connected only by anterior
    and posterior centrodiapophysial laminae, with no contact of
    centroprezygapophysial or centropostzygapophysial laminae with the centrum.
  - Parapophyses in dorsal vertebrae situated in the centroprezygapophysial
    lamina rather than dividing the anterior centrodiapophysial lamina as in
    other sauropods.
  - In mid-dorsal vertebrae, accessory laminae connect intraprezygapophysial
    laminae with centroprezygapophysial laminae.
  - Composite lamina formed by union of lateral spinopostzygapophysial and
    spinodiapophysial laminae runs along the posterior margin of the spine in
    mid-dorsal vertebrae.
  - Deep cavity between spinoprezygapophysial and spinodiapophysial laminae in
    mid-dorsal vertebrae, bridged by an accessory lamina connecting both.
