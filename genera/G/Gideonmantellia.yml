genus: Gideonmantellia
parent: Ornithopoda
etymology: Named after Gideon Mantell, the 19th-century English geologist and paleontologist who first described Iguanodon; the -ia suffix is a Latinized honorific form
description: Gideonmantellia is an extinct genus of basal ornithopod dinosaur
  known from the Early Cretaceous (Barremian stage) Camarillas Formation of
  Galve, Province of Teruel, Spain. It contains a single species,
  Gideonmantellia amosanjuanae.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - deltaic
diagnostic_features:
  - Postacetabular process of the ilium with a brevis shelf that is noticeably
    medially expanded in its cranial part but narrow and horizontal in its
    caudal part.
  - Rod-like prepubic process with its anterior end twisted and expanded
    (lateral surface turns into dorsal surface distally).
  - L-shaped (right-angle-bent) first chevron, unlike the straight or
    posteriorly curved first chevrons of other basal ornithischians.
