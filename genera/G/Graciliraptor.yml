genus: Graciliraptor
parent: Microraptorinae
pronunciation:
  phonetic: GRAS-il-i-RAP-tor
etymology: Graceful thief; from Latin gracilis (graceful) and raptor (thief or seizer)
description: Graciliraptor is a genus of microraptorian dromaeosaurid dinosaur
  from the early Cretaceous Period. Its fossil, holotype IVPP V 13474, was found
  in Beipiao, Liaoning Province, China. The type species is Graciliraptor
  lujiatunensis, named and described in 2004 by Xu Xing and Wang Xiaoling. The
  generic name is derived from Latin gracilis (meaning "graceful") and raptor
  (meaning "thief"). The specific name refers to the village of Lujiatun where
  the fossil site is located.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
  - forested
diagnostic_features:
  - Laminal structure connecting the postzygapophyses of middle caudals.
  - Middle caudals extremely long and slender (centrum length/width ratio ~8.6).
  - Ungual of manual digit I much smaller than that of manual digit II.
  - Proximal end of metacarpal III strongly expanded dorsoventrally, deeper than
    metacarpal II.
  - Proximal tibiotarsus shaft rectangular in cross section; tibiotarsus
    extremely slender (length/midshaft-diameter ratio ~28).
  - Astragalar medial condyle significantly expanded posteriorly; metatarsal II
    distally much wider than other metatarsals.
appearance:
  features:
    - feathered wings
    - hindlimb feathers
  integument: feathered
  evidence: direct
