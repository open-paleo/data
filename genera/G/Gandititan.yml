genus: Gandititan
parent: Titanosauria
etymology: "Combines 'Gan' referencing Ganzhou City, the Chinese word 'di'
  meaning 'Earth' (also the first syllable of 'dizhi', meaning 'geology'), and
  'titan' referencing the pre-Olympian giants of Greek mythology; the specific
  name cavocaudatus combines Latin 'cavum' (cavity) and 'cauda' (tail), alluding
  to the caudal vertebrae morphology."
description: Gandititan is an extinct genus of titanosaurian sauropod dinosaur
  from the Late Cretaceous Zhoutian Formation of China. The genus contains a
  single species, G. cavocaudatus, known from a partial skeleton.
diet: herbivore
locomotion: quadrupedal
