genus: Garudimimus
parent: Deinocheiridae
pronunciation:
  phonetic: gah-ROOD-i-MIEM-us
etymology: Garuda mimic; named after Garuda, the divine bird from Hindu and
  Buddhist mythology, combined with Latin mimus (mimic)
description: Garudimimus is a genus of ornithomimosaur that lived in Asia during
  the Late Cretaceous. The genus is known from a single specimen found in 1981
  by a Soviet-Mongolian paleontological expedition in the Bayanshiree Formation
  and formally described in the same year by Rinchen Barsbold; the only species
  is Garudimimus brevipes. Several interpretations about the anatomical traits
  of Garudimimus were made in posterior examinations of the specimen, but most
  of them were criticized during its comprehensive redescription in 2005.
  Extensive undescribed ornithomimosaur remains at the type locality of
  Garudimimus may represent additional specimens of the genus.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Ilium shorter than pubis (primitive condition, contrasting with progressive
    ornithomimosaurs where ilium is longer than pubis).
  - Metatarsus shortened relative to progressive ornithomimosaurs.
  - Third metatarsal proximally almost uncompressed, with considerable
    participation in the tarsal joint and full separation of second and fourth
    metatarsals.
  - First toe (pollex) present, though highly reduced, with a distally V-shaped
    trunk adjacent to the second metatarsal.
  - Vertebrae lack pleurocoels (dorsal and sacral vertebrae without pleurocoels).
  - Basipterygoidal articulation blocked by additional capsule-pterygoid
    connection, with interpterygoidal cavity considerably reduced.
