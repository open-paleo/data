genus: Garudimimus
parent: Deinocheiridae
pronunciation:
  phonetic: gah-ROOD-i-MIEM-us
etymology: Garuda mimic; named after Garuda, the divine bird from Hindu and Buddhist mythology, combined with Latin mimus (mimic)
description: Garudimimus is a genus of ornithomimosaur that lived in Asia during
  the Late Cretaceous. The genus is known from a single specimen found in 1981
  by a Soviet-Mongolian paleontological expedition in the Bayanshiree Formation
  and formally described in the same year by Rinchen Barsbold; the only species
  is Garudimimus brevipes. Several interpretations about the anatomical traits
  of Garudimimus were made in posterior examinations of the specimen, but most
  of them were criticized during its comprehensive redescription in 2005.
  Extensive undescribed ornithomimosaur remains at the type locality of
  Garudimimus may represent additional specimens of the genus.
diet: herbivore
locomotion: bipedal
