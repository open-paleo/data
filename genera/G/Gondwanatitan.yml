genus: Gondwanatitan
parent: Aeolosaurini
etymology: Gondwanatitan means "Gondwana Titan", and is named after Gondwana,
  the supercontinent that the genus' South American range was once part of, and
  the Titans of classical Greek mythology. The type and only named species, G.
  faustoi, is a patronym honoring Dr. Fausto L. de Souza Cunha, a former curator
  at the Museu Nacional/UFRJ who led the excavation of the type specimen.
description: Gondwanatitan was a titanosaurian sauropod dinosaur. Gondwanatitan
  was found in Brazil, at the time part of the southern supercontinent Gondwana,
  in the late Cretaceous Period (70 mya). Like some other sauropods,
  Gondwanatitan was tall and ate tough shoots and leaves from the tops of trees.
  Its closest relative was Aeolosaurus. The type species is Gondwanatitan
  faustoi, formally described by Kellner and de Azevedo in 1999.
diet: herbivore
locomotion: quadrupedal
