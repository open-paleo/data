genus: Gigantspinosaurus
parent: Huayangosaurinae
description: Gigantspinosaurus is a genus of stegosaurian dinosaur from the Late
  Jurassic (Oxfordian) Upper Shaximiao Formation of China. The type species is
  Gigantspinosaurus sichuanensis. It was a moderately sized member of the group,
  measuring up to 4.2 metres (14 ft) in length.
