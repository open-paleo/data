genus: Gigantspinosaurus
parent: Huayangosaurinae
etymology: From Latin gigas/giganteus, 'enormous', + Latin spina, 'spine', + Greek sauros, 'lizard'; means 'giant-spined lizard', referring to its massive shoulder spines
pronunciation:
  phonetic: JIH-gant-SPY-no-SOR-us
description: Gigantspinosaurus is a genus of stegosaurian dinosaur from the Late
  Jurassic (Oxfordian) Upper Shaximiao Formation of China. The type species is
  Gigantspinosaurus sichuanensis. It was a moderately sized member of the group,
  measuring up to 4.2 meters (14 ft) in length.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
appearance:
  features:
    - shoulder spikes
    - dermal plates
    - tail spikes
  integument: armored
  evidence: direct
diagnostic_features:
  - Parascapular (shoulder) spines at least twice the length of the scapula
  - Dentary bearing more than 30 closely packed, leaf-shaped teeth
