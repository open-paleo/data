genus: Gallimimus
parent: Ornithomimidae
etymology: Chicken mimic; from Latin gallus (chicken) and mimus (mimic),
  referring to similarities between its neck vertebrae and those of Galliformes
pronunciation:
  ipa: /ˌɡælɪˈmaɪməs/
  phonetic: GAL-im-EYE-muhs
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Very long snout, broad and flattened dorsoventrally at the tip;
    infratemporal fossa subtriangular with jugal excluded from its borders.
  - Common exit for third and fourth cranial nerves merges with the optic
    fissure.
  - Lower jaw shovel-like anteriorly, with elongated external mandibular
    fenestra.
  - Length of presacral vertebral column equal to combined length of femur,
    tibia-astragalus, and third metatarsal; transition point between caudals 15
    and 16.
  - Humerus longer than scapula; manus equal about a quarter of total forelimb
    length; ungual of digit III shorter than penultimate phalanx of digit III.
  - Metatarsus more than 70% of crural length; metatarsal II equal 97% of length
    of metatarsal IV; pedal digit III equal a third of crural length.
appearance:
  features:
    - keratinous beak
  integument: feathered
  evidence: inferred
identifiers:
  - source: pbdb
    id: "38547"
  - source: wikidata
    id: Q309467
  - source: gbif
    id: "4822903"
  - source: eol
    id: "4433732"
synonyms:
  - name: Sanchusaurus
    type: nomen nudum
    reason: Informal name; never met ICZN requirements for formal publication and is
      treated as referable to Gallimimus. Per Olshevsky's Dinosaur Genera List.
species:
  - name: Gallimimus bullatus
    etymology: From Latin 'bulla' (a gold capsule worn on the neck by young boys
      of noble Roman families), because of the unusual capsule in the base of the
      skull.
    pronunciation:
      phonetic: boo-LAY-tus
    status: valid
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Maastrichtian
    location:
      country: MN
      locality: Tsagaan Khushuu
      region: MN-053
      formation: Nemegt
      notes: Osmolska and colleagues (1972) refer further material from Nemegt,
        Altan Uul IV and Naran Bulak, none of it from the holotype's
        locality.
    type_specimen:
      specimen_id: [ IGM 100/11 ]
      specimen_type: holotype
      institution: MPC
      material: Nearly complete skeleton with skull and mandible; braincase well
        preserved, snout somewhat distorted, lower jaw incomplete; forelimbs almost
        complete; hind limbs almost complete.
      completeness: complete
    size:
      length_m:
        min: 6.0
        max: 6.0
      weight_kg:
        min: 400
        max: 490
      hip_height_m:
        min: 1.9
        max: 1.9
      skull_length_m:
        min: 0.33
        max: 0.33
    erected_in: osmólska1972a
notable_specimens:
  - specimen_id: [IGM 100/1133]
    institution: MPC
    species: Gallimimus bullatus
    category: exceptional-preservation
    significance: "Skull preserving soft-tissue structures on the beak: the inner side bears columnar structures the describers compared to the lamellae of anseriform bird beaks, central to the debate over whether ornithomimosaurs were filter-feeders or high-fiber herbivores."
    references: [norell2001a]
  - specimen_id: [MPC-D 100F/17]
    institution: MPC
    category: trace-association
    significance: "A clenched Gallimimus foot found in 2009 directly associated with a fossil trackway in the Nemegt, a rare instance of tracks preserved together with body fossils; the rest of the skeleton had been removed by fossil poachers."
    discovered:
      year: 2009
    references: [lee2018a]
references:
  - id: osmólska1972a
  - id: paul2024a
    notes: Source of the appearance features.
  - id: norell2001a
  - id: lee2018a
  - id: gradziński1974a
