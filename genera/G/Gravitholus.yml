genus: Gravitholus
parent: Pachycephalosauridae
pronunciation:
  phonetic: GRAV-i-THOL-us
etymology: From Latin gravis (heavy) and tholus (dome); meaning 'heavy dome', referring to its thick skull roof
description: Gravitholus was a genus of pachycephalosaurid dinosaur from the
  late Cretaceous period (Campanian stage, around 75 million years ago). It was
  a pachycephalosaur, and like other pachycephalosaurids the skull roof formed a
  thick dome made of dense bone, which may have been used in head-butting
  contests over mates or territory. It lived in what is now Alberta, Canada, and
  was described in 1979 by W. P. Wall and Peter Galton. The type species is
  Gravitholus albertae.
dispute:
  summary: >
    The validity of Gravitholus is contested. Dyer et al. (2023) used synchrotron
    microtomography and morphometrics to argue that Gravitholus albertae is a
    subjective junior synonym of Stegoceras validum, a conclusion followed by
    Jones and Viola (2026); its describing-era treatment (Longrich et al., 2010)
    considered it valid. Pending broad consensus it is retained as a valid basal
    pachycephalosaurid.
  history:
    - date: "2026-06-26"
      note: Placed at Pachycephalosauridae (Stegoceras-grade), kept valid pending consensus although recent work synonymizes it with Stegoceras validum.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Skull roof thickened to a very wide dome, larger than any known specimen of
    Stegoceras.
  - Parietal contains a large depression and many smaller pits.
  - Braincase significantly smaller relative to dome size compared even to large
    specimens of Stegoceras validus (endocranial length/frontoparietal length
    ratio of 31.3 vs. minimum ~42 for large Stegoceras).
  - Extreme dome width produces a significantly different width ratio compared
    to Stegoceras and Pachycephalosaurus.
  - Node-like ornamentation absent.
