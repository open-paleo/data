genus: Gravitholus
parent: Eupachycephalosauria
description: Gravitholus was a genus of pachycephalosaurid dinosaur from the
  late Cretaceous period (Campanian stage, around 75 million years ago). It was
  a pachycephalosaur, and like other pachycephalosaurids the skull roof formed a
  thick dome made of dense bone, which may have been used in head-butting
  contests over mates or territory. It lived in what is now Alberta, Canada, and
  was described in 1979 by W. P. Wall and Peter Galton. The type species is
  Gravitholus albertae.
diet: herbivore
locomotion: bipedal
