genus: Glyptodontopelta
parent: Ankylosauria
pronunciation:
  phonetic: GLIP-to-don-to-PEL-tuh
etymology: Glyptodon shield; named for resemblance of its armor to that of the
  prehistoric mammal Glyptodon, combined with Greek pelta (shield)
description: Glyptodontopelta is a monospecific genus of nodosaurid dinosaur
  from New Mexico that lived during the Late Cretaceous (lower to upper
  Maastrichtian, 69 to 66 Ma) in what is now the Naashoibito member of the Ojo
  Alamo Formation. The type and only species, Glyptodontopelta mimus, is known
  from numerous specimens that consist of osteoderms, a dentary, supraorbital
  and bone fragments. It was named in 2000 by Tracy Ford. Edmontonia australis
  is a junior synonym of Glyptodontopelta.
dispute:
  summary: >
    Glyptodontopelta is known almost entirely from osteoderms; treated as a nomen dubium by Vickaryous et al. (2004) and as valid by Burns (2008), it cannot be placed below Ankylosauria. It is retained at Ankylosauria incertae sedis.
  history:
    - date: "2026-06-26"
      note: Placed at Ankylosauria incertae sedis, armor-based and not placeable to family.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
appearance:
  integument: armored
diagnostic_features:
  - Large, asymmetric pelvic scutes that are irregularly hexagonal, pentagonal,
    or quadrilateral in outline, set in a mosaic pattern forming a solid shield
    over the ilia
  - Pelvic scutes flat or bearing only a short ridge, abutting each other with
    no room for small ossicles or rosettes between them
  - Pelvic scutes have low or flat peaks
