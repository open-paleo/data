genus: Glyptodontopelta
parent: Nodosauridae
pronunciation:
  phonetic: GLIP-to-don-to-PEL-tuh
etymology: Glyptodon shield; named for resemblance of its armor to that of the
  prehistoric mammal Glyptodon, combined with Greek pelta (shield)
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
appearance:
  integument: armored
diagnostic_features:
  - Large, asymmetric pelvic scutes that are irregularly hexagonal, pentagonal,
    or quadrilateral in outline, set in a mosaic pattern forming a solid shield
    over the ilia
  - Pelvic scutes flat or bearing only a short ridge, abutting each other with
    no room for small ossicles or rosettes between them
  - Pelvic scutes have low or flat peaks
identifiers:
  - source: pbdb
    id: "82623"
  - source: wikidata
    id: Q522942
  - source: gbif
    id: "4823191"
  - source: eol
    id: "10578079"
species:
  - name: Glyptodontopelta mimus
    etymology: "From Latin 'mimus' meaning 'mimic' or 'imitation', referring to the
      armor plates resembling those of the later extinct mammal Glyptodon."
    pronunciation:
      phonetic: MIE-mus
    status: valid
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Maastrichtian
    location:
      country: US
      locality: Barrel Springs Arroyo
      region: US-NM
      formation: Ojo Alamo
      member: Naashoibito
      notes: Barrel Springs Arroyo is also called De-na-zin Wash, and lies about
        1.5 km southwest of the Ojo Alamo Store. Ford (2000) assigns the
        holotype to the Kirtland Shale, where later work places the
        Naashoibito in the Ojo Alamo.
    type_specimen:
      specimen_id: [ USNM 8610 ]
      specimen_type: holotype
      institution: USNM
      material: Section of pelvic osteoderms fused to each other forming a solid
        shield over the ilia (sutured, irregularly shaped scutes in mosaic pattern)
      completeness: fragmentary
    erected_in: ford2000a
references:
  - id: ford2000a
  - id: burns2008a
    notes: Assigns it to Nodosauridae on osteoderm histology, shows it valid,
      synonymizes Edmontonia australis with it, and gives its type locality as
      Barrel Springs Arroyo in the Naashoibito Member.
  - id: vickaryous2004a
    notes: Listed Glyptodontopelta mimus, and the osteoderm species Edmontonia
      australis that Burns (2008) later synonymized with it, as nomina dubia.
  - id: arbour2015a
    notes: Treats Glyptodontopelta mimus as valid on the dendritic surface
      texture of its osteoderms.
