genus: Gargoyleosaurus
parent: Nodosauridae
pronunciation:
  phonetic: gahr-GOI-lo-SAWR-us
etymology: Gargoyle lizard; named for its gargoyle-like appearance, combined with Greek sauros (lizard)
description: Gargoyleosaurus is one of the earliest ankylosaurs known from
  reasonably complete fossil remains. The holotype was discovered in 1995 at the
  Bone Cabin Quarry West locality, in Albany County, Wyoming in exposures of the
  Upper Jurassic (Kimmeridgian to Tithonian stages) Morrison Formation.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Postorbital horns very large, slightly overlapping the squamosal.
  - Eight premaxillary alveoli, with transverse ridges dorsally along the front
    of the premaxilla.
  - Maxillary tooth row elongated; cranial texturing irregular in size but
    forming a loose pattern.
  - Mandible long and relatively gracile, with a retroarticular process long
    compared to other ankylosaurs.
  - Narrow slit between the proatlas facets; vertebral centra elongated and
    anterior caudal ribs projecting laterally, where those of Mymoorapelta
    project ventrolaterally.
  - First cervical armor ring of four partially fused plates plus a central
    osteoderm; second ring of four elongated partially fused plates.
appearance:
  features:
    - body armor
    - osteoderms
    - keratinous beak
  integument: armored
  evidence: direct
