genus: Gargoyleosaurus
parent: Nodosauridae
pronunciation:
  phonetic: gahr-GOI-lo-SAWR-us
etymology: Gargoyle lizard; named for its gargoyle-like appearance, combined with Greek sauros (lizard)
description: Gargoyleosaurus is one of the earliest ankylosaurs known from
  reasonably complete fossil remains. The holotype was discovered in 1995 at the
  Bone Cabin Quarry West locality, in Albany County, Wyoming in exposures of the
  Upper Jurassic (Kimmeridgian to Tithonian stages) Morrison Formation.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Seven premaxillary teeth present (unique among ankylosaurids)
  - Crown base of cheek teeth not swollen into the typical ankylosaur cingulum
  - Premaxilla has a notch in the shape of an inverted U at the front
  - No secondary palate in the roof of the mouth; air passage straight rather
    than convoluted
  - First neck armor ring consists of five partly fused plates; second ring
    consists of six partly fused plates
  - Body armor consists of thin-walled cones, unlike the solid conical armor
    of Mymoorapelta
appearance:
  features:
    - body armor
    - osteoderms
    - keratinous beak
