genus: Dinodocus
parent: Titanosauriformes
etymology: From Greek 'deinos' (terrible, fearfully great) and
  'dokos' (beam); meaning 'terrible beam', a reference to the
  large size of the limb bones.
pronunciation:
  phonetic: die-NOD-o-kus
description: >
  Dinodocus is a genus of sauropod dinosaur, named by Richard
  Owen in 1884, with the type species, Dinodocus mackesoni. The
  name is now usually considered a nomen dubium. The name was
  given to some fossil bones from the Lower Greensand Group
  (Lower Cretaceous) of Hythe, Kent, England, were formerly
  placed in the genus Pelorosaurus (Mantell, 1850), but a
  review by Upchurch et al. (2004) concluded that Dinodocus is
  a nomen dubium.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - marine
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "52799"
  - source: wikidata
    id: Q1003670
species:
  - name: Dinodocus mackesoni
    etymology: Honors H. B. Mackeson, who discovered the
      holotype skeleton in 1840 in the Lower Greensand quarries
      near Hythe, Kent.
    status: nomen dubium
    type_species: true
    period:
      name:
        - Early Cretaceous
      stage:
        - Aptian
        - Albian
      from_ma: 121.4
      to_ma: 100.5
    location:
      country: GB
      region: GB-KEN
      formation: Lower Greensand Group
    type_specimen:
      specimen_id:
        - BMNH 14695
      specimen_type: holotype
      institution: NHMUK
      material: Fragmentary postcranial bones including portions of the humerus, ulna,
        ilium, pubis, ischium, femur, tibia, fibula, and metatarsals.
      completeness: fragmentary
    size:
      length_m:
        min: 15
        max: 15
    erected_in: owen1884a
references:
  - id: owen1851a
    notes: Original osteological description of the Mackeson specimen. Owen
      provisionally referred the bones to Polyptychodon and concluded the animal
      had been a marine reptile — predates the name Dinodocus.
  - id: owen1884a
    notes: Index caption that silently renames the Mackeson specimen Dinodocus
      mackesoni — the first appearance of the genus name, but with no diagnosis
      or description.
  - id: woodward1908a
    notes: Re-examines the BM 14695 collection, corrects several of Owen's
      element identifications, and proposes that Dinodocus is a junior synonym
      of Pelorosaurus.
  - id: upchurch2004a
    notes: Treats Dinodocus as Sauropoda indet. and declares it a nomen dubium;
      notes McIntosh's (1990) referral of D. mackesoni to Pelorosaurus but
      treats both as invalid.
  - id: jones2026b
    notes: Source of the body length estimate.
  - id: mantell1850a
    notes: Originally placed the Dinodocus material in Pelorosaurus.
