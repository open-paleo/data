genus: Daurlong
parent: Dromaeosauridae
placement: incertae sedis
dispute:
  summary: >
    Daurlong is a short-armed Jehol dromaeosaurid recovered by its describers in a
    clade with Tianyuraptor and Zhenyuanlong, placed crownward of Microraptorinae
    and stemward of Eudromaeosauria (Wang et al., 2022; Jones et al., 2026). This
    "short-armed" grouping is weakly supported and not recovered by all analyses,
    so it is placed at Dromaeosauridae incertae sedis.
  history:
    - date: "2026-07-01"
      note: Placed at Dromaeosauridae incertae sedis (least-inclusive uncontested clade); basal short-armed-dromaeosaurid grouping with Tianyuraptor and Zhenyuanlong weakly supported.
etymology: Named after the Daur people (Daur Autonomous Banner of Inner Mongolia, China, where the fossils were found) + Chinese long (龙, 'dragon'), meaning 'Daur dragon'.
pronunciation:
  phonetic: da-wur-long
description: Daurlong is an extinct genus of dromaeosaurid dinosaur from the
  Early Cretaceous (Aptian) Longjiang Formation of China. The genus contains a
  single species, D. wangi, known from a nearly complete skeleton. Daurlong
  represents the first described occurrence of a preserved intestinal region in
  a theropod closely related to birds.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
diagnostic_features:
  - Large, trapezoid promaxillary recess placed at the rostroventral corner of
    the antorbital fossa
  - Maxillary fossa large, shallow and caudodorsally located, so that the pila
    promaxillaris is wider than the pila interfenestralis
  - Fan-shaped distal end of first sternal rib, expanded laterodistally,
    differing from the slender shaft and spoon-shaped distal end in other
    dromaeosaurids
  - Slender subnarial ramus of premaxilla extended caudally well beyond the
    external naris
  - Stepped transition from the subcutaneous surface of the maxillary ventral
    ramus to the antorbital fossa
appearance:
  integument: feathered
  evidence: direct
