genus: Diluvicursor
parent: Elasmaria
etymology: "From Latin diluvium (flood) + cursor (runner): 'flood runner', referring to the Eumeralla Formation's flood-plain depositional environment."
pronunciation:
  phonetic: dy-LOO-vee-KUR-suh
description: Diluvicursor is a genus of small ornithischian from the Lower
  Albian (Early Cretaceous) of Australia. It is known from one species, the type
  species D. pickeringi. The two known specimens, a vertebra and a partial
  juvenile postcranium discovered in 2005 from the Eumeralla Formation, are
  known, and they were named in early 2018.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - polar
diagnostic_features:
  - Dorsoventral height of the neural arch on the anterior-most caudal vertebrae
    highly reduced and sub-equal to dorsoventral centrum height.
  - Prezygapophysis on the anterior-most caudal vertebrae horizontally oriented
    and located at the neural arch base, lateral to the neural canal.
  - Tuberous process dorsally on the spinoprezygapophyseal lamina of the
    anterior-most caudal vertebrae.
  - Caudal ribs on the anterior-most caudal vertebrae transversely broad,
    distance across ribs ~85% of total vertebral height inclusive of haemal
    arch.
  - Triangular intervertebral process anteriorly on the centrum of the
    posterior-most caudal vertebrae incises a V-shaped notch at the posterior
    end of the adjoining centrum.
  - Pd IV-1 strongly asymmetrical in dorsoplantar view, with the proximal cotyle
    flaring medially and the lateral edge straight.
