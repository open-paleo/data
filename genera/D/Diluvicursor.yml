genus: Diluvicursor
parent: Elasmaria
etymology: "From Latin diluvium (flood) + cursor (runner): 'flood runner', referring to the Eumeralla Formation's flood-plain depositional environment."
description: Diluvicursor is a genus of small ornithischian from the Lower
  Albian (Early Cretaceous) of Australia. It is known from one species, the type
  species D. pickeringi. The two known specimens, a vertebra and a partial
  juvenile postcranium discovered in 2005 from the Eumeralla Formation, are
  known, and they were named in early 2018.
diet: herbivore
