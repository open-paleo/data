genus: Dakotaraptor
parent: Dromaeosauridae
placement: incertae sedis
dispute:
  summary: >
    The placement of Dakotaraptor is contested and complicated by a probable
    chimeric holotype (its "furcula" is a turtle entoplastron; Arbour et al.,
    2015). It has been recovered as a dromaeosaurine (DePalma et al., 2015; Currie
    and Evans, 2019), a velociraptorine (Pei et al., 2020), and an unenlagiine
    (Hartman et al., 2019). Given the spread of placements and the chimera concern,
    it is placed at Dromaeosauridae incertae sedis.
  history:
    - date: "2026-07-01"
      note: Moved from Dromaeosaurinae to Dromaeosauridae incertae sedis (least-inclusive uncontested clade); dromaeosaurine, velociraptorine, and unenlagiine hypotheses proposed, holotype possibly chimeric.
    - date: "2026-07-03"
      note: >
        Wired the papers cited in the dispute (Arbour et al. 2015, Currie and
        Evans 2019, Hartman et al. 2019, Pei et al. 2020) into the references
        block. Reference hygiene only; genus retained as valid at Dromaeosauridae
        incertae sedis, since the diagnosis and size rest on retained
        dromaeosaurid material and redescription awaits access to the
        privately-held holotype.
etymology: Named after the Dakotas (the Hell Creek Formation of the western USA,
  spanning the Dakotas, Montana and Wyoming) + Latin raptor ('thief' or
  'plunderer'), meaning 'thief from Dakota'.
pronunciation:
  phonetic: duh-KO-tuh-RAP-tuh
description: Dakotaraptor is a possible chimaeric genus of maniraptoriform
  theropod dinosaur that lived in western North America during the Late
  Cretaceous period. The remains have been found in the Maastrichtian-aged Hell
  Creek Formation, dated to the very end of the Mesozoic era, making
  Dakotaraptor potentially one of the last surviving dromaeosaurids, though
  other researchers have disputed its classification. One of the largest
  dromaeosaurids, measuring 4.35-6 m (14.3-19.7 ft) and weighing 220-350 kg
  (490-770 lb), the remains of D. steini were discovered in a multi-species
  bonebed. Elements of the holotype and referred specimens were later found to
  belong to trionychid turtles, and it is unclear whether further analysis of
  potential non-dromaeosaurid affinities of the holotype and referred material
  can be properly conducted, because currently the type specimen is housed in a
  private collection. Phylogenetic analyses of D. steini place it in a variety
  of positions within Dromaeosauridae.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Lateral corial groove on pedal ungual IV fully enclosed in a bone tube for
    approximately half of its distal length
  - Sharp ventral keel on pedal unguals II and III
  - Fibular crest long and gracile, height does not exceed 9% of total length,
    with hooked proximal margin
  - Shallow collateral ligament fossa on lateral side of metacarpal II, with
    proximodorsal margin straight in dorsal view
  - Teeth with 15-20 denticles/5 mm on distal carina and 20-27 denticles/5 mm on
    mesial carina
  - Row of 10 prominent ulnar papilli (quill knobs) on ventral ulnar ridge,
    first clear evidence for feather quills on a large dromaeosaurid forearm
appearance:
  features:
    - quill knobs
    - sickle claw
  integument: feathered
  evidence: direct
