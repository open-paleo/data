genus: Demandasaurus
parent: Rebbachisaurinae
etymology: Named after the Sierra de la Demanda mountain range in Burgos
  Province, Spain, where the fossils were collected, + Greek sauros ('lizard'),
  meaning 'Demanda lizard'.
pronunciation:
  phonetic: deh-MAHN-dah-SOR-us
description: Demandasaurus is a genus of rebbachisaurid sauropod dinosaur from
  early Cretaceous (late Barremian - early Aptian stage) deposits of Spain.
  Demandasaurus is known from an incomplete but associated skeleton that
  includes cranial and postcranial remains. It was collected from the Castrillo
  de la Reina Formation in Burgos Province. It was first named by Fidel Torcida
  Fernández-Baldor, José Ignacio Canudo, Pedro Huerta, Diego Montero, Xabier
  Pereda Suberbiola, and Leonardo Salgado in 2011, and the type species is
  Demandasaurus darwini.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Teeth ornamented with longitudinal crests on labial (4-5) and lingual (up to
    3) faces of the crown, and bearing mesial and distal carinae without
    denticles
  - Posterior cervical vertebrae have an infraprezygapophyseal chamber
    containing a forked vertical accessory lamina, absent in other sauropods
  - Posterior cervical vertebrae have a rhombic accessory structure where the
    centroprezygapophyseal, prezygadiapophyseal, and spinoprezygapophyseal
    laminae connect dorsally to the prezygapophyses
  - Centroprezygapophyseal laminae are divided (forked) in both cervical and
    dorsal vertebrae
  - Mid-dorsal vertebrae bear two large neural arch pneumatic foramina passing
    entirely through the neural arch anteroposteriorly, not previously described
    in sauropods
  - Anterior caudal transverse processes have two large deep pneumatic cavities
    divided by accessory laminae, combined with a broad laminar complex
    associated with the diapophysis
