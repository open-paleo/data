genus: Duriatitan
parent: Titanosauriformes
etymology: From Latin Duria, the Roman name for Dorset (England), + Greek Titan,
  a giant of mythology; means 'giant from Dorset'
pronunciation:
  phonetic: doo-ree-uh-TY-tuhn
description: Duriatitan is a genus of titanosauriform sauropod dinosaur that
  lived in the Late Jurassic in what is now England. The holotype specimen of
  Duriatitan, BMNH 44635, is a partial left upper arm bone which was found by
  R.I. Smith near Sandsfoot, Weymouth in the lower Kimmeridge Clay from Dorset.
  The type species, D. humerocristatus, was described in 1874 by John Hulke as a
  species of Cetiosaurus and was noted as being similar to that of
  Gigantosaurus. The specific name refers to the deltopectoral crest, crista, on
  the upper arm bone, humerus. The specimen was assigned to its own genus by
  Paul M. Barrett, Roger B.J. Benson and Paul Upchurch in 2010. The generic name
  is derived from the Latin name for Dorset, Duria, and Greek Titan. Thomas
  Holtz estimated its length at 25 meters (82 ft).
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - marine
