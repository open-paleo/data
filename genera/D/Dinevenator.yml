genus: Dinevenator
parent: Troodontinae
etymology: From Navajo 'Diné', the name of the Navajo people, combined with
  Latin 'venator' meaning 'hunter'; meaning 'Diné hunter'.
description: Dinevenator is an extinct genus of troodontid theropod dinosaur
  known from the Late Cretaceous (Campanian age) Kirtland Formation of New
  Mexico, United States. The type species of the genus, Dinevenator robustus,
  is known from a nearly complete frontal bone (a skull roof bone). Previous
  work had assigned it to the genera Saurornitholestes and Xenovenator.
dispute:
  summary: >
    Dinevenator is recovered within the tribe Troodontini of Rivera-Sylva and
    others (2026), as the basalmost member and the sister taxon to
    Albertavenator plus Xenovenator. That tribe is not adopted here as a node,
    so the genus is placed in Troodontinae alongside them. The holotype frontal
    was formerly held to be undiagnostic: Evans and others (2014) treated the
    species as a nomen dubium referable only to an indeterminate troodontid,
    while Rivera-Sylva and others (2026) and Jasinski and Sullivan (2026) both
    rediagnosed it as a valid species. Those two disagree on its generic
    assignment, the former tentatively referring it to Xenovenator as the
    sister taxon to Xenovenator espinosai, and the latter erecting Dinevenator
    for it later the same year.
  history:
    - date: "2026-08-03"
      note: Intake; placed at Troodontinae rather than the unadopted tribe
        Troodontini, following the treatment of Albertavenator and Xenovenator.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Dorsoventrally thick and robust frontals
  - Frontals thicker posteriorly than anteriorly
  - Nearly flat frontals lacking a well-developed parasagittal trough and
    sagittal ridge, so the dorsolateral surface for the orbital rim is robust
    but only slightly raised
  - Posteromedial nasal projection between the frontals that is wider than long
  - More laterally oriented posterior portion of the lateral endocranial wall of
    the frontal
  - Lacks a transverse ventral ridge separating the cerebral and olfactory
    fossae
identifiers:
  - source: wikidata
    id: Q140835817
erected_in: jasinski2026a
species:
  - name: Dinevenator robustus
    etymology: "From Latin 'robustus' meaning 'robust' or 'strong'."
    status: valid
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Campanian
    location:
      country: US
      locality: Alamo Wash (north fork)
      region: US-NM
      formation: Kirtland
      member: De-na-zin
    type_specimen:
      specimen_id: [ SMP VP-1955 ]
      specimen_type: holotype
      institution: SMP
      material: Nearly complete but weathered left frontal, lacking the lateral
        orbital margin and the postorbital process.
      completeness: fragmentary
    synonyms:
      - name: Saurornitholestes robustus
        type: reassigned
        reason: Original combination by Sullivan (2006); Jasinski and Sullivan
          (2026) erected the new genus Dinevenator for the species.
      - name: Xenovenator robustus
        type: reassigned
        reason: Combination of Rivera-Sylva and others (2026), who diagnosed
          the species as valid and recovered it as the sister taxon to
          Xenovenator espinosai, assigning it to that genus only tentatively;
          Jasinski and Sullivan (2026) instead erected Dinevenator for it.
    erected_in: sullivan2006b
    described_in: jasinski2026a
references:
  - id: sullivan2006b
    notes: Original description of the species as Saurornitholestes robustus,
      founded on the holotype frontal.
  - id: evans2014a
    notes: Reidentified the holotype frontal as troodontid rather than
      dromaeosaurid, and treated the species as a nomen dubium.
  - id: rivera-sylva2026a
    notes: Rediagnosed the species as valid and tentatively assigned it to
      Xenovenator, recovering it as the sister taxon to Xenovenator espinosai
      within the tribe Troodontini.
  - id: jasinski2026a
    notes: Reassessed the holotype as diagnostic and erected Dinevenator for the
      species.
