      completeness: partial
    erected_in: bakker1988a
notable_specimens:
  - nickname: Tank
    specimen_id: [FPDM-V9673, BHI 127327]
    institution: FPDM
    category: complementary
    significance: "Referred partial nodosaurid skeleton nicknamed Tank from the Lance Formation of Niobrara County, Wyoming, comprising a fragmentary skull, parts of the postcranial skeleton, and 75 osteoderms, preserving postcranial anatomy absent in the skull-and-armor-only holotype."
    discovered:
      year: 1988
    references: [derstler1994a, carpenter2013a, sonoda2016a]
