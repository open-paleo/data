genus: Denversaurus
parent: Nodosauridae
pronunciation:
  phonetic: DEN-ver-SAWR-us
etymology: From "Denver" (for the City of Denver and the Denver Museum of
  Natural History, which holds the holotype) and Greek "sauros" (lizard);
  meaning "Denver lizard".
description: Denversaurus is a genus of panoplosaurin nodosaurid dinosaur from
  the late Maastrichtian of Late Cretaceous Western North America. Although at
  one point treated as a junior synonym of Edmontonia by some taxonomists,
  current research indicates that it is its own distinct nodosaurid genus.
diet: herbivore
locomotion: quadrupedal
diagnostic_features:
  - Orbits and postorbital boss displaced far posteriorly, with orbital center
    lying above the posterior edge of the suborbital flare and the boss apex
    crowded close to the paroccipital tip in dorsal view
  - Lateral temporal fenestra reduced to a narrow slit in lateral view, due to
    extreme posterior orbital displacement
  - Basituberal rugosities expanded to cover nearly the entire ventral surface
    of the basicranium between the condyle and basipterygoid process, with
    muscle scars extending alongside the condyle on either side
  - Internal nares shifted far posteriorly
appearance:
  features:
    - osteoderms
  integument: armored
  evidence: direct
identifiers:
  - source: pbdb
    id: "68190"
  - source: wikidata
    id: Q21012043
  - source: gbif
    id: "4823196"
species:
  - name: Denversaurus schlessmani
    etymology: Named for the Schlessman Family Foundation, which funded dinosaur
      research at the Denver Museum of Natural History.
    status: valid
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Maastrichtian
    location:
      country: US
      region: US-SD
      formation: Hell Creek
    size:
      length_m:
