description: Dineobellator is a genus of dromaeosaurid theropod dinosaur from
  the Late Cretaceous (Maastrichtian age) Ojo Alamo Formation (Naashoibito
  Member) of New Mexico, United States. The genus contains a single species,
  Dineobellator notohesperus, known from a partial skeleton.
