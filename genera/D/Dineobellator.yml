genus: Dineobellator
parent: Velociraptorinae
dispute:
  summary: >
    Dineobellator is recovered as a North American velociraptorine by its
    describers (Jasinski et al., 2020) and by Jones et al. (2026), the placement
    adopted here, though Jones notes this may partly reflect the incompleteness of
    the material.
  history:
    - date: "2026-07-01"
      note: Placed in Velociraptorinae following Jasinski et al. (2020); placement may be affected by incomplete material.
pronunciation:
  phonetic: dih-NAY-oh-BEL-ah-tor
  ipa: /dɪˌneɪoʊbəˈleɪtər/
etymology: "From Diné (the Navajo people's name for themselves, meaning 'the People') + Latin bellator, 'warrior'; means 'Diné warrior', honoring the Navajo Nation near the discovery site"
description: Dineobellator is a genus of dromaeosaurid theropod dinosaur from
  the Late Cretaceous (Maastrichtian age) Ojo Alamo Formation (Naashoibito
  Member) of New Mexico, United States. The genus contains a single species,
  Dineobellator notohesperus, known from a partial skeleton.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Offset of lateral grooves on manual ungual, with medial groove not
    converging toward dorsal surface distally as the lateral groove does
  - Distinct and conspicuous dorsomedial groove proximally dorsal to the
    articular surface on the manual ungual, not seen in other dromaeosaurids
  - Sharp, acute angle of the distal deltopectoral crest of the humerus, unique
    among dromaeosaurids
  - Opisthocoelous proximal caudal vertebrae, unknown in other dromaeosaurids
  - Distinct round (subcircular) concavities on cranial and caudal centrum
    surfaces of mid-caudal vertebrae, symmetrical and not seen in other
    dromaeosaurids
  - Secondary lateral grooves ventral to the main lateral grooves on pedal
    unguals, unique among dromaeosaurids
appearance:
  features:
    - quill knobs
  integument: feathered
  evidence: direct
