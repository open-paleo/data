genus: Dineobellator
parent: Velociraptorinae
pronunciation:
  ipa: /dɪˌneɪoʊbəˈleɪtər/
etymology: "From Diné (the Navajo people's name for themselves, meaning 'the People') + Latin bellator, 'warrior'; means 'Diné warrior', honoring the Navajo Nation near the discovery site"
description: Dineobellator is a genus of dromaeosaurid theropod dinosaur from
  the Late Cretaceous (Maastrichtian age) Ojo Alamo Formation (Naashoibito
  Member) of New Mexico, United States. The genus contains a single species,
  Dineobellator notohesperus, known from a partial skeleton.
diet: carnivore
locomotion: bipedal
