genus: Dongyangosaurus
parent: Titanosauria
etymology: Named for Dongyang in Zhejiang Province, China, where the fossils
  were found, combined with Greek 'sauros' meaning 'lizard'.
description: Dongyangosaurus is a genus of titanosaurian sauropod dinosaur from
  the Late Cretaceous. The only species is Dongyangosaurus sinensis, from which
  only a single fragmentary skeleton is known, coming from the Zhejiang province
  of eastern China. It was described and named by Lü Junchang and colleagues.
  Like other sauropods, Dongyangosaurus would have been a large quadrupedal
  herbivore.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Distinct fossa formed by intraprezygapophyseal lamina and
    centroprezygapophyseal lamina on ventral surfaces of prezygapophyses of
    dorsal vertebrae
  - Subsidiary spinodiapophyseal laminae (sspdl) on lateral surface of short
    dorsal neural spines forming triangular concavities; similar concavities
    also on lateral surface of postzygapophyses of dorsal and anterior caudal
    vertebrae
  - Dorsal neural spines short and bifurcated
  - Pubis shorter than ischium, with elongated and nearly closed obturator
    foramen
  - Both anterior and posterior articular surfaces of anterior caudal vertebrae
    only slightly concave (not strongly opisthocoelous)
  - Preacetabular lobe of ilium greatly expanded dorsoventrally and extending
    anterolaterally
