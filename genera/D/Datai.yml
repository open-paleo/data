genus: Datai
parent: Ankylosaurinae
etymology: "A composite of the final characters of the Chinese words 'tongda' (meaning 'to understand' or 'to be sensible') and 'antai' (meaning 'stable'); the specific name yingliangis honors the Yingliang Group."
pronunciation:
  phonetic: DAH-tai
description: Datai is an extinct genus of ankylosaurid dinosaur from the Late
  Cretaceous Zhoutian Formation of Jiangxi Province, China. The genus contains a
  single species, D. yingliangis, which is known from the articulated skulls and
  partial skeletons of two individuals.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - lacustrine
diagnostic_features:
  - Dual jugal/quadratojugal horns on the skull cheek region, unique among
    ankylosaurines
  - Protruded premaxilla with prenarial portion longer anteroposteriorly than
    the infranarial portion
  - Distinct postfrontal caputegulum forming open sutures with squamosal,
    parietal, and surrounding caputegulae
  - Parasagittally projecting squamosal horn
  - Polygonal, monotypic gular osteoderms covering the intermandibular region
    and entire throat
appearance:
  integument: armored
  evidence: direct
