genus: Dzharatitanis
parent: Somphospondyli
etymology: Dzharakuduk titan
description: Dzharatitanis is an extinct genus of probable titanosaurian
  sauropod dinosaur from the Late Cretaceous (Turonian age) Bissekty Formation
  of Uzbekistan. The genus contains a single species, Dzharatitanis kingi, known
  from a single tail vertebra. Dzharatitanis was considered to be a member of
  the Rebbachisauridae when it was named in 2021, but subsequent research has
  considered it to be a titanosaur.
diet: herbivore
