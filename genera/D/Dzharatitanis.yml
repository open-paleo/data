genus: Dzharatitanis
parent: Neosauropoda
dispute:
  summary: >
    Dzharatitanis was described as a rebbachisaurid diplodocoid, the first
    reported from Asia (Averianov and Sues, 2021), but Lerzo, Carballido and
    Gallina (2021) rescored the holotype and argued it is more likely a
    titanosaur, most probably a lognkosaurian; the conflict, resting on a single
    caudal vertebra, remains unresolved (Jones, 2026).
  history:
    - date: "2026-06-30"
      note: >
        Moved out of Somphospondyli to Neosauropoda incertae sedis pending
        resolution of the rebbachisaurid versus titanosaurian debate.
    - date: "2026-07-02"
      note: >
        Confirmed placement at Neosauropoda incertae sedis; the
        rebbachisaurid-versus-titanosaur debate is unresolved.
etymology: "From Dzharakuduk (the type locality in Uzbekistan) + Greek titan (giant): 'Dzharakuduk titan'."
pronunciation:
  phonetic: jah-ruh-tie-tan-iss
description: Dzharatitanis is an extinct genus of probable titanosaurian
  sauropod dinosaur from the Late Cretaceous (Turonian age) Bissekty Formation
  of Uzbekistan. The genus contains a single species, Dzharatitanis kingi, known
  from a single tail vertebra. Dzharatitanis was considered to be a member of
  the Rebbachisauridae when it was named in 2021, but subsequent research has
  considered it to be a titanosaur.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Slightly opisthocoelous centrum with convex anterior articular surface and
    no pleurocoel
  - "'Wing-like' transverse process (not distally tapering) with dorsally
    directed ventral surface"
  - Large but shallow PRCDF on anterior face of transverse process
  - Absence of hyposphenal ridge and absence of TPRL and TPOL
  - Large SPDL on lateral side of neural spine, separated from both SPRL and SPOL
  - Apex of neural spine transversely expanded bearing distinct triangular
    lateral processes; neural spine pneumatized internally
