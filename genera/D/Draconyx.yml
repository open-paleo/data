genus: Draconyx
parent: Dryomorpha
placement: incertae sedis
pronunciation:
  phonetic: DRAK-o-niks
etymology: "From Latin draco (dragon) + Ancient Greek onyx (claw): 'dragon claw'."
description: Draconyx is a genus of ornithopod dinosaur from the Late Jurassic
  of what is now Portugal. It was found in the Lourinhã Formation in 1991, and
  described by Octávio Mateus and Miguel Telles Antunes in 2001.
dispute:
  summary: >
    Draconyx loureiroi was originally referred to Camptosauridae (Mateus and
    Antunes, 2001), and its position has remained unresolved since. It has
    been recovered among basal Styracosterna (Madzia and others, 2021;
    Rotatori and others, 2022), as the basalmost ankylopollexian alongside
    Oblitosaurus bunnueli (Sánchez-Fenollosa and others, 2023), and outside
    Ankylopollexia entirely — Fonseca and others (2024) recover it as a
    constituent of Dryomorpha rather than of Ankylopollexia, and Rotatori and
    others (2026) recover it as the sister taxon of Cumnoria prestwichii,
    diverging before the ankylopollexian node. It is placed at Dryomorpha
    incertae sedis, the least inclusive clade common to every hypothesis.
  history:
    - date: "2026-06-27"
      note: Placed at Styracosterna following recent analyses; the
        camptosaurid interpretation reflected, not adopted.
    - date: "2026-08-07"
      note: Moved from Styracosterna to Dryomorpha incertae sedis; the
        camptosaurid and non-ankylopollexian hypotheses both exclude it from
        Styracosterna, which is defined to exclude Camptosaurus dispar.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Carpus unfused and non-interlocked.
  - No sharp crest running from the medial condyle of the femur toward the
    lesser trochanter.
  - Extensor groove on the distal epiphysis of the femur fully open and
    U-shaped; flexor groove fully open and V-shaped, without overhangs.
  - Medial margin of the proximal epiphysis of the tibia concave.
  - Fibular condyle of the tibia pointing caudally.
  - Metatarsal I splint-like.
appearance:
  integument: scaled
  evidence: inferred
