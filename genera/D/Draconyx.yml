genus: Draconyx
parent: Styracosterna
pronunciation:
  phonetic: DRAK-o-niks
etymology: "From Latin draco (dragon) + Ancient Greek onyx (claw): 'dragon claw'."
description: Draconyx is a genus of ornithopod dinosaur from the Late Jurassic
  of what is now Portugal. It was found in the Lourinhã Formation in 1991, and
  described by Octávio Mateus and Miguel Telles Antunes in 2001.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Maxillary teeth with strong primary ridge with five tertiary ridges at the
    mesial side; enamel on labial surface lower distally than mesially.
  - Manual ungual phalanges higher than broad.
  - Tibial condyle of femur without lateral projection into the flexor groove.
  - Fibular condyle of femur shorter anteroposteriorly than wide mediolaterally.
  - Astragalus fused to calcaneum; distal tarsal II present; lateral distal
    tarsal overlaps the medial distal tarsal.
  - Metatarsal V absent.
