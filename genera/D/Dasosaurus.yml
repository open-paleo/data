genus: Dasosaurus
parent: Somphospondyli
pronunciation:
  phonetic: DAH-so-SAWR-us
etymology: From Greek 'dasos' (forest, copse) and 'sauros' (lizard); meaning
  'forest lizard', referring to the densely-vegetated dig site within Brazil's
  Legal Amazonia.
description: Dasosaurus is an extinct genus of somphospondylan sauropod dinosaur
  known from the Early Cretaceous (Aptian) Itapecuru Formation of Maranhão,
  Brazil. The single species, Dasosaurus tocantinensis, is recovered as sister
  to the Spanish Barremian taxon Garumbatitan within a non-titanosaur
  Somphospondyli clade, and is among the largest known Brazilian sauropods at
  an estimated 18–22 m in length.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - deltaic
  - wetland
diagnostic_features:
  - Anterior caudal neural spines expanded dorsolaterally ('stake-like' shaped),
    creating a quadrangular dorsal platform.
  - Anterior surface of the femur lacks a linea intermuscularis cranialis.
  - Pedal ungual phalanges I–II bear a distinct dorsolateral extensor tubercle
    extending ventrally along the lateroventral surface of the bone.
  - Dorsal-most of the three neural arch pedicel ridges on middle-posterior
    caudal vertebrae positioned at the level of the dorsal margin of the
    prezygapophysis, dorsally bounding a shallower, ellipsoid costovertebral
    concavity.
  - Femoral shaft more slender and more medially curved, with a lateral bulge
    corresponding to approximately 40% of the transverse minimal shaft width.
