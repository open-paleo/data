genus: Daanosaurus
parent: Mamenchisauridae
etymology: Da'an lizard
description: Daanosaurus was a genus of sauropod dinosaur which lived during the
  Late Jurassic (Oxfordian - Tithonian stage, about 163 - 145 mya). It lived in
  what is now China (Sichuan Province), and was similar to Bellusaurus.
  Daanosaurus is known only from a partial skeleton of a juvenile, and it has
  been debated whether the specimen may be a juvenile mamenchisaurid.
diet: herbivore
