genus: Daanosaurus
parent: Eusauropoda
dispute:
  summary: >
    Daanosaurus, based on a juvenile, is recovered near the base of
    Neosauropoda, either just outside it or within basal Macronaria
    (Brachiosauridae) (Xing et al., 2009), and is listed as Macronaria by
    Xing et al. (2015); Moore et al. (2023) treat it as a juvenile
    mamenchisaurid-grade form. Jones (2026) lists it among mamenchisaurids
    while documenting the neosauropod alternatives.
  history:
    - date: "2026-06-29"
      note: >
        Moved from Mamenchisauridae to Eusauropoda incertae sedis given the
        unresolved mamenchisaurid versus basal-macronarian placements and
        the juvenile holotype.
etymology: Named after Da'an district in Zigong, Sichuan Province, China where
  the specimens were found, + Greek sauros ('lizard'), meaning 'Da'an lizard'.
pronunciation:
  phonetic: DAH-no-SOR-us
description: Daanosaurus was a genus of sauropod dinosaur which lived during the
  Late Jurassic (Oxfordian - Tithonian stage, about 163 - 145 mya). It lived in
  what is now China (Sichuan Province), and was similar to Bellusaurus.
  Daanosaurus is known only from a partial skeleton of a juvenile, and it has
  been debated whether the specimen may be a juvenile mamenchisaurid.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Axis extremely short and high, with centrum length only 60% of total
    vertebral height - far lower ratio than other known sauropods.
  - Cervical neural spines low with straight upper borders and prominent
    anteroposterior extension; posterior cervical spines transversely widened
    into near-square shape but not bifurcated.
  - Anterior processes of mid-cervical ribs bifurcate (forked apex), a condition
    previously known only from Mamenchisaurus youngi.
  - Dorsal neural spines form transversely broad plate-like structures without
    bifurcation.
  - Chevrons Y-shaped with haemal canal not closed (blood vessel foramina open)
    at proximal end.
  - Cavities in cervical neural arches highly developed, including prominent
    prezygapophysial cavities in mid-cervical vertebrae and large deep
    postspinal cavities.
