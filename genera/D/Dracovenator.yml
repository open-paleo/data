genus: Dracovenator
parent: Neotheropoda
pronunciation:
  ipa: /ˌdrækoʊvɛˈneɪtər/
etymology: "From Latin 'draco' meaning 'dragon' and 'venator' meaning 'hunter',
  meaning 'dragon hunter'."
description: Dracovenator is a genus of neotheropod dinosaur that lived
  approximately 201 to 199 million years ago during the early part of the
  Jurassic period in what is now South Africa. Dracovenator was a medium-sized,
  moderately built, ground-dwelling, bipedal carnivore, that could grow up to an
  estimated 5.5-6.5 meters (18-21 ft) in length and 250 kilograms (550 lb) in
  body mass. Its type specimen was based on only a partial skull that was
  recovered.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - arid
diagnostic_features:
  - Large bilobed fossa surrounding a large lateral premaxillary foramen
    connected to the alveolar margin by a deep narrow channel.
  - Deep, oblique notch on the lateral surface of the articular separating the
    retroarticular process from the posterior margin of the glenoid.
  - "Hypertrophied erect, tab-like dorsal processes on the articular: one
    immediately posterior to the chorda tympanic foramen opening and one on the
    anterolateral margin of the posterodorsal fossa."
