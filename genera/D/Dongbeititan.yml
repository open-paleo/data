genus: Dongbeititan
parent: Somphospondyli
etymology: From Chinese 'Dongbei' meaning 'Northeast' (referring to northeastern
  China, i.e. Manchuria/Liaoning), combined with Greek 'titan' meaning 'giant'.
pronunciation:
  phonetic: dong-be-TIE-tuhn
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - lacustrine
  - forested
diagnostic_features:
  - Craniocaudally elongate coracoid with a squared cranioventral extreme
  - Long, smooth, and slightly convex acetabular edge of the pubis
appearance:
  integument: feathered
  evidence: direct
identifiers:
  - source: pbdb
    id: "153807"
  - source: wikidata
    id: Q2154426
species:
  - name: Dongbeititan dongi
    etymology: "Named for Chinese paleontologist Dong Zhiming, in recognition of
      contributions to research and education in the field of Chinese dinosaurs."
    pronunciation:
      phonetic: DOHNG-eye
    status: valid
    type_species: true
    period:
      name:
        - Early Cretaceous
      stage:
        - Barremian
    location:
      country: CN
      locality: unnamed valley between Libalang Valley and Er Valley
      region: CN-LN
      formation: Yixian
      member: Jianshangou
    type_specimen:
      specimen_id: [ DNHM D2867 ]
      specimen_type: holotype
      institution: XHPM
      material: "Partial associated skeleton: 16 cervical vertebrae, 7 dorsal
        vertebrae, 3 proximal caudal vertebrae, 1 dorsal rib, 1 chevron, partial fused
        right scapulocoracoid, right pubis, both ischia, distal right femur, and
        nearly complete left hind limb including femur, tibia, fibula, astragalus,
        calcaneum, metatarsus, and pedal unguals I and II."
      completeness: partial
    size:
      length_m:
        min: 15
        max: 15
      weight_kg:
        min: 7000
        max: 7000
      hip_height_m:
        min: 2
        max: 2
    erected_in: wang2007a
