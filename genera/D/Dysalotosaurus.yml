notable_specimens:
  - specimen_id: [GPIT-PV-122984]
    institution: GPIT
    category: ontogeny
    significance: "Semi-articulated juvenile (age 4–5 years) preserving ~40
      associated elements, including cranial bones and a near-complete cervical
      series. Neurocentral sutures, closed in the cervicals but open in
      posterior dorsals, reveal a cervical fusion locus challenging the
      'tail-to-head' model in Ornithopoda."
    references: [rocchi2026a]
  - specimen_id: [MB.R.1617]
    institution: ZMB
    category: pathology
    significance: "An isolated presacral centrum co-ossified with a hemivertebra,
      producing about 35 degrees of kyphosis and 15 degrees of scoliosis.
      Interpreted as forming early in embryogenesis via hemimetameric segmental
      shift, it is one of few hemivertebrae documented in fossil vertebrates."
    references: [witzmann2008a]
  - specimen_id: [MB.R.1336]
    institution: ZMB
    category: pathology
    significance: "A vertebral body showing macroscopic enlargement and, on
      micro-CT, the characteristic radiologic triad of Paget disease of bone in
      its mixed phase (trabecular coarsening, cortical thickening, and increased
      bone size). It is the oldest reported case of Paget disease in the fossil
      record."
    references: [witzmann2011a]
