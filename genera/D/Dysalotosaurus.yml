genus: Dysalotosaurus
parent: Dryosauridae
etymology: "From Greek dysalotos (uncatchable) + sauros (lizard): 'uncatchable lizard'."
pronunciation:
  phonetic: dis-a-LOHT-o-SOR-us
description: Dysalotosaurus is a genus of herbivorous iguanodontian dinosaur. It
  was a dryosaurid iguanodontian, and its fossils have been found in late
  Kimmeridgian-age rocks (Late Jurassic) of the Tendaguru Formation of Lindi
  Region in Tanzania. The type and only species of the genus is D.
  lettowvorbecki. This species was named by Hans Virchow in 1919 in honor of the
  Imperial German Army Officer, Paul von Lettow-Vorbeck. For much of the 20th
  century the species was referred to the related and approximately contemporary
  genus Dryosaurus, but newer studies reject this synonymy.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - coastal
appearance:
  features:
    - keratinous beak
  integument: scaled
  evidence: inferred
