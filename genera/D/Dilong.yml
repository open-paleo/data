genus: Dilong
parent: Tyrannosauroidea
etymology: From Chinese di (地, 'earth' or 'ground') + long (龍, 'dragon'), meaning 'earth dragon'. The name references Chinese mythology in which the dilong is the earthbound counterpart to the heavenly tianlong.
pronunciation:
  phonetic: DEE-long
description: Dilong is a genus of small basal tyrannosauroid dinosaurs. The only
  species in the genus is Dilong paradoxus, known from the Lower Cretaceous Yixian
  Formation of East Asia (in what is now China). The discovery of Dilong was
  significant as it provided the first evidence of feathers in tyrannosaurs,
  something which had previously been suspected for the group.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
  - forested
diagnostic_features:
  - Two large pneumatic recesses dorsal to the antorbital fossa on the maxilla
  - Y-shaped crest formed by the nasals and lacrimals
  - Extremely long descending process of the squamosal extending close to the
    mandibular articulation of the quadrate
  - Lateral projection of the basisphenoid anterior to the basal tuber
  - Very deep, sub-circular interspinous ligamentous fossae on cervical vertebrae
  - Robust scapula with distal end twice as wide as the proximal scapular blade;
    hypertrophied coracoid approximately 70% of scapular length
