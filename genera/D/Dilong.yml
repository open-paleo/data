genus: Dilong
parent: Tyrannosauroidea
etymology: emperor dragon
description: Dilong is a genus of small basal tyrannosauroid dinosaurs. The only
  species in the genus is Dilong paradoxus, known from the Lower Cretaceous Yixian
  Formation of East Asia (in what is now China). The discovery of Dilong was
  significant as it provided the first evidence of feathers in tyrannosaurs,
  something which had previously been suspected for the group.
