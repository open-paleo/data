genus: Dyoplosaurus
parent: Euoplocephalini
pronunciation:
  phonetic: DIE-o-plo-SAWR-us
etymology: "From Greek dyoplos (double-armored) + sauros (lizard):
  'double-armored lizard'."
description: Dyoplosaurus is a monospecific genus of ankylosaurid dinosaur from
  Alberta that lived during the Late Cretaceous (middle Campanian, ~76.5-75 Ma)
  in what is now the Dinosaur Park Formation. Dyoplosaurus represents a close
  relative of Scolosaurus and Anodontosaurus, two ankylosaurids known from the
  Horseshoe Canyon and Dinosaur Park Formation.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - coastal
appearance:
  features:
    - body armor
    - tail club
  integument: armored
diagnostic_features:
  - Tail club knob with lateral plates bearing a sharp supero-lateral keel,
    differing strongly from the globose plates of other ankylosaur species
  - Teeth with eight serrated points of which the second is most prominent,
    anterior four and posterior four distinct, fine vertical wrinkling on inner
    surface, straight or slightly concave anterior margin
  - Scutes not in contact with one another and not forming transverse or
    longitudinal bands, with no scutes along the median dorsal line
  - Typical scute with median longitudinal keel that becomes progressively more
    elevated posteriorly into a backwardly directed point, and asymmetrical in
    transverse section (broadly convex above, flat or concave below)
  - Free caudal centra essentially round, not depressed as in many armored
    dinosaurs
