genus: Dyoplosaurus
parent: Ankylosaurinae
pronunciation:
  phonetic: DIE-o-plo-SAWR-us
etymology: "From Greek dyoplos (double-armored) + sauros (lizard):
  'double-armored lizard'."
description: Dyoplosaurus is a monospecific genus of ankylosaurid dinosaur from
  Alberta that lived during the Late Cretaceous (middle Campanian, ~76.5-75 Ma)
  in what is now the Dinosaur Park Formation. Dyoplosaurus represents a close
  relative of Scolosaurus and Anodontosaurus, two ankylosaurids known from the
  Horseshoe Canyon and Dinosaur Park Formation.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - coastal
appearance:
  features:
    - body armor
    - tail club
  integument: armored
diagnostic_features:
  - Transverse processes of the third sacral vertebra projecting anterolaterally
    from the centrum and anteroventrally inclined (~25° from horizontal) —
    unique among ankylosaurids, giving a distinctive sacral-fenestra pattern.
  - Pedal unguals triangular in dorsal view, lacking the proximal constriction
    seen in Euoplocephalus.
  - Handle (tail-club) vertebrae with sharply pointed neural spines in dorsal
    view, unlike the broad, tongue-like spines of Ankylosaurus.
  - Free caudal centra subcircular in anterior and posterior view, with
    transverse processes directed anterolaterally and present on all free caudal
    vertebrae (unlike their loss on distal caudals in Pinacosaurus and Tarchia).
  - Transverse processes meeting the free caudal centrum at a sharp angle in
    anterior or posterior view, unlike the rounded, obtuse-angled condition in
    Nodocephalosaurus.
