synonyms:
  - name: Daptosaurus
    type: junior subjective
    reason: Informal name used by Barnum Brown for material from southern Montana;
      the specimen was later formally described as Deinonychus.
  - name: Megadontosaurus
    type: nomen nudum
    reason: Informal name; never met ICZN requirements for formal publication and is
      treated as referable to Deinonychus. Per Olshevsky's Dinosaur Genera List.
