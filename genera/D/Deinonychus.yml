genus: Deinonychus
parent: Eudromaeosauria
placement: incertae sedis
dispute:
  summary: >
    The subfamily placement of Deinonychus is genuinely unresolved. It has been
    recovered as a velociraptorine (Turner et al., 2012; Napoli et al., 2021;
    Powers et al., 2020), as a dromaeosaurine (DePalma et al., 2015; the placement
    Jones et al., 2026 adopt), and in a distinct clade with Utahraptor and
    Achillobator outside both subfamilies (Hartman et al., 2019; Jasinski et al.,
    2020). It is placed at Eudromaeosauria incertae sedis pending resolution.
  history:
    - date: "2026-07-01"
      note: Placed at Eudromaeosauria incertae sedis (least-inclusive uncontested clade); velociraptorine, dromaeosaurine, and own-clade hypotheses all current.
pronunciation:
  phonetic: dy-NON-ih-kuhs
  ipa: /daɪˈnɒnɪkəs/
etymology: From Ancient Greek deinos (δεινός, 'terrible') + onyx/onuchos
  (ὄνυξ/ὄνυχος, 'claw'), meaning 'terrible claw', referring to the enlarged
  sickle-shaped claw on the second toe.
description: Deinonychus is a genus of dromaeosaurid theropod dinosaur with one
  described species, Deinonychus antirrhopus. This species could grow up to 3.4
  meters (11 ft) long and lived during the Early and Late Cretaceous Period,
  about 115-93.9 million years ago. Fossils have been recovered from the U.S.
  states of Montana, Utah, Wyoming, and Oklahoma, in rocks of the Cloverly
  Formation and Antlers Formation.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Pes functionally didactyl (digits III and IV), with digit II bearing a very
    large, trenchant, strongly recurved ungual; distal end of metatarsal II
    deeply grooved; metatarsal III not greatly compressed proximally
  - Manus with three very long digits (phalangeal formula 2-3-4), digits IV and
    V lost; metacarpal I short and irregular, metacarpal III long, slender, and
    divergent; carpus of radiale and ulnare only, the radiale with a well-defined
    asymmetrical proximal ginglymus
  - Skull with large, sub-circular to oval orbits and three antorbital fenestrae;
    supraorbital rugosities on the postorbital and lacrimal; quadratojugal very
    small and T-shaped, apparently not contacting the squamosal; nasals long,
    narrow, and unfused
  - Presacral vertebrae with small but deep pleurocoels; caudal vertebrae behind
    the eighth or ninth bearing extremely long rod-like prezygapophyseal
    processes (up to ~10 segments) and correspondingly elongated paired chevron
    rods, stiffening the tail
  - Ischium with a triangular obturator process; pubis short and greatly expanded
    into a subcircular, scoop-shaped element with a distinct obturator foramen
  - Dentition of about four sub-incisiform premaxillary teeth, ~15 maxillary, and
    ~16 sub-isodont dentary teeth, with posterior serration denticles nearly
    twice the size of the anterior denticles
appearance:
  features:
    - sickle claw
  integument: feathered
  evidence: direct
