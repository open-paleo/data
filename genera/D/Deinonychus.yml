genus: Deinonychus
parent: Eudromaeosauria
pronunciation:
  phonetic: dy-NON-ih-kuhs
  ipa: /daɪˈnɒnɪkəs/
etymology: From Ancient Greek deinos (δεινός, 'terrible') + onyx/onuchos
  (ὄνυξ/ὄνυχος, 'claw'), meaning 'terrible claw', referring to the enlarged
  sickle-shaped claw on the second toe.
description: Deinonychus is a genus of dromaeosaurid theropod dinosaur with one
  described species, Deinonychus antirrhopus. This species could grow up to 3.4
  meters (11 ft) long and lived during the Early and Late Cretaceous Period,
  about 115-93.9 million years ago. Fossils have been recovered from the U.S.
  states of Montana, Utah, Wyoming, and Oklahoma, in rocks of the Cloverly
  Formation and Antlers Formation.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Digit II of pes highly specialized with very large, strongly recurved,
    trenchant ungual more than twice the size of other unguals; joint between
    proximal and penultimate phalanges permits extreme extension (90°+) but no
    flexion, elevating claw during locomotion.
  - Distal end of metatarsal II deeply grooved into an asymmetrical ginglymus
    not previously recognized in any other theropod.
  - Radiale bears a strongly asymmetrical ginglymus permitting ~100° of
    abduction-adduction and ~35-45° of supination; carpus consists of only
    ulnare and radiale.
  - All caudals posterior to the 8th or 9th bear extremely long (up to 10
    segments) rod-like double prezygapophyseal processes and correspondingly
    elongated paired chevron rods, rendering the tail virtually inflexible.
  - Pes functionally didactyl with weight-bearing axis shifted to between digits
    III and IV; digit II non-weight-bearing and elevated during normal
    locomotion.
