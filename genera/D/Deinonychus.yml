genus: Deinonychus
parent: Eudromaeosauria
pronunciation:
  ipa: /daɪˈnɒnɪkəs/
etymology: terrible claw
description: Deinonychus is a genus of dromaeosaurid theropod dinosaur with one
  described species, Deinonychus antirrhopus. This species could grow up to 3.4
  meters (11 ft) long and lived during the Early and Late Cretaceous Period, about
  115–93.9 million years ago. Fossils have been recovered from the U.S. states of
  Montana, Utah, Wyoming, and Oklahoma, in rocks of the Cloverly Formation and
  Antlers Formation.
diet: carnivore
locomotion: bipedal
