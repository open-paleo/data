notable_specimens:
  - specimen_id: [AMNH 3015]
    institution: AMNH
    species: Deinonychus antirrhopus
    category: reproductive
    significance: "The original and most complete Deinonychus specimen, found in 1931 near Billings, Montana. Fossilized eggshells in its matrix, in close contact with the gastralia, were identified as the first dromaeosaurid egg, suggesting the animal brooded its eggs."
    discovered:
      year: 1931
      by: "Barnum Brown"
    references: [makovicky2000a]
  - specimen_id: [MCZ 4371]
    institution: MCZ
    species: Deinonychus antirrhopus
    category: complementary
    significance: "A referred skeleton excavated in Montana in 1974, preserving well-preserved femora, pubes, a sacrum, better ilia, and pes and metatarsus elements that were missing or poorly known from earlier material, prompting Ostrom to revise his skeletal restoration of Deinonychus."
    discovered:
      year: 1974
      by: "Steven Orzack"
    references: [ostrom1976a]
references:
  - id: ostrom1969a
  - id: ostrom1969b
    notes: Comprehensive osteological monograph of Deinonychus antirrhopus
      providing the formal diagnosis; refers the genus to the Dromaeosauridae.
  - id: jones2026c
    notes: Source of the appearance features.
  - id: makovicky2000a
  - id: ostrom1976a
  - id: turner2012a
    notes: Recovered Deinonychus as a velociraptorine in its dromaeosaurid systematics review.
  - id: napoli2021a
    notes: New dromaeosaurid description's phylogeny recovered Deinonychus as a velociraptorine.
  - id: depalma2015a
    notes: Giant raptor description's phylogenetic analysis recovered Deinonychus as a dromaeosaurine.
  - id: hartman2019a
    notes: New paravian's phylogeny placed Deinonychus with Utahraptor and Achillobator outside both dromaeosaurid subfamilies.
  - id: jasinski2020a
    notes: New Mexico dromaeosaurid description supported placing Deinonychus outside velociraptorine/dromaeosaurine subfamilies.
  - id: powers2020a
    notes: Supported dromaeosaurine placement of Deinonychus via snout morphology character analysis
