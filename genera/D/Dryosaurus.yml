genus: Dryosaurus
parent: Dryosauridae
pronunciation:
  ipa: /ˌdraɪəˈsɔːrəs/
  phonetic: DRY-ə-SOR-əs
description: Dryosaurus meaning 'tree, oak' and σαυρος (sauros) meaning 'lizard'
  (the name reflects the forested habitat, not a vague oak-leaf shape of its
  cheek teeth as is sometimes assumed)) is an extinct genus of herbivorous
  ornithopod dinosaur that lived in the Late Jurassic period. It was an
  iguanodont (formerly classified as a hypsilophodont). Fossils have been found
  in the western United States and were first discovered in the late 19th
  century. Valdosaurus canaliculatus and Dysalotosaurus lettowvorbecki were both
  formerly considered to represent species of Dryosaurus.
diet: herbivore
