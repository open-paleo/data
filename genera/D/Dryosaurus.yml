  - name: Dryosaurus elderae
    etymology: Honors Ann Schaffer Elder (1958-2009) for her assistance to
      Carpenter at the Carnegie Quarry, Dinosaur National Monument.
    status: valid
    type_species: false
    period:
      name:
        - Late Jurassic
      stage:
        - Kimmeridgian
        - Tithonian
      from_ma: 154.8
      to_ma: 145
    location:
      country: US
      region: Utah
      formation: Morrison
      member: Brushy Basin
      locality: Carnegie Quarry, Dinosaur National Monument, Uintah County
    type_specimen:
      specimen_id:
        - CM 3392
      specimen_type: holotype
      institution: CM
      material: "Partial articulated skeleton: skull and lower jaw, six cervicals,
        thirteen dorsals, sacrum, pelvis, right scapula, coracoid and humerus,
        partial right hind limb, and an articulated left hind foot"
    diagnostic_features:
      - Maxillary teeth with a broad midline ridge bearing up to three fine
        secondary longitudinal ridges (weak primary ridge with few secondary
        ridges in D. altus)
      - Horizontal maxillary ramus of the jugal below the orbit deep (slender in
        D. altus)
      - Basal tuberae massive projections separated by a midline sulcus (a
        posteroventral sheet or wedge with no sulcus in D. altus)
      - Anterior cervical vertebrae low relative to their length (shorter and
        taller in D. altus)
      - Ilium long and low, especially the postacetabular process
    erected_in: carpenter2018b
notable_specimens:
  - specimen_id:
      - CM 11340
    institution: CM
    category: ontogeny
    significance: "Front half of a hatchling skeleton from Dinosaur National
      Monument, Utah. It confirmed that Dryosaurus followed craniofacial growth
      patterns seen in other vertebrates: proportionally large eyes and a short
      snout when young, with eyes shrinking and snout lengthening with age."
    discovered:
      year: 1922
      by: Earl Douglass
    references:
      - carpenter1994a
