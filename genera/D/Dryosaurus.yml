genus: Dryosaurus
parent: Dryosauridae
pronunciation:
  ipa: /ˌdraɪəˈsɔːrəs/
  phonetic: DRY-uh-SOR-uhs
etymology: "From Greek drys (δρῦς), 'tree' or 'oak', + Greek sauros, 'lizard'; means 'tree lizard', reflecting the forested habitat rather than the shape of its teeth"
description: Dryosaurus meaning 'tree, oak' and σαυρος (sauros) meaning 'lizard'
  (the name reflects the forested habitat, not a vague oak-leaf shape of its
  cheek teeth as is sometimes assumed)) is an extinct genus of herbivorous
  ornithopod dinosaur that lived in the Late Jurassic period. It was an
  iguanodont (formerly classified as a hypsilophodont). Fossils have been found
  in the western United States and were first discovered in the late 19th
  century. Valdosaurus canaliculatus and Dysalotosaurus lettowvorbecki were both
  formerly considered to represent species of Dryosaurus.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Cervical vertebrae long and biconcave (not opisthocoeolous as in
    Camptosaurus)
  - Six coossified vertebrae in sacrum, without peg-and-notch articulation
  - Prepubis long and narrow; postpubis elongate and slender
  - Femur shorter than tibia; posterior limbs very long
  - Metatarsals long and hollow; fifth metatarsal represented by short splint
    only
  - First digit in pes complete; five digits in manus, not nearly parallel
    (fifth not at right angles)
appearance:
  features:
    - keratinous beak
