genus: Dandakosaurus
parent: Tetanurae
etymology: Named after Dandakaranya, the ancient name for the region of central
  India (Andhra Pradesh) where the fossils were found, + Greek sauros
  ('lizard'), meaning 'Dandakaranya lizard'.
description: Dandakosaurus is a dubious genus of theropod dinosaur from the Kota
  Formation, Andhra Pradesh, India. It lived 183 to 175 million years ago from
  the latest Pliensbachian to the late Toarcian stages of the Early Jurassic.
  Little is known about the genus, and some paleontologists consider it to be a
  nomen dubium.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Pubis with expanded proximal end and pronounced articular surface for
    receiving iliac process
  - Ischium slender with expanded proximal end bearing three separate processes;
    distal end constricted and slightly twisted
  - Dorsal vertebrae heavy and opisthicoelous with no procoeli on lateral
    surface of centrum
  - Caudal vertebrae amphicoelous with lateral cavities on either side of
    centrum and wedge-shaped ventral surface
  - Teeth flattened and transversely expanded, curved toward apex, with fine
    serrations restricted to interior face only
