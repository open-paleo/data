genus: Dandakosaurus
parent: Averostra
placement: incertae sedis
dispute:
  summary: >
    Dandakosaurus indicus is a nomen dubium based on a single partial pubis; it has
    been interpreted as a possible ceratosaur or a basal tetanuran. Because these
    hypotheses span Ceratosauria and Tetanurae, it is placed conservatively at
    Averostra incertae sedis.
  history:
    - date: "2026-07-02"
      note: Moved from Tetanurae to Averostra incertae sedis; regarded as a nomen dubium of uncertain ceratosaur-versus-tetanuran affinity.
etymology: Named after Dandakaranya, the ancient name for the region of central
  India (Andhra Pradesh) where the fossils were found, + Greek sauros
  ('lizard'), meaning 'Dandakaranya lizard'.
pronunciation:
  phonetic: DAN-duh-ko-SOR-us
description: Dandakosaurus is a dubious genus of theropod dinosaur from the Kota
  Formation, Andhra Pradesh, India. It lived 183 to 175 million years ago from
  the latest Pliensbachian to the late Toarcian stages of the Early Jurassic.
  Little is known about the genus, and some paleontologists consider it to be a
  nomen dubium.
diet: carnivore
locomotion: bipedal
