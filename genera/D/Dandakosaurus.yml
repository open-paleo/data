genus: Dandakosaurus
parent: Tetanurae
etymology: Named after Dandakaranya, the ancient name for the region of central
  India (Andhra Pradesh) where the fossils were found, + Greek sauros
  ('lizard'), meaning 'Dandakaranya lizard'.
description: Dandakosaurus is a dubious genus of theropod dinosaur from the Kota
  Formation, Andhra Pradesh, India. It lived 183 to 175 million years ago from
  the latest Pliensbachian to the late Toarcian stages of the Early Jurassic.
  Little is known about the genus, and some paleontologists consider it to be a
  nomen dubium.
diet: carnivore
locomotion: bipedal
