genus: Dromaeosaurus
parent: Dromaeosaurinae
pronunciation:
  phonetic: DROH-mee-o-SAWR-us
  ipa: /ˌdroʊmiəˈsɔːrəs, -mi.oʊ-/
etymology: "From Greek dromaios, 'running/swift', + Greek sauros, 'lizard';
  means 'running lizard', referring to its presumed speed and agility"
description: Dromaeosaurus is a genus of dromaeosaurid theropod dinosaur that
  lived during the Late Cretaceous period (middle to late Campanian and
  Maastrichtian), sometime between 80 and 69 million years ago, in the Canadian
  province of Alberta and the western United States. The type species is
  Dromaeosaurus albertensis, which was described by William Diller Matthew and
  Barnum Brown in 1922. Its fossils were unearthed in the Hell Creek Formation,
  Horseshoe Canyon Formation and Dinosaur Park Formation. Teeth attributed to
  this genus have been found in the Prince Creek Formation. Dromaeosaurus is the
  type genus of both Dromaeosauridae and Dromaeosaurinae, which include many
  genera with similar characteristics to Dromaeosaurus such as possibly its
  closest relative Dakotaraptor. Dromaeosaurus was heavily built, more so than
  other dromaeosaurids that are similar in size, like Velociraptor.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Teeth asymmetrically oval or compressed, sharp-pointed, recurved, serrate on
    anterior and posterior borders; premaxillary teeth large, not reduced,
    strongly convex antero-externally but not of fully U-shaped section
  - Orbital fenestra larger proportionately than in Deinodon; lateral temporal
    fenestra of good size; preorbital fenestrae evidently large
  - Frontals comparatively long and wide with nasals overlapping considerably at
    the median line; prefrontal and postfrontal sutures continuous, not
    separated by an orbital notch
  - Maxillo-premaxillary suture nearly vertical, premaxilla large
  - Skull proportions most like Deinodon but one-third to one-fourth the linear
    size; light skull construction with large fenestrae
  - Metapodial distal end with deeply grooved ginglymoid distal facet and a very
    distinct lateral appression surface
