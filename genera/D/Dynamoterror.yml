genus: Dynamoterror
parent: Tyrannosaurinae
etymology: "From Greek dynamis (power) + Latin terror (terror): 'powerful terror'."
pronunciation:
  phonetic: die-NAM-o-TEH-ruh
description: Dynamoterror is a monospecific genus of tyrannosaurid dinosaur from
  New Mexico that lived during the Late Cretaceous (lower Campanian age, 78 Ma)
  in what is now the upper Allison Member of the Menefee Formation. The type and
  only species, Dynamoterror dynastes, is known from a subadult or adult
  individual about 9 meters (30 feet) long with an incomplete associated
  skeleton. It was named in 2018 by Andrew T. McDonald, Douglas G. Wolfe and
  Alton C. Dooley, Jr. Dynamoterror was closely related to Teratophoneus and
  Lythronax.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Prefrontonasal and prefrontolacrimal processes in close proximity on the
    frontal, separated only by a shallow notch (unambiguous autapomorphy).
  - Caudal part of the postorbital suture subrectangular, concave, and laterally
    projecting, separated from the rostral part by a deep groove (provisional
    autapomorphy).
