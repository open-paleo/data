genus: Diclonius
parent: Hadrosauridae
placement: incertae sedis
etymology: From Greek diklos ('double') + klonos ('sprout' or 'shoot'), meaning
  'double sprout', referring to the tooth-replacement method in which newly
  erupting teeth could be in use simultaneously with older worn teeth.
pronunciation:
  phonetic: die-KLOH-nee-us
description: Diclonius is a genus of dinosaur from the Late Cretaceous. It was a
  hadrosaur based solely on teeth. Its fossils were found in the Judith River
  Formation of Montana, northern US. The name is in reference to the method of
  tooth replacement, in which newly erupting replacement teeth could be in
  functional use at the same time as older, more worn teeth.
dispute:
  summary: >
    Diclonius is a nomen dubium based on isolated teeth, historically
    applied to a range of unrelated hadrosaurid material.
  history:
    - date: "2026-06-27"
      note: Placed at Hadrosauridae incertae sedis; nomen dubium.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
diagnostic_features:
  - Front of crown divided longitudinally by a prominent median keel; borders
    not serrate
  - Back of crown divided into three faces by two straight longitudinal parallel
    solid angles
  - Crown contracted near the base by lateral bevels for adjacent growing teeth
  - All back faces covered by granular-roughened cementum
  - Single series of teeth per row (formula 2-1); succession from the posterior
    base of the tooth
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "53044"
  - source: wikidata
    id: Q3706988
  - source: gbif
    id: "4823299"
  - source: eol
    id: "10579397"
species:
  - name: Diclonius pentagonus
    etymology: "From Greek 'pentagonus' meaning 'five-angled' or 'pentagonal',
      likely referring to the cross-sectional shape of the teeth on which the
      taxon was based."
    status: valid
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Campanian
    location:
      country: US
      region: US-MT
      formation: Judith River
      notes: Cope (1876) is titled for "the Fort Union Beds of Montana" but
        applies that name to the Fort Union bad lands of the Judith River, the
        same ground that yielded Leidy's Trachodon mirabilis. Lull and Wright
        (1942), quoting Sternberg's account of the 1876 expedition, add the camp
        on Dog Creek and list this species among the material taken there,
        though they mark the attribution with their own question mark.
    type_specimen:
      specimen_id: [ AMNH 3972 ]
      specimen_type: holotype
      institution: AMNH
      material: Teeth of an individual of moderate dimensions; a single series of
        teeth preserved in the jaw bone
      completeness: fragmentary
    erected_in: cope1876a
references:
  - id: cope1876a
    notes: Erects the species on teeth from "the Fort Union Beds of Montana",
      which the text equates with the bad lands of the Judith River. Gives no
      locality beyond that.
  - id: lull1942a
    notes: Quotes Sternberg's account of the 1876 expedition for a camp on Dog
      Creek east of the Judith River, listing this species among the material
      taken there but querying the attribution.
