genus: Dzharacursor
parent: Ornithomimidae
etymology: From Dzharakuduk (the type locality in Uzbekistan) and Latin 'cursor'
  (runner); meaning 'Dzharakuduk runner'.
pronunciation:
  phonetic: JAH-ruh-VEN-uh-tuh
description: Dzharacursor is an extinct genus of ornithomimid theropod dinosaur
  from the Turonian-age Bissekty Formation of the Kyzyl Kum Desert, Uzbekistan.
  The type and only species, Dzharacursor bissektensis, was originally named by
  Nessov (1995) as a tentative species of the North American genus
  Archaeornithomimus, then treated as a nomen dubium until Averianov and Sues
  (2024) erected the new genus on the basis of a juvenile femur holotype and a
  large hypodigm of referred postcranial and cranial material recovered from the
  Bissekty bonebed.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Frontal exposure on the dorsal orbital rim straight, similar in length to
    prefrontal facet; frontal domes separated by shallow median depression
  - Dorsal vertebrae lacking pleurocoels; anterior dorsals with pronounced
    hypapophyses and ventral keels
  - Posterior caudals with dorsoventrally flattened centra
  - Metacarpal I subequal in length to metacarpal II; distal articular end of
    metacarpal I ginglymoid; distal articular end of metacarpal II
    non-ginglymoid
  - Shallow notch between pubic peduncle and obturator process of ischium
  - Pedal unguals with pronounced flexor fossa and flexor tubercle; distal part
    of pedal unguals angled relative to proximal part
appearance:
  integument: feathered
  evidence: inferred
