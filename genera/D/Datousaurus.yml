genus: Datousaurus
parent: Eusauropoda
etymology: From Malay datu ('chieftain') + Greek sauros ('lizard'), meaning 'chieftain lizard' or 'big-head lizard'. The name also puns on the Chinese da tou ('big head'), referring to the animal's large skull.
description: Datousaurus is a sauropod dinosaur from the Middle Jurassic Lower
  Shaximiao Formation in Sichuan province, China. It shared the local Middle
  Jurassic landscape with other sauropods such as Shunosaurus, Omeisaurus, and
  Protognathosaurus, the neornithischian Xiaosaurus, and the early stegosaur
  Huayangosaurus as well as the carnivorous Gasosaurus.
diet: herbivore
locomotion: quadrupedal
