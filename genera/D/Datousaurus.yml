genus: Datousaurus
parent: Eusauropoda
pronunciation:
  phonetic: DAH-TOH-SAWR-us
etymology: From Malay datu ('chieftain') + Greek sauros ('lizard'), meaning
  'chieftain lizard' or 'big-head lizard'. The name also puns on the Chinese da
  tou ('big head'), referring to the animal's large skull.
description: Datousaurus is a sauropod dinosaur from the Middle Jurassic Lower
  Shaximiao Formation in Sichuan province, China. It shared the local Middle
  Jurassic landscape with other sauropods such as Shunosaurus, Omeisaurus, and
  Protognathosaurus, the neornithischian Xiaosaurus, and the early stegosaur
  Huayangosaurus as well as the carnivorous Gasosaurus.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Cervical vertebrae opisthocoel and greatly elongated, with well-developed
    lateral pleurocoels; cervical to dorsal centrum length ratio of 2.5:1
  - Skull large, heavy, short and high with bluntly rounded snout and paired
    anterior nares; antorbital fenestra small and triangular
  - Mandibular body high and robust, lacking a mandibular foramen; dentary
    well-developed
  - Dorsal vertebrae platycoelous with solid centra lacking obvious lateral
    pleurocoels and well-developed neural spine lamellar structure
  - Femur straight with sub-rounded cross-section, total length 122 cm; five
    digits present in both manus and pes with large, flattened claws
