genus: Dongyangopelta
parent: Nodosauridae
etymology: "From Dongyang (the city in Zhejiang Province, China, where it was
  found) + Greek pelte (shield): 'Dongyang shield', referring to its nodosaurid
  armor and discovery locality."
description: Dongyangopelta is an monospecific genus of nodosaurid dinosaur that
  lived in China during the Early to Late Cretaceous period (Albian to
  Cenomanian stages, 105-96 Ma) in what is now the Chaochuan Formation. The type
  and only known species, Dongyangopelta yangyanensis, is known from a partial
  postcranial skeleton preserving osteoderms and ossified tendons. It was named
  in 2013 by Rongjun Chen, Wenjie Zheng, Yoichi Azuma, Masateru Shibata,
  Tianling Lou, Qiang Jin and Xinsheng Jin. Dongyangopelta represents one of the
  only nodosaurids known from Asia, along with Taohelong and Sauroplites.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - lacustrine
appearance:
  integument: armored
diagnostic_features:
  - Anterior surface of first sacrodorsal centrum strongly inflates laterally
    and slightly curves posteriorly
  - Fused pelvic shield composed of larger pebble-shaped bosses defined by
    smaller tubercles or flat expanses of bone
  - Domed triadiate osteoderm present
  - Iliac blade slightly convex dorsally above acetabulum, turns steeply
    downward laterally and recurves almost horizontally at lateralmost edge
    (sigmoid curvature)
  - Anterior end of preacetabular process curves lateroventally and bears a
    shallow groove on lateral and anterior edges
  - Femur robust with ratio of maximum distal width to total femur length equal
    to 0.41
