genus: Dromiceiomimus
parent: Ornithomimidae
etymology: From Greek 'dromaios' meaning 'fast-running' (as in the emu genus Dromaius), 'mimos' meaning 'mimic', reflecting its resemblance to the emu; meaning roughly 'emu mimic'.
description: Dromiceiomimus is a genus of ornithomimid theropod from the Late
  Cretaceous (early Maastrichtian) of Alberta, Canada. The type species, D.
  brevitertius, is considered a synonym of Ornithomimus edmontonicus by some
  authors, while others consider it a distinct and valid taxon. It was a small
  ornithomimid that weighed about 135 kilograms (298 lb).
