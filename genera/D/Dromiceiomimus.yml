genus: Dromiceiomimus
parent: Ornithomimidae
pronunciation:
  phonetic: drom-i-SEE-o-MIEM-us
etymology: From Greek 'dromaios' meaning 'fast-running' (as in the emu genus
  Dromaius), 'mimos' meaning 'mimic', reflecting its resemblance to the emu;
  meaning roughly 'emu mimic'.
description: Dromiceiomimus is a genus of ornithomimid theropod from the Late
  Cretaceous (early Maastrichtian) of Alberta, Canada. The type species, D.
  brevitertius, is considered a synonym of Ornithomimus edmontonicus by some
  authors, while others consider it a distinct and valid taxon. It was a small
  ornithomimid that weighed about 135 kilograms (298 lb).
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Presacral vertebral column shorter than combined femur, tibia-astragalus,
    and metatarsal III lengths
  - Posterior width of caudal centra less than half their length; tail
    transition point between caudals 12-13
  - Tibia and metatarsus longer relative to femur than in Struthiomimus;
    enhanced cursorial adaptation
  - Antilium and digit III of pes longer relative to femur; distinctive
    long-limbed proportions
  - Metatarsal III unossified proximally, pinched out by metatarsals II and IV
    distally
appearance:
  integument: feathered
  evidence: inferred
