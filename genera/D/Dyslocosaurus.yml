genus: Dyslocosaurus
parent: Dicraeosauridae
dispute:
  summary: >
    Dyslocosaurus is known only from fragmentary appendicular material,
    originally described as a diplodocid (McIntosh et al., 1992), and the
    association of that material has been questioned. Wilson and Sereno (1998)
    argued that two pedal phalanges and a small ungual are non-sauropod bones
    that do not belong with the specimen, while Tschopp et al. (2015) separately
    judged one pes phalanx to have been collected apart from the rest and
    excluded it. Both nonetheless retained the remainder as a valid taxon;
    Tschopp et al. (2015) found it diagnostic — uniting apatosaurine,
    diplodocine, and dicraeosaurid traits — and recovered it as the most basal
    dicraeosaurid.
  history:
    - date: "2026-06-30"
      note: >
        Placed at Dicraeosauridae following the tentative assignment of Tschopp
        et al. (2015); the fragmentary, possibly composite holotype and the
        nomen dubium concern are noted.
    - date: "2026-07-21"
      note: Dispute corrected and status kept valid — the chimeric elements are
        non-sauropod pedal bones (Wilson and Sereno, 1998), not "titanosaur and
        theropod" bones; both Wilson and Sereno (1998) and Tschopp et al. (2015)
        retain the remainder as a valid taxon, so the unsupported nomen-dubium
        framing was removed.
pronunciation:
  phonetic: dis-LOK-o-SAWR-us
etymology: From Greek dys-, 'hard/difficult', + Greek lokos (topos), 'place', + Greek sauros, 'lizard'; means 'hard-to-place lizard', reflecting difficulty classifying it taxonomically
description: Dyslocosaurus is an extinct genus of diplodocoid sauropod dinosaur
  from the Late Jurassic Morrison Formation of Wyoming, United States. The type
  and only species, Dyslocosaurus polyonychius, was described by McIntosh,
  Coombs, and Russell in 1992 from fragmentary remains including limb bones and
  a partial manus.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Proximodistal length of astragalus equal to about 50% of transverse breadth,
    a higher percentage than in other diplodocids.
  - Metatarsals with greater shaft circumference relative to length than in
    other diplodocids.
appearance:
  features:
    - multiple pedal claws
  integument: scaled
  evidence: inferred
