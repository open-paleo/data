genus: Dyslocosaurus
parent: Dicraeosauridae
etymology: From Greek dys-, 'hard/difficult', + Greek lokos (topos), 'place', + Greek sauros, 'lizard'; means 'hard-to-place lizard', reflecting difficulty classifying it taxonomically
description: Dyslocosaurus is an extinct genus of diplodocoid sauropod dinosaur
  from the Late Jurassic Morrison Formation of Wyoming, United States. The type
  and only species, Dyslocosaurus polyonychius, was described by McIntosh,
  Coombs, and Russell in 1992 from fragmentary remains including limb bones and
  a partial manus.
diet: herbivore
