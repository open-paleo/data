genus: Dyslocosaurus
parent: Dicraeosauridae
dispute:
  summary: >
    Dyslocosaurus is known from fragmentary limb material originally described as
    a diplodocid (McIntosh et al., 1992). Recent analyses tentatively recover it
    as a dicraeosaurid (Tschopp et al., 2015; Whitlock et al., 2025), but the
    material is poor and possibly composite, and some workers regard the genus as
    a nomen dubium, with a suggestion that the holotype combines titanosaur and
    theropod elements.
  history:
    - date: "2026-06-30"
      note: >
        Placed at Dicraeosauridae following the tentative assignment of recent
        analyses (Tschopp et al., 2015; Whitlock et al., 2025); the fragmentary,
        possibly composite holotype and the nomen dubium concern are noted.
pronunciation:
  phonetic: dis-LOK-o-SAWR-us
etymology: From Greek dys-, 'hard/difficult', + Greek lokos (topos), 'place', + Greek sauros, 'lizard'; means 'hard-to-place lizard', reflecting difficulty classifying it taxonomically
description: Dyslocosaurus is an extinct genus of diplodocoid sauropod dinosaur
  from the Late Jurassic Morrison Formation of Wyoming, United States. The type
  and only species, Dyslocosaurus polyonychius, was described by McIntosh,
  Coombs, and Russell in 1992 from fragmentary remains including limb bones and
  a partial manus.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Proximodistal length of astragalus equal to about 50% of transverse breadth,
    a higher percentage than in other diplodocids.
  - Metatarsals with greater shaft circumference relative to length than in
    other diplodocids.
  - Ungual phalanx present on digit IV of pes, unique among Diplodocidae.
  - Possible ungual phalanx on digit V of pes, which if confirmed would be
    unique among all known Sauropoda.
