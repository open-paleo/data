    category: gut-contents
    significance: "Found at Bügiin Tsav, this near-complete specimen preserved more than 1,400 gastroliths among its ribs and gastralia, including fish vertebrae and scales that indicate omnivory. Reunited with poached, repatriated skull, hand, and feet, it yielded the first known Deinocheirus skull."
    discovered:
      year: 2009
    references: [lee2014a]
  - specimen_id: [MPC-D 100/128]
    institution: MPC
    species: Deinocheirus mirificus
    category: complementary
    significance: "A subadult, only 74 percent the size of the largest individual, collected at the Altan Uul IV locality. It fills most gaps left by specimen MPC-D 100/127, preserving nearly all dorsal and caudal vertebrae, the ilium, a partial ischium, and most of the left hindlimb."
    discovered:
      year: 2006
    references: [lee2014a]
