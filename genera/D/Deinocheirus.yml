    significance: "Found at Bugiin Tsav, this near-complete specimen preserved more than 1,400 gastroliths among its ribs and gastralia, including fish vertebrae and scales that indicate omnivory. Reunited with poached, repatriated skull, hand, and feet, it yielded the first known Deinocheirus skull."
