genus: Dolichosuchus
parent: Neotheropoda
placement: incertae sedis
dispute:
  summary: >
    Dolichosuchus cristatus is a nomen dubium based on a single tibia,
    originally identified as a crocodylomorph and later suggested to be a
    neotheropod near Liliensternus or Dilophosaurus (Rauhut and
    Hungerbühler, 2000).
pronunciation:
  phonetic: do-LIK-o-SOO-kus
etymology: "From Greek dolichos (long) + soukhos (crocodile): 'long crocodile',
  a name reflecting its originally uncertain archosaur affinities."
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "56375"
  - source: wikidata
    id: Q1235583
  - source: gbif
    id: "4818418"
species:
  - name: Dolichosuchus cristatus
    etymology: "From Latin 'cristatus' meaning 'crested'."
    pronunciation:
      phonetic: kris-TAT-us
    status: nomen dubium
    type_species: true
    period:
      name:
        - Late Triassic
      stage:
        - Norian
    location:
      country: DE
      locality: Stuttgart-Kaltental
      region: DE-BW
      formation: Löwenstein
    type_specimen:
      specimen_id: [ NHMUK PV OR 38058 ]
      specimen_type: holotype
      institution: NHMUK
      material: Single tibia (lower leg bone)
      completeness: fragmentary
    erected_in: huene1932a
references:
  - id: huene1932a
  - id: sues2025a
    notes: Gives the type locality as Stuttgart-Kaltental and the type horizon
      as the Löwenstein Formation, for which Stubensandstein is the
      superseded name.
  - id: rauhut2000a
    notes: Reviewed European Triassic theropods, treating Dolichosuchus as a nomen dubium.
