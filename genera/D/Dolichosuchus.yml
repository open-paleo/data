genus: Dolichosuchus
parent: Neotheropoda
dispute:
  summary: >
    Dolichosuchus cristatus is a nomen dubium based on a single tibia,
    originally identified as a crocodylomorph and later suggested to be a
    neotheropod near Liliensternus or Dilophosaurus (Rauhut and
    Hungerbuhler, 1998).
  history:
    - date: "2026-06-30"
      note: >
        Placed at Neotheropoda incertae sedis; nomen dubium (P2).
pronunciation:
  phonetic: do-LIK-o-SOO-kus
etymology: "From Greek dolichos (long) + soukhos (crocodile): 'long crocodile',
  a name reflecting its originally uncertain archosaur affinities."
description: Dolichosuchus is the name given to a genus of dinosaur from the
  Triassic. It was originally classified in the disused family Hallopodidae, but
  has since been reclassified as a coelophysoid. A single fossil (consisting of
  a single lower leg bone, or tibia) was found in Germany (specimen NHMUK PV OR
  38058). Since only one bone was discovered, the genus is considered a nomen
  dubium. Some scientists have noted that the tibia closely resembles those of
  Liliensternus and Dilophosaurus.
diet: carnivore
locomotion: bipedal
