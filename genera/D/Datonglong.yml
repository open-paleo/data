genus: Datonglong
parent: Hadrosauroidea
etymology: From Datong (the city in Shanxi, China near the discovery site) +
  Chinese long (龍), 'dragon'; means 'Datong dragon'
pronunciation:
  phonetic: dah-tong-long
description: Datonglong is an extinct genus of herbivorous ornithopod dinosaur,
  belonging to the Hadrosauroidea, which lived in the Late Cretaceous period in
  present-day China. Its type species is Datonglong tianzhenensis.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Two functional teeth in each alveolus along at least the mid- and caudal
    dentary occlusal plane (autapomorphy)
  - Distally offset primary ridge on the enameled lingual surface of dentary
    tooth crown
  - Well-developed secondary ridge on the lingual surface of dentary tooth crown
  - No additional ridge(s) beyond the primary and secondary ridges on the
    lingual crown surface
  - Slightly distally curved apical half of the primary ridge
