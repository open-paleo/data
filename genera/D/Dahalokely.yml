genus: Dahalokely
parent: Brachyrostra
etymology: "From Malagasy 'dahalo' meaning 'thief' and 'kely' meaning 'small', giving 'small thief', referring to its estimated small size relative to known abelisaurids; the specific name tokana means 'lonely' in Malagasy, referencing Madagascar's isolation."
description: Dahalokely is an extinct genus of carnivorous abelisauroid theropod
  dinosaur from the Late Cretaceous (Turonian) of Madagascar.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Mid-cervical vertebrae with prezygoepipophyseal lamina bearing prominent
    convexity at midpoint nearly equal in length to centrum, with prominent
    notches at either end separating convexity from epipophyses.
  - Prezygapophyses and centroprezygapophyseal lamina nearly vertical and linear
    in lateral view in D1 and D2, with cranial margin of prezygapophyses and
    cranial face of centrum nearly co-planar.
  - Postzygapophyses on D2 strongly concave.
  - Infraprezygapophyseal fossa divided by a stout lamina into larger dorsal and
    smaller ventral portions through D6.
