genus: Delapparentia
parent: Styracosterna
placement: incertae sedis
etymology: Honors Albert Félix de Lapparent (1905-1975), who first studied this
  skeleton and pioneered dinosaur paleontology in Spain.
description: Delapparentia is a genus of iguanodont dinosaur from the Early
  Cretaceous period of Galve, Teruel Province, Spain.
dispute:
  summary: >
    The validity of Delapparentia is contested. Ruiz-Omeñaca (2011) erected the
    genus for a postcranial skeleton that Lapparent had assigned to Iguanodon
    bernissartensis in 1960, diagnosing it on three autapomorphies. Norman
    subsequently treated it as a nomen dubium. Gasca and others (2015)
    redescribed the holotype, added an axial neural arch and a scapular fragment
    to it, emended the diagnosis to a single autapomorphy of the axis plus a
    unique combination of postcranial characters, and argued for validity.
    Verdú and others (2017) went the other way, reporting that comparison
    revealed no significant differences from Iguanodon and figuring the holotype
    material as Iguanodon sp. Rotatori and others (2026) again recover it as a
    distinct terminal taxon. Its position is unresolved in step with this: Gasca
    and others (2015) place it in an unresolved polytomy outside Iguanodontoidea
    alongside Barilium and Lanzhousaurus, whereas Rotatori and others (2026)
    recover it within Iguanodontidae in an Iberian Barremian clade with
    'Iguanodon' galvensis and Magnamanus soriaensis, arguing the resulting
    paraphyly requires narrowing Iguanodon. It is placed at Styracosterna
    incertae sedis, the least inclusive clade common to those hypotheses.
  history:
    - date: "2026-08-07"
      note: >
        Intaken at Styracosterna incertae sedis with the species marked
        disputed. The genus was absent from the dataset entirely after an
        unsupported synonymy was removed from Iguanodon; see the orphaned-taxa
        audit. diagnostic_features follow the emended diagnosis of Gasca and
        others (2015), which supersedes the original.
diet: herbivore
diagnostic_features:
  - Axis with a tall neural spine, its height from the base of the
    postzygapophysis being greater than half the length of the neural arch.
  - Lateral surface of the preacetabular process of the ilium twists around its
    long axis toward its anterior end so that it comes to face almost dorsally.
  - Rim of the sacrodorsal rib facet is visible, in lateral view, in the
    preacetabular notch of the ilium.
  - In profile, the dorsal edge of the ilium is practically straight between the
    anterior end of the preacetabular process and the part dorsal to the ischial
    peduncle.
  - Anterior caudal vertebrae have dorsoventrally expanded (higher than wide)
    centra.
  - Neural spines of the caudal vertebrae are elongated, posterodorsally
    inclined and transversely thickened.
