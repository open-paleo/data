references:
  - id: ruiz-omeñaca2011a
    notes: Erects the genus for a skeleton Lapparent had assigned to Iguanodon
      bernissartensis, and enumerates the holotype elements in its appendix.
  - id: gasca2015a
    notes: Redescribes the holotype, adds an axial neural arch and scapular
      fragment, emends the diagnosis, and argues for validity.
  - id: verdú2017a
    notes: Reports no significant differences from Iguanodon and figures the
      holotype material as Iguanodon sp.
  - id: rotatori2026a
    notes: Recovers the genus as a distinct terminal in an Iberian Barremian
      clade with 'Iguanodon' galvensis and Magnamanus soriaensis.
  - id: verdú2015a
    notes: Describes Iguanodon galvensis and compares it directly with
      Delapparentia.
  - id: gasulla2015a
    notes: Lists the genus among the Iberian styracosternans in the description
      of Morelladon.
  - id: santoscubedo2021a
    notes: Notes that no dentary has been described for the genus, in the
      description of Portellsaurus.
  - id: mcdonald2012a
    notes: Basal iguanodont phylogeny underlying the matrix later used for the
      genus.
