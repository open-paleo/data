genus: Datanglong
parent: Avetheropoda
placement: incertae sedis
dispute:
  summary: >
    Datanglong guangxiensis is a fragmentary theropod of uncertain position. It was
    described as a basal carcharodontosaurian (Mo et al., 2014) and is treated as an
    indeterminate carcharodontosaurid by Kellermann et al. (2025) and Jones and Viola
    (2026), but has also been recovered as a coelurosaur (Cau, 2014) and, in one of
    three analyses, as a basal megaraptoran (Samathi et al., 2024). Because these
    hypotheses span Allosauroidea and Coelurosauria, it is placed conservatively at
    Avetheropoda incertae sedis.
  history:
    - date: "2026-07-01"
      note: Moved from Carcharodontosauria to Avetheropoda incertae sedis.
    - date: "2026-07-02"
      note: Confirmed placement at Avetheropoda incertae sedis; the carcharodontosaurian-versus-coelurosaur position remains unresolved.
etymology: From Datang (the basin in Guangxi, China where it was found) + Chinese long (龍), 'dragon'; means 'Datang dragon'
pronunciation:
  phonetic: dah-tang-long
description: Datanglong is an extinct genus of tetanuran theropod of uncertain
  taxonomic placement. It existed during Xinlong Formation, Early Cretaceous
  (Barremian-Albian), in what is now Guangxi China.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Posteriormost dorsal vertebra with teardrop-shaped pneumatic foramen
    confined by enlarged pcdl, acpl, and centrum
  - Posteriormost dorsal with well-developed, horizontal prezygoparapophyseal
    lamina (prpl)
  - Posteriormost dorsal with parapophysis projecting more laterally than the
    diapophysis
  - Brevis fossa shallow with short, ridge-like medial blade
  - Iliac pubic peduncle with posteroventrally expanded margin
appearance:
  integument: scaled
  evidence: inferred
