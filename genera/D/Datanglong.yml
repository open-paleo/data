genus: Datanglong
parent: Carcharodontosauria
etymology: From Datang (the basin in Guangxi, China where it was found) + Chinese long (龍), 'dragon'; means 'Datang dragon'
pronunciation:
  phonetic: dah-tang-long
description: Datanglong is an extinct genus of tetanuran theropod of uncertain
  taxonomic placement. It existed during Xinlong Formation, Early Cretaceous
  (Barremian-Albian), in what is now Guangxi China.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Posteriormost dorsal vertebra with teardrop-shaped pneumatic foramen
    confined by enlarged pcdl, acpl, and centrum
  - Posteriormost dorsal with well-developed, horizontal prezygoparapophyseal
    lamina (prpl)
  - Posteriormost dorsal with parapophysis projecting more laterally than the
    diapophysis
  - Brevis fossa shallow with short, ridge-like medial blade
  - Iliac pubic peduncle with posteroventrally expanded margin
appearance:
  integument: scaled
  evidence: inferred
