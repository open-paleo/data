genus: Dryptosauroides
parent: Abelisauridae
etymology: From Dryptosaurus (Marsh's North American genus) and
  Greek -oides (resembling); meaning "Dryptosaurus-like", in
  reference to the perceived similarity in vertebral shape.
description: >
  Dryptosauroides is a problematic large theropod from the
  Maastrichtian Lameta Group of central India, erected by Huene
  and Matley (1933) on a syntype series of six large vertebrae
  (GSI K20/334, K20/609, K27/549, K27/601, K27/602, K27/626)
  from the Carnosaur bed at Bara Simla, Jabalpur. Huene
  originally interpreted the type vertebrae as dorsals; the
  formal re-evaluation by Novas, Agnolin and Bandyopadhyay (2004)
  reinterprets them as anterior caudals, refers all the
  Carnosaur-bed theropod material to Abelisauroidea, and treats
  Dryptosauroides as a nomen dubium because the type material
  lacks unambiguous autapomorphies.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Dorsal vertebrae very large, centra 13-14 cm long and ~10 cm high, broadly
    rounded ventrally and constricted in the middle, without pleurocoela
  - Articular faces of dorsal centra only slightly concave
  - Below and in front of the dorsal spine and behind the prezygapophyses there
    is a double recess divided in the median line by a thin vertical wall
  - Postzygapophyses project well beyond the posterior end of the centrum
  - Dorsal spine has a long base; beginning of diapophysis and dorsal spine 5 cm
    from anterior margin of vertebra
  - Cervical centrum 12 cm long with strong downward-directed parapophyses fully
    at the base; anterior margin projects ventrally and parapophyses pass into
    it; prezygapophyses very strong and broadly expanded laterally
