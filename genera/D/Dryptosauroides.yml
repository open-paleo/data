references:
  - id: huene1933a
    notes: Erects Dryptosauroides grandis on a syntype series of six large
      vertebrae from the Carnosaur bed at Bara Simla, Jabalpur (Lameta Group);
      originally identified as dorsals.
  - id: novas2004b
    notes: Formal review of the Huene and Matley (1933) Carnosaur-bed theropods;
      treats Dryptosauroides as a nomen dubium and reinterprets the syntype
      vertebrae as anterior caudals referable to Abelisauroidea.
  - id: molina-pérez2019a
