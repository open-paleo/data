genus: Dryptosauroides
parent: Abelisauridae
placement: incertae sedis
dispute:
  summary: >
    Dryptosauroides is based on caudal vertebrae and is generally regarded
    as a nomen dubium (Novas and colleagues, 2004); the material is now
    thought to represent an indeterminate abelisaurid.
pronunciation:
  phonetic: DRIP-toh-sawr-OY-deez
etymology: From Dryptosaurus (Marsh's North American genus) and
  Greek -oides (resembling); meaning "Dryptosaurus-like", in
  reference to the perceived similarity in vertebral shape.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "38604"
  - source: wikidata
    id: Q135276
  - source: gbif
    id: "4818276"
species:
  - name: Dryptosauroides grandis
    etymology: Latin grandis ("large"), reflecting the size
      of the type vertebrae compared with other theropods of
      the type horizon.
    pronunciation:
      phonetic: GRAN-dis
    status: nomen dubium
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Maastrichtian
    location:
      country: IN
      region: IN-MP
      formation: Lameta
      locality: Bara Simla
      bed: Carnosaur Bed
    type_specimen:
      specimen_id:
        - GSI K20/334
