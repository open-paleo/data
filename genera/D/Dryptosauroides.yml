        - GSI K27/549
        - GSI K27/601
        - GSI K27/602
        - GSI K27/626
      specimen_type: syntype
      institution: GSI
      material: Six large vertebral centra (each 13-14 cm long); originally described as
        dorsal vertebrae but later reinterpreted as anterior caudals.
