genus: Doolysaurus
parent: Thescelosaurinae
etymology: Named for Dooly the Little Dinosaur, a Korean cartoon baby dinosaur
  character created by Soo-Jung Kim in 1983, with Greek 'sauros' (lizard); meaning
  'Dooly lizard'.
pronunciation:
  phonetic: DOO-lee-SOR-us
dispute:
  summary: >
    Doolysaurus is recovered within Thescelosaurinae, as sister to a clade
    of Parksosaurus, Fona, and Thescelosaurus, in the primary (Bayesian
    and majority-rule) analyses of Jung and colleagues (2026). A sensitivity
    analysis using the Avrahami and colleagues (2024) matrix instead recovered
    it as a basal orodromine.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Lateromedial widths of the crista tibiofibularis and the medial condyle of
    the distal femur are roughly equal near the base (ch.833:0)
appearance:
  integument: scaled
  evidence: inferred
