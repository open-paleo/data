    id: "519157"
  - source: wikidata
    id: Q138722514
species:
  - name: Doolysaurus huhmini
    etymology: "Named for paleontologist Min Huh, founder of the Korean Dinosaur Research Center and contributor to dinosaur research in Korea."
    status: valid
    type_species: true
    period:
      name:
