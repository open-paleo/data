genus: Doolysaurus
parent: Thescelosaurinae
etymology: "Combines a reference to 'Dooly the Little Dinosaur', a Korean cartoon character, with Ancient Greek 'sauros' meaning 'lizard'; the specific name huhmini honors paleontologist Min Huh, founder of the Korean Dinosaur Research Center."
pronunciation:
  phonetic: DOO-lee-SOR-us
description: Doolysaurus is an extinct genus of thescelosaurid ornithischian
  dinosaur known from the Cretaceous (Albian-lower Cenomanian) Ilseongsan
  Formation of South Korea. The genus contains a single species, Doolysaurus
  huhmini, known from the partial skeleton of a small juvenile individual. It is
  the first named South Korean dinosaur with diagnostic cranial material,
  providing important insight into the early evolution of thescelosaurid
  ornithischians in East Asia, and the second named basal neornithischian from
  South Korea after Koreanosaurus.
dispute:
  summary: >
    Doolysaurus is recovered within Thescelosaurinae, as sister to a clade
    of Parksosaurus, Fona, and Thescelosaurus, in the primary (Bayesian
    and majority-rule) analyses of Jung and others (2026). A sensitivity
    analysis using the Avrahami and others (2024) matrix instead recovered
    it as a basal orodromine.
  history:
    - date: "2026-06-29"
      note: Placed at Thescelosaurinae following the primary result of Jung and others (2026); the Orodrominae alternative from their sensitivity analysis is recorded.
diet: herbivore
locomotion: bipedal
paleoenvironment:
