  - specimen_id: [OTM 200]
    institution: OTM
    category: gut-contents
    significance: "Two Medicine Formation specimen preserving the digested remains of a juvenile hadrosaur in its gut region, providing direct evidence that Daspletosaurus fed on hadrosaurs."
