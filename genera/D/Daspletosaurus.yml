genus: Daspletosaurus
parent: Tyrannosaurinae
etymology: From Greek daspletos ('frightful') + sauros ('lizard'), meaning
  'frightful lizard'.
pronunciation:
  phonetic: das-PLEET-uh-SOR-uhs
  ipa: /dæsˌpliːtəˈsɔːrəs/
description: Daspletosaurus is a genus of tyrannosaurid dinosaur that lived in
  Laramidia between about 77 and 74.4 million years ago, during the Late
  Cretaceous Period. The genus Daspletosaurus contains three named species.
  Fossils of the earlier type species, D. torosus, have been found in Alberta,
  while fossils of a later species, D. horneri, have been found in Montana and
  Alberta. D. wilsoni has been suggested as an intermediate species between D.
  torosus and D. horneri that evolved through anagenesis, though further
  research may be required to definitively support the theory.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Premaxilla does not contact nasal below external naris.
  - Lacrimal 'horn' triangular in lateral aspect, with apex centered above
    antorbital ramus of bone; exceeds postorbital 'horn' in development.
  - Neural spine of fourth cervical vertebra much larger than that of fifth;
    spine of fifth distally pointed.
  - In adults humerus length estimated equal to 38 per cent of femur length;
    forelimb powerfully developed.
  - Anterodistal condyle of metacarpal I reduced, causing first digit to diverge
    distally from second.
  - In adults circumference of femur equals 38 to 41 per cent of femur length.
