genus: Daspletosaurus
parent: Daspletosaurini
etymology: From Greek daspletos ('frightful') + sauros ('lizard'), meaning 'frightful lizard'.
pronunciation:
  phonetic: das-PLEET-uh-SOR-uhs
  ipa: /dæsˌpliːtəˈsɔːrəs/
description: Daspletosaurus is a genus of tyrannosaurid dinosaur that lived in
  Laramidia between about 77 and 74.4 million years ago, during the Late
  Cretaceous Period. The genus Daspletosaurus contains three named species.
  Fossils of the earlier type species, D. torosus, have been found in Alberta,
  while fossils of a later species, D. horneri, have been found in Montana and
  Alberta. D. wilsoni has been suggested as an intermediate species between D.
  torosus and D. horneri that evolved through anagenesis, though further
  research may be required to definitively support the theory.
diet: carnivore
locomotion: bipedal
