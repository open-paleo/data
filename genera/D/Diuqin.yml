genus: Diuqin
parent: Unenlagiinae
dispute:
  summary: >
    Diuqin is an incomplete, somatically immature unenlagiine whose describers
    recovered it as a paravian with several plausible positions, the strongest
    affinity being with Unenlagiinae (Porfiri et al., 2024). It is placed in
    Unenlagiinae following that assessment, with its instability noted.
  history:
    - date: "2026-07-01"
      note: Placed in Unenlagiinae following Porfiri et al. (2024); phylogenetically unstable, immature holotype.
etymology: "From Mapudungun diuqin: 'bird of prey', referring to its classification as a predatory theropod."
pronunciation:
  phonetic: dee-YOO-kin
description: Diuqin is an extinct genus of unenlagiine theropod dinosaurs from
  the Late Cretaceous (Santonian) Bajo de la Carpa Formation of Argentina. The
  genus contains a single species, Diuqin lechiguanae, known from a humerus and
  fragmentary vertebrae.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - arid
diagnostic_features:
  - Horizontal accessory lamina between spinopostzygapophyseal laminae on
    posteriormost sacral vertebra
  - Pair of elliptical, bilateral, dorsolaterally-ventromedially oriented
    foramina immediately anterolateral to base of neural spine in posteriormost
    sacral and anterior caudal vertebrae
  - Distolateral deltopectoral ridge of humerus arises on distal half of
    deltopectoral crest, extending across anterolateral one-third of shaft
appearance:
  integument: feathered
  evidence: inferred
