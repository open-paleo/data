genus: Dreadnoughtus
parent: Lithostrotia
etymology: Named after the dreadnought class of battleships, from Old English
  meaning 'fears nothing', in reference to the animal's immense size which would
  have made it largely invulnerable to predators.
description: Dreadnoughtus is a genus of titanosaurian sauropod dinosaur
  containing a single species, Dreadnoughtus schrani. It is known from two
  partial skeletons discovered in Upper Cretaceous (Campanian to Maastrichtian,
  approximately 76-70 million years ago) rocks of the Cerro Fortaleza Formation
  in Santa Cruz Province, Argentina. It is one of the largest terrestrial
  vertebrates known from reasonably complete remains, with the immature type
  specimen measuring 26 meters (85 ft) in total body length and weighing up to
  48-49 metric tons (53-54 short tons).
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - First caudal centrum with axial ventral keel.
  - Anterior caudal neural spines with extensively subdivided pneumatocoel
    between spinoprezygapophyseal and spinopostzygapophyseal laminae.
  - Anterior caudal neural spines with hypertrophied prespinal and postspinal
    laminae.
  - Middle caudal neural spines with triangular anterodorsal process extending
    well beyond anterior margin of centrum.
  - Anterior haemal arches with paddle-shaped distal expansion.
  - Posterodorsally-anteroventrally oriented ridge on medial surface of anterior
    end of scapular blade.
