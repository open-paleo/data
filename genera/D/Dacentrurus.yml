genus: Dacentrurus
parent: Dacentrurinae
pronunciation:
  phonetic: da-sen-TROOR-us
etymology: From Greek dakno ('to bite' or 'pointed') + oura ('tail'), meaning 'tail full of points', referring to the spikes on the animal's tail.
description: Dacentrurus is an extinct genus of stegosaurian dinosaur from the
  Late Jurassic and perhaps Early Cretaceous (154–140 million years ago) of
  Europe. Its type species, D. armatus, was named in 1875 as Omosaurus armatus,
  based on a skeleton found in a clay pit in the Kimmeridge Clay in Swindon,
  England. In 1902 the genus was renamed Dacentrurus because the name Omosaurus
  had already been used for a phytosaur in 1856. After 1875, half a dozen other
  species would be named but perhaps only Dacentrurus armatus is valid.
diet: herbivore
locomotion: quadrupedal
