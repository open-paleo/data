genus: Dacentrurus
parent: Dacentrurinae
pronunciation:
  phonetic: da-sen-TROOR-us
etymology: From Greek dakno ('to bite' or 'pointed') + oura ('tail'), meaning
  'tail full of points', referring to the spikes on the animal's tail.
description: Dacentrurus is an extinct genus of stegosaurian dinosaur from the
  Late Jurassic and perhaps Early Cretaceous (154-140 million years ago) of
  Europe. Its type species, D. armatus, was named in 1875 as Omosaurus armatus,
  based on a skeleton found in a clay pit in the Kimmeridge Clay in Swindon,
  England. In 1902 the genus was renamed Dacentrurus because the name Omosaurus
  had already been used for a phytosaur in 1856. After 1875, half a dozen other
  species would be named but perhaps only Dacentrurus armatus is valid.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - marine
diagnostic_features:
  - Humerus remarkably broad relative to length, especially at proximal half,
    with an unusually prominent anconal tuberosity and ridge (tricipital crest)
    absent or rudimentary in all other dinosaurs described by Owen.
  - Deep anconal depression at distal expansion of humerus, exceeding that of
    any other known Dinosaurian, Crocodilian, or Lacertian humerus.
  - Osseous dermal spine obliquely truncate at base with coarse marginal
    notching and paired vascular channels; elliptical in cross-section with
    central medullary canal; provision for attachment stronger than in
    Hylaeosaurus.
  - Ilium with distinctive superacetabular plate and ridge continuing onto outer
    surface of antacetabular prolongation, imparting a triedral form to that
    part of the bone.
  - Ischium extremely slender (styliform) relative to its length, with no
    process crossing the obturator interspace between ischium and pubis.
  - Pubis contributing no discernible share to the acetabular cavity; proximal
    end articulating only with the ischium, not with the ilium (Crocodilian
    character).
