genus: Diplotomodon
parent: Tyrannosauroidea
etymology: "From Greek diplos (double) + tomos (cutting) + odon (tooth): 'double
  cutting tooth', reflecting the doubled prefix added when the original name
  Tomodon was found to be preoccupied."
pronunciation:
  phonetic: DIP-lo-TOM-o-don
description: Diplotomodon is a dubious genus of theropod dinosaur, from New
  Jersey. It was possibly a member of the Tyrannosauroidea, the clade that also
  contains Tyrannosaurus.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - marine
appearance:
  integument: unknown
identifiers:
  - source: pbdb
    id: "68321"
  - source: wikidata
    id: Q514344
  - source: gbif
    id: "4822967"
synonyms:
  - name: Tomodon
    type: preoccupied
    reason: Name preoccupied by Tomodon (Serpentes).
erected_in: leidy1868a
species:
  - name: Diplotomodon horrificus
    etymology: "From Latin 'horrificus' meaning 'dreadful'."
    status: nomen dubium
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Campanian
        - Maastrichtian
    location:
      country: US
      region: US-NJ
      locality: Mullica Hill
      notes: Leidy (1865) picked the tooth out of a lot of shark teeth in a
        private collection and could place it no more finely than "the
        Green-sand formations". Gallagher (1993) gives it as "either from
        Navesink or Hornerstown Fm." and Molnar (1990) as "probably either the
        Navesink or Mount Laurel Formation", neither with a reason.
    type_specimen:
      specimen_id: [ ANSP 9680 ]
      specimen_type: holotype
      institution: ANSP
      material: A single large tooth, conical and strongly laterally compressed,
        with finely denticulated anterior and posterior cutting edges; the base
        and apex are damaged.
      completeness: fragmentary
    erected_as: Tomodon horrificus
    erected_in: leidy1865a
references:
  - id: gallagher1993a
    notes: Gives the type as from Mullica Hill, "either from Navesink or
      Hornerstown Fm., Maastrichtian".
  - id: molnar1990b
    notes: Gives the tooth as from the 'Green-sand formations', "probably either
      the Navesink or Mount Laurel Formation".
  - id: leidy1865a
    notes: Original description of the holotype tooth (ANSP 9680) as Tomodon
      horrificus; source of the holotype material.
  - id: leidy1868a
    notes: Establishes the replacement name Diplotomodon for Tomodon Leidy,
      1865, preoccupied by the snake genus Tomodon.
