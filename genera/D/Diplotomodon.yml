genus: Diplotomodon
parent: Tyrannosauroidea
etymology: "From Greek diplos (double) + tomos (cutting) + odon (tooth): 'double
  cutting tooth', reflecting the doubled prefix added when the original name
  Tomodon was found to be preoccupied."
pronunciation:
  phonetic: DIP-lo-TOM-o-don
description: Diplotomodon is a dubious genus of theropod dinosaur, from New
  Jersey. It was possibly a member of the Tyrannosauroidea, the clade that also
  contains Tyrannosaurus.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - marine
appearance:
  integument: unknown
identifiers:
  - source: pbdb
    id: "68321"
  - source: wikidata
    id: Q514344
  - source: gbif
    id: "4822967"
synonyms:
  - name: Tomodon
    type: preoccupied
    reason: Name preoccupied by Tomodon (Serpentes).
species:
  - name: Diplotomodon horrificus
    etymology: "From Latin 'horrificus' meaning 'dreadful'."
    status: nomen dubium
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Maastrichtian
    location:
      country: US
      region: US-NJ
      locality: Mullica Hill, Gloucester County
      notes: No formation is recorded because none has ever been determined. The
        tooth was picked out of a lot of shark teeth in a private collection and
        Leidy (1865) placed it no more finely than "the Green-sand formations".
        Several Maastrichtian units crop out at Mullica Hill, so the stage holds
        whichever is meant, but the formation does not.
    type_specimen:
      specimen_id: [ ANSP 9680 ]
      specimen_type: holotype
      institution: ANSP
      material: A single large tooth, conical and strongly laterally compressed,
        with finely denticulated anterior and posterior cutting edges; the base
        and apex are damaged.
      completeness: fragmentary
    erected_in: leidy1868a
    described_in: leidy1865a
references:
  - id: leidy1865a
    notes: Original description of the holotype tooth (ANSP 9680) as Tomodon
      horrificus; source of the holotype material.
  - id: leidy1868a
    notes: Establishes the replacement name Diplotomodon for Tomodon Leidy,
      1865, preoccupied by the snake genus Tomodon.
