genus: Diplotomodon
parent: Tyrannosauroidea
etymology: "From Greek diplos (double) + tomos (cutting) + odon (tooth): 'double
  cutting tooth', reflecting the doubled prefix added when the original name
  Tomodon was found to be preoccupied."
description: Diplotomodon is a dubious genus of theropod dinosaur, from New
  Jersey. It was possibly a member of the Tyrannosauroidea, the clade that also
  contains Tyrannosaurus.
