genus: Daxiatitan
parent: Somphospondyli
dispute:
  summary: >
    Daxiatitan has been variously recovered as a non-titanosaurian
    somphospondylan (Mannion et al., 2019; Wang et al., 2021), a euhelopodid
    (D'Emic, 2012; Moore et al., 2020), and a basal titanosaur (Han et al.,
    2024; Jones, 2026), with its describers favoring a titanosaurian identity.
  history:
    - date: "2026-06-30"
      note: >
        Placed conservatively at Somphospondyli given the unresolved
        euhelopodid versus titanosaurian debate; finer placement may be
        revisited in the Titanosauria pass.
pronunciation:
  phonetic: dah-SHYAH-TIE-tan
etymology: Named for the Daxia River (Da Xia He) in Gansu, China, combined with
  Greek 'titan' meaning 'giant', in reference to the animal's large size.
description: Daxiatitan is a genus of sauropod dinosaur known from the Lower
  Cretaceous of Gansu, China. Its type and only species is Daxiatitan binglingi.
  It is known from a single partial skeleton consisting of most of the neck and
  back vertebrae, two tail vertebrae, a shoulder blade, and a thigh bone. At the
  time of its discovery in 2008, Daxiatitan was regarded as potentially the
  largest known dinosaur from China.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Cervical vertebrae with cranial prezygapophyseal articular facets offset
    caudally such that non-articular bone comprises the cranialmost portions of
    the prezygapophysis.
  - Distal margin of scapular body lies oblique relative to its long axis.
  - Femoral distal condyles beveled ~10° dorsolaterally with respect to femoral
    shaft.
  - Femoral distal condyles directed caudomedially-craniolaterally in distal
    view.
