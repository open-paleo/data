genus: Dakotadon
parent: Styracosterna
etymology: Named after Dakota (the Lakota Formation of South Dakota, USA where the fossils were found) + Greek odon ('tooth'), meaning 'Dakota tooth'.
pronunciation:
  phonetic: da-KO-tuh-don
dispute:
  summary: >
    Dakotadon lakotaensis (originally Iguanodon lakotaensis) is treated
    as a valid basal styracosternan by some (Madzia and colleagues, 2021),
    but its skull closely resembles Iguanodon bernissartensis and its
    validity has been questioned (Norman, 2015).
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
diagnostic_features:
  - Ventral margin of premaxilla not below maxilla; maxillary process of
    premaxilla deep
  - Dorsal midline trough in nasals
  - Dorsal apex of maxilla near middle of element
  - Antorbital fossa and fenestra large
  - Lacrimal long, does not contact maxilla posterior to antorbital fossa
  - Approximately 19 tooth positions in maxilla
appearance:
  features:
    - keratinous beak
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "163549"
  - source: wikidata
    id: Q955193
  - source: gbif
    id: "4823046"
erected_in: paul2008a
species:
  - name: Dakotadon lakotaensis
    etymology: "Named for the Lakota people who inhabited the land and gave their name to the Lakota Formation where the holotype was found."
    pronunciation:
      phonetic: luh-KOH-tuh-EN-sis
    status: valid
    type_species: true
    period:
      name:
        - Early Cretaceous
      stage:
        - Valanginian
        - Hauterivian
        - Barremian
    location:
      country: US
      locality: SDSM V 2015-1
      region: US-SD
      formation: Lakota
      member: Fuson
      part: lower
    size:
      hip_height_m:
        min: 1.6
        max: 1.6
      length_m:
        min: 6.0
        max: 6.0
      weight_kg:
        min: 1000
        max: 1000
    erected_as: Iguanodon lakotaensis
    erected_in: weishampel1989a
    synonyms:
      - name: Iguanodon lakotaensis
        type: reassigned
        reason: Original combination established by Weishampel and Bjork (1989);
          reassigned to the new genus Dakotadon by Paul (2008).
    type_specimen:
      specimen_id: [SDSM 8656]
      specimen_type: holotype
      institution: SDSM
      material: Incomplete distinctive skull associated with a couple of vertebrae.
      completeness: partial
references:
  - id: paul2008a
  - id: boyd2015b
    notes: Relocated the type locality in the field, recording it as museum
      locality SDSM V 2015-1 in Lawrence County and its horizon as unit L2,
      the lower Fuson Member equivalent.
  - id: jones2026a
    notes: Source of the hip height estimate, and the appearance features.
  - id: madzia2021a
    notes: Treated Dakotadon as a valid basal styracosternan in ornithischian phylogenetic nomenclature analysis.
  - id: norman2015a
    notes: Rejected Paul's (2008) separation of Dakotadon as unjustified, treating the skull as closely resembling Iguanodon bernissartensis (cf. Iguanodon lakotaensis).
  - id: weishampel1989a
