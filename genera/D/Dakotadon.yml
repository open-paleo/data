genus: Dakotadon
parent: Styracosterna
etymology: Named after Dakota (the Lakota Formation of South Dakota, USA where the fossils were found) + Greek odon ('tooth'), meaning 'Dakota tooth'.
pronunciation:
  phonetic: da-KO-tuh-don
description: Dakotadon is a genus of iguanodont dinosaur from the Early
  Cretaceous (Valanginian to Barremian) Lakota Formation of South Dakota, USA,
  known from a partial skull. It was first described in 1989 as Iguanodon
  lakotaensis, by David B. Weishampel and Philip R. Bjork. Its assignment has
  been controversial. Some researchers suggested that "I." lakotaensis was more
  basal than I. bernissartensis, and related to Theiophytalia, but David Norman
  has suggested that it was a synonym of I. bernissartensis. Gregory S. Paul,
  working on a revision of iguanodont species, gave "I." lakotaensis its own
  genus, Dakotadon, in 2008. He measured its length at 6 meters (20 ft) and body
  mass at 1 metric ton (1.1 short tons).
dispute:
  summary: >
    Dakotadon lakotaensis (originally Iguanodon lakotaensis) is treated
    as a valid basal styracosternan by some (Madzia and others, 2021),
    but its skull closely resembles Iguanodon bernissartensis and its
    validity has been questioned (Norman, 2014).
  history:
    - date: "2026-06-27"
      note: Placed at Styracosterna; possible synonymy with Iguanodon
        reflected, not adopted.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
diagnostic_features:
  - Ventral margin of premaxilla not below maxilla; maxillary process of
    premaxilla deep
  - Dorsal midline trough in nasals
  - Dorsal apex of maxilla near middle of element
  - Antorbital fossa and fenestra large
  - Lacrimal long, does not contact maxilla posterior to antorbital fossa
  - Approximately 19 tooth positions in maxilla
appearance:
  features:
    - keratinous beak
  integument: scaled
  evidence: inferred
