genus: Duriavenator
parent: Megalosaurinae
etymology: From 'Duria', the Latinized name for Dorset (derived from the River Dour), combined with Latin 'venator' meaning 'hunter', meaning 'Dorset hunter'.
pronunciation:
  phonetic: doo-REE-a-veh-NAY-tuhr
description: Duriavenator is a genus of theropod dinosaur that lived in what is
  now England during the Middle Jurassic, about 168 million years ago. In 1882,
  upper and lower jaw bones of a dinosaur were collected near Sherborne in
  Dorset, and Richard Owen considered the fossils to belong to the species
  Megalosaurus bucklandii, the first named non-bird dinosaur. By 1964, the
  specimen was recognized as belonging to a different species, and in 1974 it
  was described as a new species of Megalosaurus, M. hesperis; the specific name
  means 'the West' or 'western'. Later researchers questioned whether the
  species belonged to Megalosaurus, in which many fragmentary theropods from
  around the world had historically been placed. After examining the taxonomic
  issues surrounding Megalosaurus, Roger B. J. Benson moved M. hesperis to its
  own genus in 2008, Duriavenator; this name means "Dorset hunter".
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - marine
diagnostic_features:
  - Deep groove on dorsal surface of jugal process of maxilla containing
    numerous pneumatic foramina.
  - Array of small foramina (~11, ~2 mm diameter) in ventral part of articular
    surface of maxilla for premaxilla.
  - Enlarged, subcircular third dentary alveolus with subcylindrical, anteriorly
    inclined anterior dentary teeth.
  - Anterior Meckelian foramen located almost directly anterior to the posterior
    Meckelian foramen.
  - Prominent lip bounding the Meckelian groove ventrally, anterior to the
    Meckelian fossa.
