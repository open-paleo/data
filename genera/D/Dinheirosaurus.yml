genus: Dinheirosaurus
parent: Diplodocinae
pronunciation:
  ipa: /diːnˌjeɪroʊˈsɔːrəs/
  phonetic: deen-YAYR-o-SAWR-us
etymology: Named for Porto Dinheiro, near where the holotype was found, plus
  Greek sauros ('lizard') - 'Porto Dinheiro lizard'
description: Dinheirosaurus is a genus of diplodocid sauropod dinosaur that is
  known from fossils uncovered in modern-day Portugal. It may represent a
  species of Supersaurus. The only species is Dinheirosaurus lourinhanensis,
  first described by José Bonaparte and Octávio Mateus in 1999 for vertebrae and
  some other material from the Lourinhã Formation. Although the precise age of
  the formation is not known, it can be dated around the early Tithonian of the
  Late Jurassic.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Posterior cervical and dorsal vertebrae with bifurcated neural spines but
    with only one well defined infraparapophysial lamina present from dorsal 4
    backwards.
  - In mid and posterior dorsals, the infraparapophysial lamina is obliquely
    directed from the parapophysis to the ventroposterior corner of the neural
    arch.
  - A complex accessory articulation derived from the hyposphene, exposed in
    lateral view, present in dorsal vertebrae 4 through 9.
  - Lower section of the neural arch of mid and posterior dorsal vertebrae
    dorsoventrally shorter than in Diplodocus.
