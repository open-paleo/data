genus: Dinheirosaurus
parent: Diplodocinae
dispute:
  summary: >
    Dinheirosaurus lourinhanensis is recovered as a basal diplodocine, often as
    the sister taxon to Supersaurus (Mannion et al., 2012). Tschopp et al. (2015)
    found the two close enough to propose sinking Dinheirosaurus into Supersaurus
    as the new combination Supersaurus lourinhanensis, a synonymy that has not
    been broadly adopted.
  history:
    - date: "2026-06-30"
      note: >
        Retained as a valid genus within Diplodocinae; the proposed synonymy with
        Supersaurus (Tschopp et al., 2015) is noted but not adopted pending
        broader consensus.
pronunciation:
  ipa: /diːnˌjeɪroʊˈsɔːrəs/
  phonetic: deen-YAYR-o-SAWR-us
etymology: Named for Porto Dinheiro, near where the holotype was found, plus
  Greek sauros ('lizard') - 'Porto Dinheiro lizard'
description: Dinheirosaurus is a genus of diplodocid sauropod dinosaur that is
  known from fossils uncovered in modern-day Portugal. It may represent a
  species of Supersaurus. The only species is Dinheirosaurus lourinhanensis,
  first described by José Bonaparte and Octávio Mateus in 1999 for vertebrae and
  some other material from the Lourinhã Formation. Although the precise age of
  the formation is not known, it can be dated around the early Tithonian of the
  Late Jurassic.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Posterior cervical vertebra (Cv14) with a ventral keel restricted to the
    posterior end of the centrum (autapomorphy).
  - Subvertical lamina between the ventral surface of the postzygodiapophyseal
    lamina and the dorsal surface of the posterior centrodiapophyseal lamina in
    posterior cervical vertebrae.
  - Three small subcircular fossae posterior to the lateral coel on the neural
    spine of posterior cervical vertebra Cv14 (autapomorphy).
  - Presacral neural spines unbifurcated (a reversal, autapomorphic within
    Flagellicaudata).
  - Dorsal centra maintaining approximately the same anteroposterior length
    throughout the series (autapomorphic within Diplodocidae).
  - Robust horizontal accessory lamina linking the hyposphene with the base of
    the posterior centrodiapophyseal lamina in middle-posterior dorsal
    vertebrae (autapomorphy).
  - Diapophyses projecting dorsolaterally in the dorsal vertebrae (autapomorphic
    within Diplodocidae).
