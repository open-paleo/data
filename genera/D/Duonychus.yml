genus: Duonychus
parent: Therizinosauridae
etymology: "From Greek duo (two) + onychos (claw): 'two claws', referring to the two-fingered hand bearing large curved claws."
pronunciation:
  phonetic: ju-oh-NI-kuss
description: Duonychus is an extinct genus of therizinosaurid theropod dinosaurs
  that lived during the Late Cretaceous (Cenomanian to early Coniacian age) of
  what is now Mongolia. It is known from a partial skeleton, including several
  vertebrae, most of the forelimbs, and part of the pelvic girdle, found in
  outcrops of the Bayanshiree Formation. The remains were discovered in 2012 by
  the Mongolian Academy of Sciences and briefly mentioned in later conference
  abstracts. The genus contains a single species, Duonychus tsogtbaatari, which
  was formally described in 2025.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Didactyl manus with complete absence of digit III (digit formula 2-3-0) and
    a reduced metacarpal III forming a splint.
  - Fused distal carpals 1 and 2 semilunate-shaped with a mediodorsal process
    and a small angle (~15°) between articular surfaces of the radiale for the
    semilunate carpal and the radius.
  - Equally sized manual unguals I-2 and II-2, with absence or reduction of the
    flexor fossa in manual phalanges.
  - Dorsal vertebrae with long neural spines, a thick centrodiapophyseal lamina
    without additional laminae, and lacking pleurocoels; sacral vertebrae (2-4)
    with flat ventral surfaces.
  - Reduced dorsal process at the proximal end of manual phalanges and pneumatic
    dorsal ribs.
  - Entepicondyle reduced with a markedly narrow groove separating it from the
    ulnar condyle; deltopectoral crest positioned more proximally than in
    Erlikosaurus.
