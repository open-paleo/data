genus: Dubreuillosaurus
parent: Afrovenatorinae
dispute:
  summary: >
    Dubreuillosaurus valesdunensis is recovered as an afrovenatorine megalosaurid
    (Carrano et al., 2012). Cau (2024) argues it is a junior synonym of
    Poekilopleuron bucklandii, its holotype representing a juvenile of that
    taxon; other authors retain it as a distinct genus.
  history:
    - date: "2026-07-01"
      note: Placed at Afrovenatorinae following Carrano et al. (2012); retained as a valid genus pending resolution of the proposed synonymy with Poekilopleuron.
etymology: Named for French fossil collector and preparator Pascal Dubreuil, who
  found the specimen, combined with Greek 'sauros' meaning 'lizard'.
description: Dubreuillosaurus is a genus of carnivorous megalosaurid theropod
  dinosaur from the middle Jurassic Period. Its fossils were found in France.
  The only named species, Dubreuillosaurus valesdunensis, was originally
  described as a species of Poekilopleuron, Poekilopleuron? valesdunensis, which
  is still formally the type species of the genus. It was later renamed
  Dubreuillosaurus valesdunensis when, in 2005, Allain came to the conclusion
  that it was not part of the genus Poekilopleuron. Its type specimen, MNHN
  1998-13, is only rivalled in the number of preserved elements in this group by
  that of Eustreptospondylus. Dubreuillosaurus is considered to be a sister
  taxon of Magnosaurus. It did not show signs of insular dwarfism even though it
  was uncovered on an island.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - marine
  - coastal
diagnostic_features:
  - Caudal transverse processes are spatulate distally, unlike Poekilopleuron
  - Anterior caudal neural spines more strongly inclined posteriorly than in
    Poekilopleuron
  - Mid-caudal prezygapophysis articular facets located posterior to a small
    triangular process unknown in other theropods
  - Femoral head directed medioventrally at less than 90 degrees to shaft,
    unique among spinosauroids
  - No extensor groove on anterior surface of distal femur end; instead a
    convexity is present
  - Hypapophyses on anterior dorsal vertebrae simple and unbifurcated
    anteriorly, unlike Eustreptospondylus, Streptospondylus, and
    Lourinhanosaurus
