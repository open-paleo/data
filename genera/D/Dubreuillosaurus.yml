genus: Dubreuillosaurus
parent: Eustreptospondylinae
description: Dubreuillosaurus is a genus of carnivorous megalosaurid theropod
  dinosaur from the middle Jurassic Period. Its fossils were found in France.
  The only named species, Dubreuillosaurus valesdunensis, was originally
  described as a species of Poekilopleuron, Poekilopleuron? valesdunensis, which
  is still formally the type species of the genus. It was later renamed
  Dubreuillosaurus valesdunensis when, in 2005, Allain came to the conclusion
  that it was not part of the genus Poekilopleuron. Its type specimen, MNHN
  1998-13, is only rivalled in the number of preserved elements in this group by
  that of Eustreptospondylus. Dubreuillosaurus is considered to be a sister
  taxon of Magnosaurus. It did not show signs of insular dwarfism even though it
  was uncovered on an island.
diet: carnivore
