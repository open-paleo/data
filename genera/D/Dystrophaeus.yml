genus: Dystrophaeus
parent: Eusauropoda
dispute:
  summary: >
    Dystrophaeus is a poorly known taxon whose long-standing diplodocoid
    identification has been rejected. Tschopp et al. (2015) recover it as
    highly unstable, falling within Dicraeosauridae under implied weighting
    but equally supporting a camarasaurid position under equal weighting,
    while Jones (2026) and Foster et al. (2016) consider basal Macronaria or
    a pre-Neosauropoda position more likely. Its candidate positions span
    non-neosauropod Eusauropoda to several neosauropod clades.
  history:
    - date: "2026-06-29"
      note: >
        Retained at Eusauropoda incertae sedis pending resolution; the
        neosauropod alternatives (Dicraeosauridae or Macronaria) would revise
        this placement if confirmed.
etymology: "From Greek 'dys' meaning 'bad' and 'stropheus' meaning 'joint',
  giving 'coarse joint'; refers to the pitted joint surfaces that served as
  attachments for cartilage."
pronunciation:
  phonetic: DISS-tro-FAY-us
description: Dystrophaeus is an extinct genus of sauropod dinosaur. Its type and
  only species is Dystrophaeus viaemalae, named by Edward Drinker Cope in 1877.
  Its fossils were found in the Tidwell Member of the Morrison Formation of
  Utah. Due to the fragmentary condition of its only known specimen, the
  affinities of Dystrophaeus are uncertain, although excavations carried out at
  the discovery site since 1989 have uncovered more of the original specimen and
  hold the potential for an improved understanding of the taxon.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Humerus distally the most contracted known among Dinosauria; distal
    extremity truncate with oval outline resembling a tibia, surface roughened
    with coarse pits
  - Proximal humerus with T-shaped cross-section a short distance below the
    head; greater tuberosity a huge crest as prominent as the head, separated
    from it by a marked concavity forming a neck
  - Articular surfaces of limb bones rugose and pitted, indicating reduced
    mutual movement and probable cartilaginous cap rather than ossified
    epiphyses
  - Probable sternum with digitate borders bearing five digitiform processes,
    including a slender compressed process projecting at right angles near the
    middle of one side
  - Metatarsal shafts solid, filled with coarse cancelli; proximal ends truncate
    with trapezoidal or triangular outlines; articular surfaces pitted and
    roughened
