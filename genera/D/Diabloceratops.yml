genus: Diabloceratops
parent: Centrosaurinae
etymology: From Spanish diablo ('devil') + Greek ceratops ('horned face'), meaning 'devil-horned face', referring to the large, horn-like projections on the frill.
pronunciation:
  ipa: /daɪˌæbloʊˈsɛrətɒps/
  phonetic: dy-AB-loh-SERR-ə-tops
description: Diabloceratops is an extinct genus of centrosaurine ceratopsian
  dinosaur that lived approximately 81.4-81 million years ago during the latter
  part of the Cretaceous Period in what is now Utah, in the United States.
  Diabloceratops was a medium-sized, moderately built, ground-dwelling,
  quadrupedal herbivore, that could grow up to an estimated 4.5 metres (15 ft)
  in length and 1.3 metric tons (1.4 short tons) in body mass. At the time of
  its discovery, it was the oldest-known ceratopsid, and first centrosaurine
  known from latitudes south of the U.S. state of Montana. The generic name
  Diabloceratops means "devil-horned face", coming from Diablo, Spanish for
  "devil", and ceratops, Latinized Greek for "horned face". The specific name
  honors Jeffrey Eaton, a paleontologist at Weber State University and long time
  friend of the lead author Jim Kirkland. Eaton had a big role in establishing
  the Grand Staircase-Escalante National Monument where the specimen was found.
  The type species, Diabloceratops eatoni, was named and described in 2010 by
  James Ian Kirkland and Donald DeBlieux.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
