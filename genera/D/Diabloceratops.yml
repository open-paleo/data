genus: Diabloceratops
parent: Centrosaurinae
etymology: From Spanish diablo ('devil') + Greek ceratops ('horned face'),
  meaning 'devil-horned face', referring to the large, horn-like projections on
  the frill.
pronunciation:
  ipa: /daɪˌæbloʊˈsɛrətɒps/
  phonetic: dy-AB-loh-SERR-uh-tops
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Large accessory antorbital fenestra bounded by premaxilla, maxilla, and
    nasal, with premaxilla excluded from contact with lacrimal by maxilla
  - Preorbital skull is deep and shorter than other known centrosaurines
  - Distinct epinasal present rostral to low, subconical narial horn
  - Vertically oriented, blade-like epijugals larger than in any other described
    centrosaurine
  - Erect frill widest at laterally directed squamosals, tapering by ~50% to a
    pair of elongate caudal parietal spines separated by a midline notch
  - Parietal fenestrae are triangular and caudorostrally elongate; lateral
    parietal epoccipitals decrease in size caudally
appearance:
  features:
    - neck frill
    - frill spikes
    - brow horns
  integument: scaled
  evidence: inferred
