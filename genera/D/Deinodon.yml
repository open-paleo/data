genus: Deinodon
parent: Tyrannosauridae
placement: incertae sedis
etymology: From Greek 'deinos' ('terrible') and 'odon' ('tooth'), for the large
  serrated teeth on which the genus was founded.
description: Deinodon is a dubious genus of tyrannosaurid dinosaur containing a
  single species, Deinodon horridus, which is known only from a set of teeth
  found in the Late Cretaceous Judith River Formation of Montana and named by
  paleontologist Joseph Leidy in 1856. These were the first tyrannosaurid
  remains to be described and had been collected by Ferdinand Vandeveer Hayden.
  The teeth of Deinodon were slightly heterodont, and the holotype of Aublysodon
  can probably be assigned to the former.
diet: carnivore
identifiers:
  - source: pbdb
    id: "56322"
  - source: wikidata
    id: Q134788
  - source: gbif
    id: "4817980"
synonyms:
  - name: Dinodon
    type: emended spelling
    reason: Cope (1866) emended the name to Dinodon, which is preoccupied by the
      snake genus Dinodon Dumeril and Bibron, 1853. Hay (1899) showed the two
      names have different derivations and that Leidy's original spelling was
      never preoccupied.
species:
  - name: Deinodon horridus
    status: nomen dubium
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Campanian
    location:
      country: US
      region: US-MT
      locality: Judith River badlands
      formation: Judith River
    type_specimen:
      specimen_id:
        - ANSP 9533
        - ANSP 9534
      specimen_type: lectotype
      institution: ANSP
      material: Two fragmentary premaxillary teeth, selected from the series of
        Judith River teeth on which the species was founded.
      completeness: fragmentary
      notes: Leidy (1856) founded the species on a series of fragmentary teeth
        of more than one form. Cope (1866) restricted it to three nonserrated
        teeth, of which Marsh (1892) later removed one to Aublysodon mirandus,
        leaving two with this species.
    synonyms:
      - name: Aublysodon horridus
        type: junior objective
        reason: Cope substituted Aublysodon for Deinodon in the belief that the
          latter was preoccupied by the snake genus Dinodon. Hay (1899) showed
          that it was not, so the combination rests on the same type material
          as Deinodon horridus.
    erected_in: leidy1856b
references:
  - id: leidy1856b
    notes: Erects the genus and species on a series of fragmentary teeth
      collected by Hayden in the Judith River badlands.
  - id: russell1970a
    notes: Gives the lectotype as two fragmentary premaxillary teeth and finds
      it generically unidentifiable.
  - id: hay1899a
    notes: Shows that Deinodon was never preoccupied by the snake genus Dinodon,
      so Leidy's original spelling stands.
  - id: matthew1922a
    notes: Finds nothing in the dentition to separate Gorgosaurus from Deinodon,
      but holds the identity unproven pending topotypes from the Judith River.
  - id: gilmore1946a
    notes: Reports that Aublysodon was abandoned on grounds of priority as a
      synonym of Deinodon.
  - id: carr1999a
    notes: Endorses the finding that the lectotype cannot be distinguished from
      Dinosaur Park material, and records the dissenting view.
  - id: rauhut2003b
    notes: States that the type teeth are undiagnostic, so Tyrannosauridae is
      preferred over Deinodontidae as the family name.
  - id: weishampel2004a
    notes: Lists the species among tyrannosaurid nomina dubia and questions
      whether it belongs to Gorgosaurus.
  - id: jones2026c
    notes: Reports the type teeth as indistinguishable from those of Gorgosaurus
      or Daspletosaurus, and the genus as widely considered dubious.
  - id: olshevsky1991a
    notes: Records the species referred to the genus and the fate of the family
      name based on it.
