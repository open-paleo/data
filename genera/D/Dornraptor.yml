genus: Dornraptor
parent: Averostra
pronunciation:
  phonetic: DORN-RAP-tor
etymology: From Anglo-Saxon 'Dornwaraceasetr' (the area roughly equivalent to
  modern Dorset, England) and Latin 'raptor' (one who seizes); meaning
  'Dorset robber'.
description: Dornraptor is an extinct genus of averostran theropod dinosaur from
  the Hettangian–Sinemurian of Charmouth, Dorset, England, alongside other Blue
  Lias theropods such as Sarcosaurus and Dracoraptor. The single species,
  Dornraptor normani, is known from a fragmentary right knee joint (distal
  femur and proximal tibia) originally described by Richard Owen as the
  armored ornithischian Scelidosaurus and subsequently reclassified by
  Baron (2024) as an indeterminate averostran theropod.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - coastal
  - marine
diagnostic_features:
  - Large proximodistally oriented scar extending along the medial side of the
    anterior face of the distal end of the femur.
  - Anterior surface of the femur pierced by a foramen medial to the anterior
    intermuscular line (potential autapomorphy).
  - Pronounced fibular crest on lateral side of tibia extending to the proximal
    end, terminating distally as a bulbous expansion (potential autapomorphy).
  - Sharp proximodistally oriented crest on lateral margin of proximal tibia
    running parallel to the fibular crest but not joining it distally to form a
    forked crest.
  - Antero-posteriorly elongate cnemial crest that reaches further proximally
    than either the medial or lateral condyles.
  - Lateral condyle of the proximal tibia with a posterolateral margin forming
    an acute angle in medial view (potential autapomorphy).
