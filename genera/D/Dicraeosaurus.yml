genus: Dicraeosaurus
parent: Dicraeosaurinae
etymology: From Greek dikraios (δικραιος), 'bifurcated' or 'double-headed', + Greek sauros, 'lizard'; means 'bifurcated lizard', referring to the forked neural spines on its vertebrae
description: Dicraeosaurus is a genus of diplodocoid sauropod dinosaur that
  lived in what is now Lindi Region, Tanzania during the late Jurassic period.
  The genus was named for the neural spines on the back of its neck. The first
  fossil was described by paleontologist Werner Janensch in 1914.
diet: herbivore
