      formation: Tendaguru
      locality: Upper Saurian Bed, Tendaguru
      coordinates:
        - -9.696665
        - 39.228008
    diagnostic_features:
      - Trunk vertebrae more slender and lightly built, with a smaller, less
        massive centrum.
      - Neural spines of the trunk vertebrae narrower but relatively longer and
        proportionally higher than in D. hansemanni (bifurcated in the same
        manner).
      - Diapophyses of the trunk vertebrae less elongate relative to centrum
        length.
      - Anterior caudal vertebrae with proportionally higher neural spines.
      - Dorsal ribs slimmer and lighter, with thinner, weaker distal ends.
      - Chevrons lighter, slimmer, and more strongly curved.
      - Pubis and femur more slender and lightly built.
    erected_in: janensch1914a
    described_in: janensch1929a
