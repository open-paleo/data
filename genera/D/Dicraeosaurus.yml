genus: Dicraeosaurus
parent: Dicraeosaurinae
pronunciation:
  phonetic: die-KREE-o-SAWR-us
etymology: From Greek dikraios (δικραιος), 'bifurcated' or 'double-headed', +
  Greek sauros, 'lizard'; means 'bifurcated lizard', referring to the forked
  neural spines on its vertebrae
description: Dicraeosaurus is a genus of diplodocoid sauropod dinosaur that
  lived in what is now Lindi Region, Tanzania during the late Jurassic period.
  The genus was named for the neural spines on the back of its neck. The first
  fossil was described by paleontologist Werner Janensch in 1914.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - coastal
diagnostic_features:
  - Cervical vertebrae with two tall, completely independent (divided to base)
    neural spines
  - Thoracic dorsal vertebrae with very tall bifurcated neural spines divided
    throughout their entire height
  - Diapophyses of trunk vertebrae directed steeply obliquely upward
  - Posterior trunk vertebral bodies lacking lateral pleurozentral pits
  - Cervical vertebral body strongly laterally compressed, narrowing anteriorly
    to a thin wall behind the articular head
appearance:
  features:
    - bifurcated cervical spines
  integument: scaled
  evidence: inferred
