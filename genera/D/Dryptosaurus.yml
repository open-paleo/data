genus: Dryptosaurus
parent: Tyrannosauroidea
etymology: "From Greek drypto (to tear) + sauros (lizard): 'tearing lizard'."
pronunciation:
  phonetic: DRIP-toh-SOR-uhs
  ipa: /ˌdrɪptoʊˈsɔːrəs/
description: Dryptosaurus is a genus of theropod dinosaur that lived in the
  present-day East Coast of the United States during the Late Cretaceous period.
  The type, and only, species, D. aquilunguis was described by Edward Drinker
  Cope in 1866 as Laelaps aquilunguis, however the genus name was preoccupied by
  a mite. As a result, Cope's rival in the Bone Wars, Othniel Marsh, replaced
  the genus name with Dryptosaurus. Dryptosaurus is known from a single,
  fragmentary skeleton including parts of the mandible (lower jaw), limbs, and
  vertebrae. These fossils were unearthed by fertilizer miners in New Jersey in
  rock layers of the New Egypt Formation. This formation dates to the late
  Maastrichtian stage of the Late Cretaceous, around 67 to 66 million years ago.
  Several other fragmentary remains have been assigned to Dryptosaurus, however
  their referral is uncertain.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - coastal
  - marine
diagnostic_features:
  - Great external trochanter of femur massive and elevated to plane of head,
    separated only by slight depression; femoral head not projecting far beyond
    shaft and without constriction below
  - Third trochanter on femur small and positioned lower than in any known
    Dinosaur, less than one-third femur length from inner distal condyle
  - Tibia with cuneiform distal articular surface (not lozenge-shaped); anterior
    ridge very strong and much incurved; shaft much compressed
    antero-posteriorly
  - Ungueal phalanges remarkably large and strongly compressed, with eagle-like
    form; large flexor-tendon insertion process separated by groove extending to
    tip
  - Humeri relatively short (less than half femur length), proximally much
    dilated with strong postero-external ala and shorter antero-internal
    dilatation
appearance:
  features:
    - enlarged manual claws
  integument: unknown
