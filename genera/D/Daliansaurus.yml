genus: Daliansaurus
parent: Troodontidae
placement: incertae sedis
dispute:
  summary: >
    Daliansaurus was described as a member of Sinovenatorinae, the sister of
    Sinusonasus (Shen and colleagues, 2017), but every later analysis
    recovers it in a more derived position, outside that subfamily (Hartman
    and colleagues, 2019; Cau and Madzia, 2021; Sellés and colleagues, 2021;
    Wang and colleagues, 2023; Kubota and colleagues, 2024).
etymology: Named after Dalian, a city in Liaoning Province, China, + Greek sauros ('lizard' or 'reptile'), meaning 'Dalian reptile'.
pronunciation:
  phonetic: DAH-ly-uhn-SOR-us
description: Daliansaurus is a genus of small troodontid theropod dinosaur,
  measuring approximately 1 meter (3 ft 3 in) long, from the Early Cretaceous of
  China. It contains a single species, D. liaoningensis, named in 2017 by Shen
  and colleagues from a nearly complete skeleton preserved in three dimensions.
  Daliansaurus is unusual in possessing an enlarged claw on the fourth digit of
  the foot, in addition to the "sickle claw" found on the second digit of the
  feet of most paravians. It also has long metatarsal bones, and apparently
  possesses bird-like uncinate processes (a first among troodontids). In the
  Lujiatun Beds of the Yixian Formation, a volcanically-influenced region with a
  cold climate, Daliansaurus lived alongside its closest relatives — Sinovenator, Sinusonasus, and Mei, with which it forms the group
  Sinovenatorinae.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
  - forested
diagnostic_features:
  - Ungual of pedal digit IV is robust, dorsoventrally deep, and approximately
    the same size as the sickle-shaped ungual of pedal digit II (unique among
    troodontids).
  - Uncinate processes present on the dorsal ribs (not previously reported in
    troodontids).
  - Metatarsal IV lacks a prominent longitudinal lateroventral flange (unlike
    Sinovenator and Sinusonasus).
  - Ventral surface of the postacetabular process of the ilium is strongly
    concave in lateral view (not nearly straight as in Sinovenator and Mei).
  - Metatarsal II so short it terminates before the trochlea of metatarsal IV
    begins (unlike Sinovenator and Sinusonasus).
  - Metacarpal II is slightly shorter than metacarpal III (instead of longer, as
    in Sinovenator and Sinusonasus).
appearance:
  features:
    - sickle claw
    - enlarged pedal claws
  integument: feathered
  evidence: inferred
