genus: Drusilasaura
parent: Lognkosauria
etymology: "Named after Drusila Ortiz de Zárate, a member of the family that owned the María Aike Ranch where the fossil was found, combined with Latin 'saura' (feminine form of 'saurus') meaning 'lizard'; means 'Drusila's lizard'."
description: Drusilasaura is an extinct genus of possible lognkosaurian
  titanosaur sauropod dinosaur which lived during the late Cretaceous
  (Cenomanian-Turonian stage) of Santa Cruz Province of southern Patagonia,
  Argentina.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Two robust spinodiapophysial laminae (anterior and posterior) in anterior
    dorsal vertebrae delimiting an elongated and deep supradiapophysial cavity
  - Small circumneural lamina surrounding the neural canal in posterior view of
    the anterior dorsal vertebra
  - Prespinal laminae expanded toward the apex of the neural spine in at least
    the first five caudal vertebrae
  - Tuberopostzygapophysial laminae present in the anterior caudal vertebrae
  - Ventral foramina present on the ventral face of the vertebral centrum in at
    least the fourth caudal vertebra
