references:
  - id: sereno1996a
    notes: Describing paper; recovered Deltadromeus as a basal coelurosaur.
  - id: ibrahim2020a
    notes: Places the holotype at Aferdou N'Chaft, and identifies the
      "Er Remlia" of the original description as the village nearest a
      different locality, Iferda N'Ahouar.
  - id: carrano2008a
    notes: Recovered Deltadromeus as a basal ceratosaur near Elaphrosaurus,
      explicitly rejecting a noasaurid position (12 extra steps).
  - id: rauhut2016b
    notes: Recovered Deltadromeus among basal ceratosaurs in their Elaphrosaurus revision.
  - id: apesteguía2016a
    notes: Recovered Deltadromeus as a neovenatorid allosauroid, sister to Gualicho.
  - id: motta2016a
    notes: Grouped Deltadromeus with Bahariasaurus and Aoniraptor as megaraptoran
      theropods (proposed Bahariasauridae).
  - id: delcourt2025a
    notes: Recovered Deltadromeus within Ornithomimosauria, alongside Gualicho.
