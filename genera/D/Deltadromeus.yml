genus: Deltadromeus
parent: Noasauridae
pronunciation:
  phonetic: DEL-ta-DROHM-ee-us
etymology: From Greek delta ('river delta' or 'change') + dromos ('runner'), meaning 'river delta runner' or 'change runner', possibly referring to the Nile River delta region where related material was found.
description: Deltadromeus is an extinct genus of controversial theropod dinosaur
  that lived in present-day Morocco during the mid-Cretaceous period. It was
  described by American paleontologist Paul Sereno and colleagues in 1996. The
  genus contains a single species, D. agilis, named based on an incomplete
  postcranial skeleton, the holotype specimen. However, some fossils from the
  Bahariya Formation of Egypt that were formerly referred to the theropod
  Bahariasaurus have been suggested to belong to Deltadromeus. The holotype
  specimen of Deltadromeus was unearthed by a joint expedition by the University
  of Chicago and the Service Géologique du Maroc in Errachidia Province, eastern
  Morocco in rock layers coming from the Gara Sbaa Formation of the Kem Kem
  Beds. This indicates that these fossils date to the Cenomanian stage of the
  Cretaceous period, 100-95 million years ago.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - coastal
  - deltaic
diagnostic_features:
  - Anterior caudal vertebrae with broad quadrangular neural spines
  - Coracoid and acromion broadly expanded anteroposteriorly, with shallow notch
    in anterior margin
  - Ischial midshaft dorsoventrally compressed
  - Femur with accessory trochanter on distal shaft and medial distal condyle
    with anterior extension
  - Metatarsal IV distal condyles reduced
  - Large deep fossa occupying majority of the medial aspect of the proximal end
    of the fibula
