genus: Dracopelta
parent: Ankylosauria
pronunciation:
  phonetic: drak-o-PEL-ta
etymology: "From Latin draco (dragon) + Greek pelte (shield): 'dragon shield'."
description: Dracopelta is a monospecific genus of ankylosaurian dinosaur that
  lived during the Late Jurassic (uppermost lower Tithonian-upper Tithonian,
  152.1-145.0 Ma) in what is now the Lourinhã Formation, Portugal. The type and
  only species is Dracopelta zbyszewskii, which is represented by a partial
  skeleton including unpublished material.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - deltaic
  - fluvial
diagnostic_features:
  - Dermal armor includes very small isolated flat scutes with irregularly
    sculptured dorsal surface.
  - Small medial paired subcircular plates with raised centers and thickened
    rims separated by a depression.
  - Very long elongate anterolateral (non-overlapping) plates, the larger
    measuring up to 190 mm by 75 mm.
  - Narrow non-projecting dorsolateral plates that overlap each other
    posteriorly and dorsally.
  - Wide laterally projecting plates that overlap the plate behind, with thin
    lateral margins and a longitudinal ridge near the medial edge on at least
    one plate.
