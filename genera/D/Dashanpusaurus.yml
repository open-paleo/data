genus: Dashanpusaurus
parent: Macronaria
etymology: Dashanpu lizard
description: Dashanpusaurus is an extinct genus of sauropod dinosaur that lived
  during the middle of the Jurassic period. The dinosaur was described in 2005
  by Peng Guangzhao, Ye Yong, Gao Yuhui, Shu Chunkang, and Jiang Shan. Its type
  and only species is Dashanpusaurus dongi, named in honor of the paleontologist
  Dong Zhiming.
