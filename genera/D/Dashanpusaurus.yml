genus: Dashanpusaurus
parent: Macronaria
pronunciation:
  phonetic: dah-SHAHN-poo-SAWR-us
etymology: Named after Dashanpu, the township in Zigong, Sichuan Province, China
  where the fossils were unearthed, + Greek sauros ('lizard'), meaning 'Dashanpu
  lizard'.
description: Dashanpusaurus is an extinct genus of sauropod dinosaur that lived
  during the middle of the Jurassic period. The dinosaur was described in 2005
  by Peng Guangzhao, Ye Yong, Gao Yuhui, Shu Chunkang, and Jiang Shan. Its type
  and only species is Dashanpusaurus dongi, named in honor of the paleontologist
  Dong Zhiming.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
appearance:
  integument: scaled
  evidence: inferred
diagnostic_features:
  - Cervical vertebrae short, the longest centrum only about 1.6 times the average
    dorsal length, with opisthocoelous centra, a weak ventral keel, and deep,
    elongate lateral pleurocoels
  - Posterior cervical and anterior dorsal neural spines forming low, transversely
    wide plates with weakly bifurcate, shallowly V-shaped apices
  - Dorsal centra platycoelous to weakly opisthocoelous, with pleurocoels well
    developed in the anterior dorsals but shallow or absent in the middle and
    posterior dorsals; presacral centra solid and apneumatic
  - Middle and posterior dorsal neural spines heightened into thick transverse
    plates with enlarged, nearly square apices wider at the top than the base
  - Ilium low and long with a prominent anterior process angled distinctly less
    than 90° to the pubic peduncle
