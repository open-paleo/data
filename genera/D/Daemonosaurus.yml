genus: Daemonosaurus
parent: Saurischia
etymology: From Greek daemon (δαίμων), 'spirit' or 'demon', + Greek sauros, 'lizard'; means 'demon lizard' or 'spirit lizard', likely referring to its fearsome fang-like teeth
description: Daemonosaurus is an extinct genus of possible theropod dinosaur
  from the Late Triassic of New Mexico. The only known fossil is a skull and
  neck fragments from deposits of the latest Triassic Chinle Formation at Ghost
  Ranch. Daemonosaurus was an unusual dinosaur with a short skull and large,
  fang-like teeth. It lived alongside early neotheropods such as Coelophysis,
  which would have been among the most common dinosaurs by the end of the
  Triassic. However, Daemonosaurus retains several plesiomorphic ("primitive")
  traits of the snout, and it likely lies outside the clade Neotheropoda. It may
  be considered a late-surviving basal theropod or non-theropod basal
  saurischian, possibly allied to other early predatory dinosaurs such as
  herrerasaurids or Tawa.
diet: carnivore
locomotion: bipedal
