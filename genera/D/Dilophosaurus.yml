    species: Dilophosaurus wetherilli
    category: ontogeny
    significance: "Infant specimen found in 1978 in the Rock Head Quadrangle, the youngest known example of the genus and one of the earliest known infant theropods from North America, preceded only by some Coelophysis specimens. It includes a partial humerus, a partial fibula, and a tooth fragment."
