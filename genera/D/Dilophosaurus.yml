    significance: "Adult referred skeleton found in 1964, about one-third larger than the type juveniles. Its preserved skull crests revealed the animal bore paired crests, prompting Welles to erect the new genus Dilophosaurus; it remains the only specimen preserving much of the crests."
    discovered:
