genus: Dilophosaurus
parent: Neotheropoda
etymology: "From Greek di- (two) + lophos (crest) + sauros (lizard):
  'two-crested lizard', referring to the pair of bony crests on its skull."
pronunciation:
  ipa: /daɪˌloʊfəˈsɔːrəs, -foʊ-/
  phonetic: dy-LOH-fuh-SOR-uhs, -foh-
description: Dilophosaurus is a genus of theropod dinosaurs that lived in what
  is now North America during the Early Jurassic, about 186 million years ago.
  Three skeletons were discovered in northern Arizona in 1940, and the two best
  preserved were collected in 1942. The most complete specimen became the
  holotype of a new species in the genus Megalosaurus, named M. wetherilli by
  Samuel P. Welles in 1954. Welles found a larger skeleton in the same region
  belonging to the same species in 1964. Realizing it bore crests on its skull,
  he assigned the species to the new genus Dilophosaurus in 1970, as
  Dilophosaurus wetherilli. The genus name means "two-crested lizard", and the
  species name honors John Wetherill, an explorer and amateur archeologist.
  Further specimens have since been found, including an infant. Fossil
  footprints have also been attributed to the animal, including resting traces.
  Another species, Dilophosaurus sinensis from China, was named in 1993, but was
  later found to belong to the genus Sinosaurus.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - arid
diagnostic_features:
  - Pair of parasagittal nasolacrimal crests, each formed by a ridge on the
    dorsolateral margin of the nasal process of the premaxilla, dorsolateral
    expansions of the nasal and lacrimal, and a posteriorly projecting process
    of the lacrimal behind the orbit.
  - Pyramidal process on the lateral surface of the surangular, anterior to the
    articulation with the quadrate.
  - Mandibular fenestra reduced in anteroposterior length.
  - Neural spines of the post-axial cervical vertebrae with a dorsal margin
    stepped in lateral view — anterior and posterior 'shoulders' flanking a
    taller central 'cap' that is cruciform in dorsal view, most pronounced in
    the posterior cervicals.
  - Serial variation (bifurcation and recombination) in the posterior
    centrodiapophyseal laminae of the cervical vertebrae.
  - Accessory laminae emanating from the anterior and posterior
    centrodiapophyseal laminae of the middle trunk vertebrae.
  - First primordial sacral rib articulating with the preacetabular process of
    the ilium.
  - Additional 'horizontal buttress' on the posteroventral part of the
    coracoid, next to the biceps tuber.
