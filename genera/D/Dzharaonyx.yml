genus: Dzharaonyx
parent: Parvicursorinae
etymology: "From Dzharakuduk (the type locality in the Kyzylkum Desert of
  Uzbekistan) + Greek onyx (claw): 'Dzharakuduk claw'."
pronunciation:
  phonetic: JAH-ruh-ON-iks
description: Dzharaonyx is a genus of alvarezsaurid theropod from the Late
  Cretaceous Bissekty Formation of Uzbekistan. The type and only species is D.
  eski. The specific epithet "eski" is an Uzbek word for "old".
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Posterior dorsal vertebrae opisthocoelous, without infrapostzygapophyseal
    fossae
  - Posterior caudal vertebrae procoelous, with longitudinal canal within the
    neural arch
  - Humerus with small internal tuberosity, similar-sized radial and ulnar
    condyles, and distally protruding radial condyle
  - Manual phalanx II-1 with similarly developed flexor ridges and lacking
    dorsolateral process
  - Pedal phalanx IV-1 with protruding proximomedial process, proximoventral
    notch, and asymmetrical distal condyles
  - Pubis bears a preacetabular tubercle; metatarsal II with posterolateral
    flange; pedal ungual phalanges with small flexor tubercles
