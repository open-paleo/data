genus: Dracoraptor
parent: Coelophysoidea
etymology: "From Latin draco (dragon, here referencing the Welsh dragon) + raptor (robber/thief): 'dragon thief' or 'dragon robber', honouring Wales where it was found."
description: Dracoraptor is a genus of coelophysoid dinosaur that lived during
  the Hettangian stage of the Early Jurassic Period of what is now Wales dated
  at about 201 million years ago. The fossil was first discovered in 2014 by Rob
  and Nick Hanigan and Sam Davies at the Blue Lias Formation on the South Wales
  coast. The genus name Dracoraptor is from Draco, referring to the Welsh
  dragon, and raptor, meaning robber, a commonly employed suffix for theropod
  dinosaurs, with the type species being Dracoraptor hanigani. It is one of the
  oldest known Jurassic dinosaurs and is the first dinosaur skeleton from the
  Jurassic of Wales.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - marine
diagnostic_features:
  - Three teeth in the premaxilla
  - Slender maxillary process of the jugal
  - Large narial opening with slender subnarial bar
  - Anteriorly directed pubis considerably longer than ischium
  - Large dorsal process on distal tarsal IV
