genus: Dracoraptor
parent: Coelophysoidea
dispute:
  summary: >
    Dracoraptor hanigani is placed as the basalmost coelophysoid by some
    analyses (Martill and colleagues, 2016; Ezcurra and colleagues, 2020) but just
    outside Coelophysoidea among stem-averostran neotheropods by Spiekman
    and colleagues (2021).
etymology: "From Latin draco (dragon, referencing the Welsh dragon) + raptor (robber/thief): 'dragon thief' or 'dragon robber', honoring Wales where it was found."
pronunciation:
  phonetic: DRAH-ko-RAP-tuh
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - marine
diagnostic_features:
  - Three teeth in the premaxilla
  - Slender maxillary process of the jugal
  - Large narial opening with slender subnarial bar
  - Anteriorly directed pubis considerably longer than ischium
  - Large dorsal process on distal tarsal IV
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "335179"
  - source: wikidata
    id: Q22135509
  - source: gbif
    id: "8519968"
