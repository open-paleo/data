genus: Diamantinasaurus
parent: Diamantinasauria
etymology: From Diamantina River (near the discovery site in Queensland, Australia) + Greek sauros, 'lizard'; means 'Diamantina lizard'
description: Diamantinasaurus is a genus of titanosaurian sauropod from
  Australia that lived during the early Late Cretaceous, about 94 million years
  ago. The type species of the genus is D. matildae, first described and named
  in 2009 by Scott Hocknull and colleagues based on fossil finds in the Winton
  Formation. Meaning "Diamantina lizard", the name is derived from the location
  of the nearby Diamantina River and the Greek word sauros, "lizard". The
  specific epithet is from the Australian song Waltzing Matilda, also the
  locality of the holotype and paratype. The known skeleton includes most of the
  forelimb, shoulder girdle, pelvis, hindlimb and ribs of the holotype, and one
  shoulder bone, a radius and some vertebrae of the paratype.
diet: herbivore
locomotion: quadrupedal
