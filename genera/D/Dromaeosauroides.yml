genus: Dromaeosauroides
parent: Dromaeosauridae
dispute:
  summary: >
    Dromaeosauroides bornholmensis is based on isolated tooth crowns. Its
    describers assigned it to Dromaeosauridae, resembling Dromaeosaurus (Christiansen
    and Bonde, 2003), but other authors regard the material as indeterminate. It is
    retained provisionally at Dromaeosauridae incertae sedis as a tooth-based taxon.
  history:
    - date: "2026-07-01"
      note: Retained at Dromaeosauridae incertae sedis; tooth-based taxon, considered indeterminate by some authors.
etymology: From Dromaeosaurus + Greek -oides, 'resembling'; means 'resembling Dromaeosaurus', indicating its morphological similarity to that genus
pronunciation:
  phonetic: DROH-mee-o-sor-ROY-deez
description: Dromaeosauroides is a genus of dromaeosaurid theropod dinosaur from
  the Early Cretaceous of what is now Denmark and possibly also England. It was
  discovered in the Jydegaard Formation in the Robbedale valley, on the island
  of Bornholm in the Baltic Sea. This formation ranges from the Berriasian to
  the Valanginian ages. This is the only likely place for dinosaur remains to be
  discovered on Danish territory, since the Mesozoic deposits exposed in the
  rest of the country are marine. Dromaeosauroides is the first known dinosaur
  from Denmark, and the only one which has been scientifically named. It is one
  of the oldest known dromaeosaurs in the world, and the first known uncontested
  dromaeosaur from the Early Cretaceous of Europe.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - coastal
appearance:
  integument: feathered
  evidence: inferred
diagnostic_features:
  - tooth crown recurved but not markedly blade-like, with a fore and aft basal
    length/basal width ratio of around 1.5
  - mesial and distal carinae both facing medially
  - both carinae finely serrate, with around 31 denticles per 5 mm on the mesial
    carina and around 30 per 5 mm on the distal carina, denticle size difference
    index of around 1
  - denticles around 0.15 mm in height, squarish and chisel-like in appearance,
    not anteriorly hooked
