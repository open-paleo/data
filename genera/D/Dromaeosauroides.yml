genus: Dromaeosauroides
parent: Dromaeosauridae
etymology: From Dromaeosaurus + Greek -oides, 'resembling'; means 'resembling Dromaeosaurus', indicating its morphological similarity to that genus
pronunciation:
  phonetic: DROH-mee-o-sor-ROY-deez
description: Dromaeosauroides is a genus of dromaeosaurid theropod dinosaur from
  the Early Cretaceous of what is now Denmark and possibly also England. It was
  discovered in the Jydegaard Formation in the Robbedale valley, on the island
  of Bornholm in the Baltic Sea. This formation ranges from the Berriasian to
  the Valanginian ages. This is the only likely place for dinosaur remains to be
  discovered on Danish territory, since the Mesozoic deposits exposed in the
  rest of the country are marine. Dromaeosauroides is the first known dinosaur
  from Denmark, and the only one which has been scientifically named. It is one
  of the oldest known dromaeosaurs in the world, and the first known uncontested
  dromaeosaur from the Early Cretaceous of Europe.
diet: carnivore
locomotion: bipedal
