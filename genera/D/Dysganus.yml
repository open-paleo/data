genus: Dysganus
parent: Ceratopsia
etymology: "From Greek dys- (bad/rough) + ganos (tooth enamel): 'rough enamel',
  referring to the texture of the fossil teeth."
pronunciation:
  phonetic: dis-GANN-us
description: Dysganus (meaning "rough enamel") is a dubious genus of ceratopsian
  dinosaur from the Campanian stage of the Late Cretaceous. The fossil teeth
  referred to Dysganus were first collected by Charles Sternberg from the Judith
  River Formation of Montana and later described by Edward Drinker Cope. All of
  the species are now seen as dubious ceratopsians, though referred material
  from tyrannosaurids and hadrosaurids were found in New Mexico.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Cutting face of crown concave/sunken, with lateral borders and basal cement
    projecting beyond it
  - Inferior border of cutting face usually oblique, one side rising diagonally
  - Weak keel asymmetrically placed close to one border, dividing cutting face
    into a wide and a narrow concavity
  - Oblique border incurved, with posterior cement column curving round the
    cutting face of the dentine
  - External basal cementum rises highest on the incurved border; surface
    minutely rugose with punctiform rugosity
  - Edge of unworn teeth not serrate; dentinal surface delicately rugose in
    unworn specimens
