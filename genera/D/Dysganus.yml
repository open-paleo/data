genus: Dysganus
parent: Ceratopsia
etymology: "From Greek dys- (bad/rough) + ganos (tooth enamel): 'rough enamel',
  referring to the texture of the fossil teeth."
pronunciation:
  phonetic: dis-GANN-us
description: Dysganus (meaning "rough enamel") is a dubious genus of ceratopsian
  dinosaur from the Campanian stage of the Late Cretaceous. The fossil teeth
  referred to Dysganus were first collected by Charles Sternberg from the Judith
  River Formation of Montana and later described by Edward Drinker Cope. All of
  the species are now seen as dubious ceratopsians, though referred material
  from tyrannosaurids and hadrosaurids were found in New Mexico.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Marginal ridge and raised cingulum base.
  - Tall median ridge.
  - Worn occlusal surface exposing the layered enamel pattern characteristic
    of ceratopsian teeth.
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "54478"
  - source: wikidata
    id: Q311507
  - source: gbif
    id: "4823138"
species:
  - name: Dysganus encaustus
    etymology: "From Greek 'encaustus' meaning 'burnt in', referring to the concave
      tip of the type tooth."
    status: nomen dubium
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Campanian
      from_ma: 83.6
      to_ma: 72.1
    location:
      country: US
      region: Montana
      formation: Judith River
    holotype:
      specimen_id: [ AMNH 5739 ]
      specimen_type: lectotype
      institution: AMNH
      material: Single fragmentary ceratopsian maxillary tooth (base of the crown just
        above the root) preserving part of one marginal ridge, the raised cingulum
        base, and part of the tall median ridge; worn occlusal surface present.
      completeness: fragmentary
      notes: Cope (1876) based the species on a chimeric suite of six teeth kept
        under AMNH 5739 (one ceratopsian maxillary tooth, a second ceratopsian
        fragment, three hadrosaur teeth, and a doubtful fragment); W. D. Matthew
        later designated the ceratopsian maxillary tooth as the type, here
        treated as the lectotype.
    erected_in: cope1876a
    described_in: coombs1988
references:
  - id: cope1876a
    authors: Cope, E. D.
    year: 1876
    title: Descriptions of some vertebrate remains from the Fort Union Beds of Montana
    journal: Proceedings of the Academy of Natural Sciences of Philadelphia
    volume: "28"
    pages: 248-261
  - id: coombs1988
    authors: Coombs, W. P. Jr.; Galton, P. M.
    year: 1988
    title: Dysganus, an indeterminate ceratopsian dinosaur
    journal: Journal of Paleontology
    pages: 818-821
    notes: Redescription of Cope's chimeric type material; documents Matthew's
      designation of one ceratopsian tooth (AMNH 5739) as the type and regards
      Dysganus and all four of its species as nomina dubia.
