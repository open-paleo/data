      - name: Seismosaurus hallorum
        type: reassigned
        reason: Emended combination (Gillette, 1994); recombined as Diplodocus
          hallorum when Tschopp, Mateus and Benson (2015) synonymized
          Seismosaurus with Diplodocus.
