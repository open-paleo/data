genus: Diplodocus
parent: Diplodocinae
etymology: From Greek 'diplos' (double) and 'dokos' (beam), referring to the
  double-beamed chevrons of the tail (with both anterior and posterior rami)
  that distinguished the genus when Marsh erected it in 1878.
pronunciation:
  ipa: /dɪˈplɒdəkəs/
  phonetic: di-PLOD-o-kus
description: Diplodocus is the type genus of Diplodocidae and one of the most
  iconic and best-known sauropod dinosaurs of the Late Jurassic Morrison
  Formation of western North America. Othniel Charles Marsh erected the
  genus in 1878 on a partial tail and posterior limb (YPM 1920) collected
  near Cañon City, Colorado, by S. W. Williston, designating Diplodocus
  longus as the type species. John Bell Hatcher (1901) produced the first
  comprehensive osteological monograph of the genus based on the
  near-complete Carnegie Museum specimens CM 84 and CM 94 from Sheep Creek
  in Albany County, Wyoming, and named those Carnegie skeletons as a new
  species, Diplodocus carnegii — the basis of the famous "Dippy" cast that
  Andrew Carnegie distributed to museums worldwide. Tschopp, Mateus and
  Benson (2015) reassessed all diplodocid material at the specimen level,
  argued that the fragmentary D. longus holotype was a nomen dubium, and
  applied to the ICZN to switch the type species to D. carnegii. The
  Commission ultimately ruled against the proposal in Opinion 2425 (2018),
  voting 16-4 to maintain D. longus as the type species. The same Tschopp
  et al. analysis recombined Seismosaurus hallorum (Gillette, 1991) as
  Diplodocus hallorum and reassigned D. hayi (Holland, 1924) to the new
  genus Galeamopus, leaving D. longus, D. carnegii, and D. hallorum as the
  three currently valid Diplodocus species.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
appearance:
  features:
    - whiplash tail
  integument: scaled
diagnostic_features:
  - Anteriorly inclined base of the posterior dorsal neural spines (unique
    within Diplodocinae).
  - Transition from fan-shaped to normal caudal ribs occurs at or posterior
    to caudal vertebra 7-8 (unique among Diplodocidae).
  - Pneumatopores of anterior caudal centra persist through caudal vertebra
    16 or more posteriorly (unique among Diplodocoidea).
  - Mid-caudal centra with trapezoidal articular surfaces (unique among
    Flagellicaudata).
  - Last caudal ribs occur on caudal vertebra 18 or more posteriorly.
  - Iliac blade height above the pubic peduncle ≥ 0.40 of its
    anteroposterior length (unique within Diplodocinae).
  - Anteromedially directed crest on the proximal fibula extending into a
    notch behind the cnemial crest of the tibia (unique within
    Diplodocinae).
  - Chevrons of the tail double-beamed (with both anterior and posterior
    rami) — Marsh's original diagnostic character and the source of the
    generic name.
