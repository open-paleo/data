notable_specimens:
  - specimen_id: [AMNH FR 223]
    institution: AMNH
    category: historic
    significance: "Semi-articulated partial postcranial skeleton from Como Bluff, collected 1897; the first Diplodocus mount made and the first well-preserved individual skeleton of the genus discovered. Later found to belong to D. hallorum and to be the geologically youngest specimen of that species."
    discovered:
      year: 1897
      by: "Barnum Brown and Henry Osborn"
    references: [tschopp2015a, osborn1899]
  - specimen_id: [CM 11255]
    institution: CM
    category: ontogeny
    significance: "Juvenile skull whose snout was not blunt and whose teeth were not confined to the front of the snout, differing greatly from adult Diplodocus skulls. The differences indicate adults and juveniles fed differently, an ecological difference not previously observed in sauropodomorphs."
    references: [whitlock2010]
  - specimen_id: [NMMNH P-3690]
    institution: NMMNH
    category: gut-contents
    significance: "Semi-articulated partial skeleton from near San Ysidro, New Mexico, preserving 230 gastroliths along with vertebrae, partial pelvis, and right femur. Originally named Seismosaurus, it was later referred to Diplodocus hallorum."
    discovered:
      year: 1985
    references: [tschopp2015a, gillette1994]
