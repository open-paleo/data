  - name: Diplodocus hallorum
    etymology: Honors James and Ruth Hall of the Ghost Ranch Conference Center,
      New Mexico, for their support of regional paleontology.
    status: valid
    type_species: false
    period:
      name:
        - Late Jurassic
      stage:
        - Kimmeridgian
        - Tithonian
      from_ma: 154.8
      to_ma: 145
    location:
      country: US
      region: New Mexico
      formation: Morrison
      member: Brushy Basin
      locality: Seismosaurus Quarry, near San Ysidro, Sandoval County
    type_specimen:
      specimen_id:
        - NMMNH P-3690
      specimen_type: holotype
      institution: NMMNH
      material: "Partially articulated skeleton: dorsal vertebrae and ribs, both
        ilia and ischia, a pubis, sacrum, caudal vertebrae, five chevrons, and
        230 gastroliths."
    diagnostic_features:
      - Dorsal end of the postspinal lamina of single dorsal neural spines
        concave transversely
      - Mid-caudal neural arches situated on the anterior half of the centrum
      - Vertical mid-caudal neural spines (more posteriorly inclined in D.
        carnegii)
      - Posterior end of the mid- and posterior caudal neural spine summits lies
        more or less straight above the postzygapophyses
      - Distinct fossae on the medial surfaces of the proximal branches of the
        middle chevrons
      - Gracile femur, with a robustness index below 0.22
    synonyms:
