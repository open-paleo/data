notable_specimens:
  - specimen_id:
      - AMNH FR 223
    institution: AMNH
    category: historic
    significance: Semi-articulated partial postcranial skeleton from Como Bluff,
      collected 1897; the first Diplodocus mount made and the first
      well-preserved individual skeleton of the genus discovered. Later found to
      belong to D. hallorum and to be the geologically youngest specimen of that
      species.
    discovered:
      year: 1897
      by: Barnum Brown and Henry Osborn
    references:
      - tschopp2015a
      - osborn1899a
  - specimen_id:
      - CM 11255
    institution: CM
    category: ontogeny
    significance: Juvenile skull whose snout was not blunt and whose teeth were not
      confined to the front of the snout, differing greatly from adult
      Diplodocus skulls. The differences indicate adults and juveniles fed
      differently, an ecological difference not previously observed in
      sauropodomorphs.
    references:
      - whitlock2010a
  - specimen_id:
      - NMMNH P-3690
    institution: NMMNH
    category: gut-contents
    significance: Semi-articulated partial skeleton from near San Ysidro, New
      Mexico, preserving 230 gastroliths along with vertebrae, partial pelvis,
      and right femur. Originally named Seismosaurus, it was later referred to
      Diplodocus hallorum.
    discovered:
      year: 1985
    references:
      - tschopp2015a
      - gillette1994a
references:
  - id: marsh1878b
    notes: Erects Diplodocus longus on YPM 1920 from the Morrison Formation of Cañon
      City, Colorado, and formally proposes the suborder Sauropoda.
  - id: hatcher1901a
    notes: First comprehensive osteology of the genus; names Diplodocus carnegii on
      CM 84 (cotype CM 94) from Sheep Creek, Wyoming — the Carnegie skeleton
      famously cast as 'Dippy' for distribution to museums.
  - id: tschopp2015a
    notes: Specimen-level phylogenetic revision; provides the modern revised
      diagnosis and proposes switching the type species to D. carnegii
      (subsequently rejected by ICZN Opinion 2425).
  - id: iczn2018a
    notes: Resolves Case 3700 (Tschopp and Mateus, 2016 application). The Commission
      voted 16-4-1 against using plenary power to switch the type species; D.
      longus is maintained as the type of Diplodocus.
  - id: jones2026b
    notes: Source of the body length, mass, and hip height estimates, and the
      appearance features.
  - id: osborn1899a
  - id: whitlock2010a
  - id: gillette1994a
  - id: gillette1991a
    notes: Named Seismosaurus halli, later recombined as Diplodocus hallorum.
  - id: holland1924a
    notes: Described Diplodocus hayi, later moved to Galeamopus.
