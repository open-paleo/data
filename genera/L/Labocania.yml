genus: Labocania
parent: Teratophoneini
pronunciation:
  phonetic: lah-boh-KAHN-ee-a
etymology: Named after the La Bocana Roja Formation in Baja California, Mexico,
  where the type specimen was likely recovered
description: "Labocania is an extinct genus of theropod dinosaur of disputed
  affinities, known from the Late Cretaceous of Mexico. Initially regarded as an
  indeterminate theropod, later studies have mentioned possible affinities with
  tyrannosaurids, abelisaurids, or carcharodontosaurids. More recent research
  based on additional fossil material found support for a position within the
  tyrannosaurine clade Teratophoneini. Two species have been proposed: L.
  anomala (the type species), likely from the La Bocana Roja Formation, and L.
  aguillonae from the Cerro del Pueblo Formation."
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - coastal
diagnostic_features:
  - Frontals massive and thick, with no anterior extension of supratemporal
    fossa onto dorsal surface
  - Quadrate massive, with almost cylindrical mandibular articular surface
    lacking the typical theropod helical groove
  - Mandibular condyle of quadrate inclined at about 45 degrees to the long axis
    of the element, implying strong posterior inclination of the suspensorium
  - Dentary with prominent lateral shelf (external longitudinal ridge) on its
    external surface
  - Ischium with broad plate-like triangular obturator process and relatively
    larger semi-circular concave tendon scar along posterior margin than in
    Tyrannosaurus
