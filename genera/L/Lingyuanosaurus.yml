genus: Lingyuanosaurus
parent: Therizinosauria
etymology: "Named for the county-level city of Lingyuan in Liaoning Province, China, where it was discovered, combined with Ancient Greek 'sauros' meaning 'lizard'; the specific name sihedangensis also references the discovery locality, the town of Sihedang."
description: Lingyuanosaurus is a genus of therizinosaurian theropod from the
  Early Cretaceous of Liaoning Province, China. The type and only species is L.
  sihedangensis. It was uncovered within one of the formations that make up the
  Jehol biota, although the exact geological formation — and therefore also its
  precise geological age — is unknown.
diet: carnivore
locomotion: bipedal
