genus: Lingyuanosaurus
parent: Therizinosauroidea
pronunciation:
  phonetic: ling-YWEN-oh-SAWR-us
etymology: "Named for the county-level city of Lingyuan in Liaoning Province,
  China, where it was discovered, combined with Ancient Greek 'sauros' meaning
  'lizard'; the specific name sihedangensis also references the discovery
  locality, the town of Sihedang."
description: Lingyuanosaurus is a genus of therizinosaurian theropod from the
  Early Cretaceous of Liaoning Province, China. The type and only species is L.
  sihedangensis. It was uncovered within one of the formations that make up the
  Jehol biota, although the exact geological formation — and therefore also its
  precise geological age — is unknown.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
diagnostic_features:
  - Posterior dorsal vertebrae with prominent paradiapophyseal lamina separating
    anterior and posterior infradiapophysial fossae
  - Hyposphene with ventral expansion forming intumescence extending as far as
    postzygapophysis posteriorly and beyond laterally
  - Centroprezygapophyseal lamina extending anteriorly considerably beyond level
    of prezygapophysis and fusing with opposite lamina along midline
  - Ilium with dorsal margin strongly convex but posterior part distinctly
    concave
  - Sub-triangular fossa immediately dorsal to pubic peduncle on medial surface
    of ilium
appearance:
  integument: feathered
  evidence: inferred
