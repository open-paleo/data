    notes: Named Lingyuanosaurus and recovered it within Therizinosauroidea,
      more derived than Beipiaosaurus, with low support.
  - id: jones2026c
    notes: Places Lingyuanosaurus after Beipiaosaurus among early therizinosaurs.
  - id: kobayashi2022a
    notes: Recovered Lingyuanosaurus more derived than Beipiaosaurus, as in Yao and colleagues (2019).
  - id: liao2026a
    notes: Recovered Lingyuanosaurus within Therizinosauroidea, more derived than Beipiaosaurus.
