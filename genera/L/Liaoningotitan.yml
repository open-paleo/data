genus: Liaoningotitan
parent: Titanosauriformes
etymology: Named after Liaoning Province, China combined with Greek titan
  (giant); meaning "Liaoning giant"
description: Liaoningotitan is a genus of titanosauriform sauropod from the
  Early Cretaceous (Barremian) Yixian Formation in Liaoning, China. A
  redescription of the holotype proposed affinities of Liaoningotitan with the
  Euhelopodidae.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - lacustrine
  - forested
diagnostic_features:
  - Ventral margin of maxilla convex; tooth row developed only in anterior
    portion of maxilla
  - Anterior end of jugal nearly level with anterior margin of antorbital
    fenestra
  - Quadrate wing of pterygoid constricted at base in bottle-neck shape with
    nearly circular cross-section
  - Upper teeth imbricated; narrow spatulate crown D-shaped in cross-section,
    lacking labial grooves and small serrations
  - 9 lower teeth, distinctly smaller than upper teeth, sparsely arranged; lower
    tooth crown asymmetrical, elliptical in cross-section, with lingual grooves
    and ridge, basal crown bulbous lingually
  - Proximal expansion of humerus approximately 54.9% of humeral length; ilium
    with pointed preacetabular process
