genus: Liaoningotitan
parent: Euhelopodidae
dispute:
  summary: >
    Liaoningotitan was redescribed as a euhelopodid, recovered as the sister
    taxon of Yongjinglong (Shan et al., 2025), although Jones (2026) treats it
    as an unstable basal somphospondylan.
  history:
    - date: "2026-06-30"
      note: >
        Placed at Euhelopodidae following Shan et al. (2025); its instability
        in other analyses is noted.
etymology: Named after Liaoning Province, China combined with Greek titan
  (giant); meaning "Liaoning giant"
pronunciation:
  phonetic: lee-YOW-ning-o-TIE-tuhn
description: Liaoningotitan is a genus of titanosauriform sauropod from the
  Early Cretaceous (Barremian) Yixian Formation in Liaoning, China. A
  redescription of the holotype proposed affinities of Liaoningotitan with the
  Euhelopodidae.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - lacustrine
  - forested
diagnostic_features:
  - Premaxilla and maxilla resembling early-diverging Titanosauriformes while
    the quadratojugal resembles late-diverging Titanosauriformes (mosaic skull
    evolution).
  - Anterior side of the jugal aligned with the anterior margin of the
    antorbital fenestra (autapomorphy).
  - Obtuse angle between the horizontal and ascending branches of the
    quadratojugal (autapomorphy).
  - Shallow fossa in the posterior part of the neural spine of a dorsal vertebra
    (new autapomorphy).
  - Middle caudal vertebrae procoelous (autapomorphy).
  - Attachment point of the coracobrachialis muscle on the anterior surface of
    the proximal humerus flat rather than concave (new autapomorphy).
  - Posterior dorsal neural spine unbifurcated; dorsal lateral pneumatic foramen
    shallow; second cnemial crest of the tibia absent.
appearance:
  features:
    - downturned snout
  integument: scaled
  evidence: inferred
