genus: Ledumahadi
parent: Lessemsauridae
etymology: "From Sesotho meaning 'giant thunderclap', in reference to the animal's enormous size. The species name 'mafube' means 'dawn' in Sesotho."
pronunciation:
  phonetic: leh-DOO-muh-HA-dee
description: Ledumahadi is a genus of lessemsaurid sauropodomorph dinosaur from
  the Early Jurassic Elliot Formation in Free State Province, South Africa. The
  type and only species is L. mafube, known from a singular incomplete
  postcranial specimen. A quadruped, it was one of the first giant
  sauropodomorphs, reaching a weight of around 12 tonnes (13 short tons),
  despite not having evolved columnar limbs like its later huge relatives.
locomotion: facultative
paleoenvironment:
  - fluvial
  - arid
diet: herbivore
diagnostic_features:
  - Medial edge of proximal first metacarpal sharply tapering and curved with
    sublacriform outline, differing from typical keyhole shape
  - Anterior articular facet of anterior caudal vertebra deeply concave, set
    back from anterolateral margin 4.5 cm
  - Forelimb elements extremely robust with ulnal minimum shaft circumference
    0.57 times total bone length
