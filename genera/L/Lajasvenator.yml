genus: Lajasvenator
parent: Carcharodontosauridae
placement: incertae sedis
dispute:
  summary: >
    Lajasvenator ascheriae is recovered as a basal carcharodontosaurid, variously as
    sister to Eocarcharia (Coria et al., 2020; Jones et al., 2026) or in a polytomy
    of basal carcharodontosaurids with Lusovenator and Concavenator (Canale et al.,
    2022). It is placed at Carcharodontosauridae incertae sedis.
  history:
    - date: "2026-07-01"
      note: Placed at Carcharodontosauridae incertae sedis as a basal member; its finer position is unresolved.
etymology: Named after the city of Las Lajas in Neuquén, Argentina combined with Latin venator (hunter); meaning "Las Lajas hunter"
pronunciation:
  phonetic: LAH-hass-VEN-uh-tuh
description: Lajasvenator is a genus of carcharodontosaurid dinosaur from the
  Mulichinco Formation from Neuquén Province in Argentina. The type and only
  species is Lajasvenator ascheriae. It was probably one of the smaller known
  Carcharodontosaurids, being slightly more than half the length of
  Concavenator, about 3.5 m (11 ft).
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Anterior projections on cervical prezygapophyses
  - Lip-like crests on lateral surfaces of cervical postzygapophyses
  - Bilobed anterior processes on cervical ribs
  - Premaxilla ventral to external naris with height/length ratio less than 0.5
  - Paradental plates with striated or ridged surfaces
  - Relatively small premaxillary teeth
  - Cervical vertebrae with distinct rim on anterior articular surface
  - Ilium with straight dorsal margin
appearance:
  integument: scaled
  evidence: inferred
