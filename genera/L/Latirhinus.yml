genus: Latirhinus
parent: Lambeosaurinae
etymology: From Latin latus (broad) and Greek rhis (nose); meaning "broad nose"
description: Latirhinus is an extinct genus of lambeosaurine hadrosaurid
  dinosaur from the Late Cretaceous of Mexico. The type species, Latirhinus
  uitstlani, was named in 2012 on the basis of a partial skeleton from the
  Campanian-age Cerro del Pueblo Formation. The specific name uitstlani means
  "southern" in the Náhuatl language of Mexico, a reference to the species'
  southern occurrence in the Cretaceous landmass Laramidia.
diet: herbivore
locomotion: facultative
