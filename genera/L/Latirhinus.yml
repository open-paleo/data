genus: Latirhinus
parent: Lambeosaurinae
etymology: From Latin latus (broad) and Greek rhis (nose); meaning "broad nose"
pronunciation:
  phonetic: la-ti-RIEN-us
description: Latirhinus is an extinct genus of lambeosaurine hadrosaurid
  dinosaur from the Late Cretaceous of Mexico. The type species, Latirhinus
  uitstlani, was named in 2012 on the basis of a partial skeleton from the
  Campanian-age Cerro del Pueblo Formation. The specific name uitstlani means
  "southern" in the Náhuatl language of Mexico, a reference to the species'
  southern occurrence in the Cretaceous landmass Laramidia.
dispute:
  summary: >
    Latirhinus uitstlani is generally placed within Lambeosaurinae, but
    Prieto-Márquez and others (2019) recovered it at the base of
    Hadrosauridae in a clade with Aquilarhinus, and its holotype may
    combine lambeosaurine and saurolophine elements. Placed
    conservatively within Lambeosaurinae following the prevailing view.
  history:
    - date: "2026-06-27"
      note: Placed at Lambeosaurinae following Jones (2026) and the
        original description; the basal-Hadrosauridae position of
        Prieto-Márquez and others (2019) reflected but not adopted (P2,
        P5).
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Deep and arcuate dorsal process of the nasal, deeper than all other
    saurolophines except Gryposaurus
  - Broader narial foramen than any other known hadrosaurid taxon
  - Anterodorsally curved deltoid crest of the scapula (convergent with
    Lambeosaurinae)
  - Hook-shaped nasal with mediolaterally compressed form
  - Relatively gracile humeri with deltopectoral crest comprising 55% of total
    length
