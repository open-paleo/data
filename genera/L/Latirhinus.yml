genus: Latirhinus
parent: Lambeosaurinae
etymology: From Latin latus (broad) and Greek rhis (nose); meaning "broad nose"
pronunciation:
  phonetic: la-ti-RIEN-us
description: Latirhinus is an extinct genus of lambeosaurine hadrosaurid
  dinosaur from the Late Cretaceous of Mexico. The type species, Latirhinus
  uitstlani, was named in 2012 on the basis of a partial skeleton from the
  Campanian-age Cerro del Pueblo Formation. The specific name uitstlani means
  "southern" in the Náhuatl language of Mexico, a reference to the species'
  southern occurrence in the Cretaceous landmass Laramidia. The genus name
  refers to the broad narial region inferred from an arcuate skull fragment
  identified in the original description as a partial nasal; that element was
  subsequently reidentified as a fragment of right jugal belonging to a much
  larger hadrosaurid and removed from the holotype, leaving the skull of
  Latirhinus effectively unknown.
dispute:
  summary: >
    Latirhinus uitstlani was originally described as a saurolophine and was
    later recovered at the base of Hadrosauridae in a clade with Aquilarhinus,
    but both of those placements rested on an arcuate skull fragment
    interpreted as a partial nasal, since reidentified as a fragment of right
    jugal from a much larger hadrosaurid and excluded from the holotype.
    Ramírez-Velasco and others (2021) reassigned the species to Lambeosaurinae
    on a rediagnosis of the recomposed holotype, and two independent parsimony
    analyses published in 2022, one of them co-authored by the original
    describer, recovered it within Lambeosaurinae. Those two analyses differ on
    how deeply it nests: Serrano-Brañas and Prieto-Márquez left its
    relationships within the subfamily unresolved, while Ramírez-Velasco
    recovered it within Lambeosaurini alongside Magnapaulia and Velafrons. The
    composition of the holotype itself remains contested, the 2021 and 2022
    studies disagreeing over which elements of the bonebed belong to the type
    individual.
  history:
    - date: "2026-06-27"
      note: Placed at Lambeosaurinae following Jones (2026); the original
        description (Prieto-Márquez et al., 2012) tentatively assigned it to
        Saurolophinae (no cladistic analysis) and Prieto-Márquez and others
        (2019) recovered it at the base of Hadrosauridae, neither adopted (P2, P5).
    - date: "2026-08-04"
      note: Retained at Lambeosaurinae, now on the primary literature rather
        than a reference work. Serrano-Brañas and Prieto-Márquez (2022)
        recovered Latirhinus within Lambeosaurinae in a parsimony analysis of
        291 characters, and Ramírez-Velasco (2022) recovered it within
        Lambeosaurini; both follow the reassignment of Ramírez-Velasco and
        others (2021). The base-of-Hadrosauridae result of Prieto-Márquez and
        others (2019) was supported by the breadth of the external bony naris,
        a character of the skull fragment now reidentified as a jugal and
        excluded from the holotype. Kept at Lambeosaurinae rather than
        Lambeosaurini because only one of the two analyses resolves the tribe.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Coracoid oval in shape and poorly developed laterally, with an elongate
    biceps tuberosity
  - Rounded dorsal margin of the coracoid in medial view (convergent with
    basally branching hadrosauroids)
  - Well developed and medially pronounced subcoracoid tuberculum
  - Low sternal process of the coracoid (convergent with basally branching
    hadrosauroids)
  - Rounded, slightly anteroposteriorly compressed bump on the scapular glenoid
    process
  - Trapezoid lateroventral corner of the humeral deltopectoral crest, abruptly
    expanded anteriorly into two lobes protruding medially and laterally
