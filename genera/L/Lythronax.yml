genus: Lythronax
parent: Tyrannosaurinae
etymology: "From Greek 'lythron' (λύθρον) meaning 'gore' and 'anax' (ἄναξ) meaning 'king', hence 'gore king'. The species name is from Greek 'argestes' (ἀργεστής), Homer's name for the wind from the southwest, referring to where the specimen was found in North America."
pronunciation:
  phonetic: LY-thro-nax
description: Lythronax is a genus of tyrannosaurid dinosaur that lived in North
  America around 81.9-81.5 million years ago during the Late Cretaceous period.
  The only known specimen was discovered in Utah in the Wahweap Formation of the
  Grand Staircase-Escalante National Monument in 2009, and it consists of a
  partial skull and skeleton. In 2013, it became the basis of the new genus and
  species Lythronax argestes; the generic name Lythronax means "gore king", and
  the specific name argestes originates from the Greek poet Homer's name for the
  wind from the southwest, in reference to the specimen's geographic provenance
  in North America.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - sigmoidal lateral margin of maxilla
  - ratio of transverse width of anterior portion of nasal to transverse width of
    middle portion greater than 2.5
  - prefrontal and postorbital contact surfaces on frontal separated only by
    narrow dorsoventral groove
  - distinct subocular flange on jugal
  - 11 maxillary alveoli (vs 14-16 in other tyrannosaurids)
  - concave lateral margin of dentary with broad postorbital process of jugal
  - laterally expanded caudal skull with rostrodorsally directed orbits
  - large distally expanded pubic boot with anteroposterior length at least 60%
    of total pubic length
  - dorsally expanded ascending process of astragalus
