genus: Lavocatisaurus
parent: Rebbachisauridae
etymology: "Named for French paleontologist René Lavocat combined with Greek 'sauros' meaning 'lizard', hence 'René Lavocat's lizard'. The species name refers to Agrio del Medio, the locality where it was found."
description: Lavocatisaurus is a genus of sauropod in the family
  Rebbachisauridae from the Early Cretaceous (Aptian to Albian) Rayoso Formation
  of the Neuquén Basin, northern Patagonia, Argentina.
