genus: Lavocatisaurus
parent: Rebbachisauridae
pronunciation:
  phonetic: luh-voh-KAH-ti-SAWR-us
etymology: "Named for French paleontologist René Lavocat combined with Greek 'sauros' meaning 'lizard', hence 'René Lavocat's lizard'. The species name refers to Agrio del Medio, the locality where it was found."
description: Lavocatisaurus is a genus of sauropod in the family
  Rebbachisauridae from the Early Cretaceous (Aptian to Albian) Rayoso Formation
  of the Neuquén Basin, northern Patagonia, Argentina.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - lacustrine
diagnostic_features:
  - extremely well-developed preantorbital fenestra
  - marked laterodorsal fossa in the dentary
  - ventrally expanded squamosal
  - dentary with pronounced ventral projection in the mesio-ventral corner
  - maxillary teeth significantly larger than the mandibular teeth
  - middle caudal vertebrae with anteriorly projecting prezygapophysis
appearance:
  features:
    - keratinous beak
  integument: scaled
  evidence: inferred
