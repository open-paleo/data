genus: Ligabuesaurus
parent: Somphospondyli
etymology: Named in honor of Giancarlo Ligabue, an Italian explorer and
  naturalist who supported paleontological research.
description: Ligabuesaurus is a genus of somphospondylan sauropod from the Early
  Cretaceous Lohan Cura Formation of what is now Argentina. The type species,
  Ligabuesaurus leanzai, was described in 2006, based on a partial skeleton
  preserving an isolated tooth row (no other cranial bones). The generic name,
  Ligabuesaurus, honors Giancarlo Ligabue, while the
  specific name, leanzai, honors the geologist Dr. Héctor A. Leanza, who
  discovered the skeleton in the Lohan Cura Formation.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Laminar, anteroposteriorly compressed neural spines of rhomboid shape on
    posterior cervical and anterior dorsal vertebrae, transversely wider than
    the vertebral centra
  - "Spinoprezygapophyseal laminae in posterior cervical vertebrae bifurcated
    into two pairs: the medial pair converging toward the neural spine apex, the
    lateral pair forming the lateral border of the neural spine"
  - Neural arch pedicels of posterior cervical and anterior dorsal vertebrae very
    low, less than one-third the height of the anterior articular surface
  - Ventral half of the coracoid quadrangular in lateral view
  - Posteriorly expanded humeral head
  - Fossae on the proximoventral faces of metatarsals II and III
  - Deep pit on the ventrodistal face of pedal phalanx II-1
