genus: Ligabuesaurus
parent: Somphospondyli
etymology: Named in honor of Giancarlo Ligabue, an Italian explorer and
  naturalist who supported paleontological research.
description: Ligabuesaurus is a genus of somphospondylan sauropod from the Early
  Cretaceous Lohan Cura Formation of what is now Argentina. The type species,
  Ligabuesaurus leanzai, was described in 2006, based on a partial skeleton with
  a skull. The generic name, Ligabuesaurus, honors Giancarlo Ligabue, while the
  specific name, leanzai, honors the geologist Dr. Héctor A. Leanza, who
  discovered the skeleton in the Lohan Cura Formation.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Laminar and anteroposteriorly compressed neural spines of rhomboid shape on
    posterior cervical and anterior dorsal vertebrae, wider than vertebral
    centra
  - "Spinoprezygapophyseal laminae in posterior cervical vertebrae forked into
    two pairs: medial pair unites toward neural spine tip, lateral pair forms
    lateral border of neural spine"
  - Dorsoventrally reduced neural arch pedicels in posterior cervical and
    anterior dorsal vertebrae
  - Rudimentary prespinal lamina on posterior cervical and anterior dorsal
    vertebrae
