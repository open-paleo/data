genus: Leptorhynchos
parent: Caenagnathidae
pronunciation:
  ipa: /ˌlɛptəuˈrɪŋkəus/
description: Leptorhynchos is an extinct genus of caenagnathid theropod from the
  Late Cretaceous of what is now the US state of Texas, although it has been
  suggested to also exist in Alberta and South Dakota. The type species is L.
  gaddisi, and it is currently the only widely accepted valid species. The
  generic name of Leptorhynchos comes from the Greek "leptos" meaning "small"
  and "rhynchos" meaning "beak". The specific epithet is in honor of the Gaddis
  family, who owned the land on which the holotype was discovered.
diet: omnivore
locomotion: bipedal
