genus: Leptorhynchos
parent: Caenagnathidae
pronunciation:
  ipa: /ˌlɛptəuˈrɪŋkəus/
  phonetic: LEP-toh-RIN-koss
etymology: "From Greek 'leptos' meaning 'slender' or 'thin' and 'rhynchos' meaning 'beak' or 'snout', referring to a slender beak."
description: Leptorhynchos is an extinct genus of caenagnathid theropod from the
  Late Cretaceous of what is now the US state of Texas, although it has been
  suggested to also exist in Alberta and South Dakota. The type species is L.
  gaddisi, and it is currently the only widely accepted valid species. The
  generic name of Leptorhynchos comes from the Greek "leptos" meaning "small"
  and "rhynchos" meaning "beak". The specific epithet is in honor of the Gaddis
  family, who owned the land on which the holotype was discovered.
diet: omnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - more anteriorly projecting tip of the beak than L. elegans
  - strongly rounded anteroventral margin of the symphysis
  - lateral occlusal margins of the dentaries not as strongly divergent in
    dorsal view
  - tip of the beak narrower and more spoon-shaped in dorsal view
