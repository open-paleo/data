genus: Liliensternus
parent: Neotheropoda
pronunciation:
  phonetic: LIL-ee-en-SHTER-nus
etymology: Named for German paleontologist Hugo Rühle von Lilienstern, who
  collected early specimens of this dinosaur.
description: Liliensternus is an extinct genus of basal neotheropod dinosaur
  that lived approximately 210 million years ago during the latter part of the
  Triassic Period in what is now Germany. Liliensternus was a bipedal,
  ground-dwelling carnivore, that could grow up to 5.15 m (16.9 ft) long;
  however, this size estimate is based on specimens now believed to be
  subadults, and possible fragmentary remains indicate an adult length of 7 to 9
  meters. It is the best represented Triassic theropod from Europe and one of
  the largest known.
diet: carnivore
locomotion: bipedal
