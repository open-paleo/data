genus: Liliensternus
parent: Neotheropoda
dispute:
  summary: >
    Liliensternus liliensterni is recovered at the base of Coelophysoidea by
    some analyses (Ezcurra and others, 2020) but outside Coelophysoidea as a
    basal neotheropod by others (Spiekman and others, 2021; Marsh and Rowe,
    2020; Jones, 2026).
  history:
    - date: "2026-06-30"
      note: >
        Placed at Neotheropoda, the least-inclusive clade these results agree
        on.
pronunciation:
  phonetic: LIL-ee-en-SHTER-nus
etymology: Named for German paleontologist Hugo Rühle von Lilienstern, who
  collected early specimens of this dinosaur.
description: Liliensternus is an extinct genus of basal neotheropod dinosaur
  that lived approximately 210 million years ago during the latter part of the
  Triassic Period in what is now Germany. Liliensternus was a bipedal,
  ground-dwelling carnivore, that could grow up to 5.15 m (16.9 ft) long;
  however, this size estimate is based on specimens now believed to be
  subadults, and possible fragmentary remains indicate an adult length of 7 to 9
  meters. It is the best represented Triassic theropod from Europe and one of
  the largest known.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - arid
appearance:
  integument: scaled
  evidence: inferred
diagnostic_features:
  - Anterior cervical vertebrae bearing a ventral longitudinal keel that fades by
    the fifth cervical vertebra
  - Sacral ribs very short and set high and forward, so the upper edges of the two
    ilia are very closely approximated
  - Humerus about two-thirds the length of the scapula and half the length of the
    femur
  - Femur only slightly longer than the tibia, with a peg-shaped, freely
    projecting greater trochanter and a long fourth trochanter set above femoral
    midlength
  - Fibula convex anteriorly, curved opposite to the tibia, with a small fibulare
    fused to the tibiale into a common trochlea
  - Pubis narrow, about as long as the femur, distally thickened into a club-like
    end
