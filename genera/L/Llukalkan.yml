genus: Llukalkan
parent: Furileusauria
description: Llukalkan is a genus of abelisaurid theropod dinosaur from the Late
  Cretaceous Bajo de la Carpa Formation of Argentina.
etymology: From Mapuche llukalkan meaning "one who causes fear" or "one who scares"
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - arid
diagnostic_features:
  - "Single autapomorphy: caudal tympanic recess located just posterior to
    columellar recess"
  - T-shaped lacrimal with anterior ramus longer than half of ventral ramus
    length
  - Slender lacrimal jugal ramus without posterior suborbital process
  - Notch followed by bulge on anteromedial border of supratemporal fossa
  - Dorsoventrally expanded paroccipital processes with posterodorsally oriented
    distal ends
  - Large foramina for caudal middle cerebral veins widely separated from
    supraoccipital crest
  - Slender and anteroventrally projected basipterygoid processes
