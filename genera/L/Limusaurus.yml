genus: Limusaurus
parent: Elaphrosaurinae
etymology: "From Latin 'limus' meaning 'mud' or 'mire' and Greek 'sauros' meaning 'lizard', hence 'mire lizard', referring to the specimens appearing to have died after being mired in mud."
pronunciation:
  phonetic: LIM-oo-SOR-us
description: 'Limusaurus is a genus of theropod dinosaur that lived in what is
  now China during the Late Jurassic, around 161 to 157 million years ago. The
  type and only species Limusaurus inextricabilis was described in 2009 from
  specimens found in the Upper Shishugou Formation in the Junggar Basin of
  China. The genus name consists of the Latin words for "mud" and "lizard", and
  the species name means "impossible to extricate", both referring to these
  specimens possibly dying after being mired. Limusaurus was a small, slender
  animal, about 1.7 m (5 ft 7 in) in length and 15 kg (33 lb) in weight, which
  had a long neck and legs but very small forelimbs (with reduced first and
  fourth fingers). It underwent a drastic morphological transformation as it
  aged: while juveniles were toothed, these teeth were completely lost and
  replaced by a beak with age. Several of these features were convergently
  similar to the later ornithomimid theropods as well as the earlier
  non-dinosaurian shuvosaurids.'
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Short skull, half as long as the femur
  - Skull and mandible toothless
  - Nasal with lateral shelf
  - Short and wide nasal less than one-third of skull roof length
  - Metacarpal I highly reduced and carrying no phalanges
  - Metacarpal II much more robust than other metacarpals
  - Large external mandibular fenestra about 40% of mandibular length
  - Metatarsus forming strong transverse arch
appearance:
  features:
    - keratinous beak
    - reduced forelimbs
  integument: scaled
  evidence: inferred
