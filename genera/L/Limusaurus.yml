genus: Limusaurus
parent: Elaphrosaurinae
etymology: "From Latin 'limus' meaning 'mud' or 'mire' and Greek 'sauros' meaning 'lizard', hence 'mire lizard', referring to the specimens appearing to have died after being mired in mud."
pronunciation:
  phonetic: LIM-oo-SOR-us
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Short skull, half as long as the femur
  - Skull and mandible toothless
  - Nasal with lateral shelf
  - Short and wide nasal less than one-third of skull roof length
  - Metacarpal I highly reduced and carrying no phalanges
  - Metacarpal II much more robust than other metacarpals
  - Large external mandibular fenestra about 40% of mandibular length
  - Metatarsus forming strong transverse arch
appearance:
  features:
    - keratinous beak
    - reduced forelimbs
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "148870"
  - source: wikidata
    id: Q132375
  - source: gbif
    id: "4966179"
  - source: eol
    id: "47459118"
species:
  - name: Limusaurus inextricabilis
    etymology: "From Latin 'inextricabilis' meaning 'impossible to extricate', referring to the specimens' likely fate of dying after becoming mired in mud pits created by the footprints of giant sauropods."
    pronunciation:
      phonetic: in-EKS-tri-KAB-i-lis
    status: valid
    type_species: true
    period:
      name:
        - Middle Jurassic
        - Late Jurassic
      stage:
        - Callovian
        - Oxfordian
    location:
      country: CN
      locality: TBB2005, Wucaiwan
      region: CN-XJ
      formation: Shishugou
      notes: >
        Xu and colleagues (2009) give the horizon as the "Oxfordian upper part
        of the Shishugou Formation" without tying it to the dated tuffs, which on the ICS chart v2024/12 straddle the base of the Oxfordian.
    type_specimen:
      specimen_id: [IVPP V15923]
      specimen_type: holotype
      institution: IVPP
      material: Articulated nearly complete skeleton.
      completeness: complete
    size:
      hip_height_m:
        min: 0.5
        max: 0.5
      length_m:
        min: 1.7
        max: 1.7
      weight_kg:
        min: 15
        max: 15
    erected_in: xu2009a
references:
  - id: xu2009a
  - id: jones2026c
    notes: Source of the hip height estimate, and the appearance features.
  - id: eberth2010a
    notes: Reports the holotype from the TBB2005 bonebed, one of three in the
      upper half of the formation at Wucaiwan.
