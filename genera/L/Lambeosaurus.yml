notable_specimens:
  - specimen_id:
      - ROM 1218
    institution: ROM
    species: Lambeosaurus lambei
    category: exceptional-preservation
    significance: One of only three Lambeosaurus specimens preserving skin
      impressions. Uniquely, it preserves a subcircular arrangement of feature
      scales formed by eight wedge-shaped scales converging to a single central
      point, a pattern not seen in the other skin-bearing specimens.
    discovered:
      year: 1919
    references:
      - bell2014a
  - specimen_id:
      - TMP 1966.04.1
    institution: TMP
    category: complementary
    significance: Basis of the 2007 redescription of L. magnicristatus, supplying
      most of the species' postcranial anatomy after the holotype was badly
      water-damaged and much of its limbs and girdles discarded. It also
      preserves skin impressions along the neck, forelimb, and leg.
    discovered:
      year: 1937
      by: C. M. Sternberg
    references:
      - evans2007a
