        - CMN 8705
      specimen_type: holotype
      institution: CMN
      material: Originally a near-complete articulated skull and postcranial skeleton;
        most postcranial elements were later damaged by water and discarded,
        leaving only the skull and right ilium prepared.
    diagnostic_features:
      - Crest strongly inclined rostrally, with a crest-snout angle less than 85
        degrees, so that the crest strongly overhangs the snout.
      - Caudodorsal process of the premaxilla enlarged rostrodorsally to a
        greater degree, with a broadly rounded profile.
      - Prepubic blade small, expanded to less than 1.7 times the width of the
        prepubic neck.
