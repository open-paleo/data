genus: Lambeosaurus
parent: Lambeosaurinae
pronunciation:
  ipa: /ˌlæmbiəˈsɔːrəs/
  phonetic: LAM-bee-uh-SOR-uhs
etymology: Named for Canadian paleontologist Lawrence M. Lambe, with the Greek
  suffix '-saurus' meaning 'lizard'.
description: Lambeosaurus is a genus of hadrosaurid dinosaur that lived during
  the Late Cretaceous period of western North America. The first skull of
  Lambeosaurus found was used by paleontologist Lawrence M. Lambe to justify the
  creation of the new genus Stephanosaurus, although it was not part of the
  latter's original material. Its incomplete nature led William A. Parks to name
  Lambeosaurus lambei for this skull in 1923 to honor Lambe. Multiple species of
  Lambeosaurus have been named since, including L. clavinitialis and L.
  magnicristatus in 1935, and L. laticaudus in 1981 which was later moved to its
  own genus Magnapaulia. It has also been identified that some species earlier
  identified as belonging to Tetragonosaurus and Corythosaurus are now
  considered juveniles of Lambeosaurus. It is the eponymous member of the
  subfamily Lambeosaurinae and tribe Lambeosaurini. Lambeosaurins, which also
  includes Corythosaurus and Hypacrosaurus from western North America, are
  understood to be some of the most specialized ornithopods.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
  - coastal
appearance:
  integument: scaled
  evidence: inferred
diagnostic_features:
  - Skull comparatively short with a high, narrow crest bearing a long, narrow
    posterior prolongation that overhangs the occiput, both crest and
    prolongation formed by the premaxillae and nasals
  - Highest point of the crest situated in front of the orbit, with the
    premaxillae extending to its extreme posterior tip
  - Narrow beak with open nares
  - Maxilla very short between the anterior jugal articulation and the
    infraorbital foramen, bearing 38-39 vertical tooth rows
  - Greatly reduced lacrimal and a relatively short quadrate
  - Mandible strongly decurved anteriorly, the dentary with 40-41 vertical tooth
    rows; teeth long and narrow with papillate margins
