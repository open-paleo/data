synonyms:
  - name: Tetragonosaurus
    type: junior subjective
    reason: T. praeceps and T. cranibrevis were first reassigned to Procheneosaurus
      and are now interpreted as juveniles of Lambeosaurus lambei.
  - name: Procheneosaurus
    type: junior subjective
    reason: Holds species P. praeceps and P. cranibrevis (originally
      Tetragonosaurus); both are now interpreted as juveniles of Lambeosaurus
      lambei.
  - name: Didanodon
    type: possible subjective
    reason: Possible junior subjective synonym of Lambeosaurus; identification is
      tentative. Per Olshevsky's Dinosaur Genera List.
  - name: Stephanosaurus
    type: possible subjective
    reason: Possible junior subjective synonym of Lambeosaurus; identification is
      tentative. Per Olshevsky's Dinosaur Genera List.
