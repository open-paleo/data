genus: Lepidus
parent: Neotheropoda
dispute:
  summary: >
    Lepidus praecisio is recovered deeply within Coelophysidae as sister to
    Coelophysis by some analyses (Ezcurra, 2017; Ezcurra and others, 2020)
    but as a basal neotheropod outside Coelophysoidea, among the successive
    sister taxa of Neotheropoda, by others (Nesbitt and Ezcurra, 2015;
    Martínez and others, 2025; Jones, 2026).
  history:
    - date: "2026-06-30"
      note: >
        Placed at Neotheropoda, the least-inclusive clade spanning both
        hypotheses.
pronunciation:
  ipa: /ˈlɛpɪdəs/
  phonetic: LEH-pee-doos
etymology: "Latin for 'fascinating' or 'charming'."
description: Lepidus is a genus of extinct theropod from the Upper Triassic of the
  United States. It lived in the Otis Chalk localities of the Dockum Group in
  Texas, from 231 to 223 million years ago.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Well-developed posterior pyramidal process on astragalus delimiting
    posterolateral tibial facet (autapomorphy)
  - Fused astragalus and calcaneum
  - Low anterior ascending process of astragalus
  - Mediolaterally compressed calcaneum
  - Proximodistally extended ridge on posteromedial tibia surface
  - Distinct scar on anterior distal tibia surface
appearance:
  integument: scaled
  evidence: inferred
