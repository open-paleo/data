genus: Leinkupal
parent: Diplodocinae
etymology: From Mapudungun 'lein' (vanishing) and 'kupal' (family); meaning 'vanishing family', in reference to it being the last known diplodocid
pronunciation:
  phonetic: leen-koo-pahl
description: Leinkupal is a genus of diplodocine sauropod known from the Early
  Cretaceous (Late Berriasian to Early Valanginian stage) of the Bajada Colorada
  Formation, southeastern Neuquén Basin in the Neuquén Province of Argentina. It
  contains a single species, Leinkupal laticauda.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - anterior caudal transverse process extremely developed (about equal or wider
    to centrum width) with lateroventral expansions reinforced by robust dorsal
    and ventral bars
  - very robust centroprezygapophyseal lamina in anterior caudal vertebra
  - paired pneumatic fossae located on the base of the postzygapophysis,
    opposite to the articular side, in anteriormost caudal vertebra
