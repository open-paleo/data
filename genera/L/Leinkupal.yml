genus: Leinkupal
parent: Diplodocinae
description: Leinkupal is a genus of diplodocine sauropod known from the Early
  Cretaceous (Late Berriasian to Early Valanginian stage) of the Bajada Colorada
  Formation, southeastern Neuquén Basin in the Neuquén Province of Argentina. It
  contains a single species, Leinkupal laticauda.
