notable_specimens:
  - specimen_id: [NHMUK PV RU A 100]
    institution: NHMUK
    species: Lycorhinus angustidens
    category: complementary
    significance: "Referred partial skull from Paballong, the holotype locality. Preserving premaxilla, maxilla, jugal, postorbital, frontal, nasal, and toothed mandible, it provides cranial anatomy absent in the jaw-only holotype. Sereno referred it to Lycorhinus angustidens in 2012."
    discovered:
