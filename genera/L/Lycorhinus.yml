genus: Lycorhinus
parent: Heterodontosaurinae
pronunciation:
  phonetic: LIEK-o-RIEN-us
etymology: From Ancient Greek 'lykos' (wolf) and 'rhinos' (nose); meaning 'wolf
  nose', referring to the shape of the snout or teeth
description: Lycorhinus is a genus of heterodontosaurid ornithischian dinosaur
  from the Early Jurassic (Hettangian to Sinemurian ages) strata of the Elliot
  Formation located in the Cape Province, South Africa.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - arid
diagnostic_features:
  - Long powerful canine with ridged and serrated anterior border, posterior
    border ridged but unserrated
  - Molars with cingulum halfway up crown on inner side; crowns laterally
    compressed and longer than broad above cingulum
  - "Molars from 4th onwards with two cusps: large anterior cusp occupying
    two-thirds of grinding surface and smaller lower posterior cusp"
  - Molars 2-4 with additional anterior cusp in advance of main anterior cusp
  - Inner face of molars with groove running between cusps-to-cingulum ridges
