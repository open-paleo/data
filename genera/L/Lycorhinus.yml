genus: Lycorhinus
parent: Heterodontosaurinae
pronunciation:
  phonetic: LIEK-o-RIEN-us
etymology: From Ancient Greek 'lykos' (wolf) and 'rhinos' (nose); meaning 'wolf
  nose', referring to the shape of the snout or teeth
description: Lycorhinus is a genus of heterodontosaurid ornithischian dinosaur
  from the Early Jurassic (Hettangian to Sinemurian ages) strata of the Elliot
  Formation located in the Cape Province, South Africa.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - arid
diagnostic_features:
  - Long powerful canine with ridged and serrated anterior border, posterior
    border ridged but unserrated
  - Molars with cingulum halfway up crown on inner side; crowns laterally
    compressed and longer than broad above cingulum
  - "Molars from 4th onwards with two cusps: large anterior cusp occupying
    two-thirds of grinding surface and smaller lower posterior cusp"
  - Molars 2-4 with additional anterior cusp in advance of main anterior cusp
  - Inner face of molars with groove running between cusps-to-cingulum ridges
appearance:
  features:
    - enlarged caniniform teeth
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "38727"
  - source: wikidata
    id: Q2018521
  - source: gbif
    id: "4572336"
synonyms:
  - name: Lanasaurus
    type: junior subjective
    reason: Additional material allowed direct comparison and demonstrated that
      Lanasaurus is referable to Lycorhinus.
species:
  - name: Lycorhinus angustidens
    etymology: "From Latin 'angustus' meaning 'narrow' and 'dens' meaning 'tooth',
      referring to the narrow teeth of the holotype jaw."
    status: valid
    type_species: true
    period:
      name:
        - Early Jurassic
      stage:
        - Hettangian
        - Sinemurian
      from_ma: 201.3
      to_ma: 192.9
    location:
      country: ZA
      locality: Buck Camp, Golden Gate Highlands NP
      region: Free State
      formation: Elliot
      coordinates:
        - -28.5
        - 28.616667
    type_specimen:
      specimen_id: [ SAM 3606 ]
      specimen_type: holotype
      institution: SAM
      material: Portion of left dentary with canine and 11 molars (7 preserved, 4
        impressions only).
      completeness: fragmentary
      notes: Owing to partial loss of the original material, the cast
        UCRC PVC10 has been used in subsequent taxonomic assessments.
    size:
