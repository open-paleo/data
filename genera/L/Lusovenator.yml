genus: Lusovenator
parent: Carcharodontosauria
etymology: The generic name Lusovenator is derived from Lusitania, the province
  of the Roman Empire that roughly matches present-day Portugal, affixed with
  the Latin venator, meaning "hunter". The specific epithet, santosi, refers to
  José Joaquim dos Santos, who discovered the remains.
description: Lusovenator is a genus of carcharodontosaurian theropod dinosaur
  from the Late Jurassic (Kimmeridgian) Praia de Amoreira Porto-Novo Member and
  the Late Jurassic-Early Cretaceous (Tithonian-Berriasian) Assenta Member of
  the Lourinhã Formation in present-day Portugal. It includes one species,
  Lusovenator santosi.
diet: carnivore
