genus: Lusovenator
parent: Carcharodontosauria
dispute:
  summary: >
    Lusovenator santosi, one of the oldest known carcharodontosaurians, is recovered
    as a basal member of Carcharodontosauria outside Carcharodontosauridae (Malafaia
    et al., 2020; Jones et al., 2026), or as a basal carcharodontosaurid close to
    Lajasvenator (Kellermann et al., 2025). It is placed at Carcharodontosauria
    incertae sedis.
  history:
    - date: "2026-07-01"
      note: Placed at Carcharodontosauria incertae sedis; membership in Carcharodontosauridae is unresolved.
pronunciation:
  phonetic: LOO-so-ven-AY-tor
etymology: "From Latin Luso- (Portuguese, referring to Lusitania/Portugal) combined with Latin venator (hunter); meaning \"Portuguese hunter\""
description: Lusovenator is a genus of carcharodontosaurian theropod dinosaur
  from the Late Jurassic (Kimmeridgian) Praia de Amoreira Porto-Novo Member and
  the Late Jurassic-Early Cretaceous (Tithonian-Berriasian) Assenta Member of
  the Lourinhã Formation in present-day Portugal. It includes one species,
  Lusovenator santosi.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - coastal
diagnostic_features:
  - Large recesses in neural arch of anterior dorsal vertebrae
  - Well-developed continuous longitudinal laminae from prezygapophysis tip to
    postzygapophysis distal end in mid-caudal vertebrae
  - Supraacetabular crest of ilium forming prominent ventrolaterally projecting
    shelf
  - Absence of ventral keel on anterior dorsal vertebrae
  - Hyposphene-hypantrum articulation in anterior caudal vertebrae
  - Lateral lamina projecting from posterior articular facet to caudal rib base
    in mid-caudal vertebrae
appearance:
  integument: scaled
  evidence: inferred
