genus: Liaoningosaurus
parent: Ankylosauridae
etymology: Liaoning lizard
description: Liaoningosaurus is an unusual genus of basal ankylosaurid dinosaur
  from the Liaoning Province, China that lived during the Early Cretaceous (late
  Barremian to early Aptian stages, ~125.4 to 118.9 Ma) in what is now the
  Yixian and Jiufotang Formation. The type and only species, Liaoningosaurus
  paradoxus, is known from more than 20 specimens, represented by juvenile
  individuals. It was named in 2001 by Xu, Wang and You.
diet: herbivore
locomotion: quadrupedal
