notable_specimens:
  - specimen_id: [XHPM-1206]
    institution: XHPM
    species: Liaoningosaurus paradoxus
    category: gut-contents
    significance: "Nearly complete skeleton from the Jianshangou Bed whose ribcage preserves fish, interpreted by Ji and colleagues as gut contents supporting a controversial carnivorous, semiaquatic interpretation. It shows five manual digits rather than four, unlike the holotype."
    references: [ji2016a]
  - specimen_id: [PMOL-AD00105]
    institution: PMOL
    species: Liaoningosaurus paradoxus
    category: range-extension
    significance: "Nearly complete, associated skeleton from the Jiufotang Formation, the only record of the genus from that formation. Its occurrence supports a wide paleogeographic and stratigraphic distribution for Liaoningosaurus in western Liaoning, extending the taxon beyond the underlying Yixian Formation."
    references: [zhou2022a]
  - specimen_id: [GPMA-12-045]
    institution: GPMA
    species: Liaoningosaurus paradoxus
    category: largest-individual
    significance: "The largest known specimen of Liaoningosaurus, with a total body length under 45 cm and a skull-sacral length of 21 cm. It establishes the upper end of the size range documented for the taxon, all of whose known individuals are small."
    references: [ji2016a]
