genus: Lufengosaurus
parent: Massospondylidae
pronunciation:
  phonetic: LOO-FUHNG-o-SAWR-us
etymology: "Named for Lufeng, a county in Yunnan Province, China where it was
  found, combined with Greek 'sauros' meaning 'lizard', hence 'Lufeng lizard'.
  The species name honors German paleontologist Friedrich von Huene."
description: Lufengosaurus is a genus of massospondylid dinosaur which lived
  during the Early Jurassic period in what is now southwestern China.
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diet: herbivore
diagnostic_features:
  - Distinct tuberosity on the lateral surface of the ascending process of the
    maxilla (absent in other prosauropods).
  - Low boss on the central portion of the jugal, at the junction of its three
    rami (maxillary, postorbital, and quadratojugal processes).
  - Prominent boss on the dorsal surface of the rostrolateral process of the
    parietal.
  - Ridge along the caudal part of the lateral surface of the maxilla, forming
    the dorsal boundary of a shallow buccal emargination.
appearance:
  integument: scaled
  evidence: inferred
