genus: Lufengosaurus
parent: Massospondylidae
pronunciation:
  phonetic: LOO-FUHNG-o-SAWR-us
etymology: "Named for Lufeng, a county in Yunnan Province, China where it was
  found, combined with Greek 'sauros' meaning 'lizard', hence 'Lufeng lizard'.
  The species name honors German paleontologist Friedrich von Huene."
description: Lufengosaurus is a genus of massospondylid dinosaur which lived
  during the Early Jurassic period in what is now southwestern China.
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diet: herbivore
diagnostic_features:
  - Teeth weakly spatulated with coarse serrations similar to Gypsaurus but much
    larger
  - Skull approximately 3-5 times the length of anterior tail vertebrae
  - Neck comparatively long
  - Belongs to Plateosauridae, similar to Plateosaurus grayianus but about
    one-fourth smaller
appearance:
  integument: scaled
  evidence: inferred
