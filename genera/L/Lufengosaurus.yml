    type: junior subjective
    reason: Now interpreted as juvenile material of Lufengosaurus.
  - name: Lufengocephalus
    type: junior subjective
    reason: Treated as a junior subjective synonym of Lufengosaurus in Olshevsky's
      Dinosaur Genera List.
