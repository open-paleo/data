genus: Lapampasaurus
parent: Hadrosauridae
etymology: Named after La Pampa Province of Argentina, where it was found, combined with Greek 'sauros' (lizard); meaning 'La Pampa lizard'
pronunciation:
  phonetic: la-PAM-puh-SOR-us
description: Lapampasaurus is an extinct genus of hadrosaurid known from the
  Late Cretaceous Allen Formation (late Campanian or early Maastrichtian stage)
  of La Pampa Province, Argentina. It contains a single species, Lapampasaurus
  cholinoi. The generic name refers to the Argentine province of La Pampa. The
  specific name honors the late collector José Cholino. The material includes
  cervical, dorsal, sacral and caudal vertebrae, the forelimb girdle, and the
  partial hindlimb.
dispute:
  summary: >
    Lapampasaurus cholinoi is known from very fragmentary remains, coded
    for only 11 of 365 characters by Alarcón-Muñoz and others (2023),
    who excluded it from their results; when included it falls within
    Saurolophinae near Kamuysaurus, but Jones (2026) treats it as an
    indeterminate hadrosaurid.
  history:
    - date: "2026-06-27"
      note: Placed at Hadrosauridae incertae sedis; tentative
        saurolophine affinity (Alarcón-Muñoz and others, 2023) too
        weakly supported to adopt.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
diagnostic_features:
  - Anterior cervical vertebrae with lateral foramina located on the dorsal face
    of diapophyses
  - Scapula with deltoid crest of sharp lateral edge and convex dorsal surface
  - Pedal ungual phalanx longer than wide with grooves and superficial foramina
  - Shallow longitudinal ventral elevation on pedal ungual phalanx
appearance:
  integument: scaled
  evidence: inferred
