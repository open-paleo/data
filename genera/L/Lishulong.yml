genus: Lishulong
parent: Sauropodiformes
etymology: "From Mandarin Chinese '栗樹' (lìshù) meaning 'chestnut tree', after the name of the type locality, combined with '龍' (lóng) meaning 'dragon', hence 'chestnut tree dragon'. Named for Wang Zheng-Ju in the species epithet."
description: Lishulong is a genus of sauropodiform dinosaur from the Early
  Jurassic (Sinemurian–Toarcian) Lufeng Formation of China. The type and only
  species is Lishulong wangi.
locomotion: facultative
