genus: Lophostropheus
parent: Coelophysoidea
dispute:
  summary: >
    Lophostropheus airelensis is recovered within Coelophysoidea as sister
    to Coelophysidae by its describers (Ezcurra and Cuny, 2007) but grouped
    with the stem-averostran dilophosaur grade by Jones (2026).
  history:
    - date: "2026-06-30"
      note: >
        Placed at Coelophysoidea following the dedicated systematic revision
        (P1).
etymology: "From Greek 'lophè' meaning 'crest' and 'stropheus' meaning 'pertaining to the vertebrae', giving the meaning 'crest vertebrae', referring to the prominent dorsal and ventral laminae on the cranial cervical vertebrae."
pronunciation:
  ipa: /ˌloʊfəˈstroʊfiːəs/
  phonetic: LOH-fuh-STROH-fee-uhs
description: Lophostropheus is an extinct genus of coelophysoid theropod
  dinosaur that lived approximately 205.6 to 196.5 million years ago during the
  boundary between the Late Triassic Period and the Early Jurassic Period, in
  what is now Normandy, France. Lophostropheus is one of the few dinosaurs that
  may have survived the Triassic-Jurassic extinction event.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - coastal
diagnostic_features:
  - Moderately convex cranial articular surface of cranial postaxial cervical
    vertebrae
  - Large and oval lateral fossa on last dorsal vertebral centrum
  - Dorsoventrally well-extended hyposphene in last dorsal vertebra
  - Incipient concavity on cranial articular surface of cranial caudal vertebrae
  - Constant length of caudal vertebrae along the tail
  - Vertical ridge above acetabular crest on ilium
appearance:
  integument: scaled
  evidence: inferred
