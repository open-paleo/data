genus: Liaoningvenator
parent: Jinfengopteryginae
dispute:
  summary: >
    Liaoningvenator was originally recovered by its describers in a clade with the
    anchiornithids (Shen et al., 2017), but is placed in Jinfengopteryginae by
    Sellés et al. (2021) and near the base of Troodontinae by Hartman et al.
    (2019). It is placed in Jinfengopteryginae following the most recent dedicated
    analysis.
  history:
    - date: "2026-07-01"
      note: Placed in Jinfengopteryginae following Sellés et al. (2021); anchiornithid-grade and near-Troodontinae alternatives noted.
etymology: Named after Liaoning Province, China combined with Latin venator
  (hunter); meaning "Liaoning hunter"
pronunciation:
  phonetic: lee-YOW-ning-VEN-uh-tuh
description: Liaoningvenator is a genus of troodontid theropod dinosaur from the
  Early Cretaceous of China. It contains a single species, L. curriei, named
  after paleontologist Phillip J. Currie in 2017 by Shen Cai-Zhi and colleagues
  from an articulated, nearly complete skeleton, one of the most complete
  troodontid specimens known. Shen and colleagues found indicative traits that
  placed Liaoningvenator within the Troodontidae. These traits included its
  numerous, small, and closely packed teeth, as well as the vertebrae towards
  the end of its tail having shallow grooves in place of neural spines on their
  top surfaces.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
  - forested
diagnostic_features:
  - Prominent slender triradiate postorbital
  - Deltopectoral crest distinctly extended to the half of the humeral shaft
appearance:
