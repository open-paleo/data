genus: Lophorhothon
parent: Hadrosauromorpha
pronunciation:
  phonetic: LOF-o-ROH-thon
etymology: "From Greek 'lophos' meaning 'crested' and 'rhothon' meaning 'nose', giving the meaning 'crested nose', referring to the nasal crest of the holotype."
description: Lophorhothon is a genus of hadrosauroid dinosaur from the Late
  Cretaceous of Alabama, and possibly Georgia and North Carolina. It was the
  first dinosaur genus discovered in Alabama, in the United States.
dispute:
  summary: >
    Lophorhothon atopus was originally described as a basal
    hadrosaurine, inside Hadrosauridae (Langston, 1960), but later
    analyses place it within Hadrosauromorpha just outside
    Hadrosauridae, among the closest non-hadrosaurid relatives of the
    family (Prieto-Márquez, 2021; Alarcón-Muñoz and others, 2023; Jones,
    2026).
  history:
    - date: "2026-06-27"
      note: Placed at Hadrosauromorpha; the historical
        inside-Hadrosauridae interpretation reflected, not adopted.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - marine
appearance:
  features:
    - orbital crest
  integument: scaled
  evidence: inferred
diagnostic_features:
  - Pyramidal nasal crest situated well forward of the orbits
  - Nasal crest bearing two shallow, roughly concentric lateral depressions
    opening forward toward the nares
  - Large, nearly diamond-shaped fronto-nasal fontanel bounded by the nasals in
    front and finger-like processes of the domed frontals behind
  - Frontals strongly domed above the orbits
  - Squamosals very widely separated medially, not meeting at the midline
identifiers:
  - source: pbdb
    id: "38764"
species:
  - name: Lophorhothon atopus
    etymology: "From Ancient Greek 'atopos' meaning 'uncommon' or 'strange', referring to the unusual features of this dinosaur."
    status: valid
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Santonian
        - Campanian
      from_ma: 85.7
      to_ma: 72.2
    location:
      country: US
      locality: Site 9, Moore Brothers' Farm
      region: Alabama
      formation: Mooreville Chalk
      coordinates:
        - 32.41888
        - -87.184708
    size:
      length_m:
        min: 4.5
        max: 4.5
    erected_in: langston1960a
    holotype:
      specimen_id: [FMNH P 27383]
      specimen_type: holotype
      institution: FMNH
      material: A disarticulated partial skull (nasals, frontals, lacrimals,
        maxilla, braincase) with 44 vertebrae, partial ischia, the left femur,
        and nearly complete lower legs and feet of a juvenile.
      completeness: partial
references:
  - id: langston1960a
  - id: paul2024a
    notes: Source of the appearance features.
  - id: prieto-márquez2021a
    notes: Placed Lophorhothon within Hadrosauromorpha outside Hadrosauridae.
  - id: alarcón-muñoz2023a
    notes: Recovered Lophorhothon among early-diverging hadrosauromorphs outside Hadrosauridae.
