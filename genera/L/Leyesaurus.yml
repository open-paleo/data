genus: Leyesaurus
parent: Massospondylidae
etymology: "Named for the Leyes family of Balde de Leyes, who discovered the holotype, combined with Greek 'sauros' meaning 'lizard'. The species name refers to the Marayes-El Carrizal Basin where the holotype was found."
description: Leyesaurus is an extinct genus of massospondylid sauropodomorph
  dinosaur known from the San Juan Province, northwestern Argentina.
locomotion: bipedal
paleoenvironment:
  - fluvial
diet: herbivore
diagnostic_features:
  - Sharply acute angle (50°) formed by ascending process of maxilla with
    alveolar margin
  - Straight ascending process of maxilla with longitudinal ridge on lateral
    surface
  - Noticeably bulging labial side of maxillary teeth
  - Greatly elongated cervical vertebrae with length/height ratio >5
  - Neural spines of cervical vertebrae with sinuous dorsal margin and short
    epipophyses
  - Shelf-like and medially deflected proximal articular surface of metatarsal
    III
  - Hook-shaped medial process on metatarsal III with deep ventral foramen
