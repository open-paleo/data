genus: Lametasaurus
parent: Abelisauridae
pronunciation:
  phonetic: luh-MAY-tuh-SOR-us
etymology: Named after the Lameta Formation of India where it was discovered, combined with Greek 'sauros' (lizard); meaning 'Lameta lizard'
description: Lametasaurus , is a chimeric genus of dinosaur known from the
  Lameta Formation of Jabalpur, India. The type species is L. indicus. The
  weight estimate of Lametasaurus, on the basis of the robust tibia, is 3,600 kg
  (7,900 lb), similar morphology can be seen in the tibia of Pycnonemosaurus,
  which indicates similar weight estimates.
diet: carnivore
locomotion: bipedal
