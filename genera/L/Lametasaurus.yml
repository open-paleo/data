references:
  - id: matley1924a
  - id: huene1933a
    notes: Names the Carnosaur bed and places it at the top of the greensand
      zone, immediately under the Main Limestone.
  - id: walker1964a
    notes: Assigns the endoskeletal elements of the type series to carnosaurs
      and restricts the name Lametasaurus to the scutes.
  - id: wilson2003a
    notes: Refers the ilia and sacrum described as Lametasaurus to Rajasaurus.
  - id: carrano2008a
    notes: Reads the sacrum, ilium and tibia as abelisaurid, the scutes as
      probably titanosaurian, and names Lametasaurus the senior of the likely
      synonyms Indosaurus and Rajasaurus.
  - id: novas2010b
    notes: Considers Lametasaurus indicus a nomen dubium, with Indosuchus
      raptorius and Indosaurus matleyi.
  - id: d'emic2009a
    notes: Records that Lametasaurus has been called a nomen dubium both as an
      ankylosaur and as a theropod, and identifies the club-shaped plate once
      referred to it as a titanosaur osteoderm.
