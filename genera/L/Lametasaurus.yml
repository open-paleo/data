genus: Lametasaurus
parent: Dinosauria
placement: incertae sedis
dispute:
  summary: >
    Matley's (1924) type series is a mixture. Walker (1964) assigns its
    pelvis and limb bones to carnosaurs and restricts the name Lametasaurus
    to the scutes, which Huene and Matley (1933) read as nodosaurian and
    Carrano and Sampson (2008) as probably titanosaurian. Later work reads
    the sacrum, ilia and tibia as abelisaurid: Wilson and colleagues (2003)
    refer them to Rajasaurus, and Carrano and Sampson (2008) consider
    Lametasaurus, Indosaurus and Rajasaurus the likeliest synonyms,
    Lametasaurus having priority. Novas and colleagues (2010) consider it a
    nomen dubium. With its elements read as ornithischian, sauropod and
    theropod, and the material lost, it is placed at Dinosauria incertae
    sedis.
pronunciation:
  phonetic: luh-MAY-tuh-SOR-us
etymology: Named after the Lameta Formation of India where it was discovered,
  combined with Greek 'sauros' (lizard); meaning 'Lameta lizard'
description: Lametasaurus is a chimeric genus of dinosaur from the Lameta
  Formation of Jabalpur, India. The type species is L. indicus, erected by
  Matley (1924) on an associated series of vertebrae, limb bones, and dermal
  armor that is now considered to represent more than one animal. The syntype
  material is lost, and the genus is generally treated as a nomen dubium.
paleoenvironment:
  - fluvial
appearance:
  integument: scaled
  evidence: inferred
