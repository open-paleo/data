genus: Linheraptor
parent: Velociraptorinae
etymology: Named for Linhe, a city in Inner Mongolia near the fossil discovery site, combined with Latin 'raptor' meaning 'thief' or 'plunderer'.
description: Linheraptor is a genus of dromaeosaurid dinosaur which lived in
  what is now China in the Late Cretaceous. It was named by Xu Xing and
  colleagues in 2010, and contains the species Linheraptor exquisitus. This
  bird-like dinosaur was less than 2 m (6.5 ft) long and was found in Inner
  Mongolia. It is known from a single, nearly complete skeleton.
diet: carnivore
locomotion: bipedal
