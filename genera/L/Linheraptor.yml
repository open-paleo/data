genus: Linheraptor
parent: Velociraptorinae
dispute:
  summary: >
    Linheraptor is consistently recovered as a velociraptorine, as the sister taxon
    of Tsaagan (Jasinski et al., 2020; Pei et al., 2020; Jones et al., 2026). Its
    validity has been questioned: Senter and colleagues argued it is a junior
    synonym of Tsaagan mangas, but this was rejected by later restudy (Xu et al.,
    2015). The velociraptorine placement is not in doubt; only the genus-level
    distinction from Tsaagan is contested.
  history:
    - date: "2026-07-01"
      note: Placed in Velociraptorinae (sister to Tsaagan); the proposed synonymy with Tsaagan is noted but rejected by recent restudy.
etymology: Named for Linhe, a city in Inner Mongolia near the fossil discovery site, combined with Latin 'raptor' meaning 'thief' or 'plunderer'.
pronunciation:
  phonetic: LIN-huh-RAP-tor
description: Linheraptor is a genus of dromaeosaurid dinosaur which lived in
  what is now China in the Late Cretaceous. It was named by Xu Xing and
  colleagues in 2010, and contains the species Linheraptor exquisitus. This
  bird-like dinosaur was less than 2 m (6.5 ft) long and was found in Inner
  Mongolia. It is known from a single, nearly complete skeleton.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - arid
diagnostic_features:
  - Greatly enlarged maxillary fenestra sub-equal in size to external naris
  - Several large foramina on lateral surface of jugal
  - Large anteriorly located maxillary fenestra extending to anterior border of
    antorbital fossa
  - Contact between jugal and squamosal that excludes postorbital from
    infratemporal fenestra
  - Pneumatic foramen present on axis vertebra
appearance:
  integument: feathered
  evidence: inferred
