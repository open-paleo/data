genus: Lourinhanosaurus
parent: Avetheropoda
placement: incertae sedis
dispute:
  summary: >
    The affinities of Lourinhanosaurus are highly uncertain. It has variously been
    referred to Allosauroidea (as a sinraptorid/metriacanthosaurid), to
    Megalosauroidea, and to Coelurosauria. Carrano et al. (2012) recovered it
    weakly allied with Coelurosauria, while Hartman et al. (2019) and Jones et al.
    (2026) place it near the base of Avetheropoda without resolving whether it is
    an allosauroid or a coelurosaur. It is placed conservatively at Avetheropoda
    incertae sedis, the least-inclusive clade common to the competing hypotheses.
  history:
    - date: "2026-07-01"
      note: Moved from Coelurosauria to Avetheropoda incertae sedis; allosauroid, megalosauroid, and coelurosaur hypotheses unresolved (Carrano et al., 2012; Hartman et al., 2019).
pronunciation:
  phonetic: loh-reen-YAH-no-SAWR-us
etymology: "Named for Lourinhã, the town in Portugal near where the fossils were
  found, combined with Greek 'sauros' meaning 'lizard', hence 'Lourinhã lizard'.
  The species name honors Portuguese paleontologist Miguel Telles Antunes."
description: Lourinhanosaurus was a genus of carnivorous theropod dinosaur that
  lived during the Late Jurassic Period (Kimmeridgian/Tithonian) in Portugal. It
  is one of many large predators discovered at the Lourinhã Formation and
  probably competed with coeval Torvosaurus gurneyi, Allosaurus europaeus, and
  Ceratosaurus.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - All vertebral centra longer than tall
  - Neural spines of anterior caudal vertebrae with well-developed spike-like
    anterior process
  - Pubic blade perforated by large vertical ellipsoidal foramen
  - Lesser trochanter well separated from main body of femur in lateral view
appearance:
  features:
    - snout hornlets
  integument: scaled
  evidence: direct
