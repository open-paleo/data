genus: Lourinhanosaurus
parent: Coelurosauria
etymology: Lourinhã lizard
description: Lourinhanosaurus was a genus of carnivorous theropod dinosaur that
  lived during the Late Jurassic Period (Kimmeridgian/Tithonian) in Portugal. It
  is one of many large predators discovered at the Lourinhã Formation and
  probably competed with coeval Torvosaurus gurneyi, Allosaurus europaeus, and
  Ceratosaurus.
