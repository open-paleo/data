genus: Liaoceratops
parent: Neoceratopsia
etymology: From 'Liaoning' (the Chinese province where it was discovered)
  combined with Greek 'keras' (horn) and 'ops' (face); meaning 'Liaoning horned
  face'
description: Liaoceratops, meaning "Liaoning horned face", is a ceratopsian
  dinosaur believed to be an early relative of the horned ceratopsids. It lived
  in the Early Cretaceous, 126 million years ago. It was discovered in China by
  a team of American and Chinese scientists. Liaoceratops was much smaller than
  its later relatives, but offers a glimpse into the early evolution of this
  group of dinosaurs.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
  - forested
diagnostic_features:
  - Sutures between premaxilla, maxilla, nasal and prefrontal intersecting at a
    common point high on the side of the snout
  - Several tubercles on the ventral margin of the angular
  - Foramen on the posterior face of the quadrate near the articulation with the
    quadratojugal
  - Small tubercle on the dorsal border of the foramen magnum
  - Thick posterior border of the parietal frill
