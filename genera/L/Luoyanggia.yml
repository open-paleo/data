genus: Luoyanggia
parent: Oviraptoridae
etymology: Named after Luoyang, a city in Henan Province, China, near the fossil
  locality; meaning "from Luoyang"
description: Luoyanggia is a genus of oviraptorid dinosaur known from the Early
  Cretaceous Haoling Formation of the Ruyang Basin in Henan Province, central
  China. The type species is L. liudianensis.
diet: omnivore
locomotion: bipedal
diagnostic_features:
  - Rostral part of mandible not downturned.
  - Mandibular symphysis V-shaped in dorsal view.
  - Both mandibular rami bent posterolaterally.
  - Shaft of ischium slightly concave caudally.
  - Pubic peduncle of ilium much deeper than ischial peduncle.
  - Anterior margin of ischial shaft sharply transferred to anterodorsal
    margin of obturator process.
paleoenvironment:
  - fluvial
  - lacustrine
