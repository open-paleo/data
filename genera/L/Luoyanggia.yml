genus: Luoyanggia
parent: Oviraptoridae
pronunciation:
  phonetic: lwo-YAHNG-jee-uh
etymology: Named after Luoyang, a city in Henan Province, China, near the fossil
  locality; meaning "from Luoyang"
description: Luoyanggia is a genus of oviraptorid dinosaur known from the Early
  Cretaceous Haoling Formation of the Ruyang Basin in Henan Province, central
  China. The type species is L. liudianensis.
diet: omnivore
locomotion: bipedal
diagnostic_features:
  - Rostral part of mandible not downturned.
  - Mandibular symphysis V-shaped in dorsal view.
  - Both mandibular rami bent posterolaterally.
  - Shaft of ischium slightly concave caudally.
  - Pubic peduncle of ilium much deeper than ischial peduncle.
  - Anterior margin of ischial shaft sharply transferred to anterodorsal
    margin of obturator process.
paleoenvironment:
  - fluvial
  - lacustrine
appearance:
  integument: feathered
  evidence: inferred
identifiers:
  - source: pbdb
    id: "172316"
  - source: wikidata
    id: Q579374
  - source: gbif
    id: "8442219"
  - source: eol
    id: "47458569"
synonyms:
  - name: Luoyangosaurus
    type: nomen nudum
    reason: Informal name; never met ICZN requirements for formal publication and is
      treated as referable to Luoyanggia. Per Olshevsky's Dinosaur Genera List.
species:
  - name: Luoyanggia liudianensis
    etymology: "Named for Liudian, a locality in Henan Province, China, near where
      the holotype was discovered."
    status: valid
    type_species: true
    period:
      name:
        - Early Cretaceous
      stage:
        - Aptian
        - Albian
    location:
      country: CN
      locality: Shijiagou Quarry, Liudian
      region: CN-HA
      formation: Haoling
    size:
      length_m:
        min: 1.2
        max: 1.5
      weight_kg:
        min: 2
        max: 9
    type_specimen:
      specimen_id: [ 41HIII-00010 ]
      specimen_type: holotype
      institution: HGM
      material: Partial mandible, partial right ilium, ischium, and nearly
        complete pubis, and right metatarsals.
      completeness: partial
    erected_in: lü2009b
