genus: Luoyanggia
parent: Oviraptoridae
etymology: Named after Luoyang, a city in Henan Province, China, near the fossil
  locality; meaning "from Luoyang"
description: Luoyanggia is a genus of oviraptorid dinosaur known from the Early
  Cretaceous Haoling Formation of the Ruyang Basin in Henan Province, central
  China. The type species is L. liudianensis. Holtz estimated it at 1.5 meters
  (4.9 ft) and around 2.27-9.1 kilograms (5.0-20.1 lb). Molina-Pérez and
  Larramendi gave a similar size of 1.2 meters (3.9 ft) and 8.5 kilograms (19
  lb).
diet: omnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
