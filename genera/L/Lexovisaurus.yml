    volume: "43"
    pages: 695-702
    notes: Original description of the type material as Omosaurus
      durobrivensis, the species that Hoffstetter (1957) later
      transferred to the new genus Lexovisaurus.
  - id: hoffstetter1956
    authors: Hoffstetter, R.; Brun, R.
    year: 1956
    title: Un Dinosaurien Stégosauridé dans le Callovien du
      Calvados
    journal: Comptes Rendus de l'Académie des Sciences
    volume: "243"
    pages: 1651-1653
    notes: Short note announcing French Callovian stegosaurine
      material from Calvados, Normandy, used by Hoffstetter
      the following year to erect Lexovisaurus.
  - id: hoffstetter1957
    authors: Hoffstetter, R.
    year: 1957
    title: Quelques observations sur les Stégosaurinés
    journal: Bulletin du Muséum National d'Histoire Naturelle,
      Paris, 2nde série
    volume: "29"
    pages: 537-547
    notes: Erects Lexovisaurus as a new genus with type species
      Lexovisaurus durobrivensis (Hulke, 1887), bringing together
      the English Fletton type material and French Normandy
      referred material.
  - id: maidment2008
    authors: Maidment, S. C. R.; Norman, D. B.; Barrett, P. M.; Upchurch, P.
    year: 2008
    title: "Systematics and phylogeny of Stegosauria (Dinosauria:
      Ornithischia)"
    journal: Journal of Systematic Palaeontology
    volume: "6"
    issue: "4"
    pages: 367-407
    doi: 10.1017/S1477201908002459
    url: http://dx.doi.org/10.1017/S1477201908002459
    notes: Declares L. durobrivensis a nomen dubium after
      refuting Galton's proposed autapomorphies, and erects the
      new genus Loricatosaurus priscus for BMNH R3167
      (previously referred to Lexovisaurus).
  - id: paul2024a
    authors: Paul, G. S.
    year: 2024
    title: "The Princeton Field Guide to Dinosaurs (3rd ed.)"
    publisher: Princeton University Press
