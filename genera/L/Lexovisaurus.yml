genus: Lexovisaurus
parent: Stegosauria
placement: incertae sedis
etymology: From the Lexovii (a Gallic people who inhabited the
  region of present-day Lisieux in Normandy, where Hoffstetter's
  French stegosaurine specimens were found) and Greek 'sauros'
  (lizard).
pronunciation:
  phonetic: lek-SOH-vi-SOR-us
description: >
  Lexovisaurus is a genus of stegosaurian dinosaur known from
  limb bones and armor fragments from Middle to Late
  Jurassic-aged strata of Europe.
dispute:
  summary: >
    Lexovisaurus is a nomen dubium; its holotype preserves no diagnostic
    features and referred material was reassigned to Loricatosaurus (Maidment et
    al., 2008). It is retained at Stegosauria incertae sedis.
  history:
    - date: "2026-06-26"
      note: Placed at Stegosauria incertae sedis, nomen dubium with diagnostic material referred to Loricatosaurus.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - lacustrine
  - fluvial
appearance:
  features:
    - shoulder spikes
    - dermal plates
    - dorsal spines
  integument: armored
diagnostic_features:
  - Dermic armor comprises plates of varied type on the vertebral column, keeled
    spines, conical spines, and a pair of parasacral spines furnished with a
    large basal plate
  - Ilium antero-posterior extension clearly shorter than the length of the
    femur (unlike Kentrurosaurus where it is equal to or greater)
  - Femur bears a postero-internal crest (longitudinal ridge on postero-internal
    face above midshaft) interpreted as a 4th trochanter
  - Humerus remarkably sturdy and proximally broadened, reaching only
    approximately 3/5 the length of the femur (femur/humerus ratio ~1.71)
  - Sacrum with 4 pairs of sacral ribs; dorsal vertebrae with very elevated
    transverse processes
identifiers:
  - source: pbdb
    id: "38812"
  - source: wikidata
    id: Q133863
  - source: gbif
    id: "4823119"
synonyms:
  - name: Omosaurus durobrivensis
    type: reassigned
    reason: Original combination established by Hulke (1887) for
      BMNH R1989-R1992 from the Lower Oxford Clay of Fletton.
      Omosaurus Owen, 1875 was later found to be preoccupied (by
      Omosaurus Leidy, 1856) and the species was first moved to
      the genus Dacentrurus Lucas (1902) by Hennig (1915) and
      then to the new genus Lexovisaurus by Hoffstetter
      (1957).
  - name: Stegosaurus priscus
    type: junior subjective
    reason: Nopcsa (1911) erected Stegosaurus priscus for
      BMNH R3167 (a partial skeleton from the Callovian of
      Cambridgeshire). Hoffstetter (1957) regarded it as a
      junior synonym of Lexovisaurus durobrivensis. Maidment
      et al. (2008) later removed BMNH R3167 from Lexovisaurus
      and made it the holotype of a separate new genus,
      Loricatosaurus priscus.
species:
  - name: Lexovisaurus durobrivensis
    etymology: From Durobrivae (the Roman name for the area
      around Water Newton near Peterborough), referring to the
      provenance of the type material from the Lower Oxford
      Clay of nearby Fletton.
    status: nomen dubium
    type_species: true
    period:
      name:
        - Middle Jurassic
      stage:
        - Callovian
      from_ma: 166.1
      to_ma: 163.5
    location:
      country: GB
      region: GB-PTE
      formation: Oxford Clay
    type_specimen:
      specimen_id:
        - BMNH R1989
        - BMNH R1990
        - BMNH R1991
        - BMNH R1992
      specimen_type: holotype
      institution: NHMUK
      material: Partial sacrum, partial right ilium, left femur, partial metatarsal, and
        phalanx. Maidment et al. (2008) concluded that this material bears no unique
        characters and treated the species as a nomen dubium.
      completeness: fragmentary
    size:
      length_m:
        min: 6
        max: 6
      weight_kg:
        min: 2500
        max: 2500
    erected_in: hoffstetter1957a
references:
  - id: hulke1887a
    notes: Original description of the type material as Omosaurus durobrivensis,
      the species that Hoffstetter (1957) later transferred to the new genus
      Lexovisaurus.
  - id: hoffstetter1956a
    notes: Short note announcing French Callovian stegosaurine material from
      Calvados, Normandy, used by Hoffstetter the following year to erect
      Lexovisaurus.
  - id: hoffstetter1957a
    notes: Erects Lexovisaurus as a new genus with type species Lexovisaurus
      durobrivensis (Hulke, 1887), bringing together the English Fletton type
      material and French Normandy referred material.
  - id: maidment2008a
    notes: Declares L. durobrivensis a nomen dubium after refuting Galton's
      proposed autapomorphies, and erects the new genus Loricatosaurus priscus
      for BMNH R3167 (previously referred to Lexovisaurus).
  - id: paul2024a
    notes: Source of the body length and mass estimates, and the appearance
      features.
  - id: owen1875a
    notes: Named Omosaurus, the preoccupied genus later replaced for Lexovisaurus material.
  - id: nopcsa1911a
    notes: Erected Stegosaurus priscus, later associated with Lexovisaurus.
  - id: leidy1856c
    notes: Named the reptile Omosaurus, the senior homonym that preoccupies the dinosaur Omosaurus of Owen.
  - id: lucas1902a
    notes: Erected the replacement genus Dacentrurus for the preoccupied Omosaurus of Owen.
  - id: hennig1915b
    notes: Moved most remaining Omosaurus species, including durobrivensis, into Dacentrurus.
