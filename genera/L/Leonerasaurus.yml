references:
  - id: pol2011b
  - id: jones2026b
    notes: Source of the hip height estimate.
  - id: mcphee2015b
    notes: Recovers Leonerasaurus near the base of Sauropoda, more derived
      than earlier analyses, and attributes this to missing data.
  - id: otero2015a
    notes: Recovers Leonerasaurus in a polytomy with Sefapanosaurus, Aardonyx
      and more derived sauropodomorphs.
  - id: rauhut2020a
    notes: Finds Leonerasaurus and Sefapanosaurus taking several equally
      parsimonious positions at the base of Sauropodiformes.
