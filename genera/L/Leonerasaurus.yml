genus: Leonerasaurus
parent: Sauropodiformes
placement: incertae sedis
etymology: "Named after the Las Leoneras Formation in Argentina, where the fossil was found; meaning \"Las Leoneras lizard\""
pronunciation:
  phonetic: lee-o-neh-ra-sor-us
description: Leonerasaurus is a basal genus of sauropodomorph dinosaur.
  Currently, there is only one species known, named L. taquetrensis by Diego
  Pol, Alberto Garrido and Ignacio A. Cerda in 2011. The fossil, an incomplete
  subadult individual, was found in the Las Leoneras Formation in Argentina.
  This formation is probably Early Jurassic in age. Leonerasaurus was a small
  non-sauropod sauropodomorph, showing an unusual combination of basal and
  derived characters. This indicates that the evolution of early sauropodomorphs
  witnessed a great degree of convergent evolution.
dispute:
  summary: >
    Pol and colleagues (2011) describe Leonerasaurus taquetrensis as a small
    sauropodomorph with a sauropod-like four-vertebra sacrum, and recover it
    as the sister of Melanorosaurus plus Sauropoda. Later analyses move it
    within Sauropodiformes: McPhee and colleagues (2015) find it near the
    base of Sauropoda, which they attribute to missing data, while Otero and
    colleagues (2015) and Rauhut and colleagues (2020) recover it in
    unresolved positions at the base of the clade. It is placed at
    Sauropodiformes incertae sedis.
  history:
    - date: "2026-06-29"
      note: Placed at Sauropodiformes incertae sedis; position inconsistent between analyses.
    - date: "2026-10-16"
      note: >
        Summary rewritten with its sources; no analysis read places it
        among basal massopodans.
locomotion: facultative
paleoenvironment:
  - lacustrine
diet: herbivore
diagnostic_features:
  - Anterior teeth with low, spoon-shaped crowns
  - Dorsosacral rib attached to preacetabular process of ilium
  - Neural arches of primordial sacrals positioned on anterior half of centrum
  - Caudosacral rib directed anterolaterally
  - Humeral deltopectoral crest low and medially deflected along distal half
  - Flattened ischial shafts
appearance:
  integument: scaled
  evidence: inferred
