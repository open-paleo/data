genus: Leptoceratops
parent: Leptoceratopsidae
pronunciation:
  phonetic: LEP-to-SER-a-tops
etymology: From Greek 'leptos' (small or slender), 'keras' (horn), and 'ops'
  (face); meaning 'small horn face'
description: Leptoceratops is a genus of ceratopsian dinosaur from the Late
  Cretaceous of North America. First found in Alberta in 1910, the type species
  Leptoceratops gracilis was named in 1914 by Barnum Brown for a partial skull
  and skeleton of two individuals found in the Scollard Formation of Alberta.
  Additional specimens found in the Scollard include one complete and two mostly
  complete skeletons together, uncovered in 1947 by Charles M. Sternberg.
  Specimens from Montana that were among the earliest referred to Leptoceratops
  have since been moved to their own genera Montanoceratops and Cerasinops,
  while new specimens of L. gracilis include bonebed remains from the Hell Creek
  Formation of Montana and a partial skeleton from the Lance Formation of
  Wyoming. Together with related taxa, Leptoceratops is the eponymous genus of
  the family Leptoceratopsidae. Leptoceratops is known from more than ten
  individuals, all from Maastrichtian deposits of Alberta, Montana and Wyoming,
  representing the entire skeleton.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Skull short and deep, without nasal horn; crest with high thin sagittal
    ridge and smooth posterior border
  - Teeth single-rooted in both maxillary and dentary (bifid roots in all other
    known ceratopsians)
  - Predentary relatively longer and comparatively heavier than in any described
    ceratopsian genus
  - Caudal vertebrae with extremely high slender spines, proportionately higher
    than in any described Ceratopsian, and long chevrons
  - Manus with digits I, II, and III terminating in narrow pointed hoofs;
    carpals fully ossified with large ulnare and radiale
  - Femur shaft practically straight and round in cross-section; fourth
    trochanter comparatively larger than in any described Ceratopsian
