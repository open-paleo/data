genus: Laiyangosaurus
parent: Saurolophinae
etymology: "Named for Laiyang, a city in Shandong Province, China where it was found, combined with Greek 'sauros' meaning 'lizard', hence 'Laiyang lizard'."
description: Laiyangosaurus is a genus of saurolophine hadrosaurid from the Late
  Cretaceous Jingangkou Formation of China. It is known from one species, L.
  youngi, found in the Laiyang Basin within the province of Shandong.
diet: herbivore
