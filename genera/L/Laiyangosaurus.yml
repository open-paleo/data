genus: Laiyangosaurus
parent: Saurolophinae
etymology: "Named for Laiyang, a city in Shandong Province, China where it was found, combined with Greek 'sauros' meaning 'lizard', hence 'Laiyang lizard'."
description: Laiyangosaurus is a genus of saurolophine hadrosaurid from the Late
  Cretaceous Jingangkou Formation of China. It is known from one species, L.
  youngi, found in the Laiyang Basin within the province of Shandong.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
diagnostic_features:
  - Prominent and narrow ridge on lateral side of nasal forming posterodorsal
    and posterior margin of circumnasal depression
  - Primary ridge in maxillary teeth slightly deflected posteriorly
  - Retroarticular process of surangular dorsolateroposteriorly recurved
  - Orbital margin wider than infratemporal margin of jugal
  - Dorsal margin of nasal is flat
  - Absence of supracranial crest
  - Relatively shallow and rostrodorsally directed caudal margin of lacrimal
    process of jugal
  - One or more foramina present on rostral surface of premaxilla
