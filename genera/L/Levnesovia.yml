genus: Levnesovia
parent: Hadrosauroidea
etymology: Named in honor of the late Russian paleontologist Lev Nessov; the suffix '-ia' is a standard Latinized honorific formation
pronunciation:
  phonetic: lev-neh-SO-vee-uh
description: Levnesovia is a genus of hadrosauroid dinosaur from the Late
  Cretaceous (Turonian) Bissekty Formation of Uzbekistan. It was related to
  Bactrosaurus. The type species is L. transoxiana. The genus name honors the
  late Russian paleontologist Lev Nessov, and the specific name refers to the
  ancient region Transoxiana. It is known from partial skulls, maxillae,
  dentaries and numerous bones of the postcranial skeleton.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Tall sagittal crest on parietals, low anteriorly but tall posteriorly with
    prominent sinusoidal groove
  - Absence of lacrimal process on prefrontal
  - Absence of club-shaped neural spines on dorsal vertebrae in adults
  - Dentary tooth row bows lingually in dorsal view and terminates only slightly
    behind apex of coronoid process
  - Predentary gracile and shovel-shaped with gently rounded anterior margin
  - Coronoid process nearly vertical with distinct coronoid facet on medial
    aspect
