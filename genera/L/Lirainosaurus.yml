genus: Lirainosaurus
parent: Lirainosaurinae
pronunciation:
  phonetic: lee-RIEN-o-SAWR-us
etymology: From Basque lirain (slender) combined with Greek sauros (lizard);
  meaning "slender lizard"
description: Lirainosaurus is a genus of titanosaur sauropod which lived in what
  is now Spain. The type species, Lirainosaurus astibiae, was described by Sanz,
  Powell, Le Loeuff, Martinez, and Pereda-Suberbiola in 1999. It was a
  relatively small sauropod, measuring 4 meters (13 ft) long, possibly up to 6
  meters (20 ft) long for the largest individuals, and weighed about 2-4 metric
  tons (2.2-4.4 short tons).
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - coastal
  - fluvial
  - marine
  - wetland
diagnostic_features:
  - Restricted articular condyle in posterior caudal vertebrae
  - Sagittal condylar groove in posterior articular surface of distal caudal
    vertebrae
  - Lamina in interzygapophysial fossa in anterior caudal vertebrae
  - Spinopostzygapophysial structure not posteriorly projected in posterior
    caudal vertebrae
  - Lateroanterior process on sternal plate
  - Ridge in ventral margin of medial side of scapular blade
