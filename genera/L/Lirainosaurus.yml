genus: Lirainosaurus
parent: Lirainosaurinae
etymology: slender lizard
description: Lirainosaurus is a genus of titanosaur sauropod which lived in what
  is now Spain. The type species, Lirainosaurus astibiae, was described by Sanz,
  Powell, Le Loeuff, Martinez, and Pereda-Suberbiola in 1999. It was a
  relatively small sauropod, measuring 4 metres (13 ft) long, possibly up to 6
  metres (20 ft) long for the largest individuals, and weighed about 2–4 metric
  tons (2.2–4.4 short tons).
diet: herbivore
locomotion: quadrupedal
