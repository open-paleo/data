genus: Lanzhousaurus
parent: Styracosterna
pronunciation:
  phonetic: lan-JOH-SAWR-us
etymology: "Named for Lanzhou, the capital of Gansu Province, China, combined
  with Greek 'sauros' meaning 'lizard', hence 'Lanzhou lizard'."
description: Lanzhousaurus is a genus of ornithopod dinosaur that lived in the
  Gansu region of what is now China during the Early Cretaceous (Barremian).
  Described by You, Ji, and Li in 2005, the type and only species is
  Lanzhousaurus magnidens, known from a partial skeleton recovered from the
  Hekou Group. It has been estimated to be about 10 meters (33 ft) in length and
  6 metric tons (6.6 short tons) in weight.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Large individual teeth (~4 cm wide) with small tooth count per tooth row (14
    in dentary)
  - Dentary teeth diamond-shaped with multiple weak ridges on lingual surface
  - Maxillary teeth narrow, lozenge-shaped with one prominent primary ridge
    flanked by weak secondary ridges
  - Marginal denticles present as mammillations on both mesial and distal edges
    of teeth
  - Enamel present on both lingual and labial sides of teeth (weak interlocking)
  - Hatchet-shaped sternal plates with relatively long blade (>50% of total
    length)
