genus: Laplatasaurus
parent: Titanosauria
pronunciation:
  phonetic: lah-PLAHT-a-SAWR-us
etymology: "Named for La Plata, Argentina, combined with Greek 'sauros' meaning
  'lizard', hence 'La Plata lizard'. The species name refers to the Araucanos
  (Mapuche) people."
description: Laplatasaurus is a genus of titanosaurian sauropod dinosaur that
  lived during the Late Cretaceous in South America, with the holotype and only
  known specimen found in the Anacleto Formation.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Caudal vertebrae with narrow flattening and shallow groove on lower face of
    body instead of prominent separated haemal facets as in Titanosaurus
  - Caudal vertebrae with high and pointed articular cones posteriorly, with
    very little wedge-shaped tapering of the vertebral body downward
  - Very long and slender prezygapophyses extending notably anteriorly past the
    preceding vertebra
  - Humerus markedly more slender than in Titanosaurus and Argyrosaurus, with a
    distinctly elevated bent lateral process forming a corner above it
  - Fibula with enormous double muscular insertion (peroneal muscle in two
    distinct tumescences) in upper third of external side, unlike Titanosaurus
    (one) or Antarctosaurus (two shallower ridges)
  - Scapula with anterior longitudinal edge forming a single homogeneous concave
    arc, not composed of two opposing curves as in Titanosaurus
appearance:
  integument: armored
  evidence: direct
identifiers:
  - source: pbdb
    id: "38690"
  - source: wikidata
    id: Q135594
  - source: gbif
    id: "4822778"
  - source: eol
    id: "4531328"
species:
  - name: Laplatasaurus araukanicus
    etymology: "Named for the Araucanos (Mapuche), the indigenous people of
      Patagonia and central Chile, in whose traditional territory the type
      material was found."
    status: valid
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Campanian
    location:
      country: AR
      locality: Cinco Saltos
      region: AR-R
      formation: Anacleto
      notes: Which unit the lectotype came from is unresolved. Bonaparte and
        Gasparini (1979), who designated it, and Powell (1986) place it in
        the Allen Formation. Gallina and Otero (2015) put it at the top of
        the Anacleto Formation and mark that reading as contrary to both,
        but reach it by correlating Huene's unspecific 'bed d' to a
        section measured for Neuquensaurus rather than by new work on the
        lectotype.
    size:
      weight_kg:
        min: 11000
        max: 11000
      hip_height_m:
        min: 1.8
        max: 1.8
      length_m:
        min: 18.0
        max: 18.0
    synonyms:
      - name: Titanosaurus araukanicus
        type: reassigned
        reason: Originally described as Titanosaurus araukanicus; the genus name was
          preoccupied, and the species was reassigned to Laplatasaurus.
    type_specimen:
      specimen_id: [ MLP 26-306 ]
      specimen_type: lectotype
      institution: MLP
      material: A right tibia and a right fibula of the same individual.
      completeness: fragmentary
    erected_in: huene1929a
references:
  - id: huene1927c
    notes: In German. First paper in which the genus name Laplatasaurus appears.
  - id: huene1929a
    notes: In Spanish. First formal description of Laplatasaurus.
  - id: bonaparte1979c
    notes: In Spanish. Designated MLP 26-306 (a right tibia and right fibula) as
      the lectotype of Laplatasaurus araukanicus; source of the holotype
      material.
  - id: powell1986a
    notes: Places the lectotype in the Allen Formation.
  - id: gallina2015a
    notes: Reassessment of the taxon. Places the lectotype at the top of the
      Anacleto Formation, and gives its site as the INDUPA quarry, about 3 km
      west of Cinco Saltos.
  - id: paul2024a
    notes: Source of the mass estimate.
  - id: jones2026b
    notes: Source of the hip height estimate.
