genus: Liubangosaurus
parent: Somphospondyli
etymology: Named after Liubang village, the holotype locality in Guangxi
  Province, China; meaning "Liubang lizard"
description: Liubangosaurus is a genus of sauropod dinosaur that lived during
  the Early Cretaceous in what is now China. Liubangosaurus is known from the
  holotype NHMG 8152, five complete and articulated middle-caudal dorsal
  vertebrae that were collected from the Xinlong Formation in Fusui County,
  Guangxi Province. The type species is L. hei, which honors He Wenjian, who
  discovered the site where Liubangosaurus was discovered.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Prezygapophysis closely contacts with parapophysis, with the prdl and prpl
    absent.
  - Cavity present on the dorsal surface of the diapophysis.
  - Neural spine very low, with its distal end level with that of the
    diapophysis.
  - Distal end of the neural spine strongly expanded laterally to form a
    platform.
  - Vertically directed infradiapophyseal lamina expands or bifurcates ventrally
    to form an inverted 'Y'.
  - Highly positioned parapophyses large and tear-drop in shape.
