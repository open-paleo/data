genus: Laevisuchus
parent: Noasauridae
pronunciation:
  ipa: /ˌlɛvɪˈsjuːkəs/
etymology: "From Latin 'laevis' (light or smooth) and Greek 'Soukhos' (the
  ancient Egyptian crocodile god); meaning 'light crocodile'"
description: Laevisuchus is a genus of theropod dinosaur from the Late
  Cretaceous. Its remains were discovered by Charles Alfred Matley near Jabalpur
  in Maastrichtian "Carnosaur Bed" deposits in the Lameta Formation in Madhya
  Pradesh, central India, and were named and described by paleontologists
  Friedrich von Huene and Matley in 1933.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Cervical centrum with three pleurocoela on each side
  - Neural arch greatly expanded laterally, much broader than in related forms
  - Prezygapophyseal facets converge downward at approximately 110 degrees;
    lateral margins of prezygapophyses stand 42 mm apart
  - Diapophysis descends steeply below the prezygapophysis and is supported by
    two narrow buttresses flanking a large recess
  - Neural spine reduced to a low four-sided pyramid only ~10 mm above center of
    vertebra
  - Postzygapophyses elevated 16 mm above centrum, surmounted by a small
    horn-shaped projection; long bony plates connecting zygapophysis pairs
    converge to form a saddle
