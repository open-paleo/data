genus: Laevisuchus
parent: Noasauridae
pronunciation:
  ipa: /ˌlɛvɪˈsjuːkəs/
etymology: "From Latin 'laevis' (light or smooth) and Greek 'Soukhos' (the ancient Egyptian crocodile god); meaning 'light crocodile'"
description: Laevisuchus is a genus of theropod dinosaur from the Late
  Cretaceous. Its remains were discovered by Charles Alfred Matley near Jabalpur
  in Maastrichtian "Carnosaur Bed" deposits in the Lameta Formation in Madhya
  Pradesh, central India, and were named and described by paleontologists
  Friedrich von Huene and Matley in 1933.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
