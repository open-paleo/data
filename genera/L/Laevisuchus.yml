    id: Q1850654
  - source: gbif
    id: "4822725"
synonyms:
  - name: Jubbulpuria
    type: junior subjective
    reason: Material previously assigned to Jubbulpuria tenuis is now attributed to
      Laevisuchus, with apparent differences explained by serial position within
      the vertebral column.
