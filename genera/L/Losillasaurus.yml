genus: Losillasaurus
parent: Turiasauria
pronunciation:
  phonetic: loh-SIL-yah-SAWR-us
etymology: Named after Losilla, the village near the fossil locality in Valencia, Spain; meaning "Losilla lizard"
description: "Losillasaurus is a genus of turiasaurian sauropod dinosaur from
  the Late Jurassic and possibly Early Cretaceous (Kimmeridgian-?Berriasian) of
  southeastern Spain. The type species, Losillasaurus giganteus, was discovered
  in the Villar del Arzobispo Formation in Valencia, and formally described by
  Casanovas, Santafé, and Sanz in 2001. The holotype material is from a subadult
  and includes part of a skull; complete cervical, dorsal, sacral, and caudal
  vertebrae as well as several fragments; skeletal elements from the limbs
  including a humerus, ulna, radius, and metacarpal; sternal plates; and from
  the pelvis: the ilium, ischium, and pubis. The genus is characterized by the
  dimension and shape of the neural spine of the proximal caudal vertebrae. The
  humerus is 143 centimetres (56 in) long, which despite being from a subadult
  specimen is within 20% of the size of Paralititan. The size estimation
  proposed by Francisco Gascó in his master thesis is 15–18 m (49–59 ft) in
  length and 12–15 t (13–17 short tons) in body mass."
diet: herbivore
locomotion: quadrupedal
