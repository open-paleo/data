genus: Losillasaurus
parent: Turiasauria
pronunciation:
  phonetic: loh-SIL-yah-SAWR-us
etymology: Named after Losilla, the village near the fossil locality in
  Valencia, Spain; meaning "Losilla lizard"
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - coastal
diagnostic_features:
  - Neural spines of proximal caudal vertebrae arched dorsocaudally in lateral
    view (cutlass shaped)
  - Ratio of craniocaudal dimension of neural spine base to total height
    approximately 0.50
  - Middle and caudal dorsal vertebral centra opisthocoelous
  - Ventral median keels on cervical centra reduced or absent
  - Pleurocoels present in dorsal vertebral centra
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "57684"
  - source: wikidata
    id: Q210348
  - source: gbif
    id: "4818072"
species:
  - name: Losillasaurus giganteus
    etymology: "From Latin 'giganteus' meaning 'gigantic', referring to the large
      size of this sauropod, whose humerus alone measures 143 centimeters."
    pronunciation:
      phonetic: jye-GAN-tee-us
    status: valid
    type_species: true
    period:
      name:
        - Late Jurassic
      stage:
        - Kimmeridgian
        - Tithonian
    location:
      country: ES
      locality: La Cañada
      region: ES-V
      formation: Villar del Arzobispo
    size:
      hip_height_m:
        min: 5
        max: 5
      length_m:
        min: 15.0
        max: 18.0
      weight_kg:
        min: 12000
        max: 15000
    type_specimen:
      specimen_id: [ Lo-5 ]
      specimen_type: holotype
      institution: MCNV
      material: Procoelous proximal caudal vertebral centrum; length/height ratio >0.5
        < 0.6; neural spine transversely compressed and cutlass shaped; caudal ribs
        wing shaped (specimen Lo-5)
      completeness: fragmentary
    erected_in: casanovas2001a
