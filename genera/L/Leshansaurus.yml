genus: Leshansaurus
parent: Afrovenatorinae
pronunciation:
  phonetic: luh-SHAHN-SAWR-us
etymology: Named after Leshan, the city in Sichuan Province, China, near where
  fossils were found, combined with Greek 'sauros' (lizard); meaning 'Leshan
  lizard'
description: Leshansaurus is a genus of theropod dinosaur from the Middle
  Jurassic Shaximiao Formation of what is now China. It was described in 2009 by
  a team of Chinese paleontologists. The type species is Leshansaurus
  qianweiensis. Fossils of Leshansaurus were discovered in strata from the
  Shangshaximiao Formation, a formation rich in dinosaur fossils. Li et al.
  referred this taxon to Sinraptoridae - a group of carnosaurian theropods, but
  it may belong to Megalosauridae instead.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Supraoccipital with prominent, sharp-peaked median ridge in dorsal view
  - Frontal ratio of maximum length to width 2.4 (unusually elongate)
  - Basipterygoid processes of basisphenoid slender
  - Atlas intercentrum horseshoe-shaped, with bifid neural spine
  - Dorsal vertebral centra horseshoe-shaped in cross-section
  - Dorsal and sacral neural spines extremely thin (3–5 mm thick)
  - Transverse processes of dorsal vertebrae relatively long and slender
  - Sacral vertebrae with distinct ventral keels
  - Ilium with conspicuous ridge along medial margin of acetabular edge
  - Tibia and femur nearly equal in length (ratio ~1.0)
  - Metatarsal II approximately equal in length to metatarsal IV
appearance:
  integument: scaled
  evidence: inferred
