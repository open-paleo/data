genus: Leshansaurus
parent: Afrovenatorinae
etymology: Named after Leshan, the city in Sichuan Province, China, near where fossils were found, combined with Greek 'sauros' (lizard); meaning 'Leshan lizard'
description: Leshansaurus is a genus of theropod dinosaur from the Middle Jurassic
  Shaximiao Formation of what is now China. It was described in 2009 by a team
  of Chinese paleontologists. The type species is Leshansaurus qianweiensis.
  Fossils of Leshansaurus were discovered in strata from the Shangshaximiao
  Formation, a formation rich in dinosaur fossils. Li et al. referred this taxon
  to Sinraptoridae – a group of carnosaurian theropods, but it may belong to
  Megalosauridae instead.
diet: carnivore
locomotion: bipedal
