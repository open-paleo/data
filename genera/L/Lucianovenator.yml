genus: Lucianovenator
parent: Coelophysidae
etymology: Named for Don Luciano Leyes, who first reported the fossil remains, combined with Latin 'venator' meaning 'hunter'.
pronunciation:
  phonetic: loo-chee-AH-no-VEN-uh-tuh
description: Lucianovenator is an extinct genus of coelophysid theropod dinosaur
  which lived in Argentina during the Triassic. The genus name Lucianovenator
  translates to "Luciano's hunter", in reference to Don Luciano Leyes, who first
  reported the remains. The species name bonoi refers to Tulio del Bono, a local
  scientific authority who collaborated on the describers' research. It is one
  of the few neotheropods known from South America.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - "Cervical neural arches with three deep fossae: two blind pockets in
    prezygapophyseal centrodiapophyseal fossa and a third communicating with
    internal neural cavity in centropostzygapophyseal fossa"
  - Anteroposteriorly elongated fossa on posterior centrodiapophyseal lamina
    edge progressively deepening and enlarging from C3 to C9
  - Length of anterior cervical ribs equivalent to five cervical centra
  - Cervical vertebrae extremely elongated (>3× longer than posterior articular
    surface height)
  - Deeply concave posterior articular face of cervical centra
