genus: Lucianovenator
parent: Coelophysidae
etymology: Named for Don Luciano Leyes, who first reported the fossil remains, combined with Latin 'venator' meaning 'hunter'.
description: Lucianovenator is an extinct genus of coelophysid theropod dinosaur
  which lived in Argentina during the Triassic. The genus name Lucianovenator
  translates to "Luciano's hunter", in reference to Don Luciano Leyes, who first
  reported the remains. The species name bonoi refers to Tulio del Bono, a local
  scientific authority who collaborated on the describers' research. It is one
  of the few neotheropods known from South America.
