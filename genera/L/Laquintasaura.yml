  - id: paul2024a
    notes: Source of the mass estimate.
  - id: jones2026a
    notes: Source of the hip height estimate.
  - id: yao2025a
    notes: New ornithischian evidence recovering Laquintasaura as a basal ornithischian.
  - id: baron2017a
    notes: Recovered Laquintasaura as an early-diverging thyreophoran within Ornithoscelida.
  - id: riguetti2022a
    notes: Recovered basal thyreophorans as unresolved outside Eurypoda in Jakapil phylogenetic analysis.
