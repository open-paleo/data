genus: Laquintasaura
parent: Ornithischia
placement: incertae sedis
etymology: Named for the La Quinta Formation where it was discovered, combined with the feminine Greek suffix for lizard.
pronunciation:
  phonetic: la-KWIN-tuh-SOR-ruh
description: Laquintasaura is a genus of Venezuelan ornithischian dinosaur
  containing a single species, Laquintasaura venezuelae. It is known for being
  one of the most primitive ornithischians in the fossil record, as well as the
  first dinosaur to have been identified from Venezuela. The name is derived
  from the La Quinta Formation, where it was discovered, and the feminine Greek
  suffix for lizard, with the specific name referring to the country of
  Venezuela. It is known from hundreds of fossil elements, all derived from a
  single extensive bonebed locality. Initially discovered by French
  paleontologists, numerous expeditions have been conducted to excavate from
  the bonebed, largely led by Marcelo R Sánchez-Villagra. Once thought to
  represent remains of Lesothosaurus, it was formally named in a 2014 study;
  much of the abundant material was not yet prepared at the time and research
  remains ongoing.
dispute:
  summary: >
    Laquintasaura is an unstable early ornithischian recovered either as
    an early-diverging thyreophoran (Baron and others, 2017; Yao and
    others, 2025) or as a basal ornithischian outside Genasauria (Barrett
    and others, 2014; Riguetti and others, 2022). Jones (2026) leaves it
    unresolved at the base of Ornithischia.
  history:
    - date: "2026-06-29"
      note: Placed at Ornithischia incertae sedis; analyses are divided between basal Thyreophora and basal Ornithischia outside Genasauria.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Cheek teeth with isosceles-shaped crowns, apicobasally elongate and tapering
    apically
  - Tooth crowns possess coarse marginal denticles extending full length of
    crown margins
  - Prominent apicobasally extending striations on labial and lingual surfaces
    of crown
  - Sharply inflected dorsal margin of ischium dorsal to obturator process
  - Femoral fibula epicondyle medially inset in posterior or ventral view
  - Astragalus with deep U-shaped notch in anterior surface
appearance:
