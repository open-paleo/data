genus: Laquintasaura
parent: Ornithischia
placement: incertae sedis
etymology: Named for the La Quinta type horizon, with Greek 'saura' (lizard,
  feminine); meaning 'La Quinta lizard'.
pronunciation:
  phonetic: la-KWIN-tuh-SOR-ruh
dispute:
  summary: >
    Laquintasaura is an unstable early ornithischian recovered either as an
    early-diverging thyreophoran (Baron and colleagues, 2017; Yao and
    colleagues, 2025) or as a basal ornithischian outside Genasauria
    (Barrett and colleagues, 2014; Riguetti and colleagues, 2022).
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Cheek teeth with isosceles-shaped crowns, apicobasally elongate and tapering
    apically
  - Tooth crowns possess coarse marginal denticles extending full length of
    crown margins
  - Prominent apicobasally extending striations on labial and lingual surfaces
    of crown
  - Sharply inflected dorsal margin of ischium dorsal to obturator process
  - Femoral fibula epicondyle medially inset in posterior or ventral view
  - Astragalus with deep U-shaped notch in anterior surface
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "302025"
  - source: wikidata
    id: Q17486753
  - source: eol
    id: "47460236"
species:
  - name: Laquintasaura venezuelae
    etymology: "Named for Venezuela, the country where the holotype bonebed in the La Quinta Formation is located, honoring the country and its people."
    pronunciation:
      phonetic: ven-eh-ZWAY-lee
    status: valid
    type_species: true
    period:
      name:
        - Early Jurassic
      stage:
        - Hettangian
    location:
      country: VE
      locality: Road-cut between La Grita and Seboruco
      region: VE-S
      formation: La Quinta
    size:
      weight_kg:
        min: 2
        max: 2
      hip_height_m:
        min: 0.25
        max: 0.25
      length_m:
        min: 1.0
        max: 1.0
    erected_in: barrett2014a
    type_specimen:
      specimen_id: [MBLUZ P.1396]
      specimen_type: holotype
      institution: MBLUZ
      material: Isolated maxillary or dentary tooth; cheek tooth crown elongate,
        apically tapering, mesiodistally widest immediately apical to root/crown
        junction, with coarse marginal denticles and apicobasal striations
      completeness: fragmentary
references:
