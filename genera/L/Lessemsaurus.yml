genus: Lessemsaurus
parent: Lessemsauridae
pronunciation:
  phonetic: LES-uhm-SAWR-us
etymology: "Named in honor of Don Lessem, a writer of popular science books
  about dinosaurs, combined with Greek 'sauros' meaning 'lizard'; the specific
  name sauropoides means 'sauropod-like', referencing its sauropodiform
  affinities."
description: Lessemsaurus is an extinct genus of sauropodiform dinosaur that
  lived in the Norian-aged (Upper Triassic) Los Colorados Formation of what is
  now Argentina.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - arid
diagnostic_features:
  - Mid and posterior cervical vertebrae with strong transverse
    infrapostzygapophyseal constriction
  - High neural arches in mid and posterior cervicals and dorsals, with centrum
    to neural arch height ratio of 1:2
  - Neural spines higher than wide in mid and posterior dorsals, with ratio of
    1.5-2 (height) to 1 (width)
  - Deep postspinal fossa in posterior cervicals with marked, high postspinal
    laminae
  - Neural spine extension in mid-posterior dorsals greater than 90% of
    vertebral centrum length
  - Tall neural arches in posterior cervicals positioned far from neural
    arch-centrum junction
  - Well-developed hyposphenes on postzygapophyses of mid and posterior dorsals
