genus: Lessemsaurus
parent: Lessemsauridae
pronunciation:
  phonetic: LES-uhm-SAWR-us
etymology: "Named in honor of Don Lessem, a writer of popular science books
  about dinosaurs, combined with Greek 'sauros' meaning 'lizard'; the specific
  name sauropoides means 'sauropod-like', referencing its sauropodiform
  affinities."
description: Lessemsaurus is an extinct genus of sauropodiform dinosaur from the
  Late Triassic of what is now Argentina. Bonaparte erected it in 1999 on eight
  presacral neural arches, part of a disarticulated assemblage collected in 1971
  that also yielded vertebrae, girdles and limb bones. Because nothing in the lot
  is articulated, a 2007 redescription restricted the type to those arches alone
  and referred the remaining elements, which come from at least three
  individuals, to the species separately. Most of what is known of the skeleton
  rests on that referred material.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - arid
diagnostic_features:
  - Dorsal and middle to posterior cervical vertebrae with high neural arches
  - Strong neural arch constriction below the postzygapophyses
  - Deep postspinal fossa
  - Dorsoventrally high infrapostzygapophyseal depression
  - Middle and posterior dorsals with neural spines higher than long, the height
    to length ratio being 1.5 to 2
  - Robust scapula with a markedly expanded blade
  - Metacarpal I extremely short, its proximal end lateromedially wider than the
    length of the metacarpal
  - Acute lateral process on the proximolateral corner of metacarpal II
  - Pubic peduncle of the ilium with a medial flange forming a narrow, marginal
    medial wall of the acetabulum
  - Brevis crest extending from the base of the ischial peduncle to the posterior
    tip of the postacetabular process
  - Distal tibia subrectangular in cross-section, its major axis lateromedial and
    twice its anteroposterior extension
appearance:
  integument: scaled
  evidence: inferred
