genus: Limaysaurus
parent: Limaysaurinae
etymology: Named after the Rio Limay, which borders the fossil locality in northwestern Patagonia; meaning "Limay lizard"
description: Limaysaurus is a genus of rebbachisaurid sauropod dinosaurs which
  lived during the late Cretaceous period, about 99.7 to 94 million years ago,
  in the Cenomanian, in what is now South America (northwestern Patagonia). It
  is represented by a single species, L. tessonei.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - arid
diagnostic_features:
  - Extremely reduced lateral temporal fenestra
  - Supraoccipital height less than foramen magnum
  - Basal tubera sheet-like
  - Caudal centra with posterior articular surfaces more concave than anterior
  - Anterior caudal neural spines with distally thickened lateral laminae
  - Distally expanded pubis with oval cross-section shaft
  - Ambiens process of pubis placed distal to obturator foramen
  - Ischium with slender shaft twisted 90°, distal end unexpanded
  - Cervical neural arches with accessory lamina from postzygodiapophyseal
    lamina anterodorsally
