genus: Limaysaurus
parent: Limaysaurinae
etymology: Limay lizard
description: Limaysaurus is a genus of rebbachisaurid sauropod dinosaurs which
  lived during the late Cretaceous period, about 99.7 to 94 million years ago,
  in the Cenomanian, in what is now South America (northwestern Patagonia). It
  is represented by a single species, L. tessonei.
