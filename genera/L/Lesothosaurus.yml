genus: Lesothosaurus
parent: Ornithischia
pronunciation:
  phonetic: le-SOH-toh-SAWR-us
etymology: Named after Lesotho, the country in southern Africa where it was found, combined with Greek 'sauros' (lizard); meaning 'lizard from Lesotho'
description: Lesothosaurus is a monospecific genus of ornithischian dinosaur
  that lived during the Early Jurassic in what is now South Africa and Lesotho.
  It was named by paleontologist Peter Galton in 1978, the name meaning "lizard
  from Lesotho". The genus has only one valid species, Lesothosaurus
  diagnosticus. Lesothosaurus is one of the most completely-known early
  ornithischians, based on numerous skull and postcranial fossils from the Upper
  Elliot Formation. It had a simpler tooth and jaw anatomy than later
  ornithischians, and may have been omnivorous in some parts of the year.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - arid
diagnostic_features:
  - Anterior premaxillary foramen piercing the premaxilla near the alveolar
    margin, opening onto the premaxillary palate just anterior to the first
    premaxillary tooth.
  - Thin, tongue-shaped maxillary process at the apex of the antorbital fossa
    receiving the lacrimal in a narrow slot (a configuration unknown elsewhere
    in Ornithischia).
  - Forelimb very short, less than 40% of hind-limb length.
  - Brevis surface on the postacetabular process of the ilium broadly exposed in
    lateral view (medial wall of the brevis fossa extending ventrally below the
    lateral wall).
  - Groove on the dorsal margin of the proximal ischial shaft, passing onto the
    medial side of the blade.
  - Pedal digit I reduced, with metatarsal I splint-shaped proximally and the
    ungual extending just beyond the second metatarsal.
