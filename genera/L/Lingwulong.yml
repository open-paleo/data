genus: Lingwulong
parent: Flagellicaudata
etymology: From 'Lingwu' (the city in Ningxia, China near the discovery site) and Chinese 'long' (dragon); meaning 'Lingwu dragon'
description: Lingwulong is a genus of diplodocoid sauropod dinosaur from the
  Middle Jurassic of what is now Lingwu, Yinchuan, Ningxia, China. The type and
  only species is L. shenqi, known from several partial skeletons. It is one of
  the earliest neosauropods ever discovered, as well as the only definitive
  diplodocoid from east Asia.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Prefrontal anterior process directed laterally
  - Orbital dorsal margin strongly ornamented by deep longitudinal grooves and
    tubercles
  - Long-axes of basal tubera free tips directed anteromedially
  - Capitate process mediolaterally long (length:height ratio ~5.0)
  - Occipital condyle articular surface wide transversely (width:height ratio
    ~1.54)
  - Lateral surface of cervical prezygapophyseal process with ridge of linear
    tubercle array
  - Subcircular facet-like region at metapophyses summit in middle
    cervical-anterior dorsal vertebrae
  - Small process projecting anterodorsally from anterior margin of transverse
    process in anterior dorsal vertebrae
  - Anterior dorsal metapophyses twisted along length
  - Anterior caudal neural spines bear subtriangular facet-like areas extending
    from summit to mid-height
