genus: Lingwulong
parent: Flagellicaudata
description: Lingwulong is a genus of diplodocoid sauropod dinosaur from the
  Middle Jurassic of what is now Lingwu, Yinchuan, Ningxia, China. The type and
  only species is L. shenqi, known from several partial skeletons. It is one of
  the earliest neosauropods ever discovered, as well as the only definitive
  diplodocoid from east Asia.
