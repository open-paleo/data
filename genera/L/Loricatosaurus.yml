genus: Loricatosaurus
parent: Stegosaurinae
etymology: From Latin loricatus (armored) combined with Greek sauros (lizard); meaning "armored lizard"
pronunciation:
  phonetic: LOH-ree-KAH-toe-SOR-us
description: Loricatosaurus is a genus of stegosaurid dinosaur known from
  Callovian-aged (Middle Jurassic) rocks of England and France.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - marine
appearance:
  features:
    - dermal plates
  integument: armored
diagnostic_features:
  - First or second caudal vertebra with bifurcated distal transverse processes
  - Anterior caudal vertebrae bear small dorsal projections about two-thirds
    along transverse process
  - Mid-caudal vertebrae with large anterior and posterior chevron facets
    converging ventrally, creating V-shaped centra in lateral view
