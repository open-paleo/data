genus: Leaellynasaura
parent: Elasmaria
etymology: Leaellyn's lizard
description: Leaellynasaura is a genus of small herbivorous ornithischian
  dinosaurs from the late Aptian to early Albian stage of the Early Cretaceous,
  around 118-110 million years ago. It was first discovered in Dinosaur Cove,
  Australia. The only known species is Leaellynasaura amicagraphica. It was
  described in 1989, and named after Leaellyn Rich, the daughter of the
  Australian palaeontologist couple Tom Rich and Patricia Vickers-Rich who
  discovered it. The specific name, amicagraphica, translates to "friend
  writing" and honours both the Friends of the Museum of Victoria and the
  National Geographic Society for their support of Australian paleontology.
diet: herbivore
locomotion: bipedal
