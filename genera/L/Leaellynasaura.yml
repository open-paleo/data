genus: Leaellynasaura
parent: Elasmaria
pronunciation:
  phonetic: lee-EL-in-a-SAWR-a
etymology: Named after Leaellyn Rich, the daughter of paleontologists Tom Rich
  and Patricia Vickers-Rich, combined with Greek sauros (lizard); meaning
  "Leaellyn's lizard"
description: Leaellynasaura is a genus of small herbivorous ornithischian
  dinosaurs from the late Aptian to early Albian stage of the Early Cretaceous,
  around 118-110 million years ago. It was first discovered in Dinosaur Cove,
  Australia. The only known species is Leaellynasaura amicagraphica. It was
  described in 1989, and named after Leaellyn Rich, the daughter of the
  Australian paleontologist couple Tom Rich and Patricia Vickers-Rich who
  discovered it. The specific name, amicagraphica, translates to "friend
  writing" and honors both the Friends of the Museum of Victoria and the
  National Geographic Society for their support of Australian paleontology.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - polar
appearance:
  integument: scaled
  evidence: inferred
diagnostic_features:
  - Distal end of the femur more anteroposteriorly compressed than in all other
    hypsilophodontids
  - Ridges present on both sides of unworn upper cheek teeth, a condition shared
    only with Othnielia among hypsilophodontids
  - Upper cheek tooth ridges lack two discrete size classes (unlike
    Atlascopcosaurus), being equally developed on both sides of the unworn tooth
  - Ridges cover the entire internal and external (lingual and buccal) surfaces
    of the crown rather than being restricted to marginal denticles
  - Lacks a single primary ridge markedly stronger than the others, and bears a
    maximum of five ridges rather than a minimum of eight as in several other
    hypsilophodontids
