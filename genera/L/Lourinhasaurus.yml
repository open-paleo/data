genus: Lourinhasaurus
parent: Camarasauridae
pronunciation:
  phonetic: loh-REEN-yah-SAWR-us
etymology: Named after Lourinhã, the municipality in Portugal associated with
  the fossil-bearing formation, combined with Greek 'sauros' (lizard); meaning
  'lizard from Lourinhã'
description: Lourinhasaurus is an extinct genus of herbivorous sauropod dinosaur
  dating from Late Jurassic strata of Estremadura, Portugal. The genus is
  monotypic, containing one species, Lourinhasaurus alenquerensis. The type
  specimen for this species was discovered near the town of Alenquer, near an
  abandoned mill. The specimen is housed at the Geological Museum of Lisbon. The
  research history of Lourinhasaurus is not without controversies, with referred
  specimens later being interpreted as not belonging to the genus (such as the
  type specimen of Supersaurus (=Dinheirosaurus) lourinhanensis). Lourinhasaurus
  means "lizard from Lourinhã" literally translated, despite the fact that the
  type specimen wasn't found in the Lourinhã municipality.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Cranial-to-middle dorsal vertebrae with a transversely concave ventral face
    bounded by longitudinal smooth crests.
  - Sagittal keel on the dorsal margin of the sacral neural spines.
  - Sacral neural spines, when vertical, becoming significantly higher caudally,
    with the dorsal margin bearing a marked cranial slope.
  - Prespinal process with a sagittal (prespinal) lamina in the dorsal sector of
    the sacral spine, subdividing a smooth prespinal fossa.
  - Circular and deep spinoprezygapophyseal fossa on the proximal caudal
    vertebrae (also shared by Jobaria).
  - Dorsal surface of the most proximal caudal spine sloping cranially and
    transitioning continuously to the cranial face of the spine, the caudal edge
    forming a transverse hook-like process in lateral view.
  - Circular process on the distal surface of carpal II.
  - Longitudinal crest on the ventral margin of the ilium's postacetabular
    process near the ischiatic peduncle.
  - Caudally oriented postacetabular process, with the chord through the
    ischiatic and pubic articulations passing through the ventral margin of the
    postacetabular process.
  - Axis of the pubic peduncle and the ischiatic articulation parallel.
  - Marked crest and groove bordering the lateral margin of the acetabulum on
    the ischium.
  - Tibia and fibula of equal length (implying a more distal position of the
    fibula relative to the tibia for reception of the astragalus).
  - Marked deflection of the entire femoral shaft without a lateral bulge.
