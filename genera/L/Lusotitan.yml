genus: Lusotitan
parent: Brachiosauridae
etymology: From 'Luso-' (the Latin term for an inhabitant of Lusitania, i.e.,
  Portugal) combined with Greek 'Titan' (a mythological giant); meaning
  'Portuguese titan' or 'Lusitanian titan'
description: Lusotitan is a genus of herbivorous brachiosaurid sauropod dinosaur
  from the Late Jurassic of Portugal.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Brachiosaurid with prominent deltopectoral crest of humerus and elongated
    humerus
  - Mid-dorsals with very large pleurocoels
  - Anterior caudals with well-developed transverse processes
  - Mid-caudal neural spine inclined almost vertically
  - Posterior caudal centra with convex anterior face
  - Mid- and posterior caudal centra wider than high
  - Slender pelvis with notch at posterodorsal margin of ilium
  - Postacetabular process of ilium bulky without notch between process and
    ischial peduncle
  - Obturator foramen of pubis closed
  - Distal end of pubis anteroposteriorly expanded
  - Tibia bowed laterally
  - Proximal end of fibula angular not rounded
