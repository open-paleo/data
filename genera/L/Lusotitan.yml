genus: Lusotitan
parent: Brachiosauridae
etymology: From 'Luso-' (the Latin term for an inhabitant of Lusitania, i.e.,
  Portugal) combined with Greek 'Titan' (a mythological giant); meaning
  'Portuguese titan' or 'Lusitanian titan'
description: Lusotitan is a genus of herbivorous brachiosaurid sauropod dinosaur
  from the Late Jurassic of Portugal.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Small lateral projection of the spinopostzygapophyseal lamina at midheight of
    the anteriormost sacral neural spine
  - Transversely elongated or T-shaped pits in the middle caudal vertebrae
  - Circular depressions on the ventral face of the middle to posterior caudals,
    anterior to the posterior chevron facets
  - Pubic peduncle of the ischium constricted in anterior view
  - Tibia strongly bowed laterally
  - No vertical groove running up the tibial shaft between the lateral and medial
    malleoli
  - Cnemial crest ventrally directed
  - Acute lateral margin of the tibia, bordered by smooth dorsoventral grooves
  - Abrupt transition between the dorsal surface of the articular surface of the
    ascending process and the lateral surface of the tibial shaft
