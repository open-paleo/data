genus: Luanchuanraptor
parent: Velociraptorinae
dispute:
  summary: >
    Luanchuanraptor is an Asian dromaeosaurid known from an associated but partial
    skeleton and is rarely included in phylogenetic analyses. The analyses that do
    include it recover it as a velociraptorine (Hartman et al., 2019; Pei et al.,
    2020), the placement adopted here, but its position is weakly constrained.
  history:
    - date: "2026-07-01"
      note: Moved from Dromaeosauridae to Velociraptorinae following Hartman et al. (2019) and Pei et al. (2020); understudied, position weakly constrained.
pronunciation:
  phonetic: lwahn-CHWAHN-RAP-tor
etymology: Named after Luanchuan, Henan Province, China combined with Latin
  raptor (thief/seizer); meaning "Luanchuan thief"
description: Luanchuanraptor is a genus of dromaeosaurid theropod dinosaurs from
  the Late Cretaceous of China. The genus is based on a partial skeleton from
  the Qiupa Formation in Luanchuan, Henan. They were medium-sized
  dromaeosaurids, the first Asian dromaeosaurid taxa described from outside the
  Gobi Desert or northeastern China.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
appearance:
  integument: feathered
  evidence: direct
diagnostic_features:
  - Distalmost caudal vertebrae with elongated prezygapophyses spanning only one
    preceding vertebra and a low, blade-like neural spine between them
  - A distinct groove in the position of the neural spine on some distal caudal
    vertebrae
  - Anterior haemal arches bridged, enclosing the haemal canal
  - Posterior haemal arches with short, trifurcated proximal and posterior
    extensions bearing a short middle process
  - Large, deep concavity on the medial surface of the coracoid
  - Deltopectoral crest extending over nearly the proximal half of the humerus
