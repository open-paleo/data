genus: Luanchuanraptor
parent: Dromaeosauridae
etymology: Luanchuan thief
description: Luanchuanraptor is a genus of dromaeosaurid theropod dinosaurs from
  the Late Cretaceous of China. The genus is based on a partial skeleton from
  the Qiupa Formation in Luanchuan, Henan. They were medium-sized
  dromaeosaurids, the first Asian dromaeosaurid taxa described from outside the
  Gobi Desert or northeastern China.
diet: carnivore
