genus: Lohuecotitan
parent: Eutitanosauria
etymology: Named for Lo Hueco, the fossil site in Spain where it was discovered, combined with Greek 'titan' meaning 'giant'.
pronunciation:
  phonetic: loh-HWAY-co-TIE-tuhn
description: Lohuecotitan is an extinct genus of titanosaurian sauropod dinosaur
  which lived during the Late Cretaceous in Spain. The only species known in the
  genus is Lohuecotitan pandafilandi, described and named in 2016.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - wetland
diagnostic_features:
  - Posterior centrodiapophyseal lamina dorsally and ventrally widened or
    bifurcated in anterior and middle dorsal vertebrae
  - Short postspinal lamina with transversely expanded distal end represented by
    smooth scars in dorsal vertebrae
  - Anteriormost caudal vertebrae with medial spinoprezygapophyseal and medial
    spinopostzygapophyseal laminae ventrally connected with prespinal and
    postspinal laminae
  - Anterior caudal neural spines with dorsal projection of prespinal and
    postspinal laminae, resulting in V-shaped outline in lateral view
  - Anterior caudal neural spines bearing greek-cross-like cross-section
  - Middle caudal vertebrae with two rough structures in dorsal edge of
    posterior articulation extending to dorsal surface of centrum
  - Articular ends of posterior haemal arch rami fully divided in two articular
    facets
  - Tuberosity between anterior and lateral trochanter of fibula
appearance:
  integument: scaled
  evidence: inferred
