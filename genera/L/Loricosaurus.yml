genus: Loricosaurus
parent: Saltasaurini
etymology: armor lizard
description: Loricosaurus is a genus of sauropod represented by a single
  species, L. scutatus. It is a titanosaur that lived near the end of the Late
  Cretaceous period, approximately 71 million years ago in the early
  Maastrichtian, being found in the province of Neuquen, Argentina in the Allen
  Formation. Due to the presence of armor, at first it was believed that it was
  an ankylosaur, but today it is considered to be that of a titanosaur.
diet: herbivore
locomotion: quadrupedal
