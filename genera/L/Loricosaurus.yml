genus: Loricosaurus
parent: Saltasaurinae
placement: incertae sedis
pronunciation:
  phonetic: lo-REE-ko-SAWR-us
etymology: From Latin 'lorica' (armor/cuirass) and Greek 'sauros' (lizard);
  meaning 'armor lizard', in reference to the dermal armor on which the genus
  is based.
description: Loricosaurus is a genus of sauropod represented by a single
  species, L. scutatus. It is a titanosaur that lived near the end of the Late
  Cretaceous period, approximately 71 million years ago in the early
  Maastrichtian, being found in the province of Neuquen, Argentina in the Allen
  Formation. Due to the presence of armor, at first it was believed that it was
  an ankylosaur, but today it is considered to be that of a titanosaur.
dispute:
  summary: >
    The type material is dermal armor only. Modern literature considers
    Loricosaurus scutatus a possible junior synonym of Neuquensaurus or
    Saltasaurus, but no formal synonymization has been published.
  history:
    - date: "2026-07-14"
      note: Refined from Titanosauria to Saltasaurinae incertae sedis; the
        osteoderms are indeterminate saltasaurine armor, and the species is
        treated as a nomen dubium.
