genus: Lokiceratops
parent: Albertaceratopsini
etymology: "Named for Loki, the Norse god, combined with Greek 'ceratops' meaning 'horned face' (from 'keras' meaning 'horn' and 'ops' meaning 'face'), hence 'Loki horned face'. The species name 'rangiformis' means 'reindeer-shaped' in reference to its elaborate ornamentation."
description: Lokiceratops is an extinct genus of centrosaurine ceratopsian
  dinosaurs from the Late Cretaceous (Campanian) Judith River Formation of
  Montana, United States. The genus contains a single species, L. rangiformis,
  known from most of the skull and a partial skeleton. Four other ceratopsians
  are known from the same stratigraphic interval as Lokiceratops-more than in
  any other locality-suggesting that this clade was very diverse during the Late
  Cretaceous of northern Laramidia.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Presence of unadorned nasal
  - Elongate, uncurved ep1 epiossification directed in plane of frill along
    posterior margin of parietosquamosal frill
  - Hypertrophied, lateral curving epiparietal ep2 directed in plane of frill,
    relatively larger than any other parietal epiossification within
    Centrosaurinae
  - Both ischia distinctly kinked distally at about two-thirds of shaft length
    where ischia contact medially
  - Postorbital horncore bases deeply excavated by sinuses penetrating a
    distance equivalent to the orbital diameter of each horncore
