genus: Lokiceratops
parent: Albertaceratopsini
etymology: Loki horned face
description: Lokiceratops is an extinct genus of centrosaurine ceratopsian
  dinosaurs from the Late Cretaceous (Campanian) Judith River Formation of
  Montana, United States. The genus contains a single species, L. rangiformis,
  known from most of the skull and a partial skeleton. Four other ceratopsians
  are known from the same stratigraphic interval as Lokiceratops—more than in
  any other locality—suggesting that this clade was very diverse during the Late
  Cretaceous of northern Laramidia.
diet: herbivore
locomotion: quadrupedal
