genus: Lamplughsaura
parent: Sauropoda
description: Lamplughsaura is an extinct genus of sauropodomorph dinosaur from
  the Sinemurian-aged (Early Jurassic) Dharmaram Formation of India. The genus
  contains a single species, Lamplughsaura dharmaramensis, known from several
  partial skeletons of a large quadrupedal animal up to 10 metres (33 ft) long.
  It has been classified as either a basal sauropod or more basal
  sauropodomorph.
diet: herbivore
locomotion: quadrupedal
