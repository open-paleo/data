genus: Lamplughsaura
parent: Sauropoda
dispute:
  summary: >
    Lamplughsaura is of uncertain affinity, recovered as either a basal
    sauropod close to Vulcanodon and Kotasaurus or as a more basal non-
    sauropodan sauropodomorph (Kutty et al., 2007). Jones (2026) treats it
    as most likely a true, basal sauropod.
  history:
    - date: "2026-06-29"
      note: >
        Placed at Sauropoda incertae sedis following Kutty et al. (2007) and
        Jones (2026); the non-sauropod sauropodomorph alternative is
        unresolved.
etymology: Named in honor of Pamela Lamplugh Robinson, a British paleontologist, combined with Greek 'saura' (lizard); meaning 'Lamplugh's lizard'
pronunciation:
  phonetic: LAHM-plu-SOR-uh
description: Lamplughsaura is an extinct genus of sauropodomorph dinosaur from
  the Sinemurian-aged (Early Jurassic) Dharmaram Formation of India. The genus
  contains a single species, Lamplughsaura dharmaramensis, known from several
  partial skeletons of a large quadrupedal animal up to 10 meters (33 ft) long.
  It has been classified as either a basal sauropod or more basal
  sauropodomorph.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Teeth with coarse denticles few or absent on mesial edge, distal edge with
    distinct concavity in side view
  - Caudal cervical neural spines bearing vertically oriented ligamentous furrow
    on cranial and caudal surfaces and transversely expanded spine table
  - Caudal neural spines bearing craniodorsally directed spur in proximal caudal
    vertebrae or distinct process in midcaudal vertebrae
  - Caudal neural spines shorter than transverse processes, former disappear
    first passing along tail
  - Descending caudal flange of distal tibia covers 66% of transverse width of
    astragalus
