genus: Linhenykus
parent: Parvicursorinae
etymology: Named for Linhe, a city near the fossil discovery site in Inner Mongolia, combined with Greek 'nykus' meaning 'claw'.
pronunciation:
  phonetic: LIN-huh-NYE-kuss
description: Linhenykus is an extinct genus of alvarezsaurid theropod dinosaur
  from the Late Cretaceous of Inner Mongolia, China. It is the most basal known
  member of the Parvicursorinae. The genus gets its name from Linhe, a city near
  the site where the fossil was first found and Greek nykus, "claw". The
  specific name is derived from Greek monos, "single", and daktylos, "finger", a
  reference to the fact that it is the only known non-avian dinosaur to have had
  but a single digit.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - arid
diagnostic_features:
  - Only phalanx-bearing digit in manus is digit II; digits III and IV entirely
    lack phalanges, making this the only functionally monodactyl nonavian
    dinosaur
  - Metacarpal III transversely compressed without distal articular surface
  - Longitudinal ventral furrow along entire length of each cervical centrum
  - Diapophyseal ridges on cervical vertebrae extend to posterodorsal rim of
    centrum
  - Weak ridge-like epipophyses on postzygapophyses of middle cervical vertebrae
  - Large pneumatic foramina in middorsal vertebrae
  - Anteriormost caudal vertebrae with amphiplatyan centra and neural spines
    located completely posterior to neural pedicles
appearance:
  features:
    - enlarged manual claws
    - reduced forelimbs
  integument: feathered
  evidence: direct
