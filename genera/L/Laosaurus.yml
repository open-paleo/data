genus: Laosaurus
parent: Ornithopoda
etymology: stone or fossil lizard
description: Laosaurus is a genus of neornithischian dinosaur. The type species,
  Laosaurus celer, was first described by O.C. Marsh in 1878 from remains
  discovered in the Upper Jurassic (Kimmeridgian) Morrison Formation of Wyoming.
  The validity of this genus is doubtful because it is based on fragmentary
  fossils. A second species also from the Morrison Formation, L. gracilis, and a
  species from the Upper Cretaceous Allison Formation of Alberta, Canada, L.
  minimus, are also considered dubious.
diet: herbivore
locomotion: bipedal
