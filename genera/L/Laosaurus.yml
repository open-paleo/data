      formation: Morrison
      coordinates:
        - 41.9077
        - -105.963402
    type_specimen:
      specimen_id: [YPM 1874]
      specimen_type: holotype
      institution: YPM
      material: Fragmentary caudal material, described by Marsh (1878) as a median
