genus: Laosaurus
parent: Neornithischia
pronunciation:
  phonetic: LAY-oh-SAWR-us
etymology: From Greek laas (stone or fossil) and sauros (lizard); meaning "stone or fossil lizard"
description: Laosaurus is a genus of neornithischian dinosaur. The type species,
  Laosaurus celer, was first described by O.C. Marsh in 1878 from remains
  discovered in the Upper Jurassic (Kimmeridgian) Morrison Formation of Wyoming.
  The validity of this genus is doubtful because it is based on fragmentary
  fossils. A second species also from the Morrison Formation, L. gracilis, and a
  species from the Upper Cretaceous Allison Formation of Alberta, Canada, L.
  minimus, are also considered dubious.
dispute:
  summary: >
    Laosaurus is a nomen dubium based on fragmentary Late Jurassic
    material from the Morrison Formation; its species have been variously
    reassigned or considered indeterminate (Galton, 1977).
  history:
    - date: "2026-06-29"
      note: Placed at Neornithischia incertae sedis; fragmentary nomen dubium not placeable more precisely.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Long bones not hollow with thick walls and small cavities
  - Vertebrae biconcave with neural arches loosely united to centra
  - Dorsal and anterior caudals more elongated than in most dinosaurs
  - Phalanges avian in character
  - Anterior limbs much smaller than posterior limbs
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "52884"
  - source: wikidata
    id: Q1657525
  - source: gbif
    id: "4823173"
species:
  - name: Laosaurus celer
    etymology: "From Latin 'celer' meaning 'swift' or 'fast', in reference to the inferred agility of this small ornithischian."
    status: nomen dubium
    type_species: true
    period:
      name:
        - Late Jurassic
      stage:
        - Kimmeridgian
        - Tithonian
      from_ma: 154.8
      to_ma: 145
    location:
      country: US
