genus: Ligabueino
parent: Abelisauroidea
dispute:
  summary: >
    Ligabueino, a tiny and fragmentary taxon, was originally regarded as a
    noasaurid, but Carrano and colleagues (2011), following Carrano and
    Sampson (2008), could place it only within Abelisauroidea, and Hendrickx
    and colleagues (2024) recovered it near the base of that clade.
pronunciation:
  phonetic: LEE-gah-BOO-ay-EE-noh
etymology: "Named for Italian doctor and fossil enthusiast Giancarlo Ligabue,
  its discoverer, with the diminutive '-ino' suffix in Italian meaning 'little
  one', hence 'Ligabue's little one'."
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
appearance:
  integument: scaled
  evidence: inferred
