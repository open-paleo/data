genus: Lapparentosaurus
parent: Eusauropoda
placement: incertae sedis
dispute:
  summary: >
    Lapparentosaurus was erected within Cetiosauridae (Bonaparte, 1986), but
    subsequent analyses have placed it in almost every other position
    available: within Brachiosauridae (Upchurch, 1998), as Titanosauriformes
    incertae sedis and too unstable to retain in the consensus (Upchurch et
    al., 2004), as a non-neosauropod eusauropod in all analyses (Mannion et
    al., 2013), and within a broadened Turiasauria alongside Jobaria and
    Atlasaurus (Moore et al., 2020; Zhang et al., 2026). Raveloson et al.
    (2019) argue for a cetiosaurid position from newly described femoral and
    neural spine material, but from anatomical comparison rather than a
    phylogenetic analysis. A position outside Neosauropoda is well supported;
    the finer placement is not, and the type material is juvenile.
  history:
    - date: "2026-06-29"
      note: >
        Placed in Cetiosauridae following Raveloson et al. (2019) and Jones
        (2026); the Turiasauria alternative (Zhang et al., 2026) is
        unresolved.
    - date: "2026-08-04"
      note: >
        Moved from Cetiosauridae to Eusauropoda incertae sedis; the
        cetiosaurid position rests on comparative argument alone, while the
        numerical analyses agree only that the genus lies outside
        Neosauropoda.
pronunciation:
  phonetic: la-pah-RENT-o-SAWR-us
etymology: Named in honor of French paleontologist Albert-Félix de Lapparent,
  combined with Greek 'sauros' (lizard); meaning 'Lapparent's lizard'
description: Lapparentosaurus is a genus of sauropod dinosaur from the Middle
  Jurassic. Its fossils were found in Madagascar (Isalo III Formation). It
  contains one species, Lapparentosaurus madagascariensis. The genus and species
  were named by José Bonaparte in 1986. The classification of Lapparentosaurus
  is controversial, as it exhibits a combination of characteristics of basal
  sauropods and titanosauriforms.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
appearance:
  integument: scaled
  evidence: inferred
diagnostic_features:
  - Posterior dorsal neural spines low and laterally flat, without divergent
    (tetraradiate) laminae
  - Neural arch of the posterior dorsals low, with a short distance between the
    zygapophyses and the centrum (poor dorsoventral development)
