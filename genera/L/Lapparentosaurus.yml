genus: Lapparentosaurus
parent: Eusauropoda
pronunciation:
  phonetic: la-pah-RENT-o-SAWR-us
etymology: Named in honor of French paleontologist Albert-Félix de Lapparent,
  combined with Greek 'sauros' (lizard); meaning 'Lapparent's lizard'
description: Lapparentosaurus is a genus of sauropod dinosaur from the Middle
  Jurassic. Its fossils were found in Madagascar (Isalo III Formation). It
  contains one species, Lapparentosaurus madagascariensis. The genus and species
  were named by José Bonaparte in 1986. The classification of Lapparentosaurus
  is controversial, as it exhibits a combination of characteristics of basal
  sauropods and titanosauriforms.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
appearance:
  integument: scaled
  evidence: inferred
diagnostic_features:
  - Posterior dorsal neural spines low and laterally flat, without divergent
    (tetraradiate) laminae
  - Neural arch of the posterior dorsals low, with a short distance between the
    zygapophyses and the centrum (poor dorsoventral development)
