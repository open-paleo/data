references:
  - id: bonaparte1986a
  - id: jones2026b
    notes: Source of the body length, mass, and hip height estimates.
  - id: zhang2026a
    notes: Places Lapparentosaurus within Turiasauria alongside Jobaria and Atlasaurus in new phylogenetic analysis
  - id: raveloson2019a
    notes: Newly described femoral and neural spine material argued, by anatomical
      comparison rather than phylogenetic analysis, to support a cetiosaurid
      position.
  - id: moore2020a
    notes: Implied-weights and Bayesian analyses recover Lapparentosaurus as a
      turiasaurian outside Neosauropoda.
  - id: mannion2013a
    notes: Found no support for a titanosauriform position, recovering
      Lapparentosaurus as a non-neosauropod eusauropod in all analyses.
  - id: upchurch2004a
    notes: Recovered Lapparentosaurus as Titanosauriformes incertae sedis and
      deleted it from the consensus tree as an unstable taxon.
  - id: upchurch1998a
    notes: Phylogenetic analysis of sauropods placed Lapparentosaurus within Brachiosauridae.
  - id: läng2008a
    notes: Recovered Lapparentosaurus within a restricted or paraphyletic Cetiosauridae.
