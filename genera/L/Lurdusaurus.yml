genus: Lurdusaurus
parent: Styracosterna
pronunciation:
  phonetic: LOOR-duh-SAWR-us
etymology: "From Latin 'lurdus' meaning 'heavy' and Greek 'sauros' meaning 'lizard', hence 'heavy lizard', in reference to its massive proportions. The species name 'arenatus' is Latin for 'sandy', as it was found in a desert."
description: Lurdusaurus is a genus of massive and unusually shaped iguanodont
  dinosaur from the Elrhaz Formation in Niger. It contains one species, L.
  arenatus. The formation dates to the Early Cretaceous, roughly 112 million
  years ago.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Massively proportioned iguanodontid with unusually robust skeletal
    construction throughout
  - Cervical centra approximately equal in length to dorsal centra (unlike
    European species where cervicals are 60-90% of dorsal length)
  - Radius approximately 54.5% the length of humerus (much shorter than typical
    iguanodontids)
  - Metacarpals approximately 17% the length of humerus (short and robust,
    graviporteur type)
  - Quadrate extremely short, approximately twice the average length of dorsal
    centra
  - Tibia 84.5% the length of femur (very short hindlimb relative to body size)
  - Forelimbs and hindlimbs short relative to dorsal centrum length (60-70%
    shorter than in European species)
