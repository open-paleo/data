genus: Linhevenator
parent: Troodontinae
etymology: From 'Linhe' (the region in Inner Mongolia, China where fossils were found) combined with Latin 'venator' (hunter); meaning 'Linhe hunter'
pronunciation:
  phonetic: LIN-huh-VEN-uh-tuh
description: Linhevenator is a genus of short-armed troodontid theropod dinosaur
  from the Late Cretaceous (Campanian) Bayan Mandahu Formation of Bayan Mandahu,
  Inner Mongolia, China.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - arid
diagnostic_features:
  - Jugal with a lateral flange forming a flat shelf below the orbit
  - Surangular crest anteroventrally oriented rather than anteriorly
  - Medial expansion near distal end of femur on the posterior surface
  - Wide longitudinal groove present along distal third of dorsal surface of
    metatarsal III
appearance:
  features:
    - sickle claw
  integument: feathered
  evidence: direct
