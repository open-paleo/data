genus: Loncosaurus
parent: Iguanodontia
description: Loncosaurus is an extinct genus of ornithopod dinosaur from the
  Upper Cretaceous of Provincia de Santa Cruz, Argentina. The type (and only
  known) species is Loncosaurus argentinus, described by the famous Argentinian
  paleontologist Florentino Ameghino, but is considered a dubious name. Details
  on this animal are often contradictory, befitting a genus that was long
  confused for a theropod.
