genus: Loncosaurus
parent: Iguanodontia
etymology: "Meaning uncertain; either from Araucanian 'lonco' meaning 'chief' or
  Greek 'lonche' meaning 'lance', combined with Greek 'sauros' meaning
  'lizard'."
description: Loncosaurus is an extinct genus of ornithopod dinosaur from the
  Upper Cretaceous of Provincia de Santa Cruz, Argentina. The type (and only
  known) species is Loncosaurus argentinus, described by the famous Argentinian
  paleontologist Florentino Ameghino, but is considered a dubious name. Details
  on this animal are often contradictory, befitting a genus that was long
  confused for a theropod.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Teeth with anterior edge denticulate down to base of crown, highly
    compressed with thin enamel layer
  - Great development of internal trochanter of femur, probably somewhat hooked
  - Femur body cylindrical with large medullary cavity (diameter 4.5-5 cm, ~50
    cm total length)
