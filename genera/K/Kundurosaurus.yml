genus: Kundurosaurus
parent: Edmontosaurini
description: Kundurosaurus is an extinct genus of saurolophine hadrosaurid
  dinosaur known from the latest Cretaceous (probably late Maastrichtian stage)
  of Amur Region, Far Eastern Russia. It contains a single species,
  Kundurosaurus nagornyi.
