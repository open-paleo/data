genus: Kundurosaurus
parent: Saurolophinae
etymology: "Named for Kundur, the type locality in Amur Region, Far Eastern Russia, combined with Ancient Greek 'sauros' meaning 'lizard'; the specific name nagornyi honors V.A. Nagorny, who discovered the Kundur locality in 1990."
pronunciation:
  phonetic: kun-DUH-ro-SOR-us
description: Kundurosaurus is an extinct genus of saurolophine hadrosaurid
  dinosaur known from the latest Cretaceous (probably late Maastrichtian stage)
  of Amur Region, Far Eastern Russia. It contains a single species,
  Kundurosaurus nagornyi.
dispute:
  summary: >
    Kundurosaurus nagornyi is widely treated as a junior synonym of
    Kerberosaurus manakini (Xing and others, 2014), with which it
    overlaps in age and locality, though its describers retained it as
    distinct. Kept valid within Saurolophinae pending consensus.
  history:
    - date: "2026-06-27"
      note: Placed at Saurolophinae (edmontosaurin grade) following
        Godefroit and others (2012); Kobayashi and others (2019) recovered
        the sister taxon Kerberosaurus within Edmontosaurini. Synonymy with
        Kerberosaurus reflected but not adopted.
diet: herbivore
locomotion: facultative
diagnostic_features:
  - Prominent and thick ridge on lateral side of nasal bordering circumnasal
    depression, invading caudal plate
  - Caudal buttress of proximal scapular head oriented laterally, parallel to
    pseudoacromial process
  - Preacetabular iliac process straight, moderately deflected ventrally (160°
    angle), not reaching peduncle plane
  - Postacetabular process strongly twisted, lateral side progressively facing
    dorsolaterally
paleoenvironment:
  - fluvial
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "237270"
  - source: wikidata
    id: Q2663595
species:
  - name: Kundurosaurus nagornyi
    etymology: "Named for V.A. Nagorny of the Far Eastern Institute of Mineral Resources, who discovered the Kundur fossil locality in 1990."
    status: disputed
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Maastrichtian
      from_ma: 72.1
      to_ma: 66
    size:
      length_m:
        min: 7.0
        max: 7.0
      weight_kg:
        min: 2000
        max: 2000
    erected_in: godefroit2012b
    location:
      country: RU
      region: RU-AMU
      formation: Udurchukan
    type_specimen:
      specimen_id: [AENM 2/921]
      specimen_type: holotype
      institution: AENM
      material: Partial, disarticulated skull.
      completeness: partial
references:
  - id: godefroit2012b
  - id: kobayashi2019a
    notes: Recovered Kerberosaurus (Kundurosaurus's sister taxon) within Edmontosaurini; does not analyze Kundurosaurus directly.
  - id: xing2014b
    notes: Treated Kundurosaurus nagornyi as a junior synonym of Kerberosaurus manakini, citing co-occurrence and shared cranial characters; its describers retained it as distinct.
