genus: Kangnasaurus
parent: Elasmaria
pronunciation:
  phonetic: KANG-nuh-SAWR-us
etymology: Named after Farm Kangnas in the Orange River valley of northern Cape Province, South Africa; meaning "Farm Kangnas lizard"
description: Kangnasaurus is a genus of elasmarian ornithopod dinosaur found in
  Late Cretaceous rocks of South Africa. It is known from a tooth and possibly
  some postcranial remains dating between the middle-Campanian to Maastrichtian
  Kalahari Deposits Formation.
dispute:
  summary: >
    Kangnasaurus coetzeei is based on a tooth and fragmentary remains;
    it is recovered as an elasmarian by recent analyses but has
    historically been treated as a dryosaurid and is sometimes regarded
    as a nomen dubium.
  history:
    - date: "2026-06-29"
      note: Placed at Elasmaria following recent analyses; nomen dubium.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "38732"
  - source: wikidata
    id: Q633747
  - source: gbif
    id: "4823066"
  - source: eol
    id: "47460131"
species:
  - name: Kangnasaurus coetzeei
    etymology: "Named for the farmer Coetzee, on whose farm (Farm Kangnas) the holotype tooth was discovered."
    status: nomen dubium
    type_species: true
    period:
      name:
        - Late Cretaceous
      from_ma: 100.5
      to_ma: 66.0
    location:
      country: ZA
      locality: well, farm Kangnas, portion Goebees
      region: ZA-NC
      coordinates:
        - -29.520279
        - 18.419443
      notes: Weishampel and colleagues (2004) give the horizon as the Kalahari
        Deposits, which none of the works cited for this taxon recognizes as a
        formation. De Wit
        and colleagues (1992) read the deposit as fill in a crater lake above
        a Late Cretaceous olivine-melilitite intrusion.
    erected_in: haughton1915a
    type_specimen:
      specimen_id: [SAM 2732]
      specimen_type: holotype
      institution: SAM
      material: Maxillary tooth with worn oblique crown and cylindrical root; nearly
        complete right femur with strongly curved shaft
      completeness: fragmentary
references:
  - id: haughton1915a
    notes: Original description, giving no age for the material.
  - id: dewit1992a
    notes: Prints the coordinate for the Goebees well.
  - id: weishampel2004a
    notes: Lists the Kalahari Deposits as the horizon, citing Haughton and
      Cooper.
