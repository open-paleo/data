genus: Kangnasaurus
parent: Iguanodontia
pronunciation:
  phonetic: KANG-nuh-SAWR-us
etymology: Named after Farm Kangnas in the Orange River valley of northern Cape Province, South Africa; meaning "Farm Kangnas lizard"
description: Kangnasaurus is a genus of elasmarian ornithopod dinosaur found in
  Late Cretaceous rocks of South Africa. It is known from a tooth and possibly
  some postcranial remains dating between the middle-Campanian to Maastrichtian
  Kalahari Deposits Formation.
dispute:
  summary: >
    Norman (2004) considers Kangnasaurus coetzeei a nomen dubium, while
    Forster and colleagues (2023) note that the material certainly pertains
    to Iguanodontia and that it has also been treated as a valid
    iguanodontian, as the analyses since 2020 treat it. Cooper (1985) allied
    it with Dryosaurus; later analyses recover it as an elasmarian (Fonseca
    and colleagues 2024; Dieudonné and colleagues 2026), within a
    rhabdodontoid clade (Poole, 2022), or outside Dryosauridae (Rocchi and
    colleagues 2026). It is placed at Iguanodontia incertae sedis.
  history:
    - date: "2026-06-29"
      note: Placed at Elasmaria following recent analyses; nomen dubium.
    - date: "2026-10-16"
      note: >
        Moved from Elasmaria to Iguanodontia incertae sedis and status
        set to disputed; summary rewritten with its sources.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "38732"
  - source: wikidata
    id: Q633747
  - source: gbif
    id: "4823066"
  - source: eol
    id: "47460131"
species:
  - name: Kangnasaurus coetzeei
    etymology: "Named for the farmer Coetzee, on whose farm (Farm Kangnas) the holotype tooth was discovered."
    status: disputed
    type_species: true
    period:
      name:
        - Late Cretaceous
      from_ma: 100.5
      to_ma: 66.0
    location:
      country: ZA
      locality: well, farm Kangnas, portion Goebees
      region: ZA-NC
      coordinates:
        - -29.520279
        - 18.419443
      notes: Weishampel and colleagues (2004) give the horizon as the Kalahari
        Deposits, which none of the works cited for this taxon recognizes as a
        formation. De Wit
        and colleagues (1992) read the deposit as fill in a crater lake above
        a Late Cretaceous olivine-melilitite intrusion.
    erected_in: haughton1915a
    type_specimen:
      specimen_id: [SAM 2732]
      specimen_type: holotype
      institution: SAM
      material: Maxillary tooth with worn oblique crown and cylindrical root; nearly
        complete right femur with strongly curved shaft
      completeness: fragmentary
references:
  - id: haughton1915a
    notes: Original description, giving no age for the material.
  - id: dewit1992a
    notes: Prints the coordinate for the Goebees well.
  - id: weishampel2004a
    notes: Lists the Kalahari Deposits as the horizon, citing Haughton and
      Cooper.
  - id: norman2004a
    notes: Lists Kangnasaurus coetzeei among the nomina dubia of basal
      Iguanodontia.
  - id: forster2023a
    notes: Notes that the material certainly pertains to an iguanodontian and
      that its validity has been both doubted and accepted.
  - id: cooper1985a
    notes: Transfers Kangnasaurus from the iguanodontids to a position most
      closely allied to Dryosaurus.
  - id: fonseca2024a
    notes: Recovers Kangnasaurus within Elasmaria, as one of its earliest
      members under implied weighting.
  - id: dieudonné2026a
    notes: Recovers Kangnasaurus in an unresolved polytomy with the
      elasmarians.
  - id: poole2022a
    notes: Recovers Kangnasaurus within a Rhabdodontoidea alongside
      Rhabdodontidae, Tenontosaurus and Muttaburrasaurus.
  - id: rocchi2026a
    notes: Recovers Kangnasaurus outside Dryosauridae.
