genus: Kangnasaurus
parent: Elasmaria
etymology: Named after Farm Kangnas in the Orange River valley of northern Cape Province, South Africa; meaning "Farm Kangnas lizard"
description: Kangnasaurus is a genus of elasmarian ornithopod dinosaur found in
  Late Cretaceous rocks of South Africa. It is known from a tooth and possibly
  some postcranial remains dating between the middle-Campanian to Maastrichtian
  Kalahari Deposits Formation.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
diagnostic_features:
  - Maxillary tooth with outer median ridge dividing crown surface into two
    unequal areas, median ridge stronger than subsidiary ridges
  - Outer crown ridges originating midway between median ridge and crown
    borders, not forming anterior/posterior limits
  - Tooth inner surface gently convex with slight longitudinal ridges
  - Femur with inner trochanter wholly on proximal half of shaft and compressed;
    non-pendent type
  - Femur lesser trochanter rises to near height of greater trochanter,
    separated posteriorly by deep cleft before crushing
  - Anterior intercondylar groove wide and shallow; posterior intercondylar
    groove deep and fairly wide
