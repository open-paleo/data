genus: Kentrosaurus
parent: Stegosauria
pronunciation:
  phonetic: KEN-troh-SOR-uhs
  ipa: /ˌkɛntroʊˈsɔːrəs/
etymology: "From Greek 'kentron' (prickle or spike) and 'sauros' (lizard);
  meaning 'prickle lizard', referring to its prominent spikes"
description: Kentrosaurus is a genus of stegosaurid dinosaur from the Late
  Jurassic in Lindi Region of Tanzania. The type species is K. aethiopicus,
  named and described by German paleontologist Edwin Hennig in 1915. Often
  thought to be a "primitive" member of the Stegosauria, several recent
  cladistic analyses find it as more derived than many other stegosaurs, and a
  close relative of Stegosaurus from the North American Morrison Formation
  within the Stegosauridae.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - coastal
diagnostic_features:
  - Dorsal armor dominated by elongate, paired spines rather than plates, with
    modification series from rounded cross-section to flattened forms
  - Neural spines of dorsal vertebrae initially vertical, progressively
    transitioning to anteriorly-directed orientation posteriorly, with expanded
    prezygapophyses overriding preceding vertebra
  - Absence of distinct dorsal plates comparable in size and number to
    Stegosaurus, distinguishing it as a separate genus
  - Humeral morphology with deep groove on dorsal surface above strongly inset
    trochlea
