genus: Kentrosaurus
parent: Stegosauridae
pronunciation:
  phonetic: KEN-troh-SOR-uhs
  ipa: /ˌkɛntroʊˈsɔːrəs/
etymology: "From Greek 'kentron' (prickle or spike) and 'sauros' (lizard);
  meaning 'prickle lizard', referring to its prominent spikes"
description: Kentrosaurus is a genus of stegosaurid dinosaur from the Late
  Jurassic in Lindi Region of Tanzania. The type species is K. aethiopicus,
  named and described by German paleontologist Edwin Hennig in 1915. Often
  thought to be a "primitive" member of the Stegosauria, several recent
  cladistic analyses find it as more derived than many other stegosaurs, and a
  close relative of Stegosaurus from the North American Morrison Formation
  within the Stegosauridae.
dispute:
  summary: >
    Kentrosaurus is securely a stegosaurid, but its subfamily placement is
    contested, having been recovered in Stegosaurinae (Maidment et al., 2008),
    as a stemward stegosaurid (Jones and Viola, 2026), and in Dacentrurinae
    (Sánchez-Fenollosa and Cobos, 2025). It is placed at Stegosauridae without a
    subfamily.
  history:
    - date: "2026-06-26"
      note: Placed at Stegosauridae, subfamily (Dacentrurinae vs Stegosaurinae) contested.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - coastal
diagnostic_features:
  - Neural spines of the tail markedly anticlinal, posteriorly inclined in the
    anterior caudals, sub-vertical through the middle third, and hook-shaped and
    anteriorly inclined in the posterior third
  - Anterior and middle caudal vertebrae with a strong ridge and tubercle on the
    lateral surface of the prezygapophysis
  - Dorsal vertebrae with a neural arch more than twice the height of the
    centrum, entirely occupied by the extremely spacious neural canal
  - Preacetabular process of the ilium widening laterally rather than tapering
  - Dorsal armor dominated by elongate, paired spines rather than plates, with
    modification series from rounded cross-section to flattened forms
  - Humeral morphology with deep groove on dorsal surface above strongly inset
    trochlea
appearance:
  features:
    - dermal plates
    - tail spikes
    - shoulder spikes
  integument: armored
  evidence: direct
