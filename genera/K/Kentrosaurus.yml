      specimen_type: lectotype
      institution: ZMB
      material: Partial skeleton of a single individual, comprising four posterior
        dorsal vertebrae, the sacrum, both ilia, an articulated series of the first
        29 caudal vertebrae, both femora, and the left ulna.
      completeness: partial
      notes: Hennig (1915) designated no type, so the material of the original
        description forms a syntype series. Hennig (1925) selected two specimens
        as types, St 439 first and St 500 second; the German uses the plural for
        St 439, denoting not the sacrum alone but the whole associated partial
        skeleton, now MB.R.4800.1 to MB.R.4800.37. Mallison (2011) establishes
        that St 439 is therefore the lectotype, being the prior designation under
        ICZN Article 74.1.1, and that St 500 (MB.R.3613, MB.R.4555, MB.R.4557,
        MB.R.4558) is a paralectotype. The designation is valid because parts of
        St 439, the left femur St 463 (MB.R.4800.36) and the left ulna St 461
        (MB.R.4800.33), are figured in Hennig (1915) and so belong to the type
        series. Galton (1982) and Maidment et al. (2008) instead treat the two
        articulating dorsal vertebrae MB.R.1930 and MB.R.1931 (field St 694 and
        St 695) as the holotype; that designation is invalid both as a later
        selection under Article 74.1.1 and under Article 74.5, and it supports a
        far narrower diagnosis.
