genus: Koshisaurus
parent: Hadrosauroidea
description: Koshisaurus is a monospecific genus of basal hadrosauroid from the
  Kitadani Formation in Japan. The discovery of the genus suggests that
  hadrosauroids had higher diversity along the eastern margin of Asia in the
  Early Cretaceous. "Koshi" means an old Japanese regional name including Fukui
  prefecture where fossils of the genus were discovered.
diet: herbivore
locomotion: facultative
