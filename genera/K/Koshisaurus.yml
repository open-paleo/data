genus: Koshisaurus
parent: Hadrosauroidea
etymology: Named for 'Koshi', an old Japanese regional name for the area including Fukui Prefecture where the fossils were discovered, combined with Greek 'sauros' meaning 'lizard'.
pronunciation:
  phonetic: koh-shee-SOR-us
description: Koshisaurus is a monospecific genus of basal hadrosauroid from the
  Kitadani Formation in Japan. The discovery of the genus suggests that
  hadrosauroids had higher diversity along the eastern margin of Asia in the
  Early Cretaceous. "Koshi" means an old Japanese regional name including Fukui
  prefecture where fossils of the genus were discovered.
dispute:
  summary: >
    Koshisaurus katsuyama is generally recovered as a basal hadrosauroid
    (Madzia and others, 2020; Jones, 2026), but Tsogtbaatar and others
    (2019) recovered it as the sister to Hadrosauriformes, outside
    Hadrosauroidea.
  history:
    - date: "2026-06-27"
      note: Placed at Hadrosauroidea following the prevailing view; the
        outside-Hadrosauroidea result of Tsogtbaatar and others (2019)
        reflected, not adopted.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
diagnostic_features:
  - Antorbital fossa on the maxilla
  - Three or more subsidiary ridges on the labial side of maxillary tooth crowns
  - Unique combination of maxillary, vertebral, pubic and femoral characters
appearance:
  integument: scaled
  evidence: inferred
