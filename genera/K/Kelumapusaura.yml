genus: Kelumapusaura
parent: Saurolophinae
etymology: From Mapudungun kelumapu (red earth) combined with Greek sauros (lizard); meaning "red earth lizard"
description: Kelumapusaura is a genus of saurolophine hadrosaur from the Late
  Cretaceous Allen Formation in what is now Patagonia in Argentina. The type and
  only species is K. machi, known from a bonebed of various individuals.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
diagnostic_features:
  - shallow maxilla compared to dentary dorsoventral height
  - maxilla with dorsoventrally low medial surface dorsal to medial row of
    foramina
  - maxilla with groove forming constriction on anteroventral process
  - dentary symphysis with anteriorly oriented sub-triangular processes with
    deep anterior groove in bilobate outline
  - anterior dentary end with crescent-shaped concavity on lateral surface
  - first sacral with anterior articular surfaces strongly obliquely oriented
    and anterodorsally facing
  - postorbital with short to absent medial process on skull roof
appearance:
  features:
    - keratinous beak
  integument: scaled
  evidence: inferred
