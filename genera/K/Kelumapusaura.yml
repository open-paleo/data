genus: Kelumapusaura
parent: Kritosaurini
etymology: From Mapudungun kelumapu (red earth) combined with Greek sauros (lizard); meaning "red earth lizard"
description: Kelumapusaura is a genus of saurolophine hadrosaur from the Late
  Cretaceous Allen Formation in what is now Patagonia in Argentina. The type and
  only species is K. machi, known from a bonebed of various individuals.
diet: herbivore
locomotion: facultative
