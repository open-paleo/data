genus: Klamelisaurus
parent: Mamenchisauridae
pronunciation:
  phonetic: klah-MAY-lee-SAWR-us
etymology: Named after the Kelameili (Klamelisaurus) Mountains in the Xinjiang
  region of China; meaning "Kelameili Mountains lizard"
description: Klamelisaurus is a genus of herbivorous sauropod dinosaur from the
  Middle Jurassic Shishugou Formation of China. The type species is
  Klamelisaurus gobiensis, which was named by Zhao Xijin in 1993, based on a
  partial skeleton discovered in 1982 near the abandoned town of Jiangjunmiao.
  Zhao described Klamelisaurus as the only member of a new subfamily,
  Klamelisaurinae, among the now-defunct primitive sauropod order
  Bothrosauropodoidea. Since Zhao's description, Klamelisaurus received limited
  attention from researchers until Andrew Moore and colleagues redescribed it in
  2020.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Scabrous, sheet-like anterior extensions of the spinoprezygapophyseal
    laminae (SPRLs) in middle-posterior cervical vertebrae.
  - Oblong, blind pneumatic fossa just anterior to the spinodiapophyseal fossa
    (SDF) in middle-posterior cervical vertebrae.
  - Triplicate posterior centroparapophyseal laminae (PCPLs) in some posterior
    dorsal vertebrae.
  - Dorsally bifurcated spinodiapophyseal lamina (SPDL) in middle and posterior
    dorsal vertebrae, without confluence with either the SPRL or the
    spinopostzygapophyseal lamina (SPOL).
  - Shelf-like embayment of the proximomedial corner of the anterior face of the
    humerus, bounded medially by a bulge.
  - Flange-like ridge overhanging the medial surface of the shaft of
    metatarsal I.
appearance:
  features:
    - elongate neck
  integument: scaled
  evidence: inferred
