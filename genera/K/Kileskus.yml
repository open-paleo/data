genus: Kileskus
parent: Proceratosauridae
etymology: From the Khakas language word 'kileskus' meaning 'lizard'.
pronunciation:
  phonetic: kill-ESS-kuss
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Ascending process of maxilla confluent with anterior rim and gently sloping
    posterodorsally
  - Anterodorsal process of premaxilla inclined slightly anterodorsally, nares
    inclined posterodorsally at ~40°
  - Antorbital fossa ventral depth much greater than maxilla depth below ventral
    margin
  - Four premaxillary teeth with D-shaped cross-section in some
  - Seventeen maxillary tooth positions
  - Elongated external naris exceeding 20% of skull length
  - Antorbital fossa extends anteriorly to about fourth tooth position
appearance:
  features:
    - snout hornlets
  integument: unknown
identifiers:
  - source: pbdb
    id: "185192"
  - source: wikidata
    id: Q132522
species:
  - name: Kileskus aristotocus
    etymology: "From Ancient Greek 'aristos' meaning 'best' and 'tokos' meaning
      'offspring' or 'birth', giving 'aristocratic offspring' or 'excellent
      parent', in reference to its basal position in tyrannosauroid evolution."
    pronunciation:
      phonetic: uh-ris-TOT-uh-kus
    status: valid
    type_species: true
