genus: Kileskus
parent: Proceratosauridae
etymology: "From the Khakas language word 'kileskus' meaning 'lizard'. The
  species name 'aristotocus' refers to its many offspring."
pronunciation:
  phonetic: kill-ESS-kuss
description: Kileskus is a genus of tyrannosauroid dinosaur known from partial
  remains found in Middle Jurassic (Bathonian stage) Itat Formation of
  Sharypovsky District, Krasnoyarsk Krai (Russia). Fossils recovered include the
  holotype maxilla, a premaxilla, a surangular, and a few bones from the hand
  and foot. Additional remains referred to the species include cervical and
  caudal vertebrae, as well as a fibula. The skull bones are similar to those of
  Proceratosaurus. The type species is K. aristotocus, named in 2010 by
  Averianov and colleagues.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Ascending process of maxilla confluent with anterior rim and gently sloping
    posterodorsally
  - Anterodorsal process of premaxilla inclined slightly anterodorsally, nares
    inclined posterodorsally at ~40°
  - Antorbital fossa ventral depth much greater than maxilla depth below ventral
    margin
  - Four premaxillary teeth with D-shaped cross-section in some
  - Seventeen maxillary tooth positions
  - Elongated external naris exceeding 20% of skull length
  - Antorbital fossa extends anteriorly to about fourth tooth position
