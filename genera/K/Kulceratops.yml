genus: Kulceratops
parent: Ceratopsia
etymology: "Named for the Khodzhakul Formation where the fossils were found, with 'kul' meaning 'lake' in the local language, combined with Greek 'keratops' meaning 'horned face'; the specific name kulensis also references the formation."
description: "Kulceratops is a genus of ceratopsian dinosaur from the Early
  Cretaceous. It lived in the late Albian stage. It is one of the few
  ceratopsians known from this period. However, the fossils from this genus have
  been sparse: only jaw and tooth fragments have been found so far."
diet: herbivore
locomotion: bipedal
