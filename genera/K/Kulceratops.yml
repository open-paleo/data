genus: Kulceratops
parent: Neoceratopsia
pronunciation:
  phonetic: kool-SER-a-tops
etymology: "Named for the Khodzhakul Formation where the fossils were found,
  with 'kul' meaning 'lake' in the local language, combined with Greek
  'keratops' meaning 'horned face'; the specific name kulensis also references
  the formation."
description: "Kulceratops is a genus of ceratopsian dinosaur from the Early
  Cretaceous. It lived in the late Albian stage. It is one of the few
  ceratopsians known from this period. However, the fossils from this genus have
  been sparse: only jaw and tooth fragments have been found so far."
dispute:
  summary: >
    Kulceratops kulensis is a poorly known Early Cretaceous taxon,
    generally treated as a nomen dubium but interpreted as a basal
    neoceratopsian.
  history:
    - date: "2026-06-27"
      note: Placed at Neoceratopsia (basal); nomen dubium (P2).
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Maxilla short, moderately high, very roughly built with very thick suture to
    jugal
  - Ascending plate of maxilla very thick mediolaterally near premaxilla contact
  - Notch for coronoid process shallow, with large opening above
appearance:
  integument: scaled
  evidence: inferred
