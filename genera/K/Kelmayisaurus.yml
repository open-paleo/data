genus: Kelmayisaurus
parent: Carcharodontosauridae
placement: incertae sedis
dispute:
  summary: >
    Kelmayisaurus petrolicus, once considered a nomen dubium, was revalidated as a
    basal carcharodontosaurid on the basis of a single autapomorphy (Brusatte and colleagues, 2012); its fragmentary material yields weak, unstable support, and
    Kellermann and colleagues (2025) recover it in varying positions across Allosauroidea.
    It is placed conservatively at Carcharodontosauridae incertae sedis.
  history:
    - date: "2026-07-01"
      note: Placed at Carcharodontosauridae incertae sedis following Brusatte and colleagues (2012); fragmentary material and unstable support are noted.
    - date: "2026-10-09"
      note: Status confirmed valid; diagnostic features added from the emended diagnosis of Brusatte and colleagues (2012), whose paper is now cited under its own key.
pronunciation:
  phonetic: kuhl-MAH-yi-SAWR-us
etymology: "Named for Karamay (Kelmay in Uyghur), the petroleum-producing city
  in Xinjiang, China near where it was found, combined with Greek 'sauros'
  meaning 'lizard', hence 'Karamay lizard'."
description: Kelmayisaurus is an extinct genus of carcharodontosaurian theropod
  dinosaur from the Early Cretaceous. It was roughly 10-12 meters (33-39 feet)
  long and its name refers to the petroleum-producing city of Karamay in the
  Xinjiang province of western China near where it was found.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
appearance:
  integument: scaled
  evidence: inferred
diagnostic_features:
  - Deeply inset, dorsally concave groove on the anterior part of the lateral
    surface of the dentary
  - Maxillary interdental plates more than twice as tall dorsoventrally as they
    are broad anteroposteriorly
  - Prominent anterior process of the maxilla
  - No anteroventral chin-like process on the dentary
