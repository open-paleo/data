genus: Kelmayisaurus
parent: Carcharodontosauridae
dispute:
  summary: >
    Kelmayisaurus petrolicus, once considered a nomen dubium, was revalidated as a
    basal carcharodontosaurid on the basis of a single autapomorphy (Brusatte et
    al., 2012); its fragmentary material yields weak, unstable support, and
    Kellermann et al. (2025) recover it in varying positions across Allosauroidea.
    It is placed conservatively at Carcharodontosauridae incertae sedis.
  history:
    - date: "2026-07-01"
      note: Placed at Carcharodontosauridae incertae sedis following Brusatte et al. (2012); fragmentary material and unstable support are noted.
pronunciation:
  phonetic: kuhl-MAH-yi-SAWR-us
etymology: "Named for Karamay (Kelmay in Uyghur), the petroleum-producing city
  in Xinjiang, China near where it was found, combined with Greek 'sauros'
  meaning 'lizard', hence 'Karamay lizard'."
description: Kelmayisaurus is an extinct genus of carcharodontosaurian theropod
  dinosaur from the Early Cretaceous. It was roughly 10-12 meters (33-39 feet)
  long and its name refers to the petroleum-producing city of Karamay in the
  Xinjiang province of western China near where it was found.
diet: carnivore
locomotion: bipedal
