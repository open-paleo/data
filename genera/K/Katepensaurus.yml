genus: Katepensaurus
parent: Rebbachisauridae
etymology: "From Tehuelche 'katepenk' meaning 'hole', referring to a distinctive opening in the transverse processes of the dorsal vertebrae, combined with Greek 'sauros' meaning 'lizard'. The species name honors Alejandro Goicoechea, owner of the ranch where it was found."
description: Katepensaurus is an extinct genus of rebbachisaurid sauropod
  dinosaur known from the Late Cretaceous of south-central Chubut Province of
  central Patagonia, Argentina. It contains a single species, Katepensaurus
  goicoecheai.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Internal lamina divides lateral pneumatic fossa of centrum in dorsal
    vertebrae
  - Vertical ridges or crests present on lateral surface of dorsal vertebra,
    overlying neurocentral junction
  - Pair of laminae in parapophyseal centrodiapophyseal fossa
  - Transverse processes perforated by elliptical fenestrae, decreasing in size
    posteriorly
  - Well-defined, rounded fossae on lateral aspect of postzygapophyses
