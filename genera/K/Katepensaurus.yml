genus: Katepensaurus
parent: Rebbachisauridae
etymology: "From Tehuelche 'katepenk' meaning 'hole', referring to a distinctive opening in the transverse processes of the dorsal vertebrae, combined with Greek 'sauros' meaning 'lizard'. The species name honours Alejandro Goicoechea, owner of the ranch where it was found."
description: Katepensaurus is an extinct genus of rebbachisaurid sauropod
  dinosaur known from the Late Cretaceous of south-central Chubut Province of
  central Patagonia, Argentina. It contains a single species, Katepensaurus
  goicoecheai.
diet: herbivore
