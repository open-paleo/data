genus: Kaijiangosaurus
parent: Tetanurae
dispute:
  summary: >
    Kaijiangosaurus lini was described only in a 1984 book and has never been the
    subject of a peer-reviewed redescription or dedicated phylogenetic analysis; it is
    most likely a basal tetanuran (Carrano, Benson and Sampson, 2012) and has been
    suggested to be synonymous with the contemporaneous Gasosaurus constructus. It is
    placed conservatively at Tetanurae incertae sedis.
  history:
    - date: "2026-07-02"
      note: Placed at Tetanurae incertae sedis; its validity relative to Gasosaurus is unresolved.
pronunciation:
  phonetic: KIE-JYAHNG-o-SAWR-us
etymology: Named after the Kai River (Kaijiang) in Sichuan, China; meaning
  "Kaijiang lizard"
description: Kaijiangosaurus is a genus of carnivorous tetanuran theropod
  dinosaur from the Middle Jurassic of China. In 1984 He Xinlu named and
  described the type species Kaijiangosaurus lini. The generic name refers to
  the River (jiang) Kai. The specific name honors the paleontologist Lin
  Wenqiu.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
appearance:
