genus: Kaijiangosaurus
parent: Tetanurae
placement: incertae sedis
dispute:
  summary: >
    The validity of Kaijiangosaurus lini is unresolved. It was described only in
    a 1984 book, on a holotype of seven cervical vertebrae (CCG 20020), and has
    never been the subject of a peer-reviewed redescription. Rauhut (2003)
    regarded it as a nomen dubium, whereas Carrano, Benson and Sampson (2012)
    treated it as a fragmentary taxon requiring restudy — noting that the
    referred material may not all belong to one taxon — and suggested a basal
    tetanuran or averostran placement without declaring it dubious. Paul (2024)
    suggested it may be a junior synonym of the contemporaneous Gasosaurus
    constructus. It is placed conservatively at Tetanurae incertae sedis.
  history:
    - date: "2026-07-02"
      note: Placed at Tetanurae incertae sedis; its validity relative to Gasosaurus is unresolved.
    - date: "2026-07-20"
      note: Status set to disputed and the dispute expanded — Rauhut (2003)
        regards it as a nomen dubium, Carrano and colleagues (2012) treat it as
        a fragmentary taxon needing restudy, and Paul (2024) suggests synonymy
        with Gasosaurus.
pronunciation:
  phonetic: KIE-JYAHNG-o-SAWR-us
etymology: Named after the Kai River (Kaijiang) in Sichuan, China; meaning
  "Kaijiang lizard"
description: Kaijiangosaurus is a genus of carnivorous tetanuran theropod
  dinosaur from the Middle Jurassic of China. In 1984 He Xinlu named and
  described the type species Kaijiangosaurus lini. The generic name refers to
  the River (jiang) Kai. The specific name honors the paleontologist Lin
  Wenqiu.
