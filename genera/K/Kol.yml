genus: Kol
parent: Alvarezsauridae
dispute:
  summary: >
    Kol ghuva was described by Turner et al. (2009) as a derived alvarezsaurid,
    more derived than Alvarezsaurus and Patagonykus, on the basis of its extreme
    arctometatarsalian foot. Because the holotype is a single articulated foot,
    the placement is poorly constrained, and some subsequent authors have
    suggested it may instead be a basal oviraptorosaurian. It is placed in
    Alvarezsauridae following the describing analysis and Jones et al. (2026).
  history:
    - date: "2026-07-01"
      note: Moved from Coelurosauria to Alvarezsauridae following Turner et al. (2009) and Jones et al. (2026); fragmentary holotype, with a basal oviraptorosaurian alternative proposed.
pronunciation:
  phonetic: khol
description: Kol is an extinct genus of coelurosaurian theropod dinosaur from the
  Late Cretaceous of Mongolia. The type and only species is Kol ghuva. The type
  specimen was excavated from the Ukhaa Tolgod locality of the Djadochta
  Formation, dating to about 75 million years ago. It is believed to have been
  about twice the size of the contemporaneous Shuvuuia. However, unlike
  Shuvuuia, which is known from many well preserved specimens, and although
  Ukhaa Tolgod has been thoroughly explored, Kol is known only from one
  complete foot, suggesting that it must have been relatively rare in that
  ecosystem.
etymology: "From Mongolian хөл/köl meaning 'foot'."
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - arid
diagnostic_features:
  - Extensor grooves on digit IV phalanges
  - Robust flexor tubercle on pedal unguals
  - MT III does not reach ankle; terminates in distal 1/3 of MT II
  - Accessory dorsomedial flange absent on medial side of distal MT II
  - MT II shorter than MT IV
  - MT III extends higher proximally (>1/3 metatarsus length), more proximal
    than other alvarezsaurids
appearance:
  features:
    - reduced forelimbs
  integument: unknown
