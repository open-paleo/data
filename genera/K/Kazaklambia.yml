genus: Kazaklambia
parent: Lambeosaurinae
etymology: Named for Kazakhstan, where the fossils were found, combined with the genus name Lambeosaurus (a related lambeosaurine dinosaur), meaning 'Kazakhstan Lambeosaurus'.
pronunciation:
  phonetic: kah-zak-LAM-bee-uh
description: Kazaklambia is an extinct genus of herbivorous lambeosaurine
  dinosaur known from the Late Cretaceous Darbazin Formation (Santonian stage)
  of southern Kazakhstan. It contains a single species, Kazaklambia convincens.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - deltaic
diagnostic_features:
  - Prefrontal process of postorbital with dorsal thickening forming dome
    lateral to frontal dome
  - Doming of nasal anterodorsal to orbit
  - Frontal length/width ratio less than 1
  - Crest height better-developed than North American lambeosaurines of similar
    juvenile size
  - Presphenoid at least as long as orbitosphenoid, roughly equidimensional
appearance:
  features:
    - hollow cranial crest
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "271587"
  - source: wikidata
    id: Q17126088
species:
  - name: Kazaklambia convincens
    etymology: "From Latin 'convincens' meaning 'convincing', as the discovery was considered convincing evidence of the Cretaceous age of the Darbazin Formation dinosaur beds in Kazakhstan."
    status: valid
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Coniacian
        - Santonian
    location:
      country: KZ
      locality: Syuk-Syuk
      region: KZ-61
      formation: Darbazin
      notes: Which unit name applies to the horizon is contested rather than the
        horizon itself. Rozhdestvensky (1964) assigned the holotype to the lower
        part of the Darbazin Formation and the Stratigraphic Dictionary of the
        USSR, edited by Vereshchagin (1979), to the Syuk-Syuk Formation, with
        Nessov (1995) recording both readings for the Syuk-Syuk well site. The
        two units are stratigraphically adjacent and both Santonian. Bell and
        others (2013) follow the Darbazin reading, which is adopted here.
    type_specimen:
      specimen_id: [PIN 2230]
      specimen_type: holotype
      institution: PIN
      material: Virtually complete skull and skeleton of an immature individual
        lacking most of the preorbital region of the skull, distal parts of the
        forelimbs, distal left hindlimb, and distal caudal vertebrae
      completeness: complete
    size:
      length_m:
        min: 4.7
        max: 4.7
    erected_in: bell2013a
references:
  - id: bell2013a
  - id: nessov1995a
    notes: Catalog of the Syuk-Syuk locality, recording both the Darbazin and
      Syuk-Syuk assignments for the horizon.
  - id: jones2026a
    notes: Source of the body length estimate, and the appearance features.
  - id: vereshchagin1979a
  - id: rozhdestvensky1964a
