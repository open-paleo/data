genus: Kinnareemimus
parent: Ornithomimosauria
dispute:
  summary: >
    Kinnareemimus is a fragmentary taxon whose position is unstable. It was
    described as an ornithomimosaur (Buffetaut et al., 2009) and is generally
    regarded as a basal member of the clade, but analyses vary widely: Hartman et
    al. (2019) recovered it as a tyrannosauroid in their shortest trees, and it
    behaves as a wildcard in recent ornithomimosaur matrices (Averianov and Sues,
    2024). It is placed conservatively as a basal ornithomimosaur.
  history:
    - date: "2026-06-30"
      note: >
        Retained at Ornithomimosauria as a basal member; the non-ornithomimosaur
        result of Hartman et al. (2019) and its instability across recent matrices
        are recorded as unresolved.
etymology: Named after Kinnaree, a half-human half-bird figure from Thai folklore, combined with Latin mimus (mimic); meaning "Kinnaree mimic"
pronunciation:
  ipa: /ˌkɪnəriˈmɑːiməs/
  phonetic: KIN-ah-ree-MIEM-us
description: Kinnareemimus is an extinct genus of ornithomimosaurian theropod
  dinosaur that was discovered in the Early Cretaceous Sao Khua Formation in
  what is now Thailand. The genus contains only the type species, K.
  khonkaenensis. The specific epithet is after Khon Kaen Province, which is in
  northeastern Thailand, where the remains of the animal were discovered.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Metatarsal III visible in cranial view between proximal ends of metatarsals
    II and IV, becoming rod-like distally with triangular cross-section
  - Metatarsal III more derived than Garudimimus and Harpymimus but less derived
    than Archaeornithomimus in its proximal-to-distal morphological progression
  - Cnemial crest on tibia markedly concave on lateral margin forming distinct
    notch between fibular condyle and crest
  - Medial expansion of metatarsal III shaft occurs closer to distal end than in
    Garudimimus and Harpymimus, approximating arctometatarsalian condition of
    derived ornithomimids
