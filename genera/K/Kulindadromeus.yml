    type: boycotted
    reason: Based on material reportedly stolen from the Kulindadromeus type locality; rejected by the original describing team.
  - name: Daurosaurus
    type: boycotted
    reason: Based on material reportedly stolen from the Kulindadromeus type locality; rejected by the original describing team.
  - name: Lepidocheirosaurus
    type: junior subjective
    reason: Described from the same formation as Kulindadromeus, alongside Daurosaurus and Kulindapteryx; now widely treated as a junior synonym.
