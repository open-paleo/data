genus: Kulindadromeus
parent: Neornithischia
etymology: From the Kulinda fossil sites in Russia combined with Greek 'dromeus' (runner); meaning 'Kulinda runner'
pronunciation:
  phonetic: KOO-lin-dah-DRO-mee-us
description: Kulindadromeus is a genus of basal neornithischian dinosaur that
  lived during the Middle Jurassic. The first Kulindadromeus fossil was found in
  Russia. Its feather-like integument is evidence for protofeathers being basal
  to Ornithischia and possibly Dinosauria as a whole, rather than just to
  Coelurosauria, as previously suspected.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
appearance:
  features:
    - tail bristles
  integument: feathered
diagnostic_features:
  - Maxilla with rostral ascending process much lower than caudal ascending
    process and maxillary fenestra larger than antorbital fenestra
  - Jugal with notched postorbital ramus
  - Postorbital with dorsoventrally expanded caudal ramus
  - Dorsoventrally slender postacetabular process on ilium
  - Deep extensor fossae on metatarsals II to IV
  - Diverse epidermal appendages including monofilaments and compound
    featherlike structures alongside scales
  - Basal neornithischian with sister relationship to Cerapoda
