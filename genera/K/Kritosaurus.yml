genus: Kritosaurus
parent: Kritosaurini
pronunciation:
  phonetic: KRIT-o-SAWR-us
etymology: From Greek kritos (separated) and sauros (lizard); meaning "separated
  lizard", referring to the arrangement of the cheek bones in the type skull
description: Kritosaurus is an incompletely known genus of hadrosaurid
  (duck-billed) dinosaur. It lived about 74.5-66 million years ago, in the Late
  Cretaceous of North America. The name means "separated lizard" (referring to
  the arrangement of the cheek bones in an incomplete type skull), but is often
  mistranslated as "noble lizard" in reference to the presumed "Roman nose" (in
  the original specimen, the nasal region was fragmented and disarticulated, and
  was originally restored flat).
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
diagnostic_features:
  - Skull more deep and massive than any other described trachodontid species
  - Premaxillaries and rostrum proportionately shorter than in Trachodon or
    Claosaurus
  - Frontal short antero-posteriorly with prefrontal and postfrontal almost
    excluding it from orbital border
  - Paroccipital process of exoccipital longer than in Trachodon both actually
    and relatively
  - Orbital opening proportionately smaller and laterotemporal fenestra
    proportionately larger than in Trachodon
  - Quadrate and jugal completely separated by quadrato-jugal
  - Predentary with massive nearly-vertical lateral borders forming powerful
    clipping instrument
  - Predentary anterior upper border rugose with two parallel series of vascular
    foramina
  - Teeth larger in both series than any other described trachodontid; 42
    vertical rows in mandible, 47 in maxilla
