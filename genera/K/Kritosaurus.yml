genus: Kritosaurus
parent: Kritosaurini
pronunciation:
  phonetic: KRIT-o-SAWR-us
etymology: From Greek kritos (separated) and sauros (lizard); meaning "separated
  lizard", referring to the arrangement of the cheek bones in the type skull
description: Kritosaurus is an incompletely known genus of hadrosaurid
  (duck-billed) dinosaur. It lived about 74.5-66 million years ago, in the Late
  Cretaceous of North America. The name means "separated lizard" (referring to
  the arrangement of the cheek bones in an incomplete type skull), but is often
  mistranslated as "noble lizard" in reference to the presumed "Roman nose" (in
  the original specimen, the nasal region was fragmented and disarticulated, and
  was originally restored flat).
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
diagnostic_features:
  - Dorsolateral margin of the maxilla (rostral and adjacent to the jugal
    articular surface) 40% or more of the distance between the rostral end of
    the maxilla and the caudoventral corner of the jugal's orbital margin
    (autapomorphy).
  - Jugal with the orbital constriction deeper than the infratemporal
    constriction.
  - Infratemporal fenestra larger than the orbit, with its dorsal margin greatly
    elevated above the dorsal orbital margin in adults (postorbital squamosal
    ramus forming more than a 20° angle with the maxillary tooth row).
  - Frontal participating in the orbital margin via an intervening apex between
    the prefrontal and postorbital (convergent in Brachylophosaurini).
  - Paired caudal parasagittal processes of the nasals resting over the frontals,
    with the rostromedial margin of the frontals inserting between the nasal
    processes.
