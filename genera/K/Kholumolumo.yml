genus: Kholumolumo
parent: Massopoda
etymology: From the Basuto (Sesotho) name for a type of dragon-like creature that the local Basuto people associated with dinosaur fossils.
description: Kholumolumo , formerly "Kholumolumosaurus" or "Thotobolosaurus", is
  an extinct genus of massopodan sauropodomorph dinosaur, which was closely
  related to Sarahsaurus, from the lower Elliot Formation of Maphutseng,
  Lesotho. The type species, Kholumolumo ellenbergerorum was formally described
  in 2020.
dispute:
  summary: >
    Kholumolumo ellenbergerorum is recovered as an early-branching
    massopodan, sandwiched between Plateosauridae and Massospondylidae
    (Peyre de Fabrègues and Allain, 2019), the position followed by Jones
    (2026); it has also been associated with Lessemsauridae.
  history:
    - date: "2026-06-29"
      note: Placed at Massopoda incertae sedis following Peyre de Fabrègues and Allain (2019) and Jones (2026); the Lessemsauridae alternative is recorded.
locomotion: bipedal
paleoenvironment:
  - fluvial
  - arid
diet: herbivore
diagnostic_features:
  - Very short and stout tibia with circumference to length ratio of 0.53
  - Tibia diaphysis becomes thinner distally with straight anterior and
    posterior margins
  - Fourth metatarsal elongated relative to tibia with proximally larger
    transverse end
  - Posterior cervical vertebra particularly anteroposteriorly short and
    dorsoventrally tall with centrum elongation of 1.2
  - Anterior dorsal vertebra with neural spine base anterior to diapophysis
    anterior margin
  - Sacral vertebral centrum very short anteroposteriorly with centrum ventral
    length to anterior height of 0.7
  - "Scapula with two marked ridges on lateral surface of blade: one
    posterodorsal and one anterodorsal"
