genus: Kosmoceratops
parent: Chasmosaurinae
etymology: From Greek kosmos (ornate/decorated) combined with ceratops (horned face); meaning "ornate horned face", referring to the elaborate skull ornamentation
pronunciation:
  ipa: /ˌkɒzməˈsɛrətɒps/
  phonetic: KOZ-mo-SEH-ruh-tops
description: Kosmoceratops is a genus of ceratopsid dinosaur that lived in North
  America about 76-75.9 million years ago during the Late Cretaceous period.
  Specimens were discovered in Utah in the Kaiparowits Formation of the Grand
  Staircase-Escalante National Monument in 2006 and 2007, including an adult
  skull and postcranial skeleton and partial subadults. In 2010, the adult was
  made the holotype of the new genus and species Kosmoceratops richardsoni; the
  generic name means "ornate horned face", and the specific name honors Scott
  Richardson, who found the specimens. The find was part of a spate of
  ceratopsian discoveries in the early 21st century, and Kosmoceratops was
  considered significant due to its elaborate skull ornamentation.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - wetland
diagnostic_features:
  - Internal naris rostrocaudally abbreviated and caudodorsally inclined
  - Nasal horncore transversely constricted, long-based, blade-like with
    flattened distal portion
  - Supraorbital horncores dorsolaterally directed proximally with ventral
    curvature distally tapering to point
  - Parietosquamosal frill relatively short and broad (max width ~2x max length)
    with small caudally positioned parietal fenestrae
  - Ten well developed hook-like processes on caudal frill margin (three
    epiparietals, one epiparietosquamosal, one episquamosal per side)
  - Most ornate skull of any known dinosaur with 15 well developed horns or
    horn-like structures
appearance:
  features:
    - epoccipitals
    - brow horns
    - nasal horn
    - neck frill
  integument: scaled
  evidence: inferred
