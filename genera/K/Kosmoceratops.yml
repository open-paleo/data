genus: Kosmoceratops
parent: Chasmosaurinae
etymology: ornate horned face
pronunciation:
  ipa: /ˌkɒzməˈsɛrətɒps/
description: Kosmoceratops is a genus of ceratopsid dinosaur that lived in North
  America about 76–75.9 million years ago during the Late Cretaceous period.
  Specimens were discovered in Utah in the Kaiparowits Formation of the Grand
  Staircase–Escalante National Monument in 2006 and 2007, including an adult
  skull and postcranial skeleton and partial subadults. In 2010, the adult was
  made the holotype of the new genus and species Kosmoceratops richardsoni; the
  generic name means "ornate horned face", and the specific name honors Scott
  Richardson, who found the specimens. The find was part of a spate of
  ceratopsian discoveries in the early 21st century, and Kosmoceratops was
  considered significant due to its elaborate skull ornamentation.
diet: herbivore
locomotion: quadrupedal
