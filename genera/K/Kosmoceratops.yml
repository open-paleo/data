notable_specimens:
  - specimen_id: [UMNH VP 16878]
    institution: UMNH
    species: Kosmoceratops richardsoni
    category: ontogeny
    significance: "A disarticulated subadult skull about half the size of the adult, missing the premaxilla, rostral, and predentary bones. It has the same number and pattern of epiossifications as the adult holotype, distinguishing the subadult growth stage of Kosmoceratops from that of Utahceratops."
    references: [loewen2013b]
  - specimen_id: [UMNH VP 21339]
    institution: UMNH
    species: Kosmoceratops richardsoni
    category: ontogeny
    significance: "A disarticulated subadult or adult whose femur was histologically sampled, showing sustained rapid growth and supporting an elevated, endothermic metabolism in Kosmoceratops. The analysis determined the specimen was subadult to adult, ruling out that it represented an immature Vagaceratops."
    references: [levitt2013]
