genus: Kank
parent: Unenlagiinae
etymology: From Kank, the elder Rhea in Aonikenk (Tehuelche) mythology who
  created the constellation Choiols (the Southern Cross), referring to the
  taxon's southern Patagonian provenance.
description: Kank is an extinct genus of unenlagiid paravian dinosaur known from
  the Late Cretaceous (Maastrichtian age) Chorrillo Formation of southwestern
  Patagonia, Argentina. The genus contains a single species, Kank australis,
  known from fragmentary remains.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - wetland
  - lacustrine
diagnostic_features:
  - Cervicodorsal vertebra bearing three small pneumatic foramina on its ventral
    surface within the carotid groove
  - Cervicodorsal vertebra with a deep, wide 'epipophyseal fossa' between the
    postzygapophysis and the epipophysis in posterior view
  - Dentary teeth with a crenulate mesial carina restricted to the apical third
    of the crown, with irregular, gently crenulate, non-individualized denticles
  - Pedal phalanx II-2 with dorsoventrally depressed distal condyles near half
    the height of the proximal articular surface, and collateral pits positioned
    very close to the anterodorsal corner of the condyles
