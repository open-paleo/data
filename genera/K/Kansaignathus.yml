genus: Kansaignathus
parent: Velociraptorinae
dispute:
  summary: >
    Kansaignathus is known only from an isolated dentary and was recovered as a
    basal velociraptorine by its describers (Averianov and Lopatin, 2021), a
    position appearing in most of their trees but resting on very limited
    character data. It is placed in Velociraptorinae following the describing
    analysis, with the fragmentary type noted.
pronunciation:
  ipa: /ˌkɛnsɑːiˈnɛiθəs/
etymology: "Named for the area near the town of Konsoy ('Kansai' in Russian) in Tajikistan where it was discovered, combined with Greek 'gnathos' meaning 'jaw'."
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - deltaic
  - fluvial
diagnostic_features:
  - Dentary high and thin labiolingually with nearly parallel dorsal and ventral
    edges
  - Two parallel rows of large vascular foramina on labial side; dorsal row
    nearly entire length, ventral row approximately one-third length near
    ventral margin
  - Distinct chin prominence in symphysial region
  - Concave dorsal margin and convex ventral margin of dentary
  - Interdental laminae not discernible and completely fused with dentary
appearance:
  features:
    - sickle claw
    - feathered wings
  integument: feathered
  evidence: direct
identifiers:
  - source: pbdb
    id: "444043"
  - source: wikidata
    id: Q107352115
species:
  - name: Kansaignathus sogdianus
    etymology: "Named for Sogdiana, the historical region and ancient name for the Fergana Valley area of Tajikistan where the fossil was discovered."
    pronunciation:
      phonetic: sog-dee-AY-nus
    status: valid
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Santonian
    location:
      country: TJ
      locality: Kansai
      region: TJ-SU
      formation: Yalovach
    size:
      length_m:
        min: 2.0
        max: 2.0
    erected_in: averianov2021a
    type_specimen:
      specimen_id: [PIN 2398/15]
      specimen_type: holotype
      institution: PIN
      material: Right dentary
      completeness: fragmentary
