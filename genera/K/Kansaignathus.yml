genus: Kansaignathus
parent: Velociraptorinae
pronunciation:
  ipa: /ˌkɛnsɑːiˈnɛiθəs/
etymology: "Named for the area near the town of Konsoy ('Kansai' in Russian) in Tajikistan where it was discovered, combined with Greek 'gnathos' meaning 'jaw'."
description: Kansaignathus is an extinct genus of dromaeosaurid theropod from
  the Late Cretaceous Yalovach Formation (or Ialovachsk Formation) of
  Tajikistan. The genus contains only one species, the type species, K.
  sogdianus. The generic name of Kansaignathus comes from near the town of
  Konsoy ("Kansai" in Russian) where it was discovered and the Greek word
  "gnathos" meaning "jaw". The specific epithet "sogdianus" is derived from the
  historical region of Sogdiana, which was an ancient name for the Fergana
  Valley region where the fossil was discovered. Kansaignathus is known from a
  single right dentary bone and a few post-cranial bone fragments. It was the
  first, and so far the only, dinosaur from Tajikistan to be described and
  named.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - deltaic
  - fluvial
diagnostic_features:
  - Dentary high and thin labiolingually with nearly parallel dorsal and ventral
    edges
  - Two parallel rows of large vascular foramina on labial side; dorsal row
    nearly entire length, ventral row approximately one-third length near
    ventral margin
  - Distinct chin prominence in symphysial region
  - Concave dorsal margin and convex ventral margin of dentary
  - Interdental laminae not discernible and completely fused with dentary
appearance:
  features:
    - sickle claw
    - feathered wings
