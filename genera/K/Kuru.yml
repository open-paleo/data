genus: Kuru
parent: Velociraptorinae
pronunciation:
  ipa: /ˈkuruˈkʊlə/
  phonetic: koo-roo
etymology: "Named for Kurukullā, a deity venerated in Tibetan Buddhism associated with major life transitions (explicitly not in reference to the prion disease of the same name)."
description: Kuru kulla (, after Kurukullā, a Tibetan Buddhist deity) is an
  extinct species of dromaeosaurid theropod dinosaurs from the Late Cretaceous
  Barun Goyot Formation of Mongolia. K. kulla is the only species in the genus
  Kuru, known from a fragmentary skeleton including a partial skull.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - arid
diagnostic_features:
  - Deeply incised groove framing anterior and ventral margins of narial fossa
    on premaxilla
  - Lacrimal with posterolateral hornlet arising from posterodorsal process
  - Two posterior surangular foramina
  - Proportionally deep surangular with dorsally facing muscle-attachment surface
  - Anteriorly displaced pleurocoels on dorsal centra
  - Hyposphenes widely separated and joined by web of bone
appearance:
  features:
    - sickle claw
  integument: feathered
  evidence: direct
identifiers:
  - source: pbdb
    id: "444049"
  - source: wikidata
    id: Q1025732
synonyms:
  - name: Airakoraptor
    type: nomen nudum
    reason: Informal name for a dromaeosaurid taxon reported at a 1992 Society of Vertebrate Paleontology conference; the specimen was ultimately formally described as Kuru kulla.
species:
  - name: Kuru kulla
    etymology: "Named for Kurukullā, a deity in Tibetan Buddhism associated with love and magic, reflecting the Mongolian and Tibetan cultural context of the fossil's discovery."
