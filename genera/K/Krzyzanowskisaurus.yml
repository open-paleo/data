genus: Krzyzanowskisaurus
parent: Ornithischia
etymology: Stan Krzyżanowski's lizard
description: Krzyzanowskisaurus is the name given to a genus of archosaur from
  the Late Triassic-aged Chinle Formation and it is a tooth taxon, based on
  fossils only of teeth (such as the holotype tooth NMMNH P-29357) and these
  teeth have been found in the U.S. states of Arizona (including the type
  locality) and New Mexico. The original report described it as a "probable
  ornithischian" and Heckert (2005) suggests that Krzyzanowskisaurus teeth have
  biostratigraphic utility as an index fossil of the St. Johnsian sub-LVF
  (land-vertebrate faunachron).
diet: herbivore
locomotion: bipedal
