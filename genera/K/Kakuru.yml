genus: Kakuru
parent: Theropoda
etymology: Named for Kakuru, a rainbow serpent figure from Aboriginal Australian mythology, reflecting the opalescent preservation of the fossil.
pronunciation:
  phonetic: ka-KOO-roo
description: Kakuru is a dubious genus of theropod dinosaur from the Early
  Cretaceous of Australia.
diet: carnivore
locomotion: bipedal
diagnostic_features:
  - Astragalar facet high and attenuated to distinct apex dorsally, not broad
    enough to extend across entire width of anterior tibial face at any point
  - Medial malleolus strongly produced medially with abruptly truncated concave
    upper margin, uniquely developed compared to other theropods
  - Marked anterior ridge on tibia running dorsally from medial malleolus,
    bounding astragalar facet medially
  - Astragalar ascending process high and attenuate but restricted medially by
    bounding ridge, not applied to entire tibial width (unique among known
    theropod tarsal types)
paleoenvironment:
  - marine
appearance:
  integument: scaled
  evidence: inferred
