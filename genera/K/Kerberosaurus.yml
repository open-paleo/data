genus: Kerberosaurus
parent: Edmontosaurini
etymology: "Named for Kerberos (Cerberus), the three-headed dog of Greek mythology that guards the underworld, combined with Greek 'sauros' meaning 'lizard', hence 'Kerberos lizard'."
pronunciation:
  phonetic: KUHR-buh-ro-SOR-us
description: Kerberosaurus is a genus of saurolophine duckbill dinosaur from the
  late Maastrichtian-aged (Upper Cretaceous) Tsagayan Formation of
  Blagoveshchensk, Amur Region, Russia (dated to 66 million years ago). It is
  based on bonebed material including skull remains indicating that it was
  related to Saurolophus and Prosaurolophus.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
diagnostic_features:
  - Basipterygoid process of prootic deeply excavated by pocket-like depression
  - Groove for ramus ophthalmicus of trigeminal nerve proportionally wider on
    laterosphenoid
  - Postotic foramina not bordered rostrally by prominent ridge
  - Frontal particularly narrow medio-laterally
  - Rostral margin of parietal depressed
  - Circumnarial depression bordered dorsocaudally by strong, wide, flattened
    ridge on nasal
  - Palatine process on maxilla very prominent and hook-like
