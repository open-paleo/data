genus: Koleken
parent: Furileusauria
etymology: "From Teushen, a language of central Patagonia, meaning 'coming from clay and water', in reference to the estuarine sedimentary environment where it was found. The species name honors Inakayal, a chief of the Tehuelche people."
pronunciation:
  phonetic: KO-lek-en
description: Koleken is a genus of carnotaurin abelisaurid from the
  Maastrichtian La Colonia Formation in the Chubut Province of Argentina. The
  genus contains a single species, Koleken inakayali, known from one immature
  specimen about 4.97 meters (16.3 ft) long and six years old in minimum age.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Medially smooth paradental plates
  - Dorsal surface of nasal with row of foramina orientated obliquely to
    longitudinal skull axis
  - Anterior postorbital ramus lacking lateral wall with dorsoventral height
    less than half anteroposterior length
  - Shallow dorsolateral depression on postorbital dorsal surface at junction
    between anterior and posterior rami
  - Parietal with mediolaterally concave dorsal surface and lacking knob-like
    dorsal projection
  - Ventral squamosal process slender and thorn-like lacking anterior kink
  - Dorsal neural spines bearing elevated rim along anterior, dorsal and
    posterior margins in lateral view
  - Proximal tibia articular surface margin between condyles obliquely
    orientated facing posterolaterally
