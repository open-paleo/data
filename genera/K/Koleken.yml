genus: Koleken
parent: Furileusauria
etymology: coming from clay and water
description: Koleken is a genus of carnotaurin abelisaurid from the
  Maastrichtian La Colonia Formation in the Chubut Province of Argentina. The
  genus contains a single species, Koleken inakayali, known from one immature
  specimen about 4.97 metres (16.3 ft) long and six years old in minimum age.
diet: carnivore
locomotion: bipedal
