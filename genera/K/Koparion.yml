genus: Koparion
parent: Coelurosauria
placement: incertae sedis
dispute:
  summary: >
    Koparion douglassi is based on a single maxillary tooth from the Morrison
    Formation and is a tooth-based taxon; its describer referred it to Troodontidae
    on dental characters (Chure, 1994), but it cannot be placed more precisely and
    is treated by some as of doubtful validity. It is placed at Troodontidae
    incertae sedis.
  history:
    - date: "2026-07-01"
      note: Placed at Troodontidae incertae sedis; single-tooth taxon.
    - date: "2026-07-14"
      note: Moved to Coelurosauria incertae sedis; the troodontid referral of the
        single tooth cannot be reliably supported (Weishampel and others, 2004).
pronunciation:
  phonetic: ko-PAYR-ee-on
etymology: From Ancient Greek 'koparion' (small surgical knife), referring to
  the small, blade-like shape of the known tooth fossil
description: Koparion is a genus of small coelurosaurian theropod dinosaur, from
  the late Jurassic Period (Kimmeridgian stage), of Utah. It contains the single
  named species Koparion douglassi which is known only from a single isolated
  tooth.
diet: carnivore
