references:
  - id: sereno2008a
  - id: carrano2012a
    notes: Considered Kryptops palaios a chimera and referred the postcranium
      (notably the pelvis and sacrum) to a carcharodontosaurid, possibly
      Eocarcharia.
  - id: delcourt2018c
    notes: Questioned the validity of Kryptops, suggesting it may be a nomen
      dubium because the holotype maxilla preserves only a single autapomorphy.
  - id: farke2013a
    notes: Scores Kryptops on the holotype maxilla alone, the only element
      undoubtedly abelisaurid, and agrees the postcranium is probably
      allosauroid.
  - id: rauhut2016b
    notes: Codes Kryptops on the maxilla only, referring it to Abelisauridae on
      its rugose surface and reduced antorbital fossa, and treats the pelvic
      girdle as tetanuran.
  - id: iczn2019a
    notes: Acknowledges receipt of Case 3795.
  - id: iczn2019b
    notes: Closes Case 3795, recording that the case was not published.
  - id: cau2025a
    notes: Finds the original hypodigm chimaerical, an abelisaurid maxilla with
      allosauroid postcrania, and scores them as separate units.
