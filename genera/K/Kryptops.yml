genus: Kryptops
parent: Abelisauridae
dispute:
  summary: >
    The validity of Kryptops is debated: only the maxilla of the holotype is
    securely abelisaurid, and the associated postcranium may be a chimera,
    possibly belonging to a carcharodontosaurid such as Eocarcharia
    (Delcourt, 2018). Its position within Abelisauridae is unstable across
    analyses.
  history:
    - date: "2026-06-30"
      note: >
        Placed at Abelisauridae following the maxillary evidence (P2).
etymology: From Greek kryptos (covered/hidden) and ops (face); meaning "covered face", referring to the heavily textured surface of the maxilla
pronunciation:
  phonetic: CRIP-tops
description: Kryptops is an extinct genus of possibly chimeric abelisaurid
  theropod dinosaurs from the Early Cretaceous of Niger. It is known from a
  partial maxilla (upper jaw bone) found at the Gadoufaoua locality in the
  western Ténéré Desert, in rocks of the Aptian-Albian-age Elrhaz Formation. The
  fossils were collected in 2000 by a University of Chicago expedition to Niger
  led by American paleontologist Paul Sereno. They were then described in 2008
  by Sereno and Steve Brusatte. The genus contains a single species, Kryptops
  palaios. Sereno and Brusatte referred several postcranial remains to Kryptops,
  but later studies have shown that these elements belong to an allosauroid
  theropod, leaving Kryptops to be only known from the incomplete maxilla.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Deep secondary wall in anteroventral corner of antorbital fossa that
    completely obscures fossa with scalloped and fluted dorsal margin
  - External texture on maxilla composed of short linear vascular grooves
  - Narrow articular slot on maxilla for anteroventral process of nasal
    (primitive relative to other abelisaurids)
