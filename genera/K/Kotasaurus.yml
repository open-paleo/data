genus: Kotasaurus
parent: Sauropoda
etymology: Named for the Kota Formation of Telangana, India, combined with Greek
  'sauros' meaning 'lizard', hence 'Kota Formation lizard'.
pronunciation:
  phonetic: KOH-tuh-SOR-uhs
  ipa: /ˌkoʊtəˈsɔːrəs/
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Dorsal neural spines simple, without spinal laminae.
  - No pneumatocoel at the base of the neural arch opening into the neural
    canal.
  - Iliac blade low.
  - Proximal surface of the scapula narrow.
  - Limb bones relatively slender, with the femur retaining the lesser
    trochanter.
  - Chevrons V-shaped, with well-developed articular facets on the dorsolateral
    corners.
appearance:
  features:
    - elongate neck
    - tail club
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "66497"
  - source: wikidata
    id: Q135306
  - source: gbif
    id: "4823469"
  - source: eol
    id: "47459652"
species:
  - name: Kotasaurus yamanpalliensis
    etymology: "Named for Yamanpalli, the village in Telangana, India near which the
      fossil material was discovered."
    pronunciation:
      phonetic: YAH-mun-PAL-ee-EN-sis
    status: valid
    type_species: true
    period:
      name:
        - Early Jurassic
      stage:
        - Sinemurian
        - Pliensbachian
    location:
      country: IN
      locality: Yamanpalli
      region: IN-TS
      formation: Kota
      part: lower
    size:
      hip_height_m:
        min: 3
        max: 3
      length_m:
        min: 9.0
        max: 9.0
      weight_kg:
        min: 2500
        max: 2500
    type_specimen:
