      specimen_type: holotype
      institution: GSI
      material: An ilium.
    erected_in: yadagiri1988a
    described_in: yadagiri2001a
references:
  - id: bandyopadhyay2010a
    notes: Places Barapasaurus and Kotasaurus in "the lower part of the Kota
      Formation".
  - id: yadagiri1988a
  - id: jones2026b
    notes: Source of the hip height estimate and of the elongate neck.
  - id: yadagiri2001a
    notes: Emended diagnosis and osteological description drawn from at least
      twelve individuals; names Yamanpalli as the excavation and places it 40 km
      north of the Barapasaurus type locality.
  - id: kareem2024a
    notes: Describes four tail clubs of co-ossified distal caudal vertebrae,
      referred to Kotasaurus because they were collected with the rest of the
      Yamanpalli material; treats that attribution as unresolved.
