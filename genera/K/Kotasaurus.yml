genus: Kotasaurus
parent: Sauropoda
etymology: "Named for the Kota Formation of Telangana, India, combined with
  Greek 'sauros' meaning 'lizard', hence 'Kota Formation lizard'. The species
  name refers to Yamanpalli, the village near the discovery site."
pronunciation:
  phonetic: KOH-tuh-SOR-uhs
  ipa: /ˌkoʊtəˈsɔːrəs/
description: Kotasaurus is a genus of sauropod dinosaur from the Early Jurassic
  period (Sinemurian-Pliensbachian). The only known species is Kotasaurus
  yamanpalliensis. It was discovered in the Kota Formation of Telangana, India
  and shared its habitat with the related Barapasaurus. So far the remains of at
  least 12 individuals are known. The greater part of the skeleton is known, but
  the skull is missing, with the exception of two teeth. Like some sauropods, it
  had a tail club that would have been used for intraspecific combat or
  interspecific defense.
diet: herbivore
locomotion: quadrupedal
