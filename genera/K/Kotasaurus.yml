genus: Kotasaurus
parent: Sauropoda
etymology: "Named for the Kota Formation of Telangana, India, combined with
  Greek 'sauros' meaning 'lizard', hence 'Kota Formation lizard'. The species
  name refers to Yamanpalli, the village near the discovery site."
pronunciation:
  phonetic: KOH-tuh-SOR-uhs
  ipa: /ˌkoʊtəˈsɔːrəs/
description: Kotasaurus is a genus of sauropod dinosaur from the Early
  Jurassic period (Sinemurian-Pliensbachian). The only known species is
  Kotasaurus yamanpalliensis. It was discovered in the Kota Formation of
  Telangana, India and shared its habitat with the related Barapasaurus. So
  far the remains of at least 12 individuals are known. The greater part of
  the skeleton is known, but the skull is missing, with the exception of two
  teeth. Four tail clubs, each formed of at least two co-ossified distal
  caudal vertebrae, were collected with the Yamanpalli material and referred
  to Kotasaurus on that association; comparable clubs are known in Shunosaurus
  and Omeisaurus, and are interpreted as weapons for intraspecific combat or
  defense.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Dorsal neural spines simple, without spinal laminae.
  - No pneumatocoel at the base of the neural arch opening into the neural
    canal.
  - Iliac blade low.
  - Proximal surface of the scapula narrow.
  - Limb bones relatively slender, with the femur retaining the lesser
    trochanter.
  - Chevrons V-shaped, with well-developed articular facets on the dorsolateral
    corners.
appearance:
  features:
    - elongate neck
    - tail club
  integument: scaled
  evidence: inferred
