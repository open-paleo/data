genus: Koreaceratops
parent: Leptoceratopsidae
pronunciation:
  phonetic: ko-REE-uh-SERR-uh-tops
etymology: From 'Korea' (referring to South Korea, where it was discovered) combined with Greek 'keras' (horn) and 'ops' (face); meaning 'Korean horned face'
description: Koreaceratops is a genus of basal ceratopsian dinosaur discovered
  in Albian-aged (Early Cretaceous) rocks of South Korea.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Very tall neural spines over five times higher than associated centra in
    distal caudal vertebrae
  - Astragalus surface divided into two fossae by prominent craniocaudal ridge
    on proximal surface
  - Triangular-shaped calcaneum 1.5 times longer craniocaudally than astragalus
    in proximal view
  - Tallest neural spines in distal tail (caudals 22-28) rather than middle of
    tail
  - Caudal neural spines much longer than chevrons
appearance:
  integument: scaled
  evidence: inferred
