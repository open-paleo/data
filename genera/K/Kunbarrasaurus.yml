genus: Kunbarrasaurus
parent: Ankylosauria
etymology: From Wulguru language kunbarra (shield) combined with Greek sauros (lizard); meaning "shield lizard"
pronunciation:
  phonetic: KOON-ba-rah-SOR-rus
description: Kunbarrasaurus is an extinct genus of small ankylosaurian dinosaur
  from the Early Cretaceous of Australia. The genus contains a single species,
  K. ieversi.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - marine
diagnostic_features:
  - Cranial roof flat excluding slight arching of postorbital and nasal
  - Dorsal surfaces of prefrontal, supraorbital and postorbital form 90° angle
    with lateral surfaces
  - Supraorbital comprises single element
  - Prefrontal restricted to dorsal surface and does not contribute to orbit
  - Nasals do not contribute to lateral surface; restricted to dorsal surface
    and medially displaced nasal vestibule
  - Nasal vestibule completely formed by nasal bone, large relative to maxillary
    rostrum, fully exposed dorsally and laterally
  - Maxilla extends entire dorsoventral height of skull and contacts cranial
    roof at prefrontal
  - Caudal end of tooth row terminates ventral to caudal margin of orbit
  - Lacrimal vertically orientated
  - Pterygoids do not contact one another caudally near braincase; completely
    separated by basisphenoid
  - Long axis of quadrate vertically aligned
  - Coronoid process very pronounced
  - Braincase sidewall poorly ossified; cranial nerves traversed large bony
    apertures rather than discrete foramina
  - Inner ear extremely large in proportion to skull, morphologically unlike any
    other known dinosaur
  - Cranial dermal ossifications flat or with very shallow keel
  - No quadratojugal and squamosal horn or boss-like dermal ossifications present
appearance:
  features:
    - body armor
    - osteoderms
  integument: armored
  evidence: direct
