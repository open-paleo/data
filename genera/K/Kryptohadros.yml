genus: Kryptohadros
parent: Hadrosauromorpha
pronunciation:
  phonetic: KRIP-toh-HAD-ros
etymology: From Ancient Greek "kryptos" (hidden) and "hadros" (thick or bulky,
  commonly used in hadrosauroid names); meaning "hidden hadrosauroid".
description: Kryptohadros is an extinct genus of hadrosauroid ornithopod
  dinosaur known from the Late Cretaceous (Maastrichtian age) Densuș-Ciula
  Formation of Romania. The genus contains a single species, Kryptohadros
  kallaiae, known from a partial skull and skeleton. Phylogenetic analyses
  revealed Kryptohadros is closely related to the coeval Transylvanian
  Telmatosaurus and the Italian Tethyshadros, together forming a group of
  southeastern European-endemic taxa, called the Telmatosauridae. Kryptohadros
  is the second named non-hadrosaurid hadrosauroid from the Hațeg Basin,
  following Telmatosaurus, which was named by Franz Nopcsa in 1903.
dispute:
  summary: >
    Kryptohadros kallaiae is a non-hadrosaurid hadrosauroid described by
    Magyar and others (2026), who recovered it with Telmatosaurus and
    Tethyshadros in a proposed new family Telmatosauridae, outside
    Hadrosauridae.
  history:
    - date: "2026-06-27"
      note: Placed at Hadrosauromorpha following Magyar and others
        (2026); the proposed Telmatosauridae reflected, not adopted.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
