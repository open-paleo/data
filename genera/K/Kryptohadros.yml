genus: Kryptohadros
parent: Hadrosauromorpha
pronunciation:
  phonetic: KRIP-toh-HAD-ros
etymology: From Ancient Greek "kryptos" (hidden) and "hadros" (thick or bulky,
  commonly used in hadrosauroid names); meaning "hidden hadrosauroid".
dispute:
  summary: >
    Kryptohadros kallaiae is a non-hadrosaurid hadrosauroid described by
    Magyar and colleagues (2026), who recovered it with Telmatosaurus and
    Tethyshadros in a newly named clade, Telmatosauridae, outside
    Hadrosauridae.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
diagnostic_features:
  - Posterior edge of the coronoid process bears a well-developed triangular
    lobe extending posteriorly
  - Surangular bears both a surangular foramen and a glenoid foramen
  - Jugal process of the maxilla bears five small jugal tubercles that gradually
    decrease in size from the ventral-most to the dorsal-most
  - Well-developed buccal shelf along the laterodorsal edge of the dentary
  - Meckelian canal reaches the anterior end of the symphysis on the ventral
    side of the dentary
  - Ventrolaterally directed splenial process
identifiers:
  - source: pbdb
    id: "519378"
  - source: wikidata
    id: Q138537431
species:
  - name: Kryptohadros kallaiae
    etymology: Named for Csilla Kállai, the mother of lead author János Magyar.
    status: valid
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Maastrichtian
    location:
      country: RO
      region: RO-HD
      locality: Fântânele-3
      formation: Densuș-Ciula
      part: middle
      notes: Magyar and colleagues (2026) place the type locality in "the lower
        part of the Middle Member of the Densuș-Ciula Formation".
    type_specimen:
      specimen_id: [LPB (FGGUB) R.2882]
      specimen_type: holotype
      institution: LPB-RO
      material: Partial skull, dorsal rib fragments, caudal vertebrae, a neural
        spine fragment, chevrons, and a partial hindlimb.
      completeness: partial
    erected_in: magyar2026a
references:
  - id: magyar2026a
    notes: Erects Kryptohadros kallaiae and names the clade Telmatosauridae.
