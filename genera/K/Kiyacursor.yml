genus: Kiyacursor
parent: Noasauridae
etymology: Named after the Kiya River in Kemerovo Oblast, Russia, where fossils were found, combined with Latin 'cursor' (runner); meaning 'Kiya River runner'
description: Kiyacursor is an extinct genus of noasaurid theropod dinosaur from
  the Early Cretaceous Ilek Formation of Russia. The genus contains a single
  species, K. longipes, known from a partial skeleton. Kiyacursor represents the
  first Early Cretaceous ceratosaur discovered in Asia, as well as the second
  non-avian theropod named from Russia, after Kileskus in 2010.
diet: carnivore
locomotion: bipedal
