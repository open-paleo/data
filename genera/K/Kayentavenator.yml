genus: Kayentavenator
parent: Neotheropoda
dispute:
  summary: >
    Kayentavenator elysiae, based on an immature partial skeleton, was described as a
    basal tetanuran closer to Allosaurus than to coelophysoids (Gay, 2010), but
    subsequent work treats the holotype as a specimen of the coelophysoid "Syntarsus"
    (Megapnosaurus) kayentakatae, making Kayentavenator a possible junior synonym
    (Ezcurra, 2012, 2017). Because the tetanuran and coelophysoid hypotheses span
    Neotheropoda, it is placed conservatively at Neotheropoda incertae sedis.
  history:
    - date: "2026-07-02"
      note: Moved from Tetanurae to Neotheropoda incertae sedis; the describer's tetanuran interpretation and the competing coelophysoid synonymy with "Syntarsus" kayentakatae are both unresolved.
etymology: Named after the Kayenta Formation of northeastern Arizona combined
  with Latin venator (hunter); meaning "Kayenta hunter"
pronunciation:
  phonetic: KAI-en-tuh-VEN-uh-tuh
description: Kayentavenator is a genus of small carnivorous theropod dinosaur
  that lived during the Early Jurassic Period. Fossils were recovered from the
  Kayenta Formation of northeastern Arizona, and were described in 2010. Its
  affinities are contested, with interpretations ranging from a basal tetanuran to
  a coelophysoid.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - arid
diagnostic_features:
  - Ellipsoid acetabulum
  - Fusion between the greater trochanter and the head of the femur
  - Prominent mediodistal crest extending 50% of the femur length
  - Prominent accessory condyle on the medial femoral condyle
  - Groove in dorsal surface of the femoral head extending laterally
  - Highly constricted caudal centra
appearance:
  integument: scaled
  evidence: inferred
