genus: Kayentavenator
parent: Tetanurae
etymology: Named after the Kayenta Formation of northeastern Arizona combined with Latin venator (hunter); meaning "Kayenta hunter"
description: Kayentavenator is a genus of small carnivorous tetanuran dinosaur
  that lived during the Early Jurassic Period. Fossils were recovered from the
  Kayenta Formation of northeastern Arizona, and were described in 2010.
