genus: Koreanosaurus
parent: Orodrominae
description: Koreanosaurus is a genus of orodromine neornithischian dinosaur
  that lived during the Campanian stage of the Late Cretaceous of what is now
  South Korea. One species has been described, Koreanosaurus boseongensis.
