genus: Koreanosaurus
parent: Orodrominae
etymology: From 'Koreano-' (pertaining to Korea) and Greek 'sauros' (lizard); meaning 'Korean lizard'
pronunciation:
  phonetic: ko-ree-AH-no-SOR-us
description: Koreanosaurus is a genus of orodromine neornithischian dinosaur
  that lived during the Campanian stage of the Late Cretaceous of what is now
  South Korea. One species has been described, Koreanosaurus boseongensis.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Elongated anterior cervicals with ratio of maximum length (pre- to
    postzygapophyses) to transverse width about 2.7
  - Blade-like keel on ventral surface of all cervical centra; sharp ventral
    keel on at least first seven dorsal centra
  - Fused scapulocoracoid plate
  - Highly-keeled posterior border of proximal ulna
  - Femoral head and shaft forming obtuse 135° angle
  - Femoral head anteroposteriorly elongated
  - Low hindlimb ratio of 1.07 (tibia/femur)
  - Extreme pectoral girdle development with humerus and scapula somewhat longer
    than femur
appearance:
  integument: scaled
  evidence: direct
