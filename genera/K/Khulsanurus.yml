genus: Khulsanurus
parent: Parvicursorinae
etymology: Named after the Khulsan Locality in the Gobi Desert, Mongolia combined with Greek oura (tail); meaning "tail from Khulsan"
description: Khulsanurus is an extinct genus of alvarezsaurid theropod dinosaur
  from the Late Cretaceous Baruungoyot Formation of the Khulsan Locality in the
  Gobi Desert region of Mongolia. The type and only species is Khulsanurus
  magnificus.
diet: carnivore
