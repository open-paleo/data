genus: Khulsanurus
parent: Parvicursorinae
etymology: Named after the Khulsan Locality in the Gobi Desert, Mongolia combined with Greek oura (tail); meaning "tail from Khulsan"
description: Khulsanurus is an extinct genus of alvarezsaurid theropod dinosaur
  from the Late Cretaceous Baruungoyot Formation of the Khulsan Locality in the
  Gobi Desert region of Mongolia. The type and only species is Khulsanurus
  magnificus.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - arid
diagnostic_features:
  - Pleurocoels, carotid processes, and epipophyses absent on cervicals
  - Slightly convex posterior centrum condyle of anterior caudals
  - Prominent anterior and posterior bumps at neurocentral junction in anterior
    caudals
  - Dorsoventrally thick and subtriangular transverse process of anterior caudals
  - Prominent infrapostzygapophysial fossa on transverse process of anterior
    caudals
  - Short and mostly anteriorly directed prezygapophyses of anterior caudals
  - Neural arch lacking interzygapophyseal ridges with prominent dorsal
    depression around neural spine
appearance:
  integument: feathered
  evidence: inferred
