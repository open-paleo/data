genus: Kamuysaurus
parent: Saurolophinae
pronunciation:
  phonetic: kah-MOO-ee-SAWR-us
etymology: "From Ainu 'kamuy' meaning 'deity', the language of the original inhabitants of Hokkaido, combined with Greek 'sauros' meaning 'lizard'; the specific name japonicus is Neo-Latin for 'Japanese', referring to its provenance from Japan."
description: Kamuysaurus is a genus of herbivorous edmontosaurin saurolophine
  hadrosaurid dinosaur from Late Cretaceous (Maastrichtian) marine deposits of
  the Yezo Group (Hakobuchi Formation) in the Hobetsu area near the town of
  Mukawa, Hokkaido in Japan.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - marine
diagnostic_features:
  - Midpoint of quadratojugal notch positioned at three-quarters of quadrate
    length from dorsal end, most ventrally positioned among hadrosaurids
  - Short ascending process of surangular that does not reach coronoid process
    of dentary
  - Anterior inclination of neural spines in sixth to thirteenth dorsal
    vertebrae, unique to Kamuysaurus
  - Slender humerus with shaft less than 20% as wide as length, only in
    Kamuysaurus and Hadrosaurus among hadrosaurids
  - Subrectangular infratemporal fenestra, reversing to primitive condition
    within Edmontosaurini clade
