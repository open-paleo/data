genus: Kaijutitan
parent: Titanosauria
pronunciation:
  phonetic: KIE-joo-TIE-tan
etymology: "Named after 'kaiju', the type of giant monster from Japanese cinema, combined with 'titan' meaning giant. The species name refers to the Maui people of the Mapuche."
description: Kaijutitan is a genus of basal titanosaur dinosaur from the Sierra
  Barrosa Formation from Neuquén Province in Argentina. The type and only
  species is Kaijutitan maui.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Basal tuberosities width almost four times the foramen magnum width
  - Internal carotid artery foramen located posteriorly on basipterygoid
    processes
  - Bifid neural spine in anterior cervical vertebrae
  - Medial tuber located posteriorly between metapophyses in anterior cervical
    vertebrae
  - Spinopostzygapophyseal lamina bifurcated in spinal sector with deep
    pneumatic cavities
  - Posteroventral keel in anterior cervical vertebrae from convergent ridges
  - Accessory lamina in cervical vertebrae from postzygodiapophyseal to
    spinoprezygapophyseal lamina
  - Absence of proximal pneumatopores in dorsal ribs
  - Prespinal lamina triangular in anterior caudal vertebrae
  - Absence of ventromedial process in ventral margin of scapula
  - Tibial proximal condyle narrow with anteroposteriorly oriented long axis
  - Tibial cnemial crest projecting anteriorly
  - Astragalus with foramina at base of ascending process
appearance:
  features:
    - bifurcated cervical spines
  integument: scaled
  evidence: inferred
