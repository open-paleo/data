genus: Kuszholia
parent: Avialae
placement: incertae sedis
dispute:
  summary: >
    Kuszholia mengi is based on isolated pneumatic vertebrae and is of uncertain
    affinity. It has been treated as an ornithuromorph or ornithurine bird and as a
    possible enantiornithine, while other workers regard it as a non-avialan
    coelurosaur near bird ancestry; it is widely considered a nomen dubium. It is
    placed conservatively at Avialae incertae sedis.
  history:
    - date: "2026-07-01"
      note: Moved from Ornithurae to Avialae incertae sedis (the Ornithurae, Ornithuromorpha, and Enantiornithes branches were removed as empty); of dubious status.
etymology: From Kazakh qus joly (Milky Way, literally "bird road"); meaning "Milky Way bird"
description: Kuszholia is the name given to a genus of primitive birds or
  bird-like dinosaurs from the Late Cretaceous.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Transversely expanded synsacrum
  - Transverse processes located dorsally (at dorsal bone surface level) and
    oriented mostly laterally
  - Crista dorsalis reaching caudal margin of synsacrum
  - Large size (at least hen-sized)
appearance:
  integument: feathered
  evidence: inferred
