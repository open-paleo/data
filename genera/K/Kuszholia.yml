genus: Kuszholia
parent: Ornithurae
etymology: From Kazakh qus joly (Milky Way, literally "bird road"); meaning "Milky Way bird"
description: Kuszholia is the name given to a genus of primitive birds or
  bird-like dinosaurs from the Late Cretaceous.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Transversely expanded synsacrum
  - Transverse processes located dorsally (at dorsal bone surface level) and
    oriented mostly laterally
  - Crista dorsalis reaching caudal margin of synsacrum
  - Large size (at least hen-sized)
appearance:
  integument: feathered
  evidence: inferred
