genus: Kaatedocus
parent: Flagellicaudata
dispute:
  summary: >
    The family-level placement of Kaatedocus is disputed. Tschopp and Mateus
    (2012) and Tschopp et al. (2015) recovered it as a diplodocine diplodocid,
    sister to Barosaurus, and the Princeton Encyclopedia (Jones, 2026) follows
    this view. Whitlock and Wilson Mantilla (2020) instead recovered it as the
    basalmost dicraeosaurid on cranial characters, a result reproduced when
    Kaatedocus was added to an independent matrix; under that hypothesis the
    diplodocid characters previously cited for it are reinterpreted as more
    general flagellicaudatan features.
  history:
    - date: "2026-06-30"
      note: >
        Placed at Flagellicaudata, the least inclusive clade accepted by both
        hypotheses, pending resolution of its diplodocine (Tschopp et al., 2015)
        versus dicraeosaurid (Whitlock and Wilson Mantilla, 2020) placement.
etymology: "From Crow language 'kaate' meaning 'small' combined with Greek 'dokos' meaning 'beam', referring to the vertebrae; the name means 'small beam', alluding to its relatively small size compared to other diplodocids."
pronunciation:
  phonetic: kaht-uh-doh-kus
description: Kaatedocus is a genus of flagellicaudatan sauropod known from the
  middle Late Jurassic (Kimmeridgian stage) of northern Wyoming, United States.
  It is known from well-preserved skull and cervical vertebrae which were
  collected in the lower part of the Morrison Formation. The type and only
  species is Kaatedocus siberi, described in 2012 by Emanuel Tschopp and Octávio
  Mateus.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - U-shaped notch separating the frontals anteriorly
  - Squamosals restricted to the post-orbital region
  - Postparietal foramen present
  - Narrow, sharp and distinct sagittal nuchal crest on supraoccipital
  - Closed or very reduced preantorbital fenestra
  - At least 12 maxillary and dentary teeth not restricted to anteriormost jaw
  - Short mid-cervical centra with elongation index less than 4
  - Rugose tuberosity on anterodorsal corner of lateral surface of posterior
    cervical vertebrae
  - Posterior cervical neural spines narrowly diverging to subparallel
appearance:
  features:
    - whiplash tail
  integument: scaled
  evidence: inferred
