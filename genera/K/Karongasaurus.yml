genus: Karongasaurus
parent: Lithostrotia
etymology: Named after Karonga, the district in Malawi where fossils were found,
  combined with Greek 'sauros' (lizard); meaning 'Karonga lizard'
description: Karongasaurus is a genus of titanosaur sauropod dinosaur from the
  Early Cretaceous. The type species, K. gittelmani, was described by Elizabeth
  Gomani in 2005.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Dentary strongly curved towards symphysis
  - Rostral end of dentary not perpendicular to long axis
  - Dorsal margin of buccal surface flares outward anteriorly
  - Tooth row restricted to anterior portion of jaw
  - Pencillike teeth with wear facets oblique to labiolingual axis
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "66006"
  - source: wikidata
    id: Q137346
  - source: gbif
    id: "4967413"
species:
  - name: Karongasaurus gittelmani
    etymology: "Named in honor of Steve Gittelman for work as president of the
      Dinosaur Society."
    status: valid
    type_species: true
    period:
      name:
        - Early Cretaceous
      stage:
        - Aptian
    location:
      country: MW
      locality: Mwakasyunguti area
      region: MW-KR
      formation: Dinosaur Beds
      part: upper
      notes: Gomani (2005) gives the specimens as from "the same area of the
        Dinosaur Beds" near Mwakasyunguti, the holotype dentary from quarry
        CD-9; Winkler and colleagues (2000) place CD-9 in the upper member,
        above quarries "near the base of the upper member".
    size:
      length_m:
        min: 9.5
        max: 9.5
    type_specimen:
      specimen_id: [ Mal-175 ]
      specimen_type: holotype
      institution: MOM
      material: Dentary with conical replacement teeth.
      completeness: fragmentary
    erected_in: gomani2005a
references:
