    etymology: "Named in honor of Steve Gittelman for his work as president of the
      Dinosaur Society."
    status: valid
    type_species: true
    period:
      name:
        - Early Cretaceous
      stage:
        - Aptian
    location:
      country: MW
      locality: Mwakasyunguti area
      region: MW-N
      notes: The Dinosaur Beds that reference works give as this taxon's
