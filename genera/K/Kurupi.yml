genus: Kurupi
parent: Abelisauridae
dispute:
  summary: >
    Kurupi is a derived abelisaurid of uncertain subclade: Pol and
    colleagues (2024) list it among furileusaurians, but it is an unstable
    taxon and other treatments place it in an unresolved polytomy between
    Majungasaurinae and Brachyrostra.
  history:
    - date: "2026-06-30"
      note: >
        Placed at Abelisauridae, the least-inclusive uncontested node.
description: Kurupi itaata is an extinct species of abelisaurid theropod dinosaurs
  from the Late Cretaceous Marília Formation of Brazil. It is the only species
  in the genus Kurupi.
etymology: "Named for Kurupi, a god of fertility and sexuality from Guaraní mythology; chosen to reference the discovery of the holotype near a love hotel ('Motel Paraíso' / 'Paradise Motel')."
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
appearance:
  integument: scaled
  evidence: inferred
diagnostic_features:
  - First caudal vertebra with an anterolaterally projected triangular process
    placed below and at midlength of the anterior edge of the transverse process
  - First caudal vertebra with a notch at the anterodistal portion of the
    transverse process, between a shelf-like process and the anterodistal corner
    of the transverse process
  - Anterior caudal vertebrae with an anterodorsally projected cuneiform process
    on the dorsal surface of the transverse process, near the anterior base of
    the neural spine
  - Inclination of the transverse processes increasing from about 20 to 35
    degrees along the first third of the caudal series
