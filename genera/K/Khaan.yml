genus: Khaan
parent: Heyuanninae
pronunciation:
  ipa: /ˈkɑːn/
  phonetic: kahn
etymology: "From Mongolian 'khaan' (lord or ruler); named for the Mongolian word
  for a noble title"
description: Khaan is an extinct genus of oviraptorid dinosaur known from
  remains found in the Djadochta Formation of Mongolia, dating to the Late
  Cretaceous (Campanian, 75-71 million years ago).
diet: omnivore
locomotion: bipedal
paleoenvironment:
  - arid
diagnostic_features:
  - Metacarpal III not expanded proximally and does not contact the distal carpus
  - Long axis of oval narial opening more horizontally oriented
  - Nasals are fused
  - Dorsal process of premaxilla projects posterodorsally rather than vertical
  - Occiput is vertical rather than facing posterodorsal
  - Posteroventral part of dentary underlies the angular ventrally rather than
    overlapping it laterally
  - Coronoid eminence of the mandible is not as deep
appearance:
  integument: feathered
  evidence: inferred
