genus: Xunmenglong
parent: Compsognathidae
dispute:
  summary: >
    Xunmenglong was described as a small compsognathid in a polytomy with
    Compsognathus, Huaxiagnathus, and Juravenator, a placement Jones et al. (2026)
    follow. Cau (2024) instead recovered it among the earliest-diverging branches
    of Tetanurae, outside Coelurosauria. It is retained in Compsognathidae; the
    basal-tetanuran hypothesis is reflected in the Compsognathidae clade dispute.
  history:
    - date: "2026-07-01"
      note: Retained at Compsognathidae; basal-Tetanurae hypothesis (Cau, 2024) reflected at the clade level.
pronunciation:
  phonetic: shoon-MUNG-long
etymology: From Chinese xun ('swift'), meng ('fierce'), and long ('dragon'), meaning 'swift fierce dragon'
description: Xunmenglong is a genus of compsognathid theropod dinosaur from the
  Huajiying Formation of Hebei Province, China. The type and only species is
  Xunmenglong yinliangis. The holotype material consists of a pelvis, tail base
  and hindlimbs that had previously been part of a chimera containing three
  different animals. The animal is described as being the smallest known member
  of Compsognathidae, being about the size of the sub-adult Scipionyx holotype
  specimen, or approximately 50 centimeters (1.6 ft) in length.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
diagnostic_features:
  - Penultimate pedal phalanx IV-4 markedly longer than IV-3
  - Sacral and proximal caudal centra dorsoventrally taller than or as tall as
    anteroposteriorly long
  - Vertical neural spines of proximal caudal vertebrae taller dorsoventrally
    than or as tall as centrum length
  - Ilium with straight dorsal outline and rounded anterior margin in lateral
    view
  - Tibia markedly longer than predicted by allometric trend among theropods
    (tibia/femur ratio 1.53)
  - Three ossified distal tarsals II, III, and IV
