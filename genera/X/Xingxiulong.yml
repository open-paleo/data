genus: Xingxiulong
parent: Sauropodiformes
placement: incertae sedis
etymology: "Named for the Xingxiu Bridge (Xingxiu meaning 'constellation' in Chinese) in Yunnan, China, combined with Chinese 'long' meaning 'dragon'."
pronunciation:
  phonetic: sheeng-SHAH-long
description: Xingxiulong is a genus of bipedal massopodan sauropodomorph from
  the Early Jurassic of China. It contains two species; the type species is X.
  chengi, described by Wang et al. in 2017 from three specimens, two adults and
  an immature individual, that collectively constitute a mostly complete
  skeleton. Adults of this species measured 4-5 meters (13-16 ft) long and 1-1.5
  meters (3.3-4.9 ft) tall. A second species, X. yueorum, was described by Chen
  et al. in 2025 based on a partial articulated postcranial skeleton of an adult
  individual larger than X. chengi.
dispute:
  summary: >
    Xingxiulong chengi was described as a basal sauropodiform, sister to
    Jingshanosaurus (Wang and others, 2017), but a basal massopodan
    position is only slightly less parsimonious and is recovered by some
    analyses (Wang and others, 2025).
  history:
    - date: "2026-06-29"
      note: Placed at Sauropodiformes incertae sedis following its describers; the basal-Massopoda alternative is recorded.
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diet: herbivore
diagnostic_features:
  - transversely expanded plate-like summit on top of posterior dorsal neural
    spines
  - four sacral vertebrae with two primordial sacrals bounded by dorsosacral and
    caudosacral
  - robust scapula with both ends extremely expanded
  - ilium with ventral margin of postacetabular process strongly concave
  - pubis with elongated proximal pubic plate approximately 40% of total pubic
    length
  - posterolateral process of distal tibia much narrower and extended more
    laterally and distally than anterolateral process
  - metatarsal V with markedly expanded proximal end approximately 85% of total
    length
  - angular and surangular extended more anteriorly beyond external mandibular
    fenestra
appearance:
  integument: scaled
  evidence: inferred
