genus: Xingxiulong
parent: Sauropodiformes
etymology: Xingxiu Bridge dragon
description: Xingxiulong is a genus of bipedal massopodan sauropodomorph from
  the Early Jurassic of China. It contains two species; the type species is X.
  chengi, described by Wang et al. in 2017 from three specimens, two adults and
  an immature individual, that collectively constitute a mostly complete
  skeleton. Adults of this species measured 4–5 metres (13–16 ft) long and 1–1.5
  metres (3.3–4.9 ft) tall. A second species, X. yueorum, was described by Chen
  et al. in 2025 based on a partial articulated postcranial skeleton of an adult
  individual larger than X. chengi.
locomotion: bipedal
diet: herbivore
