genus: Xiangyunloong
parent: Massopoda
etymology: From Chinese 'Xiangyun' (auspicious clouds), the name of the
  county where the specimen was found, and 'loong', the Pinyin for the
  traditional Chinese dragon symbolizing power and auspiciousness.
pronunciation:
  phonetic: shyahng-yun-loong
description: Xiangyunloong is a genus of non-sauropodan massopodan
  sauropodomorph dinosaur known from the Early Jurassic Fengjiahe
  Formation at Daaonai, Xiangyun County, Yunnan Province, China. The
  genus contains a single species, Xiangyunloong fengming, known from a
  partial postcranial skeleton of a skeletally mature individual
  estimated at about 9–10 m in length.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
  - fluvial
diagnostic_features:
  - Lateral expansion developed at the middle region of the dorsal end of
    cervical neural spines.
  - Hyposphene of dorsal vertebrae equal to or greater than the height of the
    neural canal.
  - Highly developed posterodorsal corner present at the neural spine of the
    last dorsal vertebra.
  - Presence of a prezygapophyseal centrodiapophyseal fossa (PRCDF) in the first
    caudal vertebra, framed by ACDL, CPRL, and PRDL laminae.
  - Ilium with anteroposteriorly reduced but laterally and ventrally flaring
    supracetabular crest.
