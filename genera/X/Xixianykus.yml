genus: Xixianykus
parent: Parvicursorinae
pronunciation:
  phonetic: shee-SHYAH-NY-kus
etymology: From Xixia County, Henan Province, China (where the fossil was found) and Greek onyx ('claw'), meaning 'Xixia claw'
description: Xixianykus is a genus of alvarezsaurid theropod dinosaur known from
  a slab of rock which contains a partial postcranial skeleton unearthed in the
  Late Cretaceous (Coniacian-Santonian) Majiacun Formation of the Xixia Basin in
  Henan, China.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - sacral rib-transverse process complexes and zygapophyses fused to form
    separate anterior and posterior laminae
  - distinct fossa dorsal to antitrochanter on lateral surface of ilium
  - short ridge along posterior surface of pubic shaft near proximal end
  - distinct depression on lateral surface of ischium near proximal end
  - sharp groove along posterior surface of ischium
  - distal end of femur with transversely narrow ectocondylar tuber extending
    proximally as sharp ridge
  - transversely narrow tibial cnemial crest with sharp, ridgelike distal half
  - lateral margin of tibiotarsus forms step near distal end
  - fibula with substantial extension of proximal articular surface onto
    posterior face of shaft
  - distal tarsals and metatarsals co-ossified to form tarsometatarsus
  - sharp flange along anteromedial margin of metatarsal IV near proximal end
appearance:
  integument: feathered
  evidence: inferred
