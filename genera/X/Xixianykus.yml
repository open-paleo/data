genus: Xixianykus
parent: Parvicursorinae
etymology: From Xixia County, Henan Province, China (where the fossil was found) and Greek onyx ('claw'), meaning 'Xixia claw'
description: Xixianykus is a genus of alvarezsaurid theropod dinosaur known from
  a slab of rock which contains a partial postcranial skeleton unearthed in the
  Late Cretaceous (Coniacian-Santonian) Majiacun Formation of the Xixia Basin in
  Henan, China.
diet: carnivore
locomotion: bipedal
