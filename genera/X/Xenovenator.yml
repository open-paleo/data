genus: Xenovenator
parent: Troodontinae
dispute:
  summary: >
    Xenovenator espinosai, a thick-skulled Mexican troodontid, was recovered
    within Troodontinae by its describers (Rivera-Sylva et al., 2026), who placed
    it in a new tribe Troodontini (with Albertavenator and the North American
    Troodon complex). The tribe is not adopted here as a node (single analysis); the
    genus is placed in Troodontinae.
  history:
    - date: "2026-07-01"
      note: Moved from Troodontini (tribe dropped) to Troodontinae following Rivera-Sylva et al. (2026).
etymology: From Greek xenos ('strange') and Latin venator ('hunter'), meaning 'strange hunter'
pronunciation:
  phonetic: ZEE-no-VEN-uh-tuh
description: Xenovenator is an extinct genus of troodontid theropod dinosaurs
  known from the Late Cretaceous (Campanian age) of North America. The type
  species of the genus, Xenovenator espinosai, is known from fragmentary skull
  bones found in the Cerro del Pueblo Formation of Mexico. It is characterized
  by an unusually expanded and rugose skull roof, somewhat comparable to that
  seen in pachycephalosaurs. This may imply Xenovenator individuals engaged in
  combat with other members of their species, a behavior for which adaptations
  had not been previously observed in non-avian paravians.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Frontals extensively fused with strongly interdigitating sutures
  - Strong doming of frontals projecting above orbital margins
  - Frontals and parietals massively thickened (up to 12 mm posteriorly) with
    variable thickness
  - Dorsal surface of frontals and parietals rugose and striated with transverse
    ridge texture
  - Nasal processes broad and transversely arched between lacrimals forming
    broad midline ridge
  - Orbital fossae widely separated ventrally with orbital margins expanded
    laterally
  - Triangular parietal table just behind frontoparietal suture, not seen in
    other troodontids
  - Laterosphenoids and orbitosphenoids strongly expanded anteriorly to enclose
    braincase ventrally
  - Supratemporal fossae extend strongly anterolaterally with frontoparietal
    suture projecting posteriorly
  - L-shaped frontal-lacrimal contact with complex posterior and medial facets
appearance:
