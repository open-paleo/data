genus: Xiongguanlong
parent: Tyrannosauroidea
pronunciation:
  ipa: /ɕiʊŋˌkwaːnˈlʊŋ/
  phonetic: zhong-GWAN-long
etymology: "From Chinese 'Xiong Guan' meaning 'grand pass', referring to Jiayuguan City (historically called Xiong Guan), and Chinese 'long' meaning 'dragon'."
description: Xiongguanlong is an extinct genus of tyrannosauroid theropod from
  the Early Cretaceous period of what is now China. The type and only species is
  X. baimoensis. The generic name comes from Jiayuguan City (formerly called
  "Xiong Guan" or "grand pass") and the Mandarin word "long" which means dragon.
  The specific epithet, "baimoensis" is a latinization of the Mandarin word for
  "white ghost" in reference to one of the geological features of the type
  locality (nicknamed the "White Ghost Castle").
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
diagnostic_features:
  - Uniquely elongate preorbital region reaching over two-thirds of skull length
  - Narrow and elongate muzzle resembling that of Alioramus
  - Slender, unornamented nasals lacking dorsal rugosities and vaulting
  - Narrow and mediolaterally compressed maxillary tooth crowns bearing
    serrations
  - Single pair of pneumatic foramina on each cervical (unlike double pairs in
    derived taxa)
  - Mediolaterally constricted anterior dorsal centra
appearance:
  features:
    - elongate snout
  integument: unknown
