genus: Xiongguanlong
parent: Tyrannosauroidea
pronunciation:
  ipa: /ɕiʊŋˌkwaːnˈlʊŋ/
description: Xiongguanlong is an extinct genus of tyrannosauroid theropod from
  the Early Cretaceous period of what is now China. The type and only species is
  X. baimoensis. The generic name comes from Jiayuguan City (formerly called
  "Xiong Guan" or "grand pass") and the Mandarin word "long" which means dragon.
  The specific epithet, "baimoensis" is a latinization of the Mandarin word for
  "white ghost" in reference to one of the geological features of the type
  locality (nicknamed the "White Ghost Castle").
diet: carnivore
