genus: Xiyunykus
parent: Alvarezsauroidea
etymology: From Mandarin xiyu meaning 'west' (referring to Western China where it was found) combined with Greek onyx meaning 'claw'; translates as 'western claw'
pronunciation:
  phonetic: zee-YOO-nick-us
description: Xiyunykus is a genus of alvarezsauroid theropod from the Early
  Cretaceous-aged Tugulu Group of what is now China. Only one species has been
  described, Xiyunykus pengi.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
diagnostic_features:
  - Large basal tubera formed exclusively by basioccipital
  - Basisphenoid recess with basioccipital contribution containing multiple deep
    fossae
  - Cultriform process with poorly ossified dorsal margin that parallels ventral
    margin in lateral view
  - Two horizontally arranged pneumatic fossae on lateral central surface of
    each anterior or middle cervical vertebra
  - Distinct tubercle along ventrolateral edge of each anterior cervical centrum
  - Deep, curved groove on scapular lateral surface immediately anterior to
    glenoid fossa
appearance:
  integument: feathered
  evidence: inferred
