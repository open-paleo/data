    notes: Gives the holotype horizon as the upper Tugulu Group at Wucaiwan, "(Barremian-Aptian?)".
  - id: fowler2020b
    notes: Lists Xiyunykus from the Tugulu Group at "~Barremian–Aptian".
  - id: meso2024a
    notes: Places Xiyunykus "from the upper section of the Barremian–Aptian Tugulu Group".
