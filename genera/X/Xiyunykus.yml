genus: Xiyunykus
parent: Alvarezsauroidea
etymology: From Mandarin xiyu meaning 'west' (referring to Western China where it was found) combined with Greek onyx meaning 'claw'; translates as 'western claw'
pronunciation:
  phonetic: zee-YOO-nick-us
description: Xiyunykus is a genus of alvarezsauroid theropod from the Early
  Cretaceous-aged Tugulu Group of what is now China. Only one species has been
  described, Xiyunykus pengi.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
diagnostic_features:
  - Large basal tubera formed exclusively by basioccipital
  - Basisphenoid recess with basioccipital contribution containing multiple deep
    fossae
  - Cultriform process with poorly ossified dorsal margin that parallels ventral
    margin in lateral view
  - Two horizontally arranged pneumatic fossae on lateral central surface of
    each anterior or middle cervical vertebra
  - Distinct tubercle along ventrolateral edge of each anterior cervical centrum
  - Deep, curved groove on scapular lateral surface immediately anterior to
    glenoid fossa
appearance:
  integument: feathered
  evidence: inferred
identifiers:
  - source: pbdb
    id: "391218"
  - source: wikidata
    id: Q56249760
  - source: gbif
    id: "11209597"
species:
  - name: Xiyunykus pengi
    etymology: "Named in honor of Professor Peng Xiling for his contributions to the study of geology in Xinjiang."
    status: valid
    type_species: true
    period:
      name:
        - Early Cretaceous
      stage:
        - Barremian
        - Aptian
    location:
      country: CN
      locality: Wucaiwan area
      region: CN-XJ
      group: Tugulu
      part: upper
      notes: >
        Xu and colleagues (2018) give the horizon as "Upper Cretaceous
        (Barremian-Aptian?) upper part of the Tugulu Group"; both stages are
        Lower Cretaceous, so "Upper Cretaceous" is a slip. The Valanginian
        dates for the Tugulu Group concern its lower formations in the
        northwest of the Junggar Basin, not the upper part at Wucaiwan.
    size:
      length_m:
        min: 2.1
        max: 2.1
      weight_kg:
        min: 15
        max: 15
      hip_height_m:
        min: 0.6
        max: 0.6
    erected_in: xu2018c
    type_specimen:
      specimen_id: [IVPP V22783]
      specimen_type: holotype
      institution: IVPP
      material: Partial, disarticulated skeleton
      completeness: partial
references:
