genus: Xiaotingia
parent: Eumaniraptora
placement: incertae sedis
dispute:
  summary: >
    Xiaotingia has been recovered in many positions: as an archaeopterygid at the
    base of Deinonychosauria (Xu et al., 2011), as an anchiornithid on the avialan
    stem (Foth and Rauhut, 2017; Pei et al., 2020; Xu et al., 2023; Jones et al.,
    2026), as a more stemward avialan outside the anchiornithids (Foth et al.,
    2025), as a sinovenatorine troodontid (Hartman et al., 2019), and as a basal
    scansoriopterygid (Lefèvre et al., 2017). The competing avialan and
    deinonychosaur hypotheses agree only on Eumaniraptora, where it is placed.
  history:
    - date: "2026-07-01"
      note: Moved from Paraves to Eumaniraptora incertae sedis — the two-camp consensus (anchiornithid-avialan versus troodontid); the lone basal-scansoriopterygid recovery (Lefèvre et al., 2017) is noted but does not control the placement.
etymology: "Named in honor of Chinese paleontologist Zheng Xiaoting; the generic name is derived from Xiaoting, the first part of Zheng's given name"
pronunciation:
  phonetic: shyow-TIN-gee-uh
description: Xiaotingia is a genus of paravian theropod dinosaur, possibly an
  anchiornithid, from Middle Jurassic or early Late Jurassic deposits of western
  Liaoning, China. It contains a single species, Xiaotingia zhengi.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
  - forested
diagnostic_features:
  - maxillary posterior ramus depth at mid-length exceeds dentary depth
  - surangular has little lateral exposure and forms a wide, flat dorsal surface
    over posterior mandible
  - extremely large surangular foramen extends over more than 6% of total
    mandibular length
  - posterior end of mandible is blunt and dorsoventrally expanded
  - anteriormost caudal centra less than half as long as posterior dorsal centra
  - metacarpal IV more robust than metacarpals II and III
  - manual phalanx III-2 longer than metacarpal III
appearance:
  features:
    - feathered wings
    - hindlimb feathers
    - enlarged pedal claws
  integument: feathered
  evidence: direct
