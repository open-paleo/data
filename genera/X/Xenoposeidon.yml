genus: Xenoposeidon
parent: Rebbachisauridae
dispute:
  summary: >
    Originally described as a neosauropod of uncertain affinity (Taylor and
    Naish, 2007) and later treated as a nomen dubium by some, Xenoposeidon was
    reinterpreted as the earliest known rebbachisaurid on the basis of a shared
    neural-arch lamina arrangement (Taylor, 2018), a placement resting on
    morphological argument rather than a numerical analysis. A competing
    titanosaur interpretation has also been raised.
  history:
    - date: "2026-06-30"
      note: >
        Placed at Rebbachisauridae following Taylor (2018) and the Princeton
        Encyclopedia (Jones, 2026); the assignment rests on a single shared
        character and has not yet been tested in a quantitative analysis.
etymology: From Greek xenos meaning 'strange' or 'alien' and Poseidon (the Greek god of the sea), in allusion to the sauropod genus Sauroposeidon; translates as 'strange Poseidon'
pronunciation:
  phonetic: ZEE-no-puh-SYE-don
description: Xenoposeidon is a genus of rebbachisaurid sauropod dinosaur from
  the Early Cretaceous of England, living about 140 million years ago. It is
  known from a single partial vertebra with unusual features, unlike those of
  other sauropods. This bone was first discovered in the early 1890s but
  received little attention until it was found by University of Portsmouth
  student Mike Taylor, who formally described and named it in 2007 with Darren
  Naish.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Neural arch covers dorsal surface of centrum, with posterior margin
    continuous with cotyle
  - Neural arch slopes anteriorly 35 degrees relative to the vertical
  - Broad, flat area of featureless bone on lateral face of neural arch
  - Accessory infraparapophyseal and postzygapophyseal laminae meeting ventrally
    to form a V
  - "Neural canal is asymmetric: small and circular posteriorly but tall and
    teardrop-shaped anteriorly"
  - Supporting laminae form vaulted arch over anterior neural canal
