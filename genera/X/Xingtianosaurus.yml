genus: Xingtianosaurus
parent: Caudipterygidae
pronunciation:
  phonetic: shing-TYEN-oh-SAWR-us
etymology: Named after Xingtian, a Chinese deity who continued to fight after being decapitated, referencing the skull-less holotype specimen, plus Greek sauros ('lizard')
description: Xingtianosaurus is an extinct genus of oviraptorosaurian theropod
  dinosaur that lived in what is now China during the Early Cretaceous. The type
  and only species, X. ganqi, was named and described in 2019. It was placed in
  the Caudipteridae, alongside Caudipteryx and Similicaudipteryx.
diet: omnivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
  - forested
diagnostic_features:
  - Small pleurocoel close to the dorsal edge of the lateral surface of the
    dorsal vertebral centrum
  - Humerus longer than the scapula
  - Proportionally long ulna subequal in length to the humerus
  - Relatively small radiale angle of approximately 39° compared to >48° in
    other oviraptorosaurs
  - Extremely short metacarpal I less than 40% the length of metacarpal II
  - Small ligament pits on the manual phalanges, dorsally located
appearance:
  integument: feathered
  evidence: inferred
