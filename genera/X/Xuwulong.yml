genus: Xuwulong
parent: Hadrosauroidea
etymology: "Named after pioneering Gansu Province geologist Wang Yue-lun, known by his courtesy name 'Xu-wu', combined with Chinese 'long' meaning 'dragon'"
description: Xuwulong is a genus of hadrosauroid dinosaur from the Early
  Cretaceous period of what is now Yujingzi Basin in the Jiuquan area, Gansu
  Province of northwestern China. It is known from the holotype, GSGM F00001, an
  articulated specimen including a complete cranium, almost complete axial
  skeleton, and complete left pelvic girdle recovered from the Xinminbao Group.
  Xuwulong was named by You Hailu, Li Daqing, and Liu Weichang in 2011, and the
  type species is Xuwulong yueluni; the binomial name as a whole refers to
  Professor Wang Yue-lun; "Xu-wu" is his courtesy name.
