genus: Xixiasaurus
parent: Troodontidae
pronunciation:
  ipa: /ˌʃiːʃiəˈsɔːrəs/
description: Xixiasaurus is a genus of troodontid dinosaur that lived during the
  Late Cretaceous Period in what is now China. The only known specimen was
  discovered in Xixia County, Henan Province, in central China, and became the
  holotype of the new genus and species Xixiasaurus henanensis in 2010. The
  names refer to the areas of discovery, and can be translated as "Henan Xixia
  lizard". The specimen consists of an almost complete skull (except for the
  hindmost portion), part of the lower jaw, and teeth, as well as a partial
  right forelimb.
diet: carnivore
