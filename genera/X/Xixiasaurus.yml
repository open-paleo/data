genus: Xixiasaurus
parent: Troodontidae
dispute:
  summary: >
    Xixiasaurus is a poorly understood, unserrated-toothed troodontid whose
    position varies widely across analyses — near Byronosaurus, with Sinovenator
    and Mei, with Zanabazar and Saurornithoides, or paired with Sinusonasus
    (Hartman et al., 2019) — and Jones et al. (2026) conclude its placement will
    remain ambiguous without more material. It is placed at Troodontidae incertae
    sedis.
  history:
    - date: "2026-07-01"
      note: Placed at Troodontidae incertae sedis (least-inclusive uncontested clade); highly unstable across analyses.
pronunciation:
  ipa: /ˌʃiːʃiəˈsɔːrəs/
  phonetic: SHE-shah-SOR-us
etymology: "Named for Xixia County, Henan Province, China, where the holotype was discovered, combined with Greek 'sauros' meaning 'lizard', translatable as 'Henan Xixia lizard'."
description: Xixiasaurus is a genus of troodontid dinosaur that lived during the
  Late Cretaceous Period in what is now China. The only known specimen was
  discovered in Xixia County, Henan Province, in central China, and became the
  holotype of the new genus and species Xixiasaurus henanensis in 2010. The
  names refer to the areas of discovery, and can be translated as "Henan Xixia
  lizard". The specimen consists of an almost complete skull (except for the
  hindmost portion), part of the lower jaw, and teeth, as well as a partial
  right forelimb.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Fewer maxillary teeth (22) than Byronosaurus (>30) and Mei (24)
  - Distinct opening on the lateral surface of the base of the nasal process of
    the premaxilla
  - Rostral end of the upper jaw forming a tapered U-shape in ventral view
  - Mandibular symphyseal region slightly inflected medially
  - Unserrated teeth on anterior and posterior carinae, unlike most other
    troodontids
