  - id: jones2026b
    notes: Source of the body length estimate.
  - id: barrett2024a
    notes: Finds Xixiposaurus among the taxa with multiple most parsimonious
      positions and excludes it from the reduced consensus.
  - id: barrett2026a
    notes: Finds Xixiposaurus among the taxa with multiple most parsimonious
      positions and removes it from the reduced consensus.
  - id: wang2025a
    notes: Calls Xixiposaurus possibly a massospondylid, with Lufengosaurus,
