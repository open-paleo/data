genus: Xixiposaurus
parent: Plateosauridae
etymology: The generic name, Xixiposaurus, refers to the village of Xixipo in
  Lufeng County, Yunnan, China, where the holotype, a partial skeleton with
  skull named ZLJ01018, was discovered. The specific name, suni, refers to
  Professor Sun Ge of Jilin University.
description: Xixiposaurus is a genus of "prosauropod" dinosaur which existed in
  what is now Lower Lufeng Formation, China during the lower Jurassic period. It
  was first named by Sekiya Toru in 2010 and the type species is X. suni.
