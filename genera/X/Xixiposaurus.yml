genus: Xixiposaurus
parent: Plateosauridae
etymology: "Named for the village of Xixipo in Lufeng County, Yunnan, China,
  where the holotype was discovered, combined with Greek 'sauros' meaning
  'lizard'."
pronunciation:
  phonetic: she-SHEE-po-SOR-us
description: Xixiposaurus is a genus of "prosauropod" dinosaur which existed in
  what is now Lower Lufeng Formation, China during the lower Jurassic period. It
  was first named by Sekiya Toru in 2010 and the type species is X. suni.
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diet: herbivore
diagnostic_features:
  - Steep slant of skull roof in lateral view
  - Maximum height of mandible larger than twice the minimum height of the
    dentary
  - 4th cervical centrum longest among cervicals
  - Minimum width of pubic apron wider than width of pubic peduncle of ilium
  - Fourth trochanter with V-shaped notch in lateral view
appearance:
  integument: scaled
  evidence: inferred
