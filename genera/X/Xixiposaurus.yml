genus: Xixiposaurus
parent: Plateosauria
placement: incertae sedis
etymology: "Named for the village of Xixipo in Lufeng County, Yunnan, China,
  where the holotype was discovered, combined with Greek 'sauros' meaning
  'lizard'."
pronunciation:
  phonetic: she-SHEE-po-SOR-us
description: Xixiposaurus is a genus of "prosauropod" dinosaur which existed in
  what is now Lower Lufeng Formation, China during the lower Jurassic period. It
  was first named by Sekiya Toru in 2010 and the type species is X. suni.
dispute:
  summary: >
    Sekiya (2010) recovers Xixiposaurus suni as the sister of Mussaurus
    within a Plateosauridae that includes Plateosaurus. Wang and colleagues
    (2025) and Hu and colleagues (2026) call it a possible massospondylid
    without analyzing it, and Barrett and colleagues (2024, 2026) find it
    taking several equally parsimonious positions and prune it from their
    consensus. It is placed at Plateosauria incertae sedis.
  history:
    - date: "2026-06-29"
      note: Placed at Massopoda incertae sedis; Massospondylidae and Sauropodiformes alternatives are unresolved.
    - date: "2026-10-16"
      note: >
        Moved from Massopoda to Plateosauria incertae sedis, the level
        shared by the plateosaurid and massospondylid readings; summary
        rewritten with its sources.
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diet: herbivore
diagnostic_features:
  - Steep slant of skull roof in lateral view
  - Maximum height of mandible larger than twice the minimum height of the
    dentary
  - 4th cervical centrum longest among cervicals
  - Minimum width of pubic apron wider than width of pubic peduncle of ilium
  - Fourth trochanter with V-shaped notch in lateral view
appearance:
  integument: scaled
  evidence: inferred
identifiers:
