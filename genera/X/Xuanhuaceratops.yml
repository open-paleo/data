genus: Xuanhuaceratops
parent: Chaoyangsauridae
etymology: Named after Xuanhua (a district in Hebei Province, China, near the
  discovery site), combined with Greek keras meaning 'horn' and ops meaning
  'face'; translates as 'Xuanhua horned face'
pronunciation:
  phonetic: schwan-ha-SEH-ruh-tops
description: Xuanhuaceratops is a genus of dinosaur from the Late Jurassic
  Period. The genus was in 2006 dated to the Tithonian, 150.8-145.5 million
  years ago. A member of the family Chaoyangsauridae, it was one of the earliest
  ceratopsians. The fossils were found in the Houcheng Formation of Hebei
  Province, northeastern China.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Single premaxillary tooth unlike other ceratopsians with premaxillary
    dentition
  - Small overlap between quadratojugal and quadrate at caudal end of
    infratemporal fenestra
  - Quadrate shafts directed obliquely caudoventrally
  - Quadrate condyles separated by deep saddle-shaped sulcus
  - Medial face of mandibular glenoid region thickened into semilunar process
  - External surface of dentary thickened and sculptured with anastomosing
    grooves and ridges
appearance:
  integument: scaled
  evidence: inferred
