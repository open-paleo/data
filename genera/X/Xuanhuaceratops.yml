genus: Xuanhuaceratops
parent: Chaoyangsauridae
etymology: Xuanhua horned face
description: Xuanhuaceratops is a genus of dinosaur from the Late Jurassic
  Period. The genus was in 2006 dated to the Tithonian, 150.8-145.5 million
  years ago. A member of the family Chaoyangsauridae, it was one of the earliest
  ceratopsians. The fossils were found in the Houcheng Formation of Hebei
  Province, northeastern China.
diet: herbivore
locomotion: bipedal
