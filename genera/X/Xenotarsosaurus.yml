genus: Xenotarsosaurus
parent: Abelisauridae
pronunciation:
  phonetic: zen-o-TAR-so-SAWR-us
etymology: From Greek xenos ('strange'), tarsos ('tarsus' or 'ankle'), and
  sauros ('lizard'), meaning 'strange ankle lizard', referring to the
  exceptional build of the ankle
description: Xenotarsosaurus is a genus of abelisaurid theropod dinosaur that
  lived during the Late Cretaceous of Argentina.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Anterior dorsal vertebrae with centrum wider than tall and anterior face
    concave, neural arch more elevated with deeper fossae above neural canal
  - Astragalus and calcaneus fused, undifferentiated, with no visible boundary
    with tibia in posterior view
  - Fibula with diaphysis highly compressed lateromedially
  - Femur gracile with head projected antero-medially at ~45°, greater
    trochanter continuing with femoral head, fourth trochanter projecting
    postero-medially
  - Tibia with relatively delicate proximal end and cavities at base of cnemial
    crest
appearance:
  features:
    - reduced forelimbs
