references:
  - id: dong1973a
    notes: Catalogs the hind limb, now the holotype, as V. 4024-2 from field
      locality 64041-9 at Wuerho, under Phaedrolosaurus.
  - id: rauhut2005c
    notes: Recovers it in Maniraptora as the sister of Bagaraatan; gives the
      holotype from Wuerho, Lianmugin Formation, "?Valanginian-Albian".
  - id: xu2018c
    notes: Gives "(Barremian-Aptian?)" only for the Xiyunykus horizon at
      Wucaiwan, not for the Lianmuqin at Wuerho.
  - id: jones2026c
    notes: Reports the tentative maniraptoran referral.
  - id: turner2012a
    notes: Lists Xinjiangovenator among small basal coelurosaurs not assignable to an established subclade.
  - id: foth2026a
    notes: Recovered Xinjiangovenator in the polytomy at the base of Coelurosauria.
