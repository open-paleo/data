genus: Xinjiangovenator
parent: Coelurosauria
placement: incertae sedis
dispute:
  summary: >
    Xinjiangovenator is known only from a lower hind limb (originally referred to
    the nomen dubium Phaedrolosaurus ilikensis). Rauhut and Xu (2005) tentatively
    referred it to Maniraptora, possibly close to Bagaraatan, but with low support,
    and Jones et al. (2026) note that its bone features are more suggestive of
    tyrannosauroids or megaraptorans. Given the sparse material it is placed
    conservatively at Coelurosauria incertae sedis.
  history:
    - date: "2026-07-01"
      note: Placed at Coelurosauria incertae sedis (least-inclusive uncontested clade); weakly supported maniraptoran versus tyrannosauroid/megaraptoran signals, fragmentary holotype.
etymology: Named after Xinjiang, the autonomous region of China where it was found, combined with Latin venator meaning 'hunter'; translates as 'Xinjiang hunter'
pronunciation:
  phonetic: SHEEN-JEE-yon-go-VEN-uh-tuh
description: Xinjiangovenator is a genus of coelurosaurian dinosaurs, possibly
  part of the group Maniraptora, which lived in the Lianmuqin Formation of the
  Tugulu Group of China, dated to the Early Cretaceous period, sometime between
  the Valanginian and Albian stages.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
diagnostic_features:
  - Longitudinal groove on anterior side of fibula, a striking difference from
    all other theropods
  - Fibular condyle of tibia extending posteriorly beyond lateral side of
    proximal tibia, separated by step rather than notch
  - Ascending process of astragalus arising from complete breadth of astragalar
    body and very high (approximately three times height of astragalar body)
  - Small theropod with tibia plus proximal tarsals length of 312 mm
