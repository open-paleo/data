genus: Xianshanosaurus
parent: Euhelopodidae
description: Xianshanosaurus is a genus of sauropod dinosaur from the Early
  Cretaceous (Aptian-Albian) of the Ruyang Basin in Henan Province, China. Its
  type and only species is Xianshanosaurus shijiagouensis. It was described in
  2009 by a team of paleontologists led by Lü Junchang. Xianshanosaurus may be a
  titanosaur, and Daxiatitan may be its closest relative, but its evolutionary
  relationships remain controversial.
diet: herbivore
