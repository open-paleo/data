genus: Xianshanosaurus
parent: Euhelopodidae
pronunciation:
  phonetic: shyen-SHAHN-oh-SAWR-us
etymology: "Named after Xianshan Hill near the fossil locality in the Ruyang
  Basin, Henan Province, China, combined with Greek 'sauros' meaning 'lizard'."
description: Xianshanosaurus is a genus of sauropod dinosaur from the Early
  Cretaceous (Aptian-Albian) of the Ruyang Basin in Henan Province, China. Its
  type and only species is Xianshanosaurus shijiagouensis. It was described in
  2009 by a team of paleontologists led by Lü Junchang. Xianshanosaurus may be a
  titanosaur, and Daxiatitan may be its closest relative, but its evolutionary
  relationships remain controversial.
diet: herbivore
locomotion: quadrupedal
diagnostic_features:
  - Elongated tooth with a distinct ridge on the lingual surface of the tooth
    crown.
  - Neural spines of anterior caudal vertebrae plate-like with coarse areas on
    the middle portions of the anterior and posterior surfaces.
  - Distinct fossae present on the anterolateral surface of the base of the
    prezygapophysis and the anterior surface of the base of the transverse
    process.
  - Coracoid foramen located closely to the scapula-coracoid suture.
  - Shallow concavity present on the proximal end of the dorsal ribs.
paleoenvironment:
  - fluvial
  - lacustrine
appearance:
  integument: scaled
  evidence: inferred
