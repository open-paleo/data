references:
  - id: lü2009b
    notes: Named Xianshanosaurus and placed it provisionally in Neosauropoda,
      outside Titanosauridae.
  - id: jones2026b
    notes: Source of the body length, mass, and hip height estimates.
  - id: han2024a
    notes: Recovered Xianshanosaurus within Titanosauria as the sister taxon of Daxiatitan.
  - id: d'emic2012b
    notes: Referred Xianshanosaurus to Lithostrotia on the basis of a single character.
  - id: mannion2013a
    notes: Recovered Xianshanosaurus just outside Lithostrotia, with Daxiatitan.
  - id: upchurch2015a
    notes: Recovered Xianshanosaurus as a titanosaur in all analyses.
  - id: mannion2019b
    notes: Recovered Xianshanosaurus with Daxiatitan just outside Lithostrotia under equal weights, and as a basal lithostrotian under implied weights.
  - id: gallina2021a
    notes: Recovered Xianshanosaurus as a euhelopodid, with Huabeisaurus and Daxiatitan.
  - id: moore2020a
    notes: Found Xianshanosaurus labile, as a titanosaur or turiasaurian under
      equal weights, a lithostrotian under implied weights, and a
      non-neosauropod euhelopodid in the Bayesian analysis.
  - id: averianov2025b
    notes: Recovered Xianshanosaurus with Daxiatitan as the sister of Lithostrotia.
