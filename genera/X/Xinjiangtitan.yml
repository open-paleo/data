genus: Xinjiangtitan
parent: Mamenchisauridae
etymology: From Xinjiang, the autonomous region of northwestern China where it was found, and titan ('giant'), meaning 'Xinjiang titan'
description: "Xinjiangtitan is an extinct genus of mamenchisaurid sauropod that
  lived during the Middle Jurassic of what is now Xinjiang, northwestern China.
  Its type and only species is Xinjiangtitan shanshanesis (Chinese: 鄯善新疆巨龙;
  pinyin: Shànshàn Xīnjiāngjùlóng), known from a single incomplete skeleton
  recovered from the Qiketai Formation. The holotype preserves one of the most
  complete vertebral columns of any sauropod found in Asia, and has the longest
  complete neck known for any animal."
diet: herbivore
locomotion: quadrupedal
