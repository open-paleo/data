genus: Xinjiangtitan
parent: Mamenchisauridae
etymology: From Xinjiang, the autonomous region of northwestern China where it
  was found, and titan ('giant'), meaning 'Xinjiang titan'
description: "Xinjiangtitan is an extinct genus of mamenchisaurid sauropod that
  lived during the Middle Jurassic of what is now Xinjiang, northwestern China.
  Its type and only species is Xinjiangtitan shanshanesis (Chinese: 鄯善新疆巨龙;
  pinyin: Shànshàn Xīnjiāngjùlóng), known from a single incomplete skeleton
  recovered from the Qiketai Formation. The holotype preserves one of the most
  complete vertebral columns of any sauropod found in Asia, and has the longest
  complete neck known for any animal."
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Ventral keel developed at posterior 1/4 of penultimate cervical centrum,
    forming small semicircular projection under distal articular facet
  - Last two cervical vertebrae very elongated (sum of lengths is 63% of
    combined femur and tibia length)
  - First dorsal rib does not participate in forming sternal plate
  - Femur very robust with maximum distal width 33% of femoral length
  - Four dorsal vertebrae present (opisthocoelous and not fused to one another)
  - First and second sacral ribs simultaneously connected to second sacral rib,
    with first sacral rib not participating in sacrocostal yoke
  - Pubis very flat with well-developed ambiens process extending distally
  - Fourth trochanter located on posteromedial edge of femur
