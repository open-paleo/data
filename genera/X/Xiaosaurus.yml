genus: Xiaosaurus
parent: Ornithischia
placement: incertae sedis
etymology: "From Chinese 'xiao' meaning 'dawn', referring to the early
  geological age of the fossil, combined with Greek 'sauros' meaning 'lizard'."
pronunciation:
  ipa: /ʃaʊˈsɔːrəs/
  phonetic: shyow-SOR-us
description: Xiaosaurus is a genus of small herbivorous ornithischian dinosaur
  from the middle Jurassic (approximately 170.3 to 163.5 million years ago) of
  what is now the Sichuan Basin of China.
dispute:
  summary: >
    Xiaosaurus is a small ornithischian from the Middle Jurassic of China.
    Long treated as a nomen dubium, it was provisionally accepted as valid by
    Barrett and colleagues (2005) on a single humeral autapomorphy, a reading
    later works follow; the type material is of unknown whereabouts, and the
    fragmentary remains do not support a placement below Ornithischia. It was
    formerly placed in the deprecated Fabrosauridae.
  history:
    - date: "2026-06-29"
      note: Reparented from the deprecated Fabrosauridae to Ornithischia incertae sedis; nomen dubium.
    - date: "2026-10-08"
      note: Status kept valid; diagnostic features replaced by the emended diagnosis of Barrett and colleagues (2005).
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
appearance:
  integument: scaled
  evidence: inferred
diagnostic_features:
  - Humerus proximally straight, lacking the medial curvature seen in all other
    basal ornithischians
identifiers:
  - source: pbdb
    id: "53226"
  - source: wikidata
    id: Q1203400
  - source: gbif
    id: "4823093"
species:
  - name: Xiaosaurus dashanpensis
    etymology: "Named for Dashanpu, the village near Zigong in Sichuan, China, where
      the holotype was excavated."
    status: valid
    type_species: true
    period:
      name:
        - Middle Jurassic
        - Late Jurassic
      stage:
        - Bajocian
        - Bathonian
        - Callovian
        - Oxfordian
    location:
      country: CN
      locality: Dashanpu
      region: CN-SC
      formation: Shaximiao
      part: lower
    size:
      length_m:
        min: 1.0
        max: 1.0
    type_specimen:
      specimen_id: [ IVPP V6730A ]
      specimen_type: holotype
      institution: IVPP
      material: A maxilla fragment with one tooth, two cervical and four caudal
        vertebrae, a humerus, and a complete right hind limb.
      completeness: partial
    erected_in: dong1983b
references:
  - id: dong1983b
  - id: jones2026a
    notes: Placement and assessment in the Princeton Encyclopedia of Dinosaurs.
  - id: barrett2005a
    notes: Emends the diagnosis to a single humeral autapomorphy and provisionally
      accepts Xiaosaurus as valid.
  - id: butler2008b
    notes: Accepts the humeral autapomorphy but leaves Xiaosaurus out of its
      analysis, the type material being of unknown whereabouts.
  - id: boyd2015a
    notes: Treats Xiaosaurus as valid on the humeral autapomorphy but too
      fragmentary for phylogenetic analysis.
