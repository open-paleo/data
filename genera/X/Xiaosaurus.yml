genus: Xiaosaurus
parent: Fabrosauridae
etymology: "From Chinese 'xiao' meaning 'dawn', referring to the early
  geological age of the fossil, combined with Greek 'sauros' meaning 'lizard'."
pronunciation:
  ipa: /ʃaʊˈsɔːrəs/
  phonetic: shyow-SOR-us
description: Xiaosaurus is a genus of small herbivorous ornithischian dinosaur
  from the middle Jurassic (approximately 170.3 to 163.5 million years ago) of
  what is now the Sichuan Basin of China.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
appearance:
  integument: scaled
  evidence: inferred
diagnostic_features:
  - Teeth asymmetrical on the inner and outer surfaces, with thin dentine on both
    sides, lacking a rasp-like wear facet and longitudinal crown ridges
  - Cingulum between crown and root poorly developed, only rudimentary
  - Femoral lesser trochanter ear-shaped, lower than the greater trochanter,
    separated from the shaft by a vertical longitudinal groove
  - Tibia about 1.16 times femoral length; metatarsal III about 42% of tibia
    length
