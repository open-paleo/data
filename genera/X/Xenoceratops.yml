genus: Xenoceratops
parent: Centrosaurinae
etymology: "From Greek 'xenos' meaning 'foreign' or 'alien' and 'ceratops' meaning 'horned face', referring to the scarcity of ceratopsian species known from the Foremost Formation."
pronunciation:
  phonetic: ZEE-no-SEH-ruh-tops
description: Xenoceratops is a genus of centrosaurine ceratopsid dinosaur known
  from the Late Cretaceous (middle Campanian stage), and is known to have lived
  in what is currently Alberta, Canada. The genus has one known species,
  Xenoceratops foremostensis, after its place of discovery, the Foremost
  Formation.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - coastal
diagnostic_features:
  - Two epiparietals (P2-P3) on posterior parietal ramus
  - Wide-based, short, thick P2 processes adjacent to midline with dorsolateral
    curl
  - Elongate, dorsoventrally depressed spike at P3 locus, posterolaterally
    oriented and straight not curled
  - Additional epiparietals fuse into ovoid depressions on lateral parietal
    margin
  - Lacks P1 processes; lacks imbricated epiparietals on lateral ramus
  - Lacks midline parietal bumps when viewed laterally; arched cross-section of
    anteriormost midline ramus
appearance:
  features:
    - neck frill
    - frill spikes
    - brow horns
  integument: scaled
  evidence: inferred
