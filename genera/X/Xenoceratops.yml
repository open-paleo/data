genus: Xenoceratops
parent: Centrosaurinae
etymology: alien horned face
description: Xenoceratops is a genus of centrosaurine ceratopsid dinosaur known
  from the Late Cretaceous (middle Campanian stage), and is known to have lived
  in what is currently Alberta, Canada. The genus has one known species,
  Xenoceratops foremostensis, after its place of discovery, the Foremost
  Formation.
