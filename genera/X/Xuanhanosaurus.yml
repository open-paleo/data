genus: Xuanhanosaurus
parent: Piatnitzkysauridae
pronunciation:
  phonetic: SHWEN-HAHN-o-SAWR-us
etymology: "Named for Xuanhan County in Sichuan, China, where the fossils were
  recovered, combined with Greek 'sauros' meaning 'lizard'."
description: Xuanhanosaurus is a genus of theropod dinosaur that lived during
  the Middle Jurassic (Bathonian) of the Sichuan Basin, China, around 166
  million years ago. This taxon represents one of the various non-coelurosaurian
  tetanuran taxa found on the Middle Jurassic of the region, uncovered in the
  Lower Shaximiao Formation. Although it has been known for more than 40 years,
  this taxon has been the subject of very few studies, although most seem to
  agree that it is a tetanuran, possibly a basal allosauroid, highlighting the
  fact that it has a vestigial fourth metacarpal.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Forelimbs relatively well developed with fourth metacarpal retained
    (primitive characteristic within Megalosauridae)
  - Forelimbs possess ambulatory function, contrasting with later-stage
    tyrannosaurids
  - Well-developed ventral crest on cervical vertebrae, wing-shaped and prominent
  - Tridactyl manus with stout, short, non-strongly-curved claws
  - Cervical vertebrae with posterior concavity and undeveloped anterior
    projection
