genus: Willinakaqe
parent: Hadrosauridae
placement: incertae sedis
etymology: From Mapuche willi ('south'), iná ('mimic'), and kaqe ('duck'),
  meaning 'Southern duck-mimic'
pronunciation:
  phonetic: eel-yee-nah-KAH-gay
description: Willinakaqe is a dubious genus of saurolophine hadrosaurid dinosaur
  described based on fossils from the late Cretaceous (late Campanian-early
  Maastrichtian stage) of the Río Negro Province of southern Argentina.
dispute:
  summary: >
    Cruzado-Caballero and Coria (2016) revised Willinakaqe salitralensis and
    found that the referred material may represent more than one hadrosaurid
    taxon, that all characters of the original diagnosis are invalid, and that
    the holotype right premaxilla (MPCA-PV SM 8) is itself too weathered and
    incomplete to support a diagnosis. They termed the species a nomen vanum;
    because the holotype is simply undiagnostic rather than a chimera, it is
    treated here as a nomen dubium.
  history:
    - date: "2026-06-27"
      note: Placed at Hadrosauridae incertae sedis; nomen vanum/dubium.
    - date: "2026-07-03"
      note: >
        Status set to nomen dubium (the schema has no 'nomen vanum'): once the
        referred material Cruzado-Caballero and Coria (2016) flagged as possibly
        multi-taxon is set aside, the holotype premaxilla is undiagnostic.
        Corrected the dispute prose (the holotype is not itself a chimera) and
        removed the original diagnostic_features, which that revision
        invalidated. Also dropped the size estimate (paul2024a), which was scaled
        from the referred, possibly-multi-taxon material. Sourced the revision as
        cruzado-caballero2016a.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "193981"
  - source: wikidata
    id: Q266797
  - source: eol
    id: "42417876"
species:
  - name: Willinakaqe salitralensis
    etymology: "Named for the Salitral, the locality in Río Negro Province,
      Argentina, where the holotype was found."
    status: nomen dubium
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Maastrichtian
    location:
      country: AR
      region: AR-R
      formation: Allen
    type_specimen:
      specimen_id: [ MPCA-PV SM 8 ]
      specimen_type: holotype
      institution: MPCA
      material: Right premaxilla; too weathered and incomplete to be diagnostic
      completeness: fragmentary
    erected_in: juárezvalieri2010a
references:
  - id: juárezvalieri2010a
  - id: cruzado-caballero2016a
    notes: Revised the taxon; found the original diagnostic characters invalid,
      the referred material possibly multi-taxon, and the holotype premaxilla too
      weathered and incomplete to diagnose.
