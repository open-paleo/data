genus: Willinakaqe
parent: Hadrosauridae
etymology: From Mapuche willi ('south'), iná ('mimic'), and kaqe ('duck'),
  meaning 'Southern duck-mimic'
pronunciation:
  phonetic: eel-yee-nah-KAH-gay
description: Willinakaqe is a dubious genus of saurolophine hadrosaurid dinosaur
  described based on fossils from the late Cretaceous (late Campanian-early
  Maastrichtian stage) of the Río Negro Province of southern Argentina.
dispute:
  summary: >
    Willinakaqe salitralensis was argued to be a nomen vanum by
    Cruzado-Caballero and Coria (2016) because its holotype is a chimera
    and the species lacks unique diagnostic features; it is treated as a
    nomen dubium by later workers.
  history:
    - date: "2026-06-27"
      note: Placed at Hadrosauridae incertae sedis; nomen vanum/dubium.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
diagnostic_features:
  - Premaxilla with long and convex rostrolateral surface rostral to narial fossa
  - Dorsal vertebrae with shallow fossa on lateral surface of neural arch at
    transverse process base
  - Sacral and proximal caudal neural spines more than three times centrum height
  - Distal postacetabular process of ilium ventrally deflected
  - Femur with open cranial intercondylar groove
appearance:
  integument: scaled
  evidence: inferred
