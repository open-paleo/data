genus: Willinakaqe
parent: Hadrosauridae
etymology: From Mapuche willi ('south'), iná ('mimic'), and kaqe ('duck'), meaning 'Southern duck-mimic'
description: Willinakaqe is a dubious genus of saurolophine hadrosaurid dinosaur
  described based on fossils from the late Cretaceous (late Campanian-early
  Maastrichtian stage) of the Río Negro Province of southern Argentina.
diet: herbivore
