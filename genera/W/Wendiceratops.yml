genus: Wendiceratops
parent: Centrosaurinae
etymology: Combines Wendi (honoring Canadian fossil hunter Wendy Sloboda) with Greek ceratops ('horned face'), meaning 'Wendy's horned face'
pronunciation:
  phonetic: WEN-dee-SEH-ruh-tops
description: Wendiceratops is a genus of herbivorous centrosaurine ceratopsian
  dinosaur from the Late Cretaceous of Canada.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Epiparietals at loci ep 2 and ep 3 developed as broad-based, pachyostotic
    processes that are procurved anterodorsally to overhang the posterior and
    lateral parietal rami
  - Ischium with a broad, rectangular distal terminus
  - Large, upright nasal horncore positioned close to the orbits
appearance:
  features:
    - nasal horn
    - brow horns
    - epoccipitals
  integument: scaled
  evidence: inferred
