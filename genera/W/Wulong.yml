genus: Wulong
parent: Microraptorinae
pronunciation:
  phonetic: WOO-long
etymology: "From Chinese 'wu' meaning 'dancing' and 'long' meaning 'dragon', in reference to the specimen's sprightly preserved pose."
description: Wulong is a genus of microraptorine dromaeosaurid dinosaurs from the Early Cretaceous (Aptian) Jiufotang Formation of China. The genus includes a single species, Wulong bohaiensis. The skeletal remains, which include preserved feathers, represent a juvenile.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
diagnostic_features:
  - Long jugal process of quadratojugal
  - Cranially inclined pneumatic foramina on cranial half of dorsal centra
  - Transverse processes of proximal caudals significantly longer than width of
    centrum
  - Presence of 30 caudal vertebrae producing proportionally long tail
  - Distally located and large posterior process of ischium
  - Large supracoracoid fenestra (>15% of total area)
appearance:
  features:
    - feathered wings
    - feathered tail
  integument: feathered
  evidence: direct
