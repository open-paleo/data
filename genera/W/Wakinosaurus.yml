genus: Wakinosaurus
parent: Theropoda
etymology: Named after the Wakino Subgroup of the Kwanmon Group (a geological
  unit in Kyushu, Japan), combined with Greek sauros meaning 'lizard';
  translates as 'Wakino lizard'
pronunciation:
  phonetic: wah-KEEN-o-SOR-us
description: Wakinosaurus is a genus of possible carcharodontosaurid theropod
  dinosaur from the Early Cretaceous (Valanginian-Barremian) Sengoku Formation
  of Kyushu, Japan. The genus is a tooth taxon, based solely on the middle
  section of a single tooth.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Large compressed blade-like crown
  - Fine serration on both cutting edges
  - Longitudinal striations on lingual and buccal surfaces
appearance:
  integument: scaled
  evidence: inferred
