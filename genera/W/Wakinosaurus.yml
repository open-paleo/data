genus: Wakinosaurus
parent: Theropoda
placement: incertae sedis
dispute:
  summary: >
    Wakinosaurus satoi is a nomen dubium based on a single tooth, suggested
    to be a carcharodontosaurid (Yun, 2020).
  history:
    - date: "2026-06-30"
      note: >
        Reparented to Tetanurae.
    - date: "2026-07-02"
      note: Placed at Tetanurae incertae sedis; a tooth-taxon nomen dubium.
    - date: "2026-07-14"
      note: Moved to Theropoda incertae sedis; the tetanuran/carcharodontosaurid
        referral of the single tooth rests only on a lone speculative suggestion.
etymology: Named after the Wakino Subgroup of the Kwanmon Group (a geological
  unit in Kyushu, Japan), combined with Greek sauros meaning 'lizard';
  translates as 'Wakino lizard'
pronunciation:
  phonetic: wah-KEEN-o-SOR-us
description: Wakinosaurus is a genus of possible carcharodontosaurid theropod
  dinosaur from the Early Cretaceous (Valanginian-Barremian) Sengoku Formation
  of Kyushu, Japan. The genus is a tooth taxon, based solely on the middle
  section of a single tooth.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
appearance:
  integument: scaled
  evidence: inferred
