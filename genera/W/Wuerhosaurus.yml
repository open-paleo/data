references:
  - id: dong1973a
    notes: Erects the genus and type species on an incomplete skeleton from the
      Wuerho locality.
  - id: dong1990b
    notes: Reviews the Asian stegosaurs and gives a fuller account of the
      holotype material and diagnosis.
  - id: maidment2008a
    notes: Recombines the type species as Stegosaurus homheni, treating the genus
      as invalid, and regards Wuerhosaurus ordosensis as a nomen dubium.
  - id: raven2023a
    notes: Reinstates the genus, recognizing Hesperosaurus, Stegosaurus and
      Wuerhosaurus as distinct given their labile positions.
  - id: jia2024a
    notes: Counts the genus among the few valid Cretaceous stegosaurs in the
      description of Yanbeilong.
  - id: sánchez-fenollosa2025a
    notes: Reports topologies that challenge the synonymization with Stegosaurus,
      while undermining the candidate autapomorphy.
  - id: carpenter2001b
    notes: Compares the genus with Hesperosaurus in the description of that
      taxon.
