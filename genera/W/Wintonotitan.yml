genus: Wintonotitan
parent: Diamantinasauria
dispute:
  summary: >
    Wintonotitan has been recovered both as a non-titanosaurian
    somphospondylan outside Diamantinasauria (Poropat et al., 2015; Jones,
    2026) and, more recently and robustly, as a member of Diamantinasauria
    (Beeston et al., 2024).
  history:
    - date: "2026-06-30"
      note: >
        Placed in Diamantinasauria following Beeston et al. (2024); the
        alternative non-titanosaurian somphospondylan placement is noted.
etymology: Named after Winton, Queensland, Australia (the area where it was found, associated with the Winton Formation), combined with Greek titan meaning 'giant'; translates as 'Winton titan'
pronunciation:
  phonetic: win-TON-o-TIE-tan
description: Wintonotitan is a genus of titanosauriform dinosaur from the
  Cenomanian-aged (Late Cretaceous) Winton Formation of Australia. It is known
  from partial postcranial remains.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Dorsal vertebrae with camellate pneumatic cavities, deep eye-shaped
    pleurocoels, prespinal and postspinal laminae along entire neural spine
    length
  - Incipient spinoprezygapophyseal lamina on dorsal neural spines
  - Dorsal ribs large and plank-like with pneumatic cavities in proximal third
  - Approximately 35 caudal vertebrae all with solid internal structure;
    posterior caudals with incipient biconvexity
  - Scapula long with broad acromial blade and mid-scapular blade ridge
  - Humerus gracile with low narrow deltopectoral crest terminating proximal to
    mid-shaft
appearance:
  integument: armored
  evidence: direct
