        max: 15
      weight_kg:
        min: 10000
        max: 10000
      hip_height_m:
        min: 3.5
        max: 3.5
    erected_in: hocknull2009a
    described_in: poropat2015a
references:
  - id: hocknull2009a
  - id: paul2024a
    notes: Source of the body length and mass estimates.
  - id: jones2026b
    notes: Source of the hip height estimate.
  - id: poropat2014a
    notes: Revised Diamantinasaurus and recovered Wintonotitan as a non-titanosaurian somphospondylan outside Diamantinasauria
  - id: beeston2024a
    notes: Recovered Wintonotitan as a member of Diamantinasauria.
  - id: poropat2015a
    notes: Osteological redescription. Replaces the original diagnosis with
      eight autapomorphies, keeps the genus outside Diamantinasauria, and shows
      the reported osteoderms to be its own neural spines.
