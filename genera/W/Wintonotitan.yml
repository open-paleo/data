genus: Wintonotitan
parent: Diamantinasauria
dispute:
  summary: >
    Wintonotitan has been recovered both as a non-titanosaurian
    somphospondylan outside Diamantinasauria (Poropat et al., 2014; Jones,
    2026) and, more recently and robustly, as a member of Diamantinasauria
    (Beeston et al., 2024).
  history:
    - date: "2026-06-30"
      note: >
        Placed in Diamantinasauria following Beeston et al. (2024); the
        alternative non-titanosaurian somphospondylan placement is noted.
etymology: Named after Winton, Queensland, Australia (the area where it was found, associated with the Winton Formation), combined with Greek titan meaning 'giant'; translates as 'Winton titan'
pronunciation:
  phonetic: win-TON-o-TIE-tan
description: Wintonotitan is a genus of titanosauriform dinosaur from the
  Cenomanian-aged (Late Cretaceous) Winton Formation of Australia. It is known
  from partial postcranial remains.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Unbifurcated middle to posterior dorsal neural spine summit with a rounded
    median ridge linking the pre- and postspinal laminae
  - Anterior and anterior-middle caudal centra with a horizontal ridge at about
    mid-height projecting as far laterally as the articular surfaces
  - Anterior chevrons whose proximal articular ends are anteroposteriorly
    narrower in lateral view than the proximal rami at mid-height of the haemal
    canal
  - Scapular blade with a fossa on the medial surface close to the
    acromion-blade junction
  - Radius with a subcircular proximal end bearing a medially directed
    projection
  - Metacarpus with a deep fossa on the proximal surface at the intersection of
    metacarpals I, II and III
  - Metacarpal III with the distal end more transversely expanded than the
    proximal end
  - Metacarpal IV with a medially projecting bulge on the dorsal surface near
    mid-shaft
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "148970"
  - source: wikidata
    id: Q132883
