species:
  - name: Wintonotitan wattsi
    etymology: "Named for Keith Watts, who first discovered the holotype fossils near Winton, Queensland, Australia, in 1974."
    status: valid
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Cenomanian
        - Turonian
    location:
      country: AU
      locality: Triangle Paddock, Elderslie Station
      region: AU-QLD
      formation: Winton
      part: lower
      coordinates:
        - -22.290561
        - 142.471897
      notes: The type locality is registered as Queensland Museum locality QM
        L313, the Triangle Paddock Site on Elderslie Sheep Station, about 60 km
        north-west of Winton and west of the Cork Fault. The coordinates are
        those of Beeston and colleagues (2024).
    type_specimen:
      specimen_id: [QM F7292]
      specimen_type: holotype
      institution: QM
      material: Partial postcranial skeleton with a fragmentary dorsal centrum
        and three neural arches, dorsal rib fragments, two coossified sacral
        vertebrae, 25 caudal vertebrae, five chevrons, an incomplete left
        scapula, both humeri and ulnae, both radii, the left metacarpus, a
        partial left ilium and the left ischium
      completeness: partial
    size:
