genus: Wellnhoferia
parent: Avialae
dispute:
  summary: >
    The validity of Wellnhoferia grandis is disputed. Elzanowski (2001) erected it
    for the Solnhofen specimen on the basis of a shortened tail and a four-phalanx
    fourth pedal digit, and Senter and Robins (2003) supported its distinctness,
    but Mayr et al. (2007) and Jones et al. (2026) regard it as a junior synonym of
    Archaeopteryx lithographica. It is retained here as a valid genus pending
    revision.
  history:
    - date: "2026-07-01"
      note: Placed at Avialae incertae sedis; validity relative to Archaeopteryx lithographica flagged for review.
etymology: Named after German paleontologist Peter Wellnhofer, who described the
  Solnhofen specimen of Archaeopteryx in 1988
pronunciation:
  phonetic: WEL-un-hoh-FEE-ree-a
description: Wellnhoferia is a genus of early prehistoric bird-like theropod
  dinosaur closely related to Archaeopteryx. It is known from a single species,
  W. grandis, that lived in what is now Germany, during the Late Jurassic. While
  Wellnhoferia was similar to Archaeopteryx, it had a shorter tail and its
  fourth toe was shorter than that of Archaeopteryx. Andrzej Elżanowski (2001)
  of the Institute of Zoology of the University of Wrocław, Poland, determined
  the differences resulted from a "phylogenetic reduction rather than individual
  variation."
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - marine
diagnostic_features:
  - Short tail with estimated 16-17 caudal vertebrae versus 21-23 in
    Archaeopteryx
  - Pedal digit IV composed of only four phalanges with long ungual lacking
    pronounced ventral curvature and widely separated flexor tubercle
  - Nearly symmetric pattern of pedal rays II-IV with metatarsals II and IV of
    equal length
  - Manual digit I ungual approximately one-third length of basal phalanx
  - Pedal digit II relatively longer and pedal digit IV relatively shorter than
    in Archaeopteryx, conferring greater symmetry to foot
