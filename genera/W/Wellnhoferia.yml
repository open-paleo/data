genus: Wellnhoferia
parent: Avialae
etymology: Named after German paleontologist Peter Wellnhofer, who described the
  Solnhofen specimen of Archaeopteryx in 1988
description: Wellnhoferia is a genus of early prehistoric bird-like theropod
  dinosaur closely related to Archaeopteryx. It is known from a single species,
  W. grandis, that lived in what is now Germany, during the Late Jurassic. While
  Wellnhoferia was similar to Archaeopteryx, it had a shorter tail and its
  fourth toe was shorter than that of Archaeopteryx. Andrzej Elżanowski (2001)
  of the Institute of Zoology of the University of Wrocław, Poland, determined
  the differences resulted from a "phylogenetic reduction rather than individual
  variation."
diet: carnivore
locomotion: bipedal
