genus: Weewarrasaurus
parent: Ornithopoda
etymology: Named after the Wee Warra geologic locality near Lightning Ridge, New South Wales, Australia, where the fossil was found, plus Greek sauros ('lizard')
description: Weewarrasaurus is a genus of ornithopod dinosaur from the Late
  Cretaceous of the Griman Creek Formation near Lightning Ridge, in New South
  Wales, Australia. The type and only species is W. pobeni, known from the
  holotype, an isolated dentary preserved in opal, as well as a secondary
  referred dentary. It is thought to have co-existed with multiple other
  ornithopods of different sizes and lineages.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Elongate dentary ramus with slot-like neurovascular foramina on lateral
    surface (ratio of posterior-most foramen length/height ≅ 5.0)
  - Large dentary tooth crowns (ratio of apicobasal height of largest posterior
    crown/total dentary height ≅ 0.5)
  - Closely-butting secondary apicobasal ridges with fan-like arrangement on
    lingual crown surface mesial and distal to primary ridge
  - Weakly-developed apicobasal ridges on labial crown surface
