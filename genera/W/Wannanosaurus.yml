genus: Wannanosaurus
parent: Pachycephalosauria
pronunciation:
  phonetic: WAHN-NAHN-o-SAWR-us
etymology: "Named for Wannan (southern Anhui), the region of China where the fossils were discovered, combined with Greek 'sauros' meaning 'lizard'."
description: Wannanosaurus is a genus of basal pachycephalosaurian dinosaur from
  the Maastrichtian-aged (Upper Cretaceous) Xiaoyan Formation, about 70 million
  years ago, in what is now Anhui, China. The type species Wannanosaurus
  yansiensis was described by Hou Lian-Hai in 1977.
diet: herbivore
locomotion: bipedal
