genus: Wannanosaurus
parent: Pachycephalosauria
placement: incertae sedis
pronunciation:
  phonetic: WAHN-NAHN-o-SAWR-us
etymology: "Named for Wannan (southern Anhui), the region of China where the
  fossils were discovered, combined with Greek 'sauros' meaning 'lizard'."
description: Wannanosaurus is a genus of basal pachycephalosaurian dinosaur from
  the Campanian-aged (Upper Cretaceous) Xiaoyan Formation, in what is now Anhui,
  China. The type species Wannanosaurus
  yansiensis was described by Hou Lian-Hai in 1977.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
diagnostic_features:
  - Well-developed supratemporal fenestra (relatively large and elliptical)
  - Cranial roof completely flattened, not domed
  - Osseous tuberosities small and densely packed
  - Forelimb short, humerus approximately half the length of femur
  - Mandibular dentition long, exceeding half the length of mandible
  - Distinct retroarticular process on mandible
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "38797"
  - source: wikidata
    id: Q133138
  - source: gbif
    id: "4823178"
species:
  - name: Wannanosaurus yansiensis
    etymology: "Named for Yansi, the locality in Anhui Province, China, where the
      holotype was discovered."
    status: valid
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Campanian
    location:
      country: CN
      locality: Yansi
      region: CN-AH
      formation: Xiaoyan
      part: upper
    size:
      length_m:
        min: 0.6
        max: 0.6
    type_specimen:
      specimen_id: [ IVPP V4447 ]
      specimen_type: holotype
      institution: IVPP
      material: Right posterior skull cap, left jugal, complete left mandible with
        teeth, left humerus, pair of femora, right tibia, portion of ilium, and
        cervical vertebra
      completeness: partial
    erected_in: hou1977a
references:
  - id: hou1977a
  - id: schott2016a
    notes: Recovered Wannanosaurus as basal-most pachycephalosaur outside Pachycephalosauridae.
  - id: chinzorig2025a
    notes: Recovered Wannanosaurus as the earliest-branching pachycephalosaurian,
      but cautions that the immaturity of the holotype may influence its position.
