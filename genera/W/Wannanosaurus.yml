genus: Wannanosaurus
parent: Pachycephalosauria
pronunciation:
  phonetic: WAHN-NAHN-o-SAWR-us
etymology: "Named for Wannan (southern Anhui), the region of China where the
  fossils were discovered, combined with Greek 'sauros' meaning 'lizard'."
description: Wannanosaurus is a genus of basal pachycephalosaurian dinosaur from
  the Maastrichtian-aged (Upper Cretaceous) Xiaoyan Formation, about 70 million
  years ago, in what is now Anhui, China. The type species Wannanosaurus
  yansiensis was described by Hou Lian-Hai in 1977.
dispute:
  summary: >
    Wannanosaurus is consistently recovered as the basal-most pachycephalosaur,
    outside the crown family Pachycephalosauridae (Schott and Evans, 2016;
    Chinzorig et al., 2025), though its position may be influenced by the
    immaturity of the only known specimens. It is retained at Pachycephalosauria
    incertae sedis.
  history:
    - date: "2026-06-26"
      note: Placed at Pachycephalosauria incertae sedis, the basal-most pachycephalosaur outside Pachycephalosauridae (P2).
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
diagnostic_features:
  - Well-developed supratemporal fenestra (relatively large and elliptical)
  - Cranial roof completely flattened, not domed
  - Osseous tuberosities small and densely packed
  - Forelimb short, humerus approximately half the length of femur
  - Mandibular dentition long, exceeding half the length of mandible
  - Distinct retroarticular process on mandible
appearance:
  integument: scaled
  evidence: inferred
