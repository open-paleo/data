genus: Wyleyia
parent: Maniraptora
dispute:
  summary: >
    Wyleyia valdensis is based on a single partial humerus. Originally described as
    a bird of uncertain affinity (Harrison and Walker, 1973), it was reassessed by
    Naish and Martill (2007) as an indeterminate maniraptoran and a nomen dubium.
    It is placed conservatively at Maniraptora incertae sedis.
  history:
    - date: "2026-07-01"
      note: Moved from Avialae to Maniraptora incertae sedis following Naish and Martill (2007); a nomen dubium.
etymology: Named in honor of J. F. Wyley, who discovered the specimen in Weald
  Clay deposits of Henfield, Sussex, England.
pronunciation:
  phonetic: WY-lee-yuh
description: Wyleyia is an extinct genus of indeterminate maniraptoran dinosaurs
  containing a single species, Wyleyia valdensis, known from the early
  Cretaceous period of Sussex, England. The genus is known from a single
  specimen, a damaged right humerus. It was named to honor J. F. Wyley, who
  found the specimen in Weald Clay deposits of Henfield in Sussex (England). The
  specific name valdensis means "from the Weald".
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - transverse ligamental furrow on the palmar surface just below the proximal
    articulating area
  - blade-like, large, and very thin deltoid crest
  - capital groove on the anconal surface
  - slender, hollow, and thin-walled shaft
  - distinct brachial depression for the insertion of the brachialis anticus
    muscle
  - proximal end of humerus relatively smooth and flattened
appearance:
  integument: feathered
  evidence: inferred
