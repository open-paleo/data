genus: Wulatelong
parent: Oviraptoridae
etymology: From Wulate (referring to Wulatehouqi, the region of Inner Mongolia,
  China where it was found) and Chinese long ('dragon')
pronunciation:
  phonetic: woo-la-tuh-long
description: Wulatelong is an extinct genus of basal oviraptorid dinosaur known
  from the Late Cretaceous Wulansuhai Formation (Campanian stage) of Bayan
  Mandahu, Linhe District of Inner Mongolia, northern China. It contains a
  single species, Wulatelong gobiensis.
diet: omnivore
locomotion: bipedal
paleoenvironment:
  - arid
diagnostic_features:
  - Ventral extremity of external naris located below mid-height of premaxilla
  - Strap-like jugal process of maxilla extends well beyond preorbital bar and
    overlaps jugal
  - Anterodorsal process of surangular basally constricted in lateral view
appearance:
  features:
    - keratinous beak
    - fleshy cranial crest
  integument: feathered
  evidence: direct
