genus: Wudingloong
parent: Massopoda
etymology: From 'Wuding' (Wuding County, Yunnan Province, China, where the
  type locality lies) and Mandarin Chinese 'loong' (dragon).
pronunciation:
  phonetic: woo-ding-long
description: Wudingloong is an extinct genus of early-diverging massopodan
  sauropodomorph dinosaur from the Hettangian-early Sinemurian (Early
  Jurassic) Yubacun Formation at Wande Town in Wuding County, Yunnan
  Province, southern China. The single species, Wudingloong wui, is known
  from a partial articulated skeleton (LFGT-YW002) preserving most of the
  skull, the anterior axial column, and a complete right forelimb. Wang et
  al. (2025) recover Wudingloong as sister to Plateosauravus + Ruehleia,
  outside Massospondylidae and Sauropodiformes, and argue it is both the
  earliest-diverging and stratigraphically oldest sauropodomorph known from
  East Asia.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Ascending ramus of the maxilla excavated by a triangular antorbital fossa.
  - Axial intercentrum completely fused to the axis and slightly mediolaterally
    wider than the anterior surface of the axial centrum.
  - Distinct blade-like ventral keel on the middle cervical centra, extending
    the full length of the centrum.
  - Humerus with a slender shaft (minimum width 0.12x total length) and a flat,
    low, only slightly convex humeral head.
  - Ungual of manual digit I large and robust, with length ~2.9x and proximal
    height and width ~3.2x those of the ungual of manual digit III.
  - Metacarpal V gracile with an hourglass-shaped outline; proximal end
    approximately as wide transversely as the distal end.
