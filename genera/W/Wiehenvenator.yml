genus: Wiehenvenator
parent: Megalosaurinae
etymology: From Wiehen (the Wiehen Hills near Minden, Germany, where the fossil was found) and Latin venator ('hunter'), meaning 'Wiehen hunter'
pronunciation:
  phonetic: VEE-hen-VEN-uh-tuh
description: Wiehenvenator is a genus of megalosaurid theropod dinosaur from the
  Middle Jurassic (Callovian) of north western Germany. The genus contains a
  single species, W. albati.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - marine
diagnostic_features:
  - Lacrimal with small oval depression in antorbital fossa anterior to lacrimal
    fenestra
  - Very short and high anterior process of lacrimal, length less than half
    height of bone
  - Postorbital with transversely concave orbital facet in dorsal part of
    anterior side with raised margins
  - Oblique ridge on medial side of fibula at level of iliofibularis tubercle
  - Proximal part of ascending process of astragalus deflected laterally, marked
    kink in lateral margin
appearance:
  integument: scaled
  evidence: inferred
