genus: Walgettosuchus
parent: Theropoda
dispute:
  summary: >
    Walgettosuchus woodwardi is a nomen dubium based on a single caudal
    vertebra, most recently regarded as an indeterminate theropod (Agnolín
    and others, 2010).
  history:
    - date: "2026-06-30"
      note: >
        Placed at Theropoda incertae sedis.
etymology: From the town of Walgett, New South Wales, plus Greek Soukhos (the
