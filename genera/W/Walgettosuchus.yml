genus: Walgettosuchus
parent: Theropoda
etymology: From the town of Walgett, New South Wales, plus Greek Soukhos (the
  Egyptian crocodile god Sobek)
description: Walgettosuchus is a dubious or possibly invalid genus of extinct
  tetanuran theropod dinosaur that lived in Australia during the Late Cretaceous
  (Cenomanian). It is known from a single caudal vertebra.
