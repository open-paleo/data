genus: Wamweracaudia
parent: Mamenchisauridae
etymology: "Named after the Wamwera people, a tribe inhabiting the Lindi Region
  of Tanzania near the Tendaguru fossil site, combined with Latin 'cauda'
  meaning 'tail', as the holotype consists entirely of a series of tail
  vertebrae"
description: Wamweracaudia is a large herbivorous sauropod dinosaur from the
  Late Jurassic (155-145 million years ago) Tendaguru Formation of Tanzania,
  Africa.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - coastal
diagnostic_features:
  - Anteriormost caudal ribs curve strongly anterolaterally
  - Dorsal surface of centrum posteriorly excavated in anterior-middle caudal
    vertebrae
  - Paired tubercles on lateral surface of prezygapophysis and dorsal surface of
    caudal rib in anterior caudal vertebrae
  - Rugosity along dorsal third of lateral surface of anterior caudal neural
    spines, separated from postspinal rugosity by vertical groove
  - Ventral surface of middle-posterior caudal centra strongly constricted
    transversely to form ridge
  - Anteroposteriorly elongate ridge on lateral surface of middle-posterior
    caudal neural spines above postzygapophyses
