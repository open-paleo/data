genus: Wamweracaudia
parent: Mamenchisauridae
etymology: "Named after the Wamwera people, a tribe inhabiting the Lindi Region
  of Tanzania near the Tendaguru fossil site, combined with Latin 'cauda'
  meaning 'tail', as the holotype consists entirely of a series of tail
  vertebrae"
description: Wamweracaudia is a large herbivorous sauropod dinosaur from the
  Late Jurassic (155-145 million years ago) Tendaguru Formation of Tanzania,
  Africa.
