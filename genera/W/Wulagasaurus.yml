genus: Wulagasaurus
parent: Saurolophinae
etymology: "Named for the Wulaga locality in Heilongjiang, China, where the fossils were found, combined with Greek 'sauros' meaning 'lizard'."
pronunciation:
  phonetic: woo-LAH-guh-SOR-us
description: Wulagasaurus is a genus of saurolophine hadrosaurid dinosaur from
  the Late Cretaceous of Heilongjiang, China.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - lacustrine
diagnostic_features:
  - Extremely elongated, slender dentary, its rostrocaudal length 6.8 times its
    maximum dorsoventral height
  - Dentary with a markedly dorsally concave diastema
  - Caudal ramus of the jugal extending caudodorsally at a low inclination,
    forming an angle of about 140° with the jugal long axis
  - Humeral deltopectoral crest moderately expanded craniolaterally (unlike
    basal hadrosauroids)
  - Ventral margin of the supracetabular process at about the dorsoventral
    midpoint of the iliac central plate (unlike basal hadrosauroids)
  - Relatively short iliac preacetabular process and a faint quadrate buttress
    (unlike Brachylophosaurus and Maiasaura)
