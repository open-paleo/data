genus: Wulagasaurus
parent: Brachylophosaurini
etymology: "Named for the Wulaga locality in Heilongjiang, China, where the fossils were found, combined with Greek 'sauros' meaning 'lizard'."
description: Wulagasaurus is a genus of saurolophine hadrosaurid dinosaur from
  the Late Cretaceous of Heilongjiang, China.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - lacustrine
diagnostic_features:
  - Very slender dentary with ratio of dental battery length/maximum height >4.5
  - Lateral side of dentary not pierced by foramina
  - Edge of deltopectoral crest oriented quite cranially on humerus
  - Humeral articular head extends distally as very long and prominent vertical
    ridge
  - Inner tuberosity much better developed than outer tuberosity on proximal
    humerus
  - Short sagittal crest less than 2/3 the length of the parietal
