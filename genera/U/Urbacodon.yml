genus: Urbacodon
parent: Troodontinae
etymology: Named after URBAC (an acronym honoring Uzbek, Russian, British,
  American, and Canadian scientists who collaborated on Central Asian
  paleontological expeditions), combined with Greek odon meaning 'tooth'
description: "Urbacodon is a genus of troodontid theropod dinosaur. Two species
  have been described, both of which are known from a partial dentary: U.
  itemirensis from the Dzharakuduk Formation (Cenomanian) of Uzbekistan and U.
  norelli from the Iren Dabasu Formation of China. Possible remains are also
  known from the Bissekty Formation (Turonian) of Uzbekistan."
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Unserrated mesial and distal carinae on all teeth, absence of serrations on
    teeth carinae
  - Dentary with 32 teeth arranged with diastema in posterior tooth row, more
    plesiomorphic than Troodon and Saurornithoides
  - Fewer neurovascular foramina in lateral groove and more bulbous anterior
    dentary crowns than Byronosaurus
  - Much larger size than Mei, distinguished by overall skeletal proportions
  - "Distinct paradental groove structure unique among troodontids: deep cleft
    lingual to tooth row with narrow dorsal groove along dentary surface"
