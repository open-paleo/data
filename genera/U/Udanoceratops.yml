genus: Udanoceratops
parent: Leptoceratopsidae
etymology: "Named for the Udan-Sayr locality in Mongolia where the holotype was found, combined with Greek 'keras' meaning 'horn' and 'ops' meaning 'face'."
description: Udanoceratops is a genus of large leptoceratopsid dinosaur that
  lived during the Late Cretaceous period of Mongolia. The holotype specimen,
  the partial skeleton of an adult with its bones encapsulated in calcium
  carbonate, was discovered in the 1980s as part of the Joint Soviet-Mongolian
  Paleontological Expedition, and was subsequently transported to the
  Paleontological Institute of the Russian Academy of Sciences. In 1992, it was
  described by palaeontologist Sergei Kurzanov. The sole species of
  Udanoceratops, also the type species, is Udanoceratops tschizhovi, named after
  a colleague of Kurzanov, D. O. Tschizhov. Additional remains have been
  assigned to Udanoceratops, though these may be misattributions.
diet: herbivore
locomotion: quadrupedal
