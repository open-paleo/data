genus: Unaysaurus
parent: Unaysauridae
etymology: From 'unay', a word meaning 'black water' in the Tupi language indigenous to Brazil, referring to the black-water stream near the discovery site, combined with Greek 'sauros' meaning 'lizard'.
pronunciation:
  phonetic: yoo-na-hee-SOR-us
description: Unaysaurus is a genus of herbivorous unaysaurid sauropodomorph
  dinosaur. Discovered in southern Brazil, in the geopark of Paleorrota, in
  1998, and announced in a press conference on Thursday, December 3, 2004, it is
  one of the oldest dinosaurs known. It is closely related to plateosaurid
  dinosaurs found in Germany, which indicates that it was relatively easy for
  species to spread across the giant landmass of the time, the supercontinent of
  Pangaea. The fossils of Unaysaurus are well-preserved. They consist of an
  almost complete skull, including a lower jaw, and partial skeleton with many
  of the bones still connected to each other in their natural positions. It is
  one of the most complete dinosaur skeletons (including complete skull) ever
  recovered in Brazil.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Well developed laterodorsally oriented process formed by frontal and
    parietal (more developed than in Plateosaurus)
  - Medial depression on mediodorsal surface of the parietals
  - Two fossae on the maxillary medial lamina
  - Deep ventral depression on the basisphenoid
  - Conspicuous blunt ridge running on lateral surface of deltopectoral crest
appearance:
  features:
    - downturned snout
  integument: scaled
  evidence: inferred
