    institution: UFSM
    species: Unaysaurus tolentinoi
    category: ontogeny
    significance: "A skeletally immature individual discovered in association with the holotype, including partial vertebrae and foot material similarly proportioned to the holotype bones; documents an early growth stage of the taxon."
    references: [müller2023a]
