genus: Unaysaurus
parent: Unaysauridae
etymology: From 'unay', a word meaning 'black water' in the Tupi language indigenous to Brazil, referring to the black-water stream near the discovery site, combined with Greek 'sauros' meaning 'lizard'.
pronunciation:
  phonetic: yoo-na-hee-SOR-us
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Well developed laterodorsally oriented process formed by frontal and
    parietal (more developed than in Plateosaurus)
  - Medial depression on mediodorsal surface of the parietals
  - Two fossae on the maxillary medial lamina
  - Deep ventral depression on the basisphenoid
  - Conspicuous blunt ridge running on lateral surface of deltopectoral crest
appearance:
  features:
    - downturned snout
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "62958"
  - source: wikidata
    id: Q133130
  - source: gbif
    id: "4967208"
  - source: eol
    id: "4531236"
species:
  - name: Unaysaurus tolentinoi
    etymology: Named for Tolentino Flores Marafiga, of the Água Negra locality
      in São Martinho da Serra, Rio Grande do Sul, who discovered the specimen.
    pronunciation:
      phonetic: toh-len-TEE-noh-eye
    status: valid
    type_species: true
    period:
      name:
        - Late Triassic
      stage:
        - Norian
    location:
      country: BR
      locality: Água Negra
      region: BR-RS
      formation: Caturrita
      coordinates:
        - -29.601556
        - -53.857028
    type_specimen:
      specimen_id: [UFSM 11069]
      specimen_type: holotype
      institution: UFSM
      material: Partial skeleton (about 70% complete) consisting of skull and lower
        jaw; axis; ten dorsal vertebrae; 30 caudal vertebrae; both scapulae, coracoid,
        humeri, ulnae, radii; metacarpals and manus elements; incomplete tibiae; right
        astragalus; left metatarsals and pedal elements.
      completeness: complete
    size:
      hip_height_m:
        min: 0.8
        max: 0.8
      length_m:
        min: 2.5
        max: 2.5
      weight_kg:
        min: 70
        max: 70
    erected_in: leal2004a
notable_specimens:
