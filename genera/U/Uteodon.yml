    etymology: From Greek 'aphanoe-' ('hidden') and '-cetes' ('to dwell'), for a
      specimen that had stood on public exhibit unrecognized for over 75 years.
    status: valid
    type_species: true
    period:
      name:
        - Late Jurassic
      stage:
        - Tithonian
    location:
      country: US
      locality: East end of Carnegie Quarry, Dinosaur National Monument
      region: US-UT
      formation: Morrison
      member: Brushy Basin
      part: middle
    type_specimen:
      specimen_id:
        - CM 11337
      specimen_type: holotype
      institution: CM
      material: "Partial articulated skeleton: 8 cervicals, 16 dorsals, 4
