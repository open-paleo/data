genus: Uteodon
parent: Ankylopollexia
placement: incertae sedis
etymology: From 'Ute', the Native American people of the region around Dinosaur
  National Monument, and Greek 'odon' ('tooth'); meaning 'Ute tooth'.
description: Uteodon is a genus of herbivorous iguanodontian dinosaur. It is a
  basal iguanodontian which lived during the late Jurassic period (Tithonian
  age) in what is now Uintah County, Utah. It is known from the middle of the
  Brushy Basin Member, Morrison Formation. The genus was named by Andrew T.
  McDonald in 2011 and the type species is U. aphanoecetes.
dispute:
  summary: >
    The validity of Uteodon is contested. McDonald (2011) erected the genus for
    the Dinosaur National Monument skeleton that Carpenter and Wilson (2008) had
    named Camptosaurus aphanoecetes, diagnosing it in part on an occipital
    condyle projecting farther ventrally than the basal tubera. Carpenter and
    Lamanna (2015) reassigned the braincase carrying that character to Dryosaurus
    and concluded the genus has no diagnosis separating it from Camptosaurus,
    returning the species to Camptosaurus aphanoecetes. Fonseca and others (2024)
    explicitly decline that synonymy and retain Uteodon as a separate genus, as
    do subsequent analyses that score it as its own terminal taxon, so it is kept
    valid here. Its position is separately unsettled: McDonald (2011) recovered
    it among the most basal Styracosterna, whereas Poole (2022) and Fonseca and
    others (2024) recover it as a basal ankylopollexian outside Styracosterna.
    Poole (2022) went further and emended the definition of Ankylopollexia to
    name Uteodon aphanoecetes an internal specifier, which places it inside that
    clade by construction. It is placed at Ankylopollexia incertae sedis.
  history:
    - date: "2026-08-07"
      note: >
        Intaken at Ankylopollexia incertae sedis. The occipital-condyle
        character of the original diagnosis is omitted from diagnostic_features
        because the braincase carrying it was later referred to Dryosaurus.
diet: herbivore
locomotion: facultative
diagnostic_features:
  - Scapula has an acromion process that is convex along its cranial margin
  - Dorsal margin of the scapula is convex
  - Dorsal margin of the ilium is convex and thickens mediolaterally towards the
    M. iliocaudalis platform
  - Postacetabular process of the ilium tapers to a point with a break in slope
    along the dorsal margin
  - Distal end of the ischium forms a cranially expanded boot
  - Postzygapophyses of the axis extend well beyond the posterior face of the
    centrum
  - Neural spine of the axis is laterally compressed above the postzygapophyses
    rather than expanded into a deep pocket
  - Cervical vertebra 7 has a wedge-shaped centrum in lateral view
  - Neural arches of the posterior cervical vertebrae are very tall
  - Scapular blade is arched in profile with a steeply sloped distal end
  - Deltopectoral crest of the humerus is a low, non-prominent triangle
