      completeness: partial
    erected_in: carpenter2008a
references:
  - id: mcdonald2011a
    notes: Erects the genus for Camptosaurus aphanoecetes and recovers it among
      the most basal Styracosterna.
  - id: carpenter2008a
    notes: Erects the species as Camptosaurus aphanoecetes on CM 11337; source of
      the holotype material and the original species diagnosis.
  - id: carpenter2015a
    notes: Refers the braincase bearing the genus's diagnostic character to
      Dryosaurus and treats Uteodon as a junior subjective synonym of
      Camptosaurus.
  - id: poole2022a
    notes: Recovers Uteodon as the most basal ankylopollexian and emends the
      definition of Ankylopollexia to name it an internal specifier.
  - id: fonseca2024a
    notes: Declines the synonymy with Camptosaurus and recovers Uteodon as a
      basal ankylopollexian.
  - id: maidment2023a
    notes: Uses Uteodon as a comparative taxon throughout the osteology of
      Cumnoria prestwichii.
  - id: bonsor2023a
    notes: Scores Uteodon aphanoecetes as a distinct terminal taxon in a
      redescription of the Mantellisaurus holotype.
