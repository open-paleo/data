genus: Uberabatitan
parent: Rinconsauria
etymology: Named after Uberaba, the city in Minas Gerais, Brazil where it was found, combined with Greek titan meaning 'giant'; translates as 'Uberaba titan'
description: Uberabatitan is a genus of titanosaurian sauropod dinosaur from the
  Late Cretaceous of Brazil. It is known from bones including neck, back, and
  tail vertebrae, pelvic bones, and limb bones. These fossils were found in the
  uppermost portion of the Maastrichtian-age Serra da Galga Formation of the
  Bauru Group, in Uberaba, Minas Gerais. The type species, described by Salgado
  and Carvalho in 2008, is U. ribeiroi. To date, it is the most recent
  titanosaur from Bauru Group rocks; other titanosaurs from the Bauru Group,
  including Baurutitan and Trigonosaurus, come from lower (thus older) levels.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Anterior and mid-cervicals with segmented postzygodiapophyseal lamina
    (zygapophyseal segment extends rostrodorsally over diapophyseal segment)
  - Mid-dorsals with robust composite lateral lamina formed mainly by
    diapophyseal lamina and relic spinodiapophyseal lamina
  - Mid and posterior dorsals with neural accessory laminae parallel to
    prespinal lamina (probable spinoprezygapophyseal laminae)
  - Mid-caudal centra with deeply excavated lateral faces
  - Pubis notably thick and robust with very stout longitudinal crest on
    external (ventral) face
  - Tibia with very robust lateral protuberance articulating with equally robust
    medial knob of fibula
