genus: Unquillosaurus
parent: Avetheropoda
placement: incertae sedis
dispute:
  summary: >
    Unquillosaurus ceibalii is known only from a single pubis, and its affinities
    have moved with each rereading of that bone. Powell (1979) took it for a
    carnosaur; Novas and Agnolín (2004) emended the diagnosis and argued from the
    pubis for a position within Metornithes, close to Paraves; Carrano et al.
    (2012) recovered it as a carcharodontosaurid; and Agnolín and Novas (2013),
    rejecting that referral, judged it probably a very large averaptoran, from
    comparison rather than a scored analysis. What is contested is where it
    belongs, not whether the bone is diagnosable. It sits at Avetheropoda
    incertae sedis, the nearest node all four readings share.
  history:
    - date: "2026-07-01"
      note: Moved from Carcharodontosauridae to Maniraptora incertae sedis following the prevailing maniraptoran interpretation; a nomen dubium.
    - date: "2026-09-08"
      note: Moved from Maniraptora to Avetheropoda incertae sedis. The carcharodontosaurid reading places it in Allosauroidea, outside Coelurosauria, so Maniraptora took one side of the dispute rather than sitting above it.
    - date: "2026-09-08"
      note: Status changed from nomen dubium to valid. The only work calling it doubtful is a reference-work table tag; the primary treatments each argue a placement from autapomorphies of the pubis, and Novas and Agnolín emend its diagnosis.
pronunciation:
  phonetic: oong-KEE-yo-SAWR-us
etymology: "Named for the Unquillo River of Salta Province, Argentina, combined
  with Greek 'sauros' meaning 'lizard'."
description: Unquillosaurus is a genus of large theropod dinosaur from the Late
  Cretaceous Los Blanquitos Formation of Salta Province, Argentina. Its precise
  classification is uncertain, but most researchers consider it as a
  maniraptoran, though a carcharodontosaurid position has also been argued from
  the same bone. The genus contains a single species, U. ceibalii, known only
  from a single fossilized pubis (a pelvic bone).
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Pubis proportionally long and slender, and at 51.4 cm longer than in basal
    maniraptorans such as Deinonychus and Unenlagia
  - Pubic shaft craniocaudally compressed over its proximal three quarters rather
    than rod-like, raising a prominent longitudinal ridge on the external surface
  - Compression of the proximal shaft giving way to craniocaudal expansion
    distally, twisting the bone along its length, where most theropods have
    nearly parallel shaft margins
  - Margins of the pelvic canal medially convex, against the medially concave
    margins of most theropods
  - Pubic shaft without an apron and lacking a medial symphysis, contact with the
    opposite bone reduced to a medially flattened distal end that bears no
    articular marks
  - Apex of the caudal process of the pubic foot curved dorsally, a condition
    absent in other theropods
