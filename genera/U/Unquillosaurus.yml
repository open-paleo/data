genus: Unquillosaurus
parent: Maniraptora
dispute:
  summary: >
    Unquillosaurus ceibalii is known only from a single pubis and has been placed
    variously as a carnosaur, a carcharodontosaurid (Carrano et al., 2012), and a
    maniraptoran; the prevailing recent view treats it as a maniraptoran, possibly a
    member of Averaptora or Unenlagiinae (Novas and Agnolín, 2004; Agnolín and Novas,
    2013). It is a probable nomen dubium and is placed conservatively at Maniraptora
    incertae sedis.
  history:
    - date: "2026-07-01"
      note: Moved from Carcharodontosauridae to Maniraptora incertae sedis following the prevailing maniraptoran interpretation; a nomen dubium.
pronunciation:
  phonetic: oong-KEE-yo-SAWR-us
etymology: "Named for the Unquillo River of Salta Province, Argentina, combined
  with Greek 'sauros' meaning 'lizard'."
description: Unquillosaurus is a genus of large theropod dinosaur from the Late
  Cretaceous Los Blanquitos Formation of Salta Province, Argentina. Its precise
  classification is uncertain, but most researchers consider it as a
  maniraptoran. The genus contains a single species, U. ceibalii, known only
  from a single fossilized pubis (a pelvic bone).
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Pubis with proximal expansion cut by a canal in the anterolateral part
  - Obturator foramen open
  - External face of the shaft crossed by a prominent longitudinal crest
  - Pubic foot without anterior projection
