genus: Utahraptor
parent: Dromaeosaurinae
pronunciation:
  phonetic: YOO-tah-RAP-tor
etymology: "Named for the state of Utah, USA, where the fossils were found,
  combined with Latin 'raptor' meaning 'robber' or 'plunderer'."
description: Utahraptor is a genus of large dromaeosaurid (a group of feathered
  carnivorous theropods) dinosaur that lived during the Early Cretaceous period
  from around 139 to 135 million years ago in what is now the United States. The
  genus was described in 1993 by American paleontologist James Kirkland and
  colleagues with the type species Utahraptor ostrommaysi, based on fossils that
  had been unearthed earlier from the Cedar Mountain Formation of Utah. Later,
  many additional specimens were described including those from the skull and
  postcranium in addition to those of younger individuals.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
appearance:
  features:
    - sickle claw
  integument: feathered
diagnostic_features:
  - Manual claws more specialized as cutting blades than other dromaeosaurs,
    with H/W ratios 26-37
  - Lachrymal with distinctly parallel mesial and outer sides, elongate
    subrectangular in dorsal view
  - Premaxilla with base of nasal opening parallel to premaxillary tooth row
  - Very large size, at least 100% larger than Deinonychus
  - Manual claws more laterally compressed than pedal unguals
