genus: Utetitan
parent: Titanosauria
etymology: From 'Ute', honoring the original Ute peoples of central Utah on
  whose ancestral lands the holotype was recovered, and Greek 'titan' (giant).
pronunciation:
  phonetic: YOO-tee-TIE-tuhn
description: Utetitan is an extinct genus of titanosaurian sauropod dinosaur
  from the late Maastrichtian (Late Cretaceous) of southwestern North America.
  The single species, Utetitan zellaguymondeweyae, is based on USNM 15560 —
  a partial postcranial skeleton from the lower North Horn Formation at
  Joe's Valley on the Wasatch Plateau, Emery County, Utah — formerly the
  primary referred specimen of Alamosaurus sanjuanensis. Paul (2025) split
  this material away from Alamosaurus on the basis of scapular and ischial
  autapomorphies, restricted A. sanjuanensis to its New Mexican type
  horizon, and erected the new subfamily Utetitaninae for the new genus;
  that clade-name is single-paper-recent and not adopted as a parent here
  per the project's taxonomy policy.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Acromion process of the scapula strongly prominent.
  - Posterior profile of the scapula strongly sinuous, producing a prominent
    triangular glenoid process.
  - Paired tubercles dorsal to the scapular glenoid fairly prominent and
    widely separated.
  - Postero-dorsal edge of the scapular blade flares prominently posteriorly.
  - Lateral process of the ischium modest in size.
  - Postero-lateral profile of the ischium moderately concave-arced.
appearance:
  integument: armored
