genus: Uragasaurus
parent: Mamenchisauridae
etymology: 'From Sanskrit "uraga" ("snake" or "serpent"), a reference to the long
  neck typical of mamenchisaurids, combined with Greek "sauros" ("lizard");
  meaning "serpent lizard".'
description: Uragasaurus is an extinct genus of mamenchisaurid sauropod dinosaur
  known from the Late Jurassic Phu Kradung Formation of Thailand. The genus
  contains a single species, Uragasaurus kalasinensis, known from a single
  dorsal (trunk) vertebra. It is the first member of the family Mamenchisauridae
  named from Thailand.
diet: herbivore
paleoenvironment:
  - fluvial
diagnostic_features:
  - Anterior dorsal vertebra bears prominent, elongated teardrop-shaped
    pneumatic fossae on the distal portion of the transverse processes.
  - Intraprezygapophyseal laminae meet ventromedially to form a Y-shaped
    configuration in anterior view, incorporating a single vertical
    intraprezygapophyseal lamina.
  - Shallow, subtriangular pleurocoel lacking an internal septum.
