genus: Ultrasaurus
parent: Sauropoda
etymology: From Latin ultra (beyond, exceeding) and Greek
  sauros (lizard); meaning "ultra lizard", reflecting Kim's
  inference that the animal exceeded Supersaurus in size.
description: >
  Ultrasaurus is a genus of sauropod dinosaur discovered by
  Haang Mook Kim in South Korea. However, the name was first
  used unofficially (as a nomen nudum) in 1979 by Jim Jensen to
  describe a set of giant dinosaur bones he discovered in the
  United States. Because Kim published the name for his
  specimen before Jensen could do so officially, George
  Olshevsky renamed the specimen as Ultrasauros. Jensen's giant
  sauropod was later found to be a chimera, and the type
  remains are now assigned to Supersaurus.
diet: herbivore
locomotion: quadrupedal
diagnostic_features:
  - Ulna estimated total length ~118 cm, with proximal epiphysis long axis of 42
    cm — larger than any known sauropod including Supersaurus
  - Distal long axis of ulna (~55 cm) equals the distal femur long axis of
    Supersaurus, implying a much larger overall body size
  - Neural spine of caudal vertebra (DGBU-1978A) 17.0 cm long, 11.5 cm wide, 4.5
    cm wider than equivalent element in Mamenchisaurus hochuanensis
paleoenvironment:
  - fluvial
appearance:
  integument: scaled
  evidence: inferred
