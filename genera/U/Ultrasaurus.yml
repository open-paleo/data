genus: Ultrasaurus
parent: Diplodocinae
etymology: ultra lizard
description: Ultrasaurus is a genus of sauropod dinosaur discovered by Haang
  Mook Kim in South Korea. However, the name was first used unofficially (as a
  nomen nudum) in 1979 by Jim Jensen to describe a set of giant dinosaur bones
  he discovered in the United States. Because Kim published the name for his
  specimen before Jensen could do so officially, George Olshevsky renamed the
  specimen as Ultrasauros. Jensen's giant sauropod was later found to be a
  chimera, and the type remains are now assigned to Supersaurus.
diet: herbivore
locomotion: quadrupedal
