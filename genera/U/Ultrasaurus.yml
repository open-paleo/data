genus: Ultrasaurus
parent: Sauropoda
pronunciation:
  phonetic: UL-truh-SAWR-us
etymology: From Latin ultra (beyond, exceeding) and Greek
  sauros (lizard); meaning "ultra lizard", reflecting Kim's
  inference that the animal exceeded Supersaurus in size.
description: >
  Ultrasaurus is a genus of sauropod dinosaur discovered by
  Haang Mook Kim in South Korea. However, the name was first used unofficially
  (as a nomen nudum) in 1979 by Jim Jensen to describe a set of giant dinosaur
  bones Jensen discovered in the United States. Because Kim published the name
  for Kim's specimen before Jensen could do so officially, George Olshevsky
  renamed the specimen as Ultrasauros. Jensen's giant
  sauropod was later found to be a chimera, and the type
  remains are now assigned to Supersaurus.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "56450"
  - source: wikidata
    id: Q277682
  - source: gbif
    id: "4822851"
species:
  - name: Ultrasaurus tabriensis
    etymology: From Tabri (Tabri station, near the type
      locality at Bongam pass) and Latin -ensis ("from");
      meaning "from Tabri".
    status: nomen dubium
    type_species: true
    period:
      name:
        - Early Cretaceous
      stage:
        - Albian
    location:
      country: KR
      region: KR-47
      formation: Hupyeongdong
      member: Gugyedong
      locality: roadside cliff near Bongam pass, 1.6 km southwest of Tabri station, Geumseong-myeon, Euiseong-gun
      part: lower
      notes: >
        Kim (1983) places the bed about 47 m above the Gumidomari
        Conglomerate, in what the paper calls the Gugyedong Formation; Choi and Kwon
        (2019) rank the Gugyedong as the upper member of the Hupyeongdong
        Formation and date it between about 106 and 100 Ma.
    type_specimen:
      specimen_id:
        - DGBU-1973
      specimen_type: holotype
      institution: DGBU
      material: Partial bone identified by Kim as a right ulna
        (preserved length 70 cm, estimated ~118 cm complete);
        later workers reinterpret the element as a humerus,
        yielding much smaller body-size estimates and rendering
        the genus a nomen dubium.
      completeness: fragmentary
    erected_in: kim1983a
references:
  - id: kim1983a
    notes: Erects Ultrasaurus tabriensis on DGBU-1973 from the Gugyedong
      Formation at Bongam pass; Kim classified the genus in Brachiosauridae and
      estimated 40 m / 120 t. In Korean with English abstract.
  - id: choi2019a
    notes: Ranks the Gugyedong as a member of the Hupyeongdong Formation and brackets it by detrital zircon at about 106 to 100 Ma, late Albian.
