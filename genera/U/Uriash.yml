genus: Uriash
parent: Lithostrotia
etymology: "From Romanian 'uriaș' meaning 'giant', referencing the giant figure in Romanian folklore, reflecting the animal's notably large size compared to other local sauropod remains"
pronunciation:
  phonetic: yoo-ree-ash
description: Uriash is a genus of titanosaurian sauropod dinosaur from the Late
  Cretaceous (Maastrichtian) of Romania. The holotype of this genus was
  originally referred to Magyarosaurus hungaricus, which is now classified in a
  separate genus, Petrustitan.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Posterior caudal vertebrae with markedly procoelous centrum and distinctive
    hour-glass shaped contour in ventral view
  - Posterior caudal vertebrae with anteroposteriorly elongated neural arch
    pedicels
  - Midline longitudinal convexity along posterior humeral shaft curving
    distally towards medial edge
  - Proximal half of humerus with anteromedial arm
  - Large and proximodistally elongated oval foramen in posterolateral
    depression of proximal humerus
  - Hypertrophied bulge for insertion site of M. latissimus dorsi
  - Femoral shaft transversely expands distally at point close to its midlength
  - Hypertrophied femoral fourth trochanter
