genus: Udelartitan
parent: Saltasauroidea
etymology: "Combines 'UdelaR', an acronym for the Universidad de la República of
  Uruguay, with 'titan', a common suffix for large sauropod names referencing
  the pre-Olympian Titans of Greek mythology"
pronunciation:
  phonetic: YOO-duh-lar-TIE-tuhn
description: Udelartitan is an extinct genus of saltasauroid titanosaurian
  sauropod dinosaur from the Late Cretaceous Guichón Formation of Uruguay. The
  genus contains a single species, U. celeste, known from fragmentary remains of
  at least two individuals.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Biconvex first caudal centrum
  - Anterior caudal vertebrae with well-developed quadrangular neural spines and
    postspinal laminae
  - Pneumatic foramina in anteriormost caudal centra
  - Dorsal tuberosities on transverse processes of anterior caudal vertebrae
  - Middle caudal centra cotyles and condyles with hexagonal contour
    (autapomorphy)
  - Well developed fibular knob on posteromedial edge of fibula
  - Pyramidal astragalus
  - Marked oblique ridges on anterior face of metatarsals I and II (autapomorphy)
appearance:
  integument: scaled
  evidence: inferred
