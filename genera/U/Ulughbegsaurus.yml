genus: Ulughbegsaurus
parent: Carcharodontosauria
dispute:
  summary: >
    Ulughbegsaurus uzbekistanensis was described as a carcharodontosaurian close to
    Neovenator (Tanaka et al., 2021), but its identity has been questioned, with some
    workers treating the material as indeterminate or non-carcharodontosaurian (Sues
    et al., 2024; Kellermann et al., 2025). It is placed conservatively at
    Carcharodontosauria incertae sedis.
  history:
    - date: "2026-07-01"
      note: Placed at Carcharodontosauria incertae sedis (formerly grouped in the deprecated Neovenatoridae); its validity and referral are uncertain.
etymology: Named after Ulugh Beg (the 15th-century Timurid sultan and astronomer), combined with Greek sauros meaning 'lizard'; translates as 'Ulugh Beg's lizard'
description: Ulughbegsaurus is an extinct genus of carcharodontosaurid theropod
  dinosaurs from the Late Cretaceous Bissekty Formation (Turonian age) and
  Khodzhakul Formation (Cenomanian age) of Uzbekistan. The genus contains a
  single species, Ulughbegsaurus uzbekistanensis, known from multiple maxilla
  fragments.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Series of shallow, oval depressions on the lateral surface along the ventral
    edge of maxilla
  - Tubercles along with ridged rim of the antorbital fossa
  - Vertically oriented ridges on the lateral surface of maxilla
  - Large foramina at dorsal edge of dental plates in maxilla
  - Rugose lateral surface texture characteristic of Carcharodontosauria
