genus: Utahceratops
parent: Chasmosaurinae
etymology: From 'Utah', the U.S. state where the fossil was found, and Greek 'keras' (stem 'cerat') meaning 'horn' and 'ops' meaning 'face', hence 'Utah horned face'.
pronunciation:
  phonetic: YOO-tah-SEH-ruh-tops
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - wetland
diagnostic_features:
  - Nasal horncore caudally positioned, almost entirely behind external naris
  - Supraorbital horncores short, robust, dorsolaterally directed, and oblate in
    shape with blunt tip
  - Episquamosals on mid portion of lateral frill margin low and extremely
    elongate (some >10 cm long)
  - Median portion of transverse bar of parietal rostrally curved
appearance:
  features:
    - brow horns
    - nasal horn
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "243363"
  - source: wikidata
    id: Q134308
  - source: gbif
    id: "8527035"
  - source: eol
    id: "17924513"
species:
  - name: Utahceratops gettyi
    etymology: Named for Mike Getty, who discovered the holotype and has played
      a pivotal role in recovering fossils from Grand Staircase-Escalante National
      Monument.
    pronunciation:
      phonetic: GET-ee-eye
    status: valid
    type_species: true
    period:
