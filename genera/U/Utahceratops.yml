genus: Utahceratops
parent: Chasmosaurinae
etymology: From 'Utah', the U.S. state where the fossil was found, and Greek 'keras' (stem 'cerat') meaning 'horn' and 'ops' meaning 'face', hence 'Utah horned face'.
description: Utahceratops is an extinct genus of ceratopsian dinosaur that lived
  approximately 76.4~75.5 million years ago during the Late Cretaceous period in
  what is now Utah. Utahceratops was a large-sized, robustly-built,
  ground-dwelling, quadrupedal herbivore, that could grow up to an estimated
  4.5–5 m (15–16 ft) long.
diet: herbivore
locomotion: quadrupedal
