genus: Unenlagia
parent: Unenlagiinae
pronunciation:
  phonetic: oon-en-LAHG-ee-a
etymology: "From Mapuche 'unum' meaning 'bird' and 'llag' meaning 'half', meaning 'half-bird', reflecting its interpreted transitional position between birds and basal theropods."
description: "Unenlagia is a genus of unenlagiine theropod dinosaur that lived
  in South America during the Late Cretaceous period. The genus Unenlagia has
  been assigned two species: U. comahuensis, the type species described by Novas
  and Puerta in 1997, and U. paynemili, described by Calvo et al. in 2004."
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Tall neural spines in posterior dorsals and anterior sacral vertebrae,
    nearly twice height of centrum
  - Deep lateral pits in base of neural spines of posterior dorsals and anterior
    sacrals
  - Twisted scapular shaft with dorsal-facing external surface
  - Inflected dorsal margin of postacetabular iliac blade
  - Laterally oriented humeral articulation of scapula (previously unreported in
    non-avian dinosaurs)
  - Laterally oriented glenoid cavity enabling avian-style forelimb folding and
    elevation
appearance:
  features:
    - sickle claw
  integument: feathered
  evidence: direct
