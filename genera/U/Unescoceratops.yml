genus: Unescoceratops
parent: Leptoceratopsidae
etymology: "Named for UNESCO (United Nations Educational, Scientific and Cultural Organization), in reference to the fossil being found in Dinosaur Provincial Park, a UNESCO World Heritage Site, combined with Greek 'keras' meaning 'horn' and 'ops' meaning 'face'"
description: Unescoceratops is a genus of leptoceratopsid ceratopsian dinosaurs
  known from the Late Cretaceous of Alberta, southern Canada. It contains a
  single species, Unescoceratops koppelhusae.
