genus: Unescoceratops
parent: Leptoceratopsidae
etymology: "Named for UNESCO (United Nations Educational, Scientific and Cultural Organization), in reference to the fossil being found in Dinosaur Provincial Park, a UNESCO World Heritage Site, combined with Greek 'keras' meaning 'horn' and 'ops' meaning 'face'"
pronunciation:
  phonetic: oo-NESS-co-SEH-ruh-tops
description: Unescoceratops is a genus of leptoceratopsid ceratopsian dinosaurs
  known from the Late Cretaceous of Alberta, southern Canada. It contains a
  single species, Unescoceratops koppelhusae.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Gentle rather than pronounced curvature of ventral margin of dentary
  - Flange-like anteroventral margin projecting as distinct chin below ventral
    margin
  - Dentary teeth from middle of tooth row as wide as high with rounded lingual
    profile
  - Marginal denticles extending almost to root of teeth, unlike other
    leptoceratopsids
  - Hatchet-shaped dentary in lateral view due to chin and anteriorly deeper form
  - Recumbent coronoid process inclined at shallow posterodorsal angle
