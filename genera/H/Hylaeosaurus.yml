etymology: "From Greek hylaios (of the forest, woodland) and sauros (lizard); meaning 'woodland lizard' or 'forest lizard', named because its remains were found in the Tilgate Forest area of England"
description: Hylaeosaurus is a herbivorous ankylosaurian dinosaur that lived
