synonyms:
  - name: Hylosaurus
    type: junior objective
    reason: Variant spelling treated as a junior synonym of Hylaeosaurus.
  - name: Vectensia
    type: nomen nudum
    reason: Informal name; never met ICZN requirements for formal publication and is treated as referable to Hylaeosaurus. Per Olshevsky's Dinosaur Genera List.
species:
  - name: Hylaeosaurus armatus
    etymology: "From Latin 'armatus' meaning 'armed' or 'armored', in reference to the spikes and armor plates of the holotype."
    status: valid
