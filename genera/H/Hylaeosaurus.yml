genus: Hylaeosaurus
parent: Nodosauridae
pronunciation:
  ipa: /haɪˌliːoʊˈsɔːrəs/
  phonetic: hy-LEE-o-SOR-uhs
etymology: "From Greek hylaios (of the forest, woodland) and sauros (lizard); meaning 'woodland lizard' or 'forest lizard', named because its remains were found in the Tilgate Forest area of England"
description: Hylaeosaurus is a herbivorous ankylosaurian dinosaur that lived
  about 136 million years ago, in the late Valanginian stage of the early
  Cretaceous period of England. It was found in the Grinstead Clay.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - coastal
  - fluvial
  - marine
  - wetland
diagnostic_features:
  - Coracoid with entire margin, lacking apophyses of monitors or Megalosaurus
  - Sternal apparatus resembling monitors more than crocodiles
  - Remarkable bony processes around sternum, 5-17 inches in length, distributed
    along vertebral column
  - Dermal bones with linear spiculae structure attached to scales
  - Likely possessed dorsal dermal fringe of spines along back or tail
