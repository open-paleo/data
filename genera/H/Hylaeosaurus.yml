genus: Hylaeosaurus
parent: Nodosauridae
pronunciation:
  ipa: /haɪˌliːoʊˈsɔːrəs/
  phonetic: hy-LEE-o-SOR-uhs
etymology: "From Greek hylaios (of the forest, woodland) and sauros (lizard); meaning 'woodland lizard' or 'forest lizard', named because its remains were found in the Tilgate Forest area of England"
description: Hylaeosaurus is a herbivorous ankylosaurian dinosaur that lived
  about 136 million years ago, in the late Valanginian stage of the early
  Cretaceous period of England. It was found in the Grinstead Clay.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - coastal
  - fluvial
  - marine
  - wetland
diagnostic_features:
  - Sharp ~120° angle between the acromial process and the proximal plate of the
    scapula, to a greater extent than in Hoplitosaurus.
  - Acromial process of the scapula shelf-like (not thumb-like or folded over),
    projecting ventrolaterally from the dorsal third of the scapular blade.
  - Dorsal edge of the proximal plate of the scapula curving laterally.
  - Anteroposteriorly trending ridge at mid-height on the lateral surfaces of
    the cervical centra.
  - Centrodiapophyseal fossa of the dorsal vertebrae strongly concave, with
    strong anterior and posterior centrodiapophyseal laminae separating it from
    the prezygapophyseal and postzygapophyseal centrodiapophyseal fossae.
appearance:
  features:
    - body armor
    - shoulder spikes
    - osteoderms
  integument: armored
  evidence: direct
identifiers:
  - source: pbdb
    id: "38822"
  - source: wikidata
    id: Q131770
  - source: gbif
    id: "3238876"
  - source: eol
