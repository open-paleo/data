genus: Huayangosaurus
parent: Stegosauria
placement: incertae sedis
pronunciation:
  phonetic: HWAH-YAHNG-o-SAWR-us
etymology: From Huayang (華陽), an alternate historical name for Sichuan Province,
  China, combined with Greek sauros (lizard); meaning 'Huayang lizard'
description: Huayangosaurus is a genus of stegosaurian dinosaur from the Middle
  Jurassic of China. The name derives from "Huayang" (華陽), an alternate name for
  Sichuan (the province where it was discovered), and "saurus", meaning
  "lizard". It lived during the Bathonian to Callovian stages, around 165
  million years ago, some 20 million years before its famous relative,
  Stegosaurus appeared in North America. At only approximately 4 meters (13 ft)
  long, it was also much smaller than its famous cousin. Found in the Lower
  Shaximiao Formation, Huayangosaurus shared the local Middle Jurassic landscape
  with the sauropods Shunosaurus, Datousaurus, Omeisaurus and Protognathosaurus,
  the ornithopod Xiaosaurus and the carnivorous Gasosaurus.
dispute:
  summary: >
    Huayangosaurus is the basal-most well-known stegosaur and the type genus of
    the traditional family Huayangosauridae. That family is of disputed utility,
    as its only consistent additional member (Chungkingosaurus) is recovered
    variously within or outside it and recent works deprecate the node, so
    Huayangosaurus is retained at Stegosauria incertae sedis rather than placed
    in a near-monotypic family.
  history:
    - date: "2026-06-26"
      note: Placed at Stegosauria incertae sedis, Huayangosauridae not retained as a node (unstable membership, deprecated by recent works).
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Premaxilla bears teeth, a primitive feature absent in all other known
    stegosaurs
  - Small triangular antorbital fenestra anterior to the orbit
  - Two supraorbital bones above the orbit
  - Angular bone with a small mandibular foramen on its upper margin
  - Four sacral vertebrae firmly fused; sacral centrum lacks pleurocoels; dorsal
    surface of sacrum not closed
  - Cervical dermal ossicles rounded-oval; dorsal dermal ossicles narrow and
    spear-shaped
appearance:
  features:
    - dermal plates
    - shoulder spikes
    - tail spikes
  integument: armored
  evidence: direct
