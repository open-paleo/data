references:
  - id: dong1982a
  - id: jones2026a
    notes: Source of the hip height estimate, and the appearance features.
  - id: maidment2006b
  - id: maidment2008a
    notes: Recovers Huayangosaurus among the earliest stegosaurs, with
      Gigantspinosaurus the most basal, and defines Huayangosauridae as
      stegosaurs closer to Huayangosaurus than to Stegosaurus.
  - id: madzia2021a
    notes: Registers Huayangosauridae as a defined clade, comprising
      Chungkingosaurus and Huayangosaurus under its reference phylogeny.
  - id: sánchez-fenollosa2025a
    notes: Divides Stegosauria into Huayangosauridae and Stegosauridae, with a
      five-genus Huayangosauridae that excludes Chungkingosaurus.
  - id: raven2023a
    notes: In its preferred analysis finds Huayangosaurus an early stegosaur,
      sister to Isaberrysaura, with no Huayangosauridae; its equal-weights and
      Bayesian analyses place both outside Eurypoda.
