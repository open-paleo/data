genus: Histriasaurus
parent: Rebbachisauridae
pronunciation:
  phonetic: HIS-tree-ah-SAWR-us
etymology: "Named for Histria (Istria), the peninsula in Croatia where the
  fossils were found, combined with Greek 'sauros' meaning 'lizard', meaning
  'Istria lizard'."
description: Histriasaurus (meaning "Istria lizard") is a genus of sauropod
  dinosaur from the Early Cretaceous (Hauterivian to Barremian stages, around
  135-125 million years ago) of Croatia. It has been suggested to be a
  rebbachisaurid, and if so one of the oldest known members of the group.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - lacustrine
diagnostic_features:
  - Hyposphene-hypantrum complex present in dorsal vertebrae (distinguishes from
    Rebbachisaurus)
  - Well-developed outer suprapostzygapophysial laminae running parallel to
    spine axis
  - Long diapophyses with steep upward inclination (~45°)
  - Neural arch three times the dorso-ventral centrum height
  - Complex suprapostzygapophysial laminar pattern with inner laminae confluent
    to form postspinal lamina
  - Undivided (single) neural spine
