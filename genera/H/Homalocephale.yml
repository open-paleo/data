genus: Homalocephale
parent: Eupachycephalosauria
description: Homalocephale is a genus of pachycephalosaurid dinosaur that lived
  during the Late Cretaceous period of what is now the Nemegt Formation,
  Mongolia. The genus was described in 1974 by Halszka Osmólska and Teresa
  Maryańska, and consists of a single species, H. calathocercos. Though
  Homalocephale has been regarded as a synonym (and juvenile form) of
  Prenocephale, juvenile specimens of the latter indicate that they were
  distinct. Homalocephale was 1.8 m (5.9 ft) long and possibly an omnivore.
diet: herbivore
