genus: Homalocephale
parent: Pachycephalosaurinae
pronunciation:
  phonetic: HOM-a-lo-SEF-a-lee
etymology: From Greek homalos (even, flat) and kephale (head); meaning 'even
  head' or 'flat-headed', referring to its flat skull roof unlike other
  pachycephalosaurs
description: Homalocephale is a genus of pachycephalosaurid dinosaur that lived
  during the Late Cretaceous period of what is now the Nemegt Formation,
  Mongolia. The genus was described in 1974 by Halszka Osmólska and Teresa
  Maryańska, and consists of a single species, H. calathocercos. Though
  Homalocephale has been regarded as a synonym (and juvenile form) of
  Prenocephale, juvenile specimens of the latter indicate that they were
  distinct. Homalocephale was 1.8 m (5.9 ft) long and possibly an omnivore.
dispute:
  summary: >
    Homalocephale has been proposed to be a juvenile or female of Prenocephale
    (Longrich and colleagues, 2010; still regarded as plausible by Longrich and
    Saitta, 2024), but Evans and colleagues (2018) showed that juvenile
    Prenocephale retain a parietosquamosal ornamentation pattern distinct from
    Homalocephale, supporting its validity. Its position is uncertain because
    the only specimen is immature (Evans and colleagues, 2011, 2021): Longrich
    and colleagues (2010) recovered it in a weakly supported Asian clade on the
    Pachycephalosaurus side of the tree, while Woodruff and colleagues (2025)
    left it unresolved within Pachycephalosauridae.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Cranial roof completely flat with distinct interfrontal and frontoparietal
    sutures (unique among Pachycephalosauridae)
  - Supratemporal fenestra large
  - Infratemporal fenestra low and elongated
  - Orbit large and nearly circular
  - Quadrate deflected posteriorly along upper half of length
  - Foramen magnum and occipital condyle both large
  - Basal tubera flat anteroposteriorly, ventral edges closely positioned to
    pterygoid wings
  - Maxillary tooth crowns small with medial ridge and anterior/posterior
    ridges; worn on lingual surface
  - Cranial roof ornamented with deep large pits peripherally, becoming denser
    toward midline
appearance:
  features:
    - cranial dome
  integument: scaled
  evidence: inferred
