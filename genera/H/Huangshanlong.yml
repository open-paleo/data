genus: Huangshanlong
parent: Mamenchisauridae
etymology: Huangshan dragon; named after Huangshan (Yellow Mountain) in Anhui
  Province, China, combined with Chinese long (dragon)
pronunciation:
  phonetic: hwohng-SHAHN-long
description: Huangshanlong is a genus of mamenchisaurid dinosaurs native to the
  Anhui province of China. It contains a single species, Huangshanlong
  anhuiensis, which represents, along with Anhuilong and Wannanosaurus, one of
  the three dinosaurs found in Anhui province.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Proximal humerus length 36% of total humeral length
  - "Transverse length ratio: radius 58% of humerus, ulna 67% of humerus"
  - Accessory processes located near middle of distal humerus anterior edge
  - Two cranial processes on proximal ulna form angle of ~90° or less
  - Craniomedial ulnar process longer than craniolateral process
  - Ridges developed on cranial, caudomedial, and caudolateral faces of distal
    ulna
appearance:
  integument: scaled
  evidence: inferred
