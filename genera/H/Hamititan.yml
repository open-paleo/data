genus: Hamititan
parent: Titanosauria
etymology: Hami giant; named after the Hami region of Xinjiang, China, where it was found, combined with Titan from Greek mythology
pronunciation:
  phonetic: HA-me-TIE-tuhn
description: Hamititan is a genus of titanosaur sauropod dinosaur from the
  Shengjinkou Formation of Xinjiang, China. It contains one species, the type
  species, Hamititan xinjiangensis.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - lacustrine
diagnostic_features:
  - Tall neural arches with neural arch higher than vertebral centrum height
  - Neural arch on anteriormost caudal sagittally expanded
  - Deep postzygapophyseal spinodiapophyseal fossa with inner open cavities on
    anteriormost caudal vertebrae
  - Transverse processes on anterior caudal vertebrae directed upwards with
    abrupt change to downward orientation
  - Prezygapophyses projecting anterodorsally on caudal vertebrae
appearance:
  integument: scaled
  evidence: inferred
