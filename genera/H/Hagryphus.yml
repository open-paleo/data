genus: Hagryphus
parent: Caenagnathinae
etymology: From Egyptian Ha (a god of the western desert) and Greek
  gryps/gryphon (griffin); meaning 'Ha's griffin'
description: Hagryphus is a monospecific genus of caenagnathid dinosaur from
  southern Utah that lived during the Late Cretaceous (upper Campanian stage,
  75.95 Ma) in what is now the Kaiparowits Formation of the Grand
  Staircase-Escalante National Monument. The type and only species, Hagryphus
  giganteus, is known only from an incomplete but articulated left manus and the
  distal portion of the left radius. It was named in 2005 by Lindsay E. Zanno
  and Scott D. Sampson. Hagryphus has an estimated length of 2.4-3 meters (8-10
  feet) and weight of 50 kilograms (110 lbs).
diet: omnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - wetland
diagnostic_features:
  - Hyper-robust phalanx of digit I, approximately 200% the breadth but not
    exceeding 140% the length, distinguishing it from Chirostenotes
  - Robust shaft of metacarpal I with width-to-length ratio of approximately
    20%, distinguishing it from Elmisaurus
  - Interphalangeal joint of digit I extending just distal to the
    metacarpophalangeal joint of digit II, unique among North American
    oviraptorosaurs
  - Lacking subequal metacarpals II and III and subequal digits II and III,
    distinguishing it from oviraptorids sensu Osm61ska et al.
  - Lacking reduction and/or fusion of metacarpals and phalanges, distinguishing
    it from Avimimus and Caudipteryx
  - 30-40% Larger than coeval Chirostenotes
  - Third digit only 77% the length of second digit, in contrast to most Asian
    oviraptorosaurs with subequal digits II and III
