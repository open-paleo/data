genus: Hungarosaurus
parent: Nodosauridae
etymology: Named for Hungary, with Greek 'sauros' (lizard); meaning 'Hungarian
  lizard'.
pronunciation:
  phonetic: hun-GAH-ro-SOR-us
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
appearance:
  features:
    - body armor
    - shoulder spikes
    - osteoderms
  integument: armored
diagnostic_features:
  - Large notch at front of premaxillae
  - Thin nasal process of premaxillae
  - Robust rhomboidal quadrate condyles
  - Large interpterygoid vacuity
  - Dorsoventrally wide quadratojugal with strong protuberance
  - Posterodorsally oriented crest-like protuberance on postorbital
  - Short diastema between symphysis and first dentary tooth position
  - Very short retroarticular process of surangular
  - Anteriormost dorsal vertebra with unusual transversely wide,
    anteroposteriorly short amphicoelous centrum with very large neural canal
  - Dorsally displaced pseudoacromial process of scapula
identifiers:
  - source: pbdb
    id: "66855"
  - source: wikidata
    id: Q134332
  - source: gbif
    id: "4965708"
  - source: eol
    id: "4530893"
species:
  - name: Hungarosaurus tormai
    etymology: Named for Andras Torma, a friend of the author who was with him
      when the locality was discovered.
    status: valid
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Santonian
    location:
      country: HU
      locality: Iharkút
      region: HU-VE
      formation: Csehbánya
    type_specimen:
      specimen_id: [HNHM Gyn/404]
      specimen_type: holotype
      institution: HNHM
      material: Skull fragments (premaxilla with one tooth, left lacrimal, left
        prefrontal, right postorbital, jugal, quadratojugal, left frontal, vomer,
        pterygoid, right quadrate, basioccipital, 21 isolated teeth, hyoid bone),
        mandible parts, three cervical, six dorsal, ten caudal vertebrae, ribs,
        chevrons, scapulocoracoid, radius with metacarpals, ilia, ischium, femur,
        fibula, over 100 osteoderms
      completeness: partial
    size:
      hip_height_m:
        min: 0.9
        max: 0.9
      length_m:
