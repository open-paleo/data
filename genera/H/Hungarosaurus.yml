genus: Hungarosaurus
parent: Nodosauridae
etymology: From Latin Hungaria (Hungary) and Greek sauros (lizard); meaning 'Hungarian lizard'
description: Hungarosaurus is an extinct genus of nodosaurid ankylosaurian
  dinosaur from the Upper Cretaceous (Santonian) Csehbánya Formation of the
  Bakony Mountains, western Hungary. The type (and only) species is H. tormai,
  and represents the most completely known ankylosaur from the Cretaceous of
  Europe. Hungarosaurus walked on four legs and its body was covered with
  hundreds of osteoderms. The length of mature specimens was about 4-4.8 meters
  (13-16 ft).
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
appearance:
  integument: armored
diagnostic_features:
  - Large notch at front of premaxillae
  - Thin nasal process of premaxillae
  - Robust rhomboidal quadrate condyles
  - Large interpterygoid vacuity
  - Dorsoventrally wide quadratojugal with strong protuberance
  - Posterodorsally oriented crest-like protuberance on postorbital
  - Short diastema between symphysis and first dentary tooth position
  - Very short retroarticular process of surangular
  - Anteriormost dorsal vertebra with unusual transversely wide,
    anteroposteriorly short amphicoelous centrum with very large neural canal
  - Dorsally displaced pseudoacromial process of scapula
