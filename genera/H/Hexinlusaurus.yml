genus: Hexinlusaurus
parent: Neornithischia
etymology: Named for He Xinlu, a Chinese paleontologist, combined with Greek 'sauros' meaning 'lizard'.
pronunciation:
  phonetic: huh-SHEEN-lu-SOR-us
description: Hexinlusaurus is a genus of basal ornithischian dinosaur from the
  Middle Jurassic (Bajocian stage) Lower Shaximiao Formation of what is now
  China. The type and only species is Hexinlusaurus multidens.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
