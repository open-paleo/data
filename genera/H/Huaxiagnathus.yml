genus: Huaxiagnathus
parent: Compsognathidae
dispute:
  summary: >
    Huaxiagnathus was described as the most basal compsognathid (Hwang and
    colleagues, 2004), and Dal Sasso and Maganuco (2011) and Xing and
    colleagues (2020) recover it within Compsognathidae, though Hartman and
    colleagues (2019) recover it just outside a reduced Compsognathidae. Cau
    and Paterna (2025) proposed that the tyrannosauroid Sinotyrannus is a
    mature individual of Huaxiagnathus, on shared ilium morphology and
    differences they attribute to growth; Powers and colleagues (2026) keep
    Sinotyrannus as a separate tyrannosauroid without discussing the
    proposal.
  history:
    - date: "2026-07-01"
      note: Retained at Compsognathidae; contested Sinotyrannus synonymy (Cau and Paterna, 2025, versus Jones, 2026) remains unresolved.
    - date: "2026-10-20"
      note: >
        Summary credits the placement and the synonymy proposal to the
        primaries; supersedes the reliance on Jones (2026).
etymology: "From Chinese 'Hua Xia' (華夏), a traditional word for China, and Greek 'gnathos' meaning 'jaw', hence 'China jaw'."
pronunciation:
  phonetic: hwah-shahg-NATH-us
description: Huaxiagnathus is an extinct genus of coelurosaurian theropod
  dinosaur from the Lower Cretaceous of China. The genus contains a single
  species, Huaxiagnathus orientalis, known from two immature individuals from
  the Yixian Formation. Huaxiagnathus may represent an earlier ontogenetic stage
  of the tyrannosauroid Sinotyrannus from the younger Jiufotang Formation.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
  - forested
diagnostic_features:
  - Very long posterior process of premaxilla overlapping antorbital fossa
  - Manus as long as combined length of humerus and radius
  - Large manual unguals I and II subequal in length and 167% length of ungual
    III
  - First metacarpal with smaller proximal transverse width than second
    metacarpal
  - Reduced olecranon process on ulna
  - Fan-shaped neural spines on dorsal vertebrae
appearance:
  integument: unknown
