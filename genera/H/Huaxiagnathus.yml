references:
  - id: hwang2004a
    notes: Named Huaxiagnathus and recovered it as the sister of Sinosauropteryx
      plus Compsognathus in Compsognathidae.
  - id: paul2024a
    notes: Source of the mass estimate.
  - id: cau2025a
    notes: Proposed that Sinotyrannus is a mature individual of Huaxiagnathus, on
      shared ilium morphology and differences attributed to growth.
  - id: hartman2019a
    notes: Paravian phylogeny recovering Huaxiagnathus just outside a reduced Compsognathidae.
  - id: jones2026c
    notes: Treats Huaxiagnathus as a compsognathid.
  - id: dalsasso2011a
    notes: Recovered Huaxiagnathus within Compsognathidae, in a clade with Juravenator.
  - id: xing2020a
    notes: Recovered Huaxiagnathus within Compsognathidae, in a polytomy with Compsognathus and Juravenator.
  - id: powers2026a
    notes: Recovered Sinotyrannus with Yutyrannus as a separate tyrannosauroid.
