    type: nomen nudum
    reason: Informal name; never met ICZN requirements for formal publication and is treated as referable to Huaxiagnathus. Per Olshevsky's Dinosaur Genera List.
species:
  - name: Huaxiagnathus orientalis
    etymology: "From Latin 'orientalis' meaning 'eastern', referring to the eastern origin of the genus in China."
