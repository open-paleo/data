genus: Hippodraco
parent: Styracosterna
etymology: "From Greek 'hippos' meaning 'horse' and Latin 'draco' meaning 'dragon', giving 'horse dragon'; the name refers to the elongated shape of the skull, which resembles a horse skull."
pronunciation:
  phonetic: hip-o-DRAH-co
description: Hippodraco is a genus of iguanodontian ornithopod dinosaur from the
  Early Cretaceous Cedar Mountain Formation of Utah, United States. The genus
  contains a single species, H. scutodens, known from a partial skeleton
  belonging to an immature individual.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
diagnostic_features:
  - Dentary tooth row strongly offset medially by rounded lateral shelf
    extending from first alveolus to coronoid process base
  - Finely striated flange extending from caudoventral margin of jugal
    projecting caudal to jugal-quadratojugal contact
  - Lack of gap (paraquadrate foramen) between quadratojugal and quadrate
