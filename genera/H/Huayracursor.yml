genus: Huayracursor
parent: Bagualosauria
etymology: From Quechua huayra (wind) and Latin cursor (runner); meaning 'wind runner'
pronunciation:
  phonetic: WHY-rah-KUR-suh
description: Huayracursor is an extinct genus of early sauropodomorph dinosaurs
  known from the Late Triassic (Carnian age) Santo Domingo Formation of
  Argentina. The genus contains a single species, Huayracursor jaguensis, known
  from a partial articulated skeleton.
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diet: herbivore
diagnostic_features:
  - Wide angle (more than 140°) between the caudal margin of the scapular blade
    and the caudolateral surface of the glenoid rim
  - Metacarpal 1 proximal dorsoventral and mediolateral breadth subequal
  - Metacarpal 4 proximodistally shorter than metacarpal 1
  - Pubis with robust ambiens process
  - Femur with well-developed dorsolateral trochanter forming a directed flap
  - Tibia distal end with a sub-triangular outline in distal view (recessed
    caudomedial corner) and flattened cranial distal surface
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "515784"
  - source: wikidata
    id: Q136506586
species:
  - name: Huayracursor jaguensis
    etymology: "Named for the town of Jagüé in La Rioja Province, Argentina, near the discovery site."
    status: valid
    type_species: true
    period:
      name:
        - Late Triassic
      stage:
        - Carnian
        - Norian
    location:
      country: AR
      locality: Quebrada Santo Domingo
      region: AR-F
      formation: Santo Domingo
      notes: Hechenleitner and colleagues (2025) place the holotype 80 m above
        the base of the formation.
    type_specimen:
      specimen_id: [CRILAR-Pv 151]
      specimen_type: holotype
      institution: CRILAR
      material: Articulated partial skeleton composed of cranial and postcranial material.
      completeness: partial
    erected_in: hechenleitner2025a
references:
