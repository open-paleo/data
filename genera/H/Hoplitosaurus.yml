genus: Hoplitosaurus
parent: Nodosauridae
pronunciation:
  phonetic: ho-PLIET-o-SAWR-us
etymology: Hoplite lizard; named after the hoplite, a type of heavily armed
  ancient Greek soldier, in reference to its armored body, combined with Greek
  sauros (lizard)
description: Hoplitosaurus was a genus of armored dinosaur related to
  Polacanthus. It was named from a partial skeleton found in the Barremian
  (Early Cretaceous) Lakota Formation of Custer County, South Dakota. It is an
  obscure genus which has been subject to some misinterpretation of its damaged
  remains. Although there was a push to synonymize it with Polacanthus in the
  late 1980s-early 1990s, Hoplitosaurus has been accepted as a valid albeit
  poorly known genus in more recent reviews.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
appearance:
  features:
    - body armor
    - shoulder spikes
  integument: armored
diagnostic_features:
  - Plates and spines with massive appearance and large basal surfaces
  - Abrupt taper and sharp edges on dermal plates and spines
  - Caudal spine with long, comparatively wide basal portion tapering to spike
    form
  - Caudal plates triangular in section with abrupt basal taper and concave curve
  - Dorsal plates compressed and narrow, high triangle in profile
  - Small, heavy plates rather than large, thin, flattened plates characteristic
    of other Stegosaurs
  - Nuchal armor of small, thick, irregularly quadrilateral keeled plates
  - Gular armor of rounded ossicles varying 3-25 mm in diameter
