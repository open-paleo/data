genus: Hualianceratops
parent: Chaoyangsauridae
etymology: From Chinese hua (ornamental) and lian (face), combined with Greek ceratops (horned face); meaning 'ornamental-faced horned face'
pronunciation:
  phonetic: WAH-lee-un-SEH-ruh-tops
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Prominent caudodorsal process on infratemporal ramus of jugal
  - Robust quadrate with expansive quadratojugal facet
  - Transversely expanded rostral margin of quadrate above quadratojugal facet
  - Prominent notch near ventral region of quadrate
  - Deep and short dentary
  - Strongly rugose sculpturing on lateral surface of dentary
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "333388"
  - source: wikidata
    id: Q21696836
species:
  - name: Hualianceratops wucaiwanensis
    etymology: "Named for the Wucaiwan region of Xinjiang, China, where the holotype was discovered."
    pronunciation:
      phonetic: woo-tsie-wahn-EN-sis
    status: valid
    type_species: true
    period:
      name:
        - Middle Jurassic
        - Late Jurassic
      stage:
        - Callovian
        - Oxfordian
    location:
      country: CN
      locality: Wucaiwan locality
      region: CN-XJ
      formation: Shishugou
      part: upper
      notes: >
        Han and colleagues (2015) place the holotype in the same part of the
        Shishugou as Yinlong, between tuffs dated 162.2 and 159.7 Ma, which on the ICS chart v2024/12 straddle the base of the Oxfordian.
    type_specimen:
      specimen_id: [IVPP V18641]
      specimen_type: holotype
      institution: IVPP
      material: Articulated right maxilla, jugal, postorbital and partial squamosal,
        right quadrate and partial quadratojugal, left partial jugal, quadratojugal
        and quadrate, left partial squamosal, most of mandible, and postcranial
        fragments including nearly complete left pes
      completeness: partial
    size:
      length_m:
        min: 1.2
        max: 1.2
      skull_length_m:
        min: 0.25
        max: 0.25
    erected_in: han2015a
references:
  - id: han2015a
