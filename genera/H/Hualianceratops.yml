genus: Hualianceratops
parent: Chaoyangsauridae
etymology: From Chinese hua (ornamental) and lian (face), combined with Greek ceratops (horned face); meaning 'ornamental-faced horned face'
description: Hualianceratops is a genus of herbivorous ceratopsian dinosaur that
  lived about 160 million years ago in the Late Jurassic epoch in what is now
  western China. The single species, H. wucaiwanensis was described in 2015. Its
  size has been compared to that of a spaniel.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Prominent caudodorsal process on infratemporal ramus of jugal
  - Robust quadrate with expansive quadratojugal facet
  - Transversely expanded rostral margin of quadrate above quadratojugal facet
  - Prominent notch near ventral region of quadrate
  - Deep and short dentary
  - Strongly rugose sculpturing on lateral surface of dentary
