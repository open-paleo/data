genus: Hexing
parent: Ornithomimosauria
etymology: From Chinese hexing (like a crane); meaning 'crane-like', referring
  to the animal's slender, crane-like body
description: Hexing is an extinct genus of basal ornithomimosaurian dinosaur
  known from the Early Cretaceous of northeastern China. It contains a single
  species, Hexing qingyi.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
  - forested
diagnostic_features:
  - Rostral portion of premaxilla deflected ventrally so oral surface level with
    ventral border of dentary
  - Deep antorbital fossa invading whole lateral surface of maxilla
  - Sagittal crest on parietal
  - Pendant paroccipital processes extending ventrally below foramen magnum
  - Dentary fenestra (elliptical, unique among ornithomimosaurs)
  - Phalangeal formula for manus with elongated proximal phalanges of digits III
    and IV >75% length of corresponding metacarpal
