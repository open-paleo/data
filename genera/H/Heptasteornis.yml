genus: Heptasteornis
parent: Troodontidae
description: Heptasteornis is a dubious genus of alvarezsaurid dinosaur from the
  Late Cretaceous. The type (and only known) species is Heptasteornis andrewsi,
  described as a presumed gigantic prehistoric owl in 1975. It was previously
  included in Elopteryx nopcsai and indeed the holotypes of both species were
  believed to be from the same individual as they were discovered, and initially
  were assigned the same specimen number. This appears to be in error however.
diet: carnivore
