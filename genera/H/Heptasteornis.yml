genus: Heptasteornis
parent: Alvarezsauridae
dispute:
  summary: >
    Heptasteornis andrewsi, from the Maastrichtian of Romania, is based on a
    distal tibiotarsus that Naish and Dyke (2004) identified as the first
    European alvarezsaurid on the basis of an alvarezsaurid-type astragalar
    notch; they nonetheless regarded the genus as a nomen dubium for lack of
    distinguishing autapomorphies. Meso et al. (2024) recovered it as an unstable
    alvarezsaurid, and Jones (2026) treats its alvarezsaurid identity as a
    gaining-traction hypothesis rather than a settled result.
  history:
    - date: "2026-07-01"
      note: Placed at Alvarezsauridae following Naish and Dyke (2004); retained as a nomen-dubium-grade alvarezsaurid whose finer position cannot be resolved.
pronunciation:
  phonetic: hep-tas-tee-OR-nis
etymology: "From Greek 'hepta' meaning 'seven', 'asty' meaning 'city', and
  'ornis' meaning 'bird', referencing the Latin 'septum urbium' / German
  'Siebenbürgen' ('seven cities/castles') - historical names for the
  Transylvanian region."
description: Heptasteornis is a dubious genus of alvarezsaurid dinosaur from the
  Late Cretaceous. The type (and only known) species is Heptasteornis andrewsi,
  described as a presumed gigantic prehistoric owl in 1975. It was previously
  included in Elopteryx nopcsai and indeed the holotypes of both species were
  believed to be from the same individual as they were discovered, and initially
  were assigned the same specimen number. This appears to be in error however.
diet: carnivore
locomotion: bipedal
