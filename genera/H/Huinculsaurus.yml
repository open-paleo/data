genus: Huinculsaurus
parent: Elaphrosaurinae
dispute:
  summary: >
    Huinculsaurus was described as a close relative of Elaphrosaurus and is
    treated as the most derived elaphrosaurine by reference works, the
    placement followed here, but the material is fragmentary and it is
    recovered as an unstable taxon, with some analyses finding it a more
    general noasaurid.
  history:
    - date: "2026-06-30"
      note: >
        Placed at Elaphrosaurinae following the describing analysis and
        reference-work usage (P2).
etymology: Named after the Huincul Formation of Argentina where it was found, combined with Greek sauros (lizard); meaning 'Huincul lizard'
pronunciation:
  phonetic: HYOO-win-kul-SOR-us
description: Huinculsaurus is an extinct genus of noasaurid dinosaurs known from
  the Late Cretaceous Huincul Formation of Argentina. The genus contains a
  single species, Huinculsaurus montesi, known from five partial vertebrae.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Prezygapophyseal articular facets in posterior dorsal vertebrae twice longer
    than wide
  - Anterior centroparapophyseal lamina strongly developed as extensive lateral
    lamina in posterior dorsal vertebrae
  - Pneumatic foramina located ventrally to postzygodiapophyseal lamina in
    posterior dorsal vertebrae
  - Posteriorly tapering postzygapophysis pointed posteriorly
  - Parapophyseal centrodiapophyseal fossa in posterior dorsal neural arches
    separated by accessory lamina
appearance:
  integument: scaled
  evidence: inferred
