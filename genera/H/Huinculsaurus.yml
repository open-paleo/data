  - id: cerroni2022a
    notes: Recovers Huinculsaurus as the basal member of Noasaurinae, unlike
      the original elaphrosaurine placement.
  - id: hendrickx2024a
    notes: Recovers Huinculsaurus in a polytomy within Abelisauroidea.
  - id: pol2024a
    notes: Prunes Huinculsaurus as one of the unstable taxa that collapse the
