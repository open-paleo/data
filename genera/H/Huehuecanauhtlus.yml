genus: Huehuecanauhtlus
parent: Hadrosauromorpha
etymology: "From Nahuatl 'huehuetl' meaning 'ancient' and 'canauhtli' meaning 'duck', giving 'ancient duck', in reference to its hadrosauroid (duck-billed) affinities; the specific name tiquichensis honors the town of Tiquicheo, Michoacán."
pronunciation:
  phonetic: UE-UE-CANA-UHh-TLUS
description: Huehuecanauhtlus is a genus of hadrosauroid dinosaur known from the
  Late Cretaceous (Santonian stage) of Michoacán, western Mexico. It contains a
  single species, Huehuecanauhtlus tiquichensis.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
diagnostic_features:
  - Two teeth exposed on occlusal plane of rostral third and posterior third of
    dentary and maxilla respectively
  - Seven sacral vertebrae
  - Tall neural spines of posterior vertebrae 3.5 to 4 times taller than
    corresponding centra
  - Supraacetabular process 75% length of central iliac plate with apex above
    posteroventral corner of ischiac tuberosity
  - Short and trapezoidal postacetabular process less than 80% length of iliac
    central plate
  - Extremely deflected preacetabular process with angle less than 130° to
    horizontal plane
  - Very deep concave profile of dorsomedial margin of iliac plate adjacent to
    supraacetabular process
appearance:
  features:
    - keratinous beak
  integument: scaled
  evidence: inferred
