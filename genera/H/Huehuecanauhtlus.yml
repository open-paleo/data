genus: Huehuecanauhtlus
parent: Hadrosauroidea
etymology: "From Nahuatl 'huehuetl' meaning 'ancient' and 'canauhtli' meaning 'duck', giving 'ancient duck', in reference to its hadrosauroid (duck-billed) affinities; the specific name tiquichensis honors the town of Tiquicheo, Michoacán."
description: Huehuecanauhtlus is a genus of hadrosauroid dinosaur known from the
  Late Cretaceous (Santonian stage) of Michoacán, western Mexico. It contains a
  single species, Huehuecanauhtlus tiquichensis.
diet: herbivore
