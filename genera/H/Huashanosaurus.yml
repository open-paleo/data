genus: Huashanosaurus
parent: Eusauropoda
etymology: Huashan Mountain lizard
description: Huashanosaurus is an extinct genus of eusauropod sauropod dinosaurs
  known from the Early–Middle Jurassic Wangmen Formation of China. The genus
  contains a single species, Huashanosaurus qini, known from a fragmentary
  partial skeleton.
