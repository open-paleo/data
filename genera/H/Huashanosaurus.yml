genus: Huashanosaurus
parent: Eusauropoda
etymology: Huashan Mountain lizard; named after Huashan Mountain in China, combined with Greek sauros (lizard)
pronunciation:
  phonetic: hwah-SHAH-no-SOR-us
description: Huashanosaurus is an extinct genus of eusauropod sauropod dinosaurs
  known from the Early-Middle Jurassic Wangmen Formation of China. The genus
  contains a single species, Huashanosaurus qini, known from a fragmentary
  partial skeleton.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Posterior process of ulna hook-shaped
  - Proximal ulna crescent-shaped in cross-section below posterior process
  - Groove structure present at posterodistal surface of fibula
  - Dorsal surface of anteromedial process of ulna strongly concave
appearance:
  integument: scaled
  evidence: inferred
identifiers:
