genus: Hadrosaurus
parent: Hadrosauridae
pronunciation:
  phonetic: HAD-ro-SAWR-us
  ipa: /ˌhædrəˈsɔːrəs/
etymology: "From Greek hadros (bulky, stout) and sauros (lizard); meaning 'bulky lizard'"
description: Hadrosaurus is a genus of hadrosaurid ornithopod dinosaurs that
  lived in North America during the Late Cretaceous Period in what is now the
  Woodbury Formation in New Jersey about 83.6 to 77.9 million years ago. The
  holotype specimen was found in fluvial marine sedimentation, meaning that the
  corpse of the animal was transported by a river and washed out to sea. Some
  fossils are found in the Tar Heel/Coachman Formation.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - coastal
  - marine
diagnostic_features:
  - Deltopectoral crest very short, only slightly over 40% of total humerus
    length
  - Deltopectoral crest expanding smoothly from the humeral shaft, its
    laterodistal corner forming a wide, arcuate profile
  - Ventral apex of the supraacetabular crest positioned above the posteroventral
    corner of the ischial peduncle of the ilium
  - Supraacetabular crest anteroposteriorly short, its breadth about half the
    length of the central iliac plate
appearance:
  integument: scaled
  evidence: inferred
