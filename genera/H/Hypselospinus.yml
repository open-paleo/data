genus: Hypselospinus
parent: Neoiguanodontia
etymology: From Greek 'hypselos' meaning 'high' and Latin 'spina' meaning 'spine' or 'thorn', in reference to the tall neural spines on the vertebrae.
pronunciation:
  phonetic: HIP-sel-o-SPIEN-us
description: Hypselospinus is a genus of iguanodontian dinosaur which was first
  described as a species of Iguanodon (I. fittoni) by Richard Lydekker in 1889,
  the specific name honoring William Henry Fitton.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
  - lacustrine
  - wetland
diagnostic_features:
  - Preacetabular process vertically orientated, laterally compressed and
    comparatively deep proximally
  - Ventral edge of preacetabular process thicker than dorsal edge
  - Dorsal edge of iliac blade transversely compressed
  - Dorsal edge of iliac blade straight in profile rather than bowed dorsally
  - Postacetabular blade tapers to blunt, thickened bar with strong medial
    inturning to form thick shelf roofing well-defined brevis fossa
  - Brevis fossa bordered laterally by horizontal ridge
  - Ventral surfaces of posterior sacral centra bear midline keels
  - Anterior caudal vertebral centrum with cylindrical proportions bearing
    well-marked haemal facet posteriorly
  - Neural spines of dorsal, sacral and proximal caudal series singularly
    slender and elongate
