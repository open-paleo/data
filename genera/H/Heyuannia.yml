genus: Heyuannia
parent: Heyuanninae
etymology: From Heyuan; named after Heyuan city in Guangdong Province, China,
  where the type specimen was found
description: "Heyuannia is a genus of oviraptorid dinosaur that lived in Asia
  during the Late Cretaceous epoch, in what is now China and Mongolia. It was
  the first oviraptorid found in China; most others were found in neighboring
  Mongolia. Two species are known: H. huangi, named by Lü Junchang in 2002 from
  the Dalangshan Formation; and H. yanshini, originally named as a separate
  genus Ingenia from the Barun Goyot Formation by Rinchen Barsbold in 1981, and
  later renamed to Ajancingenia in 2013 due to the preoccupation of Ingenia. The
  latter name was eventually discarded due to various ethical issues surrounding
  the author."
diet: omnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - 13 Cervical vertebrae (increased count, distinct from all other
    oviraptorosaurs)
  - 12 Dorsal vertebrae (decreased count relative to non-avian theropods)
  - 8 Sacral vertebrae (increased count, bird-like)
  - Quadratojugal articular surface of quadrate is groove-like rather than a
    lateral cotyle
  - Quadrate diverticulum enters quadrate anterolaterally
  - Pneumatic foramina present on neural arches and ribs of cervical vertebrae
  - Pubis as long as ilium
  - Proximal end of metacarpal I wraps that of metacarpal II in ventral view
appearance:
  integument: feathered
  evidence: inferred
