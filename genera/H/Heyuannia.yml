genus: Heyuannia
parent: Heyuanninae
etymology: From Heyuan; named after Heyuan city in Guangdong Province, China,
  where the type specimen was found
diet: omnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - 13 Cervical vertebrae (increased count, distinct from all other
    oviraptorosaurs)
  - 12 Dorsal vertebrae (decreased count relative to non-avian theropods)
  - 8 Sacral vertebrae (increased count, bird-like)
  - Quadratojugal articular surface of quadrate is groove-like rather than a
    lateral cotyle
  - Quadrate diverticulum enters quadrate anterolaterally
  - Pneumatic foramina present on neural arches and ribs of cervical vertebrae
  - Pubis as long as ilium
  - Proximal end of metacarpal I wraps that of metacarpal II in ventral view
appearance:
  integument: feathered
  evidence: inferred
identifiers:
  - source: pbdb
    id: "68047"
  - source: wikidata
    id: Q134594
  - source: gbif
    id: "4822788"
  - source: eol
    id: "52570720"
synonyms:
  - name: Ingenia
    type: preoccupied
    reason: Name preoccupied by Ingenia (Nematoda).
  - name: Ajancingenia
    type: boycotted
    reason: Replacement name for Ingenia, rejected by most authors due to ethical
      concerns over the description (including alleged plagiarism).
species:
  - name: Heyuannia huangi
    etymology: Named for Dong Huang, director of the Heyuan Museum, who
      contributed greatly to the excavation and preservation of the fossils.
    pronunciation:
      phonetic: HWANG-eye
    status: valid
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Maastrichtian
    location:
      country: CN
      locality: Huangsha village, Heyuan
      region: CN-GD
      formation: Dalangshan
    type_specimen:
      specimen_id: [ HYMV1-1 ]
      specimen_type: holotype
      institution: HYMV
      material: Nearly complete skeleton missing distal end of tail and forelimbs, with
        an incomplete skull.
      completeness: complete
    size:
      length_m:
        min: 2.0
        max: 2.0
      weight_kg:
        min: 20
        max: 20
    erected_in: lü2002a
  - name: Heyuannia yanshini
    etymology: "Named in honor of academician Aleksandr Leonidovich Yanshin."
    pronunciation:
      phonetic: yan-SHEE-nee
    status: valid
    period:
      name:
        - Late Cretaceous
      stage:
        - Campanian
    location:
      country: MN
      locality: Hermiin Tsav
      region: MN-053
      formation: Baruungoyot
      part: upper
    type_specimen:
      specimen_id: [ MPC-D 100/30 ]
      specimen_type: holotype
      institution: MPC
    erected_as: Ingenia yanshini
    erected_in: barsbold1981a
    synonyms:
      - name: Ingenia yanshini
        type: reassigned
        reason: Originally described as Ingenia yanshini (1981); the genus name was
          preoccupied, and the species was ultimately reassigned to Heyuannia.
      - name: Ajancingenia yanshini
        type: reassigned
        reason: Reclassified by Funston and colleagues (2018) as Heyuannia yanshini to avoid
          ethical concerns over Easter's redescription of Ajancingenia (which
          included plagiarized text).
pronunciation:
  phonetic: Hey-YOU-ARN-ee-ah
references:
  - id: lü2002a
  - id: barsbold1981a
  - id: easter2013a
    notes: Coins the replacement genus Ajancingenia for the preoccupied Ingenia;
      later rejected by most authors.
  - id: funston2018a
    notes: Reassigns the species to Heyuannia yanshini, establishing the current
      combination.
