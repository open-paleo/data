references:
  - id: jin2009a
    notes: Erected Helioceratops and treated it as a non-coronosaurian
      neoceratopsian with Auroraceratops and Yamaceratops, without a numerical
      analysis.
  - id: morschhauser2018a
    notes: Recovered Helioceratops within Leptoceratopsidae as sister to all
      other members of that clade.
  - id: madzia2021a
    notes: Includes Helioceratops in the composition of Leptoceratopsidae in its
      formal conversion of the clade.
  - id: arbour2019a
    notes: Recovered Helioceratops in an unresolved polytomy outside
      Coronosauria in strict consensus, and as the leptoceratopsid outgroup in
      63% of individual trees.
  - id: son2022a
    notes: Treated Helioceratops as an unstable wildcard; removing it resolved
      the basal neoceratopsian polytomy.
  - id: tanaka2024a
    notes: Recovered Helioceratops in an unresolved polytomy with Koreaceratops,
      Yamaceratops, Leptoceratopsidae and Coronosauria.
  - id: ryan2023a
    notes: Left Helioceratops unresolved with the leptoceratopsids and
      Koreaceratops in its majority-rule tree.
  - id: jones2026a
    notes: Placement and assessment in the Princeton Encyclopedia of Dinosaurs.
