genus: Helioceratops
parent: Neoceratopsia
placement: incertae sedis
etymology: From Greek helios (sun), keras (horn), and ops (face); meaning 'sun horned face', referencing the animal's Eastern (sunrise) origin and its relationship to other ceratopsians
pronunciation:
  phonetic: HEE-lee-o-SEH-ruh-tops
description: Helioceratops is a genus of herbivorous neoceratopsian dinosaur
  from the Middle Cretaceous of China.
dispute:
  summary: >
    Helioceratops brachygnathus is persistently unstable in neoceratopsian
    phylogenies, a consequence of its fragmentary material. Jin et al.
    (2009), describing the genus, treated it as a non-coronosaurian
    neoceratopsian alongside Auroraceratops and Yamaceratops, mapping
    characters onto an existing cladogram rather than running an analysis.
    Morschhauser et al. (2018) recovered it within Leptoceratopsidae as
    sister to all other members, a composition adopted in the formal
    definition of that clade by Madzia et al. (2021). Other analyses leave it
    unresolved: Arbour and Evans (2019) place it in a polytomy outside
    Coronosauria in their strict consensus, though it is the leptoceratopsid
    outgroup in 63% of individual trees; Ryan et al. (2023) and Tanaka et al.
    (2024) both leave it unresolved among the leptoceratopsids and their
    relatives; and Son et al. (2022) treat it as an unstable wildcard whose
    removal resolves the basal neoceratopsian polytomy.
  history:
    - date: "2026-06-27"
      note: Placed at Neoceratopsia (basal) following the prevailing
        view (Jones, 2026); leptoceratopsid alternative reflected.
    - date: "2026-07-28"
      note: Retained at Neoceratopsia (basal) following Jin et al. (2009); the
        leptoceratopsid placement of Morschhauser et al. (2018) is recorded as
        the competing hypothesis.
    - date: "2026-07-29"
      note: Flagged incertae sedis within Neoceratopsia. Only Morschhauser et
        al. (2018) resolve the genus; Arbour and Evans (2019), Ryan et al.
        (2023) and Tanaka et al. (2024) leave it unresolved and Son et al.
        (2022) treat it as a wildcard, so it cannot be assigned to a subclade.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Dentary ramus deep with length/height ratio of 1.6
  - Ventral predentary facet more vertical than other basal neoceratopsians,
    forming ~130° angle with ventral dentary border
  - "Denticles and secondary ridges asymmetrically distributed on dentary teeth:
    9-10 on mesial side, 4-5 on distal side of primary ridge"
