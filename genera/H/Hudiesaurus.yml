genus: Hudiesaurus
parent: Mamenchisauridae
pronunciation:
  phonetic: HOO-dyeh-SAWR-us
etymology: Butterfly lizard; from Chinese hudie (butterfly) and Greek sauros (lizard)
description: Hudiesaurus is an extinct genus of mamenchisaurid sauropod dinosaur
  that lived in present-day China during the Late Jurassic period. It was
  described by Chinese paleontologist Dong Zhiming in 1997. The genus contains a
  single species, Hudiesaurus sinojapanorum, named based on a single vertebra.
  However, he also assigned teeth and limb bones from a nearby locality to H.
  sinojapanorum. These fossils were unearthed by the Sino-Japanese Silk Road
  Expedition near Qiketai in Shanshan, Xinjiang province in rock layers coming
  from the Kalaza Formation. This formation dates to between the Late
  Kimmeridgian and Tithonian stages of the Late Jurassic, 154 to 143 million
  years ago. Dong believed that the vertebra was a dorsal (trunk) vertebra, but
  later analysis suggested that it is one of the last cervical (neck) vertebrae.
  In 2021, the limb bones were assigned to a distinct genus of sauropod,
  Rhomaleopakhus, and the teeth were classified as an indeterminate eusauropod.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Small projection on the neurocentral junction above the lateral pneumatic
    opening.
  - Anterior centrodiapophyseal lamina (ACDL) splitting into upper and lower
    branches — the upper reaching the anterodorsal margin of the diapophysis,
    the lower the posteroventral margin where it meets the anterior end of the
    PCDL (this region is heavily plaster-restored, so treat with caution).
  - Approximately transverse row of five to six small coels on the dorsal
    surface of the prezygapophyseal process, immediately posterior to the
    articular facet.
  - Spinoprezygapophyseal laminae (SPRLs) bifurcating near the base of the
    metapophysis — one branch ascending the anterior surface and fading before
    the summit, the other forming a thin sheet along the anterolateral margin
    to the summit.
  - Spinopostzygapophyseal lamina (SPOL) bifurcating into two distinct ridges
    immediately above the postzygapophysis.
