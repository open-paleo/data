genus: Harpymimus
parent: Ornithomimosauria
dispute:
  summary: >
    The family-level placement of Harpymimus is unresolved. Most analyses recover
    it as a basal ornithomimosaur lying outside the two families and more derived
    than Pelecanimimus (Kobayashi and Barsbold, 2005; Lee et al., 2014), whereas
    Serrano-Brañas et al. (2020) and Hattori et al. (2023) recover it as the
    basalmost member of Deinocheiridae. It is placed conservatively at
    Ornithomimosauria.
  history:
    - date: "2026-06-30"
      note: >
        Moved from Deinocheiridae to Ornithomimosauria; the basal-deinocheirid
        placement of Serrano-Brañas et al. (2020) and Hattori et al. (2023) is
        recorded as an unresolved alternative.
pronunciation:
  phonetic: HAR-pi-MIEM-us
etymology: From Greek harpyia (Harpy, a winged spirit of Greek mythology) and
  mimos (mimic); meaning 'Harpy mimic'
description: Harpymimus is a genus of basal ornithomimosaurian theropod dinosaur
  from the Early Cretaceous Period of what is now Mongolia. Unlike later, more
  derived ornithomimosaurs, Harpymimus still possessed teeth, although they
  appear to have been restricted to the dentary of the lower jaw.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Eleven dentary teeth, restricted to the anterior portion of the dentary.
  - Transition between anterior and posterior caudal vertebrae at the
    eighteenth caudal vertebra.
  - Triangular-shaped depression on the dorsal surface of the supraglenoid
    buttress of the scapula.
  - Low ridge dorsal to that depression, along the posterior edge of the
    scapular blade.
  - Small but deep collateral ligament fossa on the lateral condyle of
    metacarpal III.
appearance:
  integument: feathered
  evidence: inferred
