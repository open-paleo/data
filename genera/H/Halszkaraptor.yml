genus: Halszkaraptor
parent: Halszkaraptorinae
etymology: Halszka's seizer; named in honor of Polish paleontologist Halszka Osmólska, combined with Greek raptor (seizer)
pronunciation:
  phonetic: HALSH-kuh-RAP-tor
  ipa: /ˈhɑːlʃkəræptər/
description: Halszkaraptor is a genus of waterfowl-like dromaeosaurid dinosaurs
  from Mongolia that lived during the Late Cretaceous period. It contains only
  one known species, Halszkaraptor escuilliei.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - arid
diagnostic_features:
  - Platyrostral premaxilla forming 32% of snout length and bearing 11 teeth
  - Neck forms 50% of snout-sacrum length, longest among Mesozoic paravians
  - Rod-like jugal with ascending process excluded from orbital margin, forms
    only 10% of postorbital bar
  - Postzygapophyses on cervicals 2-5 fused medially forming single lobate
    processes
  - Ridge-like cervical neural spines restricted to 2nd-5th vertebrae
  - Tuber-like neural spines in tail restricted to 1st-3rd vertebrae
  - Flattened ulna with sharp posterior margin
appearance:
  features:
    - elongate neck
  integument: feathered
  evidence: inferred
