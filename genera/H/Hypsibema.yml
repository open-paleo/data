genus: Hypsibema
parent: Hadrosauridae
etymology: From Greek hypsi (high) and bema (step); meaning 'high step', because
  Edward Cope believed the animal walked particularly erect on its toes
pronunciation:
  phonetic: HIP-see-BEE-ma
description: Hypsibema is a dubious genus of very large dinosaur from the Late Cretaceous
  of eastern North America, of uncertain affinities. The type species,
  H. crassicauda, is known mainly from the Tar Heel Formation of North Carolina
  and the Marshalltown Formation of New Jersey, and its fragmentary material has
  been interpreted as sauropod as well as hadrosaurian. A second species, H.
  missouriensis from the Maastrichtian of Missouri, was originally named
  Neosaurus and then Parrosaurus before being referred to Hypsibema by Baird and
  Horner (1979); a proposed return of that species to Parrosaurus has not gained
  broad acceptance.
dispute:
  summary: >
    Hypsibema is a nomen dubium based on chimeric, fragmentary material;
    some referred remains have been treated as a separate valid
    hadrosauroid (referred to Parrosaurus by some authors).
  history:
    - date: "2026-06-27"
      note: Placed at Hadrosauridae incertae sedis; nomen dubium.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - marine
  - coastal
diagnostic_features:
  - Caudal vertebra elongate, depressed and angulate; resembled Hylaeosaurus
    form but minus diapophyses
  - Distinguished from Hadrosaurus by various anatomical features
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "52881"
  - source: wikidata
    id: Q1056871
  - source: gbif
    id: "4823284"
  - source: eol
    id: "4531726"
synonyms:
  - name: Neosaurus
    type: preoccupied
    reason: Name preoccupied by Neosaurus (Reptilia).
  - name: Parrosaurus
    type: reassigned
    reason: Coined by Gilmore (1945) as a replacement for the preoccupied
      Neosaurus; its type species was referred to Hypsibema by Baird and Horner
      (1979). A proposed revival of Parrosaurus has not gained broad acceptance.
species:
  - name: Hypsibema crassicauda
    etymology: From Latin 'crassus' meaning 'thick' or 'fat' and 'cauda' meaning
      'tail', together meaning 'with a fat tail', in reference to the massively
      constructed tail of the species.
    status: valid
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Campanian
      from_ma: 83.6
      to_ma: 72.2
    location:
      country: US
      region: New Jersey
      formation: Marshalltown
      coordinates:
        - 40.299999
        - -74.300003
    size:
      length_m:
        min: 12
        max: 17
    type_specimen:
      specimen_id:
        - USNM 7189
      specimen_type: holotype
      institution: USNM
      material: Humerus, tibia, fibula, metatarsus, caudal vertebra, cervical
        vertebrae, ungueal phalange
      completeness: fragmentary
    erected_in: cope1869a
  - name: Hypsibema missouriensis
    etymology: Named for Missouri, the U.S. state where the holotype was
      discovered, with the Latin suffix '-ensis'.
    status: valid
    type_species: false
    period:
      name:
        - Late Cretaceous
      stage:
        - Maastrichtian
      from_ma: 72.1
      to_ma: 66
    location:
      country: US
      region: Missouri
      formation: Ripley
      locality: Chronister Site, near Glen Allen, Bollinger County
      coordinates:
        - 37.31
        - -90.0
    type_specimen:
      specimen_id:
        - USNM 16735
      specimen_type: holotype
      institution: USNM
      material: 13 caudal centra and two unidentified fragments; all neural
        arches missing
      completeness: fragmentary
    diagnostic_features:
      - Caudal centra amphicoelous, longer than wide, with angularly rounded
        sides shallowly concave from end to end
      - Articular ends with a flattened peripheral border surrounding a concave
        central area bearing radiating bumps and depressions
      - Sides of the centra divided subequally by a low longitudinal ridge that
        fades posteriorly
      - Chevron facets restricted to the posterior ends of the centra, the
        ventral surface scooped out between them
    synonyms:
      - name: Neosaurus missouriensis
        type: reassigned
        reason: Original combination (Gilmore and Stewart, 1945); the genus name
          Neosaurus was preoccupied.
      - name: Parrosaurus missouriensis
        type: reassigned
        reason: Combination under Parrosaurus, the replacement name Gilmore
          (1945) coined for the preoccupied Neosaurus; referred to Hypsibema by
          Baird and Horner (1979).
    erected_in: gilmore1945a
references:
  - id: cope1869a
  - id: gilmore1945a
    notes: Original description of the type material, as the sauropod Neosaurus
      missouriensis.
  - id: gilmore1945b
    notes: Replacement genus name (Parrosaurus) for the preoccupied Neosaurus
      Gilmore, 1945.
  - id: baird1979a
    notes: Referred Parrosaurus missouriensis to Hypsibema, keeping it separate
      from H. crassicauda pending better material.
