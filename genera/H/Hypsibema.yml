genus: Hypsibema
parent: Hadrosauroidea
placement: incertae sedis
etymology: From Greek hypsi (high) and bema (step); meaning 'high step', because
  Edward Cope believed the animal walked particularly erect on its toes
pronunciation:
  phonetic: HIP-see-BEE-ma
description: Hypsibema is a dubious genus of very large dinosaur from the Late Cretaceous
  of eastern North America, of uncertain affinities. The type species,
  H. crassicauda, is known mainly from the Tar Heel Formation of North Carolina
  and the Marshalltown Formation of New Jersey, and its fragmentary material has
  been interpreted as sauropod as well as hadrosaurian. A second species, H.
  missouriensis from the Maastrichtian of Missouri, was originally named
  Neosaurus and then Parrosaurus before being referred to Hypsibema by Baird and
  Horner (1979); Brownstein (2018) returns it to Parrosaurus.
dispute:
  summary: >
    Baird and Horner (1979) restricted Hypsibema crassicauda to a lectotype
    caudal, the type series being a mixture of three suborders, and referred
    it to Sauropoda, a placement later work rejects. Prieto-Márquez and
    colleagues (2016) list H. crassicauda and the Missouri species among the
    nondiagnostic Appalachian hadrosaurids, while Brownstein (2018) treats
    both as valid giant hadrosauroids, the Missouri species as Parrosaurus
    missouriensis, of uncertain placement within or outside Hadrosauridae.
    It is placed at Hadrosauroidea incertae sedis.
  history:
    - date: "2026-06-27"
      note: Placed at Hadrosauridae incertae sedis; nomen dubium.
    - date: "2026-10-08"
      note: Type species H. crassicauda set to nomen dubium and diagnostic features removed; the status of H. missouriensis is left open.
    - date: "2026-10-16"
      note: >
        Moved from Hadrosauridae to Hadrosauroidea incertae sedis and H.
        missouriensis set to disputed; summary rewritten with its
        sources.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - marine
  - coastal
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "52881"
  - source: wikidata
    id: Q1056871
  - source: gbif
    id: "4823284"
  - source: eol
    id: "4531726"
synonyms:
  - name: Neosaurus
    type: preoccupied
    reason: Name preoccupied by Neosaurus (Reptilia).
  - name: Parrosaurus
    type: reassigned
    reason: Coined by Gilmore (1945) as a replacement for the preoccupied
      Neosaurus; its type species was referred to Hypsibema by Baird and Horner
      (1979). Brownstein (2018) uses Parrosaurus missouriensis.
species:
  - name: Hypsibema crassicauda
    etymology: From Latin 'crassus' meaning 'thick' or 'fat' and 'cauda' meaning
      'tail', together meaning 'with a fat tail', in reference to the massively
      constructed tail of the species.
    status: nomen dubium
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Campanian
    location:
      country: US
      region: US-NC
      locality: Marl pits of James King
      formation: Black Creek
    size:
      length_m:
        min: 12
        max: 17
    type_specimen:
      specimen_id:
        - USNM 7189
      specimen_type: holotype
      institution: USNM
      material: Humerus, tibia, fibula, metatarsus, caudal vertebra, cervical
        vertebrae, ungueal phalange
      completeness: fragmentary
    erected_in: cope1869a
  - name: Hypsibema missouriensis
    etymology: Named for Missouri, the U.S. state where the holotype was
      discovered, with the Latin suffix '-ensis'.
    status: disputed
    type_species: false
    period:
      name:
        - Late Cretaceous
      stage:
        - Maastrichtian
    location:
      country: US
      region: US-MO
      formation: Ripley
      locality: Chronister farm
      member: McNairy Sand
    type_specimen:
      specimen_id:
        - USNM 16735
      specimen_type: holotype
      institution: USNM
      material: 13 caudal centra and two unidentified fragments; all neural
        arches missing
      completeness: fragmentary
    diagnostic_features:
      - Caudal centra amphicoelous, longer than wide, with angularly rounded
        sides shallowly concave from end to end
      - Articular ends with a flattened peripheral border surrounding a concave
        central area bearing radiating bumps and depressions
      - Sides of the centra divided subequally by a low longitudinal ridge that
        fades posteriorly
      - Chevron facets restricted to the posterior ends of the centra, the
        ventral surface scooped out between them
    synonyms:
      - name: Neosaurus missouriensis
        type: reassigned
        reason: Original combination (Gilmore and Stewart, 1945); the genus name
          Neosaurus was preoccupied.
      - name: Parrosaurus missouriensis
        type: reassigned
        reason: Combination under Parrosaurus, the replacement name Gilmore
          (1945) coined for the preoccupied Neosaurus; referred to Hypsibema by
          Baird and Horner (1979).
    erected_in: gilmore1945a
references:
  - id: cope1869a
    notes: Records the type material from Sampson County, North Carolina, of
      Cretaceous age but intrusive in Miocene beds, without a closer locality.
  - id: gilmore1945a
    notes: Original description of the type material, as the sauropod Neosaurus
      missouriensis.
  - id: gilmore1945b
    notes: Replacement genus name (Parrosaurus) for the preoccupied Neosaurus
      Gilmore, 1945.
  - id: baird1979a
    notes: Referred Parrosaurus missouriensis to Hypsibema. Traces the type
      material of H. crassicauda to the marl pits of James King in Sampson
      County, in the "blue marl", now the Black Creek Formation.
  - id: horner1979b
    notes: Lists the type of Parrosaurus missouriensis, now this genus's
      second species, as USNM 16733; Gilmore (1945) prints U.S.N.M. 16735.
  - id: prieto-márquez2016b
    notes: Lists Hypsibema crassicauda and Parrosaurus missouriensis among the
      nondiagnostic hadrosaurids of the Appalachian record.
  - id: brett-surman1989a
    notes: Finds none of the elements diagnostic and calls Hypsibema a nomen
      dubium, questioning its transfer to Sauropoda.
  - id: brownstein2018a
    notes: Treats Hypsibema crassicauda and the Missouri species, as
      Parrosaurus missouriensis, as valid giant hadrosauroids of uncertain
      placement within or outside Hadrosauridae.
