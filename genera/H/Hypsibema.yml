genus: Hypsibema
parent: Hadrosauridae
etymology: From Greek hypsi (high) and bema (step); meaning 'high step', because
  Edward Cope believed the animal walked particularly erect on its toes
pronunciation:
  phonetic: HIP-see-BEE-ma
description: Hypsibema is an extinct genus of very large basal hadrosauroid
  dinosaur from the Late Cretaceous (Campanian) of eastern North America. The
  type species is H. crassicauda, with a potential second species in H.
  missouriensis (now generally placed in its own genus, Parrosaurus). Most
  remains of H. crassicauda, including the type specimen, are known from the Tar
  Heel Formation of North Carolina, in addition to some remains known from the
  Marshalltown Formation of New Jersey.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - marine
  - coastal
diagnostic_features:
  - Caudal vertebra elongate, depressed and angulate; resembled Hylaeosaurus
    form but minus diapophyses
  - Distinguished from Hadrosaurus by various anatomical features
appearance:
  integument: scaled
  evidence: inferred
