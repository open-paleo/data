genus: Harenadraco
parent: Troodontidae
etymology: Sand dragon; from Latin harena (sand) and draco (dragon), referring to the sandy desert environment of the Baruungoyot Formation
description: Harenadraco is an extinct genus of troodontid theropod dinosaurs
  from the Late Cretaceous Baruungoyot Formation of Mongolia. The genus contains
  a single species, H. prima, known from a fragmentary skeleton. Harenadraco
  represents the first troodontid known from the Baruungoyot Formation. Since
  members of this family are also known from the Nemegt and Djadochta
  Formations, the discovery of Harendraco indicates that troodontids were
  important faunal components of every formation within the Nemegt Basin.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - arid
diagnostic_features:
  - Tall S-shaped medial margin of medial condyle of astragalocalcaneum in
    anterior view (autapomorphy)
  - Poorly developed flexor sulcus on distal articular end of metatarsal II,
    lacking collateral ligament fossae (autapomorphy)
  - Metatarsal III excluded from proximal end of metatarsus in dorsal view
  - Metatarsal IV only slightly more robust than metatarsal II at proximal end
    in ventral view
  - Pronounced ventral protrusion near proximal end of metatarsal IV
  - Extremely narrow proximal shaft of metatarsal IV (autapomorphy)
  - Greatly elongated flexor tubercle of pedal phalanx II-3 reaching preceding
    phalanx shaft in articulation (autapomorphy)
  - Distal articular surface of pedal phalanx III-3 not ginglymoid (autapomorphy)
  - Tarsometatarsus length to width ratio ~22:1, extremely slender among
    theropods
