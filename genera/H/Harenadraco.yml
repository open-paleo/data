genus: Harenadraco
parent: Troodontidae
etymology: Sand dragon; from Latin harena (sand) and draco (dragon), referring to the sandy desert environment of the Baruungoyot Formation
description: Harenadraco is an extinct genus of troodontid theropod dinosaurs
  from the Late Cretaceous Baruungoyot Formation of Mongolia. The genus contains
  a single species, H. prima, known from a fragmentary skeleton. Harenadraco
  represents the first troodontid known from the Baruungoyot Formation. Since
  members of this family are also known from the Nemegt and Djadochta
  Formations, the discovery of Harendraco indicates that troodontids were
  important faunal components of every formation within the Nemegt Basin.
diet: carnivore
locomotion: bipedal
