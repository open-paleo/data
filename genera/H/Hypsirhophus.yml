genus: Hypsirhophus
parent: Stegosauria
pronunciation:
  phonetic: HIP-si-ROH-fus
etymology: From Greek hypsi (high) and rhophos (roof); meaning
  "high roof", referring to the tall dorsal vertebrae. Cope's
  original spelling "Hypsirophus" (without the second h) is
  considered a typesetting variant.
description: >
  Hypsirhophus is a genus of stegosaurian dinosaurs. It contains
  a single species, Hypsirhophus discurus, which is known only
  from a fragmentary specimen. The fossil consists of partial
  vertebrae from the back, three from the tail, and a piece of
  rib.
dispute:
  summary: >
    The validity of Hypsirhophus is contested. Maidment et al. (2008) treated
    Hypsirhophus discursus as a junior synonym of Stegosaurus armatus, while
    other workers retain it as a poorly known but possibly distinct stegosaur
    (Galton, 2010). It is retained at Stegosauria incertae sedis.
  history:
    - date: "2026-06-26"
      note: Placed at Stegosauria incertae sedis, validity contested and possibly a junior synonym of Stegosaurus.
diet: herbivore
locomotion: quadrupedal
diagnostic_features:
  - Dorsal zygapophyses extraordinarily elevated, standing on a stem composed of
    the neurapophyses
  - Anterior zygapophyses of dorsal vertebrae united on the midline, forming a
    basin receiving the posterior zygapophyses
  - Neural arch and spine of dorsal vertebra m. 0.575 high; spine m. 0.040 wide
    at base and m. 0.130 wide at summit
  - Caudal centrum m. 0.175 wide and m. 0.160 high; neural arch expanded
    transversely at summit
  - Dorsal vertebra centrum m. 0.105 wide; centrum to base of neural arch m.
    0.105, to posterior zygapophyses m. 0.300
paleoenvironment:
  - fluvial
  - lacustrine
appearance:
  integument: armored
  evidence: inferred
identifiers:
  - source: pbdb
    id: "54208"
  - source: wikidata
    id: Q15723432
synonyms:
  - name: Hypsirhophus seeleyanus
    type: nomen nudum
    reason: Second species erected by Cope (1879) on dorsal
      and caudal vertebrae, teeth, and a femur from an unknown
      locality in Colorado named in honor of Professor Seeley;
      the original description is generally regarded as
      inadequate, making the name a nomen nudum.
species:
  - name: Hypsirhophus discurus
    etymology: "No meaning was assigned by Cope (1878)."
    status: valid
    type_species: true
    period:
      name:
        - Late Jurassic
      stage:
        - Tithonian
      from_ma: 149.2
      to_ma: 145.0
    location:
      country: US
      region: Colorado
      formation: Morrison
      locality: Cope's Quarry 3, Garden Park (near Cañon City)
      coordinates:
        - 38.55
        - -105.13
    type_specimen:
      specimen_id:
        - AMNH 5731
      specimen_type: holotype
      institution: AMNH
      material: Dorsal vertebra with elevated zygapophyses on a stem of neurapophyses,
        two partial neural spines, two caudal centra, and a rib fragment.
      completeness: fragmentary
    erected_in: cope1878a
references:
  - id: cope1878a
    notes: Brief General Notes entry erecting Hypsirhophus discurus on vertebral
      material from the "Dakota Beds" of Colorado (now Morrison Formation); Cope
      proposed no formal higher placement beyond Dinosauria.
  - id: cope1879a
    notes: Reaffirms the affinities of Hypsirhophus and erects H. seeleyanus as
      a second species (later treated as a nomen nudum); same paper also names
      Camarasaurus leptodirus.
  - id: carpenter2001b
    notes: Treats Hypsirhophus discurus as valid, stating it "differs enough
      from Stegosaurus to warrant recognition"; restricts it to Morrison
      Dinosaur Zone 4.
  - id: maidment2008a
    notes: Treated Hypsirhophus discursus as a junior synonym of Stegosaurus armatus.
  - id: galton2010a
    notes: Bearing on the validity of Hypsirhophus relative to Stegosaurus.
