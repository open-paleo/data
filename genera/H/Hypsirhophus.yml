genus: Hypsirhophus
parent: Stegosauria
pronunciation:
  phonetic: HIP-si-ROH-fus
etymology: From Greek hypsi (high) and rhophos (roof); meaning
  "high roof", referring to the tall dorsal vertebrae. Cope's
  original spelling "Hypsirophus" (without the second h) is
  considered a typesetting variant.
description: >
  Hypsirhophus is a genus of stegosaurian dinosaurs. It contains
  a single species, Hypsirhophus discurus, which is known only
  from a fragmentary specimen. The fossil consists of partial
  vertebrae from the back, three from the tail, and a piece of
  rib.
dispute:
  summary: >
    The validity of Hypsirhophus is contested. Maidment et al. (2008) treated
    Hypsirhophus discursus as a junior synonym of Stegosaurus armatus, while
    other workers retain it as a poorly known but possibly distinct stegosaur
    (Galton, 2010). It is retained at Stegosauria incertae sedis.
  history:
    - date: "2026-06-26"
      note: Parked at Stegosauria incertae sedis, validity contested and possibly a junior synonym of Stegosaurus (P2).
diet: herbivore
locomotion: quadrupedal
diagnostic_features:
  - Dorsal zygapophyses extraordinarily elevated, standing on a stem composed of
    the neurapophyses
  - Anterior zygapophyses of dorsal vertebrae united on the midline, forming a
    basin receiving the posterior zygapophyses
  - Neural arch and spine of dorsal vertebra m. 0.575 high; spine m. 0.040 wide
    at base and m. 0.130 wide at summit
  - Caudal centrum m. 0.175 wide and m. 0.160 high; neural arch expanded
    transversely at summit
  - Dorsal vertebra centrum m. 0.105 wide; centrum to base of neural arch m.
    0.105, to posterior zygapophyses m. 0.300
paleoenvironment:
  - fluvial
  - lacustrine
appearance:
  integument: armored
  evidence: inferred
identifiers:
  - source: pbdb
    id: "54208"
  - source: wikidata
    id: Q15723432
synonyms:
  - name: Hypsirhophus seeleyanus
    type: nomen nudum
    reason: Second species erected by Cope (1879) on dorsal
      and caudal vertebrae, teeth, and a femur from an unknown
      locality in Colorado named in honor of Professor Seeley;
      the original description is generally regarded as
      inadequate, making the name a nomen nudum.
