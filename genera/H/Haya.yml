genus: Haya
parent: Thescelosaurinae
etymology: "From Sanskrit 'haya', referring to the Hayagriva avatar of Vishnu (depicted with a horse head), in reference to the elongate horse-like skull and the deity's appearance in the Buddhist art of Mongolia."
pronunciation:
  phonetic: hah-yah
description: Haya is an extinct genus of basal neornithischian dinosaur known
  from the Late Cretaceous of Mongolia.
dispute:
  summary: >
    Haya is recovered within Thescelosaurinae by Boyd (2015) and Fonseca
    and others (2024) and is so classified by Jones (2026). Barta and
    Norell (2021) could not resolve it between Thescelosaurinae and
    Orodrominae, and Herne and others (2019) placed it in Jeholosauridae.
  history:
    - date: "2026-06-29"
      note: Placed at Thescelosaurinae following Boyd (2015), Fonseca and others (2024), and Jones (2026); subfamily position not fully resolved (Barta and Norell, 2021).
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Five homodont, bulbous, unserrated premaxillary teeth
  - Triangular accessory maxillary fenestra present (as in Hypsilophodon)
  - Jugal with bifid caudal ramus (as in Jeholosaurus)
  - Quadratojugal foramen large, piercing quadratojugal
  - Midline depression along internasal suture between base of internarial bar
    and widest point across nasals
  - Predentary arrow-shaped with bifid ventral ramus (as in Changchunsaurus)
appearance:
  features:
    - keratinous beak
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "186989"
  - source: wikidata
    id: Q1655422
  - source: gbif
    id: "8667556"
  - source: eol
    id: "6360399"
