genus: Hanssuesia
parent: Pachycephalosauridae
etymology: Named in honor of paleontologist Hans-Dieter Sues
pronunciation:
  phonetic: han-SU-see-uh
description: Hanssuesia is a genus of pachycephalosaurid dinosaurs from the late
  Cretaceous period. It lived in what is now Alberta and Montana, and contains
  the single species Hanssuesia sternbergi.
dispute:
  summary: >
    The validity of Hanssuesia is contested. Dyer et al. (2023) found that
    Hanssuesia sternbergi falls within the variation of Stegoceras validum and
    proposed synonymy, while Woodruff et al. (2025) provisionally retained it
    pending a fuller ontogenetic assessment. It is kept as a valid basal
    pachycephalosaurid for now.
  history:
    - date: "2026-06-26"
      note: Placed at Pachycephalosauridae (Stegoceras-grade), kept valid pending consensus; synonymy with Stegoceras proposed but not yet settled.
diet: herbivore
locomotion: bipedal
diagnostic_features:
  - Reduced sutural surfaces for squamosal attachment along posterior edges of
    frontoparietal dome
  - Incipient parietosquamosal shelf, reduced compared to Stegoceras validum
  - Frontals proportionally low and broad where in contact with nasals
  - Lateral frontal lobes not well developed and recessed posterior to medial
    nasal lobe
  - Characteristic posterior sloping of parietal portion of frontoparietal dome
paleoenvironment:
  - fluvial
  - coastal
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "67704"
  - source: wikidata
    id: Q812762
  - source: gbif
    id: "4823074"
  - source: eol
    id: "47460084"
species:
  - name: Hanssuesia sternbergi
    etymology: "Named for Charles Mortram Sternberg, the Canadian paleontologist who found the holotype dome near Steveville, Alberta, in 1928."
    status: disputed
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Campanian
    location:
      country: CA
      locality: southeast of Steveville
      region: CA-AB
      formation: Dinosaur Park
      notes: Brown and Schlaikjer (1943) name only the undivided Belly River
        formation; Sullivan (2003) gives the Dinosaur Park, allowing a
        remote possibility of the Oldman.
    type_specimen:
      specimen_id: [NMC 8817]
      specimen_type: holotype
      institution: CMN
      material: Nearly complete frontoparietal dome with peripheral skull elements
      completeness: fragmentary
    synonyms:
      - name: Troodon sternbergi
        type: reassigned
        reason: Original combination (Brown and Schlaikjer, 1943) on NMC 8817;
          later moved to Stegoceras and then to the new genus Hanssuesia by
          Sullivan (2003).
      - name: Stegoceras sternbergi
        type: reassigned
        reason: Interim combination after the species was moved out of Troodon
          and before Sullivan (2003) erected Hanssuesia.
    erected_in: sullivan2003a
references:
  - id: brown1943a
    notes: Original description as Troodon sternbergi on NMC 8817; later
      reassigned to Stegoceras and then to Hanssuesia by Sullivan (2003).
  - id: sullivan2003a
  - id: woodruff2025a
    notes: Provisionally retained Hanssuesia pending a fuller ontogenetic assessment.
  - id: dyer2023a
    notes: Found Hanssuesia sternbergi falls within the variation of Stegoceras validum and proposed synonymy.
