genus: Haestasaurus
parent: Eusauropoda
placement: incertae sedis
dispute:
  summary: >
    Haestasaurus has been recovered in markedly different positions.
    Upchurch and others (2015) obtained analyses ranging from the base of
    Macronaria to within Titanosauria but concluded it is most plausibly a
    non-titanosauriform macronarian; Mannion and others (2019) instead
    recovered it outside Neosauropoda, as sister to Janenschia. Jones
    (2026) is explicitly non-committal.
  history:
    - date: "2026-06-29"
      note: >
        Retained at Eusauropoda incertae sedis given the unresolved
        placement; a macronarian or titanosauriform position remains
        possible.
etymology: "Named after Haesta, a Saxon chieftain associated with the Hastings area of England near where the fossil was found, combined with Greek 'sauros' meaning 'lizard'; means 'Haesta's lizard'."
pronunciation:
  phonetic: HAY-stuh-SOR-us
description: Haestasaurus is a genus of herbivorous sauropod dinosaur, belonging
  to the Macronaria, that during the Early Cretaceous lived in the area of
  present-day England. The only species is Haestasaurus becklesii.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Anteromedial corner of distal humerus projects to form anterior
    entepicondylar process
  - Two small vertical ridges between lateral and medial anterodistal processes
    of humerus
  - Proximal articular surface of radius widest anteroposteriorly along lateral
    margin, nearly straight rather than strongly convex
  - Anterior surface of radius shallowly concave at distal end shaft between
    anterolateral and anteromedial ridges
  - Combination of robust ulna and slender radius
appearance:
  integument: scaled
  evidence: direct
