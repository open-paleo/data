  - source: pbdb
    id: "321574"
  - source: wikidata
    id: Q20054871
species:
  - name: Haestasaurus becklesii
    etymology: "Named for Samuel Husband Beckles, the collector who obtained the holotype block from the coast of East Sussex in 1852."
    status: valid
    type_species: true
