genus: Hesperonychus
parent: Microraptorinae
dispute:
  summary: >
    Hesperonychus is generally recovered as a microraptorine (Longrich and Currie,
    2009; Jones et al., 2026), extending the group into the Late Cretaceous of
    North America, the placement adopted here. Hartman et al. (2019), however,
    recovered the holotype as an avialan at least as close to birds as Balaur. It
    is placed in Microraptorinae following the prevailing view.
  history:
    - date: "2026-07-01"
      note: Placed in Microraptorinae following the prevailing view (Longrich and Currie, 2009; Jones et al., 2026); the avialan hypothesis (Hartman et al., 2019) is recorded.
etymology: "From Greek 'hesperos' meaning 'western' and 'onychos' meaning 'claw'. The type species, H. elizabethae, was named in honor of Dr. Elizabeth Nicholls of the Royal Tyrrell Museum of Palaeontology."
pronunciation:
  phonetic: hes-puh-ruh-NIE-kus
description: Hesperonychus is a genus of small dromaeosaurid dinosaur. There is
  one described species, Hesperonychus elizabethae. The type species was named
  in honor of Dr. Elizabeth Nicholls of the Royal Tyrrell Museum of
  Palaeontology who collected it as a student in 1982. It is known from fossils
  recovered from the Dinosaur Park Formation and possibly from the uppermost
  strata of the Oldman Formation of Alberta, dating to the Campanian stage of
  the Late Cretaceous around 75 million years ago.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Pubic peduncle of ilium with medial surface deeply excavated
  - Posterior wing of ilium with medial shelf split to form anterior and
    posterior processes
  - Lateral tubercles of pubis wing-like and curving anteriorly
  - Pubis with fossa on lateral surface ventral to acetabulum
  - Pubic apron shifted onto posterior surface of pubis
  - Pubic symphysis teardrop-shaped in lateral view
  - Ischiadic process of pubis reduced to narrow lamina
  - Acetabulum opens dorsolaterally rather than laterally
  - Pubic shaft sharply curves posteriorly as in Microraptor and Sinornithosaurus
  - Lateral process of pubis wing-like and curving anteriorly
appearance:
  features:
    - sickle claw
  integument: feathered
  evidence: direct
