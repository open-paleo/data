genus: Hesperonychus
parent: Microraptorinae
etymology: "From Greek 'hesperos' meaning 'western' and 'onychos' meaning 'claw'. The type species, H. elizabethae, was named in honor of Dr. Elizabeth Nicholls of the Royal Tyrrell Museum of Palaeontology."
description: Hesperonychus is a genus of small dromaeosaurid dinosaur. There is
  one described species, Hesperonychus elizabethae. The type species was named
  in honor of Dr. Elizabeth Nicholls of the Royal Tyrrell Museum of
  Palaeontology who collected it as a student in 1982. It is known from fossils
  recovered from the Dinosaur Park Formation and possibly from the uppermost
  strata of the Oldman Formation of Alberta, dating to the Campanian stage of
  the Late Cretaceous around 75 million years ago.
