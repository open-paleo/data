genus: Haplocanthosaurus
parent: Diplodocoidea
pronunciation:
  phonetic: hap-lo-KAN-tho-SAWR-us
etymology: Simple spined lizard; from Greek haploos (simple), akantha (spine or thorn), and sauros (lizard)
description: Haplocanthosaurus is a genus of diplodocoid sauropod dinosaur. Two
  species, H. delfsi and H. priscus, are known from incomplete fossil skeletons.
  They lived during the Late Jurassic (Kimmeridgian stage), 155 to 152 million
  years ago in North America. The type species is H. priscus, named in 1903 John
  Bell Hatcher , and the referred species H. delfsi was discovered by a young
  college student named Edwin Delfs in Colorado, United States and described by
  Jack McIntosh and Michael Williams in 1988. Haplocanthosaurus specimens have
  been found in the lowermost layer of the Morrison Formation, along with
  Hesperosaurus mjosi, Brontosaurus yahnahpin, and Allosaurus jimmadseni.
diet: herbivore
locomotion: quadrupedal
diagnostic_features:
  - Cervical vertebrae of only moderate length with prominent but simple
    pleurocoels; neural spines of posterior cervicals and anterior dorsals
    undivided.
  - Dorsal centra relatively small with prominent pleurocoels; dorsal arches
    high with diapophyses directed upward at 45 degrees as well as outward;
    spines short and broad.
  - Sacrum of five vertebrae (dorso-sacral, three primary sacrals, caudo-
    sacral) with coossified centra and sacral ribs forming a yoke; spines with
    tendency toward coalescence particularly in sacrals one through three.
  - Caudal centra amphicoelous, short, without pleurocentral cavities; chevron
    facets very prominent giving the underside of each centrum a sculptured
    appearance; anterior caudal spines slender and curved backward.
  - Distal end of scapula thin and broadly splayed; proximal plate relatively
    small; sternal plates large and subquadrangular.
  - Ischium shaft straight with distal end slightly broadened but not
    thickened; femur with latero-medial shaft diameter significantly exceeding
    the antero-posterior diameter.
paleoenvironment:
  - fluvial
  - lacustrine
