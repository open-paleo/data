genus: Herrerasaurus
parent: Herrerasauridae
pronunciation:
  phonetic: he-RER-a-SAWR-us
etymology: Named for Victorino Herrera, the Argentine rancher who discovered the
  first specimen in 1958, combined with Greek 'sauros' meaning 'lizard', meaning
  'Herrera's lizard'.
description: Herrerasaurus is likely a genus of saurischian dinosaur from the
  Late Triassic period. Measuring 6 m (20 ft) long and weighing around 350 kg
  (770 lb), this genus was one of the earliest dinosaurs from the fossil record.
  Its name means "Herrera's lizard", after the rancher who discovered the first
  specimen in 1958 in South America. All known fossils of this carnivore have
  been discovered in the Ischigualasto Formation of Carnian age (late Triassic
  according to the ICS, dated to 231.4 million years ago) in northwestern
  Argentina. The type species, Herrerasaurus ischigualastensis, was described by
  Osvaldo Reig in 1963 and is the only species assigned to the genus.
  Ischisaurus and Frenguellisaurus are synonyms.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Robust, high premaxilla with three teeth; tall maxilla with eight teeth
  - Dentary with twelve teeth; mandibular symphysis strong and taller than
    alveolar ramus
  - Sacrum with three vertebrae
  - Short, tall ilium with very robust anterior spine; pubis nearly
    perpendicular to vertebral axis with expanded distal 'foot' similar to
    Antrodemus
  - Gracile femur slightly curved in S-form with clear greater trochanter and
    distinct aliform fourth trochanter in upper 2/5 of bone
  - "Robust tibia shorter than femur (tibia/femur index: 87); wide astragalus
    without ascending process; very small calcaneum"
  - "Central metatarsals more elongate than typical for size (3rd Mt./femur
    index: 45)"
