genus: Herrerasaurus
parent: Herrerasauridae
pronunciation:
  phonetic: he-RER-a-SAWR-us
etymology: Named for Victorino Herrera, the Argentine rancher who discovered the
  first specimen in 1958, combined with Greek 'sauros' meaning 'lizard', meaning
  'Herrera's lizard'.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Robust, high premaxilla with three teeth; tall maxilla with eight teeth
  - Dentary with twelve teeth; mandibular symphysis strong and taller than
    alveolar ramus
  - Sacrum with three vertebrae
  - Short, tall ilium with very robust anterior spine; pubis nearly
    perpendicular to vertebral axis with expanded distal 'foot' similar to
    Antrodemus
  - Gracile femur slightly curved in S-form with clear greater trochanter and
    distinct aliform fourth trochanter in upper 2/5 of bone
  - "Robust tibia shorter than femur (tibia/femur index: 87); wide astragalus
    without ascending process; very small calcaneum"
  - "Central metatarsals more elongate than typical for size (3rd Mt./femur
    index: 45)"
appearance:
  integument: unknown
identifiers:
  - source: pbdb
    id: "38511"
  - source: wikidata
    id: Q131014
  - source: gbif
    id: "4822914"
  - source: eol
    id: "4531444"
synonyms:
  - name: Ischisaurus
    type: junior subjective
    reason: Now interpreted as juvenile material of Herrerasaurus.
  - name: Frenguellisaurus
    type: junior subjective
    reason: Material is now considered indistinguishable from Herrerasaurus.
species:
  - name: Herrerasaurus ischigualastensis
    etymology: "Named for the Ischigualasto Formation of Argentina, where all known
      fossils were discovered."
    pronunciation:
      phonetic: ISH-ee-gwuh-las-TEN-sis
    status: valid
    type_species: true
    period:
      name:
        - Late Triassic
      stage:
        - Carnian
    location:
      country: AR
      locality: a few kilometers east-southeast of Aguada de la Peña
      region: AR-J
      formation: Ischigualasto
      part: lower
      notes: Reig (1963) places the holotype by bearing from Aguada de la Peña
        and names no site. A referred specimen comes from Valle Pintado,
        which is also the type locality of Panphagia and Chromogisaurus.
    size:
      hip_height_m:
        min: 1.4
        max: 1.4
      length_m:
        min: 4.5
        max: 6.0
      weight_kg:
        min: 200
        max: 350
      skull_length_m:
        min: 0.56
        max: 0.56
    type_specimen:
      specimen_id: [ PVL 2566 ]
      specimen_type: holotype
      institution: PVL
      material: Partial skeleton
      completeness: partial
    erected_in: reig1963a
notable_specimens:
  - specimen_id: [PVSJ 407]
    institution: UNSJ
    species: Herrerasaurus ischigualastensis
    category: pathology
    significance: "Referred Herrerasaurus skull bearing a pit in a skull bone and two pits on the splenial, attributed to a bite. Surrounding bone is swollen and porous, indicating a short-lived non-lethal infection, likely sustained in a fight with another Herrerasaurus."
    references: [sereno1993b]
