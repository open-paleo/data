genus: Haplocheirus
parent: Alvarezsauroidea
dispute:
  summary: >
    Haplocheirus sollers is recovered as the basalmost alvarezsauroid by the
    dedicated alvarezsaur analyses (Choiniere and colleagues, 2010, 2014; Xu and colleagues,
    2018; Qin and colleagues, 2019; Meso and colleagues, 2024), but its alvarezsauroid affinity
    is contested. The maniraptoromorph analysis of Hartman and colleagues (2019)
    recovered it as a compsognathid, and Agnolín and colleagues (2021) argued on cranial
    evidence that Haplocheirus and the other Jurassic Chinese "alvarezsauroids"
    resemble ornithomimosaurs and may fall outside Alvarezsauroidea.
  history:
    - date: "2026-07-01"
      note: Placed at Alvarezsauroidea following the prevailing dedicated analyses; the compsognathid and ornithomimosaur alternatives remain unresolved.
etymology: "Simple hand; from Ancient Greek haplós (simple) and kheír (hand)"
pronunciation:
  ipa: /ˌhæplʊuˈkəirəs/
  phonetic: HAP-lo-KY-ruhs
description: Haplocheirus is an extinct genus of theropod dinosaur from the Middle
  Jurassic Shishugou Formation of Xinjiang in China. It is generally considered to
  be an alvarezsauroid, although some researchers have questioned this assignment.
  The genus contains a single species, H. sollers, which is known from a mostly
  complete skeleton including the skull.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Ventral edge of the distal end of the paroccipital processes twisted
    posteriorly
  - Metacarpal III one-half the length of metacarpal II
  - Dorsally expanded distal end of the jugal process of the maxilla (unique
    among alvarezsauroids)
  - Heterodont dentary tooth row with an enlarged tooth in the fourth alveolus
  - Alveolar margin at the anterior end of the dentary dorsally convex
  - Maxillary and dentary teeth with serrations on the distal carinae
appearance:
  features:
    - enlarged manual claws
  integument: feathered
  evidence: inferred
identifiers:
  - source: pbdb
    id: "162352"
  - source: wikidata
    id: Q81482
species:
