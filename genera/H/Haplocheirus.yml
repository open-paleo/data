  - id: choiniere2014a
    notes: Detailed cranial redescription of the holotype with a revised
      diagnosis; retracts the second mandibular fenestra as a preservational
      artifact and adds cranial autapomorphies.
  - id: paul2024a
    notes: Source of the appearance features.
  - id: qin2019a
    notes: Included Haplocheirus in an alvarezsaurian phylogenetic analysis.
  - id: hartman2019a
    notes: Recovered Haplocheirus as a compsognathid in a maniraptoromorph analysis.
  - id: xu2018c
    notes: Included Haplocheirus in analysis of early alvarezsaurian forelimb evolution
  - id: agnolín2021b
    notes: Argued on cranial evidence Haplocheirus resembles ornithomimosaurs, possibly falling outside Alvarezsauroidea
  - id: meso2024a
