genus: Haplocheirus
parent: Alvarezsauroidea
etymology: "Simple hand; from Ancient Greek haplós (simple) and kheír (hand)"
pronunciation:
  ipa: /ˌhæplʊuˈkəirəs/
  phonetic: HAP-lo-KY-ruhs
description: Haplocheirus is an extinct genus of theropod dinosaur from the Middle
  Jurassic Shishugou Formation of Xinjiang in China. It is generally considered to
  be an alvarezsauroid, although some researchers have questioned this assignment.
  The genus contains a single species, H. sollers, which is known from a mostly
  complete skeleton including the skull.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Ventral edge of the distal end of the paroccipital processes twisted
    posteriorly
  - Metacarpal III one-half the length of metacarpal II
  - Dorsally expanded distal end of the jugal process of the maxilla (unique
    among alvarezsauroids)
  - Heterodont dentary tooth row with an enlarged tooth in the fourth alveolus
  - Alveolar margin at the anterior end of the dentary dorsally convex
  - Maxillary and dentary teeth with serrations on the distal carinae
appearance:
  features:
    - enlarged manual claws
  integument: feathered
  evidence: inferred
