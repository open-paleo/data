    etymology: "From Latin 'sollers' meaning 'skillful'."
    status: valid
    type_species: true
    period:
      name:
        - Middle Jurassic
        - Late Jurassic
      stage:
        - Callovian
        - Oxfordian
    location:
      country: CN
      locality: Wucaiwan
      region: CN-XJ
      formation: Shishugou
      part: middle
      notes: >
        Choiniere and colleagues (2010) gave the horizon as "Lower orange
        mudstone beds in the upper part of the Shishugou Formation"; their
        2014 redescription places it in the "Middle beds", between tuffs dated
        162.2 and 159.7 Ma, which on GTS2020 straddle the base of the
        Oxfordian. Qin and colleagues (2019) put it about 40 m above the lower
        tuff.
    size:
