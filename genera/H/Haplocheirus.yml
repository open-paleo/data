genus: Haplocheirus
parent: Alvarezsauroidea
etymology: "Simple hand; from Ancient Greek haplós (simple) and kheír (hand)"
pronunciation:
  ipa: /ˌhæplʊuˈkəirəs/
description: Haplocheirus is an extinct genus of theropod dinosaur from the Middle
  Jurassic Shishugou Formation of Xinjiang in China. It is generally considered to
  be an alvarezsauroid, although some researchers have questioned this assignment.
  The genus contains a single species, H. sollers, which is known from a mostly
  complete skeleton including the skull.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Accessory mandibular fenestra anterodorsal to mandibular fenestra, fenestrae
    divided by posterior process of dentary
  - Metacarpal III one-half the length of metacarpal II
  - Heterodont dentary tooth row with enlarged dentary tooth 4
  - Alveolar margin of anterior end of dentary is dorsally convex
  - Maxillary and dentary teeth with posterior serrations
  - Recurved maxillary and dentary teeth with serrations
  - Distal carpals not fused to metacarpals
  - Manual digit III longer than digit II
  - Manual digits III and IV bear recurved unguals
  - Pubis projects anteroventrally
  - Ventral surface of sacrum without keel
  - Posterior surface of last sacral centrum flat
