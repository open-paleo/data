genus: Huaxiazhoulong
parent: Ankylosauridae
description: Huaxiazhoulong is an extinct genus of ankylosaurid dinosaurs from
  the Late Cretaceous (Campanian) Tangbian Formation of Jiangxi Province, China.
  The genus contains a single species, H. shouwen, known from a partial
  skeleton.
