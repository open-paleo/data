genus: Huaxiazhoulong
parent: Ankylosauridae
etymology: "Combines the Chinese words 'Huaxia' (an ancient name for China), 'zhou' meaning 'armor', and 'long' meaning 'dragon'; the specific name shouwen is Chinese pinyin for 'painted in the shape of a beast'."
pronunciation:
  phonetic: hwah-syah-jo-long
description: Huaxiazhoulong is an extinct genus of ankylosaurid dinosaurs from
  the Late Cretaceous (Campanian) Tangbian Formation of Jiangxi Province, China.
  The genus contains a single species, H. shouwen, known from a partial
  skeleton.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Middle shaft and distal end of ischium are expanded
  - Ratio of width of distal end to minimum shaft width greater than 3 in humerus
  - Maximum femur to humerus length ratio about 1.45
  - Centra of anterior caudal vertebrae in anterior view heart-shaped
  - Dorsal surface of scapula is straight
  - Scapulocoracoid has large medial brace exceeding scapula glenoid length
  - Humeral head and deltopectoral crest separated by distinct notch anteriorly
appearance:
  integument: armored
  evidence: direct
