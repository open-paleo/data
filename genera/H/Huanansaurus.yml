genus: Huanansaurus
parent: Citipatinae
etymology: From Chinese Huanan (Southern China) combined with Greek sauros (lizard); meaning 'Southern China lizard'
pronunciation:
  phonetic: HWAH-nan-SOR-us
description: Huanansaurus is an extinct genus of oviraptorid dinosaur that lived
  approximately 72 million years ago, between the Campanian and Maastrichtian,
  during the latter part of the Cretaceous period in what is now China, in the
  Nanxiong Formation.
diet: omnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Mandibular condyles of quadrate posterior to occipital condyle
  - Pronounced nuchal transverse crest
  - Angular contributes extensively to external mandibular fenestra border
  - Dentary anterodorsal tip projecting anterodorsally at ≤45° to symphysis
    ventral margin
  - Pneumatized dentaries
  - Metacarpal I long and slender, diameter 20% of length
  - Posteroventral branch of dentary twisted, lateral surface facing somewhat
    ventrally
  - Symphyseal shelf of mandible intermediate length, 20-25% of total mandible
    length
  - Proximodorsal extensor 'lip' on each manual ungual prominent with distinct
    slope change
  - Circular supratemporal fenestra much smaller than lower temporal fenestra
appearance:
  features:
    - keratinous beak
    - downturned snout
  integument: feathered
  evidence: inferred
