genus: Huanansaurus
parent: Citipatinae
description: Huanansaurus is an extinct genus of oviraptorid dinosaur that lived
  approximately 72 million years ago, between the Campanian and Maastrichtian,
  during the latter part of the Cretaceous period in what is now China, in the
  Nanxiong Formation.
