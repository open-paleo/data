genus: Heterodontosaurus
parent: Heterodontosaurinae
pronunciation:
  phonetic: HET-e-ro-DON-to-SAWR-us
etymology: "From Greek 'heteros' meaning 'different', 'odont' meaning 'tooth', and 'sauros' meaning 'lizard', in reference to its unusual heterodont dentition. The species name honors George C. Tuck, who supported the expedition."
description: Heterodontosaurus is a genus of heterodontosaurid dinosaur that
  lived during the Early Jurassic, 200-190 million years ago. Its only known
  member species, Heterodontosaurus tucki, was named in 1962 based on a skull
  discovered in South Africa. The genus name means "different toothed lizard",
  in reference to its unusual, heterodont dentition; the specific name honors
  G. C. Tuck, who supported the discoverers. Further specimens have since been
  found, including an almost complete skeleton in 1966.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - arid
diagnostic_features:
  - Short facial region with large antorbital fenestra
  - Supraorbital bone projecting into orbit
  - "Hinder premaxilla with three teeth: two incisor-like and one large
    caniniform"
  - Wide diastema between premaxillary and maxillary teeth
  - About 12 closely-set maxillary teeth with vertical ridging on distal halves
    of crowns
  - First mandibular tooth large and caniniform, projecting upward into diastema
  - Mandibular teeth closely-set with vertical ridges, enamel on inner surface
    only
  - Predentary present without teeth, separated from dentary by distinct suture
appearance:
  features:
    - enlarged caniniform teeth
  integument: scaled
  evidence: inferred
