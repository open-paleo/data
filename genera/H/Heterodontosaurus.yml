notable_specimens:
  - specimen_id: [SAM-PK-K1332]
    institution: SAM
    species: Heterodontosaurus tucki
    category: most-complete
    significance: "The most complete heterodontosaurid skeleton described to date. Found at the Voyizane locality, it preserves skull and skeleton in articulation with little displacement, and as an adult underpins the full description of the genus's anatomy."
    discovered:
      year: 1966
    references: [santaluca1980, norman2011]
  - specimen_id: [AM 4766]
    institution: AMS-MK
    species: Heterodontosaurus tucki
    category: complementary
    significance: "A very complete specimen found near Grahamstown. Its rock was too hard to remove, so it was synchrotron-scanned in 2016; the data on its pelvis and gastralia underpinned a 2021 reinterpretation of ornithischian breathing, with Heterodontosaurus as an intermediate stage."
    discovered:
      year: 2005
    references: [radermacher2021]
  - specimen_id: [SAM-PK-K10487]
    institution: SAM
    species: Heterodontosaurus tucki
    category: ontogeny
    significance: "The front part of a juvenile skull, the key ontogenetic specimen for the genus, showing that the eye sockets became proportionally smaller and the snout longer with age. CT scans revealed unerupted replacement teeth even at this early stage, informing the tooth-replacement debate."
    references: [butler2008]
  - specimen_id: [SAM-PK-K1334]
    institution: SAM
    species: Heterodontosaurus tucki
    category: ontogeny
    significance: "A left maxilla from the Voyizane locality. Its upper jaw was the first specimen in which unerupted replacement teeth were discovered in Heterodontosaurus, a find later corroborated by the juvenile skull AMNH 24000."
    references: [norman2011]
