genus: Heterodontosaurus
parent: Heterodontosaurinae
etymology: "From Greek 'heteros' meaning 'different', 'odont' meaning 'tooth', and 'sauros' meaning 'lizard', in reference to its unusual heterodont dentition. The species name honours George C. Tuck, who supported the expedition."
description: Heterodontosaurus is a genus of heterodontosaurid dinosaur that
  lived during the Early Jurassic, 200–190 million years ago. Its only known
  member species, Heterodontosaurus tucki, was named in 1962 based on a skull
  discovered in South Africa. The genus name means "different toothed lizard",
  in reference to its unusual, heterodont dentition; the specific name honours
  G. C. Tuck, who supported the discoverers. Further specimens have since been
  found, including an almost complete skeleton in 1966.
diet: herbivore
