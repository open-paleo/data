genus: Hierosaurus
parent: Ankylosauria
placement: incertae sedis
pronunciation:
  phonetic: HY-er-oh-SAWR-us
etymology: "From Greek 'hieros' meaning 'sacred' and 'sauros' meaning 'lizard', hence 'sacred lizard'."
description: Hierosaurus is an extinct genus of nodosaurid ankylosaur which
  lived during the Late Cretaceous 87 to 82 million years ago. Its fossils were
  found in the Smoky Hill Chalk Member of the Niobrara Formation, in western
  Kansas, which would have been near the middle of the Western Interior Sea
  during the Late Cretaceous. It was a nodosaurid, an ankylosaur without a
  clubbed tail.
dispute:
  summary: >
    Hierosaurus is a nomen dubium based on osteoderms; H. coleii was reassigned to Niobrarasaurus. It is retained at Ankylosauria incertae sedis.
  history:
    - date: "2026-06-26"
      note: Placed at Ankylosauria incertae sedis, nomen dubium based on undiagnostic armor.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - marine
diagnostic_features:
  - Dermal scutes with median ridge sharp and running entire length, 1-1.5 cm
    height, terminating as sharp backwardly projecting slightly upturned spur
  - System of hornshields indicated by heavy sulci, at least as large as keeled
    plates
  - Lumbar-hip carapace with fused large scales and organized bone-hornshield
    system comparable to Dermochelys
appearance:
  integument: armored
  evidence: direct
identifiers:
  - source: pbdb
    id: "54410"
  - source: wikidata
    id: Q3785503
  - source: gbif
    id: "4823197"
species:
  - name: Hierosaurus sternbergii
    etymology: "Named for Charles Hazelius Sternberg, who collected the fossil material on which the species is based."
    status: valid
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Coniacian
      from_ma: 89.8
      to_ma: 86.3
    location:
      country: US
      region: Kansas
      formation: Niobrara
      coordinates:
        - 38.788891
        - -100.169441
    type_specimen:
      specimen_id: [YPM 1847]
      specimen_type: holotype
      institution: YPM
      material: At least 34 dermal scutes, plus skull and rib fragments; the
        phalanges and vertebrae originally described are no longer extant.
      completeness: fragmentary
    erected_in: wieland1909a
references:
