genus: Hierosaurus
parent: Ankylosauria
pronunciation:
  phonetic: HY-er-oh-SAWR-us
etymology: "From Greek 'hieros' meaning 'sacred' and 'sauros' meaning 'lizard', hence 'sacred lizard'."
description: Hierosaurus is an extinct genus of nodosaurid ankylosaur which
  lived during the Late Cretaceous 87 to 82 million years ago. Its fossils were
  found in the Smoky Hill Chalk Member of the Niobrara Formation, in western
  Kansas, which would have been near the middle of the Western Interior Sea
  during the Late Cretaceous. It was a nodosaurid, an ankylosaur without a
  clubbed tail.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - marine
diagnostic_features:
  - Dermal scutes with median ridge sharp and running entire length, 1-1.5 cm
    height, terminating as sharp backwardly projecting slightly upturned spur
  - System of hornshields indicated by heavy sulci, at least as large as keeled
    plates
  - Lumbar-hip carapace with fused large scales and organized bone-hornshield
    system comparable to Dermochelys
appearance:
  integument: armored
  evidence: direct
