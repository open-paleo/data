genus: Hulsanpes
parent: Halszkaraptorinae
pronunciation:
  phonetic: HOOL-sahn-pees
etymology: "Named for the type locality Khulsan (Mongolia) combined with Latin 'pes' meaning 'foot', hence 'Khulsan foot'. The species name honors Mongolian paleontologist Altangerel Perle."
description: Hulsanpes is a genus of halszkaraptorine theropod dinosaurs that
  lived during the Late Cretaceous in what is now the Barun Goyot Formation of
  Mongolia, about 75-72 million years ago. The remains were found in 1970 and
  formally described in 1982 by Halszka Osmólska, who noted that the genus is
  represented by an immature individual. Hulsanpes represents the first record
  of the basal dromaeosaurid subfamily Halszkaraptorinae.
