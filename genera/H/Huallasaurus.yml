genus: Huallasaurus
parent: Saurolophinae
etymology: Duck lizard; from hualla, the Mapudungun word for duck, combined with Greek sauros (lizard)
pronunciation:
  phonetic: WAH-yah-SOR-us
description: Huallasaurus is an extinct genus of saurolophine hadrosaur from the
  Late Cretaceous Los Alamitos Formation of Patagonia in Argentina. The type and
  only species is H. australis. Originally named as a species of Kritosaurus in
  1984, it was long considered a synonym of Secernosaurus before being
  recognized as its own distinct genus in a 2022 study, different from other
  members of Kritosaurini.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - lacustrine
diagnostic_features:
  - Maxilla with obliquely oriented, strongly posteriorly inclined ectopterygoid
    ridge
  - Jugal with dorsoventrally low anterior process
  - Postorbital with finger-like medial process forming anterior margin of
    supratemporal fenestra
  - Dentary with ventrally concave shallow groove at anterior margin
  - Postacetabular process bearing longitudinal groove on dorsal surface
appearance:
  integument: scaled
  evidence: inferred
