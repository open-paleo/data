genus: Huallasaurus
parent: Kritosaurini
etymology: Duck lizard; from hualla, the Mapudungun word for duck, combined with Greek sauros (lizard)
description: Huallasaurus is an extinct genus of saurolophine hadrosaur from the
  Late Cretaceous Los Alamitos Formation of Patagonia in Argentina. The type and
  only species is H. australis. Originally named as a species of Kritosaurus in
  1984, it was long considered a synonym of Secernosaurus before being
  recognized as its own distinct genus in a 2022 study, different from other
  members of Kritosaurini.
diet: herbivore
