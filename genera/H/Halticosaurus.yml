genus: Halticosaurus
parent: Neotheropoda
placement: incertae sedis
dispute:
  summary: >
    Halticosaurus longotarsus is a nomen dubium; only fragmentary femora
    remain referable after other material was reassigned to Liliensternus,
    Sellosaurus and the loricatan Apatosuchus (Rauhut and Hungerbuhler,
    2000).
  history:
    - date: "2026-06-30"
      note: >
        Placed at Neotheropoda incertae sedis; nomen dubium.
etymology: "Jumping lizard; from Greek altikos (good at jumping) and sauros (lizard)"
pronunciation:
  phonetic: HAL-tick-oh-SORE-us
description: Halticosaurus is a dubious genus of theropod dinosaur from the late
  Triassic period (middle Norian stage, around 215.6-208 million years ago). It
  is known from a single fragmentary fossil specimen of the species H.
  longotarsus, found in the Middle Stubensandstein formation of what is
  present-day Germany The only known specimen was poorly preserved and may have
  been put together from bones of unrelated animals. Further research would be
  required to determine which of the bones belonged together, and what kind of
  theropod Halticosaurus was. However, most of the bones have been lost. For
  these reasons, Halticosaurus is considered to be a nomen dubium.
diet: carnivore
locomotion: bipedal
