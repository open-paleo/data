genus: Huadanosaurus
parent: Coelurosauria
etymology: From Chinese 'huadan' (the birthday of a great person or institution),
  commemorating several Chinese scientific anniversaries, and Greek 'sauros'
  (lizard).
pronunciation:
  phonetic: hwah-dan-o-sor-us
description: Huadanosaurus is an extinct genus of compsognathid-like
  coelurosaur from the Lower Cretaceous (Barremian) Dawangzhangzi bed of the
  Yixian Formation, Liaoning Province, China. The single species, Huadanosaurus
  sinensis, is known from an almost complete juvenile skeleton (IVPP V 14202)
  recovered from lacustrine deposits of the Jehol Biota; specimens of this
  species had previously been assigned to Sinosauropteryx prima before Qiu et
  al. (2025) erected the new genus. The holotype preserves stomach contents
  consisting of a eutriconodont mammal and a eutherian mammal, indicating
  active predation on small mammals.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
diagnostic_features:
  - Large oval concavity between the anterior margin of the antorbital fossa and
    the maxilla.
  - Large lacrimal recess on the lacrimal.
  - U-shaped bifurcation at the posteroventral margin of the dentary.
  - Fan-shaped neural spine on the axis.
  - Coracoid strongly elongated lateromedially with an extended posteroventral
    process.
  - Obturator process exceeding 70% of the total length of the ischial shaft.
appearance:
  integument: feathered
  evidence: direct
