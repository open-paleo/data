genus: Haolong
parent: Hadrosauroidea
etymology: From Chinese hao (spiny) and long (dragon); meaning 'spiny dragon', referring to its integumentary structures
pronunciation:
  phonetic: HOW-long
description: Haolong is an extinct genus of hadrosauroid ornithopod dinosaur
  known from the Early Cretaceous (Barremian age) Yixian Formation of Liaoning,
  China. The genus contains a single species, Haolong dongi, known from a nearly
  complete, articulated skeleton with preserved integumentary structures.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - lacustrine
  - forested
diagnostic_features:
  - Internarial septum of premaxilla almost as long as external naris
    (autapomorphy)
  - Presence of an additional antorbital foramen between the maxilla and the
    lacrimal (autapomorphy)
  - Subtriangular postorbital in lateral view, with proportionally short jugal
    and squamosal processes (autapomorphy)
  - Short and triangular pubic peduncle of ilium (autapomorphy)
  - Caudolateral process of premaxilla does not extend up to the lacrimal
  - Acromial process of scapula prominent and extending dorsally, forming an
    approximately 90-degree angle with the scapular blade
appearance:
  integument: scaled
  evidence: inferred
