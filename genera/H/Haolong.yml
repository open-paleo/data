genus: Haolong
parent: Hadrosauroidea
description: Haolong is an extinct genus of hadrosauroid ornithopod dinosaur
  known from the Early Cretaceous (Barremian age) Yixian Formation of Liaoning,
  China. The genus contains a single species, Haolong dongi, known from a nearly
  complete, articulated skeleton with preserved integumentary structures.
