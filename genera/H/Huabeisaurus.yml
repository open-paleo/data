genus: Huabeisaurus
parent: Euhelopodidae
etymology: "Named for North China (Huabei, meaning 'north China' in Chinese)
  combined with Greek 'sauros' meaning 'lizard', hence 'North China lizard'."
pronunciation:
  phonetic: hwah-bay-SAWR-us
  ipa: /ˌhwɑːbeɪˈsɔːrəs/
description: Huabeisaurus was a genus of sauropod dinosaur from the Late
  Cretaceous (Cenomanian to Maastrichtian stages, around 99.7–70.6 million years
  ago) of what is present-day northern China. The type species, Huabeisaurus
  allocotus, was first described by Pang Qiqing and Cheng Zhengwu in 2000. It is
  known from numerous remains found in the 1990s, which include teeth, partial
  limbs and vertebrae. Due to its relative completeness, Huabeisaurus represents
  a significant taxon for understanding sauropod evolution in Asia. Huabeisaurus
  comes from Kangdailiang and Houyu, Zhaojiagou Town, Tianzhen County, Shanxi
  province, China. The holotype was found in the unnamed upper member of the
  Huiquanpu Formation, which is Late Cretaceous (?Cenomanian–?Campanian) in age
  based on ostracods, charophytes, and fission-track dating.
diet: herbivore
locomotion: quadrupedal
