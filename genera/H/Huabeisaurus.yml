genus: Huabeisaurus
parent: Somphospondyli
dispute:
  summary: >
    Huabeisaurus has been recovered as a euhelopodid (D'Emic, 2012) but most
    recent analyses place it among the basalmost titanosaurs (Han et al.,
    2024; Jones, 2026).
  history:
    - date: "2026-06-30"
      note: >
        Placed conservatively at Somphospondyli given the unresolved
        euhelopodid versus basal titanosaur debate; finer placement remains
        unresolved.
etymology: "Named for North China (Huabei, meaning 'north China' in Chinese)
  combined with Greek 'sauros' meaning 'lizard', hence 'North China lizard'."
pronunciation:
  phonetic: hwah-bay-SAWR-us
  ipa: /ˌhwɑːbeɪˈsɔːrəs/
description: Huabeisaurus was a genus of sauropod dinosaur from the Late
  Cretaceous (Cenomanian to Maastrichtian stages, around 99.7-70.6 million years
  ago) of what is present-day northern China. The type species, Huabeisaurus
  allocotus, was first described by Pang Qiqing and Cheng Zhengwu in 2000. It is
  known from numerous remains found in the 1990s, which include teeth, partial
  limbs and vertebrae. Due to its relative completeness, Huabeisaurus represents
  a significant taxon for understanding sauropod evolution in Asia. Huabeisaurus
  comes from Kangdailiang and Houyu, Zhaojiagou Town, Tianzhen County, Shanxi
  province, China. The holotype was found in the unnamed upper member of the
  Huiquanpu Formation, which is Late Cretaceous (?Cenomanian-?Campanian) in age
  based on ostracods, charophytes, and fission-track dating.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Teeth strong and peg-like with tooth crown to tooth root length ratio of 3
    to 1; upper part of crown slightly flat with short ridges on anterior and
    posterior margins
  - Cervical vertebrae opisthocoelous with wide-flat ventral flute, wide and
    deep pleurocoels, and clearly bifurcated neural spines
  - Dorsal vertebrae opisthocoelous with deep, regularly oval-shaped
    pleurocoels; neural spines high and unbifurcated
  - Caudal vertebrae clearly amphicoelous; neural arches situated on anterior
    part of centrum; spines unbifurcated; chevrons Y-shaped and unbifurcated
    distally
  - Ilium very large and long fan-shaped with pubic peduncle situated slightly
    anterior of middle of ilium lower edge and ischic peduncle undeveloped
  - Femur straight, long, narrow, and flat with oblate femur head; fourth
    trochanter dilated on posterior inner lateral edge slightly above shaft
    midpoint; humerus-to-femur length ratio 0.78 to 1
