genus: Hypnovenator
parent: Troodontinae
etymology: Sleep hunter; from Greek hypnos (sleep) and Latin venator (hunter), possibly referring to its nocturnal hunting behavior
description: Hypnovenator is an extinct genus of troodontid theropod dinosaurs
  from the Early Cretaceous (Albian) Ohyamashimo Formation of Japan. The genus
  contains a single species, Hypnovenator matsubaraetoheorum, known from a
  partial skeleton. Hypnovenator is the only troodontid currently known from
  Japan, and it represents the oldest definitive member of the subgroup
  Troodontinae.
diet: carnivore
locomotion: bipedal
