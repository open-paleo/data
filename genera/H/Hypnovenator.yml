genus: Hypnovenator
parent: Troodontinae
etymology: Sleep hunter; from Greek hypnos (sleep) and Latin venator (hunter), possibly referring to its nocturnal hunting behavior
pronunciation:
  phonetic: HIP-no-VEN-uh-tuh
description: Hypnovenator is an extinct genus of troodontid theropod dinosaurs
  from the Early Cretaceous (Albian) Ohyamashimo Formation of Japan. The genus
  contains a single species, Hypnovenator matsubaraetoheorum, known from a
  partial skeleton. Hypnovenator is the only troodontid currently known from
  Japan, and it represents the oldest definitive member of the subgroup
  Troodontinae.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Pair of proximodistally extended depressions on proximodorsal surface of
    manual phalanx I-1
  - Long dorsal and ventral proximal lips on manual phalanx III-2 for tight
    articulation with phalanx III-1
  - Proximodistally longitudinal medial ridge on anterior surface of femur
    proximal to medial condyle
  - Distorted distal condyles with widely convex distoventral margin on pedal
    phalanx III-3
  - Thickest portion of ulna distal end near middle portion (unique combination
    feature)
  - Angle less than 11 degrees between anterior edge of cnemial crest and
    anterior edge of tibial shaft
appearance:
  integument: feathered
  evidence: inferred
