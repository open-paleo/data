genus: Hesperosaurus
parent: Stegosaurinae
etymology: Western lizard; from Ancient Greek hésperos (western) and saûros (lizard)
description: Hesperosaurus is a herbivorous stegosaurian dinosaur from the
  Kimmeridgian age of the Jurassic period, approximately 156 million years ago.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Frontoparietal domed, flat in all other stegosaurs
  - Cervical plates low and oval versus tall triangular in Stegosaurus
  - Neural spines of posterior dorsals very tall with teardrop-shaped top in
    anterior view
  - Caudal neural spines with uniquely teardrop-shaped apex, intermediate
    between unexpanded and expanded conditions in other stegosaurs
  - Ilia strongly divergent anteriorly unlike straight condition in Stegosaurus
  - Distal end of pubis expanded as in Huayangosaurus, nonexpanding in
    Stegosaurus
appearance:
  features:
    - dermal plates
    - tail spikes
  integument: armored
  evidence: direct
identifiers:
  - source: pbdb
    id: "68158"
  - source: wikidata
    id: Q134389
  - source: gbif
    id: "4823188"
