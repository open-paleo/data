genus: Hypsilophodon
parent: Hypsilophodontidae
etymology: "From Greek 'hypsilophos' meaning 'high-crested' and 'odon' meaning 'tooth', hence 'high-crested tooth', referring to its distinctive tooth morphology."
pronunciation:
  phonetic: hip-si-LOF-o-don
  ipa: /ˌhɪpsɪˈlɒfoʊdɒn/
description: Hypsilophodon is a neornithischian dinosaur genus from the Early
  Cretaceous period of England. It has traditionally been considered an early
  member of the group Ornithopoda, but recent research has put this into
  question.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Premaxillary bones nearly entire and distinctly preserved (unique among
    Dinosauria at time)
  - Incisor teeth in premaxilla distinctly different in shape from maxillary
    teeth, anterior premaxilla beak-like and edentulous
  - Maxillary teeth lack serrations characteristic of Iguanodon, instead showing
    enamel ridges with sinuated free edge
  - Metatarsus indicates four well-developed toes, unlike Iguanodon
  - "Tibia and fibula proportions different from Iguanodon: fibula 5+ inches
    with leg longer than femur"
appearance:
  features:
    - keratinous beak
  integument: armored
  evidence: direct
