genus: Hypacrosaurus
parent: Lambeosaurinae
pronunciation:
  phonetic: hi-PAK-ro-SAWR-us
etymology: Near the highest lizard; from Ancient Greek hypo- (less or under) and
  akros (high or topmost), combined with sauros (lizard), because it was almost
  but not quite as large as Tyrannosaurus
description: Hypacrosaurus is an extinct genus of duckbill dinosaur similar in
  appearance to Corythosaurus. Like Corythosaurus, it had a tall, hollow rounded
  crest, although not as large and straight. It is known from the remains of two
  species that spanned 75.0 to 69.5 million years ago, in the Late Cretaceous of
  Alberta, Canada, and Montana, United States, and is the latest hollow-crested
  duckbill known from good remains in North America. It was an obscure genus
  until the discovery in the 1990s of nests, eggs, and hatchlings belonging to
  H. stebingeri.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
  - coastal
appearance:
  features:
    - hollow cranial crest
    - dorsal sail
  integument: scaled
  evidence: inferred
diagnostic_features:
  - Dorsal neural spines extremely high and massive, five to seven times the
    height of their centra
  - Radius substantially longer than the humerus
  - Metatarsals greatly elongated
  - Ischium with a large, foot-like terminal expansion on a very massive shaft
  - Dorsal vertebrae with a large perforation through the thin plate descending
    from the posterior zygapophyses to the neural canal
