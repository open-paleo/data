genus: Hypselosaurus
parent: Titanosauria
pronunciation:
  phonetic: HIP-sel-o-SAWR-us
etymology: From Greek hypsilos (high, lofty) and sauros (lizard); meaning 'highest lizard'
dispute:
  summary: >
    Hypselosaurus priscus is based on non-diagnostic titanosaur material
    from the Late Cretaceous of Provence and is listed among sauropod
    nomina dubia (Weishampel and colleagues, 2004); its holotype cannot be
    reliably distinguished from other sauropods, and eggs long referred
    to it likely pertain to more than one taxon.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "38689"
  - source: wikidata
    id: Q133062
  - source: gbif
    id: "4822759"
species:
  - name: Hypselosaurus priscus
    etymology: "From Latin 'priscus' meaning 'ancient' or 'of former times', likely
      referring to the antiquity of the taxon."
    pronunciation:
      phonetic: PRIS-kus
    status: nomen dubium
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Campanian
        - Maastrichtian
    location:
      country: FR
      locality: Rognac
      region: FR-13
      notes: >-
        Matheron (1869) places the holotype in the basal detrital layers of his
        Rognac stage, beneath its upper limestones. Tortosa and colleagues
        (2014) date the upper part of the Lower Rognacian to the late
        Campanian, and Le Loeuff (1993) gives the species as early Maastrichtian
        in the Aix-en-Provence Basin.
    type_specimen:
      specimen_type: holotype
      status: uncataloged
      institution: MNHN
      material: Partial hindlimb and caudal vertebrae.
      completeness: fragmentary
    size:
      length_m:
        min: 12.0
        max: 12.0
      weight_kg:
        min: 7300
        max: 14500
    erected_in: matheron1869b
references:
  - id: tortosa2014a
    notes: Dates the "upper part of the Lower Rognacian" to the late Campanian,
      after Cojan and Moreau (2006).
  - id: matheron1869b
  - id: matheron1869a
    notes: The companion memoir, which erects the genus in near-identical terms.
      Opinion 1483 finds it was still in press when the Bulletin note appeared.
  - id: weishampel2004a
    notes: The Dinosauria (2nd ed.); lists Hypselosaurus priscus among sauropod
      nomina dubia.
  - id: leloeuff1993a
    notes: Revises the type material, giving Rognac as the locality and recording
      that the material has disappeared.
  - id: cojan2006a
    notes: Frames the Aix-en-Provence Basin's Rognacian units, none of which
      carries a Gres a Reptiles name.
