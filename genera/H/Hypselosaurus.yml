genus: Hypselosaurus
parent: Titanosauria
pronunciation:
  phonetic: HIP-sel-o-SAWR-us
etymology: From Greek hypsilos (high, lofty) and sauros (lizard); meaning 'highest lizard'
description: Hypselosaurus is a dubious genus of titanosaurian sauropod that
  lived in southern France during the Late Cretaceous, approximately 70 million
  years ago in the early Maastrichtian. Hypselosaurus was first described in
  1846, but was not formally named until 1869, when Phillip Matheron named it
  under the binomial Hypselosaurus priscus. The holotype specimen includes a
  partial hindlimb and a pair of caudal vertebrae, and two eggshell fragments
  were found alongside these bones. Because of the proximity of these eggshells
  to the fossil remains, many later authors, including Matheron and Paul
  Gervais, have assigned several eggs from the same region of France all to
  Hypselosaurus, although the variation and differences between these eggs
  suggest that they do not all belong to the same taxon. Hypselosaurus has been
  found in the same formation as the dromaeosaurids Variraptor and Pyroraptor,
  the ornithopod Rhabdodon, and the ankylosaurian Rhodanosaurus, as well as
  indeterminate bones from other groups.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Caudal vertebrae distinctly depressed vertically (not compressed laterally
    as in crocodiles) with oval articular faces 11 cm wide by 7 cm high
  - Absence of medullary canal in long bones, indicating aquatic rather than
    terrestrial habits
  - Vertebral body approximately 12 cm long, narrowing to 8 cm width at center,
    with small vertebral foramen occupying only half the length
  - Articular apophyses arrangement with cone-shaped process on one side and two
    divergent symmetrical apophyses on opposite side of caudal vertebrae
  - Large, robust long bones with dimensions suggesting total animal length of
    several meters
