genus: Horshamosaurus
parent: Ankylosauria
pronunciation:
  phonetic: HOR-shum-o-SAWR-us
etymology: From Horsham (the West Sussex market town where the
  Horsham Museum holds the holotype) and Greek 'sauros'
  (lizard); meaning 'Horsham lizard'.
description: >
  Horshamosaurus is a genus of herbivorous ankylosaurian
  dinosaur from the Barremian stage of the Early Cretaceous of
  what is now England. The type species is Horshamosaurus
  rudgwickensis.
dispute:
  summary: >
    Horshamosaurus is regarded as a nomen dubium (Raven et al., 2020). It is retained at Ankylosauria incertae sedis.
  history:
    - date: "2026-06-26"
      note: Placed at Ankylosauria incertae sedis, nomen dubium.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
appearance:
  integument: armored
identifiers:
  - source: wikidata
    id: Q21011926
synonyms:
  - name: Polacanthus rudgwickensis
    type: reassigned
    reason: Blows (1996) originally described this material as
      a second species of Polacanthus. Blows (2015) elevated it
      to its own genus, Horshamosaurus, with H. rudgwickensis
      as the type species (combinatio nova).
species:
  - name: Horshamosaurus rudgwickensis
    etymology: Named for the village of Rudgwick in West
      Sussex, where the holotype was excavated from the
      Rudgwick Brickworks marl quarry in 1985.
    status: nomen dubium
    type_species: true
    period:
      name:
        - Early Cretaceous
      stage:
        - Barremian
      from_ma: 129.4
      to_ma: 125
    location:
      country: GB
      region: Rudgwick, West Sussex, England
      formation: Weald Clay Group
    type_specimen:
      specimen_id:
        - HORSM 1988.1546
      specimen_type: holotype
      institution: HORSM
      material: Fragmentary postcranial skeleton including a
        nearly complete anterior dorsal vertebra, dorsal and
        caudal centra, proximal left scapula with fused
        coracoid fragment, distal left humerus, the element
        originally identified as a tibia (reinterpreted as an
        ischium by Raven et al. 2020), rib fragments, and
        osteoderms.
      completeness: fragmentary
    erected_in: blows2015a
references:
  - id: blows1996a
    notes: Original description of the type material under the name Polacanthus
      rudgwickensis, prior to the 2015 erection of Horshamosaurus.
  - id: blows2015a
    notes: Erects Horshamosaurus for "Polacanthus" rudgwickensis Blows 1996,
      proposing twelve diagnostic characters and placing the genus in
      Nodosauridae rather than Polacanthidae.
  - id: raven2020a
    notes: Systematically refutes each of Blows's (2015) twelve diagnostic
      characters, reinterprets the presumed tibia as an ischium, and treats H.
      rudgwickensis as a nomen dubium indeterminate nodosaurid.
