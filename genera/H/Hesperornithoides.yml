genus: Hesperornithoides
parent: Troodontidae
etymology: "From Greek 'Hesperis' meaning 'western', 'ornis' meaning 'bird', and '-eides' meaning 'form', hence 'western bird form'. The species name honors the Miessler family."
pronunciation:
  phonetic: HESS-per-OR-nee-THOY-deez
description: Hesperornithoides is a genus of troodontid theropod dinosaur that
  lived in North America during the Late Jurassic period.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Pneumatic jugal
  - Short posterior lacrimal process (<15% of ventral process length)
  - Quadrate forms part of lateral margin of paraquadrate foramen
  - Small external mandibular fenestra (<12% of mandibular length)
  - Humeral entepicondyle >15% of distal humeral width
  - Manual ungual III subequal in size to ungual II
  - Mediodistal corner of tibia exposed anteriorly
