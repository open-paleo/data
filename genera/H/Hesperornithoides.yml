genus: Hesperornithoides
parent: Troodontidae
placement: incertae sedis
dispute:
  summary: >
    Hesperornithoides, the oldest definitive troodontid, is recovered in a basal
    position by its describers (Hartman et al., 2019) — though within their tree it
    falls in a derived clade with Daliansaurus, Xixiasaurus, and Sinusonasus — and
    as the basalmost troodontid by Sellés et al. (2021). It is not assigned to a
    named subfamily and is placed at Troodontidae incertae sedis.
  history:
    - date: "2026-07-01"
      note: Placed at Troodontidae incertae sedis (least-inclusive uncontested clade); basal position not assignable to a subfamily.
etymology: "From Greek 'Hesperis' meaning 'western', 'ornis' meaning 'bird', and '-eides' meaning 'form', hence 'western bird form'. The species name honors the Miessler family."
pronunciation:
  phonetic: HESS-per-OR-nee-THOY-deez
description: Hesperornithoides is a genus of troodontid theropod dinosaur that
  lived in North America during the Late Jurassic period.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Pneumatic jugal
  - Short posterior lacrimal process (<15% of ventral process length)
  - Quadrate forms part of lateral margin of paraquadrate foramen
  - Small external mandibular fenestra (<12% of mandibular length)
  - Humeral entepicondyle >15% of distal humeral width
  - Manual ungual III subequal in size to ungual II
  - Mediodistal corner of tibia exposed anteriorly
appearance:
  features:
    - sickle claw
  integument: feathered
  evidence: direct
