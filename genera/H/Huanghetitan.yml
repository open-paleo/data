genus: Huanghetitan
parent: Somphospondyli
dispute:
  summary: >
    Phylogenetic analyses place the type species Huanghetitan liujiaxiaensis
    among the most derived non-titanosaurian somphospondylans (D'Emic, 2012;
    Mayer et al., 2026; Jones, 2026), although it has also been recovered as a
    basal titanosaur (Mannion et al., 2019). The referred species "H."
    ruyangensis is widely regarded as generically distinct.
  history:
    - date: "2026-06-30"
      note: >
        Placed at Somphospondyli following the majority of recent analyses;
        the basal titanosaur alternative is noted.
etymology: "Named for the Yellow River (Huanghe in Chinese) combined with
  'titan' (giant), hence 'Yellow River titan'."
pronunciation:
  phonetic: HWANG-he-TIE-tuhn
description: Huanghetitan is a genus of sauropod dinosaur from the early
  Cretaceous Period. It was a basal titanosauriform which lived in what is now
  Gansu, China.
diet: herbivore
locomotion: quadrupedal
diagnostic_features:
  - Dorsal vertebrae neural spines extremely low (lower than centrum height)
    with transversely expanded apices (wider than neural spine height)
  - Sacral neural spine length less than corresponding centrum length
  - Four fused neural spines totaling ~60 cm with uniform heights (~8 cm) but
    progressively narrowing expanded apices (20 cm to 8 cm)
  - Scapular acromion extremely expanded dorsoventrally (83 cm tall), exceeding
    scapular blade length (70 cm)
  - Longitudinal groove on ventral surface of anterior and middle caudal
    vertebrae
paleoenvironment:
  - lacustrine
appearance:
  integument: scaled
  evidence: inferred
