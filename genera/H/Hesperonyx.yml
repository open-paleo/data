genus: Hesperonyx
parent: Dryomorpha
pronunciation:
  phonetic: hes-PERR-ON-iks
etymology: Western claw; from Greek hesperos (western) and onyx (claw)
description: Hesperonyx is an extinct genus of dryomorphan ornithopod dinosaur
  from the Late Jurassic Lourinhã Formation of Portugal. The genus contains a
  single species, Hesperonyx martinhotomasorum, known from bones of the fore-
  and hindlimbs.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Cnemial crest of tibia laterally oriented
  - Inner condyle of tibia forms 90° angle with cranio/caudal axis of proximal
    tibia
  - Fibula and tibia articulation tightly interlocked
  - Fibula has protruding process overhanging fibular condyle cranially
  - Distal fibular shaft develops high crest and marked twist
  - Reduced metatarsal I
  - Claw-like pedal ungual phalanges
appearance:
  integument: scaled
  evidence: inferred
