genus: Hesperonyx
parent: Dryomorpha
pronunciation:
  phonetic: hes-PERR-ON-iks
etymology: Western claw; from Greek hesperos (western) and onyx (claw)
description: Hesperonyx is an extinct genus of dryomorphan ornithopod dinosaur
  from the Late Jurassic Lourinhã Formation of Portugal. The genus contains a
  single species, Hesperonyx martinhotomasorum, known from bones of the fore-
  and hindlimbs.
dispute:
  summary: >
    Hesperonyx martinhotomasorum is of uncertain position within Dryomorpha.
    Rotatori and colleagues (2023), describing the genus, recovered it among
    the non-dryosaurid dryomorphans under parsimony and at the base of
    Dryosauridae in a time-calibrated Bayesian analysis, which they attributed
    probably to long-branch attraction, and concluded it is a dryomorphan of
    uncertain affinities. Later analyses remain split: Bertozzo and colleagues
    (2025a) recovered it within Dryosauridae under implied weighting, and Huang
    and colleagues (2026) paired it with Draconyx in a clade they labeled
    Dryosauridae, while Bertozzo and colleagues (2025b) placed it outside
    Dryosauridae as the sister of the ankylopollexian clade. No author argues
    for either position; the disagreement is between analyses, not between
    published interpretations. It is placed at Dryomorpha.
  history:
    - date: "2026-06-29"
      note: Placed at Dryosauridae following the prevailing view; the
        basal-dryomorphan alternative reflected.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Cnemial crest of tibia laterally oriented
  - Inner condyle of tibia forms 90° angle with cranio/caudal axis of proximal
    tibia
  - Fibula and tibia articulation tightly interlocked
  - Fibula has protruding process overhanging fibular condyle cranially
  - Distal fibular shaft develops high crest and marked twist
  - Reduced metatarsal I
  - Claw-like pedal ungual phalanges
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "492472"
  - source: wikidata
    id: Q124975016
species:
  - name: Hesperonyx martinhotomasorum
    etymology: "Named for Micael Martinho and Carla Alexandra Tomás, honoring their efforts in fossil curation and preparation at the Museu da Lourinhã."
    status: valid
    type_species: true
    period:
      name:
        - Late Jurassic
      stage:
        - Kimmeridgian
    location:
      country: PT
      locality: Praia de Porto Dinheiro
      region: PT-11
      formation: Lourinhã
      member: Praia da Amoreira-Porto Novo
    size:
      length_m:
        min: 3.0
        max: 4.0
    type_specimen:
      specimen_id: [ML 2700]
      specimen_type: holotype
      institution: ML
      material: Isolated carpal elements including ungual phalanx, left ulnare and left
        metacarpal fragment; partial left hind limb including tibia, fibula, complete
        metatarsals I-II, partial metatarsal III, proximal metatarsal IV, five
        phalanges, three pedal unguals.
      completeness: partial
    erected_in: rotatori2023a
references:
  - id: rotatori2023a
    notes: Erected Hesperonyx; its Bayesian analysis recovers it at the base of
      Dryosauridae and its parsimony analyses among non-dryosaurid dryomorphans.
  - id: jones2026a
    notes: Treats Hesperonyx as an early iguanodontian, likely a dryosaurid.
  - id: bertozzo2025a
    notes: Its implied-weighting analysis recovers Hesperonyx within
      Dryosauridae; its equal-weighting analysis leaves it unresolved within
      Iguanodontia.
  - id: bertozzo2025b
    notes: Recovers Hesperonyx outside Dryosauridae as the sister of a clade of
      Camptosaurus, Draconyx and Iguanodon.
  - id: huang2026a
    notes: Recovers Hesperonyx as the sister of Draconyx in a clade labeled
      Dryosauridae.
