genus: Heishansaurus
parent: Ankylosauria
placement: incertae sedis
pronunciation:
  phonetic: hay-SHAHN-SAWR-us
etymology: Named after Heishan (Black Mountains) in Gansu Province, China,
  combined with Greek sauros (lizard); meaning 'Heishan lizard'
description: Heishansaurus, meaning "Heishan lizard" after the area in China
  where it was discovered, is the name given to a dubious genus of herbivorous
  ornithischian dinosaur, probably belonging to the Ankylosauridae.
dispute:
  summary: >
    Heishansaurus is a nomen dubium; its holotype is lost and the material was undiagnostic (Arbour and Currie, 2015). It is retained at Ankylosauria incertae sedis.
  history:
    - date: "2026-06-26"
      note: Placed at Ankylosauria incertae sedis, nomen dubium with lost holotype.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
appearance:
  integument: armored
  evidence: direct
identifiers:
  - source: pbdb
    id: "65700"
  - source: wikidata
    id: Q871874
  - source: gbif
    id: "4823322"
species:
  - name: Heishansaurus pachycephalus
    etymology: "From Ancient Greek 'pachys' meaning 'thick' and 'kephale' meaning
      'head', meaning 'thick-headed', inspired by Bohlin's identification of the
      taxon as a pachycephalosaur."
    status: nomen dubium
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Campanian
        - Maastrichtian
    location:
      country: CN
      locality: Chia-yü-kuan
      region: CN-GS
      notes: Bohlin (1953) places the holotype northwest of Chia-yu-kuan and
        names no unit for it. Weishampel and colleagues (2004) give the
        Minhe Formation on a personal communication, where Dong (2002)
        assigns the same locality to the Xinminpu Group.
    type_specimen:
      specimen_type: holotype
      status: lost
      material: Remains of skull, skeleton, and dermal armor of one individual (Bohlin's
        field designation "Field nr 60"); original material now lost. A cast of one
        vertebra survives at the AMNH.
    erected_in: bohlin1953a
references:
  - id: bohlin1953a
  - id: arbour2015a
    notes: Assessed Heishansaurus as an undiagnosable nomen dubium.
  - id: weishampel2004a
  - id: dong2002a
