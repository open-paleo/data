genus: Heishansaurus
parent: Ankylosauria
etymology: Named after Heishan (Black Mountains) in Gansu Province, China,
  combined with Greek sauros (lizard); meaning 'Heishan lizard'
description: Heishansaurus, meaning "Heishan lizard" after the area in China
  where it was discovered, is the name given to a dubious genus of herbivorous
  ornithischian dinosaur, probably belonging to the Ankylosauridae.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Skull roof of enormous thickness exceeding 8 cm, with well-developed
    parieto-squamosal shelf at a level considerably lower than the highest point
    of the skull roof and extraordinarily narrow upper temporal vacuities
  - Teeth with a small apical denticle, four or five equal-sized lateral
    denticles, a cingulum surrounding the crown base (thicker on inner side of
    upper teeth), and roots bearing an annular swelling near the tip with marked
    longitudinal ridges below the crown
  - Well-developed dermal armor including flat circular/tetragonal plates (up
    to ~1 dm diameter), innumerable very small bony nodules, true dermal spines
    with small basal surfaces, and a uniquely boat-like elongate keeled plate
    deeply concave on the internal side
  - Vertebral centra more or less amphicoelous; dorsal centra with a pronounced
    keel below and marked antler-burr-like exostoses anteriorly and posteriorly;
    anterior caudal vertebrae with very long transverse processes
  - Skull surface bones strongly rugose on all external surfaces; skull base
    very broad and thick with basioccipital and basisphenoid apparently
    completely fused
