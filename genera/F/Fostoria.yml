references:
  - id: bell2019a
  - id: paul2024a
    notes: Source of the body length and mass estimates.
  - id: jones2026a
    notes: Source of the hip height estimate, and the appearance features.
  - id: madzia2021a
    notes: Ornithischian phylogenetic nomenclature paper placing Fostoria within Rhabdodontomorpha.
  - id: fonseca2024a
    notes: Recovered Fostoria within Elasmaria alongside Muttaburrasaurus,
      interpreting their rhabdodontomorph similarities as convergence.
  - id: czepiński2025a
    notes: Recovered Fostoria outside Rhabdodontomorpha, within the elasmarian
      lineage.
