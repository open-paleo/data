genus: Fostoria
parent: Elasmaria
etymology: "Named for Robert Foster, the miner who discovered the bone bed at the Sheepyard opal field."
pronunciation:
  phonetic: foss-TOR-ee-uh
description: Fostoria is a genus of iguanodontian ornithopod dinosaur from the
  Griman Creek Formation of New South Wales, Australia. The type and only
  species, Fostoria dhimbangunmal was described in 2019.
dispute:
  summary: >
    Fostoria dhimbangunmal was placed within Rhabdodontomorpha by Madzia
    and others (2021), but the two most recent dedicated analyses —
    Fonseca and others (2024) and Czepiński and Madzia (2025) — recover
    it within Elasmaria alongside Muttaburrasaurus, treating its
    rhabdodontomorph resemblances as convergence; its fragmentary
    material limits confidence.
  history:
    - date: "2026-06-29"
      note: Placed at Rhabdodontomorpha following the then-prevailing
        view; the outside-Rhabdodontomorpha result of Czepiński and
        Madzia (2025) reflected, not adopted.
    - date: "2026-07-09"
      note: Re-evaluated and moved to Elasmaria, following the two most
        recent dedicated analyses (Fonseca and others 2024; Czepiński
        and Madzia 2025), which recover Fostoria and Muttaburrasaurus
        together within Elasmaria; the older within-Rhabdodontomorpha
        result is superseded.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Dorsal profile of combined frontals forming a stepped triangle, the base of
    the triangle corresponding to the frontal-parietal suture.
  - Short, dorsally directed protuberance on anterolateral corner of frontal at
    posterior edge of prefrontal contact.
  - Large foramen on ventromedial surface of quadratojugal wing of quadrate
    bordered medially by strong ridge.
  - Humerus with medial ridge extending entire preserved length of the element.
  - Humerus with ridge extending mediodistally from distal edge of deltopectoral
    crest onto anterior surface of humerus.
  - Anterior dorsal vertebra procoelous.
appearance:
  features:
    - keratinous beak
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "398669"
  - source: wikidata
    id: Q64392298
