  - name: Fostoria dhimbangunmal
    etymology: "From 'dhimbangunmal' meaning 'sheep yard' in the Yuwaalaraay, Yuwaalayaay, and Gamilaraay languages of Australia."
    status: valid
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Cenomanian
    location:
      country: AU
      locality: Sheepyard opal field
      region: AU-NSW
      formation: Griman Creek
      member: Wallangulla Sandstone
      part: upper
    size:
      length_m:
        min: 4.5
        max: 4.5
      weight_kg:
        min: 500
        max: 500
      hip_height_m:
        min: 1.4
        max: 1.4
    erected_in: bell2019a
    type_specimen:
