genus: Fona
parent: Thescelosaurinae
pronunciation:
  phonetic: foht-NAH
  ipa: /ˈfoʊtnɑː/
etymology: "From a word meaning 'the origin' in the language of the Ute people, whose ancestral territory includes Utah where the fossil was found; means 'the origin'"
description: Fona is an extinct genus of thescelosaurine thescelosaurid
  ornithischian dinosaurs from the 'mid'-Cretaceous Cedar Mountain Formation
  (Mussentuchit Member) of Utah, United States. The genus contains a single
  species, F. herzogae, known from several partial skeletons and skulls. Based
  on anatomical similarities to the closely related and similarly aged
  Oryctodromeus, Fona was likely a semi-fossorial animal, likely spending a
  significant amount of time in underground burrows. It also represents the
  oldest known definitive thescelosaurine.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Rostral maxillary fossa located caudal to the first tooth position
  - Otoccipital bears a dorsoventrally elongate fossa on the medial surface of
    the occipital condyle located directly caudal to the medial opening of CN
    XII
  - Rostrocaudally oriented ventral canal on the prootic
  - Dorsal margin of the axis neural spine is parallel with the dorsal suture of
    the centrum, forming an angle of essentially 0
  - Ischial shaft has bulbous thickening along the dorsal margin directly distal
    to the obturator process
