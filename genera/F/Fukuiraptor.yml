genus: Fukuiraptor
parent: Megaraptora
placement: incertae sedis
dispute:
  summary: >
    Fukuiraptor kitadaniensis is a megaraptoran theropod, originally placed within
    the allosauroid family Neovenatoridae (Benson et al., 2009; Carrano et al.,
    2012) but recovered by most recent analyses within Megaraptora, near
    Tyrannosauroidea rather than among carcharodontosaurians. It is placed at
    Megaraptora incertae sedis.
  history:
    - date: "2026-07-01"
      note: Moved from the deprecated Neovenatoridae to Megaraptora incertae sedis (a megaraptoran, not a carcharodontosaurian); the higher position of Megaraptora is handled within Coelurosauria.
pronunciation:
  phonetic: foo-KOO-ee-RAP-tor
etymology: "From Fukui (Fukui Prefecture, Japan, where it was found) + Latin raptor (thief/robber): 'thief of Fukui'."
description: Fukuiraptor is a genus of medium-sized megaraptoran theropod
  dinosaur of the Early Cretaceous epoch (either Barremian or Aptian) that lived
  in what is now Japan. Fukuiraptor is known from the Kitadani Formation and
  possibly also the Sebayashi Formation. Fukuiraptor may have been one of the
  basalmost members of Megaraptora, or a sister taxon to Australovenator.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Fused interdental plates in both maxilla and dentary (convergent with
    dromaeosaurids)
  - Narrow, mediolaterally compressed dentary
  - Narrow bladelike teeth with oblique blood grooves (convergent with
    tyrannosaurids)
  - Ulna-to-humerus ratio of 0.92, significantly higher than all other
    carnosaurs except Xuanhanosaurus
  - Relatively larger hands with better-developed unguals than Allosaurus
  - Pubic peduncle lateromedially wider than anteroposteriorly long; ascending
    process of astragalus taller than in all other known carnosaurs
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "66356"
  - source: wikidata
    id: Q132536
  - source: gbif
    id: "4819280"
  - source: eol
    id: "4434265"
synonyms:
  - name: Kitadanisaurus
    type: nomen nudum
    reason: Informal name used for material now considered referable to Fukuiraptor.
  - name: Katsuyamasaurus
    type: nomen nudum
    reason: Informal name; never met ICZN requirements for formal publication and is treated as referable to Fukuiraptor. Per Olshevsky's Dinosaur Genera List.
species:
  - name: Fukuiraptor kitadaniensis
    etymology: "Named for the Kitadani Formation, the geological unit in Fukui Prefecture, Japan, where the holotype was discovered."
    status: valid
    type_species: true
    period:
      name:
        - Early Cretaceous
      stage:
        - Hauterivian
        - Barremian
        - Aptian
    location:
      country: JP
      locality: Kitadani Dinosaur Quarry
      region: JP-18
      formation: Kitadani
      coordinates:
        - 36.121639
        - 136.544833
      notes: The holotype came from Bonebed I, lowest of the four informally
        numbered levels Shibata and Azuma (2015) recognize at the quarry.
        The coordinate is the quarry's, given to the second by Azuma and
        colleagues (2016); earlier papers state it only to the minute.
    type_specimen:
      specimen_id: [FPMN 97122]
      specimen_type: holotype
      institution: FPDM
      material: Associated skeleton including skull fragments, vertebrae, both humeri,
        right ulna, manual phalanges and unguals, ilium fragments, pubis, ischia,
        right femur, partial tibia and fibula, right astragalus, metatarsals I-III,
        and pedal phalanges; estimated 4.2 m long individual
      completeness: partial
    size:
      hip_height_m:
        min: 1.2
        max: 1.2
      length_m:
        min: 4.2
        max: 4.2
      weight_kg:
        min: 175
        max: 590
    erected_in: azuma2000a
references:
