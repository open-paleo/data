genus: Fukuititan
parent: Titanosauriformes
etymology: giant from Fukui prefecture
description: Fukuititan is a genus of sauropod dinosaur that lived during the
  Early Cretaceous (either Barremian or Aptian age) in the Kitadani Formation in
  what is now Japan. The genus contains a single species, Fukuititan
  nipponensis. The discovery of Fukuititan shed light on Japanese
  titanosauriforms, which are generally very poorly-known.
diet: herbivore
locomotion: quadrupedal
