genus: Fukuititan
parent: Titanosauriformes
etymology: "From Fukui (Fukui Prefecture, Japan, where it was found) + Greek titan (giant): 'giant from Fukui prefecture'."
pronunciation:
  phonetic: foo-KOO-ee-TIE-tuhn
description: Fukuititan is a genus of sauropod dinosaur that lived during the
  Early Cretaceous (either Barremian or Aptian age) in the Kitadani Formation in
  what is now Japan. The genus contains a single species, Fukuititan
  nipponensis. The discovery of Fukuititan shed light on Japanese
  titanosauriforms, which are generally very poorly-known.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Elongated asymmetric tooth crown with a weak or absent labial groove and
    without lingual concavity
  - Epipophysis of the cervical vertebra well-developed and stalk-like
  - Transverse width of the proximal end of the humerus approximately 32% of
    humerus length
  - Metacarpal length approximately 48% of radius length
  - Distal end of the ischia slightly expanded
appearance:
  features:
    - elongate neck
  integument: scaled
  evidence: inferred
