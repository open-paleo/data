genus: Fruitadens
parent: Heterodontosaurinae
etymology: Fruita teeth
description: Fruitadens is a genus of heterodontosaurid dinosaur. The name means
  "Fruita teeth", in reference to Fruita, Colorado (USA), where its fossils were
  first found. It is known from partial skulls and skeletons from at least four
  individuals of differing biological ages, found in Tithonian (Late Jurassic)
  rocks of the Morrison Formation in Colorado. Fruitadens is one of the smallest
  known ornithischian dinosaur, with young adults estimated at 65 to 75 cm (26
  to 30 in) in length and 0.5 to 0.75 kg (1.1 to 1.7 lb) in weight. It is
  interpreted as an omnivore and represents one of the latest-surviving
  heterodontosaurids.
diet: herbivore
locomotion: bipedal
