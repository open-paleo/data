genus: Fruitadens
parent: Heterodontosaurinae
etymology: "From Fruita (the city of Fruita, Colorado, USA, where fossils were found) + Latin dens (tooth): 'Fruita teeth'."
pronunciation:
  phonetic: FRU-tah-denz
description: Fruitadens is a genus of heterodontosaurid dinosaur. The name means
  "Fruita teeth", in reference to Fruita, Colorado (USA), where its fossils were
  first found. It is known from partial skulls and skeletons from at least four
  individuals of differing biological ages, found in Tithonian (Late Jurassic)
  rocks of the Morrison Formation in Colorado. Fruitadens is one of the smallest
  known ornithischian dinosaur, with young adults estimated at 65 to 75 cm (26
  to 30 in) in length and 0.5 to 0.75 kg (1.1 to 1.7 lb) in weight. It is
  interpreted as an omnivore and represents one of the latest-surviving
  heterodontosaurids.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Premaxillary crowns small and subequal in size, expanded labiolingually and
    mesiodistally above the root (autapomorphic within Heterodontosauridae).
  - Denticles extend over half of the maxillary/dentary crowns, not restricted
    to apical third (autapomorphic within Heterodontosauridae).
  - Dentary caniniform present but apicobasal height does not exceed that of the
    largest dentary cheek tooth crown (autapomorphic within Ornithischia).
  - Small, unserrated, peg-like and procumbent tooth present anterior to the
    dentary caniniform (autapomorphic within Ornithischia).
  - Distal end of tibia with anteromedial flange (autapomorphic within
    Ornithischia).
  - Apex of ascending process of astragalus formed by a separate ossification;
    two large foramina pierce anterior surface of ascending process
    (autapomorphic within Ornithischia).
