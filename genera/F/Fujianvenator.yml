genus: Fujianvenator
parent: Anchiornithidae
pronunciation:
  phonetic: foo-JYEN-ven-AY-tor
etymology: "From Fujian (Fujian Province, China, where it was discovered) + Latin venator (hunter): 'Fujian hunter'."
description: Fujianvenator is an extinct genus of anchiornithid theropod
  dinosaur from the Late Jurassic Nanyuan Formation of Fujian Province, China.
  The genus contains a single species, F. prodigiosus, known from a partial
  articulated skeleton. It is suggested to possibly have had a terrestrial or
  wading lifestyle.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - wetland
diagnostic_features:
  - Metacarpals I and II with asymmetric ginglymoid distal articulations bearing
    hypertrophied medial condyles projecting medially well beyond the medial
    margin of the shaft (autapomorphy)
  - Tibia twice as long as the femur, markedly exceeding the ratio in all other
    known Mesozoic theropods (autapomorphy)
  - Short ischium with obturator process distally located and constricted at its
    base, and posterior process distally located (autapomorphy)
  - Chevrons posterior to the fourth caudal vertebra twice longer
    anteroposteriorly than dorsoventrally
  - Scapula less than half the length of the humerus
  - Pubic apron mediolaterally broad and imperforated
appearance:
  features:
    - feathered wings
    - enlarged manual claws
  integument: feathered
  evidence: direct
