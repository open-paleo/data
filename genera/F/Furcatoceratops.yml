genus: Furcatoceratops
parent: Centrosaurinae
etymology: Forked horned face; from Latin furcatus (forked) and Greek keras (horn) and ops (face)
pronunciation:
  phonetic: fuh-KAH-tow-SEH-ruh-tops
description: Furcatoceratops is a genus of centrosaurine ceratopsid dinosaur
  from the Late Cretaceous Judith River Formation of Montana. The type species
  is Furcatoceratops elucidans.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Supraorbital horncores project significantly anteriorly with slight medial
    curvature and oval cross section (thicker dorsoventrally than transversely)
  - Anteroventral process of the nasal is broad and elongate, dorsolaterally
    overlying the posteroventral process of the premaxilla
  - Epiparietals relatively small compared to episquamosals and
    epiparietosquamosals
  - Pubic process of the ischium narrow (narrower than the shaft)
  - Prefrontal contributes to the orbital margin (excludes palpebral from fully
    enclosing orbit)
appearance:
  integument: scaled
  evidence: inferred
