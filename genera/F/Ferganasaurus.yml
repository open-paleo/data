genus: Ferganasaurus
parent: Eusauropoda
etymology: "From Fergana (the Fergana Valley in Kyrgyzstan, where it was found) + Greek sauros (lizard): 'Fergana Valley lizard'."
description: Ferganasaurus is a genus of sauropod dinosaur that lived in the
  Balabansai Formation of Kyrgyzstan, which dates to the Callovian stage of the
  Middle Jurassic. It was formally described in 2003 by Alifanov and Averianov
  as the type species Ferganasaurus verzilini. It is believed to be similar to
  Rhoetosaurus.
