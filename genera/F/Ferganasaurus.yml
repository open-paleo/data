genus: Ferganasaurus
parent: Eusauropoda
etymology: "From Fergana (the Fergana Valley in Kyrgyzstan, where it was found) + Greek sauros (lizard): 'Fergana Valley lizard'."
pronunciation:
  phonetic: fur-GAH-nah-SOR-us
description: Ferganasaurus is a genus of sauropod dinosaur that lived in the
  Balabansai Formation of Kyrgyzstan, which dates to the Callovian stage of the
  Middle Jurassic. It was formally described in 2003 by Alifanov and Averianov
  as the type species Ferganasaurus verzilini. It is believed to be similar to
  Rhoetosaurus.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Femur shaft with sigmoid curve (primitive retention unique among
    neosauropods)
  - Fourth trochanter of femur blade-like with acuminate apex (primitive
    retention)
  - Single midline lamina supporting hyposphene from below on dorsal neural
    arches
  - Ischiadic peduncle of ilium greatly reduced
  - Proximal and distal portions of pubis located in the same plane
  - Cnemial crest of tibia laterally projecting
appearance:
  integument: scaled
  evidence: inferred
