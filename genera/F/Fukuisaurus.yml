references:
  - id: kobayashi2003a
    notes: Named Fukuisaurus and recovered it as more derived than Iguanodon and
      Ouranosaurus.
  - id: paul2024a
    notes: Source of the appearance features.
  - id: madzia2021a
    notes: Lists Fukuisaurus in Styracosterna, outside Hadrosauriformes, on a
      reference phylogeny; runs no analysis of its own.
  - id: jones2026a
    notes: Reports the placement among the basalmost hadrosauriforms.
  - id: azuma2016a
    notes: Prints the Kitadani Dinosaur Quarry coordinate to the second.
  - id: shibata2015b
    notes: Recovered Fukuisaurus as a non-hadrosauroid hadrosauriform, the sister
      of Proa.
  - id: párraga2019a
    notes: Recovered Fukuisaurus as the sister of Proa within Hadrosauriformes.
  - id: poole2022a
    notes: Recovered Fukuisaurus with Proa in an Iguanodontidae that includes Iguanodon.
  - id: mcdonald2012a
    notes: Recovered Fukuisaurus in a polytomy with Barilium and Hadrosauriformes.
  - id: verdú2017a
    notes: Recovered Fukuisaurus in the basal polytomy of Styracosterna, outside Hadrosauriformes.
  - id: santos-cubedo2021a
    notes: Recovered Fukuisaurus in a polytomy with Barilium and the clade of Iguanodontidae and Hadrosauroidea.
