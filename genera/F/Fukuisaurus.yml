genus: Fukuisaurus
parent: Hadrosauroidea
etymology: From Fukui (the prefecture in Japan where it was discovered) + Greek sauros, 'lizard'; means 'Fukui lizard'. The article notes that Fukui itself means 'Fortunate Well' in Japanese
description: Fukuisaurus is a genus of herbivorous ornithopod dinosaur that lived
  during the Early Cretaceous in what is now Japan. The type species is
  Fukuisaurus tetoriensis, which was named and described in 2003.
diet: herbivore
locomotion: facultative
