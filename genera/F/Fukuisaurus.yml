genus: Fukuisaurus
parent: Hadrosauriformes
etymology: From Fukui (the prefecture in Japan where it was discovered) + Greek
  sauros, 'lizard'; means 'Fukui lizard'. The article notes that Fukui itself
  means 'Fortunate Well' in Japanese
description: Fukuisaurus is a genus of herbivorous ornithopod dinosaur that
  lived during the Early Cretaceous in what is now Japan. The type species is
  Fukuisaurus tetoriensis, which was named and described in 2003.
dispute:
  summary: >
    Fukuisaurus tetoriensis has been placed in basal Styracosterna
    (Madzia and others, 2021) and among Hadrosauriformes (Jones, 2026),
    and in some analyses as a basal hadrosauroid.
  history:
    - date: "2026-06-27"
      note: Placed at Styracosterna, the least-inclusive clade these
        results agree on.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
diagnostic_features:
  - Robust, interdigitated maxilla-vomer articular surface with horizontally
    running ridges and grooves, indicating uniquely derived absence of
    pleurokinesis
  - Large oval-shaped foramen on ventral surface of premaxilla midway between
    anterior tip and primary palate, connected to anterodorsal and anterior-edge
    foramina
  - Lacrimal process of maxilla elevated with antorbital fenestra displaced
    medially to posterodorsal surface, lacking laterally exposed antorbital
    fenestra margin or fossa
  - Jugal process of maxilla lacking long posterolateral projection; jugal
    process short and without posterolateral extension
  - Notch on jugal wing of quadrate circular in outline, with smooth surface
    indicating a paraquadratic foramen
appearance:
  features:
    - keratinous beak
  integument: scaled
  evidence: inferred
