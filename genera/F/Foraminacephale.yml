genus: Foraminacephale
parent: Pachycephalosaurinae
etymology: "From Latin foramina (holes/openings) + Greek kephale (head): 'foramina head', referring to the many small pits (foramina) on the surface of its pachycephalosaurid dome."
description: Foraminacephale is a genus of pachycephalosaurid dinosaur from Late
  Cretaceous (Campanian stage) deposits of Canada.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Tall, smooth squamosal bar with a single row of six nodes in the primary
    node row.
  - Single small corner node just ventral to the primary node row on the
    squamosal.
  - Dorsal surface of frontoparietal and associated peripheral elements covered
    with small dorsoventrally orientated foramina resulting in a distinct pitted
    surface texture.
