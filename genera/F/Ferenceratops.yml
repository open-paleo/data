notable_specimens:
  - specimen_id: [UBB SPZ-2]
    institution: UBB
    species: Ferenceratops shqiperorum
    category: complementary
    significance: "The only specimen currently accepted as referable to Ferenceratops, referred on identical ischial anatomy: a nearly complete left and right pelvis articulated with the sacrum, adding articulated pelvic and sacral material beyond the disarticulated holotype."
    references: [maidment2026a]
references:
  - id: maidment2026a
    notes: Its parsimony and Bayesian analyses recover it within Ceratopsia,
      with Zuniceratops, Turanoceratops and the ceratopsids; the Bayesian runs
      group it with Ajkaceratops and Zalmoxes robustus.
  - id: weishampel2003a
    notes: Originally described Ferenceratops shqiperorum as a species of Zalmoxes.
  - id: dieudonné2026b
    notes: Scores the taxon as Ferenceratops shqiperorum in a matrix that
      samples ceratopsians, and recovers it as the sister taxon of Zalmoxes
      robustus among rhabdodontid ornithopods.
  - id: augustin2023a
    notes: Corrects the holotype's provenance from Vurpăr in Alba County to
      Sânpetru in the Hațeg Basin, on Nopcsa's own account. The Vurpăr
      rhabdodontid is a different individual, referred to Zalmoxes robustus.
