genus: Ferenceratops
parent: Ceratopsia
placement: incertae sedis
etymology: From Hungarian 'Ferenc' (Francis), the birth name of paleontologist
  Franz Nopcsa von Felső-Szilvás (1877-1933), who first reported dinosaur
  remains from the Haţeg Basin, and Greek 'keras/keratos' (horn) and 'ops'
  (face).
pronunciation:
  phonetic: feh-ren-seh-ruh-tops
description: Ferenceratops is an extinct genus of basal ceratopsian dinosaur
  from the Maastrichtian Sânpetru and Densuș-Ciula Formations of the Haţeg
  Basin, western Romania. The single species, Ferenceratops shqiperorum, was
  originally described by Weishampel et al. (2003) as a second species of the
  rhabdodontid ornithopod Zalmoxes; Maidment et al. (2026) reanalysed the
  holotype postcrania and recovered it as a ceratopsian, erecting a new genus
  and arguing that 'Zalmoxes' shqiperorum belongs to a previously unrecognised
  European ceratopsian lineage that also includes Ajkaceratops from Hungary.
dispute:
  summary: >
    Ferenceratops shqiperorum was erected by Maidment and others (2026)
    for material formerly assigned to the ornithopod Zalmoxes
    shqiperorum, which they recovered as a European ceratopsian near the
    Ceratopsoidea. Its affinities within Ceratopsia are not yet
    corroborated by other analyses.
  history:
    - date: "2026-06-27"
      note: Placed at Ceratopsia incertae sedis following Maidment and
        others (2026); finer placement unresolved.
diet: herbivore
locomotion: bipedal
diagnostic_features:
  - Scapula with a narrow, strap-like scapular blade bearing a distal expansion.
  - Well-developed, upwardly concave acromial process of the scapula.
  - Coracoid with an extremely elongate and slender sternal process that
    projects well below the ventral margin of the glenoid.
  - Gently curved ischium that lacks an obturator process.
paleoenvironment:
  - fluvial
appearance:
  integument: scaled
  evidence: inferred
