genus: Ferenceratops
parent: Cerapoda
placement: incertae sedis
etymology: From Hungarian 'Ferenc' (Francis), the birth name of paleontologist
  Franz Nopcsa von Felső-Szilvás (1877-1933), who first reported dinosaur
  remains from the Hațeg Basin, and Greek 'keras/keratos' (horn) and 'ops'
  (face).
pronunciation:
  phonetic: feh-ren-seh-ruh-tops
description: Ferenceratops is an extinct genus of ceratopsian dinosaur
  from the Maastrichtian Sânpetru Formation of the Hațeg Basin, western
  Romania. The single species, Ferenceratops shqiperorum, was
  originally described by Weishampel and colleagues (2003) as a second species of the
  rhabdodontid ornithopod Zalmoxes; Maidment and colleagues (2026) reanalyzed the
  holotype postcrania and recovered it as a ceratopsian, erecting a new genus
  and arguing that 'Zalmoxes' shqiperorum belongs to a previously unrecognized
  European ceratopsian lineage that also includes Ajkaceratops from Hungary.
dispute:
  summary: >
    Ferenceratops shqiperorum was erected by Maidment and colleagues (2026)
    for material formerly assigned to the ornithopod Zalmoxes shqiperorum,
    which they recovered within Ceratopsia, in a clade with Ajkaceratops,
    Zuniceratops, Turanoceratops and the ceratopsids. A later parsimony
    analysis by Dieudonné and colleagues (2026), whose matrix samples
    ceratopsians, recovered it instead as the sister taxon of Zalmoxes
    robustus among rhabdodontid ornithopods. It is placed at Cerapoda incertae
    sedis, the nearest clade both results accept.
diet: herbivore
locomotion: bipedal
diagnostic_features:
  - Scapula with a narrow, strap-like scapular blade bearing a distal expansion.
  - Well-developed, upwardly concave acromial process of the scapula.
  - Coracoid with an extremely elongate and slender sternal process that
    projects well below the ventral margin of the glenoid.
  - Gently curved ischium that lacks an obturator process.
paleoenvironment:
  - fluvial
appearance:
  integument: scaled
  evidence: inferred
