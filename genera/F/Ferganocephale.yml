genus: Ferganocephale
parent: Ornithischia
etymology: From Fergana (the Fergana Valley region of Central Asia, near Kyrgyzstan where it was found) + Greek kephale, 'head'; means 'Fergana head'
pronunciation:
  phonetic: fur-GAN-no-SEF-uh-lee
description: Ferganocephale is a dubious genus of neornithischian dinosaur. It
  was from the Middle Jurassic Balabansai Svita of Kyrgyzstan. The type and only
  species is F. adenticulatum.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Main crown ridge poorly differentiated or not distinguishable.
  - Vertical crown ridges leading to marginal denticles very weak or absent.
  - Marginal crown denticles absent or so small that they are eliminated by the
    slightest wear.
  - Basal crown cingulum interrupted at the center of the labial side in
    maxillary teeth and of the lingual side in mandibular teeth.
  - Vertical wrinkled ornamentation present on the less concave crown side
    adjacent to the basal cingulum interruption, at least in some teeth.
appearance:
  integument: scaled
  evidence: inferred
