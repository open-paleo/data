genus: Fosterovenator
parent: Ceratosauria
dispute:
  summary: >
    Fosterovenator is known only from an isolated juvenile tibia and
    astragalus and a fibula of a larger individual, and no phylogenetic
    analysis has tested its position. Its original description assigns it to
    Ceratosauridae yet argues it is closer to Elaphrosaurus; its validity
    is uncertain.
  history:
    - date: "2026-06-30"
      note: >
        Placed conservatively at Ceratosauria incertae sedis pending
        redescription.
pronunciation:
  phonetic: FOS-ter-o-ven-AY-tor
etymology: Named after paleontologist John Foster + Latin venator, 'hunter';
  means 'Foster's hunter', honoring Foster's work on the Morrison Formation
  fauna
description: Fosterovenator is a genus of ceratosaur dinosaur known from the
  Late Jurassic Morrison Formation of Wyoming. The holotype is YPM VP 058267A,
  B, and C, a tibia with an articulated astragalus. An additional specimen is
  known, the paratype YPM VP 058267D, a fibula of a larger individual.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Tibia condyles are round, with medial condyle larger than lateral condyle.
  - Intercondylar notch is deep and 'V'-shaped.
  - Lateral condyle is strongly removed from the posterior end of the main body
    of the proximal tibia.
  - Fibula shaft with uniform anteroposterior width throughout most of its
    length.
  - Distal end of fibula anteroposterior width is 90% of the width of the
    proximal fibular head.
