genus: Fosterovenator
parent: Ceratosauridae
description: Fosterovenator is a genus of ceratosaur dinosaur known from the
  Late Jurassic Morrison Formation of Wyoming. The holotype is YPM VP 058267A,
  B, and C, a tibia with an articulated astragalus. An additional specimen is
  known, the paratype YPM VP 058267D, a fibula of a larger individual.
