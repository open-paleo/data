genus: Ferrisaurus
parent: Leptoceratopsidae
pronunciation:
  phonetic: FERR-i-SAWR-us
etymology: "From Latin 'ferrum' meaning 'iron' and Ancient Greek 'sauros' meaning 'lizard', meaning 'iron lizard', referring to the discovery along a rail line."
description: Ferrisaurus is a genus of leptoceratopsid ceratopsian dinosaur from
  the Sustut Basin (Tango Creek Formation) in British Columbia, Canada. The type
  and only species is Ferrisaurus sustutensis. It is the first non-avian
  dinosaur described from British Columbia.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Penultimate pedal phalanges in digits III and IV equal or subequal in
    proximodistal length to the preceding phalanx, rather than shorter as in all
    other leptoceratopsids with preserved material
  - Astragalus and tibia coossified, a condition otherwise reported in only one
    Montanoceratops specimen among leptoceratopsids
  - Distal end of ulna proportionally broader relative to radius length than in
    Leptoceratops
  - Distal end of ulna medially bowed, unlike the straight distal ulna of
    penecontemporaneous Maastrichtian leptoceratopsids Leptoceratops and
    Montanoceratops
appearance:
  features:
    - keratinous beak
  integument: scaled
  evidence: inferred
