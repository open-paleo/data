genus: Ferrisaurus
parent: Leptoceratopsidae
description: Ferrisaurus is a genus of leptoceratopsid ceratopsian dinosaur from
  the Sustut Basin (Tango Creek Formation) in British Columbia, Canada. The type
  and only species is Ferrisaurus sustutensis. It is the first non-avian
  dinosaur described from British Columbia.
