genus: Futalognkosaurus
parent: Lognkosauria
etymology: Giant chief lizard; from the Mapuche words futa (giant) and lognko (chief), combined with Greek sauros (lizard)
pronunciation:
  phonetic: FOO-tuh-long-ko-SAW-ruhs
  ipa: /ˌfuːtəˌlɒŋkoʊˈsɔːrəs/
description: Futalognkosaurus is a genus of titanosaurian dinosaur. The
  herbivorous Futalognkosaurus lived approximately 93.5 to 85.8 million years
  ago in the Portezuelo Formation, in what is now Argentina, of the Coniacian
  stage of the late Cretaceous Period. The fish and fossilized leaf debris on
  the site, together with other dinosaur remains, suggest a warm tropical
  climate in Patagonia during this period.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Neurapophysis of the atlas laminar and rectangular, and posteriorly directed
  - Neural spine of the axis high and triangular
  - Posterior border of the neural spine on middle cervical elements concave;
    ventral depression between parapophyses on middle cervical centra
  - First caudal vertebra with prespinal lamina bifurcated at its base forming
    two small infraprespinal laminae; supraspinal cavity bordered by prespinal
    and lateral laminae
  - 2Nd and 3rd sacral ribs fused
  - Wide and well developed iliac peduncle on ischia
appearance:
  features:
    - elongate neck
    - dorsal sail
  integument: scaled
  evidence: inferred
