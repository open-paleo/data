genus: Fulgurotherium
parent: Iguanodontia
etymology: Lightning beast; from Latin fulgur (lightning), referring to
  Lightning Ridge, Australia, where fossils were found, and Greek therion
  (beast)
pronunciation:
  phonetic: full-GOO-ro-THEE-ree-um
description: Fulgurotherium is a dubious genus of ornithischian dinosaur from
  the Late Cretaceous (Cenomanian) Griman Creek Formation. It lived in what is
  now Australia.
dispute:
  summary: >
    Agnolin and colleagues (2010) find the type femur of Fulgurotherium
    australe undiagnostic and the species a nomen dubium, Iguanodontia
    indet., a view Bell and colleagues (2019) follow. It is nonetheless kept
    as a terminal among elasmarians in the reference phylogeny Madzia and
    colleagues (2021) use for Elasmaria, and in Bandeira and colleagues'
    (2024) analysis. It is placed at Iguanodontia incertae sedis.
  history:
    - date: "2026-06-29"
      note: Placed at Elasmaria following the tentative referral; nomen
        dubium.
    - date: "2026-10-16"
      note: >
        Moved from Elasmaria to Iguanodontia incertae sedis, the level
        shared by the indeterminate and elasmarian readings; summary
        rewritten with its sources.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "38735"
  - source: wikidata
    id: Q18602041
  - source: gbif
    id: "4823175"
species:
  - name: Fulgurotherium australe
    etymology: "From Latin 'australe' meaning 'southern', referring to the animal's
      discovery in Australia."
    status: nomen dubium
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Cenomanian
    location:
      country: AU
      locality: Lightning Ridge
      region: AU-NSW
      formation: Griman Creek
      notes: Huene (1932) records no mine or opal field for the holotype, where
        the district's other described specimens each carry one.
    size:
      length_m:
        min: 1.3
        max: 1.3
      weight_kg:
        min: 6
        max: 6
    type_specimen:
      specimen_id: [ BMNH R3719 ]
      specimen_type: holotype
      institution: NHMUK
      material: Distal end of a right femur, approximately 5 cm preserved
      completeness: fragmentary
    erected_in: huene1932a
references:
  - id: huene1932a
  - id: paul2024a
    notes: Source of the body length and mass estimates.
  - id: agnolín2010a
    notes: Finds the type femur undiagnostic and the species a nomen dubium,
      Iguanodontia indet., and invalidates the referral of other femora.
  - id: bell2019b
    notes: Lists the holotype as Iguanodontia indet. and the species as a
      nomen dubium, following Agnolin and colleagues (2010).
  - id: madzia2021a
    notes: Lists Fulgurotherium australe in Elasmaria under that clade's
      reference phylogeny.
  - id: bandeira2024a
    notes: Recovers Fulgurotherium australe in an elasmarian polytomy with
      Gasparinisaura.
