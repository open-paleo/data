genus: Fushanosaurus
parent: Titanosauriformes
placement: incertae sedis
dispute:
  summary: >
    Fushanosaurus is known only from a single femur and was described as a
    gigantic titanosauriform (Wang et al., 2019). A subsequent reassessment of
    mamenchisaurid anatomy noted that its purported titanosauriform features
    are more broadly distributed among eusauropods, raising the possibility
    that it is a mamenchisaurid (Moore et al., 2023).
  history:
    - date: "2026-06-30"
      note: >
        Placed at Titanosauriformes incertae sedis following the original
        description; the mamenchisaurid alternative (Moore et al., 2023) is
        noted.
etymology: Fushan lizard; named after the Fushan Museum in China where its
  remains are stored, combined with Greek sauros (lizard)
pronunciation:
  phonetic: foo-SHAN-o-SOR-us
description: "Fushanosaurus is a genus of sauropod dinosaur from the Shishugou
  Formation from Xinjiang Province in China. The type and only species is
  Fushanosaurus qitaiensis (Chinese: 奇台傅山龙; pinyin: Qítái Fùshānlóng). It is
  solely known from the holotype specimen FH000101, a complete right femur."
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Angle between the virtually extensional line through the most lateral bulge
    edge of the proximal femur and the dorsally extensional line of the femoral
    head is approximately 127°
  - Fourth trochanter well developed and mound-shaped in lateral view
  - Fourth trochanter positioned proximally above midpoint of femoral shaft,
    close to the medial side
  - Intercondyloid fossa deep and U-shaped
  - Combined joint surfaces of the distal condyles are perpendicular (nearly
    orthogonal) to the long axis of the femoral shaft
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "398065"
  - source: wikidata
    id: Q72671571
  - source: eol
    id: "60776517"
species:
  - name: Fushanosaurus qitaiensis
    etymology: "Named for Qitai, the city in Xinjiang Province, China, near where
      the holotype was discovered."
    status: valid
    type_species: true
    period:
      name:
        - Late Jurassic
      stage:
        - Oxfordian
    location:
      country: CN
      region: CN-XJ
      formation: Shishugou
      notes: Wang and colleagues (2019) place the holotype about 20 km northeast
        of Jiangjunmiao, in Qitai County.
    size:
      length_m:
        min: 30.0
        max: 30.0
    type_specimen:
      specimen_id: [ FH000101 ]
      specimen_type: holotype
      institution: FH
      material: Nearly complete right femur.
      completeness: fragmentary
    erected_in: wang2019b
references:
  - id: wang2019b
  - id: moore2023a
    notes: Reassessed mamenchisaurid anatomy, finding Fushanosaurus's purported titanosauriform features broadly distributed
