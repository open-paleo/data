genus: Fushanosaurus
parent: Titanosauriformes
etymology: Fushan lizard; named after the Fushan Museum in China where its
  remains are stored, combined with Greek sauros (lizard)
description: "Fushanosaurus is a genus of sauropod dinosaur from the Shishugou
  Formation from Xinjiang Province in China. The type and only species is
  Fushanosaurus qitaiensis (Chinese: 奇台傅山龙; pinyin: Qítái Fùshānlóng). It is
  solely known from the holotype specimen FH000101, a complete right femur."
diet: herbivore
