genus: Falcarius
parent: Therizinosauria
etymology: "From Latin falcarius (sickle cutter or scythe-bearer): 'sickle cutter', likely alluding to its therizinosaur affinities and large curved claws."
pronunciation:
  phonetic: fal-cuh-RYE-us
description: Falcarius is a genus of primitive therizinosaur dinosaur that lived
  during the Early Cretaceous period in what is now North America. Its remains
  were first collected in the Cedar Mountain Formation in 1999, with subsequent
  findings made during the 2000s. The genus is known from multiple specimens
  ranging from immature to fully-grown individuals.
diet: omnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Expansive, open pneumatic cavities in basioccipital and basisphenoid with
    basisphenoidal recess directed ventrally
  - Extensive subcondylar pneumatic recesses lateral to the occipital condyle
  - One enlarged tooth at anteriormost end of dentary (first alveolus
    hypertrophied, housing tooth with twice cross-sectional area of posterior
    teeth)
  - Laterally deflected and biconcave apex of the deltopectoral crest
  - Posterior tuberosity on distal end of humerus opposite the radial condyle
  - Flexor tubercle of phalanx I-II with well-defined collateral pits on distal
    aspect
appearance:
  features:
    - elongate neck
    - enlarged manual claws
  integument: feathered
  evidence: inferred
