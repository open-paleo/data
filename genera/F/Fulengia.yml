genus: Fulengia
parent: Massospondylidae
placement: incertae sedis
etymology: An anagram of the genus name Lufengosaurus, itself named for the Lufeng Formation of China where the fossils were found.
pronunciation:
  phonetic: foo-LEN-jee-uh
description: Fulengia is a dubious genus of basal sauropodomorph dinosaur from
  the Early Jurassic Lufeng Formation of China. The type species, F. youngi, was
  described by Carroll and Galton in 1977. It is a nomen dubium and may be the
  same animal as Lufengosaurus (from which it is anagramized). It was originally
  thought to be a lizard.
dispute:
  summary: >
    Fulengia youngi is a nomen dubium based on a tiny skull, possibly a
    juvenile Lufengosaurus, and was originally described as a lizard
    (Galton and Upchurch, 2004).
  history:
    - date: "2026-06-29"
      note: Placed at Massospondylidae incertae sedis; nomen dubium, possibly a juvenile Lufengosaurus.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Median (unpaired) frontal
  - Paired premaxillae with long nasal processes
  - Large upper temporal opening with margin partially formed by the postfrontal
  - Postorbital triradiate and nearly vertical
  - Lacrimal absent
  - Teeth fully pleurodont, closely resembling those of modern Iguana iguana,
    with tooth cusps whose anterior margin is angled toward the midline
appearance:
  integument: scaled
  evidence: inferred
