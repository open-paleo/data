genus: Foskeia
parent: Rhabdodontomorpha
etymology: "From Ancient Greek 'phōs' meaning 'light' and 'boskein' meaning 'to forage', referring to its small size and presumed herbivorous habits."
pronunciation:
  phonetic: foh-SKAY-ah
description: Foskeia is an extinct genus of rhabdodontomorph ornithopod
  dinosaurs known from the Early Cretaceous (Barremian to Aptian ages) Castrillo
  de la Reina Formation of Spain. The genus contains a single species, Foskeia
  pelendonum, known from fossils of multiple individuals of different
  ontogenetic stages. Before its formal description, it had been nicknamed the
  "Vegagete ornithopod."
dispute:
  summary: >
    Foskeia is a recently named rhabdodontomorph; its describing paper
    was not available for review this pass, so the placement follows
    secondary signals and is provisional.
  history:
    - date: "2026-06-29"
      note: Placed at Rhabdodontomorpha provisionally; finer placement
        unresolved (P2).
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Two procumbent premaxillary teeth with crowns extending beyond the external
    border of the premaxillae
  - Anteriormost dentary tooth filiform
  - In dorsoventral view, anteromedian incision of the frontals at the contact
    with the nasals
  - Angular step above the distomedial condyle of quadrate; distomedial condyle
    more distally expanded than distolateral condyle
  - Insertion of muscle adductor mandibulae externus superficialis (mAMES) on
    the lateral surface of the coronoid process of dentary with unique
    ventrolateral extension
  - Quadratomandibular cotylus located well above the occlusal plane;
    dorsoventrally expanded angular with ventral margin strongly raised
    posterodorsally
appearance:
  integument: scaled
  evidence: inferred
