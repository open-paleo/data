genus: Fabrosaurus
parent: Ornithischia
etymology: From Fabre (honoring Jean Fabre, the French geologist
  who collected the holotype with Ginsburg's expedition) and
  Greek sauros (lizard); meaning "Fabre's lizard".
pronunciation:
  ipa: /ˌfæbrəˈsɔːrəs/
  phonetic: FAB-rə-SOR-əs
description: >
  Fabrosaurus is a dubious extinct genus of ornithischian dinosaur
  that lived during the Early Jurassic during the Hettangian to
  Sinemurian stages (199 - 189 mya).
dispute:
  summary: >
    Fabrosaurus is a nomen dubium based on a fragmentary dentary from the
    Early Jurassic of Lesotho, widely regarded as indeterminate and
    possibly a junior synonym of Lesothosaurus (Jones, 2026). The former
    family Fabrosauridae erected around it is no longer recognized.
  history:
    - date: "2026-06-29"
      note: Parked at Ornithischia incertae sedis (P2); nomen dubium, with the deprecated Fabrosauridae dropped.
diet: herbivore
locomotion: bipedal
diagnostic_features:
  - Small-sized dinosaur with single-rooted teeth bearing long, vertical roots
  - Tooth crowns small and narrow with a roughly equilateral triangular profile
  - Both cutting edges of the crowns regularly denticulated (crenulated)
  - Mandible slender and gracile, relatively low in height relative to thickness
  - Teeth erect and vertical (not tilted posteriorly), smaller than in
    Scelidosaurus
paleoenvironment:
  - arid
  - fluvial
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "38718"
  - source: wikidata
    id: Q134652
  - source: gbif
    id: "4823091"
species:
  - name: Fabrosaurus australis
    etymology: From Latin australis ("southern"), referring to
      the southern hemisphere locality of origin.
    status: nomen dubium
    type_species: true
    period:
      name:
        - Early Jurassic
      stage:
        - Hettangian
        - Sinemurian
      from_ma: 201.3
      to_ma: 192.9
    location:
      country: LS
      region: Mafeteng
      formation: Elliot
      locality: Likhoele, near Mafeteng
      coordinates:
        - -29.85
        - 27.25
    holotype:
      specimen_id:
        - MNHN LES 9
      specimen_type: holotype
      institution: MNHN
      material: Fragment of right mandible bearing three teeth.
      completeness: fragmentary
    size:
      length_m:
        min: 1.5
        max: 1.5
    erected_in: ginsburg1964a
references:
  - id: ginsburg1964a
    notes: Erects Fabrosaurus australis on a partial right mandible with three
      teeth from the Stormberg Group at Likhoele (Lesotho); originally
      classified as scelidosaurid and dated Upper Triassic.
  - id: charig1974a
    notes: "Rules Fabrosaurus a nomen dubium: the holotype has no distinguishing features beyond the teeth, which are diagnostic of a family rather than a genus, so the taxon is indeterminate."
  - id: galton1978a
    notes: Disagrees with Charig and Crompton (1974) calling F. australis nomen
      dubium; considers it probably valid (holotype MNHN LES 9). Erects
      Lesothosaurus diagnosticus on Thulborn's referred material.
  - id: jones2026a
    notes: Source of the body length estimate.
