genus: Fylax
parent: Hadrosauromorpha
etymology: Keeper; from modern Greek fýlax meaning keeper or guardian
pronunciation:
  phonetic: FYE-laks
description: Fylax is a genus of hadrosauroid ornithopod from the Late Cretaceous
  Figuerola Formation of Spain. The genus contains a single species, Fylax
  thyrakolasus, known from a nearly complete left dentary.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
diagnostic_features:
  - Dorsal region of the coronoid process at least as wide anteroposteriorly as
    30% of dental battery length.
  - Coronoid process inclined anteriorly less than 80° relative to the alveolar
    margin of the dentary.
  - Steeply inclined and flat occlusal surface of the dental battery.
  - Dentary tooth crowns 2.8-3.3 times taller than wide, without marginal
    denticles and with a pair of major long ridges on the enameled lingual
    surface.
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "438296"
species:
  - name: Fylax thyrakolasus
    etymology: "From Ancient Greek 'thyra' meaning 'gate' and 'kolasi' meaning 'hell', creating the combination 'keeper of the gates of hell', in reference to this taxon's proximity to the Cretaceous-Paleogene mass extinction event."
    status: valid
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Maastrichtian
    location:
      country: ES
      locality: Fontllonga-R
      region: ES-L
      formation: Figuerola
    size:
      length_m:
        min: 4.2
        max: 4.2
    erected_in: prieto-márquez2021a
    type_specimen:
      specimen_id: [IPS-36338]
      specimen_type: holotype
      institution: ICP
      material: Well preserved hadrosauroid dentary from uppermost Maastrichtian strata
        (within chron C29r), Àger syncline, southern Pyrenees.
      completeness: fragmentary
