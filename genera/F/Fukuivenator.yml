genus: Fukuivenator
parent: Therizinosauria
etymology: "From Fukui (Fukui Prefecture, Japan, where it was found) + Latin venator (hunter): 'hunter of Fukui Prefecture'."
pronunciation:
  phonetic: foo-KOO-ee-VEN-uh-tuh
description: Fukuivenator is an extinct genus of maniraptoran theropod dinosaur
  from the Early Cretaceous Kitadani Formation of Japan.
dispute:
  summary: >
    The affinities of Fukuivenator are disputed. Its original description (Azuma
    et al., 2016) recovered it as a basal maniraptoran of uncertain position that
    could not be referred to any known coelurosaurian subgroup, and Hartman et
    al. (2019) placed it near the base of Maniraptora. A CT-based osteological
    restudy by the same group (Hattori et al., 2021) instead recovered it as the
    basalmost member of Therizinosauria, citing therizinosaurian synapomorphies
    such as a subotic recess, eleven or more cervical vertebrae, and anterior
    humeral condyles, though the authors caution that support for this position
    is weak. The Princeton Encyclopedia (Jones, 2026) adopts the basalmost
    therizinosaur placement.
  history:
    - date: "2026-07-01"
      note: >
        Placed at Therizinosauria as its basalmost member following Hattori et
        al. (2021) and Jones (2026), which supersede the incertae sedis
        interpretation of Azuma et al. (2016); the placement is weakly supported.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Unusually large external naris slightly smaller than antorbital fenestra in
    dorsoventral height; large premaxillary fenestra subequal in size to
    maxillary fenestra.
  - "Highly heterodont dentition with robust unserrated teeth: small spatulate
    anterior teeth, large posteriorly curved middle teeth, and small nearly
    symmetrical posterior teeth."
  - Anterior and middle cervical vertebrae with transversely bifid neural
    spines, a feature unknown in any other theropod.
  - Dorsoventrally bifurcated sacral ribs, a feature previously unreported in
    any other theropod.
  - Middle caudal vertebrae with distally bifid prezygapophyses, not reported in
    any dinosaur previously.
  - Caudal zygapophyseal facets expanded to be substantially wider than the
    zygapophyseal processes.
appearance:
  features:
    - elongate neck
    - enlarged manual claws
  integument: feathered
  evidence: inferred
