genus: Fusuisaurus
parent: Titanosauriformes
pronunciation:
  phonetic: foo-SWAY-SAWR-us
etymology: From Fusui (the county in Guangxi, China where it was discovered) +
  Greek sauros, 'lizard'; means 'Fusui lizard'
description: Fusuisaurus is a genus of sauropod dinosaur from the Early
  Cretaceous of China. Fragmentary postcranial remains of this animal have been
  discovered in 2001 in the Xinlong Formation of Guangxi, and consist of the
  left ilium, left pubis, anterior caudals, most of the dorsal ribs, and distal
  end of the left femur. This sauropod has been described as a basal
  titanosauriform. The type species is F. zhaoi, named in honor of Chinese
  paleontologist Zhao Xijin.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Anterior dorsal ribs non-pneumatic
  - Presence of a prominent, pointed anteroventral process of the ilium
  - Preacetabular blade of the ilium strongly expanded dorsoventrally
  - Posterior margin of the ilium notched
  - Transverse process of the anterior caudal vertebrae dorsoventrally flattened
