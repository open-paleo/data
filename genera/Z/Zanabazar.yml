genus: Zanabazar
parent: Troodontinae
etymology: Named after Öndör Gegeen Zanabazar, the first Jebtsundamba Khutuktu and supreme spiritual leader of Mongolian Buddhism in the 17th century, honoring the Mongolian heritage of the fossil's origin.
pronunciation:
  phonetic: zah-nuh-buh-zar
description: Zanabazar is an extinct genus of troodontid theropod dinosaur from
  the Maastrichtian Nemegt Formation of Mongolia. The type species is Zanabazar
  junior, known from a single skull.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Lacking small depression on lateral wall of braincase just dorsal to
    trigeminal foramen
  - Largest known troodontid specimen with midline skull length of ~272 mm
  - More ovoid-shaped foramen magnum than Troodon formosus
  - Posttemporal fenestra enclosed by equal proportion of exoccipital/opisthotic
    and squamosal
  - Deeper paroccipital process than Troodon formosus with different position of
    posttemporal fossa
  - Lack of osseous signature of ophthalmic branch of trigeminal nerve in
    laterosphenoid
appearance:
  features:
    - sickle claw
    - feathered tail
  integument: feathered
  evidence: direct
