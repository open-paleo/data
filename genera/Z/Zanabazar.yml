genus: Zanabazar
parent: Saurornithoidini
etymology: Named after Öndör Gegeen Zanabazar, the first Jebtsundamba Khutuktu and supreme spiritual leader of Mongolian Buddhism in the 17th century, honoring the Mongolian heritage of the fossil's origin.
description: Zanabazar is an extinct genus of troodontid theropod dinosaur from
  the Maastrichtian Nemegt Formation of Mongolia. The type species is Zanabazar
  junior, known from a single skull.
diet: carnivore
