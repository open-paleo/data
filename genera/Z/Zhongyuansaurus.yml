genus: Zhongyuansaurus
parent: Ankylosauridae
etymology: Zhongyuan lizard
description: Zhongyuansaurus is an extinct genus of ankylosaurid dinosaurs known
  from the Early Cretaceous Haoling Formation of what is now Henan Province,
  China. The genus contains two species, Z. luoyangensis, named in 2007, and Z.
  junchangi, named in 2025, both known from a single partial skeleton.
  Zhongyuansaurus is similar to Gobisaurus, prompting some researchers to regard
  the genera as synonymous.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Skull length to width ratio approximately 1.4:1, with flat parietal region
    and straight posterior and lateral margins posterior to orbits in dorsal
    view
  - No premaxillary teeth; maxillary tooth row straight with 18 teeth;
    semi-circular depression ventral to occipital condyle
  - Paroccipital process not fused with squamosal
  - Widths of humerus at proximal and distal ends nearly equal; M. latissimus
    dorsi and M. teres major attachments are concave depressions rather than
    scars on posterior proximal humerus
  - Ischial shaft relatively straight, differing from other nodosaurids with
    curved shafts
