genus: Zhongyuansaurus
parent: Shamosaurinae
pronunciation:
  phonetic: johng-YWEN-SAWR-us
etymology: Zhongyuan lizard
description: Zhongyuansaurus is an extinct genus of ankylosaurid dinosaurs known
  from the Early Cretaceous Haoling Formation of what is now Henan Province,
  China. The genus contains two species, Z. luoyangensis, named in 2007, and Z.
  junchangi, named in 2025, both known from a single partial skeleton.
  Zhongyuansaurus is similar to Gobisaurus, prompting some researchers to regard
  the genera as synonymous.
dispute:
  summary: >
    The validity of Zhongyuansaurus is contested. Arbour and Currie (2015) found its remains indistinguishable from Gobisaurus and treated it as a junior synonym, a view followed by Jones (2026); it is retained as a valid shamosaurine pending broad consensus.
  history:
    - date: "2026-06-26"
      note: Placed at Ankylosauridae (Shamosaurinae), kept valid although recent work synonymizes it with Gobisaurus.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Frontonasal region rugose, with irregular cranial ornamentation not divisible
    into distinct caputegulae
  - Longitudinal groove on the dorsal surface of the premaxilla (also in
    Shamosaurus)
  - Squamosal horn shorter and more rounded than in Crichtonpelta
  - Preorbital region straight in lateral view (arched in Shamosaurus and
    Gobisaurus)
  - Tooth row 31.7% of skull length (40% in Shamosaurus, 26.7% in Gobisaurus)
appearance:
  integument: armored
  evidence: direct
identifiers:
  - source: pbdb
    id: "169933"
  - source: wikidata
    id: Q135722
species:
  - name: Zhongyuansaurus luoyangensis
    etymology: "Refers to the fossil locality in Ruyang County, which is
      administratively assigned to the Luoyang region (Henan Province,
      China)."
    status: disputed
    type_species: true
    period:
      name:
        - Early Cretaceous
      stage:
        - Aptian
        - Albian
    location:
      country: CN
      region: CN-HA
      locality: Liudian Township
      formation: Haoling
      notes: Xu and colleagues (2007) and Arbour and Currie (2015) give the
        Mangchuan Formation, which Lü and colleagues (2013) divide into the
        Xiahedong, Haoling and Shangdonggou formations, placing their own
        sauropod in the Haoling near Santun and Liudian. No source places this
        holotype in one of the three.
    size:
      skull_length_m:
        min: 0.375
        max: 0.375
    type_specimen:
      specimen_id:
        - HGM 41HIII-0002
      specimen_type: holotype
      institution: HGM
      material: Nearly complete skull with partial mandible; dorsal and cervical neural
        arches; dorsal vertebral centra; middle and posterior caudal vertebral centra; 7
        fused terminal caudal vertebrae; complete left humerus; left and right ischia;
        one pubis; osteoderms; dorsal ribs.
      completeness: partial
    erected_in: xu2007a
  - name: Zhongyuansaurus junchangi
    etymology: Honors Lü Junchang, the late Chinese vertebrate paleontologist who
      contributed to paleontological research in Henan.
    status: valid
    type_species: false
    period:
      name:
        - Early Cretaceous
      stage:
        - Aptian
        - Albian
    location:
      country: CN
      region: CN-HA
      locality: Zhongwa Village, Liudian Township, Ruyang County
      formation: Haoling
      part: upper
      coordinates: [34.105205, 112.510380]
    type_specimen:
      specimen_id:
        - HGM 41HIII-0708
      specimen_type: holotype
      institution: HGM
      material: Right mandible; 14 caudal vertebrae; 7 fused terminal caudal
        vertebrae forming the tail club handle; 4 ribs; 10 haemal arches; left
        humerus; right metatarsal II; 41 osteoderms.
      completeness: partial
    diagnostic_features:
      - At least five swallowtail-shaped, imbricate osteoderms in the tail region
      - Small osteoderms attached to the surface of the tail club handle (absent
        in Z. luoyangensis)
      - Ratio of humeral shaft circumference to humeral length 0.46 (0.55 in Z.
        luoyangensis)
    erected_in: zhang2025z
references:
  - id: xu2007a
  - id: arbour2015a
    notes: Found Zhongyuansaurus indistinguishable from Gobisaurus and treated it as a junior synonym.
  - id: lü2013b
    notes: Divides the Mangchuan Formation of the Ruyang Basin into the
      Xiahedong, Haoling and Shangdonggou formations.
  - id: jones2026a
    notes: Treats Zhongyuansaurus as a synonym of Gobisaurus.
  - id: zhang2025z
    notes: Names Z. junchangi from the upper Haoling (top of the Haoling to lower
      Shangdonggou in its setting section), tentatively Albian, and revises the
      genus diagnosis.
