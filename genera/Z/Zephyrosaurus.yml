genus: Zephyrosaurus
parent: Orodrominae
etymology: westward wind lizard
description: Zephyrosaurus is a genus of orodromine ornithischian dinosaur based
  on a partial skull and postcranial fragments discovered in the Early
  Cretaceous (Aptian-Albian) Cloverly Formation of Carbon County, Montana, USA.
  New remains are under description, and tracks from Maryland and Virginia, also
  in the US, have been attributed to animals similar to Zephyrosaurus.
diet: herbivore
locomotion: bipedal
