genus: Ziapelta
parent: Ankylosaurinae
etymology: Named after the Zia sun symbol, the stylized sun emblem of the Zia Pueblo people of New Mexico, where the fossil was found, combined with Greek 'pelta' meaning 'small shield', referring to its ankylosaur armor.
pronunciation:
  phonetic: zee-uh-PEL-tuh
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
appearance:
  features:
    - cranial bosses
  integument: armored
diagnostic_features:
  - Prominent, large, sub-triangular median nasal caputegulum
  - Dorsoventrally deep squamosal horns curved anteriorly at the tips
  - Three deep fossae on the ventral surface of the basicranium
  - Mixture of flat and weakly bulbous frontonasal caputegulae
