genus: Zupaysaurus
parent: Neotheropoda
dispute:
  summary: >
    Zupaysaurus rougieri has been recovered as a coelophysid or a close
    relative of Liliensternus and Dilophosaurus, and as the earliest-
    branching member of the stem lineage to Averostra; recent analyses place
    it outside Coelophysoidea (Ezcurra, 2017; Ezcurra and others, 2020).
  history:
    - date: "2026-06-30"
      note: >
        Placed at Neotheropoda, the least-inclusive uncontested clade.
pronunciation:
  ipa: /ˌzuːpeɪˈsɔːrəs/
  phonetic: ZOO-pay-SAWR-us
etymology: "From Quechua supay meaning 'devil' and Greek sauros (σαυρος) meaning
  'lizard'; thus 'devil lizard'"
description: Zupaysaurus is an extinct genus of early theropod dinosaur living
  during the Norian stage of the Late Triassic in what is now Argentina. Fossils
  of the dinosaur were found in the Los Colorados Formation of the
  Ischigualasto-Villa Unión Basin in northwestern Argentina. Although a full
  skeleton has not yet been discovered, Zupaysaurus can be considered a bipedal
  predator, up to 4 meters (13 ft) long. It may have had two parallel crests
  running the length of its snout.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - arid
diagnostic_features:
  - Oval, anteroventrally oriented antorbital fenestra
  - Two parasagittal crests on snout formed by nasals
  - Maxilla with parallel dorsal and ventral borders (unlike most other
    theropods)
  - Tibial-astragalar articulation locked medioposteriorly by astragalar process
    in posteriorly open tibial notch
  - Transversely expanded distal end of tibia with wide postfibular wing
  - Tooth row ending anterior to orbit (tetanuran trait)
appearance:
  features:
    - nasal crest
  integument: scaled
  evidence: inferred
