genus: Zhuchengceratops
parent: Leptoceratopsidae
etymology: Named for Zhucheng, the city in Shandong Province, China where the fossil was found, combined with Latinized Greek 'ceratops' meaning 'horned face'.
description: Zhuchengceratops is a genus of extinct leptoceratopsid ceratopsian
  that lived during the Upper Cretaceous of modern-day China. It was first
  described in 2010, by Xu et al., who created the binomial Zhuchengceratops
  inexpectus. The name is derived from the location of Zhucheng, the
  Latinized-Greek ceratops, or "horned face", and the unexpected articulated
  nature of the holotype. The skeleton was found in the Wangshi Group, which is
  of Late Cretaceous age, and most fossils are only disarticulated bones of
  Shantungosaurus.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Maxilla with posteroventrally oriented edentulous posterior process
  - Mandible extremely deep (mid-length height one-third of mandibular length)
    and very thin transversely
  - Medial surface of mandible with two large fossae separated by thick curved
    ridge along dentary-splenial contact
  - Predentary sub-vertically oriented (posterior edge ~75 degrees to tooth row
    in lateral view)
  - Anterior end of dentary deeper than coronoid region
  - Middle cervical ribs bifurcated with prominent accessory dorsal process
