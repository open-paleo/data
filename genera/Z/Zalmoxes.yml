genus: Zalmoxes
parent: Rhabdodontidae
etymology: Named after Zalmoxis (also spelled Zamolxis), a deity or legendary
  king worshipped by the Getae people of ancient Thrace and Dacia (modern
  Romania), where the fossil was found.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Supraacetabular process on the ilium
  - Complex squamose suture between quadratojugal and quadrate
  - Post-temporal foramen transmitted through squamosal body
  - Reduced external mandibular fenestra positioned along upper anterior
    surangular border
  - Secondary surangular foramen
  - Long dorsoventrally-narrow twisted preacetabular process
