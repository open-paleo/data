genus: Zapsalis
parent: Dromaeosauridae
dispute:
  summary: >
    Zapsalis abradens is a tooth-based taxon widely regarded as a nomen dubium.
    Currie and Evans (2019) showed that teeth referred to Zapsalis in the Dinosaur
    Park Formation are the second premaxillary teeth of Saurornitholestes
    langstoni, suggesting the two may be synonymous, but stopped short of formal
    synonymy because the Montana holotype differs. It is retained provisionally at
    Dromaeosauridae incertae sedis.
  history:
    - date: "2026-07-01"
      note: Moved from Dromaeosaurinae to Dromaeosauridae incertae sedis; tooth-based nomen dubium, possibly the premaxillary teeth of Saurornitholestes (Currie and Evans, 2019).
pronunciation:
  phonetic: zap-SAL-is
etymology: "From Greek za meaning 'thorough' (an intensifying prefix) and psalis meaning 'pair of scissors'; translates as 'thorough scissors,' referring to the cutting teeth"
description: Zapsalis is a genus of dromaeosaurine theropod dinosaurs. It is a
  tooth taxon, often considered dubious because of the fragmentary nature of the
  fossils, which include teeth but no other remains.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Teeth with one flat side and one convex side, their junctions forming the
    anterior and posterior edges of the crown
  - No anterior cutting edge; instead a solid angle at the anterior junction
  - Posterior edge denticulate (denticles of moderate coarseness, M. .00033)
  - Flat side bears three worn longitudinal low angles, the median being basal
    and short
  - Convex side exhibits four low angles of nearly equal length, all stopping
    short of the apex, with slightly concave facets between them
appearance:
  integument: feathered
  evidence: inferred
