genus: Zhuchengtyrannus
parent: Tyrannosaurini
etymology: Named after Zhucheng, Shandong Province, China (the type locality), combined with Latin tyrannus meaning 'tyrant'; translates as 'Zhucheng tyrant'
description: Zhuchengtyrannus is a genus of tyrannosaurid theropod dinosaur from
  Asia, known from the Campanian stage of the Late Cretaceous of Shandong
  Province, China. It belongs to the subfamily Tyrannosaurinae, and contains a
  single species, Zhuchengtyrannus magnus.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Horizontal shelf on lateral surface of base of ascending process of maxilla
  - Rounded notch in anterior margin of maxillary fenestra
  - Ventral margin of antorbital fenestra lies well above ventral rim of
    antorbital fossa
  - Anteroposterior length of maxillary fenestra more than half the distance
    between anterior margins of antorbital fossa and fenestra
  - Absence of subcutaneous flange on posterodorsal part of jugal ramus of
    maxilla
  - Absence of ventrally convex palatal shelf covering roots of posterior teeth
    in medial view
