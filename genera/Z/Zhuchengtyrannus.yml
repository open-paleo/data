genus: Zhuchengtyrannus
parent: Tyrannosaurini
etymology: Named after Zhucheng, Shandong Province, China (the type locality), combined with Latin tyrannus meaning 'tyrant'; translates as 'Zhucheng tyrant'
description: Zhuchengtyrannus is a genus of tyrannosaurid theropod dinosaur from
  Asia, known from the Campanian stage of the Late Cretaceous of Shandong
  Province, China. It belongs to the subfamily Tyrannosaurinae, and contains a
  single species, Zhuchengtyrannus magnus.
diet: carnivore
locomotion: bipedal
