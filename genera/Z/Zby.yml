genus: Zby
parent: Turiasauria
etymology: Named after Georges Zbyszewski, the geologist and paleontologist who studied the geology and paleontology of Portugal, where the fossil was found.
description: Zby is an extinct genus of turiasaurian sauropod dinosaur known
  from the Late Jurassic, particularly late Kimmeridgian stage of the Lourinhã
  Formation, in central west Portugal. It contains a single species, Zby
  atlanticus. It is named after Georges Zbyszewski, who studied the geology and
  paleontology of Portugal.
