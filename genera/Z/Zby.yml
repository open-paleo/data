genus: Zby
parent: Turiasauria
etymology: Named after Georges Zbyszewski, the geologist and paleontologist who studied the geology and paleontology of Portugal, where the fossil was found.
pronunciation:
  phonetic: zee-bee
description: Zby is an extinct genus of turiasaurian sauropod dinosaur known
  from the Late Jurassic, particularly late Kimmeridgian stage of the Lourinhã
  Formation, in central west Portugal. It contains a single species, Zby
  atlanticus. It is named after Georges Zbyszewski, who studied the geology and
  paleontology of Portugal.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - coastal
diagnostic_features:
  - Posteroventral margin of scapular acromial plate and anteroventral margin of
    blade meet at abrupt angle (~110°) following change in slope
  - Humerus expands anteriorly and posteriorly at distal half of deltopectoral
    crest as result of prominent posterior bulge
  - Laterodistal corner of humerus forms anteroposteriorly thin flange of bone
    that does not expand as far anteriorly as rest of distal end
  - Manual ungual phalanx I-2 subrectangular in lateral view
appearance:
  integument: scaled
  evidence: inferred
