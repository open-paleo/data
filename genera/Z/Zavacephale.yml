genus: Zavacephale
parent: Pachycephalosauria
etymology: From Greek zava meaning 'origin' or 'beginning' and kephale meaning 'head'; translates as 'origin head,' referring to its status as the oldest known pachycephalosaur
description: Zavacephale is an extinct genus of pachycephalosaurian dinosaurs
  known from the Early Cretaceous Khuren Dukh Formation of Mongolia. The genus
  contains a single species, Zavacephale rinpoche, known from a partial
  articulated skeleton including a nearly complete skull. It is both the oldest
  definitive pachycephalosaur known, as well as the most complete. Its skull
  bears a well-developed dome structure, as seen in most members of the clade.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Premaxilla and maxilla devoid of lateral ornamentations (autapomorphy)
  - Large prefrontal approximately as long as and twice as high as the anterior
    supraorbital (autapomorphy)
  - Absence of a parietosquamosal (posterior) node row (autapomorphy)
  - Ventrally deflected anterior end of the dentary with mesialmost dentary
    tooth reduced in size compared with remaining buccal dentition
    (autapomorphy)
  - Long, slender, occasionally bifurcating ossified myorhabdoid tendons
    (autapomorphy)
  - Medial shelf of ilium extends the length of the postacetabular process
    (autapomorphy)
