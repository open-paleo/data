genus: Zuolong
parent: Coelurosauria
placement: incertae sedis
dispute:
  summary: >
    Zuolong is usually recovered as a basal coelurosaur (Choiniere et al., 2010;
    Sayão et al., 2020, as sister to Aratasaurus), and Jones et al. (2026) follow
    this, but Cau (2018) placed it further stemward as a basal tetanuran outside
    Coelurosauria. It is placed at Coelurosauria incertae sedis following the
    prevailing view.
  history:
    - date: "2026-07-01"
      note: Placed at Coelurosauria incertae sedis; basal coelurosaur per most analyses, basal tetanuran per Cau (2018).
pronunciation:
  phonetic: zoo-OH-long
etymology: "Named in honor of General Zuo Zongtang (also known as General Tso), a 19th-century Chinese military leader, combined with Chinese 'long' meaning 'dragon'."
description: Zuolong is an extinct genus of tetanuran theropod from the Late
  Jurassic period of China. The type and only species is Z. salleei. The generic
  name of Zuolong is in honor of General Zuo Zōngtáng (also known as "General
  Tso") with the Chinese word "long" which means dragon. The specific epithet
  "salleei" is in honor of Hilmar Sallee, who funded the expedition which led to
  the specimen's discovery.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Large slit-like quadrate foramen inclined medially at ~45° with associated
    deep fossa on the quadrate
  - Sacral centrum 5 with obliquely oriented posterior articular surface angled
    anterodorsally
  - Fovea capitis very large, occupying almost entire posterodorsal surface of
    femoral head
  - Distal condyle of metatarsal III large with anteromedially projecting flange
appearance:
  integument: unknown
