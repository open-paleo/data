genus: Zuul
parent: Ankylosaurinae
etymology: Named after Zuul, the fictional monster from the 1984 film Ghostbusters, due to the resemblance of its skull to the creature's face
pronunciation:
  ipa: /ˈzuːl/
  phonetic: Zool
description: Zuul is a genus of herbivorous ankylosaurine dinosaur from
  the Campanian Judith River Formation of Montana. The type species is
  Zuul crurivastator. It is known from a complete skull and tail, which
  represents the first ankylosaurin known from a complete skull and tail
  club, as well as the most complete ankylosaurid specimen thus far
  recovered from North America. The specimen also preserved in situ
  osteoderms, keratin, and skin remains.
diet: herbivore
locomotion: quadrupedal
diagnostic_features:
  - Frontonasal and frontoparietal caputegulae imbricated with distinct
    posteriorly located peaked apices.
  - Prefrontal, frontoparietal, and middle supraorbital caputegulae strongly
    pyramidal with small bases and tall peaks.
  - Squamosal horns with prominent longitudinal furrows on the lateral surface
    converging toward the apex.
  - Lateral caudal osteoderms along the tail club handle with strongly concave
    leading edges and posteriorly offset apices.
  - Tail club knob dorsoventrally flat with height-to-length ratio less than
    0.20.
paleoenvironment:
  - fluvial
  - coastal
appearance:
  features:
    - tail club
    - body armor
    - osteoderms
  integument: armored
  evidence: direct
