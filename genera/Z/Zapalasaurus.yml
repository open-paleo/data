genus: Zapalasaurus
parent: Rebbachisauridae
etymology: Named for Zapala, a city in Neuquén Province, Patagonia, Argentina, near where the fossils were found, combined with Greek 'sauros' meaning 'lizard'.
pronunciation:
  phonetic: ZAP-a-la-SOR-us
description: Zapalasaurus is an extinct genus of sauropod dinosaur from the
  Early Cretaceous-aged La Amarga Formation of what is today Patagonia. The type
  and only species is Z. bonapartei.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Cervical neural arches with lamina uniting prezygapophysis and zygapophysial
    sector of postzygodiapophyseal lamina
  - Cervical neural arches with postzygodiapophyseal lamina reduced in
    diapophyseal sector
  - Cervical neural arches with spinoprezygapophysial laminae poorly developed,
    not reaching neural spine tip
  - Mid and posterior caudal vertebrae with anteroposteriorly elongated neural
    spines with anterodorsal corner elevated above posterodorsal corner
  - Caudal vertebrae doubling in length over first 20 vertebrae
appearance:
  integument: scaled
  evidence: inferred
