genus: Zapalasaurus
parent: Rebbachisauridae
etymology: Named for Zapala, a city in Neuquén Province, Patagonia, Argentina, near where the fossils were found, combined with Greek 'sauros' meaning 'lizard'.
description: Zapalasaurus is an extinct genus of sauropod dinosaur from the
  Early Cretaceous-aged La Amarga Formation of what is today Patagonia. The type
  and only species is Z. bonapartei.
diet: herbivore
