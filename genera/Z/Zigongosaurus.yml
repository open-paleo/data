genus: Zigongosaurus
parent: Mamenchisauridae
etymology: "Named for Zigong City in Sichuan, China, where the fossils were
  found, combined with Greek 'sauros' meaning 'lizard'."
description: Zigongosaurus is a genus of sauropod dinosaur from the Middle-Late
  Jurassic-aged Shaximiao Formation of Zigong, Sichuan, China. Because of
  incomplete knowledge of Jurassic Chinese sauropods, it has been hard to
  interpret, with some sources assigning it to Omeisaurus, some to
  Mamenchisaurus, and some to its own genus.
diet: herbivore
locomotion: quadrupedal
