genus: Zigongosaurus
parent: Mamenchisauridae
etymology: "Named for Zigong City in Sichuan, China, where the fossils were
  found, combined with Greek 'sauros' meaning 'lizard'."
pronunciation:
  phonetic: dzuh-GUNG-o-SOR-us
description: Zigongosaurus is a genus of sauropod dinosaur from the Middle-Late
  Jurassic-aged Shaximiao Formation of Zigong, Sichuan, China. Because of
  incomplete knowledge of Jurassic Chinese sauropods, it has been hard to
  interpret, with some sources assigning it to Omeisaurus, some to
  Mamenchisaurus, and some to its own genus.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
appearance:
  integument: scaled
  evidence: inferred
diagnostic_features:
  - Anterior edge of the maxilla above the tooth row bears a forward-and-downward
    projecting process contacting the premaxillary suture; maxillary foramen not
    prominent
  - Maxilla bearing 12-14 teeth and mandible 15-17 teeth
  - Prefrontal forming the main component of the dorsal orbital border; posterior
    part of the temporal bone exceptionally thick (up to 18 mm); upper temporal
    fenestra oval and narrow anteroposteriorly
  - Premaxillary teeth largest, with long pointed crowns bearing small apical
    tubercles but no serrations; cheek-tooth crowns convex externally and concave
    internally with a prominent internal median ridge
  - Anterior end of the dentary symphysis projecting downward with a rough
    external surface; lower margin of the dentary bearing a longitudinal groove
    extending to the symphysis
