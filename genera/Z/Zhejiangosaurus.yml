genus: Zhejiangosaurus
parent: Ankylosauria
etymology: Named after Zhejiang Province, eastern China where it was found,
  combined with Greek sauros meaning 'lizard'; translates as 'Zhejiang lizard'
description: Zhejiangosaurus is an extinct genus of ankylosaurian dinosaur from
  the Upper Cretaceous (Cenomanian stage) of Zhejiang, eastern China. It was
  first named by a group of Chinese authors Lü Junchang, Jin Xingsheng, Sheng
  Yiming and Li Yihong in 2007 and the type species is Zhejiangosaurus
  lishuiensis ("from Lishui", where the fossil was found). It has no diagnostic
  features, and thus is a nomen dubium.
diet: herbivore
locomotion: quadrupedal
