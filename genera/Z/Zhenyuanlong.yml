genus: Zhenyuanlong
parent: Dromaeosauridae
dispute:
  summary: >
    Zhenyuanlong is a large, short-armed Jehol dromaeosaurid whose finer placement
    is unresolved. Its describers recovered the Liaoning dromaeosaurids in a basal
    polytomy and explicitly did not recover a Zhenyuanlong + Tianyuraptor clade
    (Lü and Brusatte, 2015), whereas Wang et al. (2022) and Jones et al. (2026)
    group it with Tianyuraptor and Daurlong just stemward of Eudromaeosauria. It is
    placed at Dromaeosauridae incertae sedis.
  history:
    - date: "2026-07-01"
      note: Placed at Dromaeosauridae incertae sedis (least-inclusive uncontested clade); basal position with weak support, short-armed grouping with Tianyuraptor and Daurlong not universally recovered.
etymology: Named after Sun Zhenyuan, who discovered the specimen, combined with Chinese Pinyin lóng (龙/龍) meaning 'dragon'; thus 'Zhenyuan's dragon'
pronunciation:
  phonetic: jen-HWAHN-long
description: "Zhenyuanlong is a genus of dromaeosaurid dinosaur from the Yixian
  Formation of Liaoning, China. It lived during the Aptian age of the early
  Cretaceous period, approximately 125 million years ago. It is known from a
  single specimen belonging to the species Zhenyuanlong suni (Chinese: 孫氏振元龍).
  This type specimen preserved a nearly complete skeleton that contains traces
  of feathers, including long tail feathers and large wings. In addition to
  further complicating diversity of Liaoning dromaeosaurids, this specimen
  provides the first direct evidence of well-developed pennaceous feathers in a
  large, non-flying dromaeosaur, raising the question of what function such
  wings would serve."
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
  - forested
appearance:
  integument: feathered
diagnostic_features:
  - Extremely slender radius whose shaft is thinner than manual phalanx I-1
  - Shortened metacarpal II, shorter than combined metacarpal I and phalanx I-1
  - Six sacral vertebrae (uniquely among Liaoning dromaeosaurids)
  - Forelimb approximately half the length of hindlimb with humerus:femur ratio
    less than 0.65
  - Absence of prominent lateral tubercle at midpoint of lateral pubic shaft
    surface
  - Antorbital fossa bordered ventrally by sharp rim with weak pitting on
    lateral surface
