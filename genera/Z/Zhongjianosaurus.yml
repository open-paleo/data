genus: Zhongjianosaurus
parent: Microraptorinae
etymology: Named for Zhongjian Young (Yang Zhongjian), the father of Chinese
  vertebrate paleontology, combined with Greek 'sauros' meaning 'lizard'.
pronunciation:
  phonetic: chung-CHEE-en-o-SOR-us
description: Zhongjianosaurus is a genus of dromaeosaurid belonging to the
  Microraptoria. Believed to hail from the Yixian Formation, specifically the
  middle of the Jehol Biota, it is the smallest known microraptorine thus far
  discovered and one of the smallest non-avian theropod dinosaurs.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
diagnostic_features:
  - Proportionally long ossified uncinate processes fused to dorsal ribs
  - Humeral proximal end strongly offset medially from humeral shaft
  - Large fenestra within humeral deltopectoral crest
  - Ulna slightly longer than humerus (brachial index 0.98)
  - Arctometatarsalian pes with metatarsal II lacking ginglymus on distal end
  - Phalanx II-2 lacking proximodorsal lip and strong dorsal arching
  - Medial condyle of tibiotarsus distal end with prominent distal extension
  - Metacarpal III laterally bowed with longitudinal ventral groove
appearance:
  features:
    - feathered tail
  integument: feathered
  evidence: direct
