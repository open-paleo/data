genus: Zhengheornis
parent: Avialae
etymology: '"Zhenghe" (Mandarin), for Zhenghe County where the holotype was
  found, + "ornis" (Greek), bird'
description: Zhengheornis is an extinct genus of basal avialan known from the
  Late Jurassic (Kimmeridgian–Tithonian ages) Nanyuan Formation of China. The
  genus contains a single species, Zhengheornis buyu, known from a partial
  skeleton with feather traces, preserved on a slab and counterslab.
locomotion: bipedal
diagnostic_features:
  - Short tail comprising 15 caudal vertebrae, shorter than the combined length
    of the femur, tibia, and metatarsal III
  - Final two caudal vertebrae box-like with bluntly convex caudal ends
  - Slender ischium with a knob-like, distally located obturator process and no
    posterior process
  - Manual phalanx III-1 shorter than manual phalanx III-2
  - Metatarsal I articulates with metatarsal II at its distal third-length
  - Short hallux with an ungual smaller than those of the other pedal digits
appearance:
  integument: feathered
