genus: Zhengheornis
parent: Avialae
etymology: '"Zhenghe" (Mandarin), for Zhenghe County where the holotype was
  found, + "ornis" (Greek), bird'
description: Zhengheornis is an extinct genus of basal avialan known from the
  Late Jurassic (Kimmeridgian–Tithonian ages) Nanyuan Formation of China. The
  genus contains a single species, Zhengheornis buyu, known from a partial
  skeleton with feather traces, preserved on a slab and counterslab.
locomotion: bipedal
diagnostic_features:
  - Short tail comprising 15 caudal vertebrae, shorter than the combined length
    of the femur, tibia, and metatarsal III
  - Final two caudal vertebrae box-like with bluntly convex caudal ends
  - Slender ischium with a knob-like, distally located obturator process and no
    posterior process
  - Manual phalanx III-1 shorter than manual phalanx III-2
  - Metatarsal I articulates with metatarsal II at its distal third-length
  - Short hallux with an ungual smaller than those of the other pedal digits
appearance:
  integument: feathered
identifiers:
  - source: wikidata
    id: Q140393555
species:
  - name: Zhengheornis buyu
    etymology: '"buyu" (Mandarin), unexpected, from the ancient Chinese book Guoyu,
      referring to the unique tail and pelvic morphologies'
    status: valid
    type_species: true
    period:
      name:
        - Late Jurassic
      stage:
        - Kimmeridgian
        - Tithonian
    location:
      country: CN
      region: CN-FJ
      locality: Yangyuan Village
      formation: Nanyuan
      part: lower
      notes: >
        Wang and colleagues (2026) place the holotype in layer six of the
        excavated section, above the layer that yielded Fujianvenator. In Xu
        and colleagues' (2023) log of that section, layer six lies above a
        tuffite dated 149.9 ± 1.1 Ma, Kimmeridgian on the ICS chart v2024/12,
        and the ignimbrite that overlies the fossil-bearing sediments is
        dated 148 ± 1.9 Ma, which is Tithonian. The "Tithonian stage" both
        papers give belongs to an older chart.
    type_specimen:
      specimen_id:
        - IVPP V34168
      specimen_type: holotype
      institution: IVPP
      material: Articulated and partially complete skeleton, with most limb bones
        preserved as molds, and feathers preserved on a slab and counter slab
    size:
      weight_kg:
        min: 0.0737
        max: 0.1625
    erected_in: wang2026a
references:
