genus: Zuniceratops
parent: Ceratopsoidea
pronunciation:
  phonetic: ZOO-nee-SER-a-tops
etymology: From Zuni, referring to the Zuni people of New Mexico near where the
  specimen was found, and Greek keratops meaning 'horned face'; thus 'Zuni
  horned face'
description: Zuniceratops is a genus of ceratopsian dinosaurs that lived during
  the Turonian stage of the Late Cretaceous in what is now New Mexico, United
  States. Only a single species is known, Zuniceratops christopheri.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Well-defined elongate post-orbital brow horns with flattened lateral margins
  - Vertical-shear wear pattern on dentary teeth
  - Single-rooted replacement teeth with one per file, lacking double-rooted
    dental batteries
  - Elongate frill with squamosal forming lateral and part of distal margin of
    parietal fenestra
  - Decurved ischium more curved than Centrosaurus but less than Triceratops
  - Gracile appendicular skeleton resembling protoceratopsids
  - Caudal extension of tooth row on maxilla beyond ascending process
appearance:
  features:
    - brow horns
  integument: scaled
  evidence: inferred
