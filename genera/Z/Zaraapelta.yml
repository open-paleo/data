genus: Zaraapelta
parent: Ankylosaurinae
etymology: "From Mongolian 'zaraa' meaning 'hedgehog', in reference to the prickly appearance of ankylosaurs, combined with Greek 'pelte' meaning 'small shield', a common component of ankylosaurian names referring to their body armour"
description: Zaraapelta is an extinct genus of herbivorous ankylosaurid
  thyreophoran dinosaur from the Late Cretaceous of Mongolia. The type species
  is Zaraapelta nomadis, named and described by Arbour et al in 2014. Zaraapelta
  is known from a single skull from the Barun Goyot Formation. It was found to
  be closest to Tarchia in the phylogenetic analysis within its description.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Squamosal horn with unique smooth-textured keel offset from rest of horn by
    distinct change to granular texture
  - Elaborate pattern of postocular caputegulae covering entire postocular
    region between squamosal and quadratojugal horns
  - Bulbous cranial ornamentation characteristic of ankylosaurine ankylosaurid
