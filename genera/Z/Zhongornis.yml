genus: Zhongornis
parent: Avialae
dispute:
  summary: >
    Zhongornis haoae is known from a single juvenile, and its position is
    uncertain. It was originally described as a basal avialan, the sister taxon of
    Pygostylia (Gao et al., 2008), and is recovered near the base of Avialae by
    Hartman et al. (2019); a restudy by O'Connor and Sullivan reinterpreted it as
    the sister taxon of Scansoriopterygidae. It is placed conservatively at Avialae
    incertae sedis.
  history:
    - date: "2026-07-01"
      note: Moved from Paraves to Avialae incertae sedis following the basal-avialan hypothesis (Gao et al., 2008; Hartman et al., 2019); the juvenile holotype and the scansoriopterygid-sister alternative are noted.
pronunciation:
  phonetic: JOHNG-or-nis
etymology: From Chinese zhong meaning 'intermediate' or 'middle' and Greek ornis meaning 'bird'; translates as 'intermediate bird,' referring to its transitional morphology
description: Zhongornis is a genus of primitive maniraptoran dinosaurs that
  lived during the Early Cretaceous. It was found in rocks of the Yixian
  Formation in Lingyuan City (China), and described by Gao et al. in 2008.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
  - forested
diagnostic_features:
  - Edentulous jaws
  - 13–14 differentiated caudal vertebrae
  - Strut-like and proximally expanded coracoid
  - Imperforate humeral deltopectoral crest
  - Manual phalangeal formula 2-3-3-x-x with largest claw on digit I
  - Unreduced clawed digit III with three phalanges, unique among birds
