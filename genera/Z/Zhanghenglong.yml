genus: Zhanghenglong
parent: Hadrosauromorpha
etymology: Named after Zhang Heng, the first-century Chinese scientist, combined with Mandarin long (龙), meaning 'dragon'; thus 'Zhang Heng's dragon'
pronunciation:
  phonetic: jahng-huhng-long
description: Zhanghenglong is an extinct genus of herbivorous hadrosauroid
  iguanodont dinosaur known from the Late Cretaceous (middle Santonian stage)
  Majiacun Formation in Xixia County of Henan Province, China. It contains a
  single species, Zhanghenglong yangchengensis, represented by a disarticulated
  and partial cranium and postcranial skeleton.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Posterior third of maxilla strongly deflected posteroventrally relative to
    anterior two-thirds
  - Dentary tooth crowns with both median and distally offset primary ridges
  - Five maxillary foramina (four small scattered ones and one large one)
  - Markedly convex dorsally maxillary and dentary occlusal surfaces
  - Relatively long, well-developed ectopterygoid ridge
  - Laterally exposed large anterior foramen in anterior half of anterodorsal
    surface of maxilla
appearance:
  integument: scaled
  evidence: inferred
