genus: Zuoyunlong
parent: Hadrosauroidea
etymology: "Named for Zuoyun County in Shanxi, China, where the fossils were discovered, combined with Chinese 'long' meaning 'dragon'."
description: Zuoyunlong is an extinct genus of herbivorous ornithopod dinosaur
  belonging to the Hadrosauroidea that lived during the Late Cretaceous in the
  area of present China.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
diagnostic_features:
  - Very short postacetabular process about 50% as long as iliac central plate
    (unique autapomorphy)
  - Relatively long, stick-shaped pubic peduncle of ilium
  - Ischial peduncle of ilium formed by single large knob
  - Modest lateral swelling along dorsal edge of ilium, approximately 90% length
    of central plate
  - Apex of lateral swelling located dorsal and slightly caudal to caudal end of
    ischial peduncle
  - Elongate, subtriangular distal boot of ischium that is ventrally directed
    with pointed extremity
