      specimen_type: holotype
      institution: SXMG
      material: Nearly complete right ilium and distal end of right ischium. Ilium
        62cm long, missing most preacetabular process. Ischium distal boot elongate,
        subtriangular, ventrally directed.
      completeness: fragmentary
    size:
