genus: Zizhongosaurus
parent: Sauropoda
pronunciation:
  phonetic: DZUH-JUNG-o-SAWR-us
etymology: Named after Zizhong County in Sichuan Province, China where it was
  found, combined with Greek sauros meaning 'lizard'; translates as 'Zizhong
  lizard'
description: Zizhongosaurus is a genus of basal herbivorous sauropod dinosaur
  which lived in the Early Jurassic (Toarcian) Period of China. It was a
  large-bodied herbivore characterized by a long neck.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - lacustrine
diagnostic_features:
  - Small primitive sauropod with relatively long anterior limbs
  - Humerus with straight and rounded shaft
  - Dorsal vertebrae with high neural spine with apex as expanded plate
    descending slightly anteriorly and concave posteriorly
  - Lateral spine surface ornamented with dorsally radiating vertical striations
  - Well-developed diapophyses forming right angle with neural spine at neural
    arch
  - Hyposphene present
