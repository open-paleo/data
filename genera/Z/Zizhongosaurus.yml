genus: Zizhongosaurus
parent: Sauropoda
pronunciation:
  phonetic: DZUH-JUNG-o-SAWR-us
etymology: Named after Zizhong County in Sichuan Province, China where it was
  found, combined with Greek sauros meaning 'lizard'; translates as 'Zizhong
  lizard'
description: Zizhongosaurus is a genus of basal herbivorous sauropod dinosaur
  which lived in the Early Jurassic (Toarcian) Period of China. It was a
  large-bodied herbivore characterized by a long neck.
diet: herbivore
locomotion: quadrupedal
