genus: Zhuchengtitan
parent: Opisthocoelicaudiinae
etymology: Named after Zhucheng, Shandong Province, China where it was found,
  combined with Greek titan meaning 'giant'; translates as 'Zhucheng titan'
pronunciation:
  phonetic: JOO-chang-TIE-tuhn
description: Zhuchengtitan is a genus of titanosaurian sauropod dinosaur from
  the Late Cretaceous of Shandong, China. It contains a single species, Z.
  zangjiazhuangensis, named by Mo Jinyou and colleagues in 2017 from a single
  humerus. Zhuchengtitan can be identified by the extreme width of the top end
  of its humerus, as well as the expansion of the deltopectoral crest on its
  humerus; both of these characteristics indicate that it was likely closely
  related to Opisthocoelicaudia. However, it differs from the latter by the
  flatter bottom articulating surface of its humerus. Zhuchengtitan lived in a
  floodplain environment alongside Shantungosaurus, Zhuchengtyrannus, and
  Sinoceratops.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Proximal portion strongly expanded transversely, maximum width reaching 55%
    of shaft length
  - Humeral shaft extremely robust with robustness index (RI) of 0.39
  - Deltopectoral crest expands distally and deflects medially to reach 2/5 of
    bone length
  - Prominent lateral convexity on outer proximal one-third of lateral margin
  - Mid-shaft cross-section elliptical with long axis oriented mediolaterally
