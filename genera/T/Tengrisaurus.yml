genus: Tengrisaurus
parent: Lithostrotia
etymology: Named after Tengri, the sky deity of Mongolian/Siberian mythology,
  combined with Greek sauros, "lizard" - means "Tengri lizard"
pronunciation:
  phonetic: TEN-gree-SOR-us
description: Tengrisaurus is an extinct genus of titanosaurian sauropod dinosaur
  known from the Early Cretaceous (Valanginian) Murtoi Formation of Russia. The
  genus was described in 2017 by Averianov and Skutschas, containing a single
  species, Tengrisaurus starkovi, known from several isolated vertebrae. Despite
  being among the oldest named definitive titanosaurs, it is an anatomically
  derived member of the clade Colossosauria.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Strongly procoelous anterior and middle caudal vertebrae
  - Horizontal, anteriorly directed prezygapophyses on anterior caudals
  - Pre-epipophyses projecting anteriorly beyond prezygapophyseal articular
    surfaces
  - Divided interprezygapophyseal lamina of anterior caudal vertebrae
  - Postzygapophyses positioned well posterior to anterior end of middle caudal
    centrum
  - Neural spine directed posterodorsally or posteriorly in anterior and middle
    caudals
  - Solid bone structure of caudal centra (cells 1-3 mm)
