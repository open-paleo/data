genus: Tengrisaurus
parent: Lithostrotia
etymology: Named after Tengri, the sky deity of Mongolian/Siberian mythology, combined with Greek sauros, "lizard" — means "Tengri lizard"
description: Tengrisaurus is an extinct genus of titanosaurian sauropod dinosaur
  known from the Early Cretaceous (Valanginian) Murtoi Formation of Russia. The
  genus was described in 2017 by Averianov & Skutschas, containing a single
  species, Tengrisaurus starkovi, known from several isolated vertebrae. Despite
  being among the oldest named definitive titanosaurs, it is an anatomically
  derived member of the clade Colossosauria.
diet: herbivore
locomotion: quadrupedal
