genus: Tromerosaurus
parent: Albertosaurinae
etymology: From Greek 'tromeros' (terrible or frightful) and 'sauros' (lizard),
  for its mix of traits shared with Gorgosaurus and Daspletosaurus.
description: Tromerosaurus is an extinct genus of tyrannosaurid theropod
  dinosaur known from the Late Cretaceous (Campanian age) of Canada. The genus
  contains a single species, Tromerosaurus solumons, known from at least three
  partial skulls and skeletons. Previous work had regarded one of these,
  deriving from the Oldman Formation, as belonging to Daspletosaurus, and two of
  them, from the Dinosaur Park Formation, as belonging to the closely related
  Gorgosaurus. A placement within the subfamily Albertosaurinae is preferred,
  though some anatomical features of Tromerosaurus are reminiscent of
  tyrannosaurines.
diet: carnivore
locomotion: bipedal
diagnostic_features:
  - A ventromedially oriented prong on the vomeropterygoid process of the
    palatine
  - A strongly arched pterygoid contact surface on the vomeropterygoid process
    of the palatine
  - The supraoccipital is excluded from the foramen magnum
  - The pila promaxillaris of the maxilla is medially inset from the osseous
    wall of the antorbital fossa
  - The maxillary fenestra approaches the anterior margin of the antorbital fossa
  - A concave posterodorsal margin on the orbital process of the lacrimal
