genus: Tromerosaurus
parent: Albertosaurinae
etymology: From Greek 'tromeros' (terrible or frightful) and 'sauros' (lizard),
  for its mix of traits shared with Gorgosaurus and Daspletosaurus.
diet: carnivore
locomotion: bipedal
diagnostic_features:
  - A ventromedially oriented prong on the vomeropterygoid process of the
    palatine
  - A strongly arched pterygoid contact surface on the vomeropterygoid process
    of the palatine
  - The supraoccipital is excluded from the foramen magnum
  - The pila promaxillaris of the maxilla is medially inset from the osseous
    wall of the antorbital fossa
  - The maxillary fenestra approaches the anterior margin of the antorbital fossa
  - A concave posterodorsal margin on the orbital process of the lacrimal
identifiers:
  - source: wikidata
    id: Q141622283
species:
  - name: Tromerosaurus solumons
    etymology: From Latin 'solus' (lonely) and 'mons' (mountain), for the
      lacrimal horn isolated by a broad flat shelf of the lacrimal's posterior
      process; it also alludes to the lair of the dragon Smaug in The Hobbit.
    status: valid
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Campanian
    location:
      country: CA
      locality: Quarry Q258, Dinosaur Provincial Park
      region: CA-AB
      formation: Oldman
      notes: The describing paper places the quarry "4 meters below the
        nearest measured Oldman-Dinosaur Park Formation contact", in a massive
        yellow-stained sandstone below the field station bentonite.
    type_specimen:
      specimen_id:
        - UALVP 52981
      specimen_type: holotype
      institution: UALVP
      material: Partial skeleton of a mature individual with most skull bones
        (lacking the splenials, the right postorbital-squamosal and
        quadratojugal-quadrate complexes, and the right mandible), presacral
        vertebrae, gastralia, both humeri, the complete pelvis and the right
        hindlimb.
      completeness: partial
    erected_in: powers2026a
