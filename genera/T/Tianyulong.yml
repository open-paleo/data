genus: Tianyulong
parent: Heterodontosauridae
etymology: From 'Tianyu' (the Shandong Tianyu Museum of Nature in Pingyi,
  where the holotype is housed) and Mandarin Chinese 'long' (dragon).
description: Tianyulong is an extinct genus of heterodontosaurid ornithischian
  dinosaur from Jianchang County, western Liaoning Province, China. The single
  species, Tianyulong confuciusi, is known from a small (~70 cm) subadult
  skeleton (STMN 26-3) preserving partial cranium, postcranial skeleton, and
  three patches of filamentous integumentary structures along the neck, back,
  and tail. Zheng, You, Xu and Dong (2009) originally assigned the holotype
  to the Early Cretaceous Yixian Formation of the Jehol Group, but subsequent
  reassignment of the source horizon places it in the Middle-Late Jurassic
  Tiaojishan Formation. The filaments are unbranched, hollow, apparently
  rigid singular structures up to ~60 mm long; the authors did not claim
  homology with theropod protofeathers, noting closer morphological similarity
  to Psittacosaurus bristles and treating convergent acquisition as the
  default interpretation. Tianyulong is recovered as the basalmost
  well-known heterodontosaurid in the original phylogenetic analysis.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Semi-circular diastema demarcated on the lateral surface at the
    premaxilla-maxilla junction.
  - Barely developed buccal emargination.
  - Dorsally placed mandibular jaw joint positioned well above the level of the
    dentary tooth row.
  - Only one premaxillary tooth, which is caniniform.
  - Distinct gap between the dentary teeth and coronoid process.
  - Adjacent maxillary and dentary tooth crowns distinctly separate, lacking
    mesial and distal marginal denticles and ridges on the buccal surfaces.
