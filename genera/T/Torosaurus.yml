genus: Torosaurus
parent: Chasmosaurinae
pronunciation:
  phonetic: TOR-o-SAWR-us
etymology: From Greek toros, "perforated" or "full of holes", combined with Greek sauros, "lizard" — means "perforated lizard", in reference to the large openings in its frill
description: Torosaurus is a genus of herbivorous chasmosaurine ceratopsian
  dinosaur that lived during the late Maastrichtian age of the Late Cretaceous
  period, between 68 and 66 million years ago, though it is possible that the
  species range might extend to as far back as 69 million years ago. Fossils
  have been discovered across the Western Interior of North America, from as far
  north as Saskatchewan to as far south as Texas.
dispute:
  summary: >
    Whether Torosaurus is a valid genus or the fully mature growth stage of
    Triceratops is contested. Scannella and Horner (2010) argued from frill
    ontogeny and bone histology that all known Torosaurus skulls are senescent
    Triceratops, formally synonymizing the two. Longrich (2011) and Longrich and
    Field (2012) rejected the synonymy on the absence of transitional forms, and
    Maiorino and colleagues (2013) on morphometric grounds. Mallon and colleagues
    (2022) described a Torosaurus they judged a late subadult or early adult (EM
    P16.1) and concluded that the evidence weighs in favor of two genera, while
    noting that younger Torosaurus are needed to reject the synonymy outright. A
    phylogenetic analysis by Dalman and colleagues (2022) recovered Torosaurus
    latus outside the clade containing the Triceratops species. No broad
    consensus has been reached.
  history:
    - date: "2026-06-26"
      note: Placed at Chasmosaurinae, the least-inclusive clade accepted whether Torosaurus is a distinct triceratopsin or mature Triceratops; tribes dropped. Validity unresolved.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Posterior crest perforated by pair of large supra-temporal fontanelles in
    parietals
  - Squamosal bones very long and slender, showing sutures only near distal ends
  - Main horn-cores placed well back of orbit
  - Nasal horn-core short with compressed apex directed forward
appearance:
  features:
    - neck frill
    - brow horns
    - nasal horn
    - keratinous beak
  integument: scaled
  evidence: inferred
