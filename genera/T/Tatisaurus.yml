genus: Tatisaurus
parent: Thyreophora
pronunciation:
  phonetic: DAH-DEE-SAWR-us
etymology: From 'Ta Ti' (Da Di), the name of the village in Yunnan Province, China near where the fossil was found, plus Greek sauros ('lizard')
description: Tatisaurus is a genus of ornithischian dinosaur from the Early
  Jurassic from the Lower Lufeng Formation in Yunnan Province in China. Little
  is known as the remains are fragmentary. The type species is T. oehleri.
dispute:
  summary: >
    Tatisaurus is a nomen dubium based on fragmentary jaw material from
    the Early Jurassic of China, regarded as an indeterminate basal
    thyreophoran and possibly synonymous with Bienosaurus (Raven and
    others, 2019; Jones, 2026).
  history:
    - date: "2026-06-29"
      note: Retained at Thyreophora incertae sedis; nomen dubium, possibly synonymous with Bienosaurus.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
appearance:
  integument: armored
  evidence: inferred
identifiers:
  - source: pbdb
    id: "56446"
  - source: wikidata
    id: Q1955108
  - source: gbif
    id: "4823156"
species:
  - name: Tatisaurus oehleri
    etymology: "Named for Father Edgar Oehler, the Catholic priest who excavated the fossils near Da Di village in Yunnan, China, in 1948 and 1949."
    status: nomen dubium
    type_species: true
    period:
      name:
        - Early Jurassic
      stage:
