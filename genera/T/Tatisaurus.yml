genus: Tatisaurus
parent: Thyreophora
placement: incertae sedis
pronunciation:
  phonetic: DAH-DEE-SAWR-us
etymology: From 'Ta Ti' (Da Di), the name of the village in Yunnan Province, China near where the fossil was found, plus Greek sauros ('lizard')
description: Tatisaurus is a genus of ornithischian dinosaur from the Early
  Jurassic from the Lower Lufeng Formation in Yunnan Province in China. Little
  is known as the remains are fragmentary. The type species is T. oehleri.
dispute:
  summary: >
    Tatisaurus is a nomen dubium based on fragmentary jaw material from the
    Early Jurassic of China. Simmons (1965) allied it with primitive
    hypsilophodonts; Norman and colleagues (2007) refer it to Thyreophora on
    a single character, the ventral deflection of the front of the dentary
    tooth row, and Irmis and Knoll (2008) treat it as an indeterminate
    thyreophoran. Raven and colleagues (2019) note it may be the same taxon
    as Bienosaurus, but that this cannot be determined.
  history:
    - date: "2026-06-29"
      note: Retained at Thyreophora incertae sedis; nomen dubium, possibly synonymous with Bienosaurus.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
appearance:
  integument: armored
  evidence: inferred
identifiers:
  - source: pbdb
    id: "56446"
  - source: wikidata
    id: Q1955108
  - source: gbif
    id: "4823156"
species:
  - name: Tatisaurus oehleri
    etymology: "Named for Father Edgar Oehler, the Catholic priest who excavated the fossils near Da Di village in Yunnan, China, in 1948 and 1949."
    status: nomen dubium
    type_species: true
    period:
      name:
        - Early Jurassic
      stage:
        - Sinemurian
    location:
      country: CN
      region: CN-YN
      formation: Lufeng
      member: Zhangjiawa
      locality: Ta Ti
    type_specimen:
      specimen_id: [FMNH CUP 2088]
      specimen_type: holotype
      institution: FMNH
      material: A partial left dentary (about 60 mm long, with 18 alveoli) bearing
        fragments of the quadrate and surangular-articular on its medial surface.
      completeness: fragmentary
    erected_in: simmons1965a
    described_in: norman2007a
references:
  - id: simmons1965a
    notes: Named Tatisaurus and allied it with primitive hypsilophodonts.
  - id: norman2007a
    notes: Redescription of Tatisaurus oehleri as a nomen dubium, referred to
      Thyreophora on the ventral deflection of the dentary tooth row.
  - id: raven2019a
    notes: Notes Tatisaurus may be the same taxon as Bienosaurus, but that this
      cannot be determined.
  - id: jones2026a
    notes: Treats Tatisaurus as a nomen dubium, possibly a synonym of
      Bienosaurus.
  - id: irmis2008a
    notes: Treats Tatisaurus and Bienosaurus as two indeterminate thyreophorans.
