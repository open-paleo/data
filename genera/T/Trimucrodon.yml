genus: Trimucrodon
parent: Ornithischia
placement: incertae sedis
pronunciation:
  phonetic: try-MYOO-kro-don
etymology: From Latin tri- ('three') and mucro ('dagger point' or 'sharp tip'),
  and Greek odous ('tooth'), meaning 'three-pointed tooth', referring to the
  tricuspid teeth
description: Trimucrodon is a genus of ornithischian dinosaur from the Late
  Jurassic Lourinhã Formation of Portugal. The type, and currently only, species
  is T. cuneatus.
dispute:
  summary: >
    Trimucrodon cuneatus is based on three isolated tricuspid teeth — one
    designated as the holotype — from the Late Jurassic of Portugal, and its
    validity is contested. Thulborn (1973) diagnosed it on tooth-crown
    characters, notably the strongly divergent, prominent foremost and
    hindmost marginal denticles, and referred it to the now-abandoned
    Fabrosauridae. Weishampel and Witmer (1990) treated it as a nomen dubium,
    an indeterminate ornithischian outside Ornithopoda. Sereno (1991)
    declined that assessment — made, he noted, without comparison — and
    considered the taxon poorly established but distinct on its denticle
    pattern, placing it at Ornithischia incertae sedis. Weishampel et al.
    (2004) again regarded it as dubious while allowing that further study
    could support its validity, and Jones (2026) treats it as an
    indeterminate ornithischian. It is placed conservatively at Ornithischia
    incertae sedis.
  history:
    - date: "2026-06-29"
      note: Placed at Ornithischia incertae sedis; tooth-based nomen dubium.
    - date: "2026-07-20"
      note: Dispute rebalanced against primary sources — Sereno (1991)
        considered it possibly valid and distinct, against the nomen-dubium
        treatments of Weishampel and Witmer (1990), Weishampel et al. (2004),
        and Jones (2026).
