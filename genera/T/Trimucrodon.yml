genus: Trimucrodon
parent: Ornithischia
pronunciation:
  phonetic: try-MYOO-kro-don
etymology: From Latin tri- ('three') and mucro ('dagger point' or 'sharp tip'),
  and Greek odous ('tooth'), meaning 'three-pointed tooth', referring to the
  tricuspid teeth
description: Trimucrodon is a genus of ornithischian dinosaur from the Late
  Jurassic Lourinhã Formation of Portugal. The type, and currently only, species
  is T. cuneatus.
dispute:
  summary: >
    Trimucrodon is a nomen dubium based on isolated teeth from the Late
    Jurassic of Portugal, treated as an indeterminate ornithischian
    (Jones, 2026). It was formerly assigned to the deprecated
    Fabrosauridae.
  history:
    - date: "2026-06-29"
      note: Placed at Ornithischia incertae sedis; tooth-based nomen dubium.
