genus: Traukutitan
parent: Lognkosauria
etymology: From Mapuche/Araucanian Trauku (a mountain spirit usually represented
  as a giant) and Greek titan ('giant'), meaning 'Trauku titan'
pronunciation:
  phonetic: TRAW-cu-TIE-tuhn
description: Traukutitan is a genus of titanosaur sauropod dinosaur which lived
  during the late Cretaceous (Santonian age).
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - arid
diagnostic_features:
  - Proximal caudal vertebral centra higher than wider, with strongly procoelous
    center
  - Prezygodiapophyseal lamina subvertical, with ventrocaudal placement of
    transverse process at first caudal
  - Single deep foramen ventral to base of transverse process
  - Middle caudal vertebrae wider than length, with procoelous-opisthoplatyan
    centra
appearance:
  integument: scaled
  evidence: inferred
