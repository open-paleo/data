genus: Tongtianlong
parent: Citipatiinae
etymology: "Combines a reference to the nearby Tongtianyan grotto in Jiangxi, China, with Chinese 'long' meaning 'dragon'; 'Tongtian' also means 'road to heaven' in Chinese."
pronunciation:
  phonetic: TONG-tee-YEN-long
description: Tongtianlong is a genus of oviraptorid theropod dinosaurs that
  lived in the late Maastrichtian epoch of the late Cretaceous period. It
  contains one species, T. limosus.
diet: omnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Dome-like skull roof with highest point above posterodorsal corner of orbit
  - Anterior margin of premaxilla highly convex in lateral view
  - Plate-like lacrimal shaft that is anteroposteriorly long with flat lateral
    surface
  - Distinct process at middle of anterior margin of parietal on skull roof
  - Foramen magnum smaller than occipital condyle
  - Absence of symphyseal ventral process of dentary
appearance:
  features:
    - keratinous beak
  integument: feathered
  evidence: direct
identifiers:
  - source: pbdb
    id: "347523"
species:
  - name: Tongtianlong limosus
    etymology: "From Latin 'limosus' meaning 'muddy', referring to how the holotype specimen was preserved in mudstone, with the specimen's unusual death pose speculatively interpreted as the animal having died while trapped in mud."
    status: valid
    type_species: true
    period:
