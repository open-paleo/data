genus: Tachiraptor
parent: Neotheropoda
etymology: "Named for Táchira, the Venezuelan state where the fossils were found, combined with Latin 'raptor' meaning 'thief' or 'plunderer'; meaning 'thief from Táchira.'"
pronunciation:
  phonetic: tah-shee-rap-tuh
description: Tachiraptor is a genus of carnivorous theropod dinosaurs found in
  the early Jurassic period La Quinta Formation of Venezuela. It includes one
  species, Tachiraptor admirabilis, described from a fossilized tibia and
  ischium. They were small bipedal dinosaurs, with a deduced total body length
  of just over 1.5 m (4.9 ft).
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Caudolateral corner of fibular condyle forms sharp angle in proximal view
    and extends slightly more caudally than medial condyle
  - Distal articulation of tibia more than 50% broader transversely than
    craniocaudally
  - Craniocaudally narrow astragalar buttress that remains of subequal breadth
    throughout its width, with laterally placed bend in the buttress
  - Line connecting outer and inner tibial malleoli in cranial view forms angle
    of approximately 80 degrees to long axis of bone
  - Fibular crest connected to proximal end by well-defined ridge, lacking
    tetanuran condition
