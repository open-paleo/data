genus: Tachiraptor
parent: Neotheropoda
etymology: The generic name was derived from that of the state of Táchira, where
  it was discovered, combined with the Latin word for thief, raptor. The
  specific name admirabilis was chosen in reference to the Admirable Campaign of
  1813, conducted by Simón Bolívar, for which the type locality of La Grita was
  of strategic importance.
description: Tachiraptor is a genus of carnivorous theropod dinosaurs found in
  the early Jurassic period La Quinta Formation of Venezuela. It includes one
  species, Tachiraptor admirabilis, described from a fossilized tibia and
  ischium. They were small bipedal dinosaurs, with a deduced total body length
  of just over 1.5 m (4.9 ft).
diet: carnivore
locomotion: bipedal
