genus: Tarchia
parent: Ankylosaurinae
pronunciation:
  phonetic: TAHRK-ee-a
etymology: From Mongolian tarkhi, "brain", combined with Latin suffix -ia -
  means "brainy one", referring to its presumed larger brain size compared to
  relatives
description: Tarchia is a genus of herbivorous ankylosaurid dinosaur from the
  late Cretaceous of Mongolia.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - arid
diagnostic_features:
  - Brain case exceptionally high, nearly twice the height of comparably-sized
    Saichania
  - Foramen magnum taller than wide, unlike other Mongolian ankylosaurids
  - Exoccipital high and short, perpendicular to skull roof
  - Occipital part of skull and condyle partly visible in dorsal view, shifted
    beyond roof
  - Single foramen for nerves IX-XII posterior to fenestra ovalis
  - Skull roof with numerous dorsally-positioned grooves, smooth elevated areas,
    bilaterally symmetrical ornamentation
  - Laterosphenoid completely fused to adjoining bones and postocular shelf
appearance:
  features:
    - tail club
    - body armor
    - osteoderms
    - squamosal horns
    - keratinous beak
  integument: armored
  evidence: direct
