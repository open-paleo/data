genus: Tarchia
parent: Ankylosaurinae
pronunciation:
  phonetic: TAHRK-ee-a
etymology: From Mongolian tarkhi, "brain", combined with Latin suffix -ia -
  means "brainy one", referring to its presumed larger brain size compared to
  relatives
description: Tarchia is a genus of herbivorous ankylosaurid dinosaur from the
  late Cretaceous of Mongolia.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - arid
diagnostic_features:
  - Fenestra ovalis and cranial nerves IX-XI exit through a single external
    opening, with two separate exits for cranial nerve XII
  - Accessory postorbital osteoderm fused to the skull roof
  - Squamosal horn separated from the supraorbital boss by a postorbital fossa,
    with the accessory osteoderm seated within that fossa
  - Large, deep braincase; foramen magnum taller than wide
  - Nuchal osteoderms taller laterally than medially
  - Occiput just visible in dorsal view and proportionally high in caudal view;
    postocular caputegulae absent
appearance:
  features:
    - tail club
    - body armor
    - osteoderms
    - squamosal horns
    - keratinous beak
  integument: armored
  evidence: direct
