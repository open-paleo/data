genus: Tarchia
parent: Ankylosaurinae
pronunciation:
  phonetic: TAHRK-ee-a
etymology: From Mongolian tarkhi, "brain", combined with Latin suffix -ia -
  means "brainy one", referring to its presumed larger brain size compared to
  relatives
description: Tarchia is a genus of herbivorous ankylosaurid dinosaur from the
  late Cretaceous of Mongolia.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - arid
diagnostic_features:
  - Fenestra ovalis and cranial nerves IX-XI exit through a single external
    opening, with two separate exits for cranial nerve XII
  - Accessory postorbital osteoderm fused to the skull roof
  - Squamosal horn separated from the supraorbital boss by a postorbital fossa,
    with the accessory osteoderm seated within that fossa
  - Large, deep braincase; foramen magnum taller than wide
  - Nuchal osteoderms taller laterally than medially
  - Occiput just visible in dorsal view and proportionally high in caudal view;
    postocular caputegulae absent
appearance:
  features:
    - tail club
    - body armor
    - osteoderms
    - squamosal horns
    - keratinous beak
  integument: armored
  evidence: direct
identifiers:
  - source: pbdb
    id: "38836"
  - source: wikidata
    id: Q135304
  - source: gbif
    id: "4823321"
  - source: eol
    id: "4530864"
species:
  - name: Tarchia kielanae
    etymology: Named for Professor Zofia Kielan-Jaworowska, the leader of the
      Polish-Mongolian expedition that discovered the holotype skull in 1970.
    status: valid
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Campanian
    location:
      country: MN
      locality: Khulsan, Central Cliffs, site 6
      region: MN-053
      formation: Baruungoyot
      coordinates:
        - 43.50032
        - 101.130188
    type_specimen:
      specimen_id:
        - ZPAL MgD-I/111
      specimen_type: holotype
      institution: ZPAL
      material: Partial skull preserving most of one side of the postfrontal skull
        roof, including the sagittal midline and the braincase
      completeness: fragmentary
    size:
      hip_height_m:
        min: 1.1
        max: 1.1
      length_m:
        min: 5.5
        max: 5.5
      weight_kg:
        min: 2500
        max: 3000
    erected_in: maryańska1977a
    described_in: penkalski2016a
  - name: Tarchia teresae
    etymology: Honors Teresa Maryańska, in recognition of her work on Asian
      dinosaurs.
    status: valid
    type_species: false
    period:
      name:
        - Late Cretaceous
      stage:
        - Maastrichtian
    location:
      country: MN
      region: MN-053
      formation: Nemegt
      locality: Hermiin Tsav I
    type_specimen:
      specimen_id:
        - PIN 3142/250
      specimen_type: holotype
      institution: PIN
      material: Skull, mandibles, and postcranial material.
    diagnostic_features:
      - Accessory postorbital osteoderm not fused to the skull roof (fused in T.
        kielanae).
      - Quadrate and paroccipital process unfused.
      - Skull roof over the postfrontal region deeply sculptured.
      - Large, bifurcated opening for cranial nerves IX-XII.
    erected_in: penkalski2017a
  - name: Tarchia tumanovae
    etymology: Honors Tatiana Tumanova, for her contributions to understanding
      Mongolian ankylosaurs.
    status: valid
    type_species: false
    period:
      name:
        - Late Cretaceous
      stage:
        - Maastrichtian
    location:
      country: MN
      region: MN-053
      formation: Nemegt
      locality: Hermiin Tsav
    type_specimen:
      specimen_id:
        - MPC-D 100/1353
      specimen_type: holotype
      institution: MPC
      material: Well-preserved skull; dorsal, sacral, and caudal vertebrae; sixteen
        dorsal ribs; ilia; a partial ischium; free osteoderms; and a tail club.
    diagnostic_features:
      - Single, relatively bulbous internarial caputegulum that does not reach
        the rostral tip of the beak.
      - Basioccipital foramen moderate-sized (unlike T. kielanae and T. teresae).
      - Quadrate-quadratojugal region situated anteriorly (unlike T. teresae).
      - Quadrate unfused to the exoccipital (fused in T. kielanae).
      - Interpterygoid vacuity visible in occipital view (not visible in T.
        teresae).
    erected_in: park2021a
references:
  - id: maryańska1977a
  - id: penkalski2016a
    notes: Redescribes the holotype skull of Tarchia kielanae and provides a revised
      cranial diagnosis, confirming it as valid and distinct from Saichania and
      Minotaurasaurus.
  - id: jones2026a
    notes: Source of the hip height estimate, and the appearance features.
  - id: penkalski2017a
    notes: Revises the cranial morphology and taxonomic status of Tarchia and
      erects T. teresae on PIN 3142/250 from the Nemegt Formation of Mongolia.
  - id: park2021a
    notes: Erects Tarchia tumanovae on the partial skeleton MPC-D 100/1353 from
      the Nemegt Formation (Hermiin Tsav) of Mongolia.
