genus: Tanycolagreus
parent: Coelurosauria
dispute:
  summary: >
    The placement of Tanycolagreus is unsettled. It is frequently recovered near
    the base of Tyrannosauroidea, sometimes with Coelurus in a reduced Coeluridae
    (Hartman et al., 2019; Jones et al., 2026); Cau (2024) recovered it within
    Tyrannosauroidea, while Delcourt et al. (2025), under implied weights,
    recovered it among the earliest-branching Maniraptoromorpha with Santanaraptor
    and Mirischia. It is placed conservatively at Coelurosauria incertae sedis.
  history:
    - date: "2026-07-01"
      note: Placed at Coelurosauria incertae sedis (least-inclusive uncontested clade); basal-Tyrannosauroidea/Coeluridae and earliest-maniraptoromorph hypotheses proposed. Coeluridae not adopted as a node.
pronunciation:
  phonetic: tan-ee-KOL-uh-gree-us
etymology: "From Greek 'tany' meaning 'long' or 'stretched out', 'kolon' meaning
  'limb', and 'agreus' meaning 'hunter', referring to the greater length of its
  forelimbs and hindlimbs compared to Coelurus"
description: Tanycolagreus is a genus of coelurosaurian theropod dinosaur from
  the Late Jurassic (Kimmeridgian to Tithonian) of the U.S. states of Wyoming,
  Utah, and Colorado.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Short, deep-bodied premaxilla with narial foramen at base of nasal process
  - T-shaped quadratojugal
  - Centrodiapophyseal lamina on dorsals
  - Absence of pleurocoel on anterior dorsals
  - Posterior caudal prezygapophyses elongated to approximately one-third
    centrum length
  - Straight humeral shaft
