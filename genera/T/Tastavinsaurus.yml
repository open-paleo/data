genus: Tastavinsaurus
parent: Somphospondyli
dispute:
  summary: >
    Tastavinsaurus is most often recovered as a basal somphospondylan (D'Emic,
    2012; Mocho et al., 2023; Mayer et al., 2026; Jones, 2026), though a
    minority of analyses place it more stemward as a basal macronarian, and it
    was formerly the basis of the now-rejected clade Laurasiformes.
  history:
    - date: "2026-06-30"
      note: >
        Placed at Somphospondyli following the current majority view; the
        basal macronarian alternative is noted.
pronunciation:
  phonetic: tas-tuh-VIN-SAWR-us
etymology: Named in honor of the Rio Tastavins in Spain, where the fossils were found.
description: Tastavinsaurus is a genus of sauropod dinosaur belonging to the
  Titanosauriformes. It is based on a partial skeleton from the Early Cretaceous
  Xert Formation of Spain. The type species is Tastavinsaurus sanzi, named in
  honor of the Rio Tastavins in Spain and Spanish paleontologist José Luis Sanz.
  The genus is known from two specimens, one from the Xert Formation and one
  from the Forcall Formation. Tastavinsaurus was originally described as a
  somphospondylan, but it may be a brachiosaurid. The clade Laurasiformes was
  coined for Tastavinsaurus and its close relatives, which may include
  Cedarosaurus, Soriatitan, and Venenosaurus.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - coastal
diagnostic_features:
  - Caudalmost thoracic vertebra with postspinal process possessing two small
    accessory laminae at its base
  - Interior of thoracic vertebral body constructed of big prismatic tubes
    forming honeycomb pattern in cross-section
  - Sacricostal yoke ventrolateral to the vertebral bodies
  - Postspinal fossae bounded by caudal zygapophyses and spinopostzygapophyseal
    lamina on first eight caudal vertebrae
  - Ischium:pubis length ratio 0.70
  - Cranioventral corner of distal extremity of pubis acute
  - Lateral end of cnemial crest of tibia splits into two thin vertical crests
    separated by shallow wide groove
  - Cranial trochanter of fibula well developed, forming crest that projects
    craniomedially
  - Metatarsal I with robustness index value of 1.0
  - Proximal end of metatarsal II 30 percent greater in area than metatarsal I
