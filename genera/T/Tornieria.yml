genus: Tornieria
parent: Diplodocinae
pronunciation:
  phonetic: tor-NEER-ee-a
etymology: Named in honor of German zoologist Gustav Tornier
description: Tornieria is a genus of diplodocid sauropod dinosaur from the Late
  Jurassic in Lindi Region of Tanzania.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - coastal
diagnostic_features:
  - Mid- and posterior cervical neural arches with the centroprezygapophyseal
    lamina dorsally divided into a lateral and a medial lamina, the medial lamina
    joining the interprezygapophyseal lamina rather than the prezygapophysis
  - Base of the notch between the metapophyses of the anterior bifid dorsal
    vertebrae wide and rounded
  - Posterior border of the sternal plate straight
  - Ischium with the pubic articulation 1.5 times or more the anteroposterior
    length of its pubic pedicel
  - Distal femoral condyles expanding onto the anterior part of the femoral shaft
appearance:
  features:
    - elongate neck
    - whiplash tail
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "38695"
  - source: wikidata
    id: Q1579853
  - source: gbif
    id: "3239002"
  - source: eol
    id: "47459353"
synonyms:
