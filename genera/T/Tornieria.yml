genus: Tornieria
parent: Diplodocinae
pronunciation:
  phonetic: tor-NEER-ee-a
etymology: Named in honor of German zoologist Gustav Tornier
description: Tornieria is a genus of diplodocid sauropod dinosaur from the Late
  Jurassic in Lindi Region of Tanzania.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - coastal
diagnostic_features:
  - Extraordinarily great similarity to American sauropods Morosaurus and
    Diplodocus; more distant from Indian, European, and Madagascan species
  - Geologically youngest member of sauropod group, preserved in Upper
    Cretaceous Makonde beds when sauropods were otherwise extinct
  - Long-legged form; distinguishable from more robust G. robustus species
