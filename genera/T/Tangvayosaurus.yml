genus: Tangvayosaurus
parent: Euhelopodidae
pronunciation:
  phonetic: tahng-VIE-o-SAWR-us
etymology: Named after Tang Vay, the locality in Savannakhet Province, Laos, where it was found, combined with Greek sauros, "lizard" - means "Tang Vay lizard"
description: Tangvayosaurus is a genus of sauropod dinosaur from the Lower
  Cretaceous (Aptian to Albian ages) Grès supérieurs Formation of Savannakhet
  Province, Laos. It was a basal somphospondylan, measuring about 15 m (49 ft)
  long, and is known from the remains of two or three individuals.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Approximately 15 m long titanosaur
  - Posterior dorsal vertebrae with unforked neural spines
  - Neural arches positioned anteriorly in mid- and posterior caudal centra
  - Caudal vertebrae amphicoelous
  - Puboischial contact deep dorsoventrally
  - Ischial distal shafts dorsoventrally flattened and nearly coplanar
  - Ischium/pubis length ratio less than 0.9
  - Femur with proximal one-third of shaft deflected medially
  - Fibular condyle located medially relative to lateral femoral margin
  - Tibia with extremely expanded proximal extremity, more than twice as long
    transversely as anteroposteriorly
