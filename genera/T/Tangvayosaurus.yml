genus: Tangvayosaurus
parent: Euhelopodidae
etymology: Tang Vay lizard
description: Tangvayosaurus is a genus of sauropod dinosaur from the Lower
  Cretaceous (Aptian to Albian ages) Grès supérieurs Formation of Savannakhet
  Province, Laos. It was a basal somphospondylan, measuring about 15 m (49 ft)
  long, and is known from the remains of two or three individuals.
diet: herbivore
