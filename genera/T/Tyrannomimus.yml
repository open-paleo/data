genus: Tyrannomimus
parent: Deinocheiridae
etymology: "From Latin 'tyrannus' meaning 'tyrant' and Latin 'mimus' meaning 'mimic', referring to its morphological similarities with tyrannosauroids."
pronunciation:
  phonetic: ty-RAN-o-MY-mus
description: Tyrannomimus is an extinct genus of ornithomimosaurian theropod
  dinosaurs from the Early Cretaceous (Aptian age) Kitadani Formation of Japan.
  The type species is Tyrannomimus fukuiensis.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Deep dorsal tympanic recess with bottom subdivided by
    anteroposteriorly-oriented lamina
  - Expanded spherical cavities within prezygocentrodiapophyseal,
    centrodiapophyseal and postzygocentrodiapophyseal fossae
  - Deltopectoral crest shorter than quarter of humeral length
  - Muscle scar on anterolateral margin of deltopectoral crest
  - Concave ventral margin of postacetabular process
