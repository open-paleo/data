genus: Tuojiangosaurus
parent: Stegosauria
pronunciation:
  phonetic: TWAW-JYAHNG-o-SAWR-us
etymology: Named after the Tuo River (Tuojiang) of Sichuan Province, China,
  combined with Greek sauros meaning 'lizard'; translates as 'Tuo River lizard'
description: Tuojiangosaurus is a genus of herbivorous stegosaurian dinosaur
  from the Late Jurassic Period, recovered from the Upper Shaximiao Formation of
  what is now Sichuan Province in China.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - 2–3 supraorbital bones bearing raised wartlike nodose processes on their
    surfaces
  - Teeth numerous, asymmetrical, and overlapping in both upper and lower jaws
    (unlike symmetrical non-overlapping teeth of Stegosaurus and Kentrosaurus)
  - Sacrum with four sacral vertebrae whose ribs and transverse processes are
    incompletely fused, leaving four pairs of openings on the dorsal surface
    (unique among known Stegosaurinae)
  - Femoral fourth trochanter reduced to a small crest located at approximately
    mid-femur (not upper third as in Zigongosaurus)
  - 17 pairs of dermal plates and spines arranged in two symmetrical rows, the
    greatest number of any known stegosaurine; plates grading from rounded-oval
    cervically to triangular dorsally to flattened conical sacrally/caudally
appearance:
  features:
    - dermal plates
    - tail spikes
  integument: armored
  evidence: direct
