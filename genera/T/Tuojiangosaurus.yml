genus: Tuojiangosaurus
parent: Stegosauria
pronunciation:
  phonetic: TWAW-JYAHNG-o-SAWR-us
etymology: Named after the Tuo River (Tuojiang) of Sichuan Province, China, combined with Greek sauros meaning 'lizard'; translates as 'Tuo River lizard'
description: Tuojiangosaurus is a genus of herbivorous stegosaurian dinosaur
  from the Late Jurassic Period, recovered from the Upper Shaximiao Formation of
  what is now Sichuan Province in China.
