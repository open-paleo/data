genus: Talarurus
parent: Ankylosaurinae
etymology: From Greek talaros, "wicker basket", combined with Greek oura, "tail"
  - means "basket tail" or "wicker tail", referring to the club-like tail
pronunciation:
  phonetic: TAL-uh-ROOR-uhs
  ipa: /ˌtæləˈrʊərəs/
description: Talarurus is a genus of ankylosaurid dinosaur that lived in Asia
  during the Late Cretaceous period, about 96 million to 89 million years ago.
  The first remains of Talarurus were discovered in 1948 and later described by
  the Russian paleontologist Evgeny Maleev with the type species T.
  plicatospineus. It is known from multiple yet sparse specimens, making it one
  of the most well known ankylosaurines, along with Pinacosaurus. Elements from
  the specimens consists of various bones from the body; five skulls have been
  discovered and assigned to the genus, although the first two were very
  fragmented.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
appearance:
