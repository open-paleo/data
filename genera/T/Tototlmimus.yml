genus: Tototlmimus
parent: Ornithomimidae
etymology: From Nahuatl tototl ('bird') and Latin mimus ('mimic', from Greek mimos), meaning 'bird mimic'
description: Tototlmimus is an extinct genus of ornithomimid theropod dinosaur
  from the Late Cretaceous (Campanian) Packard Formation of Sonora, Mexico. Its
  type species is Tototlmimus packardensis, representing the first
  ornithomimosaur formally described from this country.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - marine
diagnostic_features:
  - Distinctive articulation between metatarsals II and IV contacting directly
    with the distal facet of metatarsal III
  - Metatarsal III with weakly ginglymoid distal articular facet bearing pits
    and deep longitudinal scars
  - Medial and lateral sides of metatarsal III shaped to fit with metatarsals II
    and IV
  - Asymmetrical and narrow pedal ungual with shallow grooves on medial and
    lateral sides
  - Deep sulcus on ventromedial edge close to articular end and prominent keel
    on ventrolateral edge
appearance:
  features:
    - keratinous beak
  integument: feathered
  evidence: direct
