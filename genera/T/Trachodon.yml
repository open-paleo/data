genus: Trachodon
parent: Hadrosauridae
etymology: From Greek trachys (rough) and odon (tooth); meaning
  "rough tooth", referring to the granulated inner surface of
  the hadrosaurid tooth Leidy described.
description: >
  Trachodon is a dubious genus of hadrosaurid dinosaur from the
  Upper Cretaceous of what is now Montana in the western United
  States. The only species is T. mirabilis, though many others
  have been assigned to the genus. T. mirabilis was described
  by Joseph Leidy in 1856 based on a set of teeth; however,
  this was later shown to be a mixture of hadrosaurid and
  ceratopsian teeth. These fossils were unearthed in 1856 by
  Ferdinand Vandeveer Hayden during an expedition to the
  Missouri River in Montana, USA, in rock from the Judith River
  Formation. This formation dates to the Campanian stage of the
  Late Cretaceous, which lasted from 79 to 75.3 million years
  ago. One of the teeth, an incomplete hadrosaurid tooth, was
  later chosen as the holotype.
diet: herbivore
locomotion: facultative
diagnostic_features:
  - Unworn tooth crown forms a slightly bent hexahedral column, bevelled
    convexly from summit internally to base externally
  - Outer surface smooth with prominent median ridge and prominent subacute
    lateral borders
  - Inner surface (five smaller sides of column) roughened with irregular
    granulations
  - Base of tooth hollow with walls ~1.5 lines thick
  - Worn triturating surface slightly concave and pentahedral with concave
    sides, ~4 lines in diameter
