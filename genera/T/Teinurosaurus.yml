genus: Teinurosaurus
parent: Theropoda
placement: incertae sedis
etymology: "From Greek 'teinein' meaning 'to stretch' and 'oura' meaning 'tail',
  combined with Greek 'sauros' meaning 'lizard', likely referring to an
  elongated tail vertebra."
pronunciation:
  phonetic: tie-NOOR-o-SOR-us
description: Teinurosaurus is a genus of carnivorous theropod dinosaur that
  lived during the Late Jurassic in what is now France. The type species is
  Teinurosaurus sauvagei. It has been estimated to be 11.4 m (37 ft) in length
  and 3.6 t (4.0 short tons) in weight.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - marine
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "38534"
  - source: wikidata
    id: Q870938
  - source: gbif
    id: "4822572"
synonyms:
  - name: Caudocoelus
    type: junior objective
    reason: Coined by Huene (1932) as Caudocoelus sauvagei for the same
      distal caudal vertebra Nopcsa (1928) had already named Teinurosaurus;
      Teinurosaurus has priority and Caudocoelus is now treated as a junior
      objective synonym following Ostrom's 1969 review.
erected_in: nopcsa1928c
species:
  - name: Teinurosaurus sauvagei
    etymology: "Named for Henri-Émile Sauvage, the French paleontologist who first
      described the tail vertebra in 1897."
    status: nomen dubium
    type_species: true
    period:
      name:
        - Late Jurassic
      stage:
        - Kimmeridgian
    location:
      country: FR
      region: FR-62
      locality: Boulogne-sur-Mer
      notes: >
        Huene (1932) gives the vertebra as "aus dem oberen Malm der Gegend von
        Boulogne-sur-mer" (from the upper Malm of the Boulogne-sur-mer area,
        translated), and his figure caption as "aus dem Kimmeridge von
        Boulogne-sur-mer. Nach Sauvage" (from the Kimmeridge of
        Boulogne-sur-mer, after Sauvage, translated).
    size:
      length_m:
        min: 11.4
        max: 11.4
      weight_kg:
        min: 3600
        max: 3600
    type_specimen:
      specimen_id: [BHN2R 240]
      specimen_type: holotype
      status: unknown
      material: Distal caudal vertebra.
      completeness: fragmentary
      notes: Often reported as destroyed during the Second World War, but the
        vertebra is extant, as noted by Buffetaut and colleagues (1991). It was held by
        the Muséum d'Histoire Naturelle de Boulogne-sur-Mer, which closed in
        2003, and its present repository is unrecorded.
    erected_as: Caudocoelus sauvagei
    erected_in: huene1932a
references:
  - id: nopcsa1928c
    notes: Introduces the name in a classification of reptile genera, without a
      description, a horizon or a locality.
  - id: huene1932a
    notes: Names Caudocoelus sauvagei for the same vertebra already designated
      Teinurosaurus by Nopcsa (1928), so a junior objective synonym. Gives it as
      from the Kimmeridge of Boulogne-sur-Mer.
  - id: buffetaut1991a
  - id: holtz2004a
    notes: Lists Teinurosaurus sauvagei, the type of Caudocoelus, among the
      nomina dubia of basal tetanurans.
  - id: weishampel2004a
    notes: Lists Teinurosaurus sauvagei as Theropoda indet. in the Boulogne-
      sur-Mer fauna.
