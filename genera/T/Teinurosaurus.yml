genus: Teinurosaurus
parent: Tetanurae
dispute:
  summary: >
    Teinurosaurus sauvagei is a nomen dubium based on a single distal caudal vertebra;
    it cannot be assigned below Theropoda with confidence. It is placed conservatively
    at Tetanurae incertae sedis.
  history:
    - date: "2026-07-02"
      note: Placed at Tetanurae incertae sedis; regarded as a nomen dubium.
etymology: "From Greek 'teinein' meaning 'to stretch' and 'oura' meaning 'tail',
  combined with Greek 'sauros' meaning 'lizard', likely referring to an
  elongated tail vertebra."
pronunciation:
  phonetic: tie-NOOR-o-SOR-us
description: Teinurosaurus is a genus of carnivorous theropod dinosaur that
  lived during the Late Jurassic in what is now France. The type species is
  Teinurosaurus sauvagei. It has been estimated to be 11.4 m (37 ft) in length
  and 3.6 t (4.0 short tons) in weight.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - marine
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "38534"
  - source: wikidata
    id: Q870938
  - source: gbif
    id: "4822572"
synonyms:
  - name: Caudocoelus
    type: junior objective
    reason: Coined by Huene (1932) as Caudocoelus sauvagei for the same
      distal caudal vertebra Nopcsa (1928) had already named Teinurosaurus;
      Teinurosaurus has priority and Caudocoelus is now treated as a junior
      objective synonym following Ostrom's 1969 review.
species:
  - name: Teinurosaurus sauvagei
    etymology: "Named for Henri-Émile Sauvage, the French paleontologist who first
      described the tail vertebra in 1897."
