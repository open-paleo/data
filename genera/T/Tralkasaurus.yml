genus: Tralkasaurus
parent: Abelisauridae
etymology: "From Mapudungun 'tralka' meaning 'thunder' and Greek 'sauros' meaning 'lizard', giving 'thunder lizard'."
pronunciation:
  phonetic: TRAL-kuh-SOR-us
description: Tralkasaurus is a genus of abelisaurid dinosaur from the Huincul
  Formation from Río Negro Province in Argentina. The type and only species is
  Tralkasaurus cuyi, named in 2020 by Mauricio Cerroni and colleagues based on
  an incomplete skeleton. A medium-sized abelisaurid, Tralkasaurus exhibits a
  conflicting blend of characteristics found among the early-diverging
  abelisauroids with others that characterize the highly specialized clade
  Brachyrostra, and thus its position within the clade is poorly-resolved.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - antorbital fossa widely exposed over entire dorsal portion of maxillary body
  - internal and external margins of antorbital fossa anterodorsally directed
  - dorsal vertebra with parapophysis dorsoventrally narrow and rod-like
  - dorsal vertebra with proximally restricted paradiapophyseal lamina
