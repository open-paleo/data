genus: Trinisaura
parent: Elasmaria
etymology: Named to commemorate Argentine geologist Trinidad 'Trini' Diaz, combined with Greek sauros ('lizard')
pronunciation:
  phonetic: TRIH-nee-SOR-uh
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - marine
diagnostic_features:
  - Scapula with spike-like acromial process with strong sharp lateral crest,
    longer than in other ornithopods
  - Rudimentary deltopectoral crest as shallow thickening on anterolateral
    margin of humerus shaft
  - Humeral shaft strongly bowed laterally
  - Ischium gently curved along entire length
