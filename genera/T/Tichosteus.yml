genus: Tichosteus
parent: Iguanodontia
pronunciation:
  phonetic: ty-KOS-tee-us
etymology: From Greek teichos, "wall", combined with Greek osteon, "bone" -
  means "walled bone", referring to vertebrae that lacked lateral pneumatic
  foramina in their side walls
description: Tichosteus is a genus of herbivorous dinosaur from the Late
  Jurassic. It is known only from vertebrae recovered from Kimmeridgian rocks in
  the Morrison Formation, Colorado.
dispute:
  summary: >
    Tichosteus is based on vertebrae only and lacks unique diagnostic
    features; it is treated as a dubious iguanodontian (Norman, 2004).
  history:
    - date: "2026-06-29"
      note: Placed at Iguanodontia incertae sedis; nomen dubium (P2).
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Vertebrae nearly amphiplatyan with one extremity slightly concave and
    expanded, other slightly convex or concave and not enlarged
  - Hollow centrum lacking lateral foramen and capitular articulation
  - Neural arch attached by suture
  - No hypapophysis on dorsal or lumbar vertebrae, surface smooth with delicate
    longitudinal ridges
  - Narrower extremity of dorsal vertebra nearly round with slight median
    tuberosity; opposite end wider than deep
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "65177"
  - source: wikidata
    id: Q2113285
  - source: gbif
    id: "4821468"
species:
  - name: Tichosteus lucasanus
    etymology: "Named for Oramel W. Lucas, superintendent of public schools, who
      collected the holotype vertebrae for Edward Drinker Cope near the Arkansas
      River in Colorado."
    status: valid
    type_species: true
    period:
      name:
