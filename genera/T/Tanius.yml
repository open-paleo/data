genus: Tanius
parent: Hadrosauroidea
etymology: "Named for Chinese paleontologist Tan Xichou (H.C. Tan), who discovered the fossils; the name means 'of Tan'."
description: Tanius is a genus of hadrosauroid dinosaur. It lived in the Late
  Cretaceous of China. The type species, named and described in 1929 by Carl
  Wiman, is Tanius sinensis. The generic name honours the Chinese paleontologist
  Tan Xichou ("H.C. Tan"). The specific epithet refers to China. In 2010 Gregory
  S. Paul estimated the length of Tanius at 7 metres (23 ft) and its weight at 2
  metric tons (2.2 short tons).
