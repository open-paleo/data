genus: Tanius
parent: Hadrosauromorpha
pronunciation:
  phonetic: TAHN-ee-us
etymology: "Named for Chinese paleontologist Tan Xichou (H.C. Tan), who
  discovered the fossils; the name means 'of Tan'."
description: Tanius is a genus of hadrosauroid dinosaur. It lived in the Late
  Cretaceous of China. The type species, named and described in 1929 by Carl
  Wiman, is Tanius sinensis. The generic name honors the Chinese paleontologist
  Tan Xichou ("H.C. Tan"). The specific epithet refers to China. In 2010 Gregory
  S. Paul estimated the length of Tanius at 7 meters (23 ft) and its weight at 2
  metric tons (2.2 short tons).
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
diagnostic_features:
  - Tall dorsal neural spines, with a height to centrum height ratio of 3.2
  - Reduced postacetabular ridge on the ilium
  - Medial and lateral distal femoral condyles fused posteriorly to enclose the
    flexor tunnel
  - Lunate profile on the proximal end of metatarsal III
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "38777"
  - source: wikidata
    id: Q135643
  - source: gbif
    id: "4823306"
  - source: eol
    id: "4532077"
species:
  - name: Tanius sinensis
    etymology: "From Latin 'sinensis' meaning 'of China', after the country where
      the holotype was discovered."
    status: valid
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Coniacian
        - Santonian
        - Campanian
    location:
      country: CN
      locality: about 500 m (one li) southwest of Jiangjundingcun
      region: CN-SD
      formation: Jiangjunding
    size:
      hip_height_m:
        min: 2.3
        max: 2.3
      length_m:
        min: 7.0
        max: 7.0
      weight_kg:
        min: 2000
        max: 2000
    type_specimen:
      specimen_id: [ PMU 24720 ]
      specimen_type: holotype
      institution: PMU
      material: Skeleton of one individual comprising the articulated skull roof and
        braincase, both postorbitals and pterygoids, the left jugal, quadrate and
        squamosal, the axis and cervicals 3 to 10, four cervical ribs, one dorsal
        and one midseries caudal vertebra, a hemal arch, the right scapula and
        sternal plate, the left humerus, partial right ulna and radius, both ilia,
        the right femur, tibia and fibula, right metatarsal II, left metatarsal III,
        and a pedal ungual phalanx.
      completeness: partial
      notes: Wiman designated no holotype, treating the elements as a type series
        under separate numbers. Borinder and colleagues (2021) judged them one
        individual on shared provenance and anatomical fit, and the skeleton was
        registered under this number, its constituent bones numbered within it.
    erected_in: wiman1929a
    described_in: borinder2021a
references:
