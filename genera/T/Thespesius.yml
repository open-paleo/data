genus: Thespesius
parent: Hadrosauridae
placement: incertae sedis
pronunciation:
  phonetic: thes-PEE-zhus
etymology: From Greek thespesios, "wondrous" — means "wondrous one", named
  because of the colossal size of the remains
description: Thespesius is a dubious genus of hadrosaurid dinosaur from the late
  Maastrichtian-age Upper Cretaceous Lance Formation of South Dakota.
dispute:
  summary: >
    Thespesius is a nomen dubium based on non-diagnostic material,
    historically a wastebasket for Lance-age hadrosaurids.
  history:
    - date: "2026-06-27"
      note: Placed at Hadrosauridae incertae sedis; nomen dubium.
    - date: "2026-10-08"
      note: Type species set to nomen dubium and diagnostic features removed, following Brett-Surman (1989) and Horner and colleagues (2004).
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "53380"
  - source: wikidata
    id: Q28545935
species:
  - name: Thespesius occidentalis
    etymology: "From Latin 'occidentalis' meaning 'western', referring to the
      western location of the discovery site in what was then the Nebraska
      Territory."
    status: nomen dubium
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Maastrichtian
    location:
      country: US
      region: US-SD
      locality: Grand River
      formation: Lance
    type_specimen:
      specimen_id:
        - USNM 219
        - USNM 220
        - USNM 221
      specimen_type: syntype
      institution: USNM
      material: Two caudal vertebrae and first phalanx; vertebral bodies quadrately
        oval in outline with distinct articular processes for chevron bones; phalanx 5
        inches long with transverse reniform proximal articulation
      completeness: fragmentary
    erected_in: leidy1856a
references:
  - id: leidy1856a
    notes: Gives the syntypes as from the lowest member of the Lignite formation
      of Grand River, in what was then Nebraska Territory, without a closer
      locality.
  - id: horner2004a
    notes: Places the type material in South Dakota.
  - id: prieto-márquez2006a
    notes: Gives the syntypes as two caudal vertebrae and a phalanx from the
      Lance Formation, the source of the formation.
