genus: Thespesius
parent: Hadrosauridae
etymology: From Greek thespesios, "wondrous" - means "wondrous one", named
  because of the colossal size of the remains
description: Thespesius is a dubious genus of hadrosaurid dinosaur from the late
  Maastrichtian-age Upper Cretaceous Lance Formation of South Dakota.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
diagnostic_features:
  - Vertebral bodies with articular processes one inch in diameter for chevron
    bones, distinct from elephant lumbar vertebrae
  - Vertebral bodies quadrately oval in outline and notched above when viewed in
    front
  - Caudal vertebrae with circular spinal foramen one inch in diameter
  - First phalanx with deep concavities on sides for lateral ligaments
  - Proximal articulation transverse reniform; distal articulation transverse
    convexity slightly concave medially
