genus: Tawa
parent: Saurischia
etymology: Named after Tawa, the Hopi sun god, reflecting the Hopi people's connection to the American Southwest where the fossil was discovered in New Mexico.
description: Tawa is a genus of possible basal theropod dinosaurs from the Late
  Triassic period. The fossil remains of Tawa hallae, the type and only species
  were found in the Hayden Quarry of Ghost Ranch, New Mexico, US. Its discovery
  alongside the relatives of Coelophysis and Herrerasaurus supports the
  hypothesis that the earliest dinosaurs arose in Gondwana during the early Late
  Triassic period in what is now South America, and radiated from there around
  the globe. The specific name honours Ruth Hall, founder of the Ghost Ranch
  Museum of Paleontology.
locomotion: bipedal
