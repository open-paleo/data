genus: Torvosaurus
parent: Megalosaurinae
pronunciation:
  ipa: /ˌtɔːrvoʊˈsɔːrəs/
etymology: "From Latin torvus ('savage' or 'fierce') and Greek sauros ('lizard'), meaning 'savage lizard'"
description: Torvosaurus is a genus of large megalosaurine theropod dinosaur
  that lived approximately 165 to 146.5 million years ago during the Callovian
  to Tithonian ages of the late Middle and Late Jurassic period in what is now
  Colorado, Portugal, Germany, and possibly England, Spain, Tanzania, and
  Uruguay. It contains two currently recognized species, Torvosaurus tanneri and
  Torvosaurus gurneyi, plus a third unnamed species from Germany.
diet: carnivore
locomotion: bipedal
