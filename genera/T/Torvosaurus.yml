genus: Torvosaurus
parent: Megalosaurinae
pronunciation:
  phonetic: TOR-vo-SAWR-us
  ipa: /ˌtɔːrvoʊˈsɔːrəs/
etymology: From Latin torvus ('savage' or 'fierce') and Greek sauros ('lizard'),
  meaning 'savage lizard'
description: Torvosaurus is a genus of large megalosaurine theropod dinosaur
  that lived approximately 165 to 146.5 million years ago during the Callovian
  to Tithonian ages of the late Middle and Late Jurassic period in what is now
  Colorado, Portugal, Germany, and possibly England, Spain, Tanzania, and
  Uruguay. It contains two currently recognized species, Torvosaurus tanneri and
  Torvosaurus gurneyi, plus a third unnamed species from Germany.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
appearance:
  integument: scaled
  evidence: inferred
diagnostic_features:
  - Humerus straight and massive, with a strongly indented head, a large
    deltopectoral crest extending past midshaft, and a broad distal end
  - Forearm short, with a humerus-to-radius length ratio of about 2.2 and a
    massive ulna (length-to-proximal-width ratio about 2.1)
  - First manual phalanx of digit I stout, short, and twisted so the distal
    condyles are angled relative to the proximal end
  - Subacetabular parts of the pubis and ischium unemarginated ventrally,
    forming a nearly continuous ventromedian symphysis along most of their
    length
  - Obturator foramen fully enclosed in the pubis, terminating distally in a
    small anteroposteriorly expanded pubic foot
  - Ilium with a very low dorsal blade tapering to a rounded posterior point and
    a wide brevis shelf; acetabulum wide but shallow
