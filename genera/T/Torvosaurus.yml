        max: 5000
    diagnostic_features:
      - Maxilla bearing fewer than eleven teeth.
      - Interdental plates fused with a straight ventral margin, rather than
        terminating in broad V-shaped points that fall short of the lateral wall.
      - Interdental wall extending nearly as far ventrally as the lateral wall of
        the maxillary body.
      - No protuberant ridge on the anterior part of the medial shelf, posterior
        to the anteromedial process.
      - Dorsal and medial ridges of the anteromedial process with a coincidental
        posterior extension.
    erected_in: hendrickx2014a
