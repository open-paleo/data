  - source: pbdb
    id: "38587"
  - source: wikidata
    id: Q131537
  - source: gbif
    id: "4822675"
  - source: eol
    id: "4531497"
synonyms:
  - name: Brontoraptor
    type: nomen nudum
    reason: Nomen nudum; general consensus treats it as a junior synonym of
      Torvosaurus.
  - name: Edmarka
    type: junior subjective
    reason: Currently treated as a junior synonym of Torvosaurus, though future
      analysis may yet revalidate the genus.
species:
  - name: Torvosaurus tanneri
    etymology: Named for Nathan Eldon Tanner, who at the time of the species' 1979
      description was first counselor in the First Presidency of the Church of
      Jesus Christ of Latter-day Saints.
    status: valid
    type_species: true
    period:
      name:
        - Late Jurassic
      stage:
        - Kimmeridgian
        - Tithonian
    location:
      country: US
      locality: Dry Mesa Quarry
      region: US-CO
      formation: Morrison
      member: Brushy Basin
      part: lower
    type_specimen:
      specimen_id:
        - BYU 2002
      specimen_type: holotype
      institution: BYU
      material: Left and right humeri, radii, and ulnae (six forelimb long bones) of a
        single individual.
      completeness: fragmentary
    size:
      length_m:
        min: 9
        max: 10
      weight_kg:
        min: 2000
        max: 5000
    diagnostic_features:
      - Three premaxillary alveoli.
      - A diastema on the premaxilla separating the premaxillary and maxillary
        alveoli, without a subnarial notch.
      - Ten maxillary alveoli.
      - Medial margin of the maxilla's subnarial contact with the nasal formed by
        a prominent crest.
      - A single large neurovascular opening on the dorsomedial surface of the
        maxillary jugal ramus.
      - Posterior process of the quadratojugal oriented subvertically, its ventral
        and posterior margins meeting at a right angle.
      - A flange on the anterodorsal margin of the surangular.
    erected_in: galton1979a
    described_in: warner-cowgill2026a
  - name: Torvosaurus gurneyi
    etymology: Honors the paleoartist James Gurney, creator of the Dinotopia book
      series.
    status: disputed
    type_species: false
    period:
      name:
        - Late Jurassic
      stage:
        - Kimmeridgian
        - Tithonian
    location:
      country: PT
      region: PT-11
      formation: Lourinhã
      member: Praia da Amoreira-Porto Novo
      locality: Praia da Vermelha
    type_specimen:
      specimen_id:
        - ML 1100
      specimen_type: holotype
      institution: ML
      material: Incomplete left maxilla bearing one erupted and one unerupted tooth,
        and the posterior portion of a proximal caudal vertebra.
    size:
      length_m:
        min: 10
        max: 10
      weight_kg:
        min: 4000
        max: 5000
    diagnostic_features:
      - Maxilla bearing fewer than eleven teeth.
      - Interdental plates fused with a straight ventral margin, rather than
        terminating in broad V-shaped points that fall short of the lateral wall.
      - Interdental wall extending nearly as far ventrally as the lateral wall of
        the maxillary body.
      - No protuberant ridge on the anterior part of the medial shelf, posterior
        to the anteromedial process.
      - Dorsal and medial ridges of the anteromedial process with a coincidental
        posterior extension.
    erected_in: hendrickx2014a
notable_specimens:
  - specimen_id:
      - ML1188
    institution: ML
    category: reproductive
    significance: A clutch of crushed eggs and embryonic material attributed to
      Torvosaurus from the Lourinha Formation, Portugal; the most primitive and
      only known basal theropod embryos, and the first evidence of a one-layered
      eggshell for theropod dinosaurs.
    discovered:
      year: 2005
      by: Aart Walen
    references:
      - araújo2013a
  - specimen_id:
      - CMC VP 15575
    institution: CMC-US
    species: Torvosaurus tanneri
    category: most-complete
    significance: The most complete Torvosaurus specimen known, from Skull Creek
      Quarry, Colorado, with a complete maxilla, a posterior mandible and an
      unbroken vertebral series from neck to tail base. Its third maxillary
      tooth, about 250 mm long, is the largest land-animal tooth known from the
      Jurassic or earlier.
    references:
      - warner-cowgill2026a
references:
  - id: araújo2013a
  - id: galton1979a
  - id: hendrickx2014a
    notes: Original description of Torvosaurus gurneyi on maxilla ML 1100 from the
      Lourinhã Formation of Portugal.
  - id: warner-cowgill2026a
    notes: Revised diagnoses of Torvosaurus and T. tanneri from the new specimen
      CMC VP 15575; treats T. gurneyi as a junior synonym of T. tanneri.
