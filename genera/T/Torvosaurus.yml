    category: reproductive
    significance: A clutch of crushed eggs and embryonic material attributed to
      Torvosaurus from the Lourinha Formation, Portugal; the most primitive and
      only known basal theropod embryos, and the first evidence of a one-layered
      eggshell for theropod dinosaurs.
    discovered:
