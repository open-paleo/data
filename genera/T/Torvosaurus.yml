genus: Torvosaurus
parent: Megalosaurinae
pronunciation:
  phonetic: TOR-vo-SAWR-us
  ipa: /ˌtɔːrvoʊˈsɔːrəs/
etymology: From Latin torvus ('savage' or 'fierce') and Greek sauros ('lizard'),
  meaning 'savage lizard'
description: Torvosaurus is a genus of large megalosaurine theropod dinosaur
  that lived approximately 165 to 146.5 million years ago during the Callovian
  to Tithonian ages of the late Middle and Late Jurassic period in what is now
  Colorado, Portugal, Germany, and possibly England, Spain, Tanzania, and
  Uruguay. It contains two named species, Torvosaurus tanneri and the disputed
  Torvosaurus gurneyi, plus a third unnamed species from Germany.
dispute:
  summary: Hendrickx and Mateus (2014) named Torvosaurus gurneyi for a maxilla
    from the Lourinhã Formation of Portugal, distinguished from T. tanneri by its
    tooth count, the shape of its interdental plates and two features of the
    medial shelf. Warner-Cowgill and colleagues (2026) regard it as a junior
    synonym of T. tanneri. On a more complete maxilla from Colorado they find ten
    alveoli and the interdental plates attributed to T. gurneyi, attribute the
    differences in tooth count and plate shape to damage in the maxilla they had
    been measured against, and treat the other two as variation within the
    species.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
appearance:
  integument: scaled
  evidence: inferred
diagnostic_features:
  - An anteroposteriorly oriented ridge lateral to the maxillary fossa
  - Maxillary fossa large, subtriangular and mediolaterally shallow, contacting
    the floor of the antorbital fossa
  - Maxillary interdental plates fused into a continuous interdental wall
