genus: Tehuelchesaurus
parent: Camarasauromorpha
pronunciation:
  ipa: /teɪhwɛltʃeɪsɔːrəs/
etymology: "Named in honor of the Tehuelche people, the indigenous inhabitants of the Argentinian province of Chubut where the fossil was first found, combined with Greek 'sauros' meaning 'lizard'."
description: Tehuelchesaurus is a genus of macronarian sauropod dinosaur from
  the Late Jurassic (Oxfordian to Tithonian) of Argentina. It is named in honor
  of the Tehuelche people, native to the Argentinian province of Chubut, where
  it was first found.
