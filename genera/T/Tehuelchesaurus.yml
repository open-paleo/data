genus: Tehuelchesaurus
parent: Eusauropoda
dispute:
  summary: >
    Tehuelchesaurus was originally interpreted as a camarasauromorph, a
    position supported by Carballido and Sander (2014) and the camarasaurid
    analysis of Mocho et al. (2014). More recent analyses (Mannion et al.,
    2019; Mocho et al., 2023) and Jones (2026) instead place it in
    Turiasauria, outside Macronaria.
  history:
    - date: "2026-06-30"
      note: >
        Moved from Camarasauromorpha to Eusauropoda following the recent
        analyses and Jones (2026) that recover it in Turiasauria; finer
        placement is deferred to the eusauropod and turiasaur reconciliation.
    - date: "2026-07-02"
      note: Confirmed and placed at Eusauropoda incertae sedis in the sauropod-backbone finishes; the basal-macronarian (Mannion et al., 2013), Turiasaurian, and non-neosauropod-eusauropod hypotheses remain unresolved.
pronunciation:
  phonetic: tay-WAYL-chay-SAWR-us
etymology: "Named in honor of the Tehuelche people, the indigenous inhabitants
  of the Argentinian province of Chubut where the fossil was first found,
  combined with Greek 'sauros' meaning 'lizard'."
description: Tehuelchesaurus is a genus of eusauropod dinosaur from
  the Late Jurassic (Oxfordian to Tithonian) of Argentina. It is named in honor
  of the Tehuelche people, native to the Argentinian province of Chubut, where
  it was first found.
