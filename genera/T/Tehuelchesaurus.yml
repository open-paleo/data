genus: Tehuelchesaurus
parent: Eusauropoda
placement: incertae sedis
dispute:
  summary: >
    Tehuelchesaurus was originally interpreted as a camarasauromorph, a position
    supported by Carballido and Sander (2013), the camarasaurid analysis of Mocho
    et al. (2014), and Mannion et al. (2013), and treated as the traditional view
    by Jones (2026). More recent analyses instead pull it out of Macronaria:
    Mannion et al. (2019) recover it in Turiasauria under equal weighting (but a
    macronarian under implied weighting), and Mocho et al. (2023) recover it
    outside Macronaria as a basal eusauropod-grade taxon.
  history:
    - date: "2026-06-30"
      note: >
        Moved from Camarasauromorpha to Eusauropoda following the recent
        analyses and Jones (2026) that recover it in Turiasauria; finer
        placement remains unresolved.
    - date: "2026-07-02"
      note: >
        Confirmed placement at Eusauropoda incertae sedis; the
        basal-macronarian (Mannion et al., 2013), Turiasaurian, and
        non-neosauropod-eusauropod hypotheses remain unresolved.
pronunciation:
  phonetic: tay-WAYL-chay-SAWR-us
etymology: "Named in honor of the Tehuelche people, the indigenous inhabitants
  of the Argentinian province of Chubut where the fossil was first found,
  combined with Greek 'sauros' meaning 'lizard'."
description: Tehuelchesaurus is a genus of eusauropod dinosaur from
  the Late Jurassic (Oxfordian to Tithonian) of Argentina. It is named in honor
  of the Tehuelche people, native to the Argentinian province of Chubut, where
  it was first found.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Two accessory laminae in the infradiapophyseal fossa of the middle dorsal
    vertebrae
  - Accessory laterally oriented lamina on the lateral surface of the
    intrapostzygapophyseal lamina
  - Strongly anteroposteriorly expanded and robust distal end of the humerus
  - Absence of the prezygoparapophyseal lamina in the middle and posterior dorsal
    vertebrae
  - Accessory posterior centrodiapophyseal lamina giving a ventrally bifurcated
    appearance
  - A single intrapostzygapophyseal lamina in the mid-dorsal vertebrae supporting a
    weakly developed hyposphene
  - Dorsal neural spines longer anteroposteriorly than wide transversely
  - Absence of lateral expansion at the dorsal end of the dorsal neural spines
  - Absence of a postspinal lamina in the dorsal neural spines
  - Acromion process of the scapula almost four times the minimum width of the
    scapular shaft
