    species: Tarbosaurus bataar
    category: ontogeny
    significance: "A rare juvenile, probably 2 to 3 years old, with a complete 290 mm skull, documenting the life history and growth of Tarbosaurus; its weakly built skull and thin teeth indicate different food preferences in juveniles, and its sclerotic rings suggest crepuscular or nocturnal hunting."
    discovered:
