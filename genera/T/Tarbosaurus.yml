    synonyms:
      - name: Tyrannosaurus bataar
        type: reassigned
        reason: Original combination (Maleev, 1955, on holotype PIN 551-1);
          recombined as Tarbosaurus bataar by Rozhdestvensky (1965). Still used by
          authors who regard the taxon as an Asian species of Tyrannosaurus.
      - name: Tarbosaurus efremovi
        type: junior subjective
        reason: Named by Maleev (1955) on PIN 551-2 as the type species of
          Tarbosaurus; treated as a growth stage of T. bataar since Rozhdestvensky
          (1965).
      - name: Gorgosaurus lancinator
        type: junior subjective
        reason: Named by Maleev (1955); synonymized with T. bataar as a growth
          stage by Rozhdestvensky (1965).
      - name: Gorgosaurus novojilovi
        type: junior subjective
        reason: Named by Maleev (1955); made the basis of Maleevosaurus by
          Carpenter (1992) and later regarded as a juvenile Tarbosaurus.
      - name: Shanshanosaurus
        type: junior subjective
        reason: S. houyanshanensis has been provisionally accepted as referable to
          Tarbosaurus bataar.
