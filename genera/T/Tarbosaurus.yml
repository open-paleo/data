genus: Tarbosaurus
parent: Tyrannosaurinae
etymology: "From Ancient Greek 'tarbos' meaning 'terror' or 'alarm' and 'sauros'
  meaning 'lizard'."
pronunciation:
  phonetic: TAR-buh-SOR-uhs
  ipa: /ˌtɑːrbəˈsɔːrəs/
description: Tarbosaurus is a genus of large tyrannosaurid dinosaur that lived
  in Asia during the Maastrichtian age of the Late Cretaceous epoch. It contains
  the type and single species Tarbosaurus bataar, which is known from the Nemegt
  Formation of Mongolia, with more fragmentary remains found further afield in
  the Subashi Formation of China. Tarbosaurus is represented by dozens of fossil
  specimens, including several complete skulls and skeletons. These remains have
  allowed studies focusing on its phylogeny, skull mechanics, and brain
  structure. Further fossil remains have been reported from other geologic
  formations of Asia, however, these remains are fragmentary and cannot be
  confidently assigned to Tarbosaurus or the type species.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
dispute:
  summary: >
    The generic placement of the single Mongolian species is long debated.
    Maleev (1955) named the type material Tyrannosaurus bataar (holotype
    PIN 551-1) and, in a companion paper, erected Tarbosaurus for the related
    Tarbosaurus efremovi. Rozhdestvensky (1965) interpreted Maleev's several
    Mongolian species as growth stages of one animal and, keeping the genus
    Tarbosaurus, coined the combination Tarbosaurus bataar. Carpenter (1992)
    judged the differences from Tyrannosaurus to fall within normal individual
    and ontogenetic variation and sank Tarbosaurus into Tyrannosaurus
    (Tyrannosaurus bataar), whereas Olshevsky, Ford and Yamamoto (1995) instead
    split the material among Tarbosaurus, Jenghizkhan and Maleevosaurus. Most
    work since 1999 recognizes a single species; the majority retains
    Tarbosaurus bataar, with a minority (e.g. Carr and others) treating it as
    Tyrannosaurus bataar.
  history:
    - date: "2026-07-17"
      note: Retained as Tarbosaurus bataar, the majority usage since 1999; the
        Tyrannosaurus bataar assignment (Carpenter 1992; Carr and others) is
        recorded as a minority view.
diagnostic_features:
  - Large skull, massive, with 2 large premaxillary foramina and third small
    foramen between premaxilla and maxilla
  - Pisolitic orbits
  - Maxilla long, raised, equipped with powerful saber-like teeth, slightly
    compressed and serrated marginally
  - Short neck consisting of 8-9 opisthocoelous cervical vertebrae
  - Forelimbs extremely reduced; humerus very short with strong deltopectoral
    crest; proportion of humerus to scapula 3:1
  - Pubic symphysis strongly elongate anteriorly and curved ventrally forming
    powerful bony foot
appearance:
  features:
    - reduced forelimbs
    - cranial bosses
  integument: scaled
  evidence: direct
