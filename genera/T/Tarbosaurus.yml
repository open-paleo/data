synonyms:
  - name: Maleevosaurus
    type: junior subjective
    reason: Erected by Carpenter (1992) for Gorgosaurus novojilovi; now generally
      interpreted as a juvenile Tarbosaurus.
  - name: Jenghizkhan
    type: possible subjective
    reason: Paul (2025) lists Jenghizkhan among the synonyms of Tarbosaurus but
      marks it doubtful, and offers no supporting discussion; he coined the
      name himself.
