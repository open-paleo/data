genus: Titanomachya
parent: Saltasauroidea
description: Titanomachya is a genus of saltasauroid titanosaur sauropod dinosaur
  from the Late Cretaceous (Maastrichtian) La Colonia Formation of Chubut Province,
  Patagonia, Argentina. The type species is Titanomachya gimenezi, described in 2024.
