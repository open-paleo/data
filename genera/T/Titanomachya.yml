genus: Titanomachya
parent: Saltasauroidea
etymology: Named after the Titanomachy of Greek mythology, the battle between the Titans and the Olympian gods
pronunciation:
  phonetic: TIE-ta-no-MAH-chee-uh
description: Titanomachya is a genus of saltasauroid titanosaur sauropod dinosaur
  from the Late Cretaceous (Maastrichtian) La Colonia Formation of Chubut Province,
  Patagonia, Argentina. The type species is Titanomachya gimenezi, described in 2024.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Haemal canal approximately 25% of the total length of the chevron
  - Humeral deltopectoral attachment with prominent development
  - "Astragalus with symmetrical articular surfaces: lateral surface for fibula
    and calcaneum as developed as the surface for the tibia"
  - Ratio of mediolateral expansion of the tibia to tibial facet of the
    astragalus nearly 75%
  - Astragalus with a hemispherical posterior bulge and without posterior fossa;
    mediolateral width four times its proximodistal height
