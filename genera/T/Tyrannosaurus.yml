genus: Tyrannosaurus
parent: Tyrannosaurinae
etymology: From Greek tyrannos (tyrant) and sauros (lizard); meaning
  "tyrant lizard", a name Osborn coined to convey the genus's
  exceptional size relative to all then-known carnivorous land
  vertebrates.
pronunciation:
  phonetic: ti-RAN-o-SAWR-us
  ipa: /tɪˌrænəˈsɔːrəs/
description: >
  Tyrannosaurus is the type genus of Tyrannosauridae and one of the
  most iconic non-avian dinosaurs, defined by a deep, massively built
  skull, a foreshortened presacral column of about 23 vertebrae, an
  extremely reduced two-fingered forelimb, and a heavy, columnar
  hindlimb terminating in a functionally tridactyl pes. Osborn erected
  the genus and its type species T. rex in 1905 on a partial skeleton
  (then cataloged AMNH 973, now CM 9380) collected by Barnum Brown in
  1902 from the Hell Creek beds of Dawson County, Montana. In the same
  paper Osborn also named Dynamosaurus imperiosus on a Wyoming skeleton
  (AMNH 5866), then formally sank it into Tyrannosaurus rex the
  following year. The mounted AMNH 5027 specimen, monographed by
  Osborn in 1916, became the public face of the genus for most of the
  twentieth century. The original AMNH 973 holotype was sold to the
  Carnegie Museum during World War II and became CM 9380. Cope's
  earlier name Manospondylus gigas (1892), based on lost dorsal
  vertebrae from the Hell Creek of South Dakota, was eventually
  declared a nomen oblitum because Tyrannosaurus has been in
  continuous use as the senior available name for over fifty years
  (ICZN Article 23.9). Modern work compiled by Brusatte et al. (2010)
  established T. rex as the largest Maastrichtian theropod of
  Laramidia, with a maximum body length around 13 m, growth rates on
  the order of 0.7 t per year through a fast-growth phase, and bite
  forces in excess of 13 kN.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - wetland
appearance:
  features:
    - reduced forelimbs
    - orbital crest
  integument: scaled
  evidence: direct
diagnostic_features:
  - Megalocephalic skull with deep, massively built proportions,
    brought close to the sacrum by a shortened presacral column of
    approximately 23 vertebrae.
  - Fused nasals forming an arched midline ridge on the snout that
    reinforces the skull against bite-induced stress.
  - Teeth heterodont and broadly oval to D-shaped in cross-section,
    with transverse diameter exceeding anteroposterior; alveolar
    reinforcing plates on the inner surface of the maxilla and
    dentary.
  - Squamosal bearing a distinctive horizontal anterior bar
    projecting into the laterotemporal fenestra.
  - Forelimb extremely reduced; functionally didactyl manus with
    powerful recurved unguals; humerus little more than half the
    length of the femur.
  - Five sacral vertebrae coossified into a single neural plate with
    three small fenestrations between S2 and S5.
  - Pubis, ilium and ischium firmly coalesced; pubis terminating
    distally in a hugely expanded pedicle ("pubic boot").
  - Caudal series of approximately 53 vertebrae forming a long,
    flexible balancing tail without the rod-like rigidity of
    ornithomimids.
