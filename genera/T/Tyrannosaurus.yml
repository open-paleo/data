species:
  - name: Tyrannosaurus rex
    etymology: From Latin rex, "king", chosen by Osborn to evoke the
      animal's standing as the largest carnivorous land vertebrate
      then known.
    status: valid
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Maastrichtian
    location:
      country: US
      region: US-MT
      formation: Hell Creek
      locality: Dawson County
      coordinates:
        - 47.5
        - -106.4
    size:
      hip_height_m:
        min: 3.75
        max: 3.75
      length_m:
        min: 11.9
        max: 13.0
      weight_kg:
        min: 5400
        max: 9500
    type_specimen:
      specimen_id:
        - CM 9380
      specimen_type: holotype
      institution: CM
      material: Partial skeleton with both jaws and portions of the skull, vertebrae,
        ribs, scapula, humerus, ilium, pubis, ischium, and metapodials.
      completeness: partial
    synonyms:
      - name: Dinotyrannus megagracilis
        type: junior subjective
        reason: Erected by Olshevsky (1995) as a new genus for Albertosaurus
          megagracilis Paul, 1988. Currie and others (2003) judged the material
          probably a juvenile Tyrannosaurus rex and later work has followed,
          though Longrich and Saitta (2024) refer it only to Tyrannosaurus
          indet.
      - name: Dynamosaurus imperiosus
        type: junior subjective
        reason: Erected by Osborn (1905) in the same paper as T. rex on
          AMNH 5866 from Wyoming; formally synonymised with T. rex by
          Osborn (1906) after direct comparison of the two type
          specimens.
      - name: Manospondylus gigas
        type: nomen oblitum
        reason: Erected by Cope (1892) on two dorsal vertebrae from the
          Hell Creek Formation of South Dakota; treated as indeterminate
          by Osborn (1916). The name is technically senior to
          Tyrannosaurus rex but, having been used in fewer than 25
          publications since 1899, is suppressed under ICZN Article 23.9
          in favor of Tyrannosaurus rex (nomen protectum).
    erected_in: osborn1905a
notable_specimens:
  - nickname: Sue
    specimen_id: [FMNH PR2081]
    institution: FMNH
    species: Tyrannosaurus rex
    category: most-complete
    significance: "The most complete (about 85 percent) and largest Tyrannosaurus skeleton, from the Hell Creek Formation. Histology shows it reached full size at age 19 and died at about 28, the longest estimated life of any tyrannosaur known."
    discovered:
      year: 1990
      by: "Sue Hendrickson"
    references: [brochu2003a]
  - nickname: Stan
    specimen_id: [NHMAD 2020.00001, BHI 3033]
    institution: NHMAD
    species: Tyrannosaurus rex
    category: pathology
    significance: "The second most complete Tyrannosaurus skeleton, 199 bones representing 70 percent of the total, from the Hell Creek Formation. Its pathologies include broken and healed ribs, a broken and healed neck, and a hole in the back of the head about the size of a Tyrannosaurus tooth."
    discovered:
      year: 1992
      by: "Stan Sacrison"
    references: [wolff2009a, tanke1998a]
  - nickname: Scotty
    specimen_id: [RSM P2523.8]
    institution: RSM-CA
    species: Tyrannosaurus rex
    category: largest-individual
    significance: "Reported to measure 13 meters in length. Using a mass estimation technique extrapolating from femur circumference, Scotty was estimated as the largest known Tyrannosaurus specimen at 8.87 t in body mass."
    references: [persons2019a]
  - nickname: B-rex
    specimen_id: [MOR 1125]
    institution: MOR
    species: Tyrannosaurus rex
    category: reproductive
    significance: "From the Hell Creek Formation. Yielded medullary tissue in its femur, found only in female birds during ovulation, confirming it as a female that died during ovulation; the only Tyrannosaurus conclusively sexed. Also a source of reported soft-tissue blood vessels and collagen."
    references: [schweitzer2005a]
  - nickname: Wyrex
    specimen_id: [HMNS 2006.1743.01, BHI 6230]
    institution: HMNS
    species: Tyrannosaurus rex
    category: exceptional-preservation
    significance: "Preserves patches of mosaic scales on the tail, hip, and neck, used in a 2017 review concluding that feather covering of large tyrannosaurids, if present, was limited to the upper side of the trunk. Also shows pathologies: a hole penetrating its jugal and severe tail trauma with bone remodeling."
    discovered:
      year: 2002
      by: "Dan Wells and Don Wyrick"
    references: [bell2017a]
  - nickname: Wankel rex
    specimen_id: [MOR 555]
    institution: MOR
    species: Tyrannosaurus rex
    category: complementary
    significance: "The first complete Tyrannosaurus forelimbs were identified in 1989 belonging to MOR 555, confirming that the genus had short two-fingered arms about 1 meter long, as had been suggested from the related Gorgosaurus."
    references: [carpenter2001c]
references:
  - id: brochu2003a
  - id: wolff2009a
  - id: tanke1998a
  - id: persons2019a
  - id: schweitzer2005a
  - id: bell2017a
  - id: carpenter2001c
  - id: osborn1905a
    notes: Erects Tyrannosaurus rex on AMNH 973 (now CM 9380) from the Hell
      Creek Formation of Dawson County, Montana, and in the same paper names
      Dynamosaurus imperiosus and Albertosaurus sarcophagus.
  - id: osborn1906a
    notes: Refines the T. rex skull description and formally synonymises
      Dynamosaurus imperiosus with Tyrannosaurus.
  - id: osborn1917a
    notes: First detailed monograph on the mounted AMNH 5027 referred skeleton;
      treats Manospondylus gigas as indeterminate and establishes the classic
      20th-century Tyrannosaurus skeletal interpretation.
  - id: brusatte2010a
    notes: Modern multi-author review of tyrannosaur paleobiology; summarises
      growth rate, bite force, ontogenetic skull change and locomotor modeling
      for T. rex.
  - id: molina-pérez2019a
    notes: Source of the hip height estimate.
  - id: paul2024b
    notes: Source of the appearance features.
  - id: currie2003a
    notes: Judges the material of Albertosaurus megagracilis, renamed
      Dinotyrannus megagracilis, probably a juvenile Tyrannosaurus rex.
  - id: cope1892a
    notes: Named Manospondylus gigas, later declared a nomen oblitum relative to Tyrannosaurus.
