synonyms:
  - name: Dynamosaurus imperiosus
    type: junior subjective
    reason: Erected by Osborn (1905) in the same paper as T. rex on
      AMNH 5866 from Wyoming; formally synonymised with T. rex by
      Osborn (1906) after direct comparison of the two type
      specimens.
  - name: Manospondylus gigas
    type: nomen oblitum
    reason: Erected by Cope (1892) on two dorsal vertebrae from the
      Hell Creek Formation of South Dakota; treated as indeterminate
      by Osborn (1916). The name is technically senior to
      Tyrannosaurus rex but, having been used in fewer than 25
      publications since 1899, is suppressed under ICZN Article 23.9
      in favor of Tyrannosaurus rex (nomen protectum).
