notable_specimens:
  - nickname: Sue
    specimen_id: [FMNH PR2081]
    institution: FMNH
    species: Tyrannosaurus rex
    category: most-complete
    significance: "The most complete (about 85 percent) and largest Tyrannosaurus skeleton, from the Hell Creek Formation. Histology shows it reached full size at age 19 and died at about 28, the longest estimated life of any tyrannosaur known."
    discovered:
      year: 1990
      by: "Sue Hendrickson"
    references: [brochu2003a]
  - nickname: Stan
    specimen_id: [NHMAD 2020.00001, BHI 3033]
    institution: NHMAD
    species: Tyrannosaurus rex
    category: pathology
    significance: "The second most complete Tyrannosaurus skeleton, 199 bones representing 70 percent of the total, from the Hell Creek Formation. Its pathologies include broken and healed ribs, a broken and healed neck, and a hole in the back of the head about the size of a Tyrannosaurus tooth."
    discovered:
      year: 1992
      by: "Stan Sacrison"
    references: [wolff2009a, tanke1998a]
  - nickname: Scotty
    specimen_id: [RSM P2523.8]
    institution: RSM-CA
    species: Tyrannosaurus rex
    category: largest-individual
    significance: "Reported to measure 13 meters in length. Using a mass estimation technique extrapolating from femur circumference, Scotty was estimated as the largest known Tyrannosaurus specimen at 8.87 t in body mass."
    references: [persons2019a]
  - nickname: B-rex
    specimen_id: [MOR 1125]
    institution: MOR
    species: Tyrannosaurus rex
    category: reproductive
    significance: "From the Hell Creek Formation. Yielded medullary tissue in its femur, found only in female birds during ovulation, confirming it as a female that died during ovulation; the only Tyrannosaurus conclusively sexed. Also a source of reported soft-tissue blood vessels and collagen."
    references: [schweitzer2005a]
  - nickname: Wyrex
    specimen_id: [HMNS 2006.1743.01, BHI 6230]
    institution: HMNS
    species: Tyrannosaurus rex
    category: exceptional-preservation
    significance: "Preserves patches of mosaic scales on the tail, hip, and neck, used in a 2017 review concluding that feather covering of large tyrannosaurids, if present, was limited to the upper side of the trunk. Also shows pathologies: a hole penetrating its jugal and severe tail trauma with bone remodeling."
    discovered:
      year: 2002
      by: "Dan Wells and Don Wyrick"
    references: [bell2017a]
  - nickname: Wankel rex
    specimen_id: [MOR 555]
    institution: MOR
    species: Tyrannosaurus rex
    category: complementary
    significance: "The first complete Tyrannosaurus forelimbs were identified in 1989 belonging to MOR 555, confirming that the genus had short two-fingered arms about 1 meter long, as had been suggested from the related Gorgosaurus."
    references: [carpenter2001c]
