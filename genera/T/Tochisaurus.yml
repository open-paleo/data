genus: Tochisaurus
parent: Troodontidae
dispute:
  summary: >
    Tochisaurus nemegtensis is known only from a single metatarsus. It is accepted
    as a valid troodontid on the distinctive slender, functionally didactyl foot
    (Kurzanov and Osmolska, 1991), but the single-element holotype prevents any
    finer placement. It is placed at Troodontidae incertae sedis.
  history:
    - date: "2026-07-01"
      note: Placed at Troodontidae incertae sedis; single-metatarsus holotype. Flagged for Literature Review.
pronunciation:
  phonetic: TOHK-i-SAWR-us
etymology: "From Mongolian 'tochi' meaning 'ostrich' and Greek 'sauros' meaning
  'lizard', alluding to its ostrich-like form."
description: Tochisaurus is a genus of small troodontid theropod dinosaur from
  the Late Cretaceous Period of Mongolia. The type (and only named) species is
  Tochisaurus nemegtensis.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Metatarsus very slender, distinctly more so than in other troodontids
    including Troodon formosus.
  - Metatarsal II strongly reduced, with distal articular head much smaller than
    those of metatarsals III and IV, implying reduction of the second pedal
    digit.
  - Proximal articular surface of metatarsus inclined relatively strongly
    anterodistally, a feature absent in the contemporaneous Saurornithoides
    junior.
  - Metatarsal II proximally about half the width of metatarsal IV,
    proportionally narrower than in Saurornithoides junior.
appearance:
  integument: feathered
  evidence: inferred
