genus: Thanatotheristes
parent: Tyrannosaurinae
etymology: From Greek Thanatos, "death", combined with Greek theristḗs, "harvester" - means "reaper of death" (literally "death harvester")
pronunciation:
  phonetic: THA-nah-toe-theh-RISS-teez
description: Thanatotheristes is a genus of tyrannosaurid dinosaur from the Late
  Cretaceous of Laramidia, approximately 80.1-79.5 Ma. Thanatotheristes contains
  only one species, T. degrootorum. Fossils of this taxon are found in the
  Foremost Formation of Alberta, Canada, coexisting with medium-sized
  ceratopsids like Xenoceratops foremostensis and small pachycephalosaurids like
  Colepiocephale lambei.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - coastal
diagnostic_features:
  - Single row of evenly-spaced dorsoventrally-oriented ridges on subcutaneous
    surface of maxilla ventral/anteroventral to antorbital fossa
  - Rounded and inflated orbital margin of the jugal with oval cross-section
  - Sagittal crest extends anterior to supratemporal ridge as broad, rounded
    ridge
  - Lacrimal contact surface on frontal extends anteromedially at ~60° to
    interfrontal suture
  - Prefrontal with two posteriorly-projecting prongs on ventral skull roof
    (medial primary, lateral secondary)
