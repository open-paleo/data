genus: Tanystropheus
parent: Tanystropheidae
description: Tanystropheus is an extinct genus of archosauromorph reptile which
  lived during the Triassic Period in Europe, Asia, and North America. It is
  recognisable by its extremely elongated neck, longer than the torso and tail
  combined. The neck was composed of 13 vertebrae strengthened by extensive
  cervical ribs. Tanystropheus is one of the most well-described
  non-archosauriform archosauromorphs, known from numerous fossils, including
  nearly complete skeletons. Some species within the genus may have reached a
  total length of 6 meters (20 ft), making Tanystropheus the longest
  non-archosauriform archosauromorph as well. Tanystropheus is the namesake of
  the family Tanystropheidae, a clade collecting many long-necked Triassic
  archosauromorphs previously described as "protorosaurs" or "prolacertiforms".
diet: piscivore
