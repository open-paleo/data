genus: Taurovenator
parent: Carcharodontosaurinae
dispute:
  summary: >
    Taurovenator violantei is recovered among the giganotosaurine
    carcharodontosaurids (Aranciaga Rolando et al., 2024), but its validity is
    disputed: Coria and Currie (2020) considered it a junior synonym of Mapusaurus,
    while a redescription based on new material (MPCA-Pv 803) defended it as
    distinct, and other analyses recover it only as an unstable wildcard within
    Carcharodontosauridae (Cau and Paterna, 2025).
  history:
    - date: "2026-07-01"
      note: Placed at Carcharodontosaurinae following Aranciaga Rolando et al. (2024); the Mapusaurus synonymy and its phylogenetic instability remain unresolved.
etymology: From Latin 'taurus' meaning 'bull' and 'venator' meaning 'hunter',
  hence 'bull hunter'.
pronunciation:
  phonetic: TOH-ro-VEN-uh-tuh
description: Taurovenator, from Latin taurus, meaning "bull", and venator,
  meaning "hunter", is an extinct genus of large, probable carcharodontosaurid
  theropod dinosaurs that lived in what is now Argentina during the Cenomanian
  age of the Late Cretaceous, around 95 to 93.9 million years ago. Initially
  only known from a single postorbital skull bone described from the Huincul
  Formation, Taurovenator violantei was named in 2016 by Argentine
  paleontologist Matias Motta and colleagues. Debate came about over the
  validity of the species, with some paleontologists arguing that Taurovenator
  was synonymous with the earlier-named carcharodontosaurid Mapusaurus. However,
  the 2024 description of a well-preserved partial skull and skeleton referrable
  to Taurovenator aided in distinguishing the two taxa.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Horn-like prominence on posterodorsal margin of orbital brow
  - Deep subrectangular pneumatic pit on ventral surface of postorbital
  - Postorbital bar subcircular in cross-section, resembling Carcharodontosaurus
  - Dorsoventrally short ventral ramus with acute angle to orbital brow
  - Vertical ridge on medial surface of ventral process for laterosphenoid and
    jugal articulation
  - Posterolateral wall of orbital brow projects ventrally and surrounds orbit
