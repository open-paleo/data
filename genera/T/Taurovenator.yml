genus: Taurovenator
parent: Carcharodontosaurinae
dispute:
  summary: >
    Taurovenator violantei is recovered among the giganotosaurine
    carcharodontosaurids (Aranciaga Rolando et al., 2024), but its validity is
    disputed: Coria et al. (2020) considered it a junior synonym of Mapusaurus,
    finding both characters that diagnose the holotype postorbital present in
    Mapusaurus and, less developed, in Giganotosaurus. The 2024 redescription
    answers from new material (MPCA-PV 803) that the horn-like projection is
    absent in those genera and the ventral excavation shallower and
    unperforated, while other analyses recover Taurovenator only as an unstable
    wildcard within Carcharodontosauridae (Cau and Paterna, 2025).
  history:
    - date: "2026-07-01"
      note: Placed at Carcharodontosaurinae following Aranciaga Rolando et al. (2024); the Mapusaurus synonymy and its phylogenetic instability remain unresolved.
etymology: From Latin 'taurus' meaning 'bull' and 'venator' meaning 'hunter',
  hence 'bull hunter'.
pronunciation:
  phonetic: TOH-ro-VEN-uh-tuh
description: Taurovenator, from Latin taurus, meaning "bull", and venator,
  meaning "hunter", is an extinct genus of large, probable carcharodontosaurid
  theropod dinosaurs that lived in what is now Argentina during the Cenomanian
  age of the Late Cretaceous, around 95 to 93.9 million years ago. Initially
  only known from a single postorbital skull bone described from the Huincul
  Formation, Taurovenator violantei was named in 2016 by Argentine
  paleontologist Matias Motta and colleagues. Debate came about over the
  validity of the species, with some paleontologists arguing that Taurovenator
  was synonymous with the earlier-named carcharodontosaurid Mapusaurus. However,
  the 2024 description of a well-preserved partial skull and skeleton referrable
  to Taurovenator aided in distinguishing the two taxa.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Postorbital with a horn-like, deeply rugose projection, strongly expanded
    dorsally and transversely, on the posterodorsal surface of the anterior
    process
  - Postorbital with a deep excavation on its ventral surface bearing a deep
    quadrangular foramen
  - Jugal with two foramina between the processes for the quadratojugal, a
    lateroventrally oriented ventral margin below the thick shelf, and a
    ridge-like vertical rugosity at mid-length of the anterior process
  - Quadrate head vertically oriented in posterior view, the quadrate ridge
    stopping short of it, and the medial distal condyle larger than the lateral
  - Ectopterygoid with the anterior part of the pterygoid process thin in medial
    or lateral view
  - Humerus with a notably anteroposteriorly thin proximal end and a medially
    directed internal tuberosity, and radius with the distal tubercle set far
    from the medioanterior lip of the distal end
