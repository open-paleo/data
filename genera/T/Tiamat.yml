genus: Tiamat
parent: Titanosauria
etymology: Named after Tiamat, the primordial sea goddess of Mesopotamian (Babylonian) mythology, reflecting the ancient and primordial nature of the dinosaur.
description: Tiamat is a genus of titanosaur sauropod dinosaur from the Late
  Cretaceous (Cenomanian) Açu Formation of Ceará State, northeastern Brazil.
  The type species is Tiamat valdecii, described in 2024.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - deltaic
  - fluvial
diagnostic_features:
  - Marked accessory tuberosity dorsoventrally developed above prezygapophyses
    in middle caudal vertebrae
  - Deeply medioventral excavated articulation facets of prezygapophysis and
    post-zygapophysis
  - Presence of hypantrum–hyposphene articulations throughout caudal vertebral
    series
  - Short middle caudal centra with well-marked articular facets for haemal arch
  - Rough structure on spinopostzygapophyseal lamina unique among titanosaurs
