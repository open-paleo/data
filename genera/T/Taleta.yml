genus: Taleta
parent: Lambeosaurinae
etymology: From Arabic 'taleta' (three), in reference to this being the third
  duck-billed dinosaur recovered from Couche III of the Moroccan phosphates,
  after Ajnabia odysseus and Minqaria bata.
pronunciation:
  phonetic: tuh-LAH-tuh
description: Taleta is an extinct genus of arenysaurin lambeosaurine
  hadrosaurid dinosaur from the late Maastrichtian Couche III of the Oulad
  Abdoun Basin (Sidi Chennane mines, Central Morocco), a shallow-marine
  phosphorite depositional setting. The single species, Taleta taleta, is
  known from associated left and right maxillae of a single individual
  (MHNM.KH.1557) preserving in-situ dentition; phylogenetic analysis recovers
  it within Arenysaurini, forming an African clade with Ajnabia odysseus and
  Minqaria bata. Longrich et al. (2025) interpret the three Moroccan
  arenysaurins as a dispersal-driven adaptive radiation seeded from southern
  Europe.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - marine
  - coastal
diagnostic_features:
  - Ectopterygoid ridge positioned high (dorsally) on the lateral surface of
    the maxilla.
  - Alveolar margin higher laterally than medially, such that alveoli open
    ventrolaterally.
  - Single functional tooth per maxillary tooth family.
  - Maxillary teeth greatly enlarged, with crowns obliquely oriented and
    raked backwards relative to the alveolar margin.
  - Primary ridge of maxillary teeth extremely tall and prominent, roughly
    doubling the mediolateral width of the crown, and interlocking with the
    alveolar margin.
  - Toothrow very straight in both lateral and ventral views.
