genus: Teratophoneus
parent: Teratophoneini
etymology: "From Ancient Greek 'teras' meaning 'monster' and 'phoneus' meaning 'murderer', translating as 'monstrous murderer'."
pronunciation:
  phonetic: teh-RAT-o-FO-nee-us
description: Teratophoneus is a genus of tyrannosaurine theropod dinosaur that
  lived during the late Campanian age of the Late Cretaceous period, (about 76.5
  to 75.5 million years ago) in what is now Utah. It contains a single known
  species, T. curriei, named in honor of paleontologist Philip J. Currie. It is
  known from an incomplete skull and postcranial skeleton recovered from the
  Kaiparowits Formation.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - wetland
diagnostic_features:
  - Maxilla with steep rostrodorsal margin and maxillary fenestra situated far
    caudal to antorbital fossa
  - Complete overlap on caudal margin of frontal by parietal
  - Distinct angle in caudal margin of postorbital process of jugal
  - Transversely oriented occiput with paroccipital processes extending nearly
    directly laterally
  - Short basicranium with basisphenoid recess nearly closed and steeply
    rostroventrally inclined ventral margin
  - Reduced tooth count of 12 in maxilla and 14 in dentary
appearance:
  features:
    - orbital crest
    - cranial bosses
  integument: unknown
