genus: Talos
parent: Saurornithoidini
pronunciation:
  ipa: /ˈteɪlɒs/
  phonetic: TAY-luhs
etymology: Named after Talos, the bronze giant automaton of Greek mythology who
  protected the island of Crete, referencing the raptor's taloned foot.
description: Talos is a genus of troodontid theropod dinosaur from the Late
  Cretaceous Kaiparowits Formation of Utah, United States. It contains a single
  species, Talos sampsoni, described from a partial skeleton in 2011. Talos was
  a small bipedal carnivore approximately 2 m long.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - wetland
diagnostic_features:
  - Intercondylar bridge of astragalus hyperconstricted
  - Proximal groove separating astragalar body and ascending process
    craniocaudally wide and V-shaped
  - Shaft of metatarsal II markedly compressed with midshaft
    length-to-transverse width ratio of 38.8
  - Pronounced, rounded tab on dorsolateral aspect of metatarsal III proximal to
    distal condyle
  - Distal corner of lateral collateral ligament pit on metatarsal IV with small
    protuberance creating rounded depression between extensor aspects of distal
    condyles
appearance:
  features:
    - sickle claw
