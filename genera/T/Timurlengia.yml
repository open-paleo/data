genus: Timurlengia
parent: Tyrannosauroidea
etymology: Named after Timur-Lenk (Tamerlane), the 14th-century Central Asian conqueror, reflecting the dinosaur's discovery in Uzbekistan
description: Timurlengia is an extinct genus of tyrannosauroid dinosaurs known
  from the early Late Cretaceous (Turonian age) Bissekty Formation of the
  Kyzylkum Desert in Uzbekistan. The genus contains a single species,
  Timurlengia euotica, named in 2016 based on a braincase and numerous single
  bones of many individuals.
