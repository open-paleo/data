genus: Timurlengia
parent: Tyrannosauroidea
etymology: Named after Timur-Lenk (Tamerlane), the 14th-century Central Asian conqueror, reflecting the dinosaur's discovery in Uzbekistan
description: Timurlengia is an extinct genus of tyrannosauroid dinosaurs known
  from the early Late Cretaceous (Turonian age) Bissekty Formation of the
  Kyzylkum Desert in Uzbekistan. The genus contains a single species,
  Timurlengia euotica, named in 2016 based on a braincase and numerous single
  bones of many individuals.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - diamond-shaped ventral supraoccipital projection excluded from foramen
    magnum rim
  - extremely short basal tubera approximately one-third depth of occipital
    condyle
  - deep funnel-like otic recess widely opening onto lateral braincase surface
  - large inner ear with robust semicircular canals
  - extremely robust semicircular canals compared to all other theropods
  - elongated cochlear duct extending far ventral to brain endocast
