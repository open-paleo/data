genus: Turiasaurus
parent: Turiasauria
etymology: Named after Turia, the ancient Roman name for the Teruel region of Spain where it was found, plus Greek sauros ('lizard'), meaning 'Turia lizard'
pronunciation:
  phonetic: TOO-ree-uh-SOR-us
description: Turiasaurus is a genus of sauropod dinosaurs. It is known from a
  single fossil specimen representing the species Turiasaurus riodevensis, found
  in the Kimmeridgian Villar del Arzobispo Formation of Teruel, Spain.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - coastal
diagnostic_features:
  - Prezygapophyseal and postzygapophyseal articular facets on middle dorsal
    vertebrae strongly convex and concave, respectively
  - Strongly convex subcircular hyposphene on middle dorsal vertebrae
  - Distal caudal vertebrae strongly opisthocoelous
  - Accessory process projecting caudodorsally from dorsal margin of proximal
    cervical rib shafts
  - Distal humeral condyles strongly expanded cranially and caudally
  - Radius and ulna distal condyles very compressed mediolaterally
  - Carpal with two subcircular distal processes separated by depression
  - Cnemial crest of tibia reduced and directed cranially
  - Fibula with roughened oval medial trochanter on middle-distal part
  - Metatarsal V with strongly expanded distal end
appearance:
  features:
    - bifurcated cervical spines
  integument: scaled
  evidence: inferred
