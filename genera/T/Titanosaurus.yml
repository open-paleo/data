genus: Titanosaurus
parent: Titanosauria
etymology: From the Greek Titans of mythology and sauros
  (lizard); meaning "titan lizard", chosen by Lydekker in
  reference to the great size of the type vertebrae.
pronunciation:
  ipa: /taɪˌtænəˈsɔːrəs/
  phonetic: tie-TAN-o-SOR-us
description: >
  Titanosaurus is a dubious genus of sauropod dinosaurs, first
  described by Richard Lydekker in 1877. It is known from the
  Maastrichtian (Upper Cretaceous) Lameta and Kallakurichi
  Formations of India.
diet: herbivore
locomotion: quadrupedal
diagnostic_features:
  - Posterior caudal vertebrae distinctly procoelous (strongly concave
    anteriorly, convex posteriorly), distinguishing them from all known European
    Dinosauria
  - Caudal vertebrae markedly laterally compressed, differing from the
    approximately cylindrical centra of Pelorosaurus, Cetiosaurus, and
    Hylaeosaurus
  - Prezygapophyses cylindriform and projecting far forward beyond the centrum
  - Neural arch anchylosed to anterior half of centrum only; posterior half of
    centrum free of neural arch
  - Two pairs of chevron-bone facets per vertebra (intervertebral articulation),
    a feature shared with Iguanodon and Hylaeosaurus but here combined with
    procoelous ends
paleoenvironment:
  - fluvial
appearance:
  integument: armored
  evidence: direct
