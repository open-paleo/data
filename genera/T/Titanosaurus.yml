    notes: Erects Titanosaurus indicus on a femur and two posterior caudal
      vertebrae from the Lameta Group at Jabalpur; Lydekker considered the
      procoelous, laterally compressed caudals diagnostic.
  - id: wilson2003b
    notes: "Treats T. indicus and T. blanfordi as nomina dubia: Lydekker's caudal characters are now broadly distributed within Titanosauria, and no autapomorphies are identified in the type material."
