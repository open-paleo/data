    holotype:
      specimen_id:
        - GSI 2191/2194
      specimen_type: holotype
      institution: GSI
      material: A single posterior caudal vertebra (with two
        adjacent serial numbers, 2191 and 2194, inked on the
        bone) from the Lameta Group at Jabalpur. Lydekker's
        original 1877 type series also included a femur (GSI
        K22/754) — reassigned in 1933 by Matley and Huene to
        Antarctosaurus septentrionalis (now Jainosaurus) — and
        a second smaller caudal whose whereabouts are still
        unknown. The principal vertebra was rediscovered by
        Mohabey and Sengupta on 25 April 2012 at GSI Kolkata.
      completeness: fragmentary
