genus: Tugulusaurus
parent: Alvarezsauroidea
dispute:
  summary: >
    Tugulusaurus faciles was long treated as an enigmatic coelurosaur or
    ornithomimosaur, and even as a nomen dubium, until its validity was
    reaffirmed by the redescription of Rauhut and Xu (2005). It has since been
    recovered as a basal alvarezsauroid by Xu et al. (2018) and within a Bannykus
    plus Tugulusaurus plus Xiyunykus clade by Meso et al. (2024), a placement
    adopted by Jones (2026).
  history:
    - date: "2026-07-01"
      note: Placed at Alvarezsauroidea following Xu et al. (2018) and Meso et al. (2024); the referral rests on a single matrix lineage and the earlier uncertain-coelurosaur interpretation is noted.
pronunciation:
  phonetic: too-GOO-loo-SAWR-us
etymology: "Named for the Tugulu Group geological formation of Xinjiang, China,
  where the fossils were found, combined with Greek 'sauros' meaning 'lizard'."
description: Tugulusaurus is a genus of coelurosaurian theropod dinosaur,
  belonging to the Alvarezsauroidea, that is known from the Early Cretaceous
  Tugulu Group in the Urhe area of China. It was one of the first members of
  Alvarezsauria ever discovered. The type and only known species is T. faciles.
diet: carnivore
locomotion: bipedal
