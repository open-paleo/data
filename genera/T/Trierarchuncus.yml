genus: Trierarchuncus
parent: Alvarezsauridae
etymology: captain hook
description: Trierarchuncus is a monotypic genus of alvarezsaurid theropod which
  includes a single species, Trierarchuncus prairiensis, mainly known from
  fossils found in deposits of the Hell Creek Formation in Montana. It is the
  youngest known alvarezsaurid and one of the last non-avian dinosaurs, going
  extinct during the Cretaceous–Paleogene extinction event, which occurred
  approximately 66 million years ago.
diet: carnivore
locomotion: bipedal
