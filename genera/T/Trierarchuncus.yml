genus: Trierarchuncus
parent: Alvarezsauridae
etymology: Named from Greek meaning 'captain hook,' in reference to its single-clawed hands
pronunciation:
  phonetic: tree-uh-rar-chun-kuss
description: Trierarchuncus is a monotypic genus of alvarezsaurid theropod which
  includes a single species, Trierarchuncus prairiensis, mainly known from
  fossils found in deposits of the Hell Creek Formation in Montana. It is the
  youngest known alvarezsaurid and one of the last non-avian dinosaurs, going
  extinct during the Cretaceous-Paleogene extinction event, which occurred
  approximately 66 million years ago.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Ventral sulcus extends proximally to reach distal extent of ventral foramina
    but does not extend between them
  - Deep lateral embayment of ventral foramina displaced strongly medially,
    width of embayment >10% of total ungual width
  - Extensive rugosity developed as spur-like projections over proximal end
  - Flexor tubercle formed into two small mounds
  - Slight lateral pinching of proximal articular end, forming weak butterfly
    shape
  - Wide notch on distal radius between proximal extension of aponeurosis
    tubercle and ulnar suture
appearance:
  integument: feathered
  evidence: inferred
