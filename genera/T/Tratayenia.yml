genus: Tratayenia
parent: Megaraptoridae
etymology: "Named after Tratayén, the fossil site in Neuquén Province, Argentina, where the holotype skeleton was excavated"
pronunciation:
  phonetic: treh-ta-YAY-nee-uh
description: Tratayenia is an extinct genus of megaraptoran theropod dinosaurs
  known from remains found in the Late Cretaceous (Santonian age) Bajo de la
  Carpa Formation of Argentina. The type and only species, Tratayenia rosalesi,
  was described in March 2018.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - arid
diagnostic_features:
  - Unique paired laminae in inverted 'Y' form extending from ventrolateral
    corner of anterior neural spine edge to base of prezygapophysis in middle
    dorsal vertebrae
  - Paradiapophyseal lamina well-developed and continuous from dorsal 7 through
    at least dorsal 13, unlike reduced forms in Aerosteon and Murusraptor
  - Hyposphenes of posterior dorsal vertebrae thin and blade-like dorsally,
    contrasting with robust forms in Aerosteon and Murusraptor
  - Anterior and ventral margins of prezygapophyses nearly vertical and
    horizontal in lateral view when observed in middle and posterior dorsal
    vertebrae
  - Posterior neural spines exhibiting progressive increase in height from
    dorsal 8 through dorsal 11
  - Dorsal margin of ilium straight rather than slightly convex, with broadly
    rounded anterodorsal corner, differing from Aerosteon and Murusraptor
