genus: Tameryraptor
parent: Carcharodontosauridae
placement: incertae sedis
dispute:
  summary: >
    Tameryraptor markgrafi, erected for Stromer's destroyed Bahariya
    carcharodontosaurid, is recovered as a derived carcharodontosaurid outside
    Carcharodontosaurinae (Kellermann and colleagues, 2025) or as the sister taxon of
    Carcharodontosaurus saharicus (Cau and Paterna, 2025). It is placed at
    Carcharodontosauridae incertae sedis.
etymology: From Egyptian Tamery, meaning "the beloved land" (an ancient Egyptian
  name for Egypt), combined with Latin raptor, "thief" — means "thief from the
  beloved land"
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - coastal
  - wetland
diagnostic_features:
  - Small nasal horn on medial rim of nasals
  - Frontals vaulted dorsally
  - Internasal suture inclined ventromedially
  - Anterior caudal vertebrae with well-developed pneumaticity and foramina
    posterior to prezygapophyses
  - Femur with spike-like accessory trochanter
  - Maxilla with well-developed antorbital ridge
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "505393"
  - source: wikidata
    id: Q131755747
species:
  - name: Tameryraptor markgrafi
    etymology: "Named for Richard Markgraf, the Austro-Hungarian paleontologist who
      discovered the fossil remains in Egypt in 1914."
    pronunciation:
      phonetic: MARK-grahf-eye
    status: valid
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Cenomanian
    location:
      country: EG
      locality: two kilometers from Ain Gedid on the western foot of the Gebel Harra
      region: EG-GZ
      formation: Bahariya
    size:
      length_m:
        min: 8.0
        max: 9.0
    type_specimen:
      specimen_id: [ SNSB-BSPG 1922 X 46 ]
      specimen_type: holotype
      institution: BSPG
      status: destroyed
      material: Partial skeleton with left and right maxilla, nasals, braincase parts,
        three cervical vertebrae, caudal vertebra, rib, left ischium, pubis (both
        sides), femora, and left fibula.
      completeness: partial
    erected_in: kellermann2025a
references:
  - id: kellermann2025a
  - id: cau2025a
    notes: Recovered Tameryraptor as the sister taxon of Carcharodontosaurus saharicus.
