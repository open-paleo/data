genus: Tameryraptor
parent: Carcharodontosauridae
dispute:
  summary: >
    Tameryraptor markgrafi, erected for Stromer's destroyed Bahariya
    carcharodontosaurid, is recovered as a derived carcharodontosaurid outside
    Carcharodontosaurinae (Kellermann et al., 2025) or as the sister taxon of
    Carcharodontosaurus saharicus (Cau and Paterna, 2025). It is placed at
    Carcharodontosauridae incertae sedis.
  history:
    - date: "2026-07-01"
      note: Placed at Carcharodontosauridae incertae sedis; its position relative to Carcharodontosaurus is unresolved.
etymology: From Egyptian Tamery, meaning "the beloved land" (an ancient Egyptian
  name for Egypt), combined with Latin raptor, "thief" - means "thief from the
  beloved land"
description: Tameryraptor is an extinct genus of large carcharodontosaurid
  dinosaur that lived during the Late Cretaceous (Cenomanian age) in what is now
  Egypt. It is known from a partial skeleton collected in rock layers from the
  Bahariya Formation by crews of German paleontologist Ernst Stromer in 1914,
  comprising an incomplete skull, vertebrae, and several other postcranial
  elements. Stromer described the specimen in 1931, referring it to the
  previously named Megalosaurus saharicus on the basis of its tooth anatomy, and
  placing it in a new genus, Carcharodontosaurus. In 1944, it was destroyed in
  the Bombing of Munich during the Second World War. The specimen remained
  assigned to Carcharodontosaurus saharicus until a review of photographs of the
  fossil material in 2025 allowed researchers around German paleontologist
  Maximilian Kellermann to recognize the material as belonging to a distinct
  taxon known from a single species, Tameryraptor markgrafi.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - coastal
  - wetland
diagnostic_features:
  - Small nasal horn on medial rim of nasals
  - Frontals vaulted dorsally
  - Internasal suture inclined ventromedially
  - Anterior caudal vertebrae with well-developed pneumaticity and foramina
    posterior to prezygapophyses
  - Femur with spike-like accessory trochanter
  - Maxilla with well-developed antorbital ridge
