genus: Tsaagan
parent: Velociraptorinae
etymology: From Mongolian meaning 'white' (цагаан)
pronunciation:
  phonetic: SAR-gan
description: Tsaagan is a genus of dromaeosaurid dinosaur from the Djadokhta
  Formation of the Late Cretaceous of Mongolia.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - arid
diagnostic_features:
  - paroccipital process pendulous and not twisted distally
  - basipterygoid process elongate and anteroventrally directed
  - maxillary fenestra large and located at anterior edge of antorbital fossa
  - jugal meets squamosal to exclude postorbital from infratemporal fenestra rim
appearance:
  integument: feathered
  evidence: inferred
