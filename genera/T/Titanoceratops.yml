genus: Titanoceratops
parent: Chasmosaurinae
etymology: "From Greek 'titanos' meaning 'titan' (giant) and 'ceratops' meaning 'horned face', in reference to its exceptionally large size among horned dinosaurs."
pronunciation:
  phonetic: tie-TAN-o-SEH-ruh-tops
description: Titanoceratops is a controversial genus of chasmosaurine
  ceratopsian dinosaur that lived in the Late Cretaceous period (Campanian
  stage, about 75 million years ago) in what is now New Mexico. Titanoceratops
  was named for its large size, being one of the largest known horned dinosaurs
  and the type species was named T. ouranos, after Uranus (Ouranos), the father
  of the Greek titans. It was named in 2011 by Nicholas R. Longrich for a
  specimen previously referred to Pentaceratops. Longrich believed that unique
  features found in the skull reveal it to have been a close relative of
  Triceratops, classified within the subgroup Triceratopsini. However, other
  researchers have expressed skepticism, and believe Titanoceratops to simply be
  an unusually large, old specimen of Pentaceratops.
dispute:
  summary: >
    Titanoceratops is contested between a valid genus and an exceptionally large
    individual of Pentaceratops. Longrich (2011) erected it for OMNH 10165 and
    recovered it as the earliest triceratopsin, and Dalman et al. (2022) likewise
    recovered it within Triceratopsini. Lehman (1998) had interpreted the same
    specimen as an aberrant large Pentaceratops sternbergii, and Fowler and
    Freedman Fowler (2020) treat it as aff. Pentaceratops and exclude it from
    their matrix. Its resolution below subfamily level is therefore unsettled.
  history:
    - date: "2026-06-26"
      note: Placed at Chasmosaurinae, accepted whether Titanoceratops is a valid basal triceratopsin or a large Pentaceratops; tribes dropped.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - wetland
diagnostic_features:
  - Extreme enlargement of the premaxillary fossa
  - Thin squamosals with narrow parietal median bar
  - Parietal fenestrae present
  - Low and broad squamosal epoccipitals
  - Vertically oriented narial strut with narrow base
  - Large, hornlike epijugal oriented caudolaterally
appearance:
  features:
    - brow horns
    - nasal horn
    - neck frill
    - epoccipitals
    - keratinous beak
  integument: scaled
  evidence: inferred
