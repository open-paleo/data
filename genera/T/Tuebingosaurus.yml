genus: Tuebingosaurus
parent: Massopoda
etymology: Named after Tübingen, Germany (where the specimen was stored at the University of Tübingen), combined with Greek sauros meaning 'lizard'; translates as 'Tübingen lizard'
pronunciation:
  phonetic: tur-bin-jo-sor-us
description: Tuebingosaurus is an extinct genus of massopodan sauropodomorph
  dinosaur from the Late Triassic Trossingen Formation of Germany. The genus
  contains a single species, Tuebingosaurus maierfritzorum, originally
  identified as a specimen of Plateosaurus.
locomotion: bipedal
paleoenvironment:
  - fluvial
diet: herbivore
diagnostic_features:
  - Fused pair of primordial sacrals
  - Robust and rugose expansion in postacetabular process of ilium
  - Pentagonal distal tibia with additional posterior projection
  - Deep lateroventral fossa on anterior margin of astragalus
  - Ventrally directed heel with lateral projection supporting reduced calcaneum
appearance:
  integument: scaled
  evidence: inferred
