genus: Tuebingosaurus
parent: Massopoda
etymology: Tübingen lizard
description: Tuebingosaurus is an extinct genus of massopodan sauropodomorph
  dinosaur from the Late Triassic Trossingen Formation of Germany. The genus
  contains a single species, Tuebingosaurus maierfritzorum, originally
  identified as a specimen of Plateosaurus.
