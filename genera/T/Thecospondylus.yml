genus: Thecospondylus
parent: Dinosauria
placement: incertae sedis
dispute:
  summary: >
    Thecospondylus horneri is a nomen dubium based on a natural sacral
    endocast; its affinities are uncertain even at the level of Saurischia
    versus Ornithischia.
  history:
    - date: "2026-06-30"
      note: >
        Placed at Dinosauria incertae sedis.
pronunciation:
  phonetic: THEEK-o-SPON-di-lus
etymology: "From Greek theke ('sheath') and spondylos ('vertebra'), meaning 'sheath vertebra', referring to the extremely thin bone forming the vertebrae"
description: Thecospondylus is a dubious genus of dinosaur from the Early
  Cretaceous of England. Scientists are unsure as to whether Thecospondylus was
  a saurischian or an ornithischian.
locomotion: bipedal
paleoenvironment:
  - fluvial
diet: carnivore
diagnostic_features:
  - Neural canal extraordinarily laterally compressed relative to height in
    middle region
  - Intervertebral foramina small, transversely oval with sharp margins, pierced
    through vertebral middle
  - Neural canal wider above foramina than below (except last foramen)
  - Sacral vertebrae with extremely thin bony substance
appearance:
  integument: unknown
identifiers:
  - source: pbdb
    id: "56549"
  - source: wikidata
    id: Q870974
  - source: gbif
    id: "4577869"
species:
  - name: Thecospondylus horneri
    etymology: "Named in honor of Dr. A.C. Horner, an amateur geologist from Tonbridge who collected the holotype specimen."
    status: valid
    type_species: true
    period:
      name:
        - Early Cretaceous
      stage:
        - Valanginian
    location:
      country: GB
      region: GB-ENG
      locality: Quarry at Southborough, near Tonbridge
      formation: Hastings Sand
    erected_in: seeley1882a
    type_specimen:
      specimen_id: [BMNH R.291]
      specimen_type: holotype
      institution: NHMUK
      material: Sacrum.
      completeness: fragmentary
references:
  - id: seeley1882a
    notes: Records the specimen as obtained by Dr. A. C. Horner of Tonbridge
      from the quarry at Southborough, in the Hastings Sand.
