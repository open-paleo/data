genus: Tendaguria
parent: Turiasauria
etymology: "Named for Tendaguru Hill in Tanzania, the site of major German paleontological expeditions from 1909 to 1912."
pronunciation:
  phonetic: TEN-duh-GURE-ee-uh
  ipa: /ˌtɛndəˈɡjʊəriə/
description: Tendaguria is a genus of herbivorous sauropod dinosaur from the
  Late Jurassic of Lindi Region, Tanzania.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - coastal
diagnostic_features:
  - Dorsal surface of each anterior dorsal diapophysis excavated by two fossae,
    one posterolateral to the prezygapophyses along the anterior half of the
    diapophysis and one directly posterior to the prezygapophyses
  - Prespinal midline ridge developed on the anteriormost dorsal neural spines
appearance:
  integument: scaled
  evidence: inferred
