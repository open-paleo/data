genus: Taohelong
parent: Nodosauridae
etymology: From Chinese Tao (the Tao River), he ("river"), and long ("dragon") -
  means "dragon of the Tao River"
pronunciation:
  phonetic: dow-huh-long
description: Taohelong is a genus of nodosaurid dinosaur known from Early
  Cretaceous rocks in north-central China. It is based on Gansu Dinosaur Museum
  (GSDM) 00021, fossils including a tail vertebra, ribs, a left ilium (the main
  bone of the hip), and bony armor recovered from the Hekou Group in the
  Lanzhou-Minhe Basin. The animal's armor includes part of a "sacral shield", a
  carpet of osteoderms over the hips found in some other ankylosaurians.
  Taohelong was named and described in 2013 by Yang Jing-Tao, You Hai-Lu, Li
  Da-Qing, and Kong De-Lai. The type species is Taohelong jinchengensis. The
  generic name means "dragon (long) of the river (he) Tao". The specific name
  refers to the provenance at Jincheng.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - lacustrine
appearance:
  integument: armored
diagnostic_features:
  - Neural canal of proximo-middle caudal inverted trapezium
  - Lateral edge of preacetabular process inverted S-shaped in dorsal view
  - Sacral shield composed of various-sized and irregularly-arranged osteoderms
