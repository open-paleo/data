  - id: madzia2021a
    notes: Lists Taohelong in Polacanthinae and in Nodosaurinae under the
      reference phylogenies of those two clades.
  - id: arbour2015a
    notes: Recovers Taohelong with Dongyangopelta and Sauroplites in an
      unresolved polytomy within Nodosauridae.
  - id: raven2023a
    notes: Usually recovers Taohelong, with Silvisaurus, outside the four main
      ankylosaur clades.
  - id: soto-acuña2024a
    notes: Prunes Taohelong as a wildcard taxon.
