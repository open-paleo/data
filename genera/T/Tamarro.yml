genus: Tamarro
parent: Jinfengopteryginae
dispute:
  summary: >
    Tamarro, the first European jinfengopterygine, was placed in Jinfengopteryginae
    by its describers (Sellés et al., 2021), the placement adopted here, though the
    attribution is queried given the fragmentary holotype (a partial metatarsal)
    and the contested monophyly of the subfamily.
  history:
    - date: "2026-07-01"
      note: Placed in Jinfengopteryginae following Sellés et al. (2021); fragmentary holotype, attribution queried by the describers. Clade-level monophyly dispute recorded on the Jinfengopteryginae file.
etymology: Named after the tamarro, a small creature in the folklore of Pallars, Spain
pronunciation:
  phonetic: tah-MAH-row
description: Tamarro is a genus of troodontid theropod from the Late Cretaceous
  Talarn Formation (Tremp Group) of Spain. The genus contains a single species,
  Tamarro insperatus, known from a partial metatarsal described in 2021.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Metatarsal II with marked plantar ridge
  - Small foramen on the lateral surface of the plantar ridge (autapomorphy)
  - Sub-arctometatarsalian condition with metatarsal III restricted to plantar
    margin on proximal part
  - Nutritional foramen on posteromedial surface of metatarsal II (autapomorphy)
appearance:
  integument: feathered
  evidence: direct
