genus: Tamarro
parent: Jinfengopteryginae
etymology: Named after the tamarro, a small creature in the folklore of Pallars, Spain
pronunciation:
  phonetic: tah-MAH-row
description: Tamarro is a genus of troodontid theropod from the Late Cretaceous
  Talarn Formation (Tremp Group) of Spain. The genus contains a single species,
  Tamarro insperatus, known from a partial metatarsal described in 2021.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Metatarsal II with marked plantar ridge
  - Small foramen on the lateral surface of the plantar ridge (autapomorphy)
  - Sub-arctometatarsalian condition with metatarsal III restricted to plantar
    margin on proximal part
  - Nutritional foramen on posteromedial surface of metatarsal II (autapomorphy)
