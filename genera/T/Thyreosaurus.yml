genus: Thyreosaurus
parent: Dacentrurinae
etymology: From Greek 'thyreos' meaning 'shield' (a large oblong shield) and 'sauros' meaning 'lizard', referring to the distinctive shield-like dermal armor of the animal.
pronunciation:
  phonetic: TIE-ree-o-SOR-us
description: Thyreosaurus is an extinct genus of stegosaurian dinosaur from the
  Middle Jurassic El Mers III Formation of Morocco. The genus contains a single
  species, Thyreosaurus atlasicus, known from a partial disarticulated skeleton
  consisting of several dorsal vertebrae, ribs, a limb bone, and dermal bones.
  Thyreosaurus is characterized by a unique dermal armor with an asymmetrical
  texture, indicating that it may have been recumbent. Alongside Adratiklit,
  Thyreosaurus increases the diversity of unique stegosaurs occurring in the
  Middle Jurassic of Africa.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - "Thick osteoderms (up to 4 cm) with asymmetrical texture: one side with
    small pits and fiber bundles, other with cross-hatched pattern"
  - Dermal elements arranged in recumbent position rather than erect, based on
    fiber bundle orientation
  - Dorsal centra wider than long, smaller in overall dimensions relative to
    neural arch than Dacentrurus
  - Prezygapophyses with horizontal orientation in lateral view and continuous
    prezygodiapophyseal lamina lacking deep notch
  - Prominent ventral notch between postzygapophyses and ventral keel on all
    dorsal centra
appearance:
  features:
    - dermal plates
  integument: armored
  evidence: direct
