genus: Tsintaosaurus
parent: Lambeosaurinae
etymology: "Named for the city of Qingdao (formerly romanized as Tsintao),
  China, combined with Greek 'sauros' meaning 'lizard'."
pronunciation:
  phonetic: CHING-DOW-SAWR-us
description: Tsintaosaurus is a genus of hadrosaurid dinosaur from the Late
  Cretaceous of China. It was about 8.3 meters (27 ft) long and weighed 2.5
  tonnes (2.8 short tons). The type species is Tsintaosaurus spinorhinus, first
  described by Chinese paleontologist C. C. Young in 1958. As a hadrosaur,
  Tsintaosaurus had the characteristic 'duck bill' snout and a battery of
  powerful teeth which it used to chew vegetation. It usually walked on all
  fours, but could rear up on its hind legs to scout for predators and flee when
  it spotted one. Like other hadrosaurs, Tsintaosaurus probably lived and
  traveled in herds.
diet: herbivore
locomotion: facultative
