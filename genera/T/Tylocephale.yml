genus: Tylocephale
parent: Pachycephalosaurinae
pronunciation:
  phonetic: TIE-lo-SEF-a-lee
etymology: From Greek tylos meaning 'swelling' or 'knob' and kephale meaning
  'head'; translates as 'swollen head,' referring to its domed skull
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - arid
diagnostic_features:
  - Cranial roof highly thickened and elevated, highest dome point situated far
    posteriorly near skull margin
  - Infratemporal fenestra very narrow, long, placed nearly vertically
  - Orbit elongate and oblique, rising upward posteriorly
  - Quadrate nearly vertical in orientation
  - Occipital region narrow and very faintly depressed
  - Posterior cheek region (jugal and quadratojugal) very strongly expanded
    laterally
appearance:
  features:
    - cranial dome
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "38791"
  - source: wikidata
    id: Q132563
  - source: gbif
    id: "4823087"
species:
  - name: Tylocephale gilmorei
    etymology: Named for the late Ch. W. Gilmore, who gave the first detailed
      description of a pachycephalosaurid species.
    pronunciation:
      phonetic: GIL-mor-eye
    status: valid
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Campanian
    location:
      country: MN
      locality: Khulsan, Central Cliffs, site 10
      region: MN-053
      formation: Baruungoyot
    size:
      length_m:
        min: 2.0
        max: 2.0
      weight_kg:
        min: 40
        max: 40
    type_specimen:
      specimen_id: [ ZPAL MgD-I/105 ]
      specimen_type: holotype
      institution: ZPAL
      material: Damaged skull with maxillary teeth (lacking braincase, palate, and
        anterior snout); mandible with mandibular teeth (lacking anterior dentary)
      completeness: partial
    erected_in: maryańska1974a
references:
  - id: gradziński1972a
    notes: Maps the Khulsan finds, numbering a pachycephalosaurid skull 10, and
      calls the beds there the Lower Nemegt Beds.
  - id: maryańska1974a
  - id: jones2026a
    notes: Source of the appearance features.
