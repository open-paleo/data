genus: Tylocephale
parent: Pachycephalosauridae
pronunciation:
  phonetic: TIE-lo-SEF-a-lee
etymology: From Greek tylos meaning 'swelling' or 'knob' and kephale meaning
  'head'; translates as 'swollen head,' referring to its domed skull
description: Tylocephale is a genus of pachycephalosaurid dinosaur, a group of
  dome-headed, herbivorous ornithischians, that lived during the Maastrichtian
  stage of the Late Cretaceous in what is now Mongolia. It is known from a
  partial skull and associated mandible that were unearthed in 1971 by a
  Polish-Mongolian Expedition to the Barun Goyot Formation of the Gobi Desert.
  The specimen was described in 1974 by Polish paleontologists Teresa Maryańska
  and Halszka Osmólska as a new genus and species.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - arid
diagnostic_features:
  - Cranial roof highly thickened and elevated, highest dome point situated far
    posteriorly near skull margin
  - Infratemporal fenestra very narrow, long, placed nearly vertically
  - Orbit elongate and oblique, rising upward posteriorly
  - Quadrate nearly vertical in orientation
  - Occipital region narrow and very faintly depressed
  - Posterior cheek region (jugal and quadratojugal) very strongly expanded
    laterally
