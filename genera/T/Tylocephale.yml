genus: Tylocephale
parent: Pachycephalosauridae
etymology: swollen head
description: Tylocephale is a genus of pachycephalosaurid dinosaur, a group of
  dome-headed, herbivorous ornithischians, that lived during the Maastrichtian
  stage of the Late Cretaceous in what is now Mongolia. It is known from a
  partial skull and associated mandible that were unearthed in 1971 by a
  Polish-Mongolian Expedition to the Barun Goyot Formation of the Gobi Desert.
  The specimen was described in 1974 by Polish paleontologists Teresa Maryańska
  and Halszka Osmólska as a new genus and species.
diet: herbivore
locomotion: bipedal
