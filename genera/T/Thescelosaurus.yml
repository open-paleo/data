genus: Thescelosaurus
parent: Clypeodonta
pronunciation:
  phonetic: THESS-el-oh-sore-us
  ipa: /ˌθɛsɪləˈsɔːrəs/
etymology: "From Greek 'theskelos' meaning 'marvelous' or 'wondrous' and
  'sauros' meaning 'lizard', hence 'marvelous lizard'."
description: Thescelosaurus is a genus of ornithischian dinosaur that lived
  during the Late Cretaceous period in western North America. It was named and
  described in 1913 by the paleontologist Charles W. Gilmore; the type species
  is T. neglectus. Two other species, T. garbanii and T. assiniboiensis, were
  named in 1976 and 2011, respectively. Additional species have been suggested
  but are currently not accepted. Thescelosaurus is the eponymous member of its
  family, the Thescelosauridae. Thescelosaurids are either considered to be
  basal ("primitive") ornithopods, or are placed outside of this group within
  the broader group Neornithischia.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Ventral surfaces of cervical vertebrae flattened and rugosely roughened,
    unlike rounded or keeled surfaces in other dinosaurs
  - Posterior thoracic ribs single-headed, fusion to transverse process differs
    from double-headed ribs anterior
  - Four phalanges on third digit of fore foot, an unusual number found only in
    Hypsilophodon among dinosaurs
  - Projecting lip-like process on outer posterior side of proximal femur, not
    before observed in orthopodous dinosaurs
  - Fifth metatarsal vestigial and attached to posterior side of metatarsal IV,
    partly functional
  - Pelvic arch sufficiently diagnostic to separate genus at once from all other
    known dinosaurs
appearance:
  features:
    - keratinous beak
  integument: scaled
  evidence: inferred
