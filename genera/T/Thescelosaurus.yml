  - name: Thescelosaurus assiniboiensis
    etymology: Named for the District of Assiniboia, a former (1882–1905)
      administrative unit of the North-West Territories enclosing the Frenchman
      Formation exposures; itself named after the Assiniboine First Nations
      People.
    status: valid
    type_species: false
    period:
      name:
        - Late Cretaceous
      stage:
        - Maastrichtian
      from_ma: 66.5
      to_ma: 66
    location:
      country: CA
      region: Saskatchewan
      formation: Frenchman
      locality: Frenchman River Valley, near Cambery Coulee
    type_specimen:
      specimen_id:
        - RSM P 1225.1
      specimen_type: holotype
      institution: RSM-CA
      material: A small, relatively complete skeleton preserving a partial skull
        (including a nearly complete braincase), dorsal, sacral, and caudal
        vertebral series, dorsal ribs, pelvic girdles, and hindlimbs.
    diagnostic_features:
      - Supraoccipital bears a distinct median foramen running from the roof of
        the myelencephalon through to the dorsal surface of the element
        (autapomorphy).
      - Dorsal and posterior margins of the squamosal convex (autapomorphy),
        rather than flat/concave.
      - Calcaneum not reduced and thus participates in the mesotarsal joint
        (unlike T. garbanii, in which it is reduced and excluded).
    erected_in: brown2011a
  - name: Thescelosaurus garbanii
    etymology: Honors Harley Garbani, the fossil collector who discovered the
