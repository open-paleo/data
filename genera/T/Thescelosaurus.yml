    institution: MOR
    category: complementary
    significance: Specimen from the Hell Creek Formation of Montana preserving a
      nearly complete skull and skeleton, one of the new finds that combined
      skull and skeleton material and helped resolve the historic and current
      species of the genus.
    references:
      - boyd2009a
  - specimen_id:
      - TLAM.BA.2014.027.0001
    institution: TLAM
    species: Thescelosaurus neglectus
    category: complementary
    significance: Specimen from the Hell Creek Formation of Dewey County, South
      Dakota, including a mostly complete though slightly crushed skull and much
      of the skeleton. Its overlapping skull material allowed both it and the
      Willo specimen to be assigned to T. neglectus.
    references:
      - boyd2014a
