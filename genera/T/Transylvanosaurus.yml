genus: Transylvanosaurus
parent: Rhabdodontomorpha
etymology: Named after Transylvania, Romania (from Latin trans, "across", and silva, "forest"), combined with Greek sauros, "lizard" — means "lizard from across the forest"
description: Transylvanosaurus is an extinct genus of rhabdodontid ornithopod
  dinosaur from the Late Cretaceous (Maastrichtian) Hateg Basin of Romania. The
  type species is Transylvanosaurus platycephalus, known from a fragmentary
  skull.
diet: herbivore
