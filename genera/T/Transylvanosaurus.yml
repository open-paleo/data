genus: Transylvanosaurus
parent: Rhabdodontomorpha
etymology: Named after Transylvania, Romania (from Latin trans, "across", and silva, "forest"), combined with Greek sauros, "lizard" - means "lizard from across the forest"
description: Transylvanosaurus is an extinct genus of rhabdodontid ornithopod
  dinosaur from the Late Cretaceous (Maastrichtian) Hateg Basin of Romania. The
  type species is Transylvanosaurus platycephalus, known from a fragmentary
  skull.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Proportionately wide frontals with anteroposterior length to mediolateral
    width ratio of 1.38
  - Well-developed anteriorly placed transverse frontal crest distally bounding
    confluent nasal-prefrontal articulation facets
  - Very long, straight and thin paroccipital processes making only gentle
    lateral curve, projecting mostly posterolaterally and slightly dorsally
  - Very prominent and massive prootic processes extending mainly
    anterolaterally and ventrally
  - Mediolaterally wide crest-like basal tubera meeting braincase long axis at
    very flat angle of approximately 140°
  - Widely splayed basipterygoid processes extending mainly ventrolaterally and
    slightly anteriorly, diverging approximately 25° from sagittal plane
  - Well-developed anteroventrally inclined notch on lateral basicranium side,
    continuous, straight, and semi-circular in cross section
