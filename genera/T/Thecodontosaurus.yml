species:
  - name: Thecodontosaurus antiquus
    etymology: From Latin antiquus ("ancient"), referring to the
      great geological age of the Magnesian Conglomerate fauna
      relative to other reptiles known to Riley and Stutchbury in
      1836.
    status: valid
    type_species: true
    period:
      name:
        - Late Triassic
      stage:
        - Rhaetian
    location:
      country: GB
      region: GB-BST
      locality: Quarry Steps Quarry, Clifton
      coordinates:
        - 51.4696
        - -2.6176
    size:
      length_m:
        min: 2.0
        max: 3.0
      weight_kg:
        min: 11
        max: 30
    type_specimen:
      specimen_id:
        - BRSMG C4529/2
      specimen_type: neotype
      institution: BMAG
      material: Left dentary with teeth.
      completeness: fragmentary
    synonyms:
      - name: Thecodontosaurus cylindrodon
        type: junior subjective
        reason: Treated by Huene (1908) as a separate species on tooth
          morphology; sunk into T. antiquus by Galton (1973) and
          reaffirmed by Galton (2007), who attributed gracile vs. robust
          morphs to within-population variation rather than two species.
    erected_in: riley1836a
    described_in: ballell2020a
references:
  - id: riley1836a
    notes: Erects Thecodontosaurus and the type species T. antiquus on dentary
      and tooth material from the Durdham Down fissure fill; one of the first
      five non-avian dinosaurs ever named.
  - id: huene1908a
    notes: Classic European Triassic monograph; recognizes T. antiquus and T.
      cylindrodon as distinct species (later synonymised by Galton 1973) and
      places the genus in Thecodontosauridae.
  - id: galton2007a
    notes: Comprehensive modern review of the Clifton fissure-fill
      sauropodomorphs; reaffirms T. cylindrodon as a junior synonym of T.
      antiquus and erects Asylosaurus on previously confused material.
  - id: galton1973a
    notes: Reassigned material to Thecodontosaurus antiquus.
  - id: ballell2020a
    notes: Redescribes the species from over 1,000 Tytherington bones, revises
      its diagnosis and rejects earlier diagnostic characters, and dates the
      localities to the Rhaetian.
