genus: Thecodontosaurus
parent: Sauropodomorpha
etymology: From Greek theke (case, socket), odous (tooth) and sauros
  (lizard); meaning "socket-tooth lizard", reflecting Riley and
  Stutchbury's observation that the teeth are set in distinct deep
  alveoli — a configuration unusual among the reptiles known to them
  at the time.
pronunciation:
  phonetic: THEE-koh-DON-toh-SAWR-us
  ipa: /ˌθiːkoʊˌdɒntoʊˈsɔːrəs/
description: >
  Thecodontosaurus is a genus of herbivorous basal sauropodomorph
  dinosaur that lived during the late Triassic period (Rhaetian age).
  Its remains are known mostly from Triassic "fissure fillings" in
  southern England. Thecodontosaurus was a small bipedal animal,
  about 2 m (6.6 ft) long. It is one of the first dinosaurs to be
  discovered and is one of the oldest that ever existed. Many
  species have been named within the genus, but only the type
  species Thecodontosaurus antiquus is seen as valid today.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - arid
appearance:
  integument: scaled
  evidence: inferred
diagnostic_features:
  - Postorbital flange absent.
  - Maxillary and dentary tooth crowns not recurved, with coarse serrations.
  - Extensive muscle scar for the origin of M. triceps brachii caput
    scapulare on the lateral side of the scapular glenoid lip
    (autapomorphy).
  - Humeral cuboid fossa elaborate, with a bilobate proximal outline and an
    extensively pitted surface (autapomorphy).
  - Brevis fossa and shelf reduced.
  - Acetabulum incompletely perforated.
  - Femoral trochanteric shelf absent.
  - Posterolateral descending process of the tibia anteroposteriorly wide and
    mediolaterally narrow, not reaching the lateral extent of the
    anterolateral process (autapomorphy; convergent in Anchisaurus,
    Eucnemesaurus entaxonis, Aardonyx and sauropods).
