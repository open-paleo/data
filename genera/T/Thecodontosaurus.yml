references:
  - id: riley1836
    authors: Riley, H.; Stutchbury, S.
    year: 1836
    title: A description of various fossil remains of three distinct
      saurian animals discovered in the autumn of 1834 in the
      Magnesian Conglomerate on Durdham-Down, near Bristol
    journal: Proceedings of the Geological Society of London
    volume: "2"
    pages: 397-399
    notes: Erects Thecodontosaurus and the type species T. antiquus
      on dentary and tooth material from the Durdham Down fissure
      fill; one of the first five non-avian dinosaurs ever named.
  - id: huene1908
    authors: Huene, F. V.
    year: 1908
    title: Die Dinosaurier der Europäischen Triasformation mit berücksichtigung
      der Ausseuropäischen vorkommnisse [The dinosaurs of the European Triassic
      formations with consideration of occurrences outside Europe]
    journal: Geologische und Palaeontologische Abhandlungen
    volume: Suppl. 1
    pages: 1-419
    notes: Classic European Triassic monograph; recognizes T.
      antiquus and T. cylindrodon as distinct species (later
      synonymised by Galton 1973) and places the genus in
      Thecodontosauridae.
  - id: galton2007a
    authors: Galton, P. M.
    year: 2007
    title: Notes on the remains of archosaurian reptiles, mostly
      basal sauropodomorph dinosaurs, from the 1834 fissure fill
      (Rhaetian, Upper Triassic) at Clifton in Bristol, southwest
      England
    journal: Revue de Paléobiologie
    volume: "26"
    issue: "2"
    pages: 505-591
    notes: Comprehensive modern review of the Clifton fissure-fill
      sauropodomorphs; reaffirms T. cylindrodon as a junior synonym
      of T. antiquus and erects Asylosaurus on previously confused
      material.
