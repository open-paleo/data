genus: Thecodontosaurus
parent: Sauropodomorpha
etymology: From Greek theke (case, socket), odous (tooth) and sauros
  (lizard); meaning "socket-tooth lizard", reflecting Riley and
  Stutchbury's observation that the teeth are set in distinct deep
  alveoli — a configuration unusual among the reptiles known to them
  at the time.
pronunciation:
  phonetic: THEE-koh-DON-toh-SAWR-us
  ipa: /ˌθiːkoʊˌdɒntoʊˈsɔːrəs/
description: >
  Thecodontosaurus is a genus of herbivorous basal sauropodomorph
  dinosaur that lived during the late Triassic period (Carnian age).
  Its remains are known mostly from Triassic "fissure fillings" in
  southern England. Thecodontosaurus was a small bipedal animal,
  about 2 m (6.6 ft) long. It is one of the first dinosaurs to be
  discovered and is one of the oldest that ever existed. Many
  species have been named within the genus, but only the type
  species Thecodontosaurus antiquus is seen as valid today.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - arid
appearance:
  integument: scaled
  evidence: inferred
diagnostic_features:
  - Teeth set in deep, distinct alveoli to nearly half their length —
    the feature for which Riley and Stutchbury named the genus.
  - Hollow-rooted teeth in which a replacement crown forms within the
    same alveolar cavity as the functional tooth.
  - Tooth crowns lancet-shaped, with serrated anterior and posterior
    edges and serrations directed toward the apex.
  - Dentary short and deep, with maximum dorsoventral depth greater
    than 20% of dentary length.
  - All teeth retain a recurved lateral profile; the middle and
    posterior teeth do not become lanceolate as in other basal
    sauropodomorphs.
  - Posterior dorsal and anterior sacral centra with a
    keyhole-shaped neural canal in transverse section and an
    extensively ventrally excavated centrum.
  - Mid-caudal vertebrae with the anterior edge of the transverse
    process continuing as a sharp ridge across the neural arch.
  - Proximal caudal centra with the ventral furrowing reduced or
    lost; ventral surface transversely convex with a median ridge in
    at least one specimen.
