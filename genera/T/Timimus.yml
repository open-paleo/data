genus: Timimus
parent: Tyrannosauroidea
etymology: Combines the name Tim (honoring both Timothy Rich, son of the discoverers, and paleontologist Tim Flannery) with Latin mimus ('mimic'), meaning 'Tim's mimic'
description: Timimus is a genus of small coelurosaurian theropod dinosaur from
  the Early Cretaceous of Australia. It was originally identified as an
  ornithomimosaur, but now it is thought to be a different kind of theropod,
  possibly a tyrannosauroid.
diet: carnivore
locomotion: bipedal
