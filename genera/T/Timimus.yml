genus: Timimus
parent: Coelurosauria
pronunciation:
  phonetic: ti-MIEM-us
etymology: Combines the name Tim (honoring both Timothy Rich, son of the
  discoverers, and paleontologist Tim Flannery) with Latin mimus ('mimic'),
  meaning 'Tim's mimic'
description: Timimus is a genus of small coelurosaurian theropod dinosaur from
  the Early Cretaceous of Australia. It was originally identified as an
  ornithomimosaur, but now it is thought to be a different kind of theropod,
  possibly a tyrannosauroid.
dispute:
  summary: >
    Timimus hermani was named by Rich and Vickers-Rich (1994) on an isolated
    femur and referred to Ornithomimosauria; its affinities have since been
    questioned, with a tyrannosauroid placement among the alternatives proposed.
    The single-element holotype is too fragmentary to resolve this.
  history:
    - date: "2026-06-25"
      note: Moved from Tyrannosauroidea to Coelurosauria incertae sedis (least-inclusive uncontested clade; ornithomimosaur per Rich and Vickers-Rich (1994), later tyrannosauroid proposals).
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - polar
appearance:
