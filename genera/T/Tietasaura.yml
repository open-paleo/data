genus: Tietasaura
parent: Elasmaria
etymology: Named after the Tieta region or Tieta de Agreste (Bahia, Brazil), the area near where the specimen was found, combined with Latin/Portuguese saura, "lizard" - means "Tieta lizard"
pronunciation:
  phonetic: TEE-yet-uh-SOR-uh
description: Tietasaura is an extinct genus of elasmarian ornithopod dinosaur
  from the Early Cretaceous Marfim Formation of Brazil. The genus contains a
  single species, T. derbyiana, known from a single incomplete femur. Tietasaura
  is notable for being the first ornithischian dinosaur ever named from Brazil.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Strongly sigmoidal femoral shaft in lateral and medial views
  - Absence of medially inflated medial condyle covering posterior intercondylar
    groove
  - Subcircular distal condyles, unlike mediolaterally compressed ornithopod
    morphology
  - Fibular condyle with straight lateral margin lacking indentation for
    condyloid process
  - Conspicuously sharp posterior supracondylar ridges enclosing deep flexor
    fossa
  - Small accessory condylid present medially to fibular condyle
appearance:
  integument: scaled
  evidence: inferred
