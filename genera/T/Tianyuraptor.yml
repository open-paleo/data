genus: Tianyuraptor
parent: Dromaeosauridae
etymology: "Named after the Shandong Tianyu Museum of Nature where the holotype specimen is housed, combined with Latin 'raptor' meaning 'robber', referring to the action of grabbing prey"
description: Tianyuraptor is a genus of short-armed dromaeosaurid dinosaur
  ('running lizard'; a type of small dinosaur considered to be closely related
  to birds) that lived during the Early Cretaceous, about 122 million years ago.
  Its remains have been found in western Liaoning, China. It was similar to
  other dromaeosaurids found in Liaoning, with the exception of being somewhat
  more primitive. The type specimen, formally named in 2009, shows features not
  seen in previously known Northern Hemisphere (Laurasian) dromaeosaurids, but
  present in Southern Hemisphere (Gondwanan) species and early birds. Because of
  this, the scientists who first studied Tianyuraptor described it as a
  "transitional species", bridging the gap between northern and southern types
  of dromaeosaurid. Tianyuraptor also differs from previously known
  dromaeosaurids in that it possesses a relatively small furcula ("wishbone"),
  and unusually short forelimbs.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
  - forested
diagnostic_features:
  - Middle caudal vertebrae more than twice the length of posterior dorsal
    vertebrae
  - Small and extremely slender furcula
  - Elongated hindlimb approximately three times as long as dorsal series
