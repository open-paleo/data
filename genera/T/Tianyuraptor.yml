genus: Tianyuraptor
parent: Dromaeosauridae
placement: incertae sedis
dispute:
  summary: >
    The finer placement of Tianyuraptor is unsettled. It has been recovered
    as a basal microraptorine (Turner and colleagues, 2012; Agnolín and
    Novas, 2013) and, more often in recent work, as a short-armed basal
    dromaeosaurid just outside Microraptorinae and stemward of
    Eudromaeosauria, sometimes in a clade with Zhenyuanlong and Daurlong (Lü
    and Brusatte, 2015; Wang and colleagues, 2022). It is placed at
    Dromaeosauridae incertae sedis pending resolution.
pronunciation:
  phonetic: tyen-YOO-RAP-tor
etymology: From 'Tianyu', the name of the museum that houses the holotype, and
  Latin 'raptor' (robber); meaning 'Tianyu robber'.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
  - forested
diagnostic_features:
  - Middle caudal vertebrae more than twice the length of posterior dorsal
    vertebrae
  - Small and extremely slender furcula
  - Elongated hindlimb approximately three times as long as dorsal series
appearance:
  features:
    - sickle claw
    - feathered wings
    - feathered tail
  integument: feathered
  evidence: direct
identifiers:
  - source: pbdb
    id: "152529"
  - source: wikidata
    id: Q18511085
  - source: eol
    id: "10689920"
species:
  - name: Tianyuraptor ostromi
    etymology: "Named for John Ostrom, the paleontologist who contributed greatly to the study of dromaeosaurid fossils including Deinonychus, and who was among the earliest modern advocates for a close evolutionary relationship between birds and dinosaurs."
    pronunciation:
      phonetic: OSS-trum-eye
    status: valid
    type_species: true
    period:
      name:
        - Early Cretaceous
      stage:
        - Barremian
    location:
      country: CN
      locality: Dawangzhangzi
      region: CN-LN
      formation: Yixian
    size:
      length_m:
        min: 2
        max: 2
      weight_kg:
        min: 11
        max: 11
      hip_height_m:
        min: 0.6
        max: 0.6
    erected_in: zheng2010a
    type_specimen:
      specimen_id: [STM1-3]
      specimen_type: holotype
      institution: STM
      material: Nearly complete and fully articulated skeleton
      completeness: complete
references:
  - id: zheng2010a
  - id: paul2024a
    notes: Source of the body length and mass estimates.
  - id: jones2026c
    notes: Source of the hip height estimate, and the appearance features.
  - id: turner2012a
    notes: Recovered Tianyuraptor as a basal microraptorine dromaeosaurid.
  - id: lü2015a
    notes: Described Zhenyuanlong, recovering it with Tianyuraptor and Daurlong in short-armed dromaeosaurid clade.
  - id: wang2022a
    notes: Described Daurlong, nesting it near Tianyuraptor closer to eudromaeosaurs than microraptorines.
  - id: agnolín2013a
    notes: Recovered Tianyuraptor as a basal microraptorine.
