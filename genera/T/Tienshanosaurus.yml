genus: Tienshanosaurus
parent: Mamenchisauridae
pronunciation:
  phonetic: TYEN-SHAHN-o-SAWR-us
etymology: "Named for the Tienshan (Tian Shan) mountain range of Xinjiang,
  China, combined with Greek 'sauros' meaning 'lizard'."
description: Tienshanosaurus is an extinct genus of sauropod dinosaur from the
  Late Jurassic of what is now China. Only one species is known, Tienshanosaurus
  chitaiensis, which was named and described in 1937.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "38703"
  - source: wikidata
    id: Q135792
  - source: gbif
    id: "4822604"
species:
  - name: Tienshanosaurus chitaiensis
    etymology: "Named for the location Chitai (also spelled Qitai) in Xinjiang,
      China, near where the holotype was discovered."
    status: disputed
    type_species: true
    period:
      name:
        - Middle Jurassic
        - Late Jurassic
      stage:
        - Bathonian
        - Callovian
        - Oxfordian
    location:
      country: CN
      locality: Paikushan
      region: CN-XJ
      formation: Shishugou
      notes: >
        Young (1937) names no formation: the bones came from a hill of
        sandstone "overlying immediately upon a Jurassic plant-bearing layer"
        about 250 li north of Chitai. Dai and colleagues (2025) list the
        species from the Shishugou, with no level within it.
    type_specimen:
      specimen_id: [ IVPP AS 40002-3 ]
      specimen_type: holotype
      institution: IVPP
    erected_in: young1937a
references:
  - id: young1937a
  - id: dai2025b
    notes: Lists Tienshanosaurus chitaiensis among the species of the Callovian–Oxfordian Shishugou Formation.
