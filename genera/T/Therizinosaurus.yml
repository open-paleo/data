    species: Therizinosaurus cheloniformis
    category: complementary
    significance: "Referred right hindlimb from Hermiin Tsav (fragmented femur, lower tibia, astragalus, calcaneum, tarsal IV, four metatarsals and digits) providing the only known foot anatomy of the genus and documenting its unusual functional tetradactyl, weight-bearing pes."
