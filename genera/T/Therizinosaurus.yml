genus: Therizinosaurus
parent: Therizinosauridae
pronunciation:
  phonetic: THER-i-ZIN-o-SAWR-us
  ipa: /ˌθɛrəˌzɪnoʊˈsɔːrəs/
etymology: "From Greek therizein ('to reap' or 'to cut') and sauros ('lizard'),
  meaning 'scythe lizard', named for its enormous scythe-like claws"
description: Therizinosaurus is a genus of very large therizinosaurid dinosaurs
  that lived during the Late Cretaceous period in what is now Asia. It contains
  a single species, Therizinosaurus cheloniformis, known from the fossiliferous
  Nemegt Formation. The first remains of Therizinosaurus were found in 1948 by a
  Mongolian field expedition in the Gobi Desert and later described by Evgeny
  Maleev in 1954. The genus is only known from a few bones, including gigantic
  manual unguals (claw bones), from which it gets its name, and additional
  findings comprising fore and hindlimb elements that were discovered from the
  1960s through the 1980s.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Enormous sickle-like ungual phalanges on forelimbs, 60-65cm in length with
    grooved surfaces
  - Massive metacarpal bones with great mobility at distal articulation
  - Broad, compressed body reaching 3.5-4.5m in length with 3m width
  - Ribs with T-shaped dorsal section and well-developed intercostal muscle
    attachment sites
  - Reduced or nearly absent bony armor unlike typical sea turtles
  - Powerful forelimbs with enlarged claws adapted for cutting aquatic vegetation
appearance:
  features:
    - enlarged manual claws
    - elongate forelimbs
  integument: armored
  evidence: direct
