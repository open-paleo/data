    species: Therizinosaurus cheloniformis
    category: complementary
    significance: "Much more complete, larger, articulated specimen from Hermiin Tsav preserving both arms (scapulocoracoids, humeri, ulnae, radius, carpals, metacarpus with complete digit II, ribs and gastralia), greatly extending forelimb anatomy beyond the claw-only holotype and confirming theropod identity."
