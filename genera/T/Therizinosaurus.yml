genus: Therizinosaurus
parent: Therizinosauridae
pronunciation:
  ipa: /ˌθɛrəˌzɪnoʊˈsɔːrəs/
etymology: "From Greek therizein ('to reap' or 'to cut') and sauros ('lizard'), meaning 'scythe lizard', named for its enormous scythe-like claws"
description: Therizinosaurus is a genus of very large therizinosaurid dinosaurs
  that lived during the Late Cretaceous period in what is now Asia. It contains
  a single species, Therizinosaurus cheloniformis, known from the fossiliferous
  Nemegt Formation. The first remains of Therizinosaurus were found in 1948 by a
  Mongolian field expedition in the Gobi Desert and later described by Evgeny
  Maleev in 1954. The genus is only known from a few bones, including gigantic
  manual unguals (claw bones), from which it gets its name, and additional
  findings comprising fore and hindlimb elements that were discovered from the
  1960s through the 1980s.
diet: herbivore
