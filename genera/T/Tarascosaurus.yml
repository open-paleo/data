genus: Tarascosaurus
parent: Abelisauridae
dispute:
  summary: >
    The validity of Tarascosaurus is contested: originally described as an
    abelisaurid, it was later regarded as a nomen dubium (Allain and Pereda-
    Suberbiola, 2003; Rauhut, 2003), then reaffirmed as a valid abelisaurid
    by subsequent studies. Its position within the family is unresolved.
  history:
    - date: "2026-06-30"
      note: >
        Placed at Abelisauridae.
etymology: Named after the Tarasque, a legendary monster from Provencal folklore
  (France), combined with Greek sauros, "lizard" - means "Tarasque lizard"
pronunciation:
  phonetic: ta-RASS-ko-SOR-us
description: Tarascosaurus is a genus of abelisaurid theropod dinosaur from Late
  Cretaceous of France. It was a relatively small theropod measuring 2.5-3
  meters (8.2-9.8 ft) long.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Femur neck extremely narrow anteroposteriorly
  - Transverse processes very wide anteroposteriorly
  - Infradiapophyseal laminae diverging under diapophyses, unlike other theropods
  - Femur head directed anteromedially
  - Limited dorsal projection of anterior trochanter
  - Foramen beneath anterior trochanter
  - Hyposphene-hypantrum structure present on dorsal vertebrae
  - Dorsal vertebrae internal structure highly cavernous
appearance:
  integument: scaled
  evidence: inferred
