genus: Tyrannotitan
parent: Carcharodontosaurinae
pronunciation:
  ipa: /tɪˌrænəˈtaɪtən/
  phonetic: tie-RAN-oh-tie-tan
etymology: "From Greek tyrannos ('tyrant') and titan ('giant'), meaning 'tyrant titan'"
description: Tyrannotitan is a genus of large theropod dinosaur belonging to the
  carcharodontosaurid family. It is known from a single species, T. chubutensis,
  which lived during the Albian stage of the Early Cretaceous period in what is
  now Argentina. Tyrannotitan is considered to share a close relationship with
  other prominent South American carcharodontosaurids such as Giganotosaurus and
  Mapusaurus. Unlike its relatives, it was bulkier and more robust. This taxon
  is known from two specimens, both of which are highly incomplete.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Teeth with bilobate denticles on rostral carina
  - Deep mental groove on dentary
  - Posterior dorsal vertebrae with strongly developed ligament scars on neural
    spines
  - Dentary with squared-off symphyseal region and ventral process
  - Deep pneumatic foramina and pleurocoels on cervical and dorsal vertebrae
  - Femoral head proximomedially projected
  - Fibula proportionally short with respect to femoral length (less than 70%)
  - Long neural spines of dorsal vertebrae with strong cranial and caudal
    ligament scars
appearance:
  features:
    - reduced forelimbs
  integument: scaled
  evidence: inferred
