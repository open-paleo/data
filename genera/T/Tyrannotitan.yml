genus: Tyrannotitan
parent: Carcharodontosaurinae
pronunciation:
  ipa: /tɪˌrænəˈtaɪtən/
  phonetic: tie-RAN-oh-tie-tan
etymology: "From Greek tyrannos ('tyrant') and titan ('giant'), meaning 'tyrant titan'"
description: Tyrannotitan is a genus of large theropod dinosaur belonging to the
  carcharodontosaurid family. It is known from a single species, T. chubutensis,
  which lived during the Albian stage of the Early Cretaceous period in what is
  now Argentina. Tyrannotitan is considered to share a close relationship with
  other prominent South American carcharodontosaurids such as Giganotosaurus and
  Mapusaurus. Unlike its relatives, it was bulkier and more robust. This taxon
  is known from two specimens, both of which are highly incomplete.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Teeth with bilobate denticles on the mesial carinae
  - Dentary symphyseal margin with anteroventral-posterodorsal inclination in
    lateral view
  - Second and third dorsal vertebrae with well-developed accessory laminae
    connecting the anterior and posterior centrodiapophyseal laminae
  - Fibular fossa extending over the proximal end of the crista tibiofibularis
    onto the femoral shaft
  - Proximomedial fossa of the fibula with a posteriorly projected anterior
    border
appearance:
  features:
    - reduced forelimbs
  integument: scaled
  evidence: inferred
