genus: Theiophytalia
parent: Styracosterna
etymology: From Greek 'theios' meaning 'divine' or 'of the gods' and 'phytalion'
  meaning 'garden', in reference to the Garden of the Gods park in Colorado
  where the specimen was found.
description: Theiophytalia is a genus of herbivorous iguanodontian dinosaur from
  the lower Cretaceous period (Aptian-Albian stage, about 112 million years ago)
  of Colorado, USA. It contains a single species, T. kerri.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
diagnostic_features:
  - Anterior edge of snout very rugose
  - Short tomial edge of premaxillary beak lower than alveolar surface of maxilla
  - Small antorbital fenestra set within small antorbital fossa
  - Wide dorsal process of maxilla with striated jugal horn projecting
    posteroventrally
  - Lateral quadrate fenestra covered by quadratojugal
  - Stout quadrate with posterior groove extending above level of quadratojugal
    and bulbous distal end
  - Short conical palpebral projecting posterolaterally over orbit
  - Lamina of dentary extends posteroventrally over angular
