genus: Theiophytalia
parent: Styracosterna
etymology: From Greek 'theios' meaning 'divine' or 'of the gods' and 'phytalion' meaning 'garden', in reference to the Garden of the Gods park in Colorado where the specimen was found.
description: Theiophytalia is a genus of herbivorous iguanodontian dinosaur from
  the lower Cretaceous period (Aptian-Albian stage, about 112 million years ago)
  of Colorado, USA. It contains a single species, T. kerri.
