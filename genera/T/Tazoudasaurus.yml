genus: Tazoudasaurus
parent: Gravisauria
etymology: "Named after Tazouda, one of the fossil localities near Toundoute in the High Atlas Mountains of Morocco, combined with Greek 'sauros' meaning 'lizard'"
description: Tazoudasaurus is a genus of gravisaurian (probably vulcanodontid)
  sauropod dinosaurs from the late Early Jurassic (Toarcian). It was recovered
  in the "Toundoute Continental Series" (Azilal Formation), located in the High
  Atlas Mountains of Morocco in North Africa. Along with Patagosaurus,
  Volkheimeria, Bagualia, and Perijasaurus (perhaps Barapasaurus and Kotasaurus
  as well), it represents one of the few sauropods named from this stage on
  Gondwana, as well as the only one from Africa.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
