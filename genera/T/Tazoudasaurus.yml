      notes: The Toundoute continental series is an informal succession about 300 m
        thick that is not subdivided into formal stratigraphic units. Allain and
        colleagues (2008) suggest it is laterally equivalent to the Toarcian
        Azilal and Wazzant formations, a hypothesis rather than an assignment.
    size:
