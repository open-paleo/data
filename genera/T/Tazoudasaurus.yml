      specimen_type: holotype
      institution: SGM
      material: "Partially articulated skeleton with cranial material: complete left
        mandible, quadrate, jugal, postorbital, parietal, frontal and exoccipital; ~9 m
        long."
      completeness: partial
      notes: Allain and Aquesbi (2008) catalog the same individual by element
        in the Service Géologique du Maroc collections, among them the left
        mandible CPSGM To1-275, a tooth To1-20, three dorsal vertebrae
        To1-38, a chevron To1-129, the right pubis To1-103, the right
