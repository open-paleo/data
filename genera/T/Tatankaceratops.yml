genus: Tatankaceratops
parent: Chasmosaurinae
placement: incertae sedis
etymology: From 'tatanka', the Lakota word for the American bison, for the
  animal's bison-like size and for the type locality near Buffalo, South
  Dakota, and Latin 'ceratops' ('horned face').
description: Tatankaceratops is a contested genus of herbivorous chasmosaurine
  ceratopsid dinosaur that lived during the Late Cretaceous period (latest
  Maastrichtian stage, about 66 million years ago) in what is now the upper Hell
  Creek Formation, in South Dakota. It is known from a single fragmentary skull
  and partial skeleton housed at the Black Hills Institute, BHI 6226, described
  by Ott and Larson in 2010 as the type species Tatankaceratops sacrisonorum.
  Whether the specimen is a small adult of its own genus or an unusual
  individual of Triceratops remains unsettled.
dispute:
  summary: >
    Ott and Larson (2010) erected Tatankaceratops on BHI 6226, arguing that
    rugose surface texture, dendritic veination and extensive fusion across the
    skull and skeleton show an adult animal despite an estimated skull length
    of only about 1 m, and that its proportions differ from any contemporaneous
    ceratopsid. They examined and rejected paedomorphosis within Triceratops,
    island dwarfism, and referral to Avaceratops. Longrich (2011) instead reads
    the specimen as a mixture of juvenile and adult Triceratops characters,
    either an individual of Triceratops prorsus that stopped growing or a dwarf
    species derived from Triceratops, and leaves the question open; Longrich
    and Field (2012) place BHI 6226 in a Triceratops growth series and call it
    a possible aberrant individual of T. prorsus. Farke (2011) counts the genus
    only as possibly valid, and Lehman (2016) groups it with ceratopsians
    erected on immature specimens whose status is held in question. Placed at
    Chasmosaurinae incertae sedis, the least inclusive clade common to these
    readings.
  history:
    - date: "2026-08-10"
      note: >
        Placed at Chasmosaurinae incertae sedis and marked disputed.
status: disputed
diet: herbivore
paleoenvironment:
  - fluvial
diagnostic_features:
  - Small adult body size
  - No development of cornual sinuses
  - Nasal horncore proportionally massive
  - Nasal horn the same length as the postorbital horns
  - Nasal horncore recurved
  - Orbit proportionally large compared to skull size
  - Postorbital horncores originating caudal to the orbit
  - No overlap of the orbit by the postorbital horncore
  - No evidence of epijugal ossifications
