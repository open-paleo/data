species:
  - name: Tatankaceratops sacrisonorum
    etymology: Honors Stan and Steven Sacrison, the twin brothers who found and
      collected the type specimen.
    status: disputed
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Maastrichtian
    location:
      country: US
      region: US-SD
      locality: Niemi Ranch, Harding County
      formation: Hell Creek
    size:
      length_m:
        min: 3
        max: 3.5
    type_specimen:
      specimen_id:
        - BHI 6226
      specimen_type: holotype
      institution: BHI
      material: Fragmentary skull and partial skeleton, at least 47 identifiable
        elements and more than 2,000 fragments, including cranial elements, the
        mandible, cervical and dorsal vertebrae, ribs, an ulna fragment, a manus
        ungual and a phalanx.
      completeness: partial
      notes: Collected from the base of an overbank mudstone about 10 miles
        north-northwest of Buffalo, Harding County, the describers withholding
        precise locality data. The estimated skull length is about 1 m, from
        which the authors derive a total length of 3 to 3.5 m using the
        proportions of Triceratops horridus.
    erected_in: ott2010a
references:
  - id: ott2010a
  - id: longrich2011a
    notes: Reads the holotype as a mixture of juvenile and adult Triceratops
      characters and declines to resolve whether it is a stunted individual or
      a dwarf species.
  - id: farke2011b
    notes: Counts the genus among possibly-valid late Maastrichtian
      chasmosaurines.
  - id: longrich2012b
    notes: Places the holotype in a Triceratops growth series and suggests it
      may be an aberrant individual of Triceratops prorsus.
  - id: lehman2016b
    notes: Groups the name with ceratopsians erected on immature specimens whose
      status is held in question and which are seldom used in phylogenetic work.
