genus: Thanos
parent: Brachyrostra
etymology: Named after the Marvel Comics supervillain Thanos, whose name derives from Greek 'Thanatos' meaning 'death', reflecting the dinosaur's perceived fearsome nature.
description: Thanos is a genus of abelisaurid theropod dinosaur from the Late
  Cretaceous (Campanian) São José do Rio Preto Formation of São Paulo State,
  Brazil. The type species is Thanos simonattoi, described in 2020.
diet: carnivore
