genus: Tenontosaurus
parent: Tenontosauridae
pronunciation:
  ipa: /tɪˌnɒntəˈsɔːrəs/
etymology: "From Greek tenon ('sinew') and sauros ('lizard'), meaning 'sinew lizard', referring to the bony tendons stiffening its back and tail"
description: Tenontosaurus is a genus of iguanodontian ornithopod dinosaur. It
  had an unusually long, broad tail, which like its back was stiffened with a
  network of bony tendons. The genus is known from the late Aptian to Albian
  ages of the Early Cretaceous period sediments of western North America, dating
  between 115 and 108 million years ago. It contains two species, Tenontosaurus
  tilletti (described by John Ostrom in 1970) and Tenontosaurus dossi (described
  by Winkler, Murry, and Jacobs in 1997). Many specimens of T. tilletti have
  been collected from several geological formations throughout western North
  America. T. dossi is known from only a handful of specimens collected from the
  Twin Mountains Formation of Parker County, Texas.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
