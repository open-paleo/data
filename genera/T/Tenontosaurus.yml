genus: Tenontosaurus
parent: Rhabdodontomorpha
pronunciation:
  phonetic: ti-NON-tuh-SOR-uhs
  ipa: /tɪˌnɒntəˈsɔːrəs/
etymology: "From Greek tenon ('sinew') and sauros ('lizard'), meaning 'sinew
  lizard', referring to the bony tendons stiffening its back and tail"
description: Tenontosaurus is a genus of iguanodontian ornithopod dinosaur. It
  had an unusually long, broad tail, which like its back was stiffened with a
  network of bony tendons. The genus is known from the late Aptian to Albian
  ages of the Early Cretaceous period sediments of western North America, dating
  between 115 and 108 million years ago. It contains two species, Tenontosaurus
  tilletti (described by John Ostrom in 1970) and Tenontosaurus dossi (described
  by Winkler, Murry, and Jacobs in 1997). Many specimens of T. tilletti have
  been collected from several geological formations throughout western North
  America. T. dossi is known from only a handful of specimens collected from the
  Twin Mountains Formation of Parker County, Texas.
dispute:
  summary: >
    Tenontosaurus is recovered as an early-diverging rhabdodontomorph
    (with Iani and Convolosaurus) by the recent comprehensive analyses
    (Fonseca and others, 2024; Czepiński and Madzia, 2025), but earlier
    work and Jones (2026) place it as a basal iguanodontian outside
    Rhabdodontomorpha.
  history:
    - date: "2026-06-29"
      note: Placed at Rhabdodontomorpha following the most recent
        comprehensive analyses; the basal-Iguanodontia alternative
        reflected, not adopted.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Large bipedal ornithopod with extremely long tail reinforced by ossified
    tendons on both neural spines and chevrons
  - Caudal series with 59-60 vertebrae, measuring two or more times precaudal
    column length
  - Ischium long and straight, not expanded distally
  - Pubis with straight, shallow, horizontal prepubic blade and long, narrow
    postpubic rod
  - Ilium with long, narrow, sharply downturned anterior process and
    conspicuously concave upper margin
  - Manus phalangeal formula 2-3-3-2-2 with broad, flattened metacarpals
  - Pes phalangeal formula 2-3-4-5-0 with unreduced metatarsal I participating
    in tarsometatarsal joint
  - Skull with large external nares, long slit-like antorbital fenestra and
    supplementary lateral temporal fenestra
  - Subsidiary temporal fenestra situated beneath usual lateral fenestra at
    jugal-quadratojugal junction
  - Orbit subrectangular, larger than either lateral fenestra
  - Quadrate long, very narrow transversely with convex posterior margin
