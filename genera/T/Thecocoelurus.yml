references:
  - id: huene1923a
  - id: allain2014a
    notes: Treats Thecocoelurus as a nomen dubium but refers the holotype to
      Ornithomimosauria on comparison with the Angeac-Charente theropod.
  - id: naish2001a
    notes: Regarded Thecocoelurus as a nomen dubium given its fragmentary remains.
  - id: naish2002b
    notes: Finds the holotype undiagnostic, making the name a nomen dubium, and
      most similar to the cervical vertebrae of caenagnathid oviraptorosaurs.
  - id: naish2007a
    notes: Holds that, lacking autapomorphies, T. daviesi should not be regarded as
      a valid taxon, though it indicates caenagnathid-like oviraptorosaurs in
      the English Lower Cretaceous.
  - id: allain2022a
    notes: Retains the Angeac-Charente theropod in Ornithomimosauria on an
      anatomical survey, without a phylogenetic analysis.
  - id: cau2025a
    notes: Recovers the Angeac-Charente theropod, the comparison material for the
      ornithomimosaur referral, within Abelisauroidea.
