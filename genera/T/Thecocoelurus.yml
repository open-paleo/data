genus: Thecocoelurus
parent: Coelurosauria
placement: incertae sedis
dispute:
  summary: >
    Thecocoelurus is based on half of a cervical vertebra that lacks diagnostic
    characters, and its affinity is contested. Naish and Martill (2002, 2007)
    found it most similar to caenagnathid oviraptorosaurs. Allain and colleagues (2014)
    referred the holotype to Ornithomimosauria on a pneumatic recess shared with
    the Angeac-Charente theropod, a character they note also occurs in modified
    form in the noasaurid Masiakasaurus. Cau and Paterna (2025) have since
    recovered the Angeac-Charente theropod within Abelisauroidea.
  history:
    - date: "2026-06-30"
      note: >
        Retained at Ornithomimosauria following Allain and colleagues (2014); the
        oviraptorosaur reidentification and its status as a nomen dubium are
        recorded as unresolved.
    - date: "2026-09-28"
      note: >
        Moved to Coelurosauria incertae sedis, the nearest node spanning the
        oviraptorosaur (Naish and Martill, 2002, 2007) and ornithomimosaur
        (Allain and colleagues, 2014) referrals; status set to nomen dubium, the verdict
        of all three.
pronunciation:
  phonetic: THEE-ko-see-LOO-rus
etymology: "A contraction of the genus names Thecospondylus and Coelurus,
  translating to 'sheathed hollow form', reflecting the specimen's dual
  taxonomic history under those two genera"
description: Thecocoelurus is a genus of theropod dinosaur from the early
  Cretaceous period of England. Its type specimen was discovered in strata from
  the Wessex Formation on the Isle of Wight by the Reverend William Fox, and
  after Fox's death, it, alongside the rest of the Fox collection, became the
  property of the British Museum of Natural History. The specimen was named in 1888 by
  Harry Govier Seeley, who assigned it to the genus Thecospondylus . In 1901, it
  was reassigned by Baron Franz Nopcsa to Coelurus. In 1923, the specimen was
  removed from either genus by Friedrich von Huene, who assigned it to a genus
  of its own. Thecocoelurus currently consists of one species, T. daviesi. The
  validity of the genus has been questioned, with a 2001 publication finding it
  to be a nomen dubium.
diet: herbivore
locomotion: bipedal
