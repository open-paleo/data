genus: Thecocoelurus
parent: Coelurosauria
placement: incertae sedis
dispute:
  summary: >
    Thecocoelurus is based on half of a cervical vertebra that lacks diagnostic
    characters, and its affinity is contested. Naish and Martill (2002, 2007)
    found it most similar to caenagnathid oviraptorosaurs. Allain and colleagues (2014)
    referred the holotype to Ornithomimosauria on a pneumatic recess shared with
    the Angeac-Charente theropod, a character they note also occurs in modified
    form in the noasaurid Masiakasaurus. Cau and Paterna (2025) have since
    recovered the Angeac-Charente theropod within Abelisauroidea.
pronunciation:
  phonetic: THEE-ko-see-LOO-rus
etymology: "A contraction of the genus names Thecospondylus and Coelurus,
  translating to 'sheathed hollow form', reflecting the specimen's dual
  taxonomic history under those two genera"
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
appearance:
  integument: feathered
  evidence: inferred
identifiers:
  - source: pbdb
    id: "66529"
  - source: wikidata
    id: Q1826819
  - source: gbif
    id: "4578250"
species:
  - name: Thecocoelurus daviesi
    etymology: "Named in honor of William Davies (1814-1891), a paleontologist at
      the British Museum (Natural History)."
    pronunciation:
      phonetic: DAY-vee-zye
    status: nomen dubium
    type_species: true
    period:
      name:
        - Early Cretaceous
      stage:
        - Barremian
    location:
      country: GB
      region: GB-IOW
      formation: Wessex
    type_specimen:
      specimen_id: [ NHMUK PV R 181 ]
      specimen_type: holotype
      institution: NHMUK
      material: Partial cervical vertebra.
      completeness: fragmentary
    erected_in: huene1923a
references:
  - id: huene1923a
  - id: allain2014a
    notes: Treats Thecocoelurus as a nomen dubium but refers the holotype to
      Ornithomimosauria on comparison with the Angeac-Charente theropod.
  - id: naish2001a
    notes: Regarded Thecocoelurus as a nomen dubium given its fragmentary remains.
  - id: naish2002b
    notes: Finds the holotype undiagnostic, making the name a nomen dubium, and
      most similar to the cervical vertebrae of caenagnathid oviraptorosaurs.
  - id: naish2007a
    notes: Holds that, lacking autapomorphies, T. daviesi should not be regarded as
      a valid taxon, though it indicates caenagnathid-like oviraptorosaurs in
      the English Lower Cretaceous.
  - id: allain2022a
    notes: Retains the Angeac-Charente theropod in Ornithomimosauria on an
      anatomical survey, without a phylogenetic analysis.
  - id: cau2025a
    notes: Recovers the Angeac-Charente theropod, the comparison material for the
      ornithomimosaur referral, within Abelisauroidea.
