genus: Tapuiasaurus
parent: Saltasauroidea
etymology: "Named for the Tapuia people of Brazil combined with Greek 'sauros' meaning 'lizard', referring to the region of discovery in Minas Gerais, Brazil."
description: Tapuiasaurus is a genus of titanosaur which lived during the Lower
  Cretaceous period (Aptian age) in what is now Minas Gerais, Brazil.
dispute:
  summary: >
    Placed within Saltasauroidea as incertae sedis. The describing analysis
    (Zaher et al., 2011), which benefits from rare cranial material, recovered
    Tapuiasaurus deeply nested among derived titanosaurs as the sister taxon of
    Rapetosaurus, close to Nemegtosaurus. Later work cautions that this grouping
    of the few cranially-known titanosaurs may be an artifact and that
    Tapuiasaurus could occupy a much more basal, possibly pre-lithostrotian
    position (Wilson et al., 2016). It is parked at Saltasauroidea following the
    dedicated cranial analysis.
  history:
    - date: "2026-06-30"
      note: >
        Placed at Saltasauroidea incertae sedis per Zaher et al. (2011); a more
        basal position (Wilson et al., 2016) is noted.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - lacustrine
diagnostic_features:
  - Hook-shaped posteroventral process of the quadratojugal
  - Anterior process of jugal tapering and forming most of ventral margin of
    antorbital fenestra
  - Anterolateral tip of pterygoid contacts medial surface of ectopterygoid
  - Deep fossa on lateral surface of maxilla between antorbital fenestra and
    subnarial foramen
  - Elongated middle cervical vertebrae
  - Posterior dorsal vertebrae with well-developed prespinal lamina and absence
    of hyposphene-hypantrum
  - Crescent-shaped sternal plate
appearance:
  features:
    - square snout
  integument: scaled
  evidence: inferred
