genus: Texacephale
parent: Pachycephalosauridae
etymology: From 'Texas', the U.S. state where the fossil was found, and Greek 'kephale' meaning 'head', in reference to its place of discovery.
description: Texacephale is a possibly dubious genus of pachycephalosaurid
  dinosaur from the Campanian stage of the Late Cretaceous. Its fossils come
  from the Aguja Formation of Big Bend National Park, in Texas, and were
  described in 2010 by Longrich, Sankey and Tanke. The generic name means Texas
  + "head" (kephale in Greek) in reference to its place of discovery, and the
  specific name langstoni honors Wann Langston. It may be a synonym of
  Stegoceras.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Parietal articulating with postorbital via series of flange-like processes
  - Tall, narrow nasal boss with convex dorsal margin in lateral view
  - Skull roof elevated above braincase roof by low pedicel
