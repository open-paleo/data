genus: Texacephale
parent: Pachycephalosauridae
placement: incertae sedis
etymology: From 'Texas', the U.S. state where the fossil was found, and Greek 'kephale' meaning 'head', in reference to its place of discovery.
pronunciation:
  phonetic: tek-sa-SEH-fuh-lee
description: Texacephale is a dubious genus of pachycephalosaurid
  dinosaur from the Campanian stage of the Late Cretaceous. Its fossils come
  from the Aguja Formation of Big Bend National Park, in Texas, and were
  described in 2010 by Longrich, Sankey and Tanke. The generic name means Texas
  + "head" (kephale in Greek) in reference to its place of discovery, and the
  specific name langstoni honors Wann Langston. Wick and Lehman (2024) suggested
  on morphometric grounds that the holotype is probably an adult Stegoceras.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - coastal
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "163561"
  - source: wikidata
    id: Q19900502
  - source: gbif
    id: "8637747"
species:
  - name: Texacephale langstoni
    etymology: "Named for Wann Langston, honored in connection with the study of this pachycephalosaurid from Texas."
    status: nomen dubium
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Campanian
    location:
      country: US
      locality: WPA-1
      region: US-TX
      formation: Aguja
      member: Alto Shale
      part: lower
    erected_in: longrich2010b
    type_specimen:
      specimen_id: [LSUMNS 20010]
      specimen_type: holotype
      institution: LSUM
      material: Fused frontoparietals.
      completeness: fragmentary
references:
  - id: longrich2010b
  - id: lehman2010a
    notes: Finds all three diagnostic characters of Texacephale expressed in
      specimens referred to other pachycephalosaur taxa.
  - id: jasinski2011a
    notes: Found two of the three diagnostic characters in other
      pachycephalosaurids and the pedicel a product of erosion; called it a
      nomen dubium and its holotype Pachycephalosauridae indeterminate.
  - id: williamson2016a
    notes: Agrees with Jasinski and Sullivan (2011) that it is a nomen dubium.
  - id: wick2024a
    notes: Suggested on morphometric grounds that the holotype is probably an
      adult Stegoceras.
  - id: woodruff2025a
    notes: Excluded it from its phylogenetic analysis because the holotype is
      taphonomically distorted, and questioned its validity.
