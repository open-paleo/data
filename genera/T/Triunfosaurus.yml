genus: Triunfosaurus
parent: Somphospondyli
dispute:
  summary: >
    Triunfosaurus was described as a basal titanosaur (Carvalho et al., 2017),
    but the support for that placement is weak and a reassessment recovered it
    as an indeterminate somphospondylan, suggesting the holotype may be a
    chimera (Poropat et al., 2017; Jones, 2026).
  history:
    - date: "2026-06-30"
      note: >
        Placed conservatively at Somphospondyli following Poropat et al.
        (2017); the basal titanosaur alternative and possible chimeric status
        are noted.
etymology: "Named for the Triunfo Basin in Paraíba, Brazil, where the fossils
  were found, combined with Greek 'sauros' meaning 'lizard'."
pronunciation:
  phonetic: tree-UN-fo-SOR-us
description: Triunfosaurus is a genus of somphospondylan sauropod dinosaur from
  the Early Cretaceous of Brazil. It contains a single species, T. leonardii,
  described by Carvalho et al. in 2017. As a genus, Triunfosaurus can be
  distinguished from all other titanosaurs by the unique proportions of its
  ischium. It was initially described as a basal titanosaur, making it the
  earliest basal titanosaur known; however, subsequent research questioned the
  identification of the taxon as a titanosaur, instead reassigning it to the
  Somphospondyli.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Middle-anterior caudal vertebrae with short robust prezygapophyses directed
    anteriorly and slightly inclined upward
  - Neural spine small with sagittal process expanded at distal ends
  - Anteroposterior pubic pedicel of ischium divided by total ischium length
    larger than 0.5 (autapomorphy)
  - Close angle less than 70° formed between ischial shaft and acetabular line
    (autapomorphy)
  - Haemal canal dorsoventral height less than 50% of whole chevron, unlike
    other titanosaurs
