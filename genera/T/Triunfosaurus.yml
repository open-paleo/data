genus: Triunfosaurus
parent: Somphospondyli
dispute:
  summary: >
    Triunfosaurus was described as a basal titanosaur (Carvalho et al., 2017),
    but Poropat et al. (2017) reassessed it as an indeterminate somphospondylan.
    A redescription by Mannion and Carvalho (2026) provides a revised diagnosis,
    rebuts the suggestion that the holotype is a chimera, and recovers it as a
    somphospondylan lying either just outside Titanosauria or as an
    early-diverging titanosaur; its titanosaurian affinities cannot be excluded.
  history:
    - date: "2026-06-30"
      note: >
        Placed conservatively at Somphospondyli following Poropat et al.
        (2017); the basal titanosaur alternative and possible chimeric status
        are noted.
    - date: "2026-07-02"
      note: >
        Mannion and Carvalho (2026) redescribe the holotype, provide a revised
        diagnosis, and rebut the chimeric-holotype concern; Triunfosaurus is
        retained at Somphospondyli, with its position relative to Titanosauria
        unresolved.
etymology: "Named for the Triunfo Basin in Paraíba, Brazil, where the fossils
  were found, combined with Greek 'sauros' meaning 'lizard'."
pronunciation:
  phonetic: tree-UN-fo-SOR-us
description: Triunfosaurus is a genus of somphospondylan sauropod dinosaur from
  the Early Cretaceous of Brazil. It contains a single species, T. leonardii,
  described by Carvalho et al. in 2017. It was initially described as a basal
  titanosaur, potentially the earliest known; however, subsequent research
  questioned its identification as a titanosaur and reassigned it to the
  Somphospondyli.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Small tubercle close to the distal end of the lateral surface of the
    anterior caudal prezygapophyses.
  - Anterior caudal neural spines strongly expanded anteroposteriorly, the
    dorsal third of the spine about a third longer anteroposteriorly than the
    base.
  - Anteriormost haemal arch with ridges along the lateral margins of the
    proximal rami, forming flange-like processes that continue onto the distal
    blade.
