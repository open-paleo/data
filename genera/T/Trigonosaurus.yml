genus: Trigonosaurus
parent: Aeolosaurini
pronunciation:
  phonetic: try-GON-o-SAWR-us
etymology: From Greek 'trigōnon' (triangle), in reference to the
  Triângulo Mineiro region of Minas Gerais, Brazil where the
  holotype was found, and 'sauros' (lizard); meaning 'triangle
  lizard'.
description: >
  Trigonosaurus is a genus of titanosaurian dinosaurs from the
  Maastrichtian Serra da Galga Formation of Brazil. The type
  species, Trigonosaurus pricei, was first described by Campos,
  Kellner, Bertini, and Santucci in 2005. It was based on two
  specimens, both consisting mainly of vertebrae. The two
  specimens were originally believed to have come from the same
  individual. However, one specimen was described as the holotype
  of Caieiria in 2022, while the holotype may have instead come
  from Baurutitan. Before its description, it was known as the
  "Peirópolis titanosaur", after the place it was found.
dispute:
  summary: >
    The validity of Trigonosaurus is contested. Silva Junior et al.
    (2022) proposed that T. pricei is a junior subjective synonym
    of Baurutitan britoi (which has page priority within the same
    2005 journal volume) and erected the postcranial paratype
    (MCT 1719-R) as a separate new genus, Caieiria allocaudata.
    Fronimos (2023) explicitly rejected the synonymy, citing
    morphological differences in the first caudal vertebra of the
    two taxa.
  history:
    - date: "2026-06-30"
      note: >
        Placed in Aeolosaurini following the phylogenetic analysis of Silva
        Junior et al. (2022); the proposed synonymy with Baurutitan is contested
        by Fronimos (2023).
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Midcervical vertebrae elongated, with low neural spine and
    concave ventral margin of centrum.
  - Middorsal vertebrae elongated, with neural spine strongly
    inclined posteriorly.
  - Dorsal vertebrae 9 and 10 bear an incipient
    postzygodiapophyseal lamina linking diapophysis and
    postzygapophysis.
  - Anterior caudal vertebrae (2-5) with two pronounced dorsal
    depressions on the transverse process; middle caudals with
    one such depression.
  - Prezygapophyses on caudal vertebrae extended forward with
    wide articular faces.
  - Articular surfaces for haemal arches strongly developed from
    caudal 3 through the last preserved element (caudal 20);
    transverse processes well developed throughout the anterior
    and medial caudal sequence.
