genus: Tlatolophus
parent: Parasaurolophini
etymology: From Nahuatl tlahtolli, "word" or "speech", combined with Greek lophos, "crest" - means "word crest", in reference to the speech-symbol-shaped cranial crest
pronunciation:
  phonetic: TLAH-toh-LO-fus
description: Tlatolophus is a genus of hadrosaurid dinosaur belonging to the
  tribe Parasaurolophini that lived during the Campanian stage of the Late
  Cretaceous in what is now Mexico. The only species is the type species,
  Tlatolophus galorum.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Skull high with length/height ratio of 1.79
  - Premaxillary body wider with maximum/minimum width ratio about 2.4
  - Maxilla with low dorsal apex on ascending ramus
  - High and convex dorsal crest in pterygoid bone
  - High and inverted-comma shaped supracranial crest, dorsocaudal region ovoid
    and laterally compressed
  - Occipital condyle ventrally inclined 56 degrees
  - Long and laminar supraoccipital crest inside deep nuchal fossa
  - Squamosal shelf moderately long, as long as foramen magnum diameter
  - Dorsal margins of infratemporal fenestra and orbit at same level
  - Nasal elongated with acicular rostral end and expanded bilobed caudal end
appearance:
  features:
    - hollow cranial crest
  integument: scaled
  evidence: inferred
