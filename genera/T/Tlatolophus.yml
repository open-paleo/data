genus: Tlatolophus
parent: Parasaurolophini
etymology: From Nahuatl tlahtolli, "word" or "speech", combined with Greek lophos, "crest" — means "word crest", in reference to the speech-symbol-shaped cranial crest
description: Tlatolophus is a genus of hadrosaurid dinosaur belonging to the
  tribe Parasaurolophini that lived during the Campanian stage of the Late
  Cretaceous in what is now Mexico. The only species is the type species,
  Tlatolophus galorum.
diet: herbivore
