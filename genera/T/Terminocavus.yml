genus: Terminocavus
parent: Chasmosaurinae
etymology: "From Latin 'terminus' meaning 'end' and 'cavus' meaning 'cavity', meaning 'coming to the end of the cavity', referring to the nearly closed parietal embayment before its complete loss in more derived taxa"
pronunciation:
  phonetic: ter-mih-no-KAY-vus
description: Terminocavus is a genus of ceratopsid dinosaur from the late
  Cretaceous Period of what is now North America. The genus contains a single
  species, the type species Terminocavus sealeyi, known from a parietal and some
  other associated fragments. The holotype specimen was discovered in the
  Kirtland Formation of New Mexico in 1997, and was later described and named in
  a 2020 study. It was similar in anatomy to Pentaceratops and Anchiceratops,
  which it was closely related to, but had a distinctive heart-shaped upper
  frill with very narrow notch. It has been hypothesized to form an anagenetic
  series with several other chasmosaur species.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Posterior bar flattened and plate-like, not bar-like
  - Lateral rami of posterior bar strongly expanded anteroposteriorly both
    medially and laterally
  - Maximum anteroposterior thickness of posterior bar ~35% of parietal maximum
    width
  - Median embayment of posterior bar narrower and more notch-like
  - Parietal fenestrae subrounded rather than subangular
  - Lateral rami meet at steep angle of ~73 degrees
  - Epiparietals remain large and triangular through to adulthood
appearance:
  features:
    - neck frill
    - brow horns
  integument: scaled
  evidence: inferred
