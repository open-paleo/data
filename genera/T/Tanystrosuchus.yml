genus: Tanystrosuchus
parent: Theropoda
placement: incertae sedis
etymology: From Greek 'tanys-' ('long', 'stretched') and 'souchos' ('crocodile'),
  echoing Tanystrophaeus, the genus the species was originally placed in.
description: Tanystrosuchus is a dubious genus of theropod dinosaur from the Late
  Triassic (Norian) of Baden-Württemberg, Germany. It is known only from a
  single caudal vertebra, which von Huene (1908) described as a species of
  Tanystrophaeus and Kuhn (1963) made the type of the new genus Tanystrosuchus.
  The vertebra preserves no features diagnostic at a lower taxonomic level, so
  the name is treated as a nomen dubium.
status: nomen dubium
diet: carnivore
identifiers:
  - source: wikidata
    id: Q2686257
species:
  - name: Tanystrosuchus posthumus
    status: nomen dubium
    type_species: true
    period:
      name:
        - Late Triassic
      stage:
        - Norian
    location:
      country: DE
      region: DE-BW
      locality: Stuttgart-Heslach
      formation: Löwenstein
    type_specimen:
      specimen_id:
        - SMNS 4385
      specimen_type: holotype
      institution: SMNS
      material: Single distal caudal vertebra.
      completeness: fragmentary
      notes: Sues and Schoch (2025) give the horizon as the Middle
        Stubensandstein of the Löwenstein Formation and find the vertebra
        non-diagnostic. Von Huene (1908) described it as a distal caudal with
        strongly elongated, pointed postzygapophyses, rudimentary
        prezygapophyses and neural spine, and a broad centrum grooved below.
    synonyms:
      - name: Tanystrophaeus posthumus
        type: reassigned
        reason: The original combination (von Huene, 1908). Peyer (1931)
          showed the vertebra does not belong in Tanystropheus, and Kuhn
          (1963) erected Tanystrosuchus for the species.
      - name: Coelophysis posthumus
        type: reassigned
        reason: A combination under Coelophysis listed by Olshevsky (1991),
          who gives no author or date for it and does not claim it as his own.
    erected_in: huene1908a
erected_in: kuhn1963a
references:
  - id: huene1908a
    notes: Describes the distal caudal vertebra as Tanystrophaeus posthumus,
      from the Middle Keuper of Württemberg.
  - id: kuhn1963a
    notes: Erects Tanystrosuchus for von Huene's species.
  - id: olshevsky1991a
    notes: Lists the genus as a nomen dubium, possibly Halticosaurus or
      Liliensternus. Says "Wild (1973)" removed it from synonymy with T.
      conspicuus, citing no source; Spiekman and Scheyer (2019) do not.
  - id: tykoski2004a
    notes: Places the type species among the nomina dubia of Ceratosauria,
      material a caudal vertebra.
  - id: sues2025a
    notes: Places the genus at Theropoda incertae sedis as a nomen dubium, with
      holotype SMNS 4385 from Stuttgart-Heslach.
  - id: rauhut2000a
    notes: Redescribes holotype SMNS 4385 as a theropod posterior caudal
      with a broad ventral groove like that of Liliensternus, but
      indeterminable, and a nomen dubium from the lower or middle
      Stubensandstein.
  - id: spiekman2019a
    notes: Records that Peyer (1931) showed the species does not belong in
      Tanystropheus and that it is a theropod nomen dubium following
      Rauhut and Hungerbühler (2000).
  - id: peyer1931a
    notes: Monograph on Tanystropheus longobardicus whose material showed
      what the genus is, excluding this species from it.
