genus: Tongnanlong
parent: Mamenchisauridae
pronunciation:
  phonetic: TOHNG-nahn-long
etymology: From Chinese Tongnan (Tongnan District, Chongqing) combined with Chinese long, "dragon" - means "Tongnan District dragon"
description: Tongnanlong is a genus of mamenchisaurid dinosaur from the Late
  Jurassic Suining Formation of Chongqing, China. The type species is
  Tongnanlong zhimingi.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - lacustrine
diagnostic_features:
  - Dorsal centra opisthocoelous with camerate pneumatic structures
  - Well-developed spinopostzygapophysial laminae and fossae on dorsal vertebrae
  - Small laminae dividing pleurocoels on dorsal centra
  - Anterior caudal centra procoelous with posterodorsally-oriented neural spines
  - Fossa developed between postzygapophysis and hyposphene on anterior caudal
    vertebrae
  - S-shaped suture of scapula and coracoid, forming obtuse glenoid angle
appearance:
  integument: scaled
  evidence: inferred
