genus: Tambatitanis
parent: Somphospondyli
dispute:
  summary: >
    Tambatitanis was preliminarily placed within Euhelopodidae by its
    describers, who nonetheless noted titanosaur-like braincase features
    (Saegusa and Ikeda, 2014). A more recent analysis recovered it as the
    basalmost titanosaur (Mo et al., 2023).
  history:
    - date: "2026-06-30"
      note: >
        Placed conservatively at Somphospondyli given the unresolved
        euhelopodid versus titanosaurian debate.
etymology: "Named for Tamba (now Tamba-Sasayama), the city in Hyōgo Prefecture, Japan, where the fossils were found, combined with Ancient Greek 'titanis' meaning 'titan' or 'giant'; meaning 'Tamba giant.'"
pronunciation:
  phonetic: TAM-buh-TIE-tan-is
description: Tambatitanis is an extinct genus of titanosauriform, possibly
  titanosaurian, sauropod dinosaur from the Early Cretaceous-aged (early Albian)
  Ohyamashimo Formation of the Sasayama Group. It is known from a single
  species, Tambatitanis amicitiae, known from a partial skeleton.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - postzygapophysis and neural spine summit of anterior caudal vertebrae
    located beyond posterior centrum border
  - anterior caudal vertebrae neural spine curved strongly anteriorly,
    bow-shaped in lateral view
  - neural spine summit expanded hemispherical with anterior face excavated by
    deep narrow spinoprezygapophyseal fossa
  - transverse processes of anterior caudal vertebrae short and L-shaped
  - anterior chevron longest among sauropods in proportion to body size
  - distal ends of anterior chevrons rod-shaped
  - distal ends of mid chevrons transversely thin, anteroposteriorly long
    without cranial process
  - paroccipital process dorsal border short mediolaterally and V-shaped in
    posterior view
