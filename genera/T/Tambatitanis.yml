genus: Tambatitanis
parent: Euhelopodidae
etymology: "Named for Tamba (now Tamba-Sasayama), the city in Hyōgo Prefecture, Japan, where the fossils were found, combined with Ancient Greek 'titanis' meaning 'titan' or 'giant'; meaning 'Tamba giant.'"
description: Tambatitanis is an extinct genus of titanosauriform, possibly
  titanosaurian, sauropod dinosaur from the Early Cretaceous-aged (early Albian)
  Ohyamashimo Formation of the Sasayama Group. It is known from a single
  species, Tambatitanis amicitiae, known from a partial skeleton.
diet: herbivore
