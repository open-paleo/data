synonyms:
  - name: Ceratops horridus
    type: junior subjective
    reason: Originally named by Marsh (1888) as Ceratops horridus and
      transferred by Marsh (1889) to the new genus as Triceratops
      horridus.
  - name: Triceratops flabellatus
    type: junior subjective
    reason: Sunk into T. horridus by Forster (1996); no consistent
      morphological characters distinguish it from T. horridus.
  - name: Triceratops serratus
    type: junior subjective
    reason: Sunk into T. horridus by Forster (1996).
  - name: Triceratops elatus
    type: junior subjective
    reason: Sunk into T. horridus by Forster (1996).
  - name: Triceratops calicornis
    type: junior subjective
    reason: Sunk into T. horridus by Forster (1996).
  - name: Triceratops obtusus
    type: junior subjective
    reason: Sunk into T. horridus by Forster (1996).
  - name: Triceratops brevicornis
    type: junior subjective
    reason: Sunk into T. prorsus by Forster (1996); shares the
      derived characters (closed frontal fontanelle, short
      supraorbital horns, short rounded rostrum) of that species.
  - name: Ugrosaurus
    type: junior subjective
    reason: Generally interpreted in subsequent literature (Forster
      1993; Lehman 1998) as a juvenile or pathological Triceratops
      horridus.
  - name: Triceratops ingens
    type: nomen nudum
    reason: Unpublished Marsh manuscript name, mentioned by Lull
      (1915) without description or diagnosis (per Forster, 1996).
