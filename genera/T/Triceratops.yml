genus: Triceratops
parent: Triceratopsini
etymology: From Greek tri (three), keras (horn) and ops (face);
  meaning "three-horned face", referring to the paired supraorbital
  horn-cores and the median nasal horn-core that ornament the skull.
pronunciation:
  phonetic: try-SERR-uh-tops
  ipa: /traɪˈsɛrətɒps/
description: >
  Triceratops is the best-known ceratopsid dinosaur and among the
  most recognizable of all non-avian dinosaurs, defined by its three
  large facial horns, prominent toothless beak and solid,
  unfenestrated parietal-squamosal frill. Marsh erected the genus in
  1889 by transferring his earlier Ceratops horridus (Marsh, 1888) to
  the new combination Triceratops horridus, on a partial skull
  (later cataloged YPM 1820) recovered from the "Laramie" — now
  Lance — Formation of Wyoming. Through the 1890s and early 1900s
  Marsh and others named more than a dozen further species, of which
  only two are currently accepted today (T. horridus, the type, and
  T. prorsus), both restricted to the latest Maastrichtian of the
  Western Interior of North America. Forster (1996) sank most
  nominal species into one of these two through a cladistic and
  morphometric revision; Scannella et al. (2014) subsequently
  documented a stratigraphic pattern in the Hell Creek Formation
  suggesting a primarily anagenetic transition from T. horridus low
  in the section to T. prorsus near the K-Pg boundary. Several other
  names (T. galeus, T. sulcatus, T. maximus, T. eurycephalus, T.
  albertensis) rest on inadequate material and are now treated as
  nomina dubia. The proposed synonymy of Torosaurus with mature
  Triceratops (Scannella and Horner, 2010) has not been broadly
  accepted in subsequent literature (Longrich and Field 2012; Maiorino
  et al. 2013) and is not adopted here.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - forested
appearance:
  integument: scaled
  evidence: direct
diagnostic_features:
  - "Three large facial horns: paired supraorbital horn-cores plus a
    median nasal horn formed by the epinasal, seated on coossified
    nasals."
  - Edentulous premaxillae fronting an unpaired rostral bone (os
    rostrale) anterior to the premaxillae, forming a projecting
    toothless beak.
  - Parietal-squamosal frill solid and unfenestrated, extremely thick
    and heavily vascularised on its dorsal surface.
  - Squamosal short and broad with convex, rounded lateral margins;
    never thinned or fenestrated.
  - Frill saddle-shaped in dorsal aspect, with an upturned caudal
    margin and a strong parietal midline ridge.
  - Epoccipital ossifications fused along the parietal-squamosal
    margin, with one epoccipital spanning the midline of the
    parietal.
  - Frontal fontanelle small and circular, or absent in mature
    individuals, due to closure of the frontoparietal sutures.
  - Huge occipital portion of the frill extending posteriorly and
    laterally, bent ventrally at the sides to overhang the neck.
