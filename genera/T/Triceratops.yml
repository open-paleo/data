species:
  - name: Triceratops horridus
    etymology: From Latin horridus (rough, bristly), referring to the heavily
      ornamented occipital crest that frames the back of the skull in Marsh's
      holotype.
    status: valid
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Maastrichtian
    location:
      country: US
      region: US-WY
      formation: Lance
      locality: Niobrara County
      coordinates:
        - 43.3
        - -104.6
    size:
      length_m:
        min: 7.9
        max: 9
      weight_kg:
        min: 5400
        max: 12000
    type_specimen:
      specimen_id:
        - YPM 1820
      specimen_type: holotype
      institution: YPM
      material: Partial skull with paired supraorbital horn-cores, a median nasal
        horn-core on coossified nasals, edentulous premaxillae, rostral bone,
        and a posteriorly extended occipital crest; estimated at least two
        meters long.
      completeness: partial
    erected_in: marsh1889a
    synonyms:
      - name: Ceratops horridus
        type: junior subjective
        reason: Original combination; named by Marsh (1888) as Ceratops horridus
          and transferred by Marsh (1889) to the new genus as Triceratops
          horridus.
      - name: Triceratops flabellatus
        type: junior subjective
        reason: Sunk into T. horridus by Forster (1996); no consistent
          morphological characters distinguish it. The genus Sterrholophus
          (Marsh, 1891) is based on the same material.
      - name: Triceratops serratus
        type: junior subjective
        reason: Sunk into T. horridus by Forster (1996).
      - name: Triceratops elatus
        type: junior subjective
        reason: Sunk into T. horridus by Forster (1996).
      - name: Triceratops calicornis
        type: junior subjective
        reason: Sunk into T. horridus by Forster (1996).
      - name: Triceratops obtusus
        type: junior subjective
        reason: Sunk into T. horridus by Forster (1996).
  - name: Triceratops prorsus
    etymology: From Latin 'prorsus' (straight forward), for the forward-directed
      nasal horn.
    status: valid
    type_species: false
    period:
      name:
        - Late Cretaceous
      stage:
        - Maastrichtian
    location:
      country: US
      region: US-WY
      formation: Lance
      locality: Niobrara County
    type_specimen:
      specimen_id:
        - YPM 1822
      specimen_type: holotype
      institution: YPM
      material: Skull with closed frontal fontanelle, relatively short supraorbital
        horns, a long forward-inclined nasal horn, and a short, convexly rounded
        rostrum; basal skull length 88 cm.
    diagnostic_features:
      - Frontal fontanelle absent, closed by fusion of frontals and parietals
      - Supraorbital horns relatively short, horn length to basal skull length
        ratio 0.61 or less
      - Rostrum relatively deep and short, with a convexly rounded rostral margin
      - Nasal horn long, curved, and forward-inclined (30-50 degrees from
        vertical), extending anterior to the external nares
      - Massive horn cores with a narrow, extensive frill bearing broadly convex
        squamosals
    synonyms:
      - name: Triceratops brevicornus
        type: junior subjective
        reason: Sunk into T. prorsus by Forster (1996); shares the derived
          characters (closed frontal fontanelle, short supraorbital horns, short
          rounded rostrum) of that species.
    erected_in: marsh1890b
    described_in: forster1996a
notable_specimens:
  - nickname: Lane
    specimen_id:
      - HMNS PV.1506
    institution: HMNS
    category: exceptional-preservation
    significance: Nearly complete skeleton from the Zerbst Ranch, Wyoming, preserved
      with large areas of fossil skin over its trunk, recorded in positive
      relief by clay templating. Scales bear conical projections suggesting
      possible bristles or quills.
    discovered:
      year: 2002
    references:
      - bell2022a
  - specimen_id:
      - MWC 7584
    institution: MWC
    category: largest-individual
    significance: The largest-known Triceratops skull, estimated at 2.5 meters long
      when complete, reaching almost a third of the entire animal's length.
    references:
      - scannella2010a
  - nickname: Big John
    species: Triceratops horridus
    category: pathology
    significance: Large individual (about 8 meters long, estimated to have lived
      around 60 years) whose squamosal bears a fenestra apparently caused by
      another Triceratops horn, with the bone showing significant healing, cited
      as evidence of intraspecific combat using the horns.
    references:
      - danastasio2022a
references:
  - id: bell2022a
  - id: scannella2010a
  - id: danastasio2022a
  - id: marsh1889a
    notes: Erects the genus Triceratops by reassigning Ceratops horridus (Marsh,
      1888) to the new combination T. horridus, and additionally names T.
      flabellatus and T. galeus.
  - id: forster1996a
    notes: Reduces the historic 16 nominal Triceratops species to two valid species
      (T. horridus, T. prorsus) by cladistic and morphometric analysis, and
      establishes the modern generic diagnosis.
  - id: scannella2014a
    notes: Documents a stratigraphic transition through the Hell Creek Formation
      from T. horridus (lower) through transitional morphologies to T. prorsus
      (upper), favored as primarily anagenetic.
  - id: paul2024a
    notes: Source of the appearance features.
  - id: marsh1888b
    notes: Named Ceratops horridus, later the basis of Triceratops horridus.
  - id: maiorino2013a
    notes: Morphometric evidence against the Torosaurus-Triceratops synonymy.
  - id: forster1993a
    notes: Assessed the validity of Ugrosaurus olsoni relative to Triceratops.
  - id: lehman1998a
    notes: Interpreted Ugrosaurus as a juvenile or pathological Triceratops.
  - id: lull1915a
    notes: Mentioned the unpublished name Triceratops ingens without description.
  - id: longrich2012b
    notes: Argued Torosaurus is distinct from Triceratops, rejecting the synonymy.
  - id: marsh1890b
    notes: Names Triceratops prorsus, the second currently-accepted species of the
      genus.
