genus: Triceratops
parent: Ceratopsidae
pronunciation:
  ipa: /traɪˈsɛrətɒps/
  phonetic: try-SERR-uh-tops
etymology: "From Ancient Greek 'tri' meaning 'three', 'keras' meaning 'horn', and 'ops' meaning 'face', translating as 'three-horned face'."
description: >
  A genus of chasmosaurine ceratopsian dinosaur from the Late Cretaceous
  of North America. One of the last and largest ceratopsians,
  Triceratops is distinguished by its large bony frill and three facial
  horns. It is one of the most recognizable of all dinosaurs and among
  the most commonly found in the fossil record.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - forested
appearance:
  integument: scaled
  evidence: inferred
  features:
    - Large bony frill extending from the back of the skull
    - Two long brow horns above the eyes
    - Short nasal horn on the snout
diagnostic_features:
  - Three facial horns with elongate brow horns
  - Solid parietal frill lacking fenestrae
  - Elongate squamosal bones forming frill margin
identifiers:
  - source: wikidata
    id: Q14397
synonyms:
  - name: Ugrosaurus
    type: junior
    reason: Now generally interpreted as a juvenile specimen of Triceratops.
  - name: Tatankaceratops
    type: junior
    reason: Now generally interpreted either as a juvenile specimen of Triceratops or as an individual with a growth deficiency.
species:
