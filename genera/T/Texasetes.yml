genus: Texasetes
parent: Nodosauridae
pronunciation:
  phonetic: tek-sa-SEE-teez
etymology: Named after Texas, the US state where it was found, combined with Latin -etes, "resident" or "inhabitant" - means "Texas resident"
description: Texasetes is a genus of ankylosaurian dinosaurs from the late Lower
  Cretaceous of North America. This poorly known genus has been recovered from
  the Paw Paw Formation (late Albian) near Haslet, Tarrant County, Texas, which
  has also produced the nodosaurid ankylosaur Pawpawsaurus.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - marine
  - coastal
diagnostic_features:
  - Prong-like scapular spine directed toward innermost point of glenoid fossa
  - Small prespinous fossa developed anterior to scapular spine confluence
  - Splint-like lesser trochanter retained on femur
  - Scapular spine continuing line of anterior margin of blade, directed at
    glenoid inner limit
