genus: Telmatosaurus
parent: Hadrosauromorpha
pronunciation:
  phonetic: TEL-ma-to-SAWR-us
etymology: From Greek telma/telmat-, "swamp" or "marsh", combined with Greek
  sauros, "lizard" — means "marsh lizard"
description: Telmatosaurus is a genus of basal hadrosauromorph dinosaur from the
  Late Cretaceous of Romania. It was relatively small for its group, measuring
  approximately 5 m (16 ft) in length and 600 kg (1,300 lb) in body mass, which
  has been explained as an instance of insular dwarfism.
dispute:
  summary: >
    Telmatosaurus transsylvanicus was historically treated as the most basal
    hadrosaurid (Weishampel and colleagues, 1993), but recent analyses place
    it among the derived non-hadrosaurid hadrosauromorphs, outside
    Hadrosauridae (Xing and colleagues, 2014; Tsogtbaatar and colleagues,
    2019). Analyses on several matrices recover it as the sister taxon of
    Tethyshadros (Xing and colleagues, 2014; Lockwood and colleagues, 2021),
    while others place the two at successive nodes below Hadrosauridae
    (Prieto-Márquez and colleagues, 2013). Magyar and colleagues (2026) name
    the group, with Kryptohadros, as the clade Telmatosauridae.
  history:
    - date: "2026-06-27"
      note: Placed at Hadrosauromorpha following the prevailing view;
        the basalmost-hadrosaurid interpretation and the proposed
        Telmatosauridae both reflected, not adopted.
    - date: "2026-10-19"
      note: Retained at Hadrosauromorpha; the Telmatosaurus–Tethyshadros
        pairing is recovered on several matrices, but Telmatosauridae has
        not yet been used by later work.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
diagnostic_features:
  - Strong development of tubera basioccipitalia, completely covered by
    basisphenoid swellings, distinguishing it from hadrosaurids
  - Basipterygoid apophyses connected by high perpendicular transverse wall
    unique among ornithopods
  - Elongated nasal cavity with greatly extended premaxillaries reaching
    backward beyond lacrimal nearly to orbit
  - Dentale forms U-shaped connection with opposite mandibular ramus,
    distinguished from Camptosaurs by sharp inward curve
  - Lower jaw teeth with simple notched margins and lack of lateral surface,
    distinguishing from L. Hilli specimen
  - Lower jaw teeth bearing slightly elevated ridge on inner enamel surface with
    nodular thickening at mid-height
appearance:
  features:
    - keratinous beak
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "64068"
  - source: wikidata
    id: Q133856
  - source: gbif
    id: "4823288"
  - source: eol
    id: "4532082"
synonyms:
  - name: Limnosaurus
    type: preoccupied
    reason: Name preoccupied by Limnosaurus (Crocodilia).
  - name: Hecatasaurus
    type: junior objective
    reason: Coined by Nopcsa (1903) as a replacement when Limnosaurus was found to
      be preoccupied; ultimately superseded by Telmatosaurus.
erected_in: nopcsa1903a
species:
  - name: Telmatosaurus transsylvanicus
    etymology: "Named for Transylvania, the region of Romania where the holotype
      skull was found, with the Latin suffix '-icus' meaning 'of' or 'pertaining
      to'."
    status: valid
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Maastrichtian
    location:
      country: RO
      locality: Bonebed 1, along the Sibișel Valley near the village of Sânpetru
      region: RO-HD
      formation: Sânpetru
    size:
      length_m:
        min: 5.0
        max: 5.0
      weight_kg:
        min: 600
        max: 600
    type_specimen:
      specimen_id: [ BMNH R3386 ]
      specimen_type: holotype
      institution: NHMUK
      material: Almost complete skull (49 cm length) with mandible, fragments of upper
        and lower jaws from smaller individuals, basis cranii fragment
      completeness: partial
    erected_as: Limnosaurus transsylvanicus
    erected_in: nopcsa1900a
    synonyms:
      - name: Orthomerus transsylvanicus
        type: reassigned
        reason: Nopcsa (1915) transferred Telmatosaurus transsylvanicus into the
          pre-existing genus Orthomerus Seeley, 1883 as Orthomerus
          transsylvanicus, an assignment followed by Romer in Romer's reptile
          reviews but rejected by modern workers. The species-level
          reassignment applies to T. transsylvanicus only — the
          genus Orthomerus remains a separate valid (though
          dubious) name (per Olshevsky 1991; Madzia and colleagues 2019).
notable_specimens:
  - specimen_id: [LPB (FGGUB) R.1305]
    institution: LPB-RO
    species: Telmatosaurus transsylvanicus
    category: pathology
    significance: "A juvenile bearing a large benign ameloblastoma tumor on its lower jaw, the first occurrence of this tumor type in the fossil record, indicating susceptibility to such tumors is a deep-rooted feature of vertebrates. The animal died before reaching adulthood."
    references: [dumbravă2016a]
references:
  - id: dumbravă2016a
  - id: nopcsa1900a
    notes: In German. Original description of the material as Limnosaurus
      transsylvanicus; the genus name was preoccupied and renamed Telmatosaurus
      by Nopcsa (1903).
  - id: nopcsa1903a
  - id: paul2024a
    notes: Source of the appearance features.
  - id: tsogtbaatar2019a
    notes: Described new hadrosauroid, placing Telmatosaurus among derived non-hadrosaurid hadrosauromorphs.
  - id: magyar2026a
    notes: Described new Hațeg duck-billed dinosaur, grouping Telmatosaurus with Tethyshadros and Kryptohadros.
  - id: weishampel1993a
    notes: Described Telmatosaurus transsylvanicus and argued it was the most basal known hadrosaurid
  - id: olshevsky1991a
    notes: Treated Orthomerus as a separate valid though dubious name.
  - id: madzia2019a
    notes: Treated Orthomerus as separate from Telmatosaurus.
  - id: jones2026a
    notes: Treats Telmatosaurus as a non-hadrosaurid hadrosauromorph.
  - id: nopcsa1915a
  - id: xing2014a
    notes: Recovered Telmatosaurus and Tethyshadros as sister taxa.
  - id: lockwood2021a
    notes: Recovered Telmatosaurus and Tethyshadros as sister taxa, outside Hadrosauridae.
  - id: prieto-márquez2013a
    notes: Recovered Telmatosaurus and Tethyshadros at successive nodes below Hadrosauridae.
