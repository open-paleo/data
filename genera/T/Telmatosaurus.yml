synonyms:
  - name: Limnosaurus
    type: preoccupied
    reason: Name preoccupied by Limnosaurus (Crocodilia).
  - name: Hecatasaurus
    type: junior objective
    reason: Coined by Nopcsa (1903) as a replacement when Limnosaurus was found to
      be preoccupied; ultimately superseded by Telmatosaurus.
  - name: Orthomerus
    type: possible subjective
    reason: Possible junior subjective synonym of Telmatosaurus; identification is
      tentative. Per Olshevsky's Dinosaur Genera List.
species:
