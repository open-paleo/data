genus: Tataouinea
parent: Rebbachisaurinae
etymology: "Named for the Tataouine Governorate of Tunisia, where the fossils were discovered."
pronunciation:
  phonetic: ta-tah-wee-nee-uh
description: Tataouinea is an extinct genus of sauropod dinosaur in the
  subfamily Rebbachisaurinae of Rebbachisauridae which lived in the Early
  Cretaceous of Tunisia. Only one species, T. hannibalis, is known.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - coastal
diagnostic_features:
  - Elliptical foramen in lateral surface of fourth sacral neural spine
    penetrating camerate sector
  - Anteriormost caudal vertebrae with large elliptical pleurocoel in lateral
    surface of centrum
  - Lateral lamina in anterior caudal neural spines inverted Y-shaped, formed by
    merged spinoprezygapophyseal and spinodiapophysial laminae
  - Large elliptical foramen in medial surface of ischial iliac peduncle
appearance:
  features:
    - dorsal sail
