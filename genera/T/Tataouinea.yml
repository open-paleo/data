genus: Tataouinea
parent: Rebbachisaurinae
etymology: The genus name bears the name of the region where it was discovered,
  Tataouine, and the epithet honours Hannibal, a Carthaginian Punic military
  commander.
description: Tataouinea is an extinct genus of sauropod dinosaur in the
  subfamily Rebbachisaurinae of Rebbachisauridae which lived in the Early
  Cretaceous of Tunisia. Only one species, T. hannibalis, is known.
diet: herbivore
