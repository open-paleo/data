genus: Tharosaurus
parent: Eusauropoda
etymology: "Named for the Thar Desert of Rajasthan, India, where the holotype was found, combined with Greek 'sauros' meaning 'lizard'."
pronunciation:
  phonetic: THAR-oh-SOR-us
description: Tharosaurus is an extinct genus of potentially dubious eusauropod
  sauropod dinosaurs from the Middle Jurassic Jaisalmer Formation of India. The
  genus contains a single species, Tharosaurus indicus, known from a fragmentary
  skeleton including several vertebrae and a rib. When it was named in 2023,
  Tharosaurus was interpreted as the earliest known diplodocoid and the first
  member of this clade described from India. However, a later revision of the
  fossil material argued for a position outside of this clade, as an
  indeterminate eusauropod. This revision could not find unique features in the
  Tharosaurus specimen, so it was classified as a nomen dubium.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - marine
diagnostic_features:
  - Middle/posterior cervical centroprezygapophyseal lamina divided into lateral
    and medial branches with medial branch connecting to intraprezygapophyseal
    lamina
  - Middle/posterior cervical centropostzygapophyseal fossa elliptical and
    bordered laterally by pillar-like centropostzygapophyseal laminae
  - Deep bifurcation of cervical neural arch extending to dorsal margin of
    neural canal
  - Paired fossae on ventral surface of middle/posterior cervical centrum
    separated by mid-line keel
  - Anterior condyle of middle/posterior cervical more rugose compared to rest
    of centrum
  - Bifid middle/posterior cervical neural spine
  - Divided lateral fossa/pleurocoel on cervical centra
  - Lateral fossa divided into deep posterior and shallow anterior half by weak
    ridge
  - Prominent lateroventral flanges on middle/posterior cervical centrum
  - Middle/posterior cervical vertebrae with pre-epipophysis
  - Cordiform cross-section of anterior caudal centra
  - Middle/posterior dorsal transverse process laterally directed
  - Middle caudal centra articular surface with flat ventral margin
  - Ventral surface of mid-caudal centrum with deep median fossa
