genus: Tatankacephalus
parent: Nodosauridae
etymology: From Oglala Lakota tatanka ('bison') and Greek kephale ('head'),
  meaning 'bison head', in reference to the rounded head form
description: Tatankacephalus is a basal genus of nodosaurid dinosaur that lived
  during the Early Cretaceous. Its length has been estimated at 7 meters (23
  ft).
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Unsegmented, enlarged nuchal ridge
  - Concave lateral process projecting from paroccipital process
  - Keeled osteoderm on jugal process of quadratojugal dorsal to quadratojugal
    boss
  - Frontoparietal dome with convex lateral profile
  - Circular orbit
  - Posteroventrally directed foramen magnum opening
appearance:
  features:
    - body armor
    - osteoderms
  integument: armored
  evidence: direct
