genus: Tonganosaurus
parent: Mamenchisauridae
etymology: Named for the town of Tong'an in Sichuan Province, China, near where
  it was found, plus Greek sauros ('lizard')
pronunciation:
  phonetic: toon-GAH-no-SOR-us
description: Tonganosaurus is a genus of mamenchisaurid sauropod dinosaur,
  similar to Omeisaurus. It is known from one specimen consisting of twenty
  vertebrae, a front limb and pectoral girdle, and a complete hind limb with
  partial hip. It was discovered in the Yimen Formation, China. The horizon of
  the specimen and the age of the Yimen Formation is controversial. The
  formation has been divided into three levels, and Tonganosaurus appears to be
  of late Early Jurassic (Pliensbachian) in age. Tonganosaurus is the oldest
  known member of the mamenchisaurids, being almost 15 million years older than
  the next-oldest members of the group. It was first named by Li Kui, Yang
  Chun-Yan, Liu Jian, and Wang Zheng-Xin in 2010, and the type species is
  Tonganosaurus hei.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - All presacral vertebrae with well-developed lateral fossae, large and deep
    but lacking internal septa
  - Cervical vertebrae slender with low and anteroposteriorly elongated neural
    spines and arches
  - Pleurocoel and fossa structures of posterior cervical and dorsal vertebrae
    well developed
  - Anterior dorsal vertebrae opisthocoelous, middle dorsals platycoelous,
    posterior dorsals amphicoelous
  - Vertebral bone texture compact and non-camerate
  - Forelimb-to-hindlimb ratio 0.80
  - Femur straight and robust with well-developed fourth trochanter
  - Tibiae straight and robust, length equal to 0.75 times femur length
appearance:
  features:
    - elongate neck
  integument: scaled
  evidence: inferred
