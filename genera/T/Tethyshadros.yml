genus: Tethyshadros
parent: Hadrosauromorpha
etymology: Named after the ancient Tethys Sea (whose remnant waters covered the
  region), combined with Greek hadros, "thick" or "stout" (root of
  Hadrosauridae) - means "Tethyan hadrosauroid"
pronunciation:
  phonetic: teth-eez-HAD-ros
description: Tethyshadros is a genus of hadrosauroid dinosaur from the Late
  Cretaceous (Campanian) Lipica Formation (previously thought to come from the
  younger informal "Liburnia Formation") of Trieste, Italy. The type and only
  species is T. insularis.
dispute:
  summary: >
    Tethyshadros insularis is recovered as a derived non-hadrosaurid
    hadrosauromorph in most analyses, grouped with Telmatosaurus and
    Kryptohadros in the proposed Telmatosauridae (Magyar and others,
    2026); Prieto-Márquez and Wagner (2023) instead recovered it within
    Hadrosauridae.
  history:
    - date: "2026-06-27"
      note: Placed at Hadrosauromorpha following the prevailing view;
        the within-Hadrosauridae result of Prieto-Márquez and Wagner
        (2023) and the proposed Telmatosauridae both reflected, not
        adopted.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - coastal
diagnostic_features:
  - Skull large (1.60-1.65 times humeral length) and elongate (length:height
    ratio 2.6)
  - Premaxillary denticles very large, slender and pointed
  - Small paired crests in caudal part of parietals
  - Neural spines of proximal caudal vertebrae 1-6 hatchet-shaped
  - Long whip-like mid- to distal tail with elongated centra (2.4-3.4 times
    longer than high)
  - Tibia considerably longer than femur
appearance:
  features:
    - keratinous beak
    - whiplash tail
  integument: scaled
  evidence: inferred
