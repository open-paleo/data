genus: Tethyshadros
parent: Hadrosauroidea
etymology: Named after the ancient Tethys Sea (whose remnant waters covered the region), combined with Greek hadros, "thick" or "stout" (root of Hadrosauridae) — means "Tethyan hadrosauroid"
description: Tethyshadros is a genus of hadrosauroid dinosaur from the Late
  Cretaceous (Campanian) Lipica Formation (previously thought to come from the
  younger informal "Liburnia Formation") of Trieste, Italy. The type and only
  species is T. insularis.
diet: herbivore
locomotion: facultative
