genus: Turanoceratops
parent: Ceratopsoidea
etymology: Turan horned face
description: Turanoceratops is a genus of herbivorous ceratopsian dinosaur from
  the late Cretaceous Bissekty Formation of Uzbekistan. The fossils dated from
  the mid-late Turonian stage, roughly 90 million years ago. The skull bore a
  pair of long brow horns like those seen in the Ceratopsidae, although
  Turanoceratops appears to have been transitional between earlier ceratopsians
  and ceratopsids, and not a ceratopsid itself.
diet: herbivore
