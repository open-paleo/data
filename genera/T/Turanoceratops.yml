genus: Turanoceratops
parent: Ceratopsoidea
pronunciation:
  phonetic: too-RAHN-o-SER-a-tops
etymology: "Combines 'Turan', an old Persian name for Turkestan (the region of
  discovery in Uzbekistan), with Greek 'ceratops' meaning 'horned face'."
description: Turanoceratops is a genus of herbivorous ceratopsian dinosaur from
  the late Cretaceous Bissekty Formation of Uzbekistan. The fossils dated from
  the mid-late Turonian stage, roughly 90 million years ago. The skull bore a
  pair of long brow horns like those seen in the Ceratopsidae, although
  Turanoceratops appears to have been transitional between earlier ceratopsians
  and ceratopsids, and not a ceratopsid itself.
dispute:
  summary: >
    Turanoceratops tardabilis is the basis of a long dispute over the
    first Asian ceratopsid. Sues and Averianov (2009) recovered it
    within Ceratopsidae as the sister to Centrosaurinae, but Farke and
    others (2009) reanalyzed it as the sister taxon to Ceratopsidae
    lying outside it, a view followed by Jones (2026).
  history:
    - date: "2026-06-27"
      note: Placed at Ceratopsoidea, the least-inclusive clade both
        hypotheses accept; the within-Ceratopsidae position of Sues and
        Averianov (2009) reflected, not adopted.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - coastal
appearance:
