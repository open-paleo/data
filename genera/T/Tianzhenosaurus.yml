synonyms:
  - name: Shanxia tianzhenensis
    type: junior subjective
    reason: Per Arbour and Currie (2015), no features distinguish
      Shanxia from Tianzhenosaurus; both from the same formation
      with similar squamosal horn morphology, and Tianzhenosaurus
      youngi has nomenclatural priority by date of publication
      (1 June vs 15 June 1998).
