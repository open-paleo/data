genus: Tianzhenosaurus
parent: Ankylosaurinae
etymology: From Tianzhen County (Shanxi Province, China, where the
  holotype was found) and Greek 'sauros' (lizard); meaning
  'Tianzhen lizard'.
pronunciation:
  phonetic: TYEN-juhn-o-SOR-us
description: >
  Tianzhenosaurus is a genus of ankylosaurid dinosaurs known from
  the Late Cretaceous Huiquanpu Formation of Shanxi Province,
  China. The genus contains two species, T. youngi (the type
  species) and T. chengi.
dispute: >
  The validity of Tianzhenosaurus is contested. Sullivan (1999)
  and Arbour and Currie (2015) treated T. youngi as a junior
  subjective synonym of the Mongolian ankylosaurid Saichania
  chulsanensis, finding no taxonomically significant differences
  between the holotype skulls. In 2024, Pang, Li and Guo described
  a second species, T. chengi, treating Tianzhenosaurus as a
  valid genus. No broad consensus has been reached.
diet: herbivore
locomotion: quadrupedal
integument: armored
diagnostic_features:
  - Skull low, flat, medium-sized, isosceles triangle shape; skull
    roof covered with irregular bony tubercles.
  - Orbit small, surrounded by bony ring; narial opening
    horizontally elongate; septomaxilla does not separate narial
    openings.
  - Occipital condyle narrow, high; not visible in dorsal view;
    opisthotic extends lateroventrally as curved process.
  - Mandible deep with convex ventral border; no mandibular
    ornamentation; tooth crowns with cingula on labial sides,
    swollen bases, and middle ridge on lingual sides.
  - Eight fused vertebrae in sacrum (three dorsosacrals, four
    sacrals, one caudosacral); cervical centrum short
    amphicoelous; dorsal centrum long amphiplatyan.
  - Tail club present; scapula rectangular plate-like; femur
    thick lacking fourth trochanter.
paleoenvironment:
  - fluvial
appearance:
  integument: armored
  evidence: inferred
