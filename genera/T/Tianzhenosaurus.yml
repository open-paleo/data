references:
  - id: pang1998a
    notes: Original describing paper for Tianzhenosaurus youngi.
  - id: sullivan1999a
    notes: Treats T. youngi as a junior subjective synonym of Saichania
      chulsanensis on the basis of overall skull similarity, despite differences
      in cranial osteoderm arrangement.
  - id: arbour2015a
    notes: Formalizes T. youngi and Shanxia tianzhenensis as junior subjective
      synonyms of Saichania chulsanensis, finding no taxonomically significant
      differences between the holotype skulls.
  - id: pang2024a
    notes: Describes T. chengi as a second species, treating Tianzhenosaurus as
      a valid genus rather than a junior synonym of Saichania.
