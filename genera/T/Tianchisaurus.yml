genus: Tianchisaurus
parent: Ankylosauria
pronunciation:
  phonetic: tyen-CHIH-SAWR-us
etymology: "From Chinese meaning 'heavenly pool lizard', referring to Tianchi
  (Heavenly Lake) near the discovery locality in Xinjiang, China."
description: Tianchisaurus, also invalidly called Tianchiasaurus and
  "Jurassosaurus", is a genus of ankylosaurian dinosaur from the Late Jurassic
  (Oxfordian-Kimmeridgian) Toutunhe Formation of China. While many
  later-diverging ankylosaurids had bony clubs at the tips of their tails,
  Tianchisaurus likely lacked such a structure.
dispute:
  summary: >
    Tianchisaurus is a nomen dubium; its material is lost and the holotype lacked distinguishing characters (Arbour and Currie, 2015), leaving it Ankylosauria indeterminate. It is retained at Ankylosauria incertae sedis.
  history:
    - date: "2026-06-26"
      note: Placed at Ankylosauria incertae sedis, nomen dubium with lost, undiagnostic material.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Primitive, small ankylosaur (up to 3 meters long) with well developed armor
    in shoulder region
  - Skull relatively heavy and little wider than Scelidosaurus; mandible thinner
    than other ankylosaurs but similar to stegosaurs
  - Dorsal vertebrae amphiplatyan and primitive; dorsal centra and ribs not
    co-ossified
  - Sacrum consists of seven vertebrae including two dorsosacrals and one
    caudosacral; small flat tail club
  - Fourth trochanter of femur long and prominent with metatarsals rather
    primitive for an ankylosaur
appearance:
  features:
    - body armor
  integument: armored
  evidence: direct
identifiers:
  - source: pbdb
    id: "171151"
  - source: wikidata
    id: Q871907
  - source: gbif
    id: "4823071"
  - source: eol
    id: "52571986"
synonyms:
  - name: Tianchiasaurus
    type: junior objective
    reason: Variant spelling appearing alongside Tianchisaurus in Dong's 1993
      description paper; Dong's 1994 erratum confirmed Tianchisaurus as the
      correct name.
  - name: Tenchisaurus
    type: informal
    reason: Unpublished museum name for the specimen later formally described as
      Tianchisaurus.
  - name: Jurassosaurus
    type: nomen nudum
    reason: Proposed by Don Lessem with a specific name honoring the Jurassic Park
      cast; Dong Zhiming ultimately discarded the name in favor of
      Tianchisaurus.
  - name: Sangonghesaurus
    type: junior subjective
    reason: Informal name used for the same fossils later formally described as
      Tianchisaurus.
species:
  - name: Tianchisaurus nedegoapeferima
    etymology: "Formed from syllables of the surnames of the principal cast of the
      1993 film Jurassic Park: Sam Neill, Laura Dern, Jeff Goldblum, Richard
      Attenborough, Bob Peck, Martin Ferrero, Ariana Richards, and Joseph
      Mazzello, as a gift from director Steven Spielberg honoring the cast at
      the completion of filming."
    status: valid
    type_species: true
    period:
      name:
        - Middle Jurassic
      stage:
        - Callovian
      from_ma: 165.3
      to_ma: 163.5
    size:
      length_m:
        min: 3
        max: 3
    location:
      country: CN
      region: Xinjiang
      formation: Toutunhe
    type_specimen:
      specimen_id: [ IVPP V. 10614 ]
      specimen_type: holotype
      institution: IVPP
      material: Fragments of skull, five cervical, six dorsal, seven sacral, and three
        caudal vertebrae; some limb bone fragments; many scutes
      completeness: partial
    erected_in: dong1993a
references:
  - id: dong1993a
  - id: jones2026a
    notes: Source of the body length estimate, and the appearance features.
  - id: arbour2015a
    notes: Regarded Tianchisaurus as Ankylosauria indeterminate, its holotype undiagnostic.
