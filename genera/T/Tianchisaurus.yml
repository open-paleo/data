genus: Tianchisaurus
parent: Ankylosauria
etymology: "From Chinese meaning 'heavenly pool lizard', referring to Tianchi
  (Heavenly Lake) near the discovery locality in Xinjiang, China."
description: Tianchisaurus, also invalidly called Tianchiasaurus and
  "Jurassosaurus", is a genus of ankylosaurian dinosaur from the Late Jurassic
  (Oxfordian-Kimmeridgian) Toutunhe Formation of China. While many
  later-diverging ankylosaurids had bony clubs at the tips of their tails,
  Tianchisaurus likely lacked such a structure.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Primitive, small ankylosaur (up to 3 meters long) with well developed armor
    in shoulder region
  - Skull relatively heavy and little wider than Scelidosaurus; mandible thinner
    than other ankylosaurs but similar to stegosaurs
  - Dorsal vertebrae amphiplatyan and primitive; dorsal centra and ribs not
    co-ossified
  - Sacrum consists of seven vertebrae including two dorsosacrals and one
    caudosacral; small flat tail club
  - Fourth trochanter of femur long and prominent with metatarsals rather
    primitive for an ankylosaur
