genus: Talenkauen
parent: Elasmaria
etymology: "From the Aonikenk (Tehuelche) language: 'talenk' meaning 'small' and 'kauen' meaning 'skull', referring to the relatively small skull of the specimen"
description: Talenkauen is a genus of basal iguanodont dinosaur from the
  Campanian or Maastrichtian age of the Late Cretaceous Cerro Fortaleza
  Formation, formerly known as the Pari Aike Formation of Patagonian Lake
  Viedma, in the Austral Basin of Santa Cruz, Argentina. It is based on
  MPM-10001A, a partial articulated skeleton missing the rear part of the skull,
  the tail, and the hands. The type and only species is Talenkauen
  santacrucensis.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
