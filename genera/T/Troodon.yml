genus: Troodon
parent: Troodontinae
dispute:
  summary: >
    The holotype of Troodon formosus, the type genus of Troodontidae, is an
    isolated tooth. Zanno and colleagues (2011) and Evans and colleagues (2017)
    suggest the name may be a nomen dubium, and van der Reest and Currie (2017)
    treat it as one and transfer its referred material to Stenonychosaurus.
    Varricchio and colleagues (2025) argue that the name is valid, propose a
    neotype, and report an ICZN petition in preparation.
    Where its referred material is scored it is recovered as a derived
    troodontine (with Saurornithoides and Zanabazar), where it is placed.
  history:
    - date: "2026-07-01"
      note: Moved from Troodontini (tribe dropped) to Troodontinae; retained pending the ICZN petition (Varricchio and colleagues, 2025). A nomen dubium.
    - date: "2026-10-08"
      note: Status kept disputed; no ICZN ruling on the proposed neotype found.
pronunciation:
  phonetic: TROH-uh-don
  ipa: /ˈtroʊ.ədɒn/
etymology: "From Greek 'troo' (wounding) and 'odon' meaning 'tooth', hence
  'wounding tooth', referring to the distinctive serrated teeth."
description: Troodon is a controversial genus of relatively small, bird-like
  theropod dinosaurs definitively known from the Campanian age of the Late
  Cretaceous period (about 77 million years ago). It includes at least one
  species, Troodon formosus, known from Montana. Discovered in October 1855, T.
  formosus was among the first dinosaurs found in North America, although it was
  thought to be a lizard until 1877.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Compressed, curved, conical crown with trenchant edges
  - Outer side more convex than inner side
  - Trenchant edges coarsely denticulated
  - Denticulations compressed conical with trenchant edges, bent toward crown
    apex
  - Inner surface worn from friction of opposing tooth
