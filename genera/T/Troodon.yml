genus: Troodon
parent: Troodontinae
dispute:
  summary: >
    Troodon formosus, the type genus of Troodontidae, is widely regarded as a
    nomen dubium because its holotype is an isolated, undiagnostic tooth (Zanno et
    al., 2011; Evans et al., 2017; van der Reest and Currie, 2017), leading some
    authors to transfer its referred material to Stenonychosaurus. Varricchio et
    al. (2025) instead propose a neotype and an ICZN petition to retain Troodon.
    Where its referred material is scored it is recovered as a derived troodontine
    (with Saurornithoides and Zanabazar), the placement adopted here.
  history:
    - date: "2026-07-01"
      note: Moved from Troodontini (tribe dropped) to Troodontinae; retained pending the ICZN petition (Varricchio et al., 2025). A nomen dubium.
pronunciation:
  phonetic: TROH-uh-don
  ipa: /ˈtroʊ.ədɒn/
etymology: "From Greek 'troo' (wounding) and 'odon' meaning 'tooth', hence
  'wounding tooth', referring to the distinctive serrated teeth."
description: Troodon is a controversial genus of relatively small, bird-like
  theropod dinosaurs definitively known from the Campanian age of the Late
  Cretaceous period (about 77 million years ago). It includes at least one
  species, Troodon formosus, known from Montana. Discovered in October 1855, T.
  formosus was among the first dinosaurs found in North America, although it was
  thought to be a lizard until 1877.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Compressed, curved, conical crown with trenchant edges
  - Outer side more convex than inner side
  - Trenchant edges coarsely denticulated
  - Denticulations compressed conical with trenchant edges, bent toward crown
    apex
  - Inner surface worn from friction of opposing tooth
