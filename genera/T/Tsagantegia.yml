genus: Tsagantegia
parent: Ankylosaurinae
pronunciation:
  ipa: /ˌsɑːɡɑːnˈteɪɡiə/
description: Tsagantegia is a genus of medium-sized ankylosaurid thyreophoran
  dinosaur that lived in Asia during the Late Cretaceous period. The genus is
  monotypic, including only the type species, T. longicranialis. The specimen
  consists of a very partial individual, comprising the skull and lacking
  postcranial remains. Since it only preserves the skull, Tsagantegia is mainly
  characterized by its elongated snout and the flattened facial osteoderms,
  greatly differing from other ankylosaurs.
diet: herbivore
