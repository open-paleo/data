genus: Anoplosaurus
parent: Nodosauridae
pronunciation:
  phonetic: an-OP-lo-SAWR-us
etymology: From Greek 'anoplos' meaning 'unarmed' or 'unarmored' and 'sauros' meaning 'lizard'; meaning 'unarmed lizard'
description: Anoplosaurus is an extinct genus of herbivorous nodosaurid dinosaur
  from the Late Cretaceous (Cenomanian age) Cambridge Greensand of
  Cambridgeshire, England. It has in the past been classified with either the
  armored dinosaurs or the ornithopods, but current thought has been in
  agreement with the "armored dinosaur" interpretation, placing it in the
  Ankylosauria.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - marine
appearance:
  integument: armored
diagnostic_features:
  - "Dorsal ribs T-shaped: visceral surface compressed and dorsal surface
    expanded like crosspiece of capital T, suggesting great development of
    intercostal muscles"
  - Scapula with distinctive massive quadrate spinous process on humeral side,
    increasing thickness of bone, rounded inferiorly like pulley surface
  - Sacral region with enlarged neural canal much wider than diameter of dorsal
    centrum, indicating hind limbs relatively more developed than fore limbs
  - "Body carried in semierect position: dorsal vertebral centrums form upward
    arch unlike straight horizontal column, suggesting semierect progression"
  - Sacral vertebrae lack anchylosis but in intimate juxtaposition; series
    includes six centrums with dissimilar forms unlike rounded dorsal forms
  - "Tail shows semierect posture correlation: caudal vertebrae form curve with
    convex side downward, root elevated well above ground"
