species:
  - name: Anoplosaurus curtonotus
    etymology: "From Latin curtus, meaning 'short', and the Greek noton, meaning 'back'."
    status: valid
    type_species: true
    period:
      name:
        - Early Cretaceous
      stage:
        - Albian
    location:
      country: GB
      locality: Reach
      region: GB-CAM
      group: Chalk
      notes: Which unit the syntypes came from is unresolved. Pereda-Suberbiola and Barrett (1999) place them in either the Cambridge Greensand or the underlying Upper Gault Clay without deciding, and the Cambridge Greensand is itself a remanié deposit whose fossils are reworked from older beds. The group is recorded because it contains both candidates.
    size:
      length_m:
        min: 2
        max: 2
    erected_in: seeley1879a
    type_specimen:
      specimen_id: [CAMSM B55731]
      specimen_type: lectotype
      institution: CAMSM
      material: Partial right scapula
      completeness: fragmentary
      notes: >
        Seeley (1879) erected the species on a syntype series and designated no
        holotype. Pereda-Suberbiola and Barrett (1999) designated CAMSM B55731, a
        partial right scapula, as the lectotype under ICZN Art. 74, chosen
        because it had been figured previously (Seeley 1879, pl. 35, fig. 3) and
        possesses a distinctive morphology; the remaining 72 cataloged syntypes
        (CAMSM B55670-B55742, excluding B55731) became paralectotypes. They
        comprise a partial left dentary, cervical, dorsal, sacral and caudal
        centra, neural arches, dorsal and sacral ribs, coracoids, humerus,
        femur, tibia, a possible metacarpal, possible metatarsals and a phalanx,
        apparently from a single immature individual about 2 m long, an
        association exceptional among Cambridge Greensand material.
        Pereda-Suberbiola and Barrett state 77 syntypes in prose but catalog 73
        numbers; the discrepancy is in the source and is not resolvable.

        The type horizon is uncertain. Pereda-Suberbiola and Barrett give
        "?Upper Gault Clay or ?Cambridge Greensand, Upper Albian" and favor the
        Gault on taphonomic grounds, since an associated skeleton would be
        exceptional for the Cambridge Greensand; Barrett and Bonsor (2020) place
        the associated skeleton in the Cambridge Greensand Member, whose
        vertebrate remains are reworked from the underlying Gault. The material
        is late Albian in age either way.
references:
  - id: seeley1879a
  - id: pereda-suberbiola1999a
    notes: Lectotype designation (ICZN Art. 74) and redescription; removes the
      species from Ornithopoda to Nodosauridae.
  - id: barrett2020a
    notes: Affirms Anoplosaurus curtonotus as the only valid taxon named from
      the Cambridge Greensand, and dates the Member's vertebrate remains as
      reworked from the upper Albian Gault Formation.
  - id: jones2026a
    notes: Source of the body length estimate.
