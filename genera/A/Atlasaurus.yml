genus: Atlasaurus
parent: Macronaria
pronunciation:
  phonetic: AT-luh-SAWR-us
etymology: Named for the Atlas Mountains of North Africa, where its fossils were found, combined with Greek 'sauros' meaning 'lizard'.
description: Atlasaurus is a genus of sauropod dinosaurs from Middle Jurassic
  (Bathonian to Callovian stages) beds in North Africa.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - wetland
diagnostic_features:
  - Supratemporal fenestra twice as wide as long (140 by 70 mm), not visible in
    lateral perspective
  - Combined width of paroccipital processes 48% of estimated mandible length;
    processes extend horizontally at nearly right angles to skull long axis
  - Mandibular symphysis and dentary very shallow (symphyseal depth 116% minimum
    depth of dentary)
  - Humerus length 65% of estimated dorsal vertebral series length
  - Ulna length exceeds tibia length by approximately 115%
appearance:
  features:
    - elongate forelimbs
  integument: scaled
  evidence: inferred
