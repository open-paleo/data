genus: Atlasaurus
parent: Eusauropoda
dispute:
  summary: >
    The affinities of Atlasaurus are contested. The dedicated titanosauriform
    analyses of D'Emic (2012) and Mannion et al. (2013, 2017) recover it as a
    non-neosauropod eusauropod, outside Macronaria, whereas Moore et al.
    (2020) recover it as a basal macronarian, Royo-Torres et al. (2020) as a
    brachiosaurid, and Jones (2026) retains it within Camarasauromorpha.
  history:
    - date: "2026-06-30"
      note: >
        Moved from Macronaria to Eusauropoda following the dedicated
        titanosauriform analyses that place it outside Neosauropoda; finer
        placement is deferred to the eusauropod and turiasaur reconciliation.
    - date: "2026-07-02"
      note: Confirmed and placed at Eusauropoda incertae sedis in the sauropod-backbone finishes; the outside-Neosauropoda, basal-macronarian, and brachiosaurid hypotheses remain unresolved.
pronunciation:
  phonetic: AT-luh-SAWR-us
etymology: Named for the Atlas Mountains of North Africa, where its fossils were found, combined with Greek 'sauros' meaning 'lizard'.
description: Atlasaurus is a genus of sauropod dinosaurs from Middle Jurassic
  (Bathonian to Callovian stages) beds in North Africa.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - wetland
diagnostic_features:
  - Supratemporal fenestra twice as wide as long (140 by 70 mm), not visible in
    lateral perspective
  - Combined width of paroccipital processes 48% of estimated mandible length;
    processes extend horizontally at nearly right angles to skull long axis
  - Mandibular symphysis and dentary very shallow (symphyseal depth 116% minimum
    depth of dentary)
  - Humerus length 65% of estimated dorsal vertebral series length
  - Ulna length exceeds tibia length by approximately 115%
appearance:
  features:
    - elongate forelimbs
  integument: scaled
  evidence: inferred
