genus: Abditosaurus
parent: Saltasauridae
etymology: From Latin 'abditus' meaning 'forgotten' or 'hidden' and Greek 'sauros' meaning 'lizard'; meaning 'forgotten lizard'
pronunciation:
  phonetic: ab-DEE-toe-SOR-us
description: Abditosaurus is an extinct genus of titanosaurian sauropod dinosaur
  from the Late Cretaceous (Maastrichtian) Conques Formation (Tremp Group) of
  Catalonia, Spain. The genus contains a single species, Abditosaurus kuehnei,
  known from a partial specimen representing the most complete titanosaur
  skeleton found in Europe. Phylogenetic analyses recover it within a clade of
  South American and African saltasaurines, distinct from other insular dwarf
  sauropods from the European archipelago. Abditosaurus inhabited the
  Ibero-Armorican Island, a prehistoric island made up of what is now Spain,
  Portugal, and southern France, and would have been the largest titanosaur
  species in its environment.
dispute:
  summary: >
    Placed within Saltasauridae as incertae sedis. The describing analysis (Vila
    et al., 2022) recovered Abditosaurus more precisely as a saltasaurine, within
    a clade of South American and African saltasaurines (sister to Paralititan)
    distinct from the lirainosaurine titanosaurs of the European archipelago.
    Because that saltasaurine topology rests on a single analysis whose recovered
    neighbors (Paralititan, Maxakalisaurus) are atypical relative to most
    studies, it is placed conservatively at Saltasauridae rather than within
    Saltasaurinae.
  history:
    - date: "2026-06-30"
      note: >
        Placed at Saltasauridae incertae sedis; Vila et al. (2022) recover it
        within Saltasaurinae, but the supporting topology is not yet
        corroborated.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Anterior dorsal vertebrae with anterior centrodiapophyseal lamina not
    reaching centrum but intersecting centroprezygapophyseal lamina; diapophyses
    ventral to postzygapophyses; absence of centroprezygapophyseal lamina.
  - Middle dorsal vertebrae with oblique posterodorsally oriented accessory
    lamina dividing parapophyseal centrodiapophyseal fossa and secondary
    prezygodiapophyseal lamina dividing prezygapophyseal paradiapophyseal fossa.
  - Abundant pneumatic foramina in spinopostzygapophyseal,
    centropostzygapophyseal, and postzygapophyseal centrodiapophyseal fossae of
    dorsal vertebrae.
  - Anterior dorsal ribs lacking pneumatic foramina on anterolateral and
    posteromedial surfaces; second dorsal ribs with anteroposterior thickening
    or bulge on posterior margin of distal end.
  - Scapula with co-occurrence of posteroventral process on medial margin of
    acromial plate, subtle anteroventral process, prominent dorsomedial blade
    bulge, and two oval lateral fossae on posterior blade end.
  - Coracoid foramen elliptical and twisting its orientation from lateral
    through to medial surface; fibula distal end bevelled posteriorly 20°
    relative to long axis of shaft.
