genus: Abrosaurus
parent: Eusauropoda
placement: incertae sedis
dispute:
  summary: >
    Abrosaurus was described as a camarasaurid (Ouyang, 1989) but has not
    been included in a phylogenetic analysis. Upchurch and colleagues (2004)
    provisionally regard it as a basal macronarian, Wilson (2005) lists it
    among basal eusauropods, and Peng and colleagues (2005) assign it to
    Mamenchisauridae; undescribed cranial material limits its resolution.
pronunciation:
  phonetic: AB-ro-SAWR-us
  ipa: /ˌæbroʊˈsɔːrəs/
etymology: "From Greek 'abros' meaning 'delicate' or 'dainty' and 'sauros'
  meaning 'lizard', referring to the delicate skull structure."
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Skull height/length index of 1:1.8, producing a lower and more elongated
    skull than other camarasaurids
  - External nares larger than orbits and divided only by an extremely thin
    medial nasal crest
  - Antorbital fenestra triangular and isosceles in shape, approximately half
    the size of the orbit
  - Parietal extremely narrow with supratemporal fenestrae in relatively close
    proximity
  - Premaxillary tooth count of 5, unrecorded in any other sauropod
  - Dentary distinctly dorsoventrally constricted at its midportion between the
    anterior end and the coronoid process
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "56458"
species:
  - name: Abrosaurus dongpoi
    etymology: Named for Dongpo, the stylized name of Sushi (1037-1101), a
      distinguished Northern Sung Dynasty literary scholar from Sichuan.
    status: valid
    type_species: true
    period:
      name:
