genus: Abrosaurus
parent: Mamenchisauridae
pronunciation:
  phonetic: AB-ro-SAWR-us
  ipa: /ˌæbroʊˈsɔːrəs/
etymology: "From Greek 'abros' meaning 'delicate' or 'dainty' and 'sauros'
  meaning 'lizard', referring to the delicate skull structure."
description: Abrosaurus is a genus of macronarian sauropod dinosaur from the
  Middle Jurassic Period of what is now Asia. It is one of many dinosaurs found
  at the Dashanpu Quarry in the Sichuan Province of China. Like most sauropods,
  Abrosaurus was a quadrupedal herbivore. It was rather small for a sauropod,
  measuring no more than 9.1 meters (30 ft) long. Its head was boxy and topped
  with a tall, bony arch containing the nostrils. The generic name refers to the
  nature of the skull, with large openings separated by thin, bony struts. The
  only named species is A. dongpoi, named after eleventh-century Chinese poet Su
  Shi, also known as Su Dongpo, who was born in Sichuan.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Skull height/length index of 1:1.8, producing a lower and more elongated
    skull than other camarasaurids
  - External nares larger than orbits and divided only by an extremely thin
    medial nasal crest
  - Antorbital fenestra triangular and isosceles in shape, approximately half
    the size of the orbit
  - Parietal extremely narrow with supratemporal fenestrae in relatively close
    proximity
  - Premaxillary tooth count of 5, unrecorded in any other sauropod
  - Dentary distinctly dorsoventrally constricted at its midportion between the
    anterior end and the coronoid process
