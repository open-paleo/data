        - -69.23333
    type_specimen:
      specimen_id: [MAU-Pv-EO-629]
      specimen_type: holotype
      institution: MAU
      material: "Posterior half of an articulated postcranial skeleton: anterior and
        middle caudal vertebrae, haemal arches, both pubes and ischia, the ventral
        right ilium, both hind limbs, and pedal elements."
      completeness: partial
    erected_in: bellardini2025a
