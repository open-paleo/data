genus: Astigmasaura
parent: Rebbachisauridae
etymology: "From compound Latin 'astigma' meaning 'without signs' and Ancient Greek 'saura' (feminine of sauros) meaning 'lizard'; references the type locality El Orejano, whose name refers to unmarked animals."
pronunciation:
  phonetic: ah-STIG-mah-SOR-uh
description: Astigmasaura is an extinct genus of rebbachisaurid sauropod
  dinosaurs from the Late Cretaceous Huincul Formation of Argentina. The genus
  contains a single species, Astigmasaura genuflexa, known from an incomplete
  articulated skeleton.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
appearance:
  integument: scaled
  evidence: inferred
diagnostic_features:
  - Anterior caudal centra with prominent, expanded ventrolateral margins on the
    posterior articular surfaces
  - Anterior caudal vertebrae with tall transverse processes (exceeding centrum
    height) positioned anterior to the neural spine in lateral view
  - Asymmetric middle haemal arches with a straight anterior articular surface
    longer than the posterior one
  - Pubis with an anterodorsally extended iliac peduncle, a wide elliptical
    obturator foramen (obturator-to-acetabular area ratio greater than 0.40),
    and a laminar, distally extended symphysis
  - Femur with a prominent trochanteric shelf beneath the greater trochanter on
    the posterior surface of the proximal epiphysis, forming a posterior bulge
    in proximal view
  - Pes with posteriorly expanded proximal halves of metatarsals II-IV,
    distolateral and medioproximal processes on proximal phalanges II-IV, and
    ungual phalanges bearing a longitudinal crest and fossa on the dorsal margin
    of the lateral surface
identifiers:
  - source: pbdb
    id: "515930"
  - source: wikidata
    id: Q134890097
species:
  - name: Astigmasaura genuflexa
    etymology: "From Medieval Latin, combining 'genu', meaning 'knee', and 'flecto', meaning 'to flex', translating roughly as 'kneeling', in reference to the discovery of the holotype with both hindlimbs angled backward."
    status: valid
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Cenomanian
        - Turonian
    location:
      country: AR
      locality: El Orejano
      region: AR-Q
      formation: Huincul
      coordinates:
