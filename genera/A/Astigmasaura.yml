genus: Astigmasaura
parent: Rebbachisauridae
etymology: "From compound Latin 'astigma' meaning 'without signs' and Ancient Greek 'saura' (feminine of sauros) meaning 'lizard'; references the type locality El Orejano, whose name refers to unmarked animals."
description: Astigmasaura is an extinct genus of rebbachisaurid sauropod
  dinosaurs from the Late Cretaceous Huincul Formation of Argentina. The genus
  contains a single species, Astigmasaura genuflexa, known from an incomplete
  articulated skeleton.
diet: herbivore
