genus: Akainacephalus
parent: Ankylosaurinae
pronunciation:
  phonetic: ah-KAY-nuh-SEF-uh-lus
etymology: From Greek 'akaina' meaning 'thorn' or 'spike' and 'kephale' meaning 'head'; meaning 'thorn head'
description: Akainacephalus is a monospecific genus of ankylosaurid dinosaur
  from southern Utah that lived during the Late Cretaceous (late Campanian,
  76.26 Ma) in what is now the Horse Mountain Gryposaur Quarry of the
  Kaiparowits Formation. The type and only species, Akainacephalus johnsoni, is
  known from the most complete ankylosaur specimen ever discovered from southern
  Laramidia, including a complete skull, tail club, a number of osteoderms, limb
  elements and part of its pelvis, among other remains. It was described in 2018
  by Jelle P. Wiersma and Randall B. Irmis. It is closely related and shares
  similar cranial anatomy to Nodocephalosaurus.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - wetland
appearance:
  features:
    - cranial bosses
    - snout hornlets
    - tail club
    - osteoderms
  integument: armored
diagnostic_features:
  - Massive supraorbital bosses forming a tall backswept flange extending
    laterally over the orbits and enveloping the anterodorsal and posterior
    margins of the orbit
  - Nearly vertical projecting triangular quadratojugal horns
  - Frontal bears a large, flat, centrally positioned hexagonal-shaped
    caputegulum
  - Tightly spaced, symmetrically positioned pyramidal and conical-shaped
    caputegulae across the frontonasal region
  - Distinct midline row of conical-shaped caputegulae across the nasal region,
    symmetrically separating dorsolateral caputegulae
  - Basioccipital foramen positioned anterior and dorsal to the occipital condyle
