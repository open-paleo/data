genus: Aletopelta
parent: Ankylosauridae
pronunciation:
  phonetic: a-LEE-to-PEL-tuh
  ipa: /əˌliːtoʊˈpɛltə/
etymology: From Greek 'aletes' ('wanderer') and 'pelte' ('shield'); meaning
  'wandering shield', referring to the northward wandering of the Peninsular
  Ranges Terrane that carried the specimen from opposite middle Mexico.
description: Aletopelta is a monospecific genus of basal ankylosaurid dinosaur
  from Southern California that lived during the Late Cretaceous (upper
  Campanian stage, 75.5 Ma) in what is now the Point Loma Formation. The type
  and only species, Aletopelta coombsi, is known from a partial skeleton
  preserving osteoderms. It was originally described in 1996 by W. P. Coombs,
  Jr. and T.A. Deméré before being named in 2001 by Tracy Ford and James
  Kirkland. The holotype formed a miniature reef and was scavenged upon by
  invertebrates and sharks.
diet: herbivore
locomotion: quadrupedal
diagnostic_features:
  - Teeth wider than tall (labiolingually compressed crowns broader than their
    height).
  - Femur greatly longer than tibia and fibula, yielding a tibia/femur ratio of
    0.63 to 0.67.
  - Three metatarsals in the pes.
  - Ilia covered by sutured, polygonal, low-peaked scutes arranged in a mosaic
    pattern.
  - Massive, short-pointed spike in the shoulder region with a flat
    (non-beveled) base.
  - Hollow, dorsoventrally asymmetrical triangular caudal scutes with the
    dorsal surface significantly more extensive than the ventral surface.
paleoenvironment:
  - marine
  - coastal
appearance:
  features:
    - osteoderms
    - body armor
  integument: armored
