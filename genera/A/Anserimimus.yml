genus: Anserimimus
parent: Ornithomimidae
pronunciation:
  ipa: /ˌænsərɪˈmaɪməs/
etymology: "From Latin 'anser' meaning 'goose' and Greek 'mimos' meaning 'mimic', meaning 'goose mimic'."
description: Anserimimus is a genus of ornithomimid theropod dinosaur, from the
  Late Cretaceous Period of what is now Mongolia. It was a lanky, fast-running
  animal, possibly an omnivore. From what fossils are known, it probably closely
  resembled other ornithomimids, except for its more powerful forelimbs.
diet: herbivore
locomotion: bipedal
