genus: Astrophocaudia
parent: Somphospondyli
etymology: "From Greek 'a-' meaning 'not', 'stropho-' meaning 'twisting', and 'caud-' meaning 'tail', giving 'non-twisting tail' in reference to the closely-connected hyposphene-hypantrum articulation of the caudal vertebrae; alternatively readable as 'star tail' (Greek 'astron' + 'caud'), also honoring Astrodon."
pronunciation:
  phonetic: as-TRO-fo-COH-dee-uh
description: Astrophocaudia is an extinct genus of somphospondylan sauropod
  known from the later part of the Early Cretaceous (Albian stage) of Texas,
  United States. Its remains were discovered in the Paluxy Formation. The type
  species is A. slaughteri, described in 2012.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Anterior-middle caudal vertebrae with planar hyposphene-hypantrum
    articulations set off from zygapophyses
  - Anterior-middle caudal vertebrae with prespinal lamina contacting
    intraprezygapophyseal lamina
