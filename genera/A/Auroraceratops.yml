genus: Auroraceratops
parent: Neoceratopsia
description: Auroraceratops, meaning "dawn horned face", is a genus of bipedal
  basal neoceratopsian dinosaur, from the Early Cretaceous (Aptian age) of north
  central China. The etymology of the generic name refers to its status as an
  early ceratopsian and also to Dawn Dodson, wife of Peter Dodson, one of the
  palaeontologists who described it.
diet: herbivore
locomotion: bipedal
