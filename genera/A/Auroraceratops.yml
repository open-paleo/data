genus: Auroraceratops
parent: Neoceratopsia
etymology: "From Latin aurora meaning 'dawn' and Greek keras/ceratops meaning
  'horned face'. Full meaning: 'dawn horned face', referring to its status as an
  early ceratopsian and also honoring Dawn Dodson."
pronunciation:
  phonetic: a-RAW-ruh-SEH-ruh-tops
description: Auroraceratops, meaning "dawn horned face", is a genus of bipedal
  basal neoceratopsian dinosaur, from the Early Cretaceous (Aptian age) of north
  central China. The etymology of the generic name refers to its status as an
  early ceratopsian and also to Dawn Dodson, wife of Peter Dodson, one of the
  paleontologists who described it.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Considerable breadth of the nasals
  - Fungiform expansion of the dorsal end of the lacrimal
  - Highly developed rugosity of the jugal, dentary, and surangular
  - Inflated, striated premaxillary teeth
  - Horizontal caudally directed processes of the pterygoid covering
    basisphenoid and basipterygoid articulation ventrally, terminating as a pair
    of short autapomorphic horizontal prongs
