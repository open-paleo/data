genus: Australodocus
parent: Somphospondyli
etymology: From Latin australis meaning 'southern' + Greek dokos (δοκός) meaning
  'beam'; overall meaning 'southern beam', referring to its discovery in
  southern Tanzania.
description: Australodocus is a genus of sauropod dinosaur that lived during the
  Late Jurassic period, around 150 million years ago, in what is now Lindi
  Region, Tanzania. Though initially considered a diplodocid, recent analyses
  suggest it may instead be a titanosauriform.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - coastal
diagnostic_features:
  - Cervical pleurocoel weakly developed (reduced relative to other diplodocids)
  - Ridge posterolateral to anterior condyle strongly posteroventrally inclined
    (~20 degrees from vertical)
  - Anteriorly facing triangular pneumatic cavity ventral to prezygapophysis,
    enclosed by lateral ramus of centroprezygapophyseal lamina and anteriorly
    extended prezygodiapophyseal lamina
  - Prominent prezygapophyseal process pointed, laterally keeled, and extending
    further anteriorly than the prezygapophysis itself
