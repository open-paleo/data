genus: Aucasaurus
parent: Brachyrostra
etymology: "Named after Auca Mahuevo, the fossil site in Argentina where it was
  found; 'saur' from Greek sauros meaning 'lizard'. Full meaning: 'Auca Mahuevo
  lizard'."
description: Aucasaurus is a genus of medium-sized abelisaurid theropod dinosaur
  from Argentina that lived during the Late Cretaceous (Santonian to Campanian
  stage) of the Anacleto Formation. It was smaller than the related Carnotaurus,
  although more derived in some ways, such as its extremely reduced arms and
  almost total lack of fingers.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Frontal swells instead of horns (unlike Carnotaurus which bears cranial
    horns)
  - Sigmoidal outline of the dentigerous margin of the maxilla
  - Humerus with slender, craniocaudally compressed shaft and well-defined
    condyles
  - Proximal radius lacking a hooked ulnar process
  - Chevrons with dorsally open haemal canals (opposite condition found in
    Carnotaurus and Ilokelesia)
