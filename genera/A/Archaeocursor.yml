genus: Archaeocursor
parent: Ornithischia
etymology: From Greek 'archaios' meaning 'ancient' or 'old' and Latin 'cursor' meaning 'runner'; meaning 'old runner'
pronunciation:
  phonetic: AH-kee-o-CUR-suh
description: Archaeocursor is an extinct genus of basal ornithischian dinosaurs
  from the Early Jurassic Ziliujing Formation of China. The genus contains a
  single species, A. asiaticus, known from a single femur. Archaeocursor
  represents the oldest and most basal ornithischian described from Asia.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
diagnostic_features:
  - Femoral proximal surface marked by an anterolateral-posteromedially oriented
    ridge
  - Greater trochanter expands anteroposteriorly to approximately the same width
    as the femoral head but remains shorter than the anterior trochanter
  - Anterior surface of the medial condyle is sculpted, featuring an associated
    depression on its medial surface
  - Lateral condyle occupying roughly 2/3 of the distal transverse width
appearance:
  integument: scaled
  evidence: inferred
