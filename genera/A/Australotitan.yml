genus: Australotitan
parent: Somphospondyli
pronunciation:
  ipa: /ɔːˈstreɪloʊˈtaɪtən/
description: Australotitan is an extinct genus of possibly titanosaurian
  somphospondylan dinosaurs from the Late Cretaceous Winton Formation
  (Cenomanian–Turonian) of southern-central Queensland, Australia. The genus
  contains a single species, A. cooperensis, known from multiple partial
  skeletons. The genus Australotitan may be synonymous with Diamantinasaurus, a
  contemporary relative.
diet: herbivore
