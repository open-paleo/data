genus: Australotitan
parent: Somphospondyli
pronunciation:
  ipa: /ɔːˈstreɪloʊˈtaɪtən/
etymology: "From Latin 'australis' meaning 'southern' and Greek 'titan' meaning 'giant', referring to the large size of this dinosaur from southern Australia."
description: Australotitan is an extinct genus of possibly titanosaurian
  somphospondylan dinosaurs from the Late Cretaceous Winton Formation
  (Cenomanian-Turonian) of southern-central Queensland, Australia. The genus
  contains a single species, A. cooperensis, known from multiple partial
  skeletons. The genus Australotitan may be synonymous with Diamantinasaurus, a
  contemporary relative.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Ulna with heavily reduced anterolateral and olecranon processes relative to
    much enlarged and elongate anteromedial process.
  - Ulna with a distinct radial interosseous ridge within the distal half of the
    radial fossa, and anterolateral process bearing a distal accessory
    projection proximal to a proximally beveled distal epiphysis.
  - Humerus with a rounded ridge extending from the distal end of the
    deltopectoral crest to just proximal of a tri-lobate distal epiphysis.
  - Distal ischial blades curve ventrally to produce a dorsal face that is
    posteriorly directed.
  - Femur with a medially sloped proximolateral margin, anteroposteriorly narrow
    diaphysis, and distal condyles directed anterolaterally to posteromedially.
