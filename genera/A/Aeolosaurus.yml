        - -68.6222
      locality: Emergent island in the southeast of Lago Colhué Huapi, Sarmiento
        Department
    type_specimen:
      specimen_id:
        - UNPSJB-PV 959
      specimen_type: holotype
      institution: UNPSJB
      material: 21 articulated caudal vertebrae and seven articulated haemal arches
        forming part of a tail series.
    diagnostic_features:
      - Deep, well-marked fossa between the transverse process and base of the
        neural spine in the most anterior caudal vertebrae
      - Slender infraspinoprezygapophyseal lamina connecting the base of the
        prespinal lamina to the lower edge of the prezygapophyseal articular
        facet, producing a fossa on each side of the prespinal lamina
      - Posterior articular condyle in central/median position throughout the
        caudal series (displaced dorsally in A. rionegrinus)
      - Middle-caudal prezygapophyses somewhat shorter than in A. rionegrinus
      - Postzygapophyses oriented lateroventrally with greater inclination to
        the sagittal plane (nearly parallel to it in A. rionegrinus)
    erected_in: casal2007a
