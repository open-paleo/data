genus: Aeolosaurus
parent: Aeolosaurini
etymology: This dinosaur is named after the Greek mythological figure Aeolus,
  Keeper of the Winds in Homer's Odyssey, because of the frequent winds that
  blow across Patagonia, where the remains were found. The generic name also
  includes the Greek sauros ('lizard'), the traditional suffix used in dinosaur
  names. The specific name (A. rionegrinus), refers to its location, in the Rio
  Negro Province of Argentina. Both genus and species were named and described
  by Argentine paleontologist Jaime Powell in 1987.
pronunciation:
  ipa: /ˌiːoʊloʊˈsɔːrəs/
description: Aeolosaurus is a genus of titanosaurian sauropod dinosaur from the
  Late Cretaceous Period of what is now South America. Like most sauropods, it
  would have been a quadrupedal herbivore with a long neck and tail. Aeolosaurus
  is well known for a titanosaur, as it is represented by the remains of several
  individuals belonging to at least two species. However, like most titanosaurs,
  no remains of the skull are known.
diet: herbivore
locomotion: quadrupedal
