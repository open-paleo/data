genus: Aerosteon
parent: Megaraptoridae
etymology: From Greek 'aer' meaning 'air' and 'osteon' meaning 'bone', referring to its air-filled bones.
pronunciation:
  phonetic: eh-ro-stee-on
description: Aerosteon is a genus of megaraptoran dinosaur from the Late
  Cretaceous period of Argentina. Its remains were discovered in 1996 in the
  Anacleto Formation, which is from the late Campanian. The type and only known
  species is A. riocoloradensis. Its generic name can be translated as "air
  bone" and derives from Greek ἀήρ (aer, "air") and ὀστέον (osteon, "bone"),
  whereas its specific name indicates that its remains were found 1 km (0.6
  miles) north of the Río Colorado, in Mendoza Province, Argentina. The genus
  shows evidence of a bird-like respiratory system.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Prefrontal with a very short ventral process along the orbital margin.
  - Enlarged quadrate foramen located entirely within the quadrate shaft, not
    shared with the quadratojugal.
  - Large tympanic diverticulum (pneumatocoel) extending deep into the quadrate
    shaft above the articular condyle.
  - Furcula with a median pneumatocoel opening as a slit-shaped pneumatopore on
    the posterior surface.
  - Medial gastral elements coossified with anterior and posterior flanges in
    the midline.
  - Posteriormost dorsal vertebra with a pneumatic canal running within the
    transverse process and an anterodorsally inclined neural spine.
