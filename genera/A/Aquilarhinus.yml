genus: Aquilarhinus
parent: Hadrosauridae
etymology: From Latin 'aquila' meaning 'eagle' and Greek 'rhinos' meaning 'snout' or 'nose'; meaning 'eagle snout', after the unusual beak morphology
pronunciation:
  phonetic: AH-kwih-luh-RYE-nus
description: Aquilarhinus is a genus of hadrosaurid ornithopod dinosaur from the
  Aguja Formation from Texas in the United States. The type and only species is
  Aquilarhinus palimentus. Due to its unusual dentary, it has been inferred to
  have had shovel-like beak morphology, different from the beaks of other
  hadrosaurs. It was originally classified as a Kritosaurus sp. before being
  reclassified as a new genus in 2019.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Nasals transversely broad across skull table, forming an extremely broad and
    subcircular lateral profile of the external bony naris.
  - Premaxillary shelf of maxilla at anterior apex flat and as broad as the
    proximal segment of the palatal process.
  - Palatine extending nearly horizontally to contact the maxilla, rather than
    subvertically as in other hadrosaurids.
  - Symphysial process of dentary dorsally reflected, causing paired dentaries
    to meet in a W-shaped anterior profile rather than the typical U-shape.
  - Maxilla with jugal process and ectopterygoid ridge continuous with ventral
    margin of jugal facet (unique combination among hadrosaurids).
appearance:
