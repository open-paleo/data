genus: Aquilarhinus
parent: Hadrosauridae
etymology: eagle snout
description: Aquilarhinus is a genus of hadrosaurid ornithopod dinosaur from the
  Aguja Formation from Texas in the United States. The type and only species is
  Aquilarhinus palimentus. Due to its unusual dentary, it has been inferred to
  have had shovel-like beak morphology, different from the beaks of other
  hadrosaurs. It was originally classified as a Kritosaurus sp. before being
  reclassified as a new genus in 2019.
diet: herbivore
