genus: Augustynolophus
parent: Saurolophini
etymology: Named after the Augustyn family (donors to the Los Angeles County Museum) combined with Greek lophos meaning 'crest', a reference to its relative Saurolophus.
pronunciation:
  phonetic: OHR-gus-TEE-no-LO-fus
description: Augustynolophus is an extinct genus of herbivorous saurolophine
  hadrosaur dinosaur which was discovered in the Moreno Formation in California,
  dating to the late Maastrichtian age, making it one of the last non-avian
  dinosaurs known from the fossil record before the Cretaceous-Paleogene
  extinction event.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - marine
diagnostic_features:
  - Base of frontal caudodorsal process crescentic, both left and right
    processes forming a U-shape in dorsal view
  - Base of frontal caudodorsal process extending caudolaterally caudal to
    rostral end of frontal dome
  - Solid nasal crest projecting caudodorsally above skull roof with elongate
    triangular distal region ending in knob-like process gently but abruptly
    inflected rostrally
  - Circumnarial depression lightly incised and weakly emarginated, occupying
    two-thirds of width of lateral surface of distal region of crest
  - Caudal surface of distal nasal crest subrectangular
