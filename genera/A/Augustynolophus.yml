genus: Augustynolophus
parent: Saurolophini
description: Augustynolophus is an extinct genus of herbivorous saurolophine
  hadrosaur dinosaur which was discovered in the Moreno Formation in California,
  dating to the late Maastrichtian age, making it one of the last non-avian
  dinosaurs known from the fossil record before the Cretaceous–Paleogene
  extinction event.
diet: herbivore
