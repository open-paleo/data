genus: Alvarezsaurus
parent: Alvarezsauridae
pronunciation:
  ipa: /ˌælvərɛzˈsɔːrəs/
etymology: "Named for Argentine historian Don Gregorio Alvarez, combined with Greek 'sauros' meaning 'lizard', meaning 'Don Gregorio Alvarez's lizard'."
description: Alvarezsaurus is a genus of alvarezsaurid dinosaur from the Late
  Cretaceous, living in Argentina approximately 86 - 83 million years ago. It
  was a small dinosaur, measuring 1–1.4 m (3.3–4.6 ft) long and weighing
  approximately 3 kg (6.6 lb). It was found in the Bajo de la Carpa Formation
  and was named by paleontologist José Bonaparte in 1991 after the historian Don
  Gregorio Alvarez. The type species is A. calvoi.
diet: carnivore
locomotion: bipedal
