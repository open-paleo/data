genus: Albertavenator
parent: Troodontinae
dispute:
  summary: >
    Albertavenator curriei, based on frontal material once attributed to Troodon,
    is recovered as a derived troodontine; Rivera-Sylva et al. (2026) place it in
    their new tribe Troodontini (with Xenovenator), which is not adopted here as a
    node. It is placed in Troodontinae.
  history:
    - date: "2026-07-01"
      note: Moved from Troodontini (tribe dropped) to Troodontinae following Evans and Williamson (2017) and Rivera-Sylva et al. (2026).
etymology: Named after Alberta, Canada, combined with Latin 'venator' meaning 'hunter'; meaning 'Alberta hunter'
pronunciation:
  phonetic: al-BURR-tuh-vuh-NAY-tuhr
description: Albertavenator is a genus of small-bodied troodontid theropod
  dinosaur that lived during the early Maastrichtian stage of the Late
  Cretaceous period, approximately 71 million years ago. It is known from the
  Horseshoe Canyon Formation in Alberta, Canada, and is currently represented by
  a single species, Albertavenator curriei. The species name honors Canadian
  paleontologist Philip J. Currie for his extensive contributions to theropod
  research. The animal is known from parts of the skull.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Primary supraciliary foramen truncated anteriorly by the lacrimal contact,
    unlike all other troodontids where it is completely enclosed by the frontal
  - Superficial (ectocranial) surface of the frontal proportionally shorter than
    all known troodontids, with a length to width ratio less than 1.3
  - Frontoparietal contact bearing an enlarged lappet of the frontal extending
    medially to extensively overlap the lateral region of the interfrontal
    (anterior) process of the parietal
