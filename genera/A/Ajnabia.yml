genus: Ajnabia
parent: Arenysaurini
etymology: From Arabic 'ajnabia' meaning 'stranger' or 'foreigner', reflecting the unexpected presence of hadrosaurs in Africa
description: Ajnabia is a genus of lambeosaurine hadrosaur from the Late
  Cretaceous (Maastrichtian) of Morocco. It is the first definitive hadrosaur
  from Africa and is thought to be related to European hadrosaurs like
  Adynomosaurus and Pararhabdodon. The discovery of Ajnabia came as a surprise
  to the paleontologists who found it because Africa was isolated by water from
  the rest of the world during the Cretaceous, such that hadrosaurs were assumed
  to have been unable to reach the continent.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - marine
diagnostic_features:
  - Maxillary neurovascular foramina with a hypertrophied foramen below the
    jugal articulation and a smaller accessory foramen below that
  - Ectopterygoid ridge ventrally positioned on maxilla, weakly inclined
    relative to the dentigerous process, developed as a massive, dorsoventrally
    thick, rounded, lip-like structure
  - Ectopterygoid ridge reduced anteriorly, failing to contact the jugal
    articulation
  - Maxillary tooth crowns with tips curled medially, median ridge offset
    posteriorly, accessory ridges absent, denticles highly reduced
  - Strong downturn of the premaxillary process of the maxilla
