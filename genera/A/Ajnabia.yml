genus: Ajnabia
parent: Arenysaurini
etymology: stranger
description: Ajnabia is a genus of lambeosaurine hadrosaur from the Late
  Cretaceous (Maastrichtian) of Morocco. It is the first definitive hadrosaur
  from Africa and is thought to be related to European hadrosaurs like
  Adynomosaurus and Pararhabdodon. The discovery of Ajnabia came as a surprise
  to the paleontologists who found it because Africa was isolated by water from
  the rest of the world during the Cretaceous, such that hadrosaurs were assumed
  to have been unable to reach the continent.
diet: herbivore
locomotion: facultative
