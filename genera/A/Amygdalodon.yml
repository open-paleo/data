genus: Amygdalodon
parent: Sauropoda
placement: incertae sedis
dispute:
  summary: >
    Amygdalodon is a fragmentary early sauropod whose position is labile.
    Pol and Gomez (2022) recover it near the base of Sauropoda in a polytomy
    with Gongxianosaurus, outside Eusauropoda, and Jones (2026) likewise
    places it near the base of Sauropoda without assigning it to
    Gravisauria; older treatments regarded it as a basal eusauropod or
    cetiosaurid.
  history:
    - date: "2026-06-29"
      note: >
        Moved from Gravisauria to Sauropoda incertae sedis following Pol and
        Gomez (2022) and Jones (2026); its membership in Gravisauria and
        Eusauropoda is unresolved.
pronunciation:
  phonetic: am-ig-DAL-o-don
  ipa: /əmɪɡˈdælədɒn/
etymology: "From Greek 'amygdale' meaning 'almond' and 'odon' meaning 'tooth',
  meaning 'almond tooth', referring to the almond-shaped teeth."
description: Amygdalodon is an extinct genus of basal sauropod from the Early
  Jurassic of Argentina. The type species is Amygdalodon patagonicus. Fossils of
  Amygdalodon have been found in the Toarcian-aged Cerro Carnerero Formation
  (about 180-172 million years ago). Very little is known about it, but it is
  one of the few Jurassic dinosaurs from South America found thus far.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
appearance:
  integument: scaled
  evidence: inferred
diagnostic_features:
  - Lateral walls of the neural canal and the centropostzygapophyseal laminae
    flared laterally toward the posterior
  - Neural canal strongly flexed anteroposteriorly within the dorsal neural
    arches
