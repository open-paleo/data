genus: Amygdalodon
parent: Sauropoda
placement: incertae sedis
dispute:
  summary: >
    Amygdalodon is a fragmentary early sauropod whose position is labile.
    Pol and Gomez (2022) recover it near the base of Gravisauria, in a
    polytomy with Gongxianosaurus outside Eusauropoda, whereas Rauhut (2003)
    regarded it as a very basal eusauropod and earlier authors as a
    cetiosaurid.
pronunciation:
  phonetic: am-ig-DAL-o-don
  ipa: /əmɪɡˈdælədɒn/
etymology: "From Greek 'amygdale' meaning 'almond' and 'odon' meaning 'tooth',
  meaning 'almond tooth', referring to the almond-shaped teeth."
description: Amygdalodon is an extinct genus of basal sauropod from the Early
  Jurassic of Argentina. The type species is Amygdalodon patagonicus. Fossils of
  Amygdalodon have been found in the Cerro Carnerero Member of the Lonco Trapial
  Formation. Very little is known about it, but it is one of the few Jurassic
  dinosaurs from South America found thus far.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
appearance:
  integument: scaled
  evidence: inferred
diagnostic_features:
  - Lateral walls of the neural canal and the centropostzygapophyseal laminae
    flared laterally toward the posterior
  - Neural canal strongly flexed anteroposteriorly within the dorsal neural
    arches
identifiers:
  - source: pbdb
    id: "38655"
  - source: wikidata
    id: Q133524
  - source: gbif
    id: "4822750"
species:
  - name: Amygdalodon patagonicus
    etymology: "Named for Patagonia, the region of Argentina where the fossils were
      discovered in the Cerro Carnerero Member."
    status: valid
    type_species: true
    period:
      name:
        - Early Jurassic
      stage:
        - Pliensbachian
        - Toarcian
    location:
      country: AR
      locality: Eastern slope of the Pampa de Agnía range
      region: AR-U
      formation: Lonco Trapial
      member: Cerro Carnerero
      notes: >
        Described from the "Cerro Carnerero Formation", which Nullo and
        Proserpio (1975) made a member of the Lonco Trapial Formation. Pol and
        colleagues (2022) conclude it "was deposited at some point during the
        Pliensbachian or the early Toarcian".
    size:
      length_m:
        min: 15.0
        max: 15.0
      weight_kg:
        min: 5000
        max: 5000
    type_specimen:
      specimen_id: [ MLP 46-VIII-21-1/2 ]
      specimen_type: lectotype
      institution: MLP
      material: Posterior dorsal vertebra.
      completeness: fragmentary
    erected_in: cabrera1947a
    described_in: rauhut2003c
references:
