  - id: rauhut2003c
    notes: Revision of Amygdalodon; designated the lectotype MLP 46-VIII-21-1/2.
  - id: pol2022a
    notes: Recovered Amygdalodon near the base of Sauropoda in a polytomy with Gongxianosaurus outside Eusauropoda
  - id: jones2026b
    notes: Places Amygdalodon near the base of Sauropoda.
  - id: nullo1975a
    notes: Reduces the Cerro Carnerero Formation to a member of the Lonco Trapial Formation.
