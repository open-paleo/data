genus: Anchiornis
parent: Troodontidae
etymology: From Greek 'anchi' meaning 'near' and 'ornis' meaning 'bird', meaning 'near bird', reflecting its close morphological similarity to modern birds.
description: Anchiornis is a genus of small, four-winged paravian dinosaurs, with
  only one known species, the type species Anchiornis huxleyi, named for its
  similarity to modern birds. Anchiornis fossils have been found only in the
  Tiaojishan Formation of Liaoning, China, in rocks dated to the Late Jurassic,
  about 160 million years ago. It is known from hundreds of specimens, and given
  the exquisite preservation of some of these fossils, it became the first Mesozoic
  dinosaur species for which almost the entire life appearance could be determined,
  and an important source of information on the early evolution of birds.
diet: carnivore
locomotion: bipedal
