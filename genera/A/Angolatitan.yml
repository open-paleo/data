genus: Angolatitan
parent: Somphospondyli
etymology: Named after Angola where the fossils were found, combined with Latin/Greek 'titan' meaning 'giant'; meaning 'Angolan giant'
pronunciation:
  phonetic: an-GO-luh-TIE-tan
description: Angolatitan is a genus of titanosauriform sauropod dinosaur from
  the Upper Cretaceous. It is also the first non-avian dinosaur discovered in
  Angola. The genus contains a single species, Angolatitan adamastor, known from
  a partial right forelimb. Angolatitan was a relict form of its time; it was a
  Late Cretaceous basal titanosauriform, when more derived titanosaurs were far
  more common.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - coastal
diagnostic_features:
  - Posteroventral eminence in scapula in the proximal one-quarter, anterior to
    the acromial ridge
  - Acute medioproximal margin of humerus due to a triangular lateral projection
  - Rectangular lateral corner of proximal humerus
  - Proximal outline of the ulna with expanded anteromedial ridge (process)
    constricted at base, nearly twice the length of the lateral process
  - Posterior facet of the distal epiphysis of metacarpal I with two small
    splint-like projections
