genus: Angolatitan
parent: Somphospondyli
etymology: Named after Angola where the fossils were found, combined with Latin/Greek 'titan' meaning 'giant'; meaning 'Angolan giant'
description: Angolatitan is a genus of titanosauriform sauropod dinosaur from
  the Upper Cretaceous. It is also the first non-avian dinosaur discovered in
  Angola. The genus contains a single species, Angolatitan adamastor, known from
  a partial right forelimb. Angolatitan was a relict form of its time; it was a
  Late Cretaceous basal titanosauriform, when more derived titanosaurs were far
  more common.
diet: herbivore
locomotion: quadrupedal
