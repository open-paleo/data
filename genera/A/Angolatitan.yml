genus: Angolatitan
parent: Somphospondyli
etymology: Named after Angola where the fossils were found, combined with Latin/Greek 'titan' meaning 'giant'; meaning 'Angolan giant'
pronunciation:
  phonetic: an-GO-luh-TIE-tan
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - coastal
diagnostic_features:
  - Posteroventral eminence in scapula in the proximal one-quarter, anterior to
    the acromial ridge
  - Acute medioproximal margin of humerus due to a triangular lateral projection
  - Rectangular lateral corner of proximal humerus
  - Proximal outline of the ulna with expanded anteromedial ridge (process)
    constricted at base, nearly twice the length of the lateral process
  - Posterior facet of the distal epiphysis of metacarpal I with two small
    splint-like projections
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "180383"
  - source: wikidata
    id: Q1287938
  - source: gbif
    id: "8665464"
species:
  - name: Angolatitan adamastor
    etymology: Named for Adamastor, a mythological giant of the South Atlantic
      sea who was feared by Portuguese sailors.
    status: valid
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Coniacian
      resolution: horizon
    location:
      country: AO
      region: AO-BGO
      locality: Tadi
      formation: Itombe
      bed: Tadi
      notes: Mateus and colleagues (2011) give the horizon as the late Turonian
        Tadi Beds of the Itombe Formation; Mateus and colleagues (2019) date the
        Iembe locality Coniacian on an ammonite, naming neither the bed nor the
        formation, so the Coniacian falls outside the beds' own dating.
    type_specimen:
      specimen_id: [MGUAN-PA-003]
      specimen_type: holotype
      institution: MGUAN
      material: "Partial right forelimb: scapula, humerus, ulna, radius, and
        metacarpals I, III, and IV"
      completeness: fragmentary
    size:
      length_m:
        min: 13
        max: 13
      weight_kg:
        min: 6000
        max: 6000
      hip_height_m:
        min: 2.5
        max: 2.5
    erected_in: mateus2011a
references:
  - id: mateus2011a
  - id: jones2026b
    notes: Source of the body length, mass, and hip height estimates.
  - id: mateus2019a
    notes: Reports the Iembe locality as Coniacian after the discovery of the
      ammonite Protexanites there.
