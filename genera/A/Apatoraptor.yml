genus: Apatoraptor
parent: Caenagnathidae
etymology: From Greek 'apate' meaning 'deception' and Latin 'raptor' meaning 'thief'; meaning 'deceptive thief'
pronunciation:
  phonetic: ah-PAY-toh-RAP-tuhr
description: Apatoraptor is a genus of caenagnathid dinosaur which contains a
  single species, A. pennatus. The only known specimen was discovered in the
  Campanian-aged Horseshoe Canyon Formation of Alberta.
diet: omnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Ventral flange of angular underlying the posteroventral ramus of the dentary
  - Anterior constriction of external mandibular fenestra by posteroventral
    ramus of the dentary
  - Medial fossa anterior to articular region of mandible
  - Articular region of mandible with low articular ridge offset from dorsal
    margin of articular-surangular-coronoid complex
  - Metacarpal I less than half as long as metacarpal II
  - Manual phalanx I-1 longest phalanx of hand; manual phalanx II-1 longer than
    II-2
appearance:
  features:
    - keratinous beak
    - quill knobs
  integument: feathered
  evidence: direct
