genus: Adratiklit
parent: Stegosauria
etymology: From Berber/Amazigh 'adrar' meaning 'mountain' and 'tiklit' meaning 'lizard'; meaning 'mountain lizard'
description: Adratiklit is an extinct genus of stegosaurian dinosaur that lived
  on the supercontinent Gondwana during the Middle Jurassic (Bathonian age). The
  genus contains a single species, Adratiklit boulahfa. Its remains were found
  in the El Mers III Formation, near Boulemane in north Morocco.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Small, triangular, rugose protuberance situated dorsally on the
    prezygapophysis posterior to the articular facet of dorsal vertebrae
  - Anterior centroparapophyseal laminae drawn into anteriorly-projecting
    rugosities either side of the neural canal in dorsal vertebrae
