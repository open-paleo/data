genus: Asiaceratops
parent: Neoceratopsia
pronunciation:
  phonetic: AY-zha-SER-a-tops
etymology: From Asia (the continent where the genus was found) + Greek keras
  (κέρας) meaning 'horn' + ops (ὤψ) meaning 'face'; overall meaning 'Asian
  horned face'.
description: Asiaceratops is a genus of small herbivorous ceratopsian dinosaur
  from Uzbekistan. Nessov and colleagues (1989) also tentatively referred
  Microceratops sulcidens Bohlin, 1953, from China, to the genus.
dispute:
  summary: >
    Sereno (2000) regards Asiaceratops salsopaludalis as a nomen dubium,
    finding no autapomorphies in the holotype maxilla or the referred
    material. Makovicky and Norell (2006), Morschhauser and colleagues (2018)
    and Son and colleagues (2022) include it in phylogenetic analyses
    provisionally, assuming that all the referred material belongs to one
    taxon. Those analyses place it either as the earliest-diverging
    leptoceratopsid (Makovicky and Norell, 2006; Farke and colleagues, 2014;
    He and colleagues, 2015; Arbour and Evans, 2019) or among basal
    neoceratopsians outside Leptoceratopsidae (Chinnery, 2004; Morschhauser
    and colleagues, 2018; Son and colleagues, 2022).
  history:
    - date: "2026-06-27"
      note: Placed at Neoceratopsia (basal); nomen dubium.
    - date: "2026-10-09"
      note: Status confirmed disputed; Sereno (2000) calls it a nomen dubium, while later analyses include it provisionally on its referred material.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
appearance:
  integument: scaled
  evidence: inferred
