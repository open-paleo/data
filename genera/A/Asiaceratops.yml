references:
  - id: nessov1989a
  - id: jones2026a
    notes: Source of the body length estimate.
  - id: sereno2000a
    notes: Finds no autapomorphies in the holotype maxilla or referred material
      and regards Asiaceratops as a nomen dubium.
  - id: bohlin1953a
    notes: Names Microceratops sulcidens on teeth from Chia-yü-kuan, Kansu.
  - id: chinnery2004a
    notes: Recovers Asiaceratops with Chaoyangsaurus within Neoceratopsia,
      outside Leptoceratopsidae.
  - id: makovicky2006a
    notes: Includes it provisionally, assuming the referred material belongs to
      one taxon; recovers it as the sister of the other leptoceratopsids.
  - id: farke2014a
    notes: Recovers it as the earliest-diverging leptoceratopsid.
  - id: he2015a
    notes: Recovers it as the earliest-diverging leptoceratopsid.
  - id: morschhauser2018a
    notes: Includes it provisionally and recovers it in a pectinate series of
      basal neoceratopsians, not as a leptoceratopsid.
  - id: arbour2019a
    notes: Recovers it as the earliest-diverging leptoceratopsid; with the
      Morschhauser matrix, it falls in a neoceratopsian polytomy.
  - id: son2022a
    notes: Recovers it among basal neoceratopsians, more derived than
      Liaoceratops and more basal than Archaeoceratops.
