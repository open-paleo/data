genus: Asiaceratops
parent: Neoceratopsia
pronunciation:
  phonetic: AY-zha-SER-a-tops
etymology: From Asia (the continent where the genus was found) + Greek keras
  (κέρας) meaning 'horn' + ops (ὤψ) meaning 'face'; overall meaning 'Asian
  horned face'.
description: Asiaceratops is a genus of herbivorous ceratopsian dinosaur. It
  lived during the Early-Late Cretaceous. The type species, A. salsopaludalis is
  known from Uzbekistan, while A. sulcidens is known from China and Mongolia.
dispute:
  summary: >
    Asiaceratops salsopaludalis is based on fragmentary material and is
    often regarded as a nomen dubium, though several analyses include it
    as a basal neoceratopsian.
  history:
    - date: "2026-06-27"
      note: Placed at Neoceratopsia (basal); nomen dubium.
