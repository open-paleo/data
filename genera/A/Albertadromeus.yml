genus: Albertadromeus
parent: Orodrominae
etymology: Named after Alberta, Canada, combined with Greek 'dromeus' meaning 'runner'; meaning 'runner from Alberta'
description: Albertadromeus is an extinct genus of orodromine thescelosaurid
  dinosaur known from the upper part of the Late Cretaceous Oldman Formation
  (middle Campanian stage) of Alberta, Canada. It contains a single species,
  Albertadromeus syntarsus.
diet: herbivore
