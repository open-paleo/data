genus: Albertadromeus
parent: Orodrominae
etymology: Named after Alberta, Canada, combined with Greek 'dromeus' meaning 'runner'; meaning 'runner from Alberta'
pronunciation:
  phonetic: al-BUHR-tuh-DRO-mee-us
description: Albertadromeus is an extinct genus of orodromine thescelosaurid
  dinosaur known from the upper part of the Late Cretaceous Oldman Formation
  (middle Campanian stage) of Alberta, Canada. It contains a single species,
  Albertadromeus syntarsus.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Distal fibula reduced to a thin sheet of bone fused to the anterior surface
    of the tibia for the distal one-third of its length
  - Prominent cnemial crest that projects dorsally (in addition to
    anterolaterally), resulting in a posteriorly sloped dorsal extremity of the
    proximal tibia
  - Lateral condyle of proximal tibia strongly bilobed and prominent
  - Tibia and femur characterized by dense cortical bone with reduced cancellous
    bone, giving a hollow cross-section similar to theropods
