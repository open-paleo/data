genus: Abdarainurus
parent: Somphospondyli
placement: incertae sedis
etymology: Named after Abdrant Nuru, the holotype locality in Mongolia, combined with Latin 'urus' meaning 'tail'
pronunciation:
  phonetic: ab-duh-RAY-noo-rus
description: Abdarainurus is a genus of titanosaur dinosaur from the Alagteeg
  Formation in Mongolia. The type and only species is A. barsboldi. Currently
  seen as an indeterminate titanosaur, it may represent a previously unknown
  lineage of Asian macronarians. Abdarainurus is not known from many remains; it
  is only known from eight front tail vertebrae and a middle tail vertebra and
  several chevrons.
dispute:
  summary: >
    Placed at Somphospondyli incertae sedis. Abdarainurus is known only from
    highly unusual caudal vertebrae, including opisthocoelous anterior and middle
    caudals otherwise seen in Opisthocoelicaudia, and was erected as Titanosauria
    incertae sedis (Averianov and Lopatin, 2020). Their preferred (implied
    weighting) analysis recovers a basal titanosaur, as does the most recent
    dedicated analysis (Han et al., 2024, which recovers it as sister to
    Gandititan), but the equal-weighting strict consensus of the erecting paper
    allows a non-titanosaurian somphospondylan position. Somphospondyli is the
    least-inclusive clade all these hypotheses accept.
  history:
    - date: "2026-06-30"
      note: >
        Placed at Titanosauria incertae sedis per Averianov and Lopatin (2020); a
        non-titanosaurian somphospondylan position is noted as possible.
    - date: "2026-07-09"
      note: >
        Broadened to Somphospondyli incertae sedis: although the describers'
        preferred result and Han et al. (2024) both recover a basal titanosaur,
        the equal-weighting analysis of the erecting paper recovers a
        non-titanosaurian somphospondylan, so the conservative shared node is
        adopted.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Anterior and middle caudal centra opisthocoelous (convex anterior, concave
    posterior articular surfaces)
  - Longitudinal ridges on the medial walls of the neural canal in anterior
    caudal vertebrae, not previously reported in any sauropod
  - "Postprezygapophyseal process: a distinct spine-like process on the medial
    side of the prezygapophysis posterior to the articular surface, unique among
    sauropods"
  - Postspinal fossa of anterior caudals hypertrophied and funnel-like, with
    very high spinopostzygapophyseal laminae
  - Neural spine of anterior caudals mediolaterally constricted, narrower than
    the pre- and postspinal laminae
  - Spinodiapophyseal fossa at the base of the anterior caudal neural spine
    partially covered laterally by a high postzygodiapophyseal lamina, forming a
    deep pocket
