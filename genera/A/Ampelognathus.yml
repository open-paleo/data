genus: Ampelognathus
parent: Ornithopoda
placement: incertae sedis
etymology: From Greek 'ampelos' meaning 'grapevine' and 'gnathos' meaning 'jaw'; meaning 'grapevine jaw', named in reference to Grapevine Lake where the holotype was found
pronunciation:
  phonetic: am-pell-o-nath-us
description: Ampelognathus is an extinct genus of possibly rhabdodontomorph
  ornithopod dinosaurs from the Late Cretaceous (Cenomanian) Lewisville
  Formation of Texas. The type species is Ampelognathus coheni.
dispute:
  summary: >
    Ampelognathus coheni was described as a non-iguanodontian ornithopod,
    the sister of Thescelosaurus plus Iguanodontia, a position its
    describers found weakly supported (Tykoski and colleagues, 2023).
    Czepiński and Madzia (2025) instead recover it in a basal polytomy
    within Rhabdodontomorpha under implied weighting, its precise placement
    uncertain.
  history:
    - date: "2026-06-29"
      note: Placed at Rhabdodontomorpha following Czepiński and Madzia
        (2025); the basal-ornithopod alternative reflected, not adopted.
    - date: "2026-10-20"
      note: >
        Parent widened to Ornithopoda; its describers place it outside
        Iguanodontia and Czepiński and Madzia (2025) within
        Rhabdodontomorpha.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Approximately 45° counter-clockwise torsion of middle and posterior dentary
    sections relative to anterior part, resulting in dorsomedial orientation of
    posterior alveoli axes (autapomorphy)
  - No diastema between predentary contact and first dentary alveolus
  - Coronoid process low, so dentary height at process is less than 150%
    mandibular height under mid-part of tooth row
  - 16 Dentary tooth positions, representing a relatively high tooth count for
    the size of the dentary
appearance:
  integument: feathered
  evidence: direct
identifiers:
  - source: pbdb
    id: "477670"
  - source: wikidata
    id: Q123035115
species:
  - name: Ampelognathus coheni
    etymology: "Named for Murray Cohen, the discoverer of the holotype specimen."
    status: valid
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Cenomanian
    location:
      country: US
      locality: Grapevine Lake emergency spillway
      region: US-TX
      formation: Lewisville
    size:
      length_m:
        min: 1.25
        max: 1.25
      weight_kg:
        min: 7
        max: 7
      hip_height_m:
        min: 0.35
        max: 0.35
    erected_in: tykoski2023a
    type_specimen:
      specimen_id: [DMNH 2021-05-02]
      specimen_type: holotype
