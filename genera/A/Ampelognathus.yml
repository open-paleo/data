      material: Single, nearly-complete left dentary
      completeness: fragmentary
references:
  - id: tykoski2023a
    notes: Named Ampelognathus and recovered it as the sister of Thescelosaurus
      plus Iguanodontia, with low support.
  - id: jones2026a
    notes: Source of the body length, mass, and hip height estimates.
  - id: czepiński2025a
    notes: Recovered Ampelognathus in a basal polytomy within Rhabdodontomorpha
      under implied weighting.
