genus: Ampelognathus
parent: Rhabdodontomorpha
etymology: From Greek 'ampelos' meaning 'grapevine' and 'gnathos' meaning 'jaw'; meaning 'grapevine jaw', named in reference to Grapevine Lake where the holotype was found
description: Ampelognathus is an extinct genus of possibly rhabdodontomorph
  ornithopod dinosaurs from the Late Cretaceous (Cenomanian) Lewisville
  Formation of Texas. The type species is Ampelognathus coheni.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Approximately 45° counter-clockwise torsion of middle and posterior dentary
    sections relative to anterior part, resulting in dorsomedial orientation of
    posterior alveoli axes (autapomorphy)
  - No diastema between predentary contact and first dentary alveolus
  - Coronoid process low, so dentary height at process is less than 150%
    mandibular height under mid-part of tooth row
  - 16 Dentary tooth positions, representing a relatively high tooth count for
    the size of the dentary
