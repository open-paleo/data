genus: Alpkarakush
parent: Metriacanthosauridae
etymology: "Named for Alpkarakush, a mythical powerful bird from the Kyrgyz Epic of Manas. The species name honors the Kyrgyz Republic where the specimen was discovered."
description: Alpkarakush is an extinct genus of metriacanthosaurid theropod
  dinosaurs from the Jurassic Balabansai Formation of Kyrgyzstan. The genus
  contains a single species, A. kyrgyzicus, known from a partial skeleton.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Posterior dorsal vertebrae with a channel leading from the
    centroprezygodiapophyseal fossa posteromedially into pneumatic chambers in
    the neural arch
  - Manual phalanx II-1 with a ventral sulcus proximally almost completely
    enclosed by medial and lateral ventral flanges
  - Dorsal margin of the ilium slopes steeply posteroventrally
  - Narrow and deep intercondylar groove on the anterior side of the distal femur
  - Robust and well-developed medial epicondylar crest on distal femur,
    considerably offset proximally from the distal end
