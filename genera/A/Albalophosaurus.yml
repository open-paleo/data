genus: Albalophosaurus
parent: Ceratopsia
etymology: From Latin 'albus' meaning 'white' and Greek 'lophos' meaning 'crest' and 'sauros' meaning 'lizard', referring to the snow-covered crest of Mount Hakusan near where it was found.
description: Albalophosaurus is a genus of marginocephalian ornithischian
  dinosaur that lived in Japan during the Early Cretaceous. The type species is
  Albalophosaurus yamaguchiorum.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - wetland
diagnostic_features:
  - Lateral surface of the maxilla lacks a buccal emargination (buccal ridge and
    buccal emargination absent), in contrast to the majority of other
    ornithischians.
  - Exceptionally deep, well-defined cheek recess (buccal emargination) present
    on the lateral surface of the dentary, bounded laterally by a thick,
    prominent ridge.
  - Labial surfaces of the maxillary tooth crowns ornamented with 10-12 fine
    apicobasally extending striations not present in other basal ornithischians.
  - Maxillary tooth crowns bear a strong primary ridge offset distally and
    prominent secondary ridges along mesial and distal margins, with areas
    between ridges gently concave.
  - Dentary tooth crowns bear a primary ridge situated near the center that
    splits into several branches apically, each supporting a marginal denticle;
    numerous secondary ridges cover the remaining crown surface.
