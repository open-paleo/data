genus: Aublysodon
parent: Tyrannosauridae
placement: incertae sedis
etymology: Commonly rendered 'backward-flowing tooth'; Leidy gave no explanation
  of the name when he proposed it.
description: Aublysodon is a dubious genus of carnivorous dinosaurs known only
  from the Judith River Formation in Montana, which has been dated to the late
  Campanian age of the late Cretaceous period (about 75 million years ago).
diet: carnivore
identifiers:
  - source: pbdb
    id: "38614"
  - source: wikidata
    id: Q132625
  - source: gbif
    id: "4821751"
species:
  - name: Aublysodon mirandus
    status: nomen dubium
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Campanian
    location:
      country: US
      region: US-MT
      locality: Judith River badlands
      formation: Judith River
    type_specimen:
      specimen_id:
        - ANSP 9535
      specimen_type: lectotype
      institution: ANSP
      material: Single premaxillary tooth with a chisel-shaped crown covered by
        a thin coat of enamel, without crenulations, the posterior ridge
        grooved and the apex worn anteriorly.
      completeness: fragmentary
      notes: Leidy (1868) founded the species on parts of three teeth from the
        Judith River material he had earlier placed in Deinodon. Marsh (1892)
        restricted it to the single tooth figured in Leidy's figures 41 to 45,
        leaving the other two with Deinodon horridus and so separating the two
        genera. Holtz (1994) gives the restricted type as ANSP 9535.
    erected_in: leidy1868b
references:
  - id: leidy1868b
    notes: Erects the genus and species on parts of three Judith River teeth
      that the author had previously referred to Deinodon.
  - id: marsh1892b
    notes: Restricts the type of the species to a single tooth, separating it
      from Deinodon horridus, and doubts that some of the teeth are dinosaurian
      at all.
  - id: hay1899a
    notes: Shows that Deinodon was never preoccupied by the snake genus Dinodon,
      correcting the error on which the substitution of Aublysodon rested.
  - id: holtz1994a
    notes: Gives the restricted type of the species as ANSP 9535 and tabulates
      the formations to which material has been referred.
  - id: leidy1856b
    notes: Names Deinodon horridus on the Judith River teeth from which the type
      of Aublysodon mirandus was later separated.
  - id: weishampel2004a
    notes: Lists the genus and its species among tyrannosaurid nomina dubia, and
      questions whether unserrated teeth of this form are diagnostic at all.
  - id: carr2005a
    notes: States that the authors consider the genus an invalid taxon.
  - id: carr2010a
    notes: Records that the referral of OMNH 10131 to Aublysodon cf. A. mirandus
      was later falsified.
  - id: jones2026c
    notes: Treats the genus as a dubious tooth taxon and reports the competing
      referrals to Daspletosaurus and Deinodon.
  - id: olshevsky1991a
    notes: Records the species referred to the genus and the derivation of its
      type from the Deinodon material.
