genus: Adelolophus
parent: Lambeosaurinae
etymology: From Greek 'adelos' meaning 'unknown' or 'obscure' and 'lophos' meaning 'crest'; meaning 'unknown crest'
description: Adelolophus is a genus of lambeosaurine dinosaur (a crested
  "duck-bill") from Upper Cretaceous rocks in the U.S. state of Utah. The type
  and only known species is A. hutchisoni; the type specimen consists only of a
  broken maxilla. It constitutes the oldest known lambeosaur remains from North
  America, as well as the only known lambeosaur species from the Wahweap
  Formation, of which it pertains to the Upper Member. Among its relatives, it
  seems to be particularly similar to Parasaurolophus, rather than animals like
  Lambeosaurus; phylogenetic analysis confirms this, finding it in
  Parasaurolophini (tube-headed lambeosaurs). It would have lived in a wet
  environment, bordering on the sea but with a more arid season during some
  times of the year. This environment would have been shared with a diverse
  variety of fish and turtles, as well as other dinosaurs like ceratopsids and
  tyrannosaurids.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
