genus: Adelolophus
parent: Lambeosaurinae
etymology: From Greek 'adelos' meaning 'unknown' or 'obscure' and 'lophos'
  meaning 'crest'; meaning 'unknown crest'
pronunciation:
  phonetic: ah-DELL-o-LOW-fuhs
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
diagnostic_features:
  - Medial wall of the maxillary anterior process taller than in other
    lambeosaurines
  - Medial wall of the maxillary posterior process taller than in all known
    lambeosaurines, extending to the dorsal process and sloping
    posteroventrally, placing the palatine process well above the position found
    in other lambeosaurines
  - Thickened ridge extending posterodorsally from the ventral articulation of
    the jugal with the maxilla to the palatine process
appearance:
  integument: scaled
  evidence: inferred
