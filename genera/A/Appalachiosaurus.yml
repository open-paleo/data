genus: Appalachiosaurus
parent: Tyrannosauroidea
pronunciation:
  phonetic: AP-uh-LAY-chee-oh-SOR-uhs
  ipa: /ˌæpəˌleɪtʃioʊˈsɔːrəs/
etymology: "Named for the Appalachian region of eastern North America where it was found, combined with Greek 'sauros' meaning 'lizard', meaning 'Appalachian lizard'."
description: Appalachiosaurus is a genus of tyrannosauroid theropod dinosaur
  from the Late Cretaceous period of what is now eastern North America. It was a
  basal member of the clade Eutyrannosauria, meaning it was rather close in
  relation to the true tyrannosaurids such as Tyrannosaurus. Like most
  theropods, it was a bipedal predator. Only a juvenile skeleton has been found,
  representing an animal approximately 6.5 meters (21 ft) long and weighing 623
  kilograms (1,373 lb), which indicates an adult would have been significantly
  larger.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - marine
diagnostic_features:
  - Wide jugal process of ectopterygoid, elongate and straightened rather than
    short and strongly backswept as in other tyrannosauroids
  - Caudal pneumatic recess of palatine situated rostral to caudal margin of
    vomeropterygoid process
  - Articular surface for lacrimal of palatine situated distally on the
    dorsolateral process
  - Prominent lip extending over dorsal margin of articular surface of pedal
    unguals, creating a concave 'lipped' appearance cranial to the proximal
    articular surface
