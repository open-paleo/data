genus: Alectrosaurus
parent: Tyrannosauroidea
etymology: From Greek 'alektros' meaning 'without a mate' or 'unmarried' (hence
  'alone') and 'sauros' meaning 'lizard'; meaning 'alone lizard'
pronunciation:
  phonetic: a-LEK-tro-SAWR-us
  ipa: /əˌlɛktroʊˈsɔːrəs/
description: Alectrosaurus is a genus of tyrannosauroid theropod dinosaur that
  lived in Asia during the Late Cretaceous period, about some 96 million years
  ago in what is now the Iren Dabasu Formation.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Pedal digit III relatively shorter compared to the length of metatarsal III
    than in most other tyrannosaurs.
  - Distinct lip demarcating the posterior border of the distal condyle of
    metatarsal III, so that the distal articulatory surface is not medially
    continuous with the shaft as it is in Albertosaurus, Tyrannosaurus, and
    Struthiomimus.
  - Flexor tubercles on pedal digits III and IV relatively larger than those of
    Albertosaurus, extending posteriorly so that they are almost flush with the
    ventral margin of the articular facet.
