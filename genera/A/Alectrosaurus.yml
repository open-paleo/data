genus: Alectrosaurus
parent: Tyrannosauroidea
etymology: From Greek 'alektros' meaning 'without a mate' or 'unmarried' (hence
  'alone') and 'sauros' meaning 'lizard'; meaning 'alone lizard'
pronunciation:
  phonetic: a-LEK-tro-SAWR-us
  ipa: /əˌlɛktroʊˈsɔːrəs/
description: Alectrosaurus is a genus of tyrannosauroid theropod dinosaur that
  lived in Asia during the Late Cretaceous period, about some 96 million years
  ago in what is now the Iren Dabasu Formation.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Humerus long and slender, with high thin radial/deltoid crest; length
    exceeds that of Tyrannosaurus rex.
  - Manual ungual of digit I exceptionally large, laterally compressed, strongly
    curved, and sharply pointed.
  - Femur and tibia subequal in length (distinguishing it from Gorgosaurus
    sternbergi, which has tibia longer than femur).
  - "Ascending process of astragalus proportionally shorter: one-fourth the
    combined length of astragalus and tibia (vs. one-third in Gorgosaurus
    libratus)."
  - Humerus shaft lacks the torque present in Antrodemus (Allosaurus), with both
    expanded ends lying in the same plane.
