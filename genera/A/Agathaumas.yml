genus: Agathaumas
parent: Ceratopsidae
pronunciation:
  ipa: /æɡəˈθɔːməs/
  phonetic: ag-uh-THAW-mus
description: "Agathaumas is a dubious genus of a large ceratopsid dinosaur that
  lived in Wyoming during the Late Cretaceous (late Maastrichtian stage, 66
  million years ago). The name comes from Ancient Greek: αγαν - 'much' and θαυμα
  - 'wonder'. It was seen as the largest land animal known at the time of its
  discovery."
