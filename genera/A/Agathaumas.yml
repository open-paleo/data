genus: Agathaumas
parent: Ceratopsidae
pronunciation:
  ipa: /æɡəˈθɔːməs/
  phonetic: ag-uh-THAW-mus
etymology: From Ancient Greek 'αγαν' (agan, 'much') and 'θαυμα' (thauma,
  'wonder'); meaning 'much wonder', given by Cope in reference to the
  large size of the type material.
description: "Agathaumas is a dubious genus of a large ceratopsid dinosaur that
  lived in Wyoming during the Late Cretaceous (late Maastrichtian stage, 66
  million years ago). It was seen as the largest land animal known at the time
  of its discovery."
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - forested
diagnostic_features:
  - Dorsal centra vertically oval with small neural canal and greatly elevated
    neural spine, arch short antero-posteriorly
  - Sacrum of five vertebrae with huge diapophyses united by suture, each pair
    supporting a longitudinal convex articular face for the ilium
  - Ilium extended antero-posteriorly with large protuberance above acetabular
    sinus; one end dilated into a flat thin plate, total length approximately
    four feet
  - Dorsal diapophyses originating well above the neural canal, diverging
    upward, triangular in section
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "53038"
  - source: wikidata
    id: Q131751
  - source: gbif
    id: "4823148"
species:
  - name: Agathaumas sylvestris
    etymology: "From Latin 'sylvestris' (of the forest, wild). Cope (1872)
      coined the binomial as 'marvelous forest-dweller', in reference to the
      great size of the animal and to the forested environment indicated by
      plant fossils from the same beds."
    status: valid
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Maastrichtian
      from_ma: 72.1
      to_ma: 66.0
    location:
      country: US
      region: Wyoming
