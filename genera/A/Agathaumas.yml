genus: Agathaumas
parent: Ceratopsidae
pronunciation:
  ipa: /æɡəˈθɔːməs/
  phonetic: ag-uh-THAW-mus
description: "Agathaumas is a dubious genus of a large ceratopsid dinosaur that
  lived in Wyoming during the Late Cretaceous (late Maastrichtian stage, 66
  million years ago). The name comes from Ancient Greek: αγαν - 'much' and θαυμα
  - 'wonder'. It was seen as the largest land animal known at the time of its
  discovery."
diet: herbivore
paleoenvironment:
  - forested
diagnostic_features:
  - Dorsal centra vertically oval with small neural canal and greatly elevated
    neural spine, arch short antero-posteriorly
  - Sacrum of five vertebrae with huge diapophyses united by suture, each pair
    supporting a longitudinal convex articular face for the ilium
  - Ilium extended antero-posteriorly with large protuberance above acetabular
    sinus; one end dilated into a flat thin plate, total length approximately
    four feet
  - Dorsal diapophyses originating well above the neural canal, diverging
    upward, triangular in section
