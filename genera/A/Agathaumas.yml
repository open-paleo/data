        - -108.686996
    holotype:
      specimen_id: [ AMNH FR 4000 ]
      specimen_type: holotype
      institution: AMNH
      material: Sixteen vertebrae (including sacrum with associated dorsals and
        caudals), both iliac bones (one nearly perfect), limb bones, ribs, and
        other undetermined parts.
      completeness: partial
    described: 1872
    authors: Cope
    described_in: cope1872
references:
