genus: Atsinganosaurus
parent: Lirainosaurinae
etymology: "From the Greek word 'τσιγγάνος' or 'αθίγγανος' meaning 'gypsy', referring to the possible migration from east to west of the species, combined with Greek 'sauros' meaning 'lizard'. The species name honors its discovery locality Velaux-La Bastide Neuve."
description: Atsinganosaurus is a genus of titanosaurian sauropod dinosaur which
  existed in what is now France during the Late Cretaceous. Well-preserved
  remains (and the only known) of Atsinganosaurus were collected from the Grès à
  Reptiles Formation of the Aix-en-Provence Basin. The type and only species is
  A. velauciensis.
