genus: Atsinganosaurus
parent: Lirainosaurinae
etymology: "From the Greek word 'τσιγγάνος' or 'αθίγγανος' meaning 'gypsy', referring to the possible migration from east to west of the species, combined with Greek 'sauros' meaning 'lizard'. The species name honors its discovery locality Velaux-La Bastide Neuve."
pronunciation:
  phonetic: at-sin-ga-no-sor-us
description: Atsinganosaurus is a genus of titanosaurian sauropod dinosaur which
  existed in what is now France during the Late Cretaceous. Well-preserved
  remains (and the only known) of Atsinganosaurus were collected from the Grès à
  Reptiles Formation of the Aix-en-Provence Basin. The type and only species is
  A. velauciensis.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Anterior cervical vertebrae without marked pleurocoels on lateral sides
  - Posterior dorsal vertebrae with an accessory lamina connecting the posterior
    centrodiapophyseal and postzygodiapophyseal laminae
  - Absence of hyposphene-hypantrum articulation in posterior dorsal vertebrae
  - Sacrum with five opisthocoelous fused vertebrae, with pleurocoels present
    only on the first vertebra
  - Coracoid foramen equidistant from the dorsal and ventral margins of the
    coracoid
  - Distal end of humerus very slightly transversely expanded; dorsal edge of
    scapular blade perpendicular to proximal expansion of scapula
