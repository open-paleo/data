genus: Aralosaurus
parent: Lambeosaurinae
pronunciation:
  phonetic: AR-a-lo-SAWR-us
etymology: Named after the Aral Sea (near where the fossils were found northeast
  of it) combined with Greek 'sauros' meaning 'lizard'; meaning 'Aral Sea
  lizard'
description: Aralosaurus is a genus of hadrosaurid dinosaur that lived during
  the Late Cretaceous in what is now Kazakhstan. It is known only by a posterior
  half of a skull (devoid of its mandible) and some post-cranial bones found in
  the Bostobe Formation in rocks dated from the Upper Santonian - lower
  Campanian boundary, at about 83.6 Ma (millions of years ago). Only one species
  is known, Aralosaurus tuberiferus, described by Anatoly Konstantinovich
  Rozhdestvensky in 1968. The genus name means "Aral Sea lizard", because it was
  found to the northeast of the Aral Sea. The specific epithet tuberiferus means
  "bearing a tuber" because the posterior part of the nasal bone rises sharply
  in front of the orbits like an outgrowth.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Nasals form a low tubercular arch creating an enlarged crest in the central
    region of the skull roof.
  - An elliptical fontanelle between the nasals and frontals, almost one-third
    as wide as the skull in the orbital area.
  - Infratemporal fenestrae narrow, barely wider than the quadrate, with a
    length-to-height ratio of 7:4.
  - Lower jaw teeth bear a supplementary crest anterior to the medial ridge,
    rising above the center of the crown.
  - Proximal end of metatarsal III is wide, comprising approximately half its
    entire length.
