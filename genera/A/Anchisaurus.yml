genus: Anchisaurus
parent: Massopoda
description: Anchisaurus is a genus of basal sauropodomorph dinosaur. It lived
  during the Early Jurassic Period, and its fossils have been found in the red
  sandstone of the Upper Portland Formation, Northeastern United States, which
  was deposited from the Hettangian age into the Sinemurian age, between about
  200 and 192 million years ago. Until recently it was classed as a member of
  Prosauropoda. The genus name Anchisaurus comes from the Greek αγχι (agkhi)
  anchi-; "near, close" + Greek σαυρος (sauros); "lizard". Anchisaurus was
  coined as a replacement name for "Amphisaurus", which was itself a replacement
  name for Hitchcock's "Megadactylus", both of which had already been used for
  other animals.
locomotion: bipedal
diet: herbivore
