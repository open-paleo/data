genus: Anchisaurus
parent: Sauropodiformes
pronunciation:
  phonetic: ANG-ki-SAWR-us
etymology: From Greek 'anchi' meaning 'near' or 'close to' and 'sauros' meaning
  'lizard', referring to its placement near the base of the sauropodomorph
  family tree.
iczn_cases:
  - type: type-specimen
    status: opinion
    ruling: iczn2015a
    petition: galton2012a
    notes: Opinion 2361 set aside all previous type fixations for Megadactylus
      polyzelus under the plenary power and designated YPM 1883, the almost
      complete skull and skeleton that is the holotype of Anchisaurus colurus
      Marsh, 1891, as the neotype, the original holotype being fragmentary and
      non-diagnostic. Anchisaurus was placed on the Official List of Generic
      Names and polyzelus on the Official List of Specific Names.
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diet: herbivore
diagnostic_features:
  - Robust pollex (first digit) of foot with prominent development
  - Five-toed foot (first, third, and fourth phalanges of fourth toe present)
  - Large terminal phalanx on first digit, approximately 4 times larger than
    claw from other digit
  - Thin and compact bone walls in limb bones with large internal cavities
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "38637"
synonyms:
  - name: Amphisaurus
    type: preoccupied
    reason: Name preoccupied by Amphisaurus (Reptilia).
  - name: Megadactylus
    type: preoccupied
    reason: Name preoccupied by Megadactylus (Coleoptera).
erected_in: marsh1885a
species:
  - name: Anchisaurus polyzelus
    etymology: From Greek 'polyzelos' (much sought for), because remains of the
      Connecticut Valley's former inhabitants other than their tracks had been
      sought for many years before these bones were found.
    pronunciation:
      phonetic: POL-i-ZEL-us
    status: valid
    type_species: true
    period:
      name:
        - Early Jurassic
      stage:
        - Pliensbachian
        - Toarcian
    location:
      country: US
      locality: Manchester
      region: US-CT
      formation: Portland
      part: upper
      notes: Olsen and Galton (1984) give the formation's anchisaurid
        prosauropods as "associated with palynoflorules ranging in age from
        Pliensbachian to Toarcian".
    size:
      hip_height_m:
        min: 0.6
        max: 0.6
      length_m:
        min: 2.0
        max: 4.9
      weight_kg:
        min: 20
        max: 32
    type_specimen:
      specimen_id: [ YPM 1883 ]
      specimen_type: neotype
      institution: YPM
      material: Right foot bones with phalanges, notably robust first toe (pollex).
        Terminal phalanx from fourth toe. Additional claw fragment.
      completeness: fragmentary
    synonyms:
      - name: Yaleosaurus
        type: junior objective
        reason: Originally described as Y. colurus (later Anchisaurus colurus) on
          YPM 1883. Opinion 2361 designated that same specimen the neotype of
          Megadactylus polyzelus, so the two names share a name-bearing type.
      - name: Ammosaurus
        type: junior subjective
        reason: Originally described as A. major and later treated as Anchisaurus major;
          ultimately recognized as referable to An. polyzelus, with supposed
          differences attributed to growth and misinterpretation.
    erected_as: Megadactylus polyzelus
    erected_in: hitchcock1865a
notable_specimens:
  - specimen_id: [YPM 208]
    institution: YPM
    category: historic
    significance: "Nearly complete Manchester skeleton named Anchisaurus major by Marsh in 1889 and later the basis of the genus Ammosaurus. Its front block had been built into a bridge abutment; John Ostrom salvaged it when the bridge was demolished in 1969."
    discovered:
      year: 1884
      by: "Charles H. Owen"
    references: [marsh1889b]
references:
  - id: olsen1984a
    notes: Dates the Portland's anchisaurid-bearing beds Pliensbachian to
      Toarcian by their palynoflorules.
  - id: hitchcock1865a
  - id: marsh1885a
  - id: yates2004a
    notes: Source of the Portland Formation assignment for the neotype.
  - id: marsh1889b
  - id: galton2012a
    notes: Petitioned the Commission to set aside the fragmentary holotype of
      Megadactylus polyzelus and designate YPM 1883 as neotype.
  - id: iczn2015a
    notes: Opinion 2361, which granted the petition and fixed YPM 1883 as the
      neotype.
  - id: jones2026b
    notes: Source of the hip height estimate.
