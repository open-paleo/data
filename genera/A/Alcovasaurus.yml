genus: Alcovasaurus
parent: Stegosauridae
pronunciation:
  phonetic: al-KOH-vuh-SAWR-us
etymology: Named after Alcova, Wyoming, where the holotype was discovered
description: Alcovasaurus is an extinct genus of herbivorous stegosaurian
  dinosaurs that lived in the Late Jurassic. It was found in the Morrison
  Formation of Wyoming, United States. The genus contains a single species,
  Alcovasaurus longispinus, originally assigned to the genus Stegosaurus. It is
  likely a member of the Dacentrurinae, and has been referred to the genus
  Miragaia by some authors.
dispute:
  summary: >
    Alcovasaurus has an unstable position, recovered outside Eurypoda by Raven
    and Maidment (2017, attributed to missing data and possible immaturity) and
    within Dacentrurinae after recoding by Sánchez-Fenollosa and Cobos (2025).
    It is placed at Stegosauridae without a subfamily pending stable resolution.
  history:
    - date: "2026-06-26"
      note: Placed at Stegosauridae, subfamily placement unstable across analyses.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - All caudal vertebrae bear transverse processes, continuing to the distal
    caudal vertebrae
  - Distal caudal centra anteroposteriorly short, with height exceeding length
  - Femoral condylar articular surface confined almost exclusively to the distal
    surface
  - Two pairs of greatly elongate distal dermal tail spines (~90% of femoral
    length) with subequal bases and slender shafts
  - Posterior dermal tail spine pair widest at ~25% of length (constriction
    above base)
appearance:
  features:
    - tail spikes
    - dermal plates
  integument: armored
  evidence: direct
identifiers:
  - source: pbdb
    id: "376422"
  - source: wikidata
    id: Q18684887
  - source: gbif
    id: "11322311"
species:
  - name: Alcovasaurus longispinus
    etymology: "From Latin 'longus' (long) and 'spina' (spine), referring to
      the elongate tail spines."
    status: valid
    type_species: true
    period:
      name:
        - Late Jurassic
      stage:
        - Kimmeridgian
        - Tithonian
    location:
      country: US
      region: US-WY
      locality: Alcova Quarry
      formation: Morrison
      notes: >
        The quarry, about 2.4 km east of Alcova near Alcova Reservoir in
        Natrona County, has not been found again: "efforts by the UW to
        relocate it were unsuccessful" (Galton and Carpenter, 2016, p. 186).
        Its horizon rests on photographs of the site, which by a personal
        communication put it "relatively high in the Morrison Formation",
        "equivalent to the upper Brushy Basin Member of the Colorado Plateau"
        (p. 186); the formal entry gives an "unknown locality high in
        equivalent strata to the Brushy Basin Member of the Morrison
        Formation (Upper Jurassic, Kimmeridgian-Tithonian)" (p. 189).
        Sánchez-Fenollosa and Cobos (2025) give the species as
        "Kimmeridgian–Tithonian, Morrison Formation, USA" (p. 182).
    type_specimen:
      specimen_id:
        - UW 20503
      specimen_type: holotype
      institution: UWBM
      material: Right femur and casts of the posterior pair of dermal caudal spines;
        original specimen largely destroyed by water damage in the 1920s.
      completeness: fragmentary
    size:
      hip_height_m:
        min: 1.7
        max: 1.7
      length_m:
        min: 6.5
        max: 6.5
      weight_kg:
        min: 3500
        max: 5000
    synonyms:
      - name: Natronasaurus longispinus
        type: nomen nudum
        reason: Proposed by Roman Ulansky (2014) for "Stegosaurus"
          longispinus Gilmore, 1914 in a self-published electronic
          publication that was not archived by an independent
          organization and lacked an ISSN; the name is therefore
          ICZN-invalid under Article 8.5.3. Galton and Carpenter
          (2016) provided the valid replacement genus Alcovasaurus
          for the same material.
    erected_in: galton2016a
references:
  - id: galton2016a
  - id: jones2026a
    notes: Source of the hip height estimate, and the appearance features.
  - id: sánchez-fenollosa2025a
    notes: Recovered Alcovasaurus within Dacentrurinae after recoding its data.
  - id: raven2017a
    notes: Recovered Alcovasaurus outside Eurypoda, attributed to missing data and possible immaturity.
  - id: gilmore1914b
    notes: Named the species longispinus, as Stegosaurus longispinus.
  - id: ulansky2014b
    notes: Erected the nomen nudum Natronasaurus longispinus for the species longispinus.
