genus: Alnashetri
parent: Alvarezsauroidea
dispute:
  summary: >
    Alnashetri cerropoliciensis was originally described as a basal alvarezsaurid
    (Makovicky et al., 2012), and older analyses and the reference-work treatment
    of Jones (2026) place it within Alvarezsauridae, close to Patagonykinae. The
    most recent analyses — Meso et al. (2024) and the near-complete specimen
    described by Makovicky et al. (2026) — instead recover it outside
    Alvarezsauridae as a basal, non-alvarezsaurid alvarezsauroid.
  history:
    - date: "2026-07-01"
      note: Placed at Alvarezsauroidea, the least-inclusive uncontested node, following the recent analyses of Meso et al. (2024) and Makovicky et al. (2026) (P2/P3); the older within-Alvarezsauridae placement is unresolved.
etymology: "From the Günün-a-kunna dialect of the Tehuelche language, meaning 'slender thighs', referring to the long and slender hind limbs of the holotype. The species name honors the nearby village of Cerro Policía."
pronunciation:
  phonetic: al-nuh-sheh-tree
description: Alnashetri is a genus of alvarezsaurid theropod dinosaur from the
  Late Cretaceous (Cenomanian) Candeleros Formation of Río Negro Province,
  Argentina. The type and only species, Alnashetri cerropoliciensis, is known
  from partial hindlimb remains.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - arid
diagnostic_features:
  - Low ridge on distal tibia separating rostral articular surface from outer
    face of lateral malleolus, extending up tibial shaft well above tip of
    ascending process of astragalus.
  - Small notches extending ventrally from collateral ligament pits at base of
    distal articular hemicondyles on phalanges III-2 and III-3, proximoventral
    to the collateral ligament fossae.
