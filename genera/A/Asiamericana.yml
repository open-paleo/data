genus: Asiamericana
parent: Dromaeosauridae
dispute:
  summary: >
    Asiamericana asiatica is a nomen dubium based on three isolated teeth whose
    affinities are uncertain even at a high level; the describer noted they could
    be theropod (possibly spinosaurid) or belong to a saurodontid fish (Nessov,
    1995), and later work considered them synonymous with the tooth taxon
    Richardoestesia (Averianov and Sues, 2019). It is retained provisionally at
    Dromaeosauridae incertae sedis.
  history:
    - date: "2026-07-01"
      note: Retained at Dromaeosauridae incertae sedis; nomen dubium, teeth of uncertain affinity (possibly Richardoestesia or non-theropod). Flagged for Literature Review.
etymology: From the ancient continent "Asiamerica", reflecting
  Nessov's interpretation of the genus as evidence of Late Cretaceous
  faunal links between Asia and North America.
pronunciation:
  phonetic: AY-zha-MER-i-KAHN-uh
description: >
  Asiamericana is a dubious genus of coelurosaur known only from
  isolated teeth found in the Bissekty Formation of Uzbekistan. It
  was named to recognize the occurrence of similar fossil teeth in
  Central Asia and North America. These regions once formed a
  connected land mass, during the Cretaceous period.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - deltaic
diagnostic_features:
  - Teeth straight and strongly laterally flattened, with a plane of
    symmetry perpendicular to the plane through the crown apex and
    cutting edges.
  - Tooth edges entirely lack serrations.
  - Crown bearing a weakly sloping vertical groove that may be
    replaced by a flat surface occupying one-third to one-half of
    the anteroposterior width.
