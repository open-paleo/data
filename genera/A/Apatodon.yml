genus: Apatodon
parent: Dinosauria
placement: incertae sedis
etymology: From Greek 'apate' ('deceit') and 'odon' ('tooth'), for the original
  misidentification of the specimen as the jaw of a mammal.
description: Apatodon is a dubious genus of dinosaur that may have been a
  theropod. The type, and only species, A. mirus, was named in 1877 by Othniel
  Charles Marsh. It was found in the Late Jurassic-aged Morrison Formation of
  Colorado.
identifiers:
  - source: pbdb
    id: "52954"
  - source: wikidata
    id: Q3766429
  - source: gbif
    id: "4822777"
species:
  - name: Apatodon mirus
    etymology: From Latin 'mirus' ('wonderful', 'astonishing'), for the
      unexpected character of the specimen as Marsh interpreted it.
    status: nomen dubium
    type_species: true
    period:
      name:
        - Late Jurassic
    location:
      country: US
      region: US-CO
      locality: Rocky Mountain region
      formation: Morrison
    type_specimen:
      specimen_type: holotype
      status: lost
      material: Weathered fragment of a dinosaurian vertebra, from the neural
        spine, originally described as a portion of a lower jaw with the last
        molar in place.
      completeness: fragmentary
    erected_in: marsh1877d
references:
  - id: marsh1877d
    notes: Erects the genus and species on a fragment from the Rocky Mountain
      region, interpreting it as a mammalian lower jaw and giving the horizon
      as Lower Cretaceous or Jurassic.
  - id: chure2000a
    notes: Rejects the referral to Allosaurus as unargued, accepts the fragment
      as a dinosaur vertebra, and treats the species as a nomen dubium at
      Dinosauria incertae sedis.
  - id: jones2026c
    notes: Lists the genus among dubious theropods, records the material as a
      vertebral shard now lost, and gives the Morrison Formation occurrence.
  - id: molina-pérez2019a
    notes: Notes that the specimen was lost and never illustrated, so the
      referral to Allosaurus cannot be confirmed.
  - id: olshevsky1991a
    notes: Source of the referral to Allosaurus, listed without supporting
      argument.
