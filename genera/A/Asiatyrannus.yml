genus: Asiatyrannus
parent: Tyrannosaurinae
etymology: Asian tyrant
description: Asiatyrannus is an extinct genus of tyrannosaurine theropod
  dinosaurs from the Late Cretaceous Nanxiong Formation of China. The genus
  contains a single species, A. xui, known from a single specimen consisting of
  a skull and partial postcranial skeleton. Asiatyrannus is notable for its
  deep-snouted skull and small body size, in contrast to the gracile snout and
  larger size of the contemporary Qianzhousaurus. It represents the southernmost
  record of an Asian tyrannosaurid.
diet: carnivore
locomotion: bipedal
