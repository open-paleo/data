genus: Asiatyrannus
parent: Tyrannosaurinae
etymology: From Asia (the continent where fossils were found) + Greek tyrannos (τύραννος) meaning 'tyrant'; overall meaning 'Asian tyrant'.
pronunciation:
  phonetic: AY-shuh-ty-RAN-us
description: Asiatyrannus is an extinct genus of tyrannosaurine theropod
  dinosaurs from the Late Cretaceous Nanxiong Formation of China. The genus
  contains a single species, A. xui, known from a single specimen consisting of
  a skull and partial postcranial skeleton. Asiatyrannus is notable for its
  deep-snouted skull and small body size, in contrast to the gracile snout and
  larger size of the contemporary Qianzhousaurus. It represents the southernmost
  record of an Asian tyrannosaurid.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Two small, deep fossae on the lateral surface of the premaxilla just lateral
    to the anteroventral border of the external naris
  - Large and sub-rectangular shaped maxillary fenestra
  - Posterior protuberances of the nasals connect to form two separated medium
    low ridges
  - Low ridge-like jugal accessory horn with the ventral margin of the anterior
    ramus curving ventrally anterior to the horn
  - Lateral surface of the descending process of the postorbital with
    anterodorsally trending fine lineations
  - Lateral surangular shelf extending to the posterior end of the surangular
