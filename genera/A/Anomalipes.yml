genus: Anomalipes
parent: Caenagnathidae
etymology: From Latin 'anomalus' meaning 'peculiar' or 'abnormal' and 'pes' meaning 'foot'; meaning 'unusual foot', referring to the unusual shape of its foot
description: Anomalipes is an extinct genus of caenagnathid oviraptorosaurian
  dinosaurs known from the Late Cretaceous (Campanian age) Wangshi Group of
  China. The genus contains a single species, Anomalipes zhaoi, known from a
  partial hindlimb.
diet: omnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Femoral head anteroposteriorly narrow and somewhat deflected posteriorly.
  - Accessory trochanter low and confluent with lesser trochanter.
  - Lateral ridge present on femoral lateral surface, not known in other
    oviraptorosaurs.
  - Weak fourth trochanter present along posteromedial margin of femoral shaft.
  - Metatarsal III with triangular proximal articular surface, prominent
    anterior flange near proximal end, medial hemicondyle much narrower than
    lateral hemicondyle, and longitudinal groove on distal articular surface.
  - Pedal phalanx II-3 with lateral collateral groove deeper and more dorsally
    located than medial groove.
