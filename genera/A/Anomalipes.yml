genus: Anomalipes
parent: Caenagnathidae
etymology: From Latin 'anomalus' meaning 'peculiar' or 'abnormal' and 'pes' meaning 'foot'; meaning 'unusual foot', referring to the unusual shape of its foot
description: Anomalipes is an extinct genus of caenagnathid oviraptorosaurian
  dinosaurs known from the Late Cretaceous (Campanian age) Wangshi Group of
  China. The genus contains a single species, Anomalipes zhaoi, known from a
  partial hindlimb.
diet: omnivore
locomotion: bipedal
