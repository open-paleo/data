genus: Anodontosaurus
parent: Ankylosaurinae
etymology: From Ancient Greek 'an' meaning 'without', 'odon' meaning 'tooth',
  and 'sauros' meaning 'lizard', meaning 'toothless lizard', inspired by
  compression damage to the specimen that removed the teeth and misled the
  describer into assuming large trituration plates had replaced the normal
  dentition.
pronunciation:
  phonetic: an-o-DONT-o-SOR-us
description: Anodontosaurus is an extinct genus of ankylosaurid dinosaurs within
  the subfamily Ankylosaurinae. It is known from the entire span of the Late
  Cretaceous Horseshoe Canyon Formation (mid Late Campanian to "middle"
  Maastrichtian stage, about 72.8-67 Ma ago) of southern Alberta, Canada, and is
  also known from the Dinosaur Park Formation (75.6 Ma ago). It contains two
  species, A. lambei and A. inceptus.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Skull very much depressed; completely covered with moderate-sized, irregular
    dermal ossifications
  - Teeth entirely absent; broad flat bony plates developed on maxillae and
    dentaries for masticating food
  - Mandible greatly reduced and without coronoid process
  - External nares transversely elongate and terminally placed, facing almost
    directly forward
  - Pterygoids small and meeting on midline; palatines not fused on midline and
    not uniting with pterygoids
  - Dermal scutes uniformly thin and concave inferiorly, even in long
    high-keeled forms
appearance:
  features:
    - body armor
    - osteoderms
    - tail club
    - cranial bosses
  integument: armored
  evidence: direct
