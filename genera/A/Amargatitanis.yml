genus: Amargatitanis
parent: Dicraeosauridae
etymology: Amarga giant
description: Amargatitanis is a genus of dicraeosaurid sauropod dinosaur (a type
  of large, long-necked quadrupedal herbivorous dinosaur) from the
  Barremian-aged (Lower Cretaceous) La Amarga Formation of Neuquén, Argentina.
  It is known from a single, incomplete postcranial skeleton consisting of a
  partial hindlimb, ischium, and two vertebrae. These remains were unearthed by
  Argentine paleontologist José Bonaparte in 1983 during an expedition by the
  Museo Argentino de Ciencias Naturales and later described as a new genus and
  species, Amargatitanis macni by Sebastián Apesteguía. The genus name comes
  from the words Amarga, where the fossils were collected, and titanis meaning
  "titan". Its species name is in reference to the MACN (Museo Argentino de
  Ciencias Naturales), where the remains are stored.
diet: herbivore
locomotion: quadrupedal
