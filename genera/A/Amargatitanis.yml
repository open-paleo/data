genus: Amargatitanis
parent: Dicraeosauridae
etymology: Named after La Amarga Formation where the fossils were collected, combined with Greek 'titans' meaning 'giant'; meaning 'Amarga giant'
pronunciation:
  phonetic: a-MAHR-guh-tie-TAN-iss
description: Amargatitanis is a genus of dicraeosaurid sauropod dinosaur (a type
  of large, long-necked quadrupedal herbivorous dinosaur) from the
  Barremian-aged (Lower Cretaceous) La Amarga Formation of Neuquén, Argentina.
  It is known from a single, incomplete postcranial skeleton consisting of a
  partial hindlimb, ischium, and two vertebrae. These remains were unearthed by
  Argentine paleontologist José Bonaparte in 1983 during an expedition by the
  Museo Argentino de Ciencias Naturales and later described as a new genus and
  species, Amargatitanis macni by Sebastián Apesteguía. The genus name comes
  from the words Amarga, where the fossils were collected, and titanis meaning
  "titan". Its species name is in reference to the MACN (Museo Argentino de
  Ciencias Naturales), where the remains are stored.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Robust, wide and flat scapula developed in a single plane, with straight
    parallel anterior and posterior borders of the diaphysis and acromion in
    straight line with the diaphysis.
  - Very short glenoid region with straight articulation for the coracoid and
    obtuse angle of coracoid articular surface with respect to the
    glenoid-scapular line; absence of scapular ventromedial process.
  - Femoral fourth trochanter located at mid femur, with a prominent femoral
    head relative to a moderately developed distal region.
  - High astragalus bearing a deep crescent-shaped fossa on the upper part of
    the tibial side of the posterior astragalar fossa, with two pairs of
    foramina.
  - Posterior astragalar fossa fibular side bearing a deep concavity containing
    two foramina.
