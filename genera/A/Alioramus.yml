genus: Alioramus
parent: Alioramini
pronunciation:
  phonetic: AL-ee-o-RAY-mus
  ipa: /ˌælioʊˈreɪməs/
etymology: "From Latin 'alio' meaning 'different' and 'ramus' meaning 'branch',
  meaning 'different branch', referring to its divergent position within the
  tyrannosaurid family tree."
description: Alioramus is a genus of tyrannosaurid theropod dinosaurs from the
  Late Cretaceous period of Asia. It currently contains two species. The type
  species, A. remotus is known from a partial skull and three foot bones
  recovered from the Mongolian Nemegt Formation, which was deposited in a humid
  floodplain. These remains were named and described by Soviet paleontologist
  Sergei Kurzanov in 1976. A second species, A. altai, known from a much more
  complete skeleton also from the Nemegt Formation, was named and described by
  Stephen L. Brusatte and colleagues in 2009. Its relationships to other
  tyrannosaurid genera were at first unclear, with some evidence supporting a
  hypothesis that Alioramus was closely related to the contemporary species
  Tarbosaurus bataar. However, the discovery of Qianzhousaurus indicates that it
  belongs to a distinct branch of tyrannosaurs, namely the tribe Alioramini.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Skull very low and elongated, with a skull length-to-height ratio of about
    3.6 (vs. 2.1-2.5 in other tyrannosaurids)
  - Nasals bearing well-developed separate crests about 1-1.5 cm high
  - Second antorbital fenestra displaced anteriorly, reaching the level of the
    anterior end of the 5th tooth
  - "High tooth count: 16 maxillary teeth and 18 dentary teeth"
  - Labial foramina arranged in two rows on the jaws
  - Teeth narrow and oval in transverse section, slightly compressed at
    mid-length
