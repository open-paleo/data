genus: Arkharavia
parent: Somphospondyli
etymology: From the village of Arkhara (Amur Region, Far East
  Russia) and the Latin via (road); referring to the locality near
  the Arkhara River.
description: >
  Arkharavia is a dubious somphospondylan sauropod erected by
  Alifanov and Bolotsky (2010) on a single isolated anterior caudal
  vertebra (AEHM 2/418) from the Maastrichtian Udurchukan Formation
  at Kundur, Amur Region of the Russian Far East. The four referred
  caudal vertebrae and a tooth fragment from the same formation have
  been reassigned by subsequent workers to indeterminate hadrosaurids,
  and the sauropod identity of the type vertebra itself has also
  been questioned, leaving Arkharavia heterocoelica without
  diagnostic material.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Anterior caudal centra narrow in lateral view, with saddle-shaped
    (heterocoelous) articular surfaces.
  - Neural spine of anterior caudal vertebrae high and narrow, with a
    distinct groove at the base of its cranial surface.
