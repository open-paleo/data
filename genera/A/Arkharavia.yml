genus: Arkharavia
parent: Somphospondyli
etymology: From the village of Arkhara (Amur Region, Far East
  Russia) and the Latin via (road); referring to the locality near
  the Arkhara River.
pronunciation:
  phonetic: AHR-kuh-RAH-vee-uh
description: >
  Arkharavia is a dubious genus of somphospondylan sauropod, although
  at least some of its remains probably belong to a hadrosaurid. It
  was discovered in the Udurchukan Formation in Russia and lived
  during the Late Cretaceous. It was described in 2010 by Alifanov
  and Bolotsky as the type species A. heterocoelica.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Anterior caudal centra narrow in lateral view, with saddle-shaped
    (heterocoelous) articular surfaces.
  - Neural spine of anterior caudal vertebrae high and narrow, with a
    distinct groove at the base of its cranial surface.
