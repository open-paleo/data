genus: Argyrosaurus
parent: Titanosauria
pronunciation:
  ipa: /ˌɑːrdʒaɪroʊˈsɔːrəs/
  phonetic: AR-jy-roh-SOR-uhs
etymology: "From Greek 'argyros' meaning 'silver' and 'sauros' meaning 'lizard',
  meaning 'silver lizard', named for Argentina (from Latin 'argentum', silver)."
description: Argyrosaurus is a genus of titanosaurian sauropod dinosaur that
  lived about 70 million years ago, during the Late Cretaceous Period of what is
  now Argentina.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Humerus with more squared proximal extremity than Titanosaurus australis
  - Postaxial border of humerus shaft much less curved than T. australis
  - More strongly developed and shorter deltoid crest than T. australis
  - Distinct prominent ridge on inner border of posterior surface of proximal
    half of femur
  - Caudal vertebrae lacking hollowed and squared surface on inferior aspect
    unlike Titanosaurus
  - Much deeper anterior cup in caudal vertebrae than Titanosaurus
  - Posterior articular surface of caudals cone-shaped rather than nearly
    spherical
