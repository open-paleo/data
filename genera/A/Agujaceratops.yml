genus: Agujaceratops
parent: Chasmosaurinae
etymology: Named after the Aguja Formation where it was found, combined with
  Greek 'keras' meaning 'horn' and 'ops' meaning 'face'; meaning 'horned face
  from Aguja'
description: "Agujaceratops is a genus of chasmosaurine ceratopsid dinosaur from
  the Late Cretaceous (Campanian) of western Texas. Two species are known: A.
  mariscalensis and A. mavericus, both recovered from the Aguja Formation."
diet: herbivore
locomotion: quadrupedal
