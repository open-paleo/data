genus: Agujaceratops
parent: Chasmosaurinae
etymology: Named after the Aguja Formation where it was found, combined with
  Greek 'keras' meaning 'horn' and 'ops' meaning 'face'; meaning 'horned face
  from Aguja'
description: "Agujaceratops is a genus of chasmosaurine ceratopsid dinosaur from
  the Late Cretaceous (Campanian) of western Texas. Two species are known: A.
  mariscalensis and A. mavericus, both recovered from the Aguja Formation."
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Relatively short and broad squamosal with length/width ratio less than 2,
    bearing more than 6 relatively large epoccipitals.
  - Maxilla lacks a lateral horizontal shelf and premaxilla lacks a
    posterodorsal extension.
  - Supraorbital horncores relatively long and curved posteriorly (not
    anteriorly).
  - Posterior border of parietal flattened and plate-like rather than square and
    bar-like, with a marked but shallower embayment of the posterior median
    parietal.
  - Nasal horncore not centered above the external naris; premaxilla bears a
    septal flange along the entire anterior edge of the naris.
