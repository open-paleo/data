genus: Agujaceratops
parent: Chasmosaurinae
etymology: Named after the Aguja Formation where it was found, combined with
  Greek 'keras' meaning 'horn' and 'ops' meaning 'face'; meaning 'horned face
  from Aguja'
pronunciation:
  phonetic: ah-GOO-ja-SEH-ruh-tops
description: "Agujaceratops is a genus of chasmosaurine ceratopsid dinosaur from
  the Late Cretaceous (Campanian) of western Texas. Two species are known: A.
  mariscalensis and A. mavericus, both recovered from the Aguja Formation."
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Anteromedial processes of the nasals intercede between the premaxillae and
    extend forward along the internarial bar
  - Septal flange of the premaxillae extends along the entire posterior margin
    of the narial strut
  - Accessory antorbital fenestra present
  - Postorbital horncores posteriorly curved
  - Cornual sinuses absent
  - Posterior end of the squamosal with marked dorsal curvature
  - Lateral ramus of the parietal discontinuous, the squamosal forming part of
    the lateral border of the parietal fenestra
appearance:
  features:
    - brow horns
    - neck frill
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "112568"
  - source: wikidata
    id: Q132534
  - source: gbif
    id: "4965823"
  - source: eol
    id: "4531644"
species:
  - name: Agujaceratops mariscalensis
    etymology: Named for the Mariscal area of Big Bend National Park, Texas, where
      the holotype was collected.
    status: valid
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Campanian
    location:
      country: US
      locality: WPA-1
      region: US-TX
      formation: Aguja
      member: Alto Shale
    size:
      hip_height_m:
        min: 1.8
        max: 1.8
      length_m:
        min: 4.3
        max: 4.3
      weight_kg:
        min: 1500
        max: 1500
    type_specimen:
      specimen_id:
        - UTEP P.37.7.086
      specimen_type: holotype
      institution: UTEP
      material: Braincase, left supraorbital horncore, left maxilla, and right
        dentary; collected from the upper part of the formation.
      completeness: fragmentary
    diagnostic_features:
      - Squamosal relatively short (elongate in A. mavericus)
      - Six episquamosals, or corresponding attachment loci on the squamosal
        (up to 10 in A. mavericus)
      - Episquamosals large and triangular (small and elliptical in A.
        mavericus)
      - Postorbital horncores with high basal circumference and high taper
        relative to length
    erected_in: lucas2006a
    described_in: lehman2016b
  - name: Agujaceratops mavericus
    etymology: From 'maverick' (an unbranded range animal or lone dissenter); refers
      to the Old Maverick Road, near where the holotype was collected.
    status: valid
    type_species: false
    period:
      name:
        - Late Cretaceous
      stage:
        - Campanian
    location:
      country: US
      region: US-TX
      formation: Aguja
      member: Alto Shale
      locality: Rattlesnake Mountain
    type_specimen:
      specimen_id:
        - TMM 43098-1
      specimen_type: holotype
      institution: TMM
      material: Nearly complete, disarticulated skull (the 'Rattlesnake Mt exemplar'),
        including an intact right postorbital horncore and squamosal, but
        lacking preserved parietal remains.
    diagnostic_features:
      - Squamosal relatively elongate (width/length ratio about 0.36, versus
        0.44-0.55 in A. mariscalensis)
      - Up to 10 episquamosals or corresponding marginal undulations of the
        squamosal (versus six in A. mariscalensis)
      - Episquamosals small and elliptical in cross section (large and
        triangular in A. mariscalensis)
      - Postorbital horncores with low basal circumference and low taper
        relative to length
    erected_in: lehman2016b
    described_in: forster1993b
references:
  - id: lucas2006a
  - id: jones2026a
    notes: Source of the hip height estimate, and the appearance features.
  - id: lehman2024a
    notes: Formally recognizes the Aguja's informal upper shale member as
      the Alto Shale Member.
  - id: lehman2016b
    notes: Revision of the genus. Erects A. mavericus, diagnoses the two
      species against each other, and reassigns the complete Rattlesnake
      Mountain skull to the new species.
  - id: forster1993b
    notes: Complete description of the skull that is now the A. mavericus
      holotype, published under the earlier combination Chasmosaurus
      mariscalensis.
