genus: Agilisaurus
parent: Neornithischia
pronunciation:
  phonetic: AJ-i-li-SAWR-us
  ipa: /ˌædʒɪlɪˈsɔːrəs/
etymology: "From Latin 'agilis' meaning 'agile' and Greek 'sauros' meaning
  'lizard', meaning 'agile lizard'."
description: Agilisaurus is a genus of ornithischian dinosaur from the Middle
  Jurassic Period of what is now eastern Asia. The only named species is A.
  louderbacki, recovered from the Lower Shaximiao Formation of Sichuan, China.
  It was about 1.2-1.7 m (3.9-5.6 ft) in length, 60 cm (2.0 ft) in hip height,
  and 40 kg (88 lb) in weight. It has leaf-shaped teeth that were well-adapted
  to its abrasive, plant-based diet. Most surprisingly, the wavy enamel of the
  teeth of this genus (and all other ornithopods), presumed to make them more
  resistant to wear, was previously thought to be exclusive to hadrosaurs. This
  is also the case for Changchunsaurus from the Cretaceous Period.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Middle part of parietal strongly contracted
  - Nasal long with longitudinal depression at central suture
  - Posterior process of premaxilla does not contact the lacrimal
  - Palpebral bone well-developed, posterior end abutting lateral surface of
    postorbital, dividing orbit into upper and lower openings
  - Elliptical foramen present on lateral surface of femoral shaft distal to
    fourth trochanter
  - Obturator process of ischium positioned at proximal third of shaft
