genus: Aegyptosaurus
parent: Titanosauria
pronunciation:
  phonetic: ee-JIP-to-SAWR-us
  ipa: /iːˌdʒɪptoʊˈsɔːrəs/
etymology: "From 'Aegyptus' (Latin for Egypt) and Greek 'sauros' meaning
  'lizard', meaning 'Egypt's lizard', reflecting its discovery in Egypt."
description: Aegyptosaurus is a genus of sauropod dinosaur discovered in Egypt,
  that lived in what is now Africa, around 95 million years ago, during the Late
  Cretaceous Period (Cenomanian faunal stage).
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - coastal
  - wetland
diagnostic_features:
  - Middle caudal vertebral body short and higher than broad, procoelic, with
    neural arch and thick rudimentary transverse process restricted to anterior
    half, and concave surface above neural canal anterior to neural arch
  - Humerus relatively slender, with slight medial expansion of upper end and
    deltoid crest terminating anteriorly against the shaft midline rather than
    along the outer margin
  - Ulna relatively slender, upper end not strongly thickened or broadened, not
    concave medially above, lower outline oval with medial angle
  - Femur with weakly developed trochanter IV positioned in upper third of
    length, and broad surface facing posteriorly beside the lateral condyle
    below
  - Scapula lacking ridges, with obtuse angle between straight shaft anterior
    edge and convex anterior edge of expansion, and moderately acute angle
    between shaft axis and width axis
  - Tibia relatively slender, proximal end only moderately broadened with
    approximately semicircular outline, crista cnemialis apparently not
    prominent
