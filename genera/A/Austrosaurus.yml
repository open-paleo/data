genus: Austrosaurus
parent: Somphospondyli
pronunciation:
  phonetic: AWS-tro-SAWR-us
  ipa: /ˌɔːstroʊˈsɔːrəs/
etymology: "From Latin auster meaning 'south' and Greek sauros meaning 'lizard'.
  Full meaning: 'southern lizard', referring to its Australian origin."
description: Austrosaurus was an extinct genus of sauropod dinosaur from the
  Allaru Formation, dated to the early Cretaceous (112-100 million years ago),
  of Central-Western Queensland in Australia. Several specimens are known.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - marine
diagnostic_features:
  - Dorsal vertebrae markedly opisthocoelous with centra having thin cortical
    walls much enlarged at enarthrodial articulations
  - Intramural region of centra forms a complex of small irregular cavities
    separated by thin bony laminae, not expanded from pleurocoel recesses
  - Pleurocoel divided into a large external horizontal oval recess and a
    smaller internal oval fenestra extending deeper into the centrum
  - Deep recess in neural arch between the infraprezygapophysial lamina and the
    infradiapophysial buttress, attaining depth of at least 60 mm
  - Elongated isosceles triangle of matrix enclosed within thin bone plates
    immediately above neural canal, visible in transverse section
appearance:
  integument: scaled
  evidence: inferred
