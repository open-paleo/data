etymology: "From Latin auster meaning 'south' and Greek sauros meaning 'lizard'.
  Full meaning: 'southern lizard', referring to its Australian origin."
description: Austrosaurus was an extinct genus of sauropod dinosaur from the
  Allaru Formation, dated to the early Cretaceous (112-100 million years ago),
  of Central-Western Queensland in Australia. Several specimens are known.
