genus: Achelousaurus
parent: Centrosaurinae
etymology: Named after Achelous, the Greek deity of rivers, combined with Greek
  'sauros' meaning 'lizard'; meaning 'Achelous lizard'
pronunciation:
  phonetic: ak-e-LOH-uh-SAWR-us
  ipa: /əˌkiːloʊˈsɔːrəs, ˌækɪˌloʊəˈsɔːrəs/
description: Achelousaurus is a genus of centrosaurine ceratopsid dinosaur that
  lived during the Late Cretaceous Period of what is now North America, about 77
  to 74.8 million years ago. The first fossils of Achelousaurus were collected
  in Montana in 1987, by a team led by Jack Horner, with more finds made in
  1989. In 1994, Achelousaurus horneri was described and named by Scott D.
  Sampson; the generic name means "Achelous lizard", in reference to the Greek
  deity Achelous, and the specific name refers to Horner. The genus is known
  from a few specimens consisting mainly of skull material from individuals,
  ranging from juveniles to adults.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Relatively small, thin, heavily-pitted nasal boss in adults restricted to
    the nasal region.
  - Relatively large, high-ridged supraorbital bosses in adults rather than true
    horns.
  - Sub-adults possessing true supraorbital horncores with concave surfaces
    medially.
  - Parietal with single pair of curved spikes projecting posterolaterally from
    the rear margin.
appearance:
  features:
    - cranial bosses
    - neck frill
    - epoccipitals
  integument: scaled
  evidence: inferred
