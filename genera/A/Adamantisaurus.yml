genus: Adamantisaurus
parent: Rinconsauria
pronunciation:
  ipa: /ˌædəˌmæntɪˈsɔːrəs/
  phonetic: AD-uh-MAN-tiss-OR-uhs
etymology: "Named for the Adamantina Formation of Brazil, where related titanosaurs were found, combined with Greek 'sauros' meaning 'lizard'."
description: Adamantisaurus is a poorly-known genus of titanosaurian sauropod
  dinosaur from the Late Cretaceous Period of what is now South America. It is
  only known from six tail vertebrae but, as a sauropod, it can be assumed that
  this dinosaur was a very large animal with a long neck and tail.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - arid
diagnostic_features:
  - Anterior caudal vertebrae with straight or slightly backward-projecting
    neural spines with distal ends strongly expanded laterally.
  - Stout prespinal lamina on anterior caudal vertebrae.
  - Pre- and postzygapophyses with very wide articular facets on anterior caudal
    vertebrae.
  - Concave postzygapophyseal articular facets on anterior caudal vertebrae.
