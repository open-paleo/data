genus: Algoasaurus
parent: Eusauropoda
pronunciation:
  ipa: /ælˌɡoʊ.əˈsɔːrəs/
  phonetic: al-GO-uh-SOR-us
etymology: "Named for Algoa Bay in South Africa, near where its remains were found, combined with Greek 'sauros' meaning 'lizard'."
description: Algoasaurus is a genus of sauropod dinosaur from the Early
  Cretaceous (Berriasian to early Valanginian ages) Upper Kirkwood Formation of
  Cape Province, South Africa, specifically near a town called Despatch. Only
  one species, A. bauri, is known.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Fourth trochanter of femur markedly smaller than in Brontosaurus,
    Diplodocus, or Morosaurus, suggesting less powerfully developed tail
    musculature
  - Femur estimated ~500 mm complete length (approximately one-third the size of
    Diplodocus femur), measuring 120 mm across narrowest part
  - Posterior dorsal vertebral spine with complicated arrangement of laminae
    similar to Diplodocus posterior dorsals
  - Vertebral centra bearing the peculiar excavations (pleurocoels) seen in
    American diplodocid types
  - Scapula lower half shape resembling Brontosaurus, with estimated greatest
    breadth ~200 mm when complete
