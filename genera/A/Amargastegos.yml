genus: Amargastegos
parent: Stegosauria
placement: incertae sedis
pronunciation:
  phonetic: ah-MAR-guh-STEG-os
etymology: From 'Amarga' (the Argentine La Amarga Formation that yielded the
  type material) and Greek 'stegos' (roof, in reference to stegosaurs);
  intended sense 'La Amarga roof'.
description: >
  Amargastegos is a nomen dubium genus of stegosaurian dinosaur
  informally proposed by Ulansky (2014) for the partial skeleton
  MACN N-43 from the Barremian La Amarga Formation of Neuquén
  Province, Argentina. The same material had previously been
  formally described by Pereda-Suberbiola et al. (2013) as
  Stegosauria indet., on the grounds that it lacks any autapomorphies
  allowing referral to a particular stegosaurian taxon. Galton and
  Carpenter (2016) declared Amargastegos brevicollus a nomen dubium
  on ICZN Article 13 grounds (the informal Dinologia venue) and
  confirmed Stegosauria indet. as the correct identification of the
  type material.
dispute:
  summary: >
    Amargastegos is an informally named taxon (nomen dubium) regarded as an
    indeterminate stegosaur (Galton and Carpenter, 2016). It is retained at
    Stegosauria incertae sedis pending a formal description; a dedicated
    literature review is tracked separately.
  history:
    - date: "2026-06-26"
      note: Placed at Stegosauria incertae sedis, nomen dubium and an indeterminate stegosaur.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
appearance:
  integument: armored
  evidence: direct
diagnostic_features:
  - Cervical vertebrae centra wider than long, differing from the condition in
    Miragaia
  - Distinct lateral depression on centra of cervical vertebrae, more pronounced
    than in Dacentrurus
  - Neck plates longer than tall, unlike the nearly triangular plates of
    Stegosaurus and Kentrosaurus
  - Cervical plates taper posteriorly rather than toward the apex, unlike in
    Miragaia
  - Cervical vertebrae not fused with their ribs, unlike dacenturine stegosaurs
identifiers:
  - source: pbdb
    id: "374249"
  - source: wikidata
    id: Q19377675
species:
  - name: Amargastegos brevicollus
    etymology: From Latin 'brevis' (short) and 'collum' (neck); meaning
      'short-necked', in reference to the proportionally short cervical
      centra of the type material.
    status: nomen dubium
    type_species: true
    period:
      name:
        - Early Cretaceous
      stage:
        - Barremian
    location:
      country: AR
      locality: La Amarga Creek, Catan Lil Department
      region: AR-Q
      formation: La Amarga
      coordinates:
        - -39.481979
        - -70.194786
    size:
      length_m:
        min: 4
        max: 5
    type_specimen:
      specimen_id:
        - MACN N-43
      specimen_type: holotype
      institution: MACN
      material: Anterior right supraorbital, two cervical vertebrae, isolated
        cervical prezygapophysis, partial rib shaft, anterior caudal centrum,
        cervical plate, and a probable additional osteoderm.
      completeness: fragmentary
    erected_in: ulansky2014b
references:
  - id: pereda-suberbiola2013a
    notes: Formal redescription of MACN N-43 as Stegosauria gen. et sp. indet.,
      predating Ulansky (2014)'s informal naming; material is stegosaurian but
      too incomplete to diagnose a new taxon.
  - id: ulansky2014b
    notes: In Russian. Informal DINOLOGIA monograph proposing Amargastegos
      brevicollus for MACN N-43; declared a nomen dubium by Galton and Carpenter
      (2016).
  - id: galton2016a
    notes: Declares Amargastegos brevicollus a nomen dubium on ICZN Art. 13
      grounds (Dinologia venue) and confirms Stegosauria indet. as the correct
      identification of MACN N-43.
