genus: Amargastegos
parent: Stegosauria
placement: incertae sedis
pronunciation:
  phonetic: ah-MAR-guh-STEG-os
etymology: From 'Amarga' (the Argentine La Amarga Formation that yielded the
  type material) and Greek 'stegos' (roof, in reference to stegosaurs);
  intended sense 'La Amarga roof'.
description: >
  Amargastegos is a nomen dubium genus of stegosaurian dinosaur
  informally proposed by Ulansky (2014) for the partial skeleton
  MACN N-43 from the Barremian La Amarga Formation of Neuquén
  Province, Argentina. The same material had previously been
  formally described by Pereda-Suberbiola and colleagues (2013) as
  Stegosauria indet.; they noted differences from other stegosaurs
  suggesting a distinct taxon but judged it too incomplete to name a
  new genus and species. Galton and Carpenter (2016) treated
  Amargastegos brevicollus as a nomen dubium: Ulansky gave no
  description of differentiating characters (ICZN Article 13),
  Dinologia does not meet the ICZN requirements for a valid
  publication, and the material lacks autapomorphies. They confirmed
  Stegosauria indet. as the correct identification of the type
  material.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
appearance:
  integument: armored
  evidence: direct
identifiers:
  - source: pbdb
    id: "374249"
  - source: wikidata
    id: Q19377675
species:
  - name: Amargastegos brevicollus
    etymology: From Latin 'brevis' (short) and 'collum' (neck); meaning
      'short-necked', in reference to the proportionally short cervical
      centra of the type material.
    status: nomen dubium
    type_species: true
    period:
      name:
        - Early Cretaceous
      stage:
        - Barremian
    location:
      country: AR
      locality: La Amarga Creek
      region: AR-Q
      formation: La Amarga
      member: Puesto Antigual
    size:
      length_m:
        min: 4
        max: 5
    type_specimen:
      specimen_id:
        - MACN N-43
      specimen_type: holotype
      institution: MACN
      material: Anterior right supraorbital, two cervical vertebrae, isolated
        cervical prezygapophysis, partial rib shaft, anterior caudal centrum,
        cervical plate, and a probable additional osteoderm.
      completeness: fragmentary
    erected_in: ulansky2014b
references:
  - id: pereda-suberbiola2013a
    notes: Formal redescription of MACN N-43 as Stegosauria gen. et sp. indet.,
      predating Ulansky (2014)'s informal naming; material is stegosaurian but
      too incomplete to diagnose a new taxon.
  - id: ulansky2014b
    notes: In Russian. Informal DINOLOGIA monograph proposing Amargastegos
      brevicollus for MACN N-43; declared a nomen dubium by Galton and Carpenter
      (2016).
  - id: galton2016a
    notes: Treats Amargastegos brevicollus as a nomen dubium (no diagnosis under
      ICZN Art. 13, Dinologia not a valid publication, no autapomorphies);
      confirms MACN N-43 as Stegosauria indet.
