genus: Arenysaurus
parent: Arenysaurini
description: Arenysaurus is a genus of hadrosaurid dinosaur from the Late
  Cretaceous (66 million years ago), being one of the last non-avian dinosaurs
  and it went extinct during the Cretaceous–Paleogene extinction event. It is
  known from a partial skull and skeleton found in the late Maastrichtian-age
  Tremp Formation of the Pyrenees Mountains in Spain. The type species is A.
  ardevoli, described in 2009 by Pereda-Suberbiola et al., a group of
  researchers from Spain. The genus name refers to Arén, where it was found, and
  the specific epithet honours geologist Lluís Ardèvol. Arenysaurus was a
  lambeosaurine, a member of the hadrosaurid subfamily with hollow and
  decorative cranial crests. It is one of the most complete and best dated ever
  found in the Late Cretaceous period.
diet: herbivore
locomotion: facultative
