genus: Arenysaurus
parent: Arenysaurini
etymology: Named for Arén, the town in the Pyrenees of Spain near where it was
  found, combined with Greek 'sauros' meaning 'lizard'.
pronunciation:
  phonetic: ah-REN-ee-SOR-us
description: Arenysaurus is a genus of hadrosaurid dinosaur from the Late
  Cretaceous (66 million years ago), being one of the last non-avian dinosaurs
  and it went extinct during the Cretaceous-Paleogene extinction event. It is
  known from a partial skull and skeleton found in the late Maastrichtian-age
  Tremp Formation of the Pyrenees Mountains in Spain. The type species is A.
  ardevoli, described in 2009 by Pereda-Suberbiola et al., a group of
  researchers from Spain. The genus name refers to Arén, where it was found, and
  the specific epithet honors geologist Lluís Ardèvol. Arenysaurus was a
  lambeosaurine, a member of the hadrosaurid subfamily with hollow and
  decorative cranial crests. It is one of the most complete and best dated ever
  found in the Late Cretaceous period.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
diagnostic_features:
  - Frontal dome very prominent, more developed than in other adult
    lambeosaurines
  - Nearly vertical prequadratic (precotyloid) process of the squamosal and
    jugal process of the postorbital
  - Deltopectoral crest of the humerus oriented anteriorly
  - Short frontals with posterior length/width ratio approximately 0.5
    (approximately two times wider than long)
  - Parietal excluded from the occipital surface of the skull
  - Median ramus of squamosal lower than the paroccipital process
appearance:
  features:
    - hollow cranial crest
  integument: scaled
  evidence: inferred
