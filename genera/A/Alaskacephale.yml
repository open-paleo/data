genus: Alaskacephale
parent: Pachycephalosaurini
etymology: Named for Alaska, where it was discovered, combined with Greek 'kephale' meaning 'head', referring to its pachycephalosaurid dome-headed nature.
description: Alaskacephale is an extinct genus of pachycephalosaurid, a group of
  dome-headed, herbivorous ornithischian dinosaurs, that lived during the
  Maastrichtian stage of the Late Cretaceous period in what is now northern
  Alaska. The genus is one of the few known Arctic dinosaurs and was found in
  the Prince Creek Formation, which preserves a menagerie of fossils. The only
  known specimen, a squamosal bone, was found in 1999 and later described in
  2005. However, Alaskacephale was not formally named until the next year.
diet: herbivore
locomotion: bipedal
