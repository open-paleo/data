genus: Anhuilong
parent: Mamenchisauridae
pronunciation:
  phonetic: ahn-HWAY-long
etymology: Named after Anhui province in China combined with Chinese 'long' meaning 'dragon'; meaning 'Anhui dragon'
description: Anhuilong is a genus of mamenchisaurid dinosaur known from the
  Hongqin Formation of Anhui province, China. The genus contains a single
  species, Anhuilong diboensis.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Lateral edge of deltopectoral crest turns caudolaterally (differs from other
    mamenchisaurids).
  - Lateral accessory process of humerus more robust than medial one (reversed
    from other Mamenchisauridae).
  - Ratio of total length of radius to humerus is 0.50, the lowest value among
    mamenchisaurids.
  - Ratio of total length of ulna to humerus is 0.56, the lowest value among
    mamenchisaurids.
  - Elliptical cross-sectional shape of ulna at mid-shaft with highest
    transverse-to-craniocaudal diameter ratio among mamenchisaurids.
  - Nearly perpendicular orientation of proximal end of ulna relative to long
    axis of ulnar shaft.
