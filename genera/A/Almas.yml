genus: Almas
parent: Troodontidae
etymology: "From Mongolian 'almas', a 'wild man'-like creature in Mongolian folklore."
pronunciation:
  phonetic: al-mass
description: Almas is a genus of troodontid theropod dinosaur from the Late
  Cretaceous of Mongolia. It contains a single species, Almas ukhaa, named in
  2017 by Pei Rui and colleagues, based on a partial articulated skeleton. The
  only known specimen was found in the Djadochta Formation, which is late
  Campanian in age.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - arid
diagnostic_features:
  - Posteriorly curved pterygoid flange
  - Absence of a lateral groove on the anterior part of the dentary
  - Distinct spikelike process extending from the anterior edge of the obturator
    process at the distal one-third of the ischium
  - Third chevron more than three times as long as the corresponding caudal
    vertebra
appearance:
  integument: feathered
  evidence: direct
