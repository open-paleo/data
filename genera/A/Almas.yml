genus: Almas
parent: Troodontidae
placement: incertae sedis
dispute:
  summary: >
    Almas is recovered as the earliest-diverging member of a Late Cretaceous
    troodontid clade (Pei et al., 2017, 2022) and as one node closer to
    Troodontinae than Sinovenatorinae by Hartman et al. (2019); some earlier
    analyses placed it in Jinfengopteryginae (Turner et al., 2012). It is placed at
    Troodontidae incertae sedis pending resolution.
  history:
    - date: "2026-07-01"
      note: Placed at Troodontidae incertae sedis (least-inclusive uncontested clade); basal Late Cretaceous position not assignable to a subfamily.
etymology: "From Mongolian 'almas', a 'wild man'-like creature in Mongolian folklore."
pronunciation:
  phonetic: al-mass
description: Almas is a genus of troodontid theropod dinosaur from the Late
  Cretaceous of Mongolia. It contains a single species, Almas ukhaa, named in
  2017 by Pei Rui and colleagues, based on a partial articulated skeleton. The
  only known specimen was found in the Djadochta Formation, which is late
  Campanian in age.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - arid
diagnostic_features:
  - Posteriorly curved pterygoid flange
  - Absence of a lateral groove on the anterior part of the dentary
  - Distinct spikelike process extending from the anterior edge of the obturator
    process at the distal one-third of the ischium
  - Third chevron more than three times as long as the corresponding caudal
    vertebra
appearance:
  integument: feathered
  evidence: direct
identifiers:
  - source: pbdb
    id: "391227"
species:
  - name: Almas ukhaa
    etymology: "Named for the locality of Ukhaa Tolgod in Mongolia, discovered in 1993, where the holotype specimen was collected."
    status: valid
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Campanian
    location:
      country: MN
      locality: Ukhaa Tolgod
      region: MN-053
      formation: Djadochta
    type_specimen:
      specimen_id: [IGM 100/1323]
      specimen_type: holotype
      institution: MPC
      material: Nearly complete and articulated cranium (skull and mandible) with
        partial articulated postcranial skeleton including sacral and proximal caudal
        vertebrae, partial pelvic girdle, and partial hind limbs
      completeness: complete
    size:
      length_m:
        min: 0.75
        max: 0.75
      weight_kg:
        min: 1
        max: 1
      hip_height_m:
        min: 0.2
        max: 0.2
    erected_in: pei2017a
