genus: Afrovenator
parent: Eustreptospondylinae
pronunciation:
  ipa: /ˌæfroʊvɪˈneɪtər/
etymology: "From Latin 'Afro' referring to Africa and 'venator' meaning 'hunter', meaning 'African hunter'."
description: Afrovenator is an extinct genus of megalosaurid theropod dinosaur
  from the Middle or Late Jurassic Tiourarén Formation and maybe the Irhazer II
  Formation of the Sahara region of Niger in western Africa. Afrovenator
  represents the only named definitive Gondwanan megalosaur, with proposed
  material of the group present in the Tacuarembó Formation of Uruguay and the
  Tendaguru Formation of Tanzania, both dated to the Late Jurassic.
diet: carnivore
locomotion: bipedal
