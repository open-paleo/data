genus: Alocodon
parent: Ornithischia
placement: incertae sedis
etymology: From Greek 'alotrou' (a furrow) and 'odous' (tooth);
  meaning 'furrow tooth', alluding to the ribs and furrows
  ornamenting the lingual surfaces of the cheek crowns.
pronunciation:
  phonetic: a-LOK-o-don
description: >
  Alocodon is a genus of ornithischian dinosaur known from
  multiple teeth from the Middle or Late Jurassic Cabaços
  Formation of Portugal, and also the Forest Marble and
  Chipping Norton Formations of England. A single species is
  known, A. kuehnei.
dispute:
  summary: >
    Alocodon is a nomen dubium based on isolated teeth from the Middle to
    Late Jurassic of Portugal; its affinities are highly uncertain, having
    been suggested to be an ornithopod or a thyreophoran but not
    demonstrable (Jones, 2026). It was formerly placed in the deprecated
    Fabrosauridae.
  history:
    - date: "2026-06-29"
      note: Reparented from the deprecated Fabrosauridae to Ornithischia incertae sedis; tooth-based nomen dubium.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
  - coastal
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: wikidata
    id: Q1920588
species:
  - name: Alocodon kuehnei
    etymology: Honors Professor W. G. Kühne, whose work in
      Portugal in the 1960s yielded the Pedrógão
      microvertebrate fauna from which the type teeth came.
    status: nomen dubium
    type_species: true
    period:
      name:
        - Middle Jurassic
        - Late Jurassic
      stage:
        - Callovian
        - Oxfordian
    location:
      country: PT
      region: PT-10
      formation: Cabaços
      notes: >
        Thulborn (1973) writes that "The Pedrógão horizon is probably of
        Callovian age", and Mateus and Milàn (2009) give it as
        Oxfordian, after Azerêdo and colleagues (2002).
    type_specimen:
      specimen_id:
        - IPFUB P X 2
      specimen_type: holotype
      institution: MG
      material: A single cheek-tooth crown from the Upper Callovian marls.
      completeness: fragmentary
      notes: A single premaxillary tooth crown, IPFUB P X 1, is the designated
        paratype. Originally held at the Lehrstuhl für Paläontologie of the Free
        University, Berlin, and marked with the acronym IPFUB; the material is
        now in the Museu Geológico, Lisbon.
    erected_in: thulborn1973a
references:
  - id: thulborn1973a
    notes: Originally placed Alocodon in Hypsilophodontidae; a 1974 postscript
      revised it into Fabrosauridae.
  - id: jones2026a
    notes: Placement and assessment in the Princeton Encyclopedia of Dinosaurs.
  - id: mateus2009b
    notes: Records the type material as held by the Museu Geológico, formerly
      under the acronym IPFUB.
  - id: weishampel1990a
    notes: Calls Alocodon kuehnei a nomen dubium.
  - id: azerêdo2002a
    notes: >
      The source of the Oxfordian age Mateus and Milàn (2009) give the
      Pedrógão horizon.
