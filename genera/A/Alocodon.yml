genus: Alocodon
parent: Ornithischia
etymology: From Greek 'alotrou' (a furrow) and 'odous' (tooth);
  meaning 'furrow tooth', alluding to the ribs and furrows
  ornamenting the lingual surfaces of the cheek crowns.
pronunciation:
  phonetic: a-LOK-o-don
description: >
  Alocodon is a genus of ornithischian dinosaur known from
  multiple teeth from the Middle or Late Jurassic Cabaços
  Formation of Portugal, and also the Forest Marble and
  Chipping Norton Formations of England. A single species is
  known, A. kuehnei.
dispute:
  summary: >
    Alocodon is a nomen dubium based on isolated teeth from the Middle to
    Late Jurassic of Portugal; its affinities are highly uncertain, having
    been suggested to be an ornithopod or a thyreophoran but not
    demonstrable (Jones, 2026). It was formerly placed in the deprecated
    Fabrosauridae.
  history:
    - date: "2026-06-29"
      note: Reparented from the deprecated Fabrosauridae to Ornithischia incertae sedis; tooth-based nomen dubium.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
  - coastal
diagnostic_features:
  - Heterodont dentition with fully and uniformly enamelled
    tooth crowns.
  - Buccal surfaces of crowns smooth and inflated; lingual
    surfaces ornamented with fine vertical ribs.
  - Anterior premaxillary crowns tall, acutely conical,
    recurved, often with a shoulder-like swelling of the
    distal margin near the cervix.
  - Cheek crowns with occlusal tip formed by a single large
    denticle; lingual surface with short cingula near the
    distal (and often mesial) margin, sometimes elaborated
    into small denticles.
  - Posterior cheek crowns depressed, much longer than high,
    with large marginal denticles; cingula weak or absent.
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: wikidata
    id: Q1920588
species:
  - name: Alocodon kuehnei
    etymology: Honors Professor W. G. Kühne, whose work in
      Portugal in the 1960s yielded the Pedrógão
      microvertebrate fauna from which the type teeth came.
    status: nomen dubium
    type_species: true
    period:
      name:
        - Middle Jurassic
      stage:
        - Callovian
      from_ma: 166.1
      to_ma: 163.5
    location:
      country: PT
      region: Praia de Pedrógão, Leiria District
      formation: Cabaços Formation
    holotype:
      specimen_id:
        - IPFUB P X 2
      specimen_type: holotype
      institution: IPFUB
      material: A single cheek-tooth crown from the Upper Callovian marls.
      completeness: fragmentary
    erected_in: thulborn1973a
references:
  - id: thulborn1973a
    notes: Originally placed Alocodon in Hypsilophodontidae; a 1974 postscript
      revised it into Fabrosauridae. Weishampel and Witmer (1990) called A.
      kuehnei a nomen dubium.
  - id: jones2026a
    notes: Placement and assessment in the Princeton Encyclopedia of Dinosaurs.
