genus: Aepyornithomimus
parent: Ornithomimidae
etymology: Named after Aepyornis (the extinct elephant bird) combined with Greek 'mimos' meaning 'mimic'; meaning 'Aepyornis mimic'
pronunciation:
  phonetic: ee-PEE-or-NITH-o-MIEM-us
description: Aepyornithomimus is a genus of ornithomimid theropod dinosaur from
  the Late Cretaceous Djadochta Formation of Mongolia. It lived in the
  Campanian, around 75 million years ago, when the area is thought to have been
  a desert. The type and only species is A. tugrikinensis.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - arid
diagnostic_features:
  - Unevenly developed pair of concavities on the posterior margin of distal
    tarsal III, with the medial concavity deeper than the lateral
  - Robust distal articular caput of second metatarsal in dorsal view, nearly as
    wide as distal articulation of Mt III
  - Unusual curved contact between proximal ends of Mt II and Mt IV (straight in
    all other ornithomimosaurs)
  - Elongate fourth digit relative to derived ornithomimosaurs, with
    mediolaterally slender successive phalanges
  - Medial condyle of phalanx IV-1 inclined laterally at ~35°, greater than in
    any other known ornithomimosaur
  - Proximoventral ridge of phalanx II-1 forming a rounded curvature
    (rectilinear in other ornithomimosaurs)
