genus: Ajkaceratops
parent: Ceratopsia
description: Ajkaceratops is a genus of ceratopsian dinosaur described in 2010.
  It lived during the Late Cretaceous in the western Tethyan archipelago, in
  what is now Europe. The type species, A. kozmai, was originally described as a
  ceratopsian most closely related to forms in east Asia, from where its
  ancestors may have migrated by island-hopping. Later research, however,
  questioned this assignment and treated Ajkaceratops as an ornithischian of
  unresolved affinity. In 2026, more complete cranial remains referable to the
  species were described, supporting its placement as a ceratopsian.
diet: herbivore
