genus: Ajkaceratops
parent: Ceratopsia
placement: incertae sedis
etymology: Named for Ajka, the town in Hungary near where it was discovered, combined with Greek 'keratops' meaning 'horned face'.
pronunciation:
  phonetic: OI-ka-SEH-ruh-tops
description: Ajkaceratops is a genus of ceratopsian dinosaur described in 2010.
  It lived during the Late Cretaceous in the western Tethyan archipelago, in
  what is now Europe. The type species, A. kozmai, was originally described as a
  ceratopsian most closely related to forms in east Asia, from where its
  ancestors may have migrated by island-hopping. Later research, however,
  questioned this assignment and treated Ajkaceratops as an ornithischian of
  unresolved affinity. In 2026, more complete cranial remains referable to the
  species were described, supporting its placement as a ceratopsian.
dispute:
  summary: >
    Ajkaceratops kozmai is a bizarre European ornithischian of contested
    affinity. Its redescribers (Czepiński and Madzia, 2024) classify it
    only as ?Ceratopsia, noting that a ceratopsian position depends on
    interpreting its anterior snout element as a rostral and that it may
    not be a ceratopsian at all; Bertozzo and others (2025) recovered
    it as a non-ceratopsian basal ornithopod, sister to Changmiania,
    only under an alternate scoring of the snout element — their main
    analysis retained it within Ceratopsia. Maidment and others (2026), working
    from a much more complete referred skull, again recover it as a
    ceratopsian near the Ceratopsoidea.
  history:
    - date: "2026-06-27"
      note: Placed at Ceratopsia incertae sedis following Czepiński and
        Madzia (2024); the finer ceratopsoid placement of Maidment and
        others (2026) and the possibility of a non-ceratopsian identity
        both reflected, not adopted.
    - date: "2026-07-09"
      note: Re-evaluated; Ceratopsia incertae sedis retained.
        The non-ceratopsian result of Bertozzo and others (2025),
        recovered only under an alternate snout scoring, is outweighed by the
        more complete referred skull of Maidment and others (2026); Czepiński
        and Madzia (2024) mostly recovered it within or close to Ceratopsia.
        The finer near-Ceratopsoidea (sister to Zuniceratops) position of
        Maidment and others holds only in their implied-weights parsimony
        analysis and is not adopted.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Large oval accessory fenestra present between premaxilla and maxilla, with
    nasal excluded from its margin
  - Part of premaxilla ventral to external naris and accessory fenestra is
    dorsoventrally shallow relative to its rostrocaudal length
  - Caudolateral process of premaxilla curved along its length, becoming nearly
    horizontal caudally
  - Buccal margins of predentary are sharp and not bevelled
appearance:
  features:
    - keratinous beak
  integument: scaled
  evidence: inferred
