genus: Ajkaceratops
parent: Ceratopsia
etymology: Named for Ajka, the town in Hungary near where it was discovered, combined with Greek 'keratops' meaning 'horned face'.
pronunciation:
  phonetic: OI-ka-SEH-ruh-tops
description: Ajkaceratops is a genus of ceratopsian dinosaur described in 2010.
  It lived during the Late Cretaceous in the western Tethyan archipelago, in
  what is now Europe. The type species, A. kozmai, was originally described as a
  ceratopsian most closely related to forms in east Asia, from where its
  ancestors may have migrated by island-hopping. Later research, however,
  questioned this assignment and treated Ajkaceratops as an ornithischian of
  unresolved affinity. In 2026, more complete cranial remains referable to the
  species were described, supporting its placement as a ceratopsian.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Large oval accessory fenestra present between premaxilla and maxilla, with
    nasal excluded from its margin
  - Part of premaxilla ventral to external naris and accessory fenestra is
    dorsoventrally shallow relative to its rostrocaudal length
  - Caudolateral process of premaxilla curved along its length, becoming nearly
    horizontal caudally
  - Buccal margins of predentary are sharp and not bevelled
appearance:
  features:
    - keratinous beak
  integument: scaled
  evidence: inferred
