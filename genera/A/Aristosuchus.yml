genus: Aristosuchus
parent: Compsognathidae
etymology: From Ancient Greek aristos (ἄριστος) meaning 'bravest, best, noblest' + Soukhos (σοῦχος), the Ancient Greek form of the name of the Egyptian crocodile-headed god Sobek; overall meaning 'best/noblest Sobek'.
pronunciation:
  phonetic: ah-RIS-toe-SOOK-us
description: Aristosuchus is a genus of small coelurosaurian dinosaur that lived
  in the Early Cretaceous period (Barremian stage, sometime between 130 and 123
  million years ago) of what is now England, UK. The type and only species is
  Aristosuchus pusillus, originally referred to the carnosaurian genus
  Poekilopleuron.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Sacrum of five vertebrae in which each centrum supports its own neural arch
    (neural foramen not shifted to overlap adjacent centrum, unlike
    Megalosaurus)
  - Sacral transverse processes arise from individual vertebrae, not at the
    junction between centra
  - Sacral centra strongly constricted from side to side, with transverse
    midpoint measurement only 7-8 mm despite 2.2 cm wide articular faces
  - Pubes rod-like and anteriorly directed, converging distally and uniting with
    a horizontal posterior keel - a Coelurus/Allosaurus-type pubis not
    previously recorded from Britain
  - Metapophyses (accessory lateral neural spines) developed on third and fourth
    sacral vertebrae, indicated as ridges on second and fifth
