genus: Asfaltovenator
parent: Allosauroidea
dispute:
  summary: >
    The phylogenetic position of Asfaltovenator vialidadi is unstable. Its
    describers recovered it as a basal allosauroid and noted that its mosaic of
    megalosauroid and allosauroid characters destabilizes tetanuran topology
    (Rauhut and Pol, 2019); Jones and Viola (2026) likewise treat it as a basal
    allosauroid outside both Allosauria and Metriacanthosauridae. Other analyses
    instead place it within Allosauridae as the sister taxon of Allosaurus (Rauhut
    et al., 2024; Kellermann et al., 2025). It is placed conservatively at
    Allosauroidea incertae sedis.
  history:
    - date: "2026-07-02"
      note: Placed at Allosauroidea incertae sedis; recovered as a basal allosauroid by Rauhut and Pol (2019) but within Allosauridae by later analyses.
pronunciation:
  phonetic: as-FAHL-toh-ven-AY-tor
etymology: From the Cañadón Asfalto Formation (the fossil formation where remains were found, named for asphalt deposits) + Latin venator meaning 'hunter'; overall meaning 'Cañadón Asfalto Formation hunter'.
description: Asfaltovenator is a genus of possibly allosauroid dinosaur from the
  Early to Middle Jurassic Cañadón Asfalto Formation of Chubut Province,
  Argentina. The type and only species is Asfaltovenator vialidadi.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
diagnostic_features:
  - Premaxillary teeth with well-developed distal but only minute mesial
    serrations
  - Exoccipital with pronounced horizontal ridges between paroccipital processes
    and foramen magnum
  - Neural spines of cervical vertebrae three and four triangular and backswept
  - Dorsals 11 and 12 with small additional anterior centrodiapophyseal lamina
  - Articulated metacarpus broader than long
  - Manual digit III significantly more slender and shorter than digits I and II
appearance:
  features:
    - brow horns
  integument: scaled
  evidence: inferred
