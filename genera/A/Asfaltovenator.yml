genus: Asfaltovenator
parent: Allosauroidea
etymology: From the Cañadón Asfalto Formation (the fossil formation where remains were found, named for asphalt deposits) + Latin venator meaning 'hunter'; overall meaning 'Cañadón Asfalto Formation hunter'.
description: Asfaltovenator is a genus of possibly allosauroid dinosaur from the
  Early to Middle Jurassic Cañadón Asfalto Formation of Chubut Province,
  Argentina. The type and only species is Asfaltovenator vialidadi.
diet: carnivore
locomotion: bipedal
