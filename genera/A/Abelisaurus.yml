genus: Abelisaurus
parent: Abelisauridae
dispute:
  summary: >
    The position of Abelisaurus is unresolved and it behaves as a wildcard
    taxon. It has been recovered as an unstable wildcard among the derived
    abelisaurids (Carrano and Sampson, 2008), within Furileusauria as a
    relative of Carnotaurus and
    Aucasaurus (Filippi and colleagues, 2016; Gianechini and colleagues,
    2021), within Carnotaurini (Tortosa and colleagues, 2014), and within
    Majungasaurinae (Pol and colleagues, 2024).
  history:
    - date: "2026-06-30"
      note: >
        Placed at Abelisauridae, the least-inclusive uncontested node, given
        its instability.
pronunciation:
  phonetic: ah-BEL-i-SAWR-us
  ipa: /əˌbɛlɪˈsɔːrəs/
etymology: "Named for Roberto Abel, discoverer of the type specimen and former
  director of the provincial Museum of Cipolletti, combined with Greek 'sauros'
  meaning 'lizard'."
description: Abelisaurus is a genus of predatory abelisaurid theropod dinosaur
  which lived during the Late Cretaceous Period (Campanian) of what is now South
  America. It was a bipedal carnivore that probably reached about 7.4 meters (24
  ft 3 in) in length, although this is uncertain as it is known from only one
  partial skull.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Antorbital fenestra proportionally larger than in Tyrannosauridae; small
    accessory antorbital fenestra on anterior border of antorbital fossa
  - Interorbital region wider than other carnosaurs with lateral contact
    external to lacrimal and postorbital forming orbital overhang
  - Orbital fenestra very tall with low jugal; orbit nearly closed ventrally
  - Squamosal projects nearly horizontally backward with quadratojugal process
    directed ventrally rather than anteriorly
  - Quadrate notably longer than in Tyrannosauridae; transversely wide distally
  - Lower temporal fenestra very wide in both directions, notably larger than in
    Tyrannosauridae
appearance:
  features:
    - cranial bosses
  integument: scaled
  evidence: inferred
