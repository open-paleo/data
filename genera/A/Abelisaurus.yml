genus: Abelisaurus
parent: Abelisaurinae
pronunciation:
  phonetic: ah-BEL-i-SAWR-us
  ipa: /əˌbɛlɪˈsɔːrəs/
etymology: "Named for Roberto Abel, discoverer of the type specimen and former
  director of the provincial Museum of Cipolletti, combined with Greek 'sauros'
  meaning 'lizard'."
description: Abelisaurus is a genus of predatory abelisaurid theropod dinosaur
  which lived during the Late Cretaceous Period (Campanian) of what is now South
  America. It was a bipedal carnivore that probably reached about 7.4 metres (24
  ft 3 in) in length, although this is uncertain as it is known from only one
  partial skull.
diet: carnivore
locomotion: bipedal
