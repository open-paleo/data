genus: Atlascopcosaurus
parent: Elasmaria
pronunciation:
  phonetic: AT-las-KOP-ko-SAWR-us
  ipa: /ˌætləsˌkɒpkəˈsɔːrəs/
etymology: "Named for Atlas Copco, the company whose equipment sponsored the
  Dinosaur Cove excavation in Australia, combined with Greek 'sauros' meaning
  'lizard'."
description: Atlascopcosaurus is a genus of herbivorous basal iguanodont
  dinosaur from the Early Cretaceous Eumeralla Formation of Australia.
dispute:
  summary: >
    Atlascopcosaurus loadsi is based on limited material; it is
    recovered in Elasmaria by recent analyses but treated as a nomen
    dubium by some and placed in an unnamed basal-iguanodontian clade by
    Boyd (2015).
  history:
    - date: "2026-06-29"
      note: Placed at Elasmaria following recent analyses; nomen dubium.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - polar
appearance:
  integument: scaled
  evidence: inferred
diagnostic_features:
  - Upper cheek teeth with the crown apex set close to the posterior margin rather
    than midway along the tooth
  - Upper cheek teeth bearing at least eight ridges, divided into a prominent
    primary ridge and markedly weaker secondary ridges rather than a gradation
  - Primary ridge of the upper cheek teeth positioned near the posterior margin of
    the buccal surface
  - Anteriormost secondary ridge projecting noticeably farther from the tooth
    surface than the other secondary ridges
  - Ridges confined to the principal surface (buccal in uppers, lingual in
    lowers), extending nearly to the base of the crown and absent or faint on the
    opposite face of unworn teeth
  - Lower cheek teeth with a relatively weak primary ridge
