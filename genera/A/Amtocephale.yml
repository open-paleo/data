genus: Amtocephale
parent: Pachycephalosauridae
etymology: Named for the Amtgai locality in Mongolia where it was found,
  combined with Greek 'kephale' meaning 'head'.
pronunciation:
  phonetic: AM-tuh-SEF-uh-lee
description: Amtocephale is a genus of pachycephalosaurid dinosaur from early
  Late Cretaceous (Cenomanian-Coniacian stages) deposits of southern Gobi
  Desert, Mongolia.
dispute:
  summary: >
    Amtocephale is known from a single subadult dome (Watabe and colleagues,
    2011), and its subfamily placement varies between analyses. Schott and
    Evans (2016) recover it as the basal branch of Pachycephalosaurinae, and
    Evans and colleagues (2021) and Dyer and colleagues (2023) place it in
    an unresolved pachycephalosaurine polytomy, while Chinzorig and
    colleagues (2025) recover it with Stegoceras and Foraminacephale and
    Woodruff and colleagues (2025) leave it in a basal polytomy of
    Pachycephalosauridae.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Deep supratemporal fossae
  - Broad (craniocaudally) prefrontal sutural surfaces with the nasal;
    prefrontal and anterior supraorbital sutural surfaces lying in a single
    plane
  - "Short parietal: parietal length to frontoparietal length ratio of 2.44
    (highest ratio among known pachycephalosaurids)"
  - Posteromedial extension of the parietal sharply downturned and wide relative
    to the maximum width of the frontoparietal
  - Supratemporal fenestrae absent
appearance:
  features:
    - cranial dome
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "267679"
  - source: wikidata
    id: Q377190
  - source: gbif
    id: "8642239"
species:
  - name: Amtocephale gobiensis
    etymology: "Named for the Gobi Desert of Mongolia, where the fossil was
      discovered in the Bayanshiree Formation at the Amtgai locality."
    status: valid
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Turonian
        - Coniacian
        - Santonian
    location:
      country: MN
      locality: Amtgai
      region: MN-053
      formation: Bayanshiree
    size:
      length_m:
        min: 0.7
        max: 0.7
    type_specimen:
      specimen_id: [ MPC-D 100/1203 ]
      specimen_type: holotype
      institution: MPC
      material: Nearly complete frontoparietal dome
      completeness: fragmentary
    erected_in: watabe2011a
references:
  - id: watabe2011a
    notes: Named Amtocephale and described the holotype as subadult.
  - id: jones2026a
    notes: Source of the body length estimate, and the appearance features.
  - id: schott2016a
    notes: Recovered Amtocephale as the basal branch of Pachycephalosaurinae.
  - id: evans2021a
    notes: Recovered Amtocephale in an unresolved pachycephalosaurine polytomy.
  - id: dyer2023a
    notes: Recovered Amtocephale in an unresolved pachycephalosaurine polytomy, and pruned it from the agreement subtree.
  - id: chinzorig2025a
    notes: Recovered Amtocephale as the sister of Stegoceras plus Foraminacephale.
  - id: woodruff2025a
    notes: Recovered Amtocephale in a basal polytomy of Pachycephalosauridae.
