genus: Amtocephale
parent: Pachycephalosauridae
etymology: Named for the Amtgai locality in Mongolia where it was found,
  combined with Greek 'kephale' meaning 'head'.
description: Amtocephale is a genus of pachycephalosaurid dinosaur from early
  Late Cretaceous (Cenomanian-Coniacian stages) deposits of southern Gobi
  Desert, Mongolia.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Deep supratemporal fossae
  - Broad (craniocaudally) prefrontal sutural surfaces with the nasal;
    prefrontal and anterior supraorbital sutural surfaces lying in a single
    plane
  - "Short parietal: parietal length to frontoparietal length ratio of 2.44
    (highest ratio among known pachycephalosaurids)"
  - Posteromedial extension of the parietal sharply downturned and wide relative
    to the maximum width of the frontoparietal
  - Supratemporal fenestrae absent
