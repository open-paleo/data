    size:
      length_m:
        min: 0.7
        max: 0.7
    type_specimen:
      specimen_id: [ MPC-D 100/1203 ]
      specimen_type: holotype
      institution: MPC
      material: Nearly complete frontoparietal dome
      completeness: fragmentary
    erected_in: watabe2011a
