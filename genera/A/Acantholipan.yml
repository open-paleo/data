genus: Acantholipan
parent: Nodosauridae
etymology: From Greek 'akanthos' meaning 'spine' and 'lipán', the Spanish designation for the Lépai-Ndé (Lipan Apache) people of the region where it was found.
pronunciation:
  phonetic: ah-can-tho-lee-pan
description: Acantholipan is a genus of herbivorous nodosaurid dinosaur from
  Mexico from the early Santonian age of the Late Cretaceous. It includes one
  species, Acantholipan gonzalezi.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - coastal
diagnostic_features:
  - Ulna with anterolateral process prominent, tapering, and truncated
    proximally (triangular in lateral view), equal in length to the olecranon
    process (1:1 ratio).
  - Conical and slightly caudally curved lateral thoracic osteoderm with a
    longitudinal oval cross section (length/width ratio 1:3).
  - Vascular grooves on the lateral face of the osteodermal spine only.
appearance:
  features:
    - body armor
    - dorsal spines
  integument: armored
  evidence: direct
identifiers:
  - source: pbdb
    id: "377303"
  - source: wikidata
    id: Q54851240
