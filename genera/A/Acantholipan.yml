genus: Acantholipan
parent: Nodosauridae
etymology: From Greek 'akanthos' meaning 'spine' and 'lipán', the Spanish designation for the Lépai-Ndé (Lipan Apache) people of the region where it was found.
description: Acantholipan is a genus of herbivorous nodosaurid dinosaur from
  Mexico from the early Santonian age of the Late Cretaceous. It includes one
  species, Acantholipan gonzalezi.
diet: herbivore
