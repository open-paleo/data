etymology: "Named for the late Ana Maria Biset, an influential archaeologist from Neuquén Province, Argentina, where the remains were found."
description: Anabisetia is a genus of ornithopod dinosaur from the Late
  Cretaceous Period of Patagonia, South America. It was a small bipedal
  herbivore, around 2 metres (6 ft 7 in) long.
