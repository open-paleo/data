genus: Anabisetia
parent: Elasmaria
pronunciation:
  ipa: /ˌɑːnəbiːˈsɛtiə/
  phonetic: AH-nuh-bee-SET-ee-uh
etymology: "Named for the late Ana Maria Biset, an influential archaeologist from Neuquén Province, Argentina, where the remains were found."
description: Anabisetia is a genus of ornithopod dinosaur from the Late
  Cretaceous Period of Patagonia, South America. It was a small bipedal
  herbivore, around 2 meters (6 ft 7 in) long.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Cranioventrally oriented occipital condyle
  - Fifth metacarpal transversely flattened with sharp lateral borders
  - Scapula with exceptionally strong and well-developed acromial process,
    stronger than in any other ornithopod
  - Ilium with preacetabular process longer than 50% of total ilium length; when
    articulated reaches the same anterior point as the prepubic process
  - Ischiadic shaft triangular proximally and quadrangular distally in cross
    section
  - Tarsus with fibula-astragalar contact
