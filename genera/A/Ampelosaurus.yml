    species: Ampelosaurus atacis
    category: most-complete
    significance: "Relatively complete, partially articulated young-adult skeleton with an almost complete disarticulated skull, taking several seasons to excavate. Helps make Ampelosaurus one of the best-known dinosaurs in France, though it remains undescribed."
    discovered:
      year: 2001
