genus: Ampelosaurus
parent: Lirainosaurinae
etymology: From Greek 'ampelos' meaning 'vine' (specifically grapevine) and
  'sauros' meaning 'lizard'; meaning 'vine lizard'
pronunciation:
  phonetic: AM-pi-loh-SOR-uhs
  ipa: /ˌæmpɪloʊˈsɔːrəs/
description: Ampelosaurus is a titanosaurian sauropod dinosaur from the Late
  Cretaceous Period of what is now France. Its type species is A. atacis, named
  by Le Loeuff in 1995. Its remains were found in a level dating from 71.5
  million years ago, representing the early Maastrichtian.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - wetland
diagnostic_features:
  - Teeth weakly spatulate (willow-leaf shape with thin rostral and caudal
    expansions, in contrast to cylindrical titanosaur teeth)
  - Distal extremity of the neural spine of the dorsal vertebrae widened
    laterally
  - Neural arch of the dorsal vertebrae strongly inclined toward the rear
  - Absence of distal expansion of the scapular blade (blade narrows distally,
    triangular shape)
  - Light ventral crest of the scapula, behind the glenoid fossa
  - Presence of osteoderms (plates, bulbs, and spines)
appearance:
  features:
    - osteoderms
    - body armor
  integument: armored
  evidence: direct
