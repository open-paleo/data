genus: Ankylosaurus
parent: Ankylosaurinae
etymology: From Greek 'ankylos' (fused, bent) and 'sauros' (lizard), referring
  to the coossified plates of the skull and the fused vertebral elements.
pronunciation:
  ipa: /ˌæŋkəloʊˈsɔːrəs/
  phonetic: ANG-kuh-loh-SOR-uhs
description: Ankylosaurus is the type genus of Ankylosauridae and the
  monospecific containing Ankylosaurus magniventris, an iconic North American
  ankylosaurid known from the latest-Maastrichtian Hell Creek (Montana),
  Scollard (Alberta), and Lance (Wyoming) Formations. Erected by Barnum
  Brown in 1908 on a partial skeleton (AMNH 5895) collected by Peter Kaisen
  near Gilbert Creek, Montana, the genus has since been treated in several
  descriptive works — Carpenter (2004) and Arbour and Mallon (2017) both
  redescribing its anatomy, and Arbour and Currie (2015) erecting the tribe
  Ankylosaurini with Ankylosaurus as its name-bearer. Despite a 100+
  year history of armor-arrangement debates and only a handful of partial
  specimens, Ankylosaurus is among the largest and most-derived ankylosaurids,
  with a heavily coossified cranial roof, a fully fused tail club, and dental
  proportions (high tooth count, premaxillary-sinus-driven nare displacement)
  that distinguish it from coeval Edmontonia. Stratigraphic and sedimentary
  data indicate a preference for upland facies, in contrast to the coastal
  lowland setting that yielded most Edmontonia material.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
appearance:
  features:
    - body armor
    - osteoderms
    - tail club
  integument: armored
diagnostic_features:
  - Nasal vestibule roofed entirely by the loreal caputegulum (rather than by
    the supranarial caputegulum as in Anodontosaurus, Euoplocephalus,
    Scolosaurus, Ziapelta, and Zuul); external nares open ventrolaterally and
    are not visible in anterior view.
  - Loreal caputegulum laterally expanded and bulbous, expanding onto the
    anterior surface of the premaxillary beak and overhanging the lateral
    surface of the maxilla.
  - 34-36 proportionally small maxillary teeth, crown height less than 2% of
    basal skull length — a greater tooth count than in Anodontosaurus or
    Euoplocephalus.
  - Keel of the anterior and posterior supraorbital caputegulae continuous
    with the keel of the squamosal horn (discontinuous in Anodontosaurus,
    Euoplocephalus, and Scolosaurus).
  - Tail-club handle vertebrae with U-shaped neural spines in dorsal view
    (V-shaped in most other ankylosaurids); neural arch of the handle
    vertebrae at least twice as wide as in Anodontosaurus and Euoplocephalus
    of equivalent length.
  - Substantially larger body size than all other known Laramidian
    ankylosaurines, with skull width across the supraorbitals 35-70% greater
    than the largest known skulls of contemporaneous relatives.
