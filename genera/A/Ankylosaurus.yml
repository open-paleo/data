genus: Ankylosaurus
parent: Ankylosaurini
etymology: From Greek 'ankylos' (fused, bent) and 'sauros' (lizard), referring
  to the coossified plates of the skull and the fused vertebral elements.
pronunciation:
  ipa: /ˌæŋkəloʊˈsɔːrəs/
  phonetic: ANG-kuh-loh-SOR-uhs
description: Ankylosaurus is the type genus of Ankylosauridae and the
  monospecific containing Ankylosaurus magniventris, an iconic North American
  ankylosaurid known from the latest-Maastrichtian Hell Creek (Montana),
  Scollard (Alberta), and Lance (Wyoming) Formations. Erected by Barnum
  Brown in 1908 on a partial skeleton (AMNH 5895) collected by Peter Kaisen
  near Gilbert Creek, Montana, the genus has been redescribed twice — by
  Carpenter (2004) and by Arbour and Currie (2015), the latter erecting the
  tribe Ankylosaurini with Ankylosaurus as its name-bearer. Despite a 100+
  year history of armor-arrangement debates and only a handful of partial
  specimens, Ankylosaurus is among the largest and most-derived ankylosaurids,
  with a heavily coossified cranial roof, a fully fused tail club, and dental
  proportions (high tooth count, premaxillary-sinus-driven nare displacement)
  that distinguish it from coeval Edmontonia. Stratigraphic and sedimentary
  data indicate a preference for upland facies, in contrast to the coastal
  lowland setting that yielded most Edmontonia material.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
appearance:
  integument: armored
diagnostic_features:
  - External nares open ventrolaterally, with the narial opening not visible
    in anterior view; lateral displacement driven by pneumatic expansion of
    the premaxillary sinuses.
  - Cranial ornamentation of large, flat polygonal caputegulae, with the
    frontonasal caputegulae hexagonal and a large diamond-shaped internarial
    scale.
  - Keel of the anterior and posterior supraorbital caputegulae continuous
    with the keel of the squamosal horn.
  - Large triangular osteoderms fused to the postorbital + squamosal and to
    the jugal + quadratojugal, projecting posterodorsolaterally and
    posteroventrolaterally respectively.
  - Highest cheek-tooth count among ankylosaurids (34-35 maxillary,
    35-36 dentary).
  - Quadrate process of the pterygoid directed laterally rather than
    posterolaterally.
  - Neural arch of tail-club handle vertebrae exceptionally broad — at least
    twice as wide as in closely related ankylosaurins — with U-shaped neural
    spines in dorsal view.
  - Tail-club knob approximately as wide as long, with body-armor plates
    smooth-textured and bearing a sharp edge or low keel along one margin.
