references:
  - id: brown1908a
    notes: Erects both the genus Ankylosaurus and the family Ankylosauridae on
      AMNH 5895 from the Hell Creek beds of Montana.
  - id: carpenter2004a
    notes: Modern redescription of all then-known specimens (AMNH 5895, AMNH
      5214, AMNH 5866, CCM V03, CMN 8880); demonstrates lateral nare
      displacement is pneumatic, not dermal.
  - id: arbour2015a
    notes: Comprehensive revision of Ankylosauridae; provides the current
      revised diagnosis of Ankylosaurus and erects the tribe Ankylosaurini with
      Ankylosaurus as the name-bearer.
  - id: arbour2017b
    notes: Redescription of Ankylosaurus; newly identifies elements of the
      holotype AMNH 5895 and of CMN 8880, revises the diagnosis and osteoderm
      arrangement, and provides updated body-size estimates.
  - id: paul2024a
    notes: Source of the mass estimate.
  - id: jones2026a
    notes: Source of the appearance features.
