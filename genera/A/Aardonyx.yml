genus: Aardonyx
parent: Sauropodiformes
description: Aardonyx is a genus of basal sauropodomorph dinosaur. It is known
  from the type species Aardonyx celestae found from the Early Jurassic Elliot
  Formation of South Africa. A. celestae was named after Celeste Yates, who
  prepared much of the first known fossil material of the species. It has arm
  features that are intermediate between basal sauropodomorphs and more derived
  sauropods.
