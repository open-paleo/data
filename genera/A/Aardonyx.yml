genus: Aardonyx
parent: Sauropodiformes
etymology: From Afrikaans 'aard' meaning 'earth' and Greek 'onux' meaning 'nail'
  or 'claw'.
description: Aardonyx is a genus of basal sauropodomorph dinosaur. It is known
  from the type species Aardonyx celestae found from the Early Jurassic Elliot
  Formation of South Africa. A. celestae was named after Celeste Yates, who
  prepared much of the first known fossil material of the species. It has arm
  features that are intermediate between basal sauropodomorphs and more derived
  sauropods.
locomotion: facultative
paleoenvironment:
  - fluvial
  - arid
diet: herbivore
diagnostic_features:
  - Five premaxillary teeth (convergent in Plateosaurus)
  - Band of dense, fine pits and small foramina along the lower half of the
    lateral surface of the maxilla
  - Reduced lateral maxillary neurovascular foramina rostral to the large
    caudally facing foramen (middle foramina <6% of maxilla depth caudal to
    antorbital fossa)
  - Reduced cervical diapophyses remaining as low tubercles with absent
    diapophyseal laminae along the full cervical series
  - Large, rugose biceps scar (maximum diameter 13% of radius length) on the
    craniomedial surface of the radius shaft
  - Exceptionally broad and flat proximal end of metatarsal IV (transverse width
    2.9× the extensor-flexor depth) with strongly laterally flared caudolateral
    corner distally
