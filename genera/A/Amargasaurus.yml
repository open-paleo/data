genus: Amargasaurus
parent: Dicraeosauridae
pronunciation:
  phonetic: ah-MAHR-gah-SAWR-us
  ipa: /əˌmɑːrɡəˈsɔːrəs/
etymology: "Named for La Amarga arroyo in Argentina, where it was discovered,
  combined with Greek 'sauros' meaning 'lizard', meaning 'La Amarga lizard'."
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Dicraeosaurid with split neural spines extending to penultimate presacral
  - Taller presacral vertebrae with more accentuated bifurcation than
    Dicraeosaurus hansemanni
  - Cervical neural spines substantially longer and subcylindrical in cross
    section
  - Fused basal tubera of basioccipital
  - Basipterygoid processes longer than in D. hansemanni
  - Parietal and postparietal fenestrae present with smaller postparietal
    relative to parietal
  - Robust orbitosphenoids with large olfactory nerve opening
appearance:
  features:
    - bifurcated cervical spines
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "53960"
  - source: wikidata
    id: Q18510922
  - source: gbif
    id: "4822553"
species:
  - name: Amargasaurus cazaui
    etymology: Named for Dr. Luis B. Cazau of Y.P.F. Exploration, who in 1983
      drew the authors to the paleontological exploration of the La Amarga
      Formation and offered data on discoveries.
    pronunciation:
      phonetic: KAZ-ou-eye
    status: valid
    type_species: true
    period:
      name:
        - Early Cretaceous
      stage:
        - Barremian
    location:
      country: AR
      locality: 2.5 km southeast of the La Amarga Arroyo bridge on National Route 40
      region: AR-Q
      formation: La Amarga
      member: Puesto Antigual
    type_specimen:
      specimen_id: [ MACN-N 15 ]
      specimen_type: holotype
      institution: MACN
      material: Basicranial and temporal skull region, 22 articulated presacral
        vertebrae, 5 fused sacral vertebrae, 3 anterior-middle caudal vertebrae, ribs,
        scapulocoracoid, humerus, radius, ulna, ilium, femur, tibia, fibula, astragalus,
        metatarsals.
      completeness: complete
    size:
      hip_height_m:
        min: 2.5
        max: 2.5
      length_m:
        min: 9.0
        max: 13.0
      weight_kg:
        min: 2500
        max: 4000
    erected_in: salgado1991a
