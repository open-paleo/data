genus: Amargasaurus
parent: Dicraeosaurinae
pronunciation:
  ipa: /əˌmɑːrɡəˈsɔːrəs/
description: Amargasaurus is a genus of sauropod dinosaur from the Early
  Cretaceous epoch (129.4–122.46 mya) of what is now Argentina. The only known
  skeleton was discovered in 1984 and is virtually complete, including a
  fragmentary skull, making Amargasaurus one of the best-known sauropods of its
  epoch. Amargasaurus was first described in 1991 and contains a single known
  species, Amargasaurus cazaui. It was a large animal, but small for a sauropod,
  reaching 9 to 13 meters (30 to 43 feet) in length. Most distinctively, it
  sported two parallel rows of tall spines down its neck and back, taller than
  in any other known sauropod. In life, these spines could have stuck out of the
  body as solitary structures that supported a keratinous sheath. An alternate
  hypothesis, now more favored, postulates that they could have formed a
  scaffold supporting a skin sail. They might have been used for display,
  combat, or defense.
diet: herbivore
