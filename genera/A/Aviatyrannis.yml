genus: Aviatyrannis
parent: Ornithomimosauria
etymology: From Latin 'avia' (grandmother) and 'tyrannis' (genitive of
  'tyrannus', tyrant); meaning 'the tyrant's grandmother'.
description: Aviatyrannis is a genus of coelurosaurian theropod dinosaur, either
  a tyrannosauroid or an ornithomimosaurian, from the Oxfordian-Tithonian stages
  of the Late Jurassic found in Portugal.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - wetland
diagnostic_features:
  - Ilium low and elongate, with a well-developed, vertical, hollow ridge above
    the acetabulum
  - Dorsal half of anterior margin of preacetabular blade shallowly concave
  - Anterodorsally facing concavity set off from the dorsal rim of the
    preacetabular blade
  - Narrow, sharply defined, rounded vertical ridge extending over almost the
    complete height of the ilium above the acetabulum
  - Pubic peduncle of ilium transversely narrow, more than three times longer
    anteroposteriorly than wide at its middle
