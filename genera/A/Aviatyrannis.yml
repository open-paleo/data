genus: Aviatyrannis
parent: Tyrannosauroidea
dispute:
  summary: >
    The affinities of Aviatyrannis are contested. It was described as a basal
    tyrannosauroid (Rauhut, 2003) and is treated as such by most subsequent work,
    but Hattori et al. (2023) argued from the holotype ilium that it is instead an
    ornithomimosaur, recovering it in supplementary analyses either as the
    earliest deinocheirid, sister to Tyrannomimus, or outside both ornithomimosaur
    families near Shenzhousaurus; that result is unstable and was excluded from
    their primary tree. It is placed conservatively at Tyrannosauroidea following
    the prevailing view.
  history:
    - date: "2026-06-30"
      note: >
        Moved from Ornithomimosauria to Tyrannosauroidea following Rauhut (2003)
        and the prevailing view; the ornithomimosaur hypothesis of Hattori et al.
        (2023) is recorded as an unresolved alternative.
etymology: From Latin 'avia' (grandmother) and 'tyrannis' (genitive of
  'tyrannus', tyrant); meaning 'the tyrant's grandmother'.
pronunciation:
  phonetic: AY-vi-uh-TIE-ran-iss
description: Aviatyrannis is a genus of coelurosaurian theropod dinosaur, either
  a tyrannosauroid or an ornithomimosaurian, from the Oxfordian-Tithonian stages
  of the Late Jurassic found in Portugal.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - wetland
diagnostic_features:
  - Ilium low and elongate, with a well-developed, vertical, hollow ridge above
    the acetabulum
  - Dorsal half of anterior margin of preacetabular blade shallowly concave
  - Anterodorsally facing concavity set off from the dorsal rim of the
    preacetabular blade
  - Narrow, sharply defined, rounded vertical ridge extending over almost the
    complete height of the ilium above the acetabulum
  - Pubic peduncle of ilium transversely narrow, more than three times longer
    anteroposteriorly than wide at its middle
