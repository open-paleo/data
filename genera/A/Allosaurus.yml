synonyms:
  - name: Antrodemus
    type: junior subjective
    reason: Although described before Allosaurus, the type material is too poor to be diagnostic; Allosaurus is given priority and Antrodemus treated as a junior synonym.
  - name: Wyomingraptor
    type: nomen nudum
    reason: Coined by an anonymous caller on Dr. Bob's Dinofacts radio show; never officially described in scientific literature.
  - name: Labrosaurus
    type: junior subjective
    reason: Type material is now considered indistinguishable from Allosaurus.
  - name: Creosaurus
    type: junior subjective
    reason: "Williston (1901) noted that Marsh had never adequately distinguished Creosaurus from Allosaurus; subsequent work has confirmed the synonymy."
  - name: Apatodon
    type: possible subjective
    reason: Possible junior subjective synonym of Allosaurus; identification is tentative. Per Olshevsky's Dinosaur Genera List.
  - name: Madsenius
    type: nomen nudum
    reason: Informal name; never met ICZN requirements for formal publication and is treated as referable to Allosaurus. Per Olshevsky's Dinosaur Genera List.
