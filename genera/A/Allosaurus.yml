genus: Allosaurus
parent: Allosauroidea
etymology: From Greek 'allos' meaning 'different' or 'other' and 'sauros' meaning 'lizard'; meaning 'different lizard', alluding to its lightweight vertebrae
pronunciation:
  ipa: /ˌæləˈsɔːrəs/
  phonetic: AL-o-SAWR-us
description: Allosaurus is a genus of theropod dinosaur that lived 155 to 145
  million years ago during the Late Jurassic period (Kimmeridgian to late
  Tithonian ages). The first fossil remains that could definitively be ascribed
  to this genus were described in 1877 by Othniel C. Marsh. The name
  "Allosaurus" means "different lizard", alluding to its lightweight vertebrae,
  which Marsh believed were unique. The genus has a very complicated taxonomy
  and includes at least three valid species, the best known of which is A.
  fragilis. The bulk of Allosaurus remains come from North America's Morrison
  Formation, with material also known from the Alcobaça, Bombarral, and Lourinhã
  formations in Portugal. It was known for over half of the 20th century as
  Antrodemus, but a study of the abundant remains from the Cleveland-Lloyd
  Dinosaur Quarry returned the name "Allosaurus" to prominence. As one of the
  first well-known theropod dinosaurs, it has long attracted attention outside
  of paleontological circles.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Vertebral centra deeply excavated on the sides to reduce weight, producing
    an hourglass form in some elements
  - Vertebrae biconcave with shallow cavities, centra not pneumatic but greatly
    lightened by lateral excavations
  - Anterior caudal centrum so strongly constricted that its least transverse
    diameter (38 mm) is far less than its anterior face diameter (90 mm)
  - Foot bones very slender
appearance:
  features:
    - brow horns
  integument: scaled
  evidence: direct
