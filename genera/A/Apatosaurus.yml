notable_specimens:
  - specimen_id: [CM 11162]
    institution: CM
    species: Apatosaurus louisae
    category: complementary
    significance: "First Apatosaurus skull found, recovered a short distance from skeleton CM 3018 at the Carnegie Quarry. Very similar to the skull of Diplodocus, it challenged the long-held Camarasaurus-like reconstruction and sparked a decades-long dispute over the genus's true skull."
    discovered:
      year: 1909
      by: "Earl Douglass"
    references: [mcintosh1975a, parsons1997a]
references:
  - id: marsh1877c
  - id: holland1915a
  - id: mcintosh1975a
    notes: Establishes that Apatosaurus had a Diplodocus-like skull (the jawless
      skull CM 11162 found with the A. louisae holotype), not the
      Camarasaurus-like skull historically mounted on it.
  - id: parsons1997a
  - id: tschopp2015a
    notes: Specimen-level revision of Diplodocidae providing an emended
      diagnosis of Apatosaurus and restricting the genus to A. ajax and A.
      louisae, moving other species to Brontosaurus.
  - id: jones2026b
    notes: Source of the hip height estimate, and the appearance features.
