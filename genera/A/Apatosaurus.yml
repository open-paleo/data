genus: Apatosaurus
parent: Apatosaurinae
etymology: From Greek 'apate' meaning 'deception' and 'sauros' meaning 'lizard'; meaning 'deceptive lizard'
pronunciation:
  phonetic: a-PAT-o-SAWR-us
  ipa: /əˌpætəˈsɔːrəs/
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Accessory horizontal lamina in the spinodiapophyseal fossa of the mid- and
    posterior cervical vertebrae, not connected to any surrounding lamina
  - Prezygodiapophyseal lamina of the posterior cervical and anterior dorsal
    vertebrae lacking a roughened lateral aspect
  - Scapular blade straight in lateral view
appearance:
  features:
    - whiplash tail
    - enlarged manual claws
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "38665"
  - source: wikidata
    id: Q14326
  - source: gbif
    id: "4822558"
  - source: eol
    id: "47459350"
  - source: zoobank
    id: 7A3AC822-0C85-46F3-9CD0-108FE93C0AB7
