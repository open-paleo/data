    etymology: "Named after Ajax, a hero from Greek mythology."
    pronunciation:
      phonetic: AY-jacks; AY-acks
    status: valid
    type_species: true
    period:
      name:
        - Late Jurassic
      stage:
        - Kimmeridgian
        - Tithonian
    location:
      country: US
      region: US-CO
      locality: Lakes' Quarry 10, Morrison
      formation: Morrison
      member: Brushy Basin
      part: upper
    type_specimen:
      specimen_id: [YPM 1860]
      specimen_type: holotype
      institution: YPM
      material: Nearly complete skeleton in excellent preservation.
      completeness: complete
    size:
      hip_height_m:
        min: 4
        max: 4
      length_m:
        min: 21.0
        max: 23.0
      weight_kg:
        min: 16400
        max: 22400
    erected_in: marsh1877c
    described_in: tschopp2015a
  - name: Apatosaurus louisae
    etymology: Named for Mrs. Andrew Carnegie.
    pronunciation:
      phonetic: loo-EE-zay; loo-EE-zye
    status: valid
    period:
      name:
        - Late Jurassic
      stage:
        - Kimmeridgian
    location:
