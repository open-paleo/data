genus: Altispinax
parent: Theropoda
pronunciation:
  ipa: /ˌæltɪˈspaɪnæks/
etymology: "From Latin 'altus' meaning 'high' and 'spina' meaning 'spine' or 'thorn', combined with Latin 'ax' (sharp), meaning 'with high spines', referring to its tall vertebral spines."
description: Altispinax is a genus of large predatory theropod dinosaur from the
  Early Cretaceous period (Valanginian, 140 to 133 million years ago) of what is
  now the Wadhurst Clay Formation of East Sussex, England.
diet: carnivore
locomotion: bipedal
