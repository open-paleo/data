genus: Altispinax
parent: Tetanurae
placement: incertae sedis
dispute:
  summary: >
    Carrano and colleagues (2012) exclude the vertebrae from Spinosauridae,
    to which earlier workers had referred them, and from
    Carcharodontosauridae, and place them no more precisely than Tetanurae.
    Naish (2003) regards them as an allosauroid pending further work, Maisch
    (2016) refers the genus questionably to Carcharodontosauridae for its
    similarity to Concavenator, and Morrison and colleagues (2026) call the
    material a possible carcharodontosaurian. None of these rests on a
    phylogenetic analysis, so the genus is placed at Tetanurae incertae
    sedis.
  history:
    - date: "2026-06-30"
      note: >
        Reparented to Tetanurae.
    - date: "2026-07-02"
      note: >
        Confirmed placement at Tetanurae incertae sedis; treated as a valid
        taxon of uncertain position (not a nomen dubium), with the Becklespinax
        nomenclature resolved in its favor.
    - date: "2026-10-15"
      note: >
        Summary rewritten with its sources; the earlier "in one analysis to
        Carcharodontosauria" had no analysis behind it.
pronunciation:
  ipa: /ˌæltɪˈspaɪnæks/
  phonetic: AL-ti-SPIEN-aks
etymology: "From Latin 'altus' meaning 'high' and 'spina' meaning 'spine' or
  'thorn', combined with Latin 'ax' (sharp), meaning 'with high spines',
  referring to its tall vertebral spines."
description: Altispinax is a genus of large predatory theropod dinosaur from the
  Early Cretaceous period (Valanginian, 140 to 133 million years ago) of what is
  now the Wadhurst Clay Formation of East Sussex, England.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Enormously high neural spines in the dorsal region, distinguishing it from
    Megalosaurus and justifying the genus name Altispinax (high-spined)
  - Tooth strongly compressed laterally with saber-like curvature
  - Posterior (concave) edge of tooth shows distinct serration extending nearly
    to base
  - Anterior (convex) edge of tooth remains smooth, distinguishing it from other
    Megalosaurus species
appearance:
  features:
    - tall neural spines
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "38596"
  - source: wikidata
    id: Q134618
  - source: gbif
    id: "4822668"
species:
  - name: Altispinax dunkeri
    etymology: "Named for the German paleontologist Wilhelm Dunker, who discovered
      the original Megalosaurus dunkeri tooth on the Deister in the main coal
      seam of Obernkirchen."
    status: valid
    type_species: true
    period:
      name:
        - Early Cretaceous
      stage:
        - Valanginian
    location:
      country: GB
      region: GB-ESX
      locality: Battle, near Hastings
      group: Hastings Beds
    size:
      length_m:
        min: 8
        max: 8
      hip_height_m:
        min: 2
        max: 2
      weight_kg:
        min: 1000
        max: 1000
    type_specimen:
      specimen_id: [ NHMUK PV R 1828 ]
      specimen_type: holotype
      institution: NHMUK
      material: Tooth approximately 60 mm high and 22 mm long at alveolar end;
        saber-like curved, laterally compressed; serrated posterior edge; smooth
        anterior edge
      completeness: fragmentary
    synonyms:
      - name: Becklespinax
        type: junior subjective
        reason: Based on the same vertebrae as Altispinax dunkeri, making it a junior
          objective synonym.
    erected_in: huene1923a
references:
  - id: huene1926a
    notes: Gives the specimen as "from the Wealden of Battle, near Hastings,
      Sussex".
  - id: dames1885a
    notes: Jahrbuch 1884; in German. Original description of Megalosaurus
      dunkeri, reassigned to the new genus Altispinax by Huene (1923).
  - id: huene1923a
  - id: jones2026c
    notes: Source of the body length and hip height estimates, and the
      appearance features.
  - id: carrano2012a
    notes: Places the vertebrae no more precisely than Tetanurae, excluding
      them from Spinosauridae and Carcharodontosauridae; treats them under the
      name Becklespinax altispinax.
  - id: naish2003a
    notes: Regards the vertebrae as an allosauroid pending further work, and
      suggests a large Hastings tibia might belong to the same animal.
  - id: maisch2016a
    notes: Shows that Altispinax dunkeri v. Huene, 1923 is the valid name for
      the vertebrae, with Becklespinax a junior objective synonym, and refers
      the genus questionably to Carcharodontosauridae.
  - id: morrison2026a
    notes: Calls the Wealden vertebrae a possible carcharodontosaurian.
