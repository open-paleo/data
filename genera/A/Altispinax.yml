genus: Altispinax
parent: Theropoda
pronunciation:
  ipa: /ˌæltɪˈspaɪnæks/
  phonetic: AL-ti-SPIEN-aks
etymology: "From Latin 'altus' meaning 'high' and 'spina' meaning 'spine' or
  'thorn', combined with Latin 'ax' (sharp), meaning 'with high spines',
  referring to its tall vertebral spines."
description: Altispinax is a genus of large predatory theropod dinosaur from the
  Early Cretaceous period (Valanginian, 140 to 133 million years ago) of what is
  now the Wadhurst Clay Formation of East Sussex, England.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Enormously high neural spines in the dorsal region, distinguishing it from
    Megalosaurus and justifying the genus name Altispinax (high-spined)
  - Tooth strongly compressed laterally with saber-like curvature
  - Posterior (concave) edge of tooth shows distinct serration extending nearly
    to base
  - Anterior (convex) edge of tooth remains smooth, distinguishing it from other
    Megalosaurus species
