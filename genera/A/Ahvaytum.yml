genus: Ahvaytum
parent: Sauropodomorpha
etymology: From Shoshone 'An va·tum' meaning 'long ago', referring to the
  ancient nature of the specimen.
pronunciation:
  ipa: /ɑːˈveɪtəm/
  phonetic: ah-VAY-tum
description: Ahvaytum is an extinct genus of probable basal sauropodomorph
  saurischian dinosaurs from the Late Triassic Popo Agie Formation of Wyoming,
  United States. The genus contains a single species, A. bahndooiveche, known
  from fragmentary hindlimb bones. Ahvaytum represents the oldest known named
  dinosaur of the ancient Laurasian landmass.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Fossa on medial surface of astragalus that is open distally (autapomorphic
    among dinosaurs)
  - Tibial facet does not extend onto anteromedial corner of astragalus
  - Shallow laterodistal notch of astragalus
  - Posterolateral ridge between anterior ascending process and posterolateral
    process taller than posterolateral process
  - Proportionally wider astragalus with width/length ratio of 0.53;
    relatively wide fibular facet occupying more than one-quarter of transverse
    width
appearance:
  integument: scaled
  evidence: inferred
