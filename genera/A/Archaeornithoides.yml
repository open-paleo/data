genus: Archaeornithoides
parent: Troodontidae
dispute:
  summary: >
    Archaeornithoides is based on a fragmentary juvenile skull and was originally
    linked to troodontids and spinosaurids as a close bird relative (Elzanowski and
    Wellnhofer, 1992). Bever and Norell (2009) concluded it is a distinct, valid
    genus but of highly uncertain phylogenetic position, generally near or within
    Troodontidae. It is placed at Troodontidae incertae sedis.
  history:
    - date: "2026-07-01"
      note: Placed at Troodontidae incertae sedis; fragmentary juvenile holotype, position uncertain.
pronunciation:
  phonetic: AHR-kee-OR-ni-THOI-deez
etymology: From Greek 'archaios' meaning 'ancient', 'ornis' meaning 'bird', and '-oides' meaning 'resembling', translating to 'ancient bird-like'.
description: Archaeornithoides is a genus of maniraptoran theropod dinosaur of
  the Late Cretaceous of Mongolia.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - arid
diagnostic_features:
  - Maxilla with a major pit on the lateral surface of the nasal process and a
    rostromedial process recurved ventrally
  - Large dorsal opening to the supraalveolar canal behind the base of the nasal
    process
  - Broad palatal shelf enclosing a small rostral sinus and a large caudal
    sinus, shelf so expanded that subfenestral part of maxilla is distinctly
    broader than high
  - Dentary with interdental septa descending labio-lingually and separated from
    the lingual wall by the paradental groove
  - Maxillary teeth widely spaced, conical or only slightly compressed
    labio-lingually, lacking both serrations and carinae
appearance:
  integument: feathered
  evidence: inferred
