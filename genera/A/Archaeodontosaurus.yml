genus: Archaeodontosaurus
parent: Sauropoda
etymology: From Greek 'archaios' meaning 'ancient', 'odous' (genitive 'odontos') meaning 'tooth', and 'sauros' meaning 'lizard'; meaning 'ancient-toothed lizard'
description: Archaeodontosaurus is a genus of sauropod dinosaur from the Middle
  Jurassic. Its fossils were found in the Isalo III Formation of Madagascar. The
  type species, Archaeodontosaurus descouensi, was described in September 2005.
  The specific name honors the collector, Didier Descouens. It is a probable
  sauropod, with prosauropod-like teeth. It may be a basal member of
  Gravisauria.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - coastal
diagnostic_features:
  - Dentary markedly deeper anteriorly than posteriorly, bearing at least 16
    alveoli
  - Teeth lanceolate with strong, well-defined denticles on anterior and
    posterior margins
  - Teeth bearing a distinct lingual median ridge running from apex to base of
    crown
  - Tooth enamel finely wrinkled
  - Combination of advanced sauropod-type dentary with prosauropod-like
    lanceolate serrated teeth
