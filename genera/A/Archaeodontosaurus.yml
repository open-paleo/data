genus: Archaeodontosaurus
parent: Sauropoda
etymology: ancient-toothed lizard
description: Archaeodontosaurus is a genus of sauropod dinosaur from the Middle
  Jurassic. Its fossils were found in the Isalo III Formation of Madagascar. The
  type species, Archaeodontosaurus descouensi, was described in September 2005.
  The specific name honours the collector, Didier Descouens. It is a probable
  sauropod, with prosauropod-like teeth. It may be a basal member of
  Gravisauria.
diet: herbivore
