genus: Acheroraptor
parent: Eudromaeosauria
dispute:
  summary: >
    The subfamily placement of Acheroraptor is contested. It was described as a
    basal velociraptorine (Evans et al., 2013) with Asian affinities, a placement
    followed by Jasinski et al. (2020), but Powers et al. (2022) and Jones et al.
    (2026) instead recover it within Saurornitholestinae. Known mainly from jaw
    material, it is placed at Eudromaeosauria incertae sedis.
  history:
    - date: "2026-07-01"
      note: Moved from Velociraptorinae to Eudromaeosauria incertae sedis (least-inclusive uncontested clade); velociraptorine and saurornitholestine hypotheses proposed.
etymology: From Greek 'Acheron' (the underworld river) and Latin 'raptor' meaning 'thief' or 'plunderer'; meaning 'underworld thief'
pronunciation:
  phonetic: ah-SHEH-ro-RAP-tuh
description: Acheroraptor is an extinct genus of dromaeosaurid theropod dinosaur
  that lived in present-day Montana in the United States during the
  Maastrichtian stage of the Late Cretaceous period. It was described by
  Canadian paleontologists David Evans, Derek Larson, and Philip J. Currie in
  2013. The genus contains a single species, A. temertyorum, named on an
  isolated maxilla with teeth. An incomplete dentary found nearby was also
  assigned to the species. These fossils were initially discovered by fossil
  poachers, though they were later sold to the Royal Ontario Museum, in layers
  belonging to the Hell Creek Formation. This indicates that these fossils date
  to the upper Maastrichtian stage, 67.2-66 million years ago.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Extensive, posteriorly projected postantral wall that is visible laterally
    through the antorbital fenestra
  - Maxillary fenestra positioned low in the antorbital fossa and almost
    reaching its ventral margin, situated directly posterior to the promaxillary
    fenestra
  - Relatively small anterior region of the antorbital fossa (region between
    anterior borders of the antorbital fenestra and fossa)
  - Maxillary dentition with prominent apicobasal ridges on both labial and
    lingual surfaces, consistently close to the anterior margins of each side
appearance:
  features:
    - sickle claw
    - quill knobs
  integument: feathered
  evidence: direct
