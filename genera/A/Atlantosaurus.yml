genus: Atlantosaurus
parent: Sauropoda
placement: incertae sedis
etymology: From Atlas, the Titan of Greek myth who bore the sky on his
  shoulders, and Greek 'sauros' ('lizard'), for the great size of the animal.
description: Atlantosaurus is a dubious genus of sauropod dinosaur. It contains
  a single species, Atlantosaurus montanus, from the Late Jurassic upper
  Morrison Formation of Colorado, United States. Atlantosaurus was the first
  sauropod to be described during the infamous 19th century Bone Wars, during
  which scientific methodology suffered in favor of pursuit of academic acclaim.
diet: herbivore
identifiers:
  - source: pbdb
    id: "52964"
  - source: wikidata
    id: Q616671
  - source: gbif
    id: "4576258"
  - source: eol
    id: "57242356"
species:
  - name: Atlantosaurus montanus
    etymology: From Latin 'montanus' ('of the mountains'), for the Rocky
      Mountain region where the type material was collected.
    status: nomen dubium
    type_species: true
    period:
      name:
        - Late Jurassic
    location:
      country: US
      region: US-CO
      locality: Lakes' Quarry 1, Morrison
      formation: Morrison
    type_specimen:
      specimen_id:
        - YPM 1835
      specimen_type: holotype
      institution: YPM
      material: Partial sacrum, including the last two sacral vertebrae with
        their transverse processes, together with portions of the posterior
        limbs.
      completeness: fragmentary
    synonyms:
      - name: Titanosaurus montanus
        type: preoccupied
        reason: The original combination, published by Marsh in July 1877. The
          generic name was preoccupied by Titanosaurus Lydekker, 1877, and
          Marsh replaced it with Atlantosaurus later the same year.
    erected_in: marsh1877c
references:
  - id: marsh1877c
    notes: Replaces the preoccupied generic name Titanosaurus with
      Atlantosaurus, establishing the combination Atlantosaurus montanus.
  - id: marsh1877b
    notes: Original description of the type species as Titanosaurus montanus, on
      a partial sacrum and portions of the posterior limbs.
  - id: jones2026b
    notes: Gives the holotype as YPM 1835, a partial sacrum, and finds nothing
      uniquely identifiable about the specimen.
  - id: upchurch2004a
    notes: Lists the type species among nomina dubia, with its material given as
      sacral centra.
  - id: tschopp2015a
    notes: Recovers the holotype of the second species Atlantosaurus immanis as
      an indeterminate apatosaurine lacking autapomorphies, so a nomen dubium.
  - id: olshevsky1991a
    notes: Treats the genus as a nomen dubium and records the preoccupation of
      Titanosaurus Marsh, 1877 that Atlantosaurus replaces.
