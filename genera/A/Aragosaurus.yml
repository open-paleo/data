genus: Aragosaurus
parent: Macronaria
pronunciation:
  phonetic: AHR-a-go-SAWR-us
etymology: Named after the Aragon region of Spain where fossils were found,
  combined with Greek 'sauros' meaning 'lizard'; meaning 'Aragon lizard'
description: Aragosaurus was a genus of sauropod dinosaur from the latest
  Jurassic to earliest Cretaceous of Galve, province of Teruel, in the
  autonomous territory of Aragon, Spain. It was deposited in the Villar del
  Arzobispo Formation.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - coastal
diagnostic_features:
  - Anterior caudal vertebrae with shallow, dorsolaterally facing concavities
    on either side of the neural spine summit midline
  - Small epipophysis-like protuberances on the dorsal surfaces of middle
    caudal postzygapophyses
  - Long interosseous ridges on the ulna and radius, convergent with derived
    titanosaurs
  - Interosseous ridge on the posterolateral face of the radial shaft ending
    distally in a distinct tubercle
  - Carpal subquadrangular in proximal and distal view, its lateromedial and
    anteroposterior diameters similar
  - Proximal pedal phalanx with a midline dorsal ridge where its lateral and
    medial faces meet
