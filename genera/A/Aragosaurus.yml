genus: Aragosaurus
parent: Macronaria
pronunciation:
  phonetic: AHR-a-go-SAWR-us
etymology: Named after the Aragon region of Spain where fossils were found,
  combined with Greek 'sauros' meaning 'lizard'; meaning 'Aragon lizard'
description: Aragosaurus was a genus of sauropod dinosaur from the Early
  Cretaceous period of Galve, province of Teruel, in the autonomous territory of
  Aragón, Spain. It was deposited in the Villar del Arzobispo Formation.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - coastal
diagnostic_features:
  - Large transverse (club-shaped) enlargement of the neural apophysis of the
    first caudal vertebrae
  - Great dorso-ventral development of the anterior scapular region; ratio of
    minimum scapular blade width to maximum acromio-glenoid dimension of 0.27
  - Pubic process of ischium with great dorso-ventral development; ratio of
    anteroposterior length of process to contact outline with pubis of 0.63
  - Ischiatic apophysis of ischium ending in a conspicuous distal club-like
    expansion
  - Stylopodial length ratio (humerus/femur) of 0.82
  - Internal femoral condyle relatively developed; ratio of maximum
    anteroposterior diameter to maximum transverse distal width of 0.77
