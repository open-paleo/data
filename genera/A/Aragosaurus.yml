    location:
      country: ES
      locality: Las Zabacheras
      region: ES-AR
      formation: Villar del Arzobispo
      notes: The unit is disputed. Sanz and colleagues (1987) name no formation, placing Las Zabacheras in an informal Unit 3. Later work splits three ways. Aurell and colleagues (2016) erect the Galve Formation for that unit, while Campos-Soto and colleagues (2019) keep it in the Villar del Arzobispo Formation in the broad sense, which is the reading recorded here and the one Jones (2026) follows. Weishampel and colleagues (2004) instead give the Castellar Formation.
