genus: Athenar
parent: Dicraeosauridae
etymology: Named for Athenar, a Cleveland musician and Pittsburgh Steelers fan
  whose music accompanied most of the work on the specimen.
pronunciation:
  phonetic: AH-thuh-NAHR
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Presence of a 'tooth' (triangular parietal expansion) in the
    parietal/opisthotic suture (sole autapomorphy)
  - Single foramen for passage of the abducens (VI) nerve (distinct from
    Suuwassea emilieae)
  - Narrow midline ventral expansion of the foramen for the optic nerve
    (distinct from Suuwassea emilieae)
  - Presence of frontoparietal and postparietal fenestrae (absent in Kaatedocus
    and Smitanosaurus)
  - Frontal contributes to the full anterior margin of the supratemporal
    fenestra (absent in Smitanosaurus and all other Morrison Formation sauropods
    except Suuwassea)
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "515983"
  - source: wikidata
    id: Q62027495
species:
  - name: Athenar bermani
    etymology: Named for David S. Berman, who with John S. McIntosh did much of
      the fundamental modern work on diplodocoid skulls at the Carnegie Museum of
      Natural History and first described the specimen.
    pronunciation:
      phonetic: BUR-mun-eye
    status: valid
    type_species: true
    period:
      name:
        - Late Jurassic
      stage:
        - Kimmeridgian
    location:
      country: US
      locality: Carnegie Quarry
      region: US-UT
      formation: Morrison
      notes: Whitlock and colleagues (2025) date the Carnegie Quarry "ca.
        150-151 Ma", which they label Tithonian; on the ICS chart v2024/12,
        whose Tithonian begins at 149.2 Ma, that is Kimmeridgian.
    erected_in: whitlock2025a
    type_specimen:
      specimen_id: [CM 26552]
      specimen_type: holotype
      institution: CM
      material: Braincase and partial skull roof (frontal, parietal, partial postorbital, squamosal fragments)
      completeness: fragmentary
references:
  - id: whitlock2025a
    notes: Erects the genus and dates the Carnegie Quarry "ca. 150-151 Ma".
