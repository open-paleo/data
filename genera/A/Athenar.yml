genus: Athenar
parent: Dicraeosauridae
etymology: "Named for Cleveland metal artist Athenar, whose music was described as 'the soundtrack to the majority of the work done on this specimen'. The species name honors David Berman, who carried out foundational modern work on diplodocoid skulls."
pronunciation:
  phonetic: AH-thuh-NAHR
description: "Athenar is an extinct genus of dicraeosaurid sauropod dinosaur
  from the Late Jurassic of Utah, United States. The genus contains a single
  species, Athenar bermani, which was described by John Whitlock and colleagues
  in 2025 based on the holotype specimen CM 26552: a braincase and skull roof
  previously ascribed to the genus Diplodocus. The specimen was found in rocks
  belonging to the Morrison Formation at the Carnegie Quarry at Dinosaur
  National Monument."
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Presence of a 'tooth' (triangular parietal expansion) in the
    parietal/opisthotic suture (sole autapomorphy)
  - Single foramen for passage of the abducens (VI) nerve (distinct from
    Suuwassea emilieae)
  - Narrow midline ventral expansion of the foramen for the optic nerve
    (distinct from Suuwassea emilieae)
  - Presence of frontoparietal and postparietal fenestrae (absent in Kaatedocus
    and Smitanosaurus)
  - Frontal contributes to the full anterior margin of the supratemporal
    fenestra (absent in Smitanosaurus and all other Morrison Formation sauropods
    except Suuwassea)
appearance:
  integument: scaled
  evidence: inferred
