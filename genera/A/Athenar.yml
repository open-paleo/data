genus: Athenar
parent: Dicraeosauridae
etymology: The generic name Athenar refers to Cleveland metal artist Athenar,
  whose music was "the soundtrack to the majority of the work done on this
  specimen". The specific epithet bermani honors David Berman who, together with
  McIntosh, carried out much of the foundational modern work on diplodocoid
  skulls at the Carnegie Museum of Natural History and was responsible for the
  initial description of the holotype specimen.
description: "Athenar is an extinct genus of dicraeosaurid sauropod dinosaur
  from the Late Jurassic of Utah, United States. The genus contains a single
  species, Athenar bermani, which was described by John Whitlock and colleagues
  in 2025 based on the holotype specimen CM 26552: a braincase and skull roof
  previously ascribed to the genus Diplodocus. The specimen was found in rocks
  belonging to the Morrison Formation at the Carnegie Quarry at Dinosaur
  National Monument."
diet: herbivore
