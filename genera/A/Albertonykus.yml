genus: Albertonykus
parent: Alvarezsauridae
etymology: Named after Alberta, Canada, combined with Greek 'onyx' (genitive 'onykos') meaning 'claw'; meaning 'Alberta claw'
pronunciation:
  phonetic: al-BUHR-toh-NYE-kuss
description: Albertonykus is an extinct genus of alvarezsaurid dinosaur from the
  Maastrichtian-age (Upper Cretaceous) rocks of the Horseshoe Canyon Formation
  of Alberta, Canada. It is known from forelimb and hindlimb remains from
  multiple individuals. All but two of the specimens come from a bonebed
  dominated by Albertosaurus, located at the top of Unit 4 of the Horseshoe
  Canyon Formation, dating to ~68.5 million years ago.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Ulna extremely broad, maximum width 35% of length
  - Distinct tubercle on medial margin of ulna, absent or only weakly developed
    as a small ridge in other alvarezsaurs
  - Manual ungual I with Y-shaped lateral grooves, absent in both Asian and
    South American alvarezsaurs
  - Ventral groove of manual ungual I extends proximally to the level of the
    ventral foramina, further than in Mononykus
  - Metatarsal III shaft with sharp longitudinal ventral keel and flat,
    unexpanded dorsal surface, contrasting with rounded ventral and expanded
    dorsal surfaces of Asian taxa
appearance:
  features:
    - enlarged manual claws
    - reduced forelimbs
  integument: feathered
  evidence: direct
