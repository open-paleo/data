genus: Albertonykus
parent: Alvarezsauridae
etymology: Alberta claw
description: Albertonykus is an extinct genus of alvarezsaurid dinosaur from the
  Maastrichtian-age (Upper Cretaceous) rocks of the Horseshoe Canyon Formation
  of Alberta, Canada. It is known from forelimb and hindlimb remains from
  multiple individuals. All but two of the specimens come from a bonebed
  dominated by Albertosaurus, located at the top of Unit 4 of the Horseshoe
  Canyon Formation, dating to ~68.5 million years ago.
diet: carnivore
locomotion: bipedal
