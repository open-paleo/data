genus: Achillesaurus
parent: Alvarezsauridae
etymology: "Named for Achilles' heel from Greek mythology, referencing diagnostic features found in the heel anatomy; combined with Greek 'sauros' meaning 'lizard'. The species name honors Professor Rafael Manazzone."
description: Achillesaurus is a genus of alvarezsaurid theropod dinosaur from
  the Santonian-aged (Late Cretaceous) Bajo de la Carpa Formation of Rio Negro,
  Argentina. It contains one species, Achillesaurus manazzonei.
diet: carnivore
