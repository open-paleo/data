genus: Achillesaurus
parent: Alvarezsauridae
etymology: "Named for Achilles' heel from Greek mythology, referencing diagnostic features found in the heel anatomy; combined with Greek 'sauros' meaning 'lizard'. The species name honors Professor Rafael Manazzone."
description: Achillesaurus is a genus of alvarezsaurid theropod dinosaur from
  the Santonian-aged (Late Cretaceous) Bajo de la Carpa Formation of Rio Negro,
  Argentina. It contains one species, Achillesaurus manazzonei.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - arid
diagnostic_features:
  - Biconcave caudal vertebra (possibly the fourth) with the cranial articular
    surface 30% larger in diameter than the caudal articular surface.
  - Lateral fossa present on the proximal caudal centra (small, subcircular
    depression on proximal half of the centrum).
  - Brevis shelf of the ilium does not reach the base of the ischial pedicel.
  - Supraacetabular crest of the ilium almost entirely undeveloped.
  - Lateral malleolus of the tibia at the same level as the medial malleolus.
