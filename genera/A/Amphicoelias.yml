genus: Amphicoelias
parent: Diplodocoidea
etymology: From Greek 'amphi' meaning 'on both sides' and 'koilos' meaning
  'hollow' or 'concave'; meaning 'biconcave', referring to the shape of the
  vertebrae
pronunciation:
  phonetic: AM-fi-SEEL-ee-as
  ipa: /ˌæmfɪˈsiːliəs/
description: Amphicoelias is a genus of herbivorous sauropod dinosaur that lived
  approximately 150 million years ago during the Tithonian (Late Jurassic
  Period) of what is now Colorado, United States. Amphicoelias was moderately
  sized at about 18 meters (59 ft) in length and 15 metric tons (17 short tons)
  in body mass, shorter than its close relative Diplodocus. Its hindlimbs were
  very long and thin, and its forelimbs were proportionally longer than in
  relatives.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - "Dorsal vertebral centra unequally amphicoelous: posterior face more deeply
    concave with prominent margins, anterior face less expanded and only
    slightly concave"
  - Pneumatic foramen situated at bottom of large lateral fossa extending nearly
    the entire length of the superior portion of the centrum; foramen longer
    than high (contrasting with Camarasaurus supremus where it is round or
    higher than long)
  - Neural spine thin with thickened and doubled anterior and posterior borders,
    each side divided into two shallow wide grooves by a median keel; apex much
    thickened transversely
  - Femur remarkably slender relative to its length; third trochanter a
    prominent obtuse ridge situated slightly above mid-shaft directed backwards;
    condyles separated by deep popliteal groove
  - Anterior zygapophyses separated by deep notch extending to base of neural
    spine, with articular surfaces inclining toward each other; hyposphen
    present as in Camarasaurus
