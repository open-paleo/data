genus: Anteavis
parent: Theropoda
etymology: From Latin 'ante' meaning 'before' and 'avis' meaning 'bird', meaning 'before birds', reflecting its position as an early theropod predating modern birds.
pronunciation:
  phonetic: AN-tee-AY-vis
description: Anteavis is an extinct genus of early theropod dinosaurs known from
  the Late Triassic (Carnian age) Ischigualasto Formation of Argentina. The
  genus contains a single species, Anteavis crurilongus, known from a partial
  skeleton and skull.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Dorsal maxillary process expanded anteroposteriorly, with concave anterior
    and posterior margins.
  - Large coracoid foramen situated between scapula and coracoid, drilling the
    scapula medially.
  - Humerus with deep foramena on the proximal surface of the medial tuberosity.
  - Puboischiadic plate with two similarly sized openings in the pubis.
  - Femoral head with blunt anterolateral tuberosity in proximal view and
    pronounced ovoid tuberosity on the anterolateral surface.
  - Distal end of the tibia with coarse, rounded tuberosities on the medial and
    posterior surfaces.
