etymology: "Named for the Amur River near where its remains were found, combined
  with Greek 'sauros' meaning 'lizard', meaning 'Amur lizard'."
description: Amurosaurus is a genus of lambeosaurine hadrosaurid dinosaur found
  in Late Cretaceous (70 to 66 million years ago) deposits of what is now
  eastern Asia.
