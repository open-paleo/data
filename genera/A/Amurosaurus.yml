genus: Amurosaurus
parent: Lambeosaurinae
pronunciation:
  ipa: /əˌmʊərəˈsɔːrəs/
  phonetic: a-MOO-uhr-o-SOR-us
etymology: "Named for the Amur River near where its remains were found, combined
  with Greek 'sauros' meaning 'lizard', meaning 'Amur lizard'."
description: Amurosaurus is a genus of lambeosaurine hadrosaurid dinosaur found
  in Late Cretaceous (70 to 66 million years ago) deposits of what is now
  eastern Asia.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
diagnostic_features:
  - Largely dorsally directed, helmet-shaped hollow supracranial crest, slightly
    longer anteroposteriorly than dorsoventrally tall (height/length ratio ~0.9)
  - Robust, knob-like ventral end of the jugal anterior process, strongly
    posteriorly curved
  - Several anterodorsally-posteroventrally oriented lateral foramina on the
    maxilla, the last very large and partly obscured by the jugal contact
  - Narrow infratemporal region of the jugal, about 70% as wide as the orbit
  - Anterior third of the strongly ventrally bowed parietal sagittal crest low,
    with a transversely wide, posteriorly tapered dorsal outline
  - Mesiodistally wide maxillary tooth crowns (about 1.2-1.3 teeth per cm)
  - Posterolateral process of the sternum slightly shorter than the anteromedial
    plate, and preacetabular process of the ilium gently ventrally deflected
