genus: Arkansaurus
parent: Ornithomimosauria
etymology: From Arkansas (the U.S. state where fossils were found) + Greek sauros (σαῦρος) meaning 'lizard'; overall meaning 'Arkansas lizard'.
description: Arkansaurus is an extinct genus of ornithomimosaurian theropod
  dinosaur that lived during the Aptian and Albian stages of the Early
  Cretaceous in what is now North America. The type and only species is
  Arkansaurus fridayi.
diet: herbivore
