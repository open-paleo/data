genus: Arkansaurus
parent: Ornithomimosauria
etymology: From Arkansas (the U.S. state where fossils were found) + Greek sauros (σαῦρος) meaning 'lizard'; overall meaning 'Arkansas lizard'.
pronunciation:
  phonetic: AHR-can-SOR-us
description: Arkansaurus is an extinct genus of ornithomimosaurian theropod
  dinosaur that lived during the Aptian and Albian stages of the Early
  Cretaceous in what is now North America. The type and only species is
  Arkansaurus fridayi.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - coastal
diagnostic_features:
  - Third metatarsal laterally compressed proximally but visible along its
    entire extensor surface (subarctometatarsalian condition)
  - Proximal articular facets of the metatarsals ovoid in shape when articulated
  - Pedal unguals more strongly ventrally curved distally than any other
    ornithomimosaur
  - Distal ungual with a very weak flexor tubercle, curved rather than flat,
    lacking mediolateral spurs
appearance:
  integument: feathered
  evidence: inferred
identifiers:
  - source: pbdb
    id: "370063"
  - source: wikidata
    id: Q3493465
  - source: gbif
    id: "4822895"
species:
  - name: Arkansaurus fridayi
    etymology: "Named for Joe B. Friday, who discovered the fossilized foot on his land in Arkansas in 1972."
    status: valid
    type_species: true
    period:
      name:
        - Early Cretaceous
      stage:
        - Albian
    location:
