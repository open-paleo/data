genus: Astrodon
parent: Macronaria
etymology: From Greek 'astron' meaning 'star' and 'odon' meaning 'tooth',
  referring to the star-like cross-sectional pattern seen in its tooth enamel.
pronunciation:
  phonetic: ahs-tro-don
description: Astrodon is a genus of large herbivorous sauropod dinosaur,
  measuring 20 m (66 ft) in length, 9 m (30 ft) in height and 20 metric tons (22
  short tons) in body mass. It lived in what is now the eastern United States
  during the Early Cretaceous period, and fossils have been found in the Arundel
  Formation, which has been dated through palynomorphs to the Albian about 112
  to 110 million years ago.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Crown shaft straight, compressed cylindroid, ovate in transverse section
  - Outer side strongly convex, inner side much less convex
  - Summit compressed conical, curved inward, convex externally, depressed
    internally, sub-acute at lateral borders
  - Dentine interior with multitude of minute tubuli radiating from narrow
    elliptical pulp cavity
  - Thick enamel layer surrounding pulp cavity and dentine in transverse section
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "38674"
  - source: wikidata
    id: Q128194
  - source: eol
    id: "4531357"
synonyms:
  - name: Astrodontaurus
    type: junior objective
    reason: Original genus name proposed by Johnston, who shortened it to Astrodon
      for the published 1859 description.
  - name: Astrodonius
    type: junior objective
    reason: Material is indistinguishable from Astrodon and is treated as a junior
      synonym.
