genus: Analong
parent: Mamenchisauridae
etymology: Named for the village of A'na in Yunnan, China, where the fossils were discovered.
description: Analong is an extinct genus of mamenchisaurid sauropod from the
  Chuanjie Formation in Yunnan, China. The type and only species is Analong
  chuanjieensis.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Caudal transverse processes persisting only until the 10th caudal vertebra
    (autapomorphy)
  - Angle between ulnar anterolateral and anteromedial processes approximately
    45 degrees (autapomorphy)
  - Proximal width of metacarpal II is 7% the length of the radius, the lowest
    value among mamenchisaurids (autapomorphy)
  - Distal width approximately 40% of the total length of the pubis, the
    greatest value among mamenchisaurids (autapomorphy)
  - Weakly developed posterior condylar ball in anterior caudal vertebrae
  - Ulnar proximal condylar processes sub-equal in length
