genus: Archaeoceratops
parent: Neoceratopsia
pronunciation:
  phonetic: AHR-kee-o-SER-a-tops
etymology: From Greek 'archaios' meaning 'ancient', 'keras' meaning 'horn', and
  'ops' meaning 'face', translating to 'ancient horned face'.
description: Archaeoceratops, meaning "ancient horned face", is a genus of basal
  neoceratopsian dinosaur from the Early Cretaceous (Aptian stage) of north
  central China. It appears to have been bipedal and quite small, reaching 0.9 m
  (3.0 ft) in length and 10 kg (22 lb) in body mass. It had a comparatively
  large head but no horns, possessing only a small bony frill projecting from
  the back of its head.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
appearance:
  features:
    - neck frill
    - jugal horns
  integument: scaled
  evidence: inferred
diagnostic_features:
  - Modest bumpy ornamentation covering much of the lateral surface of the
    jugal, resembling that seen on the jugals of pachycephalosaurs.
  - Excavation on the lateral surface of the ischiadic peduncle of the ilium.
  - Shaft and proximal end of metatarsal I strongly reduced, though the
    distal condyle remains well formed.
