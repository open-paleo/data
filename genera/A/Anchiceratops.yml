genus: Anchiceratops
parent: Chasmosaurinae
pronunciation:
  ipa: /ˌæŋkiˈsɛrətɒps/
  phonetic: ANG-kee-SERR-uh-tops
etymology: "From Greek 'anchi' meaning 'near' or 'close to' and 'keratops'
  meaning 'horned face', indicating its close relationship to Triceratops."
description: Anchiceratops is an extinct genus of chasmosaurine ceratopsid
  dinosaur that lived approximately 73 to 68 million years ago during the latter
  part of the Cretaceous Period in what is now Alberta, Canada.
