genus: Anchiceratops
parent: Chasmosaurinae
pronunciation:
  ipa: /ˌæŋkiˈsɛrətɒps/
  phonetic: ANG-kee-SERR-uh-tops
etymology: "From Greek 'anchi' meaning 'near' or 'close to' and 'keratops'
  meaning 'horned face', indicating its close relationship to Triceratops."
description: Anchiceratops is an extinct genus of chasmosaurine ceratopsid
  dinosaur that lived approximately 73 to 68 million years ago during the latter
  part of the Cretaceous Period in what is now Alberta, Canada.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Supraorbital horns massive at base, rising close together and divergent,
    curving outward then forward
  - Crest large, thick and flat with small lateral fontanelles; border
    ornamented by large epioccipital bones
  - A pair of short knob-like processes on the superior posterior end of the
    crest
  - Squamosal intermediate in length between Monoclonius and Triceratops
  - Fontanelles about half as large as in Monoclonius and wholly within the
    boundary of the postfrontals
  - Epijugal attached equally to jugal and quadrato-jugal (differs from
    Triceratops where it attaches only to jugal)
appearance:
  features:
    - brow horns
    - nasal horn
    - neck frill
    - frill spikes
    - epoccipitals
  integument: scaled
  evidence: inferred
