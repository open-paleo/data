synonyms:
  - name: Walkeria
    type: preoccupied
    reason: Original generic combination, preoccupied by Walkeria
      Fleming, 1823 (Bryozoa). Renamed Alwalkeria by Chatterjee
      and Creisler (1994).
  - name: Alickmeron
    type: junior objective
    reason: Erected by Sen and Ray (2025) for the partial femora of
      ISI R 306 with proposed lagerpetid affinities, but
      Alickmeron shares the same type species (Walkeria
      maleriensis Chatterjee, 1987) and same restricted holotype
      (ISI R 306b) as Alwalkeria; objective junior synonym under
      ICZN Art. 68.3, with Alwalkeria having priority (McDavid,
      Marchant and Reid 2026).
