genus: Alwalkeria
parent: Saurischia
etymology: From the prefix 'Al-' added to 'Walkeria', the original
  (and preoccupied) genus name, which Chatterjee (1987) had
  coined in honor of British paleontologist Alick D. Walker
  for his contributions to Mesozoic vertebrate paleontology.
pronunciation:
  ipa: /ˌælwɔːˈkɪəriə/
  phonetic: al-woh-KEH-ree-uh
description: >
  Alwalkeria is a historically problematic extinct genus of
  avemetatarsalian known from the Late Triassic Lower Maleri
  Formation of India. The genus contains a single species,
  Alwalkeria maleriensis. It was initially described in 1987
  under the genus name 'Walkeria', based on a partial skull,
  several vertebrae, and fragmentary hindlimb bones. As this
  name is preoccupied, the new genus Alwalkeria was proposed to
  replace it. Early research interpreted the material belonging
  to a 'podokesaurid' (coelophysoid) theropod, herrerasaur, or
  Eoraptor-like basal eusaurischian dinosaur. Subsequent work
  recognized the chimaeric status of the fossils referred to
  this species, as they belong to multiple unrelated taxa. Some
  of the bones may belong to a dinosaur, and the skull is likely
  from a pseudosuchian. A 2025 study suggested lagerpetid
  affinities for the femora, though this was deemed unlikely by
  a subsequent review, which regarded A. maleriensis as a member
  of Pan-Aves (Avemetatarsalia) of uncertain placement.
dispute: >
  The anatomical content and phylogenetic placement of
  Alwalkeria have been actively contested. Remes and Rauhut (2005,
  conference abstract) first identified the original ISI R 306
  holotype series as a chimera; Lecuona, Ezcurra and Irmis (2016)
  reinterpreted the skull as a crocodylomorph. Novas et al.
  (2011) and Ezcurra et al. (2025) treated the genus as a valid
  basal saurischian based on the retained femur and astragalus.
  Sen and Ray (2025) erected Alickmeron maleriensis for the femora
  with proposed lagerpetid affinities. McDavid, Marchant and Reid
  (2026) refuted the lagerpetid assignment, synonymised
  Alickmeron with Alwalkeria as an objective junior synonym, and
  restricted the holotype to ISI R 306b (the distal right femur)
  with placement as Pan-Aves (Avemetatarsalia) incertae sedis.
diet: omnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Teeth unserrated; anterior teeth conical, posterior teeth laterally
    compressed with faint flutings and recurved posteriorly.
  - Maxilla lacks longitudinal alveolar ridge along the lower border of the
    antorbital fenestra.
  - Dentary bears a distinct external longitudinal alveolar groove immediately
    below the alveolar margin.
  - Dentary with an elongated median jaw symphysis, longer than in other
    podokesaurs.
  - Femur with highly expanded proximal head (approximately three times shaft
    diameter) and a greatly enlarged fourth trochanter with acute and declined
    tip.
  - Astragalus and calcaneum remain unfused even in a mature individual, unlike
    the strongly fused condition in Syntarsus and Coelophysis.
