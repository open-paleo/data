genus: Acristavus
parent: Saurolophinae
etymology: From Latin 'a-' meaning 'without', 'crista' meaning 'crest', and 'avus' meaning 'grandfather' or 'ancestor'; meaning 'non-crested grandfather'
pronunciation:
  phonetic: AK-riss-TAH-vuss
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
diagnostic_features:
  - Enlarged posterodorsal brow of postorbital and basioccipital extending
    posteriorly well beyond the dorsal border of the foramen magnum to a greater
    extent than in other hadrosaurine species.
  - Deep laterally squared frontonasal suture, with posterolateral corners at
    nearly 90-degree angles, not seen in other hadrosaurids.
  - Swelling of the interdigitate suture between the prefrontal and frontal, not
    seen in other hadrosaurids.
  - Deep depression on the lateral surface of the postorbital jugal process,
    absent in all other known hadrosaurids.
  - Dentary with nearly flat (straight) ventral margin, differing from the
    downturned anterior dentary of all other hadrosaurids.
