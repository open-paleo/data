genus: Afromimus
parent: Ceratosauria
placement: incertae sedis
dispute:
  summary: >
    Originally described as a basal ornithomimosaur (Sereno, 2017), but subsequent
    analyses reject that placement and recover Afromimus among ceratosaurs.
    Cerroni et al. (2019) place it within Abelisauroidea, and possibly
    Noasauridae, reinterpreting its proposed ornithomimosaur characters as
    ceratosaurian; Hendrickx et al. (2024) recover it in Berthasauridae, the
    sister group of Abelisauroidea. Its fragmentary material precludes confident
    assignment to any abelisauroid subclade, so it is placed conservatively at
    Ceratosauria.
  history:
    - date: "2026-06-30"
      note: >
        Moved from Ornithomimosauria to Ceratosauria following Cerroni et al.
        (2019) and Hendrickx et al. (2024), which reject ornithomimosaur affinity;
        the precise position within Ceratosauria remains unresolved.
    - date: "2026-07-02"
      note: >
        Confirmed placement at Ceratosauria incertae sedis; kept above
        Abelisauroidea because Hendrickx et al. (2024) recover it outside
        Abelisauroidea (in Berthasauridae) while Cerroni et al. (2019) recover
        it within.
etymology: From 'Africa' combined with Greek 'mimos' meaning 'mimic'; meaning
  'Africa mimic'
pronunciation:
  phonetic: AF-ro-MY-mus
description: Afromimus is a genus of ceratosaurian theropod dinosaur from the
  Early Cretaceous Elrhaz Formation of Niger. It contains a single species, A.
  tenerensis, named in 2017 by Paul Sereno from parts of the right leg,
  vertebrae, and ribs found in the Ténéré Desert. It was originally described as
  a genus of ornithomimosaurian, but subsequent arguments have placed it as a
  taxon within or close to the superfamily Abelisauroidea.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Large elliptical attachment scar on the posterolateral aspect of the
    proximal tibial shaft distal to the lateral condyle
  - Rugose attachment surface on the fibula posterior to the tibial crest
  - Trough on the anteromedial aspect of the fibular shaft ventral to the
    anterior trochanter
  - Rugose texture on non-articular surfaces of pre- and postzygapophyses of mid
    caudal vertebrae, with elevated zygapophyseal facets
  - Fused pedicels on anterior chevrons that are less than one half as long
    anteroposteriorly as broad transversely
