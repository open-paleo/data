references:
  - id: godefroit2013b
    notes: Erects the genus and species and recovers it as the basal-most
      avialan, more basal than Archaeopteryx.
  - id: agnolín2019a
    notes: Considers Aurornis xui a junior synonym of Anchiornis huxleyi,
      following Pei and others (2017), on the absence of unambiguous
      distinguishing characters.
  - id: pittman2020a
    notes: Gathers Anchiornis, Aurornis, Eosinopteryx and Xiaotingia into a
      distinct clade of early-branching avialans.
  - id: pei2020a
    notes: Scores Aurornis as a separate terminal and recovers the anchiornithine
      paravians as the earliest-diverging avialan clade.
  - id: xu2023a
    notes: Recovers an Anchiornithidae uniting Anchiornis, Aurornis, Xiaotingia
      and Eosinopteryx, with their interrelationships unresolved.
  - id: hu2018a
    notes: Distinguishes Caihong juji from Aurornis xui and the other Yanliao
      paravians, and reports the integument.
  - id: lefèvre2017a
    notes: Source of the Oxfordian dating of the Tiaojishan Formation, and
      comparative caudal counts.
