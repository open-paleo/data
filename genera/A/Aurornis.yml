genus: Aurornis
parent: Anchiornithidae
etymology: From Latin 'aurora' ('dawn', 'daybreak') and Greek 'ornis' ('bird');
  meaning 'dawn bird'.
pronunciation:
  ipa: /aʊˈrɔːrnɪs/
description: Aurornis is an extinct genus of anchiornithid theropod dinosaurs
  from the Jurassic Period of China. The genus Aurornis contains a single known
  species, Aurornis xui. Aurornis xui may be the most basal ("primitive")
  avialan dinosaur known to date, and it is one of the earliest avialans found
  to date. The fossil evidence for the animal pre-dates that of Archaeopteryx
  lithographica, often considered the earliest bird species, by about 10 million
  years.
dispute:
  summary: >
    Aurornis xui was erected from a complete articulated skeleton and recovered
    as the basal-most avialan, more basal than Archaeopteryx, with Troodontidae
    as the sister group of Avialae (Godefroit and others, 2013). Its distinctness
    has since been challenged: Pei and others (2017), followed by Agnolín and
    others (2019), regard it as a junior synonym of Anchiornis huxleyi, citing
    the absence of unambiguous characters separating the two and noting that
    Aurornis rests on a single specimen from the same beds that have yielded more
    than two hundred specimens of Anchiornis. That synonymy has not been adopted:
    Pittman and Xu (2020), Pei and others (2020) and Xu and others (2023) all
    continue to score Aurornis as a distinct terminal taxon, the last recovering
    it in an Anchiornithidae uniting Anchiornis, Aurornis, Xiaotingia and
    Eosinopteryx with their interrelationships unresolved. It is retained here as
    a valid anchiornithid, and placed at Anchiornithidae rather than at the basal
    avialan position of the describing paper, which subsequent analyses have not
    upheld.
  history:
    - date: "2026-08-07"
      note: >
        Intaken at Anchiornithidae and kept valid, following the treatment
        already applied to Serikornis and Eosinopteryx. The genus was absent
        from the dataset entirely after an unsupported synonymy was removed from
        Anchiornis; see the orphaned-taxa audit.
diet: carnivore
locomotion: bipedal
diagnostic_features:
  - Manual phalanx I-1 distinctly more robust than the radius
  - Robust postacetabular process of ilium not markedly deflected ventrally,
    with a horizontal dorsal margin
  - Distal end of ischium dorsoventrally expanded, formed by a hook-like ventral
    process delimiting a prominent distal obturator notch and by a longer dorsal
    distal process
  - Metatarsal I gracile and elongate, about 30% of metatarsal III length
