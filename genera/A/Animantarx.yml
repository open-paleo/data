genus: Animantarx
parent: Nodosauridae
pronunciation:
  phonetic: ann-i-MAN-tarks
  ipa: /ænɪˈmæntɑːrks/
etymology: "From Latin 'animatus' meaning 'living' or 'animated' and 'arx'
  meaning 'fortress' or 'citadel', meaning 'living citadel', referring to its
  heavily armored body."
description: Animantarx is a genus of nodosaurid ankylosaurian dinosaur from the
  Early and Late Cretaceous of western North America. Like other nodosaurs, it
  would have been a slow-moving quadrupedal herbivore covered in heavy armor
  scutes, but without a tail club. The skull measures approximately 25 cm (10
  inches) in length, suggesting the animal as a whole was no more than 3 meters
  (10 feet) long.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
appearance:
  features:
    - body armor
    - osteoderms
  integument: armored
diagnostic_features:
  - Parietal region highly domed
  - Postorbital horns very small
  - Deltopectoral crest shoulder very high, near level of humeral head, unlike
    all other nodosaurids
  - Coracoid elongated, about 63% of scapula length
  - Oblique ridge on anterolateral surface of femur below lesser trochanter
  - Armor pattern of skull roof indistinguishable (individual plates not
    discernible)
