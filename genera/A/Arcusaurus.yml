genus: Arcusaurus
parent: Sauropodomorpha
etymology: From Latin 'arcus' meaning 'rainbow', a reference to South Africa being known as the Rainbow Nation, combined with Greek 'sauros' meaning 'lizard'.
description: Arcusaurus is an extinct genus of sauropodomorph dinosaur from the
  Early Jurassic (Pliensbachian stage) of South Africa. Arcusaurus was first
  named by Adam Yates, Matthew Bonnan and Johann Neveling in 2011 and the type
  species is Arcusaurus pereirabdalorum. The generic name is derived from Latin
  arcus, "rainbow", a reference to the Rainbow Nation. The specific epithet
  honors Lucille Pereira and Fernando Abdala who discovered the fossils.
locomotion: bipedal
paleoenvironment:
  - fluvial
  - arid
diet: herbivore
diagnostic_features:
  - Horizontal medial shelf projecting from dorsal margin of premaxillary body,
    offset caudally by a notch
  - Base of caudomedial process of premaxilla expanded into a horizontal palatal
    shelf contacting its antimere
  - Postorbital with parietal articulation surface borne on a dorsally
    projecting semilunate process
  - Fine ridge on nasal extending from medial edge of prefrontal embayment to
    near center of bone
  - Dentary with a single enlarged neurovascular foramen opening near the
    rostral tip of the lateral surface
  - Distal caudal vertebra with dorsoventrally compressed centrum (cranial face
    1.43 times wider than high)
