genus: Atrociraptor
parent: Saurornitholestinae
dispute:
  summary: >
    Atrociraptor was originally described as a velociraptorine (Currie and
    Varricchio, 2004) but is recovered within Saurornitholestinae, as the sister
    taxon of Saurornitholestes, by most recent analyses (Longrich and Currie, 2009;
    Currie and Evans, 2019; Powers et al., 2022; Jones et al., 2026), the placement
    adopted here.
  history:
    - date: "2026-07-01"
      note: Placed in Saurornitholestinae following the recent consensus (Currie and Evans, 2019; Powers et al., 2022); original velociraptorine placement noted.
pronunciation:
  ipa: /əˌtrɑːsiˈræptər/
  phonetic: Ah-TROSS-ee-rap-tor
etymology: "From Latin 'atrox' meaning 'savage' or 'cruel' and 'raptor' meaning
  'robber' or 'thief', meaning 'savage robber'."
description: Atrociraptor is a genus of dromaeosaurid dinosaur that lived during
  the Late Cretaceous in what is now Alberta, Canada. The first specimen, a
  partial skull, was discovered in 1995 by the fossil collector Wayne Marshall
  in the Horseshoe Canyon Formation, about 5 km (3 mi) from the Royal Tyrrell
  Museum of Palaeontology where it was brought for preparation. In 2004, the
  specimen became the holotype of the new genus and species Atrociraptor
  marshalli; the generic name is Latin for "savage robber", and the specific
  name refers to Marshall. The holotype consists of the premaxillae (frontmost
  bones of the upper jaw), a maxilla (main bone of the upper jaw), the dentaries
  (tooth-bearing bones of the lower jaw), associated teeth, and other skull
  fragments. Isolated teeth from the same formation have since been assigned to
  Atrociraptor.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Shorter, deeper face than Saurornitholestes and Velociraptor; subnarial body
    of premaxilla taller than its anteroposterior length
  - Internarial and maxillary processes of premaxilla subparallel and oriented
    more dorsally than posteriorly
  - Maxillary fenestra larger than in any other velociraptorines and positioned
    directly above the promaxillary fenestra rather than well behind it
  - Maxillary teeth more strongly inclined toward the throat (posteroventrally)
    than in all other dromaeosaurids except Bambiraptor and Deinonychus
  - Maxillary dentition essentially isodont with no replacement gaps and minimal
    height variation between adjacent teeth
appearance:
  features:
    - enlarged caniniform teeth
  integument: feathered
  evidence: inferred
