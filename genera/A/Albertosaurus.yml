genus: Albertosaurus
parent: Albertosaurinae
etymology: Alberta lizard
pronunciation:
  ipa: /ælˌbɜːrtəˈsɔːrəs/
description: Albertosaurus is a genus of large tyrannosaurid theropod dinosaur
  that lived in northwestern North America during the early to middle
  Maastrichtian age of the Late Cretaceous period, about 71 million years ago.
  The type species, A. sarcophagus, was apparently restricted in range to the
  modern-day Canadian province of Alberta, after which the genus is named,
  although an indeterminate species ("cf. Albertosaurus sp.") has been
  discovered in the Corral de Enmedio and Packard Formations of Mexico.
  Scientists disagree on the content of the genus and some recognize Gorgosaurus
  libratus as a second species.
