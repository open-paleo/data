genus: Albertosaurus
parent: Albertosaurinae
etymology: Named after Alberta, Canada, combined with Greek 'sauros' meaning
  'lizard'; meaning 'Alberta lizard'
pronunciation:
  phonetic: al-BUHR-to-SAWR-us
  ipa: /ælˌbɜːrtəˈsɔːrəs/
description: Albertosaurus is a genus of large tyrannosaurid theropod dinosaur
  that lived in northwestern North America during the early to middle
  Maastrichtian age of the Late Cretaceous period, about 71 million years ago.
  The type species, A. sarcophagus, was apparently restricted in range to the
  modern-day Canadian province of Alberta, after which the genus is named,
  although an indeterminate species ("cf. Albertosaurus sp.") has been
  discovered in the Corral de Enmedio and Packard Formations of Mexico.
  Scientists disagree on the content of the genus and some recognize Gorgosaurus
  libratus as a second species.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Mandibular ramus devoid of triangular osseous plates between the teeth
  - Anterior truncate teeth reduced to a single small pair
  - Fifteen mandibular teeth, including one small anterior tooth truncated
    posteriorly
  - Reduced alveolar partitions between the mandibular teeth; principal alveolar
    grooves on inner surface of outer dentary wall with little or no development
    of grooves on alveolar plate
  - Skull with two preorbital openings; lower jaw with a distinct presplenial
  - Teeth laterally compressed, lenticular in section, upper portion more
    rounded oval, near bases recurved, serrate on both borders
