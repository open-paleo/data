genus: Asylosaurus
parent: Sauropodomorpha
placement: incertae sedis
etymology: From Ancient Greek asylos (ἄσυλος) meaning 'unharmed, inviolable,
  having right of asylum' + Greek sauros (σαῦρος) meaning 'lizard'; overall
  meaning 'unharmed lizard', referring to the specimens surviving World War II
  bombardment unlike the Thecodontosaurus holotype.
pronunciation:
  phonetic: ah-SIGH-lo-SOR-US
description: Asylosaurus is a genus of basal sauropodomorph dinosaur from the
  Late Triassic Avon Fissure Fill of England. It is based on partial remains,
  discovered in the autumn of 1834, described in 1836 by Henry Riley and Samuel
  Stutchbury as pertaining to Thecodontosaurus, that Othniel Charles Marsh
  brought to Yale University between 1888 and 1890. These remains thus escaped
  destruction by a bombardment in 1940 during World War II, unlike the original
  holotype of Thecodontosaurus. Asylosaurus was described in 2007 by Peter
  Galton. The type species is A. yalensis, referring to Yale. The bones
  originally came from a Rhaetian-age cave fill at Durdham Down, Clifton,
  Bristol.
dispute:
  summary: >
    Asylosaurus yalensis is a basal sauropodomorph from the Late Triassic
    of England, closely comparable to Thecodontosaurus; Jones (2026)
    regards it as a probable nomen dubium whose material cannot be
    confidently distinguished from Thecodontosaurus.
  history:
    - date: "2026-06-29"
      note: Placed at Sauropodomorpha incertae sedis; possible nomen dubium close to Thecodontosaurus.
locomotion: bipedal
paleoenvironment:
  - fluvial
diet: herbivore
diagnostic_features:
  - Deltopectoral crest symmetrical in lateral view with gently rounded apex at
    25% of humeral length
  - Manus with lateral reduction giving phalangeal formula 2-3-4-2-1
  - Distal ischia separated by a Λ-shaped cleft in dorsal view at the thickest
    parts
