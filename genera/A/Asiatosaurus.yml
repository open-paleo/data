genus: Asiatosaurus
parent: Sauropoda
etymology: From Greek Asia and sauros (lizard); meaning "Asian
  lizard", with the genus name explicitly derived in the original
  description.
pronunciation:
  phonetic: AY-see-AT-o-SOR-us
description: >
  Asiatosaurus is a dubious sauropod tooth-taxon erected by Osborn
  (1924) on isolated camarasaur-like teeth from the Öösh Formation
  of Mongolia. The type species A. mongoliensis is based on a single
  posterior dentary tooth (AMNH 6264) from the Oshih basin; Osborn
  himself noted that the holotype and paratype might not belong to
  the same individual or even the same species. A second nominal
  species (A. kwangshiensis) was named on a tooth from China and is
  also generally treated as a nomen dubium. Asiatosaurus has been
  variably placed in Camarasauridae, Brachiosauridae, and
  Euhelopodidae over the decades, but the fragmentary nature of the
  type material precludes confident placement.
diet: herbivore
locomotion: quadrupedal
diagnostic_features:
  - Subspatulate dentary tooth crown with an asymmetric apex; the
    internal (lingual) surface is spoon-shaped near the crown tip,
    bearing a small median vertical groove.
  - Tooth crown more robust anteroposteriorly than in classic
    Morrison-Formation camarasaurs, with two lateral grooves on the
    external surface flanking the apex.
paleoenvironment:
  - fluvial
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "38704"
  - source: wikidata
    id: Q680860
  - source: gbif
    id: "4822802"
species:
  - name: Asiatosaurus mongoliensis
    etymology: From mongoliensis ("of Mongolia"), referring to the
      country of origin of the holotype.
    status: nomen dubium
    type_species: true
    period:
      name:
        - Early Cretaceous
      stage:
        - Aptian
        - Albian
    location:
      country: MN
      region: MN-055
      formation: Öösh
      locality: Red Mesa
    type_specimen:
      specimen_id:
        - AMNH 6264
      specimen_type: holotype
      institution: AMNH
      material: Single posterior dentary tooth with a subspatulate
        crown bearing two lateral external grooves and one median
        internal groove.
      completeness: fragmentary
    erected_in: osborn1924a
references:
