genus: Acrocanthosaurus
parent: Carcharodontosauridae
pronunciation:
  ipa: /ˌækroʊˌkænθəˈsɔːrəs/
description: Acrocanthosaurus is a genus of carcharodontosaurid dinosaurs that
  existed in what is now North America during the Barremian and early Cenomanian
  stages of the Early Cretaceous and Late Cretaceous, from 125 to 99.6 million
  years ago. Like most dinosaur genera, Acrocanthosaurus contains only a single
  species, A. atokensis. It had a continent-wide range, with fossil remains
  known from the U.S. states of Oklahoma, Texas, and Wyoming in the west and
  Maryland in the east. However, most of these remains are assigned to the
  species based on the assumption that Acrocanthosaurus is the only large
  carcharodontosaurid from North America during this time, and the possibility
  exists that some referred specimens could represent distinct taxa.
