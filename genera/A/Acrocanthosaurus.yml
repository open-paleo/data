  - specimen_id: [UM 20796]
    institution: UM
    species: Acrocanthosaurus atokensis
    category: range-extension
    significance: "A juvenile partial skeleton that established the presence of the genus in the Cloverly Formation of Wyoming in 2012. Found near the shoulder blade of a Sauroposeidon in a Bighorn Basin bonebed."
