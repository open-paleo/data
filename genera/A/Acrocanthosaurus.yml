    species: Acrocanthosaurus atokensis
    category: historic
    significance: "A partial skeleton missing most of the skull from the Twin Mountains Formation of Texas, one of the first much more complete specimens described in the 1990s; now part of the Fort Worth Museum of Science and History collection."
