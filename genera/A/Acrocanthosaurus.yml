  - specimen_id: [USNM 466054]
    institution: NMNH
    category: range-extension
    significance: "Subadult identified in 2024 as the first definitive record of the genus from eastern North America. The most completely known theropod from the Arundel Formation, previously misidentified as an ornithomimosaur, and the smallest known individual of the genus."
    discovered:
      year: 1992
    reference: carrano2024
