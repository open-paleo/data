genus: Adeopapposaurus
parent: Massospondylidae
etymology: From Greek 'adeo' meaning 'to eat one's fill' (or 'far'), 'pappo' meaning 'grandfather' or possibly 'eating', and 'sauros' meaning 'lizard'; meaning 'far eating lizard', referring to its long neck
pronunciation:
  phonetic: ah-dee-o-pah-po-sor-us
description: Adeopapposaurus is a genus of plateosaurian dinosaur from the Early
  Jurassic Cañón del Colorado Formation of San Juan, Argentina. It was similar
  to Massospondylus. Four partial skeletons with two partial skulls are known.
locomotion: bipedal
paleoenvironment:
  - fluvial
diet: herbivore
diagnostic_features:
  - Series of large foramina in a sub-vertical row on the lateral surface of the
    premaxilla.
  - Strongly rugose depression bordered by a protuberance with a series of
    foramina in a sub-vertical row on the lateral surface of the anterior end of
    the dentary.
  - Eleven anteroposteriorly elongated cervical vertebrae.
  - Thirteen dorsal vertebrae with neural arches taller than their respective
    centra.
