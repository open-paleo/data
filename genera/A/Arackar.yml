genus: Arackar
parent: Lithostrotia
etymology: From Kunza (the language of the Atacameno people of Chile) 'arackar' meaning 'skeleton'
description: Arackar is an extinct genus of lithostrotian sauropod, possibly
  part of the Saltasauridae, discovered in the Hornitos Formation of Atacama
  Province, Chile. The genus contains a single species, Arackar licanantay,
  described by Rubilar-Rogers et al. in 2021.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - lacustrine
diagnostic_features:
  - Wide and tall centroprezygapophyseal fossa + parapophyseal
    centroprezygapophyseal fossa (cprf + pacprf) extending on entire anterior
    faces of pedicles but not above the neural canal (middle neural arches)
  - Reduced spinopostzygapophyseal laminae (spol) shorter than the
    postzygapophyseal facet length (middle neural arches)
  - Spinopostzygapophyseal lamina inclined laterally less than 20° to the
    horizontal with an anterodorsal concave (saddle-shaped) face (anterior
    dorsal arches)
  - Absence of intrapostzygapophyseal lamina (tpol) in anterior dorsal arches
  - Ischium pubic articulation greater than the anteroposterior length of the
    proximal plate peduncle, with a relatively short and narrow posterior
    process
