genus: Arackar
parent: Lithostrotia
etymology: From Kunza (the language of the Atacameno people of Chile) 'arackar' meaning 'skeleton'
description: Arackar is an extinct genus of lithostrotian sauropod, possibly
  part of the Saltasauridae, discovered in the Hornitos Formation of Atacama
  Province, Chile. The genus contains a single species, Arackar licanantay,
  described by Rubilar-Rogers et al. in 2021.
diet: herbivore
