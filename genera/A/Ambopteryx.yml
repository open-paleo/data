genus: Ambopteryx
parent: Scansoriopterygidae
etymology: From Latin 'ambo' meaning 'both' and Greek 'pteryx' meaning 'wing'; meaning 'both wing', referring to the animal's membranous wings and bird-like body plan
pronunciation:
  phonetic: am-BOH-tuh-riks
description: Ambopteryx is a genus of scansoriopterygid dinosaur from the
  Oxfordian stage of the Late Jurassic of China. It is the second dinosaur to be
  found with both feathers and bat-like membranous wings. Yi, the first such
  dinosaur, was described in 2015 and is the sister taxon to Ambopteryx. The
  holotype specimen is thought to be a sub-adult or adult. The specimen is
  estimated to have had a body length of 32 centimeters (13 in) and a weight of
  306 grams (10.8 oz). The genus includes one species, Ambopteryx longibrachium.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
  - forested
appearance:
  features:
    - membranous wing
    - elongate forelimbs
  integument: feathered
diagnostic_features:
  - Ulna substantially wider (approximately 2×) than radius
  - Short tail that lacks a transition point and ends in a fused pygostyle
  - Elongate forelimb approximately 1.3× longer than the hindlimb
  - Straight, rod-like postacetabular process of ilium
  - Tibia shorter than humerus
