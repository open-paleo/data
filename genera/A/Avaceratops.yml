genus: Avaceratops
parent: Nasutoceratopsini
etymology: "Named after Ava Cole, wife of fossil hunter Eddie Cole who discovered the specimen, combined with Greek 'ceratops' meaning 'horned face'. The species name honors the Lammers family, owners of the Careless Creek Ranch where the fossil was found."
description: Avaceratops is a genus of small herbivorous ceratopsian dinosaurs
  which lived during the late Campanian in what are now the Northwest United
  States. Most fossils come from the Judith River Formation.
diet: herbivore
locomotion: quadrupedal
