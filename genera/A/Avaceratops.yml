genus: Avaceratops
parent: Nasutoceratopsini
pronunciation:
  phonetic: AY-va-SER-a-tops
etymology: "Named after Ava Cole, wife of fossil hunter Eddie Cole who
  discovered the specimen, combined with Greek 'ceratops' meaning 'horned face'.
  The species name honors the Lammers family, owners of the Careless Creek Ranch
  where the fossil was found."
description: Avaceratops is a genus of small herbivorous ceratopsian dinosaurs
  which lived during the late Campanian in what are now the Northwest United
  States. Most fossils come from the Judith River Formation.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Short-squamosaled ceratopsid with distinctive robust squamosal bearing a
    long rostral portion that equals or exceeds the length of the caudal portion
  - Squamosal prominent in frill outline and does not continue the smooth curve
    of the parietal border, having its own center and radius of curvature
  - Parietal fan-shaped and thin, with no sagittal emargination along the caudal
    margin; parietal fenestrae apparently absent (solid frill inferred)
  - Jugal thin, unsculptured, and lacking a central ridge
  - Maxilla robust with a strong medial longitudinal ridge
  - Occipital condyle fully fused (no sutural trace) at a small diameter of 38
    mm, suggesting an unusual growth pattern
