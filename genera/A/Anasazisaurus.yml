genus: Anasazisaurus
parent: Hadrosaurinae
pronunciation:
  ipa: /ˌɑːnəˌsɑːziˈsɔːrəs/
description: Anasazisaurus is a genus of saurolophine hadrosaurid ("duckbill")
  ornithopod dinosaur that lived about 74 million years ago, in the Late
  Cretaceous Period. It was found in the Farmington Member of the Kirtland
  Formation, in the San Juan Basin of New Mexico, United States. Only a partial
  skull has been found to date. It was first described as a specimen of
  Kritosaurus by Jack Horner, and has been intertwined with Kritosaurus since
  its description. It is known for its short nasal crest, which stuck out above
  and between its eyes for a short distance.
diet: herbivore
locomotion: facultative
