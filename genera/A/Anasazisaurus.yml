genus: Anasazisaurus
parent: Saurolophinae
pronunciation:
  phonetic: AH-nuh-SAH-zee-SOR-uhs
  ipa: /ˌɑːnəˌsɑːziˈsɔːrəs/
etymology: "Named for the Anasazi (Ancestral Pueblo Native Americans) of the
  American Southwest, combined with Greek 'sauros' meaning 'lizard', meaning
  'Anasazi lizard'."
description: Anasazisaurus is a genus of saurolophine hadrosaurid ("duckbill")
  ornithopod dinosaur that lived about 74 million years ago, in the Late
  Cretaceous Period. It was found in the Farmington Member of the Kirtland
  Formation, in the San Juan Basin of New Mexico, United States. Only a partial
  skull has been found to date. It was first described as a specimen of
  Kritosaurus by Jack Horner, and has been intertwined with Kritosaurus since
  its description. It is known for its short nasal crest, which stuck out above
  and between its eyes for a short distance.
dispute:
  summary: >
    Prieto-Márquez (2013) synonymized Anasazisaurus into Kritosaurus as
    K. horneri, treating its distinctive downturned nasal as individual
    or ontogenetic variation; other workers retain it as a distinct
    kritosaurin genus. Kept valid within Saurolophinae pending broader
    consensus.
  history:
    - date: "2026-06-27"
      note: Placed at Saurolophinae following the kritosaurin consensus
        (Prieto-Márquez, 2013; Jones, 2026); genus-level synonymy with
        Kritosaurus reflected but not adopted.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
diagnostic_features:
  - Short, posteriorly folded nasal crest that is above the level of the
    frontals but does not extend posterior to the anterior end of the frontals
