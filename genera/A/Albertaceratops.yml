genus: Albertaceratops
parent: Centrosaurinae
etymology: Named after Alberta, Canada, combined with Greek 'keras' meaning
  'horn' and 'ops' meaning 'face'; meaning 'Alberta horned face'
description: Albertaceratops is a genus of centrosaurine horned dinosaur from
  the middle Campanian-age Upper Cretaceous Oldman Formation of Alberta, Canada.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Low, thick, elongate nasal ornamentation (long-based boss; unfused until
    late ontogeny, unlike other centrosaurines)
  - Unmodified adult-sized postorbital horncores wide-based, elongated, massive,
    and oriented rostrolaterally
  - Parietal with pair of wide-based, large, pachyostotic, dorsoventrally
    depressed, rostrally curved processes originating from the caudolateral
    margin of the parietals (P3 processes)
appearance:
  features:
    - brow horns
    - neck frill
    - epoccipitals
    - cranial bosses
  integument: scaled
  evidence: inferred
