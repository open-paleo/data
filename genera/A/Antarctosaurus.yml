genus: Antarctosaurus
parent: Titanosauria
etymology: From Greek 'antarktikos' meaning 'southern' (opposite of the
  north/arctic) and 'sauros' meaning 'lizard'; meaning 'southern lizard'
pronunciation:
  phonetic: an-TARK-to-SAWR-us
  ipa: /ænˌtɑːrktoʊˈsɔːrəs/
description: Antarctosaurus is a genus of titanosaurian sauropod dinosaur from
  the Late Cretaceous Period of what is now South America. The type species,
  Antarctosaurus wichmannianus, and a second species, Antarctosaurus giganteus,
  were described by prolific German paleontologist Friedrich von Huene in 1929.
  Three additional species of Antarctosaurus have been named since then but
  later studies have considered them dubious or unlikely to pertain to the
  genus.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Skull recalls Diplodocus but very tall behind; snout extremely wide,
    mandibular border transversely straight
  - Peg-shaped teeth similar to Diplodocus; lower jaw forms right angles at both
    anterior corners
  - Supraoccipital forms cone behind parietals; long basipterygoid processes
  - Quadrate ham-shaped; extraordinarily large orbit positioned far back and high
  - Posterior cervical vertebrae flat, wide, deeply furrowed on flanks with
    coarse mesh interior
  - Scapula slender with very tall deltoid process projecting at right angle
  - Femur straight and slender with highly vaulted head; fourth trochanter above
    midpoint
  - Tibia with both articular terminations very thick; tibial tuberosity
    prominent but relatively smaller than Titanosaurus
appearance:
  integument: scaled
  evidence: inferred
