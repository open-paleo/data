genus: Ardetosaurus
parent: Diplodocinae
etymology: "From Latin 'ardērē' meaning 'to burn' and Ancient Greek 'sauros' meaning 'lizard', referring to the holotype specimen's burn damage from the 2003 Dinosaurier Freilichtmuseum fire."
description: Ardetosaurus is an extinct genus of diplodocid sauropod dinosaurs
  from the Late Jurassic (Kimmeridgian) Morrison Formation of northern Wyoming,
  United States. The genus contains a single species, Ardetosaurus viator. It
  was first described in 2024 on the basis of a partial articulated skeleton,
  including vertebrae from the neck, back, and tail, hip bones, and part of the
  left hindlimb. The genus is a member of the Diplodocinae, a subfamily of large
  long-necked dinosaurs with whiplike tails. Ardetosaurus represents one of many
  distinct sauropod taxa that coexisted in this formation.
diet: herbivore
locomotion: quadrupedal
