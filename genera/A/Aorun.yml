genus: Aorun
parent: Avetheropoda
placement: incertae sedis
dispute:
  summary: >
    Aorun zhaoi is based on a juvenile skeleton, and its affinities are highly
    unstable. It was originally described as a basal coelurosaur (Choiniere et
    al., 2013) and recovered as an early-diverging alvarezsaurian by Xu et al.
    (2018), Qin et al. (2019), and — with weak support — Meso et al. (2024).
    Broad theropod analyses reject this: Hartman et al. (2019) recovered it as a
    compsognathid, and Cau (2024) recovered it as an early-diverging allosauroid,
    interpreting its coelurosaurian signal as an artifact of the holotype's
    juvenile ontogeny. Jones (2026) treats it as a basal coelurosaur.
  history:
    - date: "2026-07-01"
      note: >
        Placed conservatively at Avetheropoda, the least-inclusive clade
        shared by all hypotheses; alvarezsaurian, compsognathid, and
        allosauroid placements are all in play.
    - date: "2026-07-02"
      note: >
        Confirmed placement at Avetheropoda incertae sedis; the
        within-Coelurosauria-versus-allosauroid position remains unresolved
        and is confounded by the juvenile holotype.
etymology: "From Mandarin Chinese, a shortened masculine name of Ao Run, the Chinese mythical deity and Dragon King of the West Sea in the epic Journey to the West. The species name honors Professor Zhao Xijin."
pronunciation:
  phonetic: AW-roon
description: Aorun (敖闰 pinyin Áo rùn) is a genus of carnivorous theropod
  dinosaur first discovered in 2006, with its scientific description published
  in 2013. It is generally considered one of the oldest known coelurosaurian
  dinosaurs and is estimated to have lived ~161.6 million years ago during the
  Late Jurassic Period, though some researchers consider it to be a carnosaurian
  instead.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Large maxillary fenestra occupying most of the antorbital fossa
  - Maxillary teeth with very small, apically directed serrations restricted to
    the distal carinae
  - Weakly opisthocoelous cervical centra
  - "Heterogeneous manual ungual morphology: large, recurved medial ungual and
    two smaller lateral unguals with linear (not curved) ventral surfaces"
  - Tibia with mediolaterally narrow, proximodistally tall articular groove for
    ascending process of astragalus developed only on anterolateral margin
  - Ascending process of astragalus low and restricted to lateral side of tibia
