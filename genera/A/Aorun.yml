genus: Aorun
parent: Alvarezsauria
etymology: "From Mandarin Chinese, a shortened masculine name of Ao Run, the Chinese mythical deity and Dragon King of the West Sea in the epic Journey to the West. The species name honors Professor Zhao Xijin."
description: Aorun (敖闰 pinyin Áo rùn) is a genus of carnivorous theropod
  dinosaur first discovered in 2006, with its scientific description published
  in 2013. It is generally considered one of the oldest known coelurosaurian
  dinosaurs and is estimated to have lived ~161.6 million years ago during the
  Late Jurassic Period, though some researchers consider it to be a carnosaurian
  instead.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Large maxillary fenestra occupying most of the antorbital fossa
  - Maxillary teeth with very small, apically directed serrations restricted to
    the distal carinae
  - Weakly opisthocoelous cervical centra
  - "Heterogeneous manual ungual morphology: large, recurved medial ungual and
    two smaller lateral unguals with linear (not curved) ventral surfaces"
  - Tibia with mediolaterally narrow, proximodistally tall articular groove for
    ascending process of astragalus developed only on anterolateral margin
  - Ascending process of astragalus low and restricted to lateral side of tibia
