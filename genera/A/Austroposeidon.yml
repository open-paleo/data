genus: Austroposeidon
parent: Lognkosauria
etymology: From Latin austro- meaning 'southern' + Poseidon (Ποσειδῶν), the Greek god of the sea, used here as a reference to enormous size (as in Sauroposeidon); overall meaning 'Southern Poseidon'.
description: Austroposeidon is a genus of titanosaurian sauropod dinosaur from
  the Late Cretaceous Presidente Prudente Formation of Brazil. It contains one
  species, Austroposeidon magnificus (meaning "Magnificent Southern Poseidon").
