genus: Austroposeidon
parent: Lognkosauria
etymology: From Latin austro- meaning 'southern' + Poseidon (Ποσειδῶν), the Greek god of the sea, used here as a reference to enormous size (as in Sauroposeidon); overall meaning 'Southern Poseidon'.
pronunciation:
  phonetic: Oss-tro-puh-SIGH-don
description: Austroposeidon is a genus of titanosaurian sauropod dinosaur from
  the Late Cretaceous Presidente Prudente Formation of Brazil. It contains one
  species, Austroposeidon magnificus (meaning "Magnificent Southern Poseidon").
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Columnar-like centropostzygapophyseal laminae (cpol) in the last cervical
    vertebrae (Cv 13), with proximal and distal expansions reaching nearly the
    height of the centrum
  - Last cervical vertebra bearing a bifurcated posterior centrodiapophyseal
    lamina (pcdl), each segment inclined dorsally and diverging from the
    posteriormost portion
  - First dorsal vertebra with anterior and posterior centrodiapophyseal laminae
    (acdl/pcdl) curved ventrolaterally and with the diapophysis reaching the
    dorsal margin of the centrum
  - Anteriormost portion of the spinoprezygapophyseal laminae (sprl) forked in
    the posterior dorsal vertebra
