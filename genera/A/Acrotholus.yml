genus: Acrotholus
parent: Pachycephalosaurinae
etymology: From Greek 'akros' meaning 'highest' and 'tholos' meaning 'dome', referring to its prominent domed skull.
description: Acrotholus is an extinct genus of pachycephalosaurian dinosaur that
  lived during the Santonian of the late Cretaceous, in the Milk River Formation
  of Canada. The type species, A. audeti, was named after Roy Audet allowing
  access to his ranch leading to the discovery of the species. The discovery of
  this specimen lead to several new revelations in the fossil records
  questioning the preservation of small-bodied organisms along with the
  evolution of early pachycephalosaurs. The iconic cranial dome found on
  Acrotholus makes it one of the earliest indisputable known members of the
  pachycephalosaur family. Like others of its clade, Acrotholus was a bipedal
  herbivore characterized by a dome-shaped head. The dome had often been
  associated with intra-species combat, although the exact methods of contact
  have been debated.
diet: herbivore
locomotion: bipedal
