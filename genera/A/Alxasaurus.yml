genus: Alxasaurus
parent: Therizinosauroidea
etymology: Named after the Alxa (Alashan) Desert/region of Inner Mongolia combined with Greek 'sauros' meaning 'lizard'; meaning 'Alxa lizard'
pronunciation:
  phonetic: AHL-shah-SAWR-us
  ipa: /ˌɑːlʃəˈsɔːrəs/
description: Alxasaurus is a genus of therizinosauroid theropod dinosaurs from
  the Early Cretaceous (Albian age) Bayin-Gobi Formation of Inner Mongolia. It
  is known from five specimens, recovered from the Bayin-Gobi in 1988, as part
  of the China-Canada Dinosaur Project. During their preparation,
  palaeontologists Dong Zhiming and Dale Russell noted strong similarities to
  Segnosaurus. In 1993, they described Alxasaurus and named its type species, A.
  elesitaiensis. While therizinosaurs had previously been tentatively seen as
  late-surviving basal sauropodomorphs, the description of Alxasaurus lent
  credence to the idea that they were instead highly derived coelurosaurs.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
