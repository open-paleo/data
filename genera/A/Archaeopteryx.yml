genus: Archaeopteryx
parent: Avialae
pronunciation:
  phonetic: AHR-kee-OP-ter-iks
  ipa: /ˌɑːrkiːˈɒptərɪks/
etymology: "From Greek 'archaios' meaning 'ancient' and 'pteryx' meaning
  'feather' or 'wing', meaning 'ancient wing'."
description: Archaeopteryx , sometimes referred to by its German name,
  "Urvogel " (lit. 'Primeval Bird') is a genus of bird-like dinosaurs. The genus
  name derives from the Ancient Greek ἀρχαῖος (archaîos), meaning 'ancient', and
  πτέρυξ (ptérux), meaning 'feather, wing'. Between the late 19th century and
  the early 21st century, Archaeopteryx was generally accepted by
  paleontologists and popular reference books as the oldest known bird (member
  of the group Avialae). Older potential avialans have since been identified,
  including Anchiornis, Xiaotingia, Aurornis, and Baminornis.
diet: insectivore
locomotion: bipedal
paleoenvironment:
  - marine
  - coastal
diagnostic_features:
  - True petrification preserved in lithographic shale, fully consistent with a
    bird feather
  - Nearly complete skeleton covered with feathers, differing in several
    respects from living birds
appearance:
  features:
    - feathered wings
    - feathered tail
    - hindlimb feathers
    - enlarged manual claws
  integument: feathered
  evidence: direct
