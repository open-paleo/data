notable_specimens:
  - nickname: "Thermopolis specimen"
    specimen_id: [WDC CSG 100]
    institution: WYDICE
    category: exceptional-preservation
    significance: "Has the best-preserved head and feet. Showed Archaeopteryx lacked a reversed toe, limiting perching, and confirmed a hyperextensible second toe, interpreted as evidence of theropod ancestry. Regarded as the most complete and best-preserved Archaeopteryx remains."
    references: [mayr2005]
  - nickname: "Berlin specimen"
    specimen_id: [HMN 1880/81]
    institution: HM
    category: most-complete
    significance: "The most complete specimen and the first with a complete head. Its body plumage, including leg feathering, is the best researched of any Archaeopteryx. Basis for the name siemensii and a key reference for the genus."
    discovered:
      year: 1874
      by: "Jakob Niemeyer"
    references: [dames1884]
  - nickname: "Chicago specimen"
    specimen_id: [FMNH PA 830]
    institution: FMNH
    category: exceptional-preservation
    significance: "The fourteenth specimen, described in 2025 by O'Connor and colleagues, preserving the first known tertials and other novel features. A 2026 CT study reported avian-like soft-tissue correlates including oral papillae and a mobile tongue."
    references: [oconnor2025]
  - nickname: "Solnhofen specimen"
    institution: BMMS
    category: largest-individual
    significance: "The largest known specimen, missing only portions of the neck, tail, backbone, and head. Originally misidentified as Compsognathus, it has been proposed as a separate genus and species, Wellnhoferia grandis."
    discovered:
      by: "Friedrich Müller"
    references: [elzanowski2001]
  - nickname: "Munich specimen"
    specimen_id: [BSP 1999 I 50]
    institution: BSPG
    category: exceptional-preservation
    significance: "A nearly complete specimen missing only the front of the face. Basis for the proposed species A. bavarica; a possible cartilaginous sternum and its juvenile status have figured in debates over Archaeopteryx flight ability."
    discovered:
      year: 1992
    references: [wellnhofer1993]
