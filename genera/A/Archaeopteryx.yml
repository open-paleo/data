genus: Archaeopteryx
parent: Avialae
pronunciation:
  ipa: /ˌɑːrkiːˈɒptərɪks/
description: Archaeopteryx , sometimes referred to by its German name,
  "Urvogel " (lit. 'Primeval Bird') is a genus of bird-like dinosaurs. The genus
  name derives from the Ancient Greek ἀρχαῖος (archaîos), meaning 'ancient', and
  πτέρυξ (ptérux), meaning 'feather, wing'. Between the late 19th century and
  the early 21st century, Archaeopteryx was generally accepted by
  palaeontologists and popular reference books as the oldest known bird (member
  of the group Avialae). Older potential avialans have since been identified,
  including Anchiornis, Xiaotingia, Aurornis, and Baminornis.
