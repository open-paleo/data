genus: Austrocheirus
parent: Noasauridae
dispute:
  summary: >
    The position of Austrocheirus is unresolved: it was originally described
    as a basal abelisauroid (Ezcurra and colleagues, 2010), later assigned
    within Noasauridae (Tortosa and colleagues, 2014), and recovered by
    Hendrickx and colleagues (2024) in the poorly supported clade
    Berthasauridae, sister to Abelisauroidea.
  history:
    - date: "2026-06-30"
      note: >
        Placed at Noasauridae following Tortosa and colleagues (2014) and
        reference-work usage; Berthasauridae recorded but not adopted.
etymology: From Latin austro- meaning 'southern' + Greek cheir (χείρ) meaning 'hand'; overall meaning 'southern hand', referring to its discovery in southern Argentina and the partial hand fossils known.
pronunciation:
  phonetic: OSS-tro-KIE-russ
description: Austrocheirus is an extinct genus of theropod dinosaur that lived
  during the Late Cretaceous period. It was named and described by Martin
  Ezcurra, Federico Agnolín and Fernando Novas in 2010. It contains the type
  species Austrocheirus isasii. The generic name means "southern hand". The
  specific epithet honors discoverer and preparator Marcelo Pablo Isasi.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Metacarpal III with a dorsoventrally tapering shaft towards its proximal end
    (shaft two times lower than height of distal articular condyles).
  - Metacarpal III with posteriorly displaced collateral tendon fossae located
    at the same level of the proximal end of distal condyles.
  - Pedal phalanges with a conspicuous longitudinal crest delimiting the dorsal
    margin of the distal collateral tendon fossae.
  - Tibia with a slightly convex posterior surface at the distal end.
  - Metatarsal III with a very well-developed ventral scar for the insertion of
    the M. gastrocnemius.
