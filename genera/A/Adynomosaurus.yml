genus: Adynomosaurus
parent: Lambeosaurinae
etymology: From Greek 'adynamos' meaning 'weak' or 'powerless' and 'sauros' meaning 'lizard', referring to its underdeveloped shoulder musculature.
pronunciation:
  phonetic: ah-dee-no-mo-sor-us
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - "Scapula with shallow blade: maximum depth of distal scapular blade is less
    than 75% of the depth of the proximal end (measured from dorsal margin of
    acromion process to ventral apex of glenoid)."
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "401259"
  - source: wikidata
    id: Q59490984
species:
  - name: Adynomosaurus arcanus
    etymology: From Latin 'arcanus' (secret, occult), alluding to how rarely
      taxonomically informative skeletal elements of this and other hadrosaurids
      turn up in the South-Central Pyrenean Basin.
    pronunciation:
      phonetic: ar-KAY-nus
    status: valid
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Maastrichtian
    location:
      country: ES
      locality: Costa de les Solanes, near Basturs village
      region: ES-L
      formation: Conques
    type_specimen:
      specimen_id: [MCD 7125]
      specimen_type: holotype
      institution: MCD
      material: Left scapula.
      completeness: fragmentary
    erected_in: prieto-márquez2019a
references:
