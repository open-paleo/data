genus: Adynomosaurus
parent: Lambeosaurinae
etymology: From Greek 'adynamos' meaning 'weak' or 'powerless' and 'sauros' meaning 'lizard', referring to its underdeveloped shoulder musculature.
pronunciation:
  phonetic: ah-dee-no-mo-sor-us
description: Adynomosaurus is a genus of lambeosaurine dinosaur from the Late
  Cretaceous of what is now Catalonia, Spain. First discovered in 2012, it was
  named in 2019 with the type and only species being Adynomosaurus arcanus. It
  is only known from scant material, but is distinguished from other hadrosaurs
  by its weakly developed shoulder blade which would have had underdeveloped
  musculature, which lends it its scientific name, partially from the Greek word
  for "weak". Its exact relationships with other hadrosaurs remain unresolved,
  with it not consistently being recovered as a relative of any other specific
  genera, though some studies have allied it with Tsintaosaurini or even found
  it outside of Hadrosauridae. It would have lived as part of a diverse coastal
  estuary ecosystem, made up of meandering rivers and mud flats. The discovery
  of Adynomosaurus adds to the very incomplete fossil record of hadrosaurid
  dinosaurs in the Late Cretaceous of Europe, and it fits into a picture of
  major ecological turnover that was occurring during the Maastrichtian stage in
  the region.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
diagnostic_features:
  - "Scapula with shallow blade: maximum depth of distal scapular blade is less
    than 75% of the depth of the proximal end (measured from dorsal margin of
    acromion process to ventral apex of glenoid)."
