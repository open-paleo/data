genus: Aoniraptor
parent: Megaraptora
etymology: From Tehuelche 'aoni' meaning 'south' and Latin 'raptor' meaning
  'thief', meaning 'southern thief'.
pronunciation:
  phonetic: ay-OH-nee-RAP-tuhr
description: Aoniraptor is an extinct genus of megaraptoran theropod dinosaurs
  from the Late Cretaceous Huincul Formation of Argentina. The genus contains a
  single species, Aoniraptor libertatem, known from a partial skeleton.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Anterior mid-caudal vertebrae with fan-shaped prezygapophyses lacking a
    discernible articular surface for contacting the postzygapophyses
  - Blunt and thick process on the lateral surface of the prezygapophyses of
    anterior mid-caudal vertebrae
  - Mid-posterior caudals with a pair of nonarticular flat surfaces located on
    the posterodorsal corner of the centrum
