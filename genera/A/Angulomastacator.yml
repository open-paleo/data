genus: Angulomastacator
parent: Lambeosaurinae
etymology: From Latin 'angulus' meaning 'bend' or 'angle' and 'masticator' meaning 'chewer'; meaning 'bend chewer', referring to the bent shape of the jaw and the Big Bend area of Texas
pronunciation:
  phonetic: an-GOO-lo-MASS-ta-CAH-tor
description: Angulomastacator is a genus of duck-billed dinosaur from the
  Campanian-aged (Late Cretaceous) Aguja Formation of Big Bend National Park,
  Texas.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Abrupt ~45° ventral deflection of anterior maxilla and occlusal plane,
    giving bone a 'boomerang' shape in lateral view
  - Occlusal surfaces of mesial teeth positioned well ventral to distal teeth
    when in articulation
  - Deflection steeper than any other known hadrosaurid (next closest ~25° in
    Brachylophosaurus and Lambeosaurus)
