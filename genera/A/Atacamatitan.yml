genus: Atacamatitan
parent: Lithostrotia
etymology: Named for the Atacama Desert of Chile where it was found, combined with 'titan' meaning 'giant', meaning 'Atacama Desert titan'.
pronunciation:
  phonetic: at-uh-cam-uh-tie-tan
description: Atacamatitan is a genus of titanosaurian sauropod dinosaurs from
  the Late Cretaceous Tolar Formation of Chile.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Centrum of dorsal vertebrae with pleurocoels that are rounded or elliptical
    and do not acuminate posteriorly
  - Ventral surface of dorsal vertebra strongly concave
  - Posterior caudals with a laterally compressed neural spine bearing a
    blade-like anterior margin
  - Femur shaft gets gradually narrower until two thirds of its length
