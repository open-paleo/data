genus: Ahshislesaurus
parent: Saurolophinae
etymology: "Named for the Ah-shi-sle-pah Wilderness in New Mexico, a phonetic
  transliteration of the Navajo áshįįh łibá meaning 'salt, it is gray', combined
  with Ancient Greek 'sauros' meaning 'lizard'. The species name honors Swedish
  paleontologist Carl Wiman."
pronunciation:
  phonetic: AHSH-iss-luh-SOR-rus
description: Ahshislesaurus is an extinct genus of saurolophine hadrosaurid
  dinosaurs known from the Late Cretaceous of what is now New Mexico, United
  States. It is known from a partial skull and three neck vertebrae discovered
  in 1916 and first described in 1935. Prior to its scientific naming,
  researchers debated whether the specimen belonged to Kritosaurus navajovius, a
  related species from the same layers of rocks, or a distinct animal. The genus
  contains a single species, Ahshislesaurus wimani, named in 2025. A partial
  skeleton and isolated limb and girdle bones found in the same rock layers may
  also belong to Ahshislesaurus.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
diagnostic_features:
  - Quadrate robust and anteroposteriorly wide throughout its length
  - Dorsal end of quadrate bent posteriorly so that quadrate head is situated
    posterodorsally
  - Quadratojugal flange of jugal elongated with nearly uniform anteroposterior
    width throughout its length
  - Posterior process of jugal distinctively convex and broad, not forming a
    tapering structure as in most other hadrosaurids
  - Dentary with dorsoventrally deep anterior end, whereas in most other
    hadrosaurids the anterior end is dorsoventrally narrow
