genus: Arcovenator
parent: Majungasaurinae
dispute:
  summary: >
    Arcovenator is placed in Majungasaurinae by its describers (Tortosa and
    colleagues, 2014) and most analyses, but Pol and colleagues (2024)
    instead recovered it within Brachyrostra.
  history:
    - date: "2026-06-30"
      note: >
        Placed at Majungasaurinae following the erecting analysis and
        prevailing usage.
etymology: From the river Arc (flowing near the discovery site in France) + Latin venator meaning 'hunter'; overall meaning 'Arc hunter'.
pronunciation:
  phonetic: ahr-KO-veh-NAY-tuhr
description: Arcovenator is an extinct genus of abelisaurid theropod dinosaurs
  hailing from the Late Cretaceous of France and possibly Spain. The type and
  only described species is Arcovenator escotae. Its name derives from the river
  Arc flowing near the site of its first discovery.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - coastal
  - deltaic
  - fluvial
  - wetland
diagnostic_features:
  - Median dorsal foramen between the frontals (autapomorphy)
  - Postorbital forming a strong rugose, dorsolaterally developed supraorbital
    brow (autapomorphy)
  - Thin bony expansion between the ventral and posterior rami of the
    postorbital (autapomorphy)
  - Paroccipital processes bounded dorsally and ventrally by two horizontal bars
    forming a depression lateral to the foramen magnum (autapomorphy)
  - Basipterygoid process laterally directed (autapomorphy)
  - Slightly proximally anterodorsally curved fibular crest (autapomorphy)
appearance:
  features:
    - reduced forelimbs
  integument: scaled
  evidence: inferred
