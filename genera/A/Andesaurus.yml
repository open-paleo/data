genus: Andesaurus
parent: Titanosauria
pronunciation:
  phonetic: AN-duh-SOR-uhs
  ipa: /ˌændəˈsɔːrəs/
etymology: "Named for the Andes mountain range, near where the fossils were
  found in South America, combined with Greek 'sauros' meaning 'lizard', meaning
  'Andes lizard'."
description: Andesaurus is a genus of basal titanosaurian sauropod dinosaur
  which existed during the middle of the Cretaceous Period in South America.
  Like most sauropods, it would have had a small head on the end of a long neck
  and an equally long tail.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - arid
diagnostic_features:
  - Posterior dorsal vertebrae with hyposphene-hypantrum articulations, absent
    in other titanosaurids
  - Neural arch of dorsal vertebrae proportionately taller than in other
    titanosaurs, representing three-quarters the height of the vertebra
  - Prespinal lamina wide and bifurcate in its inferior portion
  - Amphiplatyan (platycoelous) caudal vertebrae throughout the available
    series, with no indication of procoely
  - Caudal neural spine laminar with axially extensive base; neural arch placed
    on the centroanterior portion of the centrum
  - Pubis with markedly wide proximolateral process and pubic foramen located
    far from the lateral border
appearance:
  features:
    - dorsal spines
  integument: scaled
  evidence: inferred
