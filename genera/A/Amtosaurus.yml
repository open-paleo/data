genus: Amtosaurus
parent: Ornithischia
pronunciation:
  ipa: /ˌɑːmtoʊˈsɔːrəs/
  phonetic: AHM-to-SAWR-us
etymology: Named after Amtgai, the Mongolian type locality, plus Greek sauros ('lizard')
description: Amtosaurus is a genus of ornithischian dinosaur based on a
  fragmentary skull collected from the Late Cretaceous (Cenomanian to Turonian)
  Bayanshiree Formation of Mongolia and originally believed to represent an
  ankylosaurid. Hadrosaurid affinities have also been suggested. However,
  according to Parish and Barrett, this specimen is too fragmentary to be
  reliably classified beyond an indeterminate ornithischian. A second species
  assigned to the genus, A. archibaldi, has become the basis of a valid
  ankylosaurid taxon, Bissektipelta.
dispute:
  summary: >
    Amtosaurus is a nomen dubium based on a braincase originally referred
    to Ankylosauria; later assessment could not confirm even an
    ankylosaurian identity and delegated it to Ornithischia indeterminate
    (Parish and Barrett, 2004; Jones, 2026).
  history:
    - date: "2026-06-29"
      note: Placed at Ornithischia incertae sedis; nomen dubium, not assignable below Ornithischia.
