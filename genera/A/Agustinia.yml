genus: Agustinia
parent: Rebbachisauridae
dispute:
  summary: >
    The affinities of Agustinia are contested. Recent dedicated rebbachisaurid
    analyses place it as a basal member of Rebbachisauridae (Bellardini et al.,
    2022; Jones, 2026), though it is an unstable operational taxonomic unit that
    is pruned from the consensus in several analyses (Lerzo et al., 2024).
    Earlier assessments differ: D'Emic et al. (2009) found no diagnostic
    features placing it in Diplodocoidea or Titanosauria and regarded it as a
    neosauropod of uncertain affinity, while Mannion et al. (2013) interpreted a
    fibular character as somphospondylan and tentatively referred it to
    Somphospondyli.
  history:
    - date: "2026-06-30"
      note: >
        Retained at Rebbachisauridae following the prevailing recent view
        (Bellardini et al., 2022; Jones, 2026); the alternative somphospondylan
        and neosauropod incertae sedis interpretations are noted, and its
        position within Rebbachisauridae is unresolved.
pronunciation:
  phonetic: ah-goo-STEE-nee-uh
  ipa: /ɑːɡəˈstɪniə/
etymology: "Named for Agustin Martinelli, a student who discovered the skeleton
  and participated in the excavation team of the Museo Argentino de Ciencias
  Naturales."
description: Agustinia is a genus of sauropod dinosaur from the Early Cretaceous
  of South America. The genus contains a single species, A. ligabuei, known from
  a single specimen that was recovered from the Lohan Cura Formation of Neuquén
  Province in Argentina. It lived about 116-108 million years ago, in the
  Aptian-Albian stages of the Early Cretaceous Period.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Top of neural spines transversely expanded in the last dorsal, all sacral,
    and three anterior caudal vertebrae
  - "Three morphologically distinct osteoderm types articulating on top of
    neural spines: unpaired leaf-shaped (type a), laminar and transversely wide
    with lateral projections (type b), and elongate flat or cylindrical
    dorsolaterally projected (type c)"
  - Fibula with a pronounced posterior projection on its proximal section and a
    bend internally directed, bounding the cnemial crest of the tibia
  - Metatarsals of the titanosaur type
appearance:
