genus: Agustinia
parent: Rebbachisauridae
dispute:
  summary: >
    The affinities of Agustinia are contested. Dedicated rebbachisaurid
    analyses recover it within Rebbachisauridae but disagree on where:
    Bellardini et al. (2022) found it a basal rebbachisaurid, while Lerzo
    et al. (2024b) recovered it as a derived rebbachisaurid within Nigersaurinae
    under implied weighting. It is an unstable operational taxonomic unit that
    is pruned from the consensus in several analyses (Lerzo et al., 2024a,
    2024b). Earlier assessments differ more broadly: D'Emic et al. (2009) found
    no diagnostic features placing it in Diplodocoidea or Titanosauria and
    regarded it as a neosauropod of uncertain affinity, while Mannion et al.
    (2013), reinterpreting its purported osteoderms as displaced ribs and
    ischia, tentatively regarded it as an indeterminate somphospondylan.
  history:
    - date: "2026-06-30"
      note: >
        Retained at Rebbachisauridae following the prevailing recent view
        (Bellardini et al., 2022; Jones, 2026); the alternative somphospondylan
        and neosauropod incertae sedis interpretations are noted, and its
        position within Rebbachisauridae is unresolved.
    - date: "2026-07-22"
      note: >
        Replaced the reference-work citation (Jones, 2026) with the primary
        analysis of Lerzo et al. (2024b), which recovers Agustinia as a derived
        rebbachisaurid within Nigersaurinae under implied weighting and prunes
        it as unstable under equal weighting; the genus is retained as a
        rebbachisaurid of unresolved position, not incertae sedis.
pronunciation:
  phonetic: ah-goo-STEE-nee-uh
  ipa: /ɑːɡəˈstɪniə/
etymology: "Named for Agustin Martinelli, a student who discovered the skeleton
  and participated in the excavation team of the Museo Argentino de Ciencias
  Naturales."
description: Agustinia is a genus of sauropod dinosaur from the Early Cretaceous
  of South America. The genus contains a single species, A. ligabuei, known from
  a single specimen that was recovered from the Lohan Cura Formation of Neuquén
  Province in Argentina. It lived about 116-108 million years ago, in the
  Aptian-Albian stages of the Early Cretaceous Period.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Posterior dorsal, sacral, and anterior caudal neural spines with deep,
    dorsoventrally expanded, elliptical spinoprezygapophyseal and
    spinopostzygapophyseal fossae, apically enclosed by transversely and
    anteroposteriorly expanded dorsolateral margins
  - Most posterior anterior caudal vertebrae with V-like (Y-like), dorsally
    divergent lateral laminae in lateral view
  - Metatarsal I with prominent, proximodistally elongated laminae on the
    proximal half of the anterior and posterior surfaces of the bone
