genus: Agustinia
parent: Rebbachisauridae
pronunciation:
  ipa: /ɑːɡəˈstɪniə/
etymology: "Named for Agustin Martinelli, a student who discovered the skeleton and participated in the excavation team of the Museo Argentino de Ciencias Naturales."
description: Agustinia is a genus of sauropod dinosaur from the Early Cretaceous
  of South America. The genus contains a single species, A. ligabuei, known from
  a single specimen that was recovered from the Lohan Cura Formation of Neuquén
  Province in Argentina. It lived about 116–108 million years ago, in the
  Aptian–Albian stages of the Early Cretaceous Period.
diet: herbivore
locomotion: quadrupedal
