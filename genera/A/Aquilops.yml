genus: Aquilops
parent: Neoceratopsia
etymology: From Latin 'aquila' meaning 'eagle' and Greek 'ops' meaning 'face',
  meaning 'eagle face', referring to its eagle-like hooked beak.
description: Aquilops is an early herbivorous ceratopsian dinosaur dating from
  the Early Cretaceous of North America, approximately 109 million to 104
  million years ago. The type species is A. americanus.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Rostral with a ventrally-directed tip and a strongly arched keel possessing
    a boss
  - Oral margin rostral to maxillary tooth row entirely concave in lateral view
  - Antorbital fenestra more than twice as long as tall and tapering to a sharp
    point below the orbit
appearance:
