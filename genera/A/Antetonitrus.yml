genus: Antetonitrus
parent: Lessemsauridae
etymology: From Latin 'ante' meaning 'before' and 'tonitrus' meaning 'thunder', meaning 'before thunder', referring to its existence before Brontosaurus (the 'thunder lizard').
description: Antetonitrus is a genus of sauropodiform dinosaur found in the
  Early Jurassic Elliot Formation of South Africa. The only species is
  Antetonitrus ingenipes. Sometimes considered a basal sauropod, it is crucial
  for the understanding of the origin and early evolution of this group. It was
  a quadrupedal herbivore, like its later relatives, but shows primitive
  adaptations to use the forelimbs for grasping, instead of purely for weight
  support.
diet: herbivore
locomotion: quadrupedal
