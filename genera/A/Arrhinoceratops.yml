genus: Arrhinoceratops
parent: Chasmosaurinae
pronunciation:
  phonetic: a-RIEN-o-SER-a-tops
etymology: From Ancient Greek a-/alpha privative (ἀ-) meaning 'no/without' +
  rhis (ῥίς) meaning 'nose' + keras (κέρας) meaning 'horn' + ops (ὤψ) meaning
  'face'; overall meaning 'no nose-horn face'.
description: Arrhinoceratops is a genus of herbivorous ceratopsian dinosaur. The
  name was coined as its original describer concluded it was special because the
  nose-horn was not a separate bone, however further analysis revealed this was
  based on a misunderstanding. It lived during the latest Campanian/earliest
  Maastrichtian stage of the Late Cretaceous, predating its famous relative
  Triceratops by a few million years, although it was contemporary with
  Anchiceratops. Its remains have been found in Canada.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Nasal horn core absent; nasal bone forms only a sharp longitudinal ridge
    with fine rugosities, without horn core or epinasal
  - Supraorbital horn cores large, approximately circular in cross section,
    directed upward, outward, and forward
  - Facial region unusually short relative to crest length (ratio ~0.52)
  - Crest strikingly subquadrate in outline and very flat posteriorly, with no
    epoccipitals on margin
  - Anterior process of jugal unusually long, overlapping the maxillary
    extensively and making suture with nasal unusually short
  - Lower temporal arcade remarkably bar-like, producing a low
    isosceles-triangular lateral temporal fossa
appearance:
  features:
    - nasal horn
    - brow horns
    - neck frill
    - epoccipitals
  integument: scaled
  evidence: inferred
