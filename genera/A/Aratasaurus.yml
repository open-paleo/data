  - name: Aratasaurus museunacionali
    etymology: Named for the Museu Nacional/Universidade Federal do Rio de
      Janeiro, the oldest scientific institution in Brazil, which was devastated
      by a fire in 2018.
    status: valid
    type_species: true
    period:
      name:
