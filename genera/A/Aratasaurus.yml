genus: Aratasaurus
parent: Coelurosauria
etymology: "From Tupi 'ara' meaning 'born' and 'atá' meaning 'fire', combined with Greek 'sauros' meaning 'lizard'. The full name is intended to mean 'the dinosaur born from the National Museum fire', honoring the fire-devastated National Museum of Brazil."
pronunciation:
  phonetic: ah-RAH-tah-SOR-us
description: Aratasaurus is an extinct genus of basal coelurosaurian theropod
  dinosaur from the Early Cretaceous (Aptian) Romualdo Formation of Brazil. The
  genus contains a single species, A. museunacionali, known from a partial right
  leg. Aratasaurus represents the only tetrapod fossil known from the lower
  levels of the Romualdo Formation.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - marine
  - coastal
diagnostic_features:
  - Tibia exhibiting a medial fossa on the medial surface near the proximal
    articulation
  - Symmetric pes with digits II and IV subequal in total length
  - Distal condyles of metatarsi II, III and IV symmetric mediolaterally and
    with subequal width
  - Width of metatarsi II and IV similar, with dorsal surface of distal
    articulation bulbous
