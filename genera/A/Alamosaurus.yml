genus: Alamosaurus
parent: Saltasauridae
placement: incertae sedis
etymology: Named after the Ojo Alamo rock formation combined with Greek 'sauros'
  meaning 'lizard'; meaning 'Ojo Alamo lizard'
pronunciation:
  phonetic: AL-a-mo-SAWR-us
  ipa: /ˌæləmoʊˈsɔːrəs/
description: Alamosaurus is a genus of titanosaurian sauropod dinosaurs
  containing a single known species, Alamosaurus sanjuanensis, from the
  Maastrichtian age of the Late Cretaceous period in what is now southwestern
  North America. It is one of the few known titanosaurs to have inhabited North
  America after the nearly 30-million-year absence of sauropods from the North
  American fossil record ("sauropod hiatus") and probably represents an
  immigrant from South America.
dispute:
  summary: >
    Placed within Saltasauridae as incertae sedis. Alamosaurus has long resisted
    precise placement: an early assessment (Lehman, 2002) found it a mosaic of
    titanosaur features and could not resolve it beyond an indeterminate derived
    titanosaur. More recent work disagrees over its affinities: Navarro et al.
    (2022) recovered it within Saltasaurinae as the sister taxon of Baurutitan,
    and it has been grouped among Laurasian titanosaurs close to Saltasaurinae
    (Santucci and Filippi, 2022), whereas Cerda et al. (2021) instead recovered a
    South American affinity close to Pellegrinisaurus. These placements fall
    within Saltasauridae under some definitions. It is placed at Saltasauridae
    pending resolution. The content of the genus is separately contested: Paul
    (2025) argued that the late Maastrichtian Utah material differs from the
    early Maastrichtian New Mexican type material, made USNM 15560 the holotype
    of a new genus Utetitan, and would restrict Alamosaurus sanjuanensis to its
    New Mexican type horizon. That split rests on qualitative scapular and
    ischial characters, is not supported by a cladistic analysis, and has not
    been taken up by subsequent work; USNM 15560 is retained here as referred
    material of A. sanjuanensis, following its long-standing referral
    (Gilmore, 1946).
  history:
    - date: "2026-06-30"
      note: >
        Placed at Saltasauridae incertae sedis; Laurasian (near Saltasaurinae)
        and South American (near Pellegrinisaurus) affinities remain unresolved.
    - date: "2026-08-07"
      note: >
        Proposed split of USNM 15560 into Utetitan (Paul, 2025) reviewed and
        not adopted; the genus is recorded as a synonym pending further work.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Scapula blade gradually widens from below upward to superior end with no
    expansion of anterior border and no rapid superior expansion of both borders
    as in other sauropods
  - Scapular spine runs at approximately 90 degrees to the longitudinal axis of
    the bone, not at an acute angle as in Diplodocus and Amphicoelias
  - No superior fossa on upper side of scapular ridge, unlike many sauropod
    scapulae
  - Ischium extremely short, lacking the long slender posterior extension
    characteristic of all other known sauropod ischia
  - Ischium with unusually great dorsoventral diameter at proximal end and pubic
    articular surface extending distalward more than half the total bone length
