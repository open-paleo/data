notable_specimens:
  - specimen_id: [USNM 15560]
    institution: USNM
    species: Alamosaurus sanjuanensis
    category: complementary
    significance: "A partial postcranial skeleton from the lower North Horn
      Formation of Utah preserving caudals 1-30, both sternals, the right
      scapulocoracoid, forelimb, both ischia and an osteoderm, nearly all of it
      absent from the scapula-only holotype. Paul (2025) made it the holotype
      of a separate genus."
    references: [gilmore1946b, paul2025a]
  - specimen_id: [TMM 43621-1]
    institution: TMM
    species: Alamosaurus sanjuanensis
    category: most-complete
    significance: "The most completely known specimen of Alamosaurus, a juvenile skeleton from Texas that allowed researchers to make educated estimates of the genus's length and mass."
    references: [lehman2002a]
  - specimen_id: [SMP VP-1625, SMP VP-1850, SMP VP-2104]
    institution: SMP
    species: Alamosaurus sanjuanensis
    category: largest-individual
    significance: "Three fragmentary specimens from exceptionally large individuals, indicating that adult Alamosaurus reached sizes comparable to the largest known dinosaurs such as Argentinosaurus, potentially the largest dinosaur known from North America."
    references: [fowler2011a]
