genus: Alamosaurus
parent: Saltasauridae
etymology: Named after the Ojo Alamo rock formation combined with Greek 'sauros'
  meaning 'lizard'; meaning 'Ojo Alamo lizard'
pronunciation:
  phonetic: AL-a-mo-SAWR-us
  ipa: /ˌæləmoʊˈsɔːrəs/
description: Alamosaurus is a genus of titanosaurian sauropod dinosaurs
  containing a single known species, Alamosaurus sanjuanensis, from the
  Maastrichtian age of the Late Cretaceous period in what is now southwestern
  North America. It is one of the few known titanosaurs to have inhabited North
  America after the nearly 30-million-year absence of sauropods from the North
  American fossil record ("sauropod hiatus") and probably represents an
  immigrant from South America.
dispute:
  summary: >
    Placed within Saltasauridae as incertae sedis. Alamosaurus has long resisted
    precise placement: an early assessment (Lehman, 2002) found it a mosaic of
    titanosaur features and could not resolve it beyond an indeterminate derived
    titanosaur. More recent analyses disagree over its closest relatives, with an
    Asian affinity as sister to Opisthocoelicaudia (Poropat et al., 2021;
    Santucci and Filippi, 2022) opposed to a South American affinity close to
    Pellegrinisaurus (Cerda et al., 2021; Navarro et al., 2022), placements that
    fall within Saltasauridae under some definitions. It is placed at
    Saltasauridae pending resolution.
  history:
    - date: "2026-06-30"
      note: >
        Placed at Saltasauridae incertae sedis; Asian (Opisthocoelicaudia) and
        South American (Pellegrinisaurus) affinities remain unresolved.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Scapula blade gradually widens from below upward to superior end with no
    expansion of anterior border and no rapid superior expansion of both borders
    as in other sauropods
  - Scapular spine runs at approximately 90 degrees to the longitudinal axis of
    the bone, not at an acute angle as in Diplodocus and Amphicoelias
  - No superior fossa on upper side of scapular ridge, unlike many sauropod
    scapulae
  - Ischium extremely short, lacking the long slender posterior extension
    characteristic of all other known sauropod ischia
  - Ischium with unusually great dorsoventral diameter at proximal end and pubic
    articular surface extending distalward more than half the total bone length
