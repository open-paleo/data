genus: Albinykus
parent: Parvicursorinae
etymology: Named after 'albin', a term used by Mongolian shamans to describe light phenomena in the Gobi Desert, combined with Greek 'onyx' meaning 'claw'.
pronunciation:
  phonetic: al-bih-NY-kus
description: Albinykus is a genus of alvarezsaurid dinosaur whose fossils have
  been found in the Late Cretaceous-aged (Santonian) Javkhlant Formation in the
  Gobi Desert of Mongolia. The type species, A. baatar, was named by Sterling J.
  Nesbitt, Julia A. Clarke, Alan H. Turner and Mark A. Norell in 2011.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Short metatarsal I with a rounded proximal tip, unknown in Alvarezsaurus and
    Patagonykus
  - Well-pronounced knob-like crest for M. iliofibularis attachment on fibula
    proportionally larger than in other alvarezsaurids
  - Phalanx IV-4 longer than both IV-2 and IV-3
  - Deep groove on anterior face of the ascending process of the astragalus
appearance:
  integument: feathered
  evidence: direct
