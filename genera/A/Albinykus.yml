genus: Albinykus
parent: Parvicursorinae
description: Albinykus is a genus of alvarezsaurid dinosaur whose fossils have
  been found in the Late Cretaceous-aged (Santonian) Javkhlant Formation in the
  Gobi Desert of Mongolia. The type species, A. baatar, was named by Sterling J.
  Nesbitt, Julia A. Clarke, Alan H. Turner and Mark A. Norell in 2011.
