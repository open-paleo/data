genus: Acanthopholis
parent: Ankylosauria
placement: incertae sedis
etymology: From Greek 'akantha' meaning 'spine' or 'thorn' and 'pholis' meaning 'scale'; meaning 'spiny scales'
pronunciation:
  phonetic: a-kan-THOF-o-lis
  ipa: /ˌækənˈθɒfoʊlɪs/
description: Acanthopholis is a genus of ankylosaurian dinosaur in the family
  Nodosauridae that lived during the Late Cretaceous Period of England. A single
  species, A. horrida, exists.
dispute:
  summary: >
    Acanthopholis is a nomen dubium; its species rest on composite, non-diagnostic syntypes (Pereda-Suberbiola and Barrett, 1999). It is retained at Ankylosauria incertae sedis.
  history:
    - date: "2026-06-26"
      note: Placed at Ankylosauria incertae sedis, nomen dubium not assignable below Ankylosauria.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - marine
appearance:
  integument: armored
  evidence: direct
diagnostic_features:
  - Dermal scutes highly variable in form, ranging from slightly raised oval
    disks to large asymmetrical spines approaching nine inches in length, with
    outer surfaces irregularly pitted and spine-like forms bearing branching
    vascular grooves.
  - Spine-like dermal plates wholly asymmetrical, with convex anterior edge,
    concave posterior edge, and a deep notch interrupting the posterior ridge
    near the base that likely received the anterior edge of the adjacent spine.
  - Teeth lance-head shaped with acute point, sharp serrated edges bearing eight
    serrations on each side of the apex, and a crown that expands suddenly and
    asymmetrically into a swollen base.
  - Crown surface ornamented with vertical dark chocolate-colored bands
    alternating with pale brown bands running from the serrated edges to the
    swollen base, a feature not reported in allied genera.
  - Occipital condyle more elongated transversely and more excavated above than
    in Crocodile, with exoccipitals entering more largely into its composition;
    Eustachian tubes not in Crocodilian disposition; carotids running up the
    side of the basisphenoid in Lacertilian fashion.
