genus: Acanthopholis
parent: Nodosauridae
placement: incertae sedis
etymology: From Greek 'akantha' meaning 'spine' or 'thorn' and 'pholis' meaning 'scale'; meaning 'spiny scales'
pronunciation:
  phonetic: a-kan-THOF-o-lis
  ipa: /ˌækənˈθɒfoʊlɪs/
description: Acanthopholis is a nomen dubium for armored ankylosaur remains from
  the Cenomanian of Kent, England, which Pereda-Suberbiola and Barrett (1999)
  refer to Nodosauridae. Only its type species, A. horrida, is retained in the
  genus; Seeley's further species are now referred to other groups.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - marine
appearance:
  integument: armored
  evidence: direct
identifiers:
  - source: pbdb
    id: "38818"
  - source: wikidata
    id: Q133200
  - source: gbif
    id: "4823211"
  - source: eol
    id: "4533736"
species:
  - name: Acanthopholis horrida
    etymology: "From Latin 'horrida' (originally 'horridus') meaning 'frightening' or 'rough', referring to the animal's armored appearance."
    status: nomen dubium
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Cenomanian
    location:
      country: GB
      region: GB-KEN
      locality: East of Copt Point, near Folkestone
      formation: West Melbury Marly Chalk
      part: lower
      notes: Etheridge (1867) placed the remains in the lower part of the Chalk
        Marl, about eight feet above the Upper Greensand, and fixed them to the
        lower part of the Grey Chalk series on an associated fauna of some forty
        species, among them Ammonites varians and Holaster subglobosus.
    size:
      length_m:
        min: 3.0
        max: 5.5
      weight_kg:
        min: 380
        max: 380
    erected_in: huxley1867a
    type_specimen:
      specimen_id:
        - GSM 109045
        - GSM 109046
        - GSM 109047
        - GSM 109048
        - GSM 109049
        - GSM 109050
        - GSM 109051
        - GSM 109052
        - GSM 109053
        - GSM 109055
        - GSM 109056
        - GSM 109057
      specimen_type: syntype
      institution: BGS
      material: Scutes and spines of dermal armor, three teeth, fragmentary vertebrae,
        partial skull (basioccipital and basisphenoid), and distal end of a humerus.
      completeness: fragmentary
      notes: >
        Huxley (1867) founded the species on a series of 12 specimens and
        designated no holotype; no lectotype has been designated since.
        Pereda-Suberbiola and Barrett (1999) exclude GSM 109054 and GSM 109058,
        two caudal vertebrae added to the type series by Coombs (1978) but not
        mentioned by Huxley, regarding them as Ankylosauria indeterminate and
        indeterminate respectively. The syntypes are not demonstrably one
        individual: Huxley inferred association because the specimens "all came
        from one small area", but the same assemblage yielded the teeth and
        sclerotic ring of a large ichthyosaur.
references:
  - id: hopson2005a
    notes: Defines the West Melbury Marly Chalk Formation and names Copt
      Point among its primary reference sections.
  - id: vickaryous2004a
    notes: Lists Acanthopholis horridus and its congeners among the nomina
      dubia of Ankylosauria.
  - id: kirkland2013a
    notes: Repeats that Acanthopholis is a nomen dubium and, on that basis,
      rejects Acanthopholinae in favor of Nopcsa's (1923) Struthiosaurinae,
      which it defines phylogenetically.
  - id: nopcsa1923a
    notes: Lists the family Acanthopolidae with the subfamilies Struthiosaurinae
      and Ankylosaurinae, without comment.
  - id: barrett2020a
    notes: Reaffirms that Acanthopholis horridus is a nomen dubium while
      revising other Cambridge Greensand material.
  - id: huxley1867a
  - id: pereda-suberbiola1999a
    notes: Found the A. horridus syntypes to lack unique diagnostic characters,
      doubted that all belong to one individual, and restricted the type series
      to the 12 specimens listed by Huxley.
  - id: coombs1978a
  - id: etheridge1867a
    notes: Fixes the horizon to the lower Chalk Marl about eight feet above the
      Upper Greensand, on an associated fauna of some forty species.
