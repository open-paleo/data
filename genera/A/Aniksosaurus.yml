genus: Aniksosaurus
parent: Compsognathidae
etymology: From Modern Greek 'anoixi' meaning 'spring' (the season) and 'sauros' meaning 'lizard'; meaning 'spring lizard', referring to the onset of spring in the Southern Hemisphere when the fossil was found
description: Aniksosaurus is a genus of avetheropod dinosaur from what is now
  Chubut Province, Argentina. It lived during the Cenomanian to Turonian of the
  Cretaceous period, between 96-91 million years ago. The type species,
  Aniksosaurus darwini, was formally described from the Bajo Barreal Formation
  of the Golfo San Jorge Basin by Rubén Dario Martínez and Fernando Emilio Novas
  in 2006; the name was first coined in 1995 and reported in the literature in
  1997. The specific epithet honors Charles Darwin who visited Patagonia in
  1832/1833 during the Voyage of the Beagle.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Cervical vertebrae with neural arch pedicels unusually deep, approximately
    2.5 times the height of the centrum
  - Wide, dorsoventrally elliptical neural canal on caudal cervical vertebrae
  - Cranial caudal vertebrae with a single sagittal ventral keel on the centrum
  - Manual ungual phalanges robust and transversely thick (height-to-width ratio
    ~1.1, much lower than other theropods)
  - Iliac brevis shelf extremely expanded and projected lateroventrally,
    fan-shaped in ventral view
  - Metatarsal IV and its corresponding digit transversely very narrow
    (metatarsal III/IV distal width ratio ~2.14)
