genus: Aepisaurus
parent: Sauropoda
pronunciation:
  ipa: /ˌiːpɪˈsɔːrəs/
  phonetic: EE-pee-SOR-us
etymology: "From Greek 'aipeinos' meaning 'lofty' or 'high' and 'sauros' meaning 'lizard', meaning 'lofty lizard'."
description: Aepisaurus was a genus of sauropod dinosaur from the Albian-age
  Lower Cretaceous Grès vert of Département du Vaucluse, France, around 100.5
  million years ago. It is an obscure genus from an unknown family, represented
  by a single humerus, now partly lost. Despite its lack of popularity, or
  perhaps because of it, it has been misspelled several ways in the scientific
  literature, with multiple dates given to the year of description as well.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Humerus approaching the size of an elephant humerus in a reptile, with total
    length 0.090 m, width at tuberosities 0.33 m, width at middle 0.15 m, width
    at condyles 0.25 m.
  - Humerus form and structure indicating a gigantic reptile with analogy to
    Monitors and Iguanas, but distinct from Wealden saurians described by
    Mantell.
  - Humerus shape closer to Iguanas and Monitors than to any other known group,
    but with some differences from both.
