genus: Agrosaurus
parent: Sauropodomorpha
placement: incertae sedis
pronunciation:
  ipa: /ˌæɡroʊˈsɔːrəs/
  phonetic: AG-roh-SOR-us
etymology: From Greek agros ('field') and sauros ('lizard'), meaning 'field lizard'
description: Agrosaurus is a potentially dubious genus of thecodontosaurid
  sauropodomorph probably originating from the Magnesian Conglomerate of England
  that was originally believed to be a Triassic prosauropod from Australia.
  Agrosaurus would thus be the oldest dinosaur from that country. However, this
  appears to have been an error, and the material actually appears to come from
  Thecodontosaurus or a Thecodontosaurus-like animal from Bristol, England (Avon
  Fissure Fill). The type species is Agrosaurus macgillivrayi.
dispute:
  summary: >
    Agrosaurus macgillivrayi is a nomen dubium; its material is most
    likely referable to Thecodontosaurus from the Late Triassic of England
    rather than Australia.
  history:
    - date: "2026-06-29"
      note: Reparented from the deprecated Prosauropoda to Sauropodomorpha incertae sedis; nomen dubium, possibly Thecodontosaurus.
diet: herbivore
locomotion: bipedal
diagnostic_features:
  - Tibia shaft unusually slender and sub-cylindrical, more attenuated than in
    any Saurischian hitherto figured
  - Proximal end of tibia enlarged and curves backward relative to slender shaft
  - Pre-cnemial crest only slightly developed
  - Distal end of tibia increases uniformly in size with no sharp definition
    from shaft
  - Distal tibial articulation moderately excavated on the inner side, with a
    deep anterior notch dividing the quadrate articular surface
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "64395"
  - source: wikidata
    id: Q18607487
  - source: gbif
    id: "4822701"
species:
  - name: Agrosaurus macgillivrayi
    etymology: "Honors John MacGillivray, Scottish naturalist on HMS Fly, who
      collected the material attributed to the species."
    status: valid
    type_species: true
    period:
      name:
        - Late Triassic
      stage:
        - Rhaetian
    location:
      country: GB
      region: GB-ENG
      locality: Durdham Down, Clifton, Bristol
      formation: Magnesian Conglomerate
      notes: The unit name is not current, and the locality recorded here is
        the later of two published readings rather than the erecting paper's.
        Galton (2007) reports the material as long equated with the Magnesian
        Conglomerate, which crops out nearby, rather than demonstrated to come
        from it; Weishampel and colleagues (2004) name no unit at all and give
        the locality only as Avon. No coordinates have been published under
        either reading of the provenance.
    type_specimen:
      specimen_id: [BMNH 49984]
      specimen_type: holotype
      institution: NHMUK
      material: Complete left tibia, proximal end of right tibia, fragment of fibula,
        and two laterally compressed claw-phalanges in matrix
      completeness: fragmentary
    size:
      length_m:
        min: 3.0
        max: 3.0
    erected_in: seeley1891a
references:
  - id: seeley1891a
    notes: Records the type material only from a label reading "Fly, 1844. Jn.
      Macgillivray, from the N.E. coast of Australia", from a locality the
      author states was then unnamed.
  - id: galton2007a
    notes: Traces the type material to Durdham Down, Clifton, rather than the
      northeastern coast of Australia, following Vickers-Rich and colleagues
      (1999), and refers it to Thecodontosaurus antiquus.
