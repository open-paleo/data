genus: Adasaurus
parent: Eudromaeosauria
etymology: From Mongolian 'ada' meaning 'evil spirit' or 'devil' and Greek
  'sauros' meaning 'lizard'; meaning 'evil lizard'
pronunciation:
  phonetic: AH-duh-SOR-uhs
  ipa: /ˌɑːdəˈsɔːrəs/
description: Adasaurus is a genus of dromaeosaurid dinosaur that lived in Asia
  during the Late Cretaceous period. The genus is known from two partial
  specimens found in the Nemegt Formation of Mongolia that were partially
  described in 1983 by the paleontologist Rinchen Barsbold.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Ungual phalanges of reversed digit II highly reduced
  - Metatarsal II considerably thinned
  - Predatory claw ungual of reversed digit II reduced to size comparable to
    supporting digits
appearance:
  features:
    - sickle claw
  integument: feathered
  evidence: direct
