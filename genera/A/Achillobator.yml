genus: Achillobator
parent: Dromaeosaurinae
dispute:
  summary: >
    Achillobator is consistently recovered as a large-bodied dromaeosaurine
    (Turner et al., 2012; Cau et al., 2017; Powers et al., 2020; Jones et al.,
    2026), often close to Utahraptor. Some analyses (Napoli et al., 2021) instead
    keep it as a eudromaeosaur outside a narrowly defined Velociraptorinae without
    resolving its subfamily, and its holotype was historically suspected of being
    a chimera (a claim now generally rejected). It is placed in Dromaeosaurinae
    following the prevailing view.
  history:
    - date: "2026-07-01"
      note: Moved from Eudromaeosauria to Dromaeosaurinae following the prevailing view (Turner et al., 2012; Powers et al., 2020; Jones et al., 2026).
etymology: Named after Achilles, the Greek hero, combined with Mongolian 'bator'
  meaning 'hero'; meaning 'Achilles hero'
pronunciation:
  phonetic: uh-KIL-uh-BAY-tor
  ipa: /əˌkɪləˈbeɪtɔːr/
description: Achillobator is a genus of large dromaeosaurid theropod dinosaur
  that lived during the Late Cretaceous period about 96 million to 89 million
  years ago in what is now the Bayan Shireh Formation of Mongolia. The genus is
  currently monotypic, only including the type species A. giganticus. The first
  remains were found in 1989 during a Mongolian-Russian field expedition and
  later described in 1999. Remains at the type locality of Achillobator may
  represent additional specimens. It represents the first and largest
  dromaeosaurid known from the Bayan Shireh Formation.
diet: carnivore
