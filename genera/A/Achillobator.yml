genus: Achillobator
parent: Dromaeosaurinae
dispute:
  summary: >
    Achillobator is most often recovered as a large-bodied dromaeosaurine,
    close to Utahraptor (Turner and colleagues, 2012; Cau and colleagues,
    2017; Napoli and colleagues, 2021), though one analysis on the matrix of
    Currie and Evans recovers it as a velociraptorine (Powers and
    colleagues, 2020). Burnham and colleagues (2000) suspected the holotype
    is a chimera, but Turner and colleagues (2012) found the elements
    articulated and alike in preservation, and assigned them to one
    individual. It is placed in Dromaeosaurinae following most analyses.
  history:
    - date: "2026-07-01"
      note: Moved from Eudromaeosauria to Dromaeosaurinae following the prevailing view (Turner and colleagues, 2012; Powers and colleagues, 2020; Jones, 2026).
etymology: Named after Achilles, the Greek hero, combined with Mongolian 'bator'
  meaning 'hero'; meaning 'Achilles hero'
pronunciation:
  phonetic: uh-KIL-uh-BAY-tor
  ipa: /əˌkɪləˈbeɪtɔːr/
description: Achillobator is a genus of large dromaeosaurid theropod dinosaur
  that lived during the Late Cretaceous period about 96 million to 89 million
  years ago in what is now the Bayanshiree Formation of Mongolia. The genus is
  currently monotypic, only including the type species A. giganticus. The first
  remains were found in 1989 during a Mongolian-Russian field expedition and
  later described in 1999. Remains at the type locality of Achillobator may
  represent additional specimens. It represents the first and largest
  dromaeosaurid known from the Bayanshiree Formation.
diet: carnivore
