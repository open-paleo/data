genus: Archaeornithomimus
parent: Ornithomimidae
pronunciation:
  phonetic: AHR-kee-or-NITH-o-MIEM-us
etymology: From Greek archaios (ἀρχαῖος) meaning 'ancient' + ornithos (ὄρνιθος)
  meaning 'bird' + mimos (μῖμος) meaning 'mimic'; overall meaning 'ancient bird
  mimic'.
description: Archaeornithomimus is a genus of ornithomimosaurian theropod
  dinosaur that lived during the Late Cretaceous period (around 96 million years
  ago) in the Iren Dabasu Formation of Inner Mongolia, China.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - First and third metacarpals short relative to the second metacarpal
  - Metatarsals short relative to their midshaft circumference (fourth
    metatarsal circumference ~25.9% of bone length)
  - Manual unguals straight (not recurved)
  - Pedal unguals recurved
