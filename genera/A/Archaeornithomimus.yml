genus: Archaeornithomimus
parent: Ornithomimidae
pronunciation:
  phonetic: AHR-kee-or-NITH-o-MIEM-us
etymology: From Greek archaios (ἀρχαῖος) meaning 'ancient' + ornithos (ὄρνιθος)
  meaning 'bird' + mimos (μῖμος) meaning 'mimic'; overall meaning 'ancient bird
  mimic'.
description: Archaeornithomimus is a genus of ornithomimosaurian theropod
  dinosaur that lived during the Late Cretaceous period (around 96 million years
  ago) in the Iren Dabasu Formation of Inner Mongolia, China.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Five sacral vertebrae
  - Short, relatively robust limb bones
  - Coracoid with a rounded anterior margin and a well-developed biceps tubercle
  - Metacarpal I short relative to metacarpals II and III
  - Ischium with an anteriorly expanded distal end and a pubic boot with a
    relatively flat ventral surface
  - Proximal end of metatarsal III constricted, not visible in anterior view
    when the metatarsals are articulated
appearance:
  integument: feathered
  evidence: direct
identifiers:
  - source: pbdb
    id: "38540"
  - source: wikidata
    id: Q131707
  - source: gbif
    id: "4822897"
  - source: eol
    id: "4433729"
