genus: Anzu
parent: Caenagnathinae
etymology: Named for Anzu, a feathered demon from Mesopotamian (Sumerian and Akkadian) mythology.
description: Anzu is a genus of caenagnathid dinosaur from North Dakota, South
  Dakota, and Montana that lived during the Late Cretaceous (upper Maastrichtian
  stage, 67.2-66.0 Ma) in what is now the Hell Creek Formation. The type species,
  Anzu wyliei, is known from numerous skeletons that preserve cranial and
  postcranial elements.
diet: omnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Tall, crescentic cranial crest formed by posterodorsal processes of
    premaxillae
  - Body of maxilla lacking antorbital fossa
  - Maxillary ascending process elongate and shaped like an inverted 'L'
  - Prominent lateral flange on symphyseal region of dentary
  - Elongate retroarticular process of mandible, subequal in anteroposterior
    length to quadrate articulation
  - Distal end of radius divided into two rounded processes; sulcus on
    ventromedial aspect of manual phalanx II-1; tubercle on anterior surface of
    astragalus near base of ascending process
