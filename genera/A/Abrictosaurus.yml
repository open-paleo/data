genus: Abrictosaurus
parent: Heterodontosaurinae
pronunciation:
  phonetic: a-BRIK-to-SAWR-us
  ipa: /əˌbrɪktəˈsɔːrəs/
etymology: "From Greek roots meaning 'wakeful lizard'; 'abriktos' relates to
  wakefulness and 'sauros' means 'lizard'."
description: Abrictosaurus is a genus of heterodontosaurid dinosaur that lived
  during the Early Jurassic in what is now in parts of southern Africa such as
  Lesotho and South Africa. It was a bipedal herbivore or omnivore and was one
  of the most basal heterodontosaurids. It was approximately 1.2 meters (3.9 ft)
  long and weighed less than 45 kilograms (99 lb).
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - arid
diagnostic_features:
  - Lower cheek teeth with relatively symmetrical crowns, narrow basal cingula,
    and slender, unswollen roots that are well set off from the crowns
  - Middle vertical ridge of the cheek-tooth crown lying centrally on the
    external face, with anterior and posterior ridges of about equal prominence
  - Caniniform teeth absent in the type (a presumed female); where present in
    the referred specimen, the lower caniniform is serrated on the anterior
    cutting edge only
  - Lateral face of the maxilla vertically concave, without a longitudinal ridge
  - Mandible lacking a lateral fenestra, with dentaries inflated anteriorly
