genus: Ahshislepelta
parent: Ankylosauria
etymology: Named after Ah-shi-sle-pah Wash, the locality where the fossil was
  found, combined with Greek 'pelta' meaning 'shield'; meaning 'Ah-shi-sle-pah
  Wash shield'
pronunciation:
  phonetic: Ah-shi-sle-pel-ta
description: Ahshislepelta is a monospecific genus of ankylosaur dinosaur from
  New Mexico that lived during the Late Cretaceous (late Campanian stage, 74.5
  Ma) in what is now the Hunter Wash Member of the Kirtland Formation. The type
  and only species, Ahshislepelta minor, is known only from an incomplete
  postcranial skeleton of a small subadult or adult individual. It was named in
  2011 by Michael Burns and Robert M. Sullivan. Based on the size of the
  humerus, Ahshislepelta is larger than Pinacosaurus mephistocephalus but
  smaller than Talarurus and Pinacosaurus grangeri.
dispute:
  summary: >
    The family placement of Ahshislepelta is contested, recovered as a basal ankylosaurid by Arbour and Currie (2015) but as a nodosaurine by Jones and Viola (2026). It is retained at Ankylosauria incertae sedis pending resolution.
  history:
    - date: "2026-06-26"
      note: Parked at Ankylosauria incertae sedis, family placement contested between Ankylosauridae and Nodosauridae (P2).
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Dorsolateral overhang of scapular acromion process reaching 25% of the
    dorsoventral scapular width, distinctly greater than the 8-21% range seen in
    other sampled ankylosaurids.
  - Osteodermal surface texture characterized by uniformly distributed pitted
    rugosity.
  - Sparse reticular pattern of neurovascular grooves on osteoderm surface.
  - Neurovascular foramina extending perpendicularly to obliquely into the
    osteoderm bone.
appearance:
  features:
    - osteoderms
  integument: armored
  evidence: direct
