genus: Altirhinus
parent: Hadrosauroidea
pronunciation:
  phonetic: al-ti-RIEN-us
  ipa: /ˌæltɪˈraɪnəs/
etymology: From Latin 'altus' meaning 'high' and Greek 'rhinos' meaning 'nose', meaning 'high nose', referring to its distinctively arched nasal profile.
description: Altirhinus is a genus of ornithopod dinosaur from the Early
  Cretaceous (Albian) Khuren Dukh Formation of Dornogov, Mongolia. The only
  known species, Altirhinus kurzanovi, is characterized by its distinctive
  highly arched nasal region.
dispute:
  summary: >
    Altirhinus kurzanovi is recovered within Hadrosauroidea as an
    early-diverging member by recent analyses (Godefroit et al., 2012;
    Poole, 2022). Norman (1998), describing the genus, instead regarded it
    as a derived iguanodontid alongside Iguanodon and Ouranosaurus — a
    position outside Hadrosauroidea as currently delimited — and
    interpreted its hadrosaurid-like cranial features as convergent rather
    than synapomorphic; that assessment rested on a provisional cladogram,
    with a full numerical analysis deferred. Norman (2014) later recovered
    it within a poorly resolved neoiguanodontian plexus.
  history:
    - date: "2026-06-29"
      note: Placed at Hadrosauroidea (basal) following the prevailing
        view; the styracosternan alternative reflected.
    - date: "2026-07-28"
      note: Retained at Hadrosauroidea (basal) following Godefroit et al.
        (2012) and Poole (2022); the iguanodontid assignment of Norman (1998)
        is recorded as the historical alternative.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Rostral tip of nasals strongly arched, giving the snout a distinctively
    elevated profile.
  - Lateral flaring of premaxilla to widen the oral cavity not bounded by a
    raised rim; rostral portion of premaxilla downcurved.
  - Carpus well ossified but not co-ossified into two discrete blocks as in
    Camptosaurus, Iguanodon, and Ouranosaurus.
  - Shaft of ischium straight, parallel-sided and with an axial twist.
  - Large, finger-shaped lesser trochanter not flattened and appressed to the
    anterolateral margin of the greater trochanter.
  - Two replacement crowns in deeper (caudal) portions of both maxillary and
    dentary dentitions.
appearance:
  features:
    - nasal crest
    - keratinous beak
  integument: scaled
  evidence: inferred
