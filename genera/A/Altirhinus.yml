genus: Altirhinus
parent: Hadrosauroidea
pronunciation:
  phonetic: al-ti-RIEN-us
  ipa: /ˌæltɪˈraɪnəs/
etymology: From Latin 'altus' meaning 'high' and Greek 'rhinos' meaning 'nose', meaning 'high nose', referring to its distinctively arched nasal profile.
description: Altirhinus is a genus of ornithopod dinosaur from the Early
  Cretaceous (Albian) Khuren Dukh Formation of Dornogov, Mongolia. The only
  known species, Altirhinus kurzanovi, is characterized by its distinctive
  highly arched nasal region.
dispute:
  summary: >
    Altirhinus kurzanovi is placed near the base of Hadrosauroidea by
    Jones (2026), but it has also been recovered as a styracosternan
    just outside Hadrosauroidea (Neoiguanodontia-grade).
  history:
    - date: "2026-06-29"
      note: Placed at Hadrosauroidea (basal) following the prevailing
        view; the styracosternan alternative reflected (P2).
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Rostral tip of nasals strongly arched, giving the snout a distinctively
    elevated profile.
  - Lateral flaring of premaxilla to widen the oral cavity not bounded by a
    raised rim; rostral portion of premaxilla downcurved.
  - Carpus well ossified but not co-ossified into two discrete blocks as in
    Camptosaurus, Iguanodon, and Ouranosaurus.
  - Shaft of ischium straight, parallel-sided and with an axial twist.
  - Large, finger-shaped lesser trochanter not flattened and appressed to the
    anterolateral margin of the greater trochanter.
  - Two replacement crowns in deeper (caudal) portions of both maxillary and
    dentary dentitions.
appearance:
  features:
    - nasal crest
    - keratinous beak
  integument: scaled
  evidence: inferred
