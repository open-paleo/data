genus: Argentinosaurus
parent: Lognkosauria
pronunciation:
  phonetic: ahr-jen-TEEN-o-SAWR-us
etymology: From Argentina (the country where fossils were found) + Greek sauros
  (σαῦρος) meaning 'lizard'; overall meaning 'lizard from Argentina'.
description: Argentinosaurus is a genus of giant sauropod dinosaur that lived
  during the Late Cretaceous period in what is now Argentina. Although it is
  only known from fragmentary remains, Argentinosaurus is one of the largest
  known land animals of all time, perhaps the largest, measuring 30-35 m (98-115
  ft) long and weighing 65-80 t (72-88 short tons). It was a member of
  Titanosauria, the dominant group of sauropods during the Cretaceous.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Opisthocoelous dorsal vertebrae with very developed hyposphene-hypantrum
    bearing extra articulations between them
  - Anterior dorsal neural spines transversely wide and anteroposteriorly
    planar, with robust prespinal laminae
  - Sacral vertebral bodies 2-5 very reduced in size relative to first sacral
  - Dorsal ribs of tubular, cylindrical, hollow structure with thin external wall
  - Slender tibia 155 cm long with proportionally short cnemial crest
