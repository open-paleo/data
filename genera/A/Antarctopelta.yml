genus: Antarctopelta
parent: Parankylosauria
pronunciation:
  phonetic: ann-TARK-toh-PEL-tuh
etymology: From 'Antarctica' and Greek 'pelta' meaning 'shield', meaning
  'Antarctic shield', reflecting its discovery in Antarctica.
description: Antarctopelta is a genus of ankylosaurian dinosaur, a group of
  large, quadrupedal herbivores, that lived during the Maastrichtian stage of
  the Late Cretaceous period on what is now James Ross Island, Antarctica.
  Antarctopelta is the only known ankylosaur from Antarctica and a member of
  Parankylosauria. The only described specimen was found in 1986, the first
  dinosaur to be found on the continent, by Argentine geologists Eduardo Olivero
  and Robert Scasso. The fossils were later described in 2006 by paleontologists
  Leonardo Salgado and Zulma Gasparini, who named the type species A. oliveroi
  after Olivero.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - marine
diagnostic_features:
  - Cervical centra proportionally short, with centrum length approximately 70%
    of centrum height.
  - Posterior caudal vertebrae notably dorsoventrally depressed, with articular
    faces slightly anteriorly inclined and laterally expanded.
  - Transverse processes of posterior caudals well developed, approximately 40%
    of centrum width, positioned within anterior half of centrum.
  - Ossified tendons present on ventral surface of distal caudal vertebrae.
  - At least six postcranial osteoderm morphotypes, including narrow
    spine-shaped, ovoid rugose plate-like, smooth sub-circular plate-like,
    polygonal rugose, shield-shaped with dorsal keel, and small button-like
    ossicles under 5 mm diameter.
appearance:
  features:
    - body armor
    - osteoderms
  integument: armored
  evidence: direct
