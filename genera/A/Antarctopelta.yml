genus: Antarctopelta
parent: Parankylosauria
pronunciation:
  phonetic: ann-TARK-toh-PEL-tuh
etymology: From 'Antarctica' and Greek 'pelta' meaning 'shield', meaning
  'Antarctic shield', reflecting its discovery in Antarctica.
description: Antarctopelta is a genus of ankylosaurian dinosaur, a group of
  large, quadrupedal herbivores, that lived during the late Campanian age of
  the Late Cretaceous period on what is now James Ross Island, Antarctica.
  Antarctopelta is the only known ankylosaur from Antarctica and a member of
  Parankylosauria. The only described specimen was found in 1986, the first
  dinosaur to be found on the continent, by Argentine geologists Eduardo Olivero
  and Robert Scasso. The fossils were later described in 2006 by paleontologists
  Leonardo Salgado and Zulma Gasparini, who named the type species A. oliveroi
  after Olivero. A 2024 reappraisal by Soto Acuña, Vargas, and Kaluza
  redescribed the holotype, placed the genus within Parankylosauria, and
  reinterpreted its caudal osteoderms as a Stegouros-like bony tail weapon.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - marine
diagnostic_features:
  - Asymmetrical cheek teeth with at least seven denticles on the mesial
    border, marked vertical ridges confluent with the denticles on the lingual
    side, and an ornamented cingulum with fine striations.
  - Scapular girdle unfused (scapula and coracoid not coossified).
  - Metatarsal IV with a proximal epiphysis noticeably wider than those of the
    other metatarsals.
  - Well-marked striations on the supracetabular shelf of the ilium.
  - Sacral shield filling the space between both ilia and covering the sacral
    neural spines, ornamented with several irregular sulci and pits.
  - Intradermal ossicles approximately 8 mm in diameter.
