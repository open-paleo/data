genus: Arrudatitan
parent: Aeolosaurini
etymology: Named after Arruda (a person's name honored in the genus), combined with Greek Titan meaning 'giant'; overall meaning 'Arruda's giant'.
pronunciation:
  phonetic: ar-HU-da-TIE-tuhn
description: Arrudatitan is an extinct genus of titanosaur sauropod dinosaur
  known from the Late Cretaceous (Campanian-Maastrichtian)-aged Adamantina
  Formation of Brazil. The type species, A. maximus, was named and described in
  2011 as a species of Aeolosaurus, but was separated into its own genus in
  2021. It was relatively gracile for a titanosaur.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - arid
diagnostic_features:
  - Posterior cervical vertebrae with posterior centrodiapophyseal lamina (pcdl)
    at least 50% thicker than the postzygodiapophyseal lamina (podl).
  - Posterior trunk vertebrae with oblique anterior centropostzygapophyseal
    lamina (acpol) that bifurcates from the proximal portion of the
    centropostzygapophyseal lamina (cpol).
  - Accessory intrapostzygapophyseal lamina on posterior trunk vertebrae,
    creating two small lateral camerae on the spinopostzygapophyseal fossa.
  - Mid-trunk ribs with well-developed anterior and posterior crests producing a
    D-shaped cross section.
