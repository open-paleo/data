genus: Arrudatitan
parent: Rinconsauria
etymology: Named after Arruda (a person's name honoured in the genus), combined with Greek Titan meaning 'giant'; overall meaning 'Arruda's giant'.
description: Arrudatitan is an extinct genus of titanosaur sauropod dinosaur
  known from the Late Cretaceous (Campanian-Maastrichtian)-aged Adamantina
  Formation of Brazil. The type species, A. maximus, was named and described in
  2011 as a species of Aeolosaurus, but was separated into its own genus in
  2021. It was relatively gracile for a titanosaur.
diet: herbivore
locomotion: quadrupedal
