genus: Abydosaurus
parent: Brachiosauridae
etymology: Named after Abydos, an ancient city, combined with Greek 'sauros' meaning 'lizard'; meaning 'Abydos lizard'
description: Abydosaurus is a genus of brachiosaurid sauropod dinosaur known
  from skull and postcranial material found in upper Lower Cretaceous rocks of
  northeastern Utah, United States.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Nasal lateral process directed anteriorly and lacking a posterior hook
  - Maxilla narial process with dorsal articulation for the nasal
  - Nasals overlap asymmetrically on the midline
  - External nares smaller than the orbit
  - Upper tooth shafts twist through an arc of nearly 45 degrees
  - Tooth wear present only mesially
