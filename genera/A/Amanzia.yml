genus: Amanzia
parent: Turiasauria
etymology: Named for Swiss geologist Amanz Gressly, who is associated with the geological work in the region where the specimen was found.
pronunciation:
  phonetic: am-an-zee-uh
description: Amanzia is a genus of turiasaurian sauropod dinosaur from the Late
  Jurassic Reuchenette Formation in Moutier, Switzerland. The type and only
  species is Amanzia greppini, originally named as a species of Ornithopsis and
  Cetiosauriscus.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - lacustrine
diagnostic_features:
  - Lateral fossa at the base of the prezygapophyseal process in middle cervical
    vertebrae
  - Rugosity on the medial margin of the posterior surface of the humerus, level
    with the deltopectoral crest (autapomorphy)
  - Rugosity on the lateral margin of the posterior surface of the humerus,
    level with the deltopectoral crest
  - Fibular condyle of femur much broader than tibial condyle
  - Shaft of fibula sinuous in lateral view
