genus: Amazonsaurus
parent: Rebbachisauridae
etymology: Named after the Amazon region of South America where fossils were
  found, combined with Greek 'sauros' meaning 'lizard'; meaning 'Amazon lizard'
pronunciation:
  ipa: /ˌæməzənˈsɔːrəs/
  phonetic: AM-uh-zuhn-SOR-uhs
description: Amazonsaurus is a genus of diplodocoid sauropod dinosaur from the
  Early Cretaceous Period of what is now South America. It would have been a
  large-bodied quadrupedal herbivore with a long neck and whiplash tail.
  Although more derived diplodocoids were some of the longest animals ever to
  exist, Amazonsaurus was probably not more than 12 meters (40 ft) long. Gregory
  S. Paul estimated in 2010 its weight at 5000 kg.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - deltaic
  - fluvial
diagnostic_features:
  - Anterior caudal neural spines with 'lateral' laminae formed by coalescence
    of the spinoprezygapophyseal (SPRL) and postzygodiapophyseal (PODL) laminae
  - Anterior caudal 'lateral' laminae (SPRL+PODL) bent anteriorly so that the
    anterior surface is concave and the posterior surface is convex
  - Caudal neural spines straight and posteriorly inclined
  - Thickness of the 'lateral' laminae constant from base to top of the spine
    (unlike Rebbachisaurus tessonei)
