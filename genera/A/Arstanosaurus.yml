genus: Arstanosaurus
parent: Hadrosauridae
placement: incertae sedis
etymology: From "Arstan" (the name of an old well at the
  type locality, in the northeastern Aralkum, Kazakhstan)
  and Greek 'sauros' (lizard); meaning 'Arstan lizard'.
pronunciation:
  phonetic: ahr-STAHN-o-SOR-us
description: >
  Arstanosaurus is a genus of hadrosauroid dinosaur from the Late
  Cretaceous-aged (Santonian-Campanian) Bostobe Formation of Kazakhstan. Named
  on a fragmentary maxilla, it was later argued to be a ceratopsid, until
  redescription of the type material traced that reading to a misinterpreted
  tooth replacement pattern and left the genus an indeterminate hadrosauroid.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "67794"
  - source: wikidata
    id: Q3623999
  - source: gbif
    id: "4823301"
species:
  - name: Arstanosaurus akkurganensis
    etymology: From the Akkurgan locality near Qyzylorda,
      Kazakhstan, where the holotype was collected.
    status: nomen dubium
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Santonian
        - Campanian
    location:
      country: KZ
      locality: Akkurgan
      region: KZ-43
      formation: Bostobe
      notes: Shilin and Suslov (1982) assigned the beds to the Bostobinskaya
        Svita on a general similarity of lithofacies with other outcrops in the
        region rather than on a traced correlation, and Norman and Kurzanov
        (1997) note that a svita and a formation are not quite the same kind of
        unit. The holotype came from a greenish-grey shale 1.5 to 2 m below the
        overlying red beds.
    type_specimen:
      specimen_id:
        - AAIZ 1/1
      specimen_type: holotype
      institution: AAIZ
      material: Left maxilla lacking its rostral and dorsal portions, retaining
        some teeth, with an isolated tooth crown preserved alongside it
      completeness: fragmentary
    erected_in: shilin1982a
    described_in: norman1997a
references:
  - id: shilin1982a
    notes: Original description of Arstanosaurus akkurganensis on a partial left
      maxilla. The genus authority is attributed to Suslov in the paper, while
      the species authority is Suslov and Shilin.
  - id: norman1997a
    notes: Redescription of the type maxilla. Finds the original description's
      characters invalid and the material non-diagnostic, leaving the taxon a
      nomen dubium assignable only to Lambeosaurinae.
