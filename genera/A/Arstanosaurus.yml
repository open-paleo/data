    etymology: From the Akkurgan locality near Qyzylorda,
      Kazakhstan, where the holotype was collected.
    status: nomen dubium
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Santonian
        - Campanian
      from_ma: 86.3
