genus: Arstanosaurus
parent: Hadrosauridae
placement: incertae sedis
etymology: From "Arstan" (the name of an old well at the
  type locality, in the northeastern Aralkum, Kazakhstan)
  and Greek 'sauros' (lizard); meaning 'Arstan lizard'.
pronunciation:
  phonetic: ahr-STAHN-o-SOR-us
description: >
  Arstanosaurus is a genus of hadrosauroid dinosaur from the
  Late Cretaceous-aged (Santonian-Campanian) Bostobe Formation
  of Kazakhstan. It has had a confusing history, being
  considered a hadrosaurid, a ceratopsid, or both at the same
  time (chimeric).
dispute:
  summary: >
    Arstanosaurus is a nomen dubium based on a fragmentary maxilla, with
    concerns that the referred material is chimeric (mixing hadrosaurid
    and ceratopsian remains).
  history:
    - date: "2026-06-27"
      note: Placed at Hadrosauridae incertae sedis; nomen dubium.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Maxilla massive and low, with a practically straight
    dorsal edge.
  - Supershelf process horizontally elongated and overhanging
    above the shelf surface, dorso-ventrally flattened and
    rounded.
  - Outer replacement tooth placed directly above the
    functional tooth rather than lingual and slightly higher,
    with the crown lying within the branching of the root of
    the functional tooth.
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "67794"
  - source: wikidata
    id: Q3623999
  - source: gbif
    id: "4823301"
species:
