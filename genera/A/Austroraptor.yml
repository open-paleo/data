genus: Austroraptor
parent: Unenlagiinae
pronunciation:
  ipa: /ˌɔːstroʊˈræptər/
  phonetic: AW-stroh-RAP-tuhr
etymology: "From Latin auster meaning 'south' and Latin raptor meaning 'thief/plunderer'. Full meaning: 'southern thief/plunderer', referring to its South American (southern) origin."
description: Austroraptor is a genus of unenlagiine theropod dinosaur that lived
  during the Campanian and Maastrichtian ages of the Late Cretaceous period in
  what is now Argentina.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Lacrimal highly pneumatized with descending process strongly curved
    rostrally and caudal process flaring horizontally above orbit as a
    fan-shaped process
  - Postorbital lacking dorsomedial process for frontal articulation, with
    squamosal process extremely reduced
  - Humerus short, representing approximately 46% of femoral length - far less
    than in other dromaeosaurids and paravians
  - Pedal phalanx II-2 transversely narrow, contrasting with the extremely
    robust phalanx IV-2, creating marked foot asymmetry unlike other
    dromaeosaurids
  - Maxillary and dentary teeth small, conical-shaped, unserrated and fluted
    (enamel surface fluted as in spinosaurids)
appearance:
  features:
    - elongate snout
    - reduced forelimbs
    - sickle claw
  integument: feathered
  evidence: inferred
