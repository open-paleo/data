genus: Avimimus
parent: Oviraptorosauria
pronunciation:
  ipa: /ˌeɪvɪˈmaɪməs/
  phonetic: AY-vim-EYE-muhs
etymology: From Latin avis meaning 'bird' + Latin mimus meaning 'mimic'; overall
  meaning 'bird mimic', named for its bird-like characteristics.
description: Avimimus is a genus of oviraptorosaurian theropod dinosaur, named
  for its bird-like characteristics, that lived in the late Cretaceous in what
  is now Mongolia, during the Maastrichtian.
diet: omnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Minimum 11 cervical vertebrae, exceeding the maximum of 10 found in
    ornithomimids and other theropods
  - Hypapophyses present on the last two cervical and first three dorsal
    vertebrae, absent in all other theropods
  - Frontal and parietal bones fully fused into a single fronto-parietal, unique
    among theropods
  - Ischia directed anteriorly and ventrally (parallel to pubis) rather than
    posteriorly, rotated ~50° forward relative to the typical theropod condition
  - Pubis excluded from the acetabular cavity, which is formed solely by the
    ilium and ischium - unique among all dinosaurs
  - Additional supracondyle on the external condyle of the femur forming a
    dedicated articulation surface for the highly reduced fibula - first
    occurrence among dinosaurs
appearance:
  integument: feathered
  evidence: inferred
