        - MPC-D 102/81
      specimen_type: holotype
      institution: MPC
      material: Partial skull.
    diagnostic_features:
      - Exoccipital with a single jugular opening for cranial nerves IX-XII
        (paired foramina in A. portentosus).
      - Relatively smaller foramen magnum and wider pterygoids.
      - Quadratojugal bowed laterally from the quadrate condyle, rather than
        projecting anteriorly.
      - Dentary with better-developed symphyseal shelf and shallower lingual
        ridges.
      - Ilium and ischium unfused, and ischiadic peduncle lacking an
        antitrochanter.
      - Preacetabular blade of ilium dorsally expanded and ventrally hooked,
        with an extensive sigmoidal brevis shelf lacking suprabrevis ridges.
    erected_in: funston2018a
