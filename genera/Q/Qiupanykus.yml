genus: Qiupanykus
parent: Alvarezsauroidea
etymology: claw from the Qiupa Formation
pronunciation:
  ipa: /ˌtɕʰuˈpaːˈnɑ͡ikəs/
description: Qiupanykus is an extinct genus of alvarezsaurid theropod from the
  Late Cretaceous Qiupa Formation of Henan Province, China. The type and only
  species is Q. zhangi, named for Shuancheng Zhang, who assisted in finding the
  fossils of Qiupanykus.
diet: carnivore
locomotion: bipedal
