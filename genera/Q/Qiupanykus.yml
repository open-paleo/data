genus: Qiupanykus
parent: Alvarezsauridae
dispute:
  summary: >
    Qiupanykus zhangi was described as a parvicursorine recovered near the base
    of Parvicursorinae (Lü et al., 2018). More recent work places it outside
    Parvicursorinae as a more basal alvarezsaurid: Kubo et al. (2023) recovered
    it as one of several successive sister taxa to Parvicursorinae, a result
    Averianov et al. (2025) suggest may reflect its incomplete material.
  history:
    - date: "2026-07-01"
      note: Placed at Alvarezsauridae, the least-inclusive uncontested node, following Kubo et al. (2023); its membership in Parvicursorinae is unresolved.
etymology: Named after the Qiupa Formation where the fossil was found, combined with Greek onyx (claw); meaning "claw from the Qiupa Formation".
pronunciation:
  ipa: /ˌtɕʰuˈpaːˈnɑ͡ikəs/
  phonetic: chee-OO-pah-NY-kuhs
description: Qiupanykus is an extinct genus of alvarezsaurid theropod from the
  Late Cretaceous Qiupa Formation of Henan Province, China. The type and only
  species is Q. zhangi, named for Shuancheng Zhang, who assisted in finding the
  fossils of Qiupanykus.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Posterior sacral vertebrae bearing strong ventral keel
  - Proximal caudals with transverse processes centrally positioned on centrum
  - Pubic articular surface of pubic peduncle reduced and knob-like
  - Fibular crest of tibia large and quadrangular
  - Functional sacrum comprised of eight vertebral elements (two anterior caudal
    plus six sacral)
  - Small pneumatic foramen present in caudal vertebrae
appearance:
  features:
    - enlarged manual claws
  integument: feathered
  evidence: inferred
identifiers:
  - source: pbdb
    id: "391295"
  - source: wikidata
    id: Q56603904
