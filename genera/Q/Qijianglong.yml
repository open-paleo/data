genus: Qijianglong
parent: Mamenchisauridae
etymology: Named after Qijiang District in Chongqing, China, where fossils were discovered, combined with Chinese 'long' (dragon).
pronunciation:
  phonetic: chee-jee-yahn-long
description: Qijianglong is a genus of herbivorous mamenchisaurid sauropod
  dinosaurs. It is known from the Suining Formation of China, which is of a
  debated age (reported as Late Jurassic or Early Cretaceous using different
  methods). The genus contains a single species, Qijianglong guokr, known from a
  partial skeleton including cranial bones, most of the neck and tail, and other
  associated elements.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Plate-like basipterygoid process oriented anteroventrally with accessory
    tuber paralleling basal tuber
  - Finger-like process lateral to postzygapophyses in cervical vertebrae
    extending from axis to at least 14th cervical
  - Pneumatopores in spinodiapophyseal fossa in posterior cervical vertebrae
    (17th cervical)
  - Pubis anteriorly concave such that distal end points more anteriorly than
    ventrally
  - Parietal forming entire anterior margin of supratemporal fenestra
  - Absence of frontoparietal fenestra and presence of postparietal foramen
appearance:
  features:
    - elongate neck
