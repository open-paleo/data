genus: Qingxiusaurus
parent: Saltasauridae
pronunciation:
  phonetic: ching-SHYOO-SAWR-us
etymology: "Named for Qingxiu, a shortened form of the Chinese phrase meaning 'a
  picturesque scenery of mountains and water in Guangxi', combined with Greek
  'sauros' meaning 'lizard'; meaning 'Qingxiu lizard.'"
description: "Qingxiusaurus is a genus of titanosaur sauropod dinosaur from the
  Late Cretaceous Dashi Site of Guangxi, China. The type species, described by
  Mo et al. in 2008, is Q. youjiangensis. Like other sauropods, Qingxiusaurus
  would have been a large quadrupedal herbivore. It is known from only limited
  remains collected in 1991: Two humeri, two sternal plates, and the neural
  spine of a single vertebra."
diet: herbivore
locomotion: quadrupedal
diagnostic_features:
  - Simply-built, elongated, paddle-shaped cranial caudal neural spine with
    minimal laminae development
  - Cranial caudal neural spine transversely broad, much wider than axially tall
  - Length ratio between sternal plate and humerus low (approximately 0.65,
    versus >0.75 in other titanosaurs
paleoenvironment:
  - lacustrine
appearance:
  integument: scaled
  evidence: inferred
