genus: Qianzhousaurus
parent: Tyrannosaurinae
etymology: "Named for Qianzhou, the older name of Ganzhou, China, where the remains were discovered, combined with Greek 'sauros' meaning 'lizard'; meaning 'Qianzhou lizard.'"
pronunciation:
  phonetic: chee-EN-jo-SOR-us
description: Qianzhousaurus is a genus of tyrannosaurid dinosaur that lived in
  Asia during the Maastrichtian age of the Late Cretaceous period. There is
  currently only one species named, the type species Qianzhousaurus sinensis,
  which is a member of the tribe Alioramini and most closely related to
  Alioramus, the only other known alioramin.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Large fenestra on the ascending ramus of the maxilla (an ovoid accessory
    pneumatic fenestra posterodorsal to the maxillary fenestra, absent in other
    tyrannosauroids).
  - Extremely reduced premaxilla (only ~2.2% of basal skull length, not
    elongated despite the longirostrine snout).
  - Laterally straight, rod-like nasal that does not expand laterally around the
    naris region (unlike the hourglass shape in Alioramus).
  - Anteroventrally oriented ventral process of the lacrimal.
  - Gracile and shallow dorsal prong of the anterior ramus of the squamosal.
  - Anteroposteriorly oriented ventral process of the squamosal.
  - Anterior edge of the dentary smoothly merging with the ventral dentary
    margin.
  - Highly concave dorsal margin of the supradentary.
  - Absence of a pronounced vertical ridge on the lateral surface of the ilium
    (postcranial character retained from Lü et al. 2014).
appearance:
