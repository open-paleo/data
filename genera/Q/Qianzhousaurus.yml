genus: Qianzhousaurus
parent: Alioramini
etymology: "Named for Qianzhou, the older name of Ganzhou, China, where the remains were discovered, combined with Greek 'sauros' meaning 'lizard'; meaning 'Qianzhou lizard.'"
description: Qianzhousaurus is a genus of tyrannosaurid dinosaur that lived in
  Asia during the Maastrichtian age of the Late Cretaceous period. There is
  currently only one species named, the type species Qianzhousaurus sinensis,
  which is a member of the tribe Alioramini and most closely related to
  Alioramus, the only other known alioramin.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Large, discrete, window-like pneumatic fenestra on ascending ramus of maxilla
  - Extremely reduced premaxilla (2.2% of basal skull length, versus 4.3-4.6% in
    other tyrannosaurids)
  - Absence of pronounced vertical ridge on lateral surface of ilium
  - Extremely long and low skull with snout comprising 70% of total skull length
  - Anteroposteriorly elongate maxillary fenestra with length-to-depth ratio
    greater than 1.9
  - Series of pronounced, discrete rugosities on nasal
