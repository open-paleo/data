genus: Qianzhousaurus
parent: Alioramini
etymology: Qianzhou lizard
description: Qianzhousaurus is a genus of tyrannosaurid dinosaur that lived in
  Asia during the Maastrichtian age of the Late Cretaceous period. There is
  currently only one species named, the type species Qianzhousaurus sinensis,
  which is a member of the tribe Alioramini and most closely related to
  Alioramus, the only other known alioramin.
diet: carnivore
