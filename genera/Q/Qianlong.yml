genus: Qianlong
parent: Sauropodiformes
placement: incertae sedis
etymology: "From Mandarin '黔' (Qian), a name for Guizhou Province, China, and 'long' (龙) meaning 'dragon'; meaning 'Guizhou dragon.' The specific name shouhu means 'guarding' in Mandarin, referencing the associated adult and embryo fossils."
pronunciation:
  phonetic: chee-an-long
description: Qianlong is an extinct genus of basal sauropodomorph dinosaur from
  the Early Jurassic Ziliujing Formation of China. Known from partial skeletons
  of three mature individuals associated with several eggs, some of which
  contain embryos, these fossils may represent the oldest leathery eggs
  currently known.
dispute:
  summary: >
    Qianlong shouhu was placed as a basal sauropodiform, sister to
    Yunnanosaurus, by its describers (Han and others, 2023), but is
    recovered among basal massopodans by Wang and others (2025).
  history:
    - date: "2026-06-29"
      note: Reparented to Sauropodiformes incertae sedis following its describers; the basal-Massopoda alternative is recorded.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
diagnostic_features:
  - Shallow concavity at base of premaxilla nasal process
  - Relatively straight teeth with labiolingually asymmetrical crowns lacking
    denticles
  - Jaw articulation positioned lower than dentary dorsal margin
  - Short retroarticular process
  - Very small external mandibular fenestra
  - Well-developed nutritive foramina on maxillary and dentary
  - Metacarpal I width greater than length
  - Metatarsal V with strongly expanded proximal end four times distal
    mediolateral width and lateral bulge
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "477695"
  - source: wikidata
    id: Q123012247
species:
  - name: Qianlong shouhu
    etymology: "From Mandarin 'shouhu' (守护) meaning 'guarding' or 'protecting', in reference to the discovery of the adult skeleton in close association with fossil eggs containing embryos."
    status: valid
    type_species: true
    period:
      name:
        - Early Jurassic
      stage:
        - Sinemurian
      from_ma: 199.3
      to_ma: 192.9
    location:
      country: CN
      locality: Pingba District, Anshun City
      region: Guizhou
      formation: Ziliujing
      coordinates:
        - 26.406111
        - 106.255836
    type_specimen:
      specimen_id: [GZPM VN001]
      specimen_type: holotype
      institution: GZPM
      material: Partial semi-articulated skeleton with partial skull and
        mandible (mandible preserved 30 m west of the postcranial skeleton);
