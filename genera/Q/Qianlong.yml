      completeness: partial
    erected_in: han2023a
notable_specimens:
  - specimen_id: [GZPM VN004, GZPM VN005, GZPM VN006, GZPM VN007, GZPM VN008]
    institution: GZPM
    species: Qianlong shouhu
    category: reproductive
    significance: "Five clutches of leathery eggs, some containing embryos and hatchlings, found in association with the adult skeletons. The specific name shouhu (\"guarding\") references this adult-and-embryo association."
    references: [han2023a]
  - specimen_id: [GZPM VN002, GZPM VN003]
    institution: GZPM
    species: Qianlong shouhu
    category: ontogeny
    significance: "Two referred juvenile skeletons documenting ontogenetic change: the skull, mandible, forelimbs, and shoulder girdles are proportionally larger than in adults, similar to the related sauropodomorphs Massospondylus and Mussaurus."
    references: [han2023a]
references:
  - id: han2023a
  - id: wang2025a
    notes: Recovered Qianlong shouhu among basal massopodans, not basal sauropodiforms.
