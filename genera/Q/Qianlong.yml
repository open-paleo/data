genus: Qianlong
parent: Sauropodomorpha
etymology: "From Mandarin '黔' (Qian), a name for Guizhou Province, China, and 'long' (龙) meaning 'dragon'; meaning 'Guizhou dragon.' The specific name shouhu means 'guarding' in Mandarin, referencing the associated adult and embryo fossils."
description: Qianlong is an extinct genus of basal sauropodomorph dinosaur from
  the Early Jurassic Ziliujing Formation of China. Known from partial skeletons
  of three mature individuals associated with several eggs, some of which
  contain embryos, these fossils may represent the oldest leathery eggs
  currently known.
diet: herbivore
locomotion: bipedal
