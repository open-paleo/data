genus: Quetecsaurus
parent: Lognkosauria
etymology: "From the Milcayac word 'quetec' meaning 'fire', combined with Greek
  'sauros' meaning 'lizard'; meaning 'fire lizard.'"
description: Quetecsaurus is a genus of titanosaurian sauropod dinosaur known
  from the Late Cretaceous of the southern Mendoza Province, western Argentina.
  It contains a single species, Quetecsaurus rusconii.
