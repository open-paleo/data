genus: Quetecsaurus
parent: Lognkosauria
etymology: "From the Milcayac word 'quetec' meaning 'fire', combined with Greek
  'sauros' meaning 'lizard'; meaning 'fire lizard.'"
description: Quetecsaurus is a genus of titanosaurian sauropod dinosaur known
  from the Late Cretaceous of the southern Mendoza Province, western Argentina.
  It contains a single species, Quetecsaurus rusconii.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - wetland
diagnostic_features:
  - intercentrum of atlas with prominent anteroventral border and expanded
    posteroventral processes
  - posterior cervical neural spines with incipient lateral laminae
  - humerus with strongly sigmoid proximal border, rounded proximomedial border,
    and angular proximolateral corner
