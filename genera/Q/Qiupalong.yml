genus: Qiupalong
parent: Ornithomimidae
pronunciation:
  ipa: /ˌtɕʰuˈpaːloŋ/
  phonetic: chee-OO-pah-long
etymology: "From Chinese 'Qiupa' (the Qiupa Formation where it was found) + 'long' (dragon), meaning 'dragon from the Qiupa Formation'."
description: Qiupalong is an extinct genus of ornithomimosaurian theropod that
  was discovered in the Late Cretaceous Qiupa Formation of Henan, China. The
  genus contains a single species, Q. henanensis, the specific epithet for which
  was named for the province of Henan. Uniquely, Qiupalong is one of the few
  Late Cretaceous non-avian dinosaurs known from both Asia and Laramidia. A
  specimen from Alberta has been referred to the genus without being assigned to
  the type species or suggested to be similar to it. A fossil of an ornithomimid
  similar to Qiupalong has also been described from Russian Far East.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Notch on the lateral surface of the medial posterior process of the proximal
    end of tibia, unlike other ornithomimosaurs
  - Small pit present at the contact between astragalus and calcaneum, unlike
    other ornithomimids
appearance:
