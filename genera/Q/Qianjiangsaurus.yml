genus: Qianjiangsaurus
parent: Hadrosauroidea
etymology: "Named for Qianjiang District, Chongqing Municipality, China, where the type locality is located, combined with Greek 'sauros' meaning 'lizard'; meaning 'Qianjiang lizard.'"
pronunciation:
  phonetic: chee-EN-jyahng-SOR-us
description: Qianjiangsaurus is an extinct genus of hadrosauroidean ornithopod
  dinosaurs from the Late Cretaceous Zhengyang Formation of China. The genus
  contains a single species, Q. changshengi, known from a partial skeleton.
  Qianjiangsaurus is one of the few hadrosauroids named from south China, and it
  indicates important fauna connections between similarly aged formations in
  Mongolia.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
diagnostic_features:
  - Fan-shaped prepubic process of pubis greatly anteroposteriorly shortened and
    dorsoventrally expanded, length/height ratio ~0.79
  - Transversely wide U-shaped predentary with smoothly arcuate anterolateral
    edges
  - Right-angled coronoid process relative to dorsal margin of dentary body
  - Dentary tooth crown with slightly distally offset primary ridge, short
    secondary ridge mesially, slender faint ridge distally
  - Sacrum consisting of seven fused vertebrae
  - Strongly concave posterodorsal margin of iliac central plate above
    supraacetabular process
  - Ischial shaft nearly parallel with long axis of pubic peduncle of ischium
