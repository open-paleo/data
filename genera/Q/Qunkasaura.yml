genus: Qunkasaura
parent: Saltasauridae
etymology: "From 'Qunka' (or 'Kunka'), the old Spanish name that gave rise to Cuenca in Castilla-La Mancha, Spain, where the Lo Hueco site is located, combined with Greek 'saura' meaning 'lizard'."
pronunciation:
  phonetic: KUN-kuh-SOH-ruh
description: Qunkasaura is a genus of saltasauroid titanosaur dinosaur from the
  Late Cretaceous (Campanian-Maastrichtian) Lo Hueco site of the Villalba de la
  Sierra Formation of Spain. The type species is Qunkasaura pintiquiniestra.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - wetland
diagnostic_features:
  - Round and rudimentary epipophyses in posterior cervical vertebrae
  - Concave postzygapophyseal facets in posterior cervical and anterior dorsal
    vertebrae
  - Pedicels of neural arch at centrum midpoint in anterior dorsal vertebrae,
    not reaching articular surfaces
  - M-shaped laminar structure from acpl, pcpl, acdl and pcdl of similar length
    on dorsal neural arches
  - Intraprezygapophyseal lamina anteriorly pointed and projected on anterior
    dorsal vertebrae
  - Dorsal neural spines markedly anteroposteriorly compressed with mediolateral
    width six times anteroposterior length
  - Prespinal lamina ventral section anteroposteriorly projected
  - Ventral longitudinal groove on first to third sacral centra
  - Dorsomedial projected hook-shaped process on sacral plates
  - Maximum dorsoventral height of iliac blade located above pubic peduncle
  - Pubis 118% of ilium proximodistal length
