genus: Quilmesaurus
parent: Furileusauria
pronunciation:
  phonetic: keel-may-SAWR-us
etymology: "Named for the Quilmes, an indigenous people of northwestern
  Argentina, combined with Greek 'sauros' meaning 'lizard'."
description: Quilmesaurus is a genus of carnivorous theropod dinosaur from the
  Upper Cretaceous (Campanian to Maastrichtian stages) Allen Formation of
  Argentina. It was a member of Abelisauridae, closely related to genera such as
  Carnotaurus. The only known remains of this genus are leg bones which share
  certain similarities to a variety of abelisaurids. However, these bones lack
  unique features, which may render Quilmesaurus a nomen vanum (more commonly
  known as a nomen dubium, or "dubious name").
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Femur with strong, well-developed mediodistal crest extending as broad
    anteromedially projecting lamina
  - Tibia with hook-shaped cnemial crest, distal end of cnemial crest noticeably
    expanded with distinctive hooklike shape in medial view
  - Lateral malleolus twice the size of medial malleolus, resulting in
    asymmetrical distal tibial profile
  - Low facet for the ascending process of the astragalus (16% of tibia length)
  - Fossa on the distal articular surface of the tibia
