genus: Qiaowanlong
parent: Euhelopodidae
pronunciation:
  phonetic: CHYOW-wahn-long
etymology: Named after Qiaowan, the area in Gansu Province, China where the fossil was found, combined with Chinese long (dragon); meaning "Qiaowan dragon".
description: Qiaowanlong is an extinct genus of sauropod dinosaur. Fossils
  belonging to the genus were found in the Yujinzi Basin of what is today Gansu
  Province, China. The remains come from a geological formation called the
  Xiagou Formation in the Xinminpu Group, dating to the late Aptian Stage of the
  Early Cretaceous.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - lacustrine
diagnostic_features:
  - Low elongation index (EI) ratio of 3.0–3.6 (central length/cotyle height),
    lower than Brachiosaurus brancai and Sauroposeidon
  - Deeply bifurcated cervical neural spines in both cranial and caudal views
  - Three fossae on lateral surface of centrum middle portion
  - Much reduced ischium with shaft width ~50% and length ~70% of pubis
  - Long pubic process of ischium occupying ~60% of shaft length
appearance:
  features:
    - elongate neck
  integument: scaled
  evidence: inferred
