genus: Quaesitosaurus
parent: Nemegtosauridae
pronunciation:
  phonetic: kwee-SIET-o-SAWR-us
etymology: From Latin 'quaesitus' (extraordinary, sought-after, unusual) + Greek
  'sauros' (lizard), meaning 'extraordinary lizard'.
description: Quaesitosaurus is a genus of nemegtosaurid sauropod containing only
  the type species, Q. orientalis, described in 1983. It lived from 72 to 71
  million years ago during the Late Cretaceous epoch in the Barun Goyot
  Formation. With long, low and horse-like with frontally located peg-teeth, the
  skull of Quaesitosaurus is similar enough to the skull of Diplodocus and its
  kin to have prompted informed speculation that the missing body was built like
  those of diplodocids.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - arid
diagnostic_features:
  - Large 'resonator' depression on posterior side of quadrate bone with thin
    walls
  - Inclined canal in base of occipital bone passing from pituitary depression,
    opening below occipital condyle (unique among sauropods)
  - Parietal aperture absent
  - Occipital condyle rounded and inclined downwards
  - Squamosal bone not in contact with quadratojugal
  - Maxilla bears nine teeth
