genus: Qantassaurus
parent: Ornithopoda
pronunciation:
  ipa: /ˌkwɑːntəˈsɔːrəs/
  phonetic: KWAHN-tə-SOR-əs
description: Qantassaurus is a genus of basal two-legged, plant-eating
  elasmarian ornithischian dinosaur that lived in Australia about 125-112
  million years ago, when the continent was still partly south of the Antarctic
  Circle. It was described by Patricia Vickers-Rich and her husband Tom Rich in
  1999 after a find near Inverloch, and named after Qantas, the Australian
  airline.
diet: herbivore
locomotion: bipedal
