genus: Qantassaurus
parent: Elasmaria
pronunciation:
  ipa: /ˌkwɑːntəˈsɔːrəs/
  phonetic: KWAHN-tuh-SOR-uhs
etymology: "Named after Qantas, the Australian airline, combined with Greek
  'sauros' (lizard); honors the national carrier of the country where it was
  discovered."
description: Qantassaurus is a genus of basal two-legged, plant-eating
  elasmarian ornithischian dinosaur that lived in Australia about 125-112
  million years ago, when the continent was still partly south of the Antarctic
  Circle. It was described by Patricia Vickers-Rich and her husband Tom Rich in
  1999 after a find near Inverloch, and named after Qantas, the Australian
  airline.
dispute:
  summary: >
    Qantassaurus is referred to Elasmaria following Madzia and others
    (2017) and the assessment of Jones (2026). It behaves as an unstable
    wildcard in several analyses (Herne and others, 2019; Bell and others,
    2018), in which it could not be placed with confidence, and it is
    known only from dentaries.
  history:
    - date: "2026-06-29"
      note: Placed at Elasmaria following Madzia and others (2017) and Jones (2026) (P2); recovered as an unstable wildcard by Herne and others (2019) and Bell and others (2018).
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - polar
diagnostic_features:
  - Only ten cheek teeth in foreshortened dentary
  - Dorsal and ventral margins of dentary converge anteriorly
  - Strong primary ridge and prominent secondary ridges on cheek teeth
appearance:
  integument: scaled
  evidence: inferred
