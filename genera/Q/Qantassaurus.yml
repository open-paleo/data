genus: Qantassaurus
parent: Elasmaria
pronunciation:
  ipa: /ˌkwɑːntəˈsɔːrəs/
  phonetic: KWAHN-tuh-SOR-uhs
etymology: "Named after Qantas, the Australian airline, combined with Greek
  'sauros' (lizard); honors the national carrier of the country where it was
  discovered."
description: Qantassaurus is a genus of basal two-legged, plant-eating
  elasmarian ornithischian dinosaur that lived in Australia about 125-112
  million years ago, when the continent was still partly south of the Antarctic
  Circle. It was described by Patricia Vickers-Rich and Tom Rich, a married
  couple, in 1999 after a find near Inverloch, and named after Qantas, the
  Australian airline.
dispute:
  summary: >
    Qantassaurus is known only from dentaries and was named as a
    hypsilophodontid (Rich and Vickers-Rich, 1999). Madzia and colleagues
    (2017) recover it within Elasmaria once the unstable Morrosaurus and
    Leaellynasaura are removed. Bell and colleagues (2018) and Herne and
    colleagues (2019) find it unstable and prune it, though Herne and
    colleagues note it might be an elasmarian from the resemblance of its
    teeth to those of Talenkauen.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - polar
diagnostic_features:
  - Only ten cheek teeth in foreshortened dentary
  - Dorsal and ventral margins of dentary converge anteriorly
  - Strong primary ridge and prominent secondary ridges on cheek teeth
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "66575"
  - source: wikidata
    id: Q664272
  - source: gbif
    id: "4823165"
species:
  - name: Qantassaurus intrepidus
    etymology: "From Latin 'intrepidus' meaning 'intrepid' or 'fearless', referring
      to the climatic challenges the small dinosaur faced living within the
      Antarctic Circle."
    status: valid
    type_species: true
    period:
      name:
        - Early Cretaceous
      stage:
        - Barremian
    location:
      country: AU
      locality: Flat Rocks fossil vertebrate site
      region: AU-VIC
      formation: Wonthaggi
      coordinates:
        - -38.661111
        - 145.681111
    size:
      length_m:
        min: 1.8
        max: 1.8
    type_specimen:
      specimen_id: [ NMV P199075 ]
      specimen_type: holotype
      institution: NMV
      material: Complete left dentary with all alveolar sockets preserved, with
        at least one tooth in seven of ten alveolar positions
      completeness: fragmentary
    erected_in: rich1999b
references:
  - id: rich1999b
    notes: Named Qantassaurus as a hypsilophodontid.
  - id: madzia2017a
    notes: Recovered Qantassaurus within Elasmaria after removing Morrosaurus
      and Leaellynasaura.
  - id: herne2019a
    notes: Found Qantassaurus a wildcard and pruned it; notes it might be an
      elasmarian from its teeth.
  - id: bell2018a
    notes: Found Qantassaurus unstable and pruned it from the reduced consensus.
  - id: jones2026a
    notes: Treats Qantassaurus as an elasmarian.
