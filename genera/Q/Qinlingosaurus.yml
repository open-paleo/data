genus: Qinlingosaurus
parent: Sauropoda
pronunciation:
  phonetic: chin-ling-o-SAWR-us
etymology: Named after the Qinling mountain range of Shaanxi Province, China, where the first fossils were recovered, combined with Greek 'sauros' (lizard).
description: Qinlingosaurus is a genus of herbivorous sauropod dinosaur from the
  Late Cretaceous of Asia.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
appearance:
  integument: scaled
  evidence: inferred
diagnostic_features:
  - Iliac blade thin, anteroposteriorly long and dorsoventrally low, rhomboidal in
    outline, with both ends strongly curved laterally
  - Pubic peduncle positioned near the center of the lower margin of the iliac
    blade, long, robust, and approximately semicylindrical
  - Medial surface of the iliac blade bearing a well-developed longitudinal ridge
    descending toward the pubic peduncle
  - Wide, gently arcing gap between the pubic and ischial peduncles, producing an
    unusually wide, large acetabulum
  - Sacral vertebrae with transverse processes that bifurcate into upper and lower
    wedge-shaped branches and neural ridges that bifurcate vertically
