genus: Overoraptor
parent: Paraves
pronunciation:
  ipa: /ˌʊuvərʊuˈræptər/
etymology: From Spanish 'overo' (piebald, a coat pattern with irregular patches), combined with Latin 'raptor' (thief); meaning 'piebald thief'.
description: Overoraptor is an extinct genus of paravian theropod of uncertain
  affinities from the Late Cretaceous Huincul Formation of Argentinian
  Patagonia. The genus contains a single species, O. chimentoi, known from
  several bones of the hands, feet, and hips alongside some vertebrae.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Posterior caudal centra with complex system of lateral longitudinal ridges
    and concavities
  - Scapula with medially deflected distal end
  - Acromial process reduced and ridge-like
  - Robust ulna with saddle-shaped and prominent radial cotyle
  - Metacarpal I with extensive medioventral crest
  - Metatarsal II with longitudinal lateroventral crest ending in posterior
    tubercle
  - Metatarsal III distal end non-ginglymoidal
  - Metatarsal III distal end dorsoventrally deeper than transversely wide
  - Strongly dorsally displaced collateral pits on pedal phalanx II-2
