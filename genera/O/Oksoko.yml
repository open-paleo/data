genus: Oksoko
parent: Heyuanninae
etymology: From Öksökö, a mythical two-headed bird in Yakut (Sakha) folklore of Siberia
pronunciation:
  phonetic: Oak-soak-oh
description: Oksoko is a genus of oviraptorid dinosaur from the Late Cretaceous
  Nemegt Formation of Omnogov Province, Mongolia. The type and only species is
  Oksoko avarsan. It is notable for having only two functional fingers, having
  lost the third manual digit, suggesting a trend toward digit reduction within
  oviraptorosaurs.
diet: omnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Apically thickened, dome-shaped cranial crest composed equally of nasals and
    frontals
  - Nasal recesses housed in depression
  - Postorbital with dorsally directed frontal process
  - Cervical vertebrae with large epipophyses
  - Functionally didactyl manus
  - Accessory ridge of brevis fossa of ilium
  - Anteriorly curving pubis
  - Large proximodorsal process of distal tarsal IV
appearance:
  features:
    - hollow cranial crest
    - reduced outer digit
  integument: feathered
  evidence: inferred
identifiers:
  - source: pbdb
    id: "430728"
  - source: wikidata
    id: Q28219834
species:
  - name: Oksoko avarsan
    etymology: "From the Mongolian word 'avarsan' meaning 'rescued', given that specimens of the genus were redeemed from fossil poachers."
    status: valid
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Maastrichtian
    location:
      country: MN
      region: MN-069
      formation: Nemegt
      notes: The holotype was poached and confiscated before leaving Mongolia,
        and Funston and colleagues record that its exact provenance within
        the Nemegt Formation is unknown. The Bugiin Tsav and Guriliin Tsav
        sites they name belong to the lawfully collected referred
        specimens.
    size:
      weight_kg:
        min: 31
        max: 74
    erected_in: funston2020a
    type_specimen:
      specimen_id: [MPC-D 102/110]
      specimen_type: holotype
      institution: MPC
      material: "Block assemblage of three individuals: skulls, cervical vertebrae,
        pelvis, hindlimbs, caudal vertebrae, forelimb material."
      completeness: complete
notable_specimens:
  - specimen_id: [MPC-D 102/12]
    institution: MPC
    species: Oksoko avarsan
    category: ontogeny
    significance: "The only known adult specimen of Oksoko, at least 5 years old with an estimated body mass of 74 kg, contrasting with the juvenile holotype individuals and showing the limb bones become more robust in adults."
    discovered:
      year: 1998
    references: [funston2020a]
  - specimen_id: [MPC-D 100/33]
    institution: MPC
    species: Oksoko avarsan
    significance: "The first specimen of Oksoko, a partial subadult postcranial skeleton, long referred to as a paratype of Heyuannia but sharing traits with Oksoko including a reduced third metacarpal."
    discovered:
