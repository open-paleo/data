genus: Oksoko
parent: Heyuanninae
etymology: From Öksökö, a mythical two-headed bird in Yakut (Sakha) folklore of Siberia
description: Oksoko is a genus of oviraptorid dinosaur from the Late Cretaceous
  Nemegt Formation of Omnogov Province, Mongolia. The type and only species is
  Oksoko avarsan. It is notable for having only two functional fingers, having
  lost the third manual digit, suggesting a trend toward digit reduction within
  oviraptorosaurs.
diet: omnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Apically thickened, dome-shaped cranial crest composed equally of nasals and
    frontals
  - Nasal recesses housed in depression
  - Postorbital with dorsally directed frontal process
  - Cervical vertebrae with large epipophyses
  - Functionally didactyl manus
  - Accessory ridge of brevis fossa of ilium
  - Anteriorly curving pubis
  - Large proximodorsal process of distal tarsal IV
