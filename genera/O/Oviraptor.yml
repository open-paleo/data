genus: Oviraptor
parent: Oviraptoridae
pronunciation:
  phonetic: OH-vi-RAP-tor
  ipa: /ˈoʊvɪræptər/
etymology: "From Latin ovum ('egg') and raptor ('thief'), meaning 'egg thief',
  based on the initial (later revised) interpretation that it was stealing eggs"
description: Oviraptor is a genus of oviraptorid dinosaur that lived in Asia
  during the Late Cretaceous period. The first remains were collected from the
  Djadokhta Formation of Mongolia in 1923 during a paleontological expedition
  led by Roy Chapman Andrews, and in the following year the genus and type
  species Oviraptor philoceratops were named by Henry Fairfield Osborn. The
  genus name refers to the initial thought of egg-stealing habits, and the
  specific name was intended to reinforce this view indicating a preference over
  ceratopsian eggs. Despite the fact that numerous specimens have been referred
  to the genus, Oviraptor is only known from a single partial skeleton regarded
  as the holotype, as well as a nest of about fifteen eggs and several small
  fragments from a juvenile.
diet: omnivore
locomotion: bipedal
paleoenvironment:
  - arid
diagnostic_features:
  - Entirely edentulous cranium (toothless)
  - Eight craniofacial and mandibular fenestrations (unique arrangement)
  - Cranium exceeding facial region in length, abbreviate and vertically deep
    posteriorly
  - Manus tridactyl with abbreviated metacarpals and irregularly elongated digits
  - Extremely elongate second digit (II), D.I and III relatively abbreviated
  - Faciocranial index 70% (extremely low, distinct from megalosaurs)
  - Large interclavicle and extremely elongate scapula
appearance:
  features:
    - hollow cranial crest
    - keratinous beak
  integument: feathered
  evidence: inferred
