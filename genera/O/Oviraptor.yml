notable_specimens:
  - specimen_id: [MPC-D 100/42]
    institution: MPC
    category: complementary
    significance: "Rather complete tall-crested individual from the Djadokhta Formation referred to Oviraptor by Barsbold in 1981; as the crestless holotype is fragmentary, it long served as the prime depiction of the taxon. Clark et al. (2002) found it does not belong to Oviraptor, more closely resembling Citipati."
    references: [barsbold1981a, clark2002a]
  - specimen_id: [AMNH 33092]
    institution: AMNH
    species: Oviraptor philoceratops
    category: ontogeny
    significance: "A nestling or very small juvenile composed of a right tibia and metatarsals III and IV, reported by Norell and colleagues in 2018. Found in association with the holotype and likely part of the nest, its 5.87 cm tibia indicates a much smaller individual than the holotype, supporting parental care."
    discovered:
