genus: Oplosaurus
parent: Sauropoda
pronunciation:
  phonetic: OP-loh-SAWR-us
etymology: From Greek 'hoplon' (weapon or armor) and 'sauros' (lizard); meaning 'armed or weapon lizard' or 'armored lizard'.
description: Oplosaurus was a genus of sauropod dinosaur from the Lower
  Cretaceous (Barremian stage) Wessex Formation of the Isle of Wight, England.
  It is known from a single tooth usually referred to the contemporaneous
  "wastebasket taxon" Pelorosaurus, although there is no solid evidence for
  this.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - marine
appearance:
  integument: scaled
  evidence: inferred
diagnostic_features:
  - Crown sabre-shaped and bayonet-shaped with unequal anterior convexity and
    posterior concavity
  - Anterior and posterior edges keeled with indication of third vertical keel
    on convex face
  - Four blunt ridges on external convex surface
  - Root nearly cylindrical, enveloped in bony matter indicating Mosasaur-like
    implantation
  - Crown considerably wider than root, distinguishing it from Hylaeosaurus
