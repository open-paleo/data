genus: Oplosaurus
parent: Sauropoda
etymology: armed or weapon lizard
description: Oplosaurus was a genus of sauropod dinosaur from the Lower
  Cretaceous (Barremian stage) Wessex Formation of the Isle of Wight, England.
  It is known from a single tooth usually referred to the contemporaneous
  "wastebasket taxon" Pelorosaurus, although there is no solid evidence for
  this.
