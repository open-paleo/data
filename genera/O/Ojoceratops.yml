genus: Ojoceratops
parent: Chasmosaurinae
etymology: Ojo Alamo horned face
pronunciation:
  phonetic: o-jo-SEH-ruh-tops
description: Ojoceratops is a genus of ceratopsian dinosaur which lived in what
  is now New Mexico, United States. Ojoceratops fossils have been recovered from
  strata of the Ojo Alamo Formation (Naashoibito Member), dating to the late
  Cretaceous period (late Maastrichtian age, 66 million years ago). The type
  species is Ojoceratops fowleri.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Squamosal enlarged base lacking embayment of otic notch
  - Squamosal forms 115° angle at epijugal 1 position
  - Squamosal distal end truncated and squared off
  - Squamosal medial border concave, lateral border convex forming 80° arc
  - Parietal median bar expands laterally to ~90 mm with ovoid depressions on
    lateral wings
appearance:
  integument: scaled
  evidence: inferred
