genus: Ojoceratops
parent: Triceratopsini
etymology: Ojo Alamo horned face
description: Ojoceratops is a genus of ceratopsian dinosaur which lived in what
  is now New Mexico, United States. Ojoceratops fossils have been recovered from
  strata of the Ojo Alamo Formation (Naashoibito Member), dating to the late
  Cretaceous period (late Maastrichtian age, 66 million years ago). The type
  species is Ojoceratops fowleri.
diet: herbivore
locomotion: quadrupedal
