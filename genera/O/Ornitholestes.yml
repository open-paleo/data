references:
  - id: osborn1903a
  - id: ostrom1980a
    notes: Compares the type material of the two genera and concludes they are
      distinct rather than synonymous.
  - id: carpenter2005b
    notes: Redescribes both genera as distinct taxa and refers the isolated
      manus previously attributed to Ornitholestes (AMNH 587) to Tanycolagreus.
  - id: hartman2019a
    notes: Paravian phylogeny recovering Ornitholestes near the base of Maniraptoromorpha.
  - id: chapelle2021a
    notes: Proposed Ornitholestes as the basalmost oviraptorosaurian based on skull CT description
