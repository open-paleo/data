genus: Ornitholestes
parent: Coelurosauria
placement: incertae sedis
dispute:
  summary: >
    The placement of Ornitholestes is unsettled. Most modern analyses recover it
    at or near the base of Maniraptoromorpha (Hartman et al., 2019), and it has
    also been proposed as the basalmost oviraptorosaurian (Chapelle et al.,
    2021). It is not a compsognathid. It is placed conservatively at Coelurosauria
    incertae sedis pending resolution.
  history:
    - date: "2026-07-01"
      note: Moved from Compsognathidae to Coelurosauria incertae sedis (least-inclusive uncontested clade); basal maniraptoromorph per Hartman et al. (2019) and Jones et al. (2026), basalmost oviraptorosaurian per Chapelle et al. (2021).
pronunciation:
  phonetic: or-NITH-o-LES-teez
etymology: From Ancient Greek 'ornis' (bird) and 'lestes' (robber); meaning 'bird robber'.
description: Ornitholestes is a small theropod dinosaur of the late Jurassic
  (Brushy Basin Member of the Morrison Formation, middle Kimmeridgian age, about
  154 million years ago) of Western Laurasia (the area that was to become North
  America).
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Distal caudal vertebrae deep and ventrally bifurcated
  - Pubis bowed, with the distal end directed posteroventrally
  - Pubic apron lacking a pubic fenestra
  - Ischium with a broad obturator notch and a triangular obturator process
appearance:
  integument: unknown
identifiers:
  - source: pbdb
    id: "38529"
  - source: wikidata
    id: Q14449
  - source: gbif
    id: "4822581"
species:
  - name: Ornitholestes hermanni
    etymology: "Named for Adam Hermann, the head preparator at the American Museum
      of Natural History, who directed the restoration and mounting of the
      skeleton."
    status: valid
    type_species: true
    period:
      name:
        - Late Jurassic
      stage:
        - Kimmeridgian
        - Tithonian
      from_ma: 154.8
      to_ma: 145
    location:
      country: US
      locality: Bone Cabin Quarry
      region: US-WY
      formation: Morrison
      coordinates:
        - 42.017776
        - -106.048615
    type_specimen:
      specimen_id: [ AMNH 619 ]
      specimen_type: holotype
      institution: AMNH
      material: Skull with both mandibles; 45 vertebrae (3 cervicals, 11 dorsals,
        4 sacrals, 27 caudals); both ischia, left ilium, and both pubes (distal
