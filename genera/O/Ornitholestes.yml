genus: Ornitholestes
parent: Compsognathidae
pronunciation:
  phonetic: or-NITH-o-LES-teez
etymology: From Ancient Greek 'ornis' (bird) and 'lestes' (robber); meaning 'bird robber'.
description: Ornitholestes is a small theropod dinosaur of the late Jurassic
  (Brushy Basin Member of the Morrison Formation, middle Kimmeridgian age, about
  154 million years ago) of Western Laurasia (the area that was to become North
  America).
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Narrowing of manus with greatly elongated metapodials and phalanges of
    second digit (0.172 m)
  - Prehensile anterior teeth, more delicate than in Coelurus
  - Extreme lightness of skeleton
  - Cursorial hind limb structure
  - Large orbits bounded posteriorly by fused postorbital and frontal
  - Four primary sacral ribs in sacrum, differing from Aristosuchus
