genus: Ozraptor
parent: Theropoda
dispute:
  summary: >
    Ozraptor subotaii is a possible nomen dubium known only from a distal
    tibia; it was described as Theropoda incertae sedis (Long and Molnar,
    1998), later suggested to be an abelisauroid, a referral its proposer
    subsequently withdrew.
  history:
    - date: "2026-06-30"
      note: >
        Placed at Theropoda incertae sedis.
pronunciation:
  phonetic: oz-RAP-tor
etymology: From "Oz", informal name for Australia, combined with Latin raptor
  (thief); meaning "Australian thief".
description: Ozraptor is a genus of possibly abelisauroid theropod dinosaur from
  the Middle Jurassic (Bajocian) Colalura Sandstone of Australia, known from
  fragmentary remains.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - High, rectangular astragalar facet on distal tibia (unique among theropods)
  - Dorsal margin of astragalar facet straight rather than triangular (unlike
    all other theropods)
  - Distinct vertical ridge extending centrally on astragalar facet
  - Facet depressed into shaft anteriorly; weakly developed medial malleolus
appearance:
  integument: scaled
  evidence: inferred
