notable_specimens:
  - specimen_id:
      - TMP 2009.110.0001
      - TMP 2008.070.0001
      - TMP 1995.110.0001
    institution: TMP
    category: exceptional-preservation
    significance: "Three feathered skeletons across growth stages: a roughly
      one-year-old juvenile (TMP 2009.110.0001) and an adult (TMP 2008.070.0001) with
      body filaments, plus an adult (TMP 1995.110.0001) with pennaceous wing-like
      forelimb feathers. Only adults bore the wings, suggesting they evolved for
      display."
    references:
      - zelenitsky2012a
  - specimen_id:
      - UALVP 52531
    institution: UALVP
    category: exceptional-preservation
    significance: A densely feathered specimen from the lower Dinosaur Park
      Formation, the first Ornithomimus to preserve tail feathers, which
      resembled an ostrich's in structure and distribution. Skin impressions
      show bare skin from mid-thigh to the feet and a flap of skin connecting
      the upper thigh to the torso.
    references:
      - vanderreest2016a
