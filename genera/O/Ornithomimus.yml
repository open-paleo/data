genus: Ornithomimus
parent: Ornithomimidae
pronunciation:
  ipa: /ˌɔːrnɪθəˈmaɪməs, -θoʊ-/
etymology: "From Greek ornitho- (ὄρνις/ὀρνίθ-, 'bird') and mimos (μῖμος, 'mimic' or 'imitator'), meaning 'bird mimic'"
description: "Ornithomimus is a genus of ornithomimid theropod dinosaurs from
  the Campanian and Maastrichtian ages of the Late Cretaceous in western North
  America. Ornithomimus was a swift, bipedal dinosaur which was covered in
  feathers and equipped with a small toothless beak that may indicate an
  omnivorous diet. It is usually classified into two species: the type species,
  Ornithomimus velox, and a referred species, Ornithomimus edmontonicus."
