genus: Ornithomimus
parent: Ornithomimidae
pronunciation:
  phonetic: or-NITH-o-MIEM-us
  ipa: /ˌɔːrnɪθəˈmaɪməs, -θoʊ-/
etymology: "From Greek ornitho- (ὄρνις/ὀρνίθ-, 'bird') and mimos (μῖμος, 'mimic'
  or 'imitator'), meaning 'bird mimic'"
description: "Ornithomimus is a genus of ornithomimid theropod dinosaurs from
  the Campanian and Maastrichtian ages of the Late Cretaceous in western North
  America. Ornithomimus was a swift, bipedal dinosaur which was covered in
  feathers and equipped with a small toothless beak that may indicate an
  omnivorous diet. It is usually classified into two species: the type species,
  Ornithomimus velox, and a referred species, Ornithomimus edmontonicus."
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
appearance:
  integument: feathered
diagnostic_features:
  - Astragalus with very large ascending process, larger than in any dinosaur
    hitherto known
  - Tibia and larger limb bones hollow with thin walls
  - "Three functional metatarsals: second and fourth increased in size at
    proximal ends and meeting in front; third metatarsal diminished and
    displaced posteriorly as in birds"
  - Metatarsal arrangement corresponds to bird anatomy rather than typical
    dinosaur pattern
