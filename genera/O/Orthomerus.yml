genus: Orthomerus
parent: Hadrosauridae
pronunciation:
  phonetic: or-THOM-er-us
etymology: From Greek 'orthos' (straight) and 'meros' (thigh);
  meaning 'straight femur', in reference to the remarkably
  straight femur shaft of the type material. The specific
  epithet 'dolloi' honors Belgian paleontologist Louis Dollo,
  who identified the bones in 1882 during a visit to London.
description: >
  Orthomerus is a genus of dubious hadrosaurid dinosaur from
  the Late Cretaceous of the Netherlands. It is today an
  obscure genus, but in the past was conflated with the much
  better known Telmatosaurus.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - marine
diagnostic_features:
  - Femur shaft remarkably straight and strong, subtriangular at proximal end
    and subquadrate but wider than thick in lower shaft
  - Lateral trochanter positioned in middle of femoral shaft, nearly 14 cm long,
    compressed and curved, directed mainly backward and slightly inward
  - Distal femoral condyles separated by deep concave channel posteriorly and a
    nearly circular anterior canal that expands obliquely on distal surface
  - Tibia markedly more slender than Iguanodon, distal end flattened anteriorly
    with ill-defined fibular area almost in the same plane as remainder of
    distal end
  - Tibia proximal end nearly at right angles to distal end with no appreciable
    increase in width proximally, terminating in two small convex condylar
    surfaces externally
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "38780"
  - source: wikidata
    id: Q1577291
synonyms:
  - name: Protrachodon
    type: nomen nudum
    reason: Informal name attributed to Nopcsa, evidently
      back-formed from his family-level usage. Olshevsky (1991)
      lists Protrachodontidae (Flower, 1928) and Protrachodontinae
      (Abel, 1919) as family-rank synonyms of Hadrosauridae but
      gives no genus-level Protrachodon entry. Olshevsky (1999,
      personal communication) treated Protrachodon as a synonym of
      Orthomerus.
species:
  - name: Orthomerus dolloi
    etymology: Honors Belgian paleontologist Louis Dollo, who
      identified the bones in August 1882 during a visit to
      London.
    status: nomen dubium
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Maastrichtian
      from_ma: 67.0
      to_ma: 66.0
    location:
      country: NL
      region: Sint-Pietersberg quarries near Maastricht, Limburg
      formation: Maastricht Formation
    holotype:
      specimen_id:
        - NHMUK R 42955
      specimen_type: lectotype
      institution: BMNH
      material: Right femur (~500 mm proximodistal length).
      completeness: fragmentary
    erected_in: seeley1883
    synonyms:
      - name: Telmatosaurus dolloi
        type: reassigned
        reason: Historical reassignment of Orthomerus dolloi to
          Telmatosaurus by Steel (1969) on the basis of femoral
          structure, and the Mulder (1984) renaming of O. dolloi
          as Telmatosaurus dolloi. Modern revisers (Ulansky 2015,
          Madzia et al. 2020) reject the synonymy because the
          O. dolloi material is too fragmentary (and juvenile)
          to be confidently referred.
references:
  - id: seeley1883
    authors: Seeley, H. G.
    year: 1883
    title: On the Dinosaurs from the Maastricht Beds
    journal: Quarterly Journal of the Geological Society of London
    volume: "39"
    issue: "1-4"
    pages: 246-253
    publisher: Geological Society of London
    doi: 10.1144/gsl.jgs.1883.039.01-04.19
    url: http://dx.doi.org/10.1144/gsl.jgs.1883.039.01-04.19
    notes: Original description of Orthomerus dolloi on hindlimb
      material from the van Breda collection; placed by Seeley
      in Iguanodontia close to Iguanodon and Hadrosaurus.
  - id: olshevsky1991
    authors: Olshevsky, G.
    year: 1991
    title: A Revision of the Parainfraclass Archosauria Cope,
      1869, Excluding the Advanced Crocodylia
    journal: Mesozoic Meanderings
    volume: "2"
    pages: 1-196
    notes: Designates Orthomerus Seeley, 1883 as nomen dubium;
      lists Telmatosaurus dolloi as historical reassignment and
      ?O. weberi (later split into Riabininohadros) as second
      species.
  - id: ulansky2015
    authors: Ulansky, R. E.
    year: 2015
    title: Riabininohadros, novyy rod dlya gadrozavra iz maastrikhta Kryma
      Rossiya [Riabininohadros, a new genus for hadrosaur from Maastrichtian of
      Crimea, Russia]
    journal: Dinologia
    pages: 1-10
    notes: Splits Orthomerus weberi Riabinin, 1945 into the new
      genus Riabininohadros; rejects Steel (1969)
      Orthomerus–Telmatosaurus synonymy.
  - id: madzia2020
    authors: Madzia, D.; Jagt, J. W. M.; Mulder, E. W. A.
    year: 2020
    title: "Osteology, phylogenetic affinities and taxonomic
      status of the enigmatic late Maastrichtian ornithopod
      taxon Orthomerus dolloi (Dinosauria, Ornithischia)"
    journal: Cretaceous Research
    volume: "108"
    pages: "104334"
    doi: 10.1016/j.cretres.2019.104334
    url: http://dx.doi.org/10.1016/j.cretres.2019.104334
    notes: Designates NHMUK R 42955 (right femur) as lectotype
      of Orthomerus dolloi; treats the taxon as nomen dubium and
      recovers it as basal Hadrosauroidea, outside Hadrosauridae.
