genus: Ornithodesmus
parent: Dromaeosauridae
etymology: From Greek 'ornis' (bird) and 'desmos' (link or bond); meaning 'bird
  link'.
description: Ornithodesmus is a genus of small, dromaeosaurid dinosaur from the
  Isle of Wight in England, dating to about 125 million years ago. The name,
  along with that of the type and only species, O. cluniculus, was originally
  assigned to a bird-like sacrum (a series of vertebrae fused to the hip bones),
  initially believed to come from a bird and subsequently identified as a
  pterosaur. More complete pterosaur remains were later assigned to
  Ornithodesmus. More recently, a detailed analysis determined that the original
  specimen in fact came from a small theropod, specifically a dromaeosaur,
  making it one of the first dromaeosaurs known to science. All pterosaurian
  material previously assigned to this genus has been renamed Istiodactylus.
dispute:
  summary: >
    Originally described as a bird (Seeley, 1887) and long treated as a pterosaur,
    the holotype sacrum was reidentified as a small theropod by Howse and Milner
    (1993), who referred it to Theropoda (as a troodontid) and regarded the genus
    as a nomen vanum given the limited material. Later analyses placed it in
    Dromaeosauridae (Naish and Martill, 2007) and among unenlagiine dromaeosaurids
    (Hartman et al., 2019). Its validity and precise placement remain debated.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - All six sacral vertebrae fully ankylosed at a sacrum length of under 100 mm
  - Sixth sacral centrum shorter than fifth sacral centrum
  - Pneumatic foramina present on the lateral walls of the first two sacral
    centra
  - Ventral surface of sacrals 2-5 broadly flattened with a pronounced medial
    groove running posteriorly from sacral 2 to the posterior rim of sacral 6
  - "Neural platform present: horizontal laminar extensions from bases of neural
    arches fuse with sacral diapophyses to form a continuous lateral sheet of
    bone on each side"
