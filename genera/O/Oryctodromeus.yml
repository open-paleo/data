genus: Oryctodromeus
parent: Orodrominae
etymology: "From Ancient Greek 'oruktēs' meaning 'digger' and 'dromaios' meaning 'runner'; translates as 'digging runner', reflecting its unique status as the first non-avian dinosaur with evidence of burrowing behavior."
description: Oryctodromeus is an extinct genus of small orodromine thescelosaurid
  dinosaur. Fossils are known from the Late Cretaceous Blackleaf Formation of
  southwestern Montana and the Wayan Formation of southeastern Idaho, USA, both
  of the Cenomanian stage, roughly 105-96 million years ago. A member of the
  small, presumably fast-running herbivorous family Thescelosauridae,
  Oryctodromeus is the first non-avian dinosaur published that shows evidence of
  burrowing behavior.
diet: herbivore
locomotion: bipedal
