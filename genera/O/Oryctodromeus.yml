genus: Oryctodromeus
parent: Orodrominae
etymology: "From Ancient Greek 'oruktēs' meaning 'digger' and 'dromaios' meaning
  'runner'; translates as 'digging runner', reflecting its unique status as the
  first non-avian dinosaur with evidence of burrowing behavior."
description: Oryctodromeus is an extinct genus of small orodromine
  thescelosaurid dinosaur. Fossils are known from the Late Cretaceous Blackleaf
  Formation of southwestern Montana and the Wayan Formation of southeastern
  Idaho, USA, both of the Cenomanian stage, roughly 105-96 million years ago. A
  member of the small, presumably fast-running herbivorous family
  Thescelosauridae, Oryctodromeus is the first non-avian dinosaur published that
  shows evidence of burrowing behavior.
dispute:
  summary: >
    Oryctodromeus is recovered within Orodrominae by most analyses (Brown
    and others, 2013; Boyd, 2015; Barta and Norell, 2021) and by Jones
    (2026). Avrahami and others (2024) instead recover it, with Fona,
    within Thescelosaurinae.
  history:
    - date: "2026-06-29"
      note: Placed at Orodrominae following the prevailing view (P3); the Thescelosaurinae alternative of Avrahami and others (2024) is recorded.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Long paraoccipital processes indicating skull with relatively broad
    proportions
  - Basioccipital with steeply sided ventral box rostral to occipital condyle
  - Sacrum incorporating seven vertebrae including two posterior dorsals
  - Large scapula with sharply angled narrow acromion bearing thin-edged
    laterally projecting spine
  - Distinct posterior bend to scapular blade
  - Ilium with very short pre-acetabular and long post-acetabular portions
  - Brevis shelf sloping mediolaterally, visible laterally throughout length
  - Long prepubic process with transversely broad proximal portion and elongate
    ventral fossa
