genus: Orodromeus
parent: Orodrominae
pronunciation:
  phonetic: OR-o-DROHM-ee-us
etymology: From Greek 'oros' (mountain) and 'dromeus' (runner); meaning 'Mountain Runner', referring to the Egg Mountain site where it was discovered and its cursorial habits.
description: Orodromeus is a genus of herbivorous orodromine thescelosaurid
  dinosaur from the Late Cretaceous of North America. Only one species is known,
  the type species Orodromeus makelai.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Palpebral anchored to the postorbital part of the posterior margin of orbit
  - Lateral boss on the jugal
  - Maxillary and dentary teeth broadly triangular in lateral view, often as
    wide as they are high
  - Rounded apical ridge subequally dividing anterior and posterior region of
    the crown
  - Anterior and posterior edges of crown bear five to six uniformly-sized
    denticles in adult
  - Radiale, intermedium, and ulnare plus one distal carpal form unfused wrist
appearance:
  features:
    - cranial bosses
    - keratinous beak
  integument: scaled
  evidence: inferred
