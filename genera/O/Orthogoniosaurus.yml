genus: Orthogoniosaurus
parent: Ceratosauria
placement: incertae sedis
dispute:
  summary: >
    Orthogoniosaurus is founded on a single incomplete tooth and is widely
    regarded as a nomen dubium; it has been considered possibly ceratosaurian,
    but it cannot be placed more precisely.
  history:
    - date: "2026-06-30"
      note: >
        Retained at Ceratosauria incertae sedis as a nomen dubium.
etymology: From Greek 'orthos' (straight), 'gonia' (angle), and 'sauros'
  (lizard); meaning 'straight angled lizard', referring to the straight
  posterior edge of its type tooth.
pronunciation:
  phonetic: OR-tho-GOH-nee-o-SOR-us
description: Orthogoniosaurus is a dubious genus of theropod dinosaur from the
  Late Cretaceous (late Maastrichtian) Lameta Formation of Jabalpur, India. It
  is based on one small, fragmentary tooth, with the preserved section measuring
  2.7 cm (1.1 in) long.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
appearance:
  integument: scaled
  evidence: inferred
