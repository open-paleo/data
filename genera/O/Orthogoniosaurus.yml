genus: Orthogoniosaurus
parent: Theropoda
placement: incertae sedis
etymology: From Greek 'orthos' (straight), 'gonia' (angle), and 'sauros'
  (lizard); meaning 'straight angled lizard', referring to the straight
  posterior edge of its type tooth.
pronunciation:
  phonetic: OR-tho-GOH-nee-o-SOR-us
description: Orthogoniosaurus is a dubious genus of theropod dinosaur from the
  Late Cretaceous (late Maastrichtian) Lameta Formation of Jabalpur, India. It
  is based on one small, fragmentary tooth, with the preserved section measuring
  2.7 cm (1.1 in) long.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "57440"
  - source: wikidata
    id: Q18578292
  - source: gbif
    id: "4822663"
species:
  - name: Orthogoniosaurus matleyi
    etymology: "Named in honor of Charles Alfred Matley, a British geologist who
      discovered the fossil material in the Lameta Formation of Jabalpur, India,
      between 1917 and 1919."
    status: nomen dubium
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Maastrichtian
    location:
      country: IN
      locality: Jubbulpore Cantonment
      region: IN-MP
      formation: Lameta
      bed: Sauropod Bed
    type_specimen:
      specimen_type: holotype
      institution: GSI
      status: uncatalogued
      material: Single unnamed tooth
      completeness: fragmentary
    erected_in: das-gupta1930a
references:
  - id: das-gupta1930a
  - id: walker1964a
    notes: Considers Orthogoniosaurus indeterminable, being founded on an
      isolated tooth.
  - id: molnar1990b
    notes: Finds the tooth possibly from another Jabalpur theropod but not
      demonstrably carnosaurian.
  - id: chure2000a
    notes: Places Orthogoniosaurus at Theropoda incertae sedis and excludes it
      from Allosauridae.
