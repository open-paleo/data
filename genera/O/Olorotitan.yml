genus: Olorotitan
parent: Lambeosaurinae
etymology: From Latin olor ('swan'), referencing the swan-like elongated neck and crest of this hadrosaur, combined with Greek Titan (a giant); meaning 'giant swan'
pronunciation:
  phonetic: o-LO-ro-TIE-tuhn
description: Olorotitan is a monotypic genus of lambeosaurine duck-billed
  dinosaur, containing a single species, O. arharensis. It was among the last
  non-avian dinosaurs to go extinct during the Cretaceous-Paleogene extinction
  event, having lived from the middle to late Maastrichtian age of the Late
  Cretaceous period. The remains were found in the Udurchukan Formation beds of
  Kundur, Arkharinsky District, Amur Oblast, Eastern Russia, in the vicinity of
  the Amur River.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
diagnostic_features:
  - Helmet-shaped hollow crest with lateral premaxillary process extending
    caudally well beyond occiput
  - Postorbital process of jugal extremely high (ratio height/length = 0.9)
  - Neck remarkably elongated with 18 cervical vertebrae (maximum 15 previously
    reported in hadrosaurids)
  - Sacrum very elongated with 15-16 vertebrae (vs. typical 10-12 in adult
    hadrosaurids)
  - Scapula more elongated than other hadrosaurids with length/width ratio of 6.2
  - Additional articulation between adjacent neural spines on proximal third of
    tail (knob-cup articulation)
