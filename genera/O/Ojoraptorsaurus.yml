genus: Ojoraptorsaurus
parent: Caenagnathidae
etymology: Combines a reference to the Ojo Alamo Formation (where it was found)
  with Latin raptor ('plunderer') and Latinised Greek sauros ('lizard'); meaning
  'Ojo Alamo plunderer lizard'
pronunciation:
  phonetic: o-jo-RAP-tuh-SOR-us
description: Ojoraptorsaurus is a dubious genus of oviraptorosaurian dinosaur
  from the late Cretaceous. Ojoraptorsaurus is only known from pubic bones found
  at the Naashoibito Member of the Ojo Alamo Formation dating to the late
  Maastrichtian, about 66 million years ago. It was first named by Robert M.
  Sullivan, Steven E. Jasinski and Mark P.A. van Tomme in 2011 and the type
  species is Ojoraptorsaurus boerei. The generic name combines a reference to
  the formation with a Latin raptor, "plunderer", and a Latinised Greek saurus,
  "lizard". The specific name honors oceanographer Arjan Boeré who found the
  specimen.
dispute:
  summary: >
    Ojoraptorsaurus is a caenagnathid but its validity is contested. It was named
    from a pair of fused pubes, and Funston and Williamson (2024) reassessed its
    proposed diagnostic features as non-autapomorphic in light of newer pelvic
    material, concluding that it should be regarded as a nomen dubium. The
    Princeton Encyclopedia (Jones, 2026) still treats it as valid.
  history:
    - date: "2026-07-01"
      note: >
        Placed at Caenagnathidae; its validity is disputed, having been argued to
        be a nomen dubium by Funston and Williamson (2024).
diet: omnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Spoon-shaped depression on anterior dorsal surface of pubic boot
  - Enclosed pubic fossa recessed ≥1 cm from acetabular rim on medial shaft
    surface
  - Distal pubic shaft above boot slightly convex anteriorly
  - Iliac peduncle articular surface sub-trapezoidal in shape
