genus: Oceanotitan
parent: Titanosauriformes
etymology: ocean giant
description: Oceanotitan is a genus of sauropod dinosaur known from the Upper
  Jurassic (latest Kimmeridgian stage, about 149 million years ago) Lourinhã
  Formation of Portugal. It is represented by a single specimen consisting of
  several tail vertebrae and appendicular bones. It contains one species,
  Oceanotitan dantasi. Oceanotitan is classified as possibly one of the earliest
  members of the Somphospondyli, a group of sauropods that includes the
  titanosaurs.
diet: herbivore
