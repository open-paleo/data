genus: Oceanotitan
parent: Macronaria
placement: incertae sedis
dispute:
  summary: >
    Oceanotitan is a macronarian whose placement varies between analyses.
    Its describers recovered it as the earliest-branching somphospondylan on
    one matrix and in a polytomy at the base of Titanosauriformes on another
    (Mocho and colleagues, 2019); Mocho and colleagues (2023) recover it
    outside Titanosauriformes, as the sister of Aragosaurus, under implied
    weights, and Mannion and Carvalho (2026) regard it as a
    non-titanosauriform macronarian.
etymology: "From Latin 'oceanus' meaning 'ocean', because the fossil was found at the base of a coastal cliff overlooking the Atlantic Ocean, combined with 'Titan' from Greek mythology meaning 'giant'."
pronunciation:
  phonetic: OH-see-AH-no-TIE-tan
description: Oceanotitan is a genus of sauropod dinosaur known from the Upper
  Jurassic (latest Kimmeridgian stage, about 149 million years ago) Lourinhã
  Formation of Portugal. It is represented by a single specimen consisting of
  several tail vertebrae and appendicular bones. It contains one species,
  Oceanotitan dantasi. Oceanotitan is classified as possibly one of the earliest
  members of the Somphospondyli, a group of sauropods that includes the
  titanosaurs.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - coastal
diagnostic_features:
  - Sagittal groove on dorsal surface of anterior-most caudal vertebral neural
    spines
  - Lateral depressions on distal tips of anterior to middle caudal neural
    spines, dorsally connected posteriorly
  - Anterior caudal vertebrae with medial accessory articulation on
    prezygapophysis
  - Transverse furrow on chevron articulations
  - Circular, rough tuberosity on medial surface of scapula
  - Elliptical concavity on ventral face of scapular blade near acromion
  - Ischium shorter than pubis
  - Robust fourth trochanter on midline of femoral posterior face
  - Distal condyles of femur expanded onto anterior portion of shaft
  - Rectangular morphology of fibular proximal end
appearance:
  integument: scaled
  evidence: inferred
