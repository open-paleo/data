genus: Oblitosaurus
parent: Dryomorpha
placement: incertae sedis
dispute:
  summary: >
    The position of Oblitosaurus bunnueli is unresolved. Its describers
    recovered it as the basalmost member of Ankylopollexia together with
    Draconyx loureiroi (Sánchez-Fenollosa and others, 2023), a pairing also
    recovered by Dieudonné and others (2026) among the early-diverging
    ankylopollexians. Fonseca and others (2024) instead recover it as a
    constituent of Dryomorpha outside Ankylopollexia, while Rotatori and
    others (2026) place it more deeply, within Styracosterna. It is placed at
    Dryomorpha incertae sedis, the least inclusive clade common to every
    hypothesis.
  history:
    - date: "2026-08-07"
      note: Moved from Ankylopollexia to Dryomorpha incertae sedis; recovered
        positions span from outside Ankylopollexia to within Styracosterna.
etymology: From Latin 'oblitus' (forgotten or obsolete) and Greek 'sauros' (lizard); meaning 'forgotten lizard', referring to how its fossils were long overlooked.
pronunciation:
  phonetic: ob-LEE-tow-SOR-us
description: Oblitosaurus is a genus of iguanodontian ornithopod dinosaur from
  the Late Jurassic Villar del Arzobispo Formation of Spain. The type species is
  Oblitosaurus bunnueli.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - coastal
diagnostic_features:
  - Femur with wide, robust lesser trochanter that almost covers lateral surface
    of greater trochanter
  - Femur with sub-circular distal medial condyle
  - Femur with pronounced, narrow lateromedial ridge on ventral surface
  - Tibia with internal condyle projected dorsally above dorsal margin of
    cnemial crest
  - Metatarsal IV with sub-triangular or ellipsoid proximal articulation facet
