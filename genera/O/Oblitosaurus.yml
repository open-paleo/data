genus: Oblitosaurus
parent: Ankylopollexia
etymology: From Latin 'oblitus' (forgotten or obsolete) and Greek 'sauros' (lizard); meaning 'forgotten lizard', referring to how its fossils were long overlooked.
pronunciation:
  phonetic: ob-LEE-tow-SOR-us
description: Oblitosaurus is a genus of ankylopollexian ornithopod dinosaur from
  the Late Jurassic Villar del Arzobispo Formation of Spain. The type species is
  Oblitosaurus bunnueli.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - coastal
diagnostic_features:
  - Femur with wide, robust lesser trochanter that almost covers lateral surface
    of greater trochanter
  - Femur with sub-circular distal medial condyle
  - Femur with pronounced, narrow lateromedial ridge on ventral surface
  - Tibia with internal condyle projected dorsally above dorsal margin of
    cnemial crest
  - Metatarsal IV with sub-triangular or ellipsoid proximal articulation facet
appearance:
  integument: scaled
  evidence: inferred
