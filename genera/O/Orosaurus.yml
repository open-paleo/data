genus: Orosaurus
parent: Sauropodomorpha
pronunciation:
  phonetic: OR-o-SAWR-us
etymology: From Greek 'oros' (mountain) and 'sauros' (lizard); meaning 'mountain lizard'.
description: Orosaurus is a dubious genus of basal sauropodomorph dinosaur from
  the Late Triassic of South Africa, containing a single species, O. capensis.
dispute:
  summary: >
    Orosaurus capensis is a nomen dubium based on fragmentary Late
    Triassic material from southern Africa, historically synonymized with
    Euskelosaurus.
  history:
    - date: "2026-06-29"
      note: Placed at Sauropodomorpha incertae sedis; fragmentary nomen dubium.
locomotion: bipedal
paleoenvironment:
  - fluvial
  - arid
diet: herbivore
diagnostic_features:
  - Distal femur with peculiar form distinguishing it from Euskelesaurus
  - Broad but well-marked groove between condyles in front
  - Outer condyle narrower than inner condyle with stout projecting ridge
    extending up shaft
  - Deep groove separating inner and outer condyles
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "56600"
  - source: wikidata
    id: Q6053289
  - source: gbif
    id: "4823007"
synonyms:
  - name: Orinosaurus
    type: junior objective
    reason: Coined by Lydekker (1889) as a replacement name when Orosaurus was incorrectly believed to be preoccupied; Orosaurus retains priority.
species:
  - name: Orosaurus capensis
    etymology: "Named for the Cape region of South Africa, where the holotype was discovered."
    status: valid
    type_species: true
    period:
      name:
        - Late Triassic
      stage:
        - Norian
        - Rhaetian
      from_ma: 227
      to_ma: 201.4
    location:
      country: ZA
      region: Eastern Cape
      formation: Elliot
      coordinates:
        - -30.950001
        - 26.616667
    erected_in: huxley1867b
    holotype:
      specimen_id: [NHMUK R1626]
      specimen_type: holotype
      institution: NHMUK
      material: Vertebrae
      completeness: fragmentary
references:
  - id: huxley1867b
  - id: lydekker1889a
    notes: Discussed Orosaurus capensis in a nomenclatural note.
