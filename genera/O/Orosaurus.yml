genus: Orosaurus
parent: Sauropodomorpha
placement: incertae sedis
pronunciation:
  phonetic: OR-o-SAWR-us
etymology: From Greek 'oros' (mountain) and 'sauros' (lizard); meaning 'mountain lizard'.
description: Orosaurus is a dubious genus of basal sauropodomorph dinosaur from
  the Late Triassic of South Africa, containing a single species, O. capensis.
dispute:
  summary: >
    Orosaurus capensis is a nomen dubium based on fragmentary Late
    Triassic material from southern Africa, historically synonymized with
    Euskelosaurus.
  history:
    - date: "2026-06-29"
      note: Placed at Sauropodomorpha incertae sedis; fragmentary nomen dubium.
    - date: "2026-10-08"
      note: Type species set to nomen dubium and diagnostic features removed; no work since Van Heerden (1979) treats the tibia as diagnosable.
locomotion: bipedal
paleoenvironment:
  - fluvial
  - arid
diet: herbivore
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "56600"
  - source: wikidata
    id: Q6053289
  - source: gbif
    id: "4823007"
synonyms:
  - name: Orinosaurus
    type: junior objective
    reason: Coined by Lydekker (1889) as a replacement name when Orosaurus was incorrectly believed to be preoccupied; Orosaurus retains priority.
species:
  - name: Orosaurus capensis
    etymology: "Named for the Cape region of South Africa, where the holotype was discovered."
    status: nomen dubium
    type_species: true
    period:
      name:
        - Late Triassic
      stage:
        - Norian
        - Rhaetian
    location:
      country: ZA
      region: ZA-EC
      locality: Stormberg range of mountains, about thirty miles from the town of Aliwal North
      formation: Elliot
      part: lower
    erected_in: huxley1867b
    type_specimen:
      specimen_id: [NHMUK PV R 1626]
      specimen_type: holotype
      institution: NHMUK
      material: Vertebrae
      completeness: fragmentary
references:
  - id: huxley1867b
  - id: lydekker1889c
    notes: Addressed Orosaurus (Orinosaurus) capensis in a note on dinosaurian remains.
  - id: vanheerden1979a
    notes: Finds no diagnostic features in the type and refers it to
      Euskelosaurus as an indeterminate species.
