genus: Omeisaurus
parent: Mamenchisauridae
pronunciation:
  phonetic: UH-may-SAWR-us
etymology: Named after Mount Emei (Omei) in Sichuan Province, China, where it
  was discovered, combined with Greek 'sauros' (lizard); meaning 'Omei lizard'.
description: Omeisaurus is a genus of sauropod dinosaur from the Middle to Late
  Jurassic Period (Bathonian-Oxfordian stage) of what is now China. Its name
  comes from Mount Emei, where it was discovered in the lower Shaximiao
  Formation of Sichuan Province.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Processus pseudospinosus remarkably developed with straight upper border;
    255 mm long wing on neck vertebrae
  - Only 3 primary sacral vertebrae with strongly built sacral ribs and
    plate-like lamellae
  - First caudal vertebra with broad transversal fan-like expansion of caudal rib
  - Coracoid very short and distally rounded with straight scapula border,
    breadth exceeds length
  - Femur head well differentiated with prominent fourth trochanter visible from
    anterior view
  - Fibula with round shaft lacking ridge from proximal to distal end
    characteristic of other sauropods
