  - name: Omeisaurus tianfuensis
    etymology: Named for Tianfu (Land of Abundance), a traditional name for
      Sichuan, the region of the fossil locality.
    status: valid
    type_species: false
    period:
      name:
        - Middle Jurassic
      stage:
        - Bathonian
        - Callovian
      from_ma: 168.3
      to_ma: 163.5
    location:
