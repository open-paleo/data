genus: Ostromia
parent: Anchiornithidae
etymology: Named in honour of John Ostrom, the influential American paleontologist who identified the holotype specimen as an Archaeopteryx
description: Ostromia is a genus of anchiornithid theropod dinosaur containing a
  single species, Ostromia crassipes. Recovered from the Late Jurassic Painten
  Formation of Germany, it was named by Christian Foth and Oliver Rauhut in
  2017.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - marine
  - coastal
diagnostic_features:
  - Longitudinal furrows on both sides of all preserved manual phalanges and at
    least metacarpal III
  - Unusually small first manual ungual relative to metacarpal I (ungual
    I:metacarpal I ratio of 0.9 vs 1.26 in Anchiornis)
  - Relative length of metacarpal III compared to metacarpal I of 2.21 vs 2.46
    in Anchiornis
  - Tibiotarsus to metatarsus length ratio of 1.67 vs 1.93 in Anchiornis
