genus: Osmakasaurus
parent: Ankylopollexia
etymology: From Lakota 'osmaka' (canyon) and Greek 'sauros' (lizard); meaning 'canyon lizard'.
pronunciation:
  phonetic: os-MAH-kuh-SOR-us
description: Osmakasaurus is a genus of iguanodontian dinosaur which lived in
  the Early Cretaceous (Valanginian age) Chilson Member of the Lakota Formation
  in what is now Buffalo Gap of South Dakota, United States. This genus was
  named by Andrew T. McDonald in 2011 and the type species is O. depressus.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Cranial end of preacetabular process of ilium modified into horizontal boot
  - Straight dorsal margin of ilium
  - Dorsal margin of ilium thickens mediolaterally towards the M. iliocaudalis
    platform
appearance:
  integument: scaled
  evidence: inferred
