genus: Osmakasaurus
parent: Iguanodontia
etymology: canyon lizard
description: Osmakasaurus is a genus of iguanodontian dinosaur which lived in
  the Early Cretaceous (Valanginian age) Chilson Member of the Lakota Formation
  in what is now Buffalo Gap of South Dakota, United States. This genus was
  named by Andrew T. McDonald in 2011 and the type species is O. depressus.
