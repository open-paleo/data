genus: Ondogurvel
parent: Parvicursorinae
etymology: "From Mongolian 'ondo' meaning 'egg' and 'gurvel' meaning 'lizard'; translates as 'egg lizard'."
description: Ondogurvel is a genus of alvarezsaurid dinosaur from the Late
  Cretaceous (Campanian) Barun Goyot Formation in southern Mongolia. The type
  and only species is O. alifanovi, known from a partial skeleton consisting of
  fragments of two last dorsal vertebrae, three anterior sacral vertebrae, right
  ilium, left and right pubis and ischium, articulated right tibia, fibula,
  metatarsals II and IV, and phalanges IV-1 and IV-2, right carpometacarpus,
  left and right manual phalanx II-1, right femur, left pedal phalanx II-1, and
  fragments of unidentified phalanges.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - arid
diagnostic_features:
  - Metatarsals II and IV completely fused along their contact area over two
    thirds of their length (autapomorphy)
  - Carpometacarpus with round articular surfaces of metacarpals III and IV
    located along lateral margin
  - Outgrowth of medial facet on extensor side of carpometacarpus almost
    perpendicular to metacarpal II
  - Smaller proximocaudal process on manual phalanx II-1 compared with Mononykus
  - Supraacetabular crest of ilium arcuate and convex dorsally, with anterior
    end placed more ventral than posterior end
  - Vertical ridge on medial side of ischium distal to obturator foramen
  - Lack of fourth trochanter on femur
  - Tibia distal end much less expanded transversely relative to shaft
  - Prominent flat platform ('step') on lateral side of distal lateral tibial
    condyle
appearance:
  integument: feathered
  evidence: direct
