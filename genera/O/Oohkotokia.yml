genus: Oohkotokia
parent: Ankylosaurinae
pronunciation:
  ipa: /ˌoʊ.oʊkəˈtoʊkiə/
  phonetic: OH-oh-kuh-TOH-kee-uh
etymology: "From Blackfoot 'ooh'kotoka' meaning 'large stone' and Latin suffix '-ia' meaning 'derived from', giving the meaning 'child of stone', referring to its extensive body armor; the name also honors the Blackfoot people on whose land the specimen was found."
description: Oohkotokia is a genus of ankylosaurid dinosaur within the subfamily
  Ankylosaurinae. It is known from the upper levels of the Two Medicine
  Formation (late Campanian stage, about 74 Ma ago) of Montana, United States.
  The discovery of Oohkotokia supports that Ankylosaurine dinosaurs existed and
  flourished continuously in Montana and/or Alberta throughout the late
  Campanian and early Maastrichtian stages in the Late Cretaceous period. It was
  a large, heavily built, quadrupedal, herbivore, that could grow up to 5 meters
  (16 ft) long and weigh up to 2 metric tons (2.2 short tons).
dispute:
  summary: >
    The validity of Oohkotokia is contested. Arbour and Currie (2015) treated it as a junior synonym of Scolosaurus cutleri, whereas Penkalski (2018) and Wiersma and Irmis (2018) found it distinct. Retained as a valid ankylosaurine pending consensus.
  history:
    - date: "2026-06-26"
      note: Placed at Ankylosaurinae, kept valid although some analyses synonymize it with Scolosaurus.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Prominent horn-like trihedral squamosal bosses with rounded unkeeled caudal
    apex
  - Small median nasal plate on skull roof undistinguished from surrounding
    osteoderms
  - Broad smooth quadratojugal bosses with strong caudal curvature
  - Small occipital condyle relative to basal skull length
  - Large orbit relative to other Campanian North American ankylosaurids
  - Osteoderms basally excavated with smooth finely pitted external surface
    texture
  - Steeply-pitched triangular lateral caudal osteoderms
appearance:
  features:
    - body armor
    - tail club
    - cranial bosses
  integument: armored
  evidence: direct
