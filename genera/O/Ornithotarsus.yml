genus: Ornithotarsus
parent: Hadrosauridae
placement: incertae sedis
etymology: From Greek 'ornis' (genitive 'ornithos', 'bird') and 'tarsos'
  ('ankle'), for the ankle region of the type hindlimb, in which Cope took the
  astragalus to be fused to the tibia as in birds.
description: Ornithotarsus is a genus of hadrosaurid ornithopod dinosaurs that
  lived in North America during the Late Cretaceous Period, in what is now
  Keyport, on the shores of Raritan Bay in Monmouth County, New Jersey, about
  84 million to 78 million years ago.
diet: herbivore
identifiers:
  - source: pbdb
    id: "63883"
  - source: wikidata
    id: Q3886098
species:
  - name: Ornithotarsus immanis
    status: nomen dubium
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Campanian
    location:
      country: US
      region: US-NJ
      locality: Union, 2½ miles east of Keyport
      formation: Monmouth
    type_specimen:
      specimen_id:
        - YPM 3221
      specimen_type: holotype
      institution: YPM
      material: Articulated left distal tibia, astragalus and calcaneum, with a
        fragment of the distal fibula.
      completeness: fragmentary
      notes: Collected by Samuel Lockwood on the shores of Raritan Bay at
        Keyport. The formation is given four different ways in the literature,
        as Monmouth by White (1973) and Prieto-Marquez and others (2006), as
        Woodbury by Jones and Viola (2026) and as Merchantville elsewhere, so
        none is recorded here. Cope took the beds to be Lower Cretaceous.
    erected_in: cope1869c
references:
  - id: cope1869c
    notes: Erects the genus and species on hindlimb material from Raritan Bay,
      placing it between Hadrosaurus and Compsognathus.
  - id: white1973a
    notes: Gives the type specimen as YPM 3221 and assigns the genus to
      Hadrosauridae.
  - id: brett-surman1989a
    notes: Finds the genus undiagnostic and a nomen dubium, and notes it is not
      synonymous with Parasaurolophus.
  - id: horner2004a
    notes: Treats the species as a synonym of Hadrosaurus foulkii, a reading
      later superseded.
  - id: prieto-márquez2006a
    notes: Redescribes the type, finds it lacks distinguishing characters, and
      refers it only to Hadrosauridae indeterminate.
  - id: jones2026a
    notes: Records the shift from the Hadrosaurus synonymy to nomen dubium.
