genus: Obelignathus
parent: Rhabdodontomorpha
etymology: "Named for Obelix, the fictional character from the Asterix and Obelix cartoon, combined with Greek 'gnathos' meaning 'jaw'; refers to the robust morphology of the holotype dentary likened to the strength of that character."
pronunciation:
  phonetic: ob-uh-lig-nath-us
description: Obelignathus is an extinct genus of rhabdodontomorph ornithopod
  dinosaurs from the Late Cretaceous 'Grès à Reptiles' Formation of France. The
  genus contains a single species, O. septimanicus, known from a right dentary.
  The species was initially classified as a species of the coeval Rhabdodon.
dispute:
  summary: >
    Obelignathus septimanicus (formerly Rhabdodon septimanicus) is
    recovered as an early-diverging rhabdodontomorph under equal weighting
    and most implied-weighting analyses, but as an elasmarian under one
    implied-weighting setting, by Czepiński and Madzia (2025); its
    position is unstable.
  history:
    - date: "2026-06-29"
      note: Placed at Rhabdodontomorpha following the majority result of
        Czepiński and Madzia (2025); the elasmarian alternative
        (recovered under one implied-weighting setting) reflected, not
        adopted.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Dentary robust, anteroposteriorly shorter (~3x longer than high) compared to
    other rhabdodontomorphs (~4x)
  - Absence of buccal platform lateral to alveolar row
  - Absence of horizontal buccal crest due to poorly developed anterolateral
    ridge of coronoid process
  - Coronoid process placed directly posterior to alveolar row, not laterally
    separated
  - Coronoid process rotated lateroposteriorly; lateral and coronoid surfaces
    face more posteriorly and anteriorly respectively
  - Meckelian canal mediolaterally and dorsoventrally deep, reaching 50% of
    dentary height (vs. 22-38% in other rhabdodontomorphs)
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "509330"
  - source: wikidata
    id: Q134286469
