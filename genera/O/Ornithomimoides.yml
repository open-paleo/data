genus: Ornithomimoides
parent: Abelisauroidea
dispute:
  summary: >
    Ornithomimoides is based on isolated vertebrae and is generally treated
    as a nomen dubium; reviews suggest an abelisauroid affinity, and a
    synonymy with Coeluroides has been proposed.
  history:
    - date: "2026-06-30"
      note: >
        Placed at Abelisauroidea incertae sedis (P2).
pronunciation:
  phonetic: or-NITH-o-mie-MOI-deez
etymology: From Greek 'ornis' (bird), 'mimos' (mimic), and '-oides'
  (resembling); meaning 'bird mimic-like', indicating resemblance to
  ornithomimosaurs.
description: Ornithomimoides is a dubious genus of theropod dinosaur from the
  Late Cretaceous (Maastrichtian) Lameta Formation of India. The type species,
  O. mobilis, and the doubtfully referred O.? barasimlensis were named and
  described by Huene and Matley in 1933, and are known only from isolated
  vertebrae of the Lameta "Carnosaur bed"; O. mobilis is based on five large
  vertebrae and O.? barasimlensis on a smaller set. Novas et al. (2004)
  reinterpreted the type vertebrae as proximal caudals of an indeterminate
  abelisauroid and, finding no diagnostic features, considered the genus a nomen
  dubium.
diet: carnivore
locomotion: bipedal
