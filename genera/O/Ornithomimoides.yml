genus: Ornithomimoides
parent: Abelisauroidea
pronunciation:
  phonetic: or-NITH-o-mie-MOI-deez
etymology: From Greek 'ornis' (bird), 'mimos' (mimic), and '-oides'
  (resembling); meaning 'bird mimic-like', indicating resemblance to
  ornithomimosaurs.
description: Ornithomimoides is a dubious genus of theropod dinosaur, from the
  Late Cretaceous (Maastrichtian stage, sometime between 70 and 66 mya) Lameta
  Formation of India. Two species have been identified, the type species O.
  mobilis and O. barasimlensis, were named by von Huene in 1932 and were
  described by Matley in 1933 though they are known only from isolated
  vertebrae. O. barasimlensis is known from five dorsal vertebrae, and O.
  mobilis from four smaller vertebrae, found at the same location.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Dorsal vertebrae large and elongate, about 9 cm long, not much constricted
    in the middle, amphicoelous
  - Neural arch with very broad diapophysis bearing a rather weak simple
    buttress; moderately deep recess behind the buttress below the diapophysial
    plate
  - Prezygapophysis projects in front beyond the length of the centrum
  - Large and long median depression between and behind the prezygapophyses;
    median recess between postzygapophyses below the dorsal spine
  - Diapophysis ascends obliquely backward; base of dorsal spine spans barely
    half the vertebra length, spine rises steeply upward
  - Vertebrae thin-walled
