genus: Opisthocoelicaudia
parent: Opisthocoelicaudiinae
etymology: From Greek 'opisthen' (behind/posterior), 'koilos' (hollow), Latin
  'cauda' (tail), and Latin '-ia' (suffix); meaning 'hollow-backed tail',
  referring to the opisthocoelouos (posteriorly hollowed) tail vertebrae.
pronunciation:
  phonetic: o-PIS-tho-SEEL-i-CAWD-ee-a
  ipa: /ɒˌpɪsθoʊsɪlɪˈkɔːdiə/
description: Opisthocoelicaudia is a genus of sauropod dinosaur of the Late
  Cretaceous Period discovered in the Gobi Desert of Mongolia. The type species
  is Opisthocoelicaudia skarzynskii. A well-preserved skeleton lacking only the
  head and neck was unearthed in 1965 by Polish and Mongolian scientists, making
  Opisthocoelicaudia one of the best known sauropods from the Late Cretaceous.
  Tooth marks on this skeleton indicate that large carnivorous dinosaurs had fed
  on the carcass and possibly had carried away the now-missing parts. To date,
  only two additional, much less complete specimens are known, including part of
  a shoulder and a fragmentary tail. A relatively small sauropod,
  Opisthocoelicaudia measured about 11.4-13 m (37-43 ft) in length. Like other
  sauropods, it would have been characterized by a small head sitting on a very
  long neck and a barrel shaped trunk carried by four column-like legs. The name
  Opisthocoelicaudia means "posterior cavity tail", alluding to the unusual,
  opisthocoel condition of the anterior tail vertebrae that were concave on
  their posterior sides. This and other skeletal features lead researchers to
  propose that Opisthocoelicaudia was able to rear on its hindlegs.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Caudal centra opisthocoelous in anterior half of tail, unique among
    sauropods for buttressing function
  - Dorsal neural spines divided into two low metapophyses overhanging
    postzygapophyses
  - Tail habitually carried in horizontal position indicated by osteologic
    features of chevrons and caudals
  - Unforked chevrons lacking double-branched distal ends characteristic of
    Diplodocus
  - Ischium forming larger part of acetabular boundary, relatively short (about
    2/3 of pubis length)
  - Astragalus reduced in dimensions, only ossified tarsal element
