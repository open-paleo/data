genus: Owenodon
parent: Dryomorpha
etymology: Named for Richard Owen, the British paleontologist who first
  described the specimen, combined with Greek 'odon' meaning 'tooth'.
description: Owenodon is a genus of iguanodontian dinosaur known from a partial
  lower jaw discovered in Early Cretaceous-aged rocks of Dorset, United Kingdom,
  and possibly also Romania and Spain. The first and only definitive specimen
  was found in the Lulworth Formation of the Purbeck Limestone Group, dating to
  the middle Berriasian stage.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - coastal
  - lacustrine
diagnostic_features:
  - dentary deeper than Camptosaurus relative to length
  - dental margin and tooth row arched
  - longer symphysis than Camptosaurus
  - lingual surface of crowns equally subdivided by simple well-defined primary
    ridge and parallel equal-sized secondary ridge
  - tertiary ridges essentially absent
  - no abbreviated cingulum formed by inrolling of denticulate distal edge of
    lower distal corner of crown
