references:
  - id: owen1874b
    notes: Names the species, conditionally, as Iguanodon Hoggii.
  - id: galton2009a
    notes: Erects the genus for the NHMUK R2998 dentary and places it in an
      unnamed clade between Camptosauridae and Styracosterna.
  - id: norman2012a
    notes: Emends the diagnosis; rejects the dentary-depth and tooth-row-arching
      characters because crushing cannot be ruled out as their cause, and
      regards the genus's status as provisional.
  - id: clements1993a
    notes: Lists the Cherty Freshwater Member as the topmost member of the
      Lulworth Formation.
  - id: jones2026a
    notes: Source of the body length estimate.
  - id: madzia2021a
    notes: Lists Owenodon hoggii in the composition of Styracosterna, under
      the majority-rule tree of Madzia, Jagt and Mulder (2019).
  - id: madzia2019a
    notes: Includes Owenodon hoggii; the strict consensus leaves it in an
      unresolved polytomy within Ankylopollexia, the majority-rule tree (Fig.
      12) within Styracosterna.
  - id: fonseca2024a
    notes: Reports, citing earlier analyses, that Owenodon falls near the root
      of Ankylopollexia or outside it; its own analyses do not include the
      genus.
  - id: herne2019a
    notes: Includes Owenodon hoggii; the implied-weighting strict consensus
      recovers it as the sister of Camptosaurus and Iguanodon within
      Dryomorpha, and the equal-weighting tree leaves it unresolved there.
