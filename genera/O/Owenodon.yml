genus: Owenodon
parent: Dryomorpha
placement: incertae sedis
dispute:
  summary: >
    Owenodon hoggii is known from a single partial dentary, and its position
    among dryomorphs is unstable. Galton (2009) erected the genus for material
    more derived than Camptosaurus, judging that it represents an unnamed clade
    fitting between Camptosauridae and Styracosterna and could tentatively be
    referred to the latter; Galton also referred dentary teeth and several
    bones from Cornet, Romania, to Owenodon sp. Norman (2012) instead regards
    the holotype as a camptosaur-grade iguanodontian. Madzia, Jagt and Mulder
    (2019) recover it within Styracosterna in their majority-rule consensus but
    in an unresolved polytomy within Ankylopollexia in the strict consensus,
    and Madzia and colleagues (2021) list it in Styracosterna on that tree,
    while the implied-weighting analysis of Herne and colleagues (2019)
    recovers it as the sister of Camptosaurus and Iguanodon, outside
    Ankylopollexia. It is placed at Dryomorpha incertae sedis, the least
    inclusive clade common to these hypotheses. The adequacy of the genus's diagnosis is also contested.
    Galton (2009) separated the holotype from Camptosaurus on a dentary that
    is deeper relative to its length, an arched dental margin and tooth row,
    and a longer symphyseal ramus, together with details of the tooth crowns.
    Norman (2012) rejected the first two characters, holding that the severe
    postmortem crushing of the dentary cannot be ruled out as their cause,
    and held the symphysis unmeasurable because that part of the jaw is abraded, leaving
    fine details of the individual tooth crowns as the only distinguishing
    features. On that basis Norman judged the erection of a separate genus a
    matter of opinion resting more on the specimen's stratigraphic and
    geographic separation from Camptosaurus than on the weight of the
    anatomy, called its taxonomic status provisional, and urged the
    collection of more material. That reassessment nonetheless retained the
    binomial and published an emended diagnosis, and later work has continued
    to treat
    Owenodon as a distinct genus (Madzia and colleagues, 2021; Fonseca and colleagues, 2024). It is retained as a valid genus.
  history:
    - date: "2026-08-07"
      note: Moved from Ankylopollexia to Dryomorpha incertae sedis; recovered
        positions span from outside Ankylopollexia to basal Styracosterna.
    - date: "2026-08-07"
      note: Returned to Ankylopollexia incertae sedis. The Dryomorpha move
        rested on secondary readings of a topology that Herne and colleagues (2019)
        do not state in text, and the erecting paper places the genus inside
        Ankylopollexia.
    - date: "2026-08-08"
      note: Validity reviewed and the genus retained. Norman (2012) leaves the
        diagnosis resting on tooth-crown characters alone but proposes neither a
        synonymy nor a nomen dubium, and none of the later works cited follows
        Norman in doubting the genus.
etymology: Named for Richard Owen, the British paleontologist who first
  described the specimen, combined with Greek 'odon' meaning 'tooth'.
pronunciation:
  phonetic: o-wen-o-don
description: Owenodon is a genus of iguanodontian dinosaur known from a partial
  lower jaw discovered in Early Cretaceous-aged rocks of Dorset, United Kingdom,
  and possibly also Romania and Spain. The first and only definitive specimen
  was found in the Durlston Formation of the Purbeck Limestone Group, dating to
  the middle Berriasian stage.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - coastal
  - lacustrine
diagnostic_features:
  - Lingual surface of the tooth crowns equally subdivided by a primary and a
    secondary ridge that are equal in prominence, well-defined, narrow, raised,
    and parallel (potential autapomorphy).
  - Tertiary ridges, originating from the bases of the apical denticles and
    extending over the lingual crown surface, absent (potential autapomorphy).
  - Marginal denticles simple and tongue-shaped, lacking mammillations.
  - Denticulate margin at the distal corner of the crown not inrolled into an
    oblique cingulum bordering a vertical channel along the distal edge of the
    root.
  - Fifteen alveoli, the most posterior curving laterally into the base of the
    coronoid process; coronoid process elevated but obliquely inclined
    posterodorsally and not anteroposteriorly expanded near its apex.
  - No obvious diastema between the predentary-attachment area and the
    tooth-bearing margin of the dentary.
