references:
  - id: galton2009a
    notes: Erects the genus for the NHMUK R2998 dentary and places it in an
      unnamed clade between Camptosauridae and Styracosterna.
  - id: norman2012a
    notes: Emended diagnosis and discussion of the Owenodon holotype NHMUK
      R2998; rejects the dentary-depth and tooth-row-arching characters as
      crushing artifacts and regards the genus's validity as provisional.
  - id: jones2026a
    notes: Source of the body length estimate.
  - id: madzia2021a
    notes: Lists Owenodon hoggii in the composition of Styracosterna.
  - id: fonseca2024a
    notes: Reports that Owenodon falls near the root of Ankylopollexia or
      outside it.
  - id: herne2019a
    notes: Adds Owenodon hoggii as an operational taxonomic unit in a revision
      of small-bodied ornithopods; states no position for it in the text.
