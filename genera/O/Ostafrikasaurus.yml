  - id: rauhut2011a
    notes: Examines the same tooth under its earlier assignment and reports
      little positive evidence for a spinosaurid referral, finding it closer to
      the Tendaguru Ceratosaurus material.
  - id: smyth2020a
    notes: Regards the species a nomen dubium for want of confirmable
      spinosaurid features and notes a plausible case for ceratosaurian
      affinities.
  - id: bandeira2024a
    notes: Calls the Tanzanian occurrence dubious without ruling on the name.
  - id: mannion2019a
    notes: Lists the species among the named Tendaguru theropods.
