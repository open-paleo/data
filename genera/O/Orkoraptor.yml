genus: Orkoraptor
parent: Megaraptoridae
etymology: "From Aoniken 'Orr-Korr', the local name for the La Leona River near the fossil site, combined with Latin 'raptor' meaning 'thief'; translates as 'Toothed River thief'."
description: Orkoraptor is a genus of medium-sized megaraptoran theropod
  dinosaur from the late Cretaceous Period of Argentina. It is known from
  incomplete fossil remains including parts of the skull, teeth, tail vertebrae,
  and a partial tibia. The specialized teeth resemble those of some
  maniraptoriform theropods, namely the deinonychosaurs and compsognathids. This
  and other anatomical features led the authors who described it (Novas,
  Ezcurra, and Lecuona) to suggest that it was a maniraptoran coelurosaur.
  However, subsequent studies found it to be a megaraptoran. Found in the Cerro
  Fortaleza Formation of Southern Patagonia, it is one of the southernmost
  carnivorous dinosaurs known from South America.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Teeth with unserrated and transversely wide mesial margins, lacking
    denticles on mesial margin
  - Median depression flanked by two longitudinal and narrow furrows on lingual
    tooth surface (autapomorphy)
  - Postorbital with wide jugal process and obtuse orbital margin devoid of
    suborbital flange
  - Quadratojugal with short jugal process, lacking strong caudoventral
    projection
  - Proximal caudal vertebrae with small pleurocoels on each side
