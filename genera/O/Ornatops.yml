genus: Ornatops
parent: Brachylophosaurini
pronunciation:
  phonetic: or-NAY-tops
etymology: From Latin 'ornatus' (ornate) and Greek 'ops' (face); meaning 'ornate face'.
description: Ornatops is a genus of brachylophosaurin saurolophine hadrosaur
  from the Late Cretaceous Menefee Formation of New Mexico, United States. The
  genus contains a single species, Ornatops incantatus.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Nasofrontal suture on dorsal surface of frontals is horizontal rostrally and
    elevated caudally, ending in pair of parasagittal bumps
  - Nasofrontal suture extends caudally to cover more than half of dorsal
    surface of frontals in adults
  - Quadrate buttress is a prominent flange well set off from shaft of quadrate
    and dorsal condyle
