genus: Ohmdenosaurus
parent: Sauropoda
pronunciation:
  phonetic: OHM-den-o-SAWR-us
etymology: Named after the village of Ohmden in Baden-Württemberg, Germany, near
  where the specimen was found, combined with Greek sauros meaning 'lizard';
  meaning 'Ohmden lizard'
description: Ohmdenosaurus is a genus of sauropod dinosaur that lived during the
  Early Jurassic epoch in what is now Germany. The only specimen - a tibia
  (shinbone) and ankle - was discovered in rocks of the Posidonia Shale near the
  village of Ohmden. The specimen, which was originally identified as a
  plesiosaur, is exhibited in a local museum, the Urweltmuseum Hauff. In the
  1970s, it caught the attention of German paleontologist Rupert Wild, who
  recognized it as the remains of a sauropod. Wild named Ohmdenosaurus in a 1978
  publication; the only known species is Ohmdenosaurus liasicus.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - marine
appearance:
  integument: scaled
  evidence: inferred
diagnostic_features:
  - Stocky, massive tibia strongly expanded at both joint ends
  - Cnemial crest sloping, bowed inward laterally, and bounded laterally by a
    sulcus
  - Lateral crest on the tibial shaft extending distally to about the shaft
    midpoint
  - Proximal tibial joint end perpendicular to the shaft's long axis
  - Flat, sandal-shaped astragalus lacking an ascending process
  - Small, disk-shaped calcaneus, with the ankle joint bearing bony sesamoids
