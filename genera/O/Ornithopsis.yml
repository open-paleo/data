genus: Ornithopsis
parent: Titanosauriformes
etymology: From Greek 'ornis' (bird) and 'opsis' (likeness or appearance); meaning 'bird-likeness'.
pronunciation:
  phonetic: or-ni-THOP-sis
description: Ornithopsis is a genus of sauropod dinosaur from the Early
  Cretaceous of England and possibly Germany. The type species, which is the
  only species seen as valid today, is O. hulkei, which is only known from
  fragmentary remains.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
synonyms:
  - name: Bothriospondylus magnus
    type: junior objective
    reason: Owen (1874) coined Bothriospondylus magnus on the
      subjects of his Plates VIII and IX, which Owen himself
      identified as among the specimens (Plates VII-IX) Seeley
      (1870) had previously used to erect Ornithopsis hulkei.
      Blows (1995) treats NHMUK PV R 28632 as the lectotype
      of O. hulkei from that same syntype series, making B. magnus
      a junior objective synonym based on the shared physical
      specimen.
diagnostic_features:
  - Enormous pneumatic foramina 3-4 inches long, approximating pterodactyl size
    rather than avian
  - Vertically ovate posterior articular surface, well cupped and concave in
    lateral view
  - Lateral compression of centrum with anterior enlargement, avian in character
  - Opisthocoelous centrum with dense external bone film of paper-thin thickness
  - Honeycomb-like internal air-cells of irregular polygonal form throughout
    centrum
  - Thin and compact films of bone dividing air-cells extending toward articular
    ends
appearance:
  integument: scaled
  evidence: inferred
