genus: Overosaurus
parent: Aeolosaurini
pronunciation:
  phonetic: oh-VAIR-o-SAWR-us
etymology: Named after the Cerro Overo locality in Patagonia, Argentina, combined with Greek sauros (lizard); meaning "Overo lizard".
description: Overosaurus is an extinct genus of sauropod dinosaurs, containing
  only a single species, Overosaurus paradasorum. This species lived
  approximately 86 to 84 million years ago during the latter part of the
  Cretaceous Period in what is now Patagonia (in southern Argentina).
  Overosaurus paradasorum was relatively small compared to other sauropods from
  Patagonia, like the saltasaurids and other aeolosaurines, estimated as
  approximately 10 m (33 ft). It was a ground-dwelling herbivore.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - arid
diagnostic_features:
  - posterior cervical vertebrae with long pre- and postzygapophyses projecting
    beyond centrum borders
  - postspinal lamina absent in all dorsal neural spines
  - wide massive 9th-10th caudal centra with lateral excavations and flat
    ventral surfaces
  - laminar projection on posterior border of second-third dorsal ribs
  - ilium proportionally shorter anteroposteriorly and taller dorsoventrally
    than other lithostrotians
  - preacetabular process of ilium strongly deflected laterally with
    ventrolaterally tapering end
