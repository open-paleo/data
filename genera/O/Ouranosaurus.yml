genus: Ouranosaurus
parent: Styracosterna
pronunciation:
  phonetic: oo-RAHN-o-SAWR-us
etymology: "From 'ourane', an Arabic word for valor, courage, or recklessness
  that the Tuareg of Niger and the Berbers of Algeria use as the name for the
  sand monitor, and Greek 'sauros' meaning 'lizard'."
description: Ouranosaurus is a genus of herbivorous basal hadrosauriform
  dinosaur that lived during the Aptian stage of the Early Cretaceous of
  modern-day Niger and Cameroon. Ouranosaurus measured about 7-8.3 meters (23-27
  ft) long and weighed 2.2 metric tons (2.4 short tons). Two rather complete
  fossils were found in the Elrhaz Formation, Gadoufaoua deposits, Agadez,
  Niger, in 1965 and 1970, with a third indeterminate specimen known from the
  Koum Formation of Cameroon. The animal was named in 1976 by French
  paleontologist Philippe Taquet, the type species being Ouranosaurus
  nigeriensis. The generic name is a combination of ourane, a word with multiple
  meanings, and sauros, the Greek word for lizard. The specific epithet
  nigeriensis alludes to Niger, its country of discovery (in Latin, the
  adjectival suffix -iensis means "originating from"). As such, Ouranosaurus
  nigeriensis could be interpreted as "brave lizard originating from Niger".
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
appearance:
  features:
    - dorsal sail
    - keratinous beak
    - elongate snout
    - nasal crest
  integument: scaled
  evidence: inferred
diagnostic_features:
  - rounded dorsal boss on the nasals, the only iguanodontid with a domed
    cranial roof at this level
  - long, low, duck-billed skull with extremely elongated straight premaxillae
    separating the nasals from the maxillae posteriorly
  - external nares readily visible in dorsal view, with the orifice of
    convergence between the nasal canals set very far posteriorly
  - dorsal neural spines extremely elongated, reaching 3.9 times centrum height,
    the greatest elongation known among ornithopods
  - fifth metacarpal reduced to a small bony spur that is not directed laterally
  - long, straight ischium with a very narrow obturator canal and a very
    proximally placed obturator process
