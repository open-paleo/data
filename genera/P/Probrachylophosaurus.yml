genus: Probrachylophosaurus
parent: Saurolophinae
pronunciation:
  phonetic: pro-BRAK-ee-LOH-fo-SAWR-us
etymology: From Greek pro- (πρό, 'before' or 'ancestral to') prefixed to Brachylophosaurus, indicating a suspected ancestral relationship; meaning 'before Brachylophosaurus'
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Solid nasal crest consisting entirely of nasals, overhanging supratemporal
    fenestrae by less than 2 cm in adults
  - Nasal crest extremely dorsoventrally thickened medially with strongly
    triangular frontal plane cross section
  - Dorsal angle formed by paired nasals in posterior view less than 130 degrees
    (112° in adult)
appearance:
  features:
    - solid cranial crest
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "372649"
  - source: wikidata
    id: Q21494374
  - source: eol
    id: "53430563"
species:
  - name: Probrachylophosaurus bergei
    etymology: "Named for Sam Berge, one of the landowners who donated the holotype fossil to the Museum of the Rockies and supported the research."
    status: valid
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Campanian
    location:
      country: US
      locality: MOR locality JR-518
      region: US-MT
      formation: Judith River
    size:
      length_m:
        min: 10.0
        max: 10.0
    erected_in: freedmanfowler2015a
    type_specimen:
      specimen_id: [MOR 2919]
      specimen_type: holotype
      institution: MOR
      material: Majority of skull and skeleton, disarticulated. Cranial material
        includes premaxilla, maxillae, jugal, lacrimal, nasal, braincase, squamosals,
        quadrates, predentary, dentaries, surangular. Postcranial material includes
        cervical, dorsal, caudal vertebrae, chevrons, ribs, ilia, pubes, ischia,
        tibiae, fibulae, astragali, metatarsals. Forelimbs and sacral vertebrae
        absent.
      completeness: partial
notable_specimens:
  - specimen_id: [MOR 1097]
    institution: MOR
    species: Probrachylophosaurus bergei
    category: ontogeny
    significance: "A fragmentary skull of a subadult Probrachylophosaurus bergei referred to the species in the 2015 study that named the genus, found about a kilometer from the holotype. It documents a younger growth stage alongside the adult holotype."
    references: [freedmanfowler2015a]
references:
  - id: freedmanfowler2015a
  - id: jones2026a
    notes: Source of the appearance features.
