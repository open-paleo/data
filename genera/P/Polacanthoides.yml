genus: Polacanthoides
parent: Ankylosauria
pronunciation:
  phonetic: pol-uh-KAN-thoy-deez
etymology: From Polacanthus (the related genus) and Greek -oides (-οειδής,
  'resembling' or 'like'), meaning 'resembling Polacanthus'
description: Polacanthoides is a dubious genus of nodosaurid dinosaur from the
  Wessex Formation of England. The type species is P. ponderosus.
dispute:
  summary: >
    Polacanthoides is a nomen dubium based on a chimeric specimen combining Hylaeosaurus and Polacanthus material (Raven et al., 2020). It is retained at Ankylosauria incertae sedis.
  history:
    - date: "2026-06-26"
      note: Placed at Ankylosauria incertae sedis, chimeric nomen dubium.
diet: herbivore
locomotion: quadrupedal
