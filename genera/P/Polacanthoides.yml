genus: Polacanthoides
parent: Ankylosauria
placement: incertae sedis
pronunciation:
  phonetic: pol-uh-KAN-thoy-deez
etymology: From Polacanthus (the related genus) and Greek -oides (-οειδής,
  'resembling' or 'like'), meaning 'resembling Polacanthus'
description: Polacanthoides is a dubious genus of ankylosaurian dinosaur from the
  Weald Clay of England. The type species is P. ponderosus.
dispute:
  summary: >
    Polacanthoides is a nomen dubium. Its name-bearing material is a chimera
    assembled by Nopcsa (1928) from a partial scapula from the Wealden of
    Sussex, previously referred to Hylaeosaurus, together with a humerus and
    tibia from the Wessex Formation of the Isle of Wight that are now known
    only from casts. Raven et al. (2020) found no autapomorphies of
    Hylaeosaurus on the scapula and none of Polacanthus on the humerus and
    tibia, and regarded all of the material as indeterminate ankylosaur
    remains. It is retained at Ankylosauria incertae sedis.
  history:
    - date: "2026-06-26"
      note: Placed at Ankylosauria incertae sedis; indeterminate nomen dubium.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
appearance:
  integument: armored
  evidence: inferred
identifiers:
  - source: pbdb
    id: "66562"
  - source: wikidata
    id: Q5638133
  - source: gbif
    id: "4823205"
species:
  - name: Polacanthoides ponderosus
    etymology: "From Latin 'ponderosus' meaning 'heavy' or 'ponderous'."
    status: nomen dubium
    type_species: true
    period:
      name:
        - Early Cretaceous
      stage:
        - Barremian
    location:
      country: GB
      region: GB-ENG
      locality: Bolney
      formation: Weald Clay
      coordinates:
        - 50.983299
        - -0.2
    type_specimen:
      specimen_id: [ NHMUK PV R 2584 ]
      specimen_type: holotype
      institution: NHMUK
    erected_in: nopcsa1928a
references:
  - id: mantell1833b
    notes: First referred the holotype specimen (NHMUK PV R 2584) to Hylaeosaurus;
      Nopcsa (1928) later made it the type of Polacanthoides.
  - id: nopcsa1928a
    notes: Erects Polacanthoides ponderosus on scapula, humerus, and tibia from
      Bolney as a brief note, deferring the full description to a later paper.
  - id: raven2020a
    notes: Reassessed the Polacanthoides type material as indeterminate ankylosaur
      remains lacking the diagnostic features of either Hylaeosaurus or Polacanthus,
      and regarded P. ponderosus as a nomen dubium.
