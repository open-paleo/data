genus: Polacanthoides
parent: Ankylosauria
placement: incertae sedis
erected_in: nopcsa1928a
pronunciation:
  phonetic: pol-uh-KAN-thoy-deez
etymology: From Polacanthus (the related genus) and Greek -oides (-οειδής,
  'resembling' or 'like'), meaning 'resembling Polacanthus'
description: Polacanthoides is a dubious genus of ankylosaurian dinosaur from the
  Wealden of southern England. The type species is P. ponderosus.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
appearance:
  integument: armored
  evidence: inferred
identifiers:
  - source: pbdb
    id: "66562"
  - source: wikidata
    id: Q5638133
  - source: gbif
    id: "4823205"
species:
  - name: Polacanthoides ponderosus
    etymology: "From Latin 'ponderosus' meaning 'heavy' or 'ponderous'."
    status: nomen dubium
    type_species: true
    period:
      name:
        - Early Cretaceous
      stage:
        - Berriasian
        - Valanginian
        - Hauterivian
        - Barremian
        - Aptian
    location:
      country: GB
      region: GB-WSX
      locality: Bolney
      group: Wealden
    type_specimen:
      specimen_id: [ NHMUK PV OR 2584 ]
      specimen_type: syntype
      institution: NHMUK
      notes: Nopcsa (1929) names the scapula and the humerus NHMUK PV R 1106
        together as the type. Only the scapula is listed here, because the
        humerus, now known from a cast, comes from the Wessex Formation of the
        Isle of Wight (Raven and colleagues, 2020), not from Sussex.
    erected_in: nopcsa1929a
references:
  - id: mantell1841a
    notes: Referred a scapula from Bolney, Sussex (NHMUK PV OR 2584), to
      Hylaeosaurus; Nopcsa (1928) later included it in the type material of
      Polacanthoides.
  - id: nopcsa1928a
    notes: Names the genus Polacanthoides, without a species, in a footnote on
      a scapula, humerus and tibia, deferring the redescription to a later
      paper.
  - id: nopcsa1929a
    notes: Names the species ponderosus for the genus Nopcsa (1928) had erected
      without one, on the scapula and humerus.
  - id: raven2020a
    notes: Reassessed the Polacanthoides type material as indeterminate ankylosaur
      remains lacking the diagnostic features of either Hylaeosaurus or Polacanthus,
      and regarded P. ponderosus as a nomen dubium.
