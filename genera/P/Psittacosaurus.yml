genus: Psittacosaurus
parent: Ceratopsia
etymology: From Greek psittakos (parrot) and sauros (lizard); meaning "parrot
  lizard", a name suggested by W.K. Gregory and adopted by Osborn in reference
  to the deep, edentulous, parrot-like rostrum formed by the premaxillae and the
  unpaired rostral bone.
pronunciation:
  phonetic: SIT-uh-koh-SAWR-us
  ipa: /ˌsɪtəkəˈsɔːrəs/
description: >
  Psittacosaurus is a genus of extinct ceratopsian dinosaur from the Early
  Cretaceous of what is now Asia, existing between 125 and 105 million years
  ago. It is notable for being the most species-rich non-avian dinosaur genus.
  Up to 13 species are known, from across China, Mongolia, Russia, and Thailand.
  The species of Psittacosaurus were obligate bipeds at adulthood, with a high
  skull and a robust beak. One individual was found preserved with long
  filaments on the tail, similar to those of Tianyulong. Psittacosaurus probably
  had complex behaviors, based on the proportions and relative size of the
  brain. It may have been active for short periods of time during the day and
  night, and had well-developed senses of smell and vision.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
appearance:
  features:
    - keratinous beak
    - square snout
    - jugal horns
    - tail bristles
  integument: scaled
  evidence: direct
diagnostic_features:
  - Skull short and deep, with a prominent parrot-like edentulous rostrum;
    preorbital skull length less than 40% of total skull length, shorter than in
    nearly all other ornithischians.
  - Unpaired median rostral bone forming the anterior keel of the snout, with
    rostral-nasal contact and the nasal contributing to the internarial bar
    ventral to the external naris.
  - Jugals projecting laterally well beyond the dorsal margin of the orbit,
    bearing a prominent dorsoventral crest on their lateral aspect.
  - Fenestra of the lacrimal canal present between premaxilla and lacrimal — a
    condition unique to Psittacosaurus among dinosaurs.
  - Pterygoid with a neomorphic secondary palatal lamina forming an akinetic
    basal plate that contacts its opposite at the midline, reinforcing the
    palate against transverse compression.
  - Laterally divergent palpebral with transverse posterior margin, projecting
    laterally to a width equal to the posterior skull table.
  - Predentary ventral process broad, expanding in width toward its proximal end.
  - Dentary teeth with a bulbous, cone-shaped primary ridge occupying
    approximately one third of the crown face, with secondary ridging.
