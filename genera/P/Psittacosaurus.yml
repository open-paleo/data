synonyms:
  - name: Protiguanodon mongoliense
    type: junior subjective
    reason: Erected by Osborn (1923) in the same paper as Psittacosaurus
      mongoliensis on AMNH 6253 from the Ondai Sair Formation;
      synonymised with P. mongoliensis by Sereno (1990) after
      reexamination of both type skeletons, and confirmed in Sereno
      (2010).
  - name: Hongshanosaurus houi
    type: junior subjective
    reason: Erected by You et al. (2003) on an immature, dorsoventrally
      crushed skull from the Yixian Formation; the genus was sunk into
      Psittacosaurus by Sereno (2010), who treated the holotype itself
      as a nomen dubium (too crushed and immature to diagnose) and
      suggested that the referred adult skull likely pertains to
      P. lujiatunensis.
  - name: Psittacosaurus osborni
    type: junior subjective
    reason: Sereno (1990) found the distinguishing characters
      (small size, tooth-ridge morphology) fall within the growth
      series of P. mongoliensis. Sereno (2010) reaffirmed the
      synonymy as tentative pending more material.
  - name: Psittacosaurus tingi
    type: junior subjective
    reason: Treated by Young (1958) as a junior synonym of P. osborni
      and by Sereno (1990, 2010) as a junior synonym of P.
      mongoliensis.
  - name: Psittacosaurus guyangensis
    type: junior subjective
    reason: Sereno (1990) found all distinguishing characteristics
      fall within the growth series of P. mongoliensis; tentatively
      reaffirmed by Sereno (2010).
  - name: Psittacosaurus youngi
    type: junior subjective
    reason: Sereno (1990) found P. youngi indistinguishable from P.
      sinensis; specific distinction can no longer be justified.
