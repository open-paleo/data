synonyms:
  - name: Hongshanosaurus houi
    type: junior subjective
    reason: Erected by You and others (2003) on an immature, dorsoventrally
      crushed skull from the Yixian Formation; the genus was sunk into
      Psittacosaurus by Sereno (2010), who treated the species itself as a nomen
      dubium (too crushed and immature to diagnose) and suggested that the
      referred adult skull likely pertains to P. lujiatunensis. The name
      therefore attaches to the genus rather than to any one species.
species:
  - name: Psittacosaurus mongoliensis
    etymology: From mongoliensis ("of Mongolia"), referring to the country of origin
      of the holotype.
    status: valid
    type_species: true
    period:
      name:
        - Early Cretaceous
      stage:
        - Aptian
        - Albian
    location:
      country: MN
      region: MN-055
      formation: Öösh
      locality: Red Mesa
      member: Cannonball
    size:
      hip_height_m:
        min: 0.6
        max: 0.6
      length_m:
        min: 1.5
        max: 2
      weight_kg:
        min: 12
        max: 25
    type_specimen:
      specimen_id:
        - AMNH 6254
      specimen_type: holotype
      institution: AMNH
      material: Nearly complete adult skull and jaws plus articulated partial
        postcranial skeleton (vertebrae, most of the limb elements).
      completeness: partial
    synonyms:
      - name: Protiguanodon mongoliense
        type: junior subjective
        reason: Erected by Osborn (1923) in the same paper as Psittacosaurus
          mongoliensis on AMNH 6253 from the Ondai Sair Formation; synonymized
          with P. mongoliensis by Sereno (1990) after reexamination of both type
          skeletons, and confirmed in Sereno (2010).
      - name: Psittacosaurus osborni
        type: junior subjective
        reason: Sereno (1990) found the distinguishing characters (small size,
          tooth-ridge morphology) fall within the growth series of P.
          mongoliensis. Sereno (2010) reaffirmed the synonymy as tentative
          pending more material.
      - name: Psittacosaurus tingi
        type: junior subjective
        reason: Treated by Young (1958) as a junior synonym of P. osborni, and
          by Sereno (1990) as indistinguishable from P. mongoliensis. Sereno
          (2010) lists it in the synonymy of P. mongoliensis while also
          regarding it as a nomen dubium, its holotype being two small
          dentaries.
      - name: Psittacosaurus guyangensis
        type: junior subjective
        reason: Sereno (1990) found all distinguishing characteristics fall
          within the growth series of P. mongoliensis; tentatively reaffirmed by
          Sereno (2010).
    erected_in: osborn1923b
  - name: Psittacosaurus sinensis
    etymology: From Latin 'sinensis' meaning 'of China', for the country of origin.
    status: valid
    type_species: false
    period:
      stage:
        - Aptian
        - Albian
      name:
        - Early Cretaceous
    location:
      country: CN
      region: CN-SD
      formation: Doushan
      locality: Doushan village, 5 km northwest of Laiyang
    type_specimen:
      specimen_id:
        - IVPP V738
      specimen_type: holotype
      institution: IVPP
      material: Articulated adult skeleton with a nearly complete skull, missing only
        the palpebrals and the tip of the left jugal horn; postcranium missing
        distal forelimb elements, carpus, manus, distal tarsals, and some
        phalanges.
    diagnostic_features:
      - Pendant rostrum with the ventral edge of the rostral bone positioned
        below the level of the maxillary tooth row.
      - Anteroventral processes of the nasal separated at the midline by a
        narrow gap.
      - Short lower jaw positioning the anterior margin of the predentary in
        opposition to the premaxilla rather than the rostral.
      - Posteriorly flaring skull roof with postorbital-squamosal bars diverging
        at an angle of approximately 30 degrees.
      - Vertically elongate horn on the postorbital bar, split between the jugal
        and postorbital, unlike the arched postorbital crest of P. mongoliensis.
      - Frontal participates in the supratemporal fossa, and the internal
        mandibular fenestra is reduced to a foramen.
    synonyms:
      - name: Psittacosaurus youngi
        type: junior subjective
        reason: Based on a partial skeleton and well-preserved skull (BNHM BPV149) from
          the same beds and localities as the P. sinensis holotype; its
          diagnosis included no autapomorphies distinguishing it. Sereno (1990)
          found it indistinguishable from P. sinensis, to which it is now
          referred.
    erected_in: young1958a
    described_in: sereno2010a
  - name: Psittacosaurus xinjiangensis
    etymology: Refers to Xinjiang Uygur Autonomous Region, China, where the holotype
      was found
    status: valid
    type_species: false
    period:
      stage:
        - Aptian
      name:
        - Early Cretaceous
    location:
      country: CN
      region: CN-XJ
      group: Tugulu
      locality: Delunshan, Junggar Basin
    type_specimen:
      specimen_id:
        - IVPP V7698
      specimen_type: holotype
      institution: IVPP
      material: posterior portion of the skull including the jugal horn and palpebral,
        and an articulated skeleton lacking distal limb bones and tail
    diagnostic_features:
      - Hook-shaped palpebral with a V-shaped posterior margin
      - Dentary teeth with as many as 21 denticles in the posterior center of
        the tooth row
      - Ossified tendons extending into the mid-caudal vertebrae, absent in
        other psittacosaur species
      - Narrow iliac postacetabular process with height at midlength less than
        25% of the process length, versus 30% or more in P. mongoliensis, P.
        major, P. sinensis, and P. sibiricus
      - Small occipital condyle with transverse width less than half the width
        of the basal tubera, versus more than half in other species
    erected_in: sereno1988a
    described_in: sereno2010a
  - name: Psittacosaurus meileyingensis
    etymology: Named for the Meileyingzi locality near Beipiao, Liaoning Province,
      where the type material was found.
    status: valid
    type_species: false
    period:
      stage:
        - Aptian
      name:
        - Early Cretaceous
    location:
      country: CN
      region: CN-LN
      formation: Jiufotang
      locality: Meileyingzi
      bed: Meileyingzi
    type_specimen:
      specimen_id:
        - IVPP V7705
      specimen_type: holotype
      institution: IVPP
      material: Skull with jaws, lacking the jugal horns and central body of the
        premaxilla.
    diagnostic_features:
      - Preorbital skull length only about 30% of total skull length, versus
        roughly 37% in P. mongoliensis.
      - Subtriangular orbit with an acute ventral corner.
      - Rugose quadratojugal eminence, unlike the smooth eminence present in
        most other species including P. mongoliensis.
      - Ridge ascending from the maxillary protuberance, a feature shared only
        with P. major.
      - Strong, pendant dentary flange, unlike the low flange in P. mongoliensis.
      - Small external mandibular fenestra.
    erected_in: sereno1988b
    described_in: sereno2010a
  - name: Psittacosaurus neimongoliensis
    etymology: Named for Nei Mongol (Inner Mongolia), the autonomous region of China
      where the holotype was found
    status: valid
    type_species: false
    period:
      stage:
        - Aptian
        - Albian
      name:
        - Early Cretaceous
    location:
      country: CN
      region: CN-NM
      formation: Ejinhoro
      locality: 1 km southeast of Yangpo village, 80 km west of Dongsheng
    type_specimen:
      specimen_id:
        - IVPP 12-0888-2
      specimen_type: holotype
      institution: IVPP
      material: Articulated skeleton with skull
    diagnostic_features:
      - Skull large relative to trunk, unlike in P. mongoliensis
      - Preorbital portion of skull less than 35% of skull length, versus about
        37% in P. mongoliensis
      - Prefrontal lacks the raised lateral (orbital) edge present in P.
        mongoliensis
      - External mandibular fenestra closed, unlike the open fenestra in P.
        mongoliensis
      - Distal end of ischial blade not transversely broadened, unlike the
        expanded ischial blade of P. mongoliensis
      - Anterior process of squamosal stops short of the body of the postorbital
    erected_in: russell1996a
    described_in: sereno2010a
  - name: Psittacosaurus lujiatunensis
    etymology: Named for the Lujiatun locality/beds (lowermost Yixian Formation),
      Liaoning Province, China, where the type material was collected.
    status: valid
    type_species: false
    period:
      stage:
        - Barremian
        - Aptian
      name:
        - Early Cretaceous
    location:
      country: CN
      region: CN-LN
      formation: Yixian
      member: Lujiatun
      locality: Lujiatun, near Beipiao
      part: lower
    type_specimen:
      specimen_id:
        - ZMNH M8137
      specimen_type: holotype
      institution: ZMNH
      material: skull with lower jaws
    diagnostic_features:
      - Prefrontal width less than 50% that of the nasal (an autapomorphy)
      - Quadratojugal contacts the squamosal along the anterior margin of the
        quadrate shaft, unlike the separated condition in P. mongoliensis
      - Jugal contacts the quadrate posteroventral to the laterotemporal
        fenestra, unlike the separated condition in P. mongoliensis
      - Bears a prominent, pendant dentary flange with a squared anterior
        corner, unlike the low flange in P. mongoliensis
      - External mandibular fenestra closed, unlike the retained open fenestra
        in P. mongoliensis
    erected_in: zhou2006b
    described_in: sereno2010a
  - name: Psittacosaurus gobiensis
    etymology: Gobi, after the Gobi Desert; -ensis (Latin) belonging to.
    status: valid
    type_species: false
    period:
      stage:
        - Aptian
      name:
        - Early Cretaceous
    location:
      country: CN
      region: CN-NM
      formation: Bayin-Gobi
      locality: southwest of Suhongtu
      coordinates:
        - 40.9951
        - 104.0649
    type_specimen:
      specimen_id:
        - LH PV2
      specimen_type: holotype
      institution: LH
      material: Skull and articulated postcranial skeleton with gastrolith mass,
        lacking only portions of the right manus, some of the sacrum and pelvic
        girdle, and the right hind limb and tail.
    diagnostic_features:
      - Pyramidal postorbital horn formed almost entirely by the postorbital,
        unlike the primitive postorbital shape and ornamentation of P.
        mongoliensis
      - Retroarticular process deflected posteromedially about 40 degrees from
        the mandible axis, versus the straight retroarticular process in P.
        mongoliensis
      - Shorter, deeper skull proportions than the longer-snouted P.
        mongoliensis, with lower tooth count (8 maxillary, 9 dentary teeth)
      - Many cranial and mandibular sutures fused despite maturity, whereas P.
        mongoliensis retains open sutures despite comparable size
      - Postorbital-jugal fossa present, and minimum width of the postorbital
        bar about 50 percent the width of the process base
      - Thin, restricted enamel on medial maxillary and lateral dentary crowns
        respectively, an asymmetry emphasized more than in other species
    erected_in: sereno2010b
  - name: Psittacosaurus amitabha
    etymology: Named for Amitabha, the Buddha of infinite light, associated with
      extreme longevity; principal Buddha of Pure Land Buddhism, highly
      venerated in Mongolia.
    status: valid
    type_species: false
    period:
      stage:
        - Barremian
        - Aptian
      name:
        - Early Cretaceous
    location:
      country: MN
      region: MN-055
      formation: Andakhuduk
      locality: Ondai Sayr, Ussuk
    type_specimen:
      specimen_id:
        - IGM 100/1132
      specimen_type: holotype
      institution: MPC
      material: Nearly complete, undistorted skull with associated partial mandible
        and fragmentary postcranial elements (ribs, forelimb fragment, pes, 21
        caudal vertebrae, gastroliths).
    diagnostic_features:
      - Snout relatively longer than in P. mongoliensis, with a less steeply
        inclined anterior rostronasal margin.
      - Cranium dorsally convex rather than flat, unlike the flattened skull
        roof seen in other Psittacosaurus.
      - Subtemporal length less than 40% of total skull length.
      - Five premaxillary foramina arranged in an arc, more numerous than in any
        other known Psittacosaurus species.
      - Posterior lamina of the maxilla cupped around the toothrow, contrasting
        with P. mongoliensis where the tooth-bearing pedestal contacts the
        pterygoid without a cupped lamina.
      - Antorbital fossa as long as it is tall.
      - Palpebral with a well-developed posterior tonguelike process extending
        over half the orbit length, unlike the subtriangular palpebral of other
        Psittacosaurus.
    erected_in: napoli2019a
  - name: Psittacosaurus sibiricus
    etymology: Named for Siberia, the region of Russia where the holotype was
      found.
    status: valid
    type_species: false
    period:
      name:
        - Early Cretaceous
      stage:
        - Aptian
        - Albian
    location:
      country: RU
      region: RU-KEM
      formation: Ilek
      locality: Shestakovo 3, Chebula District
      coordinates:
        - 55.8833
        - 87.9833
    type_specimen:
      specimen_id:
        - PM TGU 16/4-20
      specimen_type: holotype
      institution: TGU
      material: An articulated, almost complete adult skeleton including the skull.
    size:
      length_m:
        min: 1.7
        max: 1.85
    diagnostic_features:
      - Skull width exceeds skull length, unlike the proportionately narrower
        skull of P. mongoliensis.
      - Infratemporal fenestra small, its maximum height only 25% of skull
        length versus 31-38% in P. mongoliensis and other congeners.
      - Premaxilla anteroposteriorly short, with a maximum length-to-height
        ratio under 60%, unlike the longer premaxilla of P. mongoliensis.
      - Postorbital bears a short medial process that does not contribute to the
        orbital margin, unlike the condition in P. mongoliensis.
      - Jugal has a deep cleft for the quadratojugal that extends onto the
        posterior face of the jugal horn, unlike P. mongoliensis.
      - Angular bears a prominent tuber and there are 23 presacral vertebrae,
        both differing from the condition in P. mongoliensis.
    erected_in: leshchinskiy2000a
    described_in: averianov2006a
references:
  - id: osborn1923b
    notes: Erects Psittacosaurus mongoliensis on AMNH 6254 (Ashile Formation); also
      names Protiguanodon mongoliense on AMNH 6253 (Ondai Sair Formation), of
      comparable size to the holotype.
  - id: sereno1990a
    notes: Modern revision establishing the generic diagnosis; formally synonymises
      Protiguanodon and several Young/Cheng species into P. mongoliensis or P.
      sinensis.
  - id: sereno2010a
    notes: Comprehensive modern review of the genus; recognizes nine valid species
      and sinks Hongshanosaurus into Psittacosaurus.
  - id: jones2026a
    notes: Source of the hip height estimate, and the appearance features.
  - id: young1958a
    notes: Erects Psittacosaurus sinensis (Laiyang, Shandong); also treated P. tingi
      as a junior synonym.
  - id: sereno1988a
    notes: Erects Psittacosaurus xinjiangensis on holotype IVPP V7698 from the
      Tugulu Group of Xinjiang.
  - id: sereno1988b
    notes: Erects Psittacosaurus meileyingensis on holotype IVPP V7705 from the
      Jiufotang Formation of Liaoning.
  - id: russell1996a
    notes: Erects Psittacosaurus neimongoliensis on holotype IVPP 12-0888-2 from the
      Ejinhoro Formation of Nei Mongol.
  - id: zhou2006b
    notes: Erects Psittacosaurus lujiatunensis on holotype ZMNH M8137 from the
      Lujiatun beds (lowermost Yixian Formation) of Liaoning.
  - id: sereno2010b
    notes: Erects Psittacosaurus gobiensis on holotype LH PV2 from the Bayan Gobi
      Formation of Nei Mongol.
  - id: napoli2019a
    notes: Erects Psittacosaurus amitabha on holotype IGM 100/1132 from the
      Andakhuduk Formation of central Mongolia.
  - id: leshchinskiy2000a
    notes: Paper in which the name Psittacosaurus sibiricus first validly
      appeared; the species is credited within it to Voronkevich and Averianov.
  - id: averianov2006a
    notes: Full redescription of Psittacosaurus sibiricus on holotype PM TGU
      16/4-20 from the Ilek Formation (Shestakovo) of West Siberia.
  - id: andres2005a
    notes: Places the Psittacosaurus mongoliensis holotype in the cannonball
      beds at the base of the Öösh Formation, and gives Övörkhangai for the
      locality.
  - id: rougier2001a
    notes: Ranks the Cannonball a member of the Öösh Formation and traces
      the locality's naming from Osborn's Ashile through the Oshih of Berkey
      and Morris.
