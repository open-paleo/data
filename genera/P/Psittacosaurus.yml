genus: Psittacosaurus
parent: Ceratopsia
etymology: From Greek psittakos (parrot) and sauros (lizard); meaning
  "parrot lizard", a name suggested by W.K. Gregory and adopted by
  Osborn in reference to the deep, edentulous, parrot-like rostrum
  formed by the premaxillae and the unpaired rostral bone.
pronunciation:
  phonetic: SIT-uh-koh-SAWR-us
  ipa: /ˌsɪtəkəˈsɔːrəs/
description: >
  Psittacosaurus is the type genus of Psittacosauridae and one of the
  most species-rich non-avian dinosaur genera, with roughly nine to
  twelve currently accepted species spread across the late Lower
  Cretaceous of central and eastern Asia (China, Mongolia, Russia,
  and Thailand). The genus is defined by a short, deep skull with a
  prominent parrot-like edentulous rostrum, laterally projecting
  jugals, and a unique fenestra of the lacrimal canal between the
  premaxilla and the lacrimal that is found in no other dinosaur.
  Osborn erected the genus and the type species P. mongoliensis in
  1923 on AMNH 6254 from the Ashile Formation of the Artsa Bogdo
  basin, Mongolia, recovered on the AMNH Central Asiatic Expedition;
  he simultaneously named Protiguanodon mongoliense on a smaller
  specimen from the Ondai Sair (now Andai Sair) Formation, but the
  two were synonymised by Sereno (1990) and the genus has since been
  the subject of comprehensive revisions by Sereno (1990, 2010).
  Psittacosaurus is exceptionally well-sampled ontogenetically, with
  embryos, hatchlings, juveniles in groups, and adults all known.
  The Senckenberg specimen (SMF R 4970, referred to P. sp.) preserves
  countershaded scaly integument over the body, prominent quill-like
  bristles arrayed along the dorsal surface of the tail, and a
  cloaca, making it one of the most informative non-avian dinosaur
  body fossils ever recovered.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
appearance:
  integument: scaled
  evidence: direct
diagnostic_features:
  - Skull short and deep, with a prominent parrot-like edentulous
    rostrum; preorbital skull length less than 40% of total skull
    length, shorter than in nearly all other ornithischians.
  - Unpaired median rostral bone forming the anterior keel of the
    snout, with rostral-nasal contact and the nasal contributing to
    the internarial bar ventral to the external naris.
  - Jugals projecting laterally well beyond the dorsal margin of the
    orbit, bearing a prominent dorsoventral crest on their lateral
    aspect.
  - Fenestra of the lacrimal canal present between premaxilla and
    lacrimal — a condition unique to Psittacosaurus among dinosaurs.
  - Pterygoid with a neomorphic secondary palatal lamina forming an
    akinetic basal plate that contacts its opposite at the midline,
    reinforcing the palate against transverse compression.
  - Laterally divergent palpebral with transverse posterior margin,
    projecting laterally to a width equal to the posterior skull
    table.
  - Predentary ventral process broad, expanding in width toward its
    proximal end.
  - Dentary teeth with a bulbous, cone-shaped primary ridge occupying
    approximately one third of the crown face, with secondary
    ridging.
