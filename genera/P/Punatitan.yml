genus: Punatitan
parent: Rinconsauria
etymology: "Named for the puna, the high-altitude Andean plateau characterized by oxygen-depleted atmosphere, combined with Greek 'titan' meaning 'giant'; meaning 'puna giant.'"
pronunciation:
  phonetic: POO-na-TIE-tuhn
description: Punatitan is a genus of titanosaurian sauropod dinosaur from the
  Late Cretaceous Ciénaga del Río Huaco Formation of La Rioja, Argentina. It
  contains one species, Punatitan coughlini.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - lacustrine
diagnostic_features:
  - Middle dorsal vertebrae with anterior and posterior spinodiapophyseal
    laminae forming wide flat surface between aliform and transverse processes
  - Accessory posterior centrodiapophyseal lamina crossed by posterior
    centroparapophyseal lamina, forming X-shaped intersection in D6-D7
  - Deep postzygodiapophyseal centrodiapophyseal fossa in D6-D7
  - Neural spine of D6 tapers dorsally, forming inverted-V profile in
    anterior/posterior view
  - Caudal transverse processes persist beyond Ca15
  - Slightly anteriorly inclined neural spines in anterior-middle caudal
    vertebrae (Ca5-10)
  - Distally expanded prezygapophyses in anterior-middle caudal vertebrae
