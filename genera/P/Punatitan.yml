genus: Punatitan
parent: Rinconsauria
etymology: The generic name Punatitan refers to the oxygen-depleted atmosphere
  characteristic of the Andes. The specific name refers to geologist Tim
  Coughlin, who first reported dinosaur fossils in the discovery locality.
description: Punatitan is a genus of titanosaurian sauropod dinosaur from the
  Late Cretaceous Ciénaga del Río Huaco Formation of La Rioja, Argentina. It
  contains one species, Punatitan coughlini.
diet: herbivore
