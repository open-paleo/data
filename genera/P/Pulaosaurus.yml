genus: Pulaosaurus
parent: Neornithischia
pronunciation:
  phonetic: poo-LOW-SAWR-us
etymology: From Mandarin Chinese 'Pulao' (a dragon of Chinese mythology
  reputed for its loud cry, alluding to the genus's preserved ossified
  larynx) and Greek 'sauros' (lizard).
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
  - fluvial
diagnostic_features:
  - Robust fibular condyle forming a dorsoventrally extending crest on the tibia.
  - Three unfused distal tarsals present, with distal tarsal 3 being small and
    drop-shaped.
  - Distal tarsal 3 pierced by a foramen on its posterior surface.
  - Small bony boss on the caudoventral corner of the dorsal ramus of the jugal.
  - Obturator opening in the pubis is notch-shaped rather than a true enclosed
    foramen.
  - Paired arytenoid (laryngeal) elements are gracile and leaf-like in form with
    a L-shaped cross-section.
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "519526"
  - source: wikidata
    id: Q135277762
species:
  - name: Pulaosaurus qinglong
    etymology: From 'Qinglong', the name of Qinglong County (Hebei Province,
      China), the type locality.
    pronunciation:
      phonetic: CHING-lohng
    status: valid
    type_species: true
    period:
      name:
        - Middle Jurassic
        - Late Jurassic
      stage:
        - Callovian
        - Oxfordian
    location:
      country: CN
      region: CN-HE
      formation: Tiaojishan
      locality: southern Shimen Gou
    type_specimen:
      specimen_id:
        - IVPP V30936
      specimen_type: holotype
      institution: IVPP
      material: Nearly complete articulated skeleton of an immature individual
        on a brownish-red sandstone slab; most of the skull (disarticulated),
        cervical and dorsal vertebrae, 24 caudal vertebrae, scapula fragments,
        complete left forelimb, pelvic girdle, hindlimbs, paired
        ceratobranchials and ossified arytenoids, plus cololites in the
        abdominal cavity.
      completeness: complete
    erected_in: yang2025a
references:
  - id: yang2025a
    notes: Erects Pulaosaurus on an immature skeleton preserving paired ossified
      arytenoids — only the second non-avian dinosaur with a fossilized larynx —
      and probable plant-seed gut contents.
