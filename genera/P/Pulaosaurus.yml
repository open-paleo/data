genus: Pulaosaurus
parent: Neornithischia
pronunciation:
  phonetic: poo-LOW-SAWR-us
etymology: From Mandarin Chinese 'Pulao' (a dragon of Chinese mythology
  reputed for its loud cry, alluding to the genus's preserved ossified
  larynx) and Greek 'sauros' (lizard).
description: Pulaosaurus is an extinct genus of early-diverging neornithischian
  ornithischian dinosaur from the Callovian-Oxfordian Tiaojishan Formation of
  Qinglong County, Hebei Province, northern China. Yang, King and Xu (2025)
  erected the genus on an immature articulated skeleton (IVPP V30936; total
  preserved length ~722 mm) that preserves paired ossified arytenoids and
  ceratobranchials of the larynx — making Pulaosaurus only the second
  non-avian dinosaur (after the ankylosaur Pinacosaurus grangeri) known to
  retain ossified laryngeal elements. Comparison with extant avian larynges
  led the authors to interpret the structure as a vocal modifier rather than
  the vocal source, suggesting bird-like acoustic capabilities. Cololites
  preserved in the abdominal cavity (3-8 mm oval impressions and flat
  pebbles) provide direct evidence of plant-seed ingestion. Pulaosaurus is
  the first neornithischian and the first ornithischian confidently
  recovered from the Yanliao Biota, and the phylogenetic analyses recover
  it as one of the earliest-diverging Neornithischia, close to Agilisaurus.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
  - fluvial
diagnostic_features:
  - Robust fibular condyle forming a dorsoventrally extending crest on the tibia.
  - Three unfused distal tarsals present, with distal tarsal 3 being small and
    drop-shaped.
  - Distal tarsal 3 pierced by a foramen on its posterior surface.
  - Small bony boss on the caudoventral corner of the dorsal ramus of the jugal.
  - Obturator opening in the pubis is notch-shaped rather than a true enclosed
    foramen.
  - Paired arytenoid (laryngeal) elements are gracile and leaf-like in form with
    a L-shaped cross-section.
