genus: Panphagia
parent: Saturnaliidae
etymology: From Greek 'pan' meaning 'all' and 'phagein' meaning 'to eat', referring to its interpreted omnivorous diet as a basal sauropodomorph.
pronunciation:
  phonetic: pan-FAG-ee-uh
description: Panphagia is a genus of sauropodomorph dinosaur described in 2009.
  It lived around 231 million years ago, during the Carnian age of the Late
  Triassic period in what is now northwestern Argentina. Fossils of the genus
  were found in the La Peña Member of the Ischigualasto Formation in the
  Ischigualasto-Villa Unión Basin. The name Panphagia comes from the Greek words
  pan, meaning "all", and phagein, meaning "to eat", in reference to its
  inferred omnivorous diet. Panphagia is one of the earliest known dinosaurs,
  and is an important find which may mark the transition of diet in early
  sauropodomorph dinosaurs.
dispute:
  summary: >
    Panphagia protos is a basalmost sauropodomorph from the Late Triassic
    of Argentina, sometimes placed within Saturnaliidae and sometimes as a
    more basal sauropodomorph; its membership is not firmly established
    (Jones, 2026).
  history:
    - date: "2026-06-29"
      note: Placed at Saturnaliidae following its common recovery there (P2); the basal-Sauropodomorpha-incertae-sedis alternative is recorded.
diet: omnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Anteroposteriorly elongated fossa on base of anteroventral process of nasal
  - Wide lateral flange on quadrate with large foramen far from shaft
  - Deep groove on lateral surface of lower jaw with prominent dorsal and
    ventral ridges
  - Bifurcated posteroventral process of dentary with slender overlapping rami
  - Retroarticular process transversally wider than articular facet for quadrate
  - Oval scars on lateral surface of posterior cervical vertebral centra
  - Scapular blade distal end nearly three times wider than neck
  - Medial lamina of brevis fossa twice as wide as iliac spine
