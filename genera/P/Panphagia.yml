genus: Panphagia
parent: Saturnaliidae
description: Panphagia is a genus of sauropodomorph dinosaur described in 2009.
  It lived around 231 million years ago, during the Carnian age of the Late
  Triassic period in what is now northwestern Argentina. Fossils of the genus
  were found in the La Peña Member of the Ischigualasto Formation in the
  Ischigualasto-Villa Unión Basin. The name Panphagia comes from the Greek words
  pan, meaning "all", and phagein, meaning "to eat", in reference to its
  inferred omnivorous diet. Panphagia is one of the earliest known dinosaurs,
  and is an important find which may mark the transition of diet in early
  sauropodomorph dinosaurs.
diet: omnivore
