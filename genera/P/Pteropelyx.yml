genus: Pteropelyx
parent: Hadrosauridae
placement: incertae sedis
etymology: From Greek pteron (wing) and pelyx (pelvis); meaning "winged pelvis".
pronunciation:
  phonetic: teh-ROP-uh-liks
dispute:
  summary: >
    Pteropelyx is a nomen dubium based on a postcranial holotype lacking
    a skull; it has been suggested to be referable to Corythosaurus but
    cannot be confirmed.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
  - coastal
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "64357"
  - source: wikidata
    id: Q1655640
  - source: gbif
    id: "4572636"
species:
  - name: Pteropelyx grallipes
    etymology: "From Latin 'grallae' meaning 'stilts' and 'pes' meaning 'foot',
      likely referring to the long-legged proportions of the animal."
    pronunciation:
      phonetic: GRAL-i-peez
    status: nomen dubium
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Campanian
    location:
      country: US
      locality: Cow Island
      region: US-MT
      formation: Judith River
    type_specimen:
      specimen_id: [ AMNH 3971 ]
      specimen_type: holotype
      institution: AMNH
      material: Greater part of skeleton; right half of pelvis nearly completely
        preserved; long bones solid.
      completeness: partial
      notes: Cope (1889) gives no number. Lull and Wright (1942) give the
        holotype as AMNH 3971, as does Brett-Surman's (1989) specimen table;
        his text's "AMNH 3791" transposes the digits.
    erected_in: cope1889a
references:
  - id: lull1942a
    notes: Gives the holotype as "No. 3971 A.M.N.H. Greater part of skeleton,
      without skull or teeth".
  - id: cope1889a
  - id: brett-surman1989a
    notes: Suggested the Pteropelyx type material is from Corythosaurus, making Pteropelyx a senior synonym.
  - id: horner2004a
    notes: Lists Pteropelyx grallipes among the hadrosaurid nomina dubia.
