genus: Pteropelyx
parent: Hadrosauridae
etymology: From Greek pteron (wing) and pelyx (pelvis); meaning "winged pelvis".
pronunciation:
  phonetic: teh-ROP-uh-liks
description: Pteropelyx is a dubious genus of Late Cretaceous hadrosaurid
  dinosaur from the Judith River Formation of Montana, named by Edward Drinker
  Cope in 1889. Historically, several species were assigned to it, all based on
  extremely fragmentary remains, but there is no evidence to support these
  assignments, making the type species, P. grallipes, the only valid species.
  Most of these other species' remains likely belong to better-known hadrosaurs,
  such as Lambeosaurus and Gryposaurus. It is probable that the type material of
  Pteropelyx, a skeleton lacking a skull, is from Corythosaurus (making
  Pteropelyx its senior synonym) (Brett-Surman, 1989), but the lack of a skull
  makes such a synonymy impossible to determine with sure certainty as no
  certain evidence pertain to prove the organ to be present.
dispute:
  summary: >
    Pteropelyx is a nomen dubium based on a postcranial holotype lacking
    a skull; it has been suggested to be referable to Corythosaurus but
    cannot be confirmed.
  history:
    - date: "2026-06-27"
      note: Placed at Hadrosauridae incertae sedis; nomen dubium.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Ilium elongate and compressed, terminating in flat, narrow plates fore and
    aft
  - Pubis slender with very small, short shaft; pectineal process extremely long
    and expanded distally in vertical plane
  - Ischium very slender, coossified proximally with pubis
  - Astragalus not united with tibia; tibia lacking fibular facet on distal
    surface
  - Anterior process of ilium longer than posterior, more compressed, narrow
    vertically, perfectly flat, with superficial longitudinal ridges
  - Neural spines of dorsal vertebrae elongate, some touching each other
  - Fibula very slender; metatarsals very robust
appearance:
  integument: scaled
  evidence: inferred
