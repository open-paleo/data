genus: Patagopelta
parent: Nodosauridae
pronunciation:
  phonetic: pat-uh-GOH-PEL-tuh
etymology: Named after Patagonia, the region in Argentina where it was found, combined with Latin pelta (shield); meaning "Patagonian shield".
description: Patagopelta is an extinct genus of ankylosaurian dinosaur from the
  Late Cretaceous (upper Campanian-lower Maastrichtian) Allen Formation of
  Argentina. The genus contains a single species, P. cristata, known from
  several partial skeletons, isolated bones, and osteoderms. While originally
  described as a member of the family Nodosauridae, later discoveries provided
  support for parankylosaurian affinities. Patagopelta is a small armored
  dinosaur, comparable in size to the 'dwarf' nodosaurid Struthiosaurus, at
  about 2 m (6.6 ft) long. It is larger, more robust, and more heavily armored
  than other parankylosaurs such as Stegouros.
dispute:
  summary: >
    The placement of Patagopelta is contested. Its describers recover it as
    a nodosaurine nodosaurid (Riguetti and colleagues, 2022), whereas
    Soto-Acuña and colleagues (2024) recovered it within Parankylosauria, a
    result they attribute to their changes to the matrix, and Maidment and
    colleagues (2025) recover it as a non-eurypodan thyreophoran or an early
    ankylosaur, depending on the tree.
  history:
    - date: "2026-06-26"
      note: Placed at Nodosauridae, with a recovered-as-parankylosaurian alternative noted.
    - date: "2026-10-20"
      note: >
        Alternatives credited to Soto-Acuña and colleagues (2024) and
        Maidment and colleagues (2025).
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
appearance:
  features:
    - body armor
    - osteoderms
  integument: armored
diagnostic_features:
  - Femur with strongly developed muscular crests and a prominent anterior
    trochanter on its anterior surface
  - Cervical half-ring bearing high-keeled lateral osteoderms with a central
    inflection
  - Cervical half-ring bearing distal, spine-like osteoderms with anteriorly
    compressed edges
  - Cervical half-ring osteoderms fused across their basal edges, forming a
    thick band with strongly sutured contacts
