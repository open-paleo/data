  phonetic: proh-tog-NAY-tho-SAWR-us
etymology: From Greek protos (first, early) and gnathos (jaw) and sauros
  (lizard); meaning "early jaw lizard".
description: Protognathosaurus is a genus of herbivorous sauropod dinosaur from
  the Middle Jurassic Lower Shaximiao Formation in Sichuan, present-day China.
diet: herbivore
locomotion: quadrupedal
