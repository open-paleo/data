genus: Prenoceratops
parent: Leptoceratopsidae
etymology: From Greek prene- (πρηνή, 'bent forwards' or 'prone'), cerat- (κερατ-, 'horn'), and ops (ωψ, 'face'), meaning 'bent or prone-horned face'
pronunciation:
  phonetic: PREE-no-SEH-ruh-tops
description: Prenoceratops, (meaning 'bent or prone-horned face' and derived
  from Greek prene-/πρηνη- meaning 'bent forwards' or 'prone', cerat-/κερατ-
  meaning 'horn' and -ops/ωψ meaning 'face') is a genus of herbivorous
  ceratopsian dinosaur from the Late Cretaceous Period. It was a relatively
  small dinosaur, reaching 1.3 m (4.3 ft) in length and 20 kg (44 lb) in body
  mass. Its fossils have been found in the upper Two Medicine Formation in the
  present-day U.S. state of Montana, in Campanian age rock layers that have been
  dated to 74.3 million years ago. Fossils were also found in the Oldman
  Formation in the modern day Canadian province of Alberta, dating to around 77
  million years ago.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Caudally oriented external naris
  - Maxillary projection instead of maxillary shelf
  - Rostral position of pterygoid-maxilla contact
  - Constricted caudal portion of nasal
  - Deep sharp frontal depression with straight transverse border
  - Postorbital bar narrow in dorsal view, tall in lateral view
  - Wide triangular jugal with rostral curvature of ventral tip
  - Quadratojugal tall and compressed mediolaterally and rostrocaudally
  - Very gracile surangular
  - Reduced articular with corresponding inequality of quadrate condyles
  - Entirely convex dorsal border of articular
  - Reduced caudal expansion of coronoid
