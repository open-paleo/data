genus: Pisanosaurus
parent: Ornithischia
pronunciation:
  ipa: /pɪˌsænəˈsɔːrəs/
  phonetic: piss-AN-ə-SOR-əs
etymology: Named in honor of Argentine paleontologist Juan Pisano (Museo de
  La Plata), with Greek 'sauros' (lizard); meaning 'Pisano's lizard'.
description: Pisanosaurus is an extinct genus of early dinosauriform, likely an
  ornithischian or silesaurid, from the Late Triassic of Argentina. It was a
  small, lightly built, ground-dwelling herbivore, that could grow up to an
  estimated 1 m (3.3 ft) long. Only one species, the type, Pisanosaurus mertii,
  is known, based on a single partial skeleton discovered in the Ischigualasto
  Formation of the Ischigualasto-Villa Unión Basin in northwestern Argentina.
  This part of the formation has been dated to the late Carnian, approximately
  229 million years ago.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Cheek teeth closely packed with subcylindrical, non-laterally-compressed
    crowns forming a continuous beveled occlusal wear surface.
  - Tooth row strongly inset from the lateral border of the dentary.
  - Mandible with well-developed adductor fossa and articular condyle
    positioned well below the level of the tooth row.
  - Tibia with strong cnemial crest and shaft twisted approximately 90 degrees
    between proximal and distal axes.
  - Astragalus with prominent dorsal ascending process fitting into a distal
    cavity of the tibia; bilobate in distal view.
  - Metatarsal III markedly longer and stronger than metatarsal IV
    (metatarsal-III-to-tibia ratio ~59%).
