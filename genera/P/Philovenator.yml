genus: Philovenator
parent: Troodontinae
dispute:
  summary: >
    Philovenator (originally described from a juvenile once referred to
    Saurornithoides) is recovered as a derived troodontine, close to Linhevenator,
    by most analyses (Tsuihiji et al., 2014; van der Reest and Currie, 2017;
    Hartman et al., 2019; Jones et al., 2026), the placement adopted here. Sellés
    et al. (2021) instead recover it within Jinfengopteryginae.
  history:
    - date: "2026-07-01"
      note: Moved from Jinfengopteryginae to Troodontinae following the prevailing view (Hartman et al., 2019; van der Reest and Currie, 2017); the jinfengopterygine alternative (Sellés et al., 2021) noted.
etymology: From Greek philos (loving) and Latin venator (hunter); literally
  meaning "love hunter".
pronunciation:
  phonetic: FIH-lo-VEN-uh-tuh
description: Philovenator is an extinct genus of troodontid paravian dinosaurs
  from the Wulansuhai Formation (dated to the Campanian age, sometime between 75
  and 71 million years ago) of Inner Mongolia, China. Its specific name honors
  Phillip J. Currie.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - arid
diagnostic_features:
  - Prominent process on medial side of femoral shaft slightly proximal to
    distal end
  - Sheet-like tibial cnemial crest that expands significantly anteriorly
  - Astragalo-calcaneal hemicondyles deep anteroposteriorly, separated by deep
    narrow groove
  - Proportionally extremely long and slender tarsometatarsus (ratio 1.25 femur
    length, ratio 22.0 length/width)
  - Anteroposterior depth much greater than transverse width at tarsometatarsus
    mid-shaft
  - Prominent elongate posterior flange on metatarsal IV, about equal in depth
    to metatarsal shaft
appearance:
  integument: feathered
  evidence: direct
