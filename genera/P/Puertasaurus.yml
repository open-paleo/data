genus: Puertasaurus
parent: Lognkosauria
etymology: Named for Pablo Puerta, one of the field workers who discovered the
  fossil specimen, combined with Greek '-saurus' meaning 'lizard'.
description: Puertasaurus is a genus of sauropod dinosaur that lived in South
  America during the Late Cretaceous Period. It is known from a single specimen
  recovered from sedimentary rocks of the Cerro Fortaleza Formation in
  southwestern Patagonia, Argentina, which probably is Campanian or
  Maastrichtian in age. The only species is Puertasaurus reuili. Described by
  the paleontologist Fernando Novas and colleagues in 2005, it was named in
  honor of Pablo Puerta and Santiago Reuil, who discovered and prepared the
  specimen. It consists of four well-preserved vertebrae, including one
  cervical, one dorsal, and two caudal vertebrae. Puertasaurus is a member of
  Titanosauria, the dominant group of sauropods during the Cretaceous.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Cervical neural spine considerably inflated, transversally wider than
    vertebral centrum
  - Cervical neural spine bearing strong dorsolateral ridges
  - Caudal cervicals with spinoprezygapophyseal laminae transversely thick and
    dorsoventrally deep
  - Cranial dorsal vertebrae extremely short with centrum width/centrum length
    ratio of 1 (unique among titanosauriforms)
  - Gigantic size with dorsal 2 measuring 168 cm transverse width
