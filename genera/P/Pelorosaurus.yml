genus: Pelorosaurus
parent: Titanosauriformes
placement: incertae sedis
erected_in: mantell1850a
etymology: From Greek pelor ("monster") and sauros ("lizard");
  meaning "monstrous lizard". Mantell explicitly chose the
  name to indicate the enormous magnitude of the humerus he
  described.
pronunciation:
  ipa: /pəˌlɒroʊˈsɔːrəs/
  phonetic: pe-LOH-ro-SOR-us
description: >
  Pelorosaurus is a genus of titanosauriform sauropod dinosaur.
  Remains referred to Pelorosaurus date from the Early
  Cretaceous period, about 140-125 million years ago, and have
  been found in England. Thomas Holtz estimated its length at
  24 m (79 ft). The name Pelorosaurus was one of the first to
  be given to any sauropod. Many species have been assigned to
  the genus historically, but most are currently considered to
  belong to other genera. The type species is Pelorosaurus
  brevis (Owen, 1842); the long-used name P. conybeari
  (Mantell, 1850) is a junior objective synonym based on the
  same Cuckfield type material.
diet: herbivore
locomotion: quadrupedal
diagnostic_features:
  - Humerus with large medullary canal (transverse diameter 3 inches),
    distinguishing it from Cetiosaurus and Polyptychodon whose long bones lack a
    medullary cavity
  - Anterior caudal vertebrae with subquadrangular articulating facets and
    notably short antero-posterior diameter relative to transverse and vertical
    diameters
  - Neural arch anchylosed to anterior half of centrum only, leaving posterior
    part of upper surface of body uncovered
  - Anterior oblique processes project directly forwards over the body of the
    adjacent vertebra; posterior oblique processes absent, replaced by
    depressions on the spinous process
  - Distal caudal vertebra with chevron bone (haemapophysis) anchylosed
    (confluent) to the centrum rather than articulated by distinct facets
paleoenvironment:
  - fluvial
  - coastal
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "38678"
  - source: wikidata
    id: Q1067635
  - source: gbif
    id: "4822842"
  - source: eol
    id: "4531374"
synonyms:
  - name: Colossosaurus
    type: nomen nudum
    reason: Mantell intended to use the name "Colossosaurus" in
      November 1849 for the Cetiosaurus brevis material, but on
      discovering that Greek 'kolossos' meant 'statue' rather
      than 'giant' he changed the name to Pelorosaurus before
      formal publication. The replacement Pelorosaurus appeared
      in Mantell (1850); Colossosaurus was never validly
      published.
species:
  - name: Pelorosaurus brevis
    etymology: From Latin 'brevis' meaning 'short'.
    status: nomen dubium
    type_species: true
    period:
      name:
        - Early Cretaceous
      stage:
        - Valanginian
        - Hauterivian
    location:
      country: GB
      region: GB-WSX
      formation: Grinstead Clay
      locality: Tilgate Forest
    size:
      length_m:
        min: 24
        max: 24
    type_specimen:
      specimen_id:
        - NHMUK PV R 2544
        - NHMUK PV R 2545
        - NHMUK PV R 2546
        - NHMUK PV R 2547
        - NHMUK PV R 2548
        - NHMUK PV R 2549
        - NHMUK PV R 2550
      specimen_type: syntype
      institution: NHMUK
      material: Four proximal caudal vertebrae (R2544-R2547) and three chevrons
        (R2548-R2550) from Cuckfield; the Isle of Wight material originally
        included by Owen was subsequently shown to be iguanodontian and removed.
      completeness: fragmentary
    synonyms:
      - name: Pelorosaurus conybeari
        type: junior objective
        reason: Melville (1849) coined 'Cetiosaurus' conybeari for the Cuckfield
          sauropod component of 'C.' brevis, but this was inadmissible as brevis
          remained available for the same type material; Mantell's Pelorosaurus
          conybeari (1850), which referred the associated humerus, is therefore a
          junior objective synonym of the senior 'C.' brevis, which has priority.
    erected_in: owen1842a
notable_specimens:
  - specimen_id: [NHMUK PV OR 28626]
    institution: NHMUK
    species: Pelorosaurus brevis
    category: historic
    significance: A large right humerus (~54 inches) from Cuckfield; Mantell (1850)
      made it the basis of the new genus Pelorosaurus, one of the first sauropods
      recognized. A referred specimen, not the name-bearing type; lacking
      autapomorphies, it is referred to Titanosauriformes incertae sedis.
    references: [mantell1850a, taylor2007a]
references:
  - id: mantell1850a
    notes: Erects Pelorosaurus on a large humerus from Tilgate Forest (read 14
      Feb 1850); tentatively refers caudals from Owen's Cetiosaurus brevis
      material to the new genus.
  - id: owen1842a
    notes: Erects Cetiosaurus brevis on dorsal and caudal vertebrae from the
      Wealden of Tilgate Forest and Cuckfield; interpreted as a gigantic marine
      reptile, not a dinosaur.
  - id: melville1849a
    notes: Restricts Owen's C. brevis to four anterior caudal vertebrae, removes
      the iguanodont elements, and renames the sauropod material Cetiosaurus
      conybeari.
  - id: taylor2007a
    notes: Treats P. conybeari and C. brevis as objective synonyms with C.
      brevis having priority; flags an intended ICZN petition to suppress C.
      brevis and conserve P. conybeari (later not pursued).
