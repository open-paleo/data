    erected_in: mantell1850a
references:
  - id: mantell1850a
    notes: Erects Pelorosaurus on a large humerus from Tilgate Forest (read 14
      Feb 1850); tentatively refers caudals from Owen's Cetiosaurus brevis
      material to the new genus.
  - id: owen1842a
    notes: Erects Cetiosaurus brevis on dorsal and caudal vertebrae from the
      Wealden of Tilgate Forest and Cuckfield; interpreted as a gigantic marine
      reptile, not a dinosaur.
  - id: melville1849a
    notes: Restricts Owen's C. brevis to four anterior caudal vertebrae, removes
      the iguanodont elements, and renames the sauropod material Cetiosaurus
      conybeari.
  - id: taylor2007a
    notes: Treats P. conybeari and C. brevis as objective synonyms with C.
      brevis having priority; flags an intended ICZN petition to suppress C.
      brevis and conserve P. conybeari (later not pursued).
