synonyms:
  - name: Colossosaurus
    type: nomen nudum
    reason: Mantell intended to use the name "Colossosaurus" in
      November 1849 for the Cetiosaurus brevis material, but on
      discovering that Greek 'kolossos' meant 'statue' rather
      than 'giant' he changed the name to Pelorosaurus before
      formal publication. The replacement Pelorosaurus appeared
      in Mantell (1850); Colossosaurus was never validly
      published.
species:
  - name: Pelorosaurus conybeari
    etymology: Named in honor of William Conybeare. Mantell
      originally wrote the species "Conybearei"; under ICZN
      priority of the original spelling this is corrected to
      "conybeari".
    status: nomen dubium
    type_species: true
