genus: Polacanthus
parent: Nodosauridae
pronunciation:
  phonetic: pol-a-KAN-thus
etymology: From Ancient Greek polys (πολύς, 'many') and akantha (ἄκανθα, 'thorn'
  or 'prickle'), meaning 'many thorns', referring to the numerous spikes on its
  body
description: Polacanthus is an extinct genus of ankylosaurian dinosaurs from the
  early Cretaceous (130-125 million years ago) of England. Several species have
  been named in the genus Polacanthus, but only the type species, Polacanthus
  foxii, is currently seen as valid. There are not many fossil remains of this
  dinosaur, and some important anatomical features, such as its skull, are
  poorly known. It grew to about 4-5 meters (13-16 ft) long. Its body was
  covered with armor plates and spikes. It may be a basal member of the
  Nodosauridae or part of a separate family, the Polacanthidae.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Long armor-plates of bone covering body except back
  - Large bony shield protecting back
  - Spine-like bones running along sides of body and tail
appearance:
  features:
    - osteoderms
    - shoulder spikes
  integument: armored
  evidence: direct
