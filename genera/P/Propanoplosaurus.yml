genus: Propanoplosaurus
parent: Nodosauridae
etymology: From Latin prefix 'pro-' (before) combined with the genus name Panoplosaurus, meaning 'before Panoplosaurus', reflecting that it lived earlier than but resembled Panoplosaurus.
pronunciation:
  phonetic: PRO-pan-OP-lo-SOR-us
description: Propanoplosaurus is a genus of herbivorous nodosaurid dinosaur from
  the Early Cretaceous Patuxent Formation of Maryland, USA. Its type specimen is
  a natural cast and partial natural mold of a hatchling.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - deltaic
  - fluvial
diagnostic_features:
  - Relatively narrow rostrum compared to Panoplosaurus mirus
  - Large, well-delimited, rostrally-placed triangular ornamentation on dorsum
    of skull
  - Shorter skull roof with more caudally-placed frontoparietal-midline
    intersection
  - Large but undifferentiated circumorbital ornamentation
appearance:
  features:
    - body armor
  integument: armored
  evidence: direct
