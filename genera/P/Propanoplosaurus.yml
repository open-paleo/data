genus: Propanoplosaurus
parent: Nodosauridae
etymology: From Latin prefix 'pro-' (before) combined with the genus name Panoplosaurus, meaning 'before Panoplosaurus', reflecting that it lived earlier than but resembled Panoplosaurus.
pronunciation:
  phonetic: PRO-pan-OP-lo-SOR-us
description: Propanoplosaurus is a genus of herbivorous nodosaurid dinosaur from
  the Early Cretaceous Patuxent Formation of Maryland, USA. Its type specimen is
  a natural cast and partial natural mold of a hatchling.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - deltaic
  - fluvial
diagnostic_features:
  - Relatively narrow rostrum compared to Panoplosaurus mirus
  - Large, well-delimited, rostrally-placed triangular ornamentation on dorsum
    of skull
  - Shorter skull roof with more caudally-placed frontoparietal-midline
    intersection
  - Large but undifferentiated circumorbital ornamentation
appearance:
  features:
    - body armor
  integument: armored
  evidence: direct
identifiers:
  - source: pbdb
    id: "288407"
  - source: wikidata
    id: Q1931846
species:
  - name: Propanoplosaurus marylandicus
    etymology: "Named for Maryland, the U.S. state where the holotype was found in the Patuxent Formation, with the Latin suffix '-icus' meaning 'of' or 'from'."
    status: valid
    type_species: true
    period:
      name:
        - Early Cretaceous
      stage:
        - Aptian
    location:
      country: US
      locality: Prince George's County
      region: US-MD
      formation: Patuxent
    type_specimen:
      specimen_id: [USNM 540686]
      specimen_type: holotype
      institution: USNM
      material: Dorsal surface of the head and ventral surface of the body of a neonatal
        nodosaurid preserved as impressions and natural casts. 130 mm long specimen with
        impressions of skull roof, radius, ulna, and manus; vertebral column and ribs
        preserved as casts.
      completeness: partial
    erected_in: stanford2011a
references:
  - id: stanford2011a
  - id: jones2026a
    notes: Source of the appearance features.
