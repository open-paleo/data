genus: Panoplosaurus
parent: Nodosauridae
pronunciation:
  phonetic: PAN-o-plo-SAWR-us
etymology: From Greek 'panoplos' meaning 'fully armored' or 'well-armored' and
  '-saurus' meaning 'lizard', referring to its extensive armor plating.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - coastal
appearance:
  features:
    - osteoderms
    - body armor
  integument: armored
diagnostic_features:
  - Vomers laterally swollen, enclosing a hollow median canal in mature
    individuals or a deep ventral groove in juveniles
  - Median narial caputegulum with a laterally extending wedge separating the
    nares (or supranarial caputegulae) from the nasal caputegulae
  - Four or five nasal caputegulae in two paired rows forming transverse bands
    across the muzzle (five when the internasal caputegulum is present)
  - Lacrimal caputegulae small, contacting the nasal caputegulae medially and
    not extending over the dorsal skull surface
  - Postorbital boss covered by numerous small, randomly arranged caputegulae
  - Basal tubera anterolaterally oriented, separated by a shallow median
    depression on the ventral surface of the basioccipital
