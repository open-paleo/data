genus: Panoplosaurus
parent: Nodosauridae
pronunciation:
  phonetic: PAN-o-plo-SAWR-us
etymology: From Greek 'panoplos' meaning 'fully armored' or 'well-armored' and
  '-saurus' meaning 'lizard', referring to its extensive armor plating.
description: Panoplosaurus is a genus of armored dinosaur from the Late
  Cretaceous of Alberta, Canada. Few specimens of the genus are known, all from
  the middle Campanian of the Dinosaur Park Formation, roughly 76 to 75 million
  years ago. It was first discovered in 1917, and named in 1919 by Lawrence
  Lambe, named for its extensive armor, meaning "well-armored lizard".
  Panoplosaurus has at times been considered the proper name for material
  otherwise referred to as Edmontonia, complicating its phylogenetic and
  ecological interpretations, at one point being considered to have existed
  across Alberta, New Mexico and Texas, with specimens in institutions from
  Canada and the United States. The skull and skeleton of Panoplosaurus are
  similar to its relatives, but have a few significant differences, such as the
  lumpy form of the skull osteoderms, a completely fused shoulder blade, and
  regularly shaped plates on its neck and body lacking prominent spines. It was
  a quadrupedal animal, roughly 5 m (16 ft) long and 1,600 kg (3,500 lb) in
  weight. The skull has a short snout, with a very domed surface, and bony
  plates directly covering the cheek. The neck had circular groups of plates
  arranged around the top surface, both the forelimb and hindlimb were about the
  same length, and the hand may have only included three fingers. Almost the
  entire surface of the body was covered in plates, osteoderms and scutes of
  varying sizes, ranging from large elements along the skull and neck, to
  smaller, round bones underneath the chin and body, to small ossicles that
  filled in the spaces between other, larger osteoderms.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - coastal
appearance:
  features:
    - osteoderms
    - body armor
  integument: armored
diagnostic_features:
  - Skull depressed, broadly triangular from above, ending narrowly and squarely
    in front, entirely enclosed in large bony plates and scutes
  - Nostrils latero-terminal; orbits placed far back; infratemporal fossae
    directed backward
  - Teeth with laterally compressed, moderately high, serrated crown borne on a
    long sub-cylindrical root, crown externally concave with pronounced cingulum
  - Atlas, axis, and third cervical vertebrae coossified
  - Dorsal neck armor formed by transversely paired, low-keeled plate-like
    scutes in a longitudinal series
  - Principal lateral scutes of neck and trunk strongly keeled, arranged in
    longitudinal rows
