genus: Petrustitan
parent: Eutitanosauria
pronunciation:
  phonetic: PEE-trus-TIE-tan
etymology: "From Ancient Greek 'pétra' meaning 'stone/rock' (referring to the rocky outcrops of the type locality, Sânpetru) and 'titán' meaning 'giant', a common suffix used when naming titanosaurian sauropods."
description: Petrustitan is a eutitanosaurian sauropod dinosaur from the Late
  Cretaceous (Maastrichtian) of Romania. The type and only species is P.
  hungaricus, originally assigned to the genus Magyarosaurus.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Tibia drawn out into slender laterodistal process inserting into socket on
    distal fibula medial surface
  - Fibula proximal end with subtriangular outline
  - Posterodistally oriented accessory ridge on fibula lateral surface,
    extending from midlength to one-quarter length from distal end
