genus: Phuwiangosaurus
parent: Euhelopodidae
pronunciation:
  phonetic: POO-WYAHNG-o-SAWR-us
etymology: Named after the Phu Wiang area of Thailand where the fossil was
  discovered, combined with Greek sauros (lizard); meaning "Phu Wiang lizard".
description: Phuwiangosaurus is a genus of titanosauriform dinosaur from the
  Early Cretaceous (Valanginian-Hauterivian) Sao Khua Formation of Thailand. The
  type species, P. sirindhornae, was described by Martin, Buffetaut, and
  Suteethorn in a 1993 press release and was formally named in 1994. The species
  was named to honor Princess Maha Chakri Sirindhorn of Thailand, who was
  interested in the geology and paleontology of Thailand, while the genus was
  named after the Phu Wiang area, where the fossil was discovered. The precise
  affinities of Phuwiangosaurus among titanosauriform sauropods are uncertain,
  though several studies have classified it as a euhelopodid.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Medium-sized sauropod 15-20 m long
  - Anterior cervical vertebrae with very low and wide neural arch, showing
    dorsoventral flattening rather than transverse compression
  - Posterior cervical vertebrae with high, widely bifurcated neural spine
    without median spine
  - Large zygapophyses situated low and far from each other, strongly diverging
    laterally from centrum
  - Posterior dorsal vertebrae opisthocoelous with deep pleurocoel and
    well-developed laminae/cavities system
  - Posterior dorsal vertebrae with unbifurcated, elongated neural spine, long
    diapophyses directed more dorsally than laterally
  - Hyposphene-hypantrum system present
  - Femur flattened anteroposteriorly with fourth trochanter crest-shaped,
    located medially above midlength of shaft
  - Very developed lateral epicondyle at distal end of femur
