genus: Protathlitis
parent: Baryonychinae
dispute:
  summary: >
    Protathlitis cinctorrensis was described as a basal baryonychine
    (Santos-Cubedo et al., 2023) and treated as a valid baryonychine by Jones
    (2026), but Rauhut et al. (2025) regard it as a probably chimeric nomen
    dubium whose spinosaurid affinities are questionable.
  history:
    - date: "2026-07-01"
      note: Placed at Baryonychinae following the describing analysis; retained as valid pending resolution of the nomen-dubium/chimera hypothesis of Rauhut et al. (2025).
pronunciation:
  phonetic: pro-TATH-li-tis
etymology: From Greek protathlitis (champion); meaning "champion".
description: Protathlitis is a potentially dubious and chimeric genus of
  theropod dinosaur from the Early Cretaceous (Barremian) Arcillas de Morella
  Formation of Castellón, Spain. The type and only species is Protathlitis
  cinctorrensis, known from a partial skeleton. It was originally identified as
  a basal member of the Baryonychinae. If a spinosaurid identity of the material
  is correct, its discovery, as well as those of the spinosaurids
  Camarillasaurus, Iberospinus, Riojavenatrix, and the contemporary
  Vallibonavenatrix shows that the Iberian Peninsula held a diverse assemblage
  of these theropods during the Early Cretaceous.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Subcircular depression in anterior corner of antorbital fossa in maxilla
    (autapomorphy)
  - Transverse process of caudal vertebrae with only two fossae and one
    buttress, posteriorly oriented
  - Caudal vertebrae centra with narrow ventral groove
  - Articular facets of caudal vertebrae clearly oval in outline
  - Prezygapophyses and postzygapophyses projected beyond anterior and posterior
    rims of centrum
  - No hyposphene below postzygapophysis
