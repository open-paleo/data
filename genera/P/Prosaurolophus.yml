genus: Prosaurolophus
parent: Saurolophini
etymology: From Greek pro (before) and the genus name Saurolophus (crested
  lizard); meaning "before Saurolophus", referring to it being an earlier
  dinosaur with a similar head crest.
pronunciation:
  phonetic: PROH-saw-ROL-o-fus
  ipa: /ˌproʊsɔːˈrɒləfəs/
description: Prosaurolophus is a genus of hadrosaurid (or duck-billed) dinosaur
  from the Late Cretaceous of North America. It is known from the remains of at
  least 25 individuals, including skulls and skeletons, but this remains
  obscure. Its fossils have been found in the late Campanian-aged Dinosaur Park
  Formation in Alberta, and the roughly contemporaneous Two Medicine Formation
  in Montana, dating to around 75.7 to 74.1 million years ago. Its most
  recognizable feature is a small solid crest formed by the nasal bones,
  sticking up in front of the eyes.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
diagnostic_features:
  - Skull large, high, and elongate
  - Incipient crest short, erect, directly above the eye, formed by prefrontals,
    frontals and nasals
  - Frontals excluded from the border of the orbit
  - Beak long and spatulate
  - Crest comparatively low, short anteroposteriorly, slightly curved forward at
    apex
  - Crest derived from anterior lateral border of frontals, supported by
    prefrontals and nasals
