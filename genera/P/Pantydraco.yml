genus: Pantydraco
parent: Sauropodomorpha
pronunciation:
  ipa: /ˌpæntɪˈdreɪkoʊ/
  phonetic: pant-ee-DRAY-koh
etymology: From the Pant-y-ffynnon quarry in South Wales (Welsh for 'hollow of
  the spring/well') and Latin draco ('dragon')
description: "Pantydraco is a genus of basal sauropodomorph dinosaur from the
  Late Triassic of the United Kingdom (Wales). It is based on a partial juvenile
  skeleton once thought to belong to Thecodontosaurus. Only one valid species of
  Pantydraco is recognized: P. caducus."
diet: omnivore
locomotion: bipedal
paleoenvironment:
  - wetland
diagnostic_features:
  - Pseudopleurocoel (pneumatic opening) on neurocentral suture of cervical
    vertebrae 6-8
  - Small tubercle medial to head on humerus
  - Anteroposteriorly low asymmetrical deltopectoral crest with apex at 40% of
    humeral length
appearance:
  features:
    - enlarged manual claws
  integument: scaled
  evidence: inferred
