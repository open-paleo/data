references:
  - id: novas1996a
    notes: Erects Patagonykus puertai with a diagnosis, designated holotype and
      type horizon. A 1994 congress abstract used the name earlier; Novas credits
      this paper, here and again in 1997.
  - id: novas1997b
    notes: Full anatomical description. Places the quarry 500 m northwest of
      National Route 22, and ranks Portezuelo a member of the Rio Neuquen
      Formation, the scheme Leanza and colleagues later revised.
  - id: leanza2004a
    notes: Source of the formation rank followed here, in which Portezuelo is a
      formation within the Rio Neuquen Subgroup; names Patagonykus puertai from
