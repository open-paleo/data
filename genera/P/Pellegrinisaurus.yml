genus: Pellegrinisaurus
parent: Saltasauroidea
pronunciation:
  phonetic: pel-e-GREEN-ee-SAWR-us
etymology: Named after Pellegrini Lake (Lago Pellegrini) in Río Negro Province,
  Argentina, where the holotype was found, combined with Greek sauros meaning
  'lizard'; meaning 'Pellegrini lizard'
description: Pellegrinisaurus is a genus of titanosaurian sauropod dinosaur that
  lived in South America during the Late Cretaceous period. The holotype was
  found in the Allen Formation, Argentina.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
appearance:
  integument: scaled
  evidence: inferred
diagnostic_features:
  - Transverse width of the centrum of the posterior dorsal vertebrae
    approximately twice the maximum dorsoventral depth
  - Dorsal centra strongly depressed
  - Midposterior and posterior caudal vertebrae with anteroposteriorly elongated
    and dorsoventrally depressed neural spines
  - In midposterior and posterior caudals, the anterior end of the neural spine
    is positioned higher than the posterior end
