genus: Pilmatueia
parent: Dicraeosauridae
etymology: "Named after the Pilmatué locality in Neuquén Province, Argentina, where the fossils were discovered."
pronunciation:
  phonetic: pil-mah-TU-wee-uh
description: Pilmatueia is a genus of diplodocoid sauropods belonging to the
  family Dicraeosauridae that lived during the Early Cretaceous in what is now
  Argentina. Its type and only species is Pilmatueia faundezi. Pilmatueia was
  probably closely related to other South American dicraeosaurids such as
  Amargasaurus. Like other dicraeosaurids, Pilmatueia was relatively small for a
  sauropod. The vertebrae of Pilmatueia were more extensively hollowed out by
  air sacs than in other dicraeosaurids, which otherwise were characterized by a
  reduction in the air sac system compared to other sauropods. Pilmatueia dates
  to the Valanginian, an age of the Cretaceous period for which dinosaur faunas
  are poorly known.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Cervico-dorsal vertebrae with dorsoventrally oriented ridges on anterior
    surfaces of anterior centrodiapophyseal laminae
  - Posterior dorsal vertebrae with deep fossae at bases of bifid neural spines
    separated by thick, low sagittal lamina
  - Unique pair of small fossae at bases of bifid neural spines in posterior
    dorsal region (absent in Dicraeosaurus and Amargasaurus)
  - Mid- and posterior cervical vertebrae with bifid ventral keels connecting
    posterolaterally to ventrolateral edges of centra
appearance:
  features:
    - bifurcated cervical spines
