genus: Pilmatueia
parent: Dicraeosauridae
description: Pilmatueia is a genus of diplodocoid sauropods belonging to the
  family Dicraeosauridae that lived during the Early Cretaceous in what is now
  Argentina. Its type and only species is Pilmatueia faundezi. Pilmatueia was
  probably closely related to other South American dicraeosaurids such as
  Amargasaurus. Like other dicraeosaurids, Pilmatueia was relatively small for a
  sauropod. The vertebrae of Pilmatueia were more extensively hollowed out by
  air sacs than in other dicraeosaurids, which otherwise were characterized by a
  reduction in the air sac system compared to other sauropods. Pilmatueia dates
  to the Valanginian, an age of the Cretaceous period for which dinosaur faunas
  are poorly known.
diet: herbivore
locomotion: quadrupedal
