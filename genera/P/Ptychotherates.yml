genus: Ptychotherates
parent: Saurischia
dispute:
  summary: >
    Ptychotherates bucculentus is the type taxon of Morphoraptora, recovered
    within Herrerasauria as sister to Herrerasauridae by Srivastava and
    others (2026); the position of this clade relative to Theropoda is
    unresolved across analyses.
  history:
    - date: "2026-06-30"
      note: >
        Placed at Saurischia.
    - date: "2026-07-02"
      note: >
        Confirmed placement at Saurischia incertae sedis; the position of
        Morphoraptora relative to Theropoda is unresolved.
pronunciation:
  phonetic: TY-koh-THERR-uh-teez
etymology: From Greek 'ptycho' meaning 'fold', referring to the many
  challenging reorientation axes on the holotype skull elements, and Greek
  'therates' meaning 'hunter', for the inferred carnivorous habits.
description: Ptychotherates is an extinct genus of saurischian dinosaur
  known from the Late Triassic (latest Norian or Rhaetian) Chinle Formation
  at the Coelophysis Quarry, Ghost Ranch, New Mexico. The genus contains a
  single species, Ptychotherates bucculentus, known from a partial skull
  whose jugal is the proportionally deepest of any known Triassic-aged
  dinosaur. The describing paper recovers Ptychotherates as a close
  relative of Tawa, Chindesaurus, and Daemonosaurus.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Prefrontal symmetrical in lateral view (anterior and posterior portions
    subequal in length).
  - "Jugal body proportionally dorsoventrally deepest of any known Triassic-aged
    dinosaur: depth more than three times the height of the jugal posterior
    process, greater than half the height of the quadrate main body, and close
    to the length of the postorbital ventral process."
  - Laterally extensive ventral process (crista interfenestralis) of the
    otoccipital.
  - Ventral process of squamosal anteroposteriorly wide with a lateral fossa on
    its posterior part.
  - Retroarticular process upturned immediately posterior to the glenoid.
  - Posttemporal fenestra approximately as wide as the foramen magnum.
