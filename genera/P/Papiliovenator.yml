genus: Papiliovenator
parent: Troodontidae
pronunciation:
  phonetic: puh-PIL-ee-oh-ven-AY-tor
etymology: "From Latin 'papilio' meaning 'butterfly', referring to the butterfly-shaped feature on its first two dorsal vertebrae, combined with Latin 'venator' meaning 'hunter'."
description: Papiliovenator is a genus of troodontid theropod dinosaur from the
  Bayan Mandahu Formation of Inner Mongolia, China. The type and only species is
  Papiliovenator neimengguensis.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - arid
diagnostic_features:
  - Lateral groove of the dentary not posteriorly expanded
  - Deep surangular fossa hosting the surangular foramen anteroventral to the
    glenoid fossa
  - Ventral ridge of the surangular fossa mainly on the surangular
  - Anterolaterally broadened and butterfly-shaped neural arches of first and
    second dorsal vertebrae in dorsal view
  - Unserrated teeth
  - Proportionally longer humeri (>50% skull length)
  - Less mediolaterally compressed metatarsus
appearance:
  integument: feathered
  evidence: direct
