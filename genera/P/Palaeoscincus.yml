genus: Palaeoscincus
parent: Ankylosauria
placement: incertae sedis
pronunciation:
  phonetic: PAY-lee-o-SINK-us
etymology: From Greek 'palaios' meaning 'ancient' and 'skinkos' meaning 'lizard'
  (related to skink); translates as 'ancient lizard'.
description: Palaeoscincus is a dubious genus of ankylosaurian dinosaur based on
  teeth from the mid-late Campanian-age Upper Cretaceous Judith River Formation
  of Montana. Like several other dinosaur genera named by Joseph Leidy
  (Deinodon, Thespesius, and Trachodon), it is an historically important genus
  with a convoluted taxonomy that has been all but abandoned by modern dinosaur
  paleontologists. Because of its wide use in the early 20th century, it was
  somewhat well known to the general public, often through illustrations of an
  animal with the armor of Edmontonia and the tail club of an ankylosaurid.
dispute:
  summary: >
    Palaeoscincus is a classic tooth taxon and a nomen dubium; the teeth are
    indeterminate within Ankylosauria (Vickaryous et al., 2004). It is retained
    at Ankylosauria incertae sedis.
  history:
    - date: 2026-06-26
      note: Placed at Ankylosauria incertae sedis, undiagnostic tooth-based nomen
        dubium.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Crown palmate with eight radiating costae terminating in points at margin
  - Fang flattened cylindrical and hollow
  - Fang expands into ridge surrounding base of crown
appearance:
  integument: armored
  evidence: inferred
identifiers:
  - source: pbdb
    id: "38824"
  - source: wikidata
    id: Q38789678
species:
  - name: Palaeoscincus costatus
    etymology: From Latin 'costatus' meaning 'ribbed', in reference to the
      radiating costae ornamenting the tooth crown.
    status: nomen dubium
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Campanian
    location:
      country: US
      region: US-MT
      formation: Judith River
      locality: Bad Lands of the Judith River
    type_specimen:
      specimen_id:
        - ANSP 9263
      specimen_type: holotype
      institution: ANSP
      material: A single tooth with a palmate crown bearing eight radiating costae
        ending in variably developed marginal points; the flattened, hollow fang
        expands into a ridge around the crown's base.
      completeness: fragmentary
    erected_in: leidy1856b
references:
  - id: leidy1856b
  - id: vickaryous2004a
    notes: Treated the Palaeoscincus teeth as indeterminate within Ankylosauria.
