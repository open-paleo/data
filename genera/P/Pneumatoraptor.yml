genus: Pneumatoraptor
parent: Paraves
etymology: From Greek 'pneuma' meaning 'air' or 'breath', combined with Latin 'raptor' meaning 'thief', likely referring to pneumatic (air-filled) features in the bones.
pronunciation:
  phonetic: nu-MAT-o-RAP-tor
description: Pneumatoraptor is a genus of small paravian, possibly a
  dromaeosaurid, dinosaur that lived in Hungary. It is known from a single
  complete left shoulder girdle (scapulocoracoid) found in the Csehbánya
  Formation of the Iharkút locality in the Bakony Mountains of western Hungary.
  This formation dates to the late Cretaceous period (Santonian age) about 85
  million years ago.
diet: carnivore
locomotion: bipedal
diagnostic_features:
  - Large, circular pneumatic foramen (2 mm diameter) located ventral to the
    coracoid foramen, opening towards the coracoid tubercle.
  - Pneumatic foramen connects to the hollow interior of the scapular blade,
    as confirmed by cross-section during preparation.
  - Scapulocoracoid is L-shaped with a deeply concave glenoid fossa oriented
    laterally and slightly ventrally.
  - Coracoid displays a prominent reverse flexure of approximately 70°
    between its glenoid portion and the ventral coracoid blade.
  - Coracoid foramen forms an almost anteroposteriorly oriented canal.
paleoenvironment:
  - fluvial
appearance:
  integument: feathered
  evidence: inferred
