genus: Platypelta
parent: Euoplocephalini
pronunciation:
  phonetic: PLAT-ee-PEL-tuh
etymology: From Greek platys (πλατύς, 'flat' or 'broad') and Latin pelta ('small shield'), meaning 'flat shield', referring to the broad, flat armor of this ankylosaurid
description: Platypelta is an extinct genus of herbivorous ankylosaurid
  dinosaurs within the subfamily Ankylosaurinae. It is known from the Late
  Cretaceous Dinosaur Park Formation (early Late Campanian stage, about
  77.5-76.5 Ma ago) of southern Alberta, Canada. The type species is Platypelta
  coombsi.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Large (>25 cm), rugose, sharply keeled, plate-like osteoderms with pointed
    beak-like ends
  - Snout constricted rostral to orbits
  - Vomer overlaps fused premaxillae caudally
  - Occipital condyle large
  - Squamosal horns low, rugose, broad-based with pitted caudal apex
  - Tooth crowns highly sculptured
  - Robust pes with arcuate pedal unguals
  - h.r.1 medial osteoderms elongate, partially keeled with conical prominence
appearance:
  integument: armored
  evidence: direct
