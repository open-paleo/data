genus: Platypelta
parent: Ankylosaurinae
pronunciation:
  phonetic: PLAT-ee-PEL-tuh
etymology: From Greek platys (πλατύς, 'flat' or 'broad') and Latin pelta ('small shield'), meaning 'flat shield', referring to the broad, flat armor of this ankylosaurid
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Large (>25 cm), rugose, sharply keeled, plate-like osteoderms with pointed
    beak-like ends
  - Snout constricted rostral to orbits
  - Vomer overlaps fused premaxillae caudally
  - Occipital condyle large
  - Squamosal horns low, rugose, broad-based with pitted caudal apex
  - Tooth crowns highly sculptured
  - Robust pes with arcuate pedal unguals
  - h.r.1 medial osteoderms elongate, partially keeled with conical prominence
appearance:
  integument: armored
  evidence: direct
identifiers:
  - source: pbdb
    id: "374254"
  - source: wikidata
    id: Q50355971
species:
  - name: Platypelta coombsi
    etymology: Named for Walter P. Coombs, Jr., for his pioneering work on
      ankylosaurs.
    pronunciation:
      phonetic: KOHM-zie
    status: valid
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Campanian
    location:
      country: CA
      locality: Sand Creek
      region: CA-AB
      formation: Dinosaur Park
      part: lower
    type_specimen:
      specimen_id: [AMNH 5337]
      specimen_type: holotype
      institution: AMNH
      material: Well-preserved skull, mandibles, teeth, cervical and dorsal vertebrae,
        ribs, complete pelvis, scapulocoracoids, humeri, radii, cervical half-rings,
        six free osteoderms
      completeness: partial
    size:
      length_m:
        min: 6.1
        max: 6.1
      weight_kg:
        min: 2600
        max: 2600
      hip_height_m:
        min: 1.5
        max: 1.5
    erected_in: penkalski2018a
notable_specimens:
  - specimen_id: [ROM 813]
    institution: ROM
    species: Platypelta coombsi
    category: complementary
    significance: "Referred skeleton lacking the skull but preserving the entire rump, forelimbs, and hindlimbs plus skin impressions and numerous osteoderms, anatomy absent in the holotype, which lacks the tail and hindlimbs. Kept on three blocks left unprepared to conserve the impressions."
    references: [penkalski2018a]
references:
