genus: Powellvenator
parent: Coelophysidae
etymology: "Named for Argentine paleontologist Jaime Powell, combined with Latin 'venator' meaning 'hunter'; meaning 'Powell's hunter.'"
description: Powellvenator is an extinct genus of coelophysoid theropod dinosaur
  that lived during the latter part of the Triassic Period in what is now
  northwestern Argentina. Fossils of the dinosaur were found in the Los
  Colorados Formation of the Ischigualasto-Villa Unión Basin. The type species,
  Powellvenator podocitus, was named by Martin Ezcurra in 2017.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - arid
diagnostic_features:
  - Tibia lacking anterior diagonal tuberosity and notch for posteromedial
    astragalar process
  - Astragalus with distinctly sigmoid posterodorsal margin (medially convex,
    laterally concave)
  - Astragalus with rounded, dorsally projected expansion on medial third of
    dorsal margin in anterior view
  - Calcaneum with laterally projected flange occupying entire proximodistal
    height of anterolateral corner
  - Distal tarsal 3 with convex anterolateral margin in proximal view
  - Distal tarsal 4 with strongly convex anterior margin in proximal view
  - Metatarsal II shaft less than half anteroposterior depth and transverse
    width of metatarsal III shaft
