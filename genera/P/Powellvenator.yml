genus: Powellvenator
parent: Coelophysidae
etymology: Jaime Powell's hunter
description: Powellvenator is an extinct genus of coelophysoid theropod dinosaur
  that lived during the latter part of the Triassic Period in what is now
  northwestern Argentina. Fossils of the dinosaur were found in the Los
  Colorados Formation of the Ischigualasto-Villa Unión Basin. The type species,
  Powellvenator podocitus, was named by Martin Ezcurra in 2017.
diet: carnivore
locomotion: bipedal
