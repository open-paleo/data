genus: Paranthodon
parent: Stegosauria
pronunciation:
  ipa: /pəˈrænθədɒn/
  phonetic: puh-RAN-thuh-don
etymology: "From Greek para- (παρά, 'beside' or 'near') and Anthodon, the
  pareiasaur genus to which the fossil was initially misassigned; meaning 'near
  Anthodon'"
description: Paranthodon is a genus of stegosaurian dinosaur that lived in what
  is now South Africa during the Early Cretaceous, between 139 and 131 million
  years ago. Discovered in 1845, it was one of the first stegosaurians found.
  Its only remains, a partial skull, isolated teeth, and fragments of vertebrae,
  were found in the Kirkwood Formation.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Both sides of maxillary tooth crown bear a prominent bulbous cingulum
  - Maxillary tooth crown has a large subcentral vertical ridge terminating in a
    large apical denticle
  - Five to seven smaller denticles anterior to central ridge, four or five
    posteriorly, continuing dorsally as tapering rounded ridges curving slightly
    toward the central ridge
  - Referred dentary teeth similar but subcentral ridge less prominent and fewer
    smaller denticles
appearance:
  integument: armored
  evidence: inferred
