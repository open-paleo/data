genus: Paranthodon
parent: Stegosauria
pronunciation:
  ipa: /pəˈrænθədɒn/
  phonetic: puh-RAN-thuh-don
etymology: "From Greek para- (παρά, 'beside' or 'near') and Anthodon, the
  pareiasaur genus to which the fossil was initially misassigned; meaning 'near
  Anthodon'"
description: Paranthodon is a genus of stegosaurian dinosaur that lived in what
  is now South Africa during the Early Cretaceous, between 139 and 131 million
  years ago. Discovered in 1845, it was one of the first stegosaurians found.
  Its only remains, a partial skull, isolated teeth, and fragments of vertebrae,
  were found in the Kirkwood Formation.
diet: herbivore
locomotion: quadrupedal
