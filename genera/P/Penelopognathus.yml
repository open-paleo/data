genus: Penelopognathus
parent: Hadrosauroidea
etymology: From Greek penelops (wild duck) and gnathos (jaw); meaning "wild duck jaw".
pronunciation:
  phonetic: pen-el-o-pog-nay-thus
description: Penelopognathus is a genus of hadrosauroid dinosaur which lived in
  the Early Cretaceous Bayin-Gobi Formation in what is now China. The discovery
  of this taxon contributes to the hypothesis that hadrosauroids originated in
  Asia.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Elongated dental ramus with length/height ratio of 4.6
  - Straight ventral margin of the dentary
  - About 20 irregularly distributed foramina piercing the lateral face
  - Dentary teeth showing miniaturisation compared to Altirhinus but more
    advanced
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "137366"
  - source: wikidata
    id: Q2233141
  - source: gbif
    id: "4981174"
  - source: eol
    id: "47460086"
species:
  - name: Penelopognathus weishampeli
    etymology: "Named for David Weishampel, the paleontologist honored by the describers Godefroit, Li, and Shang when the species was named in 2005."
    status: valid
    type_species: true
    period:
      name:
        - Early Cretaceous
      stage:
        - Aptian
        - Albian
    location:
      country: CN
      locality: Qiriga Village
      region: CN-NM
      formation: Bayin-Gobi
      notes: Godefroit and colleagues (2005) give "Bayan Gobi Formation (Albian)"
        because the formation's fauna at the Alxasaurus sites "suggests an
        Albian age"; no source read dates the Qiriga beds themselves, so the
        record takes the formation's Aptian-Albian.
    size:
      length_m:
        min: 5.0
        max: 5.0
    erected_in: godefroit2005a
    type_specimen:
      specimen_id: [IMM 2002-BYGB-1]
      specimen_type: holotype
      institution: IMM
      material: Right dentary, elongated and straight dental ramus with lateral foramina
      completeness: fragmentary
references:
  - id: godefroit2005a
    notes: Named Penelopognathus as a basal hadrosauroid between Altirhinus and
      Probactrosaurus, without a phylogenetic analysis.
  - id: magyar2026a
    notes: Places Penelopognathus in an East Asian clade of non-hadrosaurid
      hadrosauroids.
  - id: jones2026a
    notes: Treats Penelopognathus as a basal hadrosauroid.
  - id: mcdonald2010a
    notes: Recovered Penelopognathus among basal hadrosauroids, supporting the position Godefroit and colleagues (2005) proposed.
