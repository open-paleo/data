genus: Piatnitzkysaurus
parent: Piatnitzkysauridae
etymology: Named after Alejandro Piatnitzky, a Russian-born Argentine geologist, combined with Greek sauros (lizard); meaning "Piatnitzky's lizard".
pronunciation:
  phonetic: pee-uht-NITS-kee-SOR-uhs
  ipa: /ˌpiːətnɪtskiːˈsɔːrəs/
description: Piatnitzkysaurus is a genus of tetanuran theropod dinosaur that
  lived approximately 179 to 177 million years ago during the lower part of the
  Jurassic Period in what is now Argentina. Piatnitzkysaurus was a moderately
  large, lightly built, bipedal, ground-dwelling carnivore that could grow over
  4 m (13.1 ft) long.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
diagnostic_features:
  - Megalosaurid carnosaur more primitive than Allosaurus
  - Smaller pubic foot compared to Allosaurus
  - Obturator foramen almost completely bordered by bone
  - Different ridge system on lateral side of dorsal neural arches versus
    Allosaurus
  - Proportionally longer humerus than in Allosaurus
  - Less evident affinities with Ceratosaurus than with Allosaurus
appearance:
  integument: scaled
  evidence: inferred
