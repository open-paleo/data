genus: Piatnitzkysaurus
parent: Piatnitzkysauridae
etymology: Named after Alejandro Piatnitzky, a Russian-born Argentine geologist, combined with Greek sauros (lizard); meaning "Piatnitzky's lizard".
pronunciation:
  phonetic: pee-ət-NITS-kee-SOR-əs
  ipa: /ˌpiːətnɪtskiːˈsɔːrəs/
description: Piatnitzkysaurus is a genus of tetanuran theropod dinosaur that
  lived approximately 179 to 177 million years ago during the lower part of the
  Jurassic Period in what is now Argentina. Piatnitzkysaurus was a moderately
  large, lightly built, bipedal, ground-dwelling carnivore that could grow over
  4 m (13.1 ft) long.
diet: carnivore
locomotion: bipedal
