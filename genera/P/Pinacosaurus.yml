genus: Pinacosaurus
parent: Ankylosaurinae
pronunciation:
  phonetic: PIN-ak-o-SAWR-us
etymology: From Greek 'pinax' meaning 'plank' and 'sauros' meaning 'lizard';
  translates as 'plank lizard', named for the small rectangular plank-like
  scutes covering its head.
description: Pinacosaurus is a genus of ankylosaurid thyreophoran dinosaur that
  lived in Asia during the Late Cretaceous (Campanian, roughly 75 to 71 million
  years ago), mainly in Mongolia and China.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - arid
diagnostic_features:
  - Embayment divides each supranarial ossification.
  - Weakly developed cranial ornamentation, with discrete caputegulae limited
    to the nasal region.
  - Sagittal ('ethmoid') ossification(s) on the nasals.
  - Nasoprefrontal pyramid, lacrimal incisure, relatively flat postfrontal
    skull roof, and lateral supraorbitals with distinct peaks (shared with
    Minotaurasaurus).
  - Multiple paranasal openings and a more horizontal pterygoid body (shared
    with Minotaurasaurus and Eopinacosaurus).
appearance:
  features:
    - osteoderms
    - body armor
    - tail club
    - shoulder spikes
  integument: armored
  evidence: direct
identifiers:
  - source: pbdb
    id: "38833"
  - source: wikidata
    id: Q31422
  - source: gbif
    id: "4574575"
  - source: eol
    id: "4530851"
synonyms:
  - name: Syrmosaurus
    type: junior subjective
    reason: Treated as a junior subjective synonym of Pinacosaurus in Olshevsky's
      Dinosaur Genera List.
species:
  - name: Pinacosaurus grangeri
    etymology: Named for Walter W. Granger, the paleontologist who accompanied the
      1923 American Museum of Natural History Central Asiatic Expedition and
      discovered the original specimens.
    status: valid
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Campanian
      from_ma: 74.6
      to_ma: 72.1
    location:
      country: MN
      locality: Bayn Dzak
      region: Omnogov
      formation: Djadokhta
      coordinates:
        - 44.156948
        - 103.692329
    size:
      hip_height_m:
        min: 0.9
        max: 0.9
      length_m:
        min: 5
        max: 5
      weight_kg:
        min: 1900
        max: 1900
    type_specimen:
      specimen_id:
        - AMNH 6523
      specimen_type: holotype
      institution: AMNH
      material: Crushed skull and mandibles, atlas, axis, several osteoderms, and fragments
      completeness: partial
    diagnostic_features:
      - Single 'C' paranasal opening leading into the premaxillary sinus, plus a
        B aperture (P. hilwitnorum has three or more).
      - Squamosal horns short and drooping ventrolaterally in juveniles,
        becoming more erect and recurved in adults.
      - Paired parietals (ambiguous); sagittal nuchal element absent; no
        postpalatal foramen.
      - Medial process of the postorbital abuts the frontal; squamosal excluded
        from the nuchal border by the supranuchal.
      - Low-relief internarial caputegulae.
      - Vertical grooves on the teeth divergent; prominent, ridge-like medial
        brace on the scapula.
      - Some caudal osteoderms with an unusual cross-hatched groove pattern.
    synonyms:
      - name: Pinacosaurus ninghsiensis
        type: junior subjective
        reason: Synonymized with P. grangeri by Penkalski (2026).
    erected_in: gilmore1933b
    described_in: penkalski2026a
  - name: Pinacosaurus hilwitnorum
    etymology: Latinization of the truncated surnames of Robert Hill, Larry
      Witmer, and Mark Norell, who first described the holotype skull
      (IGM 100/1014) in 2003 as a referred specimen of P. grangeri.
    status: valid
    type_species: false
    period:
      name:
        - Late Cretaceous
      stage:
        - Campanian
      from_ma: 75.35
      to_ma: 72.1
    location:
      country: MN
      locality: Ukhaa Tolgod
      region: Omnogov
      formation: Djadokhta
      coordinates:
        - 43.664444
        - 100.901947
    type_specimen:
      specimen_id:
        - IGM 100/1014
      specimen_type: holotype
      institution: MPC
      material: Skull with lower jaws.
      completeness: partial
    diagnostic_features:
      - Three or more 'C' paranasal apertures plus B (P. grangeri has a single
        'C' plus B).
      - More prominent nasal ridges; pointed internarials.
      - Fused parietals (paired in P. grangeri).
      - Small triangular sagittal nuchal element (possible postparietal).
      - Posterior palatal foramen present.
      - Parallel vertical grooves on teeth (divergent in P. grangeri); reduced
        scapular medial brace.
    erected_in: penkalski2026a
notable_specimens:
