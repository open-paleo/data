    significance: "A nearly complete postcranial skeleton measuring 3.66 meters from the first neck vertebra to the end of the tail; originally described as Syrmosaurus viminocaudus by Maleev in 1952 and now considered the same species as P. grangeri."
    references: [hill2003a]
