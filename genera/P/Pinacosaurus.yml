genus: Pinacosaurus
parent: Ankylosaurinae
pronunciation:
  phonetic: PIN-ak-o-SAWR-us
etymology: From Greek 'pinax' meaning 'plank' and 'sauros' meaning 'lizard';
  translates as 'plank lizard', named for the small rectangular plank-like
  scutes covering its head.
description: Pinacosaurus is a genus of ankylosaurid thyreophoran dinosaur that
  lived in Asia during the Late Cretaceous (Campanian, roughly 75 to 71 million
  years ago), mainly in Mongolia and China.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - arid
diagnostic_features:
  - Skull covered with numerous small osseous scutes; large quadratojugal dermal
    plates on posterior inferior angles.
  - Skull relatively slender, longer than wide; beak regularly rounded and
    apparently devoid of osseous scutes.
  - External nares small, opening laterally; premaxillary region with two
    subovate longitudinal openings placed one above the other, separated by a
    horizontal bar.
  - Palate divided longitudinally by a vertical median bony plate extending from
    premaxillary junction to pterygoids.
  - Teeth extremely small, smaller than those of Dyoplosaurus; laterally
    compressed crown with eleven denticles, lacking a cingulum.
appearance:
  features:
    - osteoderms
    - body armor
    - tail club
    - shoulder spikes
  integument: armored
  evidence: direct
