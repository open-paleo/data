genus: Procompsognathus
parent: Coelophysidae
dispute:
  summary: >
    Procompsognathus triassicus is a defining taxon of Coelophysidae
    (Sereno, 1998) but is placed only within the broader Coelophysoidea by
    Jones (2026); its holotype may be composite, with associated skull
    material reassigned to a crocodylomorph.
  history:
    - date: "2026-06-30"
      note: >
        Placed at Coelophysidae following its definitional role.
pronunciation:
  ipa: /ˌproʊkɒmpˈsɒɡnəθəs/
  phonetic: pro-comp-sog-nay-thus
etymology: "From Greek pro- (πρό, 'before' or 'precursor of') prefixed to
  Compsognathus (Greek kompsos 'elegant' + gnathos 'jaw'); meaning 'before
  Compsognathus' or 'precursor of the elegant jaw'"
description: Procompsognathus is an extinct genus of coelophysid theropod
  dinosaur that lived approximately 210 million years ago during the later part
  of the Triassic Period, in what is now Germany. Procompsognathus was a
  small-sized, lightly built, ground-dwelling, bipedal carnivore, that could
  grow up to 1 m (3.3 ft) long.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Exceedingly long-legged, jumping dinosaur morphology
  - Hind leg approximately 0.315 m long with bird-like development; three middle
    metatarsals fusible to completed bird foot
  - All bones thin-walled and hollow; ossified tarsus completely absent
  - Delicate skull and forelimbs relative to body size
  - Approximately 0.75 m total length, somewhat larger than Upper Jurassic
    Compsognathus longipes
