genus: Procompsognathus
parent: Coelophysidae
pronunciation:
  ipa: /ˌproʊkɒmpˈsɒɡnəθəs/
etymology: "From Greek pro- (πρό, 'before' or 'precursor of') prefixed to Compsognathus (Greek kompsos 'elegant' + gnathos 'jaw'); meaning 'before Compsognathus' or 'precursor of the elegant jaw'"
description: Procompsognathus is an extinct genus of coelophysid theropod
  dinosaur that lived approximately 210 million years ago during the later part
  of the Triassic Period, in what is now Germany. Procompsognathus was a
  small-sized, lightly built, ground-dwelling, bipedal carnivore, that could
  grow up to 1 m (3.3 ft) long.
diet: carnivore
locomotion: bipedal
