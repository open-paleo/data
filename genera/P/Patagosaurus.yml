genus: Patagosaurus
parent: Cetiosauridae
pronunciation:
  phonetic: PAT-a-go-SAWR-us
etymology: "Named for Patagonia, the region of Argentina where it was found, combined with Greek 'sauros' meaning 'lizard'; translates as 'Patagonia lizard'."
description: Patagosaurus is an extinct genus of eusauropod dinosaur from the
  middle Toarcian of Patagonia, Argentina. It was first found in deposits of the
  Cañadón Asfalto Formation, which date to around 178 million years ago.
  Although originally twelve specimens were assigned to the taxon, at least one
  of them may belong to a different genus. Patagosaurus probably lived alongside
  genera such as Piatnitzkysaurus, Condorraptor, and Volkheimeria.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - lacustrine
diagnostic_features:
  - Cetiosaurid of large size with tall dorsal vertebrae and posterior dorsals
    with elevated neural arches.
  - Posterior dorsal neural spines formed from 4 divergent laminae with massive
    dorsal region and dorsoventrally-oriented neural spine cavities, more
    expanded than in Barapasaurus.
  - Sacrum with 5 vertebrae, elevated neural spines, and large dilation of the
    neural canal forming a neural cavity.
  - Pelvis with pubis showing distal and proximolateral expansions more
    developed than in Barapasaurus, and less expanded pubic symphysis than in
    Amygdalodon.
  - Ischium slightly transversely compressed with ventromedial ridge of
    sublaminar type and clear distal expansion.
  - Tibia-femur length ratio of 1:1.5 in juveniles, reaching 1:1.7 in adults.
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "38662"
  - source: wikidata
    id: Q132552
  - source: gbif
    id: "4822734"
species:
  - name: Patagosaurus fariasi
    etymology: "Named for Ricardo Farias, on whose land in the Cañadón Asfalto region of Patagonia the initial discovery was made."
    status: valid
    type_species: true
    period:
      name:
        - Early Jurassic
      stage:
        - Toarcian
    location:
      country: AR
      locality: Cerro Cóndor North
      region: AR-U
      formation: Cañadón Asfalto
      part: lower
      notes: >
        Pol and colleagues (2022) report that "The base of the Cañadón
        Asfalto Formation was dated at 179.17 ± 0.12 Ma, and the
        uppermost levels of this unit were dated at 178.07 ± 0.21 Ma",
        and that "The locality where Volkheimeria and Patagosaurus were
        found is stratigraphically bracketed between the horizons of
        these two dates", placing them "into the middle Toarcian (ca
        179–178 Ma)". That replaces the early Middle Jurassic age Cúneo
        and colleagues (2013) gave these sauropods.
    type_specimen:
      specimen_id: [PVL 4170]
      specimen_type: holotype
      institution: PVL
      material: Almost complete postcranial skeleton including cervical, dorsal,
        sacral and caudal vertebrae, ribs, haemal arches, ilium, ischia, pubis,
        scapula, coracoid, humerus, and femur.
      completeness: partial
    size:
      hip_height_m:
        min: 3.9
        max: 3.9
      length_m:
        min: 15.0
        max: 16.5
      weight_kg:
        min: 7880
        max: 9440
    erected_in: bonaparte1979a
references:
  - id: bonaparte1979a
  - id: bonaparte1986b
    notes: In French. Full descriptive monograph complementing the brief
      Bonaparte (1979) announcement; covers Patagosaurus fariasi material in
      detail.
  - id: cúneo2013a
    notes: Dates the interval overlying the uppermost basalt flow at Cerro
      Cóndor, which holds this taxon, as Aalenian to probably Bajocian, with a
      latest Toarcian age not precluded near the basalt.
  - id: jones2026b
    notes: Source of the hip height estimate.
  - id: pol2022a
    notes: Brackets the type locality between U-Pb dates in the middle Toarcian.
  - id: pol2020a
    notes: Source of the U-Pb dates for the base and top of the formation.
