genus: Patagosaurus
parent: Cetiosauridae
pronunciation:
  phonetic: PAT-a-go-SAWR-us
etymology: "Named for Patagonia, the region of Argentina where it was found, combined with Greek 'sauros' meaning 'lizard'; translates as 'Patagonia lizard'."
description: Patagosaurus is an extinct genus of eusauropod dinosaur from the
  middle Toarcian of Patagonia, Argentina. It was first found in deposits of the
  Cañadón Asfalto Formation, which date to around 178 million years ago.
  Although originally twelve specimens were assigned to the taxon, at least one
  of them may belong to a different genus. Patagosaurus probably lived alongside
  genera such as Piatnitzkysaurus, Condorraptor, and Volkheimeria.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - lacustrine
diagnostic_features:
  - Cetiosaurid of large size with tall dorsal vertebrae and posterior dorsals
    with elevated neural arches.
  - Posterior dorsal neural spines formed from 4 divergent laminae with massive
    dorsal region and dorsoventrally-oriented neural spine cavities, more
    expanded than in Barapasaurus.
  - Sacrum with 5 vertebrae, elevated neural spines, and large dilation of the
    neural canal forming a neural cavity.
  - Pelvis with pubis showing distal and proximolateral expansions more
    developed than in Barapasaurus, and less expanded pubic symphysis than in
    Amygdalodon.
  - Ischium slightly transversely compressed with ventromedial ridge of
    sublaminar type and clear distal expansion.
  - Tibia-femur length ratio of 1:1.5 in juveniles, reaching 1:1.7 in adults.
