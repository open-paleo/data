genus: Perijasaurus
parent: Eusauropoda
pronunciation:
  phonetic: peh-ree-HAH-SAWR-us
etymology: Named after the Serranía del Perijá mountain range in Colombia where the fossil was discovered, combined with Greek sauros (lizard); meaning "Perija lizard".
description: Perijasaurus is a genus of basal eusauropod sauropod dinosaur from
  the "Girón-type redbeds" of the La Quinta Formation of Cesar Department,
  north-eastern Colombia. The type species is Perijasaurus lapaz. It lived
  during the Toarcian-Aalenian boundary around 175 million years ago (early to
  middle Jurassic period).
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Divided centropostzygapophyseal lamina (autapomorphy)
  - Strongly dorsally arched postzygapophyseal facets in posterior view
    (autapomorphy)
  - Single intrapostzygapophyseal lamina
  - Two spinodiapophyseal laminae
  - Height of neural arch below postzygapophyses greater than centrum height
  - Dorsolaterally directed transverse processes
  - Strongly transversely expanded distal end of neural spine
