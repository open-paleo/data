genus: Paralitherizinosaurus
parent: Therizinosauridae
etymology: "From Greek 'paralos' meaning 'tidal', Greek 'therizo' meaning 'scythe', and Latin 'sauros' meaning 'lizard', giving the meaning 'tidal scythe lizard', referring to its coastal habitat and scythe-like claws."
description: Paralitherizinosaurus is an extinct genus of therizinosaurid
  theropod dinosaurs from the Late Cretaceous Osoushinai Formation of Hokkaido,
  Japan. The genus contains a single species, Paralitherizinosaurus japonicus,
  known from a partial right hand and cervical vertebra. Paralitherizinosaurus
  represents the youngest therizinosaur known from Japan.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - coastal
diagnostic_features:
  - dorsoventrally flattened metacarpal I with dorsoventral height less than
    half transverse width
  - no rotation of distal end axis of metacarpal I
  - proximodorsally projecting dorsal lip in digits I and III
  - shallow depression at proximal portion of ungual III-4 connecting to
    collateral groove
  - proximally extending ventral process on unguals
  - weak flexor tubercle expressed as small ridge
appearance:
  features:
