genus: Paralitherizinosaurus
parent: Therizinosauridae
description: Paralitherizinosaurus is an extinct genus of therizinosaurid
  theropod dinosaurs from the Late Cretaceous Osoushinai Formation of Hokkaido,
  Japan. The genus contains a single species, Paralitherizinosaurus japonicus,
  known from a partial right hand and cervical vertebra. Paralitherizinosaurus
  represents the youngest therizinosaur known from Japan.
diet: herbivore
