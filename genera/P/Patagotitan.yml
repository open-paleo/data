genus: Patagotitan
parent: Eutitanosauria
etymology: Named for Patagonia, the region of Argentina where it was discovered, combined with Greek 'titan' meaning 'giant', referencing its enormous size.
description: Patagotitan is a genus of titanosaurian sauropod dinosaur from the
  Early Cretaceous (Albian stage) Cerro Barcino Formation in Chubut Province,
  Patagonia, Argentina. The genus contains a single species known from at least
  six young adult individuals, Patagotitan mayorum, which was first announced in
  2014 and then named in 2017 by José Carballido and colleagues. Originally
  thought to be the largest known titanosaur and land animal overall,
  preliminary studies and press releases suggested that Patagotitan had an
  estimated length of 37 m (121 ft) and an estimated weight of 69 tonnes (76
  short tons). Later research revised the length estimate down to 31 m (102 ft)
  and weight estimates down to approximately 50–60 tonnes (55–66 short tons),
  suggesting that Patagotitan was of a similar size to, if not smaller than, its
  closest relatives Argentinosaurus and Puertasaurus. Still, Patagotitan is one
  of the best-known titanosaurs, and so its interrelationships with other
  titanosaurs have been relatively consistent in phylogenetic analyses. This led
  to its use in a re-definition of the group Colossosauria by Carballido and
  colleagues in 2022.
