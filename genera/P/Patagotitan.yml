genus: Patagotitan
parent: Lognkosauria
etymology: Named for Patagonia, the region of Argentina where it was discovered,
  combined with Greek 'titan' meaning 'giant', referencing its enormous size.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Anterior dorsal vertebrae with vertical prezygodiapophyseal lamina due to
    elevated prezygapophysis position relative to diapophysis
  - Anteriormost dorsal vertebrae with ventral bulge in prespinal lamina
  - Hyposphene-hypantrum restricted to articulation between D3 and D4
  - Middle and posterior dorsal vertebrae with vertical neural spine
  - First caudal vertebra with flat anterior and convex posterior articular
    surfaces
  - Anterior caudal vertebrae with neural spines four to six times
    mediolaterally wider than anteroposteriorly long
  - Anterior caudal neural spines incipiently bifid with anteriorly directed tips
  - Marked bulge on posterolateral surface of humerus
appearance:
  features:
    - tall neural spines
  integument: scaled
  evidence: inferred
