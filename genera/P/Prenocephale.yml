genus: Prenocephale
parent: Pachycephalosaurinae
etymology: From Greek 'prenes' (sloping, inclined) and 'kephalē' (head),
  referring to the anteriorly inclined profile of the highly domed cranium.
pronunciation:
  phonetic: PREE-no-SEF-a-lee
description: Prenocephale is an extinct genus of pachycephalosaurid ornithischian
  dinosaur from the Maastrichtian Nemegt Formation of southern Mongolia. The
  type and only species, Prenocephale prenes, was erected by Maryańska &
  Osmólska (1974) on a nearly complete skull with associated postcranial
  fragments (ZPAL MgD-I/104) recovered from the Nemegt locality of the Gobi
  Desert; Evans et al. (2018) referred three additional cranial specimens from
  Bugiin Tsav, Guriliin Tsav, and Tsagaan Khushuu and presented the first
  cranial bone histology for any Asian pachycephalosaur, demonstrating that
  the holotype was probably a not-yet-fully-mature individual. Several Late
  Cretaceous North American species (P. brevis, P. edmontonensis, P. goodwini)
  formerly attributed to this genus have since been transferred to
  Sphaerotholus or Foraminacephale; the Asian type species P. prenes is
  uncontroversially valid, and Evans et al. (2018) explicitly rejected the
  proposed synonymy of Homalocephale calathocercos with P. prenes on the
  basis of consistently distinct squamosal-node morphologies.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Frontoparietal cranial roof highly domed, with highest point situated
    above the postorbital bar.
  - Parietosquamosal shelf absent; dome extends back to the posterior margin
    of the skull.
  - Three caniniform premaxillary teeth bearing a serrated crest on their
    posterior faces, separated from 17 straight-rowed maxillary teeth by a
    long, deep diastema.
  - Antorbital fenestra present.
  - Supratemporal fenestra completely closed; infratemporal fenestra short
    and broad.
  - Occipital region overhung by strongly swollen squamosals with a deeply
    depressed central part; row of conspicuous nodes along posterolateral
    and posterior skull margins.
