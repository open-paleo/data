genus: Paraxenisaurus
parent: Deinocheiridae
etymology: From Greek para (near, beside) and xenos (strange) and sauros (lizard); meaning "strange lizard".
pronunciation:
  ipa: /pɛərəkˌsɪniːˈsɔːrəs/
  phonetic: peh-rak-sih-nee-sor-us
description: Paraxenisaurus is an extinct genus of ornithomimosaurian theropod
  from the Late Cretaceous Cerro del Pueblo Formation of Coahuila in Mexico. The
  genus contains a single species, P. normalensis, which is known from a few
  bones of tail, hips, hands, and feet. The specific epithet was given in honor
  of the Benemérita Normal School of Coahuila, a teacher training institution,
  where the fossils were reposited. It is a member of the family Deinocheiridae
  and is the only member of that clade known from Laramidia.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Strongly curved and laterally compressed manual ungual I with distally
    placed flexor tubercle divided by deep sulcus
  - Deeply concave proximal articular surface of manual ungual I, elliptical
    outline, twice taller than wide
  - Metacarpal III with expanded proximal articular end similar in width to
    metacarpal II
  - Posterior caudal vertebrae with low dorsoventrally prezygapophyses having
    nearly vertical articulation surfaces anteriorly and ventromedially-facing
    prezygapophyses posteriorly
  - Non-arctometatarsalian pes with proximal end of metatarsal III expanded and
    ovoid outline
  - Expanded medial condyle of metatarsal II flaring laterally
  - Distal end of metatarsal III transversely wider than anteroposteriorly with
    semi-ginglymoid articulation
