genus: Paraxenisaurus
parent: Deinocheiridae
etymology: From Greek para (near, beside) and xenos (strange) and sauros (lizard); meaning "strange lizard".
pronunciation:
  ipa: /pɛərəkˌsɪniːˈsɔːrəs/
description: Paraxenisaurus is an extinct genus of ornithomimosaurian theropod
  from the Late Cretaceous Cerro del Pueblo Formation of Coahuila in Mexico. The
  genus contains a single species, P. normalensis, which is known from a few
  bones of tail, hips, hands, and feet. The specific epithet was given in honor
  of the Benemérita Normal School of Coahuila, a teacher training institution,
  where the fossils were reposited. It is a member of the family Deinocheiridae
  and is the only member of that clade known from Laramidia.
diet: herbivore
locomotion: bipedal
