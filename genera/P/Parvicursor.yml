genus: Parvicursor
parent: Parvicursorinae
pronunciation:
  phonetic: PAR-vi-KUHR-sor
etymology: From Latin parvus (small) and cursor (runner); meaning "small runner".
description: Parvicursor is a genus of very small alvarezsaurid maniraptoran
  dinosaur that lived during the Late Cretaceous period of Mongolia. It had
  long, slender legs adapted for fast running.
diet: carnivore
locomotion: bipedal
