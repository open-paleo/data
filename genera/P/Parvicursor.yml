genus: Parvicursor
parent: Parvicursorinae
pronunciation:
  phonetic: PAR-vi-KUHR-sor
etymology: From Latin parvus (small) and cursor (runner); meaning "small runner".
description: Parvicursor is a genus of very small alvarezsaurid maniraptoran
  dinosaur that lived during the Late Cretaceous period of Mongolia. It had
  long, slender legs adapted for fast running.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - arid
appearance:
  integument: feathered
  evidence: inferred
diagnostic_features:
  - Sub-triangular articular surfaces of the dorsal vertebral centra
  - Sharp ventral ridge on the posterior dorsal vertebrae
  - Horizontal supraacetabular crest of the ilium, its anterior end placed
    ahead of the most ventrally prominent point of the pubic peduncle
  - Femur lacking a fourth trochanter but bearing a distinct entocondylar
    tuber directed posterolaterally
  - Popliteal fossa of the femur open distally
  - Metatarsals II and IV not co-ossified
