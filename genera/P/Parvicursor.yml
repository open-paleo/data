    etymology: "From Latin 'remotus' meaning 'remote', 'deviating', or 'far from',
      likely referring to the phylogenetic distance of P. remotus from other
      Alvarezsauridae or its unique, specialized, or 'deviating' features that
      set it apart from other small dinosaurs found in the same region."
    status: valid
