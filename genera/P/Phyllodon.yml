genus: Phyllodon
parent: Neornithischia
placement: incertae sedis
etymology: "From Greek 'phyllon' meaning 'leaf' and 'odon' meaning 'tooth';
  translates as 'leaf tooth', named for the leaf-shaped teeth."
pronunciation:
  phonetic: FILL-o-don
description: Phyllodon is a genus of small ornithischian dinosaur from the Late
  Jurassic (Kimmeridgian) Camadas de Guimarota Formation of Leiria, Portugal and
  possibly also the Middle Jurassic (Bathonian) Chipping Norton Limestone of
  England. It may have been closely related to contemporaneous ornithischian
  dinosaurs from North America. This genus is known from teeth and possibly
  partial lower jaws. The name is also in use for a genus of modern moss, but
  this is not considered to be a problem because the two organisms are in two
  different kingdoms.
dispute:
  summary: >
    Phyllodon is based only on isolated teeth from the Late Jurassic of
    Portugal and is widely regarded as a nomen dubium (Norman, 2004),
    thought to represent a basal neornithischian comparable to Nanosaurus
    (Galton, 2006).
  history:
    - date: "2026-06-29"
      note: Placed at Neornithischia incertae sedis; fragmentary, tooth-based nomen dubium not placeable more precisely.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - coastal
diagnostic_features:
  - Tooth crowns fully and uniformly enamelled, bucco-lingually compressed, and
    higher than long along the entire tooth row.
  - Anterior premaxillary crowns broadly triangular, weakly recurved, without
    definite marginal denticles; distal margin straight and sharp.
  - Posterior premaxillary crowns with small denticles on mesial margin
    appearing before distal margin — unique among hypsilophodontids (reverse of
    all other known genera).
  - Cheek crowns lozenge-shaped with bluntly rounded marginal denticles
    deflected to the rear; largest denticles near crown mid-height, decreasing
    toward cervix and occlusal tip.
  - Occlusal tip of cheek crown formed by a cluster of several small denticles
    (not a single large denticle as in relatives).
  - Cingula absent; some cheek crowns bear a few small denticles at the
    postero-internal (lingual) margin only.
