genus: Phyllodon
parent: Neornithischia
placement: incertae sedis
etymology: "From Greek 'phyllon' meaning 'leaf' and 'odon' meaning 'tooth';
  translates as 'leaf tooth', named for the leaf-shaped teeth."
pronunciation:
  phonetic: FILL-o-don
description: Phyllodon is a genus of small ornithischian dinosaur from the Late
  Jurassic (Kimmeridgian) Camadas de Guimarota Formation of Leiria, Portugal and
  possibly also the Middle Jurassic (Bathonian) Chipping Norton Limestone of
  England. It may have been closely related to contemporaneous ornithischian
  dinosaurs from North America. This genus is known from teeth and possibly
  partial lower jaws. The name is also in use for a genus of modern moss, but
  this is not considered to be a problem because the two organisms are in two
  different kingdoms.
dispute:
  summary: >
    Phyllodon is based only on isolated teeth from the Late Jurassic of
    Portugal and is widely regarded as a nomen dubium (Norman and colleagues, 2004),
    thought to represent a basal neornithischian comparable to Nanosaurus
    (Galton, 2007).
  history:
    - date: "2026-06-29"
      note: Placed at Neornithischia incertae sedis; fragmentary, tooth-based nomen dubium not placeable more precisely.
    - date: "2026-10-08"
      note: Type species set to nomen dubium and diagnostic features removed, following Norman and colleagues (2004).
diet: herbivore
locomotion: bipedal
