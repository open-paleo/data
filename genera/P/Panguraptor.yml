genus: Panguraptor
parent: Coelophysoidea
dispute:
  summary: >
    Panguraptor lufengensis is recovered within Coelophysidae by its
    describers (You and others, 2014) and by Ezcurra and others (2020) but
    as a basal non-coelophysid coelophysoid by Spiekman and others (2021).
  history:
    - date: "2026-06-30"
      note: >
        Placed at Coelophysoidea, the least-inclusive clade these results agree
        on.
etymology: Named after Pangu, the Chinese creator deity (also evoking the supercontinent Pangaea), combined with Latin raptor (seizer, robber); meaning "Pangu plunderer".
pronunciation:
  phonetic: PAN-goo-RAP-tuh
description: 'Panguraptor is a genus of coelophysid theropod dinosaur known from
  fossils discovered in Lower Jurassic rocks of southern China. The type and
  only known species is Panguraptor lufengensis. The generic name refers to the
  deity Pangu but also to the supercontinent Pangaea for which in a geological
  context the same characters are used: 盘古. Raptor means "seizer", "robber" in
  Latin. The specific name is a reference to the Lufeng Formation. It was
  described in 2014 by You Hai-Lu and colleagues.'
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Diagonal rostrodorsal-caudoventral ridge on lateral surface of maxilla
    within antorbital fossa
  - Distal tarsal IV with hooked craniomedial corner
