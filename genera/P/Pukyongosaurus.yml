genus: Pukyongosaurus
parent: Somphospondyli
dispute:
  summary: >
    Pukyongosaurus is based on fragmentary remains and was originally referred
    to Euhelopodidae (Dong et al., 2001). It is widely regarded as a nomen
    dubium and is otherwise placed only as an indeterminate titanosauriform or
    basal somphospondylan (D'Emic, 2012; Jones, 2026).
  history:
    - date: "2026-06-30"
      note: >
        Placed conservatively at Somphospondyli; the genus is widely treated
        as a nomen dubium.
etymology: Named after Pukyong National University in South Korea, combined with
  Greek sauros (lizard); meaning "Pukyong lizard".
pronunciation:
  phonetic: puk-YON-go-SOR-us
description: Pukyongosaurus is a genus of titanosauriform dinosaur that lived in
  South Korea during the Early Cretaceous Period (Aptian - Albian). It may have
  been closely related to Euhelopus, and is known from a series of vertebrae in
  the neck and back. The characteristics that were originally used to
  distinguish this genus have been criticized as being either widespread or too
  poorly preserved to evaluate, rendering the genus an indeterminate nomen
  dubium among titanosauriforms.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Medium-sized sauropod with somphospondylous vertebrae.
  - Neural spine of cervical vertebrae raised high and anteriorly positioned on
    the arch.
  - Parapophyses situated on the lateroventral edge of the centrum just
    posterior to the articular condyle.
  - Ventral side of cervical centrum slightly bent, either flat, with a narrow
    ventral ridge located on the posterior part.
  - Centrum of dorsal vertebra opisthocoelous with long and deep pleurocoel.
  - Haemal canal of chevron open and not bridged over dorsally.
