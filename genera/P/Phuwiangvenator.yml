genus: Phuwiangvenator
parent: Megaraptora
pronunciation:
  ipa: /fuˈwɛŋvɪnɑːtər/
description: Phuwiangvenator is an extinct genus of megaraptoran theropod that
  lived during the Early Cretaceous period in what is now Thailand. It contains
  only the type species, P. yaemniyomi. The generic name of Phuwiangvenator
  comes from the Phu Wiang mountains, where the holotype was discovered, and the
  Latin word "venator" meaning hunter. The specific name, "yaemniyomi", is in
  honor of Sudham Yaemniyom, who was a historical paleontologist from Thailand
  and the first person to discover fossils there.
diet: carnivore
