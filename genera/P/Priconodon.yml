genus: Priconodon
parent: Ankylosauria
pronunciation:
  phonetic: pry-KON-oh-don
etymology: From Greek prion (saw), konos (cone), and odon (tooth); meaning "saw cone tooth".
description: Priconodon is an extinct genus of ankylosaurian dinosaur (perhaps
  nodosaurid), mainly known from its large teeth. Its remains have been found in
  the Early Cretaceous (Aptian-Albian age) Arundel Formation of Muirkirk, Prince
  George's County, Maryland, USA, and possibly the Potomac Group, also located
  in Maryland. As an ankylosaur, Priconodon would have been a large armored
  quadrupedal herbivore, though no size estimation has been done due to the
  scarcity of described remains.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
appearance:
  integument: armored
diagnostic_features:
  - Tooth with narrow neck, swollen base, and flattened crown
  - Serrated edges meeting above at sharp angle rather than forming wide curve
    at apex
