genus: Priconodon
parent: Ankylosauria
pronunciation:
  phonetic: pry-KON-oh-don
etymology: From Greek prion (saw), konos (cone), and odon (tooth); meaning "saw cone tooth".
description: Priconodon is an extinct genus of ankylosaurian dinosaur (perhaps
  nodosaurid), mainly known from its large teeth. Its remains have been found in
  the Early Cretaceous (Aptian-Albian age) Arundel Formation of Muirkirk, Prince
  George's County, Maryland, USA, and possibly the Potomac Group, also located
  in Maryland. As an ankylosaur, Priconodon would have been a large armored
  quadrupedal herbivore, though no size estimation has been done due to the
  scarcity of described remains.
dispute:
  summary: >
    The validity of Priconodon crassus is contested. It is known essentially
    only from teeth, with a referred tibia, from the Arundel Formation of
    Maryland. Carpenter and Kirkland (1998) accepted it as a valid nodosaurid
    and gave a revised tooth-based diagnosis, West and Tibert (2004) argued from
    a morphometric analysis that it is a distinct taxon, and Coombs (1978) had
    earlier treated it as valid; other workers have instead listed it as a nomen
    dubium without comment (Olshevsky, 1991; Ford, 2000; Vickaryous et al.,
    2004). Arbour and Currie (2015) summarized this disagreement. It is retained
    at Ankylosauria incertae sedis pending resolution.
  history:
    - date: "2026-06-26"
      note: Placed at Ankylosauria incertae sedis, tooth-based and largely indeterminate.
    - date: "2026-07-21"
      note: Status set to disputed — the taxon is genuinely contested between
        substantive pro-valid treatments (Carpenter and Kirkland, 1998; West and
        Tibert, 2004) and label-only nomen-dubium listings (Olshevsky, 1991;
        Ford, 2000; Vickaryous et al., 2004). Holotype corrected from USNM 9154
        to USNM 2135 (Carpenter and Kirkland, 1998; West and Tibert, 2004).
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
appearance:
  integument: armored
diagnostic_features:
  - Tooth with narrow neck, swollen base, and flattened crown
  - Serrated edges meeting above at sharp angle rather than forming wide curve
    at apex
