genus: Phosphatotitan
parent: Lognkosauria
etymology: From 'phosphate', referring to the Moroccan phosphate deposits
  that yielded the holotype, and Greek 'titan' meaning 'giant'.
pronunciation:
  phonetic: foss-FAY-toe-TIE-tuhn
description: Phosphatotitan is an extinct genus of titanosaurian sauropod
  dinosaur known from the Late Cretaceous (Maastrichtian age) Ouled Abdoun Basin
  of Morocco. The genus contains a single species, Phosphatotitan
  khouribgaensis, known from a partial skeleton.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - marine
diagnostic_features:
  - Neural spine of dorsal vertebra transversely broader than the centrum, with
    very large wing-like processes projecting perpendicularly from the neural
    spine
  - "Caudal neural spine spoon-like: transversely expanded and anteroposteriorly
    compressed, wider dorsally than basally, and curved forward anterior to the
    centrum"
  - Pubic boot with a strong, hooked lateral projection; pubic foramen strongly
    displaced ventrally
  - Ischium distal end forming a narrow blade with camellate pneumaticity and
    numerous small pneumatopores
  - Dorsal prezygapophyses extending subhorizontally in anterior view
  - Posterior caudal neural arch surface with pneumatic fossa pierced by
    multiple pneumatic foramina
