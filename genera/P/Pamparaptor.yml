genus: Pamparaptor
parent: Deinonychosauria
etymology: "Named for the Pampas region of South America where it was found, combined with Latin 'raptor' meaning 'thief'; translates as 'thief of the Pampas'."
pronunciation:
  ipa: /ˈpɑːmpəræptər/
description: Pamparaptor is an extinct genus of paravian theropod dinosaur from
  the Late Cretaceous Portezuelo Formation of the Neuquén province in Argentine
  Patagonia. Its precise classification is uncertain, but the authors who
  described this taxon have argued that it is a dromaeosaurid. The genus
  contains a single species, P. micros (from the Greek word for "small"), which
  is known from a single specimen consisting of a mostly complete and
  fully-articulated left foot, which preserves the iconic dromaeosaur-like
  "killing claw".
diet: carnivore
locomotion: bipedal
