genus: Pamparaptor
parent: Dromaeosauridae
placement: incertae sedis
dispute:
  summary: >
    Pamparaptor is a small Patagonian deinonychosaur known only from a partial
    foot with a troodontid-like, subarctometatarsalian pes. Its describers
    interpreted it as a dromaeosaurid (Porfiri et al., 2011), rejecting an earlier
    referral to Neuquenraptor; possible unenlagiine affinities have been suggested,
    and Novas et al. (2013) could place it only as an indeterminate paravian. It is
    placed at Dromaeosauridae incertae sedis following its describers.
  history:
    - date: "2026-07-01"
      note: Moved from Deinonychosauria to Dromaeosauridae incertae sedis (dromaeosaurid with troodontid-like pes, Porfiri et al., 2011); unenlagiine and indeterminate-paravian alternatives noted.
etymology: "Named for the Pampas region of South America where it was found, combined with Latin 'raptor' meaning 'thief'; translates as 'thief of the Pampas'."
pronunciation:
  ipa: /ˈpɑːmpəræptər/
  phonetic: PAM-pah-RAP-tuhr
description: Pamparaptor is an extinct genus of paravian theropod dinosaur from
  the Late Cretaceous Portezuelo Formation of the Neuquén province in Argentine
  Patagonia. Its precise classification is uncertain, but the authors who
  described this taxon have argued that it is a dromaeosaurid. The genus
  contains a single species, P. micros (from the Greek word for "small"), which
  is known from a single specimen consisting of a mostly complete and
  fully-articulated left foot, which preserves the iconic dromaeosaur-like
  "killing claw".
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Slender metatarsal construction with metatarsal IV strongly compressed
    transversely on distal half, blade-like in caudal view
  - Metatarsals IV and III subequal in length
  - Proximal half of metatarsal III narrow with subparallel margins along its
    length
  - Metatarsal III lacking distal ginglymus
  - Metatarsal II distally overlapping metatarsal III
  - Proximally, metatarsal II approximately twice as wide as metatarsals III and
    IV
  - Phalanx II-2 longer than phalanx II-1
  - Distal end of metatarsal II with small medially-directed sulcus in cranial
    view
