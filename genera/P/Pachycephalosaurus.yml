genus: Pachycephalosaurus
parent: Pachycephalosaurinae
pronunciation:
  phonetic: pak-i-SEF-a-lo-SAWR-us
  ipa: /ˌpækɪˌsɛfələˈsɔːrəs/
etymology: "From Greek pachys (παχύς, 'thick'), kephalon (κεφαλή, 'head'), and
  sauros (σαῦρος, 'lizard'), meaning 'thick-headed lizard'"
description: Pachycephalosaurus is a genus of pachycephalosaurid ornithischian
  dinosaur. The type species, P. wyomingensis, is the only known definitive
  species. The possibly synonymous taxon, Stygimoloch, might represent a
  distinct genus or a second species, P. spinifer. It lived during the
  Maastrichtian age of the Late Cretaceous period in what is now western North
  America. Remains have been excavated in Montana, South Dakota, Wyoming, and
  Alberta. Mainly known from a single skull and a few extremely thick skull
  roofs (at 22 cm (8.7 in) thick), Pachycephalosaurus is estimated to have
  reached 4.5 m (15 ft) long and weighed 370-450 kg (820-990 lb). More complete
  fossils would come to be found in the following years.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Frontoparietal area low and only moderately thickened
  - Low parieto-squamosal shelf
  - Frontals low and fairly broad where in contact with nasals
  - Short distance from occipital condyle to posterior margin of skull
  - Less vaulted and relatively broader frontoparietal area than P. grangeri
appearance:
  features:
    - cranial dome
    - snout hornlets
    - cranial bosses
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "38786"
  - source: wikidata
    id: Q14455
  - source: gbif
    id: "4576687"
  - source: eol
    id: "52570628"
synonyms:
  - name: Tylosteus
    type: nomen rejectum
    reason: Formally rejected by ICZN in favor of Pachycephalosaurus, which became a
      conserved name.
  - name: Dracorex
    type: junior subjective
    reason: Now generally interpreted as a juvenile individual of Pachycephalosaurus.
species:
  - name: Pachycephalosaurus wyomingensis
    etymology: "Named for Wyoming, the U.S. state from which the holotype was recovered."
    status: valid
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Campanian
        - Maastrichtian
    location:
      country: US
      locality: 9 miles southwest of Warren P.O., Buck Creek
      region: US-WY
      formation: Lance
    type_specimen:
      specimen_id: [ USNM 12031 ]
      specimen_type: holotype
      institution: USNM
      material: Fragmentary frontoparietal area with squamosals and part of occipital
        region.
      completeness: fragmentary
    size:
      hip_height_m:
        min: 1.6
        max: 1.6
      length_m:
        min: 4.5
        max: 4.5
      weight_kg:
        min: 370
        max: 450
    synonyms:
      - name: Stygimoloch
        type: junior subjective
        reason: S. spinifer is currently interpreted as a juvenile of Pachycephalosaurus
          wyomingensis; if future research confirms it as distinct, the species
          would be treated as P. spinifer.
      - name: Stenotholus
        type: junior subjective
        reason: S. kohleri was reclassified as juvenile Stygimoloch spinifer; with
          Stygimoloch itself now interpreted as a juvenile of Pachycephalosaurus
          wyomingensis, Stenotholus is also treated as a junior synonym.
      - name: Pachycephalosaurus grangeri
        type: junior subjective
        reason: Erected by Brown and Schlaikjer (1943) on a more complete skull;
          now regarded as conspecific with, and a junior synonym of, the type
          species P. wyomingensis.
    erected_in: brown1943a
notable_specimens:
  - specimen_id: [BMR P2001.4.5]
    institution: BMRP
    species: Pachycephalosaurus wyomingensis
    category: pathology
    significance: "Frontal bone bears 23 lesions consistent with osteomyelitis from penetrating trauma. Cited as evidence that pachycephalosaurid domes were used in intra-specific agonistic combat rather than being taphonomic artifacts."
    references: [peterson2013a]
references:
  - id: peterson2013a
  - id: brown1943a
  - id: jones2026a
    notes: Source of the hip height estimate, and the appearance features.
