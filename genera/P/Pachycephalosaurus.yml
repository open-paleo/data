    type: nomen rejectum
    reason: Formally rejected by ICZN in favor of Pachycephalosaurus, which became a
      conserved name.
  - name: Dracorex
    type: junior subjective
    reason: Now generally interpreted as a juvenile individual of Pachycephalosaurus.
