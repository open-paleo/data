genus: Polyodontosaurus
parent: Troodontini
etymology: From Greek polys (many), odon (tooth), and sauros (lizard); meaning "many-toothed lizard".
description: Polyodontosaurus is a potentially dubious genus of troodontid
  dinosaur named in 1932 by Charles W. Gilmore for a left dentary from the
  Dinosaur Park Formation. It had been considered a synonym of Stenonychosaurus
  or Troodon for a significant time, before being declared a nomen dubium. The
  only known species is the type, P. grandis.
diet: carnivore
locomotion: bipedal
