genus: Polyodontosaurus
parent: Troodontidae
placement: incertae sedis
dispute:
  summary: >
    Polyodontosaurus grandis rests on a single troodontid dentary, CMN 8540, and
    successive workers have folded it into the Dinosaur Park troodontid complex:
    Carpenter (1982) listed it in the synonymy of Saurornithoides inequalis,
    Currie (1987) treated the dentary as Troodon material, and Varricchio et al.
    (2025) carry it in the synonymy of Troodon formosus. Van der Reest and Currie
    (2017) declared it a nomen dubium on two grounds — troodontid dentary
    morphology is not variable enough to distinguish taxa, and the reported
    provenance of CMN 8540 cannot be reconciled with the exposures at the stated
    locality, so its horizon within the formation is unrecoverable. They raised
    the possibility that Latenivenatrix mcmasterae represents the same taxon but
    declined it as untestable, and no synonymy in either direction has been
    proposed. The genus cannot be placed below family level and is retained at
    Troodontidae incertae sedis.
  history:
    - date: "2026-07-01"
      note: Moved from Troodontini (tribe dropped) to Troodontidae incertae sedis; nomen dubium, dentary-only holotype (possibly = Troodon).
pronunciation:
  phonetic: pol-ee-o-DON-to-SAWR-us
etymology: "From Greek 'polys' meaning 'many', 'odon' meaning 'tooth', and
  'sauros' meaning 'lizard'; meaning 'many-toothed lizard', for the high alveolus
  count of the type dentary."
description: Polyodontosaurus is a dubious genus of troodontid dinosaur named in
  1932 by Charles W. Gilmore for a single left dentary from the Dinosaur Park
  Formation of Alberta, Canada, which he originally took for a large lizard.
  Sternberg (1951) recognized the jaw as theropod instead, and later workers
  referred the specimen to the better-known Dinosaur Park troodontids before it
  was declared a nomen dubium. The only known species is the type, P. grandis.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - coastal
appearance:
  integument: feathered
  evidence: inferred
identifiers:
  - source: pbdb
    id: "54469"
  - source: wikidata
    id: Q48834266
species:
  - name: Polyodontosaurus grandis
    etymology: "From Latin 'grandis' meaning 'large' or 'great'."
    status: nomen dubium
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Campanian
    location:
      country: CA
      locality: Railway Cut badlands, Steveville area
      region: CA-AB
      formation: Dinosaur Park
      notes: Gilmore's locality is internally inconsistent, which van der
        Reest and Currie (2017) give as part of their reason for treating
        the species as a nomen dubium. He reports the site as about three
        miles southwest of the mouth of Berry Creek, a bearing that does not
        reach the Railway Cut badlands he also names.
    type_specimen:
      specimen_id: [ CMN 8540 ]
      specimen_type: holotype
      institution: CMN
      material: Nearly complete left dentary, edentulous, 117.5 mm long and
        bearing 35 alveoli
      completeness: fragmentary
    erected_in: gilmore1932a
    described_in: currie1987a
references:
  - id: gilmore1932a
  - id: carpenter1982a
    notes: Listed Polyodontosaurus grandis in the synonymy of Saurornithoides inequalis
  - id: currie1987a
    notes: Described and figured the holotype dentary CMN 8540 as material of Troodon
  - id: vanderreest2017a
    notes: Declared Polyodontosaurus grandis a nomen dubium on undiagnostic dentary morphology and unrecoverable provenance
  - id: varricchio2025a
    notes: Carried Polyodontosaurus grandis in the synonymy of Troodon formosus
