genus: Polyodontosaurus
parent: Troodontidae
placement: incertae sedis
dispute:
  summary: >
    Polyodontosaurus grandis, based on a single troodontid dentary, is widely
    regarded as a nomen dubium: Currie (1987) referred its material to Troodon, and
    van der Reest and Currie (2017) confirmed the dentary lacks diagnostic
    features. It cannot be placed below family level and is retained at Troodontidae
    incertae sedis.
  history:
    - date: "2026-07-01"
      note: Moved from Troodontini (tribe dropped) to Troodontidae incertae sedis; nomen dubium, dentary-only holotype (possibly = Troodon).
pronunciation:
  phonetic: pol-ee-o-DON-to-SAWR-us
etymology: From Greek polys (many), odon (tooth), and sauros (lizard); meaning
  "many-toothed lizard".
description: Polyodontosaurus is a potentially dubious genus of troodontid
  dinosaur named in 1932 by Charles W. Gilmore for a left dentary from the
  Dinosaur Park Formation. It had been considered a synonym of Stenonychosaurus
  or Troodon for a significant time, before being declared a nomen dubium. The
  only known species is the type, P. grandis.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - coastal
appearance:
  integument: feathered
  evidence: inferred
identifiers:
  - source: pbdb
    id: "54469"
  - source: wikidata
    id: Q48834266
synonyms:
  - name: Latenivenatrix
    type: possible subjective
    reason: Possible junior subjective synonym of Polyodontosaurus; identification
      is tentative. Per Olshevsky's Dinosaur Genera List.
