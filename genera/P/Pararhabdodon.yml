genus: Pararhabdodon
parent: Lambeosaurinae
pronunciation:
  phonetic: PAR-a-RAB-do-don
etymology: "From Greek 'para' meaning 'near' or 'beside' combined with the genus
  name Rhabdodon (meaning 'fluted tooth'); translates as 'near fluted tooth',
  indicating its close relationship to Rhabdodon."
description: Pararhabdodon is a genus of tsintaosaurin hadrosaurid dinosaur from
  the Maastrichtian-aged (Late Cretaceous) Tremp Group of Spain. The first
  remains were discovered from the Sant Romà d'Abella fossil locality and
  assigned to the genus Rhabdodon, and later named as the distinct species
  Pararhabdodon isonensis in 1993. Known material includes assorted postcranial
  remains, mostly vertebrae, as well as maxillae from the skull. Specimens from
  other sites, including remains from France, a maxilla previously considered
  the distinct taxon Koutalisaurus kohlerorum, an additional maxilla from
  another locality, the material assigned to the genera Blasisaurus and
  Arenysaurus, and the extensive Basturs Poble bonebed have been considered at
  different times to belong to the species, but all of these assignments have
  more recently been questioned. It was one of the last non-avian dinosaurs
  known from the fossil record that went extinct during the Cretaceous-Paleogene
  extinction event.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
diagnostic_features:
  - Maxilla with a greatly elevated jugal joint, the distance from its ventral
    margin to the ectopterygoid-shelf ridge at least equal to the dorsoventral
    depth of the caudal maxilla
  - Subvertical, concave lateral surface of the maxilla ventral to the jugal
    joint
  - Craniocaudally broad dorsal process of the maxilla
  - Proximal half of the humerus medially offset about 30° from its long axis
appearance:
  features:
    - downturned snout
  integument: scaled
  evidence: inferred
