genus: Protoceratops
parent: Protoceratopsidae
etymology: From Greek protos (first) and keratops (horned face);
  meaning "first horned face", chosen by Granger and Gregory to
  reflect their interpretation of the genus as an early, pre-
  ceratopsid member of the horned-dinosaur lineage.
pronunciation:
  phonetic: PROH-toh-SERR-uh-tops
  ipa: /ˌproʊtoʊˈsɛrətɒps/
description: >
  Protoceratops is a genus of small protoceratopsid dinosaurs that
  lived in Asia during the Late Cretaceous, around 75 to 71 million
  years ago. The genus Protoceratops includes two species: P.
  andrewsi and the larger P. hellenikorhinus. The former was
  described in 1923 with fossils from the Mongolian Djadokhta
  Formation, and the latter in 2001 with fossils from the Chinese
  Bayan Mandahu Formation. Protoceratops was initially believed to
  be an ancestor of ankylosaurians and larger ceratopsians, such as
  Triceratops and relatives, until the discoveries of other
  protoceratopsids. Populations of P. andrewsi may have evolved into
  Bagaceratops rozhdestvenskyi through anagenesis.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - arid
appearance:
  features:
    - keratinous beak
    - neck frill
    - nasal horn
  integument: scaled
  evidence: inferred
diagnostic_features:
  - Skull broadly triangular in dorsal view, with wide lateral crests
    formed mainly by posteriorly and ventrally expanded jugals.
  - Orbits very large and not surmounted by supraorbital horns.
  - Hornless skull (or with at most an incipient nasal horn-core in
    adult males formed by upwardly arched nasals).
  - Two premaxillary teeth present.
  - Parietosquamosal frill fenestrated and supporting a strong median
    parietal crest; frill length increases continuously through
    ontogeny and can exceed basal skull length in mature adults.
  - Ectopterygoid large and extensively exposed on the palate, in
    contact with the jugal — a primitive condition lost in later
    ceratopsians.
  - Sacrum elongate and narrow, with the sacral vertebra count rising
    from seven in young individuals to eight in fully adult animals.
  - Forelimb scarcely more than half the length of the hindlimb, with
    the femur shorter than the tibia and a relatively large pes
    bearing a compact metatarsus.
