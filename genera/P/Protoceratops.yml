genus: Protoceratops
parent: Protoceratopsidae
etymology: From Greek protos (first) and keratops (horned face);
  meaning "first horned face", chosen by Granger and Gregory to
  reflect their interpretation of the genus as an early, pre-
  ceratopsid member of the horned-dinosaur lineage.
pronunciation:
  phonetic: PROH-toh-SERR-uh-tops
  ipa: /ˌproʊtoʊˈsɛrətɒps/
description: >
  Protoceratops is a small, hornless protoceratopsid ceratopsian and
  the type genus of Protoceratopsidae. The skull is broadly triangular
  in dorsal view, dominated by laterally flaring jugals and a frill
  composed of fenestrated parietals and squamosals; nasals bear at
  most an incipient horn-core in adults. Granger & Gregory erected
  the genus and the type species P. andrewsi in 1923 on AMNH 6251, a
  skull from the Djadokhta Formation collected on 2 September 1922 by
  Walter Granger's party near Bayn Dzak (Shabarakh Usu / Flaming
  Cliffs) during the AMNH Central Asiatic Expedition led by Roy
  Chapman Andrews. Brown & Schlaikjer's 1940 monograph supplied a
  detailed osteology and the first comprehensive ontogenetic series
  (eggs through aged adults). Maryańska & Osmólska's 1975 monograph
  on the Polish-Mongolian Palaeontological Expedition material added
  smaller juveniles and refined the genus diagnosis. Protoceratops is
  one of the best-sampled non-avian dinosaurs ontogenetically, and
  its referred specimens include the famous "Fighting Dinosaurs"
  (MPC-D 100/512), a P. andrewsi preserved in apparent combat with a
  Velociraptor mongoliensis from the Tugrugeen Shire locality.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - arid
appearance:
  integument: scaled
  evidence: inferred
diagnostic_features:
  - Skull broadly triangular in dorsal view, with wide lateral crests
    formed mainly by posteriorly and ventrally expanded jugals.
  - Orbits very large and not surmounted by supraorbital horns.
  - Hornless skull (or with at most an incipient nasal horn-core in
    adult males formed by upwardly arched nasals).
  - Two premaxillary teeth present.
  - Parietosquamosal frill fenestrated and supporting a strong median
    parietal crest; frill length increases continuously through
    ontogeny and can exceed basal skull length in mature adults.
  - Ectopterygoid large and extensively exposed on the palate, in
    contact with the jugal — a primitive condition lost in later
    ceratopsians.
  - Sacrum elongate and narrow, with the sacral vertebra count rising
    from seven in young individuals to eight in fully adult animals.
  - Forelimb scarcely more than half the length of the hindlimb, with
    the femur shorter than the tibia and a relatively large pes
    bearing a compact metatarsus.
