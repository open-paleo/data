notable_specimens:
  - nickname: Fighting Dinosaurs
    specimen_id: [MPC-D 100/512]
    institution: MPC
    species: Protoceratops andrewsi
    category: iconic
    significance: "The Protoceratops half of the famous \"Fighting Dinosaurs\" specimen, fossilized in combat with a Velociraptor (MPC-D 100/25), giving direct evidence of predator-prey behavior. Found 3 August 1971 at the Tugriken Shire locality on a Polish-Mongolian expedition."
    discovered:
      year: 1971
    references: [barsbold1974a]
  - specimen_id: [MPC-D 100/1021]
    institution: MPC
    category: reproductive
    significance: "An embryo-bearing egg clutch reported in 2017 from the Ukhaa Tolgod locality, comprising at least 12 eggs and embryos with 6 preserving nearly complete skeletons; remains around the eggs indicate a soft-shelled composition."
    references: [erickson2017a]
  - specimen_id: [MPC-D 100/530]
    institution: MPC
    species: Protoceratops andrewsi
    category: ontogeny
    significance: "A Protoceratops nest containing 15 articulated juveniles, collected from the Tugriken Shireh locality by Mongolian-Japanese expeditions and reported in 2011, documenting early growth stages of the genus."
    references: [fastovsky2011a]
  - specimen_id: [AMNH 6418]
    institution: AMNH
    category: exceptional-preservation
    significance: "A nearly complete skeleton collected in 1923 at the Flaming Cliffs in a rolled-up position, its skull preserving a thin, wrinkled, skin-like layer interpreted as possible skin impressions; the right side of the skull reportedly still retains this layer."
    discovered:
      year: 1923
    references: [brown1940a]
  - specimen_id: [ZPAL Mg D-II/3]
    institution: ZPAL
    category: trace-association
    significance: "An articulated subadult skeleton collected in 1965 at Bayn Dzak; during preparation a four-toed digitigrade footprint cast was found below its pelvic girdle, one of the first finds of a dinosaur footprint associated with an articulated skeleton and the first for Protoceratops."
    discovered:
      year: 1965
    references: [niedźwiedzki2012a, slowiak2019a, tereshchenko2021a]
