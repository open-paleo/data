genus: Pawpawsaurus
parent: Nodosauridae
description: Pawpawsaurus, meaning "Pawpaw Lizard", is a nodosaurid ankylosaur
  from the Cretaceous (late Albian) of Tarrant County, Texas, discovered in May
  1992. The only species yet assigned to this taxon, Pawpawsaurus campbelli, is
  based on a complete skull (lacking mandibles) from the marine Paw Paw
  Formation (Washita Group).
diet: herbivore
locomotion: quadrupedal
