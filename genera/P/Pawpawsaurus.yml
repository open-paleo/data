genus: Pawpawsaurus
parent: Nodosauridae
pronunciation:
  phonetic: paw-paw-SAWR-us
etymology: Named for the Paw Paw Formation in Texas where it was discovered, combined with Greek '-saurus' meaning 'lizard'.
description: Pawpawsaurus, meaning "Pawpaw Lizard", is a nodosaurid ankylosaur
  from the Cretaceous (late Albian) of Tarrant County, Texas, discovered in May
  1992. The only species yet assigned to this taxon, Pawpawsaurus campbelli, is
  based on a complete skull (lacking mandibles) from the marine Paw Paw
  Formation (Washita Group).
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - marine
  - coastal
diagnostic_features:
  - Prevomers with rostral U-shaped ridge that opens posteriorly
  - Oval prevomer foramen
  - Lack of sagittal septum
  - Prominent W-shaped basioccipital tubera
  - Anteriorly concave and anteroposteriorly flattened quadrate
appearance:
  features:
    - body armor
    - osteoderms
  integument: armored
  evidence: direct
