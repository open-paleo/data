notable_specimens:
  - nickname: Harvey
    specimen_id: [TMP 1989.055.1234]
    institution: TMP
    category: pathology
    significance: "Skull with severe lesions on the right side, the largest 195 mm across, producing a massive hole so deep that the left-side bones are visible within it; it partly destroyed the right eye socket and probably blinded the animal on that side. It survived and died later in a mass-death assemblage."
    references: [carpenter2007a]
  - specimen_id: [DMNH 21460]
    institution: PMNS
    category: ontogeny
    significance: "Incomplete nasal of an immature P. perotorum from the Kikak-Tegoseak Quarry, Alaska, with dorsally enlarged ornamentation marking an intermediate growth stage; its posterior part shows integument complexity (a cornified pad and sheath on the nasal boss) not previously recognized in the genus."
    references: [fiorillo2013a]
