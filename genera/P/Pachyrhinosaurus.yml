genus: Pachyrhinosaurus
parent: Centrosaurinae
pronunciation:
  phonetic: pak-i-RIEN-o-SAWR-us
etymology: From Ancient Greek 'pachys' meaning 'thick', 'rhino' meaning 'nose',
  and 'sauros' meaning 'lizard'; translates as 'thick-nosed lizard', named for
  the distinctive bony mass on its snout.
description: Pachyrhinosaurus is a genus of centrosaurine ceratopsid dinosaur
  from the Late Cretaceous period of North America. The first examples were
  discovered by Charles M. Sternberg in Alberta, Canada, in 1946, and named in
  1950. Over a dozen partial skulls and a large assortment of other fossils from
  various species have been found in Alberta and Alaska.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Skull large, massive, rectangular, narrowing rapidly in front to beak
  - Top of head very broad, greatly thickened, flat or concave superiorly
  - Broad flat superior surface probably covered with chitinous sheath forming
    battering-ram
  - No horncores; external surface with vascular markings
  - Sides of nasals coarsely striated and superior surface pitted
  - No antorbital fossa; orbits small and circular
  - Occipital condyle spherical, pointing strongly downward at right angles to
    superior skull surface
  - Jaws short, deep, and massive; teeth short, thick with partly bifurcated
    roots
  - Nasals 7-10 inches thick, composed of thick massive bone, pitted and
    coarsely striated
appearance:
  integument: scaled
  evidence: inferred
