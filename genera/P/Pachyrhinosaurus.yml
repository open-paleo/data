  - name: Pachyrhinosaurus lakustai
    etymology: Honors Al Lakusta, who discovered and reported the Pipestone Creek
      bonebed.
    status: valid
    type_species: false
    period:
      name:
        - Late Cretaceous
      stage:
        - Campanian
    location:
      country: CA
      region: CA-AB
      formation: Wapiti
      locality: Pipestone Creek bonebed, near Grande Prairie
    type_specimen:
      specimen_id:
        - TMP 1986.055.0258
      specimen_type: holotype
      institution: TMP
      material: Transversely crushed adult skull, lacking most of the jugals,
        quadratojugals, quadrates, squamosals, and most of the parietals.
    diagnostic_features:
      - Smaller than P. canadensis.
      - Nasal boss and other anterior facial ornamentation (including "fist-sized
        knobs") relatively less hypertrophied than in P. canadensis.
      - Single transverse shelf of bone on the medial side of the premaxilla (a
        pair of shelves in P. canadensis and other centrosaurines).
      - Short, robust premaxillary process projecting straight forward into the
        naris (long, slender, and finger-like, curving medially, in P.
        canadensis).
      - Nasal boss fluting strong and regular, angled anterodorsally at about 45
        degrees on adult nasal bosses (irregular and vertical in P. canadensis).
      - Parietal bar curving slightly upward, with one to three median horns near
        the base of the midparietal bar (parietal bar essentially flat in P.
        canadensis).
    erected_in: currie2008a
  - name: Pachyrhinosaurus perotorum
    etymology: Honors the Perot family (Margot and H. Ross Perot and their
      children) for their support of science and science education.
    status: valid
    type_species: false
    period:
      name:
        - Late Cretaceous
      stage:
        - Maastrichtian
    location:
      country: US
      region: US-AK
      formation: Prince Creek
      locality: Kikak-Tegoseak Quarry, Colville River, North Slope
    type_specimen:
      specimen_id:
        - DMNH 21200
      specimen_type: holotype
      institution: DMNH
      material: Posterior part of a parietal, including the partial median bar,
        posterior median emargination, and autapomorphic anterior-facing horns.
    size:
      length_m:
        min: 5
        max: 5
      weight_kg:
        min: 2000
        max: 2000
    diagnostic_features:
      - Pair of short, dorsoventrally flattened horns projecting anteromedially
        and slightly dorsally from the anterior margin of the parietal transverse
        bar (unique among ceratopsids).
      - Paired fossae dorsal to the narial fossa.
      - Narrow median hump on the posterior part of the nasal boss.
      - Basal sulcus of the nasal boss extending ventrally below the dorsal rim
        of the narial fossa, making the boss relatively deeper dorsoventrally.
      - Rostral comb formed by the nasals and premaxillae (present in P. lakustai,
        absent in P. canadensis).
      - Nasal and supraorbital bosses nearly in contact, separated only by a
        narrow groove (as in P. canadensis; widely separated in P. lakustai).
    erected_in: fiorillo2012a
notable_specimens:
  - nickname: Harvey
    specimen_id:
      - TMP 1989.055.1234
    institution: TMP
    category: pathology
    significance: Skull with severe lesions on the right side, the largest 195 mm
      across, producing a massive hole so deep that the left-side bones are
      visible within it; it partly destroyed the right eye socket and probably
      blinded the animal on that side. It survived and died later in a
      mass-death assemblage.
    references:
      - carpenter2007a
  - specimen_id:
      - DMNH 21460
    institution: PMNS
    category: ontogeny
    significance: Incomplete nasal of an immature P. perotorum from the
      Kikak-Tegoseak Quarry, Alaska, with dorsally enlarged ornamentation
      marking an intermediate growth stage; its posterior part shows integument
      complexity (a cornified pad and sheath on the nasal boss) not previously
      recognized in the genus.
    references:
      - fiorillo2013a
