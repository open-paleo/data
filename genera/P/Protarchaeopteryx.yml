genus: Protarchaeopteryx
parent: Oviraptorosauria
pronunciation:
  phonetic: PROH-tahr-kee-OP-ter-iks
etymology: From Greek protos (before) and the genus name Archaeopteryx; meaning
  "before Archaeopteryx".
description: Protarchaeopteryx is a genus of turkey-sized feathered theropod
  dinosaur from China. Known from the Jianshangou bed of the Yixian Formation,
  it lived during the early Aptian age of the Early Cretaceous, approximately
  124.6 million years ago. It was probably a herbivore or omnivore, although its
  hands were very similar to those of small carnivorous dinosaurs. It appears to
  be one of the most basal members of the Oviraptorosauria, closely related to
  Incisivosaurus, or a taxon slightly less closely related to birds than
  oviraptorosaurs were.
diet: omnivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
  - forested
appearance:
  features:
    - feathered tail
    - feathered wings
  integument: feathered
diagnostic_features:
  - Claviform and unserrated dentition
  - Sternum thin and flat
  - Tail long with approximately 30 caudal vertebrae
  - Forelimb resembles Archaeopteryx with three talons, second enlarged
  - Ilium large and elongated
  - Pubes robust and distally fused
  - Hind limb long and robust with digit I reduced and dorsally migrated
  - Forelimb/hind limb index 0.7
  - Proximal metatarsals unfused
  - Torso feathers 50 mm with short robust shafts
  - Tail fan extremely well developed with feathers to 150 mm and slender
    gracile barbs
