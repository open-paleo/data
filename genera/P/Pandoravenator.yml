genus: Pandoravenator
parent: Tetanurae
etymology: "Named for 'Caja de Pandora' (Pandora's box), the type locality in Patagonia, combined with Latin 'venator' meaning 'hunter'; translates as 'Pandora hunter'."
description: Pandoravenator is a genus of theropod dinosaur from the Late
  Jurassic (Oxfordian to Tithonian) of central Patagonia (Chubut Province).
  Fossils in the form of a fragmentally preserved postcranial skeleton of this
  dinosaur were discovered and scientifically described in 2017 by
  paleontologists Oliver Rauhut and Diego Pol as the type species P.
  fernandezorum.
diet: carnivore
