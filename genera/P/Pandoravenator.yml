genus: Pandoravenator
parent: Tetanurae
etymology: "Named for 'Caja de Pandora' (Pandora's box), the type locality in Patagonia, combined with Latin 'venator' meaning 'hunter'; translates as 'Pandora hunter'."
pronunciation:
  phonetic: pan-DOH-ruh-VEN-uh-tuh
description: Pandoravenator is a genus of theropod dinosaur from the Late
  Jurassic (Oxfordian to Tithonian) of central Patagonia (Chubut Province).
  Fossils in the form of a fragmentally preserved postcranial skeleton of this
  dinosaur were discovered and scientifically described in 2017 by
  paleontologists Oliver Rauhut and Diego Pol as the type species P.
  fernandezorum.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Astragalus with anterior and distal lateral tubercles adjacent to contact
    with calcaneum
  - Anteriorly facing astragalar body offset from distal part by transverse
    groove
  - Ascending process of astragalus laminar, very low (about one-third
    astragalar body height), triangular in anterior view, inclined laterally
  - Metatarsal III shaft strongly constricted between metatarsals II and IV
  - Postzygapophyses of posterior caudal vertebrae elongate, overhanging
    approximately half the length of following centrum
appearance:
  integument: scaled
  evidence: inferred
