genus: Panamericansaurus
parent: Aeolosaurini
etymology: Named after the Pan American Energy company that financially supported the paleontological investigations, combined with Greek sauros (lizard); meaning "Pan American Energy lizard".
description: Panamericansaurus is a genus of titanosaurian sauropod dinosaur
  from the Late Cretaceous Period of Argentina. The holotype is very similar to
  known fossil material of Aeolosaurus, which Panamericansaurus is thought to be
  closely related to.
diet: herbivore
locomotion: quadrupedal
