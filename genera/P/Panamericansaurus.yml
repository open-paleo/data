genus: Panamericansaurus
parent: Aeolosaurini
pronunciation:
  phonetic: pan-uh-MERR-ih-kun-SAWR-us
etymology: Named after the Pan American Energy company that financially
  supported the paleontological investigations, combined with Greek sauros
  (lizard); meaning "Pan American Energy lizard".
description: Panamericansaurus is a genus of titanosaurian sauropod dinosaur
  from the Late Cretaceous Period of Argentina. The holotype is very similar to
  known fossil material of Aeolosaurus, which Panamericansaurus is thought to be
  closely related to.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Mid-posterior caudal vertebrae with prezygapophyses directed anterodorsally
    equal to or shorter than length of vertebral centrum base
  - Postzygapophyses located in medial position with respect to vertebral centrum
  - Spinoprezygapophyseal lamina expanded dorsoventrally in middle caudals
  - Humerus with robustness index less than 0.40
appearance:
  integument: scaled
  evidence: inferred
