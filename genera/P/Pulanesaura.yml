references:
  - id: mcphee2015a
    notes: Named Pulanesaura and recovered it as the sister of Vulcanodon plus
      later sauropods, a sauropod or not depending on the definition used.
  - id: mcphee2017a
    notes: Redescribed Pulanesaura, retaining the 2015 diagnosis and
      confirming holotype BP/1/6982; prefers a node-based Sauropoda, under
      which Pulanesaura is its sister.
  - id: paul2024a
    notes: Source of the body length and mass estimates.
  - id: jones2026b
    notes: Source of the hip height estimate; places the genus in Sauropoda
      under the stem-based definition the book adopts.
  - id: rauhut2020a
    notes: Recovered Pulanesaura outside Sauropoda as defined node-based on
      Vulcanodon and Saltasaurus, among the sauropodiform outgroups.
  - id: yates2007a
    notes: Proposed the stem-based definition of Sauropoda, all taxa closer to Saltasaurus than to Melanorosaurus.
  - id: salgado1997a
    notes: Gave the node-based definition of Sauropoda anchored on Vulcanodon.
  - id: zhang2020a
    notes: Recovered Pulanesaura as the sister of Isanosaurus plus a node-based Sauropoda.
  - id: hu2026a
    notes: Recovered Pulanesaura as the sister of a node-based Sauropoda.
  - id: barrett2024b
    notes: Advocated the node-based definition of Sauropoda, which places Pulanesaura in the labile zone outside it.
  - id: pol2022a
    notes: Used the stem-based definition of Sauropoda, which includes Pulanesaura.
  - id: rincón2022a
    notes: Used the stem-based definition of Sauropoda, under which Pulanesaura is a sauropod.
