genus: Pulanesaura
parent: Sauropoda
dispute:
  summary: >
    Pulanesaura sits at the sauropod/sauropodiform boundary. McPhee et al.
    (2015) recover it as either the least-derived sauropod or the sister
    taxon to Sauropoda, depending on whether a node- or stem-based
    definition is used, and Rauhut et al. (2020) place it as a non-
    sauropodan sauropodiform. Jones (2026) retains it within Sauropoda.
  history:
    - date: "2026-06-29"
      note: >
        Placed at Sauropoda incertae sedis following Jones (2026); the
        sister-to-Sauropoda and non-sauropod sauropodiform alternatives
        (McPhee et al., 2015; Rauhut et al., 2020) are unresolved.
etymology: "From Sesotho 'Pulane' meaning 'rain-maker/bringer' (in reference to the heavy rain conditions during collection) and Latin 'saura' (feminine of sauros) meaning 'lizard'."
pronunciation:
  phonetic: PU-lan-SOR-ruh
description: Pulanesaura is an extinct genus of basal sauropodiform known from
  the Early Jurassic (late Hettangian to Sinemurian) Upper Elliot Formation of
  the Free State, South Africa. It contains a single species, Pulanesaura
  eocollum, known from partial remains of at least two subadult to adult
  individuals.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - arid
diagnostic_features:
  - High anteriorly inclined neural spine
  - Prezygapophyses mediolaterally extensive and sheet-like
  - Anterior infradiapophyseal fossae with externally constricted,
    medially-tapering 'pinched' morphology
  - Teeth with apicobasal grooves on both labial and lingual surfaces, denticles
    restricted to apical third
  - Anterior-to-middle cervical vertebrae with anteroposteriorly short and
    dorsoventrally high neural spines
  - Dorsoventrally tall neural spines in anterior dorsal vertebrae,
    approximately three times taller than anteroposteriorly long
  - Middle-to-posterior dorsal neural arches with neural spines over 1.6 times
    as high as long
  - Anterior caudal vertebra with incipient prezygadiapophyseal laminae
  - Mediolaterally expansive radial fossa on proximal ulna
  - Tibia with proximal surface over twice as long anteroposteriorly than
    transversely wide
