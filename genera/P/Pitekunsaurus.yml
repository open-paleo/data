genus: Pitekunsaurus
parent: Colossosauria
etymology: From Mapudungun pitekun, meaning 'to discover', combined with Greek
  sauros meaning 'lizard'; meaning 'discovery lizard'
pronunciation:
  phonetic: PEE-tuh-koon-SOR-us
description: Pitekunsaurus is a genus of titanosaurian sauropod dinosaur from
  the Late Cretaceous Anacleto Formation of Neuquén, Argentina. It was described
  by L. Filippi and A. Garrido in 2008. The type species is P. macayai. The
  generic name is derived from Mapudungun pitekun, meaning "to discover", the
  epitheton honors the discoverer, oil company explorer Luis Macaya, who found
  the fossil in April 2004.
dispute:
  summary: >
    Placed conservatively within Colossosauria. The describing paper (Filippi
    and Garrido, 2008) ran no phylogenetic analysis and referred Pitekunsaurus
    only to Titanosauria, tentatively noting a possible affinity with
    Rinconsaurus. Subsequent analyses conflict: it has been recovered as an
    aeolosaurin (Coria et al., 2013) and a rinconsaur (Navarro et al., 2022),
    both within Rinconsauria, but also as a basal colossosaur outside
    Rinconsauria (González Riga et al., 2018). Colossosauria is the
    least-inclusive node these placements share.
  history:
    - date: "2026-06-30"
      note: >
        Reparented from Rinconsauria to Colossosauria; Rinconsauria membership
        is contested by González Riga et al. (2018), so it is placed at the
        shared uncontested node.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Basipterygoid processes broadly separated and projected parallelly
  - Small depressions or longitudinal grooves in spinal sector of
    spinopostzygapophyseal lamina in anterior cervical vertebrae
  - Centropostzygapophyseal lamina bifurcated proximally in anterior dorsal
    vertebrae
  - Posterior centrodiapophysial lamina with accessory lamina in anterior dorsal
    vertebrae
