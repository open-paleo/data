genus: Pitekunsaurus
parent: Rinconsauria
etymology: From Mapudungun pitekun, meaning 'to discover', combined with Greek sauros meaning 'lizard'; meaning 'discovery lizard'
description: Pitekunsaurus is a genus of titanosaurian sauropod dinosaur from
  the Late Cretaceous Anacleto Formation of Neuquén, Argentina. It was described
  by L. Filippi and A. Garrido in 2008. The type species is P. macayai. The
  generic name is derived from Mapudungun pitekun, meaning "to discover", the
  epitheton honours the discoverer, oil company explorer Luis Macaya, who found
  the fossil in April 2004.
diet: herbivore
locomotion: quadrupedal
