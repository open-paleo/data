genus: Polyonax
parent: Ceratopsidae
placement: incertae sedis
pronunciation:
  phonetic: pol-ee-OH-naks
etymology: "From Greek 'polys' meaning 'many' and 'anax' meaning 'master' or
  'lord', meaning 'master over many.'"
description: Polyonax is a genus of ceratopsid dinosaur from the Late Cretaceous
  (late Maastrichtian) Denver Formation of Colorado, United States. Founded upon
  poor remains, it is today regarded as a dubious name.
dispute:
  summary: >
    Polyonax is a nomen dubium founded on fragmentary remains; Hatcher (1907)
    abandoned the genus and removed it from Ceratopsia on account of its
    inadequate material. It is nonetheless retained here at Ceratopsidae incertae
    sedis.
  history:
    - date: "2026-06-26"
      note: Placed at Ceratopsidae incertae sedis, fragmentary indeterminate holotype.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Dorsal vertebrae higher than wide, with concave articular faces and an
    obtuse ventral tuberosity at each end of the underside of the longer centrum
  - Long bones (tibia, fibula) solid and cancellous throughout, lacking a
    medullary cavity, with a dense glistening superficial layer
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "52929"
  - source: wikidata
    id: Q142071
  - source: gbif
    id: "4823134"
  - source: eol
    id: "4531642"
species:
  - name: Polyonax mortuarius
    etymology: "From Latin 'mortuarius' meaning 'of the dead' or 'funerary'."
    status: valid
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Maastrichtian
      from_ma: 72.1
      to_ma: 66
    location:
      country: US
      region: Colorado
      formation: Laramie
      coordinates:
        - 40.285278
