genus: Polyonax
parent: Ceratopsidae
placement: incertae sedis
pronunciation:
  phonetic: pol-ee-OH-naks
etymology: "From Greek 'polys' meaning 'many' and 'anax' meaning 'master' or
  'lord', meaning 'master over many.'"
description: Polyonax is a dubious genus of ceratopsid dinosaur from the Late
  Cretaceous (Maastrichtian) of Colorado, United States, founded on fragmentary
  remains probably from the Laramie Formation.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - coastal
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "52929"
  - source: wikidata
    id: Q142071
  - source: gbif
    id: "4823134"
  - source: eol
    id: "4531642"
species:
  - name: Polyonax mortuarius
    etymology: "From Latin 'mortuarius' meaning 'of the dead' or 'funerary'."
    status: nomen dubium
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Maastrichtian
    location:
      country: US
      locality: East Bijou Creek
      region: US-CO
      formation: Laramie
      notes: Cope names no formation for the type material, only Colorado.
        The Laramie follows Carpenter and Young's (2002) reconstruction of
        Cope's 1873 Bijou Creek route, which they themselves call uncertain, and
        which leaves the Denver Formation open for a specimen collected on the
        same trip.
    type_specimen:
      specimen_id: [ AMNH FR 3950 ]
      specimen_type: holotype
      institution: AMNH
      material: At least three posterior dorsal vertebrae (neural arches co-ossified)
        and fragments of limb bones, including portions of a tibia and fibula
      completeness: fragmentary
    erected_in: cope1874a
references:
  - id: cope1874a
    notes: Names the species in a footnote, on a collection made by an assistant
      from strata in Colorado the author correlates with the Great Lignite,
      without a locality.
  - id: cope1875a
    notes: Provides a fuller description of Polyonax mortuarius than the
      original 1874 notice. Places the material at one of two localities in
      Colorado "not many miles apart", neither of them named.
  - id: hatcher1907a
    notes: Abandoned Polyonax as founded on totally inadequate material, while
      holding that the remains are undoubtedly ceratopsian and that Cope's
      supposed ischia are frontal horn cores.
  - id: carpenter2002a
    notes: Lists the holotype as an indeterminate ceratopsid, concurring with
      Hatcher (1907). Source of the Laramie attribution and the East Bijou Creek
      locality, reconstructed from Cope's 1873 route.
