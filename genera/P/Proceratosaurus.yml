genus: Proceratosaurus
parent: Proceratosauridae
pronunciation:
  ipa: /proʊsəˌrætoʊˈsɔːrəs/
  phonetic: proh-suh-RAT-oh-SAW-ruhs
etymology: "From Greek pro- (πρό, 'before' or 'precursor of') prefixed to
  Ceratosaurus, as it was originally thought to be closely related to or
  ancestral to Ceratosaurus; meaning 'before Ceratosaurus'"
description: Proceratosaurus is a genus of theropod dinosaur that lived during
  the Middle Jurassic in what is now England. The holotype and only known
  specimen consists of a mostly complete skull with an accompanying lower jaw
  and a hyoid bone, found near Minchinhampton, a town in Gloucestershire. It was
  originally described in 1910 as a species of Megalosaurus, M. bradleyi, but
  was moved to its own genus, Proceratosaurus, in 1926. The genus was named for
  its supposed close relationship with Ceratosaurus, later shown to be
  erroneous, due to perceived resemblance of Proceratosaurus's incomplete
  cranial crest to Ceratosaurus's nasal horn.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - marine
diagnostic_features:
  - Four premaxillary teeth with peculiar lateral flat longitudinal folds
    unknown elsewhere
  - Eighteen maxillary teeth (including two gaps), greater number than in
    Megalosaurus or Ceratosaurus
  - Lateral temporal opening relatively broad in whole height, differing from
    Megalosaurids
  - External narial openings differing in shape from Megalosaurus and
    Ceratosaurus
  - Ascending process of maxilla distinctly different in shape and breadth from
    Megalosaurids
  - Comb-like nasal prominence unknown elsewhere in dinosaurs
