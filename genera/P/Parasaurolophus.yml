        associated skin impressions; tail and most of the hindlimbs not
        preserved.
      completeness: partial
    erected_in: parks1922a
    described_in: sullivan1999b
  - name: Parasaurolophus cyrtocristatus
    etymology: From Greek 'kyrtos' ('curved') and Latin 'cristatus' ('crested'),
      referring to the short, strongly downcurved crest.
    status: valid
    type_species: false
    period:
      name:
        - Late Cretaceous
      stage:
        - Campanian
      from_ma: 75.56
      to_ma: 74.55
    location:
      country: US
      region: New Mexico
      formation: Fruitland
      locality: Coal Creek, near Tsaya, McKinley County
    holotype:
      specimen_id:
        - FMNH P27393
      specimen_type: holotype
      institution: FMNH
      material: Cranial crest, dorso-caudal cranium, left dentary fragment,
        cervical-caudal vertebrae, scapulae, humeri, forelimb bones, ischia,
        ilia, pubes, femora, tibiae, ribs, chevrons, phalanges.
    diagnostic_features:
      - Cranial crest short, about one-third the length of P. walkeri's (~260 mm
        behind the occiput versus ~860 mm), curving strongly posteroventrally
        rather than arcing dorsocaudally.
      - Total skull length exceeding ~1425 mm (versus ~1733 mm in P. walkeri).
      - Narial passages separated by a median bony septum (as in P. walkeri;
        absent in P. tubicen).
      - Internal narial tubes simple and paired, running from the external nares
        to the crest apex and U-bending forward into the choana.
      - Lateral diverticula positioned medially between the dorsal and ventral
        ascending tracts, divided dorsally by a sagittal septum.
      - Radius (585 mm) longer than the humerus (565 mm), unlike P. walkeri
        (humerus 520 mm exceeding radius 496 mm).
    erected_in: ostrom1961a
    described_in: sullivan1999b
  - name: Parasaurolophus tubicen
    etymology: From Latin 'tubicen' ('trumpeter'), alluding to the elongate,
      trumpet-like narial crest.
    status: valid
    type_species: false
    period:
      name:
        - Late Cretaceous
      stage:
        - Campanian
      from_ma: 73.37
      to_ma: 73.04
    location:
      country: US
      region: New Mexico
      formation: Kirtland
      member: De-na-zin
      locality: Barrel Springs area, De-na-zin Wash, San Juan County
    holotype:
      specimen_id:
        - PMU.R1250
      specimen_type: holotype
      institution: PMU
      material: Incomplete skull and narial crest, including posterior skull roof
        (parietal, postorbital, squamosal), basicranium (basioccipital,
        basisphenoid), right maxilla, jugal, and partial palatine.
    diagnostic_features:
      - Narial crest internally more complex than in P. walkeri, with a pair of
        dorsal tubes plus two further tube pairs that U-bend and coalesce into a
        single ventral tube pair.
      - Lateral diverticula paired, forming a tight U-bend and fusing anteriorly
        with the ventral ascending tubes before entering the choana.
      - Dorsal and dorsolateral surfaces of the narial crest bearing anastomosing
        furrows, absent in P. walkeri.
      - Narial crest long, in contrast to the short, sharply curved crest of P.
        cyrtocristatus.
    erected_in: wiman1931a
    described_in: sullivan1999b
notable_specimens:
  - nickname: Joe
    specimen_id:
      - RAM 14000
    institution: RAM
    category: ontogeny
    significance: The most complete and youngest Parasaurolophus known, a roughly
      one-year-old juvenile about 2.5 meters long from the Kaiparowits
      Formation. Its crest is low and hemispherical, not tubular, and it yielded
      the first cranial endocast for the genus, showing crest growth began
      earlier than in relatives.
    discovered:
      year: 2009
    references:
      - farke2013b
  - specimen_id:
      - NMMNH P-25100
    institution: NMMNH
    category: complementary
    significance: A second, nearly complete Parasaurolophus tubicen skull from New
      Mexico, found in 1995. Its CT data underpinned the 1999 monographic
      treatment of the genus and the modeling of the crest's resonant air
      passages, which reconstructed the possible sound produced by the more
      complex tubicen crest.
    discovered:
      year: 1995
    references:
      - sullivan1999b
references:
  - id: farke2013b
  - id: sullivan1999b
    notes: Revision of the genus with emended generic and species diagnoses;
      redescribes the ROM 768 holotype and describes the NMMNH P-25100 P.
      tubicen skull.
  - id: parks1922a
    notes: Erects the genus on ROM 768, a partial articulated skeleton from the
      Belly River beds (now lower Dinosaur Park Formation), Red Deer River,
      Alberta, collected in 1920.
  - id: evans2009a
    notes: Identifies frontal-platform autapomorphies, argues the holotype is a
      subadult with the crest not yet at adult expression, and restricts the
      genus to the lower Dinosaur Park Formation.
  - id: paul2024a
    notes: Source of the appearance features.
  - id: ostrom1961a
    notes: Erects Parasaurolophus cyrtocristatus on skull FMNH P27393 from the
      Fruitland Formation of New Mexico.
  - id: wiman1931a
    notes: Erects Parasaurolophus tubicen on Wiman's skull PMU.R1250 from the
      Kirtland Formation of New Mexico.
