notable_specimens:
  - nickname: Joe
    specimen_id: [RAM 14000]
    institution: RAM
    category: ontogeny
    significance: "The most complete and youngest Parasaurolophus known, a roughly one-year-old juvenile about 2.5 meters long from the Kaiparowits Formation. Its crest is low and hemispherical, not tubular, and it yielded the first cranial endocast for the genus, showing crest growth began earlier than in relatives."
    discovered:
      year: 2009
    references: [farke2013b]
  - specimen_id: [NMMNH P-25100]
    institution: NMMNH
    category: complementary
    significance: "A second, nearly complete Parasaurolophus tubicen skull from New Mexico, found in 1995. Its CT data underpinned the 1999 monographic treatment of the genus and the modeling of the crest's resonant air passages, which reconstructed the possible sound produced by the more complex tubicen crest."
    discovered:
      year: 1995
    references: [sullivan1999b]
