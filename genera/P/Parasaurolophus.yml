genus: Parasaurolophus
parent: Lambeosaurinae
etymology: From Greek para (beside, near) and the genus name Saurolophus
  (crested lizard); meaning "beside crested lizard", reflecting Parks's view
  that the new genus's affinities lay with Saurolophus from the Edmonton
  Formation.
pronunciation:
  phonetic: PAR-a-saw-ROL-o-fus
  ipa: /ˌpærəsɔːˈrɒləfəs/
description: Parasaurolophus is one of the most recognizable lambeosaurine
  hadrosaurs, distinguished by an elongate hollow cranial crest formed largely
  of the premaxillae (with the nasals) that projects well posterior to the
  occiput. Parks erected the genus in 1922 on a skull and partial articulated
  skeleton (ROM 768) collected by a University of Toronto expedition in 1920
  from the Belly River beds of the Red Deer River, Alberta — strata now assigned
  to the lower Dinosaur Park Formation. Parks himself raised the question of
  whether the hollow tubes carried air, anticipating the long-running
  interpretation that the crest housed elongated nasal passages and may have
  functioned as a resonating chamber for vocal display. Three further species
  are recognized today — P. tubicen and P. cyrtocristatus from the San Juan
  Basin and Kaiparowits regions of the southwestern United States, and the
  disputed Asian P. jiayinensis (often referred to its own genus,
  Charonosaurus). Material remains rare across the entire range, and Evans,
  Bavington and Campione (2009) documented that even the Alberta type material
  likely represents a subadult, with the crest not yet at its fully developed
  adult expression.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
  - forested
appearance:
  features:
    - hollow cranial crest
  integument: scaled
  evidence: inferred
diagnostic_features:
  - Tubular narial crest, short to long and slightly curved, composed largely of
    the premaxillae — unique among hadrosaurs.
  - Prefrontals lapping onto the ventral lateral surface of the premaxilla where
    the skull roof meets the narial crest.
  - Frontals arising from the posterior base of the crest and extending
    posteriorly to meet the nasals anterior to the rear extent of the
    squamosals.
  - Narial crest divided externally into dorsal and ventral tracts by a
    longitudinal lateral groove running nearly its full length on each side.
  - Crest interior comprises parallel thin-walled bony tubes continuous with the
    external nares.
  - Anteriorly extended pubic peduncle of the ilium strongly decurved distally
    and forming an externally overlapping joint with the pubis.
  - Cervical postzygapophyses on vertebrae 8-13 strongly elongate and curved
    ventrally, reaching ~110 mm in length.
