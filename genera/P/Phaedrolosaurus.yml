genus: Phaedrolosaurus
parent: Tetanurae
placement: incertae sedis
dispute:
  summary: >
    Phaedrolosaurus ilikensis is a nomen dubium based on a single non-diagnostic
    tooth, sometimes suggested to be dromaeosaurid; referred postcranial material has
    been separated as Xinjiangovenator. It is placed conservatively at Tetanurae
    incertae sedis.
  history:
    - date: "2026-07-02"
      note: Placed at Tetanurae incertae sedis; regarded as a nomen dubium.
etymology: "From Greek phaedros (elated, bright, gleaming) and sauros (lizard);
  meaning \"elated lizard\"."
pronunciation:
  phonetic: fee-DROH-lo-SOR-us
description: Phaedrolosaurus is a dubious genus of coelurosaurian (perhaps
  dromaeosaurid) theropod dinosaur, based on an isolated and non-diagnostic
  tooth from the Early Cretaceous Lianmuqin Formation of Wuerho, in the
  autonomous region of Xinjiang, China.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "38568"
  - source: wikidata
    id: Q2649007
  - source: gbif
    id: "4822950"
species:
  - name: Phaedrolosaurus ilikensis
    etymology: "Named for the Ilike Formation of China, where the type tooth was
      recovered."
    status: nomen dubium
    type_species: true
    period:
      name:
        - Early Cretaceous
      stage:
        - Barremian
        - Aptian
    location:
      country: CN
      locality: Wuerho, field locality 64041
      region: CN-XJ
      formation: Lianmuqin
    size:
      length_m:
        min: 3.0
        max: 4.0
    type_specimen:
      specimen_id: [ IVPP V 4024-1 ]
      specimen_type: lectotype
      institution: IVPP
      material: A single complete tooth
    erected_in: dong1973a
references:
  - id: dong1973a
  - id: xu2018c
    notes: Dates the upper Tugulu Group, of which the Lianmuqin is the
      uppermost formation, Barremian-Aptian.
  - id: sues1977a
    notes: Designated the type tooth (IVPP V 4024-1) as the lectotype of
      Phaedrolosaurus ilikensis, Dong having failed to designate a holotype.
