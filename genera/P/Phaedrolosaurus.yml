genus: Phaedrolosaurus
parent: Tetanurae
dispute:
  summary: >
    Phaedrolosaurus ilikensis is a nomen dubium based on a single non-diagnostic
    tooth, sometimes suggested to be dromaeosaurid; referred postcranial material has
    been separated as Xinjiangovenator. It is placed conservatively at Tetanurae
    incertae sedis.
  history:
    - date: "2026-07-02"
      note: Placed at Tetanurae incertae sedis; regarded as a nomen dubium.
etymology: "From Greek phaedros (elated, bright, gleaming) and sauros (lizard);
  meaning \"elated lizard\"."
pronunciation:
  phonetic: fee-DROH-lo-SOR-us
description: Phaedrolosaurus is a dubious genus of coelurosaurian (perhaps
  dromaeosaurid) theropod dinosaur, based on an isolated and non-diagnostic
  tooth from the Early Cretaceous Lianmuqin Formation of Wuerho, in the
  autonomous region of Xinjiang, China.
diet: carnivore
locomotion: bipedal
paleoenvironment:
