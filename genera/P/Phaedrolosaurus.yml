genus: Phaedrolosaurus
parent: Theropoda
placement: incertae sedis
etymology: "From Greek phaedros (elated, bright, gleaming) and sauros (lizard);
  meaning \"elated lizard\"."
pronunciation:
  phonetic: fee-DROH-lo-SOR-us
description: Phaedrolosaurus is a dubious genus of coelurosaurian (perhaps
  dromaeosaurid) theropod dinosaur, based on an isolated and non-diagnostic
  tooth from the Early Cretaceous Lianmuqin Formation of Wuerho, in the
  autonomous region of Xinjiang, China.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "38568"
  - source: wikidata
    id: Q2649007
  - source: gbif
    id: "4822950"
species:
  - name: Phaedrolosaurus ilikensis
    etymology: "Named for the Ilike Formation of China, where the type tooth was
      recovered."
    status: nomen dubium
    type_species: true
    period:
      name:
        - Early Cretaceous
      stage:
        - Valanginian
        - Hauterivian
        - Barremian
        - Aptian
        - Albian
    location:
      country: CN
      locality: Wuerho, field locality 64041
      region: CN-XJ
      formation: Lianmuqin
    size:
      length_m:
        min: 3.0
        max: 4.0
    type_specimen:
      specimen_id: [ IVPP V4024-1 ]
      specimen_type: lectotype
      institution: IVPP
      material: A single complete tooth
    erected_in: dong1973a
references:
  - id: dong1973a
  - id: rauhut2005c
    notes: Restricts the genus to the lectotype tooth from Wuerho, Lianmugin
      Formation, and gives its age as "?Valanginian-Albian".
  - id: xu2018c
    notes: Gives "(Barremian-Aptian?)" only for the Xiyunykus horizon at
      Wucaiwan, not for the Lianmuqin at Wuerho.
  - id: sues1977a
    notes: Designated the type tooth (IVPP V4024-1) as the lectotype of
      Phaedrolosaurus ilikensis, Dong having failed to designate a holotype.
  - id: zhao2008a
    notes: Treats Phaedrolosaurus ilikensis as a nomen dubium, its holotype
      tooth having no diagnostic features.
  - id: barsbold1999a
    notes: Records that Phaedrolosaurus was first assigned to Dromaeosauridae
      and has since been considered a nomen dubium.
