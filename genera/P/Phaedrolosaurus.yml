genus: Phaedrolosaurus
parent: Tetanurae
etymology: The type and only species is Phaedrolosaurus ilikensis. The generic
  name, "Phaedrolosaurus" is derived from the Greek φαιδρός, phaidros, "elated",
  referring to the animal's supposed active lifestyle. The specific name,
  "ilikensis," refers to the Ilike Formation.
description: Phaedrolosaurus is a dubious genus of coelurosaurian (perhaps
  dromaeosaurid) theropod dinosaur, based on an isolated and non-diagnostic
  tooth from the Early Cretaceous Lianmuqin Formation of Wuerho, in the
  autonomous region of Xinjiang, China.
diet: carnivore
