genus: Protoavis
parent: Theropoda
etymology: From Greek protos (first) and Latin avis (bird); meaning "first bird".
description: Protoavis is a problematic taxon known from fragmentary remains
  from Late Triassic Norian stage deposits near Post, Texas. The animal's true
  classification has been the subject of much controversy, and there are many
  different interpretations of what the taxon actually is. When it was first
  described, the fossils were described as being from a primitive bird which, if
  the identification is valid, would push back avian origins some 60–75 million
  years.
diet: carnivore
locomotion: bipedal
