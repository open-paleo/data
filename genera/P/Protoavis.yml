genus: Protoavis
parent: Theropoda
dispute:
  summary: >
    Protoavis texensis is a chimera whose avian identity is rejected by
    nearly all workers; the theropod material cannot be treated as a single
    organism.
  history:
    - date: "2026-06-30"
      note: >
        Placed at Theropoda incertae sedis (P2).
pronunciation:
  phonetic: PROH-to-AY-vis
etymology: From Greek protos (first) and Latin avis (bird); meaning "first bird".
description: Protoavis is a problematic taxon known from fragmentary remains
  from Late Triassic Norian stage deposits near Post, Texas. The animal's true
  classification has been the subject of much controversy, and there are many
  different interpretations of what the taxon actually is. When it was first
  described, the fossils were described as being from a primitive bird which, if
  the identification is valid, would push back avian origins some 60-75 million
  years.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Skull long and narrow with sharply tapered snout and relatively deep,
    expanded temporal region
  - Orbit relatively enormous, circular, directed anteriorly to permit binocular
    vision
  - Temporal region modified by loss of diapsid arch, postorbital bar, and
    squamosal-quadratojugal bar, resulting in confluence of supra- and
    infratemporal fenestrae
  - Quadrate streptostylic with development of medial orbital process and
    prokinetic hinge
  - Skull highly encephalized with cerebellum and cerebrum contacted dorsally
  - Teeth restricted to tip of jaws by loss of posterior teeth
  - Posterior cervicals heterocoelous; cervical ribs fused in adult
appearance:
  integument: scaled
  evidence: inferred
