genus: Pentaceratops
parent: Chasmosaurinae
pronunciation:
  phonetic: PEN-ta-SER-a-tops
etymology: "From Greek 'pente' meaning 'five', 'keras' meaning 'horn', and 'ops'
  meaning 'face'; translates as 'five-horned face', referring to the five
  horn-like projections on its skull."
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - wetland
diagnostic_features:
  - One median nasal horn
  - Two prominent anteroverted postorbital horns rising directly above orbit
    center
  - Two lateral jugal osseous horns projecting downward and backward below orbits
  - Elongate narrow fontanelle in dermosupraoccipital crest, not circular as in
    Monoclonius and Torosaurus
  - Borders of crest moderately sculptured with indentations especially in lower
    lateral portions
appearance:
  features:
    - nasal horn
    - brow horns
    - jugal horns
    - neck frill
    - epoccipitals
    - keratinous beak
  integument: scaled
  evidence: inferred
