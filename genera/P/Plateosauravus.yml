      specimen_type: syntype
      institution: SAM
      material: Isolated bones of two individuals, a larger and a smaller, from
        a single bone pocket.
      notes: Haughton (1924) names as co-types "Portions of two animals in South
        African Museum. Catalogue numbers as in description", and the numbers
        are those his description gives. McPhee and colleagues (2015) give a
        wider "type" series, SAM-PK-3341 to 3356, 3602, 3603 and 3607 to 3609,
        which adds the bones of a more massive animal; Haughton made No. 3608
        of that animal the type of Euskelosaurus africanus. The assemblage has
        been referred in turn to Plateosaurus, Plateosauravus, Euskelosaurus
        and back to Plateosauravus.
    erected_in: huene1932a
references:
  - id: haughton1924a
    notes: Original description, as Plateosaurus cullingworthi.
  - id: huene1932a
    notes: Erects the genus Plateosauravus for Plateosaurus cullingworthi.
  - id: mcphee2015b
    notes: Gives the "type" series as SAM-PK-3341 to 3356, 3602, 3603 and
      3607 to 3609, the last of them the heavier animal Haughton made the type
      of Euskelosaurus africanus.
  - id: paul2024a
    notes: Source of the body length and mass estimates.
  - id: wang2025a
    notes: Wudingloong phylogenetic analysis recovered Plateosauravus as sister to Ruehleia in early Massopoda
  - id: krupandan2019a
    notes: Recovered Plateosauravus as a massospondylid.
