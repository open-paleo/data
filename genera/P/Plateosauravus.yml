      material: A large assemblage from a single bone pocket representing three
        or more moderately sized individuals plus a considerably more massive
        animal known from dorsal and sacral vertebrae and an almost complete pair
        of ischia.
      notes: The type series has never been firmly delimited. SAM-PK-3607 to
        3609, the larger animal, was originally made the type material of
        Euskelosaurus africanus, and its conspecificity with the remainder is
        still doubted. The assemblage has been referred in turn to Plateosaurus,
        Plateosauravus, Euskelosaurus and back to Plateosauravus.
