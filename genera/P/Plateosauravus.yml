genus: Plateosauravus
parent: Plateosauria
placement: incertae sedis
pronunciation:
  phonetic: PLAY-tee-o-SAWR-AY-vus
etymology: "From the genus name Plateosaurus combined with Latin 'avus' meaning
  'grandfather'; translates as 'grandfather of Plateosaurus', indicating it as
  an ancestral or more primitive relative."
description: Plateosauravus is a basal plateosaurian of uncertain affinities
  from the Late Triassic Elliot Formation of South Africa.
dispute:
  summary: >
    Plateosauravus cullingworthi has been recovered in almost every
    position among early sauropodomorphs; the most recent comprehensive
    study found it a massospondylid (Krupandan, 2019), whereas other
    analyses place it in Plateosauridae or as a basal massopodan (Wang and
    others, 2025).
  history:
    - date: "2026-06-29"
      note: Placed at Plateosauria incertae sedis; bounces between Plateosauridae and basal Massopoda, the lowest node both accept.
locomotion: bipedal
paleoenvironment:
  - fluvial
  - arid
diet: herbivore
diagnostic_features:
  - Humerus disproportionately long relative to other limb bones compared to
    European Plateosaurus
  - Proximal edge of humerus more curved than in other Plateosaurus species or
    Pachysaurus
  - Distal end of humerus narrower in proportion to length than in European
    Plateosaurus or Pachysaurus
  - Femur with 4th trochanter lower than in P. stormbergensis and medial distal
    condyle stouter
  - Tibia shorter than Gryponyx africanus but much more robust, with stouter
    distal end
appearance:
  integument: scaled
  evidence: inferred
