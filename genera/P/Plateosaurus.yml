genus: Plateosaurus
parent: Plateosauridae
pronunciation:
  phonetic: PLAT-ee-o-SAWR-us
etymology: From Greek platys (broad, flat) and sauros (lizard); probably meaning "broad lizard" (often mistranslated as "flat lizard").
description: Plateosaurus is a genus of plateosaurid dinosaur that lived during
  the Late Triassic epoch of the Triassic period, around 214 to 204 million
  years ago, in what is now Central and Northern Europe. Plateosaurus is a basal
  (early) sauropodomorph dinosaur, a so-called "prosauropod". The type species
  is Plateosaurus trossingensis; before 2019, that honor was given to
  Plateosaurus engelhardti, but it was ruled as undiagnostic (i.e.
  indistinguishable from other dinosaurs) by the ICZN. Currently, there are
  three valid species; in addition to P. trossingensis, P. longiceps and P.
  gracilis are also known. However, others have been assigned in the past, and
  there is no broad consensus on the species taxonomy of plateosaurid dinosaurs.
  Similarly, there are a plethora of synonyms (invalid duplicate names) at the
  genus level.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
