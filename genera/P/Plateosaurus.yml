synonyms:
  - name: Pachysaurus
    type: preoccupied
    reason: Name preoccupied by another lizard genus; replaced by Pachysauriscus (1959), and the underlying material is now considered referable to Plateosaurus.
  - name: Pachysaurops
    type: junior objective
    reason: Coined (1961) as a replacement name for the preoccupied Pachysaurus; junior to Pachysauriscus (1959, also a Pachysaurus replacement) and ultimately referable to Plateosaurus.
  - name: Pachysauriscus
    type: junior subjective
    reason: Coined as a replacement name for the preoccupied Pachysaurus; the material is now considered referable to Plateosaurus.
  - name: Sellosaurus
    type: reassigned
    reason: Sellosaurus gracilis was reassigned to Plateosaurus gracilis.
  - name: Gresslyosaurus
    type: possible subjective
    reason: Possible junior subjective synonym of Plateosaurus; identification is tentative. Per Olshevsky's Dinosaur Genera List.
