genus: Plateosaurus
parent: Plateosauridae
pronunciation:
  phonetic: PLAT-ee-o-SAWR-us
etymology: From Greek platys (broad, flat) and sauros (lizard); probably meaning
  "broad lizard" (often mistranslated as "flat lizard").
description: Plateosaurus is a genus of plateosaurid dinosaur that lived during
  the Late Triassic epoch of the Triassic period, around 214 to 204 million
  years ago, in what is now Central and Northern Europe. Plateosaurus is a basal
  (early) sauropodomorph dinosaur, a so-called "prosauropod". The type species
  is Plateosaurus trossingensis; before 2019, that honor was given to
  Plateosaurus engelhardti, but it was ruled as undiagnostic (i.e.
  indistinguishable from other dinosaurs) by the ICZN. Currently, there are
  three valid species; in addition to P. trossingensis, P. longiceps and P.
  gracilis are also known. However, others have been assigned in the past, and
  there is no broad consensus on the species taxonomy of plateosaurid dinosaurs.
  Similarly, there are a plethora of synonyms (invalid duplicate names) at the
  genus level.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Pronounced lizard-like posture with plantigrade hind foot and laterally
    projecting femur
  - Forefoot developed as grasping hand with large-clawed, somewhat projecting
    thumb and two further long clawed fingers; fourth and fifth fingers
    rudimentary
  - Neck with 10 vertebrae, long but proportionally not excessively elongated,
    somewhat shorter than in Sellosaurus and Thecodontosaurus
  - Small, slender skull tapering extraordinarily toward front, form recalling
    Varanid skull but more slender and pointed
  - Lower jaw powerful and sharply dentate; two-edged, fairly broad teeth
    forming closed palisade
  - Broad tail with length approximating half the total length of entire animal
appearance:
  features:
    - elongate snout
    - downturned snout
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "38644"
  - source: wikidata
    id: Q131046
  - source: gbif
    id: "3239102"
  - source: eol
    id: "4531216"
synonyms:
  - name: Pachysaurus
    type: preoccupied
    reason: Name preoccupied by another lizard genus; replaced by Pachysauriscus
      (1959), and the underlying material is now considered referable to
      Plateosaurus.
  - name: Pachysaurops
    type: junior objective
    reason: Coined (1961) as a replacement name for the preoccupied Pachysaurus;
      junior to Pachysauriscus (1959, also a Pachysaurus replacement) and
      ultimately referable to Plateosaurus.
  - name: Pachysauriscus
    type: junior subjective
    reason: Coined as a replacement name for the preoccupied Pachysaurus; the
      material is now considered referable to Plateosaurus.
  - name: Sellosaurus
    type: reassigned
    reason: Sellosaurus gracilis was reassigned to Plateosaurus gracilis.
  - name: Gresslyosaurus
    type: possible subjective
    reason: Moser (2003) sinks Gresslyosaurus robustus, G. torgeri and
      plieningeri into Plateosaurus engelhardti, but argues that the type
      species G. ingens is generically distinct on a sacral character, so the
      genus-level synonymy is unsettled.
species:
  - name: Plateosaurus trossingensis
    etymology: Named for Trossingen, the town in Baden-Württemberg, Germany, where
      Plateosaurus material was recovered between 1910 and 1912.
    status: valid
    type_species: true
    period:
      name:
        - Late Triassic
      stage:
        - Norian
    location:
      country: DE
      locality: Obere Mühle
      region: DE-BW
      formation: Trossingen
    size:
      hip_height_m:
        min: 2
        max: 2
      length_m:
        min: 4.8
        max: 10
      weight_kg:
        min: 600
        max: 4000
    type_specimen:
      specimen_id:
        - SMNS 132000
      specimen_type: holotype
      institution: SMNS
      material: Complete skeleton 5.75 m long, including well-preserved skull, neck
        with 10 vertebrae, forelimbs with grasping hands, trunk, hind limbs, and
        broad tail. Found in natural articulation in rock.
      completeness: complete
    erected_in: fraas1913a
  - name: Plateosaurus engelhardti
    etymology: Named for Johann Friedrich Engelhardt, the physician who discovered
      the original fossil material near Heroldsberg, Germany in 1834.
    status: nomen dubium
    period:
      name:
        - Late Triassic
      stage:
        - Norian
    location:
      country: DE
      locality: Buchenbühl
      region: DE-BY
      formation: Trossingen
    type_specimen:
      specimen_id:
        - UEN 552
      specimen_type: lectotype
      institution: FAU
      material: "Lectotype (UEN 552): incomplete three-vertebra sacrum. Paralectotypes
        (also UEN): three dorsal vertebrae (557a, 557b, 561, 562); two caudal
        vertebrae (550, 558); a rib fragment (563a-c); a haemapophysis (551);
        the distal half of a left femur (554, 555); a left femoral head (559); a
        left tibia (556). Lectotype and paralectotypes designated in Moser
        (2003). Original syntype series largely destroyed."
      completeness: fragmentary
    size:
      length_m:
        min: 9.4
        max: 9.4
      weight_kg:
        min: 2600
        max: 2600
      hip_height_m:
        min: 2.3
        max: 2.3
    erected_in: meyer1837a
    synonyms:
      - name: Dimodosaurus
        type: junior subjective
        reason: D. poligniensis was created for material now considered referable to
          Plateosaurus engelhardti.
  - name: Plateosaurus gracilis
    etymology: From Latin 'gracilis' meaning 'slender'.
    status: valid
    type_species: false
    period:
      name:
        - Late Triassic
      stage:
        - Norian
    location:
      country: DE
      region: DE-BW
      formation: Löwenstein
      locality: Heslach, near Stuttgart
    type_specimen:
      specimen_id:
        - SMNS 5715
      specimen_type: holotype
      institution: SMNS
      material: "Incomplete postcranium: dorsal vertebrae, two primordial sacral
        vertebrae, proximal/middle caudal vertebrae, right ilium, left pubis,
        conjoined proximal ischia, and a left fibula fragment."
    size:
      length_m:
        min: 4.5
        max: 6
    diagnostic_features:
      - Neural spines of the proximal caudal vertebrae are proximodistally
        narrow, their width less than 40 percent of neural spine height.
      - Postacetabular blade of the ilium bears a larger, more sharply defined
        brevis shelf than the shorter, narrower one of the type species.
      - Postacetabular blade of the ilium shallower and more pointed than in the
        type species.
    erected_in: huene1905a
    described_in: yates2003b
notable_specimens:
  - specimen_id:
      - AMNH FARB 6810
    institution: AMNH
    category: complementary
    significance: The best-preserved skull of Plateosaurus, taken apart during
      preparation so it is available as separate bones. It was described anew in
      2011 by Prieto-Márquez and Norell, who referred it to P. erlenbergensis.
    references:
      - prieto-márquez2011a
  - specimen_id:
      - SMNS 91296
    institution: SMNS
    category: pathology
    significance: Bears lesions most likely caused by a fall or a similar form of
      trauma, though they could alternatively result from a predator attack in
      which the predator did not penetrate the tail muscle far enough to leave
      bite traces on the bone.
    references:
      - schaeffer2024a
  - specimen_id:
      - SMNS 13200
    institution: SMNS
    species: Plateosaurus trossingensis
    category: pathology
    significance: A P. trossingensis specimen whose chevron pathologies have been
      hypothesized to result from capture myopathy induced by a mud-miring trap,
      consistent with the mud-miring taphonomic scenario for the genus.
    references:
      - schaeffer2024a
