genus: Proa
parent: Styracosterna
etymology: "From Spanish 'proa' meaning 'prow', alluding to the pointed shape of the animal's predentary bone."
pronunciation:
  phonetic: PRAU
description: Proa is a genus of basal iguanodont dinosaur from the Early Cretaceous
  Escucha Formation of Aragón, Spain. The type and only species, Proa valdearinnoensis,
  is known from fragmentary remains and represents an unusual hadrosauriform from
  the Albian stage.
dispute:
  summary: >
    Proa valdearinnoensis has been recovered at the base of
    Hadrosauriformes (McDonald and others, 2012; Norman, 2014) and
    within basal Hadrosauroidea (Madzia and others, 2020); Jones (2026)
    places it in basal Styracosterna.
  history:
    - date: "2026-06-27"
      note: Placed at Styracosterna, the least-inclusive clade these
        results agree on; finer hadrosauriform/hadrosauroid placements
        reflected, not adopted.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Predentary comes to a point at rostral margin with divergent lateral
    processes (autapomorphy)
  - Dentary tooth row convex dorsally in lateral view
  - Dentary tooth row extends caudal to base of coronoid process
  - Platform between dentary tooth row and coronoid process base
  - Coronoid process expanded along rostral and caudal margins
  - Maxilla lacks rostrodorsal process
  - Quadrate straight in lateral view
  - Ilium with convex dorsal margin, non-pendant supraacetabular process,
    postacetabular process tapering without break in slope
  - Cranial pubic process concave along dorsal margin without distal expansion
appearance:
  features:
    - elongate snout
  integument: scaled
  evidence: inferred
