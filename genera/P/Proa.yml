genus: Proa
parent: Styracosterna
etymology: "From Spanish 'proa' meaning 'prow', alluding to the pointed shape of the animal's predentary bone."
pronunciation:
  phonetic: PRAU
description: Proa is a genus of basal iguanodont dinosaur from the Early Cretaceous
  Escucha Formation of Aragón, Spain. The type and only species, Proa valdearinnoensis,
  is known from fragmentary remains and represents an unusual hadrosauriform from
  the Albian stage.
dispute:
  summary: >
    Proa valdearinnoensis was recovered at the base of Hadrosauriformes by
    its describers (McDonald and colleagues, 2012), and most later analyses
    place it within that clade, as a basal hadrosauroid or close to
    Fukuisaurus or Iguanodon (Norman, 2015; Madzia and colleagues, 2019;
    Poole, 2022). Other analyses place it on the stem below Hadrosauriformes
    (Boyd and Pagnac, 2015; Bonsor and colleagues, 2023; Bertozzo and
    colleagues, 2025).
  history:
    - date: "2026-06-27"
      note: Placed at Styracosterna, the least-inclusive clade these
        results agree on; finer hadrosauriform/hadrosauroid placements
        reflected, not adopted.
    - date: "2026-10-19"
      note: >
        Retained at Styracosterna: several analyses place it below
        Hadrosauriformes.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Predentary comes to a point at rostral margin with divergent lateral
    processes (autapomorphy)
  - Dentary tooth row convex dorsally in lateral view
  - Dentary tooth row extends caudal to base of coronoid process
  - Platform between dentary tooth row and coronoid process base
  - Coronoid process expanded along rostral and caudal margins
  - Maxilla lacks rostrodorsal process
  - Quadrate straight in lateral view
  - Ilium with convex dorsal margin, non-pendant supraacetabular process,
    postacetabular process tapering without break in slope
  - Cranial pubic process concave along dorsal margin without distal expansion
appearance:
  features:
    - elongate snout
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "253831"
  - source: wikidata
    id: Q1439895
  - source: gbif
    id: "8455353"
  - source: eol
    id: "47460212"
species:
  - name: Proa valdearinnoensis
    etymology: "Named for Val de Ariño, the traditional name for the coal mines near where the first fossils were found."
    status: valid
    type_species: true
    period:
      name:
        - Early Cretaceous
      stage:
        - Albian
    location:
      country: ES
      locality: AR-1, Santa María coal mine, Ariño
      region: ES-TE
      formation: Escucha
    size:
      length_m:
        min: 5.5
        max: 5.5
      weight_kg:
        min: 1000
        max: 1000
      hip_height_m:
        min: 1.8
        max: 1.8
    erected_in: mcdonald2012a
    type_specimen:
      specimen_id: [AR-1/19]
      specimen_type: holotype
      institution: CPT
      material: Disarticulated but associated skull including premaxillae, partial
        maxillae, quadrates, supraorbitals, articulated braincase and skull roof,
        predentary, left dentary, partial right surangular, right dentary, and several
        unprepared postcranial bones.
      completeness: partial
references:
  - id: mcdonald2012a
    notes: Named Proa and recovered it in a polytomy with Iguanodon and
      Hadrosauroidea at the base of Hadrosauriformes.
  - id: paul2024a
    notes: Source of the body length and mass estimates.
  - id: jones2026a
    notes: Source of the hip height estimate, and the appearance features.
  - id: madzia2019a
    notes: Recovered Proa within basal Hadrosauroidea in osteological and phylogenetic reassessment.
  - id: norman2015a
    notes: Recovered Proa at the base of Hadrosauriformes.
  - id: poole2022a
    notes: Recovered Proa with Fukuisaurus in an Iguanodontidae that includes Iguanodon.
  - id: boyd2015b
    notes: Recovered Proa and Koshisaurus as non-hadrosauriform ankylopollexians.
  - id: bonsor2023a
    notes: Recovered Proa on the stem below Hadrosauriformes.
  - id: bertozzo2025a
    notes: Recovered Proa as the sister of Lurdusaurus, outside the node containing Iguanodon.
