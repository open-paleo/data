genus: Pterospondylus
parent: Coelophysoidea
placement: incertae sedis
dispute:
  summary: >
    Pterospondylus is based on a single Late Triassic dorsal vertebra, and
    its original description assigns it to no clade; it is generally
    regarded as a nomen dubium and a probable coelophysoid (Rauhut and
    Hungerbühler, 2000), not a ceratosaur.
pronunciation:
  phonetic: terr-oh-SPON-dih-lus
etymology: From Greek 'pteron' meaning 'wing' and 'spondylos' meaning
  'vertebra', meaning 'winged vertebra'.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - arid
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "56384"
  - source: wikidata
    id: Q871939
  - source: gbif
    id: "4571574"
species:
  - name: Pterospondylus trielbae
    etymology: "Combining 'Tri' in reference to the Triassic period during which the animal lived, and 'Elba' for the Elbe River area of Germany where the specimen was found."
    pronunciation:
      phonetic: TREE-el-bye
    status: nomen dubium
    type_species: true
    period:
      name:
        - Late Triassic
      stage:
        - Norian
    location:
      country: DE
      region: DE-ST
      locality: Baerecke-Limpricht clay pit
      formation: Arnstadt
      part: upper
      notes: >-
        Sues and Schoch (2025) give the type horizon as the top of the
        Arnstadt Formation, "Norian: Sevatian". Huene (1932) had placed it in
        the "uppermost (Rhaetic) layers", but Rauhut and Hungerbühler (2000)
        argue that the holotype, found inside a turtle carapace, came from the
        lower claystone with the turtle remains, "of Late Norian age, rather
        than Rhaetian".
    type_specimen:
      specimen_id: [ MB.R.4233 ]
      specimen_type: holotype
      institution: ZMB
      material: Incomplete dorsal vertebra.
      completeness: fragmentary
    erected_in: jaekel1914a
references:
  - id: sues2025a
    notes: >-
      Gives the type horizon as "Top of Arnstadt Formation, Middle Keuper
      Subgroup. Age: Late Triassic (Norian: Sevatian)".
  - id: huene1932a
    notes: Places the holotype in the "uppermost (Rhaetic) layers near
      Halberstadt".
  - id: jaekel1914a
  - id: rauhut2000a
    notes: Reviewed European Triassic theropods, treating Pterospondylus as a nomen dubium.
