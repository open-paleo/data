genus: Pterospondylus
parent: Coelophysoidea
dispute:
  summary: >
    Pterospondylus is based on a single Late Triassic dorsal vertebra, and
    its original description assigns it to no clade; it is generally
    regarded as a nomen dubium and a probable coelophysoid (Rauhut and
    Hungerbühler, 1998), not a ceratosaur.
  history:
    - date: "2026-06-30"
      note: >
        Evicted from Ceratosauria and placed conservatively at
        Coelophysoidea as a probable coelophysoid nomen dubium.
    - date: "2026-07-02"
      note: >
        Placed at Coelophysoidea incertae sedis; a probable coelophysoid
        nomen dubium.
pronunciation:
  phonetic: terr-oh-SPON-dih-lus
etymology: "From Greek 'pteron' meaning 'wing' and 'spondylos' meaning 'vertebra', meaning 'winged vertebra.' The species name trielbae references the Triassic period and the Elbe River area."
description: Pterospondylus is a dubious genus of theropod dinosaur from the
  Late Triassic. It was a coelophysid theropod which lived in what is now
  Germany (Trossingen Formation). The type species, Pterospondylus trielbae,
  (derived from "Tri", in reference to the Triassic period, and "Elba", for the
  Elbe River area), was described by Jaekel in 1913-14 for a single back
  vertebra found inside the shell of the Proganochelys turtle. Sometimes, it is
  aligned with Procompsognathus, or even considered to be synonymous with it,
  despite being based on a vertebra that is twice the size of the corresponding
  bone in Procompsognathus. P. trielbae has no diagnostic features and is
  therefore considered a nomen dubium.
