genus: Parksosaurus
parent: Thescelosaurinae
pronunciation:
  phonetic: PAHRK-so-SAWR-us
etymology: Named after Canadian paleontologist William A. Parks, who discovered
  the specimen, combined with Greek sauros meaning 'lizard'; meaning 'Parks's
  lizard'
description: Parksosaurus is a genus of neornithischian dinosaur from the early
  Maastrichtian-aged (Upper Cretaceous) Horseshoe Canyon Formation of Alberta,
  Canada. It is based on most of a partially articulated skeleton and partial
  skull, showing it to have been a small, bipedal, herbivorous dinosaur. It is
  one of the few described non-hadrosaurid ornithopods from the end of the
  Cretaceous in North America, existing around 70 million years ago.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - coastal
appearance:
  integument: scaled
  evidence: inferred
diagnostic_features:
  - Antorbital fenestra very small, bounded by the maxilla and lacrimal
  - Posterodorsal end of the jugal expanded anteroposteriorly
  - Posterior process of the premaxilla deep, allowing extensive maxilla-nasal
    contact
  - Cheek teeth with numerous low, rounded, parallel vertical ridges on the
    thickly enameled crown (labial on maxillary teeth, lingual on dentary teeth)
  - Frontals narrow and elongate, maximum width about two-thirds of their length
  - About 18 maxillary and 20 dentary tooth positions per side
