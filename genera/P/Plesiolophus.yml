genus: Plesiolophus
parent: Lambeosaurinae
etymology: From Ancient Greek 'plesios' (near) and 'lophos' (crest); in reference
  to this taxon's phylogenetic proximity to Parasaurolophus while retaining more
  plesiomorphic cranial anatomy.
description: Plesiolophus is an extinct genus of lambeosaurine hadrosaurid
  dinosaur known from the Late Cretaceous (Campanian age) Oldman Formation of
  Canada. The genus contains a single species, Plesiolophus warnerensis, known
  from a partial skull. It belongs to the clade Parasaurolophini, where it
  exhibits more primitive cranial characters than its relatives.
diet: herbivore
locomotion: facultative
diagnostic_features:
  - Adult frontal platform does not overhang the remainder of the frontals or
    the parietal posteriorly
  - Postorbital process of the laterosphenoid projects anterolaterodorsally
  - Dorsal surface of the parietal between the interfrontal process and the
    sagittal crest is down-warped, forming a well-developed triangular plateau
    separating the two
  - Basipterygoid processes of the parabasisphenoid stout, with a complex
    lateral topography of an anterior swelling and a posterior depression
  - Alar process of the basisphenoid is pendent, robust, and subrectangular in
    shape
  - Frontal platform is steeply inclined, and a sagittal crest is present on the
    posterior part of the parietal
