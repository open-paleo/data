genus: Plesiohadros
parent: Hadrosauromorpha
etymology: "From Greek 'plesios' meaning 'near' and 'hadros' meaning 'thick' (as
  in Hadrosauridae), meaning 'near to hadrosaurids.'"
pronunciation:
  phonetic: PLEH-see-o-HAH-dros
description: Plesiohadros is an extinct genus of hadrosauroid dinosaur. It is
  known from a partial skeleton including the skull collected at Alag Teg
  locality, from the Campanian Alagteeg Formation of southern Mongolia. The type
  species is Plesiohadros djadokhtaensis.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - lacustrine
diagnostic_features:
  - Prefrontal flares dorsolaterally to form a rugose, everted, winglike rim
    around rostrodorsal orbital margin
  - Dentary teeth with one or two accessory ridges mesial and distal to primary
    carina
  - Diastema between first dentary tooth and predentary approximately one-third
    of tooth row length
  - Dentary tooth row does not extend beyond apex of coronoid process
  - Reflected rim around oral margin of premaxilla
  - Premaxillary bill constricted abruptly behind oral margin
appearance:
  features:
    - orbital crest
  integument: scaled
  evidence: inferred
