references:
  - id: osborn1924a
  - id: molnar1990b
    notes: Finds the teeth obviously theropod but without characters for
      assignment at the infraordinal level.
  - id: lucas2001b
    notes: Treats Prodeinodon as a form genus for large theropod teeth.
  - id: yun2020a
    notes: Regards Prodeinodon-type teeth from East Asia as Acrocanthosaurus-
      like carcharodontosaurids and rejects a dromaeosaurid identity.
  - id: mo2014a
    notes: Suggests from comparable teeth that Prodeinodon is likely an
      allosauroid.
