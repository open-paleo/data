    etymology: "Named for Mongolia, where the holotype tooth was collected from the
      Oosh Formation, with the Latin suffix '-ense' meaning 'from'."
    status: nomen dubium
    type_species: true
    period:
      name:
        - Early Cretaceous
      stage:
        - Berriasian
        - Valanginian
        - Hauterivian
        - Barremian
    location:
