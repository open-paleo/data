genus: Prodeinodon
parent: Tetanurae
placement: incertae sedis
dispute:
  summary: >
    Prodeinodon is a wastebasket nomen dubium based on isolated teeth showing no
    diagnostic features; some referred teeth have been interpreted as
    carcharodontosaurid. It is placed conservatively at Tetanurae incertae sedis.
  history:
    - date: "2026-07-02"
      note: Placed at Tetanurae incertae sedis; regarded as a nomen dubium.
pronunciation:
  phonetic: pro-DY-no-don
etymology: From Greek pro (before) and the genus name Deinodon; meaning "before Deinodon".
description: Prodeinodon is a wastebasket taxon and a dubious genus of theropod
  dinosaur from the Early Cretaceous (Barremian to Aptian stages) from the
  Xinlong Formation in the Napai Basin of China and from the Oosh Formation of
  Mongolia. Two species have been formally identified (with a third informal
  species), all three known only from tooth fragments, showing no diagnostic
  features, making them difficult to classify, though they may belong to a
  carnosaur. At least some of the referred species may represent basal
  carcharodontosaurid theropods similar to Acrocanthosaurus.
diet: carnivore
locomotion: bipedal
