genus: Portellsaurus
parent: Hadrosauroidea
etymology: Named after Portell de Morella, the town in Spain where the holotype
  was recovered, combined with Greek sauros (lizard); meaning "Portell lizard".
pronunciation:
  phonetic: POR-tell-SOR-us
description: Portellsaurus is a genus of hadrosauroid dinosaur from the Lower
  Cretaceous Margas de Mirambell Formation of Spain. The genus contains a single
  species, Portellsaurus sosbaynati, known from a partial right dentary.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - coastal
diagnostic_features:
  - Absence of bulge along ventral margin directly ventral to base of coronoid
    process
  - Deep oval cavity on medial surface of mandibular adductor fossa below
    eleventh-twelfth tooth position
  - Straight morphology of ventral margin of rostral ramus
  - Dorsal and ventral dentary margins parallel
  - Presence of dentary diastema
  - Absence of dentary platform between tooth row and coronoid process
  - Coronoid process caudally inclined
  - Dentary rostral tip not raised with respect to ventral margin
