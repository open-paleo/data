genus: Paronychodon
parent: Paraves
placement: incertae sedis
dispute:
  summary: >
    Paronychodon lacustris is a classic tooth taxon founded on isolated teeth
    (Cope, 1876) and is widely regarded as a nomen dubium; the teeth have been
    attributed to many theropod lineages, most likely some member of Eumaniraptora
    (Jones et al., 2026, which lists it among nomina dubia). It is placed
    conservatively at Paraves incertae sedis.
  history:
    - date: "2026-07-01"
      note: Retained at Paraves incertae sedis as a dubious tooth taxon; a nomen dubium.
etymology: "From Greek 'para' meaning 'beside', 'onyx' meaning 'claw', and
  'odon' meaning 'tooth'; translates as 'beside claw tooth', referring to the
  claw-like nature of the tooth."
pronunciation:
  phonetic: PAH-ro-NIK-o-don
description: Paronychodon is an extinct theropod dinosaur genus. It is a tooth
  taxon, often considered dubious because of the fragmentary nature of the
  fossils, which include "buckets" of teeth from many disparate times and places
  but no other remains, and should be considered a form taxon.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
appearance:
  integument: feathered
  evidence: inferred
identifiers:
  - source: pbdb
    id: "38565"
  - source: wikidata
    id: Q2193022
  - source: gbif
    id: "4822821"
species:
  - name: Paronychodon lacustris
    etymology: "From Latin 'lacustris' meaning 'belonging to a lake' or
      'lake-dwelling', referencing the marshy, lacustrine environment inferred
      for the beds that yielded the holotype."
    status: nomen dubium
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Campanian
    location:
      country: US
      region: US-MT
      formation: Judith River
      notes: The erecting paper is titled for "the Fort Union Beds of Montana",
        but uses that name for the Fort Union bad lands of the Judith River, and
        later workers likewise place its fauna in the Judithian beds of Montana.
        No locality within Montana is published, so none is recorded.
    type_specimen:
      specimen_id: [ AMNH 3018 ]
      specimen_type: holotype
      institution: AMNH
      material: Teeth with semicircular crown section, longitudinal plicae, curved edges
      completeness: fragmentary
    erected_in: cope1876a
references:
  - id: cope1876a
    notes: Erects the species on teeth from "the Fort Union Beds of Montana",
      which the text equates with the bad lands of the Judith River. Gives no
      locality beyond that.
  - id: currie2019a
    notes: Places the tooth taxa named in this paper and its companion among
      species from the Judithian-aged beds of Montana, the source of the
      formation.
