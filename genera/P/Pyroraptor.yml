genus: Pyroraptor
parent: Dromaeosauridae
placement: incertae sedis
dispute:
  summary: >
    Pyroraptor is a fragmentary European dromaeosaurid whose finer placement is
    uncertain. It has been treated as a labile wildcard taxon (Turner et al.,
    2012), placed as a basal dromaeosaurid (Cau and Madzia, 2021), and suggested to
    have unenlagiine-like foot morphology (Longrich et al., 2022). It is placed at
    Dromaeosauridae incertae sedis.
  history:
    - date: "2026-07-01"
      note: Placed at Dromaeosauridae incertae sedis (least-inclusive uncontested clade); fragmentary, with basal-dromaeosaurid and possible unenlagiine affinities proposed.
pronunciation:
  phonetic: PIE-ro-RAP-tor
etymology: From Greek pyr (fire) and Latin raptor (thief); meaning "fire thief", named because the first fossils were found after a forest fire.
description: Pyroraptor is an extinct genus of paravian dinosaur, probably a
  dromaeosaurid or unenlagiid, from the Late Cretaceous Ibero-Armorican island,
  of what is now southern France. It lived during the late Campanian and early
  Maastrichtian stages, approximately 72 million years ago. It is known from a
  single partial specimen that was found in Provence in 1992, after a forest
  fire. The animal was named Pyroraptor olympius by Allain and Taquet in 2000.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
  - marine
diagnostic_features:
  - Deep depression on lateral face of bowed ulna below proximal extremity,
    unknown in other theropods
  - Second metatarsal ventrally concave, differing from other Dromaeosauridae
  - Large ungual claw strongly curved with asymmetrical claw grooves, medial
    groove ending dorsally at tip
  - Metatarsal II distal end deeply grooved and asymmetrical with medial condyle
    larger than lateral (dromaeosaur synapomorphy)
  - Tooth serrations restricted to posterior margin and basal half of anterior
    carina, finely serrated anteriorly
  - Second phalanx compressed laterally with ventral projection (heel) and
    deeply grooved ginglymus
