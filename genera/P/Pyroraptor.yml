genus: Pyroraptor
parent: Dromaeosauridae
etymology: fire thief
description: Pyroraptor is an extinct genus of paravian dinosaur, probably a
  dromaeosaurid or unenlagiid, from the Late Cretaceous Ibero-Armorican island,
  of what is now southern France. It lived during the late Campanian and early
  Maastrichtian stages, approximately 72 million years ago. It is known from a
  single partial specimen that was found in Provence in 1992, after a forest
  fire. The animal was named Pyroraptor olympius by Allain and Taquet in 2000.
diet: carnivore
locomotion: bipedal
