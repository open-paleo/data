genus: Probactrosaurus
parent: Hadrosauroidea
pronunciation:
  phonetic: proh-BAK-tro-SAWR-us
etymology: From Latin pro (before) and the genus name Bactrosaurus; meaning
  "before Bactrosaurus", reflecting the hypothesis that it was the direct
  ancestor of Bactrosaurus.
description: Probactrosaurus is an extinct genus of basal hadrosauroid
  iguanodontian dinosaur that lived in China during the Early Cretaceous period.
