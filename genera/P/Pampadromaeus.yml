genus: Pampadromaeus
parent: Saturnaliidae
etymology: "From Quechua 'pampa' meaning 'plain', referring to the landscape of the discovery site in southern Brazil, and Greek 'dromeus' meaning 'runner', referring to its cursorial habits."
pronunciation:
  phonetic: PAM-puh-DROH-me-us
description: Pampadromaeus is an extinct genus of basal sauropodomorph dinosaurs
  known from the Late Triassic (Carnian) Santa Maria Formation of the Paraná
  Basin in Rio Grande do Sul, southern Brazil.
dispute:
  summary: >
    Pampadromaeus barberenai is a basalmost sauropodomorph from the Late
    Triassic of Brazil, recovered within Saturnaliidae by some analyses
    but as a basal sauropodomorph outside it by others; Jones (2026)
    treats its Saturnaliidae membership as not firmly established.
  history:
    - date: "2026-06-29"
      note: Placed at Saturnaliidae following its common recovery there (P2); the basal-Sauropodomorpha-incertae-sedis alternative is recorded.
locomotion: bipedal
paleoenvironment:
  - fluvial
diet: omnivore
diagnostic_features:
  - Head longer than two-thirds of femoral length
  - Premaxilla with short subnarial process not reaching nasal
  - Sacral vertebrae with dorsoventrally expanded ribs
  - Femur with reduced medial tuberosity in head and well-developed trochanteric
    shelf
  - Epipodium significantly longer than femur (nearly 20% longer)
appearance:
  integument: scaled
  evidence: inferred
