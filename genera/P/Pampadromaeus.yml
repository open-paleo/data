    notes: Erected Pampadromaeus and placed it on the sauropodomorph stem, with
      its recovered sister taxon varying across four re-run matrices.
  - id: langer2019b
    notes: Recovered Pampadromaeus within Saturnaliidae, grouped with Saturnalia
      and Chromogisaurus in all most-parsimonious trees, on weak support.
