genus: Piveteausaurus
parent: Afrovenatorinae
pronunciation:
  phonetic: peev-toh-SAWR-us
etymology: Named after French paleontologist Jean Piveteau, who first described
  the type specimen, combined with Greek sauros (lizard); meaning "Jean
  Piveteau's lizard".
description: Piveteausaurus is a genus of theropod dinosaur known from a partial
  skull discovered in the Middle Jurassic (164.7 to 161.2 million years ago)
  Marnes de Dives of Calvados, northern France. In 2012, Thomas Holtz gave a
  possible length of 11 meters (36 ft).
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - marine
diagnostic_features:
  - Theropod with wide, long parietal table
  - Paroccipital processes beneath the condyle
  - Tuberous processes wide and moderately long
  - Very small foramen magnum
  - Massive sphenethmoid
  - Deep, thick, and low parasphenoid
  - Basipterygoid processes short and close together
appearance:
  integument: scaled
  evidence: inferred
