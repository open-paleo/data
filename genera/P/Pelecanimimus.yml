genus: Pelecanimimus
parent: Ornithomimosauria
etymology: From Latin pelecanus (pelican) and mimus (mimic); meaning "pelican mimic", referring to the long snout and throat pouch.
description: Pelecanimimus is an extinct genus of basal ("primitive")
  ornithomimosaurian dinosaur from the Early Cretaceous of Spain. It is notable
  for possessing more teeth than any other member of the Ornithomimosauria (or
  any other theropod), most of which were toothless.
diet: herbivore
locomotion: bipedal
