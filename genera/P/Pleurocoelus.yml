genus: Pleurocoelus
parent: Titanosauriformes
pronunciation:
  ipa: /ˌplʊəroʊˈsiːləs/
  phonetic: PLOOR-o-SEEL-us
etymology: From Greek pleurá ('side, rib') and koilos ('hollow'), referring to
  the deep pleurocoels (lateral hollows) on the vertebrae
description: Pleurocoelus is a genus of sauropod dinosaur named by O. C. Marsh
  in 1888 from juvenile remains found in the Arundel Formation of Maryland.
  Several authors have considered the type species, P. nanus, to be a junior
  synonym of Astrodon johnstoni, while others regard both as nomina dubia.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - coastal
diagnostic_features:
  - Teeth with compressed or flattened crowns, not spoon-shaped
  - Dentary bone slender and rounded at symphysis, not massive and deep as in
    Morosaurus
  - Dorsal vertebrae elongate and strongly opisthocœlous, with very long deep
    cavity on each side of centrum
  - Sacral vertebrae solid with deep pit behind articular surface for rib process
  - First caudal vertebra with nearly flat articular faces instead of deeply
    concave
  - Middle and distal caudals comparatively short with neural arch on front half
    of centrum
