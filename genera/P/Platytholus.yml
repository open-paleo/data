genus: Platytholus
parent: Pachycephalosaurinae
description: Platytholus is an extinct genus of pachycephalosaurid dinosaur from
  the Late Cretaceous (Maastrichtian) Hell Creek Formation of the United States.
  The genus contains a single species, P. clemensi, known from a partial skull.
