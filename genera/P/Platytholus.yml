genus: Platytholus
parent: Pachycephalosaurinae
etymology: From Greek 'platys' meaning 'flat' or 'broad' and 'tholos' meaning 'dome', referring to the flattened dome on the skull of this pachycephalosaurid.
pronunciation:
  phonetic: plah-tee-THO-luhs
description: Platytholus is an extinct genus of pachycephalosaurid dinosaur from
  the Late Cretaceous (Maastrichtian) Hell Creek Formation of the United States.
  The genus contains a single species, P. clemensi, known from a partial skull.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Reduced, laterally compressed tabular ornamentation along the dorsal margins
    of the supraorbital-postorbital
  - Dorsolateral depression on either side of the skull where the supraorbitals
    meet the frontoparietal
  - Frontoparietal dome including lateral elements trends toward rectangular in
    appearance dorsally
  - Dome not strongly arched (low, broad profile)
  - Lateral cranial elements fully incorporated into the frontoparietal without
    distinction, lobes absent on the lateral margins of the skull
appearance:
  features:
    - cranial dome
  integument: scaled
  evidence: inferred
