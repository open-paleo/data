genus: Peishansaurus
parent: Thyreophora
pronunciation:
  ipa: /ˌbeɪˌʃɑːnˈsɔːrəs/
etymology: "Named after Beishan (Peishan in older romanisation), meaning
  'Northern Mountains' in Chinese (Chinese: 北山, Běishān), in Gansu Province
  where the specimen was found, combined with Greek sauros meaning 'lizard'"
description: Peishansaurus was a genus of ornithischian dinosaur that lived
  during the Late Cretaceous period (late Santonian-Campanian stages), roughly
  85-72 million years ago.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Jaw strongly curved towards the symphysis, with narrow upward-facing surface
    below alveolar border and broader surface facing downwards and outwards
  - Antero-inferior symphyseal surface meets lower surface at blunt edge of
    approximately 120 degrees
  - Five large alveoli disproportionately large relative to the small teeth they
    contain, indicating a very young individual
  - Tooth with thick, well-defined median ridge swollen at base and tapering to
    pointed apical denticle, with two anterior and three posterior denticles
  - Tooth unlike any other in the Bohlin collections; shows only superficial
    resemblance to Ankylosaurus magniventris but differs in denticle number and
    relative rib size
