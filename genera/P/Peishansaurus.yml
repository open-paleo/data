genus: Peishansaurus
parent: Genasauria
placement: incertae sedis
pronunciation:
  ipa: /ˌbeɪˌʃɑːnˈsɔːrəs/
etymology: "Named after Beishan (Peishan in older romanisation), meaning
  'Northern Mountains' in Chinese (Chinese: 北山, Běishān), in Gansu Province
  where the specimen was found, combined with Greek sauros meaning 'lizard'"
description: Peishansaurus was a genus of ornithischian dinosaur that lived
  during the Late Cretaceous period (late Santonian-Campanian stages), roughly
  85-72 million years ago.
dispute:
  summary: >
    Peishansaurus philemys rests on the front of a small lower jaw. Bohlin
    (1953) tentatively placed it in Nodosauridae, but Vickaryous and
    colleagues (2004) consider it doubtfully ankylosaurian, and Arbour and
    Currie (2015) find it impossible to tell from the published figures
    whether it is an ankylosaur, listing it as a questionable thyreophoran.
    Carpenter (2001) lists the jaw as a possible pachycephalosaur.
  history:
    - date: "2026-06-29"
      note: Retained at Thyreophora incertae sedis; nomen dubium, holotype lost.
    - date: "2026-10-08"
      note: Type species set to nomen dubium and diagnostic features removed; Arbour and Currie (2015) cannot confirm even an ankylosaurian identity.
    - date: "2026-10-19"
      note: >
        Moved from Thyreophora to Genasauria: the thyreophoran
        assignment is itself questioned, and a pachycephalosaur reading
        has been suggested.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
appearance:
  integument: armored
  evidence: inferred
identifiers:
  - source: pbdb
    id: "65697"
  - source: wikidata
    id: Q18578488
species:
  - name: Peishansaurus philemys
    etymology: "From Greek 'phileo' meaning 'to love' and 'emys' meaning 'water
      turtle', meaning 'lover of turtles', in reference to the co-occurrence of
      the turtle Peishanemys latipons at the same site."
    status: nomen dubium
    type_species: true
    period:
      name:
        - Early Cretaceous
      stage:
        - Barremian
        - Aptian
        - Albian
    location:
      country: CN
      locality: Ehr-chia-wu-tung
      region: CN-GS
      group: Xinminpu
    type_specimen:
      specimen_type: holotype
      status: unknown
      material: A fragment comprising the anterior end of the right lower jaw.
      completeness: fragmentary
      notes: Never given a collection number; specimen potentially lost.
    erected_in: bohlin1953a
references:
  - id: bohlin1953a
    notes: Named Peishansaurus for the front of a right lower jaw and placed it
      tentatively in Nodosauridae.
  - id: jones2026a
    notes: Lists the genus among nomina dubia, possibly an ankylosaur.
  - id: arbour2015a
    notes: Finds it impossible to confirm from the figures that the type is
      ankylosaurian; no diagnosis was ever given.
  - id: maryańska1977a
    notes: Listed Peishansaurus philemys as a nomen dubium and questionable ankylosaur, the type uncatalogued at the IVPP.
  - id: vickaryous2004a
    notes: Listed Peishansaurus philemys among nomina dubia as doubtfully ankylosaurian.
  - id: carpenter2001d
    notes: Listed the jaw among undiagnosable ankylosaur taxa, as a possible pachycephalosaur.
