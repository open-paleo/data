genus: Peishansaurus
parent: Thyreophora
placement: incertae sedis
pronunciation:
  ipa: /ˌbeɪˌʃɑːnˈsɔːrəs/
etymology: "Named after Beishan (Peishan in older romanisation), meaning
  'Northern Mountains' in Chinese (Chinese: 北山, Běishān), in Gansu Province
  where the specimen was found, combined with Greek sauros meaning 'lizard'"
description: Peishansaurus was a genus of ornithischian dinosaur that lived
  during the Late Cretaceous period (late Santonian-Campanian stages), roughly
  85-72 million years ago.
dispute:
  summary: >
    Peishansaurus is a nomen dubium based on a fragmentary jaw from the
    Late Cretaceous of China, most likely a thyreophoran (possibly an
    ankylosaur); the holotype is now lost (Jones, 2026).
  history:
    - date: "2026-06-29"
      note: Retained at Thyreophora incertae sedis; nomen dubium, holotype lost.
    - date: "2026-10-08"
      note: Type species set to nomen dubium and diagnostic features removed; Arbour and Currie (2015) cannot confirm even an ankylosaurian identity.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
appearance:
  integument: armored
  evidence: inferred
identifiers:
  - source: pbdb
    id: "65697"
  - source: wikidata
    id: Q18578488
species:
  - name: Peishansaurus philemys
    etymology: "From Greek 'phileo' meaning 'to love' and 'emys' meaning 'water
      turtle', meaning 'lover of turtles', in reference to the co-occurrence of
      the turtle Peishanemys latipons at the same site."
    status: nomen dubium
    type_species: true
    period:
      name:
        - Early Cretaceous
      stage:
        - Barremian
        - Aptian
        - Albian
    location:
      country: CN
      locality: Ehr-chia-wu-tung
      region: CN-GS
      group: Xinminpu
    type_specimen:
      specimen_type: holotype
      status: unknown
      material: A fragment comprising the anterior end of the right lower jaw.
      completeness: fragmentary
      notes: Never given a collection number; specimen potentially lost.
    erected_in: bohlin1953a
references:
  - id: bohlin1953a
  - id: jones2026a
    notes: Placement and assessment in the Princeton Encyclopedia of Dinosaurs.
