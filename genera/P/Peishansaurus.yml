genus: Peishansaurus
parent: Thyreophora
pronunciation:
  ipa: /ˌbeɪˌʃɑːnˈsɔːrəs/
etymology: "Named after Beishan (Peishan in older romanisation), meaning
  'Northern Mountains' in Chinese (Chinese: 北山, Běishān), in Gansu Province
  where the specimen was found, combined with Greek sauros meaning 'lizard'"
description: Peishansaurus was a genus of ornithischian dinosaur that lived
  during the Late Cretaceous period (late Santonian-Campanian stages), roughly
  85-72 million years ago.
diet: herbivore
locomotion: quadrupedal
