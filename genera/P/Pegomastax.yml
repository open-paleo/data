genus: Pegomastax
parent: Heterodontosauridae
etymology: From Greek pego- (πηγός, 'strong' or 'stout') and mastax (μάσταξ, 'jaw' or 'mouth'), meaning 'strong jaw', referring to its robust lower jaw
description: Pegomastax is a genus of heterodontosaurid dinosaur that lived
  during the Early Jurassic of South Africa. The only known specimen was
  discovered in a 1966–1967 expedition in Transkei District of Cape Province,
  but was not described until 2012 when Paul Sereno named it as the new taxon
  Pegomastax africana. The genus name is derived from the Greek for "strong
  jaw", and the species name describes the provenance of Africa; it was
  originally spelled africanus, was corrected to africana to align with the
  gender of the genus name.
diet: herbivore
locomotion: bipedal
