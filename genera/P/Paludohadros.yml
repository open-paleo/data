genus: Paludohadros
parent: Hadrosauroidea
etymology: From Latin 'palus' (swamp), for the swampy setting of the Weald Clay,
  and Greek 'hadros' (robust or stout), a term often used for iguanodontians.
description: Paludohadros is an extinct genus of hadrosauroid ornithopod
  dinosaur known from the Early Cretaceous (Barremian age) Weald Clay Formation
  of the United Kingdom. The genus contains a single species, Paludohadros
  proudlovii, known from a partial skull and skeleton, as well as various
  isolated remains. It is one of several iguanodontian dinosaurs known from the
  Weald Basin, though all others are from older Valanginian rock layers,
  including Barilium, Hypselospinus, and Kukufeldia.
paleoenvironment:
  - lacustrine
diagnostic_features:
  - Dentary teeth with two secondary ridges and a variable number of accessory
    ridges on the lingual surface of the crown
  - Surangular with a dorsally projecting lateral process laterally offset from
    the dorsal margin of the anterior process and separated from it by a shallow
    groove
  - Humerus with a proximally extending ridge on the anteromedial surface of the
    medial distal condyle
  - Ischium with a posteroventrally curved shaft, a well-developed ischial boot
    and a laterally projecting crest on the lateral surface of the proximal
    shaft
  - Tibia with a boss on the medial surface of the proximal end
