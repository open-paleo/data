genus: Pradhania
parent: Massospondylidae
etymology: Named in honour of Dhuiya Pradhan, a fossil collector at the Indian Statistical Institute who contributed to paleontological work in India
description: Pradhania is a genus of massospondylid sauropodomorph dinosaur from
  the Sinemurian-age (Early Jurassic) Upper Dharmaram Formation of India. It was
  first named by T. S. Kutty, Sankar Chatterjee, Peter M. Galton and Paul
  Upchurch in 2007 and the type species is Pradhania gracilis. It was a
  sauropodomorph of modest size, only about four meters (13 ft) long, and is
  known from fragmentary remains. It was originally regarded as a basal
  sauropodomorph but new cladistic analysis performed by Novas et al., 2011
  suggests that Pradhania is a massospondylid. Pradhania presents two
  synapomorphies of Massospondylidae recovered in their phylogenetic analysis.
locomotion: bipedal
paleoenvironment:
  - fluvial
diet: herbivore
diagnostic_features:
  - Maxilla with very prominent medial longitudinal ridge overhanging alveolar
    margin
  - Cranial cervical vertebrae extremely elongated with central length ~4.5
    times its height
  - Spatulate teeth with coarse obliquely oriented denticles (17 or more per
    tooth)
  - Cervical vertebrae with extremely low neural spines
  - Ungual phalanx of manual digit I strongly recurved with prominent flexor
    tubercle and bilateral claw grooves
