genus: Pradhania
parent: Plateosauria
placement: incertae sedis
etymology: Named in honor of Dhuiya Pradhan, a fossil collector at the Indian Statistical Institute who contributed to paleontological work in India
pronunciation:
  phonetic: prad-han-ee-uh
description: Pradhania is a genus of plateosaurian sauropodomorph dinosaur from
  the Early Jurassic Dharmaram Formation of India. The genus contains a single
  species, Pradhania gracilis, known from a partial skeleton that includes skull
  elements, vertebrae and an incomplete hand.
locomotion: bipedal
paleoenvironment:
  - fluvial
diet: herbivore
dispute:
  summary: >
    The relationships of Pradhania gracilis are unresolved, and its fragmentary
    holotype has left it unstable in every dataset that includes it. Kutty and
    others (2007) originally recovered it as a stem sauropodomorph falling below
    Plateosauria, but at bootstrap support under 50%, and stated that more
    precise relationships could not be determined from their matrix; Knoll (2010)
    likewise concluded that the incomplete type material prevents its position
    from being decided. Reanalysis by Novas and others (2010) moved it into
    Massopoda and nested it within Massospondylidae on two synapomorphies. Later
    work instead draws it toward the unaysaurids: Ezcurra and others (2023)
    identified it as the wildcard taxon responsible for a large polytomy at the
    base of Plateosauria and recovered it as the earliest-diverging unaysaurid in
    part of their tree sample, Wang and others (2025) placed it with Macrocollum
    and Musankwa at the base of Massopoda, and Barrett and others (2026)
    recovered it within Unaysauridae. Plateosauria is the least-inclusive clade
    common to every analysis since the original description.
  history:
    - date: "2026-08-04"
      note: Broadened from Massospondylidae to Plateosauria incertae sedis. The
        massospondylid position rests on a single analysis and is not supported
        by the later work, which places Pradhania among or beside the
        unaysaurids without agreeing on where that group sits.
diagnostic_features:
  - Maxilla with very prominent medial longitudinal ridge overhanging alveolar
    margin
  - Cranial cervical vertebrae extremely elongated with central length ~4.5
    times its height
  - Spatulate teeth with coarse obliquely oriented denticles (17 or more per
    tooth)
  - Cervical vertebrae with extremely low neural spines
  - Ungual phalanx of manual digit I strongly recurved with prominent flexor
    tubercle and bilateral claw grooves
