genus: Paludititan
parent: Lithostrotia
placement: incertae sedis
pronunciation:
  phonetic: puh-LOO-di-TIE-tan
etymology: From Latin palus ('marsh' or 'swamp') and Greek Titan (a giant), meaning 'marsh titan', referring to the marshy paleoenvironment where it was found in Romania
description: Paludititan is a genus of titanosaurian sauropod dinosaur which
  lived in the area of present Romania during the Late Cretaceous. It existed in
  the island ecosystem known as Hațeg Island.
dispute:
  summary: >
    Placed within Lithostrotia as incertae sedis. The describing analysis (Csiki
    and colleagues, 2010) nested Paludititan within Titanosauria but left its position
    unresolved, recovering it as a derived titanosaur (a lithostrotian) under
    some datasets and as a basal titanosaur near Andesaurus under others; a later
    study recovers it as a basal lithostrotian (Díez Díaz and colleagues, 2018). None
    of the analyses cited recovers it as a saltasaurine or lirainosaurine.
  history:
    - date: "2026-06-30"
      note: >
        Placed at Lithostrotia incertae sedis; the describing study found its
        precise position equivocal across datasets.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - wetland
diagnostic_features:
  - Dorsal segment of anterior centrodiapophyseal lamina curves anterodorsally
    and extends parallel to posterior centrodiapophyseal lamina
  - Anterior and anteriormost mid-caudal neural spines short, upright with
    anteriorly projecting anterodorsal corner
  - Amphiplatyan and platycoelous caudal vertebrae intercalated between
    procoelous caudal vertebrae in mid-tail section
  - Posterolateral buttress on iliac peduncle of ischium
  - Long and gracile pubis
  - Accessory anterior centrodiapophyseal lamina in posterior dorsals
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "197174"
  - source: wikidata
    id: Q1930353
species:
  - name: Paludititan nalatzensis
    etymology: "Named for Nălațvad, the Romanian village near where the holotype skeleton was uncovered in the bed of the river Râul Mare."
    status: valid
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Maastrichtian
    location:
      country: RO
      locality: Nălaț-Vad
      region: RO-HD
      formation: Râul Mare Beds
      notes: >
        The describing paper gives the Sânpetru Formation. Csiki-Sava and
        colleagues (2016) call the Râul Mare Valley succession only
        tentatively referred to it, and record a proposal that it belongs to
        the Densuș-Ciula Formation instead; Díez Díaz and colleagues (2025) place
        Nălaț-Vad in the "Râul Mare Beds", either the uppermost Sînpetru
        Formation or a distinct unit.
    type_specimen:
      specimen_id: [UBB NVM1]
      specimen_type: holotype
      institution: UBB
      material: Partial skeleton including dorsal vertebrae, ribs, anterior and
        mid-caudal vertebrae, hemapophyses, partial pelvis with pubis and ischium,
        femur fragment, and ungual phalanges
      completeness: partial
    size:
      hip_height_m:
        min: 1.7
        max: 1.7
      length_m:
        min: 6
        max: 6
      weight_kg:
        min: 1000
        max: 1000
    erected_in: csiki2010a
references:
  - id: csiki2010a
  - id: jones2026b
    notes: Source of the hip height estimate.
  - id: díezdíaz2018a
    notes: Described Atsinganosaurus and recovered Paludititan as a basal lithostrotian titanosaur
  - id: díezdíaz2025a
    notes: Places the type locality in the Râul Mare Beds.
  - id: csiki-sava2016a
    notes: Treats the Râul Mare Valley succession, tentatively referred to the
      Sînpetru Formation, as a separate entity.
