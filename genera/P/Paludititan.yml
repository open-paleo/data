genus: Paludititan
parent: Lithostrotia
pronunciation:
  phonetic: puh-LOO-di-TIE-tan
etymology: From Latin palus ('marsh' or 'swamp') and Greek Titan (a giant), meaning 'marsh titan', referring to the marshy paleoenvironment where it was found in Romania
description: Paludititan is a genus of titanosaurian sauropod dinosaur which
  lived in the area of present Romania during the Late Cretaceous. It existed in
  the island ecosystem known as Hațeg Island.
dispute:
  summary: >
    Placed within Lithostrotia as incertae sedis. The describing analysis (Csiki
    et al., 2010) found conflicting topologies across datasets and resolved
    Paludititan only as a derived titanosaur, most probably a lithostrotian;
    later studies recover it as a basal lithostrotian (Diez Diaz et al., 2018;
    Navarro et al., 2022). It has never been recovered as a saltasaurine or
    lirainosaurine.
  history:
    - date: "2026-06-30"
      note: >
        Placed at Lithostrotia incertae sedis; the describing study found its
        precise position equivocal across datasets.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - wetland
diagnostic_features:
  - Dorsal segment of anterior centrodiapophyseal lamina curves anterodorsally
    and extends parallel to posterior centrodiapophyseal lamina
  - Anterior and anteriormost mid-caudal neural spines short, upright with
    anteriorly projecting anterodorsal corner
  - Amphiplatyan and platycoelous caudal vertebrae intercalated between
    procoelous caudal vertebrae in mid-tail section
  - Posterolateral buttress on iliac peduncle of ischium
  - Long and gracile pubis
  - Accessory anterior centrodiapophyseal lamina in posterior dorsals
appearance:
  integument: scaled
  evidence: inferred
