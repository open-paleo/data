genus: Paludititan
parent: Eutitanosauria
etymology: From Latin palus ('marsh' or 'swamp') and Greek Titan (a giant), meaning 'marsh titan', referring to the marshy paleoenvironment where it was found in Romania
description: Paludititan is a genus of titanosaurian sauropod dinosaur which
  lived in the area of present Romania during the Late Cretaceous. It existed in
  the island ecosystem known as Hațeg Island.
diet: herbivore
locomotion: quadrupedal
