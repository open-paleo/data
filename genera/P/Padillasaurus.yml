genus: Padillasaurus
parent: Somphospondyli
etymology: "Named for Carlos Bernardo Padilla, founder of the Centro de Investigaciones Paleontológicas in Villa de Leyva, Colombia, combined with Greek 'sauros' meaning 'lizard'."
description: Padillasaurus is an extinct genus of titanosauriform sauropod known
  from the Early Cretaceous (Barremian stage) Paja Formation in Colombia. It
  contains a single species, Padillasaurus leivaensis, known only from a single
  partial axial skeleton. Initially described as a brachiosaurid, it was
  considered to be the first South American brachiosaurid ever discovered and
  named. Before its discovery, the only known brachiosaurid material on the
  continent was very fragmentary and from the Jurassic period. However, a more
  recent study finds it to be a basal somphospondylan.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - coastal
diagnostic_features:
  - First and second caudal vertebrae with high and dorsally directed
    prezygodiapophyseal laminae that converge with centroprezygapophyseal
    laminae
  - Anterior caudal vertebrae with weakly laterally expanded transverse processes
  - First caudal vertebra with divided transverse process, dorsal section
    posterodorsally directed in first two caudals
