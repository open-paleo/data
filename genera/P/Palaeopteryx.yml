genus: Palaeopteryx
parent: Maniraptora
dispute:
  summary: >
    Palaeopteryx thomsoni is based on a fragmentary bone reidentified as the distal
    radius of a small deinonychosaur or bird; Jensen and Padian (1989) regarded the
    binomial as invalid and based on non-diagnostic material, and Jones et al.
    (2026) list it among nomina dubia. It is placed conservatively at Maniraptora
    incertae sedis.
  history:
    - date: "2026-07-01"
      note: Retained at Maniraptora incertae sedis as a dubious, non-diagnostic taxon; invalid-binomial status flagged for review.
pronunciation:
  phonetic: pay-lee-oh-TERR-iks
etymology: From Greek palaios (ancient) and pteryx (wing); meaning "ancient wing".
description: Palaeopteryx is an extinct genus of dubious paravian theropod
  dinosaur from the Morrison Formation of Colorado. The type species is P.
  thomsoni.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
appearance:
  integument: feathered
  evidence: inferred
identifiers:
  - source: pbdb
    id: "110897"
  - source: wikidata
    id: Q2027026
species:
  - name: Palaeopteryx thomsoni
    etymology: "Named in honor of Sir Arthur Thomson."
    status: nomen dubium
    type_species: true
    period:
      name:
        - Late Jurassic
      stage:
        - Kimmeridgian
        - Tithonian
      from_ma: 152.21
      to_ma: 145.06
    location:
      country: US
      region: Colorado
      formation: Morrison
      coordinates:
        - 38.583099
        - -108.397202
    holotype:
      specimen_id: [ BYU 2022 ]
      specimen_type: holotype
      institution: BYU
      material: A single bone end, reidentified by Jensen and Padian (1989) as the
        distal radius of a maniraptoran theropod (deinonychosaur or bird), having
        originally been described as the proximal tibiotarsus of a bird.
      completeness: fragmentary
    erected_in: jensen1981a
    described_in: jensen1989a
references:
  - id: jensen1981a
  - id: jensen1989a
    notes: Reidentifies the Palaeopteryx holotype BYU 2022 as the distal radius
      of a maniraptoran theropod and regards Palaeopteryx thomsoni as invalid
      (non-diagnostic and never properly diagnosed).
