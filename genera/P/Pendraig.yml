genus: Pendraig
parent: Coelophysoidea
etymology: "From Middle Welsh 'pen' meaning 'chief' or 'head' and 'draig' meaning 'dragon'; translates as 'chief dragon', a poetic reference to its discovery in Wales."
description: Pendraig is a genus of coelophysoid theropod dinosaur from South
  Wales. It contains one species, Pendraig milnerae, named after Angela Milner.
  The specimen was discovered in the Pant-y-Ffynnon quarry. In life it would
  have measured 1 m (3.3 ft) in length.
diet: carnivore
locomotion: bipedal
diagnostic_features:
  - Posteriormost dorsal vertebrae with strongly elongated centrum (ca 2.6x
    anterior height)
  - Ilium with distinctly anteroventrally slanting dorsal margin of
    preacetabular process
  - Postacetabular process posterodorsal margin curving abruptly
    posteroventrally (acute angle ~65° lateral view)
  - Pubis with pubic fenestra
  - Ischium with well-developed obturator plate but without posteroventral U or
    V-shaped notch
  - Femur with fourth trochanter posteriorly developed to height similar to
    mid-shaft depth
  - Absence of accessory hyposphene-hypantrum articulation in dorsal vertebrae
  - Anteriorly expanded neural spine in referred middle-posterior dorsal vertebra
paleoenvironment:
  - arid
