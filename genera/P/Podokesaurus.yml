  - source: pbdb
    id: "38521"
  - source: wikidata
    id: Q21446516
  - source: gbif
    id: "4822869"
species:
  - name: Podokesaurus holyokensis
    etymology: "Named for Mount Holyoke, Massachusetts, near where the
      holotype boulder was found, with the Latin suffix '-ensis' meaning
      'of'."
    status: valid
    type_species: true
    period:
      name:
        - Early Jurassic
      stage:
        - Hettangian
        - Sinemurian
    location:
      country: US
      locality: near Mount Holyoke College, Connecticut Valley
      region: US-MA
      formation: Portland
      coordinates:
        - 42.255
        - -72.582
      notes: The holotype was not collected in situ. Talbot (1911) found it in a
        boulder of sandstone that a glacier "carried two or three miles,
        possibly, and deposited not far from the site of Mount Holyoke College",
        so the coordinates locate where the boulder came to rest rather than
        where the animal was buried, and the formation is an inference about the
        outcrop the boulder was quarried from by the ice.
    size:
      length_m:
        min: 0.18
        max: 0.18
    type_specimen:
      specimen_type: holotype
      institution: YPM
      status: destroyed
      material: Partial skeleton in two halves of a split boulder, including humerus,
        shoulder elements, both femora and tibiae, left fibula, metatarsals, digits and
        unguals, pubis, ischium, ilium, 17 presacral and 13 caudal vertebrae, ribs,
        abdominal ribs, and possible skull bones.
      completeness: partial
    erected_in: talbot1911a
references:
  - id: talbot1911a
  - id: carrano2004a
    notes: Regarded the destroyed-holotype Podokesaurus as almost certainly an
      Early Jurassic coelophysoid on pelvic synapomorphies, but held little more
      could be said of its affinities.
  - id: tykoski2004a
    notes: Accepted that Podokesaurus shows coelophysoid features but placed it
      no more precisely than Theropoda incertae sedis.
  - id: bristowe2004a
    notes: Listed Podokesaurus as a junior synonym of Coelophysis without
      discussion, implying a coelophysoid placement.
  - id: paul2016a
    notes: Placed Podokesaurus among coelophysids.
  - id: jones2026c
    notes: Placement and assessment in the Princeton Encyclopedia of Dinosaurs.
