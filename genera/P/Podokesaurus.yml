genus: Podokesaurus
parent: Coelophysinae
etymology: From Greek podoces (πόδας ὠκύς, podas okys, 'swift-footed'), meaning 'swift-footed lizard', referring to its presumed agility
description: Podokesaurus is a genus of coelophysoid dinosaur that lived in what
  is now the eastern United States during the Early Jurassic Period. The first
  fossil was discovered by the geologist Mignon Talbot near Mount Holyoke,
  Massachusetts, in 1910. The specimen was fragmentary, preserving much of the
  body, limbs, and tail. In 1911, Talbot described and named the new genus and
  species Podokesaurus holyokensis based on it. The full name can be translated
  as "swift-footed lizard of Holyoke". This discovery made Talbot the first
  woman to find and describe a non-bird dinosaur. The holotype fossil was
  recognized as significant and was studied by other researchers, but was lost
  when the building it was kept in burned down in 1917; no unequivocal
  Podokesaurus specimens have since been discovered. It was made state dinosaur
  of Massachusetts in 2022.
