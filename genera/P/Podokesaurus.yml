genus: Podokesaurus
parent: Coelophysoidea
dispute:
  summary: >
    Podokesaurus holyokensis is a coelophysoid whose holotype was destroyed
    and cannot be scored in modern analyses; it is treated as a coelophysid
    (Jones, 2026) or as Theropoda incertae sedis (Tykoski and Rowe, 2004).
  history:
    - date: "2026-06-30"
      note: >
        Placed at Coelophysoidea, the least-inclusive clade the sources support
        for this lost-holotype taxon.
pronunciation:
  phonetic: po-DOH-kee-SAWR-us
etymology: From Greek podoces (πόδας ὠκύς, podas okys, 'swift-footed'), meaning 'swift-footed lizard', referring to its presumed agility
description: Podokesaurus is a genus of coelophysoid dinosaur that lived in what
  is now the eastern United States during the Early Jurassic Period. The first
  fossil was discovered by the geologist Mignon Talbot near Mount Holyoke,
  Massachusetts, in 1910. The specimen was fragmentary, preserving much of the
  body, limbs, and tail. In 1911, Talbot described and named the new genus and
  species Podokesaurus holyokensis based on it. The full name can be translated
  as "swift-footed lizard of Holyoke". This discovery made Talbot the first
  woman to find and describe a non-bird dinosaur. The holotype fossil was
  recognized as significant and was studied by other researchers, but was lost
  when the building it was kept in burned down in 1917; no unequivocal
  Podokesaurus specimens have since been discovered. It was made state dinosaur
  of Massachusetts in 2022.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - coastal
  - lacustrine
diagnostic_features:
  - Femur slender and nearly straight with fourth trochanter at distal end,
    length greater than tibia only in larger forms
  - Tibia notably longer than femur with metatarsals over half tibia length,
    indicating rapid bipedal locomotion
  - Pubis remarkably long (95mm) and thin, expanded at distal end, angled 40° to
    vertebral column
  - Ischium with narrow uniform shaft, well-rounded anteriorly, lacking postpubis
  - Hollow, light skeletal construction including hollow vertebrae with
    transverse cavities and hollow ribs
appearance:
  integument: scaled
  evidence: inferred
