genus: Pectinodon
parent: Troodontidae
etymology: From Latin pecten ('comb') and Greek odon (ὀδών, 'tooth'), meaning
  'comb tooth', referring to the comb-like serrations on the rear edge of its
  teeth
pronunciation:
  phonetic: pec-tin-o-don
description: Pectinodon is a genus of troodontid theropod dinosaurs from the end
  of the Maastrichtian age of the Late Cretaceous period (66 mya). It currently
  contains a single valid species, Pectinodon bakkeri (sometimes classified as
  Troodon bakkeri), known only from teeth.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - crowns of teeth strongly compressed laterally and recurved
  - anterior margin without serrations, denticles, or sharp translucent keel
  - posterior margin with large serrations having translucent edges, largest in
    middle
  - crown tip directed posteriorly, almost parallel to crown base
  - serrations perpendicular to vertical axis of tooth
  - first definitive serration occurs immediately below crown tip, not
    significantly smaller than crown tip
appearance:
  integument: feathered
  evidence: inferred
