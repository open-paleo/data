genus: Pedopenna
parent: Paraves
pronunciation:
  ipa: /ˌpɛdoʊˈpɛnə/
etymology: "From Latin pedo- (pes/pedis, 'foot') and penna ('feather' or 'quill'), meaning 'foot feather', referring to the long pennaceous feathers on the metatarsus"
description: Pedopenna (meaning "foot feather") is a genus of small, feathered,
  maniraptoran dinosaur from the Daohugou Beds in China. It is possibly older
  than Archaeopteryx, though the age of the Daohugou Beds where it was found is
  debated. A majority of studies suggest that the beds probably date from
  between the late Middle Jurassic (168 million years ago) and early Late
  Jurassic Period (164-152 million years ago).
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
  - forested
appearance:
  features:
    - hindlimb feathers
  integument: feathered
diagnostic_features:
  - very slender pedal phalanx I-1 (length/mid-shaft-diameter ratio about 7.2)
  - less specialized pedal digit II and phalanx II-2 longer than II-1 compared
    to dromaeosaurids and troodontids
  - short metatarsal V lacking posteromedial flange on metatarsal IV
  - hallux not reversed with pedal phalangeal portion shorter than metatarsus,
    unlike Aves including Epidendrosaurus
  - pennaceous feathers on metatarsus, approximately 45 mm long, with stiff
    rachis and flat vanes formed by parallel barbs
