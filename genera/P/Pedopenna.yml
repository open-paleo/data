genus: Pedopenna
parent: Paraves
pronunciation:
  ipa: /ˌpɛdoʊˈpɛnə/
etymology: "From Latin pedo- (pes/pedis, 'foot') and penna ('feather' or 'quill'), meaning 'foot feather', referring to the long pennaceous feathers on the metatarsus"
description: Pedopenna (meaning "foot feather") is a genus of small, feathered,
  maniraptoran dinosaur from the Daohugou Beds in China. It is possibly older
  than Archaeopteryx, though the age of the Daohugou Beds where it was found is
  debated. A majority of studies suggest that the beds probably date from
  between the late Middle Jurassic (168 million years ago) and early Late
  Jurassic Period (164-152 million years ago).
diet: carnivore
locomotion: bipedal
