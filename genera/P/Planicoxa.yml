genus: Planicoxa
parent: Iguanodontia
pronunciation:
  phonetic: plan-i-KOHK-suh
etymology: From Latin 'planus' meaning 'flat' and 'coxa' meaning 'hip',
  referring to a distinctive flat feature of the hip bones.
description: Planicoxa is a genus of advanced iguanodontian dinosaur from the
  Early Cretaceous of North America. It is known from the partial skeletons of
  several individual specimens. Its fossils were discovered in Utah, United
  States.
diet: herbivore
locomotion: bipedal
diagnostic_features:
  - Caudal vertebrae bear paired ventral ridges connecting the anterior and
    posterior chevron facets along the ventral surface.
  - Humeral head well developed and extending onto the anterior surface of the
    humerus.
  - Postacetabular blade of the ilium short and horizontally directed,
    functionally forming an antitrochanter.
paleoenvironment:
  - fluvial
  - lacustrine
