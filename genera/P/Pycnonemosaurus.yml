genus: Pycnonemosaurus
parent: Furileusauria
etymology: From Greek 'pyknos' (dense, thick) + 'nemos' (woodland, forest) +
  'sauros' (lizard), meaning 'dense forest lizard'.
description: Pycnonemosaurus is a genus of carnivorous theropod dinosaur that
  belonged to the family Abelisauridae. It was found in the Upper Cretaceous red
  conglomerate sandstones of the Cachoeira do Bom Jardim Formation, Mato Grosso,
  Brazil, and it lived during the late Campanian to early Maastrichtian stage of
  the Late Cretaceous.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Tibia with hatchet-shaped cnemial crest in side view with constricted neck
    (150 mm) and expanded distal end (195 mm)
  - Pubis with relatively small pubic foot (243 mm, less than 30% of preserved
    pubic length) with protuberance on anterolateral surface
  - Caudal vertebrae with moderate distal expansion of transverse processes,
    less pronounced than Carnotaurus
