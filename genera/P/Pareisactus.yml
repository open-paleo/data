genus: Pareisactus
parent: Rhabdodontoidea
etymology: From Greek pareisaktos (intruder); referring to the specimen being found as a single element among hundreds of hadrosaurid bones.
description: Pareisactus is a genus of rhabdodontid ornithopod dinosaur from the
  Late Cretaceous (lower Maastrichtian) Conquès Member of the Tremp Formation in
  the Southern Pyrenees of Spain. The type and only species is P. evrostos,
  known only from a single scapula.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Scapula with dorsoventral extent of proximal constriction (scapular neck) as
    deep as it is thick
  - Lateral surface of proximal scapula under acromion forming deep and thick
    roof over extremely deep deltoid fossa
  - Long glenoid apex accounting for half of maximum depth of proximal region of
    scapula
  - Well-demarcated deltoid ridge extending caudoventrally to ventral margin of
    scapular blade
  - Acromion process craniodorsally projected, lateral profile nearly parallel
    to cranial margin of glenoid
