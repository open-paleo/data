genus: Protohadros
parent: Hadrosauroidea
pronunciation:
  phonetic: PROH-to-HAD-ros
etymology: "From Greek 'protos' meaning 'first' and 'hadros' meaning 'thick' (as in Hadrosauridae), meaning 'first hadrosaur.' The specific name byrdi honors discoverer Gary Byrd."
description: Protohadros is a genus of basal hadrosaurid dinosaur from the early
  Late Cretaceous (Cenomanian stage, approximately 100-93.9 million years ago)
  of what is now Texas, United States. It is represented by the species
  Protohadros byrdi, known from a partially complete skull and associated
  postcranial remains recovered from the Woodbine Formation. Protohadros was one
  of the earliest derived hadrosaurs in North America.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - deltaic
  - fluvial
diagnostic_features:
  - Ventrally deflected muzzle with massive predentary and robust, rostrally
    expanded and deflected dentary
  - Strongly bilobate jugal-maxillary articulation
  - Elongate maxillary rostral processes
  - Retention of jugal-ectopterygoid contact
  - Short jugal-postorbital articulation
  - Ventral orientation of angular
  - Retention of surangular foramen
appearance:
  features:
    - downturned snout
  integument: scaled
  evidence: inferred
