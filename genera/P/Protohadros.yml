genus: Protohadros
parent: Hadrosauromorpha
pronunciation:
  phonetic: PROH-to-HAD-ros
etymology: "From Greek 'protos' meaning 'first' and 'hadros' meaning 'thick' (as in Hadrosauridae), meaning 'first hadrosaur.' The specific name byrdi honors discoverer Gary Byrd."
description: Protohadros is a genus of hadrosauromorph dinosaur from the early
  Late Cretaceous (Cenomanian stage, approximately 100-93.9 million years ago)
  of what is now Texas, United States. It is represented by the species
  Protohadros byrdi, known from a partially complete skull and associated
  postcranial remains recovered from the Lewisville Formation of the Woodbine
  Group. It is among the earliest hadrosauroids known from North America.
dispute:
  summary: >
    Protohadros byrdi was described as the most basal hadrosaurid under the
    expanded Hadrosauridae of Head (1998), which he diagnosed without the
    loss of the surangular foramen that Protohadros retains. Later analyses
    place it outside Hadrosauridae. Most recover it closer to hadrosaurids
    than Probactrosaurus, within Hadrosauromorpha as Norman (2014) defines
    it, often as the sister of Eolambia (Prieto-Márquez, 2010; Xing and
    colleagues, 2014; Wang and colleagues, 2017). Analyses on Norman's
    matrices instead place it below Probactrosaurus, outside
    Hadrosauromorpha (Norman, 2004, 2014).
  history:
    - date: "2026-06-27"
      note: Placed at Hadrosauromorpha following the prevailing recent
        view; the more basal position of Norman (2014) and the
        historical basal-hadrosaurid interpretation (Head, 1998)
        reflected, not adopted.
    - date: "2026-10-19"
      note: >
        Retained at Hadrosauromorpha on the analyses that place it
        closer to hadrosaurids than Probactrosaurus; supersedes the
        2026-06-27 reliance on the prevailing recent view.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - deltaic
  - fluvial
diagnostic_features:
  - Ventrally deflected muzzle with massive predentary and robust, rostrally
    expanded and deflected dentary
  - Strongly bilobate jugal-maxillary articulation
  - Elongate maxillary rostral processes
  - Retention of jugal-ectopterygoid contact
  - Short jugal-postorbital articulation
  - Ventral orientation of angular
  - Retention of surangular foramen
appearance:
  features:
    - downturned snout
  integument: scaled
  evidence: inferred
