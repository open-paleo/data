genus: Poekilopleuron
parent: Eustreptospondylinae
pronunciation:
  phonetic: PEEK-i-lo-PLOOR-on
etymology: From Greek poikilos (varied, diverse) and pleuron (rib); meaning "varied ribs".
description: Poekilopleuron is a genus of carnosaurian theropod dinosaur, which
  lived during the middle Bathonian of the Jurassic, about 168 to 166 million
  years ago. The genus has been used under many different spelling variants,
  although only one, Poekilopleuron, is valid. The type species is P.
  bucklandii, named after William Buckland, and many junior synonyms of it have
  also been erected. Little material is currently known, as the holotype was
  destroyed in World War II, although many casts of the material still exist.
diet: carnivore
locomotion: bipedal
