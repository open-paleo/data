genus: Poekilopleuron
parent: Megalosauridae
dispute:
  summary: >
    Poekilopleuron bucklandii is a fragmentary taxon, its holotype destroyed in
    World War II, with an unstable position. Carrano et al. (2012) recover it
    tentatively as an afrovenatorine megalosaurid but note that a single step
    moves it to Piatnitzkysauridae or Allosauria; Benson (2010) recovers it as an
    allosauroid; and Cau (2024) treats it as a megalosauroid and the senior
    synonym of Dubreuillosaurus.
  history:
    - date: "2026-07-01"
      note: Placed at Megalosauridae following the prevailing analyses; its afrovenatorine assignment is tentative and an allosauroid position cannot be excluded.
pronunciation:
  phonetic: PEEK-i-lo-PLOOR-on
etymology: From Greek poikilos (varied, diverse) and pleuron (rib); meaning "varied ribs".
description: Poekilopleuron is a genus of megalosaurid theropod dinosaur, which
  lived during the middle Bathonian of the Jurassic, about 168 to 166 million
  years ago. The genus has been used under many different spelling variants,
  although only one, Poekilopleuron, is valid. The type species is P.
  bucklandii, named after William Buckland, and many junior synonyms of it have
  also been erected. Little material is currently known, as the holotype was
  destroyed in World War II, although many casts of the material still exist.
diet: carnivore
