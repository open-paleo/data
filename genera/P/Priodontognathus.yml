genus: Priodontognathus
parent: Ankylosauria
placement: incertae sedis
etymology: "From Greek 'prion' meaning 'saw', 'odous/odontos' meaning 'tooth', and 'gnathos' meaning 'jaw', meaning 'saw tooth jaw.'"
pronunciation:
  phonetic: PRY-oh-don-TOG-nah-thus
description: Priodontognathus is a genus of ankylosaurian dinosaur possibly from
  the Late Jurassic (Oxfordian-aged) Lower Calcareous Grit of Yorkshire,
  England. It is a dubious genus based on a maxilla, and has been erroneously
  mixed up with iguanodonts and stegosaurs.
dispute:
  summary: >
    Priodontognathus is a nomen dubium based on a single maxilla with a long history of misidentification. It is retained at Ankylosauria incertae sedis.
  history:
    - date: "2026-06-26"
      note: Placed at Ankylosauria incertae sedis, undiagnostic single-element nomen dubium.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - marine
diagnostic_features:
  - "Jugal process: posteriorly-directed, claw-like process on maxilla prolonged
    outward and backward with concave inner surface"
  - "Tooth sockets: 18 semiovate sockets of moderate crowding, smaller than
    Iguanodon, more like Scelidosaurus"
  - "Dental foramina: unusually large perforations along lower external alveolar
    border, one per tooth, larger than in Teratosaurus or Megalosaurus"
  - "Teeth crowns: more compressed mediolaterally than Echinodon, with 5-7
    denticles per serrated side, lacking basal thickening, terminating in sharp
    point"
  - "Nasal process: ascending process on middle of upper margin ~1.5 inches
    high, thin and posteriorly-extended, dividing orbit from naris"
  - "Infraorbital canal: remarkable longitudinal groove on dorsal surface
    originating near anterior end, bifurcating into larger inner and smaller
    outer portions"
appearance:
  integument: armored
  evidence: inferred
