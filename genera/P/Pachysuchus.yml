genus: Pachysuchus
parent: Sauropodomorpha
placement: incertae sedis
pronunciation:
  phonetic: PAK-i-SOO-kus
etymology: From Greek pachys (παχύς, 'thick') and Latin/Greek suchos (from
  Σοῦχος, 'crocodile'), meaning 'thick crocodile', a reference to the robust
  snout
description: Pachysuchus is a dubious extinct genus of basal sauropodomorph
  dinosaur from the Early Jurassic of China.
dispute:
  summary: >
    Pachysuchus imperfectus, from the Early Jurassic of China, was
    originally described as a phytosaur; reidentification of the holotype
    showed it to be an indeterminate early sauropodomorph and a nomen
    dubium (Barrett and Xu, 2012).
  history:
    - date: "2026-06-29"
      note: Placed at Sauropodomorpha incertae sedis; nomen dubium, originally misidentified as a phytosaur.
    - date: "2026-07-20"
      note: Species status set to nomen dubium, following Barrett and Xu
        (2012), who found the holotype snout to bear no autapomorphies or
        unique character combination; age widened to Hettangian–Sinemurian
        per the same reassessment of the Lower Lufeng Formation.
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diet: herbivore
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "174084"
  - source: wikidata
    id: Q2679062
  - source: gbif
    id: "4823691"
species:
  - name: Pachysuchus imperfectus
    etymology: "From Latin 'imperfectus' meaning 'imperfect', referring to the
      poorly preserved and incomplete nature of the holotype specimen."
    status: nomen dubium
    type_species: true
    period:
      name:
        - Early Jurassic
      stage:
        - Hettangian
        - Sinemurian
      from_ma: 201.3
      to_ma: 192.9
    location:
      country: CN
      region: Yunnan
      formation: Lufeng
      coordinates:
        - 25.173765
        - 102.097412
    type_specimen:
      specimen_id: [ IVPP V 40 ]
      specimen_type: holotype
      institution: IVPP
      material: A badly damaged partial snout, comprising a fragmentary left
        premaxilla, left maxilla, and probable nasals with indeterminate
        bone fragments.
      completeness: fragmentary
    erected_in: young1951a
    described_in: barrett2012a
references:
  - id: young1951a
  - id: barrett2012a
    notes: Redescribed the Pachysuchus holotype, reidentifying it as an
      indeterminate sauropodomorph rather than a phytosaur, and found no
      diagnostic features.
