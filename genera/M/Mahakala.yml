genus: Mahakala
parent: Halszkaraptorinae
dispute:
  summary: >
    Mahakala was originally described as the basalmost dromaeosaurid (Turner et
    al., 2007) and is still recovered in that position by some analyses. Cau et al.
    (2017) instead recovered it within Halszkaraptorinae, the placement adopted
    here and followed by Jones et al. (2026), though Jasinski et al. (2020)
    recovered it outside that clade. It is placed in Halszkaraptorinae following
    the prevailing recent view.
  history:
    - date: "2026-07-01"
      note: Placed in Halszkaraptorinae following Cau et al. (2017) and Jones et al. (2026); the basalmost-dromaeosaurid reading is noted.
etymology: "Named after Mahakala, a deity common to Hinduism and Buddhism."
pronunciation:
  ipa: /mɐɦaːˈkaːlɐ/
  phonetic: ma-ha-KAH-luh
description: Mahakala is a genus of halszkaraptorine theropod dinosaur from the
  Campanian-age (about 80 million years ago) Upper Cretaceous Djadokhta Formation
  of Ömnögovi, Mongolia. It is based on a partial skeleton found in the Gobi
  Desert. Mahakala was a small dromaeosaurid, and its skeleton shows features that
  are also found in early troodontids and avialans. Despite its late appearance, it
  is among the most basal dromaeosaurids. Its small size, and the small size of
  other basal deinonychosaurians, suggests that small size appeared before flight
  capability in birds.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - arid
diagnostic_features:
  - Strongly compressed and anteroposteriorly broad ulna tapering posteriorly to
    a narrow edge
  - Elongate lateral crest on posterodistal femur
  - Anterior caudal vertebrae with subhorizontal, laterally directed
    prezygapophyses
  - Prominent supratrochanteric process
  - Absence of cuppedicus fossa within dromaeosaurids but characteristic of
    avialans
appearance:
  features:
    - reduced forelimbs
  integument: feathered
  evidence: inferred
