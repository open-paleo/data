genus: Mahakala
parent: Halszkaraptorinae
etymology: "Named after Mahakala, a deity common to Hinduism and Buddhism."
pronunciation:
  ipa: /mɐɦaːˈkaːlɐ/
description: Mahakala is a genus of halszkaraptorine theropod dinosaur from the
  Campanian-age (about 80 million years ago) Upper Cretaceous Djadokhta Formation
  of Ömnögovi, Mongolia. It is based on a partial skeleton found in the Gobi
  Desert. Mahakala was a small dromaeosaurid, and its skeleton shows features that
  are also found in early troodontids and avialans. Despite its late appearance, it
  is among the most basal dromaeosaurids. Its small size, and the small size of
  other basal deinonychosaurians, suggests that small size appeared before flight
  capability in birds.
diet: carnivore
locomotion: bipedal
