genus: Maip
parent: Megaraptoridae
etymology: "Named for Maip, a malicious being in Aonikenk (Tehuelche) mythology described as 'the shadow of death' that 'kills with cold wind', from the indigenous traditions of Patagonia."
pronunciation:
  phonetic: MY-EEP
description: Maip is a genus of large megaraptorid theropod dinosaur from the
  Late Cretaceous (Maastrichtian) Chorrillo Formation of Santa Cruz, Argentina.
  The genus contains a single species, M. macrothorax, known from an incomplete,
  disarticulated skeleton. Maip may represent the largest megaraptorid known
  from South America, and possibly the world.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Mid-dorsal vertebrae with saddle-shaped articular surface of parapophyses
  - Mid-caudal vertebrae with accessory posterior centrodiapophyseal lamina
    subdividing posterior transverse fossa
  - First dorsal rib with honeycomb internal structure on tuberculum
  - Prominent anterior projection on coracoid
  - Coracoid lacking subglenoid ridge
  - Coracoid lacking posteroventral fossa
  - Coracoid with ventromedial margin forming deep articular surface for sternum
