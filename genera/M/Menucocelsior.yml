genus: Menucocelsior
parent: Eutitanosauria
etymology: "From Mapudungun 'menuco' meaning 'watering hole' (a translation of the locality name Ojo del Agua) and Latin 'celsior' meaning 'higher' or 'the taller one'; translates as 'the taller one from Salitral Ojo del Agua'."
description: Menucocelsior is a genus of medium-sized titanosaurian sauropod
  dinosaur from the Late Cretaceous Allen Formation of Argentina. The type and
  only species is Menucocelsior arriagadai.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Anterior caudal centra sub-quadrangular in anterior view, ovoidal
    posteriorly, ventrally narrow; ventral surface with shallow longitudinal
    concavity
  - Transverse processes on anterior caudals dorsoventrally low, narrow-based,
    posterolaterally oriented, lacking ventral tilting
  - First caudal with well-developed anteroventral ridge extending along
    transverse process
  - Humerus gracile, lacking strongly expanded ends, deltopectoral crest not
    extending beyond mid-shaft
  - Fibula relatively short and stout but nearly straight, with single prominent
    lateral tuberosity
  - Distal fibular end shows prominent proximodistally extended bony flange
    diverging strongly from shaft
