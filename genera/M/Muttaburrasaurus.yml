genus: Muttaburrasaurus
parent: Rhabdodontomorpha
etymology: Named for Muttaburra, a town in Queensland, Australia near where the fossil was discovered, combined with Greek '-saurus' meaning 'lizard'.
description: Muttaburrasaurus was a genus of herbivorous iguanodontian
  ornithopod dinosaur that lived in what is now north-eastern Australia sometime
  between 112 and 103 million years ago during the early Cretaceous period. It
  has been recovered in some analyses as a member of the iguanodontian clade
  Rhabdodontomorpha, or alternately as a member of Elasmaria. After
  Kunbarrasaurus, it is Australia's most completely known dinosaur from skeletal
  remains. It was named after Muttaburra, the site in Queensland, Australia,
  where it was found. The dinosaur was selected from twelve candidates to become
  the official fossil emblem of the State of Queensland.
diet: herbivore
locomotion: bipedal
