genus: Muttaburrasaurus
parent: Rhabdodontomorpha
pronunciation:
  phonetic: muht-a-BUHR-a-SAWR-us
etymology: Named for Muttaburra, a town in Queensland, Australia near where the
  fossil was discovered, combined with Greek '-saurus' meaning 'lizard'.
description: Muttaburrasaurus was a genus of herbivorous iguanodontian
  ornithopod dinosaur that lived in what is now north-eastern Australia during
  the Cenomanian stage of the Late Cretaceous period, about 96 million years
  ago. It has been recovered in some analyses as a member of the iguanodontian
  clade Rhabdodontomorpha, or alternately as a member of Elasmaria. After
  Kunbarrasaurus, it is Australia's most completely known dinosaur from skeletal
  remains. It was named after Muttaburra, the site in Queensland, Australia,
  where it was found. The dinosaur was selected from twelve candidates to become
  the official fossil emblem of the State of Queensland.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Posterodorsal and posteroventral processes of the premaxilla abutting along
    a tight lateral suture to form the anterolateral part of the enlarged cavum
    nasi proprium within the dorsally inflated muzzle.
  - Novel paired ossifications (prenasals) — either premaxillary processes or
    neomorphic bones — forming the dorsal roof and internal septa of the
    enlarged cavum nasi proprium.
  - Horizontal septum of the prenasal dividing the cavum nasi proprium into
    inferior and superior airways, with a sagittal septum further dividing the
    superior airway into left and right meatuses.
  - Thickened pendulous support ridge of the prenasal projecting ventrally into
    the superior airway meatus.
  - Toroidal fossa at the anterior end of the nasal body forming the posterior
    end of the superior airway meatus.
  - T-shaped lacrimal with a descending process projecting ventrally toward the
    dorsal opening of the maxillary neurovascular tract.
  - Pterygoid lacking palatine and vomeral contacts on the anterior face of the
    boss for the basipterygoid process.
  - Two protuberances at the dorsal tip of the ascending process of the
    supraoccipital, accommodated ventrally on the parietals.
  - Nasal excluded from the naris by the premaxilla (convergent with
    Lambeosaurinae).
  - Dentulous premaxilla bearing five alveoli, as in early-diverging
    neornithischians.
  - Caniniform premaxillary teeth lacking a substantial root-crown constriction,
    as in some heterodontosaurids.
