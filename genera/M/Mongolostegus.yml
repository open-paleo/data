genus: Mongolostegus
parent: Stegosauridae
etymology: From 'Mongol' (Mongolia, where it was found) and Greek 'stegos' (roof); meaning 'Mongolian roof', referencing Mongolia and its classification as a stegosaur.
pronunciation:
  phonetic: mon-GO-lo-STEG-us
description: Mongolostegus is an extinct genus of stegosaurian dinosaurs from
  the Early Cretaceous (Aptian-Albian ages) Dzunbain Formation of Mongolia. The
  genus contains a single species, Mongolostegus exspectabilis, known from a
  fragmentary single specimen representing the first stegosaur named from
  Mongolia. It is one of the youngest known stegosaurs, along with Yanbeilong
  and an unnamed species from the Hekou Group of China. In contrast to these
  taxa, which are members of the late-diverging stegosaur subfamily
  Stegosaurinae, Mongolostegus may have affinities to more basal taxa such as
  the Huayangosauridae.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Ratio of neural spine height to caudal vertebral centrum height 1.5:1
  - Apices of neural spines nonexpanded and nondoubled
  - Neural spines of first five caudal vertebrae inclined distally
  - Bases of transverse processes of vertebrae 1–5 displaced posteriorly
  - Pubis massive with strongly thickened acetabular portion
  - Postpubis rounded in distal cross-section without narrowing characteristic
    of other stegosaurs
appearance:
  features:
    - dermal plates
    - tail spikes
  integument: armored
  evidence: direct
