genus: Maraapunisaurus
parent: Rebbachisauridae
etymology: "From Ute 'maraapuni' meaning 'it is very large' and Greek 'sauros' meaning 'lizard', giving the meaning 'very large lizard', named for the enormous estimated size of the specimen."
description: Maraapunisaurus is a genus of sauropod dinosaur from the Late
  Jurassic Morrison Formation of western North America. It contains one species,
  Maraapunisaurus fragillimus, which was originally named Amphicoelias
  fragillimus. It has sometimes been estimated to be the largest dinosaur
  specimen ever discovered. Based on surviving descriptions of a single fossil
  bone, scientists have produced numerous size estimates over the years; the
  largest estimate M. fragillimus to have been the longest known animal at 58
  meters (190 ft) in length with a mass of 150 tonnes (150 long tons; 170 short
  tons). However, because the only fossil remains were lost at some point after
  being studied and described in the 1870s, evidence survived only in
  contemporary drawings and field notes.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Extremely tall neural arch, approximately 1/3 of preserved neural spine
    height
  - Unbifurcated, simply structured neural spine with spinopostzygapophyseal
    laminae joined to form postspinal lamina
  - Paired pneumatic foramina pierce neural spine on each side of postspinal
    lamina
  - Pneumatic camerae in neural arch dorsolateral to neural canal
  - Festooned spinodiapophyseal lamina
