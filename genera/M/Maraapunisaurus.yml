    id: "378233"
  - source: wikidata
    id: Q57612918
erected_in: carpenter2018a
species:
  - name: Maraapunisaurus fragillimus
    etymology: "From Latin 'fragillimus', the superlative of 'fragilis' meaning 'very fragile', chosen by Cope to describe the extreme delicateness of the bone produced by very thin vertebral laminae."
    pronunciation:
      phonetic: fruh-JIL-i-mus
    status: valid
    type_species: true
    period:
      name:
