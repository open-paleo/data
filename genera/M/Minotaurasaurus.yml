genus: Minotaurasaurus
parent: Ankylosaurinae
etymology: Named after the Minotaur of Greek mythology (the bull of Minos)
  combined with Greek 'sauros' (lizard); meaning 'Minos's bull reptile'.
pronunciation:
  phonetic: min-uh-TOR-a-SOR-us
description: Minotaurasaurus is a monospecific genus of ankylosaurid dinosaur
  that lived in Mongolia during the Late Cretaceous (late Campanian stage,
  ~75-71 Ma) in what is now the Djadokhta Formation. The type and only species,
  Minotaurasaurus ramachandrani, is known from two skulls, a cervical vertebra
  and a cervical half ring. It was named and described in 2009 by Clifford Miles
  and Clark Miles. The holotype was bought at the Tucson Gem and Mineral Show
  and has been described as illegally acquired; where it was found was never
  recorded, and its matrix points to the Gobi Desert of Mongolia or China.
  Arbour and colleagues (2014) and Arbour and Currie (2015) sank it into
  Tarchia kielanae; Penkalski and Tumanova (2017) and Penkalski (2026) argue
  that it is a distinct genus.
dispute:
  summary: >
    The validity of Minotaurasaurus is contested. Arbour and colleagues (2014)
    sank it into Tarchia kielanae, and Arbour and Currie (2015) kept the
    synonymy. Penkalski and Tumanova (2017) argued that it is a distinct genus;
    Wiersma and Irmis (2018) followed them in coding it separately, and
    Penkalski (2026) recovered it as the sister taxon of Pinacosaurus.
    Retained as a valid ankylosaurine pending consensus.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - arid
diagnostic_features:
  - Skull with large, horizontally elliptical external nares rimmed by
    well-developed osteoderm
  - Premaxillary part of snout broad with foramina for premaxillary and
    maxillary sinuses housed within external nares
  - Occipital condyle poorly developed, directed ventrally
  - Quadrate nearly vertical with distal articular condyle at level between
    posterior rim of skull and orbit
  - Skull roof not overhanging occiput
  - Maxillary shelf well-developed and wide below middle of orbit
  - Pterygoid body almost horizontal, not vertical
  - Narial osteoderms large and highly ornamented creating flared, bull-like
    appearance
appearance:
  features:
    - square snout
    - snout hornlets
  integument: armored
  evidence: direct
identifiers:
  - source: pbdb
    id: "148132"
  - source: wikidata
    id: Q134146
  - source: gbif
    id: "4965730"
species:
  - name: Minotaurasaurus ramachandrani
    etymology: "Named for Vilayanur S. Ramachandran, the neuroscientist who
      purchased the type skull at a fossil show in Tucson, Arizona in 2003."
    status: disputed
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Campanian
    size:
      length_m:
        min: 4.2
        max: 4.2
    location:
      country: MN
      region: MN-053
      notes: Where the holotype came from was never recorded, since it was
        purchased rather than collected. Penkalski and Tumanova (2017)
        assign the Djadokhta Formation on the evidence of a referred
        specimen, while Arbour and colleagues (2014) argue for the
        Baruungoyot in sinking the genus into Tarchia. The unit turns on
        which taxonomy is accepted.
    type_specimen:
      specimen_id: [ INBR21004 ]
      specimen_type: holotype
      institution: INBR
      material: A skull with complete lower jaws and predentary.
      completeness: partial
    erected_in: miles2009a
notable_specimens:
  - specimen_id: [MAE 98 179]
    institution: MAE
    species: Minotaurasaurus ramachandrani
    category: complementary
    significance: "Skull, axis and first cervical half-ring from Ukhaa Tolgod, Djadokhta Formation, referred to Minotaurasaurus by Alicea and Loewen (2013) and Penkalski and Tumanova (2017): the only specimen of the genus with a known horizon, cited as evidence that it is distinct from Tarchia."
    references: [alicea2013a, penkalski2017a]
references:
  - id: miles2009a
  - id: paul2024a
    notes: Source of the appearance features.
  - id: penkalski2017a
    notes: Argues that the holotype of Minotaurasaurus is not referable to
      Tarchia kielanae, so the genus is valid; gives a revised diagnosis and
      refers MAE 98 179 from Ukhaa Tolgod to it.
  - id: wiersma2018a
    notes: Treated Minotaurasaurus as distinct from Tarchia kielanae, following
      Penkalski and Tumanova (2017), and coded it as a separate taxon.
  - id: arbour2014b
    notes: Treated Minotaurasaurus as a junior synonym of Tarchia kielanae.
  - id: arbour2015a
    notes: Keeps Minotaurasaurus ramachandrani as a junior synonym of Tarchia
      kielanae.
  - id: penkalski2026a
    notes: Treats Minotaurasaurus as distinct from Tarchia and recovers it as
      the sister taxon of Pinacosaurus.
  - id: alicea2013a
    notes: Refers a second specimen from Ukhaa Tolgod, Djadokhta Formation, to
      Minotaurasaurus; calls the holotype illegally acquired.
