genus: Minotaurasaurus
parent: Ankylosaurinae
etymology: Named after the Minotaur of Greek mythology (the bull of Minos)
  combined with Greek 'sauros' (lizard); meaning 'Minos's bull reptile'.
pronunciation:
  phonetic: min-uh-TOR-a-SOR-us
description: Minotaurasaurus is a monospecific genus of ankylosaurid dinosaur
  that lived in Mongolia during the Late Cretaceous (late Campanian stage,
  ~75-71 Ma) in what is now the Djadochta Formation. The type and only species,
  Minotaurasaurus ramachandrani, is known from two skulls, a cervical vertebra
  and a cervical half ring. It was named and described in 2009 by Clifford Miles
  and Clark Miles. The holotype of Minotaurasaurus has been suspected to be
  illegally exported out of Mongolia. It has been suggested to be a synonym of
  Tarchia but more recent publications consider it as a distinct genus.
dispute:
  summary: >
    The validity of Minotaurasaurus is contested. Arbour and Currie (2015) treated it as a junior synonym of Tarchia kielanae, whereas Penkalski and Tumanova (2016) and Wiersma and Irmis (2018) found it distinct. Retained as a valid ankylosaurine pending consensus.
  history:
    - date: "2026-06-26"
      note: Placed at Ankylosaurinae, kept valid although some analyses synonymize it with Tarchia (P5).
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - arid
diagnostic_features:
  - Skull with large, horizontally elliptical external nares rimmed by
    well-developed osteoderm
  - Premaxillary part of snout broad with foramina for premaxillary and
    maxillary sinuses housed within external nares
  - Occipital condyle poorly developed, directed ventrally
  - Quadrate nearly vertical with distal articular condyle at level between
    posterior rim of skull and orbit
  - Skull roof not overhanging occiput
  - Maxillary shelf well-developed and wide below middle of orbit
  - Pterygoid body almost horizontal, not vertical
  - Narial osteoderms large and highly ornamented creating flared, bull-like
    appearance
appearance:
  features:
    - square snout
    - snout hornlets
  integument: armored
  evidence: direct
