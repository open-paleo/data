genus: Minimocursor
parent: Neornithischia
etymology: "From Latin 'minimus' meaning 'the smallest' and 'cursor' meaning 'runner'; translates as 'smallest runner', referring to the small size of the holotype."
pronunciation:
  phonetic: MIH-nee-mo-KUHR-suh
description: Minimocursor is a genus of basal neornithischian dinosaur from the
  Late Jurassic Phu Kradung Formation of Thailand. The type species is
  Minimocursor phunoiensis.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Jugal posterior process bifurcated distally
  - Low flattened subtriangular boss projects laterally on jugal surface
  - Pre-caudal axial skeleton composed of 15 dorsals and 5 sacrals
  - Brevis shelf of ilium visible in lateral view along entire length
  - Distinct supraacetabular flange present on pubic peduncle of ilium
