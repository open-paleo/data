genus: Magnosaurus
parent: Afrovenatorinae
pronunciation:
  phonetic: MAG-no-SAWR-us
etymology: From Latin 'magnus' (large) and Greek 'sauros' (lizard); meaning 'large lizard'
description: Magnosaurus was a genus of theropod dinosaur from the Middle
  Jurassic of England. It is based on fragmentary remains and has often been
  confused with or included in Megalosaurus.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - marine
appearance:
  integument: scaled
  evidence: inferred
diagnostic_features:
  - "Sole potential autapomorphy: anteroposteriorly elongate foramina on the
    ventral part of the lateral surface of the dentary, inclined anterodorsally
    and continuing anterodorsally as long grooves"
  - Dorsoventrally low dentary with a dorsoventrally expanded anterior end
  - Expanded, subcircular third dentary alveolus
  - Well-defined groove housing the lateral nutrient foramina of the dentary (a
    megalosaurid synapomorphy)
  - Tibia with a relatively weak medial malleolus that does not form a prominent
    shoulder in anterior view
