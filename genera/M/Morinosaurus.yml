genus: Morinosaurus
parent: Sauropoda
pronunciation:
  phonetic: MOR-in-o-SAWR-us
etymology: "Named for the Morini, an ancient people of northern France in whose
  territory the fossils were found, combined with Greek 'sauros' meaning
  'lizard'."
description: Morinosaurus is a genus of sauropod dinosaur from an unnamed
  formation of Kimmeridgian-aged (Late Jurassic) rocks from Boulogne-sur-Mer,
  Département du Pas-de-Calais, France. It is an obscure tooth genus sometimes
  referred to the Early Cretaceous English wastebasket taxon Pelorosaurus.
diet: herbivore
locomotion: quadrupedal
diagnostic_features:
  - Strong truncature at apex of internal border, resembling Hylaeosaurus
  - External edge rounded, curved toward apex; oblique bevel surface on external
    edge
  - Compressed tooth with elliptical cross-section; lateral faces rounded at
    external edge
  - Enamel continues on truncature surface, indicating normal character not
    produced by wear
  - Minimal dentin exposure; main vascular foramen visible
paleoenvironment:
  - marine
appearance:
  integument: scaled
  evidence: inferred
