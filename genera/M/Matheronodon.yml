genus: Matheronodon
parent: Rhabdodontidae
etymology: Named after French paleontologist Philippe Matheron, combined with Greek 'odon' (tooth); meaning 'Matheron's tooth'.
pronunciation:
  phonetic: math-uh-ron-o-don
description: Matheronodon is a genus of rhabdodontid ornithopod dinosaur from
  the late Cretaceous Period of the Grès à Reptiles Formation in France. The
  genus contains a single species, M. provincialis, which is known from a single
  maxilla and associated teeth. It was named by Pascal Godefroit and colleagues
  in 2017. The teeth of Matheronodon are large but few in number. The teeth are
  also in an unusual arrangement, emerging alternatingly from one of a pair of
  fused tooth sockets in its mouth. In life, the teeth would have functioned
  like a pair of scissors, allowing Matheronodon to feed on the tough leaves of
  monocot plants.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Extreme enlargement of both maxillary and dentary teeth (up to 5 cm
    mesio-distal length)
  - Reduction of maxillary tooth families to 4 per generation
  - Interalveolar septa alternately present or resorbed ventrally, enabling one
    functional tooth per paired alveolus
  - Shortened rostral process on the maxilla, rostrocaudally oriented
  - Broad dorsal shelf along rostral third of maxilla
  - More than 25 vertical and parallel ridges on labial side of maxillary teeth
