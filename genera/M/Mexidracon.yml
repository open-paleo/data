genus: Mexidracon
parent: Ornithomimidae
etymology: From 'Mexi-' (referring to Mexico) and Greek 'drakon' (dragon or
  serpent); meaning 'Mexican dragon'.
description: Mexidracon is an extinct genus of ornithomimid theropod dinosaurs
  from the late Cretaceous Cerro del Pueblo Formation of Coahuila, Mexico. The
  genus contains a single species, M. longimanus, known from a partial skeleton.
  Mexidracon is the second ornithomimosaur to be named from this formation,
  following the deinocheirid Paraxenisaurus in 2020.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - coastal
diagnostic_features:
  - "Extreme elongation of metacarpus: metacarpal III length is 1.1 times
    humeral length, 1.072 times metatarsal II length, and 1.018 times metatarsal
    IV length."
  - Proximal end of metacarpal II with a narrow subtriangular outline.
  - Iliac pubic peduncle with a flared, zig-zag shaped articular margin that is
    wider anteriorly than posteriorly.
  - Distal end of pubis with distal margin of anterior expansion separated from
    shaft by a deep notch.
  - Ilium with ischiadic peduncle slightly longer proximodistally than pubic
    peduncle.
  - Deeply concave iliac brevis fossa expanded posteriorly, overhanging the
    lateral surface of the postacetabular process.
