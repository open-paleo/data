genus: Manipulonyx
parent: Parvicursorinae
etymology: From Latin 'manipulare' (to manipulate, to handle) and Greek 'onyx'
  (claw), referring to the specialized forelimb interpreted as a tool for
  handling eggs.
pronunciation:
  phonetic: man-IP-yoo-LOH-niks
description: Manipulonyx is an extinct genus of parvicursorine alvarezsaurid
  theropod from the Maastrichtian Nemegt Formation of the Khermeen Tsav
  locality, Govi-Altai Province, southern Mongolia. The single species,
  Manipulonyx reshetovi, is known from a fragmentary skeleton (PIN 3142/364)
  that preserves the most complete forelimb of any parvicursorine yet
  described, including the first documented complete set of proximal carpals
  (ulnare, intermedium, radiale) and a series of dermal carpal spikes (medial,
  lateral, and palmar) articulated with the carpometacarpus. Averianov, Lopatin
  and Atuchin (2025) interpret these spikes, together with the rudimentary
  third and fourth digits and the absence of a flexor tubercle on ungual II-2,
  as adaptations for gripping and piercing dinosaur eggs with the hypertrophied
  manual claw — a hypothesis supported by eggshell fragments associated with
  the holotype on its 1979 field label.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Internal tuberosity of humerus projects proximal to the humeral head, with
    no notch between humeral head and deltopectoral crest.
  - Single distal condyle of humerus for articulation with both radius and ulna;
    ectepicondyle hypertrophied and projects distally.
  - Olecranon process of ulna hypertrophied; manual digit 2 hypertrophied with
    very large and robust ungual phalanx bearing a large proximodorsal process
    on phalanx II-1.
  - Ventral canals of manual phalanx II-2 closed laterally; manual digits 3 and
    4 greatly reduced but present.
  - Supraacetabular crest of ilium arcuate, not extending anteriorly beyond
    pubic peduncle; entocondylar tuber of femur present and directed
    posteriorly.
  - Popliteal fossa of femur open distally; metatarsal 4 with lateral flexor
    ridge.
appearance:
  integument: feathered
  evidence: inferred
