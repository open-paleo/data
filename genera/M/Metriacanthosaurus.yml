genus: Metriacanthosaurus
parent: Metriacanthosaurinae
etymology: From Greek 'metrios' (moderate), 'akantha' (spine or thorn), and 'sauros' (lizard); meaning 'moderately-spined lizard'.
description: Metriacanthosaurus is a genus of metriacanthosaurid dinosaur from
  the Oxford Clay Formation of England, dating to the Late Jurassic period,
  about 160 million years ago (lower Oxfordian). It is the only
  metriacanthosaurid currently named from outside of Asia.
diet: carnivore
locomotion: bipedal
