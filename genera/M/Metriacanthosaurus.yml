genus: Metriacanthosaurus
parent: Metriacanthosaurinae
pronunciation:
  phonetic: met-ree-a-KAN-tho-SAWR-us
etymology: From Greek 'metrios' (moderate), 'akantha' (spine or thorn), and
  'sauros' (lizard); meaning 'moderately-spined lizard'.
description: Metriacanthosaurus is a genus of metriacanthosaurid dinosaur from
  the Oxford Clay Formation of England, dating to the Late Jurassic period,
  about 160 million years ago (lower Oxfordian). It is the only
  metriacanthosaurid currently named from outside of Asia.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - marine
diagnostic_features:
  - Elevated neural spines of dorsal vertebrae, inclined slightly forward
  - Ilium with abrupt change in inclination of superior margin, blade relatively
    deeper at that point
  - Pubic foot expanded, originally ~18 cm long
  - Femora relatively more slender than M. bucklandi
  - Lesser trochanter more proximally placed
  - Cnemial process of tibia projects strongly upward
