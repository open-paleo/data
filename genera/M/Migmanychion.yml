genus: Migmanychion
parent: Maniraptora
etymology: From Greek 'meigma' (mixture) and 'nychion' (claw); meaning 'claw mixture', referring to the mix of claw features in the specimen.
pronunciation:
  phonetic: mig-mah-nee-shon
description: Migmanychion is an extinct genus of maniraptoran theropod dinosaur
  from the Early Cretaceous Longjiang Formation of China. The genus contains a
  single species, M. laiyang, known from an incomplete left forelimb.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
diagnostic_features:
  - Discoidal distal carpal 1 capping exclusively metacarpal I
  - Sharp proximolateral flange on ventral surface of metacarpal I
  - Manual phalanx II-1 with lateroventral ridge
  - Metacarpal III extremely slender, no more than 40% width of metacarpal II at
    mid-shaft
  - All manual ungual flexor tubercles distally displaced from proximal
    articular facet
  - Manual ungual II with prominent proximodorsal lip and dorsal margin arched
    above articular facet level
  - Three manual unguals markedly heterogeneous in size and proportion
