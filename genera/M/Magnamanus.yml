      material: Partial skeleton comprising maxillary fragments, fragments of
        the left predentary, left dentary and right surangular, hyoids, alveolar
        parapets, sixty-two maxillary and thirty-six mandibular teeth, proatlas,
        one cervical and four dorsal vertebral centra, thirty-seven sacral
        fragments, thirty-two caudal vertebral centra, rib and chevron fragments
        with three complete chevrons, ossified tendon fragments, right scapula,
        both coracoids, both humeri, right radius, ulna, carpus and hand, left
        ilium fragment, both prepubes, right femur and tibia fragments, and right
        metatarsals II and IV
      completeness: partial
      notes: >-
        The holotype is one adult individual, but no single catalog number was
        ever assigned to it: its material was accessioned across five lots, MNS
        2000/132, 2001/122, 2002/95, 2003/69 and 2004/54. The describing paper
        states that only remains providing relevant anatomical or taxonomic
        information were described, so most elements carry no number at all. The
        ids listed here are those the paper ties explicitly to a holotype
        element and are therefore a subset, not the whole animal; the teeth,
        sacral fragments, chevrons and rib fragments are largely unnumbered. The
        lot numbers are deliberately not listed as ids, because lot MNS 2001/122
        also holds the Soriatitan golmayensis holotype from the same quarry.
