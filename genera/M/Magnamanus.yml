genus: Magnamanus
parent: Styracosterna
etymology: From Latin 'magna' (large) and 'manus' (hand); meaning 'large hand',
  likely referring to its broad hand morphology
pronunciation:
  phonetic: MAG-na-MAN-us
description: Magnamanus is an extinct genus of herbivorous iguanodontian
  dinosaur that lived during the Early Cretaceous in what is now Spain in the
  Golmayo Formation. It contains a single species, Magnamanus soriaensis.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Teeth of Iguanodon type with external dentary border not denticulated
  - Coronoid process originates on midline of dentary; last alveolus in front of
    its base, not at base
  - Scapula minimum width at second third; length 7x minimum width; posterior
    protuberance and acromial process facing each other
  - "Humerus: ulnar condyle extends distally more than radial condyle; internal
    tuberosity and ulnar condyle not aligned"
  - Distal ulna mace-shaped with greater width than proximal end
  - Radius with distal end as expanded as proximal end and trapezoidal in shape
  - Carpus with three main articulated elements; phalangeal formula 1:3:3:2:(3-4)
  - Straight prepubis without distal widening or striation
  - Fourth trochanter of femur non-pendant
