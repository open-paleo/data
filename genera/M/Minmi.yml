genus: Minmi
parent: Thyreophora
placement: incertae sedis
pronunciation:
  phonetic: MIN-mee
etymology: Named for Minmi Crossing, near the site of discovery in Queensland,
  Australia; the name seems to be Aboriginal in origin but of uncertain
  meaning.
description: Minmi is a genus of small herbivorous ankylosaurian dinosaur that
  lived during the early Aptian (Early Cretaceous) of Queensland, Australia.
dispute:
  summary: >
    Arbour and Currie (2015) regarded Minmi paravertebra as a nomen dubium,
    finding none of Molnar's diagnostic characters unique to the holotype,
    the paravertebrae being ordinary ossified tendons. Leahey and colleagues
    (2015) kept the genus pending a reappraisal of the holotype alongside a
    postcranial description of QM F18101, and Leahey and colleagues (2019)
    still treated it as distinct; Raven and colleagues (2023) scored it in
    their analysis for that reason. The skeleton long known as Minmi sp. is
    Kunbarrasaurus ieversi. Analyses before 2015 scored the holotype and QM
    F18101 as one taxon (Leahey and colleagues, 2015); Arbour and Currie
    (2015) scored them separately, and Raven and colleagues (2023) scored the
    holotype alone. Raven and colleagues (2023) recovered the holotype outside
    Eurypoda in their preferred tree but within Ankylosauria in others,
    attributing the former to a lack of ankylosaur synapomorphies; Leahey and
    colleagues (2019) recovered it as a basal ankylosaurian. It is placed at
    Thyreophora incertae sedis, the nearest clade all these results accept.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
appearance:
  features:
    - body armor
    - osteoderms
  integument: armored
  evidence: direct
