genus: Minmi
parent: Ankylosauria
placement: incertae sedis
pronunciation:
  phonetic: MIN-mee
etymology: Named for Minmi Crossing, a location in Queensland, Australia near
  where it was found; the Wikipedia article retrieved is about a Japanese
  musician, not the dinosaur.
description: Minmi is a genus of small herbivorous ankylosaurian dinosaur that
  lived during the early Cretaceous Period of Australia, about 120 to 112
  million years ago.
dispute:
  summary: >
    Both the validity and placement of Minmi are contested. Arbour and Currie (2015) regarded Minmi paravertebra as a nomen dubium, while others uphold it; phylogenetic analyses recover it as an unstable wildcard, even outside Eurypoda in the preferred tree of Raven et al. (2023). It is retained at Ankylosauria incertae sedis.
  history:
    - date: "2026-06-26"
      note: Placed at Ankylosauria incertae sedis, validity and placement both unresolved.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Small ankylosaur with paravertebral elements present alongside neural spines
    of dorsal vertebrae
  - Ventral armor formed by pavement of small ossicles (6-8 mm diameter,
    cushion-shaped, hexagonal to square)
  - Dorsal vertebrae amphiplatyan without notochordal knobs
  - Transverse processes slender and triangular (not T-shaped) in cross-section
  - Neural canal broad (breadth to height ratio 0.76-1.02)
  - Posterior intervertebral notch shallow
appearance:
  features:
    - body armor
    - osteoderms
  integument: armored
  evidence: direct
identifiers:
  - source: pbdb
    id: "52879"
  - source: wikidata
    id: Q133007
  - source: gbif
    id: "4823207"
  - source: eol
