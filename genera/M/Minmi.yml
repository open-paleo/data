genus: Minmi
parent: Ankylosauridae
pronunciation:
  phonetic: MIN-mee
etymology: Named for Minmi Crossing, a location in Queensland, Australia near
  where it was found; the Wikipedia article retrieved is about a Japanese
  musician, not the dinosaur.
description: Minmi is a genus of small herbivorous ankylosaurian dinosaur that
  lived during the early Cretaceous Period of Australia, about 120 to 112
  million years ago.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Small ankylosaur with paravertebral elements present alongside neural spines
    of dorsal vertebrae
  - Ventral armor formed by pavement of small ossicles (6-8 mm diameter,
    cushion-shaped, hexagonal to square)
  - Dorsal vertebrae amphiplatyan without notochordal knobs
  - Transverse processes slender and triangular (not T-shaped) in cross-section
  - Neural canal broad (breadth to height ratio 0.76-1.02)
  - Posterior intervertebral notch shallow
appearance:
  features:
    - body armor
    - osteoderms
  integument: armored
  evidence: direct
