genus: Minmi
parent: Ankylosauria
placement: incertae sedis
pronunciation:
  phonetic: MIN-mee
etymology: Named for Minmi Crossing, a location in Queensland, Australia near
  where it was found; the Wikipedia article retrieved is about a Japanese
  musician, not the dinosaur.
description: Minmi is a genus of small herbivorous ankylosaurian dinosaur that
  lived during the early Cretaceous Period of Australia, about 120 to 112
  million years ago.
dispute:
  summary: >
    Minmi paravertebra is a nomen dubium. Arbour and Currie (2015) found none
    of Molnar's diagnostic characters unique to the holotype, the
    paravertebrae being ordinary ossified tendons; Leahey and colleagues
    (2015) kept the genus pending a redescription that has not appeared. The
    skeleton long known as Minmi sp. is Kunbarrasaurus ieversi, and the
    phylogenetic results reported for Minmi mostly rest on that specimen. It
    is retained at Ankylosauria incertae sedis.
  history:
    - date: "2026-06-26"
      note: Placed at Ankylosauria incertae sedis, validity and placement both unresolved.
    - date: "2026-10-09"
      note: Type species set to nomen dubium and diagnostic features removed, following Arbour and Currie (2015); the species name corrected to Molnar's spelling, paravertebra.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
appearance:
  features:
    - body armor
    - osteoderms
  integument: armored
  evidence: direct
identifiers:
  - source: pbdb
    id: "52879"
  - source: wikidata
    id: Q133007
  - source: gbif
    id: "4823207"
  - source: eol
    id: "4530847"
species:
  - name: Minmi paravertebra
    etymology: "Referring to unusual bone elements found along the vertebrae, for
      which Molnar coined the designation 'paravertebrae'."
    status: nomen dubium
    type_species: true
    period:
      name:
        - Early Cretaceous
      stage:
        - Aptian
    location:
      country: AU
      locality: Gulley about 1 km south of Mack Gulley, on the Injune Road, north of Roma
      region: AU-QLD
      formation: Bungil
      member: Minmi
    size:
      weight_kg:
        min: 300
        max: 300
      hip_height_m:
        min: 0.8
        max: 0.8
      length_m:
        min: 3
        max: 3
    type_specimen:
      specimen_id: [ QM F10329 ]
      specimen_type: holotype
      institution: QM-AU
      material: "Partial skeleton lacking skull: eleven back vertebrae, ribs, right
        hindlimb, belly armor plates"
      completeness: partial
    erected_in: molnar1980b
references:
  - id: molnar1980b
    notes: Gives the site as a gulley south of Mack Gulley and states that
      Minmi Crossing, which names the genus, is only near it.
  - id: jones2026a
    notes: Source of the mass and hip height estimates, and the appearance
      features.
  - id: raven2023a
    notes: Recovered Minmi as an unstable wildcard outside Eurypoda in their preferred armored-dinosaur tree.
  - id: arbour2015a
    notes: Regarded Minmi paravertebra as a nomen dubium.
  - id: exon1976a
    notes: Dates the Minmi Member of the Bungil Formation as early Aptian from its pelecypods, belemnite and foraminifera.
  - id: burger1980a
    notes: Gives the Minmi Member as "dated as lower Aptian".
  - id: leahey2015a
    notes: Names Kunbarrasaurus ieversi for the skeleton formerly called Minmi
      sp., and keeps Minmi paravertebra as distinct pending a redescription.
