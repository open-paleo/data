genus: Morelladon
parent: Styracosterna
etymology: Combines a reference to Morella (a town in Castellón, Spain, near the discovery site) with Greek odṓn (ὀδών), meaning 'tooth'
pronunciation:
  phonetic: moh-RAY-o-don
description: Morelladon is an extinct genus of herbivorous styracosternan
  ornithopod dinosaur. It lived during the Early Cretaceous of Spain, around 130
  million years ago.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Dorsal neural spines at least 4.3 times centrum height, vertically arranged
  - Extremely tall and deep vertical recess between postzygapophyses in
    mid-posterior dorsals (2.6 times spine length)
  - Dorsosacral rib distally fused to sacral yoke
  - Midline ventral keel restricted to anterior half of sacrals 2 and 3 centra
  - Medial ridge on postacetabular process slopes posterodorsally to meet dorsal
    ilium margin forming medially expanded dorsal platform
  - Distal ischial shaft laterally expanded with D-shaped cross-section
  - Sacrodorsal and first sacral rib facets closely spaced near ilium dorsal
    margin
appearance:
  features:
    - dorsal sail
  integument: scaled
  evidence: inferred
