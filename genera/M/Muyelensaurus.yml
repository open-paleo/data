genus: Muyelensaurus
parent: Rinconsauria
etymology: Muyelen lizard
description: Muyelensaurus is a genus of titanosaurian sauropod dinosaur from
  the Late Cretaceous of Argentina. It was more slender than other titanosaurs.
  Fossils have been recovered in the Neuquén province of Patagonia and were
  originally assigned to the Portezuelo Formation but further research showed
  that these layers belong to the Plottier Formation. The type species is M.
  pecheni. The name Muyelensaurus first appeared in a 2007 paper by Argentine
  paleontologists Jorge Calvo of the Universidad Nacional del Comahue and
  Bernardo González Riga of the Laboratorio de Paleovertebrados, and Brazilian
  paleontologist Juan Porfiri of the Universidade Federal do Rio de Janeiro.
diet: herbivore
locomotion: quadrupedal
