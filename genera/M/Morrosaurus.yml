    etymology: "Named for Antarctica, the continent where the holotype was discovered on James Ross Island, with the Latin suffix '-icus' meaning 'of' or 'relating to'."
    status: valid
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Maastrichtian
