genus: Morrosaurus
parent: Elasmaria
etymology: Refers to the site of El Morro on James Ross Island, Antarctica, where the remains were found, combined with Greek sauros meaning 'lizard'
pronunciation:
  phonetic: MOH-ro-SOR-us
description: Morrosaurus is an extinct genus of herbivorous elasmarian dinosaur
  that lived in the late Cretaceous in Antarctica. The only known species is the
  type Morrosaurus antarcticus.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - marine
diagnostic_features:
  - Femur with lesser trochanter positioned anterolaterally to greater trochanter
  - Greater trochanter with sigmoidal lateral margin in proximal view,
    transversely thick posterior edge and very thin anterior edge
  - Tibia with medial malleolus subtriangular in contour with concave anterior
    surface
  - Metatarsal IV with thick, well-developed posterior process medially wrapping
    metatarsal III
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "334966"
  - source: wikidata
    id: Q21122031
  - source: eol
    id: "47460260"
species:
