genus: Mansourasaurus
parent: Saltasauroidea
dispute:
  summary: >
    Mansourasaurus was described as a derived titanosaur, the sister of
    Lohuecotitan in an Afro-Eurasian saltasaurid clade (Sallam and
    colleagues, 2018). Later analyses agree on a derived saltasauroid
    position but differ on its sister: Paludititan within
    Opisthocoelicaudiinae (Vila and colleagues, 2022), Lirainosaurinae
    (Navarro and colleagues, 2022), or Lirainosaurus or Saltasaurinae
    depending on weighting (Díez Díaz and colleagues, 2025). It is not a
    member of Diamantinasauria.
etymology: "Named for Mansoura University in Egypt, the institution whose paleontologists discovered and described it, combined with Greek 'sauros' meaning 'lizard'."
pronunciation:
  phonetic: man-SOO-rah-SOR-us
description: Mansourasaurus is a genus of herbivorous lithostrotian sauropod
  dinosaur from the Quseir Formation of Egypt. The type and only species is
  Mansourasaurus shahinae.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Ten dentary tooth positions, uniquely low number within Titanosauria
  - Dentary symphyseal region with pronounced ventral projection ('chin')
    comprising ~one-third of anterior dorsoventral depth
  - Meckelian groove facing predominantly ventrally
  - Foramen in posterior portion of lateral surface of anterior to middle
    cervical centrum
  - Parapophysis anteroposterior length subequal to centrum length in anterior
    to middle cervical vertebra
  - Foramen in capitulotubercular web of anterior cervical rib
appearance:
  integument: armored
  evidence: direct
identifiers:
  - source: pbdb
    id: "366664"
  - source: wikidata
    id: Q47518933
