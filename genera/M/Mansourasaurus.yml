    erected_in: sallam2018a
references:
  - id: sallam2018a
    notes: Named Mansourasaurus and recovered it as the sister of Lohuecotitan in
      an Afro-Eurasian saltasaurid clade.
  - id: jones2026b
    notes: Source of the hip height estimate.
  - id: vila2022a
    notes: Recovered Mansourasaurus as the sister of Paludititan within Opisthocoelicaudiinae.
  - id: navarro2022a
    notes: Recovered Mansourasaurus as the sister of Lirainosaurinae within Saltasauroidea.
  - id: díezdíaz2025a
    notes: Recovered Mansourasaurus with Lirainosaurus under equal weights, and as the sister of Saltasaurinae under implied weights.
