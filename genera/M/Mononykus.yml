genus: Mononykus
parent: Parvicursorinae
etymology: From Greek 'monos' (one) and 'onyx' (claw); meaning 'one claw',
  referring to its single functional forelimb claw.
pronunciation:
  phonetic: muh-NON-ik-uhs
  ipa: /məˈnɒnɪkəs/
description: Mononykus is a genus of alvarezsaurid dinosaur that lived during
  the Late Cretaceous in what is now Mongolia, specifically the Nemegt
  Formation. Mononykus was a very small theropod, estimated around 1 to 1.2
  meters (3.3 to 3.9 ft) in length with a weight of 3.5 kilograms (7.7 lb). As
  in Shuvuuia, Mononykus likely developed a shaggy feathering. It was lightly
  built with long, thin legs and highly reduced and specialized forelimbs that
  were likely used for foraging termite mounds or other insect colonies.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Edentulous maxilla lacking accessory fenestra in antorbital fossa
  - Short robust forelimb with single stout claw on manual digit I
  - Massive short quadrangular carpometacarpus with no intermetacarpal space
  - Carinate sternum with thick sternal carina
  - Fibula does not reach tarsus
  - Very long olecranon process of ulna with pronounced pectoral crest of humerus
  - Single distal condyle of humerus positioned on cranial surface
appearance:
  features:
    - reduced forelimbs
    - enlarged manual claws
  integument: feathered
  evidence: direct
