genus: Manidens
parent: Heterodontosauridae
etymology: The type species of Manidens, Manidens condorensis, was described in
  the journal Naturwissenschaften in 2011. Manidens was named in by Diego Pol,
  Oliver Rauhut and Marcos Becerra. The generic name is derived from Latin
  manus, "hand", and dens, "tooth", a reference to the hand-shaped form of the
  posterior lower teeth. The specific name refers to the village of Cerro
  Cóndor, located near to the Queso Rallado site where the specimen was found by
  zoologist Guillermo Rougier.
description: Manidens is an extinct genus of heterodontosaurid dinosaur from the
  Early Jurassic of Patagonia. It is a sister taxon of the closely related
  Pegomastax from South Africa. Fossils have been found in the Cañadón Asfalto
  Formation in Chubut Province, Argentina, considered to be originally dated to
  the Bajocian, latter were found to be from Toarcian beds.
diet: herbivore
locomotion: bipedal
