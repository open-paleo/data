genus: Manidens
parent: Heterodontosauridae
etymology: "From Latin 'manus' (hand) and 'dens' (tooth), referring to the hand-shaped form of the posterior lower teeth."
pronunciation:
  phonetic: man-EYE-denz
description: Manidens is an extinct genus of heterodontosaurid dinosaur from the
  Early Jurassic of Patagonia. It is a sister taxon of the closely related
  Pegomastax from South Africa. Fossils have been found in the Cañadón Asfalto
  Formation in Chubut Province, Argentina, considered to be originally dated to
  the Bajocian, latter were found to be from Toarcian beds.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
diagnostic_features:
  - Jugal with strongly developed, dorsally placed lateral boss
  - Dorsal part of postorbital process of jugal very slender and flexes abruptly
    posteriorly
  - Forebrain facet on ventral surface of frontal enlarged with significantly
    raised margins
  - Posterior teeth with asymmetric arrangement of denticles and mesial concavity
  - Posteriormost dentary tooth hand-shaped with only one or two mesial denticles
  - Small crenulations along cutting margin of each denticle
