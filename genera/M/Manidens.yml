genus: Manidens
parent: Heterodontosaurinae
etymology: "From Latin 'manus' (hand) and 'dens' (tooth), referring to the hand-shaped form of the posterior lower teeth."
pronunciation:
  phonetic: man-EYE-denz
description: Manidens is an extinct genus of heterodontosaurid dinosaur from the
  Early Jurassic of Patagonia. Fossils have been found in the Cañadón Asfalto
  Formation in Chubut Province, Argentina, considered to be originally dated to
  the Bajocian, latter were found to be from Toarcian beds.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
diagnostic_features:
  - Jugal with strongly developed, dorsally placed lateral boss
  - Dorsal part of postorbital process of jugal very slender and flexes abruptly
    posteriorly
  - Forebrain facet on ventral surface of frontal enlarged with significantly
    raised margins
  - Posterior teeth with asymmetric arrangement of denticles and mesial concavity
  - Posteriormost dentary tooth hand-shaped with only one or two mesial denticles
  - Small crenulations along cutting margin of each denticle
  - Transverse processes projecting at more than 30° to the horizontal
  - Sacrodorsal and sacrocaudal vertebrae absent
  - Neural spines of the sacral vertebrae contacting one another distally
  - Scapula relatively flat in sagittal view
  - Coracoid subquadrate and equidimensional, with a long sternal process
  - No vertical bone supporting the preacetabular process from the acetabular
    region
  - Brevis shelf small and smooth, visible only in medial view
appearance:
  integument: feathered
  evidence: direct
identifiers:
  - source: pbdb
    id: "185174"
  - source: wikidata
    id: Q1936116
  - source: gbif
    id: "8643375"
species:
  - name: Manidens condorensis
    etymology: "Named for the village of Cerro Cóndor in Chubut Province, Argentina, located near the Queso Rallado site where the holotype was found."
    status: valid
    type_species: true
    period:
      name:
        - Early Jurassic
      stage:
        - Toarcian
    location:
      country: AR
      locality: Queso Rallado
      region: AR-U
      formation: Cañadón Asfalto
    type_specimen:
      specimen_id: [MPEF-PV 3211]
      specimen_type: holotype
      institution: MPEF
      material: Partial associated skeleton including most elements of the skull and
        lower jaws, both proatlases, 16 vertebrae (cervical, dorsal, a fused sacrum
        of six vertebrae, and caudal), ribs, a fused right scapulocoracoid, a
        carpal (radiale), a non-ungual phalanx, and almost complete pelvic girdles
      completeness: partial
    size:
      hip_height_m:
        min: 0.2
        max: 0.2
      length_m:
        min: 0.6
        max: 0.6
      weight_kg:
        min: 1
        max: 1
    erected_in: pol2011a
references:
  - id: pol2011a
    notes: Recovered Manidens as the sister taxon of the South African
      heterodontosaurid clade, the same arrangement later analyses express as the
      basalmost heterodontosaurine.
  - id: cúneo2013a
    notes: Places the Queso Rallado assemblage, including this taxon, in the
      lowermost Cañadón Asfalto Formation or beds transitional with the Lonco
      Trapial, and dates those strata middle-late Toarcian.
  - id: jones2026a
    notes: Source of the hip height estimate.
  - id: fonseca2024a
    notes: Recovered Manidens as basalmost Heterodontosaurinae in their ornithischian phylogeny.
  - id: sereno2012a
    notes: Recovered Manidens as the basalmost heterodontosaurine.
  - id: becerra2025a
    notes: Describes the postcranium of the holotype, reidentifying the pectoral
      girdle as a fused right scapulocoracoid; rib histology shows a skeletally
      mature but somatically immature individual.
