genus: Microvenator
parent: Caenagnathidae
pronunciation:
  phonetic: MIEK-ro-vee-NAY-tor
etymology: "From Greek 'mikros' meaning 'small' and Latin 'venator' meaning
  'hunter'; translates as 'small hunter', named for its small size."
description: Microvenator is a genus of oviraptorosaurian theropod dinosaur from
  the Early Cretaceous Cloverly Formation in what is now south central Montana.
  The holotype fossil is an incomplete skeleton, most likely a juvenile with a
  length of 1.3 m (4.3 ft), and consequently, the adult size remains uncertain.
  Microvenator is primitive and may be the "sister taxon to all other
  oviraptorosaurs."
diet: omnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Very small, delicately built coelurid with hollow thin-walled vertebrae and
    limb bones
  - Cervicals without neural spines and with double pleurocoels
  - Dorsal neural arches low and highly sculpted; neural spines low and
    rectangular
  - Astragalus with very high and broad ascending process
  - Pubis profile concave anteriorly with only moderate distal expansion
  - Short but prominent lesser trochanter on femur with depression at fourth
    trochanter site
  - Femur-tibia ratio indicating swift running capabilities
  - Absence of cervical neural spines (unlike most other theropods)
  - Relatively long forearms approaching tibia length
appearance:
  features:
    - keratinous beak
  integument: feathered
  evidence: inferred
