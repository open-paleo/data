genus: Meraxes
parent: Giganotosaurini
etymology: "Named for Meraxes, the female dragon ridden by Queen Rhaenys Targaryen in George R. R. Martin's novel series A Song of Ice and Fire."
pronunciation:
  phonetic: muh-RAK-seez
description: Meraxes is a genus of large carcharodontosaurid theropod dinosaur
  from the Late Cretaceous Huincul Formation of Patagonia, Argentina. The genus
  contains a single species, Meraxes gigas.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Sacral neural spines co-ossified to unprecedented degree among
    carcharodontosaurids
  - Only Late Cretaceous carcharodontosaurid preserving near-complete forelimbs
    (47% femur length)
  - Well-developed hyposphen-hypantrum in anterior caudal vertebrae unique among
    carcharodontosaurids
  - Unique protuberances and rugosity patterns on dermal cranial bones
  - Tongue-like posterior projection of parietals over supraoccipital
  - Trapezoidal astragalar ascending process with truncated tip
  - Concavity over anterior margin of iliac blade
appearance:
  features:
    - cranial bosses
    - reduced forelimbs
    - enlarged pedal claws
  integument: scaled
  evidence: inferred
