genus: Mesetasaurus
parent: Aeolosaurini
etymology: "'Meseta', after the name of the locality (Meseta de Artigas), plus
  'saurus', Greek for reptile."
description: Mesetasaurus is a genus of aeolosaurin titanosaurian sauropod
  dinosaurs known from the Guichón Formation (Late Cretaceous, potentially
  Coniacian to Maastrichtian) of Paysandú Department, Uruguay. The genus
  contains a single species, the type species Mesetasaurus protector, known from
  two well-preserved caudal vertebrae. It is the second titanosaurian taxon
  known from its unit, after the saltasauroid Udelartitan.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Anterior caudal centra strongly procoelous, with ventral margins ranging
    from flat to slightly transversely concave.
  - Neural arch anteriorly displaced within the anterior caudal vertebrae.
  - "Anterior-most caudal centrum: anterior face slightly inclined (about 10
    degrees); ovoid blind fossa below the anteroposterior axis, close to the
    condyle; wide ventral surface with paired neurovascular foramina."
  - Anterior-most caudal centrum condyle strongly convex and slightly eccentric;
    prezygapophyses long, anterodorsally projected at about 30 degrees.
  - "Posterior anterior caudal centrum: anterior face strongly anteriorly
    inclined (about 25 degrees); centrum slightly dorsoventrally depressed."
  - "Posterior anterior caudal centrum: narrow ventral face bounded by
    ventrolateral ridges; condyle very strongly convex and strongly eccentric;
    prezygapophyses sub-horizontal (about 10 degrees)."
