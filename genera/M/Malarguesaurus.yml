genus: Malarguesaurus
parent: Somphospondyli
pronunciation:
  phonetic: muh-LAR-gway-SAWR-us
etymology: Named after the Malargüe Department of Mendoza Province, Argentina, combined with Greek 'sauros' (lizard); meaning 'Malargüe lizard'.
description: Malarguesaurus is a genus of titanosauriform sauropod dinosaur from
  the Late Cretaceous of Mendoza Province, Argentina. Its fossils, consisting of
  tail vertebrae, chevrons, ribs, and limb bones, were found in the upper
  Turonian-lower Coniacian Portezuelo Formation of the Neuquén Group. The type
  species, described by González Riga et al. in 2008, is M. florenciae.
dispute:
  summary: >
    Evicted from Titanosauria and placed in Somphospondyli pending the
    Somphospondyli placement pass. Malarguesaurus was described as a basal
    titanosauriform (González Riga et al., 2009) and is recovered by recent
    analyses as a non-titanosaurian somphospondylan rather than a titanosaur. Its
    precise position among non-titanosaurian somphospondylans is left for that
    clade's pass.
  history:
    - date: "2026-06-30"
      note: >
        Moved from Titanosauria to Somphospondyli as a non-titanosaurian
        somphospondylan; final placement deferred to the Somphospondyli batch.
    - date: "2026-07-02"
      note: Confirmed and placed at Somphospondyli incertae sedis in the sauropod-backbone finishes; it behaves as an unstable taxon (non-titanosaurian somphospondylan versus basal titanosaur) and its finer position is unresolved.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Slightly procoelous-opisthoplatyan proximal and middle caudal vertebrae
    associated with procoelous distal caudal centra
  - Proximal caudal neural spines vertically directed with concave caudal border
    and caudodorsal corner forming right angle
  - Distal caudal neural spines with concave and depressed dorsal border
