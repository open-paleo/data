genus: Mbiresaurus
parent: Sauropodomorpha
etymology: "Named for the Mbire District of Zimbabwe where the holotype was found, combined with Latin 'sauros' meaning 'reptile'."
pronunciation:
  phonetic: em-BI-yuh-SOR-us
description: Mbiresaurus is an extinct genus of basal sauropodomorph dinosaur
  from the Late Triassic (Carnian) Pebbly Arkose Formation of Zimbabwe. The
  genus contains a single species, Mbiresaurus raathi, known from a nearly
  complete skeleton. Mbiresaurus represents one of Africa's earliest known
  definitive dinosaurs.
locomotion: bipedal
paleoenvironment:
  - fluvial
diet: herbivore
diagnostic_features:
  - Frontal more than twice as anteroposteriorly long as mediolaterally wide
  - Postacetabular process of ilium anteroposteriorly short, dorsoventrally
    broad with well-developed brevis shelf (autapomorphy)
  - Olecranon process unfused to ulna late in ontogeny (potential autapomorphy)
  - Deltopectoral crest of humerus extends anteriorly at ~90° angle from long
    axis of humeral head
  - Width of distal humerus less than one-third proximodistal length
  - Slightly recurved dentary teeth with mesial and distal carinae and small
    denticles
appearance:
  integument: scaled
  evidence: inferred
