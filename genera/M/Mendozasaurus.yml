genus: Mendozasaurus
parent: Lognkosauria
etymology: Named for Mendoza Province in Argentina where it was discovered,
  combined with Greek '-saurus' meaning 'lizard'.
pronunciation:
  phonetic: men-DOE-suh-SOR-us
description: Mendozasaurus is a genus of titanosaurian sauropod dinosaur. It was
  a member of Titanosauria, which were massive sauropods that were common on the
  southern landmasses during the Cretaceous. It is represented by several
  partial skeletons from a single locality within the Coniacian (lower Upper
  Cretaceous) Sierra Barrosa Formation in the south of Mendoza Province,
  northern Neuquén Basin, Argentina.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Two subtriangular infrapostzygapophyseal fossae in anterior dorsal vertebrae
    over neural canal
  - Postzygapostspinal laminae in anterior dorsal vertebrae parallel to
    postzygapophyseal facet planes
  - Dorsoventrally extended interzygapophyseal cavity in anterior caudal
    vertebrae limited by spinopostzygapophyseal and spinoprezygapophysial
    laminae
  - Middle caudal vertebrae slightly procoelous with reduced posterior condyles
    displaced dorsally
  - Laminar mid-posterior caudal neural spines with horizontal straight dorsal
    border and anterodorsal right angle
  - Large subconic-spherical osteoderms lacking cingulum
appearance:
  features:
    - osteoderms
  integument: armored
  evidence: direct
