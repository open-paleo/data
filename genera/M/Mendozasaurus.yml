genus: Mendozasaurus
parent: Lognkosauria
etymology: Named for Mendoza Province in Argentina where it was discovered, combined with Greek '-saurus' meaning 'lizard'.
description: Mendozasaurus is a genus of titanosaurian sauropod dinosaur. It was
  a member of Titanosauria, which were massive sauropods that were common on the
  southern landmasses during the Cretaceous. It is represented by several
  partial skeletons from a single locality within the Coniacian (lower Upper
  Cretaceous) Sierra Barrosa Formation in the south of Mendoza Province,
  northern Neuquén Basin, Argentina.
diet: herbivore
locomotion: quadrupedal
