genus: Mercuriceratops
parent: Chasmosaurinae
etymology: From Latin 'Mercurius' (the Roman messenger god, whose winged
  helmet is evoked by the rod-and-flange shape of the squamosal) and Greek
  'keras' (horn) and 'ops' (face); meaning 'Mercury's horned face'.
pronunciation:
  phonetic: mur-kyuh-ree-seh-ruh-tops
description: Mercuriceratops is an extinct genus of chasmosaurine ceratopsid
  from the late Campanian of northern Laramidia, with the holotype recovered
  from the upper Judith River Formation of Fergus County, Montana, and a
  paratype squamosal from the lower Dinosaur Park Formation of Dinosaur
  Provincial Park, Alberta. The single species, Mercuriceratops gemini, is
  diagnosed by a uniquely rod-shaped posterior ramus of the squamosal —
  constricted into a mediolaterally compressed bar instead of the tapering
  triangle typical of chasmosaurines — with a hatchet-shaped lateral margin
  bearing four tab-shaped episquamosals. The "twin" species name refers to
  the two right squamosals from two formations on either side of the
  Canada-Montana border.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Squamosal posterior ramus constricted into a rod-shaped (mediolaterally
    compressed, subrectangular cross-section) bar rather than a tapering obtuse
    or broadly rounded triangle in dorsal view.
  - Lateral margin of the squamosal hatchet-shaped in dorsal view, with the
    posterolateral bar offset from the anterolateral flange by a deep embayment
    (notch).
  - Anterolateral flange bears four large, tab-shaped, well-fused episquamosals
    on its lateral margin.
  - Elongate episquamosals extending along the lateral margin of the posteriorly
    projecting rod-shaped squamosal bar.
  - Deeply incised longitudinal grooves on the medioventral surface of the
    posterior squamosal shaft forming a robust, tightly interdigitating sutural
    contact for the parietal.
