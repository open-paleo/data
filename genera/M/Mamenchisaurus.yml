genus: Mamenchisaurus
parent: Mamenchisauridae
pronunciation:
  ipa: /məˌmʌntʃiˈsɔːrəs/
  phonetic: mə-MUN-chee-SOR-əs, or spelling pronunciation
description: Mamenchisaurus is an extinct genus of sauropod dinosaurs known for
  their remarkably long necks, which made up nearly half the total body length.
  Numerous species have been assigned to the genus; however, the validity of
  these assignments has been questioned. Fossils have been found in the Sichuan
  Basin and Yunnan Province in China. Several species from the Upper Shaximiao
  Formation, whose geologic age is uncertain, have been described. However,
  evidence suggests this formation to be no earlier than the Oxfordian stage of
  the Late Jurassic. M. sinocanadorum dates to the Oxfordian stage (161.2 to
  158.7 mya), and M. anyuensis to the Aptian stage of the Early Cretaceous
  (around 114.4 mya). Most species were medium-large to large sauropods,
  measuring roughly 15 to 26 meters (49 to 85 ft) in length—possibly up to 35
  meters (115 ft), based on two undescribed vertebrae.
diet: herbivore
