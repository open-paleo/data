genus: Mamenchisaurus
parent: Mamenchisauridae
dispute:
  summary: >
    The composition of Mamenchisaurus is unsettled and the genus is poorly
    defined. Many species and fragmentary specimens have been referred to it
    over the years, several of them fragmentary and undiagnostic, and repeated
    analyses have failed to recover the genus as monophyletic (Moore and
    colleagues, 2020, 2023; Wang and colleagues, 2019). The type species,
    M. constructus, rests on fragmentary material that yields little character
    information: Moore and colleagues (2023) recovered no autapomorphies for
    it, found its phylogenetic position unstable, and regarded the forked
    mid-caudal chevrons long cited as diagnostic of the genus as possibly an
    artifact of reconstruction. It frequently falls outside the clade
    containing the other referred species (Dai and colleagues, 2025). Moore
    and colleagues (2023) placed M. sinocanadorum outside that clade as well,
    closest to Xinjiangtitan, but withheld taxonomic action pending a
    re-evaluation of the type species, and Dai and colleagues (2025) retained
    the generic name for their new species expressly to avoid further
    nomenclatural confusion. The referred species also span an implausible
    interval: Wang and colleagues (2019) dated the upper Suining Formation,
    the horizon of M. anyuensis, to 114.4 million years, some 30 million years
    younger than the Late Jurassic species, and called for a total
    re-evaluation of the genus. Moore and colleagues (2020) likewise failed to
    recover ZDM 0126 as sister to the M. hochuanensis holotype, casting doubt
    on that referral.
  history:
    - date: "2026-07-19"
      note: >
        Retained at Mamenchisauridae with the referred species held as valid.
        Recent analyses recover the genus as non-monophyletic, but no author
        has yet proposed a replacement arrangement, so the existing
        combinations stand pending revision of the type species.
pronunciation:
  ipa: /məˌmʌntʃiˈsɔːrəs/
  phonetic: muh-MUN-chee-SOR-uhs, or spelling pronunciation
etymology: Named after Mamenchi (a transliteration of the Chinese place name for
  a ferry crossing, Maming Creek), where the first fossils were found near
  Yibin, Sichuan, China, combined with Greek 'sauros' (lizard); meaning
  'Mamenchi lizard'
description: Mamenchisaurus is an extinct genus of sauropod dinosaurs known for
  their remarkably long necks, which made up nearly half the total body length.
  Numerous species have been assigned to the genus; however, the validity of
  these assignments has been questioned. Fossils have been found in the Sichuan
  Basin and Yunnan Province in China. Several species from the Upper Shaximiao
  Formation, whose geologic age is uncertain, have been described. However,
  evidence suggests this formation to be no earlier than the Oxfordian stage of
  the Late Jurassic. M. sinocanadorum dates to the Oxfordian stage (161.2 to
  158.7 mya), and M. anyuensis to the Aptian stage of the Early Cretaceous
  (around 114.4 mya). Most species were medium-large to large sauropods,
  measuring roughly 15 to 26 meters (49 to 85 ft) in length-possibly up to 35
  meters (115 ft), based on two undescribed vertebrae.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
appearance:
  features:
    - elongate neck
  integument: scaled
  evidence: inferred
diagnostic_features:
  - Cervical and dorsal vertebrae highly pneumatic and procoelous; cervical
    vertebrae very large with dorsal neural spines relatively straight and low
  - Cervical ribs with a pronounced trough-like form and a broad, thin distal
    end
  - Dorsal vertebrae with relatively concave lateral surfaces
  - Anterior six or seven caudal vertebrae deeply procoelous; mid-caudal and
    posterior caudal vertebrae amphiplatyan
  - Chevrons of the mid-caudal region markedly bifurcated but not massive,
    remaining connected above, unlike the open-topped chevrons of Diplodocus
