species:
  - name: Mamenchisaurus constructus
    etymology: From Latin 'constructus' meaning 'constructed' or 'built', chosen
      because the holotype fossil was discovered during construction work on the
      Yitang Highway in Sichuan Province, China.
    status: valid
    type_species: true
    period:
      name:
        - Late Jurassic
      stage:
        - Oxfordian
        - Kimmeridgian
        - Tithonian
      from_ma: 161.5
      to_ma: 145
    location:
      country: CN
      locality: Mamenchi Ferry, Yibin
      region: Sichuan
      formation: Shaximiao
      coordinates:
        - 28.700001
        - 104.516701
    size:
      hip_height_m:
        min: 3.1
        max: 3.1
      length_m:
        min: 13
        max: 35
      weight_kg:
        min: 5000
        max: 45000
    type_specimen:
      specimen_id:
        - IVPP V 790
      specimen_type: holotype
      institution: IVPP
      material: Fourteen cervical vertebrae, five dorsal vertebrae, thirty caudal
        vertebrae with ribs and chevrons, fragmentary ilium, partial right femur,
        complete right tibia and fibula, right astragalus, and partial right pes.
    erected_in: young1954a
  - name: Mamenchisaurus sinocanadorum
    etymology: From sino- (China) and canad- (Canada) with the Latin genitive
      plural -orum, for the China-Canada Dinosaur Project that recovered the
      holotype.
    status: valid
    type_species: false
    period:
      name:
        - Late Jurassic
      stage:
        - Oxfordian
      from_ma: 162.4
      to_ma: 158.7
    location:
      country: CN
      region: Xinjiang
      formation: Shishugou
      coordinates:
        - 44.804
        - 90.048
      locality: Jiangjunmiao, Junggar Basin
    type_specimen:
      specimen_id:
        - IVPP V10603
      specimen_type: holotype
      institution: IVPP
      material: Partial skull (left vomer, right pterygoid, possible ectopterygoid,
        right quadrate), right dentary and complete left mandible; partial
        cervical vertebrae 2–4; a nearly intact left cervical rib
    diagnostic_features:
      - Exceptionally elongate external mandibular fenestra (length:height ratio
        in lateral view of 3.7)
      - Ventral surface of the axis bears a deep, trough-like depression
        containing several pneumatic foramina anteriorly
      - Large, irregularly developed, paramedian pneumatic foramina flush with
        the surrounding ventral surface of cervical vertebra 3
      - Parallel-sided tooth crowns in labial view combined with a distolingual
        boss on some dentary teeth
      - Anterior surangular foramen at least twice as large in greatest diameter
        as the posterior surangular foramen
      - Essentially straight axial spinopostzygapophyseal lamina combined with a
        relatively low neural spine (neural spine:neural arch height ratio
        <0.45)
    erected_in: russell1993c
    described_in: moore2023a
  - name: Mamenchisaurus hochuanensis
    etymology: Named for Hechuan (Hochuan) County, Sichuan, China, where the
      holotype was discovered
    status: valid
    type_species: false
    period:
      name:
        - Late Jurassic
      stage:
        - Oxfordian
        - Kimmeridgian
        - Tithonian
      from_ma: 161.5
      to_ma: 145
    location:
      country: CN
      region: Sichuan
      formation: Shaximiao
      locality: Hechuan County (Mt. Gushushan)
    type_specimen:
      specimen_id:
        - CCG V 20401
      specimen_type: holotype
      institution: CCG
      material: Nearly complete vertebral column (cervical-caudal series), ilium,
        ischium, partial pubis, tibia, fibula, astragali, partial pes,
        fragmentary sternum, and proximal humerus
    size:
      length_m:
        min: 22
        max: 22
    diagnostic_features:
      - 19 cervical vertebrae, more numerous than in other known species of the
        genus
      - Cervical ribs bear dagger-shaped rib heads, unlike the spoon-shaped
        heads of the type species
      - Anterior three sacral neural spines fused, unlike the unfused condition
        in the type species
      - 16 anterior caudal vertebrae procoelous, more than in the type species
      - Astragalus relatively low, compared to a higher astragalus in the type
        species
    erected_in: young1972a
  - name: Mamenchisaurus youngi
    etymology: Honors C. C. Young, the Chinese vertebrate paleontologist.
    status: valid
    type_species: false
    period:
      name:
        - Late Jurassic
      stage:
        - Oxfordian
        - Kimmeridgian
        - Tithonian
      from_ma: 161.5
      to_ma: 145
    location:
      country: CN
      region: Sichuan
      formation: Shaximiao
      locality: Xinmin, Zigong
    type_specimen:
      specimen_id:
        - ZDM 0083
      specimen_type: holotype
      institution: ZG
      material: Nearly complete skeleton with skull; presacral through eighth caudal
        vertebrae articulated; pectoral girdle, pelvic girdle, and all four
        limbs nearly complete and in articulation
    size:
      length_m:
        min: 14
        max: 14
    diagnostic_features:
      - About two-thirds the size of M. hochuanensis, with 30 presacral
        vertebrae (vs. 32) and 5 sacral vertebrae (vs. 4).
      - Cervicals only moderately elongated; longest cervical about twice the
        longest dorsal, versus more than three times in M. hochuanensis.
      - Mid-series cervical rib capitula bifurcated and dorsal pleurocoels well
        developed, versus dagger-shaped capitula and poorly developed
        pleurocoels in M. hochuanensis.
      - Tibia longer than fibula, lacking an expanded distal end and without the
        distomedial fibular inflation seen in M. constructus.
      - Cervical ribs slender and elongated, versus relatively short in M.
        constructus.
      - Axis/third cervical vertebra length index of 1.4 (vs. 1.71 in M.
        sinocanadorum); mandibular dentition of 22-24 teeth exceeds the Xinjiang
        specimen's count.
    erected_in: pi1996a
  - name: Mamenchisaurus sanjiangensis
    etymology: From Chinese Pinyin 'sanjiang' (three rivers), for the type locality
      at the confluence of the Jialing, Fu, and Qu Rivers in Hechuan District.
    status: valid
    type_species: false
    period:
      name:
        - Late Jurassic
      stage:
        - Oxfordian
      from_ma: 161.5
      to_ma: 157.3
    location:
      country: CN
      region: Chongqing
      formation: Shaximiao
      locality: Hechuan District
    type_specimen:
      specimen_id:
        - CIP V0001
      specimen_type: holotype
      institution: CIP-CN
      material: Two cervical vertebrae, twelve dorsal vertebrae, five sacral
        vertebrae, four caudal vertebrae, left and right ilia, pubes and ischia,
        and the left femur, tibia, and fibula.
    diagnostic_features:
      - Additional fossa on the base of the prezygodiapophyseal lamina of the
        posterior cervical and anterior dorsal vertebrae (autapomorphy)
      - Accessory lamina extending from the prezygapophysis to the diapophysis on
        the anterior dorsal vertebrae (autapomorphy)
      - Several accessory laminae divide the spinodiapophyseal fossa of the
        dorsal vertebrae, and the spinodiapophyseal lamina is bifurcated
        dorsally from the third to seventh dorsal, the two branches forming the
        lateral margins of a secondary deep fossa (autapomorphy)
      - Epipophyseal-prezygapophyseal lamina preserved on the posterior cervical
        and anterior dorsal vertebrae
      - Height of the neural arch relative to the posterior centrum articular
        surface increases prominently from the anterior to the posterior dorsal
        series
      - Five sacral vertebrae completely fused, the distal portion of the neural
        spines platform-shaped, with lateral excavation on the sacrals
      - Dorsal margin of the ilium semicircular; femoral head dorsoventrally
        projected, with a transverse width to anteroposterior length ratio of
        about 2.6 at the femoral mid-shaft
    erected_in: dai2025b
notable_specimens:
  - specimen_id:
      - ZDM0126
    institution: ZG
    category: complementary
    significance: Nearly complete, mostly articulated specimen referred to M.
      hochuanensis that preserves the skull, pectoral girdle, and forelimb
      material missing from the holotype. It uniquely shows four fused distal
      caudal vertebrae possibly forming a tail club. A 2020 analysis cast doubt
      on its referral.
    discovered:
      year: 1995
    references:
      - xing2009a
      - moore2020a
