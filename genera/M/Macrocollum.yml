genus: Macrocollum
parent: Unaysauridae
etymology: From Greek 'makros' (long) and Latin 'collum' (neck); meaning 'long neck', referring to the animal's elongated neck
pronunciation:
  phonetic: MAK-row-COLL-um
description: Macrocollum is a genus of unaysaurid sauropodomorph dinosaur that
  lived during the Late Triassic period (early Norian) in what is now Brazil. It
  is one of the oldest dinosaurs known.
locomotion: bipedal
paleoenvironment:
  - fluvial
diet: herbivore
diagnostic_features:
  - Antorbital fossa perforated by a promaxillary fenestra
  - Medial margin of supratemporal fossa with simple smooth curve at
    frontal/parietal suture
  - Proximal articular surface of metacarpal I transversely narrow
  - Acetabulum not fully open
  - Ischiadic longitudinal groove not reaching caudal half of ischium
  - Absence of trochanteric shelf on femur
  - Medial condyle of distal femoral articulation subrectangular in distal view
  - Proximal end of metatarsal II with straight medial margin
  - Cervical vertebrae remarkably elongated (centrum about six times longer than
    cranial height)
  - Medial condyle of astragalus remarkably expanded cranially
