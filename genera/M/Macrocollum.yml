genus: Macrocollum
parent: Unaysauridae
description: Macrocollum is a genus of unaysaurid sauropodomorph dinosaur that
  lived during the Late Triassic period (early Norian) in what is now Brazil. It
  is one of the oldest dinosaurs known.
