genus: Masiakasaurus
parent: Noasaurinae
pronunciation:
  phonetic: mah-SHEE-ah-kah-SAWR-us
etymology: "From Malagasy 'masiaka' meaning 'vicious' and Greek 'sauros' meaning 'lizard'; translates as 'vicious lizard'."
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - arid
diagnostic_features:
  - Four dentary teeth most rostral in position are procumbent, with first tooth
    set in large ventrally expanded alveolus oriented almost horizontally
  - Strongly heterodont lower dentition with first four teeth elongate and
    weakly serrated, with labiolingually positioned carinae and caudally hooked
    apex
  - Lower posterior teeth increasingly recurved and transversely compressed with
    mesiodistally positioned carinae, contrasting markedly with anterior
    dentition
  - Specialized dentary with greatly emarginated caudal end indicating enlarged
    intramandibular fenestra
appearance:
  features:
    - procumbent teeth
  integument: scaled
  evidence: inferred
