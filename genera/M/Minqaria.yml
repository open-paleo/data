genus: Minqaria
parent: Arenysaurini
etymology: "From Arabic 'minqaria' meaning 'beak', a reference to the beak-like nature of the hadrosaurid jaw."
description: Minqaria is a genus of lambeosaurine dinosaurs from the Late
  Cretaceous (Maastrichtian) Ouled Abdoun Basin of Morocco. The genus contains a
  single species, Minqaria bata, known from a partial skull.
