genus: Minqaria
parent: Lambeosaurinae
etymology: "From Arabic 'minqaria' meaning 'beak', a reference to the beak-like nature of the hadrosaurid jaw."
pronunciation:
  phonetic: min-kwah-ree-uh
description: Minqaria is a genus of lambeosaurine dinosaurs from the Late
  Cretaceous (Maastrichtian) Ouled Abdoun Basin of Morocco. The genus contains a
  single species, Minqaria bata, known from a partial skull.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - marine
diagnostic_features:
  - Jugal articulation lies very low on maxilla (autapomorphic within
    Lambeosaurinae)
  - Ectopterygoid ridge concave in lateral and dorsal views, narrower
    posteriorly than anteriorly
  - Neurovascular foramina arranged in a row
  - Highly domed frontoparietal with extensive parietal contribution to dome and
    triangular parietal table
  - Maxillary toothrow sinusoidal in lateral or ventral views with deep buccal
    fossa
  - Dentary short and deep with straight occlusal margin and strongly extended
    symphyseal process
appearance:
  features:
    - keratinous beak
  integument: scaled
  evidence: inferred
