genus: Melanorosaurus
parent: Sauropodiformes
pronunciation:
  phonetic: me-LAN-or-o-SAWR-us
etymology: "From Greek 'melas' meaning 'black', 'oros' meaning 'mountain', and
  'sauros' meaning 'lizard'; translates as 'Black Mountain Lizard', named for
  the Black Mountains (Thaba Nyama) near the South African discovery site."
description: Melanorosaurus is a genus of basal sauropodomorph dinosaur that
  lived during the Late Triassic period. An omnivore from South Africa, it had a
  large body and sturdy limbs, suggesting it moved quadrupedally. Its limb bones
  were massive and heavy like the limb bones of true sauropods.
diet: omnivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - arid
diagnostic_features:
  - Vertebral centra considerably longer than high with oval end surfaces,
    dorsals rounded below
  - Humerus distal end differs from Gresslyosaurus; lateral condyle considerably
    smaller than medial with broad depression on anterior face
  - Ulna posterior border bent in S-shaped curve, differing from Plateosaurus
    erlenbergensis
  - Ilium shape most similar to Massospondylus carinatus
  - Femur shorter relative to humerus than in other Plateosauridae; 4th
    trochanter lower end below bone midpoint
  - Tibia massive with large proximal end, straight shaft, broadened distal end;
    sharp keel on anterior surface in lower half
