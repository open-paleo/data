genus: Melanorosaurus
parent: Sauropodiformes
placement: incertae sedis
pronunciation:
  phonetic: me-LAN-or-o-SAWR-us
etymology: "From Greek 'melas' meaning 'black', 'oros' meaning 'mountain', and
  'sauros' meaning 'lizard'; translates as 'Black Mountain Lizard', named for
  the Black Mountains (Thaba Nyama) near the South African discovery site."
description: Melanorosaurus is a genus of basal sauropodomorph dinosaur that
  lived during the Late Triassic period. An omnivore from South Africa, it had a
  large body and sturdy limbs, suggesting it moved quadrupedally. Its limb bones
  were massive and heavy like the limb bones of true sauropods.
dispute:
  summary: >
    Melanorosaurus readi is a derived sauropodiform hovering on the
    boundary of Sauropoda; depending on the Sauropoda definition it is the
    immediate non-sauropodan sister of the clade or just inside it.
  history:
    - date: "2026-06-29"
      note: >
        Placed at Sauropodiformes incertae sedis; the precise Sauropoda
        boundary remains unresolved.
diet: omnivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - arid
diagnostic_features:
  - Posterior margin of the ulna with a pronounced sigmoidal outline.
  - Sigmoidal dorsal margin of the iliac pubic peduncle.
  - Ratio of ilium height at the level of the ischiac peduncle to total ilium
    length greater than 0.67.
  - Ilium with a straight posterior margin continuous with the ischial peduncle,
    steeply angled at 65° to the horizontal.
  - Proximal caudal vertebrae with dorsoventrally elongate, mediolaterally
    narrow, heart-shaped centra at least 1.42 times taller than wide.
  - Proximal caudal centra with a deeply incised ventral midline groove.
  - Proximal caudal centra with foramina on their lateral surfaces.
