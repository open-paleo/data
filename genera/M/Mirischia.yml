genus: Mirischia
parent: Coelurosauria
dispute:
  summary: >
    The placement of Mirischia is highly unstable. It was originally described as
    a compsognathid (Naish et al., 2004); Dal Sasso and Maganuco (2011) recovered
    it as a basal coelurosaur outside Compsognathidae; Qiu et al. (2025) placed it
    in Sinosauropterygidae; and Delcourt et al. (2025), in their preferred
    implied-weights analysis, recovered it among the earliest-branching
    Maniraptoromorpha with Tanycolagreus and Santanaraptor. Given the conflict and
    the incomplete holotype, it is placed conservatively at Coelurosauria
    incertae sedis.
  history:
    - date: "2026-07-01"
      note: Moved from Maniraptoromorpha to Coelurosauria incertae sedis (least-inclusive uncontested clade); compsognathid, Sinosauropterygidae, earliest-maniraptoromorph, and ornithomimosaur hypotheses all proposed.
pronunciation:
  phonetic: my-RIS-kee-uh
etymology: From Latin 'mirus' (wonderful) and the Latinized plural of Greek 'ischion' (hip joint); meaning 'wonderful hips' or 'wonderful ischia', referring to the unusual ischia
description: Mirischia is an extinct genus of coelurosaurian theropod dinosaur
  from the Albian stage (Early Cretaceous Period) of northeastern Brazil.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - marine
  - coastal
diagnostic_features:
  - Pubic peduncle of ilium with concave cranial surface
  - Pubic boot with no cranial expansion and 32% total length of pubis
  - Pedicular fossae located craniodorsal to neural canal on caudal dorsal
    vertebra
  - Neural spines between 63% and 67% longer at distal tips than at bases
  - Ventral surface of sacral centra bearing shallow median depressions at
    either end
