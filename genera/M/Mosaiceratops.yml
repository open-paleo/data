genus: Mosaiceratops
parent: Neoceratopsia
description: Mosaiceratops is a genus of ceratopsian dinosaur that lived in the
  upper Cretaceous Xiaguan Formation in what is now the Henan Province of China.
  It was described by Zheng, Jin, and Xu in 2015 as the type species
  Mosaiceratops azumai. Although phylogenetic analyses have found it to be the
  basalmost neoceratopsian, the authors noted that several features in the
  premaxilla and nasal bones are shared with Psittacosaurus, indicating that
  neoceratopsians evolved premaxillary teeth twice and that the latter is not as
  primitive as previously thought.
diet: herbivore
