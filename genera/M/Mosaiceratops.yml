genus: Mosaiceratops
parent: Neoceratopsia
etymology: "From Latin 'mosaicus' meaning 'mosaic' and Greek 'keras' meaning 'horn' and 'ops' meaning 'face', giving the meaning 'mosaic horned face', referring to the mix of features from basal neoceratopsians, psittacosaurids, and other basal ceratopsians."
description: Mosaiceratops is a genus of ceratopsian dinosaur that lived in the
  upper Cretaceous Xiaguan Formation in what is now the Henan Province of China.
  It was described by Zheng, Jin, and Xu in 2015 as the type species
  Mosaiceratops azumai. Although phylogenetic analyses have found it to be the
  basalmost neoceratopsian, the authors noted that several features in the
  premaxilla and nasal bones are shared with Psittacosaurus, indicating that
  neoceratopsians evolved premaxillary teeth twice and that the latter is not as
  primitive as previously thought.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Curved groove anterior to the premaxilla-maxilla contact
  - Elongate anterior process of jugal with sub-parallel dorsal and ventral edges
  - Two tubercles developed in the ventral border infraorbital ramus
  - Distal end of dorsal ilium edge dorsoposteriorly directed
  - Edentulous premaxilla
  - Inverted T-shape jugal in lateral view
  - T-shape postorbital with slender and elongate jugal and squamosal processes
  - Basal tubera separated by a deep middle notch
