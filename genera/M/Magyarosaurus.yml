genus: Magyarosaurus
parent: Lithostrotia
pronunciation:
  phonetic: MOD-yar-o-SAWR-us
etymology: "From Hungarian 'Magyar' meaning 'Hungarian' and Greek 'sauros'
  meaning 'lizard'; named for Hungary, the country that controlled the
  Transylvanian region where it was found at the time of discovery."
description: Magyarosaurus is a genus of dwarf sauropod dinosaur from late
  Cretaceous Period (early to late Maastrichtian) in today's Transylvania. It is
  one of the smallest-known adult sauropods, measuring less than 3 m (9.8 ft)
  long and weighing less than 1,000 kg (2,200 lb). The type and only species is
  Magyarosaurus dacus. It has been found to be a close relative of Rapetosaurus
  in the family Saltasauridae in the sauropod clade Titanosauria in a 2005
  study.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Anterior caudal centra with ventrolateral ridges but without a midline
    furrow
  - Well-developed bulge on the posterior surface of the humerus, presumably the
    site for M. latissimus dorsi, positioned approximately equidistant from the
    medial and lateral margins
  - Interosseous ridge of the ulna strongly distolaterally oriented, its
    proximal end intersecting the anteromedial margin of the shaft
  - Low eccentricity of the femoral midshaft, 1.1-1.4
  - Subtle ridge on the anterior margin of the lateral surface of the fibula,
    its proximal tip at approximately the level of the distal end of the lateral
    trochanter
appearance:
  features:
    - osteoderms
  integument: armored
  evidence: direct
identifiers:
