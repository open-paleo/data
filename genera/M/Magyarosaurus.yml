genus: Magyarosaurus
parent: Eutitanosauria
pronunciation:
  phonetic: MOD-yar-o-SAWR-us
etymology: "From Hungarian 'Magyar' meaning 'Hungarian' and Greek 'sauros'
  meaning 'lizard'; named for Hungary, the country that controlled the
  Transylvanian region where it was found at the time of discovery."
description: Magyarosaurus is a genus of dwarf sauropod dinosaur from late
  Cretaceous Period (early to late Maastrichtian) in today's Transylvania. It is
  one of the smallest-known adult sauropods, measuring less than 3 m (9.8 ft)
  long and weighing less than 1,000 kg (2,200 lb). The type and only species is
  Magyarosaurus dacus. It has been found to be a close relative of Rapetosaurus
  in the family Saltasauridae in the sauropod clade Titanosauria in a 2005
  study.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Anterior caudal vertebrae strongly procoelous and deeply grooved below
  - Posterior caudal vertebrae partly planoconvex, elongated, with arch
    restricted to posterior portion of centrum
  - Anteriormost caudal vertebrae with small pleurozentral cavities absent in
    following vertebrae
  - Processus transversus of anteriormost caudal vertebrae rod-like rather than
    plate-like (unlike Diplodocus)
  - Dorsal vertebrae spongy with rather small, widely open pleurozentral
    cavities communicating with spongy part through a foramen
  - Neural spine of dorsal vertebrae +-shaped in cross-section, simple, somewhat
    club-shaped
appearance:
  features:
    - osteoderms
  integument: armored
  evidence: direct
