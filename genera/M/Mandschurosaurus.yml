genus: Mandschurosaurus
parent: Hadrosauridae
pronunciation:
  phonetic: man-CHOOR-o-SAWR-us
etymology: "Named for Manchuria (Mandschuria in German), the region of China
  where its fossils were found, combined with Greek 'sauros' meaning 'lizard'."
description: Mandschurosaurus is an extinct genus of hadrosaurids based on
  material from the Late Cretaceous of China and possibly also the Early
  Cretaceous of Laos. It was the first dinosaur genus named from China.
dispute:
  summary: >
    Mandschurosaurus is a nomen dubium based on a largely
    non-diagnostic, partly reconstructed mounted skeleton.
  history:
    - date: "2026-06-27"
      note: Placed at Hadrosauridae incertae sedis; nomen dubium.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - lacustrine
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "38774"
  - source: wikidata
    id: Q1076898
  - source: gbif
    id: "4823274"
  - source: eol
    id: "4531816"
species:
  - name: Mandschurosaurus amurensis
    etymology: "Named for the Amur River in China, on whose banks the holotype
      skeleton was collected."
    status: valid
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Maastrichtian
      from_ma: 72.1
      to_ma: 66
    location:
      country: CN
      locality: Jiayin
      region: Heilongjiang
      formation: Yuliangzi
      coordinates:
