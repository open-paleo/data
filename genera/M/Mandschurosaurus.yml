        max: 2000
    holotype:
      specimen_id: [ IVP AS coll. ]
      specimen_type: holotype
      institution: IVPP
      material: "A composite mounted skeleton assembled from disarticulated
        remains of more than one individual (~35% plaster): a partial skull
