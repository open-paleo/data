genus: Maxakalisaurus
parent: Aeolosaurini
etymology: Named after the Maxakali people, an indigenous ethnic group of Minas
  Gerais, Brazil, combined with Greek 'sauros' (lizard); meaning 'Maxakali
  lizard'
description: Maxakalisaurus is a genus of titanosaur dinosaur, found in the
  Adamantina Formation of Brazil, in the state of Minas Gerais in 1998. The
  genus name is derived from the tribe of the Maxakali; Topa is one of their
  divinities.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - arid
diagnostic_features:
  - Anterior and middle caudal vertebrae with dorsoventrally compressed centra
  - Midposterior caudal vertebrae with strongly concave lateral surface
    (spool-shaped)
  - Metacarpal IV approximately 12% shorter than metacarpal II
  - At least one biconvex caudal element
  - Dorsal margin of neural spine in midposterior caudals inclined anteriorly
  - Sacral centrum with keel-shaped ventral surface
