genus: Meroktenos
parent: Sauropodiformes
placement: incertae sedis
etymology: "From Ancient Greek 'meros' meaning 'thigh' and 'ktēnos' meaning 'beast'."
pronunciation:
  phonetic: may-RO-kuh-TAY-noss
description: Meroktenos is a genus of basal sauropodomorph dinosaur that lived
  during the Late Triassic period of what is now Lesotho.
dispute:
  summary: >
    Meroktenos thabanensis is a derived sauropodiform near the boundary of
    Sauropoda; it has been associated with Lessemsauridae but is recovered
    in a polytomy of apical non-sauropodan sauropodiforms by Peyre de
    Fabrègues and Allain (2016).
  history:
    - date: "2026-06-29"
      note: Placed at Sauropodiformes incertae sedis; the Lessemsauridae alternative and the Sauropoda boundary are recorded.
locomotion: facultative
paleoenvironment:
  - fluvial
  - arid
diet: herbivore
diagnostic_features:
  - Iliac blade depth 60% of total ilium height (vs <0.5 in other Southern
    African basal sauropodomorphs)
  - Subtriangular postacetabular process
  - Very stocky femur with robustness index of 2.09 (vs >2.18 in other Southern
    African basal sauropodomorphs)
  - Femoral shaft straight in anterior and lateral views
  - Femoral shaft significantly wider lateromedially than anteroposteriorly
    (eccentricity 1.58, vs <1.41 in others)
  - Oblique fourth trochanter on femur
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "335602"
  - source: wikidata
    id: Q22665934
species:
  - name: Meroktenos thabanensis
    etymology: "Named for the site Thabana-Morena in Lesotho, where the type specimen was discovered."
    status: valid
    type_species: true
