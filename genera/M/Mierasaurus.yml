genus: Mierasaurus
parent: Turiasauria
etymology: "Named for Bernardo de Miera y Pacheco, an eighteenth-century Spanish cartographer and explorer of the American Southwest, combined with Greek 'sauros' meaning 'lizard'."
pronunciation:
  phonetic: me-EHR-ah-SOR-us
description: Mierasaurus is an extinct genus of sauropod dinosaur from the Early
  Cretaceous of Utah, United States. The taxon was first described and named in
  2017 by Rafael Royo-Torres and colleagues, from a mostly complete skeleton
  including a disarticulated partial skull and mandible, teeth, multiple
  vertebrae from along the length of the body, both scapulae, radius and ulna
  bones, a left manus, a complete pelvis, both femora and the entire left
  hindlimb. Additionally, they referred a lower jaw and femur from juvenile
  individuals, which were found nearby, to the genus. Collectively, Mierasaurus
  is among the most completely known North American sauropods. The genus name
  honors Bernardo de Miera y Pacheco, the first European scientist to enter
  what is now Utah. The type species for Mierasaurus is Mierasaurus bobyoungi,
  named after Robert Glen Young, a paleontologist who researched the Early
  Cretaceous of Utah.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Otosphenoidal ridge extends from anterior surface of paroccipital process
    near its ventral margin and restricted to medialmost part of latter process
  - Occipital condyle has pair of rounded ridges extending dorsoventrally on
    either lateral face of condylar articular surface
  - Atlantal intercentrum bears pair of depressions in medial surface facing
    posteromedially, each receiving anterolateral margin of odontoid process
  - Cervical ribs bear ridge or bulge on lateral surface of tuberculum
    immediately posterior to base of anterior process
  - Lateral depression on distal ramus of haemal arches
  - Metacarpal I longer than metacarpal IV
  - Very short ischium compared to pubis (ischium:pubis length ratio 0.75)
  - Fourth trochanter placed in proximal part of femur
  - Femur with subequal distal condyles
  - Pedal unguals 2 and 3 compressed dorsoventrally
