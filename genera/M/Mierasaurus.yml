genus: Mierasaurus
parent: Turiasauria
etymology: "Named for Bernardo de Miera y Pacheco, an eighteenth-century Spanish cartographer and explorer of the American Southwest, combined with Greek 'sauros' meaning 'lizard'."
description: Mierasaurus is an extinct genus of sauropod dinosaur from the Early
  Cretaceous of Utah, United States. The taxon was first described and named in
  2017 by Rafael Royo-Torres and colleagues, from a mostly complete skeleton
  including a disarticulated partial skull and mandible, teeth, multiple
  vertebrae from along the length of the body, both scapulae, radius and ulna
  bones, a left manus, a complete pelvis, both femora and the entire left
  hindlimb. Additionally, they referred a lower jaw and femur from juvenile
  individuals, which were found nearby, to the genus. Collectively, Mierasaurus
  is among the most completely known North American sauropods. The genus name
  honours Bernardo de Miera y Pacheco, the first European scientist to enter
  what is now Utah. The type species for Mierasaurus is Mierasaurus bobyoungi,
  named after Robert Glen Young, a paleontologist who researched the Early
  Cretaceous of Utah.
