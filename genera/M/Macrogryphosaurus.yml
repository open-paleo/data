genus: Macrogryphosaurus
parent: Elasmaria
etymology: "From Greek 'makros' meaning 'large', 'gryphos' meaning 'enigmatic',
  and 'sauros' meaning 'lizard', hence 'big enigmatic lizard'. The species name
  'gondwanicus' refers to the ancient continent of Gondwana."
description: Macrogryphosaurus is a genus of elasmarian dinosaur from the
  Coniacian age Upper Cretaceous Sierra Barrosa Formation (Neuquén Group) of
  Argentina in Patagonia. It was described by Jorge Calvo and colleagues in
  2007, with M. gondwanicus as the type and only species.
diet: herbivore
locomotion: bipedal
