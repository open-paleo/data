genus: Macrogryphosaurus
parent: Elasmaria
etymology: "From Greek 'makros' meaning 'large', 'gryphos' meaning 'enigmatic',
  and 'sauros' meaning 'lizard', hence 'big enigmatic lizard'. The species name
  'gondwanicus' refers to the ancient continent of Gondwana."
description: Macrogryphosaurus is a genus of elasmarian dinosaur from the
  Coniacian age Upper Cretaceous Sierra Barrosa Formation (Neuquén Group) of
  Argentina in Patagonia. It was described by Jorge Calvo and colleagues in
  2007, with M. gondwanicus as the type and only species.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Triradiate sternum with anterior border tribranched, two laterally placed
    and outwardly directed branches, one centrally placed smaller forwardly
    directed branch
  - Sternal ribs flattened, twisted and distally expanded
  - Last dorsal vertebra with well-developed hyposphene
  - Thin plate-like ossifications located in front of sternum
  - Ten cervical vertebrae total
  - Fourteen dorsal vertebrae total
  - Epipophyses on 3rd cervical placed over distal end of postzygapophyses and
    posteriorly projected
  - Less developed pubic peduncle of ilium compared to Talenkauen
  - More acute angle between anterior ilium process and pubic peduncle
