genus: Menefeeceratops
parent: Centrosaurinae
etymology: Named after the Menefee Formation where it was found, combined with Greek 'keras' (horn) and 'ops' (face); meaning 'Menefee Formation horned face'.
pronunciation:
  phonetic: MEN-uh-fee-SEH-ruh-tops
description: Menefeeceratops is a genus of ceratopsid dinosaur from the Menefee
  Formation in New Mexico, United States. It is potentially the oldest known
  member of the ceratopsids, as well as the centrosaurine subfamily, related to
  animals including Yehuecauhceratops and Crittendenceratops. The type and only
  species is Menefeeceratops sealeyi, known from a partial, non-articulated
  skeleton.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Parietal lateral margin lacks epiparietal loci
  - Three external squamosal protuberances
  - Squamosal with three dorsolateral ridges that deviate from each other
  - Three elongate and shallow episquamosal loci
  - Episquamosal locus 1 with three secondary undulations
  - Two subequal embayments on posterior squamosal margin with dorsal distinctly
    larger
  - Posterior squamosal portion longer than anterior portion
  - Shallow groove on medial squamosal surface along ventrolateral and
    ventroposterior margins
  - Elongate postorbital horns distally curving anteriorly
  - Dentary with two elongated ridges on lateral surface forming distinct
    anterior triangular fossa
