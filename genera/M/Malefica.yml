genus: Malefica
parent: Hadrosauridae
etymology: From Latin 'malefica', meaning 'witch' or 'sorceress', referring to its discovery in Bruja Canyon ('bruja' being Spanish for 'witch').
pronunciation:
  phonetic: ma-LEF-ee-cuh
description: Malefica is a genus of hadrosaurid dinosaur from the Late
  Cretaceous (Campanian) Aguja Formation of Texas. The type and only species is
  Malefica deckerti.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Deep and broad moat-like space separating anterodorsal promontory of lateral
    surface from lateral surface of dorsal process
  - Anterodorsal promontory extends posteriorly as prominent ridge onto jugal
    facet
  - Inflated block-like jugal process
  - Widely arcuate anterodorsal promontory of lateral surface
  - Jugal process ending nearly dorsal to facet for jugal ventral spur
  - At least seven peribuccal foramina with main axis nearly horizontal
