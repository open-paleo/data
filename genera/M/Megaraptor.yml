genus: Megaraptor
parent: Megaraptoridae
pronunciation:
  phonetic: meg-a-RAP-tor
etymology: From Greek 'megas' (large) and Latin 'raptor' (one who seizes or thief); meaning 'large thief' or 'large raptor'
description: Megaraptor is a genus of large theropod dinosaur, the type genus
  and namesake of the clade Megaraptora and family Megaraptoridae. Its fossils
  have been discovered in the Patagonian Portezuelo Formation of Argentina,
  South America, dating to the Turonian and Coniacian ages of the Late
  Cretaceous, roughly 90-88 million years ago. One species of Megaraptor, M.
  namunhuaiquii, has thus been named, known from seven partial or fragmentary
  skeletons, with only two including skull elements.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - blade-like olecranon process on proximal ulna
  - distal end of ulna stout and triangular in distal aspect
  - manual phalanx 1.I subquadrangular in proximal view, with dorsal portion
    transversely wider than ventral
  - metatarsal III with deep and wide extensor ligament pit
appearance:
  features:
    - enlarged manual claws
  integument: unknown
