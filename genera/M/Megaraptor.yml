genus: Megaraptor
parent: Megaraptoridae
description: Megaraptor is a genus of large theropod dinosaur, the type genus
  and namesake of the clade Megaraptora and family Megaraptoridae. Its fossils
  have been discovered in the Patagonian Portezuelo Formation of Argentina,
  South America, dating to the Turonian and Coniacian ages of the Late
  Cretaceous, roughly 90–88 million years ago. One species of Megaraptor, M.
  namunhuaiquii, has thus been named, known from seven partial or fragmentary
  skeletons, with only two including skull elements.
diet: carnivore
