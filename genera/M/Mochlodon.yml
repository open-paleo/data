    diagnostic_features:
      - Dentary with a markedly deeper depression below the coronoid process that
        becomes transversely shallower but dorsoventrally wider toward the
        dentary-surangular suture.
      - Rostral tip of the dentary directed rostrally, so the dorsal margin of
        the symphyseal region is horizontal and near the level of the alveolar
        margin (rostroventrally directed in M. suessi).
      - Groove on the dorsal margin of the symphyseal region bordered caudally by
        a dorsally rounded vertical wall separating the first alveolus from the
        symphyseal region.
    erected_in: ősi2012a
