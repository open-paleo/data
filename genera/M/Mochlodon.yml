genus: Mochlodon
parent: Rhabdodontoidea
etymology: "From Greek 'mochlos' meaning 'bar' or 'lever' and 'odon' meaning
  'tooth', giving the meaning 'bar tooth' or 'lever tooth', referring to a
  distinctive tooth morphology."
description: Mochlodon is a genus of rhabdodontid dinosaurs from the Late
  Cretaceous of Austria and Hungary. It lived during the Late Cretaceous (85-80
  Ma) and two species have been named, M. suessi and M. vorosi, although the
  latter has been regarded as a junior synonym of the ceratopsian Ajkaceratops.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Straight dentary lacking U-shaped curve of Iguanodon symphysis, resulting in
    sharply pointed snout
  - Teeth with strong persistent median ridge and fine lateral striations on
    external surface
  - Scissors-like tooth wear with lower-jaw teeth internal to upper-jaw teeth
  - Tooth crowns with lateral ridges terminating in sharply rounded lanceolate
    margin giving crenulate appearance
