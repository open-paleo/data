genus: Machairoceratops
parent: Centrosaurinae
etymology: From Greek machairis (bent sword) combined with ceratops (horned face); meaning "bent sword horned face", referring to the two forward-curving frill horns
pronunciation:
  phonetic: mah-KY-ro-SEH-ruh-tops
description: Machairoceratops , previously known as the "Wahweap centrosaurine
  B", is an extinct genus of centrosaurine ceratopsian dinosaur known from the
  Late Cretaceous Wahweap Formation (late Campanian stage) of Grand
  Staircase-Escalante National Monument, southern Utah, United States.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Posteriorly projecting, anteriorly curved spike-like epiparietal (p1)
    ornamentation with unique posteromedially directed sulcus
  - Fan-shaped, subrectangular (rather than rectangular) stepped squamosal
  - Smaller, elliptical (rather than tetrahedral) epijugal inferred from
    epijugal contact facet
  - Anterodorsally (rather than laterally) curved epiparietal ornamentations on
    either side of midline embayment
  - Triangular (rather than rounded) parietosquamosal frill
appearance:
  integument: scaled
  evidence: inferred
