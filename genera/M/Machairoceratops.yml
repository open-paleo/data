genus: Machairoceratops
parent: Centrosaurinae
etymology: From Greek machairis (bent sword) combined with ceratops (horned face); meaning "bent sword horned face", referring to the two forward-curving frill horns
description: Machairoceratops , previously known as the "Wahweap centrosaurine
  B", is an extinct genus of centrosaurine ceratopsian dinosaur known from the
  Late Cretaceous Wahweap Formation (late Campanian stage) of Grand
  Staircase–Escalante National Monument, southern Utah, United States.
diet: herbivore
locomotion: quadrupedal
