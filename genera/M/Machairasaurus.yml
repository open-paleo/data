genus: Machairasaurus
parent: Heyuanninae
pronunciation:
  phonetic: muh-KY-ruh-SAWR-us
etymology: From Greek 'makhaira' (short scimitar or curved blade) and 'sauros' (lizard); meaning 'scimitar lizard', referring to the sabre-like hand claws
description: Machairasaurus is a genus of oviraptorid dinosaur which was found
  in the Bayan Mandahu Formation, China, dating to the late Cretaceous period.
diet: omnivore
locomotion: bipedal
paleoenvironment:
  - arid
diagnostic_features:
  - manual unguals I–III elongate and bladelike in lateral view, approximately
    400% the height of proximal articular surface
  - unguals of manual digits II and III weakly curved and bearing reduced flexor
    tubercles
  - manual phalanx II-2 does not exceed length of II-1
  - ventral flange of metacarpal I overlapping the ventral surface of metacarpal
    II
  - combined length of phalanges II-1 and II-2 does not exceed 110% the length
    of metacarpal II
  - metacarpal I at least 50% the length of metacarpal II
  - phalanx III-3 does not exceed length of phalanx III-2
  - phalanx I-1 robust with shaft diameter at least 20% of length
appearance:
  integument: feathered
  evidence: inferred
