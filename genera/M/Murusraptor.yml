genus: Murusraptor
parent: Megaraptoridae
etymology: From Latin 'murus' (wall) and 'raptor' (thief); meaning 'wall thief', referring to its discovery in a canyon wall.
description: Murusraptor is a genus of carnivorous megaraptoran theropod
  dinosaur from the Late Cretaceous (Coniacian age) Sierra Barrosa Formation,
  part of the Neuquén Group of Patagonia, in Argentina, South America. It is
  known from a single specimen that consists of a partial skull, ribs, partial
  pelvis, leg and other assorted skeletal elements.
diet: carnivore
locomotion: bipedal
