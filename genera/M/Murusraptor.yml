genus: Murusraptor
parent: Megaraptoridae
etymology: From Latin 'murus' (wall) and 'raptor' (thief); meaning 'wall thief', referring to its discovery in a canyon wall.
pronunciation:
  phonetic: MOO-roos-RAP-tuhr
description: Murusraptor is a genus of carnivorous megaraptoran theropod
  dinosaur from the Late Cretaceous (Coniacian age) Sierra Barrosa Formation,
  part of the Neuquén Group of Patagonia, in Argentina, South America. It is
  known from a single specimen that consists of a partial skull, ribs, partial
  pelvis, leg and other assorted skeletal elements.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Anterodorsal process of lacrimal longer than height of preorbital process
  - Thick, shelf-like thickening on lateral surface of surangular ventral to
    groove between anterior surangular foramen and insert for uppermost
    intramandibular process
  - Sacral ribs hollow and tubelike
  - Short ischia distally flattened and slightly expanded dorsoventrally
  - Large mandibular fenestra
  - Distal ends of caudal neural spines laterally thickened into lateral
    knob-like processes
