genus: Moros
parent: Tyrannosauroidea
etymology: From Ancient Greek Μόρος (Móros), meaning 'Doom'; the personified spirit of impending doom in Greek mythology
description: Moros is a genus of small tyrannosauroid theropod dinosaur that
  lived during the Late Cretaceous period in what is now Utah. It contains a
  single species, M. intrepidus. Moros represents one of the earliest known
  diagnostic tyrannosauroid material from North America.
diet: carnivore
locomotion: bipedal
