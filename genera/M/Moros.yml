genus: Moros
parent: Tyrannosauroidea
pronunciation:
  phonetic: MOH-ros
etymology: From Ancient Greek Μόρος (Móros), meaning 'Doom'; the personified spirit of impending doom in Greek mythology
description: Moros is a genus of small tyrannosauroid theropod dinosaur that
  lived during the Late Cretaceous period in what is now Utah. It contains a
  single species, M. intrepidus. Moros represents one of the earliest known
  diagnostic tyrannosauroid material from North America.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Small-bodied, gracile-limbed tyrannosauroid
  - Semicircular tuberosity on the craniomedial femoral shaft originating at the
    distalmost extent of the lesser trochanter
  - Sinuous articular facet on medial aspect of fourth metatarsal for contact
    with third metatarsal
  - Transversely compressed, subtriangular distal articular condyle of the
    fourth metatarsal in distal view
  - Distal articular surface of fourth metatarsal with hypertrophied
    craniolateral aspect confluent with deeply incised, striated extensor groove
appearance:
  integument: feathered
  evidence: direct
