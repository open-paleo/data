genus: Montanoceratops
parent: Leptoceratopsidae
pronunciation:
  phonetic: mon-TAN-o-SER-a-tops
  ipa: /mɒnˌtænoʊˈsɛrətɒps/
etymology: "From 'Montana' (the U.S. state where it was first discovered) combined with Greek 'keras' (horn) and 'ops' (face); meaning 'Montana horned face'"
description: Montanoceratops is an extinct genus of small ceratopsian dinosaur
  that lived approximately 70 million years ago during the latter part of the
  Cretaceous Period in what is now Montana and Alberta. Montanoceratops was a
  small sized, moderately-built, ground-dwelling, quadrupedal herbivore, that
  could grow up to an estimated 2.5 m (8.2 ft) in length and 170 kg (370 lb) in
  body mass.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
appearance:
  features:
    - keratinous beak
    - jugal horns
  integument: scaled
  evidence: inferred
diagnostic_features:
  - Well-developed nasal horncore on the nasals, absent in Leptoceratops
  - Squamosal extended well behind the head of the quadrate, helping form a
    parietosquamosal crest that Leptoceratops lacks
  - Dentary relatively long with a straight ventral border, versus the short
    dentary with rounded ventral border in Leptoceratops
  - Caudal neural spines very long, some more than five times the height of the
    corresponding centrum, versus two to two-and-a-half times in Leptoceratops
  - Splenial heavier and more elongate, with a more massive anterior end than in
    Leptoceratops
