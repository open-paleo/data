genus: Micropachycephalosaurus
parent: Cerapoda
placement: incertae sedis
pronunciation:
  phonetic: MIEK-ro-PAK-i-SEF-a-lo-SAWR-us
etymology: From Greek 'mikros' (small), 'pachys' (thick), 'kephale' (head), and
  'sauros' (lizard); meaning 'small thick-headed lizard'.
description: Micropachycephalosaurus is an extinct genus of basal
  marginocephalian dinosaur, containing only the type species,
  Micropachycephalosaurus hongtuyanensis. It lived in China during the Late
  Cretaceous (Campanian) and was found in the Jiangjunding Formation. It has the
  longest name of any dinosaur, with 23 letters in the genus name alone, while
  the full binomial contains 37 letters.
dispute:
  summary: >
    Despite its name, Micropachycephalosaurus hongtuyanensis is not
    confidently a pachycephalosaur. The dedicated redescription (Butler
    and Zhao, 2009) found no unambiguous synapomorphies and treated it
    as Cerapoda incertae sedis; some analyses recover it as a basal
    ceratopsian (Butler and others, 2011; Jones, 2026) while Fonseca and
    others (2024) recover it as a pachycephalosaur.
  history:
    - date: "2026-06-27"
      note: Placed at Cerapoda incertae sedis following the dedicated
        redescription (Butler and Zhao, 2009), which declines assignment
        to either Ceratopsia or Pachycephalosauria; conflicting
        ceratopsian and pachycephalosaurian results reflected, not
        adopted.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Parietal and postorbital bones thickened but relatively flat, not strongly
    domed
  - Supratemporal fenestra not closed
  - No prominent sagittal crest on the skull
  - Teeth slender, arranged in a single row, with central ridge on outer surface
    and symmetrical small cusps on anterior and posterior edges
  - Six fused sacral vertebrae with neural spines connected into a plate-like
    structure
  - Quadrate with small anterior inclination angle
appearance:
  integument: scaled
  evidence: inferred
identifiers:
