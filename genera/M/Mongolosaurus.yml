genus: Mongolosaurus
parent: Titanosauria
etymology: Named after Mongolia, where the fossil was discovered, combined with
  Greek 'sauros' (lizard); meaning 'Mongolia lizard'
description: Mongolosaurus is a genus of titanosauriform sauropod dinosaur which
  lived during the Early Cretaceous of China.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Teeth tapering and obtusely pointed, slightly flattened on inner side with
    angularly rounded outer side, bearing low longitudinal carinae (ridges) on
    either side extending to apex
  - Tooth carinae faintly serrate (on at least one tooth), distinguishing them
    from the spatulate, non-serrate teeth of Diplodocus and Pleurocoelus
  - Pulp cavity continued to top of crown
  - Atlas intercentrum relatively wider and more deeply excavated on ventral
    surface than in Diplodocus, with neurapophyses more constricted above base
  - Third cervical strongly opisthocoelous, lacking true pleurocentral cavities,
    with capitular facet processes not produced below level of centrum
    (contrasting with Diplodocus, Helopus, Haplocanthosaurus)
  - Third cervical with incipient bifid spinous processes indicated by parallel
    ridges, differing from well-developed spines of Diplodocus, Helopus, and
    Camarasaurus
