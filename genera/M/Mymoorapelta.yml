notable_specimens:
  - nickname: Cactus Park specimen
    specimen_id: [MWC 2610]
    institution: MWC
    species: Mymoorapelta maysi
    category: exceptional-preservation
    significance: "Partial skeleton from Cactus Park, Colorado, preserving sacrum, caudals, chevrons, pes, and dermal armor with a more complete sacral shield about 70 cm wide. Its articulated pes and sacral shield make it the only known articulated specimen, and at about 3 meters the largest described individual."
    references: [foster2007a, kirkland1998d]
