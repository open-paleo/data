genus: Mymoorapelta
parent: Nodosauridae
pronunciation:
  phonetic: mie-MOHR-a-PEL-ta
etymology: Named after the Mygatt-Moore Quarry (combining the names of its
  discoverers) combined with Greek 'pelta' (shield); meaning 'shield from the
  Mygatt-Moore Quarry'.
description: Mymoorapelta is a nodosaurid ankylosaur from the Late Jurassic
  (Kimmeridgian-Tithonian, around 155 to 150 million years ago) Morrison
  Formation (Brushy Basin Member) of western Colorado and central Utah, USA. The
  animal is known from a single species, Mymoorapelta maysi, and few specimens
  are known. The most complete specimen is the holotype individual from the
  Mygatt-Moore Quarry, which includes osteoderms, a partial skull, vertebrae,
  and other bones. It was initially described by James Kirkland and Kenneth
  Carpenter in 1994. Along with Gargoyleosaurus, it is one of the earliest known
  nodosaurids.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
appearance:
  features:
    - body armor
  integument: armored
diagnostic_features:
  - Centra of dorsal vertebrae cylindrical
  - Anterior dorsal vertebrae with triangular pit between prezygapophyses
  - Transverse processes not steeply angled upward
  - Prezygapophyses of proximal caudal vertebrae small, anteroposteriorly
    elongate, widely separated, divergent
  - Ribs triangular in cross section rather than T- or L-shaped
  - Olecranon process broad and massive
  - Preacetabular process of ilium curves lateroventrally
  - Antitrochanter absent
  - Cervical dermal spine with groove extending from base to tip
  - Triangular caudal plates with base proportionally shorter relative to height
