genus: Monolophosaurus
parent: Tetanurae
dispute:
  summary: >
    Monolophosaurus jiangi was long regarded as a basal allosauroid, but recent
    analyses place it outside Allosauroidea among basal tetanurans: as the sister
    taxon of Avetheropoda (Smith et al., 2007), as a basal tetanuran outside
    Megalosauroidea and Avetheropoda (Carrano, Benson and Sampson, 2012), as a basal
    megalosauroid allied with Chuandongocoelurus (Benson, 2010), or as an
    early-branching spinosaurid within Megalosauroidea (Rauhut et al., 2024). It is
    placed conservatively at Tetanurae incertae sedis pending the basal-tetanuran
    reconciliation.
  history:
    - date: "2026-07-02"
      note: Moved from Allosauroidea to Tetanurae incertae sedis in the Allosauroidea batch, then confirmed and placed at Tetanurae incertae sedis in the basal-Tetanurae/Avetheropoda batch; recovered outside Allosauroidea in all recent analyses, with its exact basal-tetanuran or megalosauroid position unresolved.
etymology: "From Greek 'monos' meaning 'single' and 'lophos' meaning 'crest', plus Greek 'sauros' meaning 'lizard'; translates as 'single-crested lizard', named for the distinctive single crest on its skull."
pronunciation:
  phonetic: MON-oh-LOF-oh-SOR-uhs
  ipa: /ˌmɒnoʊˌlɒfoʊˈsɔːrəs/
description: Monolophosaurus is an extinct genus of tetanuran theropod dinosaur
  from the Middle Jurassic Shishugou Formation in what is now Xinjiang, China.
  It was named for the single crest on top of its skull. Monolophosaurus was a
  mid-sized theropod at about 5-5.5 meters (16-18 ft) long and weighed 475
  kilograms (1,047 lb).
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Low, prominent medial crest on skull roof extending from above external
    naris to point between orbits, formed by paired premaxillary, nasal,
    lacrimal, and frontal bones
  - Crest with hollow interior connected to antorbital fossae via several large
    foramina anterodorsal to orbits
  - Long, low external naris (155 cm long, 65 cm high) with anteroposteriorly
    elongate premaxilla and elongate antorbital length (440 mm)
  - Four premaxillary teeth, with nasal processes of premaxillae deeper along
    midline than in other theropods
