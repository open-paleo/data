genus: Malawisaurus
parent: Lithostrotia
pronunciation:
  phonetic: mah-LAH-wee-SAWR-us
etymology: "Named for Malawi, the African country where its fossils were
  discovered, combined with Greek 'sauros' meaning 'lizard'."
description: Malawisaurus is an extinct genus of titanosaurian sauropod
  dinosaur. It is known from the Dinosaur Beds of northern Malawi, which
  probably date to the Aptian stage of the Early Cretaceous. The type species is
  M. dixeyi and the specific name honors Frederick Augustus Dixey.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Strongly procoelous anterior caudal vertebrae with short vertical neural
    spines
  - Middle and distal caudal vertebrae gently biconcave (not procoelous)
  - Transversely expanded ischium
  - Premaxilla with blunt snout and external naris far anterior, positioned
    below the maxillary suture rather than anterior to it
  - Flattened teeth, neither pencil-shaped nor broadly spatulate
  - Low vertical neural spines in caudal vertebrae not extending beyond
    posterior margin of centrum
appearance:
  features:
    - osteoderms
  integument: armored
  evidence: direct
