genus: Mei
parent: Sinovenatorinae
etymology: "From Chinese 寐 (mèi) meaning 'sleepy' or 'soundly sleeping', referring to the sleeping posture in which the holotype specimen was preserved."
pronunciation:
  phonetic: MY
description: Mei is a genus of duck-sized troodontid dinosaur first unearthed by
  paleontologists from the Yixian Formation in Liaoning, China in 2004. Mei lived
  during the Early Cretaceous period.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
  - forested
diagnostic_features:
  - Extremely large nares extending posteriorly over one-half of the maxillary
    tooth row
  - Closely packed middle maxillary teeth
  - Maxillary tooth row extending posteriorly to the level of the preorbital bar
  - Robust, sub-'U'-shaped furcula
  - Lateral process on distal tarsal IV
  - Proximal end of the pubic shaft significantly compressed anteroposteriorly,
    extending laterally just ventral to ilium articulation
appearance:
  integument: feathered
  evidence: direct
