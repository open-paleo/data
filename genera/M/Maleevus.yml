genus: Maleevus
parent: Ankylosauridae
pronunciation:
  phonetic: mahl-YAY-yev-us
etymology: Named in honor of Soviet paleontologist Evgeny Maleev; the suffix
  '-us' is a standard Latinized honorific formation
description: Maleevus is an extinct genus of herbivorous ankylosaurid dinosaur
  from the late Cretaceous, around 90 million years ago (possibly 98-83 Ma), of
  Mongolia.
dispute:
  summary: >
    Maleevus is a nomen dubium; its fragmentary material lacks diagnostic characters (Arbour and Currie, 2015), though it is generally regarded as an ankylosaurid. It is retained at Ankylosauridae without a subfamily.
  history:
    - date: "2026-06-26"
      note: Placed at Ankylosauridae, kept as a probable ankylosaurid although the genus is a nomen dubium.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Anterior maxillary shelf weakly developed and originating near start of
    tooth row
  - Maxillary teeth with 'w'-shaped cingulum
  - Occipital condyle almost hemispherical and ventrally directed
  - Basicranium ventral surface bears two weakly expressed longitudinal ridges
    diverging anteriorly
  - Fundus of brain cavity almost level
appearance:
  integument: armored
  evidence: inferred
identifiers:
  - source: pbdb
    id: "82618"
  - source: wikidata
    id: Q18578563
  - source: gbif
    id: "4823334"
synonyms:
  - name: Syrmosaurus
    type: junior subjective
    reason: Has a complex reassignment history (Talarurus, Pinacosaurus, Maleevus);
      tentatively treated as a synonym of Maleevus pending further research.
species:
  - name: Maleevus disparoserratus
    etymology: "From Latin 'dispar' meaning 'unequal' and 'serratus' meaning
      'serrated', referring to the unequal serrations observed on the teeth of
      the holotype jaw bones."
    status: valid
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Cenomanian
        - Turonian
        - Coniacian
        - Santonian
    size:
      length_m:
        min: 6.0
        max: 6.0
    location:
      country: MN
      region: MN-053
      formation: Bayan Shireh
    type_specimen:
      specimen_id: [ PIN 554/1 ]
      specimen_type: holotype
      institution: PIN
      material: Fragments of the right and left maxilla with weakly developed
        anterior maxillary shelf; maxillary teeth with 'w'-shaped cingulum.
      completeness: fragmentary
      notes: A braincase fragment with occipital condyle (PIN 554/2) from the same
        locality is referred material, not part of the holotype.
    erected_in: tumanova1987a
references:
  - id: tumanova1987a
  - id: arbour2015a
    notes: Assessed Maleevus as an undiagnosable nomen dubium, generally an ankylosaurid.
