genus: Musango
parent: Unaysauridae
etymology: "Named for the Musango Concession Area and nearby Musango Island at the type locality on Lake Kariba; 'musango' is a chiShona word meaning 'living in the bush', alluding to the remoteness of the site."
description: Musango is an extinct genus of unaysaurid sauropodomorph dinosaurs
  from the Upper Triassic (Norian) Pebbly Arkose Formation of Zimbabwe. The
  genus contains a single species, Musango matusadonaensis, known from a partial
  skeleton. Musango represents the fifth dinosaur genus to be named from
  Zimbabwe.
locomotion: bipedal
paleoenvironment:
  - fluvial
diet: herbivore
dispute:
  summary: >
    The unaysaurid affinity of Musango rests on a single analysis with weak
    support throughout. Barrett and others (2026) recover Musango as the sister
    taxon of the sympatric Musankwa within Unaysauridae in all most-parsimonious
    trees, but that pairing is supported by one highly homoplastic astragalar
    character at a Bremer support of 1, and the authors caution that the
    relationship is unlikely to prove robust as new material comes to light. The
    position of Unaysauridae itself alternates between a sister-group
    relationship with Plateosauridae and the earliest-diverging position within
    Massopoda.
  history:
    - date: "2026-07-29"
      note: Placed in Unaysauridae following Barrett and others (2026), the only
        analysis so far to include the taxon; the weak support for that position
        and for the Musango–Musankwa pairing is recorded here rather than by
        attaching the genus to a less resolved parent.
diagnostic_features:
  - Middle caudal vertebrae bear exceptionally elongate transverse processes,
    more than twice the centrum's transverse width and exceeding centrum
    anteroposterior length
  - Distal ends of the middle caudal transverse processes are anteroposteriorly
    expanded and fan-shaped
  - The supraacetabular crest of the ilium bifurcates posteriorly into two ridges
  - The lateral margin of the pubic apron is greatly thickened and expanded
    anteroposteriorly relative to the medial margin, forming a prominent
    buttress
  - The medial surface of the fibula's proximal expansion bears a deep concavity
    with a prominent ventrally extending midline ridge
  - Two subparallel ridges extend from the posteromedial corner of the
    astragalus's ascending process
