genus: Mnyamawamtuka
parent: Titanosauria
etymology: From Kiswahili 'Mnyama wa Mtuka', meaning 'beast of the Mtuka river drainage', contracted to form the genus name.
description: Mnyamawamtuka is a genus of lithostrotian titanosaur sauropod
  dinosaur from the Cretaceous Galula Formation in Tanzania. The type and only
  species is M. moyowamkia.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Middle and posterior dorsal vertebrae with vertical lamina between neural
    canal and interpostzygapophyseal lamina that bifurcates dorsally
  - Posterior dorsal vertebra with no interpostzygapophyseal lamina as
    postspinal lamina continues to dorsal margin of neural canal
  - Prominent dorsolateral expansion on posterior centrum of middle caudal
    vertebra
  - Curved crest with accompanying fossa within dorsomedial region of proximal
    scapular blade
  - Sternal plate unusually small, estimated at most 42% of humerus length
