genus: Martharaptor
parent: Therizinosauroidea
description: Martharaptor is a genus of therizinosauroid theropod dinosaurs from
  the Early Cretaceous of the Cedar Mountain Formation in Utah. They can be
  distinguished from other therizinosauroids by means of several features of the
  skeleton (particularly the hands and feet) which were intermediate between
  early therizinosaurs such as Falcarius and Beipiaosaurus, and more "advanced"
  members of the group like therizinosaurids. The deep and homogeneous hand
  claws clearly differ from the case in early therizinosauroids, but the foot
  has not yet acquired the robust morphology of therizinosaurids.
diet: herbivore
