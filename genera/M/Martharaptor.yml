genus: Martharaptor
parent: Therizinosauroidea
etymology: "Named in honor of Martha C. Hayden, the paleontologist assistant who helped discover the Hayden-Corbett site in the Cedar Mountain Formation of Utah where the specimen was found, combined with Latin 'raptor' meaning 'thief'."
pronunciation:
  phonetic: mar-thuh-RAP-tuhr
description: Martharaptor is a genus of therizinosauroid theropod dinosaurs from
  the Early Cretaceous of the Cedar Mountain Formation in Utah. They can be
  distinguished from other therizinosauroids by means of several features of the
  skeleton (particularly the hands and feet) which were intermediate between
  early therizinosaurs such as Falcarius and Beipiaosaurus, and more "advanced"
  members of the group like therizinosaurids. The deep and homogeneous hand
  claws clearly differ from the case in early therizinosauroids, but the foot
  has not yet acquired the robust morphology of therizinosaurids.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Manual unguals without proximodorsal lips, with prominent flexor tubercles
    and strong curvature
  - Manual unguals with total length perpendicular to articular facet subequal
    to total height parallel to facet
  - Manual ungual of digit III nearly as large as that of digit II
  - Distal end of scapula expanded
  - Metatarsal I proximally attenuated and distally reduced in transverse width
  - All metatarsals distally non-ginglymoid; fourth metatarsal beveled distally
appearance:
  integument: feathered
  evidence: direct
