    type: junior
    reason: Initially described as its own genus in 1850 and later reassigned to Iguanodon; subsequent study placed the material in Mantellisaurus.
  - name: Vectisaurus
    type: junior
    reason: Now generally interpreted as a juvenile individual of Mantellisaurus.
  - name: Proplanicoxa
    type: junior
    reason: Originally referred to Vectisaurus valdensis and later re-erected as Proplanicoxa; with Vectisaurus now considered a juvenile of Mantellisaurus, Proplanicoxa is also treated as a junior synonym.
