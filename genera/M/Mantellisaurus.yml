genus: Mantellisaurus
parent: Hadrosauriformes
etymology: Named for Gideon Mantell, the English geologist and paleontologist
  who first described Iguanodon, combined with Greek '-saurus' meaning 'lizard'.
pronunciation:
  phonetic: man-tell-i-SOR-us
description: Mantellisaurus is a genus of iguanodontian dinosaur that lived in
  the Barremian and early Aptian ages of the Early Cretaceous Period of Europe.
  Its remains are known from Belgium (Bernissart), England, Spain and Germany.
  The type and only species is M. atherfieldensis. Formerly known as Iguanodon
  atherfieldensis, the new genus Mantellisaurus was erected for the species by
  Gregory Paul in 2007. According to Paul, Mantellisaurus was more lightly built
  than Iguanodon and more closely related to Ouranosaurus, making Iguanodon in
  its traditional sense paraphyletic. It is known from many complete and almost
  complete skeletons. The genus name honors Gideon Mantell, the discoverer of
  Iguanodon.
dispute:
  summary: >
    Mantellisaurus atherfieldensis is grouped with Iguanodon (and, in
    some analyses, Barilium and Comptonatus) in a monophyletic
    Iguanodontidae by Lockwood and others (2024), but this family is
    traditionally paraphyletic and Iguanodontidae is not consistently
    recovered.
  history:
    - date: "2026-06-29"
      note: Placed at Hadrosauriformes, the uncontested keystone; the
        monophyletic Iguanodontidae of Lockwood and others (2024)
        reflected, not adopted (P4, P5).
diet: herbivore
locomotion: bipedal
diagnostic_features:
  - Tabulate lacrimal process of the maxilla, situated posterior to the ascending
    process in lateral view.
  - Pronounced, hook-shaped scapular acromion process with an acute internal
    angle.
  - Prominent dorsal ridge on the anterior end of the nasal process of the
    premaxilla.
paleoenvironment:
  - coastal
  - fluvial
  - lacustrine
  - marine
appearance:
  features:
    - keratinous beak
  integument: scaled
  evidence: inferred
