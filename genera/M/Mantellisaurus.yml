genus: Mantellisaurus
parent: Iguanodontia
etymology: Named for Gideon Mantell, the English geologist and paleontologist who first described Iguanodon, combined with Greek '-saurus' meaning 'lizard'.
description: Mantellisaurus is a genus of iguanodontian dinosaur that lived in
  the Barremian and early Aptian ages of the Early Cretaceous Period of Europe.
  Its remains are known from Belgium (Bernissart), England, Spain and Germany.
  The type and only species is M. atherfieldensis. Formerly known as Iguanodon
  atherfieldensis, the new genus Mantellisaurus was erected for the species by
  Gregory Paul in 2007. According to Paul, Mantellisaurus was more lightly built
  than Iguanodon and more closely related to Ouranosaurus, making Iguanodon in
  its traditional sense paraphyletic. It is known from many complete and almost
  complete skeletons. The genus name honours Gideon Mantell, the discoverer of
  Iguanodon.
diet: herbivore
locomotion: bipedal
