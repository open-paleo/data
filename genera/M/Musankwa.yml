genus: Musankwa
parent: Massopoda
description: Musankwa is an extinct genus of massopodan sauropodomorph dinosaurs
  from the Late Triassic (Norian) Pebbly Arkose Formation of Zimbabwe. The genus
  contains a single species, Musankwa sanyatiensis, known from an incomplete
  hindlimb. Musankwa represents the fourth dinosaur genus to be named from
  Zimbabwe.
