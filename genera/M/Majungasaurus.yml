genus: Majungasaurus
parent: Majungasaurinae
pronunciation:
  ipa: /məˌdʒʌŋɡəˈsɔːrəs/
  phonetic: mah-joon-gah-sore-us
etymology: "Named after Mahajanga (formerly Majunga), a city and region in
  northwestern Madagascar where it was discovered, combined with Greek 'sauros'
  (lizard); meaning 'Mahajanga lizard'"
description: Majungasaurus is a genus of abelisaurid theropod dinosaur that
  lived in Madagascar from 70 to 66 million years ago, at the end of the
  Cretaceous Period, making it one of the last-known non-avian dinosaurs that
  went extinct during the Cretaceous-Paleogene extinction event. The genus
  contains a single species, Majungasaurus crenatissimus. This dinosaur is also
  called Majungatholus, a name which is considered a junior synonym of
  Majungasaurus.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - arid
diagnostic_features:
  - Dentary relatively low with convex external lower half
  - Continuous alveolar septum on lingual face (not triangular ossicles)
  - Large, elongated nutrient foramina at base of internal alveolar wall
  - Flattened superior external region with distinct posterior notch bordered by
    two processes
appearance:
  features:
    - frontal horn
    - reduced forelimbs
  integument: scaled
  evidence: inferred
