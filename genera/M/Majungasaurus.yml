synonyms:
  - name: Majungatholus
    type: junior subjective
    reason: Initially erected as a separate genus due to the lack of overlapping
      material; subsequently recognized as referable to Majungasaurus.
iczn_rulings:
  - type: type-specimen
    ruling: iczn2011a
    petition: carrano2009a
    notes: Opinion 2269 set aside all previous type fixations for Megalosaurus
      crenatissimus under the plenary power and designated MNHN.MAJ 1, the right
      dentary Depéret described, as the neotype, the original material being
      non-diagnostic. Majungasaurus was placed on the Official List of Generic
      Names and crenatissimus on the Official List of Specific Names.
species:
  - name: Majungasaurus crenatissimus
    etymology: "From Latin 'crenatus' meaning 'notched' combined with the
      superlative suffix '-issimus' meaning 'most', referring to the numerous
      serrations on both the front and rear edges of the teeth."
    status: valid
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Maastrichtian
    location:
      country: MG
      locality: Mevarana site 2
      region: MG-M
      formation: Maevarano
      coordinates:
        - -15.907778
        - 46.582222
    size:
      hip_height_m:
        min: 1.9
        max: 1.9
      length_m:
        min: 5.6
        max: 8.0
      weight_kg:
        min: 750
        max: 1100
    type_specimen:
      specimen_id: [ MNHN.MAJ 1 ]
      specimen_type: neotype
      institution: MNHN
      material: Fragmentary right dentary of a subadult individual.
      completeness: partial
    synonyms:
      - name: Megalosaurus crenatissimus
        type: reassigned
        reason: The original combination; Depéret (1896) named the species on a
          syntype series that was later judged non-diagnostic.
      - name: Dryptosaurus crenatissimus
        type: reassigned
        reason: Depéret and Savornin (1928) moved the species to Dryptosaurus;
          Lavocat (1955) later erected Majungasaurus for it.
    erected_in: lavocat1955a
    described_in: krause2007a
notable_specimens:
  - specimen_id: [FMNH PR 2100]
    institution: FMNH
    species: Majungasaurus crenatissimus
    category: exceptional-preservation
    significance: "A spectacularly complete skull preserving cranial anatomy absent from the fragmentary type dentary. Its dome-shaped frontal swelling matched Majungatholus, leading to that name's recognition as a synonym, and CT scanning reconstructed its brain and inner ear."
    discovered:
      year: 1996
    references: [sampson1998a, sampson2007a]
  - specimen_id: [UA 8678]
    institution: UADBA
    species: Majungasaurus crenatissimus
    category: physiology
    significance: "A superbly preserved series of vertebrae and ribs whose pneumatic foramina let scientists reconstruct the respiratory system, implying avian-style air sacs and flow-through ventilation, with implications for the early evolution of bird respiration."
    references: [oconnor2005a]
