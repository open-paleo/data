genus: Majungasaurus
parent: Majungasaurinae
pronunciation:
  ipa: /məˌdʒʌŋɡəˈsɔːrəs/
  phonetic: mah-joon-gah-sore-us
etymology: "Named after Mahajanga (formerly Majunga), a city and region in
  northwestern Madagascar where it was discovered, combined with Greek 'sauros'
  (lizard); meaning 'Mahajanga lizard'"
description: Majungasaurus is a genus of abelisaurid theropod dinosaur that
  lived in Madagascar from 70 to 66 million years ago, at the end of the
  Cretaceous Period, making it one of the last-known non-avian dinosaurs that
  went extinct during the Cretaceous-Paleogene extinction event. The genus
  contains a single species, Majungasaurus crenatissimus. This dinosaur is also
  called Majungatholus, a name which is considered a junior synonym of
  Majungasaurus.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - arid
diagnostic_features:
  - Dorsoventrally deep, fused nasals that are strongly pneumatized via large,
    bilateral foramina
  - Nasal processes of left and right premaxillae separated by a thin lamina of
    nasal
  - Maxilla bearing 17 alveoli
  - Frontals rounded rostrally rather than forming a double notch
  - Frontals with a sculptured, median cornual process in adults that is
    variably pneumatic
  - Pronounced median fossa on the sagittal (frontoparietal) crest
  - Dentary bearing 17 alveoli, with virtually no extension caudal to the last
    alveolus and a ventral position of the lateral sulcus
  - Teeth bearing weakly developed interdenticular sulci
  - Long, falciform atlantal epipophysis
  - Vertebral centra in the cranial dorsal series with dorsoventrally elongate
    articular surfaces
  - Cranial and caudal borders of the midcervical transverse processes parallel
    in lateral view
  - Dorsal and caudal vertebral neural spines dorsally expanded, both
    transversely and craniocaudally
  - Cervical ribs pneumatized via multiple, enlarged foramina on the medial
    surface of the shaft, and accessory foramina on the cranial and caudal
    surfaces of the capitulotubercular web
appearance:
  features:
    - frontal horn
    - reduced forelimbs
  integument: scaled
  evidence: inferred
