notable_specimens:
  - specimen_id: [FMNH PR 2100]
    institution: FMNH
    species: Majungasaurus crenatissimus
    category: exceptional-preservation
    significance: "A spectacularly complete skull preserving cranial anatomy absent from the fragmentary type dentary. Its dome-shaped frontal swelling matched Majungatholus, leading to that name's recognition as a synonym, and CT scanning reconstructed its brain and inner ear."
    discovered:
      year: 1996
    references: [sampson1998a, sampson2007a]
  - specimen_id: [UA 8678]
    institution: UADBA
    species: Majungasaurus crenatissimus
    category: physiology
    significance: "A superbly preserved series of vertebrae and ribs whose pneumatic foramina let scientists reconstruct the respiratory system, implying avian-style air sacs and flow-through ventilation, with implications for the early evolution of bird respiration."
    references: [oconnor2005a]
