genus: Magnapaulia
parent: Lambeosaurini
etymology: "From Latin 'magnus' meaning 'large' and the first name of Paul G. Haaga Jr., president of the board of trustees of the Los Angeles County Museum of Natural History, honoring his support of the institution."
description: Magnapaulia is a genus of herbivorous lambeosaurine hadrosaurid
  dinosaurs known from the Late Cretaceous (Campanian) El Gallo Formation of
  Baja California, northwestern Mexico. It contains a single species,
  Magnapaulia laticaudus, which was first described in 1981 as a possible
  species of Lambeosaurus by William J. Morris, and was given its own genus in
  2012 by Prieto-Márquez and colleagues.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
diagnostic_features:
  - Longest haemal arches of proximal caudal vertebrae at least four times
    longer than the depth of their respective centra
  - Base of prezygapophyses in caudal vertebrae merging to form a bowl-shaped
    surface
  - Downturned rostroventral process of the maxilla at 18-degree angle with
    alveolar margin
  - Tear-shaped external naris with length/width ratio between 1.85 and 2.85
  - Neural spines of dorsal, sacral, and proximal caudal vertebrae at least four
    times the depth of their respective centra
