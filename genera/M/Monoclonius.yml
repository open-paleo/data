genus: Monoclonius
parent: Ceratopsidae
placement: incertae sedis
pronunciation:
  phonetic: mon-o-KLOHN-ee-us
etymology: From Greek 'monos' (single) and 'klonos' (sprout or twig); meaning
  'single sprout', likely referring to the single root of its teeth.
description: Monoclonius is an extinct dubious genus of herbivorous ceratopsian
  dinosaur found in the Late Cretaceous layers of the Judith River Formation in
  Montana, United States, and the uppermost rock layers of the Dinosaur Park
  Formation in Alberta, Canada dated to between 75 and 74.6 million years ago.
dispute:
  summary: >
    Monoclonius is a nomen dubium; Ryan (2006) reaffirmed M. crassus as
    undiagnostic and reassessed the referred M. lowei as a subadult
    centrosaurine. Although a centrosaurine, it is not
    reliably placeable below family level and is retained at Ceratopsidae
    incertae sedis.
  history:
    - date: "2026-06-26"
      note: Moved from Centrosaurinae to Ceratopsidae incertae sedis, most specimens reassigned to Centrosaurus.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Teeth with obliquely truncate face and distinct root, grooved for
    successional tooth on front
  - No external cementum layer on tooth back
  - Caudal vertebrae biconcave with narrow brim
  - Fore limbs large and massive
  - Teeth faces acuminate oval, divided by elevated keel (median above, turns to
    one side at base)
  - Tooth margin crenate with grooves extending onto back
  - Sacrum with ten vertebrae, last centrum compressed
  - Three anterior dorsal vertebrae coossified
appearance:
  integument: scaled
  evidence: inferred
