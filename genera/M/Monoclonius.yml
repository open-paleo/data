    etymology: "From Latin 'crassus' meaning 'fat' or 'thick', though the precise
      anatomical referent is unclear given the composite nature of the original
      type material."
    status: nomen dubium
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Campanian
    location:
      country: US
      locality: mouth of Birch Creek
      region: US-MT
      formation: Judith River
      part: lower
    type_specimen:
      specimen_id: [ AMNH 3998 ]
      specimen_type: holotype
      institution: AMNH
      material: Sacrum with ten vertebrae; teeth with obliquely truncate face; femur
        (22 inches); tibia (20 inches); three anterior dorsal vertebrae coossified
      completeness: fragmentary
    erected_in: cope1876a
references:
