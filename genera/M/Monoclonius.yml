  - id: sampson1997a
    notes: Declares Monoclonius crassus a nomen dubium, its type a composite of
      immature individuals lacking diagnostic adult ornamentation.
  - id: ryan2006a
    notes: Assessed the status of Monoclonius and the recognition of adult-sized taxa (conference abstract).
