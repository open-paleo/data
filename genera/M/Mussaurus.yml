genus: Mussaurus
parent: Sauropodiformes
etymology: mouse lizard
description: Mussaurus is a genus of herbivorous sauropodomorph dinosaur that
  lived in southern Argentina during the Sinemurian stage of the Early Jurassic.
  It receives its name from the small size of the skeletons of juvenile and
  infant individuals, which were once the only known specimens of the genus.
  However, since Mussaurus is now known from adult specimens, the name is
  something of a misnomer.
diet: herbivore
