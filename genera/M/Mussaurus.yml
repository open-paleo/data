genus: Mussaurus
parent: Sauropodiformes
pronunciation:
  phonetic: moo-SAWR-us
etymology: From Latin 'mus' (mouse) and Greek 'sauros' (lizard); meaning 'mouse
  lizard', named for the small size of juvenile specimens originally known.
description: Mussaurus is a genus of herbivorous sauropodomorph dinosaur that
  lived in southern Argentina during the Sinemurian stage of the Early Jurassic.
  It receives its name from the small size of the skeletons of juvenile and
  infant individuals, which were once the only known specimens of the genus.
  However, since Mussaurus is now known from adult specimens, the name is
  something of a misnomer.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - lacustrine
diagnostic_features:
  - Short and high skull with elongate frontals and parietals, very short snout
  - Antorbital fenestra short and high, placed very near the orbit
  - Long, very rounded cylindrical teeth (more elongated than in prosauropods)
  - Lower jaw with thick symphysis resembling Camarasaurus rather than
    prosauropods
  - Cervical vertebrae short and high, 7 mm dorsoventral height and 4 mm axial
    length, resembling thecodont Lagosuchus rather than prosauropods
  - Scapula long and gracile, longer than known prosauropods
  - Humerus proportionally longer relative to forelimbs than in known
    prosauropods
