genus: Moabosaurus
parent: Turiasauria
dispute:
  summary: >
    Moabosaurus was originally described as a basal titanosauriform
    (macronarian) neosauropod (Britt et al., 2017), but most subsequent
    analyses recover it within Turiasauria, closely related to Mierasaurus
    (Royo-Torres et al., 2017; Mannion et al., 2019; Zhang et al., 2026;
    Jones, 2026).
  history:
    - date: "2026-06-29"
      note: >
        Placed in Turiasauria following the prevailing recent analyses; the
        basal-titanosauriform alternative (Britt et al., 2017) is recorded.
etymology: "Named for Moab, Utah, the city near the Dalton Wells Quarry where
  the fossils were collected, combined with Greek 'sauros' meaning 'lizard'."
pronunciation:
  phonetic: mo-AB-o-SOR-us
description: Moabosaurus is a genus of turiasaurian sauropod dinosaur from the
  Early Cretaceous Cedar Mountain Formation of Utah, United States.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Anterior margin of conjoined frontals convex in dorsal view
  - Postaxial cervical vertebrae with bifid spines characterized by shallow
    notch bounded by low metapophyses
  - Neural spines of last cervical through anterior dorsal vertebrae low and
    laterally wide
  - Bifid rib blades on mid to posterior cervical vertebrae
  - First neural spine with cruciate cross-section on dorsal 4 or 5
  - Procoelous proximal and distal caudal centra with variable middle caudal
    centra morphology
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "351930"
  - source: wikidata
    id: Q6886334
  - source: eol
    id: "47459459"
species:
  - name: Moabosaurus utahensis
    etymology: "Named for Utah, the US state where the fossils were recovered near Moab."
    status: valid
    type_species: true
    period:
      name:
        - Early Cretaceous
      stage:
        - Barremian
    location:
      country: US
      locality: Dalton Wells Quarry
      region: US-UT
      formation: Cedar Mountain
      member: Yellow Cat
      part: lower
      notes: Britt and colleagues (2017) place the quarry at the base of the
        Yellow Cat Member, and Kinneer and colleagues (2016) and
        Royo-Torres and colleagues (2017) agree. Kirkland and colleagues
        (2016) instead read the fauna as belonging higher in the member,
        so the lithostratigraphic and biostratigraphic positions disagree.
    size:
      weight_kg:
        min: 6000
        max: 6000
      hip_height_m:
        min: 3
        max: 3
      length_m:
        min: 10.0
        max: 10.0
    type_specimen:
      specimen_id: [ BYU 14387 ]
      specimen_type: holotype
      institution: BYU
      material: Three closely associated dorsal vertebrae, two articulated, one
        separated by 20 cm
      completeness: fragmentary
    erected_in: britt2017a
references:
  - id: britt2017a
  - id: jones2026b
    notes: Source of the mass and hip height estimates.
  - id: mannion2019a
    notes: Assessed Moabosaurus's taxonomic affinities among putative Late Jurassic titanosaur-grade sauropods.
  - id: royo-torres2017b
    notes: Recovered Moabosaurus within Turiasauria, closely related to the new turiasaur Mierasaurus
  - id: zhang2026a
    notes: Recovered Moabosaurus within core Turiasauria in its turiasaurian phylogenetic analysis.
