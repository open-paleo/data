genus: Moabosaurus
parent: Turiasauria
etymology: "Named for Moab, Utah, the city near the Dalton Wells Quarry where
  the fossils were collected, combined with Greek 'sauros' meaning 'lizard'."
pronunciation:
  phonetic: mo-AB-o-SOR-us
description: Moabosaurus is a genus of turiasaurian sauropod dinosaur from the
  Early Cretaceous Cedar Mountain Formation of Utah, United States.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Anterior margin of conjoined frontals convex in dorsal view
  - Postaxial cervical vertebrae with bifid spines characterized by shallow
    notch bounded by low metapophyses
  - Neural spines of last cervical through anterior dorsal vertebrae low and
    laterally wide
  - Bifid rib blades on mid to posterior cervical vertebrae
  - First neural spine with cruciate cross-section on dorsal 4 or 5
  - Procoelous proximal and distal caudal centra with variable middle caudal
    centra morphology
appearance:
  integument: scaled
  evidence: inferred
