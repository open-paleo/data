genus: Maleriraptor
parent: Herrerasauria
dispute:
  summary: >
    Maleriraptor kuttyi is recovered as a non-herrerasaurid herrerasaurian
    outside Herrerasauridae (Ezcurra and others, 2025); Jones (2026) instead
    classifies it within Herrerasauridae.
  history:
    - date: "2026-06-30"
      note: >
        Placed at Herrerasauria following the describing analysis (P1).
etymology: From the Upper Maleri Formation, where the holotype was collected,
  and Latin 'raptor' (thief, robber); meaning 'Maleri thief'.
pronunciation:
  phonetic: muh-LEH-ree-RAP-tuh
description: Maleriraptor is an extinct genus of early-diverging herrerasaurian
  saurischian dinosaur from the early Norian (Late Triassic) Upper Maleri
  Formation of the Pranhita-Godavari Valley, Telangana, south-central India.
  The single species, Maleriraptor kuttyi, is known from a partial pelvis and
  associated sacral and caudal vertebrae (ISIR 282), originally described by
  Novas et al. (2010) as indeterminate Dinosauriformes; Ezcurra et al. (2025)
  re-evaluated the material and recovered it as a herrerasaurian outside the
  South American Herrerasauridae, filling a stratigraphic gap between Carnian
  South American herrerasaurids and middle-Norian-to-Rhaetian North American
  herrerasaurs.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Centrum posterior to the second primordial sacral vertebra longer than each
    of the primordial sacral centra.
  - Ilium with a postacetabular process shorter than 0.6 times the length
    between the pubic and ischial peduncles.
  - Ilium lacking a brevis fossa.
  - Lateral rugosity of the iliac postacetabular process restricted to its
    posteriormost tip (autapomorphy).
  - Pubis with a ventrally directed shaft.
  - Pubis with a very poorly developed distal anteroposterior expansion.
