genus: Macrurosaurus
parent: Titanosauriformes
etymology: From Greek makros (large) and oura (tail); meaning "large-tailed lizard"
description: Macrurosaurus is the name given to a genus of dinosaur from the
  Early Cretaceous. It was a titanosauriform which lived in what is now England.
  The type species, M. semnus, was named in 1876. A second species, M. platypus,
  may also exist.
