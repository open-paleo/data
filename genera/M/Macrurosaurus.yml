genus: Macrurosaurus
parent: Titanosauriformes
pronunciation:
  phonetic: ma-KROOR-o-SAWR-us
etymology: From Greek makros (large) and oura (tail); meaning "large-tailed lizard"
description: Macrurosaurus is the name given to a genus of dinosaur from the
  Early Cretaceous. It was a titanosauriform which lived in what is now England.
  The type species, M. semnus, was named in 1876. A second species, M. platypus,
  may also exist.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - marine
diagnostic_features:
  - Procoelous caudal vertebrae uniquely combined with absence of chevron bones
    in large animal
  - Vertebral articulation transitions from procoelous anteriorly to biconcave
    posteriorly
  - Neural arch supported on pedicles rising from centrum, depressed with no
    neural spine
  - Centrum becomes elongated and rounded in dice-box form, converging toward
    crocodilian pattern
  - Basal keel well-rounded with median ridge on ventral surface of centrum
