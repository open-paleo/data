genus: Microcoelus
parent: Titanosauria
pronunciation:
  phonetic: MY-kro-SEE-lus
etymology: From Greek 'mikros' (small) and 'koilos' (hollow); meaning
  'small hollow', a reference to the shallow lateral pit on the
  holotype dorsal vertebra.
description: >
  Microcoelus is a dubious genus of small titanosaurian sauropod
  dinosaur from the Late Cretaceous (Santonian stage) Bajo de la
  Carpa Formation, Argentina. It is known from only a single dorsal
  vertebra, although a left humerus was formerly referred to this
  taxon, but it is now considered to belong to Neuquensaurus. The
  type (and only known) species is M. patagonicus, described by
  British paleontologist Richard Lydekker in 1893.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Anterior dorsal vertebrae opisthocoeolous with well-marked rib-facets on
    fore part of arch lamina
  - Lateral pits (shallow, somewhat circular depressions) on dorsal vertebrae,
    apparently without communication with interior of bone
  - Caudal vertebrae amphicoelous (or platycoeolous), differing from procoeolous
    caudals of Titanosaurus and Argyrosaurus
  - Humerus short and broadly expanded, with large swollen deltoid crest
    extending lower on shaft than in Titanosaurus australis or Argyrosaurus
  - Zygapophyses of caudal vertebrae very slightly developed and scarcely
    articulated with one another
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "38707"
  - source: wikidata
    id: Q13851602
  - source: gbif
    id: "4822775"
synonyms:
  - name: Microsaurops
    type: junior objective
    reason: Replacement name proposed by Kuhn (1963) under the
      mistaken belief that the original Microcoelus Lydekker, 1893
      had been preoccupied. The supposed preoccupier "Microsaurus"
      (cited from Hatcher 1900; Lull 1910) was itself only a
      misspelling of Microcoelus, so the replacement was
      unnecessary. Listed by Olshevsky (1991).
species:
  - name: Microcoelus patagonicus
    etymology: From Patagonia, the region of Argentina where the
      type material was collected.
    status: nomen dubium
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Santonian
    location:
      country: AR
      region: AR-Q
      formation: Bajo de la Carpa
      coordinates:
        - -38.950001
        - -68.23333
    type_specimen:
      specimen_type: holotype
      status: unknown
      institution: MLP
      material: An anterior dorsal vertebra. Lydekker provisionally associated a left
        humerus and the posterior half of a caudal vertebra from the same locality; the
        humerus is now considered to belong to Neuquensaurus.
      completeness: fragmentary
    erected_in: lydekker1893a
references:
  - id: lydekker1893a
    notes: Original description of Microcoelus patagonicus from an anterior
      dorsal vertebra from Neuquén, alongside Lydekker's other new Patagonian
      titanosaurs (Argyrosaurus, Titanosaurus australis, T. nanus).
  - id: olshevsky1991a
    notes: Treats Microcoelus as nomen dubium and records Microsaurops Kuhn,
      1963 as a junior objective synonym based on the spurious "Microsaurus"
      misspelling.
