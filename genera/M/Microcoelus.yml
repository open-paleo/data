synonyms:
  - name: Microsaurops
    type: junior objective
    reason: Replacement name proposed by Kuhn (1963) under the
      mistaken belief that the original Microcoelus Lydekker, 1893
      had been preoccupied. The supposed preoccupier "Microsaurus"
      (cited from Hatcher 1900; Lull 1910) was itself only a
      misspelling of Microcoelus, so the replacement was
      unnecessary. Listed by Olshevsky (1991).
