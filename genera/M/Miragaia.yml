  - id: sánchez-fenollosa2025a
    notes: Follows the synonymy with Dacentrurus armatus, coding D. armatus
      partly from Miragaia material; recovers D. armatus in Dacentrurinae with
      Alcovasaurus, Kentrosaurus, Thyreosaurus and Adratiklit.
  - id: cobos2010a
    notes: Suggests from the Teruel stegosaur material that Dacentrurus and
      Miragaia are synonymous.
  - id: raven2017a
    notes: Recovers Miragaia as sister to Hesperosaurus and re-erects the genus.
  - id: costa2019a
    notes: Describes a second specimen and concludes that Miragaia longicollum
      is valid and distinct from Dacentrurus armatus, within Dacentrurinae.
  - id: raven2023a
    notes: In its preferred analysis recovers Miragaia as sister to Adratiklit,
      closer to Stegosaurus than to Dacentrurus.
  - id: sánchez-fenollosa2024a
    notes: Proposes Miragaia longicollum as a subjective junior synonym of
      Dacentrurus armatus.
  - id: costa2026a
    notes: Refers caudal spines from the Cleveland-Lloyd Quarry, Utah, to
      Miragaia sp. and a cervical plate to cf. Miragaia longicollum.
