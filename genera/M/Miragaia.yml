genus: Miragaia
parent: Stegosauridae
etymology: Named for the village of Miragaia, in Lourinhã, Portugal, and the
  geological unit of the same name. The stem can also be read as Latin mira,
  wonderful, and Gaia, the Greek goddess of the Earth.
pronunciation:
  phonetic: MEE-ruh-GAH-yuh
description: Miragaia is a genus of long-necked stegosaurid dinosaur. Its
  fossils have been found in Upper Jurassic rocks in Portugal (Lourinhã
  Formation, Sobral Unit) and possibly also Wyoming and Utah, United States
  (Morrison Formation), from which Costa (2026) refers isolated caudal spines
  and a cervical plate to Miragaia. Miragaia has the longest neck known for any
  stegosaurian, which included at least seventeen vertebrae. Some researchers
  consider this taxon to be a junior synonym of Dacentrurus.
dispute:
  summary: >
    The validity of Miragaia is contested. It was erected as a long-necked
    dacentrurine (Mateus and colleagues, 2009). Raven and Maidment (2017)
    re-erected the genus, and Costa and Mateus (2019) concluded from a second,
    more complete specimen that it is valid and distinct from Dacentrurus
    armatus. Sánchez-Fenollosa, Escaso and Cobos (2025) proposed it as a
    subjective junior synonym of D. armatus, following a suggestion by Cobos
    and colleagues (2010). Its position is disputed too: Mateus and colleagues
    (2009) and Costa and Mateus (2019) placed it in Dacentrurinae as sister to
    Dacentrurus, and the synonymy would also put it there, while Raven and
    Maidment (2017) recovered it as sister to Hesperosaurus, and Raven and
    colleagues (2023) as sister to Adratiklit, closer to Stegosaurus than to
    Dacentrurus in both cases. It is placed at Stegosauridae, the nearest clade
    all of these accept.
  history:
    - date: "2026-06-26"
      note: Placed at Dacentrurinae, whether a valid dacentrurine or a junior synonym of Dacentrurus.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - At least 17 cervical vertebrae, eight more than basal ornithischians and
    most other stegosaurs
  - Mid-cervical neural spines with notch at base and anterior projection dorsal
    to it
  - Mid and posterior cervical and anterior dorsal neural spines with
    transversely expanded apices
  - Paired, slightly outwardly convex, triangular cervical dermal plates with
    notch and projection on anterodorsal margin
  - Anterior tip of premaxilla drawn into a point
  - Anterolateral rim of premaxilla projects ventrally
appearance:
  features:
    - elongate neck
    - dermal plates
    - tail spikes
  integument: armored
  evidence: direct
