genus: Miragaia
parent: Dacentrurinae
description: Miragaia is a genus of long-necked stegosaurid dinosaur. Its
  fossils have been found in Upper Jurassic rocks in Portugal (Lourinhã
  Formation, Sobral Unit) and possibly also Wyoming and Utah, United States
  (Morrison Formation). Miragaia has the longest neck known for any
  stegosaurian, which included at least seventeen vertebrae. Some researchers
  consider this taxon to be a junior synonym of Dacentrurus.
diet: herbivore
locomotion: quadrupedal
