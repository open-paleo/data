genus: Maiasaura
parent: Brachylophosaurini
pronunciation:
  phonetic: MAY-ya-SAWR-a
etymology: From Greek 'maia' (good mother) and 'saura' (the feminine form of sauros, lizard); meaning 'good mother lizard' or 'good mother reptile', referring to evidence of parental care
description: Maiasaura is a large herbivorous saurolophine hadrosaurid
  ("duck-billed") dinosaur genus that lived in the area currently covered by the
  state of Montana and the Canadian province of Alberta, in the Upper Cretaceous
  (mid to late Campanian), from 86.3 to 70.6 million years ago. Maiasaura is the
  state fossil of Montana.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
diagnostic_features:
  - Wide elongate facial region
  - Short naris located on anterior end of snout with extensive lateral facial
    region
  - Short wide premaxillary bill with deflected border similar to lambeosaurs
  - Small solid incipient crest above and between orbits, formed by nasal and
    frontal bones
  - Nasals concave anterior to incipient crest
  - Dentary teeth with long and narrow enamel crown
  - Predentary wide and very shallow with round, evenly spaced, denticulate
    processes
