genus: Microraptor
parent: Microraptorinae
pronunciation:
  phonetic: MIE-kro-RAP-tor
etymology: From Greek 'mikros' (small) and Latin 'raptor' (one who seizes);
  meaning 'small thief' or 'small raptor'
description: Microraptor is a genus of small, four-winged dromaeosaurid
  dinosaurs. Numerous well-preserved fossil specimens have been recovered from
  Liaoning, China. They date from the early Cretaceous Jiufotang Formation
  (Aptian stage), 125 to 120 million years ago. Three species have been named
  (M. zhaoianus, M. gui, and M. hanqingi), though further study has suggested
  that all of them represent variation in a single species, which is properly
  called M. zhaoianus. Cryptovolans, initially described as another four-winged
  dinosaur, is usually considered to be a synonym of Microraptor.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
diagnostic_features:
  - Anterior serrations absent on all teeth
  - Posterior teeth have basal constriction between crown and root
  - Middle caudal vertebrae about 3-4 times as long as anterior dorsal vertebrae
  - Accessory crest of femur at the base of the lesser trochanter
  - Tail with less than 26 vertebrae
  - Strongly recurved and slender pedal unguals with prominent flexor tubercle
appearance:
  features:
    - feathered wings
    - hindlimb feathers
    - feathered tail
  integument: feathered
  evidence: direct
