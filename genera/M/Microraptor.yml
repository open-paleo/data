notable_specimens:
  - specimen_id: [BMNHC PH881]
    institution: BMNHC
    category: exceptional-preservation
    significance: "Specimen whose fossilized melanosomes revealed probable glossy iridescent black plumage. It also showed a bifurcated tailfan with a pair of long narrow central feathers and no nuchal crest, indicating the crest inferred from the holotype was a taphonomic artifact."
    references: [li2012a]
  - specimen_id: [IVPP V17972]
    institution: IVPP
    category: gut-contents
    significance: "Preserves the remains of an enantiornithine bird within its rib cage, direct evidence that Microraptor preyed on birds and likely foraged in the trees."
    references: [oconnor2011a]
  - specimen_id: [QM V1002]
    institution: QM-CN
    category: gut-contents
    significance: "Preserves fish scales in its abdominal cavity, evidence that Microraptor also hunted fish. Combined with anterodorsally inclined front teeth often associated with piscivory, it indicates Microraptor was an opportunistic feeder in both arboreal and aquatic habitats."
    references: [xing2013b]
  - specimen_id: [STM5-32]
    institution: STM
    category: gut-contents
    significance: "Preserves a complete lizard, the new genus Indrasaurus, swallowed head-first in its stomach as in modern carnivorous birds and lizards. The lizard bones lack pitting and scarring, showing the Microraptor died shortly after eating, before significant digestion."
    references: [zhou2019a]
