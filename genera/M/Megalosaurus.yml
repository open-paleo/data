genus: Megalosaurus
parent: Megalosaurinae
pronunciation:
  phonetic: MEG-a-lo-SAWR-us
etymology: From Greek 'megas' (big, tall, or great) and 'sauros' (lizard); meaning 'great lizard'.
description: Megalosaurus is an extinct genus of large carnivorous theropod
  dinosaurs of the Middle Jurassic Epoch (Bathonian stage, 166 million years
  ago) of southern England. Although fossils from other areas have been assigned
  to the genus, the only certain remains of Megalosaurus come from Oxfordshire
  and date to the late Middle Jurassic.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - coastal
  - marine
diagnostic_features:
  - Dentary with 13-14 teeth, an unexpanded third alveolus, and a straight
    dorsal profile with an unexpanded symphysial area
  - Lateral row of dentary neurovascular foramina housed in a shallow
    longitudinal groove; interdental plates tall and unfused; two Meckelian
    foramina; Meckelian groove shallow
  - Ventral surfaces of the first and third to fifth sacral centra evenly
    rounded, with a longitudinal angular ridge on the ventral surface of the
    second sacral centrum
  - Dorsally directed flange around midheight of the scapular blade
  - Array of posterodorsally inclined grooves on the lateral surface of the
    median iliac ridge; anteroposteriorly thick ischial apron with an almost
    flat medial surface and a prominent, rugose distal ischial tubercle
  - Complementary groove-and-ridge structures on the articular surfaces between
    metatarsals II and III
appearance:
  integument: scaled
  evidence: inferred
