genus: Megalosaurus
parent: Megalosaurinae
pronunciation:
  phonetic: MEG-a-lo-SAWR-us
etymology: From Greek 'megas' (big, tall, or great) and 'sauros' (lizard); meaning 'great lizard'.
description: Megalosaurus is an extinct genus of large carnivorous theropod
  dinosaurs of the Middle Jurassic Epoch (Bathonian stage, 166 million years
  ago) of southern England. Although fossils from other areas have been assigned
  to the genus, the only certain remains of Megalosaurus come from Oxfordshire
  and date to the late Middle Jurassic.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - coastal
  - marine
diagnostic_features:
  - Dentary with 13-14 teeth, an unexpanded third alveolus, and a straight
    dorsal profile with an unexpanded symphysial area
  - Lateral row of dentary neurovascular foramina housed in a shallow
    longitudinal groove; interdental plates tall and unfused; two Meckelian
    foramina; Meckelian groove shallow
  - Ventral surfaces of the first and third to fifth sacral centra evenly
    rounded, with a longitudinal angular ridge on the ventral surface of the
    second sacral centrum
  - Dorsally directed flange around midheight of the scapular blade
  - Array of posterodorsally inclined grooves on the lateral surface of the
    median iliac ridge; anteroposteriorly thick ischial apron with an almost
    flat medial surface and a prominent, rugose distal ischial tubercle
  - Complementary groove-and-ridge structures on the articular surfaces between
    metatarsals II and III
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "38583"
  - source: wikidata
    id: Q131056
  - source: gbif
    id: "4822664"
  - source: eol
    id: "47345807"
synonyms:
  - name: Scrotum
    type: nomen oblitum
    reason: Brookes (1763) figured the distal end of a femur under this name.
      Olshevsky (1991) records it as a nomen oblitum, the name having gone
      unused far beyond the interval that would allow it to displace
      Megalosaurus, and later listings treat the material as an indeterminate
      theropod femur.
species:
  - name: Megalosaurus bucklandii
    etymology: "Named for William Buckland, the English geologist and theologian who first scientifically described the genus in 1824."
    status: valid
    type_species: true
    period:
      name:
        - Middle Jurassic
      stage:
        - Bathonian
    location:
      country: GB
      locality: Stonesfield
      region: GB-OXF
      formation: Taynton Limestone
    size:
      length_m:
        min: 6.0
        max: 6.0
      weight_kg:
        min: 700
        max: 700
    erected_in: mantell1827a
    described_in: benson2010c
    type_specimen:
      specimen_id: [OUM J13505]
      specimen_type: lectotype
      institution: OUM
      material: Almost complete right dentary.
      completeness: fragmentary
references:
  - id: olshevsky1991a
    notes: Records Scrotum as a nomen oblitum.
  - id: buckland1824a
    notes: First valid naming of any non-avian dinosaur genus; based on material
      from Stonesfield, Oxfordshire.
  - id: mantell1827a
    notes: First publication of the type-species binomial Megalosaurus
      bucklandii, honoring Buckland.
  - id: meyer1832a
    notes: In German. On p. 110, Meyer introduces the variant spelling
      Megalosaurus bucklandi (sometimes erroneously ascribed to von Ritgen); the
      original Mantell (1827) spelling bucklandii has priority.
  - id: molnar1990a
    notes: Chapter in Weishampel, Dodson and Osmólska (eds.), first edition of
      The Dinosauria; designates OUM J13505 as the lectotype of Megalosaurus
      bucklandii.
  - id: benson2010c
    notes: Comprehensive redescription and autapomorphy-based diagnosis of
      Megalosaurus bucklandii, restricting the taxon to the Bathonian of
      Britain; includes a phylogenetic analysis of basal tetanurans.
