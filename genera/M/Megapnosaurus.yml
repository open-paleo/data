genus: Megapnosaurus
parent: Coelophysidae
pronunciation:
  phonetic: meg-AP-no-SAWR-us
etymology: big dead lizard
description: Megapnosaurus is an extinct genus of coelophysid theropod dinosaur
  that lived approximately 188 million years ago during the early part of the
  Jurassic Period in what is now Africa. The species was a small to
  medium-sized, lightly built, ground-dwelling, bipedal carnivore, that could
  grow up to 2.2 m (7.2 ft) long and weigh up to 13 kg (29 lb).
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - arid
diagnostic_features:
  - Extensive fusion in the tarsal region, with the astragalocalcaneum fused
    to the tibia and bearing an atypical ascending process
  - Distal tarsals fused to the metatarsals, except for a free distal tarsal 4
  - Fibula free but closely apposed to the tibia and astragalocalcaneum;
    calcaneum lacking a tuber
  - Long metatarsals (metatarsal III about 60% of femoral length); pes
    functionally tridactyl (digits II–IV), with digit I highly reduced and
    digit V a splint-like metatarsal
  - Manus large and functionally tridactyl (digits I–III) with recurved
    raptorial claws; manual digit IV reduced to a metacarpal and a single
    vestigial phalanx
  - Femur with a sharply inturned head and a distinct neck
  - Dolichoiliac pelvis, the iliac blade flared posteriorly into a wide,
    shallow shelf
