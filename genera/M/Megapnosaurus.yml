genus: Megapnosaurus
parent: Coelophysidae
etymology: big dead lizard
description: Megapnosaurus is an extinct genus of coelophysid theropod dinosaur
  that lived approximately 188 million years ago during the early part of the
  Jurassic Period in what is now Africa. The species was a small to
  medium-sized, lightly built, ground-dwelling, bipedal carnivore, that could
  grow up to 2.2 m (7.2 ft) long and weigh up to 13 kg (29 lb).
diet: carnivore
