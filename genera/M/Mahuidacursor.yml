genus: Mahuidacursor
parent: Elasmaria
etymology: "From Mapudungun 'mahuida' meaning 'mountain' and Latin 'cursor' meaning 'runner'; translates as 'mountain runner'."
description: Mahuidacursor is a genus of basal ornithopod dinosaur from the
  Santonian Bajo de la Carpa Formation of the Neuquén Basin in northern
  Patagonia, Argentina. The type and only species is M. lipanglef.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - arid
diagnostic_features:
  - Dorsal ribs not distally thickened, bearing articulation surface restricted
    to anterolateral margin
  - First dorsal vertebra with rectangular dorsal neural spine
  - First and second dorsal centra as long as last cervical centrum
  - Dorsal centra relatively long, increasing moderately in length throughout
    sequence
  - Posterior process of coracoid scarcely developed
  - Humerus length subequal to scapular length
  - Long and slender scapula with posterior end narrower than proximal end
  - Poorly developed humeral head
  - Rudimentary deltopectoral crest
  - Humeral shaft strongly bowed
