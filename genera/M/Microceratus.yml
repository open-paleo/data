genus: Microceratus
parent: Neoceratopsia
etymology: From Greek 'mikros' (small) and 'keras' (horn); meaning 'small-horned'.
description: Microceratus is a genus of small ceratopsian dinosaur that lived in
  the Cretaceous period of Mongolia. It walked on two legs, had short front
  arms, a characteristic ceratopsian frill and beak-like mouth, and was around
  60 cm (2.0 ft) long. It was one of the most primitive ceratopsians, or horned
  dinosaurs, along with Psittacosaurus, which was also discovered in Mongolia.
dispute:
  summary: >
    Microceratus gobiensis is a replacement name for the preoccupied
    Microceratops; most referred material has been reassigned to
    Graciliceratops, leaving a poorly diagnosable basal neoceratopsian
    widely treated as a nomen dubium.
  history:
    - date: "2026-06-27"
      note: Placed at Neoceratopsia (basal); nomen dubium.
diet: herbivore
locomotion: bipedal
diagnostic_features:
  - Atlas not reduced as in Leptoceratops/Protoceratops; instead enlarged,
    carrying at least 2/3 of bowl-shaped articular surface for occipital condyle
  - "Lower jaw: last tooth cuts gums at base of ascending ramus, with no groove
    separating tooth row from ascending ramus (unlike Protoceratops)"
  - "Lower jaw: outer ridge runs in middle and swells to a convexity reaching
    the lower border of the dentary (vs. higher up with concavity below in
    Protoceratops andrewsi)"
  - "Lower jaw: anterior end twisted inwards in inferior view (vs. straight in
    Protoceratops andrewsi)"
  - Femoral head with broad vertical groove posteriorly giving semilunar outline
    in superior view; absent in ?Psittacosaurus
