genus: Microceratus
parent: Ceratopsia
etymology: From Greek 'mikros' (small) and 'keras' (horn); meaning 'small-horned'.
description: Microceratus is a genus of small ceratopsian dinosaur that lived in
  the Cretaceous period of Mongolia. It walked on two legs, had short front
  arms, a characteristic ceratopsian frill and beak-like mouth, and was around
  60 cm (2.0 ft) long. It was one of the most primitive ceratopsians, or horned
  dinosaurs, along with Psittacosaurus, which was also discovered in Mongolia.
diet: herbivore
locomotion: bipedal
