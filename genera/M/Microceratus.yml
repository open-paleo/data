    type: preoccupied
    reason: Name preoccupied by Microceratops (Hymenoptera).
species:
  - name: Microceratus gobiensis
    etymology: "Named for the Gobi Desert of Mongolia, where the holotype was discovered."
    status: nomen dubium
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Santonian
        - Campanian
    size:
      length_m:
        min: 0.6
        max: 0.6
    location:
      country: CN
      locality: Tsondolein-khuduk
      region: CN-NM
      formation: Ulansuhai
      part: lower
      notes: >
        Evans and colleagues (2021) find it "likely that fossils from
        Tsondolien-Khuduk are from the lower part of the Ulansuhai Formation
        and below the Bayan Mandahu fossil horizon", consistent with the
        suggestion that the assemblage, on "Microceratops" (=Microceratus), is
        "similar in age to either Baynshirenian or Barungoyotian (i.e.,
        Santonian–Campanian)", "or perhaps older". The formation itself runs
        no later than the Campanian.
    type_specimen:
      specimen_type: holotype
      status: lost
      material: Fragmentary dentary.
      completeness: fragmentary
      notes: Bohlin's field designation "T. sh. V."; uncatalogued and
        functionally lost.
    erected_in: mateus2008a
pronunciation:
  phonetic: mike-row-ker-ah-tuss
references:
  - id: bohlin1953a
    notes: Original description of the species as Microceratops gobiensis; the
      genus name Microceratops was preoccupied by an ichneumon wasp and was
      replaced with Microceratus by Mateus (2008).
  - id: mateus2008a
  - id: evans2021a
    notes: Places the type locality north of the Yellow River in Nei Mongol,
      refuting the Minhe Formation attribution, and assigns its red sediments
      to the lower Ulansuhai Formation.
  - id: sereno2000a
    notes: Regards Microceratops gobiensis as a nomen dubium for lack of
      diagnostic features in the holotype, and rejects the referral of the
      Shireegiin Gashuun skeleton to it.
  - id: makovicky2006a
    notes: Follows Sereno (2000) in treating Microceratops as a nomen dubium,
      separate from Graciliceratops.
