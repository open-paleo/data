genus: Mapusaurus
parent: Carcharodontosauridae
description: Mapusaurus is a genus of giant carcharodontosaurid carnosaurian
  dinosaur that lived in Argentina during the Cenomanian–Turonian ages of the
  Late Cretaceous. It is known from a bonebed of between seven and nine
  specimens, excavated from the strata of the Huincul Formation between 1997 and
  2001 as part of the Argentinian-Canadian Dinosaur Project. In 2006, Rodolfo
  Coria and Philip J. Currie scientifically described Mapusaurus. Only one
  species of Mapusaurus, M. roseae, has been described, named after the
  rose-colored rocks in which it was discovered and sponsor Rose Letwin.
diet: carnivore
locomotion: bipedal
