    holotype:
      specimen_id: [ BP/1/4934 ]
      specimen_type: neotype
      institution: BP
      material: Partially complete, articulated skeleton including an almost
        complete skull, but lacking most of the hind limbs and tail; an adult
        individual.
      completeness: partial
      notes: The original syntype series (five cervical vertebrae) was destroyed
        in the 19 May 1941 bombing of the Hunterian Museum of the Royal College
        of Surgeons, London, leaving only casts and illustrations. As casts
        cannot serve as types, Yates and Barrett (2010) formally designated
        BP/1/4934 as the neotype under ICZN Article 75, following earlier
        suggestions by Sues et al. (2004) and Barrett (2009).
    erected_in: owen1854a
