synonyms:
  - name: Pachyspondylus
    type: junior subjective
    reason: Original material was destroyed in a 1941 bombing, preventing definitive
      analysis; today generally treated as referable to Massospondylus.
  - name: Leptospondylus
    type: junior subjective
    reason: Historically grouped with Pachyspondylus; both are now considered
      referable to Massospondylus.
  - name: Aetonyx
    type: junior subjective
    reason: Barrett and others (2019) record Aetonyx palustris as a junior
      synonym of Massospondylus carinatus, following Cooper (1981); a minority
      view instead holds it undiagnostic.
  - name: Aristosaurus
    type: possible subjective
    reason: Barrett and others (2019) present Aristosaurus erectus as either a junior
      subjective synonym of Massospondylus carinatus, following Cooper (1981),
      or an undiagnostic sauropodomorph, following Galton (1990) and Galton and
      Upchurch (2004), without choosing between them.
  - name: Dromicosaurus
    type: possible subjective
    reason: Barrett and others (2019) present Dromicosaurus gracilis as either a junior
      subjective synonym of Massospondylus carinatus, following Cooper (1981),
      or an undiagnostic sauropodomorph, following Galton (1990) and Galton and
      Upchurch (2004), without choosing between them.
  - name: Hortalotarsus
    type: possible subjective
    reason: Barrett and others (2019) present Hortalotarsus skirtopodus as either a junior
      subjective synonym of Massospondylus carinatus, following Cooper (1981),
      or an undiagnostic sauropodomorph, following Galton (1990) and Galton and
      Upchurch (2004), without choosing between them.
species:
  - name: Massospondylus carinatus
    etymology: From Latin 'carinatus' meaning 'keeled', referring to the keeled
      vertebrae that characterize this sauropodomorph.
    status: valid
    type_species: true
    period:
      name:
        - Early Jurassic
      stage:
        - Hettangian
        - Sinemurian
    location:
      country: ZA
      locality: Bornmansdrift Farm 133, Clocolan District
      region: ZA-FS
      formation: Elliot
      coordinates:
        - -28.962739
        - 27.430377
    size:
      hip_height_m:
        min: 1.2
        max: 1.2
      length_m:
        min: 4
        max: 6
      weight_kg:
        min: 137
        max: 195
    type_specimen:
      specimen_id:
        - BP/1/4934
      specimen_type: neotype
      institution: BP
      material: Partially complete, articulated skeleton including an almost complete
        skull, but lacking most of the hind limbs and tail; an adult individual.
      completeness: partial
      notes: The original syntype series (five cervical vertebrae) was destroyed in
        the 19 May 1941 bombing of the Hunterian Museum of the Royal College of
        Surgeons, London, leaving only casts and illustrations. As casts cannot
        serve as types, Yates and Barrett (2010) formally designated BP/1/4934
        as the neotype under ICZN Article 75, following earlier suggestions by
        Sues et al. (2004) and Barrett (2009).
    synonyms:
      - name: Gyposaurus capensis
        type: junior subjective
        reason: Erected by Broom (1911) on SAM-PK-K990, a partial skeleton
          lacking the skull, from near Ladybrand, South Africa. Barrett and
          others (2019) record it as a junior subjective synonym of
          Massospondylus carinatus following Cooper (1981) and Galton (1990); a
          minority view instead holds it undiagnostic.
    erected_in: owen1854a
    described_in: barrett2019a
  - name: Massospondylus kaalae
    etymology: After Sheena Kaal, Karoo vertebrate collections manager at the
      Iziko South African Museum, in recognition of her assistance to
      researchers.
    status: valid
    type_species: false
    period:
      name:
        - Early Jurassic
      stage:
        - Hettangian
        - Sinemurian
    location:
      country: ZA
      region: ZA-EC
      formation: Elliot
      part: upper
      locality: Near Voyizane, Herschel District
      coordinates:
        - -30.567
        - 27.433
    type_specimen:
      specimen_id:
        - SAM-PK-K1325
      specimen_type: holotype
      institution: SAM
      material: "Incomplete, partially disarticulated skull: paired premaxillae,
        maxillae, lacrimals, jugals, pterygoids, frontals, and parietals;
        partial left nasal, left prefrontal, and right palatine; partial
        braincase; right dentary; a prearticular; an almost complete left
        mandible; teeth; indeterminate fragments"
    diagnostic_features:
      - Premaxilla forming more than 30% of the upper tooth row.
      - Dorsolateral ridge on the lacrimal more prominent than in M. carinatus.
      - Cultriform process of the parabasisphenoid positioned ventral to the
        level of the basioccipital condyle (at the same level, or only slightly
        deflected, in M. carinatus).
      - Basipterygoid processes slender, elongate, and unexpanded distally
        (bulbous and expanded in both directions in M. carinatus).
    erected_in: barrett2009b
notable_specimens:
  - nickname: Mafeteng hatchling
    specimen_id:
      - SAM-PK-K413
    institution: SAM
    species: Massospondylus carinatus
    category: ontogeny
    significance: Hatchling skeleton from Mafeteng, Lesotho, at first misidentified
      as the varanopid Heleosaurus. It is central to the debate over a
      juvenile-to-adult postural shift; analysis found this hatchling to be
      bipedal, suggesting Massospondylus was bipedal at all ages.
    discovered:
      year: 1961
      by: British-South African palaeontological expedition
    references:
      - mooney2025a
  - specimen_id:
      - BP-1-5241
    institution: BP
    species: Massospondylus carinatus
    category: complementary
    significance: Preserves well-developed clavicles joined in a furcula-like
      arrangement that clasped the right and left shoulder blades. The specimen
      indicates clavicle reduction is limited to the line leading to
      ceratopsians and that the furcula of birds is derived from clavicles.
    references:
      - yates2005b
references:
  - id: owen1854a
  - id: yates2010a
    notes: Formally designates BP/1/4934 as the neotype of Massospondylus carinatus
      under ICZN Article 75, the original syntype series having been destroyed
      in 1941.
  - id: chapelle2018a
    notes: CT-based revised cranial description; proposes cranial autapomorphies
      (basipterygoid processes diverging less than 60°) and rejects the earlier
      Sues et al. (2004) cranial diagnosis.
  - id: barrett2019a
    notes: First full postcranial description of the neotype BP/1/4934 and an
      emended diagnosis of the species; confirms by osteohistology that the
      neotype is an adult.
  - id: jones2026b
    notes: Source of the hip height estimate, and the appearance features.
  - id: mooney2025a
  - id: yates2005b
  - id: sues2004a
    notes: Redescribed the skull of Massospondylus carinatus.
  - id: barrett2009b
    notes: Erects Massospondylus kaalae on skull SAM-PK-K1325 from the Upper
      Elliot Formation of South Africa.
