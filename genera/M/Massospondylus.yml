notable_specimens:
  - nickname: Mafeteng hatchling
    specimen_id: [SAM-PK-K413]
    institution: SAM
    species: Massospondylus carinatus
    category: ontogeny
    significance: "Hatchling skeleton from Mafeteng, Lesotho, at first misidentified as the varanopid Heleosaurus. It is central to the debate over a juvenile-to-adult postural shift; analysis found this hatchling to be bipedal, suggesting Massospondylus was bipedal at all ages."
    discovered:
      year: 1961
      by: "British-South African palaeontological expedition"
    references: [mooney2025]
  - specimen_id: [BP-1-5241]
    institution: BP
    species: Massospondylus carinatus
    category: complementary
    significance: "Preserves well-developed clavicles joined in a furcula-like arrangement that clasped the right and left shoulder blades. The specimen indicates clavicle reduction is limited to the line leading to ceratopsians and that the furcula of birds is derived from clavicles."
    references: [yates2005b]
