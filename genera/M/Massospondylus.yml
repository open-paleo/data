genus: Massospondylus
parent: Massospondylidae
pronunciation:
  ipa: /ˌmæsoʊˈspɒndɪləs/
  phonetic: MASS-oh-SPON-di-lus
etymology: "From Greek 'massos' meaning 'longer' and 'spondylos' meaning
  'vertebra', referring to what Richard Owen identified as elongated tail
  vertebrae."
description: Massospondylus is a genus of sauropodomorph dinosaur from the Early
  Jurassic of southern Africa. It was described by Richard Owen in 1854 from
  remains discovered in South Africa, and is thus one of the first dinosaurs to
  have been named. The name Massospondylus means 'longer vertebra', alluding to
  what Owen identified as tail vertebrae; these vertebrae are now known to be
  from the neck. Although the original fossils were destroyed in London during
  The Blitz, a plethora of specimens have since been assigned to the genus,
  making it one of the best-known sauropodomorphs from the Early Jurassic. The
  genus lived during the Hettangian, Sinemurian, and Pliensbachian ages, which
  lasted from ca. 201 to 184 million years ago. Most fossils come from the upper
  Elliot and Clarens formations of South Africa and Lesotho, but the genus is
  also found in the Forest Sandstone and the Mpandi Formation of Zimbabwe.
  Material from the US, India, and Argentina was previously assigned to the
  genus, but the US and Argentinian specimens are now assigned to their own
  genera (Sarahsaurus and Adeopapposaurus). Because of their great abundance,
  Massospondylus fossils have been used to date rocks, and a biozone, the
  Massospondylus Range Zone, is named after the genus.
locomotion: bipedal
paleoenvironment:
  - fluvial
  - arid
diet: herbivore
diagnostic_features:
  - Vertebrae proportionally longer than those of extinct crocodile
    Macrospondylus, with centra exceeding 3-5 inches in length
  - Centrum compressed at middle and carinate beneath, keel most produced near
    anterior termination
  - Both articular extremities concave; anterior and posterior zygapophyses
    project beyond corresponding ends of centrum
  - Neural arch anchylosed to centrum, giving off short depressed obtuse
    diapophysis in advance of middle of base
  - Longitudinal ridge on caudal vertebrae with shallow longitudinal channel
    below, indicating neurapophysial suture line
  - Neural spine with deep fossae at fore and back part of base; summit rounded;
    height proportional to length
appearance:
  features:
    - enlarged manual claws
  integument: scaled
  evidence: inferred
