genus: Marmarospondylus
parent: Macronaria
dispute:
  summary: >
    Marmarospondylus robustus is a nomen dubium based on a single dorsal vertebra,
    coined by Owen as a replacement name for his Bothriospondylus robustus. It is
    regarded as an indeterminate macronarian (Mannion, 2010). It is placed
    conservatively at Macronaria incertae sedis.
  history:
    - date: "2026-07-02"
      note: Moved from Neosauropoda to Macronaria incertae sedis following Mannion (2010); regarded as a nomen dubium.
pronunciation:
  phonetic: mar-MAR-o-SPON-dih-lus
etymology: From Greek 'marmaros' (marble, referencing the Forest Marble Formation where it was found) and 'spondylos' (vertebra); meaning 'marble vertebra'.
description: Marmarospondylus is a dubious genus of sauropod dinosaur from
  Middle Jurassic deposits in the English Midlands.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - coastal
  - marine
diagnostic_features:
  - Centrum shorter in proportion to height and breadth than B. suffossus;
    indicates larger individual with relatively larger, less elongate trunk
  - Lateral fossa somewhat less deep than in B. suffossus, with same relative
    longitudinal extent
  - Anterior surface convex; posterior concavity with irregular central tract
    characteristic of Bothriospondylus
  - Large cancelli visible in centrum cross-section with spar infiltration
  - Associated heart-shaped tooth crown (1 inch length) with wavy longitudinal
    ridges on enamel
appearance:
  integument: scaled
  evidence: inferred
