genus: Marmarospondylus
parent: Macronaria
placement: incertae sedis
dispute:
  summary: >
    Marmarospondylus robustus is a nomen dubium based on a single dorsal vertebra.
    Owen (1874) described the material as Bothriospondylus robustus and mentioned
    the name Marmarospondylus only conditionally, as a possible generic distinction
    should the vertebral taxon prove separable. It is regarded as an indeterminate
    macronarian (Mannion, 2010) and placed conservatively at Macronaria incertae
    sedis.
  history:
    - date: "2026-07-02"
      note: Moved from Neosauropoda to Macronaria incertae sedis following Mannion (2010); regarded as a nomen dubium.
pronunciation:
  phonetic: mar-MAR-o-SPON-dih-lus
etymology: From Greek 'marmaros' (marble, referencing the Forest Marble Formation where it was found) and 'spondylos' (vertebra); meaning 'marble vertebra'.
description: Marmarospondylus is a dubious genus of sauropod dinosaur from
  Middle Jurassic deposits in the English Midlands.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - coastal
  - marine
appearance:
  integument: scaled
  evidence: inferred
