genus: Medusaceratops
parent: Albertaceratopsini
etymology: "From Medusa, the snake-haired monster of Greek mythology whose gaze
  turned men to stone, referencing the large snake-like frill spikes, combined
  with Latinized Greek 'ceratops' meaning 'horned face'."
description: Medusaceratops is an extinct genus of centrosaurine ceratopsian
  dinosaur known from the Late Cretaceous Judith River Formation (middle
  Campanian stage) of Montana, northern United States. It contains a single
  species, Medusaceratops lokii.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Only three epiparietals (P1-3) on lateral parietal ramus, unlike
    centrosaurines with seven loci
  - Large, thick, hook-like P1 epiparietal at caudolateral margin,
    dorsoventrally depressed and rostrally curved
  - P2 process lobe-shaped and rugose with hook-shaped rostral margin, smaller
    than P1
  - P3 process small, triangular, depressed, unmodified, positioned at
    parietal-squamosal contact
