genus: Marshosaurus
parent: Piatnitzkysauridae
pronunciation:
  phonetic: MARSH-o-SAWR-us
etymology: Named for Othniel Charles Marsh, the pioneering American paleontologist, combined with Greek '-saurus' meaning 'lizard'.
description: Marshosaurus is a genus of carnivorous theropod dinosaur, belonging
  to the family Piatnitzkysauridae, from the Late Jurassic Morrison Formation of
  Utah and possibly Colorado.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Ilium with heavy construction, long low posterior blade, stout pubic
    peduncle with divided articular surface
  - Pubic peduncle articular surface divided into anterior and posterior
    concavities separated by median ridge
  - Interdental plates separated to their base in maxilla
  - Maxilla with divided sinus having two lateral fenestrae
  - Four premaxillary teeth, 15-16 maxillary teeth, 21-22 dentary teeth
  - Pubis long, slender, anteriorly bowed with teardrop-shaped distal foot
appearance:
  integument: scaled
  evidence: inferred
