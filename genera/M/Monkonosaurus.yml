genus: Monkonosaurus
parent: Stegosauria
pronunciation:
  phonetic: MONG-kon-o-SAWR-us
etymology: "Named for Markam County (also known as Monko), the region of Tibet
  where the holotype was found, combined with Greek 'sauros' meaning 'lizard'."
description: Monkonosaurus is a dubious genus of herbivorous stegosaurian
  dinosaur from the Late Jurassic/Early Cretaceous-aged Loe-ein Formation of
  Tibet (or the Early Cretaceous Lura Formation of China). Some sources place it
  as alive during the Oxfordian - Albian stages, around 163 - 100 million years
  ago, although Monkonosaurus was probably only alive during the Late Jurassic
  (163 - 152.1 ± 0.9 million years ago), making it among the earliest known
  stegosaurs along with Chungkingosaurus and Bashanosaurus.
dispute:
  summary: >
    Monkonosaurus is a nomen dubium; its fragmentary material preserves no
    unique identifiable characters (Maidment and Wei, 2006). It is retained at
    Stegosauria incertae sedis.
  history:
    - date: "2026-06-26"
      note: Placed at Stegosauria incertae sedis, nomen dubium with no diagnostic features.
