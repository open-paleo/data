genus: Monkonosaurus
parent: Stegosauria
placement: incertae sedis
pronunciation:
  phonetic: MONG-kon-o-SAWR-us
etymology: "Named for Markam County (also known as Monko), the region of Tibet
  where the holotype was found, combined with Greek 'sauros' meaning 'lizard'."
description: Monkonosaurus is a dubious genus of stegosaurian dinosaur from the
  Loe-ein Formation of eastern Tibet, of uncertain Late Jurassic to Early
  Cretaceous age. The type species is Monkonosaurus lawulacus.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
appearance:
  integument: armored
  evidence: inferred
identifiers:
  - source: pbdb
    id: "65695"
  - source: wikidata
    id: Q142593
  - source: gbif
    id: "4823118"
species:
  - name: Monkonosaurus lawulacus
    etymology: "Named for the Lawushan (Lawu mountains) in Tibet, the region where
      the holotype was found."
    status: nomen dubium
    type_species: true
    period:
      name:
        - Late Jurassic
        - Early Cretaceous
      stage:
        - Kimmeridgian
        - Tithonian
        - Berriasian
        - Valanginian
        - Hauterivian
    location:
      country: CN
      locality: Lawulashan
      region: CN-XZ
      formation: Loe-ein
    type_specimen:
      specimen_type: holotype
      institution: IVPP
      status: uncatalogued
      material: Two partial vertebrae, three dermal plates, and a complete
        ilio-sacral block.
      completeness: fragmentary
      notes: The holotype was never assigned a catalog number. Only the
        ilio-sacral block has been relocated at the IVPP, damaged since it was
        figured by Dong (1990); the whereabouts of the vertebrae and dermal
        plates are unknown.
    size:
      length_m:
        min: 5.0
        max: 5.0
    erected_in: dong1990b
    described_in: maidment2006a
references:
  - id: zhao1983a
    notes: Names the genus Monkonosaurus without a species or description, a
      nomen nudum.
  - id: zhao1986a
    notes: Credited by Olshevsky (1991) with the binomial Monkonosaurus
      lawulacus, a nomen nudum; Dong (1990) instead credits the binomial to
      Zhao (1983), which gives only the genus.
  - id: olshevsky1991a
    notes: Lists Monkonosaurus Zhao, 1983 and M. lawulacus Zhao, 1986 as nomina
      nuda, made available by Dong (1990).
  - id: dong1990b
    notes: First described the holotype, making the name available; the
      authorship is Monkonosaurus lawulacus Zhao in Dong, 1990.
  - id: maidment2006a
    notes: Reviewed the holotype, rejected each of the original diagnostic
      characters, and treated Monkonosaurus lawulacus as a nomen dubium.
  - id: maidment2008a
    notes: Maintained Monkonosaurus lawulacus as a nomen dubium and listed the
      IVPP ilio-sacral block as Stegosauria indet.
