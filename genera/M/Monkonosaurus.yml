genus: Monkonosaurus
parent: Stegosauria
placement: incertae sedis
pronunciation:
  phonetic: MONG-kon-o-SAWR-us
etymology: "Named for Markam County (also known as Monko), the region of Tibet
  where the holotype was found, combined with Greek 'sauros' meaning 'lizard'."
description: Monkonosaurus is a dubious genus of stegosaurian dinosaur from the
  Loe-ein Formation of eastern Tibet, of uncertain Late Jurassic to Early
  Cretaceous age. The type species is Monkonosaurus lawulacus.
dispute:
  summary: >
    Monkonosaurus is a nomen dubium; its fragmentary material preserves no
    unique identifiable characters (Maidment and Wei, 2006). It is retained at
    Stegosauria incertae sedis.
  history:
    - date: "2026-06-26"
      note: Placed at Stegosauria incertae sedis, nomen dubium with no diagnostic features.
    - date: "2026-07-20"
      note: Species status set to nomen dubium and the holotype corrected to the
        unnumbered IVPP material following Maidment and Wei (2006); the inflated
        Oxfordian–Albian age narrowed to the Kimmeridgian–Hauterivian range
        given by Dong (1990) and Maidment and Wei (2006).
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
appearance:
  integument: armored
  evidence: inferred
identifiers:
  - source: pbdb
    id: "65695"
  - source: wikidata
    id: Q142593
  - source: gbif
    id: "4823118"
species:
  - name: Monkonosaurus lawulacus
    etymology: "Named for the Lawushan (Lawu mountains) in Tibet, the region where
      the holotype was found."
    status: nomen dubium
    type_species: true
    period:
      name:
        - Late Jurassic
        - Early Cretaceous
      stage:
        - Kimmeridgian
        - Tithonian
        - Berriasian
        - Valanginian
        - Hauterivian
    location:
      country: CN
      locality: Lawulashan
      region: CN-XZ
      formation: Loe-ein
    type_specimen:
      specimen_type: holotype
      institution: IVPP
      status: uncatalogued
      material: Two partial vertebrae, three dermal plates, and a complete
        ilio-sacral block.
      completeness: fragmentary
      notes: The holotype was never assigned a catalog number. Only the
        ilio-sacral block has been relocated at the IVPP, damaged since it was
        figured by Dong (1990); the vertebrae and dermal plates are now lost.
    size:
      length_m:
        min: 5.0
        max: 5.0
    erected_in: dong1990b
    described_in: maidment2006a
references:
  - id: zhao1986a
    notes: Established the binomial Monkonosaurus lawulacus without a
      description, leaving it a nomen nudum.
  - id: dong1990b
    notes: First described the holotype, making the name available; the
      authorship is Monkonosaurus lawulacus Zhao in Dong, 1990.
  - id: maidment2006a
    notes: Reviewed the holotype, rejected each of the original diagnostic
      characters, and treated Monkonosaurus lawulacus as a nomen dubium.
