genus: Microhadrosaurus
parent: Hadrosauridae
pronunciation:
  phonetic: MY-kro-HAD-ro-SAWR-us
etymology: "From Greek 'mikros' meaning 'small' and 'hadros' meaning 'bulky',
  plus Greek 'sauros' meaning 'lizard'; translates as 'small bulky lizard',
  reflecting its small size compared to other hadrosaurs."
description: Microhadrosaurus is a genus of hadrosaurid dinosaur from the Late
  Cretaceous (Campanian or Maastrichtian) Nanxiong Formation of Guangdong,
  China. Although its name identifies it as a small hadrosaurid, it is based on
  juvenile remains, and the adult size is unknown.
dispute:
  summary: >
    Microhadrosaurus is a nomen dubium based on a juvenile dentary that
    lacks uniquely identifiable characters.
  history:
    - date: "2026-06-27"
      note: Placed at Hadrosauridae incertae sedis; nomen dubium (P2).
diet: herbivore
locomotion: facultative
paleoenvironment:
