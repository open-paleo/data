genus: Microhadrosaurus
parent: Hadrosauridae
etymology: small bulky lizard
description: Microhadrosaurus is a genus of hadrosaurid dinosaur from the Late
  Cretaceous (Campanian or Maastrichtian) Nanxiong Formation of Guangdong,
  China. Although its name identifies it as a small hadrosaurid, it is based on
  juvenile remains, and the adult size is unknown.
