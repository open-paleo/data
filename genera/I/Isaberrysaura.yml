genus: Isaberrysaura
parent: Stegosauria
placement: incertae sedis
etymology: Named for Isabel Valdueza Berry, who reported the fossil site,
  combined with Greek 'saura' meaning 'lizard'.
pronunciation:
  phonetic: ih-zah-BEH-ree-SOH-ruh
description: Isaberrysaura is an extinct genus of stegosaurian ornithischian
  dinosaurs from the Middle Jurassic Los Molles Formation of Patagonia,
  Argentina. The genus contains a single species, I. mollensis, described by
  Salgado in 2017 based on a single specimen. Salgado and colleagues (2017)
  described it as a basal neornithischian; later analyses place it within
  Thyreophora, most of them as an early stegosaur close to Huayangosaurus.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - deltaic
diagnostic_features:
  - Premaxilla with posterolateral process not contacting lacrimal
  - Elongated maxilla with elevated tooth count and increased snout length
  - Posterior jugal process at least as long as anterior process
  - Two supraorbitals incorporated into orbital margin
  - Broad contact between postorbital and parietal
  - Subcircular supratemporal fenestrae
  - Anteriorly downturned dentary row
appearance:
  integument: armored
  evidence: inferred
identifiers:
  - source: pbdb
    id: "351536"
  - source: wikidata
    id: Q28791257
  - source: eol
    id: "47460265"
species:
  - name: Isaberrysaura mollensis
    etymology: "Named for the Los Molles Formation of Argentina, where the holotype
      was discovered."
    status: valid
    type_species: true
    period:
      name:
        - Middle Jurassic
      stage:
        - Bajocian
    location:
      country: AR
      locality: Los Molles
      region: AR-Q
      formation: Los Molles
    size:
      weight_kg:
        min: 1000
        max: 1000
      length_m:
        min: 5.0
        max: 6.0
    type_specimen:
      specimen_id: [ MOZ-Pv 6459 ]
      specimen_type: holotype
      institution: MOZ
      material: "Nearly complete skull with partial postcranium: 6 cervical, 15 dorsal,
        sacrum with partial ilium, complete pubis, 9 caudal vertebrae, scapula part,
        ribs."
      completeness: partial
    erected_in: salgado2017a
references:
  - id: salgado2017a
    notes: Describes it as a basal neornithischian, but constrained searches do
      not reject a basal thyreophoran position.
  - id: paul2024a
    notes: Source of the mass estimate.
  - id: jones2026a
    notes: Source of the appearance features.
  - id: sánchez-fenollosa2025a
    notes: Phylogenetic analysis of stegosaurian skulls recovered Isaberrysaura as a basal stegosaur.
  - id: han2018a
    notes: Recovered Isaberrysaura as a basal stegosaur in phylogenetic analysis
  - id: raven2018a
    notes: Sister to Gigantspinosaurus in its stegosaur matrix, among
      neornithischians in two basal-ornithischian matrices; concludes it is
      likely a thyreophoran needing further study.
  - id: dieudonné2020a
    notes: Recovers Isaberrysaura as the sister taxon of Stegosauria.
  - id: raven2023a
    notes: In its preferred analysis recovers Isaberrysaura as an early stegosaur,
      sister to Huayangosaurus; its equal-weights and Bayesian analyses place
      both outside Eurypoda.
