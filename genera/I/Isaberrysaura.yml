genus: Isaberrysaura
parent: Stegosauria
etymology: Named for Isabel Valdueza Berry, who reported the fossil site,
  combined with Greek 'saura' meaning 'lizard'.
pronunciation:
  phonetic: ih-zah-BEH-ree-SOH-ruh
description: Isaberrysaura is an extinct genus of stegosaurian ornithischian
  dinosaurs from the Middle Jurassic Los Molles Formation of Patagonia,
  Argentina. The genus contains a single species, I. mollensis, described by
  Salgado in 2017 based on a single specimen. Although initially classified as a
  basal neornithischian, subsequent analyses have allied it with the Stegosauria
  as the morphology of its skull resembles those of other members of the group.
dispute:
  summary: >
    The affinities of Isaberrysaura are contested. The describing authors
    (Salgado et al., 2017) recovered it as a basal neornithischian outside
    Thyreophora, whereas subsequent analyses (Han et al., 2018; Raven and
    Maidment, 2018; Sánchez-Fenollosa and Cobos, 2025) recover it as a basal
    stegosaur. Its membership in Stegosauria is not yet settled.
  history:
    - date: "2026-06-26"
      note: Placed at Stegosauria incertae sedis, recovered as a basal stegosaur by recent analyses but originally described as a basal neornithischian (P2/P3).
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - deltaic
diagnostic_features:
  - Premaxilla with posterolateral process not contacting lacrimal
  - Elongated maxilla with elevated tooth count and increased snout length
  - Posterior jugal process at least as long as anterior process
  - Two supraorbitals incorporated into orbital margin
  - Broad contact between postorbital and parietal
  - Subcircular supratemporal fenestrae
  - Anteriorly downturned dentary row
appearance:
  features:
    - dorsal spines
  integument: armored
  evidence: inferred
