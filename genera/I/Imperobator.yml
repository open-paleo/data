genus: Imperobator
parent: Paraves
placement: incertae sedis
dispute:
  summary: >
    Imperobator antarcticus is known from a fragmentary pes and cannot be
    confidently referred to any of the major paravian subclades. Its describers
    explicitly rejected a dromaeosaurid referral because it lacks the enlarged
    sickle claw and the ginglymoid distal metatarsal II characteristic of
    dromaeosaurids, recovering it only as Paraves incertae sedis (Ely and Case,
    2019); a later study argued for unenlagiine affinities (Motta and colleagues, 2025). It
    is placed conservatively at Paraves incertae sedis.
pronunciation:
  phonetic: im-PERR-oh-BAY-tor
etymology: From Latin 'imperobator' meaning 'powerful warrior'.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - marine
diagnostic_features:
  - Fusion of fibula and calcaneum
  - Parallelogram-outline of metatarsal II cross section
  - Metatarsal II medial slanting where diaphysis terminates
  - Distal articular surface of metatarsal II non-ginglymoid
  - Second pedal ungual small and lacking strong curvature
appearance:
  integument: feathered
  evidence: inferred
