genus: Imperobator
parent: Dromaeosauridae
etymology: "From Latin 'imperobator' meaning 'powerful warrior'. The species name refers to Antarctica, the continent where it was found."
description: Imperobator is a genus of probable unenlagiid paravian theropod
  dinosaurs, that lived during the Maastrichtian age of the Late Cretaceous in
  what is now James Ross Island in Antarctica. Imperobator is one of only two
  non-avian theropods known from Antarctica, crossing over to the landmass when
  it was part of Gondwana. The only described specimen was found in 2003 by an
  expedition launched by the University of California Museum of Paleontology and
  initially described as a dromaeosaur in 2007. The fossil was formally
  described as a new genus in 2019, and later searches reported more fossils
  from the site including teeth and skull bones.
diet: carnivore
locomotion: bipedal
