genus: Ischioceratops
parent: Leptoceratopsidae
etymology: From Greek ischion (hip/ischium bone) and keratops (horned face); meaning 'ischium horned face', referring to the peculiar shape of the ischium bones
pronunciation:
  phonetic: ISS-key-o-SEH-ruh-tops
description: Ischioceratops is an extinct genus of small herbivorous ceratopsian
  dinosaur that lived approximately 77.3-73.5 million years ago during the
  latter part of the Cretaceous Period in what is now China.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Nine sacral vertebrae, more than any other basal non-ceratopsid ceratopsian
    but fewer than ceratopsids
  - Ischium with robust shaft resembling recurved bow, flaring gradually to form
    subrectangular obturator process in middle portion
  - Elliptical fenestra perforating the obturator process of ischium
  - Knob-like distal expansion at ischial shaft end, expanded both dorsally and
    ventrally
  - Neural spines of proximal caudals increasing in length toward middle part of
    tail, similar to Koreaceratops, Protoceratops, and Montanoceratops
