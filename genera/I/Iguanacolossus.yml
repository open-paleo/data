genus: Iguanacolossus
parent: Styracosterna
etymology: "Named for the reptile genus Iguana (in reference to the iconic iguana-like teeth of iguanodontians) combined with Latin 'colossus' meaning 'colossal' or 'giant', in reference to the large body size of the specimen."
pronunciation:
  phonetic: ih-GWAHN-uh-col-OSS-us
description: Iguanacolossus is a genus of iguanodontian ornithopod dinosaur that
  lived in North America during the Early Cretaceous period. It is known from
  UMNH VP 20205, the associated holotype with a large partial skeleton of a
  single individual.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
diagnostic_features:
  - Contact surface for supraoccipital on caudomedial process of squamosal is
    sinuous in caudal view
  - Postorbital process of squamosal mediolaterally compressed and blade-like
  - Axial neural spine blade-like and semi-circular in profile
  - Cranial extremity of preacetabular process of ilium modified into horizontal
    boot
  - Dorsal margin of ilium straight
  - Pubis tapers to a blunt point
