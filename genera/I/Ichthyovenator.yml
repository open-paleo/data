genus: Ichthyovenator
parent: Spinosaurinae
etymology: From Greek ichthys (fish) and Latin venator (hunter); meaning 'fish hunter', referring to its inferred piscivorous lifestyle
pronunciation:
  phonetic: ik-thee-OH-veh-NAY-tuhr
description: Ichthyovenator is a genus of spinosaurid dinosaur that lived in
  what is now Laos, sometime between 120 and 113 million years ago, during the
  Aptian stage of the Early Cretaceous period. It is known from fossils
  collected from the Grès supérieurs Formation of the Savannakhet Basin, the
  first of which were found in 2010, consisting of a partial skeleton without
  the skull or limbs. This specimen became the holotype of the new genus and
  species Ichthyovenator laosensis, and was described by paleontologist Ronan
  Allain and colleagues in 2012. The generic name, meaning "fish hunter", refers
  to its assumed piscivorous lifestyle, while the specific name alludes to the
  country of Laos. In 2014, it was announced that more remains from the dig site
  had been recovered; these fossils included teeth, more vertebrae (backbones)
  and a pubic bone from the same individual.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Dorsosacral sinusoidal sail with low first sacral spine and tall dorsal
    spines D12-D13
  - Penultimate dorsal neural spine 410% of centrum length with anterodistal
    finger-like process unknown in other theropods
  - Fan-shaped sacral neural spines 3 and 4 with height increasing from S1 to S4
    then decreasing at S5
  - Transverse processes of first caudal vertebra with sigmoid profile in dorsal
    view
  - Deep prezygapophyseal centrodiapophyseal fossae on first caudal vertebra
  - Long iliac blade with ilium/pubis length ratio highest among known large
    theropods (1.46)
  - Ischium with mediolaterally flattened shaft and well-developed proximal
    ischial plate unique among tetanuran theropods
  - Large ischial foramen (previously known only in Segisaurus and Guanlong)
  - Posterior dorsal ribs articulated with sternal complex indicated by notched,
    flared distal tips
