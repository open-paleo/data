genus: Ichthyovenator
parent: Spinosaurinae
etymology: From Greek ichthys (fish) and Latin venator (hunter); meaning 'fish hunter', referring to its inferred piscivorous lifestyle
description: Ichthyovenator is a genus of spinosaurid dinosaur that lived in
  what is now Laos, sometime between 120 and 113 million years ago, during the
  Aptian stage of the Early Cretaceous period. It is known from fossils
  collected from the Grès supérieurs Formation of the Savannakhet Basin, the
  first of which were found in 2010, consisting of a partial skeleton without
  the skull or limbs. This specimen became the holotype of the new genus and
  species Ichthyovenator laosensis, and was described by palaeontologist Ronan
  Allain and colleagues in 2012. The generic name, meaning "fish hunter", refers
  to its assumed piscivorous lifestyle, while the specific name alludes to the
  country of Laos. In 2014, it was announced that more remains from the dig site
  had been recovered; these fossils included teeth, more vertebrae (backbones)
  and a pubic bone from the same individual.
diet: carnivore
locomotion: bipedal
