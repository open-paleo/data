genus: Itemirus
parent: Dromaeosaurinae
dispute:
  summary: >
    Itemirus was erected on an isolated braincase and was long of uncertain
    affinity (originally its own family, later suggested to be tyrannosauroid or
    velociraptorine). Recent analyses that add referred material place it within
    Dromaeosaurinae (Sues and Averianov, 2014; Jones et al., 2026), the placement
    adopted here, but the fragmentary type keeps this weakly constrained.
  history:
    - date: "2026-07-01"
      note: Placed in Dromaeosaurinae following Sues and Averianov (2014) and Jones et al. (2026); braincase-based type, historically ambiguous (velociraptorine and tyrannosauroid affinities also proposed).
pronunciation:
  phonetic: ee-te-MEER-us
etymology: Named for the Itemir locality in Uzbekistan where the fossils were discovered.
description: Itemirus is a genus of dromaeosaurid theropod dinosaur from the
  Turonian aged Bissekty Formation of the Late Cretaceous period of Uzbekistan.
diet: carnivore
locomotion: bipedal
paleoenvironment:
