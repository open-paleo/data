genus: Iberospinus
parent: Spinosauridae
dispute:
  summary: >
    Iberospinus natarioi is a spinosaurid whose subfamily placement is unstable.
    The describing analysis (Mateus and Estraviz-Lopez, 2022) recovers it as
    sister to the Baryonyx plus Suchomimus clade, outside both subfamilies but
    favoring baryonychine affinity; Barker et al. (2021) and Isasmendi et al.
    (2024) recover it as a baryonychine, whereas Rauhut et al. (2025) recover it
    as the basalmost spinosaurine.
  history:
    - date: "2026-07-01"
      note: Placed at Spinosauridae, the least-inclusive uncontested node, following the conflicting analyses (P2); its baryonychine-versus-spinosaurine position is unresolved.
etymology: Iberian spine; from Iberia (the Iberian Peninsula, where it was found in Portugal) and Latin spina (spine), referring to its spinosaurid neural spines
pronunciation:
  phonetic: eye-BEH-ro-SPY-nus
description: Iberospinus is an extinct genus of spinosaurid dinosaur from the
  Early Cretaceous (Barremian) Papo Seco Formation of Portugal. The genus
  contains a single species, I. natarioi, known from several assorted bones
  belonging to one individual. Iberospinus represents one of five known
  spinosaurid taxa from the Iberian Peninsula, the others being Camarillasaurus,
  Protathlitis, Riojavenatrix, and Vallibonavenatrix. It is important for its
  implications of the geographical origin of Spinosauridae and the suggested
  presence of potentially semi-aquatic lifestyle earlier in the evolution of
  this clade.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - coastal
diagnostic_features:
  - Single foramen in the Meckelian sulcus (autapomorphic)
  - Straight ventral edge of dentary (not upturned)
  - Laminae present in pleurocoelic depression of medio-distal caudal vertebrae
  - Scapula with straight anterior rim (acromion not protruding)
  - Scapula with reduced acromial ridge
  - Scapula with contact with coracoid occupying entire ventral surface
  - Pubic apron thick along nearly entire pubis shaft
  - Mound-like eminence in proximal lateral part of pubis
