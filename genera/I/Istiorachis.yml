genus: Istiorachis
parent: Styracosterna
etymology: sail spine
description: Istiorachis is an extinct genus of iguanodontian ornithopod
  dinosaur from the Early Cretaceous (Barremian age) Wessex Formation of the
  Isle of Wight, England. The genus contains a single species, Istiorachis
  macarthurae, known from a partial postcranial skeleton including several
  vertebrae, incomplete ribs, and part of the pelvis. Its vertebral neural
  spines are notably elongated, giving the animal a 'sail-backed' appearance.
diet: herbivore
locomotion: facultative
