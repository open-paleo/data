genus: Istiorachis
parent: Styracosterna
etymology: From Greek histion (sail) and rhachis (spine); meaning "sail spine", referring to the notably elongated vertebral neural spines
pronunciation:
  phonetic: ISS-tee-oh-RAH-kiss
description: Istiorachis is an extinct genus of iguanodontian ornithopod
  dinosaur from the Early Cretaceous (Barremian age) Wessex Formation of the
  Isle of Wight, England. The genus contains a single species, Istiorachis
  macarthurae, known from a partial postcranial skeleton including several
  vertebrae, incomplete ribs, and part of the pelvis. Its vertebral neural
  spines are notably elongated, giving the animal a 'sail-backed' appearance.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
diagnostic_features:
  - Two anterior parasagittal tuberosities on ventral surface of posterior
    dorsal vertebra marking transition from keeled to flat surface
  - Dorsal neural spines hyperelongated to over fourfold height of anterior
    articular surface of centrum
  - Anterior process at base of neural spine in posterior cervical vertebra
    potentially marking peg-and-socket articulation
  - Interpostzygapophyseal fossa and tubular cavity between postzygapophyses
    origins and above neural canal
  - Strongly developed centropostzygapophyseal lamina especially in anterior
    dorsal vertebrae
  - Ischium with sinusoidal shaft in lateral view
appearance:
  integument: scaled
  evidence: inferred
