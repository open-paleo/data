genus: Invictibellatrix
parent: Megaraptora
etymology: From Latin 'invictus' (unconquered) and 'bellatrix' (female warrior),
  honoring the later role of megaraptorans as apex predators in Gondwana.
description: Invictibellatrix is an extinct genus of megaraptoran theropod
  dinosaur known from the Early Cretaceous (Barremian age) Wessex Formation of
  England. The genus contains a single species, Invictibellatrix amberina, known
  from a single braincase. Invictibellatrix is estimated to have a body mass
  between 200–300 kg (440–660 lb) and a body length of around 4 m (13 ft).
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Small basipterygoid recess anterior to the anterior tympanic recess on each
    side of the parabasisphenoid
  - Slightly transversely compressed, hourglass-shaped nuchal crest
  - Two large, deep, dorsoventrally elongate paracondylar recesses on the
    ventrolateral sides of the basioccipital
  - Parasagittal nuchal crest recesses that are slightly curved and pronounced
