genus: Ilokelesia
parent: Brachyrostra
pronunciation:
  phonetic: ee-loh-kay-LAY-see-yuh
etymology: "From Mapuche 'ilo' meaning 'flesh' and 'kelesio' meaning 'lizard',
  giving 'flesh lizard'; the specific name reflects the Aguada Grande locality
  where the fossil was found."
description: Ilokelesia is an extinct genus of abelisaurid theropod dinosaurs,
  preserved in the layers of the earliest Late Cretaceous of the Huincul
  Formation (Neuquén Group) in Neuquén Province, Argentina. The only known
  specimen, consisting of fragmentary elements of the skull and skeleton, was
  described by Rodolfo Coria and Leonardo Salgado in late 1998.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Quadrate with lateral condyle very reduced and posterior border of articular
    surface formed completely from medial condyle
  - Cervical vertebrae with poorly defined diapo-postzygapophysial laminae
  - Posterior dorsal vertebrae with infraparapophysial laminae ventrally concave
    and parapophysis ventrally oriented
  - Posterior dorsal vertebrae lacking pleurocoels
  - Caudal vertebrae in central third of tail with distally expanded transverse
    processes bearing cranially and caudally projected processes
  - Distal edge of caudal transverse processes slightly concave in mid part
