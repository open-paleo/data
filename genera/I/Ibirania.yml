genus: Ibirania
parent: Saltasaurinae
etymology: "Named for Ibirá municipality in São Paulo, Brazil (also derived from Tupi 'ybyrá' meaning 'tree'), combined with a modified form of Greek 'plania' meaning 'wanderer'. The species name is from Latin 'parvus' meaning 'small'."
pronunciation:
  phonetic: ee-bih-RAH-nee-uh
description: Ibirania is a genus of dwarf saltasaurine titanosaur dinosaur from
  the Late Cretaceous (Santonian to Campanian) São José do Rio Preto Formation
  (Bauru Basin) of Southeast Brazil. The type species is Ibirania parva. It is
  one of the smallest sauropods known to date, comparable in size to the
  titanosaur Magyarosaurus.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Dorsal vertebrae with thick rod-shaped PRSL bearing prominent crest at
    mid-height
  - Dorsal vertebrae with thick SPRL surpassing half of PRSL height, extending
    parallelly in anterior elements
  - Posterior dorsal vertebrae with subparallel anterior and posterior SPDL,
    posterior ramus projecting dorsally beyond anterior lamina
  - Single CPRL in posterior dorsal vertebrae with expanded extremities forming
    anterolateral rim
  - Posterior dorsal vertebrae with SPOL bearing two rami, lateral ramus forked
    by enlarged pneumatic foramen
  - Mid-caudal centra with ventral hollow lacking longitudinal bony septa or
    ventrolateral ridges
  - Ulna bearing distinctive muscular pit on posteromedial surface of distal half
