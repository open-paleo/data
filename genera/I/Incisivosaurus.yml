genus: Incisivosaurus
parent: Oviraptorosauria
etymology: "Named for its unusually large incisiform front teeth combined with Greek 'sauros' meaning 'lizard', hence 'incisor lizard'."
pronunciation:
  phonetic: IN-si-SEE-vo-SOR-us
description: Incisivosaurus is a genus of small, probably herbivorous theropod
  dinosaurs from the early Cretaceous Period of what is now the People's
  Republic of China. The first specimen to be described (by Xu et al. in 2002),
  IVPP V13326, is a skull that was collected from the lowermost levels (the
  fluvial Lujiatun beds) of the Yixian Formation (dating to the Barremian stage
  about 126 million years ago) in the Sihetun area, near Beipiao City, in
  western Liaoning Province. The most significant, and highly unusual,
  characteristic of this dinosaur is its apparent adaptation to an herbivorous
  or omnivorous lifestyle. It was named for its prominent, rodent-like front
  teeth, which show wear patterns commonly found in plant-eating dinosaurs. The
  specific name gauthieri honors Dr. Jacques Gauthier, a pioneer of the
  phylogenetic method of classification.
diet: omnivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
  - forested
diagnostic_features:
  - Highly heterodont upper dentition with large incisiform first premaxillary
    tooth, smaller subconical second-fourth premaxillary teeth, and very small
    lanceolate maxillary teeth
  - Large high-angled wear facets on mesial margins of teeth
  - Longitudinal crest on ventral surface of basisphenoid
  - Contact between accessory ventral flanges of pterygoids
  - Subsidiary ectopterygoid fenestra present
  - Triradiate palatine with very short maxillary process
  - Relatively low skull with short preorbital region and toothed jaws for
    oviraptorosaur
