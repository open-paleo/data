genus: Iliosuchus
parent: Tetanurae
dispute:
  summary: >
    Iliosuchus incognitus is a nomen dubium based on ilia that are difficult to
    distinguish from those of a juvenile Megalosaurus; it has been interpreted as a
    possible tyrannosauroid or a megalosaurid (Benson, 2009). Because these hypotheses
    span Coelurosauria and Megalosauroidea, it is placed conservatively at Tetanurae
    incertae sedis.
  history:
    - date: "2026-07-02"
      note: Moved from Avetheropoda to Tetanurae incertae sedis; regarded as a nomen dubium.
pronunciation:
  phonetic: IL-ee-oh-SOO-kus
etymology: From the ilium (hip bone) and Greek Souchos (the crocodile god);
  meaning "crocodile-hipped"
description: Iliosuchus is a genus of theropod dinosaur known from
  Bathonian-aged (168.3-166.1 mya) rocks of England. It was perhaps 2 meters
  (6.6 ft) long.
diet: carnivore
locomotion: bipedal
