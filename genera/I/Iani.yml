genus: Iani
parent: Rhabdodontomorpha
etymology: Named after Ianus (Janus), the two-faced Roman god of transitions and change, symbolizing the transitional nature of this dinosaur at a time of major faunal change
pronunciation:
  phonetic: YAN-ee
description: Iani is an extinct genus of rhabdodontomorph iguanodontian dinosaur
  from the Late Cretaceous Cedar Mountain Formation of Utah, United States. The
  genus contains a single species, I. smithi, known from a partial skeleton
  including the skull. Its discovery serves as a link between the genus
  Tenontosaurus and the Rhabdodontidae, with both along with Iani being members
  of the clade Rhabdodontomorpha.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Three premaxillary teeth
  - Distinct oval fossa on the caudomedial aspect of premaxillary lateral process
  - Hatchet shaped postorbital facet on frontal with rostrally convex caudal and
    straight rostral margins
  - Distinct, triangular caudomedial prong projecting off the caudal aspect of
    the palatine forming part of postpalatine foramen margin
  - Distinct u-shaped notch in ectopterygoid between the palatine and jugal
    process forming part of postpalatine foramen
  - Basioccipital with sharp midline lamina bordered contralaterally by two
    basioccipital foramina housed entirely within depressed fossa on
    rostroventral surface
  - Caudally projecting conical tubercle on midline of rostroventralmost tip of
    basioccipital
  - Angular occipital condyle on basioccipital with flattened ventral and caudal
    aspects and sharp rostrally projecting lip
