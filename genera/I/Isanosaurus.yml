species:
  - name: Isanosaurus attavipachi
    etymology: "Named for P. Attavipach, a supporter of paleontological research in Thailand and former Director General of the Thai Department of Mineral Resources."
    status: valid
    type_species: true
    period:
      name:
        - Late Triassic
        - Early Jurassic
        - Middle Jurassic
        - Late Jurassic
      stage:
        - Norian
        - Rhaetian
        - Hettangian
        - Sinemurian
        - Pliensbachian
        - Toarcian
        - Aalenian
        - Bajocian
        - Bathonian
        - Callovian
        - Oxfordian
        - Kimmeridgian
        - Tithonian
    location:
      country: TH
      locality: Phu Nok Khian hill
      region: TH-36
      formation: Nam Phong
      notes: >
        No paper places the Phu Nok Khian site in either part of the Nam
        Phong. Buffetaut and colleagues (2000) give "dark red sandstones of
        the Nam Phong Formation", which outcrop palynology dates late Norian
        to Rhaetian. Hanta and colleagues (2023) call the type locality's beds
        "likely the Upper Nam Phong Formation" from their lithology, the Upper
        Nam Phong being no older than Pliensbachian and probably Late
        Jurassic. Rauhut and colleagues (2020) state that "the Upper Nam Phong
        Formation that has yielded Isanosaurus has recently been dated as
        Early Jurassic", citing Racey and Goodall (2009), who do not mention
        the genus. Racey and Goodall (2009) caution that the boundary "would
        be difficult to detect at outcrop", so its horizon may belong to
        either part.
    size:
      weight_kg:
        min: 7000
        max: 7000
      hip_height_m:
        min: 3.6
        max: 3.6
      length_m:
        min: 6.5
        max: 6.5
    type_specimen:
      specimen_id: [CH4-1]
      specimen_type: holotype
      institution: DMR
      material: "Associated skeletal elements: one cervical, one dorsal and six caudal
        vertebral centra, neural arch of posterior dorsal vertebra, two chevron bones,
        fragmentary ribs, right sternal plate, right scapula, left femur."
      completeness: partial
    erected_in: buffetaut2000a
references:
  - id: buffetaut2000a
  - id: jones2026b
    notes: Source of the mass and hip height estimates.
  - id: rauhut2020a
    notes: Recovered Isanosaurus as a non-sauropodan sauropodiform just outside Sauropoda, and takes its Upper Nam Phong horizon as Early Jurassic after Racey and Goodall (2009).
  - id: pol2022a
    notes: Recovered Isanosaurus outside Eusauropoda, grouped with Gongxianosaurus and vulcanodontids.
  - id: racey2009b
    notes: Splits the Nam Phong into a Late Triassic lower part and an Upper part no older than Pliensbachian, by seismic and well data.
  - id: hanta2023a
    notes: Assigns the type locality's beds to the Upper Nam Phong Formation on their lithology.
