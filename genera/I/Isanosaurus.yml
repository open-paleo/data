genus: Isanosaurus
parent: Sauropoda
etymology: North-eastern Thailand lizard
description: Isanosaurus is an extinct genus of sauropod dinosaur from Thailand.
  It was originally dated to approximately 219-199 million years ago during the
  Late Triassic (late Norian to Rhaetian stages), which would make it one of the
  oldest known sauropods. Its age was later considered uncertain, and may be
  Early Jurassic or even as young as Late Jurassic. The only species is
  Isanosaurus attavipachi. Though important for the understanding of sauropod
  origin and early evolution, Isanosaurus is poorly known. Exact relationships
  to other early sauropods remain unresolved.
diet: herbivore
