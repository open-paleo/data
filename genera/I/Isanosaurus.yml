genus: Isanosaurus
parent: Sauropoda
dispute:
  summary: >
    Isanosaurus is placed as a basal, non-eusauropodan sauropod, but its
    position at the sauropod/sauropodiform boundary is unsettled. Pol and
    Gomez (2022) recover it within Sauropoda but outside Eusauropoda
    (grouped with Gongxianosaurus and vulcanodontids), and Jones (2026)
    likewise treats it as a basal sauropod, whereas Rauhut et al. (2020)
    recover it as a non-sauropodan sauropodiform lying immediately outside
    Sauropoda under the node-based definition (Vulcanodon plus Saltasaurus).
  history:
    - date: "2026-06-29"
      note: >
        Placed at Sauropoda incertae sedis following the prevailing view
        (Pol and Gomez, 2022; Jones, 2026); the non-sauropod sauropodiform
        alternative (Rauhut et al., 2020) is unresolved.
pronunciation:
  phonetic: ee-sahn-o-SAWR-us
etymology: "Named for Isan, the northeastern region of Thailand, combined with Greek 'sauros' meaning 'lizard'. The species name honors P. Attavipach, a supporter of paleontological research in Thailand."
description: Isanosaurus is an extinct genus of sauropod dinosaur from Thailand.
  It was originally dated to approximately 219-199 million years ago during the
  Late Triassic (late Norian to Rhaetian stages), which would make it one of the
  oldest known sauropods. Its age was later considered uncertain, and may be
  Early Jurassic or even as young as Late Jurassic. The only species is
  Isanosaurus attavipachi. Though important for the understanding of sauropod
  origin and early evolution, Isanosaurus is poorly known. Exact relationships
  to other early sauropods remain unresolved.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Robust femur with very prominent, acuminate, S-shaped fourth trochanter
    located in proximal half
  - Opisthocoelous cervical vertebrae with parapophyses at mid-height
  - Strong ventral median ridge on cervical centra
  - Dorsal neural arch remarkably tall with spine longer rostrocaudally than
    transversely
  - Scapula with moderate dorsally rounded proximal expansion and slight distal
    expansion
