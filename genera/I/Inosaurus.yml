genus: Inosaurus
parent: Theropoda
placement: incertae sedis
etymology: Named after In Tedreft, the locality in Niger where the holotype was
  collected; meaning "In Tedreft lizard"
description: Inosaurus is a dubious genus of extinct theropod dinosaur from the
  "Continental intercalaire" of Niger, the type material from the Tiourarén
  Formation at In Tedreft, and possibly from the Late Cretaceous Baharija
  Formation of Egypt. The type, and only species, is I. tedreftensis.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "38530"
  - source: wikidata
    id: Q1525478
  - source: gbif
    id: "4576146"
species:
  - name: Inosaurus tedreftensis
    etymology: "Named for In Tedreft, the locality in Niger where the holotype was
      collected."
    status: nomen dubium
    type_species: true
    period:
      name:
        - Middle Jurassic
      stage:
        - Bathonian
        - Callovian
    location:
      country: NE
      locality: In Tedreft
      region: NE-1
      formation: Tiourarén
      notes: Lapparent (1960) puts the type material in the Continental
        Intercalaire and names no formation. The Tiourarén assignment
        follows Sereno and colleagues (2004), who place In Tedreft in that
        unit while describing another theropod from the site.
    type_specimen:
      specimen_type: holotype
      status: uncatalogued
      institution: MNHN
      material: Eighteen vertebrae and the proximal end of a left tibia, recovered
        together at In Tedreft and possibly from a single individual.
      completeness: fragmentary
      notes: De Lapparent (1960) assigned no catalog number; the central Saharan
        collection was donated to the MNHN, Paris.
    erected_in: lapparent1960a
references:
  - id: lapparent1960a
  - id: sereno2004a
