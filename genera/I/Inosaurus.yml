genus: Inosaurus
parent: Tetanurae
etymology: Named after In Tedreft, the locality in Niger where the holotype was collected; meaning "In Tedreft lizard"
description: Inosaurus is a dubious genus of extinct theropod dinosaur from the
  Early Cretaceous age "Continental intercalaire" and Echkar Formation of Niger
  and possibly from the Late Cretaceous age Baharija Formation of Egypt. The
  type, and only species, is I. tedreftensis.
