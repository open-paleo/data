genus: Inosaurus
parent: Theropoda
placement: incertae sedis
dispute:
  summary: >
    Inosaurus tedreftensis is a nomen dubium based on fragmentary, now-lost vertebrae;
    its affinities within Theropoda cannot be determined. It is placed conservatively
    at Tetanurae incertae sedis.
  history:
    - date: "2026-07-02"
      note: Placed at Tetanurae incertae sedis; regarded as a nomen dubium.
    - date: "2026-07-14"
      note: Moved to Theropoda incertae sedis; no source supports a placement
        below Theropoda for the fragmentary, now-lost vertebrae.
etymology: Named after In Tedreft, the locality in Niger where the holotype was
  collected; meaning "In Tedreft lizard"
description: Inosaurus is a dubious genus of extinct theropod dinosaur from the
  Early Cretaceous age "Continental intercalaire" and Echkar Formation of Niger
  and possibly from the Late Cretaceous age Baharija Formation of Egypt. The
  type, and only species, is I. tedreftensis.
diet: carnivore
locomotion: bipedal
