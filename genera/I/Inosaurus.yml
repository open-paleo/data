genus: Inosaurus
parent: Tetanurae
etymology: Named after In Tedreft, the locality in Niger where the holotype was
  collected; meaning "In Tedreft lizard"
description: Inosaurus is a dubious genus of extinct theropod dinosaur from the
  Early Cretaceous age "Continental intercalaire" and Echkar Formation of Niger
  and possibly from the Late Cretaceous age Baharija Formation of Egypt. The
  type, and only species, is I. tedreftensis.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Small theropod with massive, nearly square dorso-lumbar vertebrae
  - Middle caudal vertebrae bear two keels and are twice as tall as long
  - Vertebral centra narrow in central part, distinguishing from Astrodon
  - Anterior caudal disc nearly square (4.5 x 4.5 cm)
  - Chevron attachment points situated very low on anterior caudals
