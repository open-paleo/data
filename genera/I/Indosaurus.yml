genus: Indosaurus
parent: Majungasaurinae
dispute:
  summary: >
    Indosaurus is consistently placed in Majungasaurinae (Tortosa and
    colleagues, 2014), though it has occasionally been regarded as a nomen
    dubium (Novas and colleagues, 2010) and may be synonymous with
    Indosuchus.
  history:
    - date: "2026-06-30"
      note: >
        Placed at Majungasaurinae following Tortosa and colleagues (2014).
pronunciation:
  phonetic: IN-do-SAWR-us
etymology: From India (where it was found) and Greek sauros (lizard); meaning
  'Indian lizard'
description: Indosaurus is a genus of carnivorous theropod dinosaur that lived
  in what is now India, about 69 to 66 million years ago during the
  Maastrichtian division of the Late Cretaceous.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Skull bones much stouter and thicker than in Indosuchus raptorius
  - Parietals short and broad (not forming a narrow parietal crest as in
    Indosuchus)
  - Apparent transverse crest above and behind the orbits (absent in Indosuchus)
  - Frontals concave and declining in front (vs. flat skull roof between orbits
    in Indosuchus)
  - Postfrontals bearing apparent horn-like tuberosities (absent in Indosuchus)
  - Olfactory canal deeply furrowed into frontals, with thickened longitudinal
    ledges approaching no closer than 4 cm at narrowest point, making the
    structure relatively very much broader
appearance:
  integument: scaled
  evidence: inferred
