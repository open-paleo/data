genus: Ingentia
parent: Lessemsauridae
description: Ingentia is a genus of early sauropodiform dinosaur, sometimes
  considered a basal sauropod, from the Late Triassic (late Norian-Rhaetian) of
  Argentina. The type specimen of Ingentia, PVSJ 1086, was discovered in the
  Quebrada del Barro Formation of northwestern Argentina. It was described in
  2018 by Cecilia Apaldetti, Ricardo Nestor Martínez, Ignacio Alejandro Cerda,
  Diego Pol and Oscar Alcober who named the type and only species Ingentia
  prima, meaning "first huge one", as the taxon was one of the first very large
  sauropodomorphs to evolve, along with its close relative Lessemsaurus. A
  second specimen, PVSJ 1087, was referred, containing five tail vertebrae, both
  ulnae and radii, a left calfbone and a right foot.
diet: herbivore
locomotion: quadrupedal
