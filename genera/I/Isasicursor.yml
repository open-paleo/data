genus: Isasicursor
parent: Elasmaria
etymology: Named after geologist Marcelo Pablo Isasi combined with Latin cursor (runner); meaning "Isasi's runner"
description: Isasicursor is an extinct genus of elasmarian ornithopod dinosaurs
  known from the Late Cretaceous Chorrillo Formation of Santa Cruz Province,
  Argentina. The genus contains a single species, Isasicursor santacrucensis. It
  was a contemporary of the titanosaur sauropod Nullotitan, which was described
  in the same paper.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Ventrally arched sacrum
  - Peg-and-socket articulation between first and second sacral vertebrae in
    ventral view
  - Tibia with strongly proximally projected and thickened cnemial crest
  - Lateral condyle of tibia with an additional anterolateral process
  - Metatarsal II with proximally displaced collateral ligament pit on lateral
    surface
