genus: Itapeuasaurus
parent: Rebbachisaurinae
etymology: Itapeua lizard
description: Itapeuasaurus is a genus of rebbachisaurid sauropod dinosaur from
  the Alcântara Formation (Itapecuru Group) of Maranhão in Brazil. The type and
  only species is Itapeuasaurus cajapioensis. It is the most complete
  Cenomanian-aged diplodocoid known from South America and it is also the first
  reported Cenomanian-aged rebbachisaurid discovered in South America.
diet: herbivore
