genus: Itapeuasaurus
parent: Rebbachisauridae
dispute:
  summary: >
    The describers placed Itapeuasaurus within Rebbachisaurinae as the sister
    taxon to Demandasaurus (Lindoso et al., 2019). More recent analyses instead
    recover it in a more stemward position, outside Khebbashia, in a clade with
    the South American rebbachisaurids Sidersaura and Astigmasaura (Lerzo et
    al., 2024; Bellardini et al., 2025).
  history:
    - date: "2026-06-30"
      note: >
        Moved from Rebbachisaurinae to Rebbachisauridae, the least inclusive
        uncontested node, reflecting the conflict between a Rebbachisaurinae
        placement (Lindoso et al., 2019) and a stemward position with Sidersaura
        and Astigmasaura (Lerzo et al., 2024; Bellardini et al., 2025).
etymology: "Named for Itapeua, the beach locality in Maranhão, Brazil where the fossils were discovered, combined with Greek 'sauros' meaning 'lizard', hence 'Itapeua lizard'."
description: Itapeuasaurus is a genus of rebbachisaurid sauropod dinosaur from
  the Alcântara Formation (Itapecuru Group) of Maranhão in Brazil. The type and
  only species is Itapeuasaurus cajapioensis. It is the most complete
  Cenomanian-aged diplodocoid known from South America and it is also the first
  reported Cenomanian-aged rebbachisaurid discovered in South America.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - coastal
  - marine
diagnostic_features:
  - Large and deep fossae on ventro-lateral aspect of dorsal neural arch split
    by obliquely oriented laminae
  - Posterior centrodiapophyseal lamina forked ventrally forming dorsal edge of
    centrodiapophyseal fossa
  - Dorsal and ventral components of anterior caudal transverse process thinner
    than usual bony bar with prezygapophyseal centrodiapophyseal fossa lamina
    and prezygodiapophyseal centrodiapophyseal fossa accessory lamina
  - Three shallow pneumatic fossae disposed vertically on dorsal surface of
    neural arch separated by spinoprezygapophysial lamina and
    spinopostzygapophysial accessory lamina
  - Presence and symmetrical arrangement of prezygapophysial centrodiapophysial
    fossa lamina and prezygodiapophysial centrodiapophysial fossa accessory
    lamina in anterior caudal vertebrae
