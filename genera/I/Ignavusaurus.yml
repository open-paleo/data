genus: Ignavusaurus
parent: Massopoda
etymology: "From Latin 'ignavus' meaning 'coward' and Ancient Greek 'sauros' meaning 'lizard', giving 'coward's lizard'; the name refers to the type locality Ha Ralekoala, which literally means 'the place of the father of the coward' in the local language."
pronunciation:
  phonetic: ig-NAY-vu-SOR-us
description: Ignavusaurus is a genus of basal sauropodomorph dinosaur that lived
  during the Early Jurassic in what is now Lesotho. Its fossils were found in
  the Upper Elliot Formation which is probably Hettangian in age (around 200
  million years ago). It was described on the basis of a partial, well preserved
  articulated skeleton. The type species, I. rachelis, was described in 2010 by
  Spanish paleontologist F. Knoll.
dispute:
  summary: >
    Ignavusaurus rachelis is recovered close to Sarahsaurus; it falls
    outside Massospondylidae (Apaldetti and others, 2011) or within it
    (Chapelle and others, 2019) depending on the analysis.
  history:
    - date: "2026-06-29"
      note: Placed at Massopoda incertae sedis (P2); Massospondylidae membership is recorded but not adopted.
locomotion: bipedal
paleoenvironment:
  - fluvial
  - arid
diet: herbivore
diagnostic_features:
  - Transverse width of ventral ramus of postorbital greater than rostrocaudal
    width at midshaft
  - Height of postorbital rim of orbit raised so it projects laterally to caudal
    dorsal process
  - First dentary tooth adjacent to symphysis with teeth linearly placed within
    jaws
  - Serrations along mesial and distal carinae of tooth restricted to apical
    half of crown
  - 14 Vertebrae between cervicodorsal transition and primordial sacral vertebrae
  - Metacarpal V about as wide as long with strongly convex proximal
    articulation surface
appearance:
  integument: scaled
  evidence: inferred
