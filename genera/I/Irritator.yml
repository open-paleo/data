genus: Irritator
parent: Spinosaurinae
pronunciation:
  phonetic: IHR-i-TAY-tor
etymology: From English/Latin irritation; named to reflect the frustration of paleontologists who discovered the skull had been heavily damaged and altered by fossil dealers
description: Irritator is a genus of spinosaurid dinosaur that lived in what is
  now Brazil during the Albian stage of the Early Cretaceous Period, about 113
  to 110 million years ago. It is known from a nearly complete skull found in
  the Romualdo Formation of the Araripe Basin. Fossil dealers had acquired this
  skull and sold it to the State Museum of Natural History Stuttgart. In 1996,
  the specimen became the holotype of the type species Irritator challengeri.
  The genus name comes from the word "irritation", reflecting the feelings of
  paleontologists who found the skull had been heavily damaged and altered by
  the collectors. The species name is a homage to the fictional character
  Professor Challenger from Arthur Conan Doyle's novels.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - marine
  - coastal
diagnostic_features:
  - Teeth highly elongate with posterior reduction in crown height; anterior
    maxillary teeth straight and unserrated
  - Tooth replacement mesolingual with replacement teeth alternating between
    functional teeth
  - Maxilla straight with more than 11 teeth; roots occupy almost complete depth
    of maxilla
  - Snout laterally compressed with triangular cross-section
  - Sagittal crest comprised of extended frontals and parietals; crest unique
    for Theropoda
  - Supratemporal fenestra very small; infratemporal fenestra almost as large as
    orbit
  - Lower jaw twice as deep posteriorly than anteriorly; angular extending only
    short distance anterior to mandibular fenestra
