genus: Irritator
parent: Spinosaurinae
pronunciation:
  phonetic: IHR-i-TAY-tor
etymology: From English/Latin irritation; named to reflect the frustration of paleontologists who discovered the skull had been heavily damaged and altered by fossil dealers
description: Irritator is a genus of spinosaurid dinosaur that lived in what is
  now Brazil during the latest Aptian to early Albian of the Early Cretaceous
  Period, around 113 million years ago. It is known from a nearly complete skull
  found in the Romualdo Formation of the Araripe Basin. Fossil dealers had
  acquired this skull and sold it to the State Museum of Natural History
  Stuttgart. In 1996, the specimen became the holotype of the type species
  Irritator challengeri. The genus name comes from the word "irritation",
  reflecting the feelings of paleontologists who found the skull had been
  heavily damaged and altered by the collectors. The species name is a homage
  to the fictional character Professor Challenger from Arthur Conan Doyle's
  novels.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - marine
  - coastal
diagnostic_features:
  - Nasals with a prominent median bony crest that terminates posteriorly in a
    knob-like, somewhat dorsoventrally flattened projection.
  - Dorsal surface of the parietals facing posterodorsally, with the vertical
    axis of the braincase inclined anteroventrally.
  - Posterior surface of the basisphenoid with a deep, dorsoventrally oval
    median recess.
  - Surangular with a broad lateral shelf.
