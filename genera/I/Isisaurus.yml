genus: Isisaurus
parent: Saltasauroidea
etymology: Named after the Indian Statistical Institute (ISI), combined with
  Greek sauros (lizard); meaning 'ISI lizard'
description: Isisaurus is a genus of titanosaurian dinosaur from the Late
  Cretaceous Lameta Formation of India and Pab Formation of Pakistan. The genus
  contains a single species, Isisaurus colberti.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Anteroposteriorly elongate cervical parapophyses
  - Cervical neural arches with prespinal and postspinal laminae
  - Anteriormost dorsal vertebra with pronounced coel between
    prezygodiapophyseal, centroprezygapophyseal and anterior centrodiapophyseal
    laminae
  - Posterior dorsal neural arches with parapophyses positioned above the level
    of the prezygapophyses
  - Anteroposteriorly compressed distal caudal chevron blades
appearance:
  features:
    - elongate forelimbs
    - dorsal spines
  integument: scaled
  evidence: inferred
