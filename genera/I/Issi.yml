genus: Issi
parent: Plateosauridae
etymology: "From Kalaallisut (Greenlandic) meaning 'cold', in reference to it being the most northerly basal sauropodomorph ever discovered. The species name 'saaneq' means 'bone' in Kalaallisut."
pronunciation:
  phonetic: IS-ee
description: Issi is a plateosaurid dinosaur from the Late Triassic Fleming
  Fjord Formation of Greenland. It contains one species, Issi saaneq; the full
  binomial name means "cold bone". Fossils of Issi were previously assigned to
  the species Plateosaurus trossingensis, but new finds allowed for a
  reassessment of that material that showed that it possessed features thought
  to be exclusive to Brazilian sauropodomorphs such as Unaysaurus and
  Macrocollum. This ultimately led to the designation of Issi as a distinct
  genus in 2021. This taxon is the first non-avian dinosaur described from
  Greenland.
locomotion: bipedal
paleoenvironment:
  - lacustrine
diet: herbivore
diagnostic_features:
  - Small foramen at medial surface of premaxilla at base of lateral process
  - Anteroposteriorly elongated dorsoposterior process of squamosal
  - Quadrate relatively tall in comparison to rostrum height
  - Well-developed posterodorsal process of articular, square-shaped in lateral
    view
