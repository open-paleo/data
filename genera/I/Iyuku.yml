genus: Iyuku
parent: Dryosauridae
etymology: "From the Xhosa word for 'hatchling', in reference to the immature status of the specimens. The species name honors South African paleontologist Mike Raath."
pronunciation:
  phonetic: eye-YOO-koo
description: Iyuku is a genus of iguanodontian dinosaur from the Early
  Cretaceous Kirkwood Formation of South Africa. The type species is Iyuku
  raathi.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Maxillary crowns narrower than dentary crowns
  - Very long postacetabular process
  - Sternal plates with caudolateral process
  - Wide and rounded scapular spine
  - Narrower brevis shelf
  - Prepubis lacking ridge on medial side
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "461744"
  - source: wikidata
    id: Q113176372
  - source: gbif
    id: "11797684"
species:
  - name: Iyuku raathi
    etymology: "Named for Mike Raath, South African paleontologist."
    status: valid
    type_species: true
    period:
      name:
        - Early Cretaceous
      stage:
        - Valanginian
    location:
      country: ZA
      locality: Kirkwood Lookout
      region: ZA-EC
      formation: Kirkwood
      part: upper
      notes: Forster and colleagues (2022) place the material in the formation's
        uppermost member without naming it, and put the bone-bearing quarry
        about 51 m up a roughly 60 m section.
    type_specimen:
      specimen_id: [AM 6150]
      specimen_type: holotype
      institution: AMS-MK
      material: Partial semi-articulated skeleton preserving part of skull, vertebral
        centra and arches, scapulae, pelvic girdle, both hind limbs, and ribs.
      completeness: partial
    size:
      length_m:
        min: 3.6
        max: 3.6
      weight_kg:
        min: 90
        max: 90
      hip_height_m:
        min: 1
        max: 1
    erected_in: forster2022a
references:
