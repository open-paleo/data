genus: Irisosaurus
parent: Sauropodiformes
pronunciation:
  phonetic: EYE-rih-so-SAWR-us
etymology: Named after the iridescent clouds (iris = iridescent) of Yunnan Province, China; meaning "iridescent lizard"
description: Irisosaurus is an extinct genus of sauropodiform sauropodomorph
  dinosaur, from the Fengjiahe Formation of China. The type species, Irisosaurus
  yimenensis was formally described in 2020. It was the sister taxon to
  Mussaurus.
locomotion: facultative
paleoenvironment:
  - fluvial
  - lacustrine
diet: herbivore
diagnostic_features:
  - Large and deep neurovascular foramen within perinarial fossa opening
    anteriorly, unique to Irisosaurus
  - Deep perinarial fossa defined by sharp rim along elongate curved ridge of
    premaxillary ramus
  - Premaxillary ramus of maxilla markedly higher than long prior to nasal
    process
  - Strongly asymmetrical proximal half of metacarpal V with proximomedial
    corner much anterior to proximolateral corner
  - Teeth lacking denticles on carinae, convergent with Yunnanosaurus huangi
appearance:
  features:
    - enlarged manual claws
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "423007"
  - source: wikidata
    id: Q96943141
