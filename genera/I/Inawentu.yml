genus: Inawentu
parent: Colossosauria
etymology: Meaning "imitator"; language not specified in the article
pronunciation:
  phonetic: ee-nah-WEN-too
description: Inawentu is an extinct genus of titanosaurian sauropod dinosaur
  from the Late Cretaceous Bajo de la Carpa Formation of Argentina. The genus
  contains a single species, I. oslatus, known from a partial articulated
  skeleton including the skull. The square-shaped jaw of Inawentu demonstrates
  convergent characteristics with rebbachisaurids.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - arid
appearance:
  features:
    - square snout
  integument: scaled
  evidence: inferred
diagnostic_features:
  - Posterior region of the skull rotated posteroventrally to the same level as
    the snout, with the foramen magnum subparallel to the tooth row
  - Ridge at the contact between the ascending process and the body of the
    premaxilla, forming a prominence in lateral view
  - Double lateral temporal fenestra, with an anterior subcircular opening and a
    posterior, enlarged, laterally compressed opening
  - Highest point of the jaw, twice the height of the dentary, located in the
    articular sector between the coronoid process and the surangular
  - Neck composed of only 12 cervical vertebrae, the fewest known in any
    titanosaur
