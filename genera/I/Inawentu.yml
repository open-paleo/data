genus: Inawentu
parent: Eutitanosauria
etymology: Meaning "imitator"; language not specified in the article
description: Inawentu is an extinct genus of titanosaurian sauropod dinosaur
  from the Late Cretaceous Bajo de la Carpa Formation of Argentina. The genus
  contains a single species, I. oslatus, known from a partial articulated
  skeleton including the skull. The square-shaped jaw of Inawentu demonstrates
  convergent characteristics with rebbachisaurids.
diet: herbivore
locomotion: quadrupedal
