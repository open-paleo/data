genus: Iguanodon
parent: Styracosterna
pronunciation:
  ipa: /ᵻˈɡwɑːnədɒn/
  phonetic: i-GWAH-nuh-don
etymology: Iguana tooth; from the iguana (a modern lizard) and Greek odous/odontos (tooth), named for the resemblance of its teeth to those of the iguana
description: >
  A genus of ornithopod dinosaur from the Early Cretaceous of Europe.
  Iguanodon was one of the first dinosaurs ever scientifically described
  and is one of the founding members of the group Dinosauria. It is
  notable for its large thumb spike, which was originally mistakenly
  placed on its nose in early reconstructions.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
  - coastal
appearance:
  integument: scaled
  evidence: inferred
  features:
    - Large conical thumb spike
    - Robust build with ability to walk bipedally or quadrupedally
    - Broad, blunt snout with a horny beak
diagnostic_features:
  - Large conical thumb spike (manual digit I ungual)
  - Laterally compressed, leaf-shaped teeth with denticulate margins
  - Robust fifth finger that could oppose the others
identifiers:
  - source: wikidata
    id: Q15927
synonyms:
  - name: Therosaurus
    type: junior
    reason: Junior objective synonym for the material of Iguanodon anglicus (Fitzinger, 1840).
  - name: Hikanodon
    type: junior
    reason: Now widely treated as a junior synonym of Iguanodon.
  - name: Sphenospondylus
    type: junior
    reason: Sphenospondylus gracilis was reassigned to Iguanodon gracilis by Steel (1969).
  - name: Dollodon
    type: junior
    reason: Carpenter and Ishida (2010) synonymized Dollodon bampingi with Iguanodon seelyi based on the Wessex Formation material.
species:
  - name: Iguanodon bernissartensis
    status: valid
    type_species: true
    completeness: complete
    etymology: "Named for Bernissart, the town in Belgium where numerous skeletons were discovered."
    holotype:
      specimen_id: [IRSNB 1534]
      specimen_type: holotype
      institution: RBINS
      material: complete skeleton
    period:
      name:
        - Late Jurassic
        - Early Cretaceous
      stage:
        - Tithonian
        - Berriasian
        - Valanginian
        - Hauterivian
        - Barremian
        - Aptian
      from_ma: 145.06
      to_ma: 119.57
    location:
      country: BE
      region: Hainaut
      locality: Bernissart
      formation: Sainte-Barbe
      coordinates: [ 50.5, 3.6 ]
    size:
      length_m:
        min: 9.0
        max: 11.0
      weight_kg:
        min: 4500
        max: 4500
    described: 1881
    authors: Boulenger
    description: >
      Known from over 30 complete skeletons discovered in a coal mine at
      Bernissart, Belgium. One of the best-known ornithopod dinosaurs.
    synonyms:
      - name: Delapparentia
        type: junior
        reason: Re-analysis of individual variation in the Belgian specimens placed the Delapparentia material within the range of Iguanodon bernissartensis.
