synonyms:
  - name: Iguanodon anglicus
    type: nomen rejectum
    reason: The original 1825 type species, based on isolated and
      diagnostically inadequate teeth from Tilgate Forest. ICZN Opinion 1947
      (2000) set aside all prior type-species fixations under plenary power,
      replacing it with I. bernissartensis. Not formally placed on the
      Official Index, but its type-species status is fully superseded.
  - name: Iguanodon atherfieldensis
    type: junior subjective
    reason: Reassigned to the new genus Mantellisaurus by Paul (2008) and
      formally synonymised out of Iguanodon by Norman (2010).
  - name: Iguanodon dawsoni
    type: junior subjective
    reason: Reassigned to the new genus Barilium by Norman (2010).
  - name: Iguanodon fittoni
    type: junior subjective
    reason: Reassigned to the new genus Hypselospinus by Norman (2010).
  - name: Iguanodon hollingtoniensis
    type: junior subjective
    reason: Treated as a junior synonym of Hypselospinus fittoni by
      Norman (2010).
  - name: Iguanodon lakotaensis
    type: junior subjective
    reason: Reassigned to the new genus Dakotadon by Paul (2008).
