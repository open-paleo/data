references:
  - id: mantell1825a
    notes: Erects Iguanodon on isolated tooth material from Whiteman's Green,
      Sussex. Mantell's original type species (I. anglicus) was later superseded
      by I. bernissartensis under ICZN Opinion 1947.
  - id: paul2008a
    notes: Initiates the modern split of Iguanodon by erecting Mantellisaurus
      and Dakotadon, restricting Iguanodon to I. bernissartensis.
  - id: norman1986a
    notes: Gives the genus synonymy, listing Iguanosaurus and Therosaurus as
      objective junior synonyms and Streptospondylus and Cetiosaurus as
      subjective ones.
  - id: olshevsky1991a
    notes: Carries Therosaurus and Sphenospondylus in the Iguanodon synonymy.
  - id: norman2010a
    notes: Splits the lower Wealden iguanodontians, removing dawsoni to Barilium
      and fittoni/hollingtoniensis to Hypselospinus.
  - id: iczn2000a
    notes: Resolves Case 3037 (Charig and Chapman, 1998). Designates I.
      bernissartensis as the type species and skeleton Q (RBINS 1534) as
      lectotype under plenary power. Vote 21-0.
  - id: jones2026a
    notes: Source of the hip height estimate, and the appearance features.
  - id: norman1980a
    notes: First full osteology of Iguanodon bernissartensis.
  - id: norman2012a
    notes: Revised diagnosis of Iguanodon bernissartensis, with potential
      autapomorphies marked.
  - id: vanbeneden1881a
    notes: In French. Van Beneden's report on Boulenger's notice, which proposes
      the name Iguanodon bernissartensis, the designated type species.
  - id: salas-herrera2026a
    notes: Diagnoses the tibia CMP-11/8 from the Mas de la Parreta quarry near
      Morella, eastern Spain, as an adult I. bernissartensis with a skin
      ulceration that reached the periosteum.
  - id: weishampel2004a
  - id: ritgen1828a
  - id: fitzinger1843a
  - id: charig1998a
