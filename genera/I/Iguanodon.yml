genus: Iguanodon
parent: Hadrosauriformes
etymology: From the modern lizard 'Iguana' and Greek 'odous/odontos' (tooth);
  meaning 'iguana tooth', referring to Mantell's original recognition that
  the fossil teeth resembled those of living iguanas at much larger scale.
pronunciation:
  ipa: /ɪˈɡwɑːnədɒn/
  phonetic: i-GWAH-nuh-don
description: Iguanodon is one of the original three genera that Owen used to
  found Dinosauria in 1842 (alongside Megalosaurus and Hylaeosaurus) and is
  among the earliest dinosaurs ever scientifically described. Gideon Mantell
  erected the genus in 1825 on isolated teeth from the Tilgate Forest beds of
  Whiteman's Green, near Cuckfield in Sussex, recognizing their similarity to
  the teeth of living iguanas at vastly greater scale; Mantell originally
  designated I. anglicus as the type species. The discovery in 1878 of more
  than thirty articulated skeletons in a coal mine at Bernissart in Belgium
  produced the first reliable picture of the animal's anatomy and underpinned
  Louis Dollo's classic restorations. Because Mantell's anglicus syntype
  teeth proved too fragmentary to anchor the genus, ICZN Opinion 1947 (2000)
  set aside all prior type-species fixations under plenary power, designating
  Iguanodon bernissartensis Boulenger in Beneden, 1881 as the new type
  species and skeleton Q (RBINS 1534) as its lectotype. Subsequent taxonomic
  revisions by Paul (2008) and Norman (2010) split many of the species
  historically referred to Iguanodon into separate genera — including
  Mantellisaurus (atherfieldensis), Barilium (dawsoni), Hypselospinus
  (fittoni, hollingtoniensis), and Dakotadon (lakotaensis) — leaving
  I. bernissartensis as essentially the only currently valid species and
  the genus as a Barremian-Aptian ankylopollexian of Western Europe.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
  - coastal
appearance:
  features:
    - keratinous beak
    - enlarged manual claws
  integument: scaled
diagnostic_features:
  - Two palpebral bones; the larger is dorsally bowed and articulates against
    the prefrontal, and a small, irregular accessory palpebral lies behind its
    tip, against the postorbital.
  - Dentary ramus massive, robust, and straight or very slightly arched.
  - Quadrate foramen formed by the quadratojugal bridging an embayment in the
    jugal wing of the quadrate, just below its midheight.
  - Dorsal centra increasingly opisthocoelous toward the sacrum.
  - Posterior dorsal centra tall-sided but broad, with almost circular,
    broadly heart-shaped articular faces.
  - Sacrum of eight fused vertebrae, with a broad ventral sulcus along the
    midline of the posterior sacral centra.
  - Proximal part of the scapular shaft expanded and massive beside the
    scapulocoracoid suture and the glenoid.
  - Coracoid massive and dished, its foramen forming a pronounced notch on the
    scapulocoracoid suture.
  - An intersternal ossification in the midline of the chest, between the
    coracoids and the sternal bones.
  - Forelimb at least 70% of the length of the hindlimb, and robustly built.
  - Carpals heavily co-ossified and supported by ossified ligaments.
  - Manual phalangeal formula 2-3-3-2-4.
  - First phalanx of manual digit I a flattened, warped plate lying in a
    recess in the base of the pollex ungual.
  - Pollex ungual long and conical, slightly curved along its length; with the
    first phalanx it articulates freely against the roller-like surface of
    metacarpal I.
  - Postacetabular blade of the ilium narrowing distally, with a broad,
    elongate brevis shelf bounded laterally by a prominent ridge.
  - Anterior pubic ramus narrow, elongate and transversely thickened
    proximally, becoming laterally compressed and expanding dorsally and
    ventrally toward its tip.
  - Three distal tarsals.
  - Metatarsal I reduced to a transversely flattened splint lying obliquely
    against the shaft of metatarsal II.
