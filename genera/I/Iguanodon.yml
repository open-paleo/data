references:
  - id: mantell1825a
    notes: Erects Iguanodon on isolated tooth material from Whiteman's Green,
      Sussex. Mantell's original type species (I. anglicus) was later superseded
      by I. bernissartensis under ICZN Opinion 1947.
  - id: boulenger1881a
    notes: In French, series 3. Establishes Iguanodon bernissartensis; the name
      was proposed by G. A. Boulenger in a report by P.-J. van Beneden.
  - id: paul2008a
    notes: Initiates the modern split of Iguanodon by erecting Mantellisaurus
      and Dakotadon, restricting Iguanodon to I. bernissartensis.
  - id: norman2010a
    notes: Splits the lower Wealden iguanodontians, removing dawsoni to Barilium
      and fittoni/hollingtoniensis to Hypselospinus.
  - id: iczn2000a
    notes: Resolves Case 3037 (Charig and Chapman, 1997). Designates I.
      bernissartensis as the type species and skeleton Q (RBINS 1534) as
      lectotype under plenary power. Vote 21-0.
  - id: jones2026a
    notes: Source of the hip height estimate, and the appearance features.
  - id: vanbeneden1881a
    notes: Report containing Boulenger's naming of Iguanodon bernissartensis, the designated type species.
