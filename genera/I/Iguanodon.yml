genus: Iguanodon
parent: Hadrosauriformes
etymology: From the modern lizard 'Iguana' and Greek 'odous/odontos' (tooth);
  meaning 'iguana tooth', referring to Mantell's original recognition that
  the fossil teeth resembled those of living iguanas at much larger scale.
pronunciation:
  ipa: /ɪˈɡwɑːnədɒn/
  phonetic: i-GWAH-nuh-don
description: Iguanodon is one of the original three genera that Owen used to
  found Dinosauria in 1842 (alongside Megalosaurus and Hylaeosaurus) and is
  among the earliest dinosaurs ever scientifically described. Gideon Mantell
  erected the genus in 1825 on isolated teeth from the Tilgate Forest beds
  of Whiteman's Green, near Cuckfield in Sussex, recognizing their similarity
  to the teeth of living iguanas at vastly greater scale; he originally
  designated I. anglicus as the type species. The discovery in 1878 of more
  than thirty articulated skeletons in a coal mine at Bernissart in Belgium
  produced the first reliable picture of the animal's anatomy and underpinned
  Louis Dollo's classic restorations. Because Mantell's anglicus syntype
  teeth proved too fragmentary to anchor the genus, ICZN Opinion 1947 (2000)
  set aside all prior type-species fixations under plenary power, designating
  Iguanodon bernissartensis Boulenger in Beneden, 1881 as the new type
  species and skeleton Q (RBINS 1534) as its lectotype. Subsequent taxonomic
  revisions by Paul (2008) and Norman (2010) split many of the species
  historically referred to Iguanodon into separate genera — including
  Mantellisaurus (atherfieldensis), Barilium (dawsoni), Hypselospinus
  (fittoni, hollingtoniensis), and Dakotadon (lakotaensis) — leaving
  I. bernissartensis as essentially the only currently valid species and
  the genus as a Barremian-Aptian ankylopollexian of Western Europe.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
  - coastal
appearance:
  features:
    - keratinous beak
    - enlarged manual claws
  integument: scaled
diagnostic_features:
  - Skull bearing 29 maxillary and 25 dentary tooth positions with an
    accessory palpebral bone above the orbit.
  - Scapula broad with a dorsally-placed acromion process.
  - Manus massive with a large conical thumb (digit I) ungual modified into
    a defensive 'thumb spike'; phalanx 1 of digit I retained.
  - Sacrum of eight fused vertebrae with mediolaterally compressed dorsal
    centra.
  - Prepubic process shallow with a long posterior acetabular body of the
    pubis.
  - Adult body size on the order of 8-10 m and 3-4 metric tons, larger than
    most contemporaneous Wealden iguanodontians.
