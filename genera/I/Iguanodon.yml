synonyms:
  - name: Iguanosaurus
    type: junior objective
    reason: Proposed by Ritgen (1828) for the animal Mantell had named
      Iguanodon three years earlier. Carrying the same type, it is an
      objective synonym; Norman (1986) and Weishampel and others (2004)
      both list it as such.
  - name: Iguanodon anglicus
    type: nomen rejectum
    reason: The original 1825 type species, based on isolated and
      diagnostically inadequate teeth from Tilgate Forest. ICZN Opinion 1947
      (2000) set aside all prior type-species fixations under plenary power,
      replacing it with I. bernissartensis. Not formally placed on the
      Official Index, but its type-species status is fully superseded.
