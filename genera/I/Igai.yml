genus: Igai
parent: Saltasauridae
etymology: "Named for Igai, a mysterious 'lord of the oasis' worshipped around the Dakhla and Kharga Oases of Egypt during the Old Kingdom."
description: Igai is a genus of titanosaur from the Late Cretaceous Quseir
  Formation of Kharga Oasis, Egypt. The type species is Igai semkhu.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Metacarpal V with proximomedial and distomedial tubercles
  - Reduced cnemial crest of tibia does not exceed anterior margin of distal end
  - Distal groove along dorsal margins of metatarsals I and II
