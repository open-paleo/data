genus: Igai
parent: Saltasauridae
etymology: Named for Igai, the "lord of the oasis" deity venerated by the
  inhabitants of the Dakhla and Kharga oases in Egypt from roughly the Old Kingdom
  to the Late Period.
pronunciation:
  phonetic: ee-jee
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Metacarpal V with proximomedial and distomedial tubercles
  - Reduced cnemial crest of tibia does not exceed anterior margin of distal end
  - Distal groove along dorsal margins of metatarsals I and II
