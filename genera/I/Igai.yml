      notes: The Vb numbers are those of the Sonderforschungsbereich 69 vertebrate
        collection of the Technische Universität Berlin, which recovered the skeleton
        in 1977. The material passed to the Freie Universität Berlin around 1999 and
        to the Museum für Naturkunde in 2008, but was never re-accessioned into that
        museum's MB.R. series, so Gorscak et al. (2022) retain the original
        collection numbers. The left tibia, Vb-634, was not among the material
        transferred and its whereabouts are unknown.
