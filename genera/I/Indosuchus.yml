  - id: novas2004b
  - id: novas2010b
    notes: Considers Indosuchus raptorius a nomen dubium, with Lametasaurus
      indicus and Indosaurus matleyi, and refers the Rahioli material to the
      new genus Rahiolisaurus.
  - id: carrano2008a
    notes: Confirms the abelisaurid affinity, allows that the Lameta
      abelisaurids may be only one or two taxa, and finds the Indosuchus type
      the most distinct of them.
  - id: dalman2011a
    notes: Treats Indosuchus raptorius as valid, recovers it within
      Carnotaurinae and not with Indosaurus, and separates the AMNH material
      as a basal abelisaurid.
