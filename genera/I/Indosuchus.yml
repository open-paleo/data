      completeness: fragmentary
      notes: Huene and Matley (1933) founded the species on three skull fragments
        (GSI K20/350, K27/690 and K27/685) without designating a type. Chatterjee
        (1978) found K27/685 to be the only one still extant in the GSI
        collection and designated it the lectotype; K20/350 and K27/690 are
        paralectotypes. Novas and colleagues (2004) report all three as lost or
        misplaced in the GSI collection.
