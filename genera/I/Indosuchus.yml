genus: Indosuchus
parent: Abelisauridae
dispute:
  summary: >
    Novas and colleagues (2010) consider Indosuchus raptorius a nomen
    dubium, its holotype offering no clear autapomorphies, while Dalman and
    Gishlick (2011), studying the material in full, treat it as valid and
    recover it within Carnotaurinae; Carrano and Sampson (2008) allow that
    the Lameta abelisaurids may be only one or two taxa, though they find
    Indosuchus the most distinct. Its abelisaurid affinity is not in
    question. Much of the material once referred to it has been reassigned:
    Novas and colleagues (2010) made the Rahioli skeleton the basis of
    Rahiolisaurus, and Dalman and Gishlick (2011) refer the AMNH specimens
    to an indeterminate basal abelisaurid.
pronunciation:
  phonetic: IN-do-SOOK-us
etymology: From India (where it was found) and Greek suchos (crocodile); meaning
  'Indian crocodile'
description: Indosuchus is a genus of abelisaurid dinosaur from the Late
  Cretaceous Period (Maastrichtian, 70 to 66 million years ago) of what is now
  India. Like most theropods, Indosuchus was a bipedal carnivore. It was about 7
  meters (23 ft) long, weighed about 1.2 tonnes (1.3 short tons), and had a
  crested skull, flattened on the top.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Narrow, sharp parietal crest formed by sudden wedge-shaped contraction of
    parietals posteriorly
  - Skull roof between orbits flat and smooth dorsally, not concave or
    transversely crested
  - No horn-like tuberosities on postfrontals
  - "Divided olfactory canal: sphenethmoid forms two separate oval openings (14
    mm high) separated by vertical mesethmoid lamella"
  - Orbitosphenoid visible in depth of supratemporal opening, with horn-like
    lateral processes lying below posterior borders of frontals
appearance:
  integument: scaled
  evidence: inferred
