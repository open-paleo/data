genus: Indosuchus
parent: Abelisauridae
description: Indosuchus is a genus of abelisaurid dinosaur from the Late
  Cretaceous Period (Maastrichtian, 70 to 66 million years ago) of what is now
  India. Like most theropods, Indosuchus was a bipedal carnivore. It was about 7
  metres (23 ft) long, weighed about 1.2 tonnes (1.3 short tons), and had a
  crested skull, flattened on the top.
diet: carnivore
locomotion: bipedal
