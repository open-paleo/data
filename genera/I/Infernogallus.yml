genus: Infernogallus
parent: Caenagnathidae
pronunciation:
  phonetic: in-FUR-noh-GAL-us
  ipa: /ɪnˌfɜːrnoʊˈɡæləs/
etymology: From Latin 'inferno' (hell) and 'gallus' (chicken), for the Hell
  Creek Formation and the animal's small, bird-like appearance.
description: Infernogallus is an extinct genus of oviraptorosaurian theropod
  dinosaur in the family Caenagnathidae, known from multiple localities in the
  Late Cretaceous (Maastrichtian age) Hell Creek Formation of the United States.
  The genus contains a single species, Infernogallus jamesi, known from a
  partial articulated skull and skeleton and several isolated cranial remains.
  With an estimated body mass of around 12 kg (26 lb), it is a small
  caenagnathid. The skull of the holotype specimen is the first nearly complete
  and articulated skull discovered for a caenagnathid. It shows a reorganization
  of jaw muscles that may be an adaptation for fruit eating, similar to some
  modern parrots but unique among non-avian theropods.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Broad jugal with large anterior ascending process that contacts the
    squamosal posteriorly
  - Infratemporal fenestra extremely reduced, about 25% the diameter of the orbit
  - Quadratojugal with greatly enlarged, circular posterior process
  - Squamosal with dorsoventrally broad body lacking a depression and ridge for
    adductor musculature
  - Pterygoids concave dorsally, unfused along the midline, with a lateral
    buttress; ectopterygoid-pterygoid bar greatly expanded and extending far
    ventrally
  - Lateral tubercle on posteroventral ramus of dentary; extensor ridge on
    metacarpal II; tubercle proximal to the condyle on metatarsal I
