genus: Invictarx
parent: Nodosauridae
etymology: From Latin 'invictus' meaning 'invincible' or 'unconquerable' and
  'arx' meaning 'fortress', in reference to the well-armored nature of
  ankylosaurs.
pronunciation:
  phonetic: in-VIK-tarks
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Cervical/pectoral and thoracic osteoderms with smooth surface texture,
    abundant randomly distributed pits, minimal neurovascular grooves
  - Some thoracic osteoderms with low rounded keel bearing deep craniocaudal
    groove along apex
  - Probable co-ossified pelvic shield of polygonal osteoderms of uniform size
appearance:
  features:
    - osteoderms
  integument: armored
  evidence: direct
