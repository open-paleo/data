genus: Invictarx
parent: Nodosauridae
etymology: "From Latin 'invictus' meaning 'invincible' or 'unconquerable' and 'arx' meaning 'fortress', in reference to the well-armoured nature of ankylosaurs. The species name is from Greek 'Zephyrus' meaning 'western wind'."
description: Invictarx is a monospecific genus of nodosaurid dinosaur from New
  Mexico that lived during the Late Cretaceous (lower Campanian, 78.5 Ma) in
  what is now the upper Allison Member of the Menefee Formation. The type and
  only species, Invictarx zephyri, is known from three isolated, incomplete
  postcranial skeletons. It was named in 2018 by Andrew T. McDonald and Douglas
  G. Wolfe. Invictarx shares similarities with Glyptodontopelta from the
  Naashoibito member of the Ojo Alamo Formation, New Mexico.
diet: herbivore
locomotion: quadrupedal
