genus: Iuticosaurus
parent: Titanosauriformes
placement: incertae sedis
dispute:
  summary: >
    Iuticosaurus was erected for "Titanosaurus" valdensis and interpreted as an
    early titanosaur (Le Loeuff, 1993), but its caudal vertebrae are now
    regarded as those of an indeterminate titanosauriform (Mannion et al., 2013;
    Jones, 2026).
  history:
    - date: "2026-06-30"
      note: >
        Retained at Titanosauriformes incertae sedis as an indeterminate, likely
        dubious taxon following Mannion et al. (2013) and Jones (2026).
pronunciation:
  phonetic: YOO-ti-ko-SAWR-us
etymology: Named after the Jutes (Iuti in Latin), the Germanic people associated
  with the Isle of Wight; meaning "Jute lizard"
description: "Iuticosaurus is a genus of titanosaurian sauropod dinosaur from the
  Early Cretaceous of the Isle of Wight, England. The type and only valid
  species, Iuticosaurus valdensis, was erected by Le Loeuff (1993) for caudal
  vertebrae from the Wealden that Huene (1929) had originally named
  \"Titanosaurus\" valdensis. It was long regarded as the oldest titanosaur
  known from Europe."
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Deeply procoelous caudal vertebrae with posterior ridge on lateral face of
    centrum
  - Promontory at base of neural arch formed by rising centrum from posterior
    ridge
  - Extremely developed postzygapophyses extending to end of centrum
  - Neural arch anteriorly placed on caudal centra
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "64328"
  - source: wikidata
    id: Q1656671
  - source: gbif
    id: "4967345"
erected_in: leloeuff1993a
species:
  - name: Iuticosaurus valdensis
    etymology: From 'Wealden', for the Lower Cretaceous Wealden strata of the Isle
      of Wight that yielded the type material.
    status: valid
    type_species: true
    period:
      name:
        - Early Cretaceous
      stage:
        - Barremian
    location:
      country: GB
      region: GB-IOW
      formation: Wessex
      locality: Brook
    type_specimen:
      specimen_id:
        - BMNH R151
      specimen_type: lectotype
      institution: NHMUK
      material: Laterally compressed, water-worn middle caudal vertebra centrum.
      completeness: fragmentary
    synonyms:
      - name: Titanosaurus valdensis
        type: reassigned
        reason: Original combination by Huene (1929); recombined into the new genus
          Iuticosaurus by Le Loeuff (1993), who designated BMNH R151 as
          lectotype.
    erected_in: huene1929a
    described_in: leloeuff1993a
references:
  - id: huene1929a
    notes: Erected the species as Titanosaurus valdensis.
  - id: leloeuff1993a
    notes: Erected Iuticosaurus and recombined the type species as Iuticosaurus valdensis.
  - id: jones2026b
    notes: Placement and assessment in the Princeton Encyclopedia of Dinosaurs.
  - id: mannion2013a
    notes: Bearing on the titanosaurian affinities of Iuticosaurus.
  - id: wilson2003b
    notes: Refers the lectotype's Wealden beds to the Wessex Formation; Huene and
      Le Loeuff give only the informal facies name.
