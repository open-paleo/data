genus: Iuticosaurus
parent: Titanosauriformes
pronunciation:
  phonetic: YOO-ti-ko-SAWR-us
etymology: Named after the Jutes (Iuti in Latin), the Germanic people associated
  with the Isle of Wight; meaning "Jute lizard"
description: "Iuticosaurus is a genus of titanosaur sauropod dinosaur from the
  Early Cretaceous of the Isle of Wight. Two species have been named: I.
  valdensis and I. lydekkeri. I. valdensis was found in the Wessex Formation and
  I. lydekkeri in the younger Upper Greensand."
diet: herbivore
