genus: Venenosaurus
parent: Brachiosauridae
pronunciation:
  ipa: /vɛˌnɛnoʊˈsɔːrəs/
  phonetic: ven-EN-o-SOR-uhs
etymology: "From the Poison Strip Member of the Cedar Mountain Formation (Latin
  venenum, 'poison') where the fossils were found, plus Greek sauros ('lizard'),
  meaning 'poison lizard'"
description: Venenosaurus is a genus of sauropod dinosaur that lived in what is
  now Utah during the Early Cretaceous. Its type and only species is
  Venenosaurus dicrocei. Fossils of Venenosaurus were first discovered in 1998,
  by Denver Museum of Natural History volunteer Anthony DiCroce, and described
  as a new genus and species in 2001 by Virginia Tidwell and colleagues, who
  named the species for DiCroce. Venenosaurus was a relatively small sauropod,
  and was similar to Cedarosaurus, another sauropod from the Early Cretaceous of
  Utah.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Proximal caudal centrum with convex anterior surface and flat posterior
    surface, unique among known sauropods
  - Neural spines of middle caudals incline anteriorly and rest on amphiplatyan
    centra, unique combination in Titanosauriformes
  - Anterior and middle caudals with deep lateral fossae, subdivided into two
    chambers by internal ridge
  - Radius more slender than other taxa except Cedarosaurus
  - Ulna with expanded medial wall and well-developed medial process
  - Metacarpal I proximal end more slender anteroposteriorly than other sauropods
  - Pubis longer than ischium
