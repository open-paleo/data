genus: Vagaceratops
parent: Chasmosaurinae
etymology: From Latin vagus ('wandering') and Greek keratops ('horned face'), meaning 'wandering horned face', in reference to its close relationship with Kosmoceratops from Utah
pronunciation:
  phonetic: VAH-guh-SEH-ruh-tops
description: Vagaceratops is a genus of chasmosaurine ceratopsid dinosaur which
  lived during the Late Cretaceous period (late Campanian) in what is now
  Alberta. Its fossils have been recovered from the Upper Dinosaur Park
  Formation. It is sometimes included in the genus Chasmosaurus as Chasmosaurus
  irvinensis instead of being recognized as its own genus.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Jugal notch on proximal squamosal broadly rounded and open (not parallel
    sided)
  - Transverse parietal bar straight
  - Epiparietals (ep1-ep3) and epiparietosquamosal (eps) short, forming recurved
    flat laminae
  - Predentary length one half that of dentary
appearance:
  features:
    - neck frill
    - epoccipitals
  integument: scaled
  evidence: inferred
