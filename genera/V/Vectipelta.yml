genus: Vectipelta
parent: Ankylosauria
etymology: Named after Vectis (the Latin name for the Isle of Wight), combined with Latin pelta meaning 'shield'; translates as 'Isle of Wight shield'
pronunciation:
  phonetic: VEK-tee-PEL-tuh
description: Vectipelta is an extinct genus of ankylosaurian dinosaur recovered
  from the Early Cretaceous Wessex Formation of England. The genus contains a
  single species, V. barretti, known from a partial skeleton including several
  osteoderms. It was historically known as the "Spearpoint ankylosaur" prior to
  its description.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
appearance:
  features:
    - body armor
    - osteoderms
  integument: armored
diagnostic_features:
  - Anteriorly projecting lip on the ventral surface of the anterior articular
    facet of the axis
  - Deep fossa present in the floor of the neural canal, piercing the centrum in
    cervical and caudal vertebrae
  - Postzygapophyses of cervical vertebrae widely separated by a deep,
    transversely broad and dorsoventrally elongate fossa with a midline ridge
    extending toward the neural spine
  - Epipophyses present in posterior cervical vertebrae
  - Highly rugose ridges extending ventrally from the parapophyses to the
    centrum in anterior dorsal vertebrae
  - Anterior centroparapophyseal laminae present on the neural arches in
    mid-dorsal vertebrae
  - Ischium with elongate, gently curving shaft in lateral view that is straight
    in anterior view
  - Sacral shield smooth on its dorsal surface with gently undulating low-relief
    ornamentation
