genus: Volgatitan
parent: Lithostrotia
etymology: "Named for the Volga River region of Russia (Ulyanovsk Oblast) where the fossils were found, combined with 'titan' meaning 'giant'."
description: Volgatitan is a genus of titanosaurian sauropod dinosaur from the
  Early Cretaceous of the Ulyanovsk Oblast, Russia. The type and only species is
  Volgatitan simbirskiensis, known from seven caudal vertebrae from a single
  individual. It is the oldest known titanosaur from the northern hemisphere,
  and is considered important for being related to the Lognkosauria, a group
  known only from South America later in the Late Cretaceous. It was first
  described in November 2018 by Russian paleontologists Alexander Averianov and
  Vladimir Efimov. It is estimated to have weighed about 17.3 metric tons (19.1
  short tons).
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - marine
diagnostic_features:
  - Deeply procoelous anterior caudal centra with distinctly concave anterior
    articular surface and strongly convex ball-like posterior articular surface
  - Procoelous middle caudal centra with same degree of procoelity as anterior
    caudals
  - Long anterior caudal centra with centrum length to anterior centrum height
    ratio of 0.98
  - Prominent ventral ridge on anterior and middle caudal centra
  - Neural arch confined to anterior half of centrum in anterior and middle
    caudals
  - Hyposphene-hypantrum articulation present in anterior caudal vertebrae
  - Somphospondylous (camellate) bone texture in caudal vertebrae
