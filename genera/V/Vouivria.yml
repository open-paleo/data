genus: Vouivria
parent: Brachiosauridae
etymology: Named after the vouivre, a mythological serpentine or dragon-like
  creature from the folklore of Franche-Comté, France, where the fossil was
  found
description: Vouivria is a genus of herbivorous sauropod dinosaur, belonging to
  the Brachiosauridae, that lived in the area of present France during the Late
  Jurassic. The type and only known species is Vouivria damparisensis. It is
  based on a specimen once commonly referred to as the "French Bothriospondylus"
  in the scientific literature, as the specimen was once identified as
  Bothriospondylus madagascariensis, a species known from the Middle Jurassic of
  Madagascar.
diet: herbivore
