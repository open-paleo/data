genus: Vouivria
parent: Brachiosauridae
etymology: Named after the vouivre, a mythological serpentine or dragon-like
  creature from the folklore of Franche-Comté, France, where the fossil was
  found
pronunciation:
  phonetic: vou-WEE-vree-uh
description: Vouivria is a genus of herbivorous sauropod dinosaur, belonging to
  the Brachiosauridae, that lived in the area of present France during the Late
  Jurassic. The type and only known species is Vouivria damparisensis. It is
  based on a specimen once commonly referred to as the "French Bothriospondylus"
  in the scientific literature, as the specimen was once identified as
  Bothriospondylus madagascariensis, a species known from the Middle Jurassic of
  Madagascar.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - coastal
diagnostic_features:
  - Spinopostzygapophyseal laminae expand posteriorly close to spine apex in
    middle-posterior cervical vertebrae
  - Well-defined anterior and posterior centrodiapophyseal laminae in
    anteriormost caudal vertebrae
  - Deltopectoral crest of humerus doubles in mediolateral thickness distally
  - Ventromedial ridge from proximal metacarpal III bifurcates at approximately
    one-quarter length
  - Ventromedial margin of proximal third of metacarpal IV forms a flange
  - Intercondylar ridges between tibial and fibular condyles on distal posterior
    femur
appearance:
  integument: scaled
  evidence: inferred
