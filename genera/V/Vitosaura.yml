genus: Vitosaura
parent: Abelisauridae
etymology: "Named in honor of Victoria 'Doña Vito' Romero, a 19th-century soldier born in the Los Llanos region near the type locality, combined with 'saura', feminine of Ancient Greek 'sauros' meaning 'lizard'."
pronunciation:
  phonetic: VEE-toe-SOR-uh
description: Vitosaura is an extinct genus of abelisaurid theropod dinosaurs
  known from the Late Cretaceous Los Llanos Formation of Argentina. The genus
  contains a single species, Vitosaura colozacani, known from a partial
  skeleton. Alongside Guemesia and the noasaurid Noasaurus, Vitosaura is one of
  the only Argentinian ceratosaurians found outside of Patagonia.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
appearance:
  integument: scaled
  evidence: inferred
diagnostic_features:
  - Anterior dorsal vertebrae lacking posterior pleurocoels on the centrum
  - Anterior dorsal vertebrae with a transverse groove on the distal surface of
    the neural spine
  - Ilium with subequal pubic and ischial articulation surfaces
  - Vertical ischial peduncle
  - Pubic shaft decreasing in anteroposterior depth distally
