genus: Vitosaura
parent: Abelisauridae
description: Vitosaura is an extinct genus of abelisaurid theropod dinosaurs
  known from the Late Cretaceous Los Llanos Formation of Argentina. The genus
  contains a single species, Vitosaura colozacani, known from a partial
  skeleton. Alongside Guemesia and the noasaurid Noasaurus, Vitosaura is one of
  the only Argentinian ceratosaurians found outside of Patagonia.
diet: carnivore
locomotion: bipedal
