genus: Vespersaurus
parent: Noasaurinae
etymology: The generic name is derived from the Latin "vesper," meaning
  "evening/west," in reference to the town Cruzeiro do Oeste ("Western Cross")
  near which the fossils were found, and the Greek "sauros," meaning "lizard."
  The specific name refers to the Paraná state.
description: Vespersaurus is a genus of noasaurid theropod dinosaur from the
  Cretaceous Rio Paraná Formation in the Paraná Basin, Brazil. The type and only
  species is V. paranaensis, which would have lived in the giant prehistoric
  Botucatu Desert.
diet: carnivore
locomotion: bipedal
