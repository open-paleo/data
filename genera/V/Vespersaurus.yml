genus: Vespersaurus
parent: Noasaurinae
pronunciation:
  phonetic: VES-per-SAWR-us
etymology: "From Latin 'vesper' meaning 'evening' or 'west', referencing the town Cruzeiro do Oeste ('Western Cross') near the discovery site, combined with Greek 'sauros' meaning 'lizard'."
description: Vespersaurus is a genus of noasaurid theropod dinosaur from the
  Cretaceous Rio Paraná Formation in the Paraná Basin, Brazil. The type and only
  species is V. paranaensis, which would have lived in the giant prehistoric
  Botucatu Desert.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - arid
diagnostic_features:
  - Metatarsal II with extremely lateromedially compressed shaft, differing from
    Velocisaurus, Masiakasaurus, and Noasaurus
  - Lateromedially compressed metatarsal IV
  - Pedal ungual of the fourth digit with proximal end dorsoventrally taller
    than distal end of phalanx IV-1
  - Ischium with no obturator notch
  - Humeral head more than twice (lateromedially) longer than (craniocaudally)
    broad in proximal view
  - Ischiadic peduncle of ilium not significantly projected ventrally relative
    to pubic peduncle
appearance:
  features:
    - enlarged pedal claws
    - reduced outer digit
  integument: scaled
  evidence: inferred
