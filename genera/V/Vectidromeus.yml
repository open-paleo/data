genus: Vectidromeus
parent: Hypsilophodontidae
etymology: "Combines 'Vectis', the Roman name for the Isle of Wight, England, with Greek 'dromeus' meaning 'runner'."
pronunciation:
  phonetic: VEK-tee-DROH-me-us
description: Vectidromeus is an extinct genus of hypsilophodontid ornithopod
  dinosaur from the Early Cretaceous Wessex Formation of England. The genus
  contains a single species, V. insularis, known from a partial skeleton
  belonging to a juvenile individual.
dispute:
  summary: >
    Vectidromeus was assigned to Hypsilophodontidae as the sister taxon of
    Hypsilophodon by Longrich and others (2024) on the basis of
    morphological comparison; no cladistic analysis was performed, and the
    holotype is a juvenile.
  history:
    - date: "2026-06-29"
      note: Placed at Hypsilophodontidae following Longrich and others (2024); the assignment rests on morphological comparison rather than a phylogenetic analysis.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Neural spines of dorsal vertebrae with convex dorsal margin, unlike straight
    margin in Hypsilophodon
  - Ilium with short, ventrally directed pubic peduncle contrasting with long
    anteriorly projecting peduncle in other basal neornithischians
  - Posterior iliac blade proportionately short and deep, derived condition
  - Brevis fossa broadly exposed laterally, extending anteriorly towards
    ischiadic peduncle
  - Ischium with broad, rectangular distal blade and small, weakly demarcated
    obturator process
  - Femur with large, broad fourth trochanter with crescentic proximal margin
    and wide triangular tip
appearance:
  integument: scaled
  evidence: inferred
