genus: Velafrons
parent: Corythosaurini
etymology: From Latin vela meaning 'sail' and frons meaning 'forehead' or 'brow'; translates as 'sailed forehead,' referring to its bony crest
pronunciation:
  phonetic: VEE-luh-FRONZ
description: Velafrons is a genus of lambeosaurine hadrosaurid dinosaur from the
  Late Cretaceous of Mexico. It is known from a mostly complete skull and
  partial skeleton of a juvenile individual, with a bony crest on the forehead.
  Its fossils were found in the late Campanian-aged Cerro del Pueblo Formation
  (about 73.5 million years ago), near Rincon Colorado, Coahuila. The type
  specimen is CPC-59, and the type species is V. coahuilensis.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Quadrate with narrow quadratojugal notch
  - Postorbital with dorsally positioned, high arching squamosal process
  - Ceratobranchial with rounded anterior end
  - Flat fan-like crest created by nasals and premaxillae
  - Jugal with poorly developed posteroventral flange positioned more
    posteriorly, with anteriorly recurved posterior process
  - Well-developed raised squamosal shelf
