genus: Volkheimeria
parent: Gravisauria
pronunciation:
  phonetic: VOLK-hie-MEER-ee-a
etymology: Named in honor of Wolfgang Volkheimer, an Argentine paleontologist and palynologist who contributed to the study of Jurassic formations in Argentina.
description: Volkheimeria is an extinct genus of sauropod dinosaurs that lived
  in what is now Argentina during the Early Jurassic, about 179–178 million
  years ago. Its type and only species is Volkheimeria chubutensis.
diet: herbivore
locomotion: quadrupedal
