genus: Volkheimeria
parent: Gravisauria
pronunciation:
  phonetic: VOLK-hie-MEER-ee-a
etymology: Named in honor of Wolfgang Volkheimer, an Argentine paleontologist and palynologist who contributed to the study of Jurassic formations in Argentina.
description: Volkheimeria is an extinct genus of sauropod dinosaurs that lived
  in what is now Argentina during the Early Jurassic, about 179-178 million
  years ago. Its type and only species is Volkheimeria chubutensis.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - lacustrine
diagnostic_features:
  - Ischium primitive, Cetiosaurus type, with distal thickening
  - Ilium shorter and higher than in Patagosaurus
  - Pubis with proximal region shorter anterior-posteriorly
  - Tibia to femur ratio 1:1.7
  - Neural spines of dorsal vertebrae laterally compressed
  - Neural arches very low on dorsal vertebrae
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "38661"
  - source: wikidata
    id: Q139170
  - source: gbif
    id: "4822744"
species:
  - name: Volkheimeria chubutensis
    etymology: "Named for Chubut Province, Argentina, where the holotype was discovered."
    status: valid
    type_species: true
    period:
      name:
        - Early Jurassic
      stage:
        - Toarcian
    location:
      country: AR
      locality: Cerro Cóndor South
      region: AR-U
      formation: Cañadón Asfalto
      part: lower
      notes: >
        Pol and colleagues (2022) report that "The base of the Cañadón
        Asfalto Formation was dated at 179.17 ± 0.12 Ma, and the
        uppermost levels of this unit were dated at 178.07 ± 0.21 Ma",
        and that "The locality where Volkheimeria and Patagosaurus were
        found is stratigraphically bracketed between the horizons of
        these two dates", placing them "into the middle Toarcian (ca
        179–178 Ma)". That replaces the early Middle Jurassic age Cúneo
        and colleagues (2013) gave these sauropods.
    type_specimen:
      specimen_id: [PVL 4077]
      specimen_type: holotype
      institution: PVL
      material: Incomplete postcranial skeleton with distinct diagnostic features
      completeness: partial
    size:
      length_m:
        min: 8.7
        max: 8.7
      hip_height_m:
        min: 2
        max: 2
    erected_in: bonaparte1979a
references:
  - id: bonaparte1979a
  - id: cúneo2013a
    notes: Dates the interval overlying the uppermost basalt flow at Cerro
      Cóndor, which holds this taxon, as Aalenian to probably Bajocian, with a
      latest Toarcian age not precluded near the basalt.
  - id: jones2026b
    notes: Source of the body length and hip height estimates.
  - id: pol2022a
    notes: Brackets the type locality between U-Pb dates in the middle Toarcian.
  - id: pol2020a
    notes: Source of the U-Pb dates for the base and top of the formation.
