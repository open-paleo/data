genus: Vayuraptor
parent: Megaraptora
pronunciation:
  phonetic: VAH-yoo-RAP-tor
etymology: "Named for Vayu, the Hindu god of wind, combined with Latin 'raptor' meaning 'thief', chosen to reflect the animal's inferred speed and agility."
description: Vayuraptor is a genus of basal coelurosaurian (possibly
  megaraptoran) theropod dinosaur that lived in the Early Cretaceous (Barremian)
  Sao Khua Formation of Thailand. The genus contains a single species, V.
  nongbualamphuensis, known from a partial skeleton.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Astragalus has two short horizontal grooves and two foramina at base of
    ascending process
  - Ascending process of astragalus is straight laterally and straight and
    parallel medially at base; medial rim slopes to tip laterally
  - Vertical ridge on ascending process of astragalus from tip disappearing
    above middle of process
  - Extremely high and narrow ascending process with ascending process
    height/width ratio of 1.66
  - Tibia length more than 12 times anteroposterior width at mid-length (ratio
    of 13.9)
