genus: Vectaerovenator
parent: Tetanurae
etymology: Named after Vectis (the Latin name for the Isle of Wight), combined with Latin aero meaning 'air' (referring to the pneumaticity of the vertebrae) and venator meaning 'hunter'; translates as 'Isle of Wight air-filled hunter'
pronunciation:
  phonetic: vec-TER-oh-VEN-uh-tuh
description: Vectaerovenator is a genus of tetanuran theropod from the Early
  Cretaceous period of what is now England (Lower Greensand Group; Ferruginous
  Sands). It contains one species, Vectaerovenator inopinatus; its holotype,
  consisting of the specimens IWCMS 2020.400, 2020.407, and 2019.84, comprises
  two anterior dorsal vertebrae, a cervical vertebra and a mid‐caudal vertebra
  from the late Aptian Ferruginous Sands of the Isle of Wight in southern
  England, discovered in 2019. Comparative anatomical analysis shows that this
  taxon shares homoplastic features with megalosauroids, carcharodontosaurs, and
  some coelurosaurs, and cannot be reliably placed beyond Tetanurae incertae
  sedis, but has enough autapomorphies that it can be considered a valid genus.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - coastal
diagnostic_features:
  - Conspicuous lateral furrow between lateral margin of postzygapophysis and
    prezygoepipophyseal lamina in cervical vertebrae
  - Convex spinoprezygapophyseal laminae in anterior cervical vertebra
  - Curved lamina bisecting the postzygocentrodiapophyseal fossa
  - External extension of air sac ventral to parapophysis of anterior dorsal
    vertebra
  - Complex partitioning of anteriormost dorsal pneumatic foramen into multiple
    internal pneumatic features
  - Anterior articular facet of anterior dorsal vertebrae wider than centrum
    creating T-shaped vertebra in dorsal/ventral view
  - Shallow fossae lateral to base of postzygapophyses in mid caudal vertebrae
