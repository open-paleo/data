genus: Valdosaurus
parent: Dryosauridae
pronunciation:
  phonetic: VAL-do-SAWR-us
etymology: "From 'valdo', a modification of Old English 'weald' meaning 'a wood'
  (referring to the Weald region of England), combined with Greek 'sauros'
  meaning 'lizard'."
description: Valdosaurus is a genus of bipedal herbivorous dryosaurid dinosaur
  known from the Early Cretaceous of the Isle of Wight and elsewhere in England.
  Originally its remains were believed to belong to Hypsilophodon. In 1889,
  Richard Lydekker assigned them to Camptosaurus, alongside a partial lower jaw,
  and applied the name Camptosaurus valdensis. In the 1970s, Peter Galton
  reassigned these remains to a new species of Dryosaurus, then to an entirely
  new genus and species, that being Valdosaurus proper. The type and only
  species of Valdosaurus, named by Galton, is V. canaliculatus.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
