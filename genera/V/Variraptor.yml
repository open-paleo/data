genus: Variraptor
parent: Dromaeosauridae
placement: incertae sedis
dispute:
  summary: >
    Variraptor mechinorum was erected as a French dromaeosaurid on vertebrae
    and a humerus (Le Loeuff and Buffetaut, 1998). Allain and Taquet (2000)
    found no distinguishing features on the holotype and noted that most of
    the diagnosis rests on a vertebra from another locality, and treated it as
    a nomen dubium; Turner and colleagues (2012) agree. Moutrille and colleagues
    (2025) find the sacral features non-autapomorphic and the referred material
    possibly from more than one taxon. It is retained provisionally at
    Dromaeosauridae incertae sedis.
  history:
    - date: "2026-07-01"
      note: Retained at Dromaeosauridae incertae sedis; validity contested (possible nomen dubium, possible synonym of Pyroraptor).
    - date: "2026-10-09"
      note: Type species set to nomen dubium and diagnostic features removed, following Allain and Taquet (2000) and Turner and colleagues (2012). A citation for a basal dromaeosaurid placement was removed, as the paper cited does not discuss Variraptor; the placement is left for a separate review.
pronunciation:
  phonetic: VARR-i-rap-tor
  ipa: /ˈværɪræptər/
etymology: "From Latin Varus (referring to the Var River in the Alpes-Maritimes
  of southern France where it was found) and Latin raptor ('thief' or
  'plunderer'), meaning 'Var thief'"
description: Variraptor is a possibly dubious and potentially chimaeric genus of
  dromaeosaurid theropod dinosaur from the Late Cretaceous of France.
diet: carnivore
locomotion: bipedal
