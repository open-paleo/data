genus: Variraptor
parent: Dromaeosauridae
pronunciation:
  phonetic: VARR-i-rap-tor
  ipa: /ˈværɪræptər/
etymology: "From Latin Varus (referring to the Var River in the Alpes-Maritimes
  of southern France where it was found) and Latin raptor ('thief' or
  'plunderer'), meaning 'Var thief'"
description: Variraptor is a possibly dubious and potentially chimaeric genus of
  dromaeosaurid theropod dinosaur from the Late Cretaceous of France.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Cervico-dorsal vertebrae bear two pleurocoels
  - Humerus with strongly developed medial tubercle, more prominent than in
    Deinonychus
  - Sacrum consists of five coossified sacral vertebrae
  - Well-developed deltopectoral crest and internal tubercle on humerus
  - Sacrocaudal vertebra has trapezoidal centrum with aliform transverse
    processes
appearance:
  integument: feathered
  evidence: direct
