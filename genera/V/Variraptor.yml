genus: Variraptor
parent: Paraves
placement: incertae sedis
dispute:
  summary: >
    Le Loeuff and Buffetaut (1998) erected Variraptor mechinorum as a
    dromaeosaurid on a sacrum and last dorsal vertebra, referring a humerus, a
    femur and vertebrae partly from another locality. Hartman and colleagues (2019)
    recover it beside Bambiraptor among early microraptorians, and Cau and
    Madzia (2021) among unenlagiines. Allain and Pereda-Suberbiola (2003) find
    its dromaeosaurid identity far from certain, Senter and colleagues (2004)
    could not confirm it as a deinonychosaur, and Turner and colleagues (2012)
    find no characters diagnostic of Dromaeosauridae. Moutrille and colleagues
    (2025) compare a referred cervicodorsal with the eudromaeosaur Shri and the
    type-locality ilium with early dromaeosaurids and avialans. Placed at
    Paraves incertae sedis, the node common to these readings.
  history:
    - date: "2026-07-01"
      note: Retained at Dromaeosauridae incertae sedis; validity contested (possible nomen dubium, possible synonym of Pyroraptor).
    - date: "2026-10-09"
      note: Type species set to nomen dubium and diagnostic features removed, following Allain and Taquet (2000) and Turner and colleagues (2012). A citation for a basal dromaeosaurid placement was removed, as the paper cited does not discuss Variraptor; the placement is left for a separate review.
    - date: "2026-10-09"
      note: >
        Moved from Dromaeosauridae to Paraves incertae sedis, since the
        holotype cannot be shown to be a dromaeosaurid. The Cau and Madzia
        (2021) citation is restored, as Variraptor appears in that paper's
        tree figure.
pronunciation:
  phonetic: VARR-i-rap-tor
  ipa: /ˈværɪræptər/
etymology: "From Latin Varus (referring to the Var River in the Alpes-Maritimes
  of southern France where it was found) and Latin raptor ('thief' or
  'plunderer'), meaning 'Var thief'"
description: Variraptor is a dubious and possibly chimeric genus of paravian
  theropod dinosaur from the Late Cretaceous of France.
diet: carnivore
locomotion: bipedal
paleoenvironment:
