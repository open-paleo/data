references:
  - id: leloeuff1998a
  - id: jones2026c
    notes: Source of the body length estimate.
  - id: allain2000a
    notes: Argued the Variraptor holotype lacks distinguishing features.
  - id: turner2012a
    notes: Agrees with Allain and Taquet (2000) that the holotype is
      nondiagnostic and treats Variraptor mechinorum as a nomen dubium.
  - id: allain2003a
    notes: Finds the dromaeosaurid identity of the holotype far from certain
      and the referred material's association very doubtful.
  - id: senter2004a
    notes: Could neither confirm nor rule out deinonychosaurian status.
  - id: hartman2019a
    notes: Recovers Variraptor as sister to Bambiraptor among early
      microraptorians; it joins Unenlagiinae in three more steps.
  - id: cau2021a
    notes: Includes Variraptor as a pruned terminal ("k" in Fig. 6) whose
      alternative positions all fall within Unenlagiinae.
  - id: moutrille2025a
    notes: Finds the sacral features of Variraptor non-autapomorphic and the
      referred material possibly from two or more taxa.
