genus: Variraptor
parent: Dromaeosauridae
dispute:
  summary: >
    The validity of Variraptor mechinorum is contested. It was erected as a French
    dromaeosaurid on vertebrae and a humerus (Le Loeuff and Buffetaut, 1998), but
    Allain and Taquet (2000) argued the holotype lacks distinguishing features and
    treated it as a nomen dubium, a view others have disputed. Where analyzed it
    has been placed as a basal dromaeosaurid (Cau and Madzia, 2021). It is retained
    provisionally at Dromaeosauridae incertae sedis.
  history:
    - date: "2026-07-01"
      note: Retained at Dromaeosauridae incertae sedis; validity contested (possible nomen dubium, possible synonym of Pyroraptor).
pronunciation:
  phonetic: VARR-i-rap-tor
  ipa: /ˈværɪræptər/
etymology: "From Latin Varus (referring to the Var River in the Alpes-Maritimes
  of southern France where it was found) and Latin raptor ('thief' or
  'plunderer'), meaning 'Var thief'"
description: Variraptor is a possibly dubious and potentially chimaeric genus of
  dromaeosaurid theropod dinosaur from the Late Cretaceous of France.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Cervico-dorsal vertebrae bear two pleurocoels
  - Humerus with strongly developed medial tubercle, more prominent than in
    Deinonychus
  - Sacrum consists of five coossified sacral vertebrae
  - Well-developed deltopectoral crest and internal tubercle on humerus
  - Sacrocaudal vertebra has trapezoidal centrum with aliform transverse
    processes
appearance:
  integument: feathered
  evidence: direct
