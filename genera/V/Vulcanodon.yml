genus: Vulcanodon
parent: Gravisauria
pronunciation:
  phonetic: vuhl-KAYN-o-don
etymology: Named after the volcano near which it was found in Zimbabwe, combined
  with Greek odon meaning 'tooth'; translates as 'volcano tooth'
description: Vulcanodon is an extinct genus of sauropod dinosaur from the Early
  Jurassic uppermost Forest Sandstone of southern Africa. The only known species
  is V. karibaensis. Discovered in 1969 in Zimbabwe, it was regarded as the
  earliest known sauropod for decades, and is still one of the most primitive
  genera that has been discovered.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - arid
diagnostic_features:
  - Sacrum of four fused vertebrae
  - Pubis and ischium broadly articulated, the ischium longer than the pubis
  - Pubes forming a prominent, anteriorly facing distal apron, lacking a distinct
    tubercle for m. ambiens
  - Ischia forming the major part of the acetabulum
  - Ilium with a very long pubic peduncle and a very short ischiadic peduncle
  - Humerus weakly flared, about two-thirds the length of the femur
  - Forelimb about 78% the length of the hindlimb
  - Femur straight and columnar, lacking sigmoidal curvature
  - Tibia short and robust with expanded ends, about 58% the length of the femur
  - Astragalus with a prominent lateral peg and a height-to-length ratio of ~1.18
  - Greatly enlarged hallux ungual
