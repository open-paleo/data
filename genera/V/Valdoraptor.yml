genus: Valdoraptor
parent: Tetanurae
placement: incertae sedis
dispute:
  summary: >
    Valdoraptor is based on a partial metatarsus, and its affinity is contested.
    Naish and Martill (2007) regarded the metatarsus as diagnostic and discussed
    it among possible Wealden allosauroids. Allain and colleagues (2014) found its
    diagnostic characters homoplastic, including a compressed metatarsal II also
    seen in noasaurids, and treated it as a nomen dubium while referring it to
    Ornithomimosauria on comparison with the Angeac-Charente theropod. Cau and
    Paterna (2025) have since recovered that theropod within Abelisauroidea.
  history:
    - date: "2026-06-30"
      note: >
        Retained at Ornithomimosauria following Allain and colleagues (2014); its status as
        a nomen dubium and the alternative noasaurid affinity are recorded as
        unresolved.
    - date: "2026-09-28"
      note: >
        Moved to Tetanurae incertae sedis, the nearest node spanning the
        allosauroid (Naish and Martill, 2007) and ornithomimosaur (Allain and colleagues, 2014) referrals; status set to nomen dubium following Allain and colleagues
        (2014).
etymology: From Latin 'Valdus' (Wealden, referring to the Wealden Group) and
  'raptor' (plunderer); meaning 'Wealden plunderer'.
pronunciation:
  phonetic: VALD-o-RAP-tor
description: >
  Valdoraptor is a genus of theropod dinosaur
  from the Early Cretaceous of England. It is known only from bones
  of the feet. The holotype, BMNH R2559 (incorrectly given by Owen
  as BMNH R2556), was found near Cuckfield in layers of the
  Grinstead Clay Formation dating from the late Valanginian.
  The specimen is damaged, lacking parts of the upper and lower
  ends. It has a conserved length of 21.5 centimeters (8.5 in) and
  an estimated total length of 24 centimeters (9.4 in). If an
  ornithomimosaur, it would be the first known from England and the
  earliest record of the group.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Metatarsal II mediolaterally compressed.
  - Prominent dorsolateral ridge on metatarsal II.
appearance:
  integument: feathered
  evidence: inferred
identifiers:
  - source: pbdb
    id: "68141"
  - source: wikidata
    id: Q1576716
  - source: gbif
    id: "4821748"
species:
  - name: Valdoraptor oweni
    etymology: Named in honor of Sir Richard Owen, who first described the
      type metatarsus material (as belonging to Hylaeosaurus sp.).
    status: nomen dubium
    type_species: true
    period:
      name:
        - Early Cretaceous
      stage:
        - Valanginian
    location:
      country: GB
      locality: Cuckfield
      region: GB-WSX
      formation: Grinstead Clay
    type_specimen:
      specimen_id:
        - BMNH R2559
      specimen_type: holotype
      institution: NHMUK
      material: Three associated metatarsals (II, III, IV) of a single left
        foot in Wealden matrix; proximal ends broken obliquely, inner bone
        retains distal articular surface, middle has partial distal surface,
        outer distal end missing.
      completeness: fragmentary
    erected_in: olshevsky1991a
    synonyms:
      - name: Megalosaurus oweni
        type: reassigned
        reason: Original combination named by Lydekker (1889) for the
          Cuckfield metatarsus material that Owen (1858) had earlier
          referred to Hylaeosaurus sp.
      - name: Altispinax oweni
        type: reassigned
        reason: Reassignment by von Huene (1923) of Lydekker's Megalosaurus
          oweni to Altispinax; subsequently moved to Valdoraptor by
          Olshevsky (1991).
references:
  - id: owen1858a
    notes: Refers three metatarsals to Hylaeosaurus sp.; a mirrored lithograph
      caused over a century of confusion about which foot was preserved, and
      the catalog number Owen gave (2556) is incorrect.
  - id: lydekker1889a
    notes: Names Megalosaurus oweni for the metatarsus Owen had referred to
      Hylaeosaurus, separating it from M. dunkeri on size; later
      reassigned through Altispinax to Valdoraptor.
  - id: olshevsky1991a
    notes: Erects Valdoraptor as a new genus for Lydekker's Megalosaurus oweni,
      removing it from both Megalosaurus and von Huene's Altispinax; tentatively
      places it in Allosauridae pending further study.
  - id: naish2007a
    notes: Calls the metatarsus, with a compressed, dorsolaterally ridged
      metatarsal II, diagnostic, and lists Valdoraptor among possible Wealden
      allosauroids.
  - id: allain2014a
    notes: Finds the diagnostic characters homoplastic and treats Valdoraptor as a
      nomen dubium, but refers the holotype to Ornithomimosauria on comparison
      with Angeac-Charente metatarsals.
  - id: huene1923a
    notes: Reassigned Megalosaurus oweni to Altispinax.
  - id: allain2022a
    notes: Retains the Angeac-Charente theropod in Ornithomimosauria on an
      anatomical survey, without a phylogenetic analysis.
  - id: cau2025a
    notes: Recovers the Angeac-Charente theropod, the comparison material for the
      ornithomimosaur referral, within Abelisauroidea.
