genus: Viavenator
parent: Furileusauria
etymology: From Latin via meaning 'road' and venator meaning 'hunter'; translates as 'road hunter'
pronunciation:
  phonetic: VY-ah-VEN-uh-tuh
description: Viavenator is a genus of carnivorous abelisaurid theropod dinosaur
  that lived in the Santonian-aged (Late Cretaceous) Bajo de la Carpa Formation
  of Argentina. Only a single species is known, V. exxoni, formally described in
  2016 by Filippi and colleagues.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - arid
diagnostic_features:
  - Parietal depression transversally compressed on both sides of supraoccipital
    crest
  - Small paraoccipital processes with ventral edge above occipital condyle level
  - Basioccipital-opisthotic complex about 2.5× occipital condyle width
  - High crest below occipital condyle, diverging laterally toward basal
    tubercles
  - Basisphenoidal recess highly developed with sub-circular contour opening
    ventrally
  - Mid and posterior cervical centra with slightly convex lateral and ventral
    surfaces
  - Hyposphene-hypantrum articulation present from dorsal vertebra 2
  - Interspinous accessory articulation system in middle and posterior dorsal
    vertebrae
  - Pair of pneumatic foramina within prespinal fossa in anterior caudal
    vertebrae
  - Distal end of scapular blade posteriorly recurved
