  - source: pbdb
    id: "294729"
  - source: wikidata
    id: Q18592184
species:
  - name: Vahiny depereti
    etymology: "Named in honor of Charles Depéret, who described the original
      dinosaur material from Madagascar and presciently recognized the sauropod
      nature of the Malagasy osteoderms."
    status: valid
    type_species: true
    period:
      name:
