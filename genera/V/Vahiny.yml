genus: Vahiny
parent: Lithostrotia
etymology: From Malagasy meaning 'traveler'
description: Vahiny is an extinct genus of titanosaur sauropod dinosaur known
  from the Late Cretaceous of the Maevarano Formation, northwestern Madagascar.
  It contains a single species, Vahiny depereti.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - arid
diagnostic_features:
  - Basal tubera composed mainly of basioccipital with reduced basisphenoid
    contribution
  - Thick web of bone separating basipterygoid embayment from basal tubera,
    visible posteriorly
  - Paired blind fossae between basipterygoid processes and parasphenoid rostrum
  - Ventrally keeled and dorsally troughed parasphenoid rostrum
  - Foramina for cranial nerves V, III, and II are co-linear; metotic foramen
    displaced ventrally from them
