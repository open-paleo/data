genus: Vectiraptor
parent: Eudromaeosauria
etymology: "Combines Latin 'Vectis' meaning 'Isle of Wight' and Latin 'raptor' meaning 'thief'; the species name honors discoverer Mick Green."
pronunciation:
  phonetic: VEC-tee-RAP-tuh
description: Vectiraptor is a genus of dromaeosaurid dinosaur from the Barremian
  aged Wessex Formation of the United Kingdom. The type and only species is
  Vectiraptor greeni, known from associated dorsal vertebrae and a partial
  sacrum.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Infradiapophysial fossae divided by thin accessory lamina in anterior dorsals
  - Massive neural spines with broad interspinous ligament scars
  - Dorsal centra with camellate pneumatic internal architecture
  - Large, greatly expanded neural canals in dorsal and sacral vertebrae
  - Deep, triangular infrapostzygapophyseal fossae
  - Sacral centra lacking pneumatic foramina despite pneumatized dorsals
appearance:
  integument: feathered
  evidence: direct
