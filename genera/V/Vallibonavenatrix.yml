genus: Vallibonavenatrix
parent: Spinosauridae
placement: incertae sedis
dispute:
  summary: >
    Vallibonavenatrix cani was described as a spinosaurine (Malafaia et al.,
    2020) and again recovered as a spinosaurine by Rauhut et al. (2025), but its
    position is unstable across other analyses, which recover it as a
    baryonychine or a basal spinosaurid outside both subfamilies (Barker et al.,
    2021; Mateus and Estraviz-López, 2022) or, as an unstable-wildcard result, a
    megalosaurid (Isasmendi et al., 2024). Spinosauridae is the least-inclusive
    clade the credible hypotheses accept.
  history:
    - date: "2026-07-01"
      note: Placed at Spinosaurinae following the describing paper and Rauhut et al. (2025); its position is unstable across analyses.
    - date: "2026-07-09"
      note: Broadened to Spinosauridae incertae sedis. The subfamily placement
        flip-flops across analyses (spinosaurine, baryonychine, or basal
        spinosaurid outside both subfamilies), so the conservative shared node
        is adopted.
pronunciation:
  phonetic: va-yee-BO-nuh-ven-AY-triks
etymology: Named after Vallibona, the town in Castellón, Spain near where its remains were found, combined with Latin venatrix meaning 'huntress'; translates as 'Vallibona huntress'
description: Vallibonavenatrix is a genus of spinosaurid dinosaur from the Early
  Cretaceous (Barremian) Arcillas de Morella Formation of Castellón, Spain. The
  type and only species is Vallibonavenatrix cani, known from a partial
  skeleton.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Moderately high dorsal neural spines relative to centrum height
  - Deep pleurocoelous fossae and pneumatic foramina in sacral vertebrae
  - Strongly pneumatic ilium with large internal camerae
  - Broad and flat platform on ventromedial surface of postacetabular blade of
    ilium
  - Strong ventral torsion of ischium diaphysis
