notable_specimens:
  - nickname: Fighting Dinosaurs
    specimen_id: [MPC-D 100/25]
    institution: MPC
    species: Velociraptor mongoliensis
    category: iconic
    significance: "Famous specimen preserving a Velociraptor and a Protoceratops in combat, giving direct evidence of predatory behavior, with one sickle claw apparently embedded in the prey's throat. Rapidly buried in dune sand in lifelike poses; a national treasure of Mongolia."
    discovered:
      year: 1971
      by: "Polish-Mongolian team"
    references: [barsbold1983]
  - specimen_id: [MPC-D 100/54]
    institution: MPC
    species: Velociraptor mongoliensis
    category: gut-contents
    significance: "Roughly sub-adult individual found with the bones of an azhdarchid pterosaur within its stomach cavity, interpreted as scavenging. The pterosaur bones lacked digestion damage, and the animal carried a broken rib showing signs of healing; it likely died soon after, possibly from the earlier injury."
    references: [hone2012]
  - specimen_id: [MPC-D 100/976]
    institution: MPC
    species: Velociraptor mongoliensis
    category: pathology
    significance: "Skull bearing two parallel rows of small punctures on the frontal bones matching the spacing and size of Velociraptor teeth, interpreted as a likely fatal intraspecific bite wound; the bone shows no sign of healing and the specimen was not scavenged. From the Tugrik Shireh locality."
    references: [norell1995c]
  - specimen_id: [IGM 100/2000]
    institution: IGM-MN
    species: Velociraptor mongoliensis
    category: ontogeny
    significance: "Juvenile Velociraptor represented by a complete skeleton including the skull of a young individual, from the Tugriken Shireh locality of the Djadochta Formation, documenting an early growth stage of the taxon."
    discovered:
      by: "Mongolian-Japanese Palaeontological Expeditions"
    references: [barsbold1999]
