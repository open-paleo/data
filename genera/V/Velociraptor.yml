        - 106.7239
    type_specimen:
      specimen_id:
        - IMM 99NM-BYM-3/3
      specimen_type: holotype
      institution: IMM
      material: Paired maxillae and a left lacrimal.
    diagnostic_features:
      - Ten maxillary teeth (most V. mongoliensis specimens have eleven or more).
      - Promaxillary fenestra subequal in size to the maxillary fenestra and
        teardrop-shaped (reduced and slit-like in V. mongoliensis).
      - Maxillary fenestra relatively large (much smaller in V. mongoliensis).
      - No longitudinal ridge between the alveolar border and the row of
        neurovascular foramina on the maxilla (present in V. mongoliensis).
      - Denticles on the maxillary teeth weakly developed, with only incipient
        serrations on the distal carina (more distinct in V. mongoliensis).
      - Ascending process of the lacrimal less straight than in V. mongoliensis.
    erected_in: godefroit2008b
notable_specimens:
  - nickname: Fighting Dinosaurs
    specimen_id:
      - MPC-D 100/25
    institution: MPC
    species: Velociraptor mongoliensis
    category: iconic
    significance: Famous specimen preserving a Velociraptor and a Protoceratops in
      combat, giving direct evidence of predatory behavior, with one sickle claw
      apparently embedded in the prey's throat. Rapidly buried in dune sand in
      lifelike poses; a national treasure of Mongolia.
    discovered:
      year: 1971
      by: Polish-Mongolian team
    references:
      - barsbold1983a
  - specimen_id:
      - MPC-D 100/54
    institution: MPC
    species: Velociraptor mongoliensis
    category: gut-contents
    significance: Roughly sub-adult individual found with the bones of an azhdarchid
      pterosaur within its stomach cavity, interpreted as scavenging. The
      pterosaur bones lacked digestion damage, and the animal carried a broken
      rib showing signs of healing; it likely died soon after, possibly from the
      earlier injury.
    references:
      - hone2012a
  - specimen_id:
      - MPC-D 100/976
    institution: MPC
    species: Velociraptor mongoliensis
    category: pathology
    significance: Skull bearing two parallel rows of small punctures on the frontal
      bones matching the spacing and size of Velociraptor teeth, interpreted as
      a likely fatal intraspecific bite wound; the bone shows no sign of healing
      and the specimen was not scavenged. From the Tugrik Shireh locality.
    references:
      - norell1995c
  - specimen_id:
      - IGM 100/2000
    institution: MPC
    species: Velociraptor mongoliensis
    category: ontogeny
    significance: Juvenile Velociraptor represented by a complete skeleton including
      the skull of a young individual, from the Tugriken Shireh locality of the
      Djadochta Formation, documenting an early growth stage of the taxon.
    discovered:
      by: Mongolian-Japanese Palaeontological Expeditions
    references:
      - barsbold1999a
references:
  - id: osborn1924b
    notes: Erects Velociraptor mongoliensis on AMNH 6515 from the Djadokhta
      Formation at Shabarakh Usu; same paper also names Saurornithoides and
      Oviraptor.
  - id: barsbold1983a
    notes: Reviews substantial new Velociraptor material (including the Fighting
      Dinosaurs specimen MPC-D 100/25) and erects the subfamily
      Velociraptorinae.
  - id: hone2012a
  - id: norell1995c
  - id: barsbold1999a
  - id: norell2006a
    notes: Describes Tsaagan mangas and supplies modern comparative cranial
      diagnoses for Velociraptor mongoliensis (lacrimal boss, pneumatic axis,
      prootic tympanic recess, strong cervical epipophyses).
  - id: jones2026c
    notes: Source of the hip height estimate, and the appearance features.
  - id: turner2007c
    notes: Reported quill knobs on the ulna of Velociraptor.
  - id: godefroit2008b
    notes: Original description of Velociraptor osmolskae on cranial material from
      the Bayan Mandahu Formation of Inner Mongolia.
