genus: Velociraptor
parent: Velociraptorinae
etymology: From Latin velox (swift) and raptor (thief, plunderer); meaning
  "swift thief", chosen by Osborn to evoke the rapid, predatory habits inferred
  from the holotype's slender skull and recurved unguals.
pronunciation:
  phonetic: vee-LOHS-i-RAP-tor
  ipa: /vəˌlɒsɪˈræptər/
description: >
  Velociraptor is a small dromaeosaurid theropod from the late Campanian of
  central Asia, defined by a long, low skull, recurved serrated teeth, and a
  hyperextensible sickle-clawed second pedal digit. Osborn erected the genus and
  the type species V. mongoliensis in 1924 on a partial skull and front-limb
  claw collected by Peter Kaisen in August 1923 at the Flaming Cliffs (Shabarakh
  Usu / Bayn Dzak) of the Djadokhta Formation in central Mongolia, during the
  Central Asiatic Expedition of the American Museum of Natural History.
  Soviet-Mongolian expeditions during the 1960s-70s recovered substantially more
  material, culminating in the famous "Fighting Dinosaurs" specimen (MPC-D
  100/25), a near-complete skeleton of V. mongoliensis preserved in a death
  struggle with a Protoceratops andrewsi from Tugrugeen Shire. Barsbold (1983)
  reviewed the new material and erected Velociraptorinae for the genus. Turner
  et al. (2007) reported quill knobs on the ulna of a V. mongoliensis specimen,
  providing direct anatomical evidence for pennaceous wing feathering — making
  Velociraptor one of the better-attested feathered non-avian dinosaurs.
  Velociraptor's cultural prominence outside paleontology stems primarily from
  its oversized depiction in the Jurassic Park franchise, which conflates V.
  mongoliensis with the much larger Deinonychus antirrhopus.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - arid
appearance:
  features:
    - elongate snout
    - sickle claw
    - quill knobs
  integument: feathered
  evidence: direct
diagnostic_features:
  - Long, low skull with elongated face and greatly enlarged orbits;
    faciocranial index approximately 170%.
  - Postorbital region of the cranium extremely abbreviated; jaws excessively
    long and slender.
  - Teeth recurved and unilaterally or bilaterally serrate, set in relatively
    wide interdental spaces; about 11 maxillary and 14 dentary teeth.
  - Pronounced lacrimal boss at the dorsal margin of the preorbital bar;
    lacrimal broadly exposed on the skull roof.
  - Cervical centra with strongly developed epipophyses overhanging the
    postzygapophyseal facets; axis centrum pneumatic.
  - Anterior caudal vertebrae bearing elongate ossified tendons of the
    prezygapophyses and chevrons that form a stiffening sheath over 8-10
    caudals.
  - Pelvis opisthopubic and dolichoiliac, with the pubis directed
    posteroventrally and a shortened ischium bearing a distally placed obturator
    process.
  - Pedal digit II hyperextensible and bearing an enlarged, sickle-shaped
    predatory ungual; metatarsal III mediolaterally pinched proximally and
    slightly shorter than II and IV.
