genus: Veterupristisaurus
parent: Carcharodontosauridae
placement: incertae sedis
dispute:
  summary: >
    Veterupristisaurus milneri, the oldest known carcharodontosaurid, is recovered
    within Carcharodontosauridae (Rauhut, 2011; Kellermann et al., 2025) or as a
    basal member of the wider Carcharodontosauria (Malafaia et al., 2020). Its
    validity has been questioned because its sole diagnostic character is shared with
    Lusovenator (Kellermann et al., 2025). It is placed at Carcharodontosauridae
    incertae sedis.
  history:
    - date: "2026-07-01"
      note: Retained at Carcharodontosauridae incertae sedis; validity relative to Lusovenator is uncertain.
etymology: "From Latin 'veter' meaning 'old' or 'ancient' and Latin 'pristis'
  meaning 'shark', combined with Greek 'sauros' meaning 'lizard', meaning 'old
  shark lizard', referring to Veterupristisaurus being the oldest known
  representative of the carcharodontosaurids"
pronunciation:
  phonetic: veh-TEH-ru-PRIS-tee-SOR-us
description: Veterupristisaurus is an extinct genus of carcharodontosaurid
  theropod dinosaur known from the Jurassic of Tendaguru, Lindi Region of
  southeastern Tanzania.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - coastal
diagnostic_features:
  - Two parallel laminae extending from prezygapophyses posteriorly, unique
    among theropods
  - Strong development of ridge bordering transverse process anteriorly
    extending toward anterior neural arch
  - Very wide centroprezygapophyseal laminae forming funnel-like structure
    around neural canal
  - Strongly developed lateral ridge extending from transverse process
    anteriorly with anterior expansion
  - Rudimentary anterior centrodiapophyseal lamina
appearance:
  integument: scaled
  evidence: inferred
