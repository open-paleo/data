genus: Veterupristisaurus
parent: Carcharodontosauridae
etymology: "From Latin 'veter' meaning 'old' or 'ancient' and Latin 'pristis' meaning 'shark', combined with Greek 'sauros' meaning 'lizard', meaning 'old shark lizard', referring to Veterupristisaurus being the oldest known representative of the carcharodontosaurids"
description: Veterupristisaurus is an extinct genus of carcharodontosaurid
