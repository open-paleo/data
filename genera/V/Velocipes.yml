genus: Velocipes
parent: Saurischia
placement: incertae sedis
dispute:
  summary: >
    Velocipes guerichi is a nomen dubium based on the proximal part of a
    fibula. Rauhut and Hungerbühler (2000) judged the specimen too poorly
    preserved to establish even what bone it is, and treated it as an
    indeterminate vertebrate; Welles (1984) had earlier found the holotype
    undiagnostic. Skawiński and others (2017) re-examined the specimen,
    reaffirmed its identification as a theropod fibula against that view, and
    argued it preserves phylogenetically informative characters, but concluded
    that it cannot be identified more precisely than an indeterminate theropod
    and offered no diagnosis. Earlier referrals to Ceratosauria (Tykoski and
    Rowe, 2004; Weishampel and others, 2004) are not supported by that
    re-examination.
  history:
    - date: "2026-06-30"
      note: >
        Placed at Saurischia incertae sedis, pending resolution of its
        theropod-versus-sauropod affinities.
    - date: "2026-07-02"
      note: >
        Placed at Saurischia incertae sedis; a nomen dubium whose theropod-
        versus-sauropod affinity is unresolved.
    - date: "2026-07-09"
      note: >
        Dispute corrected: the "sauropod" affinity attributed to Skawiński and
        others (2017) is unfounded — that study recovered Velocipes as a basal
        neotheropod. Retained at Saurischia incertae sedis, a nomen dubium whose
        theropod affinity is favored but not secure.
etymology: "From Latin 'velox' meaning 'swift' and 'pes' meaning 'foot',
  translating as 'quick foot'."
pronunciation:
  phonetic: veh-LOH-sih-pez
description: Velocipes is a genus of saurischian dinosaur from the Late Triassic
  that may have been a theropod. Its fossils were found in the Norian-aged
  Lissauer Breccia of southern Poland. Upon discovery, Velocipes was thought to
  have been a coelurosaur, but more recent studies have shown that Velocipes was
  probably a basal theropod or dinosauriform.
