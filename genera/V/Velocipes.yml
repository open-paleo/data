    location:
      country: PL
      locality: Kocury
      region: PL-16
      coordinates:
        - 50.766667
        - 18.433333
      notes: Huene (1932) took the holotype from the Lissauer Breccia at Kocury, an
        informal name for a set of breccia horizons at several stratigraphic
        levels rather than a single erected unit; Skawiński and colleagues
        (2017) call it the Lisów Breccia and reach no formal name for it
        either. They print the position to the whole minute, "50° 46′ N, 18°
        26′ E", in a sentence naming both the forester's lodge, which the
        holotype's label gives as the locality, and an old clay pit about 200
        m north-east of it, where they trace the conglomerate on the bone. The
        two lie well within the precision of the pair.
