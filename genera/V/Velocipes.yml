genus: Velocipes
parent: Saurischia
dispute:
  summary: >
    Velocipes guerichi is a nomen dubium based on a partial fibula,
    variously interpreted as a coelophysoid-grade theropod or, most
    recently, as a neosauropod (Skawinski and others, 2017).
  history:
    - date: "2026-06-30"
      note: >
        Parked at Saurischia and deferred, pending resolution of its theropod-
        versus-sauropod affinities (P2).
    - date: "2026-07-02"
      note: Placed at Saurischia incertae sedis in the theropod-backbone reconciliation; a nomen dubium whose theropod-versus-sauropod affinity is unresolved.
etymology: "From Latin 'velox' meaning 'swift' and 'pes' meaning 'foot',
  translating as 'quick foot'."
pronunciation:
  phonetic: veh-LOH-sih-pez
description: Velocipes is a genus of saurischian dinosaur from the Late Triassic
  that may have been a theropod. Its fossils were found in the Norian-aged
  Lissauer Breccia of southern Poland. Upon discovery, Velocipes was thought to
  have been a coelurosaur, but more recent studies have shown that Velocipes was
  probably a basal theropod or dinosauriform.
diet: carnivore
