genus: Bruhathkayosaurus
parent: Sauropoda
etymology: From Sanskrit bruhath (बृहत्) meaning 'huge, great' + kaya (काय)
  meaning 'body' + Greek sauros (σαῦρος) meaning 'lizard'; overall meaning
  'huge-bodied lizard'.
pronunciation:
  ipa: /bruːˌhæθkeɪoʊˈsɔːrəs/
  phonetic: brih-HUHT-kah-yo-SOR-us
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Gigantic body size with heavy, robust limb bones
  - Large tibia, measuring 2000 mm in length and 380 mm in shaft width, larger
    than that of any carnivorous dinosaur known at the time of description
  - Large ilium with a heavy, posteriorly massive puboischial peduncle
  - Ilial plate broad posteriorly (130 mm) and narrow anteriorly (100 mm), with
    prominent muscular attachment depressions on the dorsal surface
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "77395"
  - source: wikidata
    id: Q38903321
species:
  - name: Bruhathkayosaurus matleyi
    etymology: Named for Matley, who did pioneering work on Indian dinosaurs.
    pronunciation:
      phonetic: MAT-lee-eye
    status: valid
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Maastrichtian
    location:
      country: IN
      locality: North East of Kallamedu Village
      region: IN-TN
      formation: Kallamedu
    size:
      length_m:
        min: 40.0
        max: 40.0
      weight_kg:
        min: 110000.0
        max: 110000.0
    type_specimen:
      specimen_id: [ GSI PAL/SR/20 ]
      specimen_type: holotype
      institution: GSI
      status: lost
      material: A large ilium, 1200 mm in total length and 250 mm in median width,
        with a stout puboischial peduncle 400 mm long
      completeness: fragmentary
    erected_in: yadagiri1987a
references:
