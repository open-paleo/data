genus: Bruhathkayosaurus
parent: Sauropoda
etymology: From Sanskrit bruhath (बृहत्) meaning 'huge, great' + kaya (काय)
  meaning 'body' + Greek sauros (σαῦρος) meaning 'lizard'; overall meaning
  'huge-bodied lizard'.
pronunciation:
  ipa: /bruːˌhæθkeɪoʊˈsɔːrəs/
  phonetic: brih-HUHT-kah-yo-SOR-us
description: Bruhathkayosaurus is a genus of sauropod dinosaur found in the
  Kallamedu Formation of India. The fragmentary remains were originally
  described as a theropod, but it was later determined to be a titanosaur
  sauropod. Length estimates by researchers exceed those of the titanosaur
  Argentinosaurus, as longer than 35 meters (115 ft) and weighing over 80
  tonnes. A 2023 estimate placed Bruhathkayosaurus as potentially weighing
  110-170 tonnes (110-170 long tons; 120-190 short tons), with paleontologist
  Michael Benton, estimating a length of 45 meters (148 ft). If the upper
  estimates of the 2023 records are accurate, Bruhathkayosaurus may have rivaled
  the blue whale as one of the largest animals to ever exist. However, all of
  the estimates are based on the dimensions of the fossils described in 1987,
  but these fossils have since disintegrated and no longer exist, making it
  impossible to affirm these estimates.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Gigantic body size with heavy, robust limb bones
  - Large tibia, measuring 2000 mm in length and 380 mm in shaft width, larger
    than that of any carnivorous dinosaur known at the time of description
  - Large ilium with a heavy, posteriorly massive puboischial peduncle
  - Ilial plate broad posteriorly (130 mm) and narrow anteriorly (100 mm), with
    prominent muscular attachment depressions on the dorsal surface
