genus: Bainoceratops
parent: Protoceratopsidae
etymology: From the Bain-Dzak locality (Mongolian for "rich-in-saxaul",
  the Mongolian name for the Flaming Cliffs of the Gobi Desert) and
  Greek keratops (horned face); meaning "Bain-Dzak horned face".
description: >
  Bainoceratops is a genus of ceratopsian dinosaur from the late
  Campanian in the Late Cretaceous. The type species is B. efremovi.
  Its fossils were found in southern Mongolia in the Djadochta
  Formation.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - arid
diagnostic_features:
  - Presacral vertebral centra with concave cranial surfaces and
    flat caudal surfaces.
  - Diapophyses of the ninth dorsal vertebra circular in cross
    section; interprezygapophyseal spaces of dorsals 9 and 10
    narrow.
  - Synapophyseal facets of the posteriormost dorsal vertebra
    sculptured with a median crest.
