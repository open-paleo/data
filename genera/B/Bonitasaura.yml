genus: Bonitasaura
parent: Colossosauria
etymology: "Named after the La Bonita fossil quarry in Argentina where remains
  were found, combined with Greek sauros meaning 'lizard'. Full meaning: 'La
  Bonita lizard'."
pronunciation:
  phonetic: boh-NEE-tah-SOR-uh
description: Bonitasaura is a genus of titanosaurian dinosaur hailing from
  uppermost layers of the Late Cretaceous (Santonian) Bajo de la Carpa
  Formation, Neuquén Group of the eastern Neuquén Basin, located in Río Negro
  Province, Northwestern Patagonia, Argentina. The remains, consisting of a
  partial sub-adult skeleton jumbled in a small area of fluvial sandstone,
  including a lower jaw with teeth, a partial vertebrae series, and limb bones,
  were described by Sebastian Apesteguía in 2004.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - arid
diagnostic_features:
  - Dentary alveoli reduced in number (three in main ramus, one in angle, up to
    seven in anterior region), teeth restricted to anterior portion of jaw.
  - Middle and posterior region of dentary edentulous, forming a sharp dorsal
    edge (guillotine crest) with a profusely vascularized lateral side
    indicative of a keratinous sheath.
  - Very robust, diagonal neural arch pillars and bulging neural spine summits
    on anterior dorsal vertebrae.
appearance:
  features:
    - keratinous beak
  integument: scaled
  evidence: inferred
