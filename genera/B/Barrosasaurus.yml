genus: Barrosasaurus
parent: Titanosauria
etymology: "Named for the Sierra Barrosa in Neuquén Province, Argentina, combined with Greek 'sauros' meaning 'lizard'. The species name honors Argentine paleontologist Rodolfo Casamiquela."
pronunciation:
  phonetic: bah-RO-sah-SOR-us
description: Barrosasaurus is a genus of titanosaurian sauropod dinosaur, first
  described by paleontologists Leonardo Salgado and Rodolfo Coria in 2009. The
  fossils, consisting of three fossil dorsal (back) vertebrae, are
  well-preserved but incomplete. They were discovered in the Anacleto Formation
  of the Neuquén province of western Argentina. The type species is
  Barrosasaurus casamiquelai. The genus name is named after the Sierra Barrosa
  in Neuquén. The specific epithet honors the Argentinian paleontologist
  Rodolfo Magín Casamiquela. It has been estimated to be 18 meters (60 ft) in
  length and 13.5 tonnes (14.9 short tons) in weight.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Posterior dorsal vertebrae bearing paired, short spinal laminae nearly
    parallel to the prespinal lamina (relictual spinoprezygapophyseal laminae).
  - Well-developed anterior spinodiapophyseal laminae in posterior dorsal
    vertebrae, more strongly developed than the posterior spinodiapophyseal
    laminae in the posteriormost dorsal.
  - Anterior spinodiapophyseal lamina divided into at least two, and up to
    three, branches in the posteriormost dorsal vertebrae.
  - Aliform processes with broad, planar, and rugose laterodorsal surfaces.
  - Portion of neural spine distal to the aliform process is longer than the
    portion proximal to the aliform process, at least in the posterior dorsals.
