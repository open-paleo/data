genus: Borealosaurus
parent: Titanosauria
etymology: "From Greek Boreas meaning 'north wind' and Greek sauros meaning
  'lizard'. Full meaning: 'northern lizard', referring to its northern China
  origin."
description: Borealosaurus is a genus of titanosaurian sauropod dinosaur from
  the Early Cretaceous of northern China. The type species is Borealosaurus
  wimani, which was named in 2004.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - lacustrine
diagnostic_features:
  - Opisthocoelous mid-distal caudal vertebrae (unique among sauropods at time
    of description)
  - Convex proximal articular condyle on mid-distal caudal centrum approximately
    2.5 cm in proximodistal length
  - Neural arch situated on the proximal half of the mid-distal caudal centrum
  - Neural spine oriented more distally than dorsally, positioned above distal
    half of centrum
  - Neural arch height from apex of neural spine to dorsal margin of centrum
    approximately two-fifths the height of the centrum
