genus: Bonatitan
parent: Saltasaurinae
etymology: "Named in honor of Argentine paleontologist José Bonaparte, combined with Greek 'titan' meaning 'giant'. The species name honors Osvaldo Reig."
pronunciation:
  phonetic: BO-nuh-TIE-tuhn
description: Bonatitan is a genus of titanosaurian dinosaur from the Late
  Cretaceous Allen Formation of Argentina. It was named in 2004.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Small paired pits on the frontals
  - Basisphenoid tubera long and narrow, slightly more than twice as long as
    wide
  - Dorsal to middle caudal vertebrae with deep oval to circular pits on both
    sides of the prespinal lamina
  - Anterior caudal vertebra with spino-postzygapophyseal and
    spino-prezygapophyseal laminae
  - Neural arch of anterior caudals with deep interzygapophyseal fossae with
    numerous pits
  - Anterior caudal vertebra with an accessory sub-horizontal lamina extending
    from the anteroventral portion of the postzygapophysis to the mid-portion
    of the spino-prezygapophyseal lamina
  - Anterior caudal vertebra with a prominent axial crest on the ventral surface
    of the centrum
  - Posterior ridge on metacarpal IV
appearance:
  integument: scaled
  evidence: inferred
