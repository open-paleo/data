genus: Bradycneme
parent: Troodontidae
etymology: ponderous leg
description: Bradycneme is a genus of theropod dinosaur from the Upper
  Cretaceous-aged (Maastrichtian) Sânpetru Formation of the Hațeg Basin,
  Transylvania, Romania. The type species is Bradycneme draculae, known only
  from a partial right lower leg (specimen BMNH A1588), which its original
  describers believed it came from a giant owl.
diet: carnivore
