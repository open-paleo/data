genus: Bradycneme
parent: Tetanurae
placement: incertae sedis
dispute:
  summary: >
    Bradycneme rests on a single distal tibiotarsus, described as a giant
    owl (Harrison and Walker, 1975). Csiki and Grigorescu (1998) found it to
    be a non-maniraptoran tetanuran, excluded from the derived coelurosaurs
    by the groove on its astragalar condyles, while Naish and Dyke (2004)
    regard it as an indeterminate maniraptoran by its compressed distal
    shape.
etymology: From Ancient Greek bradys (βραδύς) meaning 'slow, ponderous' + kneme
  (κνήμη) meaning 'leg'; overall meaning 'ponderous leg', referring to the
  robust leg bone on which the genus is based.
pronunciation:
  phonetic: BRAD-ik-NEE-mee
description: Bradycneme is a genus of theropod dinosaur from the Upper
  Cretaceous-aged (Maastrichtian) Sânpetru Formation of the Hațeg Basin,
  Transylvania, Romania. The type species is Bradycneme draculae, known only
  from a partial right lower leg (specimen BMNH A1588), which its original
  describers believed it came from a giant owl.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
appearance:
  integument: feathered
  evidence: inferred
identifiers:
  - source: pbdb
    id: "38617"
  - source: wikidata
    id: Q28605523
species:
  - name: Bradycneme draculae
    etymology: "From Romanian 'dracul' meaning 'the dragon', a reference to the
      Dracula legend of Transylvania, where the fossil was found."
    status: nomen dubium
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Maastrichtian
    location:
      country: RO
      locality: Sânpetru
      region: RO-HD
      formation: Sânpetru
      notes: Harrison and Walker (1975) give the locality as "Szèntpeterfalva,
        Hàtszeg", the Hungarian name of Sânpetru, and no formation. Csiki and
        Grigorescu
        (1998) place the material in the Sânpetru Formation of the Sibișel
        Valley on a personal communication, adding that "no further details
        are known about their precise locality".
    type_specimen:
      specimen_id: [ BMNH A1588 ]
      specimen_type: holotype
      institution: NHMUK
      material: Distal end of a right tibiotarsus.
      completeness: fragmentary
    erected_in: harrison1975a
references:
  - id: harrison1975a
    notes: Named Bradycneme draculae for the distal end of a right tibiotarsus,
      BMNH A 1588, as a giant owl.
  - id: csiki1998a
    notes: Treats the tibiotarsus as a non-maniraptoran tetanuran, keeps the name
      only informally, and places the bones in the Sânpetru Formation.
  - id: naish2004b
    notes: Classified Bradycneme as an indeterminate maniraptoran; the alvarezsaurid
      referral in that paper applies to Heptasteornis, not Bradycneme.
  - id: jones2026c
    notes: Reports Bradycneme with Heptasteornis as possible alvarezsaurids.
  - id: osmólska1987a
    notes: Held that Bradycneme cannot be considered valid, since troodontid distal tibiotarsi are too alike to diagnose.
  - id: olshevsky1991a
    notes: Lists Bradycneme draculae as a nomen dubium.
  - id: makovicky2004b
    notes: Listed Bradycneme draculae among the nomina dubia of Troodontidae.
