genus: Bradycneme
parent: Maniraptora
placement: incertae sedis
dispute:
  summary: >
    Bradycneme is a fragmentary Romanian maniraptoran of highly uncertain affinity.
    It was originally described as a giant owl (Harrison and Walker, 1975), later
    treated by Naish and Dyke (2004) as an indeterminate maniraptoran, and an
    alvarezsauroid affinity has more recently gained traction (Jones, 2026). Given
    the spread of hypotheses and the fragmentary holotype it is placed
    conservatively at Maniraptora incertae sedis.
  history:
    - date: "2026-07-01"
      note: Moved from Troodontidae to Maniraptora incertae sedis (owl, troodontid, and alvarezsauroid hypotheses all proposed; not supported as a troodontid by any analysis).
etymology: From Ancient Greek bradys (βραδύς) meaning 'slow, ponderous' + kneme
  (κνήμη) meaning 'leg'; overall meaning 'ponderous leg', referring to the
  robust leg bone on which the genus is based.
pronunciation:
  phonetic: BRAD-ik-NEE-mee
description: Bradycneme is a genus of theropod dinosaur from the Upper
  Cretaceous-aged (Maastrichtian) Sânpetru Formation of the Hațeg Basin,
  Transylvania, Romania. The type species is Bradycneme draculae, known only
  from a partial right lower leg (specimen BMNH A1588), which its original
  describers believed it came from a giant owl.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Distal end of tibiotarsus broad and antero-posteriorly flattened.
  - Distal projection of external condyle beyond internal condyle very marked.
  - Internal and external condyles projecting anteriorly to same extent;
    projection of internal condyle also directed internally to some extent.
  - Anterior intercondylar fossa transverse and deep.
  - Well-developed groove on external side terminating at large external
    ligamental prominence, proximally situated on external surface of external
    condyle.
