genus: Bissektipelta
parent: Ankylosauridae
etymology: From Bissekty (the Bissekty Formation of Uzbekistan, where the fossils were found) + Greek pelte (πέλτη) meaning 'shield'; overall meaning 'Bissekty shield'.
pronunciation:
  phonetic: bish-ehk-tee-pel-tuh
description: Bissektipelta is a genus of ankylosaurine thyreophoran dinosaurs
  that lived in Asia during the Late Cretaceous in what is now the Bissekty
  Formation of Uzbekistan. Bissektipelta is a monospecific genus, containing
  only the type species B. archibaldi.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Distinctive pattern of grooves on the dorsal skull roof forming a truncated
    'Y' shape, separating three flat polygonal areas of remodelled bone.
  - Combined presence of the truncated 'Y' skull roof groove pattern and three
    separate exits for the hypoglossal nerve (cranial nerve XII) is unique among
    ankylosaurs.
appearance:
  features:
    - body armor
  integument: armored
  evidence: direct
