genus: Baurutitan
parent: Aeolosaurini
etymology: "From Bauru (the Bauru Group, the geological unit in Brazil where
  fossils were found) + Greek Titan meaning 'giant'; overall meaning 'Bauru
  giant'. No explicit etymology provided in the article."
pronunciation:
  phonetic: BOH-roo-TIE-tuhn
description: Baurutitan is a genus of sauropod dinosaur that lived during the
  Late Cretaceous in what is now Brazil. The type species, Baurutitan britoi,
  was described in 2005 by Kellner and colleagues, although the fossil remains
  had already been discovered in 1957. Baurutitan is classified as a
  lithostrotian titanosaur, and is distinguished from related genera based on
  its distinctive caudal vertebrae. This South American dinosaur was found in
  the Serra da Galga Formation near Uberaba, in the Brazilian state of Minas
  Gerais.
dispute:
  summary: >
    Placed within Aeolosaurini following Silva Junior et al. (2022), whose
    phylogenetic analysis recovers Baurutitan as an aeolosaurin; the describing
    paper (Kellner et al., 2005) classified it only as a derived titanosaur,
    without a cladistic analysis. Silva Junior et al. (2022) further proposed
    that Trigonosaurus pricei is a junior synonym of Baurutitan britoi
    (Baurutitan having page priority within the shared 2005 volume) and split
    off part of the Trigonosaurus material as Caieiria; Fronimos (2023) rejected
    the synonymy, citing distinct first-caudal morphology.
  history:
    - date: "2026-06-30"
      note: >
        Placed in Aeolosaurini per Silva Junior et al. (2022); the Trigonosaurus
        synonymy that work proposes is contested by Fronimos (2023).
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Strongly pointed laterally directed process intercepting the
    spinoprezygapophyseal lamina on caudal 1
  - Anterolaterally directed spinoprezygapophyseal lamina
  - Prezygapophyseal tuberosity on the lateral margin of the prezygapophysis of
    caudals 2-4, smoothing out in midcaudals
  - Developed dorsal tuberosity on the neural arch turning into a lateral ridge
    in the middle caudals
  - Neural spines in most anterior caudals (1-4) inclined posteriorly, becoming
    more vertical to subvertical in caudals 5-10
