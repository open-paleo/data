genus: Baurutitan
parent: Aeolosaurini
etymology: "From Bauru (the Bauru Group, the geological unit in Brazil where fossils were found) + Greek Titan meaning 'giant'; overall meaning 'Bauru giant'. No explicit etymology provided in the article."
description: Baurutitan is a genus of sauropod dinosaur that lived during the
  Late Cretaceous in what is now Brazil. The type species, Baurutitan britoi,
  was described in 2005 by Kellner and colleagues, although the fossil remains
  had already been discovered in 1957. Baurutitan is classified as a
  lithostrotian titanosaur, and is distinguished from related genera based on
  its distinctive caudal vertebrae. This South American dinosaur was found in
  the Serra da Galga Formation near Uberaba, in the Brazilian state of Minas
  Gerais.
diet: herbivore
locomotion: quadrupedal
