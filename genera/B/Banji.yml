genus: Banji
parent: Oviraptoridae
etymology: "From Chinese '斑嵴' (bān jǐ) meaning 'striped crest', referring to the
  prominent crest on its skull; the full species name Banji long means 'striped
  crest dragon' in Chinese."
pronunciation:
  phonetic: BAHN-jee
description: Banji is an extinct genus of oviraptorid dinosaur that lived
  approximately 66 million years ago during the later part of the Cretaceous
  Period in what is now China. It was a small, lightly built, ground-dwelling,
  bipedal carnivore, that was an estimated 65 cm (2.1 ft) long, as a juvenile.
diet: omnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Crest formed by premaxillae and nasals having a step-wise posterior end,
    bearing two longitudinal grooves and numerous oblique striations on each
    lateral surface
  - Extremely elongate external naris, posteriorly situated and close to the
    orbit
  - Deep fossa on the dorsal surface of the palatal ramus of the pterygoid
  - Several longitudinal grooves along the posterior part of the dorsal margin
    of the dentary
  - Several tubercles along the lateral shelf at the dorsal margin of the
    surangular
appearance:
