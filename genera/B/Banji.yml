genus: Banji
parent: Heyuanninae
description: Banji is an extinct genus of oviraptorid dinosaur that lived
  approximately 66 million years ago during the later part of the Cretaceous
  Period in what is now China. It was a small, lightly built, ground-dwelling,
  bipedal carnivore, that was an estimated 65 cm (2.1 ft) long, as a juvenile.
diet: omnivore
