genus: Barosaurus
parent: Diplodocinae
pronunciation:
  ipa: /ˌbæroʊˈsɔːrəs/
  phonetic: BARR-oh-SOR-uhs
etymology: "From Greek barys (βαρυς) meaning 'heavy' and Greek sauros (σαυρος) meaning 'lizard'. Full meaning: 'heavy lizard'."
description: Barosaurus is an extinct genus of giant, long-tailed, long-necked,
  plant-eating sauropod dinosaur closely related to the more familiar
  Diplodocus. Definitive remains have been found in the Morrison Formation from
  the Upper Jurassic Period of South Dakota, Utah and Montana, with other
  possible remains also found in Colorado, eastern Wyoming and Oklahoma. The
  generic name, Barosaurus, comes from the Greek words barys (βαρυς) meaning
  "heavy" and sauros (σαυρος) meaning "lizard", and thus meaning "heavy lizard".
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - No short transverse ridge medially on the posterior side of the ventral
    ramus of the quadrate, near the articulation with the lower jaw
  - Pleurocoel not extending onto the parapophysis in the anterior cervical
    vertebrae
  - Posterior cervical vertebrae very elongate (elongation index, excluding the
    anterior condyle, greater than 2.6)
  - Anterior projection on the prezygodiapophyseal lamina of the posterior
    cervical and anterior-to-mid dorsal vertebrae, just lateral to the
    prezygapophysis
  - Anterior dorsal centra without a ventral keel
appearance:
  features:
    - elongate neck
  integument: scaled
  evidence: inferred
