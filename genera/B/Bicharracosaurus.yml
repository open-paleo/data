genus: Bicharracosaurus
parent: Macronaria
placement: incertae sedis
dispute:
  summary: >
    Bicharracosaurus is recovered as a macronarian by its describers (Reutter
    et al., 2026), but its position oscillates between a basal macronarian,
    allied with Tehuelchesaurus and Janenschia, and a member of
    Brachiosauridae depending on the matrix and weighting scheme, and a
    brachiosaurid identity is considered possible.
  history:
    - date: "2026-06-30"
      note: >
        Placed at Macronaria incertae sedis following Reutter et al. (2026);
        the unresolved brachiosaurid alternative is noted.
etymology: From Spanish 'bicharraco' (informal term for 'big animal', used
  by discoverer Dionide Mesa to refer to the large size of the fossils)
  and Greek 'sauros' meaning 'lizard'.
pronunciation:
  phonetic: bee-chah-RAH-koh-SOR-us
description: Bicharracosaurus is a genus of macronarian sauropod dinosaur,
  possibly a brachiosaurid, that existed during the Late Jurassic of Cañadón
  Calcáreo Formation in what is now Argentina. The genus is monotypic with the
  type species being Bicharracosaurus dionidei.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - CDF in middle and posterior cervical vertebrae pierced by a triangular coel
    (autapomorphy)
  - Distal portion of PODL with a small dorsally oriented protuberance in
    posteriormost cervical vertebrae (autapomorphy)
  - Boat-like articular facets of sacral centra — wider than high, with straight
    dorsal margin giving a non-oval outline (autapomorphy)
  - Ventrally bifurcated postzygodiapophyseal lamina (PODL) in posterior
    cervical vertebrae
  - Small triangular fossa anteroventral to pleurocoel in middle to posterior
    dorsal vertebrae
  - Second sacral rib with dual contribution from Sa1 and Sa2; ilium with
    semi-horizontal preacetabular process
appearance:
  integument: scaled
  evidence: inferred
