genus: Balaur
parent: Dromaeosauridae
pronunciation:
  ipa: /ˈbæl.aʊr/
  phonetic: BAL-our
etymology: From Romanian balaur ('dragon' of Romanian folklore)
description: Balaur is a genus of paravian theropod dinosaur from the Late
  Cretaceous (Maastrichtian) of what is now Romania. It contains a single
  species, Balaur bondoc, known from two partial skeletons. Its short, stocky
  build and double sickle claws on each foot are interpreted as an example of
  island syndrome on the Late Cretaceous Hațeg Island archipelago.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Fused carpometacarpus with reduced splint-like metacarpal III only 30% the
    mediolateral width of metacarpal II, digit III nonfunctional
  - Extremely retroverted pubes and ischia with long axes nearly horizontal,
    associated with enlarged cuppedicus fossa on laterally everted pubic
    peduncle
  - Fused metatarsus (metatarsals II-V fused across much of their lengths),
    tarsometatarsus substantially wider than distal tibiotarsus
  - Enlarged functional first pedal digit with hyperextensive ungual (second
    largest in foot), giving the animal a double set of raptorial claws
  - Hypertrophied coracoid tubercle projecting anteriorly and laterally as a
    conical projection that obscures the coracoid foramen in lateral view
  - Sinuous ridge on lateral surface of distal humerus extending for one-third
    the length of the bone, unique among all theropods
