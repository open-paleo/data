genus: Bonapartesaurus
parent: Saurolophini
etymology: Named after José Bonaparte, the prominent Argentine paleontologist, combined with Greek sauros (σαῦρος) meaning 'lizard'; overall meaning 'Bonaparte's lizard'.
pronunciation:
  phonetic: BOW-nuh-part-SOR-us
description: Bonapartesaurus is an extinct genus of herbivorous ornithopod
  dinosaur belonging to Hadrosauridae, which lived in the area of modern
  Argentina during the Campanian and Maastrichtian stages of the Late
  Cretaceous.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
diagnostic_features:
  - Ratio between height of sacral neural spines and centrum greater than 3.5
  - Neural spines of anterior caudal vertebrae extremely long (3.5-4× centrum
    height) and evenly expanding distally
  - Preacetabular process of ilium slightly deflected ventrally, angle greater
    than 150°
  - Ratio between dorsoventral height and anteroposterior length of iliac blade
    0.8 or greater
  - Posterior portion of postacetabular process markedly thicker mediolaterally
    due to dorsomedial twist of postacetabular process
  - Anteriorly expanded cnemial crest restricted to the proximal end of the tibia
appearance:
  integument: scaled
  evidence: inferred
