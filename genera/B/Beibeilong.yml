genus: Beibeilong
parent: Caenagnathidae
etymology: "From Mandarin Chinese beibei (贝贝) meaning 'baby' and long (龙) meaning 'dragon'. Full meaning: 'baby dragon'."
pronunciation:
  phonetic: bay-bay-long
description: Beibeilong is a genus of large caenagnathid dinosaurs that lived in
  China during the Late Cretaceous epoch, about 96 million to 88 million years
  ago. The genus contains a single species, Beibeilong sinensis. The species was
  named and described in 2017 through analysis of an embryonic skeleton
  (nicknamed Baby Louie) and partial nest with large eggs that were discovered
  in the Gaogou Formation of China (Henan Province) between 1992 and 1993.
diet: omnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Antorbital fossa demarcated by sharply defined alveolar and dorsoposterior
    trending ridges
  - Posterodorsal margin of lacrimal overlapped by frontal
  - Subantorbital portion of the maxilla is inset medially
  - Pronounced retroarticular process with a distinct concave posterior facet,
    roughly as tall at the base as it is wide
  - Preacetabular process of the ilium longer than postacetabular process;
    posterior end of the postacetabular process truncated or broadly rounded
  - Accessory trochanter of the femur weakly developed
appearance:
  integument: feathered
  evidence: inferred
