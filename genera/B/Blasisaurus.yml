genus: Blasisaurus
parent: Arenysaurini
etymology: "Named after the Blasi 1 fossil site in Spain where the specimen was found, combined with Greek sauros meaning 'lizard'. Full meaning: 'Blasi lizard'."
pronunciation:
  phonetic: blah-see-SOR-us
description: Blasisaurus is a genus of lambeosaurine hadrosaurid dinosaur from
  the Late Cretaceous. It is known from a partial skull and skeleton found in
  late Maastrichtian-age rocks of Spain. The type species is Blasisaurus
  canudoi, described in 2010 by Penélope Cruzado-Caballero, Xabier
  Pereda-Suberbiola and José Ignacio Ruiz-Omeñaca, a group of researchers from
  Spain.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - deltaic
diagnostic_features:
  - Jugal with hook-like dorsal edge of the posterior process combined with a
    narrow, D-shaped infratemporal fenestra (autapomorphy)
  - Jugal posterior edge of the anterior process well-projected ventrally in a
    straight line
  - Jugal with concave posteroventral edge beneath the infratemporal fenestra
  - Very short jugal with length/height ratio lower than 1.2
  - Dentary teeth lacking secondary ridges (unique among European hadrosaurids
    with dentary teeth preserved)
