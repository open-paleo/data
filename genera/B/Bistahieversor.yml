genus: Bistahieversor
parent: Eutyrannosauria
etymology: From Bistahi (the Bisti/De-Na-Zin Wilderness area in New Mexico,
  where fossils were found; from Navajo bistahi meaning 'among the adobe
  formations') + Latin eversor meaning 'destroyer'; overall meaning 'Bistahi
  destroyer'.
pronunciation:
  phonetic: bis-tah-he-ee-VER-sor
description: Bistahieversor, also known as the "Bisti Beast", is a genus of
  basal eutyrannosaurian theropod dinosaur. The genus contains only a single
  known species, B. sealeyi, described in 2010, from the Late Cretaceous of New
  Mexico. The holotype and a juvenile were found in the Hunter Wash Member of
  the Kirtland Formation, while other specimens came from the underlying Fossil
  Forest member of the Fruitland Formation. This dates Bistahieversor
  approximately 75.5 to 74.5 million years ago during the Campanian age, found
  in sediments spanning a million years.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Forked palatal process of the premaxilla
  - Supernumerary frontal processes of the nasal (lanceolate medial frontal
    processes)
  - Pneumatic foramen piercing the supraorbital ramus of the lacrimal
  - Peaked sagittal crest; dorsotemporal fossa extending onto lateral surface of
    the squamosal
  - Single pneumatic foramen in the palatine
  - Tall flange extending from the ventral margin of the rostral mylohyoid
    foramen of the splenial
