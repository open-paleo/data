genus: Bistahieversor
parent: Teratophoneini
etymology: Bistahi destroyer
description: Bistahieversor, also known as the "Bisti Beast", is a genus of
  basal eutyrannosaurian theropod dinosaur. The genus contains only a single
  known species, B. sealeyi, described in 2010, from the Late Cretaceous of New
  Mexico. The holotype and a juvenile were found in the Hunter Wash Member of
  the Kirtland Formation, while other specimens came from the underlying Fossil
  Forest member of the Fruitland Formation. This dates Bistahieversor
  approximately 75.5 to 74.5 million years ago during the Campanian age, found
  in sediments spanning a million years.
diet: carnivore
