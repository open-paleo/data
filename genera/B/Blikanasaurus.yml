genus: Blikanasaurus
parent: Sauropodiformes
placement: incertae sedis
pronunciation:
  phonetic: bli-KAHN-a-SAWR-us
etymology: Named for the Blikana locality in South Africa where the fossils were found, combined with Greek 'sauros' meaning 'lizard', meaning 'lizard from Blikana'.
description: Blikanasaurus is a genus of sauropodomorph dinosaur from the late
  Triassic of South Africa. The generic name Blikanasaurus is derived from
  Greek, meaning "lizard from Blikana". The species name cromptoni is taken from
  the surname of A.W. "Fuzz" Crompton, an American paleontologist who led
  numerous field expeditions in Elliot Formation outcrop localities in South
  Africa. Blikanasaurus is only known from partial hindlimb bones that were
  recovered from the lower Elliot Formation (LEF) in the Eastern Cape.
dispute:
  summary: >
    Blikanasaurus cromptoni is a robust, derived sauropodiform known from
    a partial hindlimb; it is recovered as a basal sauropod by some
    analyses (McPhee and others, 2014; Jones, 2026) and as a
    non-sauropodan sauropodiform by others.
  history:
    - date: "2026-06-29"
      note: Placed at Sauropodiformes incertae sedis; the basal-Sauropoda placement is recorded, but the boundary remains unresolved.
diagnostic_features:
  - Tibia with maximum proximal width 0.48 of maximum length; descending process
    relatively deep and robust
  - Distal end of fibula with a large oval, ventromedially directed articular
    surface
  - Astragalus relatively short transversely with high, prominent ascending
    process
  - Calcaneum small, lying ventrolateral to the astragalus
  - Two distal tarsals medially placed between astragalus and metatarsals I-III,
    with reduced calcaneum contacting metatarsal IV
  - Metatarsal II and III uniquely massive in lateral/medial view; metatarsal V
    much reduced with marked distal taper
