genus: Bayannurosaurus
parent: Styracosterna
etymology: Named for the Bayin-Gobi (Bayannur) region of China where the fossils were found, combined with Greek 'sauros' meaning 'lizard'.
pronunciation:
  phonetic: BAY-a-NOOR-oh-SOR-us
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
diagnostic_features:
  - Jugal bearing a dorsally directed, strap-like posterodorsal process
  - Iliac preacetabular process horizontally oriented
  - Large, subconical ungual of manual digit I with a length/width ratio close
    to 1.0
  - Posterior-most caudals with procoelous centra showing trapezoidal dorsal
    outlines; last three caudals fully fused
  - Markedly bifurcated anterior maxilla with an elevated anterodorsal process
  - Denticulate anteromedial premaxillary oral margin with a shallow peripheral
    groove
appearance:
  integument: scaled
  evidence: inferred
