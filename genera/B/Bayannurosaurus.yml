genus: Bayannurosaurus
parent: Ankylopollexia
etymology: Named for the Bayin-Gobi (Bayannur) region of China where the fossils were found, combined with Greek 'sauros' meaning 'lizard'.
description: Bayannurosaurus is a non-hadrosauriform ankylopollexian ornithopod
  described in 2018 by Xu Xing. It lived during the early Aptian period, being
  found in the Bayin-Gobi Formation of China. The genus includes the type
  species Bayannurosaurus perfectus. A phylogenetic analysis of Bayannurosaurus
  indicates that it is more derived than Hypselospinus, yet less derived than
  Ouranosaurus and just outside of the Hadrosauriformes. It was a large
  iguanodontian, measuring up to 9 metres (30 ft) in total body length. The
  genus name Bayannurosaurus comes from Bayannur, the area where it was found,
  while the species name perfectus comes from the "perfect" preservation of the
  holotype specimen (IMMNH PV00001).
diet: herbivore
locomotion: bipedal
