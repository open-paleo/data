genus: Bisticeratops
parent: Chasmosaurinae
etymology: From Bisti (the Bisti/De-Na-Zin Wilderness area in New Mexico, where fossils were found; from Navajo bistahi meaning 'among the adobe formations') + Greek keras (κέρας) meaning 'horn' + ops (ὤψ) meaning 'face'; overall meaning 'Bisti/De-Na-Zin Wilderness horned face'.
description: Bisticeratops is a genus of chasmosaurine ceratopsian from outcrops
  of the Campanian age Kirtland Formation found in the Bisti/De-Na-Zin
  Wilderness in northwestern New Mexico, United States. The type and only
  species is B. froeseorum, known from a nearly complete skull.
diet: herbivore
locomotion: quadrupedal
