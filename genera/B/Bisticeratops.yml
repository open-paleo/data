genus: Bisticeratops
parent: Chasmosaurinae
etymology: From Bisti (the Bisti/De-Na-Zin Wilderness area in New Mexico, where
  fossils were found; from Navajo bistahi meaning 'among the adobe formations')
  + Greek keras (κέρας) meaning 'horn' + ops (ὤψ) meaning 'face'; overall
  meaning 'Bisti/De-Na-Zin Wilderness horned face'.
pronunciation:
  phonetic: BISS-tih-SEH-ruh-tops
description: Bisticeratops is a genus of chasmosaurine ceratopsian from outcrops
  of the Campanian age Kirtland Formation found in the Bisti/De-Na-Zin
  Wilderness in northwestern New Mexico, United States. The type and only
  species is B. froeseorum, known from a nearly complete skull.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Snout in lateral view has a characteristic stepped margin (absent in
    Pentaceratops sternbergi).
  - Premaxilla with deeply inserted narrow sulcus located between the base of
    the triangular process and the posteroventral process.
  - Posterior end of the posteroventral process of the premaxilla with two
    distinct projections separated by a deep notch; dorsal projection narrow and
    peg-like, ventral projection transversely expanded and flange-like.
  - Maxilla with a strongly reduced jugal process and absence of pocket-like
    fossa between the ventral jugal process on the lateral surface.
  - Maxilla with two small antorbital fenestrae and lateral surface bearing two
    elongated, low ridges paralleling each other beneath the antorbital
    fenestra.
  - Postorbital horncore strongly anteriorly-curved.
appearance:
  integument: scaled
  evidence: inferred
