genus: Borogovia
parent: Troodontinae
dispute:
  summary: >
    Borogovia is known from lower hind-limb material and its position is unsettled.
    It is recovered within Troodontinae near Saurornithoides (Sellés et al., 2021)
    or as the sister taxon to Troodontinae (Cau and Madzia, 2021), and has
    historically been suggested as a possible senior synonym of Zanabazar (Nemegt
    troodontids). It is placed in Troodontinae following the recent analyses.
  history:
    - date: "2026-07-01"
      note: Moved from Saurornithoidini (tribe dropped) to Troodontinae; sister-to-Troodontinae alternative and possible Zanabazar synonymy noted.
pronunciation:
  phonetic: bor-o-GOH-vee-a
etymology: Named after the 'borogoves', the fantasy creatures in Lewis Carroll's
  poem 'Jabberwocky' from 'Through the Looking-Glass'.
description: Borogovia is a troodontid theropod dinosaur genus which lived
  during the Late Cretaceous Period, in what is now Mongolia. It contains one
  species, Borogovia gracilicrus.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Second pedal ungual nearly straight with a very weak flexor tuber, unlike
    the curved ungual in all other troodontids
  - Phalanx II-2 extremely short, only about one-third the length of phalanx II-1
  - Third toe markedly thinner and more slender than both the second and fourth
    toes
  - Tibiotarsus exceptionally long and slender relative to pes size, exceeding
    proportions of all other known troodontids
appearance:
  integument: feathered
  evidence: inferred
