genus: Baiyinosaurus
parent: Stegosauria
etymology: Baiyin reptile
description: Baiyinosaurus is an extinct genus of stegosaurian dinosaurs from
  the Middle Jurassic Wangjiashan Formation of China. The genus contains a
  single species, B. baojiensis, known from a partial skeleton including cranial
  bones. The skeletal anatomy of Baiyinosaurus demonstrates transitional
  features between basal thyreophorans and stegosaurs. While many stegosaurs are
  known from China, Baiyinosaurus is the only one currently named from Gansu
  Province.
diet: herbivore
locomotion: quadrupedal
