genus: Baiyinosaurus
parent: Stegosauria
etymology: From Baiyin (the city of Baiyin in Gansu Province, China, near where the fossils were found) + Greek sauros (σαῦρος) meaning 'lizard'; overall meaning 'Baiyin reptile'.
description: Baiyinosaurus is an extinct genus of stegosaurian dinosaurs from
  the Middle Jurassic Wangjiashan Formation of China. The genus contains a
  single species, B. baojiensis, known from a partial skeleton including cranial
  bones. The skeletal anatomy of Baiyinosaurus demonstrates transitional
  features between basal thyreophorans and stegosaurs. While many stegosaurs are
  known from China, Baiyinosaurus is the only one currently named from Gansu
  Province.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - deltaic
  - lacustrine
diagnostic_features:
  - Frontal wider than long and contributes to both the medial and anterior
    margins of the supratemporal fenestra (unique among Stegosauria).
  - "Neural arches not greatly elongated dorsally: ratio of neural arch height
    to neural canal height is 1.59."
  - Parapophyses well developed and project somewhat laterally on stalks in
    anterior view.
  - "Neural spines anteroposteriorly broad and axially expanded in lateral view:
    ratio of neural spine length to centrum length is 0.75."
