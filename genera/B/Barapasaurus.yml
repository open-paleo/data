genus: Barapasaurus
parent: Gravisauria
etymology: "From 'bara' meaning 'big' and 'pa' meaning 'leg' in several Indian languages including Bengali, combined with Greek 'sauros' meaning 'lizard', meaning 'big-legged lizard', referring to a femur measuring over 1.7 m. The species name honors Bengali poet Rabindranath Tagore."
pronunciation:
  ipa: /bəˌrɑːpəˈsɔːrəs/
  phonetic: bə-RAH-pə-SOR-əs
description: Barapasaurus is a genus of basal sauropod dinosaur from Jurassic
  rocks of India. The only species is B. tagorei. Barapasaurus comes from the
  lower part of the Kota Formation, which is of Early to Middle Jurassic in age.
  It is therefore one of the earliest known sauropods. Barapasaurus is known
  from approximately 300 bones from at least six individuals, so that the
  skeleton is almost completely known except for the anterior cervical vertebrae
  and the skull. This makes Barapasaurus one of the most completely known
  sauropods from the Early Jurassic.
diet: herbivore
locomotion: quadrupedal
