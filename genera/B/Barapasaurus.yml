genus: Barapasaurus
parent: Sauropoda
dispute:
  summary: >
    Barapasaurus is placed here as a basal, non-eusauropod sauropod. Under the
    node-based definition of Eusauropoda applied in this dataset (anchored on
    Shunosaurus), the two strongest cladistic analyses exclude it: Wilson (2002)
    recovers it just above Vulcanodon (a basal gravisaurian), while its
    redescription (Bandyopadhyay et al., 2010) recovers it below Vulcanodon,
    outside Gravisauria. Because those two results disagree on Gravisauria
    membership, it is placed conservatively at Sauropoda, the most basal node
    consistent with both. Stem-based analyses (Wilson and Sereno, 1998) and
    reference works (Jones, 2026) instead treat it as a eusauropod, but that
    rests on a broader Eusauropoda concept not used here.
  history:
    - date: "2026-06-29"
      note: >
        Placed at Eusauropoda following Jones (2026); the outside-Eusauropoda
        position of Wilson (2002) and Bandyopadhyay and others (2010)
        reflected, not adopted.
    - date: "2026-07-13"
      note: >
        Moved from Eusauropoda to Sauropoda. Node-based analyses (Wilson, 2002;
        Bandyopadhyay and others, 2010) place Barapasaurus outside Eusauropoda
        but disagree on whether it falls within Gravisauria (above Vulcanodon)
        or below it; Sauropoda is the most basal node consistent with both.
etymology: "From 'bara' meaning 'big' and 'pa' meaning 'leg' in several Indian
  languages including Bengali, combined with Greek 'sauros' meaning 'lizard',
  meaning 'big-legged lizard', referring to a femur measuring over 1.7 m. The
  species name honors Bengali poet Rabindranath Tagore."
pronunciation:
  ipa: /bəˌrɑːpəˈsɔːrəs/
  phonetic: buh-RAH-puh-SOR-uhs
description: Barapasaurus is a genus of basal sauropod dinosaur from Jurassic
  rocks of India. The only species is B. tagorei. Barapasaurus comes from the
  lower part of the Kota Formation, which is of Early to Middle Jurassic in age.
  It is therefore one of the earliest known sauropods. Barapasaurus is known
  from approximately 300 bones from at least six individuals, so that the
  skeleton is almost completely known except for the anterior cervical vertebrae
  and the skull. This makes Barapasaurus one of the most completely known
  sauropods from the Early Jurassic.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Teeth spoon-shaped with anterior and posterior keels bearing coarse denticles
  - Centra not cavernous but with oval or ovoidal depressions in the lateral or
    laterodorsal surface
  - Sacricostal yokes of sacrum set close together and do not contribute to the
    medial wall of the acetabulum
  - Ilium with rather deep medial wall of the acetabulum; ischiadic peduncle
    short, pubic peduncle long and directed ventrally and slightly anteriorly
  - Femora retaining a central cavity; lesser trochanter absent, fourth
    trochanter well-developed ridge-like with possible acute declined tip
  - Scapula with tall narrow blade, anterior border passing by relatively
    shallow gradual curve into moderately broad proximal expansion
