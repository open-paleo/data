genus: Bienosaurus
parent: Thyreophora
placement: incertae sedis
etymology: From the surname Bien (in honor of M. N. Bien, collector of the
  holotype) plus Greek sauros ('lizard'); meaning 'Bien's lizard'.
pronunciation:
  phonetic: bee-EN-oh-SOR-us
description: Bienosaurus is a dubious genus of thyreophoran dinosaur from the
  Early Jurassic (probably Hettangian to Sinemurian) Lower Lufeng Formation of
  Yunnan Province in China.
dispute:
  summary: >
    Bienosaurus is a nomen dubium based on a fragmentary lower jaw from
    the Early Jurassic of China; reassessment found no diagnostic features
    and identified it as an indeterminate early-diverging thyreophoran,
    possibly synonymous with Tatisaurus (Raven and others, 2019; Jones,
    2026).
  history:
    - date: "2026-06-29"
      note: Retained at Thyreophora incertae sedis; nomen dubium, possibly synonymous with Tatisaurus.
diet: herbivore
diagnostic_features:
  - Predentary short and wide
  - Frontal thick, with small bony scutes fused to dorsal surface
  - Dentary wide with ornamented lateral surface
  - Teeth small and leaf-shaped with symmetrical crowns and developed cingulum
paleoenvironment:
  - fluvial
appearance:
  integument: armored
identifiers:
  - source: pbdb
    id: "66519"
  - source: wikidata
    id: Q142105
  - source: gbif
    id: "4823055"
species:
  - name: Bienosaurus lufengensis
    etymology: From Lufeng (the Lufeng Basin, where the holotype was found) and
      Latin -ensis ('from'); meaning 'from Lufeng'.
    status: nomen dubium
    type_species: true
    period:
      name:
        - Early Jurassic
      stage:
        - Hettangian
        - Sinemurian
      from_ma: 201.3
      to_ma: 192.9
    location:
      country: CN
      region: Yunnan
      formation: Lufeng
      locality: Dark Red Beds, Lower Lufeng Formation
      coordinates:
        - 25.15
        - 102.083336
    type_specimen:
      specimen_id:
        - IVPP V15311
      specimen_type: holotype
      institution: IVPP
      material: Nearly complete right lower jaw, fragmentary frontal, and other
        cranial fragments.
      completeness: fragmentary
      notes: Originally cataloged by Dong as IVPP V 9612, but Raven et al.
        (2019) reassigned the specimen to IVPP V15311 because V 9612 was
        already in use for the holotype of Sinornithoides youngi.
    erected_in: dong2001b
references:
  - id: dong2001b
  - id: raven2019a
    notes: Reassessment concluding Bienosaurus lufengensis is a nomen dubium and
      an indeterminate basal thyreophoran, not an ankylosaurian; corrects the
      holotype catalog number from V 9612 to V15311.
  - id: jones2026a
    notes: Placement and assessment in the Princeton Encyclopedia of Dinosaurs.
