genus: Buitreraptor
parent: Unenlagiinae
etymology: La Buitrera seizer
description: Buitreraptor is a genus of unenlagiine theropod dinosaurs that
  lived during the Late Cretaceous of Argentina at the Candeleros Formation.
  Buitreraptor was described in 2005 and the type species is Buitreraptor
  gonzalezorum. It was rooster-sized and had a very elongated head with many
  small teeth.
