genus: Buitreraptor
parent: Unenlagiinae
etymology: From La Buitrera (the locality in Patagonia, Argentina, where fossils
  were found; Spanish buitrera meaning 'vulture ground') + Latin raptor meaning
  'seizer, plunderer'; overall meaning 'La Buitrera seizer'.
description: Buitreraptor is a genus of unenlagiine theropod dinosaurs that
  lived during the Late Cretaceous of Argentina at the Candeleros Formation.
  Buitreraptor was described in 2005 and the type species is Buitreraptor
  gonzalezorum. It was rooster-sized and had a very elongated head with many
  small teeth.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - arid
diagnostic_features:
  - Skull long, exceeding femoral length by 25%
  - Teeth small, unserrated, without root-crown constriction
  - Quadrate with large lateral flange and pneumatic foramen
  - Posterior cervical centra with ventrolateral ridge terminating caudally as
    small tubers
  - Furcula pneumatic (hollow with internal trabeculae)
  - Brevis shelf expanded and lobate, projects laterally from caudal end of ilium
