genus: Bravoceratops
parent: Chasmosaurinae
etymology: "From 'Rio Bravo del Norte', the Mexican name for the Rio Grande, combined with Greek 'keras' meaning 'horn' and 'ops' meaning 'face', meaning 'wild horn-face'. The species name honors Polyphemus, the cyclops from Homer's Odyssey, referencing the presumed single central horn on the frill."
description: Bravoceratops is a genus of large chasmosaurine ceratopsid dinosaur
  that lived approximately 70 million years ago, and is known from the Late
  Cretaceous Javelina Formation in what is now Texas, United States.
diet: herbivore
