genus: Bravoceratops
parent: Chasmosaurinae
etymology: "From 'Rio Bravo del Norte', the Mexican name for the Rio Grande, combined with Greek 'keras' meaning 'horn' and 'ops' meaning 'face', meaning 'wild horn-face'. The species name honors Polyphemus, the cyclops from Homer's Odyssey, referencing the presumed single central horn on the frill."
pronunciation:
  phonetic: BRAH-vo-SEH-ruh-tops
description: Bravoceratops is a genus of large chasmosaurine ceratopsid dinosaur
  that lived approximately 70 million years ago, and is known from the Late
  Cretaceous Javelina Formation in what is now Texas, United States.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Fan-shaped mediodistal parietal bar lacking pronounced midline embayment
  - Distinct bilaterally symmetrical teardrop-shaped midline depression on
    dorsal parietal surface at nexus of parietal rami, interpreted as attachment
    point for a midline epiparietal
  - Low coossified midline epiparietal on posterior margin of parietal
  - Nasals constricted behind epinasal forming hourglass shape in dorsal view,
    with very shallow dorsoventral depth of nasal bridge
  - Bifurcated squamosal process on quadratojugal, such that quadratojugal
    contributes to ventral rim of laterotemporal fenestra
appearance:
  integument: scaled
  evidence: inferred
