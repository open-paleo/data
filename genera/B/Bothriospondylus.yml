genus: Bothriospondylus
parent: Neosauropoda
etymology: From Greek bothrion ("trench" or "pit") and
  spondylos ("vertebra"); meaning "trench vertebra", referring
  to the deep lateral excavations (pleurocoels) of the
  vertebral centra.
description: >
  Bothriospondylus is a dubious genus of possibly neosauropodan
  sauropod dinosaur. It lived during the Late Jurassic in
  England and the type (and only) species is B. suffossus.
diet: herbivore
locomotion: quadrupedal
diagnostic_features:
  - Sacral vertebral centra strongly horizontally flattened (depressed), not due
    to posthumous pressure
  - Deep elongated lateral fossae on centrum sides, continuing from sacral into
    dorso-lumbar vertebrae and undermining the neural arch support plates
  - Pre- and post-parapophyses present on each side of sacral centra, with
    expanded rough syndesmotic articular surfaces
  - Dorso-lumbar (trunk) vertebrae opisthocoelan (fore end feebly convex, hind
    end concave), lacking transverse processes
  - Centrum substance highly cancellous (large unossified lacunae);
    neurapophyses anchylosed to centrum
