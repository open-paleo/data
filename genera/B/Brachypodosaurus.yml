genus: Brachypodosaurus
parent: Ornithischia
pronunciation:
  phonetic: BRAK-ee-POH-doh-SAWR-us
etymology: From Greek "brachys" (short) and "pous" (foot), plus "sauros"
  (lizard); meaning "short-footed lizard".
description: Brachypodosaurus is a dubious genus of dinosaur, possibly an
  ornithischian, from the Late Cretaceous Lameta Formation (Maastrichtian) in
  India.
dispute:
  summary: >
    Brachypodosaurus is a nomen dubium based on a single humerus from the
    Late Cretaceous of India; it has been referred to both Stegosauria and
    Ankylosauria, but all identifications have been challenged and it
    cannot be placed with confidence (Jones, 2026).
  history:
    - date: "2026-06-29"
      note: Reparented from Thyreophora to Ornithischia incertae sedis; nomen dubium with all identifications challenged.
diet: herbivore
identifiers:
  - source: pbdb
    id: "38819"
  - source: wikidata
    id: Q18606696
  - source: gbif
    id: "4823202"
species:
  - name: Brachypodosaurus gravis
    etymology: From Latin "gravis" (heavy).
    status: nomen dubium
    type_species: true
    period:
      name:
