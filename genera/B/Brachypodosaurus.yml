references:
  - id: chakravarti1934a
    notes: Erects Brachypodosaurus gravis on a single humerus from the Lameta
      Formation near Jabalpur.
  - id: maryańska1977a
    notes: Listed Brachypodosaurus as a nomen dubium, referring the humerus
      questionably to Ankylosauridae.
  - id: wilson2003a
    notes: Noted that the Indian "stegosaur" material, including
      Brachypodosaurus, shares no derived characters with Stegosauria.
  - id: vickaryous2004a
    notes: Listed Brachypodosaurus among nomina dubia, its material a single
      humerus.
  - id: ford2000a
    notes: Treated Brachypodosaurus as Nodosauridae incertae sedis and a nomen
      dubium.
  - id: jones2026a
    notes: Placement and assessment in the Princeton Encyclopedia of Dinosaurs.
