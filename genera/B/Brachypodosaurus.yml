genus: Brachypodosaurus
parent: Ornithischia
placement: incertae sedis
pronunciation:
  phonetic: BRAK-ee-POH-doh-SAWR-us
etymology: From Greek "brachys" (short) and "pous" (foot), plus "sauros"
  (lizard); meaning "short-footed lizard".
description: Brachypodosaurus is a dubious genus of dinosaur, possibly an
  ornithischian, from the Late Cretaceous Lameta Formation (Maastrichtian) in
  India.
dispute:
  summary: >
    Brachypodosaurus is a nomen dubium based on a single humerus from the Late
    Cretaceous Lameta Formation of India, and even its identification as a
    dinosaurian humerus has been questioned. Chakravarti (1934) described it as
    a stegosaur, but Wilson et al. (2003) noted that the Indian "stegosaur"
    material shares no derived characters with Stegosauria. Later workers have
    treated it as an indeterminate ankylosaur — Maryańska (1977) as
    ?Ankylosauridae and Ford (2000) as Nodosauridae incertae sedis — while
    Vickaryous et al. (2004) listed it among nomina dubia. The single humerus is
    too incomplete to place with confidence.
  history:
    - date: "2026-06-29"
      note: Reparented from Thyreophora to Ornithischia incertae sedis; nomen dubium with all identifications challenged.
    - date: "2026-07-20"
      note: Dispute expanded across the literature — affinities range from
        Stegosauria (Chakravarti, 1934, rejected by Wilson et al., 2003) to
        indeterminate Ankylosauria (Maryańska, 1977; Ford, 2000), with the
        humerus identification itself in doubt.
diet: herbivore
