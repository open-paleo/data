  - id: lockwood2024a
    notes: Recovered Barilium in an Iguanodontidae with Iguanodon, Mantellisaurus
      and Comptonatus, within Hadrosauriformes.
  - id: jones2026a
    notes: Reports Barilium as close to Iguanodon and Mantellisaurus.
  - id: lydekker1888b
  - id: norman2015a
    notes: Recovered Barilium in an iguanodontoid clade with Iguanodon, Mantellisaurus, Proa, Jinzhousaurus and Bolong.
  - id: verdú2017a
    notes: Recovered Barilium with the two Iguanodon species in Iguanodontoidea, within Hadrosauriformes.
  - id: lockwood2021a
    notes: Recovered Barilium within Hadrosauriformes, paired with Iguanodon in the majority-rule tree.
  - id: boyd2015b
    notes: Recovered Barilium with Lanzhousaurus and Bolong below Hadrosauriformes.
  - id: párraga2019a
    notes: Recovered Barilium as the sister of the clade of Hypselospinus, Hippodraco and Hadrosauriformes.
  - id: bertozzo2025a
    notes: Recovered Barilium in a more basal position, outside Hadrosauriformes, dissolving Iguanodontidae.
