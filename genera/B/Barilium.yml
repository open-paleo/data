genus: Barilium
parent: Iguanodontidae
etymology: "From Greek barys meaning 'heavy' combined with Latin ilium (the hip bone). Full meaning: 'heavy ilium', referring to the robust hip bone."
pronunciation:
  phonetic: bar-il-ee-um
description: Barilium is a genus of iguanodontian dinosaur which was first
  described as a species of Iguanodon (I. dawsoni) by Richard Lydekker in 1888,
  the specific epithet honoring the discoverer Charles Dawson, who collected
  the holotype during the 1880s.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - lacustrine
diagnostic_features:
  - Rim of the sacrodorsal rib facet visible in lateral view in the upper part
    of the recess between the preacetabular process and the pubic peduncle
    (autapomorphy).
  - Lateral surface of the preacetabular process twists axially to face dorsally
    toward its anterior end (autapomorphy).
  - Dorsal edge of the acetabular blade is flattened and transversely thick
    (autapomorphy).
  - Very restricted brevis shelf (fossa) not bounded by a prominent lateral
    ridge (autapomorphy).
  - Posterior dorsal vertebrae have spool-shaped cylindrical centra with thin
    everted articular margins and transversely rounded haemal surfaces
    (autapomorphy).
  - Proximal caudal vertebrae have broad, dorsoventrally compressed centra
    (subrectangular in anterior view) (autapomorphy).
