genus: Brachytrachelopan
parent: Dicraeosauridae
etymology: From Greek 'brachys' meaning 'short', 'trachelos' meaning 'neck', and
  'pan' referencing the god Pan, a homage to the short-necked sauropod and the
  pastoral deity.
description: Brachytrachelopan is a genus of short-necked sauropod dinosaur from
  the Late Jurassic (Oxfordian to Tithonian) of Argentina. The holotype and only
  known specimen (Museo Paleontológico Egidio Feruglio MPEF-PV 1716) was
  collected from an erosional exposure of fluvial sandstone within the Cañadón
  Calcáreo Formation on a hill approximately 25 kilometers (16 mi)
  north-northeast of Cerro Cóndor, Chubut Province, in west-central Argentina,
  South America. Though very incomplete, the skeletal elements recovered were
  found in articulation and include eight cervical, twelve dorsal, and three
  sacral vertebrae, as well as proximal portions of the posterior cervical ribs
  and all the dorsal ribs, the distal end of the left femur, the proximal end of
  the left tibia, and the right ilium. Much of the specimen was probably lost to
  erosion many years before its discovery. The type species is Brachytrachelopan
  mesai. The specific name honors Daniel Mesa, a local shepherd who discovered
  the specimen while searching for lost sheep. The genus name translates as
  "short-necked Pan", Pan being the god of the shepherds.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Very short neck, with individual cervical vertebrae as long as, or shorter
    in anteroposterior length than, high posteriorly.
  - Pronounced, pillarlike centropostzygapophyseal lamina in the cervical
    vertebrae.
  - Pronounced anterior inclination of the mid-cervical neural spines, with the
    tip of the spine extending beyond the anterior end of the centrum.
  - Anterior dorsal neural spines one to six with vertical bases and anteriorly
    flexed tips.
