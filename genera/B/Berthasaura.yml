genus: Berthasaura
parent: Noasauridae
etymology: Named after Bertha Lutz, a prominent Brazilian scientist and feminist, combined with Greek sauros (σαῦρος) meaning 'lizard'; overall meaning 'Bertha's lizard'.
description: Berthasaura is an extinct genus of ceratosaurian theropod dinosaurs
  from the Early Cretaceous Goio-Erê Formation of Paraná, Brazil. The genus
  contains a single species, Berthasaura leopoldinae, known from a nearly
  complete skeleton.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - arid
diagnostic_features:
  - Lamellae on the medial surface of the premaxilla
  - Short dentaries with the length rostral to the mandibular fenestra about 1.5
    times the height of the dentary
  - Protuberance projecting from the caudoventral end of the premaxillary buccal
    rim
  - Non-bifurcated rostral end of splenial
  - Medial brevis shelf strongly reduced
  - Deep notch on the caudal margin of the ischial process producing an eminent
    and caudally-oriented prong
