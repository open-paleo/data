genus: Bactrosaurus
parent: Hadrosauromorpha
etymology: From Greek baktron (βάκτρον) meaning 'club' or 'walking stick' +
  Greek sauros (σαῦρος) meaning 'lizard'; overall meaning 'club lizard'.
pronunciation:
  phonetic: BAK-tro-SAWR-us
  ipa: /ˌbæktrəˈsɔːrəs/
description: Bactrosaurus is a genus of herbivorous hadrosauroid dinosaur that
  lived in Asia during the Late Cretaceous, from about 96 to 85 million years
  ago. The position Bactrosaurus occupies in the Cretaceous makes it one of the
  earliest known hadrosauroids, and although it is not known from a full
  skeleton, Bactrosaurus is one of the best known of these early hadrosauroids,
  making its discovery a significant finding.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
diagnostic_features:
  - Posterior dorsal vertebrae with tall club-shaped spines, transverse diameter
    increasing from base to top, nearly as wide fore-and-aft as centrum length.
  - Sacrum composed of seven coossified vertebrae.
  - Ilium strongly arched upward at center with strongly decurved, blade-like
    preacetabular process.
  - Pubis with very short neck and greatly expanded prepubic blade, far shorter
    and more expanded than in any other known hadrosaurian.
  - "Dentition reduced: 20-23 vertical tooth rows in dentary, 28 in maxillary
    (fewest in any known hadrosaurian at adult size)."
  - Pes unguals with squarely truncated, rugosely roughened anterior margins in
    adults.
appearance:
  features:
    - keratinous beak
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "38770"
  - source: wikidata
    id: Q131247
  - source: gbif
    id: "4823231"
synonyms:
  - name: Bakesaurus
    type: nomen nudum
    reason: Informal name based on a maxilla assigned to Bactrosaurus; created and
      pictured in a Chinese-language book by Zhou (2005).
  - name: Paraiguanodon
    type: nomen nudum
    reason: 'Manuscript name (Paraiguanodon incolapaludis) coined by Barnum Brown
      in the early 1930s, perhaps for a lecture series, and seen on figures of
      Bactrosaurus johnsoni skeletons in the files of the American Museum of
      Natural History. Never formally published; reported by Olshevsky (1991).'
species:
  - name: Bactrosaurus johnsoni
    etymology: "Named for Albert F. Johnson, who collected the first specimens in 1923."
    status: valid
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Campanian
    location:
      country: CN
      locality: Johnson Quarry, Iren Dabasu
      region: CN-NM
      formation: Iren Dabasu
      coordinates:
        - 43.83139
        - 112.427498
    size:
      length_m:
        min: 6.0
        max: 6.5
      weight_kg:
        min: 1200
        max: 1200
    type_specimen:
      specimen_id: [ AMNH 6553 ]
      specimen_type: holotype
      institution: AMNH
      material: Dentary, maxillary and other skull parts; ten dorsal vertebrae, seven
