genus: Bactrosaurus
parent: Hadrosauroidea
etymology: From Greek baktron (βάκτρον) meaning 'club' or 'walking stick' +
  Greek sauros (σαῦρος) meaning 'lizard'; overall meaning 'club lizard'.
pronunciation:
  phonetic: BAK-tro-SAWR-us
  ipa: /ˌbæktrəˈsɔːrəs/
description: Bactrosaurus is a genus of herbivorous hadrosauroid dinosaur that
  lived in Asia during the Late Cretaceous, from about 96 to 85 million years
  ago. The position Bactrosaurus occupies in the Cretaceous makes it one of the
  earliest known hadrosauroids, and although it is not known from a full
  skeleton, Bactrosaurus is one of the best known of these early hadrosauroids,
  making its discovery a significant finding.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
diagnostic_features:
  - Posterior dorsal vertebrae with tall club-shaped spines, transverse diameter
    increasing from base to top, nearly as wide fore-and-aft as centrum length.
  - Sacrum composed of seven coossified vertebrae.
  - Ilium strongly arched upward at center with strongly decurved, blade-like
    preacetabular process.
  - Pubis with very short neck and greatly expanded prepubic blade, far shorter
    and more expanded than in any other known hadrosaurian.
  - "Dentition reduced: 20-23 vertical tooth rows in dentary, 28 in maxillary
    (fewest in any known hadrosaurian at adult size)."
  - Pes unguals with squarely truncated, rugosely roughened anterior margins in
    adults.
