genus: Bagaraatan
parent: Tyrannosauridae
etymology: From Mongolian 'baga' (small) and 'araatan' (carnivorous animal,
  beast of prey); meaning 'small predator'.
pronunciation:
  phonetic: BAH-gah-RAH-tan
description: Bagaraatan is a genus of theropod dinosaur from the Late Cretaceous
  period of what is now the Nemegt Formation of Mongolia. It may have been a
  small predatory dinosaur measuring around 3 to 4 meters (9.8 to 13.1 ft) in
  length.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Mandible with two surangular foramina separated by a flat, ventrally
    descending process
  - Caudal vertebrae with hollow, very thin-walled centra filled with
    crystallized matrix
  - Hyposphene-hypantrum articulation stout and present in at least sixteen
    proximal caudals
  - Prezygapophyses in proximal caudals with ridges on lateral surfaces,
    subvertically oriented
  - Ilium with two deep depressions on lateral surface of postacetabular process
    separated by a crestlike projection
  - Femur with anterior crest below lesser trochanter (absent in all other known
    archosaurs)
  - Tibia and fibula fused distally with each other and with coalesced
    astragalocalcaneum
  - Double surangular foramina (anterior and posterior)
  - Horizontal ridge on lateral surface of postacetabular process of ilium
