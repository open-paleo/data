genus: Brontomerus
parent: Somphospondyli
etymology: "From Greek bronte meaning 'thunder' and Greek meros meaning 'thigh'. Full meaning: 'thunder thigh', referring to its enormously muscled thighs."
pronunciation:
  phonetic: bron-toe-MEE-russ
description: Brontomerus is a genus of camarasauromorph sauropod which lived
  during the early Cretaceous (Aptian or Albian age, approximately 110 million
  years ago). It was named in 2011 and the type species is Brontomerus
  mcintoshi. It is probably a fairly basal camarasauromorph, though the taxon is
  difficult to resolve due to incompleteness of the material. It is most
  remarkable for its unusual hipbones, which would have supported the largest
  thigh muscles, proportionally, of any known sauropod. The specific name is in
  honor of physicist and North American sauropod expert John Stanton McIntosh.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Preacetabular lobe 55% of total ilium length, longer than in any other
    sauropod.
  - Preacetabular lobe directed anterolaterally at 30° to the sagittal, but
    straight in dorsal view and vertically oriented.
  - Postacetabular lobe reduced to near absence.
  - Ischiadic peduncle reduced to a very low bulge.
  - Ilium proportionally taller than in any other sauropod, 52% as high as long.
