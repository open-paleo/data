genus: Bustingorrytitan
parent: Saltasauroidea
etymology: Named after Manuel Bustingorry (the landowner on whose property fossils were found) combined with Greek Titan (Τιτάν) meaning 'giant'; overall meaning 'Bustingorry's giant'.
pronunciation:
  phonetic: bus-tin-goh-ree-tie-tuhn
description: Bustingorrytitan is a genus of lithostrotian titanosaur from the
  Late Cretaceous (Cenomanian) Huincul Formation of Argentina. The type species
  is Bustingorrytitan shiva.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Posterior dorsal vertebrae with spinodiapophyseal laminae bifurcated in two,
    with very well developed anterior and posterior rami limiting a deep,
    vertical, socket-like fossa
  - Posterior dorsal neural arches with forked centropostzygapophyseal laminae
  - Hyposphene present in anterior caudal vertebrae
  - Humerus with deltopectoral crest strongly expanded distally
  - Femur with a low longitudinal crest on the lateromedial half of the anterior
    face, bifurcated into two minor crests directed toward their respective
    condyles
appearance:
  integument: scaled
  evidence: inferred
