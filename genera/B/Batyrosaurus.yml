    etymology: "Named for Anatoly Konstantinovich Rozhdestvensky, a Russian
      paleontologist."
    status: valid
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Santonian
        - Campanian
    location:
      country: KZ
      locality: Akkurgan
      region: KZ-43
