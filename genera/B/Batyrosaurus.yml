        max: 4.5
    erected_in: godefroit2012a
references:
  - id: godefroit2012a
    notes: Named Batyrosaurus and recovered it as a basal hadrosauroid, more
      primitive than Probactrosaurus.
  - id: jones2026a
    notes: Source of the body length estimate.
  - id: norman2015a
    notes: Recovered Batyrosaurus as the most basal styracosternan, and used it
      as a specifier of a node-based Styracosterna.
  - id: verdú2017a
    notes: Recovered Batyrosaurus as a hadrosauroid, the sister of Proa, rejecting its placement among Norman's iguanodontoids.
  - id: lockwood2021a
    notes: Recovered Batyrosaurus as the sister of Penelopognathus within Hadrosauriformes.
  - id: poole2022a
    notes: Recovered Batyrosaurus as a basal hadrosauroid.
  - id: bonsor2023a
    notes: Recovered Batyrosaurus as the sister of Penelopognathus.
  - id: gasulla2015a
    notes: Recovered Batyrosaurus as the most basal styracosternan on Norman's matrix.
