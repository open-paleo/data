genus: Batyrosaurus
parent: Hadrosauroidea
etymology: "From Kazakh batyr meaning 'hero warrior' combined with Greek sauros
  meaning 'lizard'. Full meaning: 'Batyr (Kazakh hero warrior) lizard'."
pronunciation:
  phonetic: bah-TEE-row-SOR-us
description: Batyrosaurus is an extinct genus of herbivorous basal hadrosauroid
  dinosaur known from the Late Cretaceous Bostobe Formation (Santonian to
  Campanian stage) of central Kazakhstan. It contains a single species,
  Batyrosaurus rozhdestvenskyi. It is possible that Batyrosaurus represents the
  same taxon as the doubtful Arstanosaurus akkurganensis as both were found from
  the same formation.
dispute:
  summary: >
    Batyrosaurus rozhdestvenskyi was described as a basal hadrosauroid
    (Godefroit and colleagues, 2012), and most later analyses recover it
    there, often as the sister of Penelopognathus (Verdú and colleagues,
    2017; Lockwood and colleagues, 2021; Poole, 2022; Bonsor and colleagues,
    2023). Analyses on Norman's matrix instead place it as the
    earliest-diverging styracosternan, outside Hadrosauriformes (Gasulla and
    colleagues, 2015; Norman, 2015).
  history:
    - date: "2026-06-27"
      note: Placed at Hadrosauroidea following the prevailing view.
    - date: "2026-10-19"
      note: >
        Retained at Hadrosauroidea on the analyses that recover it
        there; supersedes the 2026-06-27 reliance on the prevailing
        view.
diet: herbivore
locomotion: bipedal
diagnostic_features:
  - Parietal forming long caudal lappets that overlie the supraoccipital and
    are overlain by the squamosals, but remain well separated from the
    paroccipital wings.
  - Frontals rostrocaudally elongated, approximately 1.7 times longer than
    wide.
  - Lateral side of rostral process of jugal bearing a deep horizontal sulcus
    below the lacrimal facet.
  - Glenoid surface of surangular perforated by a foramen.
paleoenvironment:
  - fluvial
  - forested
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "245643"
  - source: wikidata
    id: Q3278364
  - source: gbif
    id: "8633101"
  - source: eol
