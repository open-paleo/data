    type_specimen:
      specimen_id: [ AEHM 4/1 ]
      specimen_type: holotype
      institution: AENM
      material: Partial skull and mandible, ~60 isolated teeth, paired
        sternals, right humerus, left radius, fragmentary metacarpals, and
        manual phalanges.
      completeness: partial
    size:
      length_m:
