genus: Batyrosaurus
parent: Hadrosauroidea
etymology: "From Kazakh batyr meaning 'hero warrior' combined with Greek sauros meaning 'lizard'. Full meaning: 'Batyr (Kazakh hero warrior) lizard'."
description: Batyrosaurus is an extinct genus of herbivorous basal hadrosauroid
  dinosaur known from the Late Cretaceous Bostobe Formation (Santonian to
  Campanian stage) of central Kazakhstan. It contains a single species,
  Batyrosaurus rozhdestvenskyi. It is possible that Batyrosaurus represents the
  same taxon as the doubtful Arstanosaurus akkurganensis as both were found from
  the same formation.
diet: herbivore
locomotion: facultative
