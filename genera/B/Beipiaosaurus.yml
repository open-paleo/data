genus: Beipiaosaurus
parent: Therizinosauroidea
pronunciation:
  ipa: /ˌbeɪpjaʊˈsɔːrəs/
description: Beipiaosaurus is a genus of therizinosauroid theropod dinosaurs
  that lived in China during the Early Cretaceous in the Yixian Formation. The
  first remains were found in 1996 and formally described in 1999. Before the
  discovery of Yutyrannus, Beipiaosaurus were among the heaviest dinosaurs known
  from direct evidence to be feathered. Beipiaosaurus is known from three
  reported specimens. Numerous impressions of feather structures were preserved
  that allowed researchers to determine the feathering color which turned out to
  be brownish.
diet: herbivore
locomotion: bipedal
