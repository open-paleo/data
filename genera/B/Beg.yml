genus: Beg
parent: Neoceratopsia
etymology: "Named after Beg-tse, a Himalayan deity and god of war in Mongolian
  culture, whose rugose appearance echoes the preserved skull."
pronunciation:
  phonetic: beg
description: Beg is a genus of neoceratopsian dinosaur from the Late Cretaceous
  Ulaanoosh Formation of Mongolia. The type and only species is Beg tse,
  described in 2020.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - "'L-shaped' lacrimal with anterior and posterior rami of nearly equal
    length, unlike other basal neoceratopsians that lack the anterior ramus."
  - Small foramen on medial surface of anterior third of jugal anterior ramus,
    near contact with maxilla.
  - Premaxilla with four enlarged cylindrical premaxillary teeth, unique among
    ceratopsians (others have three or fewer).
  - Five equally spaced tubercles on lateral surface of surangular lateral
    ridge, not observed in any other ceratopsian or dinosaur.
  - Large deep pit (groove) on ventral exposure of jugal, opening anteriorly at
    posterior corner of antorbital fossa, absent in other ceratopsians.
