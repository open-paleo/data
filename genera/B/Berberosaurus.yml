genus: Berberosaurus
parent: Ceratosauridae
etymology: Berber lizard
description: Berberosaurus is a genus of neotheropod dinosaur, possibly a
  ceratosaur, from the Toarcian-age (Lower Jurassic) "Toundoute Continental
  Series" (Azilal Formation) found in the Central High Atlas of Toundoute,
  Ouarzazate, Morocco. The type species of the genus Berberosaurus is B.
  liassicus, in reference to the Lias epoch. Berberosaurus might be the oldest
  known ceratosaur, and is based on partial postcranial remains. This genus
  represents the oldest formally identified theropod from the North of Africa,
  as well one of the few from the region in the Early Jurassic.
diet: carnivore
