genus: Berberosaurus
parent: Ceratosauria
etymology: From Berber (referring to the Berber people of Morocco, near where the fossils were found) + Greek sauros (σαῦρος) meaning 'lizard'; overall meaning 'Berber lizard'.
pronunciation:
  phonetic: BUHR-buh-SOR-us
description: Berberosaurus is a genus of neotheropod dinosaur, possibly a
  ceratosaur, from the Toarcian-age (Lower Jurassic) "Toundoute Continental
  Series" (Azilal Formation) found in the Central High Atlas of Toundoute,
  Ouarzazate, Morocco. The type species of the genus Berberosaurus is B.
  liassicus, in reference to the Lias epoch. Berberosaurus might be the oldest
  known ceratosaur, and is based on partial postcranial remains. This genus
  represents the oldest formally identified theropod from the North of Africa,
  as well one of the few from the region in the Early Jurassic.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Highly pneumatic cervical vertebrae with anteroposteriorly short centra and
    camerate internal structure
  - Cervical neural spine anteroposteriorly short
  - Ventral margin of sacral series strongly arched dorsally with transversely
    narrow sacral centra
  - Proximal end of the second metacarpal deeply grooved ventrally
  - Femoral anterior trochanter reaches proximally to mid-point of femoral head
    with large femoral trochanteric shelf
  - Oblique ridge that proximally caps the medial sulcus of the fibula; tibia
    with subtriangular distal profile
