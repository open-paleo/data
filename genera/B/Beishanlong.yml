genus: Beishanlong
parent: Ornithomimosauria
description: Beishanlong is a genus of giant ornithomimosaurian theropod
  dinosaur from the Early Cretaceous of China. It is the second-largest
  ornithomimosaur discovered, only surpassed by the related Deinocheirus.
