genus: Beishanlong
parent: Ornithomimosauria
dispute:
  summary: >
    The family-level placement of Beishanlong is unresolved. Lee et al. (2014)
    recovered it as the basalmost member of Deinocheiridae, but Serrano-Brañas et
    al. (2020) instead recovered it as a basal ornithomimosaur outside the family.
    It is placed conservatively at Ornithomimosauria.
  history:
    - date: "2026-06-30"
      note: >
        Retained at Ornithomimosauria; the basal-deinocheirid placement of Lee et
        al. (2014) is recorded as an unresolved alternative.
etymology: "From Chinese Bei Shan meaning 'North Mountains' combined with Chinese long (龙) meaning 'dragon'. Full meaning: 'North Mountains dragon'."
pronunciation:
  phonetic: bay-SHAN-long
description: Beishanlong is a genus of giant ornithomimosaurian theropod
  dinosaur from the Early Cretaceous of China. It is the second-largest
  ornithomimosaur discovered, only surpassed by the related Deinocheirus.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
diagnostic_features:
  - Notched anterior caudal neural spine apex, unique to this taxon
  - Keeled midcaudal centra with divided neural spines and prominent ridges
    connecting pre- and postzygapophyses
  - Scapula with pronounced fossa at rostral end of supraglenoid buttress
  - Shallow coracoid with prominent lateral ridge emanating from coracoid tuber
    and deep notch between glenoid and postglenoid process
  - Curved pollex ungual but markedly straighter unguals on digits II and III
  - Curved ischial shaft with rostro-ventrally recurved sigmoid profile
appearance:
  integument: feathered
  evidence: direct
