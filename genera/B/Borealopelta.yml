genus: Borealopelta
parent: Nodosauridae
etymology: "From Greek boreas meaning 'northern/north wind' and Greek pelta meaning 'shield'. Full meaning: 'northern shield', referring to its armored body and Canadian (northern) origin."
pronunciation:
  phonetic: BOH-ree-AH-low-PEL-tuh
description: Borealopelta is an extinct genus of herbivorous nodosaurid
  ankylosaur from the Lower Cretaceous of what is today Alberta, Canada. It
  contains a single species, B. markmitchelli, named in 2017 by Caleb Brown and
  colleagues from a well-preserved specimen known as the Suncor nodosaur.
  Discovered at an oil sands mine north of Fort McMurray, Alberta, the specimen
  is remarkable for being among the best-preserved dinosaur fossils of its size
  ever found. It preserved not only the armor (osteoderms) in their life
  positions, but also remains of their keratin sheaths, overlying skin, and
  stomach contents from the animal's last meal. Melanosomes were also found that
  indicate the animal had a reddish pinkish skin tone.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - marine
appearance:
  features:
    - osteoderms
    - body armor
    - shoulder spikes
  integument: armored
diagnostic_features:
  - Large hexagonal dermal plate in frontoparietal region and multiple (>20)
    small dermal plates in frontonasal region
  - Jugal (suborbital) horn base longer than orbit length
  - Cervical and thoracic osteoderms form continuous (abutting) transverse rows
    completely separated by continuous transverse rows of polygonal basement
    scales
  - "Osteoderm count for transverse rows: cervicals C1-3, C2-3, C3-3, transition
    TR-2, thoracic T1-6"
  - Third and sixth transverse thoracic osteoderm rows expressed medially but
    pinch out laterally
