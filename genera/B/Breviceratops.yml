genus: Breviceratops
parent: Protoceratopsidae
pronunciation:
  phonetic: BREV-i-SER-a-tops
etymology: From Latin brevis meaning 'short' + Greek keras (κέρας) meaning
  'horn' + ops (ὤψ) meaning 'face'; overall meaning 'short horned face'.
description: Breviceratops is a genus of protoceratopsid dinosaur that lived
  during the Late Cretaceous in what is now the Barun Goyot Formation, Mongolia.
dispute:
  summary: >
    Much of the material historically referred to Breviceratops kozlowskii has
    been reassigned to the sympatric Bagaceratops rozhdestvenskyi. Czepiński
    (2019) restricted Breviceratops kozlowskii to its holotype (ZPAL MgD-I/117)
    and one referred skull (ZPAL MgD-I/116), reassigning the remaining referred
    specimens — including Kurzanov's (1990) Hermiin Tsav skulls — to
    Bagaceratops, but upheld Breviceratops as a valid taxon distinct from both
    Bagaceratops and Protoceratops.
  history:
    - date: "2026-07-20"
      note: Referred material restricted to the holotype and ZPAL MgD-I/116
        following Czepiński (2019); genus retained as valid and distinct from
        Bagaceratops.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - arid
diagnostic_features:
  - Premaxillary teeth retained
  - Dentary without a sharp buccal crest
  - Well-developed accessory antorbital fenestra
appearance:
  features:
    - keratinous beak
  integument: feathered
  evidence: direct
