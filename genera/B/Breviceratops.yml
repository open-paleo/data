genus: Breviceratops
parent: Protoceratopsidae
pronunciation:
  phonetic: BREV-i-SER-a-tops
etymology: From Latin brevis meaning 'short' + Greek keras (κέρας) meaning
  'horn' + ops (ὤψ) meaning 'face'; overall meaning 'short horned face'.
description: Breviceratops is a genus of protoceratopsid dinosaur that lived
  during the Late Cretaceous in what is now the Baruungoyot Formation, Mongolia.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - arid
diagnostic_features:
  - Premaxillary teeth retained
  - Dentary without a sharp buccal crest
  - Well-developed accessory antorbital fenestra
appearance:
  features:
    - keratinous beak
  integument: feathered
  evidence: direct
identifiers:
  - source: pbdb
    id: "58853"
  - source: wikidata
    id: Q18606469
  - source: gbif
    id: "4823186"
erected_in: kurzanov1990a
species:
  - name: Breviceratops kozlowskii
    etymology: "Named for Polish paleontologist Roman Kozłowski, retaining the
      epithet from the original species name Protoceratops kozlowskii."
    status: valid
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Santonian
        - Campanian
        - Maastrichtian
    location:
      country: MN
      locality: Khulsan
      region: MN-053
      formation: Baruungoyot
    size:
      length_m:
        min: 0.25
        max: 0.25
      weight_kg:
        min: 0.5
        max: 0.5
      hip_height_m:
        min: 0.1
        max: 0.1
    type_specimen:
      specimen_id: [ ZPAL MgD-I/117 ]
      specimen_type: holotype
      institution: ZPAL
      material: Immature skull with mandible and an associated fragmentary
        postcranial skeleton.
      completeness: partial
    synonyms:
      - name: Protoceratops kozlowskii
        type: reassigned
        reason: Original combination by Maryańska and Osmólska (1975); Kurzanov
          (1990) erected the new genus Breviceratops for the species.
    erected_in: maryańska1975a
    described_in: czepiński2019a
references:
  - id: maryańska1975a
    notes: Original description of the species as Protoceratops kozlowskii,
      based on the holotype ZPAL MgD-I/117 and referred juvenile material from
      Khulsan.
  - id: kurzanov1990a
    notes: Erected the genus Breviceratops for Protoceratops kozlowskii,
      retaining ZPAL MgD-I/117 as the holotype.
  - id: czepiński2019a
    notes: Restricted the species to the holotype and ZPAL MgD-I/116, moved
      most referred material to Bagaceratops, left ZPAL MgD-I/119, 121 and 122
      as Protoceratopsidae indet., and upheld it as distinct.
  - id: gradziński1972a
    notes: Maps the expedition's numbered Khulsan sites. Its sites 4 and 5 are
      the two small protoceratopsid skulls the describing paper cites, without
      distinguishing which yielded the holotype.
  - id: jones2026a
    notes: Source of the body length, mass, and hip height estimates, and the
      appearance features.
