genus: Bonapartenykus
parent: Patagonykinae
etymology: Named after José F. Bonaparte, the prominent Argentine paleontologist, combined with Greek onyx/onykhos (ὄνυξ/ὄνυχος) meaning 'claw'; overall meaning 'José F. Bonaparte's claw'.
pronunciation:
  phonetic: bo-nuh-par-toh-ni-kuss
description: Bonapartenykus is an extinct genus of alvarezsauroid dinosaur that
  lived during the Late Cretaceous (Campanian-Maastrichtian) of what is now the
  Allen Formation of the Río Negro Province, Argentina. The genus contains a
  single species, Bonapartenykus ultimus, known from a partially articulated,
  incomplete skeleton that was found in close association to two incomplete eggs
  and several clusters of eggshells belonging to the oogenus Arriagadoolithus.
  Bonapartenykus was named in 2012. It has an estimated length of 2.5-3.3 m
  (8.2-10.8 ft) and weight of 43-72 kg (95-159 lb), making it the largest member
  of the clade Alvarezsauroidea. Additional skeletons referrable to this genus
  have subsequently been described.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Mid-dorsal vertebrae with spinopostzygapophyseal laminae ending abruptly
    above the postzygapophyses
  - Ventral portion of coracoid strongly medially deflected and decorated with
    delicate but profuse grooves
  - Fused scapulocoracoids
  - Scapula with a very wide notch on the posterior margin of the bone
  - Ilium and pubis fused
appearance:
  integument: feathered
  evidence: direct
