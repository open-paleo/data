genus: Brachylophosaurus
parent: Saurolophinae
pronunciation:
  ipa: /brəˌkɪləfəˈsɔːrəs/
  phonetic: bruh-KIL-uh-fuh-SOR-uhs or brak-i-LOH-fuh-SOR-uhs
etymology: "From Greek brachys meaning 'short', Greek lophos meaning 'crest',
  and Greek sauros meaning 'lizard'. Full meaning: 'short-crested lizard',
  referring to its reduced flat crest."
description: Brachylophosaurus is a genus of hadrosaurid dinosaur that lived
  during the Late Cretaceous period of western North America. It was first named
  in 1953 by Charles Mortram Sternberg for a skull and skeleton he discovered in
  1936 in the Oldman Formation of Alberta, Canada, for which he named the new
  taxon Brachylophosaurus canadensis. While this single specimen was the only
  known material of Brachylophosaurus for a long time, extensive discoveries in
  the Judith River Formation of Montana, USA have uncovered not only additional
  skulls and skeletons with extensive impressions of skin, but also a bonebed of
  800 specimens. The earliest of these discoveries in Montana was named
  Brachylophosaurus goodwini by John R. Horner, but it is now believed that
  there was only a single species of Brachylophosaurus, with B. goodwini as
  either a junior synonym of B. canadensis or an indeterminate member of
  Brachylophosaurini.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Nasals developed into a paddle-like solid crest that extends caudodorsally
    and overhangs the dorsal region of the skull
  - Nasals bearing an anteroposteriorly oriented groove that terminates in an
    elongated foramen medial to the prefrontal
  - Prefrontal projected posteriorly, resting over the anterior process of the
    postorbital and extending ventromedially beneath the nasal
  - Only the anterior sharp tip of the lacrimal contacts the maxilla
  - Extremely elongated, rod-like anterodorsal process of the maxilla running
    medial to the narial cavity along most of the length of the external naris
  - Forearm greatly elongated, with the radius and ulna longer than the
    humerus - unusual among flat-headed hadrosaurs
appearance:
  features:
    - solid cranial crest
    - keratinous beak
    - dorsal spines
  integument: scaled
  evidence: direct
