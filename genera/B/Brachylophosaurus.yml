genus: Brachylophosaurus
parent: Brachylophosaurini
pronunciation:
  ipa: /brəˌkɪləfəˈsɔːrəs/
  phonetic: brə-KIL-ə-fə-SOR-əs or brak-i-LOH-fə-SOR-əs
etymology: "From Greek brachys meaning 'short', Greek lophos meaning 'crest', and Greek sauros meaning 'lizard'. Full meaning: 'short-crested lizard', referring to its reduced flat crest."
description: Brachylophosaurus is a genus of hadrosaurid dinosaur that lived
  during the Late Cretaceous period of western North America. It was first named
  in 1953 by Charles Mortram Sternberg for a skull and skeleton he discovered in
  1936 in the Oldman Formation of Alberta, Canada, for which he named the new
  taxon Brachylophosaurus canadensis. While this single specimen was the only
  known material of Brachylophosaurus for a long time, extensive discoveries in
  the Judith River Formation of Montana, USA have uncovered not only additional
  skulls and skeletons with extensive impressions of skin, but also a bonebed of
  800 specimens. The earliest of these discoveries in Montana was named
  Brachylophosaurus goodwini by John R. Horner, but it is now believed that
  there was only a single species of Brachylophosaurus, with B. goodwini as
  either a junior synonym of B. canadensis or an indeterminate member of
  Brachylophosaurini.
diet: herbivore
locomotion: facultative
