notable_specimens:
  - nickname: "Elvis"
    specimen_id: [MOR 794]
    institution: MOR
    species: Brachylophosaurus canadensis
    category: most-complete
    significance: "Articulated skeleton and skull preserved in three dimensions without flattening, missing only the very tip of the tail, making it about 95% complete. Its completeness enabled Prieto-Marquez's 2005 redescription of the genus. On display at the Phillips County Museum."
    discovered:
      year: 1994
      by: "Nate Murphy"
    references: [prieto-márquez2005]
  - specimen_id: [FMNH PR 862]
    institution: FMNH
    category: historic
    significance: "Disarticulated crested-hadrosaur skull collected September 9, 1922 on the Field Museum's Red Deer River expedition under Elmer S. Riggs. Recognized in field notes as an entirely new type of crested hadrosaur, it was later referred to Brachylophosaurus, predating the genus's naming."
    discovered:
      year: 1922
      by: "George Fryer Sternberg"
    references: [brinkman2013]
  - specimen_id: [TMP 1990.104.1]
    institution: TMP
    category: gut-contents
    significance: "Well-preserved southern Alberta specimen from near Manyberries and Onefour, preserving the front half of a skeleton and a complete skull. Remains largely undescribed apart from comparison of its stomach contents and skeleton to the holotype."
    references: [cuthbertson2010]
  - nickname: "Leonardo"
    specimen_id: [JRF 115]
    institution: GPDM
    species: Brachylophosaurus canadensis
    category: exceptional-preservation
    significance: "Mummified specimen with about 90% of its cast surface covered by skin impressions, recognized by Guinness World Records as the Best Preserved Dinosaur. Preserves polygonal scales, a dorsal row of triangular feature scales, stomach contents, and needle-like parasitic worms."
    discovered:
      year: 2000
    references: [murphy2006]
