genus: Bolong
parent: Hadrosauroidea
etymology: From the names of the brothers Bo Hai-chen and Bo Xue (who helped
  uncover the specimen) + Mandarin lóng (龍) meaning 'dragon'; overall meaning
  'Bo's dragon'.
pronunciation:
  phonetic: BO-long
description: Bolong is a genus of iguanodontian dinosaur known from the Early
  Cretaceous Yixian Formation of western Liaoning Province, China. It lived
  about 125 million years ago in the earliest Aptian.
dispute:
  summary: >
    Bolong yixianensis is placed among the basalmost hadrosauroids by
    Jones (2026) and subsequent work, though a later analysis by the
    describing authors (Wu and Godefroit, 2012) recovered it as the
    basalmost hadrosauroid, next to a monophyletic Iguanodontidae.
  history:
    - date: "2026-06-29"
      note: Placed at Hadrosauroidea (basal) following the prevailing
        view.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - lacustrine
  - forested
diagnostic_features:
  - A depressed pit at the junction between the maxilla and lachrymal, in the
    position corresponding to an antorbital fenestra (which is absent)
  - Caudal ramus of prefrontal forming a rostrocaudally elongated depression
    above the orbital margin
  - Ventral process of predentary running caudally parallel to the ventral
    margin of the predentary
  - Rostrodorsal articular surface for the predentary occupying less than
    two-thirds of the height of the dentary, with the rostral tip of the dentary
    situated at the lower one-third of the bone height
  - Primary ridge on maxillary tooth crowns deflected distally (posteriorly
    curved)
appearance:
  features:
    - keratinous beak
  integument: scaled
  evidence: inferred
