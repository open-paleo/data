genus: Betasuchus
parent: Ceratosauria
description: Betasuchus is a genus of probable abelisaurid theropod dinosaur
  which lived during the Late Cretaceous Period. Betasuchus is, besides
  Orthomerus and birds such as Enantiornithines, the only dinosaur genus named
  from remains found in the Netherlands and the only non-avian theropod found in
  the Maastrichtian Beds.
