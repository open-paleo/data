genus: Betasuchus
parent: Abelisauroidea
dispute:
  summary: >
    Betasuchus is based on a single femur fragment and is widely regarded as
    a nomen dubium. It is generally interpreted as an abelisaurid, although
    Carrano and Sampson (2008) placed it only as an indeterminate ceratosaur
    and an affinity with Dryptosaurus has also been proposed.
  history:
    - date: "2026-06-30"
      note: >
        Placed at Abelisauroidea incertae sedis following the prevailing
        interpretation.
etymology: "From Greek 'beta' (the second letter) and 'suchos' meaning
  'crocodile'; von Huene coined the name when renaming 'Megalosaurus bredai' in
  1932, giving 'B crocodile'."
pronunciation:
  phonetic: BAYT-uh-SOOK-us
description: Betasuchus is a genus of probable abelisaurid theropod dinosaur
  which lived during the Late Cretaceous Period. Betasuchus is, besides
  Orthomerus and birds such as Enantiornithines, the only dinosaur genus named
  from remains found in the Netherlands and the only non-avian theropod found in
  the Maastrichtian Beds.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - marine
  - coastal
diagnostic_features:
  - Femur shaft unusually compressed laterally, with vertical thickness equaling
    or exceeding width
  - Proximal trochanter separated from proximal end of bone anteriorly
  - Lateral trochanter in notably proximal position, small in size, less than 5
    cm long
  - Superior/anterior surface of shaft marked by blunt ridge becoming more
    angular toward proximal trochanter
  - Articular head strongly compressed transversely and bent inward, transverse
    width not more than 6.5 cm
  - Shaft curvature (bow-shape) relatively greater than in Megalosaurus bucklandi
appearance:
  integument: scaled
  evidence: inferred
