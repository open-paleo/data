genus: Baminornis
parent: Avialae
etymology: '"Bamin" (Mandarin), for Fujian Province, + "ornis" (Greek), bird'
description: Baminornis is an extinct genus of basal avialan known from the
  Upper Jurassic (Kimmeridgian age) Nanyuan Formation of China. The genus
  contains a single species, Baminornis zhenghensis, known from a partial
  skeleton. Baminornis was initially identified as the oldest known avialan to
  bear a fused pygostyle, but later research cast doubt on the identification of
  this structure, claiming it could instead be part of the synsacrum.
diagnostic_features:
  - Fused pygostyle of five vertebrae that curves dorsally and is longer than
    metacarpal II
  - Metacarpal I with an asymmetric ginglymoid distal articulation and an
    enlarged medial condyle
  - Ungual of manual digit I about twice as large as that of digit III
  - Ischium lacking both the obturator process and the posterior process
  - Strut-like coracoid separated from the scapula, with a boomerang-shaped
    furcula whose interclavicular angle is 65 degrees
  - Manual phalangeal formula 2-3-4, with metacarpal III extending further
    distally than metacarpal II and digit III shorter than metacarpal III
