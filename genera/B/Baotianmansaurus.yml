genus: Baotianmansaurus
parent: Titanosauria
pronunciation:
  phonetic: bow-tyen-MAHN-SAWR-us
etymology: Named for the Baotianman National Nature Reserve in Henan Province,
  China, where the fossils were found, combined with Greek 'sauros' meaning
  'lizard'.
description: Baotianmansaurus is an extinct genus of somphospondylian sauropod.
  Its fossils were discovered in the Late Cretaceous Gaogou Formation of Henan
  Province, China. The type and only species is B. henanensis - named after the
  province in which it was found.
dispute:
  summary: >
    Placed within Titanosauria as incertae sedis. Its position is genuinely
    contested: the describing paper (Zhang et al., 2009) declined to place
    Baotianmansaurus within Titanosauria, assigning it to Titanosauriformes, and
    it has since been recovered as a non-titanosaurian somphospondylan (Mannion
    et al., 2019), a basal titanosaur, and a derived saltasauroid. The most
    recent dedicated analysis (Han et al., 2024) recovers it within Titanosauria,
    on which basis it is retained here, though that study notes its position
    remains controversial.
  history:
    - date: "2026-06-30"
      note: >
        Retained in Titanosauria following Han et al. (2024); the describing paper
        placed it only in Titanosauriformes and other analyses recover it outside
        Titanosauria.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Transverse process of dorsal vertebra supported by four laminae (ppdl, pcdl,
    aspdl, pspdl), differing from all other sauropods whose transverse processes
    are supported by three laminae.
  - Dorsal portion of the anterior centroparapophyseal lamina is bifurcated,
    with a small branch extending to the ventral surface of the prezygapophysis.
  - Posterior centrodiapophyseal lamina is thin, nearly vertical, and
    plate-like, not forked at its ventral end.
  - Postzygodiapophyseal lamina undeveloped, not reaching the top of the
    diapophysis.
  - Anterior dorsal ribs apneumatic with a large concavity on the posterior
    surface of the proximal end, lacking a pneumatic foramen near the proximal
    end.
  - Anterior caudal vertebra much shorter than wide, amphicoelous, with suboval
    articular ends.
