genus: Buriolestes
parent: Sauropodomorpha
etymology: "Named after the Buriol family, owners of the Buriol ravine in São João do Polêsine, Brazil where the holotype was discovered, combined with Greek 'lestes' meaning 'robber'. The species name honors paleontologist Cezar Schultz."
pronunciation:
  phonetic: BUH-ree-oh-LESS-teez
description: Buriolestes is a genus of early sauropodomorph dinosaurs from the
  Late Triassic Santa Maria Formation of the Paraná Basin in southern Brazil. It
  contains a single species, B. schultzi, named in 2016. The type specimen was
  found alongside a specimen of the lagerpetid pterosauromorph Ixalerpeton.
diagnostic_features:
  - Autapomorphic caudal projection of the medial condyle of the tibia, medial
    to the intercondylar notch.
  - Teeth caudally curved with serrations forming straight angles to crown
    margin, absent on mesial carina of elongate rostral teeth.
  - Lacks reduced skull and enlarged external naris typical of other
    sauropodomorphs.
  - Third sacral vertebra lacks dorsoventrally expanded ribs, incorporated from
    tail series.
  - Calcaneum proximodistally flattened with reduced tuber; outer malleolus
    absent.
