genus: Bannykus
parent: Alvarezsauroidea
etymology: "From Mandarin Chinese ban (半) meaning 'half' combined with Greek onyx meaning 'claw'. Full meaning: 'half claw', referring to the transitional characteristics of this theropod's claws."
description: Bannykus is an extinct genus of alvarezsauroid from the Early
  Cretaceous Bayin-Gobi Formation of Inner Mongolia, China. It includes one
  species, Bannykus wulatensis.
