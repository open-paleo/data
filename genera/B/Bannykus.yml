genus: Bannykus
parent: Alvarezsauroidea
etymology: "From Mandarin Chinese ban (半) meaning 'half' combined with Greek onyx meaning 'claw'. Full meaning: 'half claw', referring to the transitional characteristics of this theropod's claws."
pronunciation:
  phonetic: ban-ik-us
description: Bannykus is an extinct genus of alvarezsauroid from the Early
  Cretaceous Bayin-Gobi Formation of Inner Mongolia, China. It includes one
  species, Bannykus wulatensis.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Notch between basal tubera nearly absent
  - Surangular foramen large
  - Posterior dorsal vertebrae with distal ends of transverse processes strongly
    expanded in posterior direction
  - Humeral internal tuberosity deflected posteriorly
  - Well-developed facet on lateral surface of metacarpal II for articulation
    with metacarpal III
  - Metacarpal III curved medially
appearance:
  features:
    - enlarged manual claws
  integument: feathered
  evidence: inferred
