genus: Baalsaurus
parent: Titanosauria
pronunciation:
  phonetic: BAY-ul-SAWR-us
etymology: "Named after the Baal fossil site in Argentina (itself named after the ancient Phoenician god Baal) combined with Greek sauros meaning 'lizard'. Full meaning: 'Baal lizard'."
description: Baalsaurus is a genus of titanosaurian sauropod dinosaur from the
  Late Cretaceous of Neuquén Province, Patagonia, Argentina. The type and only
  known species is B. mansillai, with the specific name honoring the discoverer
  Juan Eduardo Mansilla, a museum technician at the Geology and Paleontology
  Museum of the National University of Comahue.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Dentary alveoli with 10 alveoli on the anterior ramus (unique among known
    titanosaur dentaries).
  - Dentary symphysis inclined ventrally and anteriorly (anteroventrally),
    unlike other titanosaurs where it is perpendicular or inclined
    posteroventrally.
  - Wide ventral Meckelian groove surrounded by a thin lamina forming a keel on
    the ventral border of the dentary.
appearance:
  integument: scaled
  evidence: inferred
