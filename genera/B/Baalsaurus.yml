genus: Baalsaurus
parent: Titanosauria
description: Baalsaurus is a genus of titanosaurian sauropod dinosaur from the
  Late Cretaceous of Neuquén Province, Patagonia, Argentina. The type and only
  known species is B. mansillai, with the specific name honoring the discoverer
  Juan Eduardo Mansilla, a museum technician at the Geology and Paleontology
  Museum of the National University of Comahue.
