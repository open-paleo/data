genus: Brontotholus
parent: Pachycephalosaurinae
etymology: From Greek 'brontē' (thunder) and 'tholos' (dome); in homage to the
  1985 film Mad Max Beyond Thunderdome and the paratype locality name Beyond
  Thunder Dome.
pronunciation:
  phonetic: BRON-toe-thole-luss
description: Brontotholus is an extinct genus of pachycephalosaurid dinosaur
  known from the Late Cretaceous (Campanian stage) Two Medicine and Oldman
  formations of Montana, United States, and Alberta, Canada, respectively. The
  genus contains a single species, Brontotholus harmoni, known from multiple
  partial domes.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Frontoparietal dome anteroposteriorly longer than laterally wide throughout
    ontogeny
  - In dorsal view, dome is sub-triangular, laterally wider posteriorly and
    strongly tapering anteriorly
  - In anterior/posterior view, dome has a low dorsal profile, being over 1.5
    times laterally wider than dorsoventrally thick in largest specimens
  - Peripheral element sutural contacts (posterior supraorbital, postorbital)
    have vaulted, triangularly peaked dorsal margins
  - Posterior supraorbital sutural contacts have a prominent dorsoventral
    concavity
  - Sutural contacts of posterior supraorbital and postorbital bear several
    projecting dorsoventral ridges and grooves
