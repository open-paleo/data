genus: Bambiraptor
parent: Dromaeosauridae
pronunciation:
  phonetic: BAM-bee-RAP-tor
etymology: "Named after the Disney movie character Bambi (itself from Italian
  bambino meaning 'child') combined with Latin raptor meaning 'thief'. Full
  meaning: 'Bambi thief', referring to its small size."
description: Bambiraptor is a genus of bird-like dromaeosaurid theropod dinosaur
  that lived during the Late Cretaceous (about 72 million years ago) of Montana.
  It was described by scientists at the University of Kansas, Yale University,
  and the University of New Orleans. The holotype fossil is less than 1 m (3.3
  ft) long, although this specimen appears to be a juvenile, and it is possible
  that Bambiraptor is a juvenile Saurornitholestes. It is even suspected that
  the type specimen is a chimera, based on the fact that "there are elements of
  three different similarly sized lower legs included in the holotype." Because
  of its small size, it was named Bambiraptor feinbergi, after the popular
  Disney movie character (the name literally translates to "Bambi thief") and
  the surname of the wealthy family who bought and lent the specimen to the new
  Graves Museum of Natural History in Florida.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Jugal with row of foramina along ventral margin
  - Scapula with large, medially directed acromion and distinct, short
    scapulocoracoid suture
  - Coracoid with neck or peduncle forming part of glenoid; coracoid foramen
    absent
  - 13 Dentary teeth and 9 maxillary teeth
  - Ratio of humerus plus ulna to femur notably large (H+U/F = 1.68)
  - Femur strongly recurved both laterally and posteriorly; lacks fourth
    trochanter
appearance:
  features:
    - sickle claw
    - elongate forelimbs
  integument: feathered
  evidence: inferred
