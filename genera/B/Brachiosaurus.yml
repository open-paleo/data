notable_specimens:
  - nickname: "Felch Quarry skull"
    specimen_id: [YPM 1986, USNM 5730]
    institution: USNM
    category: complementary
    significance: "The only skull referred to Brachiosaurus, preserving cranial anatomy absent in the postcranial holotype; reconstructed as the largest sauropod skull from the Morrison Formation. Found by M. P. Felch in Felch Quarry 1 near Garden Park, Colorado; species referral remains uncertain."
    discovered:
      year: 1883
      by: "Marshall Parker Felch"
    references: [carpenter1998b]
  - nickname: "Toni"
    specimen_id: [SMA 0009]
    institution: SMA
    category: ontogeny
    significance: "Nearly complete postcranial skeleton of a roughly 2-meter juvenile from the Morrison Formation of the Bighorn Basin, Wyoming; used to reconstruct Brachiosaurus ontogeny, including neck lengthening and humerus changes. Probable referral to B. altithorax was later questioned."
    references: [carballido2012b]
references:
  - id: riggs1904a
    notes: Captions the type in place at "Dinosaur Quarry No. 13 near Grand
      Junction, Colorado".
  - id: riggs1903a
    notes: Erects Brachiosaurus altithorax on FMNH P 25107 from the Morrison
      Formation of western Colorado.
  - id: carpenter1998b
  - id: taylor2009a
    notes: Formally separates Brachiosaurus altithorax from the Tendaguru taxon
      (recombined as Giraffatitan brancai); provides the current revised
      diagnosis and shows the holotype is a subadult.
  - id: carballido2012b
  - id: jones2026b
    notes: Source of the hip height estimate, and the appearance features.
  - id: janensch1914a
    notes: Described the Tendaguru material as Brachiosaurus brancai, later Giraffatitan.
