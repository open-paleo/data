genus: Brachiosaurus
parent: Brachiosauridae
etymology: From Greek 'brachion' (arm) and 'sauros' (lizard); meaning 'arm
  lizard', referring to its proportionally long forelimbs (the humerus is
  longer than the femur).
pronunciation:
  ipa: /ˌbrækiəˈsɔːrəs/
  phonetic: BRAK-ee-uh-SOR-uhs
description: Brachiosaurus is the type genus of Brachiosauridae and the iconic
  giraffe-postured Late Jurassic North American sauropod. The single valid
  species, Brachiosaurus altithorax, was erected by Elmer S. Riggs in 1903
  on a partial postcranial skeleton (FMNH P 25107) from Riggs Quarry No. 13
  in the Grand River valley near Grand Junction, Colorado, on the basis of
  forelimbs longer than hindlimbs and an unusually deep thorax. For nearly
  a century the African Tendaguru material described by Janensch (1914) as
  'Brachiosaurus brancai' was treated as a second species, but Taylor
  (2009) formally separated it as Giraffatitan brancai on the basis of at
  least 26 osteological differences across the dorsal vertebrae, caudals,
  coracoids, humeri, ilia, and femora; the holotype itself is now
  understood to represent a subadult individual (the coracoid is unfused
  to the scapula). The Felch Quarry skull (USNM 5730) is tentatively
  retained in the hypodigm but cannot be confirmed without overlapping
  material with the holotype. Subsequent splits have separated additional
  brachiosaurid material into Lusotitan (Portugal) and Vouivria (France),
  leaving Brachiosaurus monospecific and restricted to the Morrison
  Formation of the western United States.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
appearance:
  features:
    - nasal crest
  integument: scaled
diagnostic_features:
  - Humerus longer than femur, producing the distinctive giraffe-like upward-
    sloping body posture.
  - Posterior dorsal centra subcircular in cross-section; postspinal lamina
    absent from the dorsal vertebrae.
  - Posterior dorsal neural spines triangular in lateral view and progressively
    expand mediolaterally to a petal- or paddle-shaped distal end.
  - Spinodiapophyseal and spinopostzygapophyseal laminae of middle and
    posterior dorsal vertebrae contact each other.
  - Anterior caudal vertebrae bear hyposphenes, have transversely widened
    neural spines, and lack lateral fossae.
  - Coracoid elongate along the scapular-suture axis with a glenoid surface
    directed laterally and mediolaterally broad on a thick buttress.
  - Tubercle on the dorsal margin of the postacetabular lobe of the ilium.
  - Femur with tibial and fibular condyles equal in width, fourth trochanter
    extending to mid-shaft height, and a straight lateral shaft margin.
