    location:
      country: CZ
      locality: Nová Lhota near Mezholezy
      region: CZ-205
      formation: Peruc-Korycany
      notes: No member is recorded. Madzia and colleagues (2017) refine the
        horizon to the Korycany Beds, but Fejfar and colleagues (2005), whose
        stratigraphy they follow, place the remains at formation rank and no
        finer, and describe the Peruc and Korycany Beds as partly isochronous
        facies of the local column whose irregular boundary is why the combined
        formation was adopted.
    erected_in: madzia2017a
    type_specimen:
      specimen_id: [NMP Ob 203]
      specimen_type: holotype
      institution: NMP
      material: A well-preserved, nearly complete left femur.
      completeness: fragmentary
references:
