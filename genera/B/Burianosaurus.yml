genus: Burianosaurus
parent: Ornithopoda
etymology: Named in honor of Czech palaeoartist Zdeněk Burian, combined with Greek 'sauros' meaning 'lizard'.
pronunciation:
  phonetic: BOO-ree-AN-o-SOR-us
description: Burianosaurus is an extinct genus of ornithopod dinosaur that lived
  during the Cenomanian stage of the Late Cretaceous period in what is now the
  Czech Republic, being the first validly named dinosaur from that country. The
  type species, B. augustai, was named in 2017; the genus name honors the Czech
  palaeoartist Zdeněk Burian, and the species name honors the Czech
  paleontologist Josef Augusta. The holotype specimen is a femur discovered in
  sediments belonging to the Peruc-Korycany Formation in 2003, which was
  described as possibly belonging to an iguanodont in 2005.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - coastal
diagnostic_features:
  - Femur gracile (Femoral Gracility Index = 0.195), with diameter less than 15%
    of total length
  - Femoral shaft straight in both medial and lateral views
  - Insertion scar for M. caudofemoralis longus appressed to the base of the
    fourth trochanter
  - In medial view the distal condyles do not extend the shaft anteriorly
  - Intercondylar extensor groove relatively deep and narrow, forming a
    mediolaterally narrow, proximodistally elongate, anteroposteriorly deep
    channel
