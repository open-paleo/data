genus: Bagualia
parent: Eusauropoda
etymology: wild horse
description: Bagualia is an extinct genus of eusauropod dinosaur from the Early
  Jurassic (middle Toarcian) Cañadón Asfalto Formation in what is now the Chubut
  Province of Argentina. The type species, B. alba, was formally described in
  2020. Bagualia represents the oldest known definitive eusauropod, and due to
  the completeness of its material, it represents one of the most important taxa
  for understanding the early evolution of the group.
diet: herbivore
