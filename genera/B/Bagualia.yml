genus: Bagualia
parent: Eusauropoda
etymology: From Spanish baguala meaning 'wild horse', referencing Bagual Canyon in Chubut, Argentina, where the fossils were discovered.
pronunciation:
  phonetic: bag-WAH-lee-uh
description: Bagualia is an extinct genus of eusauropod dinosaur from the Early
  Jurassic (middle Toarcian) Cañadón Asfalto Formation in what is now the Chubut
  Province of Argentina. The type species, B. alba, was formally described in
  2020. Bagualia represents the oldest known definitive eusauropod, and due to
  the completeness of its material, it represents one of the most important taxa
  for understanding the early evolution of the group.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - lacustrine
diagnostic_features:
  - Pointed process on the anteroventral end of the premaxilla and anterodorsal
    end of the dentary (autapomorphy).
  - Anterior margin of the premaxilla without a marked step (autapomorphy).
  - Orbital margin of the frontal with a close V-shape pointed medially,
    resulting in a short contribution to the orbit (autapomorphy).
  - Supratemporal fenestra about as anteroposteriorly long as lateromedially
    wide (autapomorphy).
  - Concave ventral margin of the distal portion of the cultriform process
    (autapomorphy).
  - Accessory lamina below the PCDL in middle cervical vertebrae (autapomorphy).
