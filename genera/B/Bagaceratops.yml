genus: Bagaceratops
parent: Protoceratopsidae
pronunciation:
  phonetic: BAH-gah-SER-a-tops
etymology: From Mongolian baga meaning 'small' + Greek keras (κέρας) meaning
  'horn' + ops (ὤψ) meaning 'face'; overall meaning 'small-horned face'.
description: Bagaceratops is a genus of small protoceratopsid dinosaurs that
  lived in Asia during the Late Cretaceous, around 72 to 71 million years ago.
  Bagaceratops remains have been reported from the Barun Goyot Formation and
  Bayan Mandahu Formation. One specimen may argue the possible presence of
  Bagaceratops in the Djadochta Formation.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - arid
diagnostic_features:
  - Parietosquamosal frill short, most probably without fenestrae
  - Nasals bearing a prominent unpaired horn core
  - Additional antorbital fenestra present, located at the premaxilla-maxilla
    suture
  - Premaxillary dentition absent; anterior edentulous portion of upper jaw very
    long
  - Mandible shallow with straight ventral margin
  - Ten maxillary teeth in largest known specimen
appearance:
  features:
    - cranial bosses
    - keratinous beak
    - neck frill
  integument: scaled
  evidence: inferred
