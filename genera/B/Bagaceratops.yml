genus: Bagaceratops
parent: Protoceratopsidae
etymology: small-horned face
description: Bagaceratops is a genus of small protoceratopsid dinosaurs that
  lived in Asia during the Late Cretaceous, around 72 to 71 million years ago.
  Bagaceratops remains have been reported from the Barun Goyot Formation and
  Bayan Mandahu Formation. One specimen may argue the possible presence of
  Bagaceratops in the Djadochta Formation.
diet: herbivore
