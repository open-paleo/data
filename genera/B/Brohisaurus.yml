genus: Brohisaurus
parent: Titanosauriformes
etymology: From the Brohi people of the Kirthar Range area of
  Balochistan and Greek sauros (lizard); meaning "Brohi lizard".
description: >
  Brohisaurus is a problematic sauropod erected by Malkani (2003)
  on highly fragmentary, weathered, ferruginous-replaced remains
  (femoral shaft fragments, a proximal fibula, broken metapodials
  and ribs, and possible neural-arch laminae) from the Sembar
  Formation of the Kirthar Range, Balochistan, Pakistan. Malkani described the
  names as "purely tentative" and the material lacks unambiguous diagnostic
  features. Brohisaurus is
  generally regarded as a nomen dubium. A 2025 paper proposing an ankylosaurian
  reinterpretation appeared in a predatory-publisher venue and has not achieved
  community consensus; it is not adopted.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - marine
  - coastal
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "119652"
  - source: wikidata
    id: Q1061780
  - source: gbif
    id: "4967405"
species:
  - name: Brohisaurus kirthari
    etymology: From the Kirthar Range, the host locality of the
      type material.
    status: nomen dubium
    type_species: true
    period:
      name:
        - Late Jurassic
      stage:
        - Kimmeridgian
    location:
      country: PK
      region: PK-BA
      formation: Sembar
      locality: Sun Chaku
      part: lower
    type_specimen:
      specimen_id:
        - MSM-86-K
      specimen_type: holotype
      institution: GSP
      material: Highly fragmentary postcranial remains including a femoral shaft
        cross-section, proximal fibula, metatarsal/metacarpal cross-sections, broken rib
        pieces, and possible neural-arch lamina fragments.
      completeness: fragmentary
    erected_in: malkani2003a
references:
  - id: malkani2003a
    notes: Erects Brohisaurus kirthari on fragmentary postcranial material;
      author explicitly flags the names as tentative.
