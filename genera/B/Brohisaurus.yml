genus: Brohisaurus
parent: Titanosauriformes
etymology: From the Brohi people of the Kirthar Range area of
  Balochistan and Greek sauros (lizard); meaning "Brohi lizard".
description: >
  Brohisaurus is a problematic sauropod erected by Malkani (2003)
  on highly fragmentary, weathered, ferruginous-replaced remains
  (femoral shaft fragments, a proximal fibula, broken metapodials
  and ribs, and possible neural-arch laminae) from the Sembar
  Formation of the Kirthar Range, Balochistan, Pakistan. Malkani
  himself described the names as "purely tentative" and the
  material lacks unambiguous diagnostic features. Brohisaurus is
  generally regarded as a nomen dubium. A 2025 paper proposing an
  ankylosaurian reinterpretation appeared in a predatory-publisher
  venue and has not achieved community consensus; it is not
  adopted here.
diet: herbivore
locomotion: quadrupedal
diagnostic_features:
  - Femoral shaft cross-section markedly elliptical (about 12 by
    6 cm in the holotype suite).
  - Proximal fibula with a well-developed proximal scar; possible
    pneumatic cavities in the anterior ribs.
paleoenvironment:
  - marine
  - coastal
appearance:
  integument: scaled
  evidence: inferred
