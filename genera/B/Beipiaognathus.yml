genus: Beipiaognathus
parent: Compsognathidae
etymology: "Named after Beipiao, a city in Liaoning Province, China, combined
  with Greek gnathos meaning 'jaw'. Full meaning: 'Beipiao jaw'."
description: Beipiaognathus is a dubious genus of coelurosaurian theropod from
  the Early Cretaceous Yixian Formation of Liaoning, China. The type species is
  Beipiaognathus jii and it was named and described by Hu et al. in 2016.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
  - forested
diagnostic_features:
  - Teeth are conical-like and un-serrated (lacking serrations on posterior
    carinae unlike other compsognathids)
  - Forelimb relatively long with forelimb/hindlimb ratio of 55%, highest among
    compsognathids, due to relatively long ulna (femur/ulna = 1.09)
  - Metacarpal I short and rectangular-shaped, about 24% the length of
    metacarpal II (distinctly shorter than in other Chinese compsognathids)
  - Phalanx II-1 is the most robust and longest manual phalanx, wider than the
    radius (unique among reported compsognathids)
  - Pedal digit III is longest, followed by digit IV then digit II (digit II
    shorter than digit IV, unlike Huaxiagnathus and Sinocalliopteryx)
  - Tail relatively short with no more than 40 caudal vertebrae (fewer than
    Sinosauropteryx with 64 and Sinocalliopteryx with 49)
