genus: Beipiaognathus
parent: Compsognathidae
etymology: "Named after Beipiao, a city in Liaoning Province, China, combined with Greek gnathos meaning 'jaw'. Full meaning: 'Beipiao jaw'."
description: Beipiaognathus is a dubious genus of coelurosaurian theropod from
  the Early Cretaceous Yixian Formation of Liaoning, China. The type species is
  Beipiaognathus jii and it was named and described by Hu et al. in 2016.
