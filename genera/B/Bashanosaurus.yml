genus: Bashanosaurus
parent: Stegosauria
etymology: From Bashan (巴山, an ancient name for the Chongqing/Sichuan region of China, where the fossils were found) + Greek sauros (σαῦρος) meaning 'lizard'; overall meaning 'Bashan lizard'.
pronunciation:
  phonetic: buh-SHA-no-SOR-us
description: Bashanosaurus is an extinct genus of stegosaurian dinosaur from the
  Middle Jurassic (Bathonian age) Shaximiao Formation of Yunyang County, China.
  The genus contains a single species, Bashanosaurus primitivus, known from
  incomplete skeletons belonging to three individuals. It is one of the
  basalmost stegosaurs, as well as one of the oldest known stegosaurs, along
  with Adratiklit, Isaberrysaura, and Thyreosaurus.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Parapophyses of dorsal vertebrae elevated on stalks at the base of the
    transverse process, clearly visible in anterior and posterior views.
  - Scapula blade is slender and flares distally (ratio of maximum to minimum
    blade height ~3.4), unlike other stegosaurs where the blade does not expand
    distally.
  - Acromial process of the scapula is small, triangular, and poorly developed,
    less developed than in Huayangosaurus.
  - Fourth trochanter of the femur is positioned below the middle of the shaft,
    distinct from stegosaurs where it is at midshaft or poorly developed.
  - Bases of dermal plates are strongly convex and transversely thickened,
    separated from the anterior/posterior plate margins by a distinct groove.
appearance:
  features:
    - dermal plates
    - dorsal spines
  integument: armored
  evidence: direct
