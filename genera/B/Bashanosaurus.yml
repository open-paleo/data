genus: Bashanosaurus
parent: Stegosauria
etymology: Bashan lizard
description: Bashanosaurus is an extinct genus of stegosaurian dinosaur from the
  Middle Jurassic (Bathonian age) Shaximiao Formation of Yunyang County, China.
  The genus contains a single species, Bashanosaurus primitivus, known from
  incomplete skeletons belonging to three individuals. It is one of the
  basalmost stegosaurs, as well as one of the oldest known stegosaurs, along
  with Adratiklit, Isaberrysaura, and Thyreosaurus.
diet: herbivore
locomotion: quadrupedal
