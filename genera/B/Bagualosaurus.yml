genus: Bagualosaurus
parent: Bagualosauria
etymology: "From 'bagual', a term in the dialect of Rio Grande do Sul (Brazil)
  meaning 'strongly built fellow', referring to the strong hindlimbs of the
  animal, combined with Greek 'sauros' meaning 'lizard'. The species name refers
  to the provenance from the town of Agudo."
pronunciation:
  phonetic: bag-WAH-lo-SOR-us
description: Bagualosaurus is a genus of sauropodomorph dinosaur from the
  Candelária Sequence (Uppermost Santa Maria Formation) of Brazil, dating to
  around 230 million years ago, in the Carnian of the Late Triassic. It includes
  one species, Bagualosaurus agudoensis.
locomotion: bipedal
paleoenvironment:
  - fluvial
diet: herbivore
diagnostic_features:
  - Dorsal surface of iliac acetabulum straight, with supracetabular crest not
    overhanging the acetabulum ventrally (autapomorphy)
  - Pubic tubercle with a distinct longitudinal sulcus (autapomorphy)
  - Lateromedially widened pubic peduncle with no dorsal crest
  - Distal tibia with a conspicuous caudomedial notch
  - First premaxillary tooth at least as high as the highest tooth in the
    maxillary row
  - Premaxillary and dentary teeth retreated from the rostral margin of the snout
appearance:
  integument: scaled
  evidence: inferred
