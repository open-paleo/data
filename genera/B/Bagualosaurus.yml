genus: Bagualosaurus
parent: Bagualosauria
etymology: "From 'bagual', a term in the dialect of Rio Grande do Sul (Brazil)
  meaning 'strongly built fellow', referring to the strong hindlimbs of the
  animal, combined with Greek 'sauros' meaning 'lizard'. The species name refers
  to the provenance from the town of Agudo."
pronunciation:
  phonetic: bag-WAH-lo-SOR-us
description: Bagualosaurus is a genus of sauropodomorph dinosaur from the
  Candelária Sequence (Uppermost Santa Maria Formation) of Brazil, dating to
  around 230 million years ago, in the Carnian of the Late Triassic. It includes
  one species, Bagualosaurus agudoensis.
locomotion: bipedal
paleoenvironment:
  - fluvial
diet: herbivore
diagnostic_features:
  - Dorsal surface of iliac acetabulum straight, with supracetabular crest not
    overhanging the acetabulum ventrally (autapomorphy)
  - Pubic tubercle with a distinct longitudinal sulcus (autapomorphy)
  - Lateromedially widened pubic peduncle with no dorsal crest
  - Distal tibia with a conspicuous caudomedial notch
  - First premaxillary tooth at least as high as the highest tooth in the
    maxillary row
  - Premaxillary and dentary teeth retreated from the rostral margin of the snout
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "370985"
  - source: wikidata
    id: Q54315693
species:
  - name: Bagualosaurus agudoensis
    etymology: "Named for the town of Agudo in Rio Grande do Sul, Brazil, near where
      the holotype was discovered."
    status: valid
    type_species: true
    period:
      name:
        - Late Triassic
      stage:
        - Carnian
    location:
      country: BR
      locality: Janner site
      region: BR-RS
      formation: Santa Maria
      member: Alemoa
      coordinates:
        - -29.653025
        - -53.292833
      notes: >
        Pretto and colleagues (2018) correlate the Janner site with the
        "Hyperodapedon Assemblage Zone, part of the Candelária Sequence of the
        Santa Maria Formation". Langer and colleagues (2018) date the bone bed
        near the top of the formation at no older than 233.23 ± 0.73 Ma,
        "consistent with a late Carnian (Tuvalian) age", and correlate the
        zone with the Scaphonyx-Exaeretodon-Herrerasaurus biozone of the
        Ischigualasto Formation; the Norian beds of the supersequence are in
        the overlying Caturrita Formation.
    type_specimen:
      specimen_id: [ UFRGS-PV-1099-T ]
      specimen_type: holotype
      institution: UFRGS
      material: Semi-articulated skeleton including partial skull and mandible, trunk
        vertebrae, sacrum and isolated caudal vertebrae, fragmented ribs, gastralia,
        isolated haemal arches, both ilia, right pubis, femora, tibiae, fibulae and
        partial left pes
      completeness: partial
    size:
      weight_kg:
        min: 6
        max: 6
      hip_height_m:
        min: 0.7
        max: 0.7
      length_m:
        min: 2.25
        max: 2.25
    erected_in: pretto2018a
