genus: Bagualosaurus
parent: Bagualosauria
etymology: "From 'bagual', a term in the dialect of Rio Grande do Sul (Brazil) meaning 'strongly built fellow', referring to the strong hindlimbs of the animal, combined with Greek 'sauros' meaning 'lizard'. The species name refers to the provenance from the town of Agudo."
description: Bagualosaurus is a genus of sauropodomorph dinosaur from the
  Candelária Sequence (Uppermost Santa Maria Formation) of Brazil, dating to
  around 230 million years ago, in the Carnian of the Late Triassic. It includes
  one species, Bagualosaurus agudoensis.
locomotion: bipedal
diet: herbivore
