genus: Bajadasaurus
parent: Dicraeosaurinae
etymology: "Named after La Bajada, the locality in Patagonia, Argentina where it was found, combined with Greek sauros meaning 'lizard'. Full meaning: 'Bajada lizard'."
description: Bajadasaurus is a genus of sauropod dinosaur from the Early
  Cretaceous epoch (late Berriasian to Valanginian stages, between 145 and 132.9
  million years ago) of northern Patagonia, Argentina. It was first described in
  2019 based on a single specimen found in 2010 that includes a largely complete
  skull and parts of the neck. The only species is Bajadasaurus pronuspinax. The
  genus is classified as a member of the Dicraeosauridae, a group of relatively
  small and short-necked sauropods.
