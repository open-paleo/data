genus: Bajadasaurus
parent: Dicraeosauridae
etymology: "Named after La Bajada, the locality in Patagonia, Argentina where it was found, combined with Greek sauros meaning 'lizard'. Full meaning: 'Bajada lizard'."
pronunciation:
  phonetic: bah-HAH-dah-SOR-us
description: Bajadasaurus is a genus of sauropod dinosaur from the Early
  Cretaceous epoch (late Berriasian to Valanginian stages, between 145 and 132.9
  million years ago) of northern Patagonia, Argentina. It was first described in
  2019 based on a single specimen found in 2010 that includes a largely complete
  skull and parts of the neck. The only species is Bajadasaurus pronuspinax. The
  genus is classified as a member of the Dicraeosauridae, a group of relatively
  small and short-necked sauropods.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Post-temporal fenestra extended medially with a long parietal contribution
    (autapomorphy)
  - Basipterygoid processes extremely slender and long, more than six times
    longer than lateromedially wide (autapomorphy)
  - Elongate angular, longer than the anteroposterior surangular length
  - Neural spine of the axis oriented vertically (autapomorphy)
  - Paired, anteriorly curved, and extremely elongate bifid neural spines of
    anterior-mid cervical vertebrae (autapomorphy)
appearance:
  features:
    - bifurcated cervical spines
  integument: scaled
  evidence: inferred
