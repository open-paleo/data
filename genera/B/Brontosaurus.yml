genus: Brontosaurus
parent: Apatosaurinae
pronunciation:
  phonetic: BRON-tuh-SOR-uhs
  ipa: /ˌbrɒntəˈsɔːrəs/
etymology: "From Greek bronte (βροντή) meaning 'thunder' and Greek sauros (σαῦρος) meaning 'lizard'. Full meaning: 'thunder lizard'."
description: 'Brontosaurus is a genus of herbivorous sauropod dinosaur that
  lived in present-day United States during the Late Jurassic period. It was
  described by American paleontologist Othniel Charles Marsh in 1879, the type
  species being dubbed B. excelsus, based on a partial skeleton lacking a skull
  found in Como Bluff, Wyoming. In subsequent years, two more species of
  Brontosaurus were named: B. parvus in 1902 and B. yahnahpin in 1994.
  Brontosaurus lived about 156 to 146 million years ago (mya) during the
  Kimmeridgian and Tithonian ages in the Morrison Formation of what is now Utah
  and Wyoming. For decades, the animal was thought to have been a taxonomic
  synonym of its close relative Apatosaurus, but a 2015 study by Emmanuel
  Tschopp and colleagues found it to be distinct. It has seen widespread
  representation in popular culture, being the archetypal "long-necked" dinosaur
  in general media.'
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Sacrum composed of five thoroughly coossified vertebrae
  - Sacrum comparatively light due to extensive cavities in the vertebrae with
    very thin walls
  - Lumbar vertebrae with constricted centra containing large cavities
  - Caudal vertebrae nearly or quite solid
  - Chevrons with articular heads separate
appearance:
  features:
    - dorsal sail
  integument: scaled
  evidence: inferred
