genus: Bicentenaria
parent: Coelurosauria
etymology: From Latin bicentenaria meaning 'two hundred year anniversary', named after the 200th anniversary of the 1810 May Revolution in Argentina.
pronunciation:
  phonetic: bi-sen-ten-ahr-ee-uh
description: Bicentenaria is an extinct genus of carnivorous coelurosaurian
  theropods which lived during the early Late Cretaceous (Cenomanian) Candeleros
  Formation of Argentina. It contains the type species, B. argentina.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - arid
diagnostic_features:
  - Premaxillary teeth with mesial denticles only at the base of the crown
  - Quadratojugal with a rostral process two times longer than the dorsal process
  - Quadrate with lateral condyle much larger than the medial one
  - Surangular with a raised dorsal margin trapezoidal-shaped in lateral profile
  - Retroarticular process dorsoventrally depressed, transversely wide, and
    spoon-shaped
  - Manual unguals of external digits bearing proximal dorsal lips
appearance:
  integument: feathered
  evidence: direct
