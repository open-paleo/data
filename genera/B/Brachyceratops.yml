genus: Brachyceratops
parent: Ceratopsidae
pronunciation:
  phonetic: BRAK-i-SER-a-tops
etymology: "From Greek brachys (βραχύς) meaning 'short', Greek keras (κέρας)
  meaning 'horn', and Greek ops (ὤψ) meaning 'face'. Full meaning: 'short horned
  face'."
description: Brachyceratops is a dubious genus of ceratopsian dinosaur from the
  late Cretaceous Period of Montana, United States. Brachyceratops has
  historically been known from juvenile remains, with one specimen having since
  been re-classified as Rubeosaurus ovatus. Because the holotype is too
  incomplete and juvenile to preserve diagnostic features, Sampson et al. (1997)
  and McDonald (2011) regarded Brachyceratops as a nomen dubium.
dispute:
  summary: >
    Brachyceratops is a nomen dubium based on incomplete juvenile material;
    Sampson et al. (1997) and McDonald (2011) found the holotype too immature to
    diagnose, and a referred specimen has been reassigned to Rubeosaurus. Though
    almost certainly a centrosaurine, it cannot be placed reliably below family
    level and is retained at Ceratopsidae incertae sedis.
  history:
    - date: "2026-06-26"
      note: Moved from Centrosaurinae to Ceratopsidae incertae sedis, undiagnostic juvenile holotype; the centrosaurine analyses and Jones (2026) leave it unplaced.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Nasal horn core divided longitudinally by median suture, representing
    outgrowth from nasal bones rather than separate ossification center
  - Facial portion of skull greatly abbreviated (shortened) and deep vertically
    compared with other ceratopsians
  - Frill fenestrae of comparatively small size and situated entirely within the
    median (interparietal) element
  - Frill margin scalloped with series of prominences but without separate
    marginal ossifications (no epoccipital bones)
  - Supraorbital (postorbital) horn cores small, with antero-posterior diameter
    greatly exceeding transverse diameter
  - Dentition greatly reduced relative to Triceratops, with only about 20
    maxillary alveoli versus 40 in Triceratops
