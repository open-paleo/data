genus: Bahariasaurus
parent: Avetheropoda
etymology: Bahariya lizard
description: Bahariasaurus is an enigmatic genus of large theropod dinosaur. The
  genus contains a single species, Bahariasaurus ingens, which was found in
  North African rock layers dating to the Cenomanian age of the Late Cretaceous.
  The only fossils confidently assigned to Bahariasaurus were found in the
  Bahariya Formation of the Bahariya Oasis in Egypt by Ernst Stromer. This
  material was destroyed during a World War II bombing raid, with the same raid
  also destroying the holotypes of Spinosaurus, Aegyptosaurus, and other animals
  found in the Bahariya Formation.
