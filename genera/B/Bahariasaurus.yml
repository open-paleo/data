genus: Bahariasaurus
parent: Abelisauroidea
dispute:
  summary: >
    Bahariasaurus ingens is a large theropod whose holotype was destroyed in 1944,
    complicating its classification. It has historically been allied with tetanurans
    (as a carcharodontosaurid or megaraptoran), but recent phylogenetic analyses
    recover it within Ceratosauria as an abelisauroid (Carrano and Sampson, 2008;
    Rauhut and Carrano, 2016; Cau, 2024; Cau and Paterna, 2025). Cau and Paterna
    (2025) further argue that Deltadromeus agilis is a junior synonym of
    Bahariasaurus; that synonymy is not yet widely adopted. It is placed at
    Abelisauroidea incertae sedis following the prevailing recent view.
  history:
    - date: "2026-07-02"
      note: Moved from Avetheropoda to Abelisauroidea incertae sedis following recent analyses recovering it as an abelisauroid ceratosaur; the historical tetanuran (carcharodontosaurid/megaraptoran) hypotheses and the proposed Deltadromeus synonymy remain unresolved.
pronunciation:
  phonetic: bah-hah-REE-ya-SAWR-us
etymology: From Bahariya (the Bahariya Oasis and Formation in Egypt, where the
  fossils were found) + Greek sauros (σαῦρος) meaning 'lizard'; overall meaning
  'Bahariya lizard'.
description: Bahariasaurus is an enigmatic genus of large theropod dinosaur. The
  genus contains a single species, Bahariasaurus ingens, which was found in
  North African rock layers dating to the Cenomanian age of the Late Cretaceous.
  The only fossils confidently assigned to Bahariasaurus were found in the
  Bahariya Formation of the Bahariya Oasis in Egypt by Ernst Stromer. This
  material was destroyed during a World War II bombing raid, with the same raid
  also destroying the holotypes of Spinosaurus, Aegyptosaurus, and other animals
  found in the Bahariya Formation.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - coastal
  - wetland
diagnostic_features:
  - Posterior dorsal vertebrae platycoelous, strongly elongate (nearly twice as
    long as high anteriorly), diaphysis constricted with lateral oval foramen
    indicating internal hollowness, diapophysis broad supported only by
    posterior strut, no parapophysis
  - Sacrum of 3 vertebrae with platycoelous elongate bodies, each with a lateral
    foramen and a broad longitudinal ventral groove
  - Pubic foot extremely small and almost lacking an anterior part, shaft forms
    U-shape with contralateral bone, very long symphysis with thin connecting
    lamella ending above the foot
  - Ilium with remarkably straight upper margin, postacetabular part tapering to
    an acute posterior angle, ischial process very short
  - Femur shaft slender and convexly curved forward; trochanter IV only a strong
    longitudinal ridge positioned above mid-shaft; medial condyle below flatter
    and less deeply projecting than the strongly arched outer condyle
  - Scapula shaft of approximately constant width to the very top (not expanded
    distally), contrasting with all known theropods; coracoid triangular without
    posterior median corner, with foramen near the joint
