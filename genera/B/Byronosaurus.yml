genus: Byronosaurus
parent: Troodontinae
pronunciation:
  phonetic: BIE-ruh-no-SAWR-us
etymology: "Named in honor of Byron Jaffe, in recognition of his family's support for the Mongolian Academy of Sciences-American Museum of Natural History Paleontological Expeditions, combined with Greek 'sauros' meaning 'lizard'."
description: Byronosaurus is a genus of troodontid dinosaur from the Late
  Cretaceous Period of Mongolia.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - arid
diagnostic_features:
  - Teeth devoid of serrations on the anterior and posterior carinae (unserrated
    teeth throughout the tooth row).
  - Presence of a large interfenestral bar that is not inset medially from the
    lateral surface of the maxilla.
  - Presence of a connection between the nasal passage and the antorbital
    fenestra through the interfenestral bar.
  - A horizontal groove on the maxilla adjacent and parallel to the tooth row,
    containing small foramina.
appearance:
  features:
    - elongate snout
  integument: feathered
  evidence: inferred
