genus: Brighstoneus
parent: Hadrosauriformes
etymology: "Named after Brighstone, a village on the Isle of Wight, England, near where the fossil was found, combined with Latin/Greek -eus suffix. Full meaning: 'one from Brighstone'."
pronunciation:
  phonetic: bri-STO-nee-us
description: Brighstoneus is a genus of hadrosauriform dinosaur from the Early
  Cretaceous Wessex Formation of the Isle of Wight, England. The genus contains
  a single species, Brighstoneus simmondsi, known from a partial skeleton.
dispute:
  summary: >
    Brighstoneus simmondsi was described as a basal hadrosauriform
    (Lockwood and others, 2021; followed by Jones, 2026), but Lockwood
    and others (2024) recovered it outside Hadrosauriformes as the
    earliest-diverging hadrosauroid.
  history:
    - date: "2026-06-27"
      note: Placed at Hadrosauriformes following the original
        description and Jones (2026); the basal-hadrosauroid result of
        Lockwood and others (2024) reflected, not adopted (P2).
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
diagnostic_features:
  - Maxillary crowns possessing both a primary ridge and mesially placed
    accessory ridges on the lingual surface (autapomorphy).
  - Nasal expanded postnarially to produce a modest nasal bulla with convex
    lateral walls (autapomorphy).
  - At least 28 dentary alveolar positions - highest recorded in an ornithopod
    with non-parallel alveolar septa - in combination with one active crown and
    one replacement tooth per position.
