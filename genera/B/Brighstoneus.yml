genus: Brighstoneus
parent: Hadrosauriformes
etymology: "Named after Brighstone, a village on the Isle of Wight, England, near where the fossil was found, combined with Latin/Greek -eus suffix. Full meaning: 'one from Brighstone'."
description: Brighstoneus is a genus of hadrosauriform dinosaur from the Early
  Cretaceous Wessex Formation of the Isle of Wight, England. The genus contains
  a single species, Brighstoneus simmondsi, known from a partial skeleton.
