genus: Baryonyx
parent: Baryonychinae
pronunciation:
  phonetic: BAR-ee-ON-iks
  ipa: /ˌbæriˈɒnɪks/
etymology: "From Greek 'barys' meaning 'heavy' and 'onyx' meaning 'claw', referring to the large, heavy thumb claw that is characteristic of this dinosaur."
description: Baryonyx is a genus of theropod dinosaur which lived in the
  Barremian stage of the Early Cretaceous period, about 130-125 million years
  ago. The first skeleton was discovered in 1983 in the Smokejack Clay Pit, of
  Surrey, England, in sediments of the Weald Clay Formation, and became the
  holotype specimen of Baryonyx walkeri, named by paleontologists Alan J.
  Charig and Angela C. Milner in 1986. The genus name Baryonyx comes from
  Ancient Greek βαρύς (barús), meaning "heavy" or "strong", and ὄνυξ (ónux),
  meaning "claw", alluding to the animal's very large claw on the first finger;
  the specific name, walkeri, refers to its discoverer, amateur fossil collector
  William J. Walker. The holotype specimen is one of the most complete theropod
  skeletons from the UK (and remains the most complete spinosaurid), and its
  discovery attracted media attention. Specimens later discovered in other parts
  of the United Kingdom and Iberia have also been assigned to the genus, though
  many have since been moved to new genera.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Prenarial rostrum extremely narrow with a spatulate, horizontal expansion at
    its tip, slightly downturned in lateral view
  - "Unusually high tooth count (~double typical theropods: dentary 32), crowns
    lightly fluted lingually with very fine serrations (~7 per mm) on anterior
    and posterior keels"
  - Long, strongly opisthocoelous cervical vertebrae with well-developed
    epiphyses and short neural spines; apposed centra do not produce the typical
    theropod upward neck curvature
  - Humerus with both ends broadly expanded and extremely flattened, offset ~35°
    against each other, with a massive nearly straight shaft
  - Small median knob at posterior end of conjoined nasals, cruciform in dorsal
    view, with anterior limb drawn forward into a low thin median crest
  - At least one pair of exceptionally large ungual phalanges (huge talons),
    probably on the manus, far exceeding typical theropod ungual proportions
