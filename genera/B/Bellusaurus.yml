genus: Bellusaurus
parent: Mamenchisauridae
pronunciation:
  phonetic: BEL-uh-SAWR-us
etymology: From Vulgar Latin bellus meaning 'beautiful' + Ancient Greek sauros
  (σαῦρος) meaning 'lizard'; overall meaning 'beautiful lizard'.
description: Bellusaurus was a sauropod dinosaur from the Late Jurassic
  (Oxfordian) known from juvenile specimens that would have measured about 4.8
  meters (16 ft) long. Its fossils were found in Shishugou Formation rocks in
  the northeastern Junggar Basin in China.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Small size with gracile body structure; spoon-shaped teeth with curvature
    rate of approximately 13 degrees
  - Cervical vertebrae opisthocoelous with robust centra, well-developed
    pleurocoels, and planar ventral surfaces lacking ventral keels
  - Neural arches and spines low; cervical and dorsal neural spines unbifid and
    appearing pseudospinus (vertical plate form)
  - Longest cervical vertebra 1.5 times longer than dorsal vertebrae; neck
    slightly longer than body
  - Sacrum composed of four vertebrae; sacricostal lobes present but distal ends
    not mutually connected (no yoke-like structure)
  - Anterior caudals procoelous; first caudal with fan-shaped diapophyses;
    haemal arch structure simple and unbifurcated
