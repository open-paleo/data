genus: Bellusaurus
parent: Mamenchisauridae
etymology: From Vulgar Latin bellus meaning 'beautiful' + Ancient Greek sauros (σαῦρος) meaning 'lizard'; overall meaning 'beautiful lizard'.
description: Bellusaurus was a sauropod dinosaur from the Late Jurassic
  (Oxfordian) known from juvenile specimens that would have measured about 4.8
  metres (16 ft) long. Its fossils were found in Shishugou Formation rocks in
  the northeastern Junggar Basin in China.
diet: herbivore
locomotion: quadrupedal
