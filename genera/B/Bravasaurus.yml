genus: Bravasaurus
parent: Rinconsauria
etymology: "From Laguna Brava National Park in La Rioja, Argentina (where fossils were found) + Greek sauros (σαῦρος) meaning 'lizard'; overall meaning 'Laguna Brava lizard'."
pronunciation:
  phonetic: BRAH-vah-SOR-us
description: Bravasaurus is a genus of titanosaurian sauropod dinosaur from the
  Late Cretaceous Ciénaga del Río Huaco Formation of La Rioja, Argentina. It
  contains one species, Bravasaurus arreirosorum.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Quadrate with articular surface entirely divided by medial sulcus
    (autapomorphy)
  - Spinoprezygapophyseal lamina forms conspicuous step between neural spine and
    prezygapophyses in middle cervical vertebrae (autapomorphy)
  - Robust dorsal edge of pneumatic foramen in dorsal centra forming prominent
    shelf extending laterally beyond ventral margin of centrum (autapomorphy)
  - Humerus with narrow midshaft; midshaft/proximal width ratio of 0.36
  - Slender fibula with Robustness Index of 0.15; distal condyle transversely
    expanded, more than twice the midshaft breadth
appearance:
  integument: scaled
  evidence: inferred
