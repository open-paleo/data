genus: Bravasaurus
parent: Rinconsauria
etymology: The generic name Bravasaurus is derived from the Laguna Brava
  National Park in Argentina. The specific name refers to the people, the
  arriero or drivers in Spanish, who carried cattle through the Andes in the
  19th century.
description: Bravasaurus is a genus of titanosaurian sauropod dinosaur from the
  Late Cretaceous Ciénaga del Río Huaco Formation of La Rioja, Argentina. It
  contains one species, Bravasaurus arreirosorum.
diet: herbivore
locomotion: quadrupedal
