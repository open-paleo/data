genus: Brasilotitan
parent: Rinconsauria
etymology: Brazil giant
description: Brasilotitan is a genus of titanosaurian sauropod dinosaur from the
  Late Cretaceous (early Maastrichtian) Adamantina Formation of Brazil. The type
  species is Brasilotitan nemophagus. Brasilotitan was a small titanosaur with a
  squared-off snout, and may be closely related to another Brazilian titanosaur,
  Uberabatitan.
diet: herbivore
