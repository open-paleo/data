genus: Brasilotitan
parent: Rinconsauria
etymology: From Brasil (Brazil, the country where fossils were found) + Greek Titan (Τιτάν) meaning 'giant'; overall meaning 'Brazil giant'.
pronunciation:
  phonetic: bruh-ZIL-o-TIE-tuhn
description: Brasilotitan is a genus of titanosaurian sauropod dinosaur from the
  Late Cretaceous (early Maastrichtian) Adamantina Formation of Brazil. The type
  species is Brasilotitan nemophagus. Brasilotitan was a small titanosaur with a
  squared-off snout, and may be closely related to another Brazilian titanosaur,
  Uberabatitan.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - arid
diagnostic_features:
  - Dorsal symphyseal region of the dentary twisted medially, a feature not
    previously recorded in any titanosaur
  - Dorsal portion of the dentary symphyseal contact broader anteroposteriorly
    than the ventral part
  - Presence of anteriorly directed accessory prezygapophyseal articulation
    surface on cervical vertebrae
  - Intraprezygapophyseal laminae of cervical vertebrae V-shaped in dorsal view
appearance:
  integument: scaled
  evidence: inferred
