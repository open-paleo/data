genus: Boreonykus
parent: Dromaeosaurinae
etymology: From Greek 'boreos' meaning 'northern' and 'nykus' or 'onyx' meaning 'claw', referring to its discovery in northern Canada.
pronunciation:
  phonetic: boh-ree-o-NY-kus
description: Boreonykus is an extinct genus of dromaeosaurid dinosaur, that
  lived during the Late Cretaceous in the area of present Canada.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Supratemporal ridge on frontals forming an acute angle (55°) anteriorly -
    single autapomorphy
  - Frontal elongate and slender with a low supratemporal ridge forming an arc
    concave relative to interfrontal suture in dorsal view
  - Area immediately posterior to supratemporal ridge smooth and
    posteroventrally sloping
appearance:
  integument: feathered
  evidence: direct
