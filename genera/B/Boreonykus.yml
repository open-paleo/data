genus: Boreonykus
parent: Eudromaeosauria
dispute:
  summary: >
    The subfamily placement of Boreonykus is unresolved. It was described as a
    velociraptorine (Bell and Currie, 2016) and Jones et al. (2026) treat it as a
    possible velociraptorine, whereas Currie and Evans (2019) recovered it within
    Dromaeosaurinae. Known from fragmentary cranial material, it is placed at
    Eudromaeosauria incertae sedis.
  history:
    - date: "2026-07-01"
      note: Moved from Dromaeosaurinae to Eudromaeosauria incertae sedis (least-inclusive uncontested clade); velociraptorine and dromaeosaurine hypotheses proposed.
etymology: From Greek 'boreos' meaning 'northern' and 'nykus' or 'onyx' meaning 'claw', referring to its discovery in northern Canada.
pronunciation:
  phonetic: boh-ree-o-NY-kus
description: Boreonykus is an extinct genus of dromaeosaurid dinosaur, that
  lived during the Late Cretaceous in the area of present Canada.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Supratemporal ridge on frontals forming an acute angle (55°) anteriorly -
    single autapomorphy
  - Frontal elongate and slender with a low supratemporal ridge forming an arc
    concave relative to interfrontal suture in dorsal view
  - Area immediately posterior to supratemporal ridge smooth and
    posteroventrally sloping
appearance:
  integument: feathered
  evidence: direct
