genus: Barsboldia
parent: Saurolophinae
pronunciation:
  phonetic: bahrs-BOHL-dee-a
etymology: Named after Rinchen Barsbold, a well-known Mongolian paleontologist,
  with the Latin suffix -ia; overall meaning 'of Barsbold'.
description: Barsboldia is a genus of large hadrosaurid dinosaur from the
  Maastrichtian Nemegt Formation of Ömnogöv, Mongolia. It is known from a
  partial vertebral column, partial pelvis, and some ribs.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
diagnostic_features:
  - Neural spines of anterior caudal vertebrae are club-like (strong, massive,
    oval in cross-section at mid-height and subcircular at top), unlike the
    rectangular-section spines of the dorsals and sacrals
  - Sacral neural spines comparatively high, highest at mid-synsacrum,
    decreasing more abruptly anteriorly than posteriorly; height-to-length ratio
    of sacral neural spines ranges from 7 to 9
  - Ilium very deep above the acetabulum (central body depth 325 mm);
    postacetabular process massive and directed upwards, giving the dorsal
    border a sigmoid curve in lateral view
  - Anteromedial portion of upper iliac margin strongly curved with
    preacetabular process markedly deflected
appearance:
  features:
    - dorsal sail
  integument: scaled
  evidence: inferred
