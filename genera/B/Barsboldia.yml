genus: Barsboldia
parent: Saurolophinae
etymology: Named after Rinchen Barsbold, a well-known Mongolian paleontologist, with the Latin suffix -ia; overall meaning 'of Barsbold'.
description: Barsboldia is a genus of large hadrosaurid dinosaur from the
  Maastrichtian Nemegt Formation of Ömnogöv, Mongolia. It is known from a
  partial vertebral column, partial pelvis, and some ribs.
diet: herbivore
locomotion: facultative
