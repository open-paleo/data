genus: Eucamerotus
parent: Titanosauriformes
etymology: "From Greek eu- (well/good) + kamara (chamber/vault) + -otos (pertaining to): 'well-chambered', referring to the hollow pneumatic cavities in its vertebrae."
pronunciation:
  phonetic: YOO-kam-uh-ROHT-us
description: Eucamerotus is an extinct genus of sauropod dinosaur from the Early
  Cretaceous (Barremian) Wessex Formation (Wealden) of the Isle of Wight,
  England. The type specimen, part of a vertebra (one of the bones of the
  spine), was discovered in the autumn of 1869 by John Hulke. After confirming
  its point of origin with the Rev. William Fox, Hulke presented his find to the
  Geological Society of London in 1870. Two years later, he assigned to it the
  name Eucamerotus, though did not provide a species name. Eucamerotus was
  subsequently treated as a junior synonym of two existing sauropods,
  Pelorosaurus and Ornithopsis. In 1995, William T. Blows gave a species name,
  creating the combination Eucamerotus foxi. While the validity of the genus has
  continued to be questioned, a 2011 publication found it to be a valid genus of
  titanosauriform. Comparisons with the fossils of other macronarians suggests
  it may have reached up to 15 m (49 ft) in length.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Opisthocoelous centrum (concave anterior articular surface)
  - Large deep excavation in side of centrum beneath neural canal root
    (pneumatic foramen); pneumaticity unusual for sauropod contemporaries
  - Vertical median wedge-plate (bolt) descending from postzygapophyses to
    neural canal crown, articulating with notch between prezygapophyses
  - Extremely complex neural arch with composite multi-pillar neural spine
    (anterior pillars rising from arch crown; posterior pillars above
    postzygapophyses) joined by thin laminae
  - Extensive horizontal platform along side of vertebra with strengthening
    ridges; large hollow beneath platform
  - Groined interior arch in neural canal with projecting groins converging to
    central point
