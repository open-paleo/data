      region: GB-IOW
      formation: Wessex
    type_specimen:
      specimen_id: [NHMUK PV R 2522]
      specimen_type: holotype
      institution: NHMUK
      material: "Anterior trunk vertebra: neural arch with neurapophyses (~5 in. long,
        ~5-6 in. tall); prezygapophyses with large oblong articular surfaces;
        postzygapophyses; composite neural spine with anterior/posterior pillars;
        horizontal platform extending ~5 in. from neural spine; centrum
        broken/missing; compact bone with thin plates and immense cancellated spaces."
