genus: Eustreptospondylus
parent: Megalosauridae
dispute:
  summary: >
    Eustreptospondylus oxoniensis is a basal megalosaurid whose exact position is
    unresolved. Carrano et al. (2012) and Benson (2010) recover it as the
    basalmost megalosaurid outside the two subfamilies, Rauhut et al. (2016)
    place it in the megalosaurid subfamily they call Eustreptospondylinae, and
    Jones (2026) treats it as a basal member of Megalosauria. Proposed synonymies
    with Magnosaurus and Streptospondylus have been rejected.
  history:
    - date: "2026-07-01"
      note: Placed at Megalosauridae (basal) following Carrano et al. (2012) and Benson (2010); the finer subfamily assignment is unresolved.
etymology: "From Ancient Greek eu- (well) + streptos (twisted) + spondylos
  (vertebra): 'well-twisted vertebra', referring to the morphology of its
  vertebrae."
pronunciation:
  phonetic: yoo-STREPT-o-spon-DY-luhs
  ipa: /juːˌstrɛptoʊspɒnˈdaɪləs/
description: Eustreptospondylus is an extinct genus of megalosaurid theropod
  dinosaur from the Callovian and Oxfordian stages of the Jurassic period (some
  time between 166 and 154 million years ago) in southern England, at a time
  when Europe was a series of scattered islands due to tectonic movement that
  raised the sea-bed and flooded the lowland.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - marine
diagnostic_features:
  - Shallow lachrymal fenestra incorporating a second, smaller foramen within
    the main excavation.
  - Squamosal with a hypertrophied ventral flange that overhangs the
    infratemporal fenestra in lateral view, partially obscuring its
    posterodorsal corner.
  - Ventral midline keels absent from the centra of the cervical, cervicodorsal,
    and dorsal vertebrae.
  - Marked depression on the anterior part of the ventral surface of cervical
    vertebra 10.
  - Excavation along the posterior surface of the ventral process of the
    postorbital, forming a shallow fossa around the anterior margin of the
    infratemporal fenestra (distinguishing it from all other spinosauroids).
