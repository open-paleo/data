genus: Eustreptospondylus
parent: Eustreptospondylinae
etymology: "From Ancient Greek eu- (well) + streptos (twisted) + spondylos
  (vertebra): 'well-twisted vertebra', referring to the morphology of its
  vertebrae."
pronunciation:
  phonetic: yoo-STREPT-o-spon-DY-luhs
  ipa: /juːˌstrɛptoʊspɒnˈdaɪləs/
description: Eustreptospondylus is an extinct genus of megalosaurid theropod
  dinosaur from the Callovian and Oxfordian stages of the Jurassic period (some
  time between 166 and 154 million years ago) in southern England, at a time
  when Europe was a series of scattered islands due to tectonic movement that
  raised the sea-bed and flooded the lowland.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - marine
diagnostic_features:
  - Cervical and anterior dorsal vertebrae strongly opisthocoelous, more so than
    in Megalosaurus bucklandi
  - Vertebrae more elongate than in Megalosaurus bucklandi
  - Frontals longer than wide (9.6 cm excluding nasal overlap vs. 8 cm), with
    distinct orbital notch on either side
  - Pubis a straight rod-like bone approximately 42 cm long with small terminal
    expansion ('foot') ~8 cm in length
  - Lesser trochanter of femur situated more proximally than in Megalosaurus
    bucklandi; metatarsals more slender
