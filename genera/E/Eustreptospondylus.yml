description: Eustreptospondylus is an extinct genus of megalosaurid theropod
  dinosaur from the Callovian and Oxfordian stages of the Jurassic period (some
  time between 166 and 154 million years ago) in southern England, at a time
  when Europe was a series of scattered islands due to tectonic movement that
  raised the sea-bed and flooded the lowland.
