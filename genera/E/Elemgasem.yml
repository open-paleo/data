genus: Elemgasem
parent: Brachyrostra
dispute:
  summary: >
    Elemgasem is a brachyrostran whose exact position is uncertain; the
    describing analyses (Baiano and colleagues, 2022) recovered it either
    within Furileusauria or as its sister taxon, and it is an unstable
    taxon.
  history:
    - date: "2026-06-30"
      note: >
        Placed at Brachyrostra, the least-inclusive uncontested node (P2).
etymology: Named after Elemgasem, a deity in Tehuelche mythology from the indigenous people of Patagonia; the name is taken directly from Tehuelche tradition
description: Elemgasem is an extinct genus of brachyrostran abelisaurid from the
  Late Cretaceous Portezuelo Formation of Patagonia, Argentina. The genus
  contains a single species, Elemgasem nubilus. The cladistic position of
  Elemgasem within Brachyrostra is uncertain, given that phylogenetic analyses
  recover it as either a sister taxon to Furileusauria or in several positions
  within this clade.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Marked rugosity formed by ridges and tubercles on the lateral surface of the
    proximal fibula (autapomorphy)
  - Proximal high wall of the astragalus-calcaneum separating the tibia from the
    fibula when viewed laterally (autapomorphy)
  - Dorsoventrally deep lateral surface of the calcaneum (autapomorphy)
  - Posterior caudal vertebrae with oval articular surfaces of the centra, being
    transversely wider than dorsoventrally high
  - Posterior caudal centra with an anteroposterior groove on the ventral surface
