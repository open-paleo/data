genus: Erketu
parent: Euhelopodidae
etymology: Named after Erketü Tengri, a deity in Mongolian mythology, honoring
  the region where the dinosaur was found.
description: Erketu is a genus of somphospondylan dinosaur that lived in Asia
  during the Late Cretaceous, roughly between 96 million and 89 million years
  ago. It is known from the Bayanshiree Formation of Mongolia, and its fossils
  were found between 2002 and 2003 during field expeditions. Erketu was first
  described in 2006 and later on in 2010 due to some cervicals that were left
  behind in the expedition. This genus represents the first sauropod described
  from the Bayanshiree Formation. The elongated cervical vertebrae indicate that
  it probably had the longest neck relative to its body size of any sauropod.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Extremely elongated anterior cervical centra with elongation index exceeding
    5.0, unique among Titanosauriformes with known cervical vertebrae.
  - Bifurcate (bifid) neural spines on fourth and succeeding cervical vertebrae
    with very low, thickened metapophyses bearing a small anterior tubercle.
  - Crescent-shaped (strongly concave lateral border) sternal plate.
  - Hypertrophied prezygodiapophyseal lamina in cervicals 4-5, extending far
    anterior of the articular facet as a thin plate perpendicular to the
    articular plane.
  - Cervical centra significantly taller than wide at the cotyle in postaxial
    vertebrae.
