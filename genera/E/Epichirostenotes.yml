genus: Epichirostenotes
parent: Caenagnathinae
etymology: above Chirostenotes
description: Epichirostenotes is a genus of oviraptorosaurian dinosaur from the
  Late Cretaceous. Epichirostenotes is known from an incomplete skeleton found
  in 1923 at the Horseshoe Canyon Formation, in strata dated to about 72 million
  years ago. It was first named by Robert M. Sullivan, Steven E. Jasinski and
  Mark P.A. van Tomme in 2011 and the type species is Epichirostenotes curriei.
  Its holotype, ROM 43250, had been assigned to Chirostenotes pergracilis by
  Hans-Dieter Sues in 1997.
