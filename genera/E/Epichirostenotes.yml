genus: Epichirostenotes
parent: Caenagnathidae
etymology: "From Greek epi- (above/upon, here meaning 'after in time') +
  Chirostenotes (the related oviraptorosaurian genus): 'above Chirostenotes',
  because it lived stratigraphically and temporally after Chirostenotes."
pronunciation:
  phonetic: ep-ih-KI-roh-steh-NO-teez
description: Epichirostenotes is a genus of oviraptorosaurian dinosaur from the
  Late Cretaceous. Epichirostenotes is known from an incomplete skeleton found
  in 1923 at the Horseshoe Canyon Formation, in strata dated to about 72 million
  years ago. It was first named by Robert M. Sullivan, Steven E. Jasinski and
  Mark P.A. van Tomme in 2011 and the type species is Epichirostenotes curriei.
  Its holotype, ROM 43250, had been assigned to Chirostenotes pergracilis by
  Hans-Dieter Sues in 1997.
diet: omnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Braincase much deeper than long, with distinctly verticalized basicranial
    region
  - Otic region with deep but anteroposteriorly narrow lateral depression
  - Synsacrum composed of six co-ossified vertebrae with pneumatic foramina
  - Ischium long and expanded posteriorly, broad behind obturator process, with
    obturator process expanded and triangular
  - Prominent anterior proximal hook-like projection of the ischia
appearance:
  integument: feathered
  evidence: inferred
