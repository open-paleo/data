genus: Emiliasaura
parent: Iguanodontia
placement: incertae sedis
etymology: "Named in honor of Emilia (likely a personal name) + Latin saura (lizard): 'Emilia's lizard'."
pronunciation:
  phonetic: eh-MEE-lee-uh-SOH-ruh
description: Emiliasaura is an extinct genus of iguanodontian ornithopod
  dinosaurs from the Early Cretaceous (Valanginian) Mulichinco Formation of
  Neuquén Province, Argentina. The genus contains a single species, Emiliasaura
  alessandrii, known from three individual specimens. Emiliasaura was initially
  described as a rhabdodontomorph. If this identification is correct, it would
  represent the oldest member of this clade and the first named from South
  America. However, a later analysis of rhabdodontomorphs failed to recover
  Emiliasaura within this clade, instead placing it as a styracosternan.
dispute:
  summary: >
    Emiliasaura alessandrii was described as an early-diverging
    rhabdodontomorph (Coria and others, 2025) — which would make it the
    oldest and first South American member of that clade — but the
    dedicated reanalysis of Czepiński and Madzia (2025) instead recovers
    it as an early-diverging styracosternan and considers a
    rhabdodontomorph identity unlikely. No analysis recovers it within
    Dryosauridae.
  history:
    - date: "2026-06-29"
      note: Placed at Dryosauridae following Czepiński and Madzia (2025)
        and Jones (2026); the rhabdodontomorph and styracosternan
        alternatives reflected, not adopted.
    - date: "2026-07-09"
      note: Re-evaluated and moved to Iguanodontia incertae sedis.
        Neither primary analysis supports Dryosauridae — the describing
        study (Coria and others 2025) recovers a rhabdodontomorph and
        Czepiński and Madzia (2025) recover a styracosternan — so
        Iguanodontia is the least-inclusive clade both accept. The
        earlier Dryosauridae placement, attributed to a
        within-Dryosauridae reading of Czepiński and Madzia (2025), is
        not supported by that paper.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
appearance:
  integument: scaled
  evidence: inferred
diagnostic_features:
  - Sigmoidal intercentral articulations in the anterior sacral vertebrae in
    lateral view
  - Caudal vertebrae with posteriorly projecting neural spines and spike-like,
    dorsoposteriorly projecting transverse processes
  - Closed or absent coracoid foramen
  - Distinctive notch on the medial side of the fibula flanked by two thick edges
  - Second metatarsal with an asymmetrical ginglymoid distal articulation and a
    V-shaped notch on the medial side of the distal end
  - Pedal digit II with wide but short second and third phalanges and a blunt,
    hoof-like ungual, contrasting with the claw-like unguals of digits III and
    IV
