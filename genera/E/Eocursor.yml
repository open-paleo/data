genus: Eocursor
parent: Ornithischia
placement: incertae sedis
etymology: "From Greek eos (dawn) + Latin cursor (runner): 'dawn runner', indicating it is one of the earliest known ornithischians."
pronunciation:
  phonetic: ee-o-KUHR-sor
description: Eocursor is genus of basal ornithischian dinosaur that lived in
  what is now South Africa during the Early Jurassic. Remains of this animal
  have been found in the Upper Elliot Formation and it is among the most
  completely known early ornithischians, shedding new light on the origin of the
  group.
dispute:
  summary: >
    Eocursor is an early-diverging ornithischian most often recovered just
    outside Genasauria, as its sister taxon or, with Archaeocursor, as a
    successive outgroup (Butler and others, 2007; Yao and others, 2025),
    the position followed by Jones (2026). Some analyses based on the
    Madzia, Boyd and Mazuch (2018) matrix instead place it within
    Heterodontosauridae (Boyd, 2015; Madzia and others, 2021).
  history:
    - date: "2026-06-29"
      note: Placed at Ornithischia incertae sedis (outside Genasauria) following Butler and others (2007), Yao and others (2025), and Jones (2026); the heterodontosaurid alternative is recorded.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - arid
diagnostic_features:
  - Accessory fossa present on lateral surface of basisphenoid, posterior to the
    canal for the internal carotid artery.
  - Maximum transverse expansion of distal end of humerus is only 50% of maximum
    transverse expansion of proximal humerus.
  - Pubic obturator foramen subcircular and enlarged; maximum dorsoventral
    diameter of foramen is twice the maximum diameter of proximal pubic shaft.
appearance:
  integument: scaled
  evidence: inferred
