genus: Eocursor
parent: Genasauria
etymology: "From Greek eos (dawn) + Latin cursor (runner): 'dawn runner', indicating it is one of the earliest known ornithischians."
description: Eocursor is genus of basal ornithischian dinosaur that lived in
  what is now South Africa during the Early Jurassic. Remains of this animal
  have been found in the Upper Elliot Formation and it is among the most
  completely known early ornithischians, shedding new light on the origin of the
  group.
diet: herbivore
locomotion: bipedal
