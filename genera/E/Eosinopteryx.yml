genus: Eosinopteryx
parent: Anchiornithidae
dispute:
  summary: >
    Eosinopteryx brevipenna is skeletally very similar to Anchiornis, and several
    workers have questioned its distinctness, treating it as a probable junior
    synonym of Anchiornis; Foth et al. (2025) excluded it from their analysis on
    validity grounds. Its position within the anchiornithid grade is otherwise
    stable.
  history:
    - date: "2026-07-01"
      note: Placed at Anchiornithidae (Foth and Rauhut, 2017; Xu et al., 2023); validity relative to Anchiornis is uncertain, and the clade-level position debate is recorded on Anchiornithidae.
etymology: From Greek eos, 'dawn/daybreak', + Latin Sinae, 'Chinese', + Greek pteryx, 'feather' or 'wing'; means 'dawn Chinese feather', referring to its early age and feathered Chinese specimen
pronunciation:
  phonetic: EE-oh-si-NOP-ter-ix
description: Eosinopteryx is an extinct genus of theropod dinosaurs known to the
  Late Jurassic epoch of China. It contains a single species, Eosinopteryx
  brevipenna. Some researchers consider it a junior synonym of Anchiornis.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
  - forested
diagnostic_features:
  - Short snout, about 82% the length of the orbit
  - Lacrimal with a long posterior process participating in about half the
    length of the dorsal margin of the orbit and a vestigial anterior process
  - Short tail composed of only 20 caudal vertebrae, 2.7 times the length of the
    femur
  - Chevrons reduced to small rod-like elements present only below the proximal
    8th or 9th caudal vertebrae
  - Ilium with a proportionally long, low and distally tapering postacetabular
    process (length/height at midlength ratio = 5)
  - Pedal unguals shorter than the corresponding penultimate phalanges
appearance:
  features:
    - feathered wings
  integument: feathered
  evidence: direct
