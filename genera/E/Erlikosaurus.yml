genus: Erlikosaurus
parent: Therizinosauria
pronunciation:
  phonetic: ER-lik-o-SAWR-us
etymology: "Named after Erlik, the god of the underworld in Turkic and Mongolian
  mythology, + Greek sauros (lizard): 'Erlik's lizard'."
description: Erlikosaurus is a genus of therizinosaurid that lived in Asia
  during the Late Cretaceous period. The fossils, a skull and some post-cranial
  fragments, were found in the Bayan Shireh Formation of Mongolia in 1972,
  dating to around 96 and 89 million years ago. These remains were later
  described by Altangerel Perle and Rinchen Barsbold in 1980, naming the new
  genus and species Erlikosaurus andrewsi. It represents the second
  therizinosaur taxon from this formation (after Segnosaurus), with the most
  complete skull among members of this peculiar family of dinosaurs.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Medium-sized segnosaurid (distinctly smaller than Segnosaurus galbinensis)
  - Pedal unguals strongly compressed laterally (vs. thick and non-compressed in
    Segnosaurus)
  - Greater number of mandibular teeth (31 per branch vs. 24-25 in Segnosaurus)
  - Edentulous portion of mandible longer than in Segnosaurus galbinensis
  - Posterior process of vomer very long, lamellar, co-ossified ventrally
    forming a V-shape in cross-section extending to basicranium
