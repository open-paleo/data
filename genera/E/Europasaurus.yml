genus: Europasaurus
parent: Camarasauromorpha
dispute:
  summary: >
    Europasaurus is consistently recovered as a basal macronarian, but its
    precise placement is disputed: the analyses of D'Emic (2012) and Mannion
    et al. (2013, 2017) recover it as the basalmost brachiosaurid, whereas
    Carballido and Sander (2014) and Sander et al. (2006) place it as a basal
    camarasauromorph outside both Camarasauridae and Brachiosauridae. Jones
    (2026) leaves the family-level placement open.
  history:
    - date: "2026-06-30"
      note: >
        Placed conservatively at Camarasauromorpha, the least inclusive node
        both hypotheses share; the brachiosaurid alternative is noted.
etymology: From Europa (Europe, named after the Phoenician princess in Greek
  mythology) + Greek sauros, 'lizard'; means 'Europe lizard', referring to its
  discovery in Germany
description: Europasaurus is a genus of dwarf sauropod dinosaur from the Late
  Jurassic Süntel Formation of Lower Saxony, Germany. The type and only species,
  Europasaurus holgeri, is notable for being among the smallest known adult
  sauropods, likely the result of insular dwarfism on the Late Jurassic European
  archipelago.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - coastal
diagnostic_features:
  - Nasal process of premaxillary projecting anterodorsally.
  - Medial notch on posterior dorsal margin of cervical vertebral centra.
  - Scapular acromion with a prominent posterior projection.
  - Transverse width of astragalus twice its dorsoventral height and
    anteroposterior length.
  - Wing-shaped posterior process of postorbital slightly longer and wider than
    the anterior process (differs from Camarasaurus where it is much shorter).
