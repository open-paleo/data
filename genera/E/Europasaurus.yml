    institution: DFMMh
    species: Europasaurus holgeri
    category: largest-individual
    significance: "A partial femur representing the largest known Europasaurus individual at a body length of 6.2 meters. Uniquely among the specimens it shows lines of arrested growth and partly lamellar internal bone, indicating it died after reaching full adult body size and securing the dwarf taxon's maximum size."
    references: [sander2006]
  - specimen_id: [DFMMh/FV 009]
    institution: DFMMh
    species: Europasaurus holgeri
    category: ontogeny
    significance: "The youngest and smallest known individual at 1.75 meters long. It lacks growth marks and laminar bone tissue, identifying it as a young juvenile and anchoring the histological growth series used to show Europasaurus was a true dwarf rather than a juvenile of a larger taxon."
    references: [sander2006]
