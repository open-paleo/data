genus: Enigmacursor
parent: Neornithischia
etymology: "From Latin enigma (puzzle/riddle) + cursor (runner): 'puzzle
  runner', referring to the taxonomic confusion surrounding Morrison Formation
  neornithischians."
description: Enigmacursor is an extinct genus of neornithischian dinosaur from
  the Late Jurassic Morrison Formation of Colorado, United States. The type
  species is Enigmacursor mollyborthwickae.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Posterior articular facets offset ventrally relative to anterior articular
    facets on proximal dorsal vertebrae (potential autapomorphy)
  - Absence of a supracetabular crest on the ilium
  - Femoral head separated from the greater trochanter by a trochanteric fossa;
    apex of anterior trochanter situated level with the ventral margin of the
    femoral head
  - Absence of a ligament sulcus on the posterior surface of the femoral head
  - Ventral surface of fourth trochanter straight or slightly convex in medial
    or posterior view
  - Medially directed, hook-like posterior condyle of the proximal end of the
    tibia
