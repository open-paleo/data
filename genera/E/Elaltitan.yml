genus: Elaltitan
parent: Lithostrotia
etymology: Elal, the god of the Tehuelche people of Chubut Province and titan,
  giant in Greek mythology
description: Elaltitan is an extinct genus of large lithostrotian titanosaur
  sauropod dinosaur known from the Late Cretaceous (mid Cenomanian to Turonian
  stage) of Chubut Province, southern Argentina. It contains a single species,
  Elaltitan lilloi.
