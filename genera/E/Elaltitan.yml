genus: Elaltitan
parent: Lithostrotia
etymology: "From Elal (the god of the Tehuelche people of Chubut Province, Argentina) + Greek titan (giant): referencing local indigenous mythology and the animal's great size."
pronunciation:
  phonetic: EE-lal-TIE-tan
description: Elaltitan is an extinct genus of large lithostrotian titanosaur
  sauropod dinosaur known from the Late Cretaceous (mid Cenomanian to Turonian
  stage) of Chubut Province, southern Argentina. It contains a single species,
  Elaltitan lilloi.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Spinopostzygapophyseal laminae in middle-posterior dorsal vertebrae
    bifurcate into medial and lateral branches (plesiomorphic in most
    eusauropods but reverted as a local autapomorphy in titanosaurs).
  - Dorsoventrally tall neural arch restricted to anterior half of centrum
    (excluding condylar ball) in anterior-most caudal vertebrae (autapomorphy).
  - Astragalar ascending process does not extend to the posterior margin of the
    astragalus.
  - Presence of an ossified calcaneum (first titanosaur skeleton to preserve an
    associated calcaneum).
