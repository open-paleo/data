genus: Euoplocephalus
parent: Ankylosaurinae
pronunciation:
  ipa: /juːˌɒploʊˈsɛfələs/
  phonetic: yoo-OP-loh-SEF-uh-luhs
etymology: "From Greek 'eu' meaning 'well', 'hoplon' meaning 'weapon' or
  'armor', and 'kephale' meaning 'head', meaning 'well-armored head'."
description: Euoplocephalus is a genus of large herbivorous ankylosaurid
  dinosaurs, living during the Late Cretaceous of Canada. It has only one named
  species, Euoplocephalus tutus.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - coastal
appearance:
  features:
    - cranial bosses
    - body armor
    - osteoderms
    - shoulder spikes
    - tail spikes
  integument: armored
  evidence: direct
diagnostic_features:
  - Cranial ornamentation absent posterior to the orbits; lacks postocular
    caputegulae (subcircular ornamentation) at the bases of the squamosal and
    quadratojugal horns
  - First cervical half ring with oval to subcircular-based keeled medial and
    lateral primary osteoderms, lacking interstitial osteoderms at their bases
  - Tail club knob with semicircular major osteoderms in dorsal view
  - Laterally directed sacral ribs
  - Proportionately short postacetabular process of the ilium
  - Anteriorly directed nares and no continuous keel between the squamosal horn
    and the supraorbitals
