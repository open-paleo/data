genus: Eotrachodon
parent: Hadrosauridae
etymology: "From Greek eos (dawn) + Trachodon (an early hadrosaurid genus): 'dawn Trachodon', indicating it is a primitive relative of hadrosaurids."
description: Eotrachodon is a genus of hadrosaurid dinosaur that lived in the
  Late Cretaceous of eastern North America. The holotype was found in the
  Mooreville Chalk Formation (Upper Santonian) of Alabama in 2007 and includes a
  well-preserved skull and partial skeleton, making it a rare find among
  dinosaurs of Appalachia.
diet: herbivore
locomotion: facultative
