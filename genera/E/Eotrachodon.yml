genus: Eotrachodon
parent: Hadrosauridae
etymology: "From Greek eos (dawn) + Trachodon (an early hadrosaurid genus): 'dawn Trachodon', indicating it is a primitive relative of hadrosaurids."
pronunciation:
  phonetic: ee-oh-TRAK-oh-don
description: Eotrachodon is a genus of hadrosaurid dinosaur that lived in the
  Late Cretaceous of eastern North America. The holotype was found in the
  Mooreville Chalk Formation (Upper Santonian) of Alabama in 2007 and includes a
  well-preserved skull and partial skeleton, making it a rare find among
  dinosaurs of Appalachia.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - marine
diagnostic_features:
  - Tripartite circumnarial depression divided longitudinally into dorsal and
    ventral fossae, the latter subdivided into caudoventral and lightly incised
    rostroventral fossae.
  - Dorsal fossa of circumnarial depression above bony naris extending further
    caudally than caudal extent of caudoventral fossa.
  - Caudodorsal region of circumnarial depression above bony naris excavating
    lateral nasal surface, deeply rostrally but gradually fading caudally.
  - Premaxillary lateral process abruptly deflected ventrally, forming a
    165-degree angle with long axis of circumnarial depression.
  - Maxilla with subtriangular joint surface for jugal that is more laterally
    than dorsally facing and prominent dorsal jugal tubercle projected caudally.
  - Steeply down-warped sagittal crest of parietal substantially elevated above
    temporal bar.
