genus: Eolambia
parent: Hadrosauroidea
etymology: dawn lambeosaurine
description: Eolambia is a genus of herbivorous hadrosauroid dinosaur from the
  early Late Cretaceous of the United States. It contains a single species, E.
  caroljonesa, named by paleontologist James Kirkland in 1998. The type specimen
  of Eolambia was discovered by Carole and Ramal Jones in 1993; the species name
  honors Carole. Since then, hundreds of bones have been discovered from both
  adults and juveniles, representing nearly every element of the skeleton. All
  of the specimens have thus far been found in Emery County, Utah, in a layer of
  rock known as the Mussentuchit Member of the Cedar Mountain Formation.
diet: herbivore
