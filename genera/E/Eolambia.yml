genus: Eolambia
parent: Hadrosauromorpha
pronunciation:
  phonetic: EE-oh-LAM-bee-a
etymology: "From Greek eos (dawn) + Lambeosaurinae: 'dawn lambeosaurine',
  indicating it is an early relative of lambeosaurine hadrosaurs."
description: Eolambia is a genus of herbivorous hadrosauroid dinosaur from the
  early Late Cretaceous of the United States. It contains a single species, E.
  caroljonesa, named by paleontologist James Kirkland in 1998. The type specimen
  of Eolambia was discovered by Carole and Ramal Jones in 1993; the species name
  honors Carole. Since then, hundreds of bones have been discovered from both
  adults and juveniles, representing nearly every element of the skeleton. All
  of the specimens have thus far been found in Emery County, Utah, in a layer of
  rock known as the Mussentuchit Member of the Cedar Mountain Formation.
dispute:
  summary: >
    Eolambia caroljonesa was originally described as a lambeosaurine
    hadrosaurid (Kirkland, 1998), but Head (2001) reidentified it as a
    basal hadrosauroid, and it is now consistently recovered as a basal
    hadrosauromorph well outside Hadrosauridae (McDonald and others,
    2017; Jones, 2026).
  history:
    - date: "2026-06-27"
      note: Placed at Hadrosauromorpha; the original lambeosaurine
        interpretation reflected, not adopted.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
diagnostic_features:
  - Sagittal crest formed by fused parietals extending above back of skull,
    visible in lateral view
  - Squamosals meeting at midline in juvenile specimens with short paraoccipital
    processes
  - Jugals long and low
  - Maxilla lacking narial process and having 32 tooth positions in adult
  - Lower jaw deepens rostrally with nearly no diastema; 30 tooth files with at
    least 3 teeth per file; teeth with single central carina
  - Ischium long and stout with large, flaring, blade-like distal end
appearance:
  features:
    - keratinous beak
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "66499"
synonyms:
  - name: Eohadrosaurus
    type: nomen nudum
    reason: Informal name ('Eohadrosaurus caroljonesi') used by Kirkland before the
      1998 paper; replaced by the formal name Eolambia.
species:
  - name: Eolambia caroljonesa
    etymology: "Named for Carole Jones, who together with her husband Ramal
      discovered the type specimen in 1993."
    status: valid
    type_species: true
    period:
      name:
        - Early Cretaceous
        - Late Cretaceous
      stage:
        - Albian
        - Cenomanian
    location:
      country: US
      locality: Carol Jones Quarry
      region: US-UT
      formation: Cedar Mountain
      member: Mussentuchit
      part: lower
      coordinates:
        - 38.799999
        - -111.169998
    type_specimen:
      specimen_id: [ CEUM 9758 ]
      specimen_type: holotype
      institution: CEUM
      material: "Disarticulated partial adult skeleton: paired frontals, partial
        parietals, braincase, right and left maxilla, right and left jugals, right
        postorbital, lower right quadrate, left dentary, atlas, cervical vertebra,
        anterior dorsal vertebra, proximal ischium, tibia fragment, right fibula"
      completeness: partial
    size:
