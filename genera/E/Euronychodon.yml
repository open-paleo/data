genus: Euronychodon
parent: Paraves
etymology: A contraction of "Europe" and Paronychodon (the genus
  whose teeth Euronychodon's resemble); the popular gloss is
  "European claw tooth".
description: >
  Euronychodon is the name given to a genus of coelurosaur
  dinosaur from the Late Cretaceous of Europe and Asia. A small-
  sized dinosaur estimated to measure around 2 m (6.6 ft) in
  length, Euronychodon is known from teeth only. These are
  similar to those of another coelurosaur tooth genus,
  Paronychodon.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
