genus: Euronychodon
parent: Paraves
placement: incertae sedis
dispute:
  summary: >
    Euronychodon is a tooth taxon based on isolated teeth originally identified as
    Paronychodon, tentatively referred to Dromaeosauridae by Antunes and
    Sigogneau-Russell (1991) and later compared with the troodontid Byronosaurus;
    it is widely regarded as a nomen dubium and a possible junior synonym of
    Paronychodon, and Jones et al. (2026) list it among nomina dubia. It is placed
    conservatively at Paraves incertae sedis.
  history:
    - date: "2026-07-01"
      note: Retained at Paraves incertae sedis as a dubious deinonychosaur-grade tooth taxon, a nomen dubium.
pronunciation:
  phonetic: YOOR-oh-NY-koh-don
etymology: A contraction of "Europe" and Paronychodon (the genus
  whose teeth Euronychodon's resemble); the popular gloss is
  "European claw tooth".
description: >
  Euronychodon is the name given to a genus of coelurosaur
  dinosaur from the Late Cretaceous of Europe and Asia. It is
  known from teeth only, which are similar to those of another
  coelurosaur tooth genus, Paronychodon.
diet: carnivore
locomotion: bipedal
diagnostic_features:
  - Teeth recurved with completely smooth (unserrated) anterior and posterior
    edges.
  - Crown divided into a convex labial face and a truncated, flattened lingual
    face.
  - Lingual face traversed by one or several longitudinal ridges subject to
    strong wear.
  - Longitudinal ridges on lingual face abraded and marked by fine oblique
    striations due to wear.
  - Anterior and posterior edges of crown parallel at base then diverge at
    abrupt angle before curving.
paleoenvironment:
  - fluvial
  - deltaic
appearance:
  integument: feathered
  evidence: inferred
