genus: Eucnemesaurus
parent: Riojasauridae
etymology: "From Greek eu- (good/well) + kneme (tibia/shin) + sauros (lizard):
  'good tibia lizard', referring to its robust tibiae."
pronunciation:
  ipa: /juːkˌniːmɪˈsɔːrəs/
description: Eucnemesaurus is a basal sauropodomorph dinosaur genus usually
  considered to be a synonym of Euskelosaurus. Recent study by Yates (2006),
  however, indicates that it is valid and the same animal as putative "giant
  herrerasaurid" Aliwalia.
locomotion: bipedal
paleoenvironment:
  - fluvial
  - arid
diet: herbivore
