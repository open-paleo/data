    id: "56613"
synonyms:
  - name: Aliwalia
    type: junior subjective
    reason: Tentatively treated as a junior synonym of Eucnemesaurus; very recent
      (2026) research suggests Aliwalia may be a distinct genus, pending broader
      confirmation.
