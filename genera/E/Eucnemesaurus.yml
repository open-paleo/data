genus: Eucnemesaurus
parent: Riojasauridae
etymology: "From Greek eu- (good/well) + kneme (tibia/shin) + sauros (lizard):
  'good tibia lizard', referring to its robust tibiae."
pronunciation:
  ipa: /juːkˌniːmɪˈsɔːrəs/
  phonetic: yook-NEEM-ee-SOR-us
description: Eucnemesaurus is a basal sauropodomorph dinosaur genus usually
  considered to be a synonym of Euskelosaurus. Recent study by Yates (2006),
  however, indicates that it is valid and the same animal as putative "giant
  herrerasaurid" Aliwalia.
locomotion: bipedal
paleoenvironment:
  - fluvial
  - arid
diet: herbivore
diagnostic_features:
  - Tibia head proportionally much larger (longer and broader) than in all
    compared Plateosauridae and Anchisauridae, including Gryponyx, Plateosaurus,
    and Massospondylus
  - Trochanter minor of femur situated nearly equidistant from medial and
    lateral sides, not near the medial side as in most Plateosauridae
  - Anterior border of distal tibia end longer than posterior border, the
    reverse of Euskelesaurus Browni and Gresslyosaurus robustus
  - Pubic neck section lacks ridges on lower surface present in Euskelesaurus;
    neck relatively short with no demarcation between anterior and medial
    surfaces
  - Femur of practically solid structure with thick lamellar substantia compacta
    and only small central cavity, contrasting with hollow limb bones typical of
    Theropoda
  - Trochanter quartus situated relatively closer to the proximal end of the
    femur than in Euskelesaurus Browni
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "56613"
synonyms:
  - name: Aliwalia
    type: junior subjective
    reason: Tentatively treated as a junior synonym of Eucnemesaurus; very recent
      (2026) research suggests Aliwalia may be a distinct genus, pending broader
      confirmation.
species:
  - name: Eucnemesaurus fortis
    etymology: From Latin 'fortis' meaning 'strong', reflecting the robust nature of
      the described material.
    status: disputed
    type_species: true
    period:
      name:
        - Late Triassic
      stage:
        - Norian
        - Rhaetian
      from_ma: 227
      to_ma: 201.4
    location:
      country: ZA
      locality: farm Zonderhout (291), Slabberts (zone A/5)
      region: Free State
      formation: Elliot
      coordinates:
        - -28.5
        - 28.233334
    size:
      length_m:
        min: 8
        max: 8
      weight_kg:
        min: 1400
        max: 1400
      hip_height_m:
        min: 2
        max: 2
    type_specimen:
      specimen_id:
        - TrM 119
      specimen_type: holotype
      institution: DNMNH
      material: Proximal half of left femur, complete left tibia, proximal portion of
        left pubis, portions of dorsal and caudal vertebrae, and unidentified
        fragments.
      completeness: fragmentary
    erected_in: vanhoepen1920a
  - name: Eucnemesaurus entaxonis
    etymology: From 'entaxonic', a foot in which the medial digits bear the main
      weight-resisting forces; alludes to the species' robust pes.
    status: valid
    type_species: false
    period:
      name:
        - Late Triassic
      stage:
        - Norian
        - Rhaetian
      from_ma: 227
      to_ma: 201.4
    location:
      country: ZA
      region: Eastern Cape
      formation: Elliot
      locality: Cannon Rock Farm, Aliwal North district
    type_specimen:
      specimen_id:
        - BP/1/6234
      specimen_type: holotype
      institution: BP
      material: Articulated posterior dorsal, sacral, and anterior caudal
        vertebrae; partial right ilium and pubic apron; left ischium; right
        femur; distal crus; and an almost complete right pes.
    diagnostic_features:
      - Deep brevis fossa with relatively thin lateral and medial walls on the
        ventral surface of the postacetabular process of the ilium
      - Sharp ventral keel on the centra of the proximal caudal vertebrae
      - Femoral shaft beneath the fourth trochanter transversely elliptical in
        cross-section (subcircular in E. fortis)
      - Posterior descending process of the distal tibia does not extend as far
        laterally as the anterior ascending process, leaving the latter visible
        in posterior view (the two processes are level with each other in E.
        fortis)
      - Semi-stout pes in which the maximum proximal breadth of the first
        metatarsal is approximately 0.6 times its proximodistal length
    erected_in: mcphee2015b
