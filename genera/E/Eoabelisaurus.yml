genus: Eoabelisaurus
parent: Ceratosauria
placement: incertae sedis
dispute:
  summary: >
    Pol and Rauhut (2012) and Zaher and colleagues (2020) recovered
    Eoabelisaurus as the basalmost abelisaurid, and Pol and colleagues (2024)
    placed it among the basal branches of Abelisauridae by parsimony but
    outside Abelisauroidea in their Bayesian analysis. Tortosa and colleagues
    (2014), Filippi and colleagues (2016) and Delcourt (2017) recovered it as
    the basalmost abelisauroid, while Farke and Sertich (2013), Cerroni and
    colleagues (2020) and Aranciaga Rolando and colleagues (2020) placed it
    just outside Abelisauroidea. Wang and colleagues (2016) recovered it as
    the basalmost ceratosaurid, and Hendrickx and colleagues (2024) as a
    neoceratosaur outside both Ceratosauridae and Abelisauroidea. Placed at
    Ceratosauria incertae sedis, the least inclusive clade common to these
    readings.
  history:
    - date: "2026-06-30"
      note: >
        Placed at Abelisauridae following the describing analysis and Zaher
        and colleagues (2020).
    - date: "2026-10-09"
      note: >
        Moved from Abelisauridae to Ceratosauria incertae sedis, since
        independent analyses place it outside Abelisauroidea.
pronunciation:
  ipa: /ˈioʊəˌbɛlɪˈsɔːrəs/
  phonetic: EE-o-ah-BEL-i-SOR-us
etymology: "From Greek 'eos' (ἠώς) meaning 'dawn' combined with the genus name Abelisaurus, indicating it is an early (dawn) relative of Abelisaurus."
description: Eoabelisaurus is a genus of ceratosaurian theropod dinosaur from the
  Middle Jurassic Cañadón Asfalto Formation of the Cañadón Asfalto Basin in
  Argentina, South America. The generic name combines a Greek ἠώς, (eos),
  "dawn", with the name Abelisaurus, in reference to the fact it represents an
  early relative of the latter. Only one species is currently recognized, E.
  mefi; the specific name honors the MEF, the Museo Paleontológico "Egidio
  Feruglio", where discoverer Diego Pol is active. Its forelimb combines an
  unreduced humerus with a shortened forearm and a short, robust hand, which
  its describers read as an early stage of the forelimb reduction seen in
  abelisaurids.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
diagnostic_features:
  - Quadrate with thickened medial distal articular end and subparallel
    articular condyles.
  - Mid-dorsal vertebrae with double, V-shaped lamina extending from the
    parapophysis to the prezygodiapophyseal lamina.
  - Ulna with hypertrophied olecranon process accounting for more than 30 per
    cent of its length.
  - Pubic foramen elongate, more than twice as long as high.
  - Ambiens process of pubis developed as a large, anterolaterally directed,
    convex expansion.
appearance:
  integument: scaled
  evidence: inferred
