references:
  - id: pol2012a
    notes: Gives the Jugo Loco locality as finely bedded mud-, marl- and
      limestones of the Cañadón Asfalto Formation, early Middle Jurassic
      (Aalenian-Bajocian), the source of the age.
  - id: cúneo2013a
    notes: Dates the interval overlying the uppermost basalt flow at Cerro
      Cóndor, which holds this taxon, as Aalenian to probably Bajocian, with a
      latest Toarcian age not precluded near the basalt.
  - id: zaher2020a
    notes: Recovered Eoabelisaurus as the most basal member within Abelisauridae.
  - id: pol2024a
    notes: Recovered Eoabelisaurus among the basal branches of Abelisauridae by
      parsimony, but outside Abelisauroidea, as sister to Xenotarsosaurus, in a
      Bayesian analysis; both results are weakly supported.
  - id: farke2013a
    notes: Recovered Eoabelisaurus as a non-abelisauroid ceratosaur, sister to
      Abelisauroidea, with two extra steps needed to force it into
      Abelisauridae.
  - id: tortosa2014a
    notes: Recovered Eoabelisaurus with Berberosaurus as the basalmost members
      of Abelisauroidea, outside Abelisauridae.
  - id: filippi2016a
    notes: Recovered Eoabelisaurus as the basalmost abelisauroid, extending
      the Tortosa and colleagues (2014) dataset.
  - id: delcourt2017a
    notes: Recovered Eoabelisaurus as the basalmost abelisauroid on a modified
      Filippi and colleagues (2016) dataset.
  - id: cerroni2020a
    notes: Recovered Eoabelisaurus as the sister taxon of Abelisauroidea on the
      Filippi and colleagues (2016) dataset.
  - id: aranciagarolando2020a
    notes: Recovered Eoabelisaurus as the sister taxon of Ligabueino plus
      Abelisauroidea on the Filippi and colleagues (2016) dataset.
  - id: wang2016b
    notes: Recovered Eoabelisaurus as the basalmost member of Ceratosauridae,
      a clade this analysis nests within Abelisauridae.
  - id: hendrickx2024a
    notes: Recovered Eoabelisaurus on two revised datasets, as a neoceratosaur
      between Ceratosauridae and Abelisauroidea in one and as the sister taxon
      of Ceratosauridae plus Abelisauridae in the other.
