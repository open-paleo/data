genus: Eoabelisaurus
parent: Abelisauridae
dispute:
  summary: >
    Eoabelisaurus is recovered as the basalmost abelisaurid by its
    describers (Pol and Rauhut, 2012) and by Zaher and colleagues (2020),
    but several analyses instead place it outside Abelisauridae as a basal
    abelisauroid, and one hypothesis allies it with Ceratosauridae.
  history:
    - date: "2026-06-30"
      note: >
        Placed at Abelisauridae following the describing analysis and Zaher
        and colleagues (2020).
pronunciation:
  ipa: /ˈioʊəˌbɛlɪˈsɔːrəs/
  phonetic: EE-o-ah-BEL-i-SOR-us
etymology: "From Greek 'eos' (ἠώς) meaning 'dawn' combined with the genus name Abelisaurus, indicating it is an early (dawn) relative of Abelisaurus."
description: Eoabelisaurus is a genus of abelisauroid theropod dinosaur from the
  Lower Jurassic Cañadón Asfalto Formation of the Cañadón Asfalto Basin in
  Argentina, South America. The generic name combines a Greek ἠώς, (eos),
  "dawn", with the name Abelisaurus, in reference to the fact it represents an
  early relative of the latter. Only one species is currently recognized, E.
  mefi; the specific name honors the MEF, the Museo Paleontológico "Egidio
  Feruglio", where discoverer Diego Pol is active. It is characterized by
  reduced forelimb proportions that show primitive characteristics of the
  Abelisauridae family.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
diagnostic_features:
  - Quadrate with thickened medial distal articular end and subparallel
    articular condyles.
  - Mid-dorsal vertebrae with double, V-shaped lamina extending from the
    parapophysis to the prezygodiapophyseal lamina.
  - Ulna with hypertrophied olecranon process accounting for more than 30 per
    cent of its length.
  - Pubic foramen elongate, more than twice as long as high.
  - Ambiens process of pubis developed as a large, anterolaterally directed,
    convex expansion.
appearance:
  integument: scaled
  evidence: inferred
