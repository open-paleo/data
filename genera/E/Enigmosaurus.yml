genus: Enigmosaurus
parent: Therizinosauroidea
pronunciation:
  phonetic: ee-NIG-mo-SAWR-us
etymology: "From Greek enigma (riddle/enigma) + sauros (lizard): 'enigma lizard'
  or 'enigmatic lizard', reflecting uncertainty about its affinities at the time
  of description."
description: Enigmosaurus is a genus of therizinosauroid that lived in Asia
  during the Late Cretaceous period. It was a medium-sized, ground-dwelling,
  bipedal herbivore that represents the third therizinosaur taxon from the Bayan
  Shireh Formation, although it is known from the lower part. The genus is
  monotypic, including only the type species E. mongoliensis, known from a
  well-preserved pelvis and other tentative body remains.
dispute:
  summary: >
    Enigmosaurus is an intermediate-grade therizinosaur whose family-level
    assignment depends on how Therizinosauridae is defined. Zanno (2010) recovers
    it outside Therizinosauridae, as a successive outgroup to that family, a
    result followed by the Princeton Encyclopedia (Jones, 2026). Under the
    broader Therizinosaurus-anchored definition of Kobayashi et al. (2022, 2025)
    it is drawn into Therizinosauridae, recovered near the derived genera
    Erlikosaurus and Segnosaurus. It is placed conservatively in
    Therizinosauroidea. A proposed synonymy with Erlikosaurus has been rejected.
  history:
    - date: "2026-07-01"
      note: >
        Placed at Therizinosauroidea (outside Therizinosauridae) following Zanno
        (2010) and Jones (2026); Kobayashi et al. (2022, 2025) include it in a
        more broadly defined Therizinosauridae.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Pubis and ischium narrow, without lateral flattening.
  - Distal end of pubis elongated and shoe-shaped, narrowed anteriorly and
    posteriorly.
  - Anterior presymphyseal region of distal pubis bears a wide longitudinal
    (sagittal) indentation continuing onto the anterior shaft.
  - Obturator process displaced distally, highly narrowed and elongated, fused
    tightly to the pubis, considerably higher than the distal end.
appearance:
