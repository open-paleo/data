genus: Enigmosaurus
parent: Therizinosauridae
etymology: enigma lizard
description: Enigmosaurus is a genus of therizinosauroid that lived in Asia
  during the Late Cretaceous period. It was a medium-sized, ground-dwelling,
  bipedal herbivore that represents the third therizinosaur taxon from the Bayan
  Shireh Formation, although it is known from the lower part. The genus is
  monotypic, including only the type species E. mongoliensis, known from a
  well-preserved pelvis and other tentative body remains.
diet: herbivore
locomotion: bipedal
