genus: Euskelosaurus
parent: Plateosauridae
etymology: From Greek eu ("good"), skelos ("leg"), and sauros
  ("lizard"); meaning "good-legged lizard", chosen by Huxley
  in reference to the unusually large femur of the type
  material.
pronunciation:
  phonetic: yoo-SKEE-lo-SOR-us
description: >
  Euskelosaurus is a sauropodomorph dinosaur from the Late
  Triassic of South Africa and Lesotho. Fossils have only been
  recovered from the lower Elliot Formation in South Africa
  and Lesotho, and in one locality in Zimbabwe.
dispute:
  summary: >
    Euskelosaurus browni is widely regarded as a nomen dubium wastebasket
    taxon; its material is plateosaurid-grade in nature but lacks
    diagnostic features (Jones, 2026).
  history:
    - date: "2026-06-29"
      note: Reparented to Plateosauridae incertae sedis (P2); nomen dubium, material plateosaurid in nature.
diet: herbivore
locomotion: quadrupedal
diagnostic_features:
  - Femur differs from Megalosaurus in proportional size and form of trochanters
  - Femur has much heavier proportions than Megalosaurus
  - Peculiar form of the femoral bone with distinctive character and position of
    trochanters
paleoenvironment:
  - arid
  - fluvial
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "38640"
  - source: wikidata
    id: Q29057512
synonyms:
  - name: Euskelosaurus africanus
    type: junior subjective
    reason: Erected by Haughton (1924) on smaller Kromme
      Spruit material (S. Af. Mus. Cat. No. 3608, sacrals and
      ischia); modern usage treats it as a nomen dubium
      indistinguishable from other Elliot sauropodomorphs.
  - name: Euskelosaurus capensis
    type: junior subjective
    reason: Originally Orosaurus capensis Lydekker (1889);
      placed by Haughton (1924) within Euskelosaurus on a
      proximal tibia and femur fragment; modern usage treats
      it as a nomen dubium.
species:
  - name: Euskelosaurus browni
    etymology: Named after Alfred Brown, the discoverer of
      the holotype.
    status: nomen dubium
    type_species: true
    period:
      name:
        - Late Triassic
      stage:
        - Norian
        - Rhaetian
      from_ma: 227.0
      to_ma: 201.3
    location:
      country: ZA
      region: Eastern Cape
      formation: Elliot
      locality: Stormberg range, ~30 miles from Aliwal North
      coordinates:
        - -30.7
        - 26.7
    holotype:
      specimen_id:
        - BP/1/4952
      specimen_type: holotype
      institution: BP
      material: A portion of a right femur, ~25.5 in (65 cm)
        preserved length; the entire femur is inferred to have
        exceeded 30 in (76 cm). Huxley's 1866 description does
        not assign a museum number; modern catalog number per
        the Evolutionary Studies Institute (Wits).
      completeness: fragmentary
    erected_in: huxley1866a
references:
  - id: huxley1866a
    notes: Two-page note erecting Euskelosaurus browni on a partial right femur
      from the Stormberg mountains; Huxley distinguishes the new genus from
      Megalosaurus by trochanter form.
  - id: huxley1867b
    notes: Fuller follow-up to the 1866 Geological Magazine note (read 7 Nov
      1866, published 1867); uses the variant spelling 'Euskelesaurus' (an
      incorrect subsequent spelling).
  - id: haughton1924a
    notes: Recognizes E. browni Huxley as the type, accepts E. capensis (Lyd.),
      and erects E. africanus on smaller Kromme Spruit material.
  - id: yates2003a
    notes: Treats E. browni as 'almost certainly a nomen dubium' lacking derived
      characters or unique combination of characters distinguishing it from
      other early sauropodomorphs.
