genus: Eopinacosaurus
parent: Ankylosaurinae
pronunciation:
  phonetic: EE-o-pi-NAK-o-SAWR-us
etymology: From Greek 'eos' meaning 'dawn' plus Pinacosaurus, referring to
  the apparent lower stratigraphic or systematic position of the species
  relative to Pinacosaurus grangeri.
description: Eopinacosaurus is an extinct genus of ankylosaurid armored
  dinosaur known from the Late Cretaceous (Campanian) Bayan Mandahu
  Formation of Inner Mongolia, China, with a referred skull from the
  coeval Djadokhta Formation of Mongolia. The genus contains a single
  species, Eopinacosaurus mephistocephalus, originally assigned to the
  coeval genus Pinacosaurus.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - arid
diagnostic_features:
  - Supranarial embayment absent.
  - Lacrimal incisure absent or rudimentary.
  - Nasoprefrontal pyramid absent.
  - Knife-shaped, caudolaterally directed squamosal horns.
  - Medial segments of first cervical half-ring (h.r.1) broadly oval, with
    scythe-shaped medial osteoderms.
  - Straight dorsal border of scapula; no sulcus between anterior and
    posterior supraorbitals.
appearance:
  integument: armored
identifiers:
  - source: wikidata
    id: Q139770360
species:
  - name: Eopinacosaurus mephistocephalus
    etymology: Honors Mephistopheles (the devil of Faust) plus Greek
      'kephalē' meaning 'head', referencing the distinctive squamosal
      horns.
    status: valid
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Campanian
      from_ma: 83.6
      to_ma: 72.2
    location:
      country: CN
      region: Nei Mongol
      formation: Bayan Mandahu
      locality: Bayan Mandahu
      coordinates:
        - 41.702133
        - 106.756721
    holotype:
      specimen_id:
        - IMM 96BM3/1
      specimen_type: holotype
      institution: IMM
      material: Articulated subadult skeleton with skull, both cervical
        half-rings, and a nearly complete postcranium in situ; some limb
        elements and dorsal armor are missing.
      completeness: complete
    synonyms:
      - name: Pinacosaurus mephistocephalus
        type: reassigned
        reason: Originally described as Pinacosaurus mephistocephalus by
          Godefroit et al. (1999); Penkalski (2026) transferred the
          species to the new genus Eopinacosaurus after a specimen-level
          phylogenetic analysis recovered the holotype outside
          Pinacosaurus sensu stricto.
    erected_in: godefroit1999a
references:
  - id: penkalski2026a
    notes: Erects Eopinacosaurus to receive 'Pinacosaurus' mephistocephalus
      Godefroit et al. 1999 and recognizes Pinacosaurus hilwitnorum sp. nov. as
      a second species of Pinacosaurus sensu stricto.
  - id: godefroit1999a
    notes: Original description of Pinacosaurus mephistocephalus (IMM 96BM3/1)
      from the Bayan Mandahu Formation, recombined as Eopinacosaurus
      mephistocephalus by Penkalski (2026).
