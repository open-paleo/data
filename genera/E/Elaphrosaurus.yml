genus: Elaphrosaurus
parent: Elaphrosaurinae
pronunciation:
  ipa: /ɛˌlɑːfroʊˈsɔːrəs/
  phonetic: el-AH-froh-SOR-uhs
etymology: "From Greek elaphros (ελαφρός), 'light' or 'nimble', + Greek sauros,
  'lizard'; means 'nimble lizard' or 'light-bodied lizard', referring to its
  lightly built frame"
description: Elaphrosaurus is a genus of ceratosaurian theropod dinosaur that
  lived approximately 155 to 145 million years ago during the Late Jurassic
  Period in what is now Tanzania in Africa. Elaphrosaurus was a medium-sized but
  lightly built member of the group that could grow up to 6.2 m (20 ft) long.
  Morphologically, this dinosaur is significant in two ways. Firstly, it has a
  relatively long body but is very shallow-chested for a theropod of its size.
  Secondly, it has very short hindlimbs in comparison with its body.
  Phylogenetic analyses indicate that this genus is likely a ceratosaur. Earlier
  suggestions that it is a late surviving coelophysoid have been examined but
  generally dismissed. Elaphrosaurus is currently believed to be a very close
  relative of Limusaurus, an unusual beaked ceratosaurian which may have been
  either herbivorous or omnivorous.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - coastal
diagnostic_features:
  - Teeth small, mostly 20–30 mm length, rarely exceeding 55 mm even with
    complete pulp wall preservation
  - Predominant tooth type strongly recurved posteriorly and fairly broad;
    posterior margin sharply cutting and finely serrated; anterior margin
    broadly rounded
  - Tooth apex shows wear on anterior face and lateral sides
  - Anterior cutting edge, when preserved, restricted to upper portion of crown
    only, deflecting lingually before disappearing downward
