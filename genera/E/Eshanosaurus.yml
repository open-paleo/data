genus: Eshanosaurus
parent: Therizinosauria
pronunciation:
  phonetic: uh-SHAH-no-SAWR-us
etymology: Named for Eshan County in Yunnan Province, China, where the fossil was found, combined with Greek 'sauros' meaning 'lizard'.
description: Eshanosaurus is a genus of a dinosaur from the early Jurassic
  Period. It is known only from a fossil partial lower jawbone, found in China.
  It may be a therizinosaurian, and if so the earliest known coelurosaur.
dispute:
  summary: >
    Both the affinities and the age of Eshanosaurus are contested. The original
    description (Xu et al., 2001) and a dedicated reassessment (Barrett, 2009)
    interpret its partial dentary as therizinosaurian, which, given the Early
    Jurassic age reported for the type locality, would make it the oldest known
    coelurosaur and imply an extensive ghost lineage. Others read the same
    material as a basal sauropodomorph (Kirkland and Wolfe, 2001) or note that
    many of the cited characters also occur in sauropodomorphs, and both Zanno
    (2010) and Sues and Averianov (2016) treat its therizinosaurian identity as
    problematic. It has never been included in a numerical phylogenetic analysis.
  history:
    - date: "2026-07-01"
      note: >
        Placed at Therizinosauria following the therizinosaurian affinity
        defended by Xu et al. (2001) and Barrett (2009); its position within the
        clade is untested and its identity and Early Jurassic age remain disputed.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Round fenestra present in the posterior portion of the dentary, anterior to
    the posterior end of the dentary tooth row
  - Tooth denticles smaller relative to those in other therizinosauroids (3.5
    per mm anteriorly, 4.4 per mm posteriorly)
  - Tooth denticles oriented almost perpendicular to the anterior and posterior
    edges of tooth crowns
  - Posterodorsal process of the dentary present, absent in other
    therizinosauroids
