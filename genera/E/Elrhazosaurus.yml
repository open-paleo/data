genus: Elrhazosaurus
parent: Dryosauridae
etymology: Elrhaz lizard
description: Elrhazosaurus is a genus of basal iguanodontian dinosaur, known
  from isolated bones found in Early Cretaceous rocks of Niger. These bones were
  initially thought to belong to a species of the related dryosaurid
  Valdosaurus, but have since been reclassified.
