genus: Elrhazosaurus
parent: Dryosauridae
etymology: "From Elrhaz (the Elrhaz Formation of Niger, where it was found) +
  Greek sauros (lizard): 'Elrhaz lizard'."
pronunciation:
  phonetic: el-RAH-zo-SOR-us
description: Elrhazosaurus is a genus of basal iguanodontian dinosaur, known
  from isolated bones found in Early Cretaceous rocks of Niger. These bones were
  initially thought to belong to a species of the related dryosaurid
  Valdosaurus, but have since been reclassified.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Proximal end of lesser trochanter positioned below that of greater trochanter
  - Transversely wide raised area separating the deep pit from the base of the
    fourth trochanter
  - Extensor groove in distal view is deep and obliquely inclined
    postero-medially
  - Extensor groove overlapped anteriorly by the acute-edged medial condyle
appearance:
  integument: scaled
  evidence: inferred
