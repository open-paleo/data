genus: Eomamenchisaurus
parent: Mamenchisauridae
etymology: "From Greek eos (dawn) + Mamenchisaurus (the related sauropod genus):
  'dawn Mamenchisaurus', reflecting its status as an early mamenchisaurid."
pronunciation:
  phonetic: EE-oh-mah-MUHN-chee-SOR-us
description: Eomamenchisaurus is a genus of mamenchisaurid sauropod dinosaur
  from the Middle Jurassic Zhanghe Formation of Yuanmou, Yunnan, China. The type
  species is E. yuanmouensis, described by Lü Junchang and colleagues in 2008.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Dorsal vertebrae lacking pleurocoels
  - Anterior articular surfaces of dorsal vertebrae flat to slightly convex;
    posterior articular surfaces moderately concave
  - Neural spines of third and fourth sacral vertebrae weakly fused
  - Shaft of ischium straight, cross-section of mid-shaft sub-oval, longer than
    pubis
  - Fourth trochanter placed on posteromedial margin of femur
  - Length ratio of tibia to femur approximately 0.64
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "153855"
