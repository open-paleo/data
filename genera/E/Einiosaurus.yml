genus: Einiosaurus
parent: Pachyrhinosaurini
description: Einiosaurus is a genus of herbivorous centrosaurine ceratopsian
  dinosaur from the Upper Cretaceous (Campanian stage) of northwestern Montana.
  The name means 'bison lizard', in a combination of Blackfeet Indian eini and
  Latinized Ancient Greek sauros; the specific name (procurvicornis) means 'with
  a forward-curving horn' in Latin. Einiosaurus is medium-sized with an
  estimated body length at 4.5 metres (15 ft).
diet: herbivore
