genus: Einiosaurus
parent: Centrosaurinae
pronunciation:
  phonetic: ie-nee-o-SAWR-us
etymology: From Blackfoot (Blackfeet Indian) 'eini' meaning 'bison' and
  Latinized Ancient Greek 'sauros' meaning 'lizard', meaning 'bison lizard'.
description: Einiosaurus is a genus of herbivorous centrosaurine ceratopsian
  dinosaur from the Upper Cretaceous (Campanian stage) of northwestern Montana.
  The name means 'bison lizard', in a combination of Blackfeet Indian eini and
  Latinized Ancient Greek sauros; the specific name (procurvicornis) means 'with
  a forward-curving horn' in Latin. Einiosaurus is medium-sized with an
  estimated body length at 4.5 meters (15 ft).
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Long-based, laterally compressed nasal horn, strongly procurved in some
    adults
  - Supraorbital horns, if present, low and rounded with convex medial surfaces
  - Parietal with single pair of large, curved spikes projecting posteriorly
    from the posterior margin (Process 3)
  - Nasal horncore extends posteriorly almost to the frontals in adults
  - Laterally expanded supracranial cavity passing ventrally within the
    supraorbital horn, forming 'cornual' sinus analogous to bovids
