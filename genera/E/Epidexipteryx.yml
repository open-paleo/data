genus: Epidexipteryx
parent: Paraves
etymology: From Greek 'epi' meaning 'upon' or 'over', 'deixi' meaning 'display', and 'pteryx' meaning 'wing' or 'feather', in reference to its ornamental display feathers.
pronunciation:
  phonetic: ep-id-ecks-IP-tuh-ricks
description: Epidexipteryx is a genus of small maniraptoran dinosaurs, known
  from one fossil specimen in the collection of the Institute of Vertebrate
  Paleontology and Paleoanthropology in Beijing. Epidexipteryx represents the
  earliest known example of ornamental feathers in the fossil record.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
  - forested
appearance:
  features:
    - feathered tail
  integument: feathered
diagnostic_features:
  - Four elongate ribbon-like tail feathers (ETFs) tightly attached to the last
    ten caudal segments.
  - Highly procumbent and significantly enlarged anterior teeth, much larger
    than posterior teeth.
  - Distally tapering pygostyle-like structure formed by ten unfused caudals at
    the end of the tail.
  - Tail approximately 70% of trunk length, with only 16 caudal vertebrae and
    reduced caudal prezygapophyses.
  - Pennaceous limb feathers absent despite well-preserved bones and integument,
    implying non-volant habit.
  - Non-shafted feathers with free distal barbs arising from the edge of a
    membranous structure, an arrangement not previously reported.
