genus: Europatitan
parent: Somphospondyli
etymology: From 'Europa' (Europe), referring to its discovery in Iberia, combined with Greek 'titan' meaning 'giant', meaning 'European giant'.
pronunciation:
  phonetic: yoo-ROW-pah-TIE-tuhn
description: "Europatitan is an extinct genus of somphospondylan sauropod from
  the Early Cretaceous Castrillo de la Reina Formation of Iberia, known from a
  relatively complete specimen discovered in the early 2000s. It contains a
  single species: the type species, Europatitan eastwoodi."
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Posterior cervical vertebrae with a parapophysis bearing a triradiate
    laminar structure in its dorsal part dividing the lateral pneumatic fossa.
  - Middle and posterior dorsal vertebrae with a horizontal
    intrapostzygapophyseal lamina (tpol) positioned dorsal to the hyposphene.
  - Middle and posterior dorsal vertebrae with centroprezygapophyseal lamina
    joined laterally to two accessory laminae delimiting pneumatic cavities,
    partially subdividing the centroprezygapophyseal parapophyseal fossa.
  - Middle and posterior dorsal vertebrae in which the centropostzygapophyseal
    laminae reach the lateroventral margin of the hyposphene and are forked at
    their ventral end.
  - Dorsal area of the deltoid crest of the scapula with a sub-elliptical rugose
    process accompanied ventrally by a rugose flat area and a pronounced groove.
  - On the dorsal margin of the scapular blade approximately at mid-length, a
    rugose tubercle with two projections separated by a semicircular depressed
    area.
appearance:
  integument: scaled
  evidence: inferred
