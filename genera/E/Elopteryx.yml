references:
  - id: andrews1913a
    notes: Erected Elopteryx nopcsai on femora from the Sânpetru Formation of
      Romania, originally interpreted as a bird.
  - id: naish2004b
    notes: Placed the Elopteryx femora as a troodontid or pygostylian and
      separated the referred tibiotarsi (Heptasteornis, Bradycneme) as distinct
      names.
  - id: stoicescu2024a
    notes: Interpreted new Elopteryx material as a secondarily flightless
      avialan and suggested Balaur bondoc may be a junior synonym.
