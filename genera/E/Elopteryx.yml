genus: Elopteryx
parent: Maniraptora
placement: incertae sedis
dispute:
  summary: >
    Elopteryx nopcsai is a small maniraptoran from the Maastrichtian of Romania,
    known from femora, and the debate around it concerns its affinities and the
    material referred to it rather than its validity. Its type femora were
    historically conflated with tibiotarsi that Harrison and Walker (1975) made
    the types of Heptasteornis andrewsi and Bradycneme draculae; Naish and Dyke
    (2004) separated these, placing the Elopteryx femora as a troodontid or a
    non-ornithuromorphan pygostylian (not an alvarezsaurid or dromaeosaurid),
    while regarding Heptasteornis as an alvarezsaurid nomen dubium and Bradycneme
    as Maniraptora indeterminate. Stoicescu et al. (2024) interpreted newer
    material as a secondarily flightless avialan and suggested Balaur bondoc may
    be its junior synonym. It is placed conservatively at Maniraptora incertae
    sedis.
  history:
    - date: "2026-07-01"
      note: Moved from Paraves to Maniraptora incertae sedis; the flightless-avialan interpretation and possible Balaur synonymy (Stoicescu et al., 2024) are noted, and the dubious status remains unresolved.
    - date: "2026-07-21"
      note: Dispute refocused on affinities and referred material and kept valid
        — no primary source treats Elopteryx nopcsai itself as dubious (Naish and
        Dyke, 2004, treat it as identifiable; the nomen-dubium call applies to
        Heptasteornis, a separate name), so the "dubious theropod" framing and
        the Jones (2026) citation for it were removed.
etymology: "From Greek 'helos' meaning 'marsh' or 'swamp' and Greek 'pteryx' meaning 'wing'; means 'marsh wing'."
pronunciation:
  phonetic: ee-LOP-tuh-rix
description: Elopteryx is a genus of paravian theropod dinosaur based on
  fragmentary fossils found in Late Cretaceous rocks of Romania. The single
  species, Elopteryx nopcsai, was known only from very incomplete material until
  new specimens were reported in the 21st century. Balaur bondoc might represent
  a junior synonym of this taxon.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Outer surface of femur raised into fine irregular wrinkles (distinctive bone
    sculpture), also present on tibio-tarsus fragment
  - Great trochanter with strongly forward-projecting antero-external angle
  - Head of femur rises above trochanteric surface; large circular fossa for
    ligamentum teres on posterior side of head
  - Deep muscle impressions (pits) on outer face of trochanter, probably for
    gluteus medius and gluteus externus
  - Strong linea aspera on anterior face of shaft running obliquely toward inner
    distal condyle; second linea aspera on posterior face running toward outer
    condyle
appearance:
  integument: feathered
  evidence: inferred
