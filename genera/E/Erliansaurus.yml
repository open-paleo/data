genus: Erliansaurus
parent: Therizinosauridae
etymology: "From Erlian (the town of Erlian/Erenhot in Inner Mongolia, China, near the discovery site) + Greek sauros (lizard): 'Erlian lizard'."
description: Erliansaurus is a genus of therizinosaurian theropod dinosaur that
  lived in Asia during the Campanian stage of the Late Cretaceous period in
  what is now Nei Mongol, Iren Dabasu Formation.
