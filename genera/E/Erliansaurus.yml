genus: Erliansaurus
parent: Therizinosauridae
etymology: "From Erlian (the town of Erlian/Erenhot in Inner Mongolia, China,
  near the discovery site) + Greek sauros (lizard): 'Erlian lizard'."
pronunciation:
  phonetic: ur-lee-yen-sor-us
description: Erliansaurus is a genus of therizinosaurian theropod dinosaur that
  lived in Asia during the Campanian stage of the Late Cretaceous period in what
  is now Nei Mongol, Iren Dabasu Formation.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Enlarged nutritional foramen on anterior caudal vertebrae (large, oval,
    sharp-rimmed opening on lateral surface of caudal centra, unknown in other
    theropods)
  - Crest-like posterior trochanter on humerus, 25 mm in length with
    wedge-shaped cross-section, bordered medially by a shallow oval depression
  - Rugose swelling located dorsal to the ischiadic peduncle on the lateral
    surface of the ilium, anterior to the heavy posterodistal crest
  - Posterior margin of fibular proximal end significantly higher than anterior
    margin, forming a concave sloping dorsal margin in medial/lateral views
  - Distally located hypertrophied anterior trochanter on fibula at mid-shaft,
    projecting laterally rather than anteriorly
appearance:
  features:
    - enlarged manual claws
  integument: feathered
  evidence: direct
