genus: Elmisaurus
parent: Caenagnathidae
pronunciation:
  phonetic: EL-mi-SAWR-us
etymology: "From Mongolian elmyi/ölmyi (foot sole) + Greek sauros (lizard):
  'foot sole lizard', because the type specimen consisted of a fused
  metatarsus."
description: Elmisaurus is an extinct genus of caenagnathid theropod dinosaur
  from the Late Cretaceous Nemegt Formation of Mongolia.
diet: omnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Metatarsal III visible anteriorly for about 90% of its entire length
  - Length/width ratio of metatarsus 0.18
  - Metacarpal I about 2/3 the length of phalanx I of digit I
  - Digit III of manus markedly thinner than digits I and II, which are equally
    thick
  - Ventroposterior portions of manus phalanges distinctly thickened at proximal
    surfaces
  - Tarsal 4 with an upward process at lateral margin; cross-section of
    metatarsus semilunar
appearance:
  features:
    - feathered tail
  integument: feathered
  evidence: direct
