genus: Edmontosaurus
parent: Edmontosaurini
pronunciation:
  ipa: /ɛdˌmɒntəˈsɔːrəs/
  phonetic: ed-MON-tuh-SOR-uhs
etymology: "From Edmonton (city in Alberta, Canada, near the formation where it
  was found) + Greek sauros, 'lizard'; means 'lizard from Edmonton'"
description: 'Edmontosaurus (meaning "lizard from Edmonton"), often colloquially
  and historically known as Anatosaurus or Anatotitan (meaning "duck lizard" and
  "giant duck"), is a genus of hadrosaurid (duck-billed) dinosaur. It contains
  two known species: Edmontosaurus regalis and Edmontosaurus annectens. Fossils
  of E. regalis have been found in rocks of western North America that date from
  the late Campanian age of the Cretaceous period 73 million years ago, while
  those of E. annectens were found in the same geographic region from rocks
  dated to the end of the Maastrichtian age, 66 million years ago. Edmontosaurus
  was one of the last non-avian dinosaurs ever to exist, and lived alongside
  dinosaurs like Triceratops, Tyrannosaurus, Ankylosaurus, and
  Pachycephalosaurus shortly before the Cretaceous-Paleogene extinction event.'
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Large pocket-like recess developed within the postfrontal, leading from the
    orbit, restricting the lateral temporal fossa in its upper half-length
  - Skull high and broad posteriorly, flat in the frontal region, laterally
    compressed behind a low, greatly expanded snout; posterior height greater
    than half-length
  - Ectopterygoid external to the maxillary and pterygoid, connecting the two
  - Palatine and pterygoid rising at a high angle inward
  - Teeth with rounded apical outline in lateral aspect, keeled,
    smooth-bordered; 48-49 vertical rows in dentary, 51-53 in maxillary
  - Sacrum composed of eight vertebrae; cervical and dorsal vertebrae
    opisthocoeolous, markedly so in cervicals
appearance:
  features:
    - keratinous beak
    - fleshy cranial crest
    - dorsal spines
  integument: scaled
  evidence: direct
