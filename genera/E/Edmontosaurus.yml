notable_specimens:
  - nickname: AMNH mummy
    specimen_id: [AMNH 5060]
    institution: AMNH
    category: exceptional-preservation
    significance: "The \"mummified\" Trachodon mummy, with extensive preserved skin impressions known for most of the body. Carbonized possible gut contents were reported but never described. Found in 1908 in the Lance Formation near Lusk, Wyoming, and purchased by the museum for $2,000."
    discovered:
      year: 1908
      by: "Charles Hazelius Sternberg and his sons"
    references: [sereno2025, sternberg1909]
  - nickname: Senckenberg mummy
    specimen_id: [SM 4036]
    institution: SMF-DE
    category: gut-contents
    significance: "Second Sternberg mummy, with skin impressions and described plant gut contents (needles of the conifer Cunninghamites elegans, twigs, and seeds), debated as a true last meal versus washed-in debris. Also preserves rare scleral rings and substantial keratinous beak."
    discovered:
      year: 1910
      by: "Charles Hazelius Sternberg and his sons"
    references: [sereno2025, kräusel1922, uhl2020]
  - nickname: Dakota
    specimen_id: [MRF-03, NDGS 2000]
    institution: NDGS
    category: exceptional-preservation
    significance: "A well-publicized \"mummy\" with preserved skin impressions apparently including remnant organic compounds from the skin. Discovered in 1999 in the Hell Creek Formation of North Dakota and announced in 2007."
    discovered:
      year: 1999
      by: "Tyler Lyson"
    references: [manning2009]
  - specimen_id: [LACM 23502]
    institution: LACM
    category: exceptional-preservation
    significance: "Preserves a rhamphotheca, indicating the beak of Edmontosaurus was more hook-shaped and extensive than many scientific and public illustrations have depicted; whether it is the true rhamphotheca or a cast of the inner structure is uncertain."
    references: [morris1970]
