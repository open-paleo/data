synonyms:
  - name: Ugrunaaluk
    type: junior subjective
    reason: Now interpreted as juvenile material of Edmontosaurus; the exact species
      remains undetermined.
  - name: Anatotitan
    type: junior subjective
    reason: Originally erected as a replacement name for Anatosaurus; subsequent
      work demonstrated the material is referable to Edmontosaurus.
  - name: Anatosaurus
    type: junior subjective
    reason: Material is now widely recognized as indistinguishable from Edmontosaurus.
