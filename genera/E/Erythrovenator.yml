genus: Erythrovenator
parent: Theropoda
etymology: From Greek erythros (ερυθρός), 'red', + Latin venator, 'hunter';
  means 'red hunter', likely referring to the red mudstone in which the fossil
  was found
pronunciation:
  phonetic: eh-RITH-ro-VEN-uh-tuh
description: Erythrovenator is a genus of basal theropod dinosaurs from the Late
  Triassic of Rio Grande do Sul, Brazil. The genus contains a single species,
  Erythrovenator jacuiensis.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Absence of a raised dorsolateral trochanter of the femur (local autapomorphy)
  - Pyramidal shape of the anterior trochanter in anterior view
  - Absence of a folded anteromedial tuber
  - Anterior trochanter separated from the femoral shaft by a marked cleft
  - Medial portion of the anterior trochanter projects medially forming a
    plate-like structure, separated from shaft by a longitudinal sulcus
appearance:
  integument: scaled
  evidence: inferred
