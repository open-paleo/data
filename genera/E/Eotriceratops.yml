genus: Eotriceratops
parent: Chasmosaurinae
etymology: "From Greek eos (dawn) + treis (three) + keras (horn) + ops (face): 'dawn three-horned face', marking it as an early relative of Triceratops."
pronunciation:
  phonetic: EE-oh-tri-SEH-ruh-tops
description: Eotriceratops is a genus of herbivorous ceratopsian dinosaurs which
  lived in the area of North America during the late Cretaceous period. The only
  named species is Eotriceratops xerinsularis.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Tall lamina-like narial process of premaxilla lacking any fossa or recess,
    with dorsal margin well above ventral border of interpremaxillary fenestra.
  - Epoccipitals of squamosal frill extremely elongate, spindle-shaped
    (length/width ratio ~10:1), contacting each other along the frill margin.
  - Well-demarcated elliptical depression or fossa with thickened borders on the
    anteroventral surface of the squamosal frill.
  - Oblique vascular trace on anterior surface of nasal horn core meeting a
    transverse vascular trace ventrally.
  - Sharply conical epijugal with pronounced proximoposterior process and
    separate fossa-like articular facets for jugal and quadratojugal on its
    proximal surfaces.
appearance:
  integument: scaled
  evidence: inferred
