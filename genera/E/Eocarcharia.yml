genus: Eocarcharia
parent: Carcharodontosauridae
placement: incertae sedis
dispute:
  summary: >
    Eocarcharia dinops is regarded as a basal carcharodontosaurid on the basis of
    its referred maxilla (Sereno and Brusatte, 2008), but Cau and Paterna (2025)
    argue the hypodigm is chimeric, reinterpreting the holotype postorbital as a
    spinosaurid (Baryonychinae) and severing it from the carcharodontosaurid maxilla.
    It is placed conservatively at Carcharodontosauridae incertae sedis.
  history:
    - date: "2026-07-01"
      note: Retained at Carcharodontosauridae incertae sedis following the referred maxilla; the chimeric-hypodigm and spinosaurid-holotype hypothesis (Cau and Paterna, 2025) is noted but not adopted.
etymology: From Greek eos, 'dawn/early', + Greek karcharias, 'shark' (as in a sharp-toothed creature); means 'dawn shark', referring to its early geological age and shark-like serrated teeth
pronunciation:
  phonetic: EE-o-car-CAR-ee-uh
description: Eocarcharia is an extinct genus of theropod dinosaurs found in what
  is now the western Ténéré Desert of Niger. It is known from several skull
  bones collected in 2000 by an expedition to the Early Cretaceous
  (Aptian-Albian ages) Elrhaz Formation (Gadoufaoua locality) led by American
  paleontologist Paul Sereno. The fossil material was then described in 2008 by
  Sereno and Steve Brusatte. The genus contains a single species, Eocarcharia
  dinops. While Sereno and Brusatte identified all of the remains as belonging
  to a new carcharodontosaurid, later studies suggested that the species is
  chimaeric, comprising bones of at least two unrelated taxa. Some of the
  Eocarcharia material, including the holotype (name-bearing) specimen, likely
  belongs to a baryonychine spinosaurid. This would render Eocarcharia a member
  of this group, closely related to the coeval Suchomimus. Meanwhile, the
  definitively carcharodontosaurid bones, a maxilla and teeth, belong to a
  distinct unnamed taxon.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Enlarged subtriangular laterally exposed promaxillary fenestra larger in
    size than the maxillary fenestra
  - Circular accessory pneumatic fenestra on the posterodorsal ramus of the
    maxilla
  - Dorsoventral expansion of antorbital fossa ventral to the promaxillary and
    maxillary fenestrae
  - Postorbital brow accentuated by a finely textured ovoid swelling (boss)
    positioned above the posterodorsal corner of the orbit
  - Postorbital medial process with a plate-shaped projection fitted to an
    articular slot on the frontal
  - Interlocking postorbital-jugal articulation with a narrow laterally-facing
    facet where jugal wraps around posterior margin of postorbital ventral ramus
