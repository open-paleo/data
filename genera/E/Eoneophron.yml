genus: Eoneophron
parent: Caenagnathidae
pronunciation:
  phonetic: ee-oh-NEE-oh-fron
etymology: From Greek eos, 'dawn/early', + Neophron (genus of Egyptian vulture); means 'dawn Neophron', drawing a comparison to the vulture genus and emphasizing its early appearance
description: Eoneophron is an extinct genus of caenagnathid theropod dinosaur
  from the Late Cretaceous Hell Creek Formation of South Dakota, US. The genus
  contains a single species, E. infernalis, known from a partial hindlimb.
diet: omnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Astragalocalcaneum fused to tibia at maturity (tibiotarsus coossification),
    unique within Caenagnathoidea
  - Shaft of metatarsal IV with a well-developed oblique longitudinal ridge on
    anterior surface extending along the distal three-quarters of the shaft
  - Femoral head directed dorsomedially rather than perpendicular to shaft,
    meeting long axis at obtuse angle (~100°)
  - Distal tarsal IV coossified with proximal end of metatarsal IV at maturity
  - Proximal ends of metatarsals III and IV project posteriorly to form a
    proximal protuberance
