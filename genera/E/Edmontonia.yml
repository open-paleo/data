genus: Edmontonia
parent: Nodosauridae
etymology: Named after the Edmonton Formation (now the Horseshoe Canyon Formation) in Alberta, Canada, where it was first found; Edmonton itself is named after Edmonton in London, England
description: Edmontonia is a genus of panoplosaurin nodosaurid dinosaur from the
  Late Cretaceous Period of what is now western North America. It is named after
  the Edmonton Formation (now the Horseshoe Canyon Formation in Canada), the
  unit of rocks where it was first found.
