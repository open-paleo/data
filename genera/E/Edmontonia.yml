genus: Edmontonia
parent: Nodosauridae
pronunciation:
  phonetic: ed-mon-TOHN-ee-a
etymology: Named after the Edmonton Formation (now the Horseshoe Canyon
  Formation) in Alberta, Canada, where it was first found; Edmonton itself is
  named after Edmonton in London, England
description: Edmontonia is a genus of panoplosaurin nodosaurid dinosaur from the
  Late Cretaceous Period of what is now western North America. It is named after
  the Edmonton Formation (now the Horseshoe Canyon Formation in Canada), the
  unit of rocks where it was first found.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Skull nearly twice as long as broad (roughly oblong), highly elongated
    relative to other Upper Cretaceous ankylosaurs
  - Lateral temporal fossa in normal lateral position facing outward, not
    covered by dermal bone as in Panoplosaurus
  - "Teeth large and numerous: 16 alveoli in maxilla (135 mm) and 18 in dentary
    (155 mm), larger than in other known ankylosaurs except Palaeoscincus"
  - Palatines and pterygoids united on midline forming a sharp-edged
    longitudinal ridge that divides the mouth cavity, extending below the level
    of the maxillary teeth
  - Dermal plates on skull defined by shallow sulci (not deep circumscribing
    grooves), with a large oval central cranial plate longer than broad
appearance:
  features:
    - body armor
    - shoulder spikes
    - osteoderms
  integument: armored
  evidence: direct
