genus: Euhelopus
parent: Euhelopodidae
pronunciation:
  phonetic: yoo-HEL-o-pus
etymology: "From Greek 'helos' meaning 'swamp' and Greek 'pous' meaning 'foot', giving 'true marsh-foot' (prefix 'eu-' meaning 'true' was added by Romer in 1956 when renaming from Helopus); the name refers to the marshy area of the finds and to Swedish swamp shoes (truga) which Wiman said resembled the animal's wide feet."
description: Euhelopus is a genus of sauropod dinosaur that lived between 143
  and 133 million years ago during the Berriasian and Valanginian ages of the
  Early Cretaceous in what is now Shandong Province in China. It was a large
  quadrupedal herbivore. Like sauropods such as brachiosaurids and titanosaurs,
  Euhelopus had longer forelimbs than hindlimbs. This discovery was
  paleontologically significant because it represented the first dinosaur
  scientifically investigated from China - seen in 1913, rediscovered in 1922,
  excavated in 1923, and studied by T'an during the same year.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
appearance:
  features:
    - elongate neck
  integument: scaled
  evidence: inferred
diagnostic_features:
  - Teeth procumbent, with an asymmetrical crown-to-root margin (mesial margin
    nearer the crown apex) and well-developed crown buttresses on the
    mesiolingual surface
  - Cervical neural arches with an epipophyseal-prezygapophyseal lamina dividing
    two pneumatocoels throughout the cervical series
  - Anterior cervical ribs with three costal spurs on the tuberculum and
    capitulum; middle cervical ribs hanging well below the centrum on elongate
    parapophyses and capitula
  - Presacral neural spines 16 to 21 trifid, with a median tubercle as large as or
    larger than the metapophyses
  - Middle and posterior dorsal parapophyseal and diapophyseal laminae crossing to
    form a K-shaped configuration on the lateral face of the neural arch
  - Presacral pneumaticity extending into the ilium
