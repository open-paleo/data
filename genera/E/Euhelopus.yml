genus: Euhelopus
parent: Euhelopodidae
description: Euhelopus is a genus of sauropod dinosaur that lived between 143
  and 133 million years ago during the Berriasian and Valanginian ages of the
  Early Cretaceous in what is now Shandong Province in China. It was a large
  quadrupedal herbivore. Like sauropods such as brachiosaurids and titanosaurs,
  Euhelopus had longer forelimbs than hindlimbs. This discovery was
  paleontologically significant because it represented the first dinosaur
  scientifically investigated from China — seen in 1913, rediscovered in 1922,
  excavated in 1923, and studied by T'an during the same year.
diet: herbivore
locomotion: quadrupedal
