genus: Ekrixinatosaurus
parent: Brachyrostra
description: Ekrixinatosaurus is a genus of abelisaurid theropod which lived
  approximately 99 to 97 million years ago during the Late Cretaceous period.
  Its fossils have been found in Argentina. Only one species is currently
  recognized, Ekrixinatosaurus novasi, from which the specific name honors Dr.
  Fernando Novas for his contributions to the study of abelisaurid theropods,
  while the genus name refers to the dynamiting of the holotype specimen. It was
  a large abelisaurid, measuring between 6.5 and 8 m (21 and 26 ft) in length
  and weighing 800 kg (1,800 lb).
diet: carnivore
locomotion: bipedal
