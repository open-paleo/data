genus: Ekrixinatosaurus
parent: Brachyrostra
etymology: From Greek ekrixis, 'explosion', + Greek -natos, 'born', + Greek
  sauros, 'lizard/reptile'; means 'explosion-born reptile', referring to the
  dynamiting that uncovered the holotype specimen
pronunciation:
  phonetic: a-CREEK-see-NAH-toe-SOR-us
description: Ekrixinatosaurus is a genus of abelisaurid theropod which lived
  approximately 99 to 97 million years ago during the Late Cretaceous period.
  Its fossils have been found in Argentina. Only one species is currently
  recognized, Ekrixinatosaurus novasi, from which the specific name honors Dr.
  Fernando Novas for his contributions to the study of abelisaurid theropods,
  while the genus name refers to the dynamiting of the holotype specimen. It was
  a large abelisaurid, measuring between 6.5 and 8 m (21 and 26 ft) in length
  and weighing 800 kg (1,800 lb).
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - arid
diagnostic_features:
  - Fenestra between the postorbital and the anterior border of the frontal,
    absent in other Abelisauridae
  - Protuberance directed backward on the contact between the parietals with the
    paraoccipital process
  - Cervical vertebrae cranio-caudally compressed with neural spines as tall as
    the epipophyses
  - Mid-posterior cervical centrum with ventral side flattened and two wide
    foramina
  - Small pre-spinal lamina with pneumatic excavation connected to the neural
    canal in middle-posterior cervicals
  - Tibia with a swelling at midshaft
