genus: Eousdryosaurus
parent: Dryosauridae
etymology: "From Greek eous (eastern) + Dryosaurus (the related genus): 'eastern Dryosaurus', referring to its geographic origin in Portugal relative to other dryosaurid relatives."
pronunciation:
  phonetic: yuss-dry-o-sor-us
description: Eousdryosaurus is a genus of basal iguanodontian dinosaur known
  from a partial skeleton discovered in Upper Jurassic rocks in western
  Portugal. The type, and only species, is Eousdryosaurus nanohallucis, named
  and described in 2014.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Proximal-most caudal neural spines with a small thorn-like anterior process
  - Extremely wide ilium brevis shelf that is ventromedially directed
  - Astragalus with a prominent triangular posteromedial process that obscures
    the anterior surface
  - Calcaneum with a strong proximal projection that has a rounded dorsal margin
  - Medial distal tarsal composed of sutured but not fused distal tarsals 1 and 2
  - Metatarsal V with a blunt eminence at midshaft that breaks in slope to its
    distal end
  - Phalangeal formula for the pes of 1-3-4-5-0, with ungual of digit I uniquely
    extremely reduced, dorsoventrally flattened, elongated and pointed
appearance:
  integument: scaled
  evidence: inferred
