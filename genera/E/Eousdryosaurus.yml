genus: Eousdryosaurus
parent: Dryomorpha
etymology: "From Greek eous (eastern) + Dryosaurus (the related genus): 'eastern Dryosaurus', referring to its geographic origin in Portugal relative to other dryosaurid relatives."
description: Eousdryosaurus is a genus of basal iguanodontian dinosaur known
  from a partial skeleton discovered in Upper Jurassic rocks in western
  Portugal. The type, and only species, is Eousdryosaurus nanohallucis, named
  and described in 2014.
