genus: Eodromaeus
parent: Saurischia
etymology: "From Greek eos (dawn) + dromeus (runner): 'dawn runner', reflecting its status as one of the earliest known theropods."
pronunciation:
  phonetic: EE-o-DROHM-ee-us
description: Eodromaeus is an extinct genus of probable basal theropod dinosaurs
  from the Late Triassic of Argentina. Like many other of the earliest-known
  dinosaurs, it hails from the Carnian-age (~230 Ma) Ischigualasto Formation,
  within the Ischigualasto-Villa Unión Basin of northwestern Argentina. Upon its
  discovery, it was argued to be one of the oldest true theropods, supplanting
  its contemporary Eoraptor, which was reinterpreted as a basal sauropodomorph.
locomotion: bipedal
paleoenvironment:
  - fluvial
diet: carnivore
diagnostic_features:
  - No more than 11 maxillary teeth with caniniform crowns more than three times
    the basal mesiodistal width near the anterior end of the tooth row
  - Fine serrations (~nine per millimeter) on mesial and distal margins of
    maxillary teeth, with ventrally convex maxillary alveolar margin
  - Very shallow jugal suborbital ramus
  - Centrale in carpus positioned between the radiale and distal carpal 1; large
    distal carpal 5 overlapping distal carpal 4 with a posteroventral heel
  - Pubic apron with sinuous lateral margin and pubic foot with squared
    posterior margin
