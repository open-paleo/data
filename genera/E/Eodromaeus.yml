genus: Eodromaeus
parent: Saurischia
etymology: "From Greek eos (dawn) + dromeus (runner): 'dawn runner', reflecting its status as one of the earliest known theropods."
description: Eodromaeus is an extinct genus of probable basal theropod dinosaurs
  from the Late Triassic of Argentina. Like many other of the earliest-known
  dinosaurs, it hails from the Carnian-age (~230 Ma) Ischigualasto Formation,
  within the Ischigualasto-Villa Unión Basin of northwestern Argentina. Upon its
  discovery, it was argued to be one of the oldest true theropods, supplanting
  its contemporary Eoraptor, which was reinterpreted as a basal sauropodomorph.
locomotion: bipedal
diet: carnivore
