genus: Europelta
parent: Nodosauridae
etymology: "From Europa (Europe, where it was found) + Greek pelte (shield): 'Europe's shield', reflecting its nodosaurid armor and European origin."
pronunciation:
  phonetic: YOO-ro-PEL-tuh
description: Europelta is a monospecific genus of nodosaurid dinosaur from Spain
  that lived during the Early Cretaceous (early Albian stage, ~113.0 Ma) in what
  is now the lower Escucha Formation of the Teruel Province. The type and only
  species, Europelta carbonensis, is known from two associated partial
  skeletons, and represents the most complete ankylosaur known from Europe.
  Europelta was named in 2013 by James I. Kirkland and colleagues. Europelta has
  an estimated length of 5 meters (16 feet) and weight of 1.3 tonnes (2,866
  lbs), making it the largest member of the clade Struthiosaurini.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Quadrate shorter and mediolaterally wider than in any other ankylosaur
    (ratio of mediolateral width to dorsoventral length = 0.77)
  - Posterior margin of skull concave in dorsal view
  - Sacrum arched dorsally about 55 degrees in lateral view
  - Pubis fully and uniquely fused to ischium with slot-shaped foramen between
    post-pubic process and pubic peduncle position, forming an ischiopubis
  - Tibia longer relative to femur length (90%) than in other ankylosaurs for
    which these proportions are known
  - Laterally compressed, flanged osteoderm with flat plate-like base present
    anteriorly on the pelvic shield
appearance:
  features:
    - shoulder spikes
    - body armor
    - osteoderms
  integument: armored
  evidence: direct
