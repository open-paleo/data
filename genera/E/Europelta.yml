genus: Europelta
parent: Nodosauridae
etymology: "From Europa (Europe, where it was found) + Greek pelte (shield): 'Europe's shield', reflecting its nodosaurid armor and European origin."
pronunciation:
  phonetic: YOO-ro-PEL-tuh
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Quadrate shorter and mediolaterally wider than in any other ankylosaur
    (ratio of mediolateral width to dorsoventral length = 0.77)
  - Posterior margin of skull concave in dorsal view
  - Sacrum arched dorsally about 55 degrees in lateral view
  - Pubis fully and uniquely fused to ischium with slot-shaped foramen between
    post-pubic process and pubic peduncle position, forming an ischiopubis
  - Tibia longer relative to femur length (90%) than in other ankylosaurs for
    which these proportions are known
  - Laterally compressed, flanged osteoderm with flat plate-like base present
    anteriorly on the pelvic shield
appearance:
  features:
    - shoulder spikes
    - body armor
    - osteoderms
  integument: armored
  evidence: direct
identifiers:
  - source: pbdb
    id: "284794"
  - source: wikidata
    id: Q15272780
  - source: eol
    id: "42418535"
species:
  - name: Europelta carbonensis
    etymology: "From Latin 'carbo' meaning 'coal', honoring the Sociedad Anónima Minera Catalano-Aragonesa (SAMCA Group) for providing access to the fossil locality in the open-pit Santa María coal mine."
    pronunciation:
      phonetic: kar-boh-NEN-sis
    status: valid
    type_species: true
    period:
      name:
        - Early Cretaceous
      stage:
        - Albian
    location:
      country: ES
      locality: AR-1, Santa María coal mine, Ariño
      region: ES-TE
      formation: Escucha
      part: lower
    type_specimen:
      specimen_id: [CPT AR-1/10]
      specimen_type: holotype
      institution: CPT
      material: "Disarticulated partial skeleton: mostly complete skull, isolated
        nasals, dentary fragment, 15 teeth, atlas, 5 cervical vertebrae, 2 cervical
        ribs, 8 dorsal vertebrae, synsacrum section, dorsal ribs, 3 caudal vertebrae,
        4 chevrons, coracoid, scapular blade fragment, 2 xiphosternal plates, 2
        partial humeri, pelvis, 70 osteoderms"
      completeness: partial
    size:
      length_m:
        min: 5.0
        max: 5.0
      weight_kg:
        min: 1300
        max: 1300
    erected_in: kirkland2013a
