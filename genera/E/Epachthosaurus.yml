genus: Epachthosaurus
parent: Lithostrotia
pronunciation:
  phonetic: e-PAK-tho-SAWR-us
etymology: "From Greek epachthes (heavy/burdensome) + sauros (lizard): 'heavy
  lizard', likely referring to its robust build as a large titanosaur."
description: Epachthosaurus was a genus of titanosaurian sauropod dinosaur,
  belonging to Lithostrotia, from the Late Cretaceous of Central and Northern
  Patagonia in South America.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Dorsal vertebrae with relatively large, wide, and depressed centra
  - Pleurocoels wider and deeper than those in other known titanosaurs,
    eye-shaped
  - Posterior dorsal neural spines compressed anteroposteriorly with a wide and
    well-developed prespinal lamina
  - Prespinal lamina bifurcated at its base, forming spinoprezygapophyseal
    laminae
  - Diapophysis without dorsal flattening distally
appearance:
  integument: scaled
  evidence: inferred
