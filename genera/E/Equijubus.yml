genus: Equijubus
parent: Hadrosauroidea
etymology: "From Latin equus (horse) + juba (mane): 'horse mane', after the
  Mazong (horse mane) Mountain region in Gansu, China, where it was discovered."
description: Equijubus is a genus of herbivorous hadrosauroid dinosaur from the
  Early Cretaceous (Albian stage) of northwestern China.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Unique finger-like process extending dorsally from the rostral process of
    the jugal to the lacrimal.
  - Very large lower temporal fenestra, twice the size of the orbit.
  - Long lacrimal with a rostroventral process positioned above the dorsal
    margin of the maxilla.
  - Dentary teeth lacking a median primary ridge on the crown of the enamelled
    lingual surface.
