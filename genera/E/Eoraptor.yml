genus: Eoraptor
parent: Sauropodomorpha
pronunciation:
  phonetic: EE-oh-RAP-tor
  ipa: /ˈiːoʊˌræptər/
etymology: "From Greek eos, 'dawn', + Latin raptor, 'seizer/thief'; means 'dawn thief' or 'dawn plunderer', reflecting its status as one of the earliest known dinosaurs"
description: Eoraptor is a genus of small, lightly built, basal sauropodomorph
  dinosaur. One of the earliest-known dinosaurs and one of the earliest
  sauropodomorphs, it lived approximately 231 to 228 million years ago, during
  the Late Triassic in Western Gondwana, in the region that is now northwestern
  Argentina. The type and only species, Eoraptor lunensis, was first described
  in 1993, and is known from an almost complete and well-preserved skeleton and
  several fragmentary ones. Eoraptor had multiple tooth shapes, which suggests
  that it was omnivorous.
diet: omnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Premaxilla with a slender posterolateral process bearing a tongue-shaped
    distal expansion.
  - Nasal with a transversely broad, horizontal shelf with a convex lateral
    margin that overhangs the antorbital fossa.
  - Pterygoid process on the posterior palate margin that articulates laterally
    in a synovial socket in the ectopterygoid.
  - Narrow premaxilla-maxilla diastema, approximately one crown in width.
  - Maxillary crowns with a prominent lateral eminence.
  - Accessory articular process on the medial aspect of the midcervical
    prezygapophyses.
  - Extreme hollowing of the dorsal centra and neural arches.
