genus: Erectopus
parent: Allosauroidea
etymology: From Latin 'erectus' (upright) and Greek 'pous' (foot); meaning
  'upright foot', a reference to the posture of the original syntype foot bones
  described by Sauvage (1882).
pronunciation:
  phonetic: ee-REK-toe-puss
description: Erectopus is an extinct genus of basal allosauroid theropod from
  the Albian phosphate-bearing beds (La Penthièvre Formation) of Louppy-le-
  Château in the Argonne region of north-eastern France. The type and only
  species, Erectopus superbus, was originally named Megalosaurus superbus by
  Sauvage in 1882, transferred to the new genus Erectopus by von Huene in 1923,
  and subsequently split by Huene into a second species E. sauvagei in 1932.
  All of Sauvage's original syntypes were destroyed at the Muséum National
  d'Histoire Naturelle during World War II; Allain (2005) recovered an
  associated maxilla in a Parisian fossil collection in the late 1990s,
  designated it the lectotype (MNHN 2001-4), and synonymised E. sauvagei into
  E. superbus.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - coastal
diagnostic_features:
  - Rounded anterior ramus of maxilla
  - Slender neck of femur
  - Posterior curvature of proximal half of femur
  - Anterodorsal edge of calcaneum dorsally projected
  - Calcaneum anteroposterior length twice its median vertical depth
  - Lateral margin of proximal end of second metatarsal regularly concave along
    entire length
