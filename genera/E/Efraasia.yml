genus: Efraasia
parent: Sauropodomorpha
pronunciation:
  phonetic: E-FRAHS-ee-A
description: "Efraasia is a genus of basal sauropodomorph dinosaur. It was a
  herbivore which lived during the middle Norian stage of the Late Triassic,
  around 210 million years ago, in what is now Germany. It was named in 1973
  after Eberhard Fraas, who during the early twentieth century collected what
  were the original type specimens. The specimens were at first assigned to
  three already existing genera and so became divided among three separate
  species: Teratosaurus minor, Sellosaurus fraasi and Paleosaurus diagnosticus.
  In 2003, these were combined into a single valid species: Efraasia minor.
  Efraasia was a lightly built, medium-sized sauropodomorph, about 6 to 7 metres
  (20 to 23 ft) long."
diet: herbivore
locomotion: bipedal
