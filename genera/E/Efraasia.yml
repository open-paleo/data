genus: Efraasia
parent: Sauropodomorpha
pronunciation:
  phonetic: E-FRAHS-ee-A
etymology: "Named after German paleontologist Eberhard Fraas, who collected the original specimens in the early twentieth century; the 'E.' prefix likely stands for Eberhard"
description: "Efraasia is a genus of basal sauropodomorph dinosaur. It was a
  herbivore which lived during the middle Norian stage of the Late Triassic,
  around 210 million years ago, in what is now Germany. It was named in 1973
  after Eberhard Fraas, who during the early twentieth century collected what
  were the original type specimens. The specimens were at first assigned to
  three already existing genera and so became divided among three separate
  species: Teratosaurus minor, Sellosaurus fraasi and Paleosaurus diagnosticus.
  In 2003, these were combined into a single valid species: Efraasia minor.
  Efraasia was a lightly built, medium-sized sauropodomorph, about 6 to 7 meters
  (20 to 23 ft) long."
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Basipterygoid processes of medium length (neither very short as in
    Anchisaurus nor very long as in Thecodontosaurus)
  - Second digit of manus robust and noticeably longer than digit 3, unique
    among prosauropods
  - Ilium with a short anterior process (not elongate as in Anchisaurus or
    Gyposaurus)
  - Pubis with a closed obturator foramen and a broad apron-like distal part
  - First ungual is the largest on the pes
  - Slender metacarpals and metatarsals/phalanges with elongate cervical
    vertebrae and low dorsal centra
