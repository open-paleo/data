genus: Echinodon
parent: Heterodontosauridae
pronunciation:
  phonetic: e-KIEN-o-don
etymology: From Greek echinos, 'prickly/spiny' (as in hedgehog or sea urchin), +
  Greek odon, 'tooth'; means 'prickly tooth', referring to its distinctive
  dental anatomy
description: Echinodon is a genus of heterodontosaurid dinosaur that lived
  during the earliest Cretaceous of southern England and possibly western France
  in the Berriasian epoch. The first specimens were jaw bones named Echinodon
  becklesii by Sir Richard Owen in 1861, and since their original description
  only additional teeth have been discovered. The specific name honors
  collector Samuel Beckles who discovered the material of Echinodon and many
  other taxa from across England, while the genus name translates as "prickly
  tooth" in reference to the dental anatomy of the taxon.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - coastal
  - lacustrine
diagnostic_features:
  - One or possibly two caniniform teeth at the anterior end of the maxilla
appearance:
  features:
    - enlarged caniniform teeth
    - keratinous beak
  integument: feathered
  evidence: direct
identifiers:
  - source: pbdb
    id: "38717"
  - source: wikidata
    id: Q134292
  - source: gbif
    id: "4823157"
synonyms:
  - name: Saurechinodon
    type: junior subjective
    reason: Treated as a synonym of Echinodon; the name also appears as
      'Sauraechinodon' and 'Sauraechmodon'.
  - name: Sauraechmodon
    type: junior subjective
    reason: Variant spelling of Saurechinodon, itself treated as a synonym of
      Echinodon.
  - name: Sauraechinodon
    type: junior subjective
    reason: Variant spelling of Saurechinodon, itself treated as a synonym of
      Echinodon.
