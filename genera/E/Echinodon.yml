genus: Echinodon
parent: Heterodontosauridae
pronunciation:
  phonetic: e-KIEN-o-don
etymology: From Greek echinos, 'prickly/spiny' (as in hedgehog or sea urchin), +
  Greek odon, 'tooth'; means 'prickly tooth', referring to its distinctive
  dental anatomy
description: Echinodon is a genus of heterodontosaurid dinosaur that lived
  during the earliest Cretaceous of southern England and possibly western France
  in the Berriasian epoch. The first specimens were jaw bones named Echinodon
  becklesii by Sir Richard Owen in 1861, and since their original description
  only additional teeth have been discovered. The specific name honors
  collector Samuel Beckles who discovered the material of Echinodon and many
  other taxa from across England, while the genus name translates as "prickly
  tooth" in reference to the dental anatomy of the taxon.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - coastal
  - lacustrine
diagnostic_features:
  - Teeth thecodont (implanted in sockets with cross partitions forming
    alveoli), distinguishing Echinodon from pleurodont genera such as Macellodon
  - Crown lamelliform with marginal serrations on apical half that increase in
    size toward the base, terminating in two large basal spine-like points
  - Basal half of crown has thickened fore and hind borders forming two ridges
    that converge at an acute angle, causing an undulated transverse surface
    between them and the median rising
  - Crown suddenly expands both transversely and antero-posteriorly above the
    subcylindrical fang, then contracts to a sharp apex; outer and inner sides
    converge in almost a straight line to the apex
  - Anterior teeth laniariform (subcompressed, slightly recurved, sharp-pointed
    canine-like), contrasting with typical expanded posterior molar-like teeth
    in the same jaw
appearance:
  features:
    - enlarged caniniform teeth
    - keratinous beak
  integument: feathered
  evidence: direct
