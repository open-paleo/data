genus: Eotyrannus
parent: Tyrannosauroidea
etymology: "From Greek eos (dawn) + tyrannos (tyrant): 'dawn tyrant', indicating it is an early member of the tyrannosaur lineage."
description: Eotyrannus is a genus of tyrannosauroid theropod dinosaur hailing
  from the Early Cretaceous Wessex Formation beds, included in Wealden Group,
  located in the southwest coast of the Isle of Wight, United Kingdom. The
  remains (MIWG1997.550), consisting of assorted skull, axial skeleton and
  appendicular skeleton elements, from a juvenile or subadult, found in a plant
  debris clay bed, were described by Stephen Hutt and colleagues in early 2001.
  The etymology of the generic name refers to the animal's classification as an
  early tyrannosaur or "tyrant lizard", while the specific name honors the
  discoverer of the fossil.
diet: carnivore
locomotion: bipedal
