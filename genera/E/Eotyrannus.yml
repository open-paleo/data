genus: Eotyrannus
parent: Tyrannosauroidea
pronunciation:
  phonetic: EE-oh-ti-RAN-us
etymology: "From Greek eos (dawn) + tyrannos (tyrant): 'dawn tyrant', indicating it is an early member of the tyrannosaur lineage."
description: Eotyrannus is a genus of tyrannosauroid theropod dinosaur hailing
  from the Early Cretaceous Wessex Formation beds, included in Wealden Group,
  located in the southwest coast of the Isle of Wight, United Kingdom. The
  remains (MIWG1997.550), consisting of assorted skull, axial skeleton and
  appendicular skeleton elements, from a juvenile or subadult, found in a plant
  debris clay bed, were described by Stephen Hutt and colleagues in early 2001.
  The etymology of the generic name refers to the animal's classification as an
  early tyrannosaur or "tyrant lizard", while the specific name honors the
  discoverer of the fossil.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Premaxillary teeth D-shaped in cross-section with serrated carinae on both
    rostral and caudal edges
  - Maxillary and dentary teeth with apically complete denticulation; rostral
    carinae bear denticles for less than half the length of the denticle-bearing
    part of the caudal carinae; denticle size difference index of c. 1.5
  - Rostral portion of maxilla laterally flattened with rostral border to the
    antorbital fossa sharply defined; ventral edge of maxilla straight
  - Coracoid with prominent mediolaterally-wide, subcircular glenoid directed
    caudally
  - Manus proportionally long (digit II c. 95% humerus length) with three
    well-developed metacarpals; carpals not reduced to simple elements as in
    tyrannosaurids
appearance:
