genus: Emausaurus
parent: Thyreophora
description: Emausaurus is a genus of thyreophoran or armored dinosaur from the
  Early Jurassic (Early Toarcian). Its fossils have been found in the Lehmhagen
  Member, in Mecklenburg-Vorpommern, northern Germany. Emausaurus is the only
  known Toarcian thyreophoran, as well as the only dinosaur from the zone of the
  same age with a formal name.
