genus: Emausaurus
parent: Thyreophora
pronunciation:
  phonetic: em-ow-SAWR-us
etymology: From EMAU, an acronym of Ernst Moritz Arndt University (Universität
  Greifswald, Germany, where the specimen was studied), + Greek sauros,
  'lizard'; means 'EMAU lizard'
description: Emausaurus is a genus of thyreophoran or armored dinosaur from the
  Early Jurassic (Early Toarcian). Its fossils have been found in the Lehmhagen
  Member, in Mecklenburg-Vorpommern, northern Germany. Emausaurus is the only
  known Toarcian thyreophoran, as well as the only dinosaur from the zone of the
  same age with a formal name.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - marine
appearance:
  integument: armored
diagnostic_features:
  - Broad skull proportions, width exceeding 50% of skull length; five
    premaxillary teeth with narrow subparallel premaxillary snout and palate
  - Buccal shelf on maxilla and dentary initiated at the 10th-11th tooth position
  - Broad triangular palpebral (supraorbital), laterally strongly sculptured,
    articulating only with the prefrontal
  - W-shaped contact of jugal and quadratojugal, with caudal jugal processes
    overlapping quadratojugal both dorsally and ventrally
  - Postorbital with prominent sharp dorsolateral crest continuing into squamosum
  - Retroarticular process rounded and directed upward
