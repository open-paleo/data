genus: Caenagnathus
parent: Caenagnathidae
etymology: From Greek 'kainos' (new, recent) and 'gnathos' (jaw); meaning
  'recent jaw', alluding to the novel jaw morphology distinct from then-known
  birds and reptiles.
pronunciation:
  phonetic: KAY-nag-NAY-thus
description: Caenagnathus is a genus of caenagnathid oviraptorosaurian dinosaur
  from the late Cretaceous period (Campanian stage, about 75 million years ago).
  It is known from partial remains including lower jaws, a tail vertebra, hand
  bones, hind limbs, and pelvis, all found in the Dinosaur Park Formation of
  Alberta, Canada.
diet: omnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
appearance:
  integument: feathered
diagnostic_features:
  - No teeth present
  - Dentaries fused at symphysis; pars symphysis relatively long and broad
  - Rami parallel throughout their length
  - Mandibular fossa large, elongate with flattened-oval shape, extending 60 mm
    posteriorly from its anterior border
  - Articular surface large, oval, and convex with a ridged axis parallel to the
    direction of the ramus
  - Mandibular processes (internal, external, and posterior) short and fairly
    stout, subcircular and horizontal
  - Anterior tip of the dentary (occlusal beak tip) not upturned
