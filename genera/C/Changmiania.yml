genus: Changmiania
parent: Ornithopoda
pronunciation:
  phonetic: chahng-MYEN-ee-uh
etymology: From Chinese changmian (长眠, 'eternal sleep'), referring to the life-like buried positions of the specimens, which suggest they were buried alive while sleeping.
description: Changmiania is a genus of basal ornithopod dinosaur that lived in
  what is now China during the Early Cretaceous. It contains a single species,
  Changmiania liaoningensis.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
  - forested
diagnostic_features:
  - Rostrocaudally elongated frontals with maximum length to width ratio >4,
    distinctly narrower than in all other basal ornithopods
  - Only six cervical vertebrae, reduced from the nine typical of basal
    ornithischians and ornithopods
  - Neural spines of sacral vertebrae completely fused together, forming a
    craniocaudally-elongated continuous bar
  - Fused scapulocoracoid with scapular blade asymmetrically expanded both
    ventrally and dorsally
  - Paired ilia symmetrically inclined dorsomedially, partially covering the
    sacrum in dorsal view
  - Proximal half of fibula as robust as the corresponding portion of the tibia
appearance:
  features:
    - keratinous beak
  integument: scaled
  evidence: inferred
