genus: Chubutisaurus
parent: Somphospondyli
pronunciation:
  phonetic: choo-BOOT-i-SAWR-us
etymology: Named after Chubut Province in Patagonia, Argentina, where the
  fossils were discovered, + Greek sauros ('lizard'), meaning 'Chubut lizard'.
description: Chubutisaurus is a genus of somphospondylan sauropod dinosaur from
  the Early Cretaceous (Aptian to Albian) Cerro Barcino Formation of Argentina.
  The type species, Chubutisaurus insignis, was described by del Corro in 1975.
  Chubutisaurus had a more robust radius than Venenosaurus. In 2010 Gregory S.
  Paul gave a length of 18 meters (59 ft) and a weight of 12 tonnes (13 short
  tons). Thomas Holtz estimated its length at 23 meters (75 ft) in 2012.
diet: herbivore
