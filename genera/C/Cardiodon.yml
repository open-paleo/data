genus: Cardiodon
parent: Eusauropoda
placement: incertae sedis
etymology: From Greek 'kardia' ('heart') and 'odon' ('tooth'), for the almost
  heart-shaped crown of the tooth on which the genus was founded.
description: Cardiodon was a herbivorous genus of sauropod dinosaur, based on a
  tooth from the Middle Jurassic (late Bathonian) Forest Marble Formation of
  Wiltshire, England. Historically, it is very obscure and usually referred to
  Cetiosaurus, but recent analyses suggest that it is a distinct genus, and
  possibly related to Turiasaurus. Cardiodon was the first sauropod genus named.
dispute:
  summary: >
    Cardiodon was named by Owen (1841) for an isolated tooth that he took to
    belong to an extinct crocodilian, and its affinities have been unsettled
    ever since. Lydekker (1890) treated it as the senior name for the material
    of Cetiosaurus oxoniensis, and later workers either ignored that synonymy
    or accepted it while continuing to use Cetiosaurus, which led Steel (1970)
    to coin the combination Cetiosaurus rugulosus. Upchurch and Martin (2003)
    rejected the synonymy outright, finding that the tooth referred to
    Cetiosaurus has the concave lingual surface usual in basal sauropods while
    the Cardiodon tooth is convex, so the two share no derived character. They
    retained Cardiodon rugulosus provisionally and identified it as Eusauropoda
    incertae sedis. Royo-Torres and others (2006) instead suggested the tooth
    may be referable to Turiasauria, a position they maintained in 2020. It is
    placed at Eusauropoda incertae sedis, the least inclusive clade common to
    both hypotheses. The type material is a single tooth whose whereabouts are
    unknown, and the referred tooth is by Upchurch and Martin's own assessment
    barely adequate to diagnose a distinct form, so the species is treated as a
    nomen dubium.
diet: herbivore
identifiers:
  - source: pbdb
    id: "53008"
  - source: wikidata
    id: Q18578336
species:
  - name: Cardiodon rugulosus
    etymology: From Latin 'rugulosus' ('finely wrinkled'), for the wavy
      longitudinal ridges and finer rugae of the enamel.
    status: nomen dubium
    type_species: true
    period:
      name:
        - Middle Jurassic
      stage:
        - Bathonian
    location:
      country: GB
      region: GB-ENG
      locality: Bradford-on-Avon, Wiltshire
      formation: Forest Marble
    type_specimen:
      specimen_type: holotype
      status: lost
      material: Isolated tooth with a crown that expands abruptly above the
        neck, is flattened transversely and broader anteroposteriorly, edged
        before and behind, and contracts to a usually abraded point; enamel
        roughened by wavy longitudinal ridges with finer rugae between them;
        fang smooth and cylindrical.
      completeness: fragmentary
    synonyms:
      - name: Cetiosaurus rugulosus
        type: junior objective
        reason: Combination coined by Steel (1970) for the original Cardiodon
          tooth. Cardiodon has priority, and Upchurch and Martin (2003) treat
          the combination as a junior objective synonym because it rests on the
          same type specimen.
    erected_in: owen1844a
erected_in: owen1841b
references:
  - id: owen1841b
    notes: Erects the genus on an isolated heart-shaped tooth from the Forest
      Marble near Bradford, Wiltshire, referring it to an extinct crocodilian.
  - id: owen1844a
    notes: Figures the tooth in the plate descriptions and first applies the
      binomial Cardiodon rugulosus.
  - id: upchurch2003a
    notes: Rejects the synonymy with Cetiosaurus, retains the species
      provisionally, and identifies it as Eusauropoda incertae sedis.
  - id: royo-torres2006a
    notes: Suggests the Cardiodon tooth may be referable to the newly named
      clade Turiasauria on shared crown morphology.
  - id: mannion2011b
    notes: Notes the convex lingual tooth surface as unique among eusauropods
      other than titanosaurs.
