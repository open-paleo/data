genus: Caihong
parent: Anchiornithidae
etymology: From Mandarin Chinese caihong (彩虹) meaning 'rainbow', likely referring to its iridescent feather coloration as inferred from melanosomes.
description: Caihong is a genus of small paravian theropod dinosaur from China
  that lived during the Late Jurassic period.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
  - forested
diagnostic_features:
  - Accessory fenestra posteroventral to the promaxillary fenestra in the maxilla
  - Lacrimal with prominent dorsolaterally oriented crests (robust, horn-shaped
    fourth process projecting laterally then curving dorsally)
  - Robust dentary with anterior tip dorsoventrally deeper than its midsection
  - Short ilium (<50% of femoral length, compared to considerably >50% in other
    theropods)
  - Forelimb proportionally short (~60% hindlimb length) yet forearm bones (ulna
    and radius) longer than humerus
  - Tail feathers with asymmetrical vanes on mid-series rectrices forming a
    broad tail surface area; caudal series only ~2.5× femoral length
appearance:
  features:
    - feather crest
    - feathered wings
    - hindlimb feathers
    - feathered tail
  integument: feathered
  evidence: direct
