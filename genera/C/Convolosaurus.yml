genus: Convolosaurus
parent: Ornithopoda
placement: incertae sedis
etymology: From Latin convolo ('to flock together') + Greek sauros ('lizard'), meaning 'flocking lizard', in reference to the concentration of juvenile fossils found together at the discovery site.
pronunciation:
  phonetic: kon-vuh-luh-SAWR-us
  ipa: /ˌkɒnvələˈsɔːrəs/
description: Convolosaurus is a genus of basal ornithopod dinosaur from the Twin
  Mountains Formation from Proctor Lake in Comanche County, Texas. The type and
  only species is Convolosaurus marri.
dispute:
  summary: >
    Convolosaurus was described as a basal ornithopod just outside
    Iguanodontia, crownward of Hypsilophodon (Andrzejewski and colleagues,
    2019), and Dieudonné and colleagues (2020, 2026) and Tykoski and
    colleagues (2023) recover it in a similar position. Fonseca and
    colleagues (2024) and Czepiński and Madzia (2025) instead recover it as
    the earliest-diverging tenontosaurid, within Rhabdodontomorpha.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Four premaxillary teeth each with a proximodistally oriented sulcus on the
    buccal surface, unique among ornithopods.
  - Opisthocoelous cervical vertebrae.
  - Sacral neural spines twice the height of the sacral centra.
  - Proximal caudal neural spines 1.5 times the height of the centrum.
  - Curved maxillary tooth roots (curved medially in anteroposterior view).
  - Laterally compressed prepubic process.
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "382686"
  - source: wikidata
    id: Q62051118
  - source: eol
    id: "55758063"
species:
  - name: Convolosaurus marri
    etymology: "Named for Dr. Ray H. Marr, who propagated the Society of Vertebrate Paleontology at Southern Methodist University."
    status: valid
    type_species: true
    period:
      name:
        - Early Cretaceous
      stage:
        - Aptian
    location:
      country: US
      locality: Proctor Lake
      region: US-TX
      formation: Twin Mountains
      part: lower
    type_specimen:
      specimen_id: [SMU 72834]
      specimen_type: holotype
      institution: SMPSMU
      material: Skull and partial articulated skeleton with 9 cervical, 15 dorsal, 6
        sacral, 23 caudal vertebrae; scapulae; coracoids; humeri; left ulna and
        radius; partial left manus; articulated pelvis; femora; proximal tibiae;
        proximal left fibula.
      completeness: complete
    size:
      weight_kg:
        min: 50
        max: 50
      hip_height_m:
        min: 1
        max: 1
      length_m:
        min: 2.5
        max: 3.0
    erected_in: andrzejewski2019a
references:
