genus: Convolosaurus
parent: Tenontosauridae
etymology: From Latin convolo ('to flock together') + Greek sauros ('lizard'), meaning 'flocking lizard', in reference to the concentration of juvenile fossils found together at the discovery site.
pronunciation:
  phonetic: kon-vuh-luh-SAWR-us
  ipa: /ˌkɒnvələˈsɔːrəs/
description: Convolosaurus is a genus of basal ornithopod dinosaur from the Twin
  Mountains Formation from Proctor Lake in Comanche County, Texas. The type and
  only species is Convolosaurus marri.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Four premaxillary teeth each with a proximodistally oriented sulcus on the
    buccal surface, unique among ornithopods.
  - Opisthocoelous cervical vertebrae.
  - Sacral neural spines twice the height of the sacral centra.
  - Proximal caudal neural spines 1.5 times the height of the centrum.
  - Curved maxillary tooth roots (curved medially in anteroposterior view).
  - Laterally compressed prepubic process.
