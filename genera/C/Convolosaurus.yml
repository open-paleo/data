  - id: fonseca2024a
    notes: Recovered Convolosaurus as the earliest-diverging tenontosaurid,
      within Rhabdodontomorpha.
  - id: czepiński2025a
    notes: Recovered Convolosaurus within Rhabdodontomorpha as a tenontosaurid.
  - id: dieudonné2020a
    notes: Recovered Convolosaurus outside Iguanodontia.
  - id: tykoski2023a
    notes: Recovered Convolosaurus among hypsilophodont-grade ornithopods, near Hypsilophodon.
  - id: dieudonné2026a
    notes: Recovered Convolosaurus near Hypsilophodon, outside Iguanodontia.
