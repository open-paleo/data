genus: Callovosaurus
parent: Dryosauridae
etymology: From Callovian (the Middle Jurassic geological age during which the animal lived, named after Kellaways/Callovium in England) + Greek sauros (σαῦρος) meaning 'lizard'; overall meaning 'Callovian lizard'.
pronunciation:
  phonetic: cah-LO-vo-SOR-us
description: Callovosaurus is a genus of iguanodontian dinosaur known from most
  of a left thigh bone discovered in Middle Jurassic-age rocks of England. At
  times, it has been considered dubious or a valid genus of basal iguanodontian,
  perhaps a dryosaurid.
diet: herbivore
locomotion: bipedal
