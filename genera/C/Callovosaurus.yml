genus: Callovosaurus
parent: Dryosauridae
etymology: From Callovian (the Middle Jurassic geological age during which the animal lived, named after Kellaways/Callovium in England) + Greek sauros (σαῦρος) meaning 'lizard'; overall meaning 'Callovian lizard'.
pronunciation:
  phonetic: cah-LO-vo-SOR-us
description: Callovosaurus is a genus of iguanodontian dinosaur known from most
  of a left thigh bone discovered in Middle Jurassic-age rocks of England. At
  times, it has been considered dubious or a valid genus of basal iguanodontian,
  perhaps a dryosaurid.
dispute:
  summary: >
    Callovosaurus leedsi, based only on a femur, is regarded as the
    earliest dryosaurid by Ruiz-Omeñaca and others (2007) and Jones
    (2026), but its limited material leaves the assignment weakly
    constrained — McDonald and others (2012) recovered it in an
    unresolved basal Iguanodontia polytomy — and its validity is
    sometimes questioned.
  history:
    - date: "2026-06-29"
      note: Placed at Dryosauridae following the prevailing view (Jones,
        2026); the more basal alternatives reflected, not adopted.
    - date: "2026-07-09"
      note: Re-evaluated; retained at Dryosauridae. Czepiński and Madzia
        (2025) does not include Callovosaurus, so the dryosaurid
        assignment (Ruiz-Omeñaca and others 2007; Jones 2026) stands
        against only an unresolved basal-Iguanodontia polytomy (McDonald
        and others 2012); no broadening is warranted.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - marine
appearance:
  integument: scaled
  evidence: inferred
diagnostic_features:
  - Greater trochanter proportionally narrow
  - Lesser trochanter expanded anteroposteriorly and flattened transversely,
    forming a thin sheet
  - Distal end of femur unexpanded
  - Anterior intercondylar groove shallow
  - Fourth trochanter positioned more proximally than in Camptosaurus dispar
  - Greater trochanter does not underlap the lesser trochanter, unlike
    Camptosaurus dispar
