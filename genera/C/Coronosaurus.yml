genus: Coronosaurus
parent: Centrosaurini
etymology: From Latin corona, 'crown', + Greek sauros, 'lizard'; means 'crowned lizard', referring to the crown-like horn arrangement on its frill
description: Coronosaurus is a genus of centrosaurine ceratopsian dinosaurs
  which lived in the Late Cretaceous, in the middle Campanian stage. Its
  remains, two bone beds, were discovered by Phillip J. Currie in the Oldman
  Formation of Alberta, Canada, and its type and only species, Coronosaurus
  brinkmani, was first described in 2005, as a new species within the genus
  Centrosaurus. Later studies questioned the presence of a direct relationship,
  and in 2012 it was named as a separate genus. Coronosaurus means "crowned
  lizard", coming from "corona", Latin for crown, and "sauros", Greek for
  lizard; this name refers to the unique, crown-like shape of the horns on the
  top of its frill.
