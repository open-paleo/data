genus: Caieiria
parent: Aeolosaurini
etymology: Named after the Caieira locality in Minas Gerais, Brazil, where its fossils were recovered.
pronunciation:
  phonetic: kai-eye-ree-uh
description: Caieiria is a genus of titanosaurian dinosaur from the Late
  Cretaceous Serra da Galga Formation (formerly a unit of the Marília Formation)
  of Brazil. The type and only species is Caieiria allocaudata.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Caudal vertebrae with robust and dorsoventrally expanded transverse
    processes, almost half the centrum height
  - Anterior caudal vertebrae with a deep postzygapophyseal centrodiapophyseal
    fossa expanding anteromedially on the dorsal margin of the neural arch
  - Anteriorly extended caudal prezygapophyses with wide (dorsoventrally
    expanded) articular faces, about 70% of centrum length in middle caudal
    vertebrae
  - Caudal neural spines lean gently anteriorly or stand nearly vertical
    (contrasting with posteriorly leaning spines in Baurutitan britoi)
  - Lateral faces of centra more deeply excavated than at similar serial
    position in closely related taxa; deep muscular scar on lateral face of 2nd
    caudal vertebra
