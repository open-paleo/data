genus: Chucarosaurus
parent: Colossosauria
etymology: From Mapudungun or Quechua chucaro ('indomitable' or 'wild, untamed') + Greek sauros ('lizard'), meaning 'indomitable reptile'.
pronunciation:
  phonetic: SHOO-kah-ro-SOR-us
description: Chucarosaurus is an extinct genus of titanosaurian dinosaur from
  the Late Cretaceous (middle Cenomanian-lower Turonian) Huincul Formation of
  Argentina. The genus contains a single species, C. diripienda, known from
  various limb and pelvic bones.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Ischium with very short and robust iliac peduncle with a poorly developed
    neck (autapomorphy)
  - Tibia with articular surface for ascending process of astragalus strongly
    extended anteriorly, separated from rest of bone by a notch (autapomorphy)
  - Humerus with proximally convex humeral head separated from major tubercle by
    a well-defined concavity
  - Femur with epicondyle extremely developed laterally, close to the lateral
    condyle
  - Femur with fourth trochanter located in the proximal third of the femur
  - Tibia with cnemial crest prominent and medially curved but dorsoventrally
    short
appearance:
  integument: scaled
  evidence: inferred
