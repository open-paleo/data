genus: Coahuilaceratops
parent: Chasmosaurinae
etymology: Named after Coahuila, the state in northern Mexico where the fossils were found, + Greek ceratops ('horned face'), meaning 'horned face from Coahuila'.
description: Coahuilaceratops is a genus of chasmosaurine ceratopsian dinosaur
  that lived during the early Maastrichtian age of the Late Cretaceous epoch,
  about 71.5 to 70.5 million years ago in what is now northern Mexico. It
  contains a single species, Coahuilaceratops magnacuerna.
diet: herbivore
locomotion: quadrupedal
