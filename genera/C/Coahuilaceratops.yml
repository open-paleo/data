genus: Coahuilaceratops
parent: Chasmosaurinae
etymology: Named after Coahuila, the state in northern Mexico where the fossils
  were found, + Greek ceratops ('horned face'), meaning 'horned face from
  Coahuila'.
pronunciation:
  phonetic: co-wah-WEE-lah-SEH-ruh-tops
description: Coahuilaceratops is a genus of chasmosaurine ceratopsian dinosaur
  that lived during the early Maastrichtian age of the Late Cretaceous epoch,
  about 71.5 to 70.5 million years ago in what is now northern Mexico. It
  contains a single species, Coahuilaceratops magnacuerna.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Triangular premaxillary flange with a large ventrolaterally directed facet,
    contrasting with the ventromedially directed facet in all other
    chasmosaurine taxa
  - Premaxilla caudoventral process with ventrolateral surface dorsoventrally
    flattened (thicker transversely than dorsoventrally), unlike other
    chasmosaurines
  - Triangular flange caudal to narial strut hyperrobust in cross-section, much
    more so than in most or all other chasmosaurine taxa
  - Supraorbital horncores hyperrobust with a maximum diameter of ~15 cm and
    relatively little tapering in the proximal portion
  - Nasal process of rostrum with dorsalmost preserved portion straight rather
    than caudally curved, unlike virtually all other chasmosaurines
