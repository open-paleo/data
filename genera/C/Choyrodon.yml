genus: Choyrodon
parent: Hadrosauroidea
etymology: Named for the city of Choyr in Mongolia, where the fossils were
  found, combined with Greek 'odon' meaning 'tooth'.
pronunciation:
  phonetic: kwa-yuh-row-don
description: Choyrodon is a genus of hadrosauroid dinosaur from the Early
  Cretaceous (Albian) Khuren Dukh Formation of Mongolia. The type and only
  species is Choyrodon barsboldi. The generic name is derived from the city of
  Choyr, and -odon, from Latin for tooth; the specific name barsboldi honors
  paleontologist Rinchen Barsbold. The material consists of a holotype partial
  skull and cervical ribs, with two other partial skulls both with associated
  postcranial material. It was found to be the sister taxon of Eolambia.
dispute:
  summary: >
    Choyrodon barsboldi is placed among basal hadrosauroids by Jones
    (2026), who notes its phylogenetic position is poorly resolved; it
    has been recovered close to Eolambia.
  history:
    - date: "2026-06-29"
      note: Placed at Hadrosauroidea (basal) following the prevailing
        view.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Anterodorsal process of maxilla dorsoventrally broad with length-to-height
    ratio of 1, dorsal margin reaching and extending along ventral bony naris
  - Nasal possessing a low rise on dorsal surface positioned at posterior extent
    of nasal fenestra, with dorsoventrally thickened bone on posterior surface
    below the dorsal rise
  - Elongate, hypertrophied external narial fenestra with nasals comprising only
    a small portion of posteroventral margin
  - Lacrimal bearing rounded anterior margin and lobate shape in lateral view
  - Predentary with series of paired foramina below oral margin throughout
    lateral length of element, and flattened articulation surface across entire
    ventral margin
  - Surangular displays two deep osteological folds on lateral surface ventral
    to second foramen
appearance:
