genus: Ceratosaurus
parent: Ceratosauridae
etymology: From Greek 'keras/keratos' (horn) and 'sauros' (lizard); meaning
  'horn lizard', referring to the distinctive median nasal horn core.
pronunciation:
  ipa: /ˌsɛrətoʊˈsɔːrəs/
  phonetic: SERR-ah-toe-SOR-uhs
description: Ceratosaurus is the type genus of Ceratosauridae and one of the
  most iconic Late Jurassic theropods of the Morrison Formation. The type
  species, Ceratosaurus nasicornis, was erected by Othniel Charles Marsh in
  1884 on a near-complete skeleton (USNM 4735) collected by M. P. Felch from
  Quarry No. 1, Garden Park, near Cañon City, Fremont County, Colorado.
  Originally housed at the Yale Peabody Museum, the holotype was transferred
  to the USNM in 1898-1899 and prepared by C. W. Gilmore over 1911-1918.
  Gilmore (1920) produced the canonical redescription as USNM Bulletin 110,
  correcting Marsh's restoration errors and supporting Ceratosauridae as
  distinct from Megalosauridae against Cope's 1892 referral. Madsen and
  Welles (2000) revised the osteology and named two additional Morrison
  species (C. dentisulcatus from Cleveland-Lloyd, C. magnicornis from the
  Fruita Paleontological Area), each based on more complete material from
  upper or lower Brushy Basin Member horizons. Ceratosaurus is most readily
  diagnosed by an unpaired nasal horn core, smaller paired protuberances
  above each orbit, an unusually low premaxillary tooth count, a tightly
  coossified pelvis, coossified metatarsals II-IV, and a row of small
  dermal ossicles running along the dorsal midline.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
appearance:
  integument: armored
diagnostic_features:
  - Unpaired median horn core formed from the nasals, transversely compressed
    and positioned above the external nares.
  - Paired horn-like protuberances on the lacrimal/prefrontal bones above
    the antorbital fenestra, partially overhanging each orbit.
  - Cervical vertebral centra plano-concave (flat anteriorly, deeply cupped
    posteriorly), with strongly shortened posterior cervicals.
  - Zygosphene-zygapophysis accessory articulation present in cervical and
    dorsal vertebrae.
  - Premaxilla bears only three teeth, an unusually low count among
    contemporaneous Jurassic theropods.
  - Pelvis tightly coossified — ilium, pubis, and ischium fused — with a
    closed obturator foramen on a slender pubis.
  - Metatarsals II-IV coossified to one another.
  - Row of small osseous dermal ossicles preserved along the dorsal midline
    from the base of the skull through the proximal tail.
