species:
  - name: Ceratosaurus nasicornis
    etymology: From Latin 'nasus' (nose) and 'cornu' (horn); meaning
      'nose-horned', referring to the median nasal horn core.
    pronunciation:
      phonetic: NAZ-i-KOR-nis
    status: valid
    type_species: true
    period:
      name:
        - Late Jurassic
      stage:
        - Kimmeridgian
        - Tithonian
    location:
      country: US
      region: US-CO
      formation: Morrison
      member: Brushy Basin
      locality: Felch Quarry No. 1
      notes: Chure (2000) places Felch Quarry 1 in the Brushy Basin Member, "47.9
        m above the J5 unconformity", for two other types from the quarry.
    size:
      hip_height_m:
        min: 1.5
        max: 1.5
      length_m:
        min: 5.1
        max: 5.5
      weight_kg:
        min: 500
        max: 1000
    type_specimen:
      specimen_id:
        - USNM 4735
      specimen_type: holotype
      institution: USNM
      material: Near-complete skeleton including the skull and lower jaws,
        atlas-axis complex, seven cervical and 12 (mostly fragmentary)
        dorsal vertebrae, sacrum, ~50 caudal vertebrae with chevrons, the
        coossified pelvis, both femora, the right tibia, fibula, and pes,
        plus dorsal-midline dermal ossicles.
      completeness: complete
    synonyms:
      - name: Megalosaurus nasicornis
        type: reassigned
        reason: Cope (1892) referred Ceratosaurus nasicornis to Megalosaurus;
          Gilmore (1920) rejected the referral and reaffirmed Ceratosaurus as
          a valid genus distinct from Megalosaurus.
    erected_in: marsh1884a
    described_in: gilmore1920a
notable_specimens:
  - specimen_id: [UMNH VP 5278]
    institution: UMNH
    species: Ceratosaurus nasicornis
    category: complementary
    significance: "Fragmentary, disarticulated skeleton with skull from the Cleveland-Lloyd Quarry, Utah, one of the largest known Ceratosaurus individuals, estimated up to about 7 meters long and as much as 1,132 kilograms. Originally the basis of the now-synonymized species C. dentisulcatus."
    discovered:
      year: 1960
      by: "James Madsen"
    references: [paul2016a, glut1997a]
  - specimen_id: [MWC 1]
    institution: MWC
    species: Ceratosaurus nasicornis
    category: complementary
    significance: "Articulated, fairly complete subadult specimen with skull from near Fruita, Colorado, lacking lower jaws, forearms, and gastralia. Includes a well-preserved, CT-scanned braincase. Basis of the now-synonymized species C. magnicornis; one study estimated it as the largest known individual."
    discovered:
      year: 1976
      by: "Thor Erikson"
    references: [foster2020a, sombathy2025a]
  - specimen_id: [ML 352, SHN (JJS)-65]
    institution: SHN
    category: range-extension
    significance: "Partial skeleton from the Porto Novo Member of the Lourinha Formation at Valmitao beach, Portugal, including femur, tibia, fibula, and teeth. First evidence of Ceratosaurus outside North America. Species assignment is unresolved, ranging from C. dentisulcatus to Ceratosaurus aff. C. nasicornis."
    references: [mateus2000a]
references:
  - id: chure2000a
    notes: Gives the Felch Quarry 1 horizon as "Brushy Basin Mbr., 47.9 m above
      the J5 unconformity".
  - id: marsh1884a
    notes: Erects Ceratosaurus nasicornis and the family Ceratosauridae on a
      near-complete skeleton (now USNM 4735) from the Morrison Formation of
      Garden Park, Colorado.
  - id: gilmore1920a
    notes: Definitive redescription of the holotype after the 1898-1899 USNM
      transfer; corrects Marsh's restoration errors and rejects Cope's referral
      to Megalosaurus.
  - id: madsen2000a
    notes: Modern osteological revision; names two additional Morrison species
      (C. dentisulcatus and C. magnicornis) and reassigns several Labrosaurus
      species, placing Labrosaurus in synonymy with Allosaurus.
  - id: glut1997a
  - id: mateus2000a
    notes: Abstract volume, Rio de Janeiro.
  - id: paul2016a
  - id: foster2020a
  - id: sombathy2025a
  - id: jones2026c
    notes: Source of the hip height estimate, and the appearance features.
  - id: hendrickx2022a
    notes: Documents the mosaic and sagittate dorsal-midline osteoderms on the
      neck and tail.
  - id: cope1892b
