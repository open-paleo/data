genus: Crichtonpelta
parent: Ankylosaurinae
pronunciation:
  phonetic: KRY-ton-PEL-tuh
etymology: Named after author Michael Crichton (of Jurassic Park fame) + Greek pelta, 'small shield'; means 'Crichton's shield', referring to its ankylosaur armor
description: Crichtonpelta is a genus of extinct herbivorous ankylosaurid
  dinosaur from the Late Cretaceous (Cenomanian) of China.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - lacustrine
diagnostic_features:
  - Apex of quadratojugal horn directed dorsally (autapomorphy unique among
    ankylosaurids).
  - Quadratojugal horn apex posteriorly offset (not centrally located as in
    Gobisaurus and Shamosaurus).
  - Nuchal crest bears two distinct transversely elongate prominences.
  - Squamosal horns larger and more pointed than in Gobisaurus or Shamosaurus,
    though smaller than in Pinacosaurus mephistocephalus.
  - Rugose, amorphous frontonasal ornamentation not subdivided into discrete
    caputegulae.
  - Jugal dorsoventrally deeper than in Pinacosaurus grangeri or P.
    mephistocephalus.
appearance:
  features:
    - body armor
    - osteoderms
  integument: armored
  evidence: direct
