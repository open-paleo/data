genus: Ceratocaudia
parent: Macronaria
etymology: Cerato- (Greek, horn) + caud- (Greek, tail), for the horn-like crest
  on the anterior caudal neural spines; gender feminine.
description: Ceratocaudia is a genus of macronarian sauropod dinosaur from the
  Jurassic Kaladongar Formation of Gujarat, India. The genus contains a single
  species, the type species Ceratocaudia antiqua, known from a partial skeleton.
locomotion: quadrupedal
paleoenvironment:
  - coastal
diagnostic_features:
  - Small notch on the apex of the postzygapophyseal articular facet of the
    anterior cervical vertebra, positioned just below the epipophysis.
  - Anterior caudal vertebrae with tall neural spines bearing a flat dorsal edge
    and an anteriorly directed, curved horn-like crest on the posterodorsal
    corner.
  - Caudal centra amphicoelous to platycoelous through the anterior and middle
    series, with a gradual transition to procoelous articular facets in the
    posterior caudal vertebrae.
  - Anterior and middle chevrons with split (bifurcate) articular facets on
    their rami.
  - Distal tibia with a deeply concave, proximodistally oriented notch on its
    anterior surface.
  - Fibula with a well-developed anterior crest on the proximal diaphysis and a
    subtriangular distal epiphysis.
