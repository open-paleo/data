genus: Ceratosuchops
parent: Baryonychinae
dispute:
  summary: >
    Ceratosuchops inferodios is a baryonychine spinosaurid from the Wessex
    Formation of the Isle of Wight (Barker et al., 2021), recovered as a
    baryonychine by later analyses (Rauhut et al., 2025; Cau, 2025). Its own
    validity is not in doubt, but its relationship to the co-occurring
    Riparovenator milnerae is unsettled: Sereno et al. (2022) tentatively
    treated the two as a single taxon, Ceratosuchops, attributing their
    differences to individual variation, and Santos-Cubedo et al. (2023)
    followed that synonymy, whereas Barker et al. (2021) and Rauhut et al.
    (2025) kept them distinct and Cau (2025) left the question open. Because
    Ceratosuchops is the senior name, it is retained as valid regardless.
  history:
    - date: "2026-07-01"
      note: Placed at Baryonychinae following Barker et al. (2021) and Rauhut et al. (2025) (P2/P4; the tribe Ceratosuchopsini is not retained); the proposed synonymy with Riparovenator is unresolved.
    - date: "2026-07-21"
      note: Dispute resourced to the primary literature and Jones (2026) dropped
        from it — the Ceratosuchops–Riparovenator single-taxon proposal rests on
        individual (not ontogenetic) variation; Ceratosuchops kept valid as the
        senior name.
pronunciation:
  phonetic: serr-AT-oh-SOO-kops
etymology: From Greek keras/keratos ('horn') + Latin suchus ('crocodile', from Greek) + ops ('face'), meaning 'horned crocodile face', in reference to the bony boss on the postorbital bone.
description: Ceratosuchops is a genus of spinosaurid from the Early Cretaceous
  (Barremian) Wessex Formation of Britain. The type species is C. inferodios,
  known from skull fragments (a snout tip and a partial braincase) recovered
  between 2013-2017 from Chilton Chine on the Isle of Wight, and housed at the
  Dinosaur Isle Museum in Sandown. It was named in 2021 by a team consisting of
  Chris Tijani Barker, Darren Naish, David W. E. Hone, and colleagues, alongside
  Riparovenator milnerae.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Premaxillae displaying a pair of bilaterally located antenarial tuberosities
  - Narrow and ventrally restricted subcondylar recess of the basioccipital
  - Oval scars of the basisphenoid excavated by deep, elongate sulci
  - Anteroposteriorly thick interbasipterygoidal web
  - Supraoccipital dorsal process possessing a gently curving posteroventral
    surface in coronal section
appearance:
  features:
    - elongate snout
  integument: scaled
  evidence: inferred
