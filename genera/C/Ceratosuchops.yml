references:
  - id: barker2021a
    notes: Erected Ceratosuchops inferodios, with Riparovenator, as a distinct
      baryonychine spinosaurid.
  - id: sereno2022a
    notes: Tentatively scored the Wessex baryonychine material as a single taxon,
      Ceratosuchops, attributing the differences to individual variation.
  - id: santos-cubedo2023a
    notes: Followed the synonymy of Sereno et al. (2022), counting Ceratosuchops
      but not Riparovenator among valid baryonychines.
  - id: rauhut2025a
    notes: Recovered Ceratosuchops as a baryonychine spinosaurid, keeping it
      distinct from Riparovenator.
  - id: cau2025a
    notes: Left the Ceratosuchops–Riparovenator synonymy open, deferring to a
      future detailed comparison.
  - id: jones2026c
    notes: Source of the body length, mass, and hip height estimates, and the
      appearance features.
