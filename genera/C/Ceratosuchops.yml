genus: Ceratosuchops
parent: Ceratosuchopsini
etymology: horned crocodile face
description: Ceratosuchops is a genus of spinosaurid from the Early Cretaceous
  (Barremian) Wessex Formation of Britain. The type species is C. inferodios,
  known from skull fragments (a snout tip and a partial braincase) recovered
  between 2013–2017 from Chilton Chine on the Isle of Wight, and housed at the
  Dinosaur Isle Museum in Sandown. It was named in 2021 by a team consisting of
  Chris Tijani Barker, Darren Naish, David W. E. Hone, and colleagues, alongside
  Riparovenator milnerae.
