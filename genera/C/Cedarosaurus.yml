genus: Cedarosaurus
parent: Brachiosauridae
pronunciation:
  phonetic: SEE-duh-ro-SAWR-us
etymology: From Cedar (referring to the Cedar Mountain Formation where it was
  discovered) + Greek sauros ('lizard'), meaning 'Cedar lizard'.
description: Cedarosaurus is a genus of nasal-crested macronarian sauropod
  dinosaur from the Early Cretaceous Period (Valanginian). The fossils were
  discovered in 1996 in eastern Utah within the rocks of the Yellow Cat Member
  of the Cedar Mountain Formation. It was officially named and described by
  Tidwell, Carpenter and Brooks in 1999. It shows similarities to the
  brachiosaurid Eucamerotus from the Wessex Formation of southern England, as
  well as to Brachiosaurus from the Morrison Formation.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Anterior caudal vertebrae possess deeply concave anterior faces, lacking the
    posterior ball of titanosaurs; posterior faces of anterior caudal vertebrae
    are flat to concave.
  - Anterior caudal vertebrae lack well-developed hyposphenes (only caudal 8
    shows a small hyposphene).
  - Mid-caudal vertebrae bear a sharp ridge extending axially along the sides of
    the neural arch.
  - Deltopectoral crest of humerus placed closer to midshaft than in
    Brachiosaurus, Pleurocoelus nanus, or SMU 61732; humerus proportionally more
    robust than Brachiosaurus.
  - Radius slender with two ridges beginning at midshaft; distal end
    subrectangular and flat rather than oval as in Pleurocoelus.
  - Ulna with prominent posterior condyle separated from the lateral wall by a
    distinct groove, contrasting with Pleurocoelus nanus and SMU 61732.
