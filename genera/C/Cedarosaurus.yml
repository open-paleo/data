genus: Cedarosaurus
parent: Brachiosauridae
etymology: From Cedar (referring to the Cedar Mountain Formation where it was discovered) + Greek sauros ('lizard'), meaning 'Cedar lizard'.
description: Cedarosaurus is a genus of nasal-crested macronarian sauropod
  dinosaur from the Early Cretaceous Period (Valanginian). The fossils were
  discovered in 1996 in eastern Utah within the rocks of the Yellow Cat Member
  of the Cedar Mountain Formation. It was officially named and described by
  Tidwell, Carpenter and Brooks in 1999. It shows similarities to the
  brachiosaurid Eucamerotus from the Wessex Formation of southern England, as
  well as to Brachiosaurus from the Morrison Formation.
diet: herbivore
locomotion: quadrupedal
