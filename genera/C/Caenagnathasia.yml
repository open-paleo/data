genus: Caenagnathasia
parent: Caenagnathidae
pronunciation:
  phonetic: see-NAG-na-THAY-zhee-a
etymology: "Combination of Caenagnathidae (the family to which it belongs, from Greek kainos meaning 'recent' and gnathos meaning 'jaw') with Asia (the continent of its origin). Full meaning: 'recent jaw from Asia'."
description: Caenagnathasia is a genus of small caenagnathid oviraptorosaurian
  theropod from the Late Cretaceous of Uzbekistan.
diet: omnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Depression on posteroventral margin of symphysis is not hourglass shaped
    (unlike some Caenagnathus specimens)
  - No circular pit or notch in dentary for reception of anterior tip of
    prearticular
  - Fluting on lingual margin of occlusal edge less distinct, with no toothlike
    apical projections on ridges
  - First anterior occlusal groove relatively larger; first pair of lateral
    occlusal ridges do not meet ventrally to separate it from symphysial shelf
    concavity
  - No second anterior occlusal groove and no tubercles on midline or at base of
    first lateral occlusal ridge
  - Lateral groove narrower and deeper; no foramina in floor of midline
    depression of symphysial shelf
