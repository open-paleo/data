  - id: jones2026c
    notes: Source of the mass and hip height estimates, and the appearance
      features. Treats Corythoraptor as a valid oviraptorid.
  - id: cau2024a
    notes: Coded Corythoraptor with the immature Banji holotype as one unit,
      regarding Corythoraptor as a junior synonym of Banji.
  - id: funston2020a
