genus: Corythoraptor
parent: Citipatinae
etymology: From Greek korythos, 'helmet', + Latin raptor, 'thief'; means 'helmeted thief', referring to its tall cassowary-like head crest
pronunciation:
  phonetic: koh-RITH-o-RAP-tuhr
description: Corythoraptor is a genus of oviraptorid dinosaur from the late
  Maastrichtian Nanxiong Formation of South China. It contains one species, C.
  jacobsi, known from a single well-preserved skeleton, and named after
  paleontologist Louis L. Jacobs. It bears a tall crest similar to that of the
  modern cassowary, and possibly had a similar functionality of display and
  resonance to detect lower-frequency sounds.
diet: omnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Distinct cassowary-like helmet on the skull, highly pneumatic and very thin,
    with highest point of the crest projecting above the orbit.
  - No pleurocoels on the centra of the second through fourth cervical vertebrae
    (pleurocoels present from fifth through twelfth cervical vertebrae).
  - Neck length twice as long as the dorsal vertebral column, and slightly
    longer than the entire forelimb including the manus.
  - "Supranarial process of the premaxilla bears two processes: a short
    posterodorsally extending process and a long process forming most of the
    anterodorsal process of the premaxilla."
  - Infratemporal fenestra dorsoventrally elongate and narrow anteroposteriorly;
    narial opening much longer than wide, long axis parallel to dorsal margin of
    antorbital fenestra.
  - Lesser trochanter (cranial trochanter) completely fused with the greater
    trochanter; distal ends of shafts of metatarsal II straight and metatarsal
    IV laterally deflected.
appearance:
  features:
    - hollow cranial crest
  integument: feathered
  evidence: inferred
