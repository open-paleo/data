synonyms:
  - name: Rioarribasaurus colberti
    type: junior objective
    reason: Hunt and Lucas (1991) erected Rioarribasaurus colberti for the
      Whitaker Quarry skeleton AMNH 7224. ICZN Opinion 1842 (1996)
      simultaneously designated AMNH 7224 as the neotype of Coelophysis
      bauri (under plenary powers, setting aside Cope's diagnostically
      inadequate syntypes), making Rioarribasaurus a junior objective
      synonym of Coelophysis and colberti a junior objective synonym of
      bauri. Both were placed on the Official Index of Rejected and
      Invalid Names.
  - name: Longosaurus longicollis
    type: junior subjective
    reason: Welles (1984) erected Longosaurus as a replacement genus
      for "Coelurus" longicollis Cope, 1887 (a Ghost Ranch coelophysoid).
      Subsequent work treats the material as referable to Coelophysis,
      making Longosaurus a junior synonym.
