genus: Coelophysis
parent: Coelophysidae
etymology: From Greek 'koilos' (hollow) and 'physis' (form, nature), referring
  to the hollow vertebrae.
pronunciation:
  ipa: /ˌsiːloʊˈfaɪsɪs/
  phonetic: SEE-low-FY-sis
description: Coelophysis is the type genus of Coelophysidae and one of the
  best-known Triassic dinosaurs. The type and only valid species, Coelophysis
  bauri, was erected by Edward Drinker Cope in 1889 on fragmentary syntypes
  collected by David Baldwin from Arroyo Seco, Rio Arriba County, New
  Mexico. Cope's original syntypes were diagnostically inadequate, and the
  taxon's modern hypodigm overwhelmingly comes from the Whitaker Quarry at
  Ghost Ranch — a Late Triassic mass-mortality bonebed first opened in 1947
  that has yielded hundreds of articulated skeletons across a complete
  ontogenetic series. Following decades of dispute about whether the Ghost
  Ranch material truly belonged to Cope's nominal taxon, the ICZN issued
  Opinion 1842 in 1996, designating the articulated Whitaker Quarry skeleton
  AMNH 7224 as the neotype of C. bauri and rejecting the rival genus
  Rioarribasaurus colberti (Hunt and Lucas, 1991) as a junior objective
  synonym. Rinehart et al. (2009) reanalysed the entire hypodigm and showed
  that Coelophysis was sexually dimorphic (gracile and robust morphs
  distinguished by skull/neck length and sacrum fusion), preserved the
  oldest known furcula in any non-avian dinosaur, had hawk-like vision
  (sclerotic-ring geometry), and engaged in genuine cannibalism (juvenile
  bones in adult coprolites and regurgitalites — separate from Colbert's
  earlier in-ribcage 'cannibalism' claim, which Nesbitt et al. 2006 showed
  was actually a small crurotarsan).
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Skull long and narrow with an elongate preorbital region bearing a
    prominent preorbital groove anterior to the orbit, promoting binocular
    overlap of the visual fields.
  - Ten cervical vertebrae with elongate, rod-like cervical ribs that overlap
    up to five consecutive vertebrae posteriorly.
  - Thirteen dorsal vertebrae; cervical centra amphicoelous with elliptical
    pleurocoels on the lateral surfaces; pleurocoels absent in dorsals.
  - Sacrum of five vertebrae; variable fusion of s4-s5 centra constitutes a
    sexually dimorphic character (gracile-morph specimens unfused; robust-
    morph fused).
  - Pubis bears two foramina — an elliptical obturator foramen and a larger
    accessory 'ceratosaur foramen' medial to it.
  - V-shaped furcula present, with epicleidial facets near the distal rami
    tips — the oldest known furcula in any non-avian dinosaur.
  - Femur midshaft diameter shows an allometric growth constant of ~1.5
    indicating cursorial adaptation; tibiotarsus longer than femur.
