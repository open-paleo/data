genus: Chakisaurus
parent: Elasmaria
etymology: From Mapudungun chaki ('elder guanaco') + Greek sauros ('lizard'), meaning 'elder guanaco lizard'.
description: Chakisaurus is an extinct genus of elasmarian ornithopod dinosaur
  from the Late Cretaceous Huincul Formation of Argentina. The genus contains a
  single species, C. nekul, known from multiple partial skeletons belonging to
  individuals of different ages. Chakisaurus represents the first ornithischian
  species to be named from the Huincul Formation.
diet: herbivore
locomotion: bipedal
