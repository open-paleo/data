genus: Chakisaurus
parent: Elasmaria
etymology: From Mapudungun chaki ('elder guanaco') + Greek sauros ('lizard'), meaning 'elder guanaco lizard'.
pronunciation:
  phonetic: SHAH-kee-SOR-us
description: Chakisaurus is an extinct genus of elasmarian ornithopod dinosaur
  from the Late Cretaceous Huincul Formation of Argentina. The genus contains a
  single species, C. nekul, known from multiple partial skeletons belonging to
  individuals of different ages. Chakisaurus represents the first ornithischian
  species to be named from the Huincul Formation.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
appearance:
  integument: scaled
  evidence: inferred
diagnostic_features:
  - Anterior proximal caudal vertebrae with parallelogram-shaped centra in
    lateral view
  - Anterior caudals of the distal tail with rod-like, posterodorsally oriented
    transverse processes
  - Proximal end of the fibula with a deep, proximodistally extended fossa
    (possible autapomorphy, unknown in other elasmarians)
  - Transversely compressed calcaneus, its transverse width about one-third of
    its anteroposterior length (proportionally narrower than in other
    elasmarians)
  - Nearly flat tibial articular surface of the calcaneus
  - Posterior dorsal vertebrae with a hyposphene articulation bearing a deeply
    excavated lateral surface
