genus: Ceratops
parent: Ceratopsidae
etymology: From Greek keras (horn) and ops (face); meaning
  "horn face".
pronunciation:
  phonetic: SEH-ruh-tops
description: >
  Ceratops is a dubious genus of herbivorous ceratopsian dinosaur
  which lived during the Late Cretaceous. Its fossils have been
  found in the Judith River Formation in Montana. Although
  poorly known, Ceratops is important in the history of
  dinosaurs, since it is the type genus for which both the
  Ceratopsia and the Ceratopsidae have been named.
diet: herbivore
locomotion: quadrupedal
diagnostic_features:
  - Pair of large horn-cores on upper part of skull, firmly coössified with the
    occipital crest
  - Horn-cores sub-triangular at base, becoming nearly round in section in upper
    half
  - Horn-cores slightly hollowed at base but otherwise solid, with exterior
    texture indicating cover by true horns
  - Basioccipital much elongated, forming the entire occipital condyle
  - Large paired dermal plates showing indications of scute covering, as in
    turtles
paleoenvironment:
  - fluvial
  - coastal
appearance:
  integument: armored
  evidence: direct
identifiers:
  - source: pbdb
    id: "52823"
  - source: wikidata
    id: Q134704
  - source: gbif
    id: "4823135"
  - source: eol
    id: "4531607"
synonyms:
  - name: Proceratops montanus
    type: junior subjective
    reason: Replacement name proposed by Lull (1906) on the
      mistaken belief that Ceratops Marsh, 1888 was preoccupied
      by Ceratops Rafinesque, 1815; the Rafinesque name was a
      nomen nudum, leaving Ceratops Marsh available, so
      Proceratops is treated as a junior synonym.
species:
  - name: Ceratops montanus
    etymology: From Latin montanus ("of Montana"), referring to
      the type-locality state.
    status: nomen dubium
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Campanian
      from_ma: 83.6
      to_ma: 72.1
    location:
      country: US
      region: Montana
      formation: Judith River
      locality: Near Cow Creek, Blaine County (uppermost Judith
        River Formation; "Laramie deposits" in Marsh's
        nineteenth-century usage)
      coordinates:
        - 48.5
        - -109.0
    holotype:
      specimen_id:
        - USNM 2411
      specimen_type: holotype
      institution: NMNH
      material: A pair of supraorbital horn-cores (~22 cm long) and an elongated
        basioccipital forming the occipital condyle.
      completeness: fragmentary
    erected_in: marsh1888b
references:
  - id: marsh1888b
    authors: Marsh, O.C.
    year: 1888
    title: "A new family of horned Dinosauria, from the
      Cretaceous"
    journal: American Journal of Science
    volume: s3-36
    issue: "216"
    pages: 477-478
    doi: 10.2475/ajs.s3-36.216.477
    notes: Erects Ceratops montanus on a horn-pair plus
      basioccipital from the Judith River Formation of Montana,
      and erects the family Ceratopsidae in the same paper.
