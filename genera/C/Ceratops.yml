genus: Ceratops
parent: Ceratopsidae
placement: incertae sedis
etymology: From Greek keras (horn) and ops (face); meaning
  "horn face".
pronunciation:
  phonetic: SEH-ruh-tops
description: >
  Ceratops is a dubious genus of herbivorous ceratopsian dinosaur
  which lived during the Late Cretaceous. Its fossils have been
  found in the Judith River Formation in Montana. Although
  poorly known, Ceratops is important in the history of
  dinosaurs, since it is the type genus for which both the
  Ceratopsia and the Ceratopsidae have been named.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - coastal
appearance:
  integument: armored
  evidence: direct
identifiers:
  - source: pbdb
    id: "52823"
  - source: wikidata
    id: Q134704
  - source: gbif
    id: "4823135"
  - source: eol
    id: "4531607"
species:
  - name: Ceratops montanus
    etymology: From Latin montanus ("of Montana"), referring to
      the type-locality state.
    status: nomen dubium
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Campanian
    location:
      country: US
      locality: Cow Creek
      region: US-MT
      formation: Judith River
      part: upper
    type_specimen:
      specimen_id:
        - USNM 2411
      specimen_type: holotype
      institution: USNM
      material: A pair of supraorbital horn-cores (~22 cm long) and an elongated
        basioccipital forming the occipital condyle.
      completeness: fragmentary
    synonyms:
      - name: Proceratops montanus
        type: junior objective
        reason: Replacement name proposed by Lull (1906) on the
          mistaken belief that Ceratops Marsh, 1888 was preoccupied
          by Ceratops Rafinesque, 1815; the Rafinesque name was a
          nomen nudum, leaving Ceratops Marsh available. As an
          unnecessary replacement name it carries the same type, so
          it is an objective synonym.
    erected_in: marsh1888b
references:
  - id: marsh1888b
    notes: Erects Ceratops montanus on a horn-pair plus basioccipital from the
      Judith River Formation of Montana, and erects the family Ceratopsidae in
      the same paper.
  - id: lull1906a
  - id: ryan2007a
    notes: Finds isolated horncores of limited use for diagnosing
      chasmosaurine taxa.
  - id: mallon2016a
    notes: Notes the long-standing nomen dubium status and raises the
      possibility that the horncores belong to Spiclypeus.
  - id: longrich2013b
    notes: Reads the Ceratops horncores as most likely those of a primitive
      centrosaurine.
  - id: madzia2021a
    notes: Uses Ceratops montanus as a specifier of Ceratopsia and finds it
      not diagnostic beyond Ceratopsidae.
