genus: Craterosaurus
parent: Stegosauria
placement: incertae sedis
etymology: From Greek krater, 'bowl' or 'mixing vessel', + Greek sauros, 'lizard/reptile'; means 'bowl reptile' or 'krater reptile'
pronunciation:
  phonetic: KRAY-tuh-ro-SOR-us
description: Craterosaurus is a dubious genus of stegosaurian dinosaur that
  lived during the Early Cretaceous of England, known from a fossil reworked
  into the Woburn Sands Formation. Estimated to measure around 4 m (13 ft) in
  length and weighing approximately 560 kg (1,230 lb), Craterosaurus may
  actually be a junior synonym of Regnosaurus, but only one fossil, a partial
  vertebra, was recovered.
dispute:
  summary: >
    Craterosaurus is a nomen dubium based on a single partial vertebra whose
    features are now known to be widespread in Stegosauria (Maidment and colleagues,
    2008). It is retained at Stegosauria incertae sedis.
  history:
    - date: "2026-06-26"
      note: Placed at Stegosauria incertae sedis, nomen dubium based on an undiagnostic vertebra.
    - date: "2026-10-08"
      note: Type species set to nomen dubium, following Maidment and colleagues (2008).
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
appearance:
  integument: armored
  evidence: inferred
identifiers:
  - source: pbdb
    id: "38807"
  - source: wikidata
    id: Q136991
  - source: gbif
    id: "4823114"
species:
  - name: Craterosaurus pottonensis
    etymology: "Named for Potton, the locality in Bedfordshire, England, near which the fossil was discovered."
    status: nomen dubium
    type_species: true
    period:
      name:
        - Early Cretaceous
      stage:
        - Berriasian
        - Valanginian
        - Hauterivian
        - Barremian
        - Aptian
      resolution: reworked
    location:
      country: GB
      region: GB-CBF
      locality: Old coprolite workings near Potton
      formation: Woburn Sands
      bed: Potton Nodule Bed
      notes: >
        The specimen is reworked into the Potton Nodule Bed, which was
        deposited in the late Aptian to early Albian (Galton, 2009). Its
        source beds are not established. Galton (1985) gives them as
        "probably" Neocomian, the Berriasian to Hauterivian (Gale and
        colleagues, 2020), citing Casey (1961), but Casey lists derived
        Lower Aptian ammonites alongside Neocomian sandstone in the bed and
        holds that worn bones there prove no older source, as "Iguanodon was
        still living in Aptian times". The age therefore spans every stage
        from the Berriasian to the Aptian.
    size:
      length_m:
        min: 4.0
        max: 4.0
      weight_kg:
        min: 560
        max: 560
    erected_in: seeley1874a
    type_specimen:
      specimen_id: [SMC B.28814]
      specimen_type: holotype
      institution: CAMSM
      material: Incomplete neural arch of a dorsal vertebra.
      completeness: fragmentary
references:
  - id: seeley1874a
  - id: maidment2008a
    notes: Stegosauria systematics work showed Craterosaurus features are widespread, supporting nomen dubium status.
  - id: galton1985d
    notes: Gives the horizon as the Potton Nodule Bed, "probably reworked from
      beds of Neocomian age", and diagnoses the genus by "a very deep
      depression in the top of the arch posterior to the prezygapophyses".
  - id: galton2009a
    notes: Dates the Potton Nodule Bed as "reworked into late Aptian-early Albian".
  - id: casey1961a
    notes: Lists Neocomian sandstone and Lower Aptian ammonites among the derived
      material of the Potton nodules, and rejects worn bones as proof of an
      older source.
  - id: gale2020a
    notes: Resolves the Neocomian into the Berriasian, Valanginian and Hauterivian.
