genus: Craterosaurus
parent: Stegosauria
placement: incertae sedis
etymology: From Greek krater, 'bowl' or 'mixing vessel', + Greek sauros, 'lizard/reptile'; means 'bowl reptile' or 'krater reptile'
pronunciation:
  phonetic: KRAY-tuh-ro-SOR-us
description: Craterosaurus is a dubious genus of stegosaurian dinosaur that
  lived during the Early Cretaceous of England, known from a fossil reworked
  into the Woburn Sands Formation. Estimated to measure around 4 m (13 ft) in
  length and weighing approximately 560 kg (1,230 lb), Craterosaurus may
  actually be a junior synonym of Regnosaurus, but only one fossil, a partial
  vertebra, was recovered.
dispute:
  summary: >
    Craterosaurus is a nomen dubium based on a single partial vertebra whose
    features are now known to be widespread in Stegosauria (Maidment and colleagues,
    2008). It is retained at Stegosauria incertae sedis.
  history:
    - date: "2026-06-26"
      note: Placed at Stegosauria incertae sedis, nomen dubium based on an undiagnostic vertebra.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Basioccipital condyle compressed laterally, V-shaped, tapering below,
    approximately 1⅛ inch wide and deep, projecting 2 inches backward from the
    posterior vertical surface of the bone.
  - Posterior vertical surface of basioccipital divided for two-thirds of its
    depth by a strong, sharp, elevated median ridge prolonged downward from the
    middle of the back of the condyloid process.
  - Basisphenoid bears a large ovate cerebral cup (2¼ inches long, >1 inch wide)
    interpreted as the base and anterior portion of the braincase, with
    Rhynchocephalian rather than avian character.
  - Two large, slightly diverging hypapophyses at the inferior end of the
    basisphenoid, separated by a deep anterior notch, presumed to articulate
    with the posterior angles of the pterygoid bones.
  - Lateral surfaces of the basisphenoid each perforated by an oval foramen (~1¼
    inch long, ½ inch wide) near the upper posterior angle, with a slight bony
    elevation below.
appearance:
  integument: armored
  evidence: inferred
identifiers:
  - source: pbdb
    id: "38807"
  - source: wikidata
    id: Q136991
  - source: gbif
    id: "4823114"
species:
  - name: Craterosaurus pottonensis
    etymology: "Named for Potton, the locality in Bedfordshire, England, near which the fossil was discovered."
    status: valid
    type_species: true
    period:
      name:
        - Early Cretaceous
      stage:
        - Berriasian
        - Valanginian
        - Hauterivian
      resolution: reworked
    location:
      country: GB
      region: GB-CBF
      locality: Old coprolite workings near Potton
      formation: Woburn Sands
      bed: Potton Nodule Bed
      notes: >
        The specimen is reworked. Galton (1985) gives it from the Potton
        Nodule Bed "in upper part of Woburn Sands (Lower Cretaceous,
        probably reworked from beds of Neocomian age; Casey, 1961)", so
        it carries the age of its source beds, the Neocomian, an
        interval that Gale and colleagues (2020) describe as "subdivided
        into three stages—the Berriasian, Valanginian and Hauterivian".
        The nodule bed itself was deposited in the late Aptian to early
        Albian, as Galton (2009) gives it.
    size:
      length_m:
        min: 4.0
        max: 4.0
      weight_kg:
        min: 560
        max: 560
    erected_in: seeley1874a
    type_specimen:
      specimen_id: [SMC B.28814]
      specimen_type: holotype
      institution: CAMSM
      material: Incomplete neural arch of a dorsal vertebra.
      completeness: fragmentary
references:
  - id: seeley1874a
  - id: maidment2008a
    notes: Stegosauria systematics work showed Craterosaurus features are widespread, supporting nomen dubium status.
  - id: galton1985d
    notes: Gives the horizon as the Potton Nodule Bed, "probably reworked from beds of Neocomian age".
  - id: galton2009a
    notes: Dates the Potton Nodule Bed as "reworked into late Aptian-early Albian".
  - id: gale2020a
    notes: Resolves the Neocomian into the Berriasian, Valanginian and Hauterivian.
