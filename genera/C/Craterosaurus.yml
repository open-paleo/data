genus: Craterosaurus
parent: Stegosauria
placement: incertae sedis
etymology: From Greek krater, 'bowl' or 'mixing vessel', + Greek sauros, 'lizard/reptile'; means 'bowl reptile' or 'krater reptile'
pronunciation:
  phonetic: KRAY-tuh-ro-SOR-us
description: Craterosaurus is a dubious genus of stegosaurian dinosaur that
  lived during the Early Cretaceous (possibly Aptian stage) of the Woburn Sands
  Formation of England. Estimated to measure around 4 m (13 ft) in length and
  weighing approximately 560 kg (1,230 lb), Craterosaurus may actually be a
  junior synonym of Regnosaurus, but only one fossil, a partial vertebra, was
  recovered.
dispute:
  summary: >
    Craterosaurus is a nomen dubium based on a single partial vertebra whose
    features are now known to be widespread in Stegosauria (Maidment et al.,
    2008). It is retained at Stegosauria incertae sedis.
  history:
    - date: "2026-06-26"
      note: Placed at Stegosauria incertae sedis, nomen dubium based on an undiagnostic vertebra.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Basioccipital condyle compressed laterally, V-shaped, tapering below,
    approximately 1⅛ inch wide and deep, projecting 2 inches backward from the
    posterior vertical surface of the bone.
  - Posterior vertical surface of basioccipital divided for two-thirds of its
    depth by a strong, sharp, elevated median ridge prolonged downward from the
    middle of the back of the condyloid process.
  - Basisphenoid bears a large ovate cerebral cup (2¼ inches long, >1 inch wide)
    interpreted as the base and anterior portion of the braincase, with
    Rhynchocephalian rather than avian character.
  - Two large, slightly diverging hypapophyses at the inferior end of the
    basisphenoid, separated by a deep anterior notch, presumed to articulate
    with the posterior angles of the pterygoid bones.
  - Lateral surfaces of the basisphenoid each perforated by an oval foramen (~1¼
    inch long, ½ inch wide) near the upper posterior angle, with a slight bony
    elevation below.
