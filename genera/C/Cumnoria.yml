references:
  - id: seeley1888a
    notes: Erects the genus Cumnoria for Iguanodon prestwichii Hulke.
  - id: lydekker1889b
    notes: Reassigns the species to Camptosaurus (Camptosaurus prestwichii).
  - id: galton1980c
    notes: First modern description of the material, as Camptosaurus
      prestwichii.
  - id: norman1998a
    notes: Revives the genus Cumnoria.
  - id: naish2008a
    notes: Revives the genus Cumnoria.
  - id: jones2026a
    notes: Source of the mass and hip height estimates.
  - id: madzia2021a
    notes: Lists Cumnoria prestwichii in the composition of both Camptosauridae
      and Styracosterna, under different reference phylogenies.
  - id: mcdonald2011a
    notes: Removes the species from Camptosaurus and recovers it among the most
      basal members of Styracosterna.
  - id: fonseca2024a
    notes: Recovers Cumnoria within Camptosauridae, and reviews the analyses
      placing it near or outside the root of Ankylopollexia.
  - id: dieudonné2026a
    notes: Recovers Cumnoria and Oblitosaurus as sister taxa among the
      early-diverging ankylopollexians.
  - id: poole2022a
    notes: Pruned Cumnoria from the strict consensus as an unstable taxon.
  - id: maidment2023a
    notes: Redescribes the holotype, diagnoses Cumnoria on two autapomorphies
      of the pectoral girdle, and places it as a non-ankylopollexian
      iguanodontian just outside Ankylopollexia.
  - id: carpenter2015a
    notes: Regards Cumnoria as a junior subjective synonym of Camptosaurus and
      returns the species to that genus as Camptosaurus prestwichii.
  - id: sánchez-fenollosa2023a
    notes: Recovers a monophyletic Camptosauridae and follows the referral of
      Cumnoria to Camptosaurus.
  - id: rotatori2026a
    notes: Reviews both treatments of the genus and retains Cumnoria as
      distinct.
