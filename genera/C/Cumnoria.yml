genus: Cumnoria
parent: Styracosterna
etymology: Named for Cumnor, a village in Oxfordshire, England, near where the
  fossils were found.
pronunciation:
  phonetic: kum-NOH-ree-uh
description: Cumnoria is a genus of basal iguanodontian dinosaur that lived
  during the Late Jurassic period (Kimmeridgian age) in what is now Oxfordshire,
  United Kingdom.
dispute:
  summary: >
    Cumnoria prestwichii is usually recovered as a basal styracosternan
    (Madzia and others, 2021) but has also been placed as a
    non-ankylopollexian iguanodontian just outside Ankylopollexia
    (Maidment, 2023; Jones, 2026).
  history:
    - date: "2026-06-27"
      note: Placed at Styracosterna following the reference phylogeny
        (Madzia and others, 2021); the more basal position reflected,
        not adopted.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - marine
diagnostic_features:
  - Teeth with different type of parallel ridging and coarser serration than
    Iguanodon
  - Vertebrae relatively wider with neural arch and centrum both more depressed
  - Laminae of the neural arch very stout and neural canal very small
  - Sacral vertebrae not anchylosed, only four in number, and convex on the
    ventral surface
  - Early caudal vertebrae reduced in length with small neural arch
  - Astragalus and calcaneum separate
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "52998"
  - source: wikidata
    id: Q899557
  - source: gbif
    id: "4823545"
