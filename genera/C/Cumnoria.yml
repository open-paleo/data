genus: Cumnoria
parent: Dryomorpha
placement: incertae sedis
etymology: Named for Cumnor, a village in Oxfordshire, England, near where the
  fossils were found.
pronunciation:
  phonetic: kum-NOH-ree-uh
description: Cumnoria is a genus of basal iguanodontian dinosaur that lived
  during the Late Jurassic period (Kimmeridgian age) in what is now Oxfordshire,
  United Kingdom.
dispute:
  summary: >
    The position of Cumnoria prestwichii is unresolved across three
    incompatible hypotheses. It has been recovered as a basal styracosternan
    (McDonald, 2011), within a camptosaurid grouping alongside Camptosaurus
    dispar (Sánchez-Fenollosa and others, 2023; Fonseca and others, 2024;
    Dieudonné and others, 2026), and outside Ankylopollexia altogether
    (Maidment and others, 2023; Rotatori and others, 2026; Jones, 2026).
    Because Camptosauridae and Styracosterna are complementary stem clades
    defined on Camptosaurus dispar and Iguanodon bernissartensis, the second
    and third hypotheses both exclude it from Styracosterna. Some analyses
    cannot place it at all and prune it as an unstable wildcard (Poole, 2022).
    It is placed at Dryomorpha incertae sedis, the least inclusive clade
    common to every hypothesis. Its separation from the North
    American Camptosaurus is also contested. Carpenter and Lamanna (2015)
    regarded Cumnoria as a junior subjective synonym of Camptosaurus, holding
    that its sole recognized autapomorphy, a small intramaxillary fossa,
    warranted distinction at the specific rather than the generic level, and
    Sánchez-Fenollosa and others (2023) followed them. The redescription by
    Maidment and others (2023) instead diagnosed Cumnoria on two
    autapomorphies of the pectoral girdle and recovered it outside
    Ankylopollexia, and subsequent work has continued to treat it as a
    distinct genus (Rotatori and others, 2026). It is retained as a valid
    genus.
  history:
    - date: "2026-06-27"
      note: Placed at Styracosterna following the reference phylogeny
        (Madzia and others, 2021); the more basal position reflected,
        not adopted.
    - date: "2026-08-07"
      note: Synonymy with Camptosaurus reviewed and not adopted; the
        proposal rests on a single character and no cladistic analysis,
        against a dedicated redescription that supplies two autapomorphies.
    - date: "2026-08-07"
      note: Moved from Styracosterna to Dryomorpha incertae sedis. Madzia and
        others (2021) list the species in the composition of both Camptosauridae
        and Styracosterna under different reference phylogenies, so it does not
        support the narrower placement on its own.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - marine
diagnostic_features:
  - Teeth with different type of parallel ridging and coarser serration than
    Iguanodon
  - Vertebrae relatively wider with neural arch and centrum both more depressed
  - Laminae of the neural arch very stout and neural canal very small
  - Sacral vertebrae not anchylosed, only four in number, and convex on the
    ventral surface
  - Early caudal vertebrae reduced in length with small neural arch
  - Astragalus and calcaneum separate
appearance:
  integument: scaled
  evidence: inferred
