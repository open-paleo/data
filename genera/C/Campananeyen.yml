genus: Campananeyen
parent: Rebbachisauridae
description: Campananeyen is a genus of rebbachisaurid sauropod dinosaur from
  the Late Cretaceous (Cenomanian) Candeleros Formation of Argentina. The genus
  contains a single species, Campananeyen fragilissimus, known from a
  fragmentary skeleton.
