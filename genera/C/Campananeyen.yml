genus: Campananeyen
parent: Rebbachisauridae
etymology: "From Las Campanas (the type locality) combined with Mapundungun 'n'eyen' meaning 'air', referring to the extreme pneumatic qualities of the holotype."
description: Campananeyen is a genus of rebbachisaurid sauropod dinosaur from
  the Late Cretaceous (Cenomanian) Candeleros Formation of Argentina. The genus
  contains a single species, Campananeyen fragilissimus, known from a
  fragmentary skeleton.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - arid
appearance:
  integument: scaled
  evidence: inferred
diagnostic_features:
  - Underdeveloped crista prootica (autapomorphy)
  - Foramen for cranial nerve VII opens anterior to the crista prootica
  - Paraoccipital process internally hollow (autapomorphy)
  - Extremely broad lateral expansion of the quadrate fossa (autapomorphy)
  - Medial hemicondyle of the quadrate at least twice the size of the lateral
    hemicondyle
  - Dorsal alar arm of the transverse processes of the ilium (autapomorphy)
