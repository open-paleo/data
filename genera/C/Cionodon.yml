genus: Cionodon
parent: Hadrosauridae
etymology: "From Greek kion meaning 'column/pillar' and Greek odon meaning
  'tooth'. Full meaning: 'column tooth', referring to the pillar-like shape of
  its teeth."
description: "Cionodon is a dubious genus of hadrosaurid dinosaur from the Late
  Cretaceous. The type species, C. arctatus, was found in the Denver Formation
  of Lodge Pole Creek, Colorado and was formally described by Edward Drinker
  Cope in 1874 based on the holotype AMNH 3951, collected in 1873. It is a nomen
  dubium because it is based on very fragmentary remains. Two other species have
  since been described: Cionodon kysylkumensis (Riabinin, 1931), based on the
  holotype CCMGE 1/3760 (a set of vertebrae) from Uzbekistan, and Cionodon
  stenopsis (Cope, 1875), discovered in rocks from the Judith River Formation of
  Alberta, Canada in 1874. Although both are probably hadrosaurs, they are known
  only from fragmentary remains and Cionodon kysylkumensis has since been
  reclassified as Bactrosaurus kysylkumensis."
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Successional tooth crowns develop on the outer/posterior face of the shank
    (not the front, as in Hadrosaurus), so up to three teeth occupy each
    transverse row at once
  - Tooth with a keeled enamel plate over the flattened inner face and a dense
    outer layer roughened by numerous short, serrate longitudinal ridges
  - Femora, tibiae, and other long bones filled with solid cancellous bone,
    lacking a medullary cavity (unlike Hadrosaurus, Hypsibema, and other genera)
  - Distal femoral condyles forming a single trochlear surface, lacking the deep
    posterior fossae seen in Hadrosaurus
