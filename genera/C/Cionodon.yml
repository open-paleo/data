genus: Cionodon
parent: Hadrosauridae
placement: incertae sedis
pronunciation:
  phonetic: sy-ON-oh-don
etymology: "From Greek kion meaning 'column/pillar' and Greek odon meaning
  'tooth'. Full meaning: 'column tooth', referring to the pillar-like shape of
  its teeth."
description: "Cionodon is a dubious genus of hadrosaurid dinosaur from the Late
  Cretaceous. The type species, C. arctatus, was found in the Denver Formation
  of Lodge Pole Creek, Colorado and was formally described by Edward Drinker
  Cope in 1874 based on the holotype AMNH 3951, collected in 1873. It is a nomen
  dubium because it is based on very fragmentary remains. A second species,
  Cionodon kysylkumensis (Riabinin, 1931), based on the holotype CCMGE 1/3760
  (a set of vertebrae) from Uzbekistan, is known only from fragmentary remains
  and has since been reclassified as Bactrosaurus kysylkumensis."
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
  - coastal
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "53035"
  - source: wikidata
    id: Q2973290
  - source: gbif
    id: "4823289"
species:
  - name: Cionodon arctatus
    etymology: "From Latin 'arctatus' meaning 'compressed', likely referring to the
      compressed form of the teeth."
    status: nomen dubium
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Maastrichtian
    location:
      country: US
      region: US-CO
      notes: Cope names no locality and no horizon beyond "the Laramie", and
        says only that the material came from two Colorado localities not many
        miles apart. Carpenter and Young (2002) file it under the
        Laramie Formation but state that it may equally have come from the
        Denver Formation exposed along another drainage. The "Lodge Pole Creek"
        locality repeated in later compilations is an error introduced by Lull
        and Wright (1942), who took it from the opening section of Cope's paper,
        which describes Pliocene beds, and attached it to Cope's Cretaceous
        footnote.
    type_specimen:
      specimen_id: [ AMNH 3951 ]
      specimen_type: holotype
      institution: AMNH
      material: Portion of the right maxilla, two dorsal vertebrae, the distal end
        of metatarsal III, and the proximal and distal ends of an ulna
      completeness: fragmentary
    erected_in: cope1874a
references:
  - id: carpenter2002a
    notes: Reviews the Denver Basin fauna, files the holotype under the Laramie
      Formation while leaving the Denver Formation open, and rejects the Lodge
      Pole Creek locality on stratigraphic grounds.
  - id: cope1874a
    notes: Names the species in a footnote, on a collection made by an assistant
      from strata in Colorado the author correlates with the Great Lignite,
      without a locality.
  - id: cope1875a
    notes: Fuller redescription; corrects the original spelling Cinodon (a
      proofreader's error) to Cionodon. Places the material at one of two
      localities in Colorado "not many miles apart", neither named.
  - id: riabinin1931b
    notes: Named Cionodon kysylkumensis on Uzbek vertebrae.
  - id: lull1942a
  - id: brett-surman1989a
    notes: Finds that none of the type elements permits a diagnosis at any
      level, and calls Cionodon a nomen dubium.
