genus: Compsosuchus
parent: Abelisauroidea
placement: incertae sedis
dispute:
  summary: >
    Compsosuchus is based on fragmentary axial material and is generally
    treated as a nomen dubium (Novas and colleagues, 2004). It has been
    interpreted as an allosauroid, an abelisaurid, and a noasaurid, without
    resolution.
  history:
    - date: "2026-06-30"
      note: >
        Placed at Abelisauroidea incertae sedis as a nomen dubium.
pronunciation:
  phonetic: KOMP-so-SOO-kus
etymology: From Greek kompsos ('elegant', 'refined') + Latin suchus
  ('crocodile', from Greek soukhos), meaning 'elegant crocodile'.
description: Compsosuchus is a dubious genus of abelisauroid theropod dinosaur
  from the Late Cretaceous Lameta Formation of India.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "38621"
  - source: wikidata
    id: Q20672144
  - source: gbif
    id: "4822589"
species:
  - name: Compsosuchus solus
    etymology: "From Latin 'solus' meaning 'alone' or 'sole'; the reason for the
      choice is unclear, though it may refer to the fact that the genus is based
      on a single specimen."
    status: nomen dubium
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Maastrichtian
    location:
      country: IN
      locality: Bara Simla
      region: IN-MP
      formation: Lameta
      bed: Carnosaur
    type_specimen:
      specimen_id: [ GSI K27/578 ]
      specimen_type: holotype
      institution: GSI
      material: Second cervical vertebra (possibly axis with axis-intercentrum and
        atlas-centrum); upper parts of neural arch missing
      completeness: fragmentary
    erected_in: huene1933a
references:
  - id: huene1933a
  - id: novas2004b
    notes: Reinterpreted Compsosuchus as an abelisaurid (removed from Allosauridae) and treated it as a nomen dubium.
