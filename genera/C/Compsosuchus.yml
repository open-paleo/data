genus: Compsosuchus
parent: Abelisauridae
pronunciation:
  phonetic: KOMP-so-SOO-kus
etymology: From Greek kompsos ('elegant', 'refined') + Latin suchus
  ('crocodile', from Greek soukhos), meaning 'elegant crocodile'.
description: Compsosuchus is a dubious genus of abelisauroid theropod dinosaur
  from the Late Cretaceous Lameta Formation of India.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Centrum bears two pleurocoels, one above the other
  - Diapophysis small and blunt, with a prominent margin proceeding obliquely to
    the postzygapophysis
  - Postzygapophysis situated high (3 cm above centrum) and extending well
    beyond the posterior end of the centrum
  - Atlas-centrum present, small (1 cm long, 2.5 cm broad, 2 cm high)
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "38621"
  - source: wikidata
    id: Q20672144
  - source: gbif
    id: "4822589"
species:
  - name: Compsosuchus solus
    etymology: "From Latin 'solus' meaning 'alone' or 'sole'; the reason for the
      choice is unclear, though it may refer to the fact that the genus is based
      on a single specimen."
    status: valid
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Maastrichtian
      from_ma: 72.1
      to_ma: 66
    location:
