genus: Cedrorestes
parent: Hadrosauroidea
etymology: "From Latin 'cedrus' meaning 'cedar' and Greek 'oros' meaning
  'mountain' (after the Cedar Mountain Formation where the fossil was found),
  with Greek suffix '-etes' meaning 'dweller'."
description: Cedrorestes is a genus of iguanodontian dinosaur from the Early
  Cretaceous of Utah. It is based on an incomplete skeleton which was found in
  the Valanginian-age Yellow Cat Member of the Cedar Mountain Formation.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
diagnostic_features:
  - Deep, iguanodontid-like ilium with a prominent lateral process
    ('antitrochanter') dorsal to the ischial peduncle, a character otherwise
    diagnostic of Hadrosauridae.
  - Poorly developed, bosslike ischial peduncle on the ilium.
  - Preacetabular process of the ilium laterally compressed and slightly
    deflected ventrally, terminating in a rounded point with a ventrolaterally
    divergent keel.
  - Postacetabular process elongated and tapering, with an overhanging lateral
    process above the postacetabular notch on the dorsolateral border.
