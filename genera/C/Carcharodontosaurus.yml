genus: Carcharodontosaurus
parent: Carcharodontosauridae
pronunciation:
  phonetic: kahr-KAR-o-DON-to-SAWR-us
  ipa: /ˌkɑːrkəroʊˌdɒntoʊˈsɔːrəs/
etymology: "From Greek Carcharodon (the great white shark genus, itself from
  Greek karcharos meaning 'jagged/sharp' and odous meaning 'tooth') and Greek
  sauros meaning 'lizard'. Full meaning: 'shark-toothed lizard'."
description: Carcharodontosaurus is a genus of large theropod dinosaur that
  lived in Northwest Africa from about 100 to 94 million years ago during the
  Cenomanian stage of the Cretaceous. The taxon was first described in 1925 by
  French paleontologists Charles Depéret and Justin Savornin as Megalosaurus
  saharicus, based on two fossil teeth discovered in Algeria, which are now
  lost. A partial skeleton was discovered in Egypt as early as 1914 by crews of
  German paleontologist Ernst Stromer, although he did not report the find until
  1931. Based on this specimen, together with the teeth previously described by
  Depéret and Savornin, Stromer established the genus Carcharodontosaurus and
  its type species (species a genus in named for) C. saharicus. Although the
  Egyptian skeleton was destroyed during World War II, it was subsequently
  redescribed as the holotype (name-bearing) specimen of a distinct
  carcharodontosaurid genus, Tameryraptor. In 1995, a large incomplete skull
  attributed to C. saharicus was discovered in the Kem Kem Beds of Morocco,
  which was officially proposed as the neotype (replacement holotype) in 2007.
  In the same year, fossils unearthed from the Farak Formation of Niger were
  described and named as another species, C. iguidensis, though this taxon might
  belong to a different genus.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
appearance:
  features:
    - snout hornlets
  integument: scaled
  evidence: inferred
diagnostic_features:
  - Pronounced grooved sculpturing covering nearly the entire lateral surface of
    the maxilla
  - Large internal carotid and paracondylar pneumatocoels (pneumatic recesses)
  - Deep, funnel-shaped basisphenoid fossa
  - Postaxial cervical centra low and very broad (nearly twice centrum height),
    with a reniform posterior articular face and a very well-developed ventral
    keel that is as deep as the centrum in some vertebrae
