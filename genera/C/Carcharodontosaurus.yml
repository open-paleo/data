  - name: Carcharodontosaurus iguidensis
    etymology: From Iguidi, the area of Niger where the holotype was found, with
      the Latin suffix '-ensis' ('from').
    status: valid
    type_species: false
    period:
      name:
        - Late Cretaceous
      stage:
        - Cenomanian
      from_ma: 100.5
      to_ma: 93.9
    location:
      country: NE
      region: Agadez
      formation: Echkar
      locality: Iguidi, west of In Abangharit
    type_specimen:
      specimen_id:
        - MNN IGU2
      specimen_type: holotype
      institution: MNBH
      material: Left maxilla, missing most of the ascending ramus and the posterior
        end of the main body, and all erupted teeth.
    diagnostic_features:
      - External antorbital fossa on the maxilla very reduced, restricted to a
        small area near the maxillary fenestra.
      - Anteromedial process of the maxilla broadly arched toward the midline and
        not overhanging a deep ventral fossa (present in C. saharicus).
      - Prominent horizontal crest on the medial aspect of the maxillary body.
      - Deeply invaginated fossa on the anterior surface of the laterosphenoid
        ala of the braincase.
      - Ventral margin of the maxilla nearly straight in lateral view, lacking
        the laterally protruding antorbital fossa rim of C. saharicus.
      - Enamel wrinkles on the tooth crowns less numerous and confined mainly to
        the base of the distal carina, less developed than in C. saharicus.
    erected_in: brusatte2007a
