genus: Carcharodontosaurus
parent: Carcharodontosaurinae
dispute:
  summary: >
    Carcharodontosaurus saharicus is a stable carcharodontosaurine, but referral
    of the second species, C. iguidensis, to the genus is contested: several
    analyses recover C. iguidensis outside Carcharodontosaurus sensu stricto and
    suggest it warrants its own genus (Chiarenza and Cau, 2016; Kellermann and colleagues, 2025; Cau and Paterna, 2025).
pronunciation:
  phonetic: kahr-KAR-o-DON-to-SAWR-us
  ipa: /ˌkɑːrkəroʊˌdɒntoʊˈsɔːrəs/
etymology: "From Greek Carcharodon (the great white shark genus, itself from
  Greek karcharos meaning 'jagged/sharp' and odous meaning 'tooth') and Greek
  sauros meaning 'lizard'. Full meaning: 'shark-toothed lizard'."
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
appearance:
  features:
    - snout hornlets
  integument: scaled
  evidence: inferred
diagnostic_features:
  - Pronounced grooved sculpturing covering nearly the entire lateral surface of
    the maxilla
  - Large internal carotid and paracondylar pneumatocoels (pneumatic recesses)
  - Deep, funnel-shaped basisphenoid fossa
  - Postaxial cervical centra low and very broad (nearly twice centrum height),
    with a reniform posterior articular face and a very well-developed ventral
    keel that is as deep as the centrum in some vertebrae
identifiers:
  - source: pbdb
    id: "38576"
  - source: wikidata
    id: Q14431
  - source: gbif
    id: "4822972"
  - source: eol
    id: "4433601"
erected_in: stromer1931a
species:
  - name: Carcharodontosaurus saharicus
    etymology: Means 'of the Sahara', referring to the Sahara Desert region of North
      Africa where the type specimen was found.
    pronunciation:
      phonetic: suh-HAYR-i-kus
    status: valid
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Cenomanian
    location:
      country: MA
      locality: east of the oasis of Er Remlia
      region: MA-ERR
      formation: Douira
    size:
      hip_height_m:
        min: 2.9
        max: 2.9
      length_m:
        min: 10
        max: 12.5
      weight_kg:
        min: 4000
        max: 7000
      skull_length_m:
        min: 1.42
        max: 1.6
    type_specimen:
      specimen_id:
        - SGM-Din 1
      specimen_type: neotype
      institution: SGM
      material: Partial cranium lacking the premaxillae, squamosals, quadratojugals,
        quadrates, and most of the palate.
      completeness: partial
    erected_as: Megalosaurus saharicus
    erected_in: depéret1925a
    described_in: brusatte2007a
  - name: Carcharodontosaurus iguidensis
    etymology: From Iguidi, the area of Niger where the holotype was found, with
      the Latin suffix '-ensis' ('from').
    status: valid
    type_species: false
    period:
      name:
        - Late Cretaceous
      stage:
        - Cenomanian
    location:
      country: NE
      region: NE-1
      formation: Farak
      locality: Iguidi, west of In Abangharit
      notes: >
        Sereno and colleagues (2026) assign the Iguidi (In Abangharit) area to
        the Farak Formation, from Faure's type sections north of Tanout, its
        fauna, and its position beneath the Cenomanian–Turonian limestone
        exposed to the west.
    type_specimen:
      specimen_id:
        - MNBH IGU2
      specimen_type: holotype
      institution: MNBH
      material: Left maxilla, missing most of the ascending ramus and the posterior
        end of the main body, and all erupted teeth.
    diagnostic_features:
      - External antorbital fossa on the maxilla very reduced, restricted to a
        small area near the maxillary fenestra.
      - Anteromedial process of the maxilla broadly arched toward the midline and
        not overhanging a deep ventral fossa (present in C. saharicus).
      - Prominent horizontal crest on the medial aspect of the maxillary body.
      - Deeply invaginated fossa on the anterior surface of the laterosphenoid
        ala of the braincase.
      - Ventral margin of the maxilla nearly straight in lateral view, lacking
        the laterally protruding antorbital fossa rim of C. saharicus.
      - Enamel wrinkles on the tooth crowns less numerous and confined mainly to
        the base of the distal carina, less developed than in C. saharicus.
    erected_in: brusatte2007a
references:
  - id: depéret1925a
  - id: sereno2026a
    notes: Concludes that "both the Jenguebi and Iguidi (In Abangharit) fossil
      areas represent exposures of the Farak Formation".
  - id: stromer1931a
  - id: brusatte2007a
    notes: Erects Carcharodontosaurus iguidensis on maxilla MNBH IGU2 from the
      Cenomanian Echkar Formation of Niger, and revises the genus.
  - id: jones2026c
    notes: Source of the hip height estimate, and the appearance features.
  - id: ibrahim2020a
    notes: Recognizes the Kem Kem Group as the lower Gara Sbaa and upper Douira
      formations, and places the neotype cranium in the Douira Formation.
  - id: cau2025a
    notes: Recovered C. iguidensis outside Carcharodontosaurus sensu stricto,
      suggesting it warrants its own genus.
  - id: chiarenza2016a
    notes: Commenting on Cenomanian North African theropods, recovered C. iguidensis
      outside Carcharodontosaurus sensu stricto.
  - id: kellermann2025a
    notes: Re-evaluation supports excluding a Bahariya taxon from
      Carcharodontosaurus sensu stricto.
