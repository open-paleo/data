genus: Crittendenceratops
parent: Nasutoceratopsini
etymology: Named after the Fort Crittenden Formation in Arizona where the
  fossils were found, + Greek ceratops ('horned face'), meaning 'horned face
  from the Fort Crittenden Formation'.
pronunciation:
  phonetic: CRIH-ten-den-SEH-ruh-tops
description: Crittendenceratops is a genus of horned centrosaurine ceratopsid
  dinosaur from the late Campanian Fort Crittenden Formation of Arizona. It
  contains a single species, C. krzyzanowskii, and represents the first dinosaur
  taxon from that formation to receive a formal scientific name.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Forward-curving, hook-like flanges located along the dorsomedial margin of
    the parietal lateroposterior ramus.
  - Extensive epiparietals located along the lateroposterior margin of the
    parietal ramus.
  - Parietal ramus dorsoventrally thick with deep elongate fossa on dorsal
    surface.
  - Posteroventrolateral concavity pronounced and extensively rugose.
  - Squamosal dorsal ridge short, pronounced, and located in close proximity to
    dorsolateral margin of the bone.
