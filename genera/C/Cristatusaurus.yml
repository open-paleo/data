genus: Cristatusaurus
parent: Baryonychinae
dispute:
  summary: >
    Cristatusaurus lapparenti is a fragmentary baryonychine that Carrano et al.
    (2012) considered an indeterminate baryonychine almost certainly synonymous
    with Suchomimus tenerensis; Lacerda et al. (2022), reported by Jones (2026),
    instead found it distinct and valid. Its validity and possible synonymy
    remain contested.
  history:
    - date: "2026-07-01"
      note: Placed at Baryonychinae following Carrano et al. (2012); retained as a valid genus pending resolution of the proposed synonymy with Suchomimus.
pronunciation:
  phonetic: kris-TAY-tuh-SAWR-us
etymology: From Latin 'cristatus' meaning 'crested' and Greek 'sauros' meaning 'lizard', referring to the crested skull of this spinosaurid dinosaur.
description: Cristatusaurus is a genus of theropod dinosaur that lived during
  the Early Cretaceous period of what is now Niger, 112 million years ago. It
  was a baryonychine member of the Spinosauridae, a group of large bipedal
  carnivores with well-built forelimbs and elongated, crocodile-like skulls. The
  type species Cristatusaurus lapparenti was named in 1998 by scientists
  Philippe Taquet and Dale Russell, on the basis of jaw bones and some
  vertebrae. Two claw fossils were also later assigned to Cristatusaurus. The
  animal's generic name, which means "crested reptile", alludes to a sagittal
  crest on top of its snout; while the specific name is in honor of the French
  paleontologist Albert-Félix de Lapparent. Cristatusaurus is known from the
  Albian to Aptian Elrhaz Formation, where it would have coexisted with sauropod
  and iguanodontian dinosaurs, other theropods, and various crocodylomorphs.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Premaxilla short and strongly hooked in lateral profile, increasing in
    height posteriorly with dorsal surface narrowing into a crest posteriorly.
  - Anteriormost premaxillary alveolus relatively large; lateral alveoli
    uniformly closely spaced.
  - Maxillary and dentary teeth laterally compressed in cross-section; maxillary
    teeth vertically oriented posteriorly.
  - Dentary only slightly constricted vertically in mid-section with alveoli
    closely spaced.
  - Maxillary and dentary teeth with finely serrated carinae (unlike Spinosaurus
    maroccanus).
