genus: Cristatusaurus
parent: Spinosauridae
dispute:
  summary: >
    Cristatusaurus lapparenti is known from fragmentary premaxillae and jaw
    pieces from the same formation as Suchomimus tenerensis. Carrano and
    colleagues (2012) treat it as an indeterminate baryonychine that almost
    certainly represents the same animal as Suchomimus. Sales and Schultz
    (2017) note differences with possible taxonomic significance but leave
    its validity open. Lacerda and colleagues (2022), comparing the
    premaxillae morphometrically and including both genera in a phylogenetic
    analysis, find it a valid species distinct from Suchomimus and Baryonyx,
    and recover it as the earliest-diverging spinosaurid, outside
    Baryonychinae.
pronunciation:
  phonetic: kris-TAY-tuh-SAWR-us
etymology: From Latin 'cristatus' meaning 'crested' and Greek 'sauros' meaning 'lizard', referring to the crested skull of this spinosaurid dinosaur.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Premaxilla short and strongly hooked in lateral profile, increasing in
    height posteriorly with dorsal surface narrowing into a crest posteriorly.
  - Anteriormost premaxillary alveolus relatively large; lateral alveoli
    uniformly closely spaced.
  - Maxillary and dentary teeth laterally compressed in cross-section; maxillary
    teeth vertically oriented posteriorly.
  - Dentary only slightly constricted vertically in mid-section with alveoli
    closely spaced.
  - Maxillary and dentary teeth with finely serrated carinae (unlike Spinosaurus
    maroccanus).
