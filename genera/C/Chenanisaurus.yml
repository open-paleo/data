genus: Chenanisaurus
parent: Abelisauridae
etymology: Named after Sidi Chennane, the locality in Morocco (Khouribga phosphate mines) where the fossil was found, + Greek sauros ('lizard'), meaning 'Sidi Chennane lizard'.
pronunciation:
  phonetic: sheh-NAN-eye-SOR-us
description: Chenanisaurus is a genus of theropod dinosaur that lived during the
  Late Cretaceous in what is now Morocco. The genus belongs to the family
  Abelisauridae. It is known from a partial dentary (lower jawbone) and several
  teeth that were found in the phosphate mines of Khouribga, in rocks of the
  Maastrichtian-aged Ouled Abdoun Basin. Chenanisaurus was described in 2017 by
  British paleontologist Nicholas Longrich and colleagues. The genus contains a
  single species, Chenanisaurus barbaricus.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - marine
diagnostic_features:
  - Lateral groove and associated neurovascular foramina located high (dorsally)
    on dentary, contrasting with the ventrally positioned groove in other
    derived abelisaurids
  - Anterodorsal margin of dentary downturned in lateral view
  - Massive symphysis with anterior margin nearly vertical in lateral view
  - Tip of jaws broad, with dentaries meeting at an obtuse angle
  - Proportionately very deep mandible, more extreme than in Carnotaurus or
    Ekrixinatosaurus relative to alveolar size
