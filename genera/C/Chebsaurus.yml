genus: Chebsaurus
parent: Cetiosauridae
etymology: From colloquial Arabic 'cheb' (شاب) meaning 'young man', referring to the juvenile nature of the fossils found, combined with Greek 'sauros' meaning 'lizard'.
pronunciation:
  phonetic: cheb-SOR-us
description: Chebsaurus is a genus of sauropod dinosaur, specifically a
  eusauropod. It lived in present-day Algeria, in the Callovian aged Aïssa
  Formation. The type species, C. algeriensis, was named in 2005 by Mahammed et
  al. and is the most complete Algerian sauropod known. It was around 8 to 9
  meters (26 to 30 ft) long.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Slender and elongated surangular
  - Tuberculated surface on both the crowns and roots of teeth
  - Short and robust basioccipital tubercles diverging in a V-shape (~60°),
    facets inclined ~70° to the horizontal in caudal view, with elliptical
    surface oriented along a craniodorsal long axis
  - Base of the postzygodiapophysial lamina of the transverse process included
    within the cranial part of the postzygapophysis in lateral view
  - Small elliptical fossa positioned caudodorsally to the lateral excavations
    (pseudopleurocoels) on a middle dorsal vertebra centrum
