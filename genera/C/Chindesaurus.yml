genus: Chindesaurus
parent: Saurischia
pronunciation:
  ipa: /ˌtʃɪndɪˈsɔːrəs/
  phonetic: CHIN-diss-OR-uhs
etymology: "Named for the Chinde Point area of Petrified Forest National Park in
  Arizona, where the fossils were found, combined with Greek 'sauros' meaning
  'lizard'."
description: Chindesaurus is an extinct genus of basal saurischian dinosaur from
  the Late Triassic (213-210 million years ago) of the southwestern United
  States. It is known from a single species, C. bryansmalli, based on a partial
  skeleton recovered from Petrified Forest National Park in Arizona. The
  original specimen was nicknamed "Gertie", and generated much publicity for the
  park upon its discovery in 1984 and airlift out of the park in 1985. Other
  fragmentary referred specimens have been found in Late Triassic sediments
  throughout Arizona, New Mexico, and Texas, but these may not belong to the
  genus. Chindesaurus was a bipedal carnivore, approximately as large as a wolf.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
