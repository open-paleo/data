genus: Chindesaurus
parent: Saurischia
dispute:
  summary: >
    Chindesaurus bryansmalli is recovered as a non-herrerasaurid
    herrerasaurian outside Theropoda, in the clade later named
    Morphoraptora, by recent analyses (Novas and others, 2021; Ezcurra and
    others, 2025; Srivastava and others, 2026), but as the sister taxon of
    Tawa at the base of Theropoda by Marsh and others (2019) and Jones
    (2026).
  history:
    - date: "2026-06-30"
      note: >
        Parked at Saurischia and deferred to the theropod-backbone
        reconciliation, pending resolution of the Herrerasauria-versus-basal-
        Theropoda debate (P2).
    - date: "2026-07-02"
      note: Confirmed and placed at Saurischia incertae sedis in the theropod-backbone reconciliation; the basal-Theropoda-versus-Herrerasauria position remains unresolved.
pronunciation:
  ipa: /ˌtʃɪndɪˈsɔːrəs/
  phonetic: CHIN-diss-OR-uhs
etymology: "Named for the Chinde Point area of Petrified Forest National Park in
  Arizona, where the fossils were found, combined with Greek 'sauros' meaning
  'lizard'."
description: Chindesaurus is an extinct genus of basal saurischian dinosaur from
  the Late Triassic (213-210 million years ago) of the southwestern United
  States. It is known from a single species, C. bryansmalli, based on a partial
  skeleton recovered from Petrified Forest National Park in Arizona. The
  original specimen was nicknamed "Gertie", and generated much publicity for the
  park upon its discovery in 1984 and airlift out of the park in 1985. Other
  fragmentary referred specimens have been found in Late Triassic sediments
  throughout Arizona, New Mexico, and Texas, but these may not belong to the
  genus. Chindesaurus was a bipedal carnivore, approximately as large as a wolf.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
appearance:
  integument: unknown
diagnostic_features:
  - Diagnosed by a unique combination of character states rather than discrete
    autapomorphies; the 'glutealiform' astragalus formerly used to diagnose the
    genus is now referred to the Chindesaurus + Tawa hallae clade.
  - Proximal surface of the femoral head smooth, lacking a groove.
  - Dorsolateral ('greater') trochanter of the femur forming a rounded ridge.
  - Dorsal centra anteroposteriorly short, with centrum length less than
    1.33 times the height of the anterior articular surface.
  - Prezygapophyses of the distal caudal vertebrae reduced, not extending
    farther anteriorly than 24% of centrum length.
