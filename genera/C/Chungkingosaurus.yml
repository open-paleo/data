genus: Chungkingosaurus
parent: Stegosauria
placement: incertae sedis
pronunciation:
  phonetic: CHUNG-CHING-o-SAWR-us
etymology: Named after Chongqing (formerly romanized as Chungking), the city in
  Sichuan Province, China where fossils were found, + Greek sauros ('lizard'),
  meaning 'Chongqing lizard'.
description: Chungkingosaurus is a genus of stegosaurian dinosaur from the Late
  Jurassic Upper Shaximiao Formation in what is now China. The type species is
  Chungkingosaurus jiangbeiensis.
dispute:
  summary: >
    Chungkingosaurus has been recovered within Stegosauridae (Maidment et al.,
    2008), in a basal clade with Huayangosaurus (Raven and Maidment, 2017), and
    as the earliest-diverging stegosaurid (Sánchez-Fenollosa and Cobos, 2025).
    With its family placement unresolved and Huayangosauridae not retained, it
    is placed at Stegosauria incertae sedis.
  history:
    - date: "2026-06-26"
      note: Placed at Stegosauria incertae sedis, family placement bounces between basal Stegosauridae and the Huayangosaurus group.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Dorsal and caudal vertebrae amphiplatyan; four sacral plus one robust
    dorsosacral vertebrae completely fused with fenestrated dorsal surface
  - Armor thick and large, consisting of both spinous plates and pear-shaped
    dorsal plates with constricted acute apex and expanded transverse base
  - Femoral shaft tubular, straight, and lacks a fourth trochanter; femur-tibia
    ratio approximately 1.26 (proportionally long tibia)
  - Astragalus and calcaneum completely fused to distal tibia and fibula
  - Dentition small and slender in tight alignment but not superimposed; crowns
    asymmetrical and crescentic with weak enamel and inconspicuous denticles
appearance:
  features:
    - dermal plates
    - tail spikes
  integument: armored
  evidence: direct
