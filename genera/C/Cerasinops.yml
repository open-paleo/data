genus: Cerasinops
parent: Leptoceratopsidae
etymology: "From Greek kerasos meaning 'cherry' and Greek ops meaning 'face'. Full meaning: 'cherry face', likely referring to the shape or color of its facial features."
pronunciation:
  phonetic: SEH-ruh-SIN-ops
description: Cerasinops was a small ceratopsian dinosaur. It lived during the
  Campanian of the late Cretaceous Period. Its fossils have been found in Two
  Medicine Formation, in Montana. The type species of the genus Cerasinops is C.
  hodgskissi.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Prootic extends further caudodorsally on the paroccipital process than in
    either Protoceratops or Montanoceratops.
  - Horizontal jugal crest oriented at ninety degrees from the main dorsoventral
    jugal crest, unique among basal neoceratopsians.
  - Extremely robust surangular with a thick buttress of bone at the contact
    with the coronoid process of the dentary.
  - Pronounced medial bend of the distal ulna, more extreme than in other North
    American basal neoceratopsians.
  - Forelimb to hindlimb ratio of 0.60, lower than in any other basal
    neoceratopsian.
  - Forelimb bones have longitudinal vascular canal structure in cortical bone,
    contrasting with the circumferential pattern in the hindlimb elements of the
    same individual.
