genus: Charonosaurus
parent: Lambeosaurinae
pronunciation:
  phonetic: kuh-ROH-nuh-SOR-uhs
  ipa: /kəˌroʊnəˈsɔːrəs/
etymology: "Named after Charon, the ferryman of the dead in Greek mythology who ferried souls across the river (the Amur River, near where the fossils were found, divides China and Russia), combined with Greek sauros meaning 'lizard'. Full meaning: 'Charon's lizard'."
description: Charonosaurus is a genus of lambeosaurine hadrosaurid dinosaur
  similar to Parasaurolophus that lived in the latest Cretaceous Yuliangze
  Formation of China. Its fossils were described by Godefroit, Zan, and Jin in
  2000, on the south bank of the Amur River, dividing China from Russia. It is
  monotypic, consisting of the species, C. jiayinensis.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - lacustrine
diagnostic_features:
  - Dorsal surface of parietal regularly rounded, without sagittal crest
  - Lateral side of squamosal nearly completely covered by caudal ramus of
    postorbital
  - Paroccipital and postcotyloid processes very low, extending only at
    mid-height of foramen magnum
  - Alar process of basisphenoid prominent and symmetrical
  - Tricipital crest developed on the humerus
  - "Forearm elongated and slender: ulna total length/proximal width ratio >6.3,
    radius >6.6; preacetabular process of ilium elongated, ilium
    length/preacetabular length >2.1"
