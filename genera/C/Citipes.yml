genus: Citipes
parent: Caenagnathidae
pronunciation:
  ipa: /ˈsɪtipɛz/
  phonetic: sit-eye-pez
etymology: "From Latin 'citus' meaning 'swift' or 'fleet' and 'pes' meaning 'foot', translating to 'fleet-footed'."
description: Citipes is an extinct genus of caenagnathid theropod from the Late
  Cretaceous Dinosaur Park Formation in Alberta, Canada. The genus contains only
  one species, the type species, C. elegans. The generic name of Citipes is
  Latin for "fleet-footed", and the specific epithet "elegans" is Latin for
  "elegant". The type specimen of Citipes has a convoluted taxonomic history,
  and has been previously assigned to the genera Ornithomimus, Macrophalangia,
  Elmisaurus, Chirostenotes, and Leptorhynchos before being given its own genus
  in 2020.
diet: omnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Distal tarsals III and IV coossified with each other and proximal metatarsus
    at maturity
  - Metatarsals II and IV lacking posteriorly protruding proximal ends (in
    contrast to Elmisaurus rarus)
  - Metatarsal III with prominent cruciate ridges on posterior surface
