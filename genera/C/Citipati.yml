    references: [norell2018]
  - specimen_id: [IGM 100/971]
    institution: GIN
    species: Citipati osmolskae
    category: reproductive
    significance: "Nearly complete oviraptorid embryo found in an isolated circular nest, associated with two perinate troodontid skulls; the first Citipati specimen discovered and early evidence that oviraptorids brooded their nests."
