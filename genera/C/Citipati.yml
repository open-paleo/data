  - nickname: "Big Mama"
    specimen_id: [IGM 100/979]
    institution: GIN
    species: Citipati osmolskae
    category: reproductive
    significance: "Adult preserved in a bird-like brooding pose atop a nest of elongatoolithid eggs, forelimbs covering the nest perimeter; landmark evidence linking oviraptorids to avian brooding. Also shows a badly broken but healed right ulna with a prominent callus."
    discovered:
      year: 1993
    references: [norell1995b]
  - nickname: "Big Auntie"
    specimen_id: [IGM 100/1004]
    institution: GIN
    species: Citipati osmolskae
    category: reproductive
    significance: "Second nesting oviraptorid specimen, slightly more complete than Big Mama; preserves the entire cervical series except atlas and axis, dorsal vertebrae with thoracic ribs, partial limbs and some sacral vertebrae. About 11% larger than IGM 100/979."
    discovered:
