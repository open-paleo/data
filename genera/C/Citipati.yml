genus: Citipati
parent: Citipatinae
etymology: From Sanskrit/Tibetan Buddhist mythology, citipati refers to the 'lords of the cemetery' or 'funeral pyre lords', two monks who became the guardians of the dead. The name alludes to individuals found atop nests, interpreted as brooding over eggs.
pronunciation:
  phonetic: CHIT-i-puh-tih
description: Citipati is a genus of oviraptorid dinosaur that lived in Asia
  during the Late Cretaceous period, about 75 million to 71 million years ago.
  It is mainly known from the Ukhaa Tolgod locality at the Djadochta Formation,
  where the first remains were collected during the 1990s. The genus and type
  species Citipati osmolskae were named and described in 2001. A second species
  from the adjacent Zamyn Khondt locality may also exist. Citipati is one of the
  best-known oviraptorids thanks to a number of well-preserved specimens,
  including individuals found in brooding positions atop nests of eggs, though
  most of them were initially referred to the related Oviraptor. These nesting
  specimens have helped to solidify the link between non-avian dinosaurs and
  birds.
diet: omnivore
locomotion: bipedal
paleoenvironment:
  - arid
diagnostic_features:
  - Anterodorsally sloping occiput and quadrate (if braincase positioned
    horizontally)
  - Parietal much longer along the midline than the frontal, reaching nearly to
    the level of the anterior end of the orbit
  - Ascending process of the jugal perpendicular to the horizontal ramus rather
    than extending posterodorsally
  - Ascending process of the premaxilla vertical rather than sloping
    posterodorsally
  - Cervical vertebrae more elongate (approximately twice as long as they are
    wide)
  - Ischia form a symphysis distally
appearance:
  features:
    - hollow cranial crest
    - feathered wings
    - feathered tail
  integument: feathered
  evidence: direct
