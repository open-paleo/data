genus: Coahuilasaurus
parent: Saurolophinae
etymology: Named after Coahuila, the state in Mexico where the fossils were found, + Greek sauros ('lizard'), meaning 'Coahuila lizard'.
pronunciation:
  phonetic: co-wah-WEE-lah-SOR-us
description: Coahuilasaurus is an extinct genus of kritosaurin ornithopod
  dinosaur from the Late Cretaceous (Campanian) Cerro del Pueblo Formation of
  Coahuila, Mexico. The genus contains a single species, C. lipani, known from
  the associated tips of the upper and lower jaw and other fragmentary skull
  bones. It is a large kritosaurin with an estimated body length of 8-9 meters
  (26-30 ft) and body mass of over 4 metric tons (4.4 short tons).
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Anterodorsal margin of narial process subtly sinusoidal in lateral view,
    concave anteriorly then weakly convex posteriorly
  - Narial aperture narrow and slot-like, strongly extended anteroventrally
  - Posteroventral corner of premaxillary beak strongly angular, anteroventral
    and posteroventral margins forming approximately a right angle in lateral
    view
  - Palatal surface of premaxilla forms horseshoe-shaped ridge projecting far
    below oral margin, bearing three pairs of massive diamond-shaped denticles
  - Very large narial flange of premaxilla
