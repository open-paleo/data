genus: Coahuilasaurus
parent: Kritosaurini
etymology: Named after Coahuila, the state in Mexico where the fossils were found, + Greek sauros ('lizard'), meaning 'Coahuila lizard'.
description: Coahuilasaurus is an extinct genus of kritosaurin ornithopod
  dinosaur from the Late Cretaceous (Campanian) Cerro del Pueblo Formation of
  Coahuila, Mexico. The genus contains a single species, C. lipani, known from
  the associated tips of the upper and lower jaw and other fragmentary skull
  bones. It is a large kritosaurin with an estimated body length of 8–9 metres
  (26–30 ft) and body mass of over 4 metric tons (4.4 short tons).
diet: herbivore
locomotion: facultative
