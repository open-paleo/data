genus: Craspedodon
parent: Ceratopsia
placement: incertae sedis
etymology: From Greek 'kraspedon' (edge, fringe, border) and
  'odon' (tooth); meaning 'edge tooth', in reference to the
  ridges and denticles ornamenting the tooth crowns.
pronunciation:
  phonetic: kras-PED-o-don
description: >
  Craspedodon is an extinct genus of ornithischian dinosaur
  from the Late Cretaceous Lonzée Member of Belgium. Only a
  single species, C. lonzeensis, is known.
dispute:
  summary: >
    Craspedodon lonzeensis is based on fragmentary teeth from Belgium
    reinterpreted as neoceratopsian by Godefroit and Lambert (2007);
    Maidment and others (2026) caution that such teeth are difficult to
    distinguish from those of ornithopods. Treated as a nomen dubium.
  history:
    - date: "2026-06-27"
      note: Placed at Ceratopsia incertae sedis; nomen dubium.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - coastal
diagnostic_features:
  - Enamelled side of the crown bearing deep indentations and a
    prominent basal cingulum.
  - Non-enamelled side of the crown very convex vertically and
    bulbous in mesial/distal view.
  - Labiolingual diameter at the base of the crown largely
    exceeding the mesiodistal diameter.
  - Secondary ridges starting from the apical edge of the
    crown but not reaching the base.
  - Cingulum well developed on dentary teeth, with the primary
    ridge set back from the cingulum, forming a continuous
    ridge at the base of the lingual side of the crown.
  - Asymmetrical denticulation on crown edges; lateral edges
    forming everted lips limited by a prominent rough vertical
    ridge on the enamelled side.
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: wikidata
    id: Q1657542
  - source: gbif
    id: "3238863"
species:
  - name: Craspedodon lonzeensis
    etymology: After Lonzée, near Gembloux (Namur Province,
      Belgium), the locality where the type material was
      discovered.
    status: nomen dubium
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Coniacian
        - Santonian
    location:
      country: BE
      region: BE-WNA
      member: Lonzée
      coordinates:
        - 50.55
        - 4.7333
    type_specimen:
      specimen_id:
        - RBINS R59
        - RBINS R58
        - RBINS R105
      specimen_type: syntype
      institution: IRSNB
      material: Three isolated teeth.
      completeness: fragmentary
    erected_in: dollo1883a
references:
  - id: dollo1883a
    notes: Original description of Craspedodon lonzeensis on two teeth; Dollo
      placed it within Ornithopoda based on tooth morphology, more derived than
      Iguanodon.
  - id: godefroit2007a
    notes: Reidentifies Craspedodon as a basal ceratopsoid neoceratopsian — the
      first proposed European representative — with a revised tooth-based
      diagnosis on three teeth (RBINS R59, R58, R105).
  - id: ősi2010a
    notes: Notes that Godefroit and Lambert's (2007) neoceratopsian
      reidentification of Craspedodon is uncertain, and suggests it may instead
      represent a hadrosauroid ornithopod.
  - id: maidment2026a
    notes: Did not analyze Craspedodon, cautioning that isolated teeth like its
      type material are difficult to assign confidently to a clade.
