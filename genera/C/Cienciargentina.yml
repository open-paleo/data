genus: Cienciargentina
parent: Rebbachisauridae
etymology: From Spanish 'ciencia' meaning 'science' and 'Argentina', combining a tribute to Argentine science with the country of discovery.
pronunciation:
  phonetic: see-EN-see-AR-jen-TEE-nuh
description: Cienciargentina is a genus of rebbachisaurid sauropod from the Late
  Cretaceous (Cenomanian-Turonian) Huincul Formation of Argentina. The genus
  contains a single species, Cienciargentina sanchezi, known from three partial
  skeletons of different sizes. Cienciargentina is the fourth definitive
  rebbachisaurid to be named from the Huincul Formation.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
appearance:
  integument: scaled
  evidence: inferred
diagnostic_features:
  - Cervical epipophyses absent
  - Dorsal centra amphicoelous to slightly opisthocoelous anteriorly and
    slightly opisthocoelous posteriorly; mid and posterior dorsals with an
    intrapostzygapophyseal lamina supporting the postzygapophyses, an accessory
    spinodiapophyseal lamina, and a spinoparapophyseal lamina on the posterior
    neural arches
  - Anterior caudal vertebrae with the spinoprezygapophyseal lamina more robust
    than the spinopostzygapophyseal lamina, and transverse processes bearing a
    full suite of diapophyseal laminae (anterior and posterior
    centrodiapophyseal, prezygodiapophyseal, and postzygodiapophyseal)
  - Posterior caudal vertebrae with the neural spine strongly displaced
    posteriorly and a length-to-height ratio of 5 or greater
  - Forked chevrons lacking anterior and posterior projections
  - Ischium with a constriction (neck) in the iliac peduncle and an ischial
    tuberosity; femoral head dorsally directed, rising well above the level of
    the greater trochanter
