genus: Claorhynchus
parent: Ornithischia
placement: incertae sedis
etymology: From Greek 'klao' ('to break') and 'rhynchos' ('beak'), for the
  broken condition of the beak bones on which the genus was founded.
description: Claorhynchus is a dubious genus of cerapodan dinosaur with a
  confusing history behind it. It has been considered to be both a hadrosaurid
  and a ceratopsid, sometimes the same as Triceratops, with two different
  assignments as to discovery formation and location, and what bones make up its
  type remains.
dispute:
  summary: >
    Which group the type specimen belongs to is unresolved. Cope (1892) founded
    the genus on what he took to be a rostral and predentary of a ceratopsian,
    referring it to the Agathaumidae. Hatcher (1907) removed it from the
    Ceratopsia on the strength of Cope's description alone, supposing it to be
    a trachodontid, and Lull and Wright (1942) read the material as a hadrosaur
    premaxilla and dentary, a placement followed by White (1973), Horner and
    others (2004) and Jones and Viola (2026). Against that, Brett-Surman (1989)
    relocated the type in the collections and examined it, concluding that it
    is part of a ceratopsian frill, probably the lateral edge of a Triceratops
    squamosal, and that it is certainly not a hadrosaurid. Because that
    re-examination has not been answered, the genus is placed at Ornithischia
    incertae sedis, the least inclusive clade common to both readings. Every
    source agrees the specimen is too incomplete to diagnose.
diet: herbivore
identifiers:
  - source: pbdb
    id: "63936"
  - source: wikidata
    id: Q18606707
  - source: gbif
    id: "4823028"
species:
  - name: Claorhynchus trihedrus
    status: nomen dubium
    type_species: true
    period:
      name:
        - Late Cretaceous
    location:
      country: US
      notes: Neither the locality nor the horizon was recorded. Cope gives no
        locality and no horizon beyond "the Laramie", and Hatcher said as much
        in 1902 before offering South Dakota as a guess. Two candidates
        circulate, neither settled. Lull and Wright (1942) give a hedged
        "?Judith River" in Montana, which later work repeats while dropping
        their question mark and adding a county that has no source. The other
        two taxa Cope named in the same paper are both Lancian and traceable
        to South Dakota, and he records this material as found a few hundred
        yards from one of them, which would place it in the Hell Creek
        Formation instead.
    type_specimen:
      specimen_id:
        - AMNH 3978
      specimen_type: holotype
      institution: AMNH
      material: Beak-region bones found together with fragments of a massive
        supratemporal bone, described by Cope as a rostral and predentary.
      completeness: fragmentary
      notes: What the specimen actually is has been read three ways. Cope
        (1892) described a ceratopsian rostral and predentary, Lull and Wright
        (1942) a hadrosaur premaxilla and dentary, and Brett-Surman (1989), who
        relocated the specimen and examined it, part of a ceratopsian frill.
        Its provenance is also given two ways, as the Laramie Formation of
        Colorado and as the Judith River Formation of Fergus County, Montana.
    erected_in: cope1892a
references:
  - id: cope1892a
    notes: Erects the genus on beak bones found with fragments of a
      supratemporal, referring it to the ceratopsian family Agathaumidae.
  - id: hatcher1907a
    notes: Removes the genus from the Ceratopsia, supposing from Cope's
      description that it belongs with the trachodontids, and gives the type
      as AMNH 3978.
  - id: white1973a
    notes: Records the type as a premaxillary tip and predentary and assigns
      the genus to Hadrosauridae, with a Judith River Formation provenance in
      Fergus County, Montana.
  - id: brett-surman1989a
    notes: Relocated and examined the type, identifying it as part of a
      ceratopsian frill and rejecting the hadrosaur reading.
  - id: olshevsky1991a
    notes: Lists the genus as a nomen dubium under Triceratops.
  - id: horner2004a
    notes: Lists the species among hadrosaurid nomina dubia, with the material
      given as fragmentary premaxillae and predentary.
  - id: jones2026a
    notes: Records that the genus has been considered both hadrosaurid and
      ceratopsid, and treats it as an indeterminate hadrosaurid.
