    reason: Material is now generally considered indistinguishable from Camptosaurus.
  - name: Brachyrophus
    type: junior subjective
    reason: Material is now widely recognized as indistinguishable from Camptosaurus.
  - name: Uteodon
    type: possible subjective
    reason: Possible junior subjective synonym of Camptosaurus; identification is
      tentative. Per Olshevsky's Dinosaur Genera List.
