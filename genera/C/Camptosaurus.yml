genus: Camptosaurus
parent: Ankylopollexia
pronunciation:
  ipa: /ˌkæmptəˈsɔːrəs/
  phonetic: KAMP-tə-SOR-əs
etymology: "From Greek kamptos (καμπτος) meaning 'bent/flexible' and Greek sauros (σαυρος) meaning 'lizard'. Full meaning: 'flexible lizard'."
description: Camptosaurus is an extinct genus of plant-eating, beaked
  ornithischian dinosaurs of the Late Jurassic period of western North America
  and possibly also Europe. The name means 'flexible lizard' (Greek καμπτος
  (kamptos) meaning 'bent' and σαυρος (sauros) meaning 'lizard').
diet: herbivore
locomotion: bipedal
