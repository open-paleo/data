genus: Camptosaurus
parent: Ankylopollexia
pronunciation:
  ipa: /ˌkæmptəˈsɔːrəs/
  phonetic: KAMP-tuh-SOR-uhs
etymology: "From Greek kamptos (καμπτος) meaning 'bent/flexible' and Greek
  sauros (σαυρος) meaning 'lizard'. Full meaning: 'flexible lizard'."
description: Camptosaurus is an extinct genus of plant-eating, beaked
  ornithischian dinosaurs of the Late Jurassic period of western North America
  and possibly also Europe. The name means 'flexible lizard' (Greek καμπτος
  (kamptos) meaning 'bent' and σαυρος (sauros) meaning 'lizard').
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Cervical vertebrae all opisthocoelous, unlike Laosaurus
  - Pubis broad and thin in front of acetabulum, directed well forward
  - Sacral vertebrae unfused, not from immaturity
  - Ischium expanded distally with extensive surface for union with fellow
  - Femur longer than tibia
appearance:
  integument: scaled
  evidence: inferred
