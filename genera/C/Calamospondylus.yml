genus: Calamospondylus
parent: Coelurosauria
dispute:
  summary: >
    Calamospondylus oweni is a nomen dubium. Although the name is validly
    published, the type material (a now-lost sacrum and pelvic remains from the
    Wealden of the Isle of Wight) preserves no diagnostic characters, and Naish
    (2002) showed it is based on a different specimen from Aristosuchus, with which
    it had long been synonymized. It can be identified only as a small
    coelurosaurian theropod.
  history:
    - date: "2026-07-01"
      note: Placed at Coelurosauria incertae sedis; nomen dubium with lost, undiagnostic type material (Naish, 2002).
etymology: From Greek kalamos (reed) and spondylos (vertebra),
  in reference to the hollow, reed-like nature of the
  vertebrae.
pronunciation:
  phonetic: kal-uh-mo-SPON-dih-lus
description: >
  Calamospondylus is a dubious genus of theropod dinosaur. It
  lived during the Early Cretaceous and its fossils were found
  on the Isle of Wight in southern England. The type species is
  C. oweni, named in 1866 in an anonymous publication written
  largely by its discoverer, the Reverend William Fox. The
  description given by Fox was brief and listed no unique
  diagnostic characteristics; between this and the fact that
  the specimen has been lost, C. oweni is now considered a
  nomen dubium. The presence of expansive hollows in the bone
  led Fox to speculate that it was arboreal, leaping from tree
  to tree, or alternatively that it was a hopping animal.
diet: carnivore
locomotion: bipedal
diagnostic_features:
  - Vertebrae hollow, smooth, and compact like a reed (hollow neural canal
    giving the genus its name)
  - Bones more hollow, light, and compact in structure than bird bones,
    comparable to pterodactyl bones
  - Foramina for admission of air into the bones, analogous to pneumatized
    pterodactyl bones
  - Small body size relative to contemporary Wealden dinosaurs (sacrum only six
    inches long)
paleoenvironment:
  - fluvial
  - coastal
appearance:
  integument: unknown
