genus: Calamospondylus
parent: Coelurosauria
etymology: From Greek kalamos (reed) and spondylos (vertebra),
  in reference to the hollow, reed-like nature of the
  vertebrae.
description: >
  Calamospondylus is a problematic small theropod erected by
  the Rev. William Fox (1866) on a sacrum of five cemented
  vertebrae with associated sacral ribs and partial ilia,
  recovered from the Wealden of the Isle of Wight. The
  original material is now lost, the published description is
  brief, and no autapomorphies were diagnosed; following
  Naish's review (2002) the taxon is treated as a nomen
  dubium. It should not be confused with Calamosaurus
  Lydekker (1891), a separate Wealden coelurosaur.
diet: carnivore
locomotion: bipedal
