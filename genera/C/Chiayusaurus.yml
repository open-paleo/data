genus: Chiayusaurus
parent: Sauropoda
etymology: From Chia-yü-kuan (Jiayuguan, in western Gansu/Kansu
  Province) and Greek sauros (lizard); meaning "Jiayuguan lizard".
  Originally erected as Chiayüsaurus and subsequently rendered
  Chiayusaurus to comply with ICZN orthography.
description: >
  Chiayusaurus is a genus of sauropod dinosaur known from teeth
  found in China and possibly also South Korea. Two species have
  been named for this obscure genus, though only the type, C.
  lacustris, is still seen as valid. It was originally named as
  Chiayüsaurus, but the ICZN does not permit special characters,
  so the name was corrected to Chiayusaurus. The obsolete name
  can still be seen in older sources, though. As a sauropod,
  Chiayusaurus would have been a large, quadrupedal herbivore.
diet: herbivore
locomotion: quadrupedal
diagnostic_features:
  - Spatulate tooth with internal concavity restricted to the distal half of
    crown height; proximal half broadly convex (unlike Helopus where the convex
    basal portion is low, occupying less than one-third of crown height)
  - Pronounced rib near the posterior border within the internal concavity, with
    a thin posterior wing behind it; internal rib displaced posteriorly rather
    than centrally
  - External side strongly convex forming a broad ridge, bordered by a very
    narrow thinner portion anteriorly and a broader portion posteriorly, with
    the ridge curving inward and backward at the tip
  - Enamel surface densely covered with fine microscopical warts and ridges
    arranged roughly parallel to the vertical axis of the tooth
  - "Crown proportions: 27 mm vertically, 13 mm antero-posteriorly, 8 mm
    latero-medially"
paleoenvironment:
  - lacustrine
