genus: Chiayusaurus
parent: Sauropoda
etymology: From Chia-yü-kuan (Jiayuguan, in western Gansu/Kansu
  Province) and Greek sauros (lizard); meaning "Jiayuguan lizard".
  Originally erected as Chiayüsaurus and subsequently rendered
  Chiayusaurus to comply with ICZN orthography.
description: >
  Chiayusaurus is a problematic sauropod tooth-taxon erected by
  Bohlin (1953) on isolated teeth from the Lower Cretaceous of
  the Hui-hui-p'u area, western Gansu, China. The type species
  C. lacustris was named alongside other indeterminate Chinese
  sauropod tooth morphologies in the same monograph. A second
  species, C. asianensis, was named by Lee et al. (1997) on a
  tooth from the Hasandong Formation of South Korea. Barrett et
  al. (2002) reviewed both species and treated them as nomina
  dubia, citing the absence of unambiguous autapomorphies in
  the available tooth material.
diet: herbivore
locomotion: quadrupedal
