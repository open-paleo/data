genus: Chiayusaurus
parent: Sauropoda
etymology: From Chia-yü-kuan (Jiayuguan, in western Gansu/Kansu
  Province) and Greek sauros (lizard); meaning "Jiayuguan lizard".
  Originally erected as Chiayüsaurus and subsequently rendered
  Chiayusaurus to comply with ICZN orthography.
pronunciation:
  phonetic: JYAH-yoo-SOR-us
description: >
  Chiayusaurus is a genus of sauropod dinosaur known from teeth
  found in China and possibly also South Korea. Two species have
  been named for this obscure genus, though only the type, C.
  lacustris, is still seen as valid. It was originally named as
  Chiayüsaurus, but the ICZN does not permit special characters,
  so the name was corrected to Chiayusaurus. The obsolete name
  can still be seen in older sources, though. As a sauropod,
  Chiayusaurus would have been a large, quadrupedal herbivore.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - lacustrine
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "38700"
  - source: wikidata
    id: Q719905
  - source: gbif
    id: "4823509"
species:
  - name: Chiayusaurus lacustris
    etymology: Latin lacustris ("of the lake"), reflecting the
      freshwater lacustrine setting Bohlin inferred for the
      type horizon.
    status: nomen dubium
    type_species: true
    period:
      name:
        - Early Cretaceous
      stage:
        - Barremian
        - Aptian
    location:
      country: CN
      region: CN-GS
      locality: Chia-yü-kuan badlands
      group: Xinminpu
    type_specimen:
      specimen_type: holotype
      status: uncatalogued
      institution: IVPP
      material: Isolated sauropod tooth crown; one of two distinct sauropod tooth
        morphologies Bohlin recognized in the Kansu material.
      completeness: fragmentary
    erected_in: bohlin1953a
references:
  - id: bohlin1953a
    notes: Erects Chiayüsaurus lacustris on an isolated tooth from the Lower
      Cretaceous of Hui-hui-p'u, Kansu (Gansu); original genus spelling later
      corrected to Chiayusaurus under ICZN.
