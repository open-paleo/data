genus: Chiayusaurus
parent: Sauropoda
etymology: From Chia-yü-kuan (Jiayuguan, in western Gansu/Kansu
  Province) and Greek sauros (lizard); meaning "Jiayuguan lizard".
  Originally erected as "Chiayüsaurus" and subsequently rendered
  Chiayusaurus to comply with ICZN orthography.
pronunciation:
  phonetic: JYAH-yoo-SOR-us
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - lacustrine
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "38700"
  - source: wikidata
    id: Q719905
  - source: gbif
    id: "4823509"
species:
  - name: Chiayusaurus lacustris
    etymology: Latin lacustris ("of the lake"), reflecting the
      freshwater lacustrine setting Bohlin inferred for the
      type horizon.
    pronunciation:
      phonetic: luh-KUS-tris
    status: nomen dubium
    type_species: true
    period:
      name:
        - Early Cretaceous
      stage:
        - Barremian
        - Aptian
    location:
      country: CN
      region: CN-GS
      locality: Chia-yü-kuan badlands
      group: Xinminpu
    type_specimen:
      specimen_type: holotype
      status: uncataloged
      institution: IVPP
      material: Isolated sauropod tooth crown; one of two distinct sauropod tooth
        morphologies Bohlin recognized in the Kansu material.
      completeness: fragmentary
    erected_in: bohlin1953a
references:
  - id: dong2002a
    notes: Places the Lower Cretaceous beds north of Jiayuguan in the Xinminpu
      Group.
  - id: bohlin1953a
    notes: Erects Chiayusaurus lacustris on an isolated tooth from the
      Chia-yü-kuan section, Kansu (Gansu); original genus spelling later
      corrected to Chiayusaurus under ICZN.
