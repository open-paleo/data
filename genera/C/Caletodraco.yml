genus: Caletodraco
parent: Furileusauria
etymology: "From 'Caleti', the name of the Celtic tribe that lived in the area
  around the type locality in Normandy, France, combined with Latin 'draco'
  meaning 'dragon'. The species name honors Nicolas Cottard, who discovered the
  specimen."
pronunciation:
  phonetic: KAL-eh-tow-DRAH-ko
description: Caletodraco is a genus of furileusaurian abelisaurid dinosaur from
  Late Cretaceous (Cenomanian) Chalk of the Pays de Caux, France. The type
  species is Caletodraco cottardi. It represents the first definitive
  furileusaurian named from outside of South America.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - marine
diagnostic_features:
  - Transverse process of first caudal vertebra with a short anterior spine and
    a rounded, expanded fan-shaped semicircular posterodistal margin - unlike
    any other known furileusaurian
  - Distally expanded transverse process of first caudal vertebra with a convex
    posterior distal margin and a hook-like anterodistal process
  - Transverse process of first caudal vertebra orientated dorsally at ~45° to
    neural spine, with broad shaft slightly curved posteriorly
