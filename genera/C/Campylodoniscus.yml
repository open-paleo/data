genus: Campylodoniscus
parent: Sauropoda
etymology: "Diminutive form of Campylodon; from Greek kampylos (καμπυλος)
  meaning 'bent/curved' and Greek odon (ὀδών) meaning 'tooth'. Full meaning:
  'little bent tooth'."
description: Campylodoniscus is a genus of titanosaur sauropod dinosaur from the
  Late Cretaceous Period of what is now Argentina.
diet: herbivore
