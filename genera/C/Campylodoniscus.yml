genus: Campylodoniscus
parent: Sauropoda
etymology: "Diminutive form of Campylodon; from Greek kampylos (καμπυλος)
  meaning 'bent/curved' and Greek odon (ὀδών) meaning 'tooth'. Full meaning:
  'little bent tooth'."
pronunciation:
  phonetic: kam-PIE-low-doh-NISS-kus
description: Campylodoniscus is a genus of titanosaur sauropod dinosaur from the
  Late Cretaceous Period of what is now Argentina.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Maxilla with exactly 7 alveoli only; 2.5 cm of bone without alveoli behind
    last alveolus
  - Alveolar diameters decrease posteriorly from 13-14 mm to 7 mm; labial border
    slopes deeply, lingual much higher
  - Maxilla height 10.5 cm above first alveolus, decreasing posteriorly;
    slightly convex longitudinally
  - Large oval vascular perforation on outer surface above first alveolus,
    followed by five more openings of decreasing size
  - Anterior apophysis directed forward, deeply and concavely excavated, with
    serrated suture for premaxilla articulation
  - Dental crown intermediate between spatulate Camarasaurus and styliform
    Diplodocus; surface with peach-stone-like roughnesses
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "38687"
