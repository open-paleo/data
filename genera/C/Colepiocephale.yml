genus: Colepiocephale
parent: Pachycephalosauridae
etymology: From Greek kolepion ('knuckle') + kephale ('head'), meaning 'knucklehead', referring to the distinctive domed skull.
description: Colepiocephale is a genus of pachycephalosaurid dinosaur from Late
  Cretaceous (middle Campanian stage) deposits of Alberta, Canada. It was
  collected from the Foremost Formation. The type species, C. lambei, was
  originally described by Sternberg in 1945 as Stegoceras lambei, and later
  renamed by Sullivan in 2003. C. lambei is a domed pachycephalosaur
  characterized principally by the lack of a lateral and posteriosquamosal
  shelf, a steeply down-turned parietal, and the presence of two incipient nodes
  tucked under the posterior margin of the parietosquamosal border.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - coastal
diagnostic_features:
  - Parietal strongly down-turned, forming steeply inclined border across entire
    posterior breadth of skull
  - Squamosals restricted to lateral sides and much reduced, with no lateral or
    posterior squamosal shelf
  - Peripheral elements (postorbital, posterior supraorbital, anterior
    supraorbital, prefrontal) reduced and situated low along the frontoparietal
  - Frontoparietal dome with pronounced constriction (diastema) at contact of
    postorbital and posterior supraorbital viewed dorsally
  - Lateral frontal lobes (prefrontal and anterior supraorbital) incipient and
    recessed posteriorly, with medial nasal boss prominent and relatively narrow
