genus: Colepiocephale
parent: Pachycephalosauridae
etymology: From Greek kolepion ('knuckle') + kephale ('head'), meaning 'knucklehead', referring to the distinctive domed skull.
pronunciation:
  phonetic: ko-lep-ee-o-SEF-uh-lee
description: Colepiocephale is a genus of pachycephalosaurid dinosaur from Late
  Cretaceous (middle Campanian stage) deposits of Alberta, Canada. It was
  collected from the Foremost Formation. The type species, C. lambei, was
  originally described by Sternberg in 1945 as Stegoceras lambei, and later
  renamed by Sullivan in 2003. C. lambei is a small domed pachycephalosaur
  known only from incomplete frontoparietal domes. A 2009 redescription by
  Schott and colleagues showed that the posteromedial extension of the parietal
  is broken off in every specimen and that the supratemporal fenestrae remained
  open, refuting earlier interpretations of a reduced occiput and
  ontogenetically lost squamosals; the genus is now diagnosed chiefly by
  features of the dome, including prominent, columnar supraorbital lobes and a
  narrow, high frontonasal boss.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - coastal
diagnostic_features:
  - Frontoparietal dome reaching its greatest width near the posterior margin
    of the sutural surface for the postorbital.
  - Inflated parietal region of the dome overhanging the anterior margin of the
    supratemporal fenestrae.
  - Sutural surface for the postorbital highly arched, producing a pronounced
    diastema between the sutural surfaces for the postorbital and posterior
    supraorbital.
  - Diastema accompanied by a distinct indentation in the lateral wall of the
    dome.
  - Frontonasal boss narrow and high, flanked at its posterior end by the
    supraorbital lobes.
  - Supraorbital lobes highly distinct and columnar (pillar-like in larger
    specimens).
