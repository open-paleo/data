genus: Chondrosteosaurus
parent: Sauropoda
pronunciation:
  phonetic: kon-DROS-tee-o-SAWR-us
etymology: From Greek chondros ('cartilage') + osteon ('bone') + sauros
  ('lizard'), meaning 'cartilage and bone lizard', referring to the mix of
  cartilaginous and bony structures in its vertebrae.
description: "Chondrosteosaurus is a dubious genus of sauropod dinosaur from the
  Early Cretaceous Wessex Formation of England. Two species have been named: C.
  gigas and C. magnus, both of which are now considered invalid."
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Flat under surface of vertebral centrum with predominant transverse over
    vertical diameter
  - Hemispherical convexity of anterior articular surface, concave posterior
    surface
  - Presence of bifid rib articulation indicated by both parapophysis and
    diapophysis on each side of centrum
  - Deep oblong lateral depressions on sides of centrum between para- and
    diapophyses
  - Neural canal at middle of vertebra approximately 1 inch 3 lines diameter,
    expanding to 2 inches at hinder outlet
  - Large cancellate structure within centrum, filled with unossified cartilage
    (chondrine) rather than air cells
