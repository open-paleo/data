genus: Comahuesaurus
parent: Rebbachisauridae
etymology: Named after the Comahue region of Patagonia, Argentina, where the fossils were found, + Greek sauros ('lizard'), meaning 'Comahue lizard'.
pronunciation:
  phonetic: KOH-muh-hoo-SOR-us
description: Comahuesaurus is a genus of sauropod dinosaur of the family
  Rebbachisauridae. It was found in the Lohan Cura Formation in Argentina, and
  lived during the Early Cretaceous (Aptian to Albian). The type species is C.
  windhauseni, named for Anselmo Windhausen, who contributed significantly to
  the geological study of Patagonia.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Anterior dorsal centra with strong lateral constriction, resulting in a thin
    ventral keel
  - Anterior dorsal vertebrae with long prezygapophyses, which in anterior view
    cover around 3/4 of the transverse processes
  - Anterior dorsal vertebrae with two spinoprezygapophyseal laminae
  - Anterior dorsal vertebrae with two spinodiapophyseal laminae, an anterior
    and a posterior one
  - "Anterior median lamina formed by three different laminae: the anterior and
    posterior spinoprezygapophyseal laminae and the anterior spinodiapophyseal"
  - Posterior dorsal centra with the centroprezygapophyseal lamina medially
    divided
  - Posterior dorsal neural arches with three spinopostzygapophyseal laminae
  - Double contact between the posterior spinodiapophyseal lamina and the
    lateral spinopostzygapophyseal lamina
