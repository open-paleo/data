genus: Comahuesaurus
parent: Rebbachisauridae
etymology: Named after the Comahue region of Patagonia, Argentina, where the fossils were found, + Greek sauros ('lizard'), meaning 'Comahue lizard'.
description: Comahuesaurus is a genus of sauropod dinosaur of the family
  Rebbachisauridae. It was found in the Lohan Cura Formation in Argentina, and
  lived during the Early Cretaceous (Aptian to Albian). The type species is C.
  windhauseni, named for Anselmo Windhausen, who contributed significantly to
  the geological study of Patagonia.
diet: herbivore
locomotion: quadrupedal
