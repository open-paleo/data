genus: Changchunsaurus
parent: Thescelosaurinae
etymology: Named after Changchun, the city near where it was discovered in Jilin
  Province, China, + Greek sauros ('lizard'), meaning 'Changchun lizard'.
pronunciation:
  phonetic: CHAHNG-choon-SOR-us
description: Changchunsaurus is an extinct genus of small herbivorous
  neornithischian dinosaur from Early or Late Cretaceous deposits of
  Gongzhuling, Jilin, China. It is the first named dinosaur genus from that
  region.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Jugal boss projects laterally near ventral margin of orbit with nubble
    (scaly) surface texture, not seen in any other known ornithopod
  - Predentary ventral process distinctly longer than lateral process, with
    bilobate end of ventral process
  - Longitudinal concave (median groove) present along midline suture of nasal
  - Quadratojugal triangular (equilateral) with no quadrate foramen
  - Five premaxillary teeth with only a very short edentulous anterior portion
    of premaxilla
  - Enamel on cheek tooth crowns distributed symmetrically on both buccal and
    lingual faces
appearance:
  features:
    - keratinous beak
  integument: scaled
  evidence: inferred
