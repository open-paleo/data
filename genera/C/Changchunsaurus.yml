genus: Changchunsaurus
parent: Ornithopoda
etymology: Named after Changchun, the city near where it was discovered in Jilin Province, China, + Greek sauros ('lizard'), meaning 'Changchun lizard'.
description: Changchunsaurus is an extinct genus of small herbivorous
  neornithischian dinosaur from Early or Late Cretaceous deposits of
  Gongzhuling, Jilin, China. It is the first named dinosaur genus from that
  region.
diet: herbivore
locomotion: bipedal
