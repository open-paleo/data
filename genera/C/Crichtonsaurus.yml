genus: Crichtonsaurus
parent: Ankylosauria
etymology: From the surname Crichton (Michael Crichton, author
  of 'Jurassic Park') and Greek 'sauros' (lizard); meaning
  "Crichton's lizard".
description: >
  Crichtonsaurus is a dubious genus of herbivorous ankylosaurid
  dinosaur that lived during the Late Cretaceous in what is now
  China. It was named after Michael Crichton, the author of the
  dinosaur novel Jurassic Park. A sister taxon was discovered,
  C. benxiensis, which is now identified as a separate genus.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
appearance:
  integument: armored
diagnostic_features:
  - Mandible thin and lacking osseous armor or sculpting marks on the lateral
    surface
  - Teeth small with symmetrical crown bearing vertical ridges, undeveloped
    central ridge, 4–5 marginal denticles per side, and incompletely developed
    cingulum
  - Scapula and coracoid not fused into a scapulocoracoid
  - Posterior caudal vertebrae fused into a rod-like structure with
    symmetrically arranged membranous osseous plates on both sides
  - Cervical armor plates fused into a semicircular ring
