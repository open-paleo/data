references:
  - id: dong2002a
    notes: Original description of Crichtonsaurus bohlini on a fragmentary left
      mandible from the Sunjiawan Formation; family assigned as incertae sedis
      pending more material.
  - id: arbour2015a
    notes: Concludes that the C. bohlini holotype lacks any diagnostic
      characters and treats the species as a nomen dubium; splits C. benxiensis
      off as the new genus Crichtonpelta.
