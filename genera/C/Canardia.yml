genus: Canardia
parent: Lambeosaurinae
etymology: From French 'canard' meaning 'duck', referring to the duck-billed (hadrosaur) nature of this dinosaur found in France.
pronunciation:
  phonetic: can-AHR-dee-uh
description: Canardia is an extinct genus of lambeosaurine dinosaur known from
  the Late Cretaceous Marnes d'Auzas Formation (late Maastrichtian stage) of
  Haute-Garonne department, in Occitanie region, southwestern France. The type
  species Canardia garonnensis was first described and named by Albert
  Prieto-Márquez, Fabio M. Dalla Vecchia, Rodrigo Gaete and Àngel Galobart in
  2013. It is only known from juvenile specimens.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
diagnostic_features:
  - Maxilla with prominent subrectangular rostrodorsal flange that rises
    vertically above rostroventral process, shared only with Aralosaurus
    tuberiferus
  - Ectopterygoid shelf subhorizontal (parallel to caudal segment of tooth row),
    distinguishing it from Aralosaurus tuberiferus
  - Prefrontal with dorsomedial flange, absent in Aralosaurus tuberiferus
  - Prefrontal with narrow rostroventral process, in contrast to broad process
    of Aralosaurus tuberiferus
