genus: Chilantaisaurus
parent: Neovenatoridae
pronunciation:
  phonetic: jee-LAHN-tie-SAWR-us
etymology: Named after Jilantai (also romanized as Chilantai) Salt Lake in Inner Mongolia, China, where the fossils were found, + Greek sauros ('lizard'), meaning 'Jilantai Salt Lake lizard'.
description: Chilantaisaurus is an extinct genus of large theropod dinosaur that
  lived in present-day China during the Late Cretaceous period. It was described
  by Chinese paleontologist Hu Show-Yung in 1964. The genus contains a single
  valid species, C. tashuikouensis, though several other species have been
  assigned to the genus. C. tashuikouensis is known from a single, incomplete
  postcranial skeleton, the holotype specimen. This specimen was found by a
  joint Sino-Soviet expedition to Inner Mongolia in rock layers coming from the
  Ulansuhai Formation. This indicates these fossils date to the Santonian or
  Campanian stages of the Cretaceous period, around 85.7 to 72.2 million years
  ago. However, the age of the Ulansuhai Formation is debated.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - arid
