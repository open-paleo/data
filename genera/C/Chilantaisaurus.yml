genus: Chilantaisaurus
parent: Avetheropoda
dispute:
  summary: >
    Chilantaisaurus tashuikouensis is a large, fragmentary theropod whose position is
    highly unstable. It has been recovered as a basal carcharodontosaurian or
    neovenatorid close to Neovenator (Benson et al., 2010; Carrano et al., 2012;
    Rauhut et al., 2024; Kellermann et al., 2025; Jones and Viola, 2026), as a
    non-megaraptoran tetanuran of uncertain affinity (Novas et al., 2013), and as a
    megaraptoran within Tyrannosauroidea (Naish and Cau, 2022). Because these
    hypotheses span Allosauroidea and Coelurosauria, it is placed conservatively at
    Avetheropoda incertae sedis.
  history:
    - date: "2026-07-01"
      note: Moved from the deprecated Neovenatoridae to Avetheropoda incertae sedis.
    - date: "2026-07-02"
      note: Confirmed placement at Avetheropoda incertae sedis; its allosauroid-versus-coelurosaur position remains unresolved.
pronunciation:
  phonetic: jee-LAHN-tie-SAWR-us
etymology: Named after Jilantai (also romanized as Chilantai) Salt Lake in Inner
  Mongolia, China, where the fossils were found, + Greek sauros ('lizard'),
  meaning 'Jilantai Salt Lake lizard'.
description: Chilantaisaurus is an extinct genus of large theropod dinosaur that
  lived in present-day China during the Late Cretaceous period. It was described
  by Chinese paleontologist Hu Show-Yung in 1964. The genus contains a single
  valid species, C. tashuikouensis, though several other species have been
  assigned to the genus. C. tashuikouensis is known from a single, incomplete
  postcranial skeleton, the holotype specimen. This specimen was found by a
  joint Sino-Soviet expedition to Inner Mongolia in rock layers coming from the
  Ulansuhai Formation. This indicates these fossils date to the Santonian or
  Campanian stages of the Cretaceous period, around 85.7 to 72.2 million years
  ago. However, the age of the Ulansuhai Formation is debated.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - arid
diagnostic_features:
  - Humerus massive and elongate, with humero-femoral ratio of 0.487, much
    greater than any known carnosaur
  - Ungual phalanx of digit I especially large, strongly and regularly curved,
    with concave proximal articular surface
  - Tibia shorter than femur, with tibio-femoral ratio of 0.80
  - Metatarsals short and stout relative to femur, not closely appressed, with
    unreduced metatarsal III shaft
