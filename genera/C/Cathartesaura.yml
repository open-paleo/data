genus: Cathartesaura
parent: Limaysaurinae
etymology: "From Cathartes (the New World vulture genus) + Greek saura ('lizard', feminine). The name also alludes to the turkey vulture Cathartes aura, whose Spanish name 'buitre' named the 'La Buitrera' locality where the fossils were found."
pronunciation:
  phonetic: ca-THAR-teh-SOR-uh
description: Cathartesaura is a genus of rebbachisaurid sauropod dinosaur from
  Late Cretaceous strata of the Huincul Formation, at the "La Buitrera"
  locality, in the Neuquén Basin of Río Negro Province, Argentina. The fossil
  remains, described by Gallina and Apesteguía in 2005, consist of a partial
  skeleton including vertebrae and limb bones. These were found at the base of
  the formation, which dates back to the Cenomanian and Turonian epochs, in
  mudstone and sandstone levels.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Posterior cervical vertebra with accessory lamina (AL2) arising from
    mid-length of prezygodiapophysial lamina and reaching the centrum
  - Anterior caudal transverse processes thin and wing-like, mostly supported by
    ventral bar framing a deep triangular fossa bounded by diapoprezygapophyseal
    and centroprezygapophyseal laminae
  - Anterior caudal neural spine lateral lamina formed by junction of
    spinoprezygapophyseal, lateral spinopostzygapophyseal, and spinodiapophyseal
    laminae (unique triple junction)
