genus: Calamosaurus
parent: Tyrannosauroidea
etymology: From Greek kalamos (κάλαμος) meaning 'reed' + Greek sauros (σαῦρος) meaning 'lizard'; overall meaning 'reed lizard', likely referring to the slender, hollow vertebrae.
pronunciation:
  phonetic: kal-uh-mo-SOR-us
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Cervical vertebrae shorter than those of Coelurus (C. daviesi)
  - All cervicals probably opisthocœlous (vs. amphicœlous middle and posterior
    cervicals in Coelurus)
  - Cervical vertebrae with pneumatic foramina, indicating highly pneumatic
    skeleton
  - Characteristic brown coloration distinguishing them from black-stained
    Coelurus daviesi and Aristosuchus pusillus types
