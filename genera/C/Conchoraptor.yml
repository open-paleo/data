genus: Conchoraptor
parent: Heyuanninae
etymology: From Greek konche ('conch shell') + Latin raptor ('plunderer' or 'thief'), meaning 'conch plunderer', suggesting the animal may have fed on mollusks.
description: Conchoraptor is a genus of oviraptorid dinosaurs that lived in Asia
  during the Late Cretaceous epoch, about 70 million years ago. It is known from
  the Barun Goyot and possibly the Nemegt formation of Mongolia.
diet: omnivore
locomotion: bipedal
