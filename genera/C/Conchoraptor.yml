genus: Conchoraptor
parent: Heyuanninae
pronunciation:
  phonetic: KONG-ko-RAP-tor
etymology: From Greek konche ('conch shell') + Latin raptor ('plunderer' or
  'thief'), meaning 'conch plunderer', suggesting the animal may have fed on
  mollusks.
description: Conchoraptor is a genus of oviraptorid dinosaurs that lived in Asia
  during the Late Cretaceous epoch, about 70 million years ago. It is known from
  the Barun Goyot and possibly the Nemegt formation of Mongolia.
diet: omnivore
locomotion: bipedal
paleoenvironment:
  - arid
diagnostic_features:
  - Cranium lacking a pronounced crest
  - Premaxilla with a vertical anterior margin
  - Maxilla with a large accessory antorbital fenestra
  - Nasals with three dorsal fenestrae per side
  - Postorbital extending nearly to the bottom of the orbit
  - Parietal with a low sagittal crest
  - Enlarged first manual digit
appearance:
  features:
    - keratinous beak
  integument: feathered
  evidence: direct
