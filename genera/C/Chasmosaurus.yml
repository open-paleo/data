synonyms:
  - name: Mojoceratops
    type: junior subjective
    reason: Initially synonymized with Chasmosaurus based on overlapping diagnostic
      features; recent fieldwork in Dinosaur Provincial Park suggests
      Mojoceratops may yet prove to be a valid genus.
  - name: Eoceratops
    type: junior subjective
    reason: Originally described as Monoclonius canadensis and later re-erected as
      Eoceratops; the material is now treated as morphological variation within
      Chasmosaurus.
erected_in: lambe1914b
species:
  - name: Chasmosaurus belli
    etymology: Named for collector Walter Bell, from whose discovery area the
      holotype parietal bone was recovered.
    status: valid
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Campanian
    location:
      country: CA
      locality: Red Deer River, between Berry Creek and Dead Lodge Cañon
      region: CA-AB
      group: Belly River
      notes: Lambe (1902) gives the type only as "from Red Deer river", from
        collections made in the Belly River series between Berry Creek and Dead
        Lodge Cañon; no source read places it in the Oldman or the Dinosaur
        Park Formation.
    type_specimen:
      specimen_id:
        - NMC 491
      specimen_type: holotype
      institution: CMN
      material: Part of the coalesced parietals of the frill.
      completeness: fragmentary
    size:
      length_m:
        min: 4.3
        max: 4.8
      weight_kg:
        min: 1500
        max: 2000
    synonyms:
      - name: Protorosaurus belli
        type: reassigned
        reason: In January 1914 Lambe moved Monoclonius belli to his new genus
          Protorosaurus; the name was preoccupied, and the next month he replaced
          it with Chasmosaurus.
    erected_as: Monoclonius belli
    erected_in: lambe1902a
references:
  - id: lambe1902a
    notes: Names the species, as Monoclonius belli, on the coalesced parietals
      of a frill from the Red Deer River.
  - id: lambe1914b
    notes: Replaces the preoccupied Protorosaurus with Chasmosaurus.
  - id: paul2024a
    notes: Source of the appearance features.
