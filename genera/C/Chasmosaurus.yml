genus: Chasmosaurus
parent: Chasmosaurinae
pronunciation:
  ipa: /ˌkæzmoʊˈsɔːrəs/
  phonetic: KAZ-moh-SOR-uhs
etymology: "From Greek chasma meaning 'opening/hollow/gulf' and Greek sauros
  meaning 'lizard'. Full meaning: 'opening lizard', referring to the large
  fenestrae (openings) in its frill."
description: Chasmosaurus is a genus of ceratopsid dinosaur from the Late
  Cretaceous Period in North America. Its given name means 'opening lizard',
  referring to the large openings (fenestrae) in its frill (Greek chasma,
  meaning 'opening', 'hollow', or 'gulf'; and sauros, meaning 'lizard'). With a
  length of 4.3-4.8 meters (14.1-15.7 ft) and a weight of 1.5-2 tonnes (1.7-2.2
  short tons)-or anywhere from 2,200 to nearly 5,000 lbs-Chasmosaurus was of a
  slightly smaller to "average" size, especially when compared to larger
  ceratopsids (such as Triceratops, which were about the size of an African bush
  elephant).
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Skull broadly triangular in superior aspect with a narrow, abbreviated
    facial portion and a broad, greatly extended posterior crest ending squarely
    behind
  - Coalesced parietals forming a slender framework enclosing large
    sub-triangular fontanelles so large as to reduce posterior two-thirds of
    parietals to a mere slender framework
  - Squamosals very long and narrow with a scalloped free border bearing low
    sub-conical epoccipitals
  - Postfrontal fontanelle present, long and narrow, extending between the
    supraorbital horn-cores
  - Supraorbital horn-cores small and upright, broadly oval in cross section
    near the base with greater diameter fore and aft
  - Parietal crest remarkably flat, extending backward and laterally in almost a
    horizontal plane, with length to breadth ratio approximately 7 to 8
appearance:
  features:
    - nasal horn
    - brow horns
    - neck frill
    - epoccipitals
  integument: scaled
  evidence: direct
