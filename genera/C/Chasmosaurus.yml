synonyms:
  - name: Mojoceratops
    type: junior subjective
    reason: Initially synonymized with Chasmosaurus based on overlapping diagnostic
      features; recent fieldwork in Dinosaur Provincial Park suggests
      Mojoceratops may yet prove to be a valid genus.
  - name: Eoceratops
    type: junior subjective
    reason: Originally described as Monoclonius canadensis and later re-erected as
      Eoceratops; the material is now treated as morphological variation within
      Chasmosaurus.
