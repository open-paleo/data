genus: Cetiosaurus
parent: Gravisauria
etymology: From Greek keteios/ketos ('sea monster', later 'whale') + sauros
  ('lizard'), meaning 'whale lizard'. Named by Richard Owen who initially
  believed it was a large marine creature.
pronunciation:
  phonetic: see-TIE-o-SAWR-us
  ipa: /ˌsiːtioʊˈsɔːrəs, ˌsiːʃi-/
description: Cetiosaurus is a genus of herbivorous sauropod dinosaur from the
  Middle Jurassic Period, living about 171 to 165 million years ago during the
  Bajocian and Bathonian ages in what is now Britain and probably France.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - coastal
  - lacustrine
  - marine
  - wetland
diagnostic_features:
  - Caudal vertebrae with slightly concave articular surfaces and posterior half
    of centrum uncovered by neural arch
  - Transverse processes originate close to the neurapophysis rather than from
    the middle of the side of the centrum
  - Slender elongated terminal caudal vertebrae (cylindrical, not compressed or
    triangular as in Iguanodon or Cetacea)
  - Vertebral centra with coarse spongy/cancellous texture throughout, lacking
    the remarkable medullary cavity of Poikilopleuron
  - Long bones entirely cancellous with no medullary cavity, indicating aquatic
    habits; articular surfaces covered with large tubercles for thick cartilages
  - Ungueal phalanx slightly curved, obliquely compressed, with shallow concave
    trochlear surface; less compressed and less curved than Iguanodon
