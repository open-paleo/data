genus: Cetiosaurus
parent: Cetiosauridae
etymology: From Greek keteios/ketos ('sea monster', later 'whale') + sauros
  ('lizard'), meaning 'whale lizard'. Named by Richard Owen who initially
  believed it was a large marine creature.
pronunciation:
  phonetic: see-TIE-o-SAWR-us
  ipa: /ˌsiːtioʊˈsɔːrəs, ˌsiːʃi-/
description: Cetiosaurus is a genus of herbivorous sauropod dinosaur from the
  Middle Jurassic Period, living about 171 to 165 million years ago during the
  Bajocian and Bathonian ages in what is now Britain and probably France.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - coastal
  - lacustrine
  - marine
  - wetland
diagnostic_features:
  - Posterior cervical and anterior dorsal neural spines symmetrically
    pyramid-shaped, with laminae nearly equal about both the sagittal and
    transverse planes
  - Spinodiapophyseal lamina lost (or completely fused with the
    spinopostzygapophyseal lamina) on all dorsal neural spines
  - Distal caudal centra with tongue-like projections at the dorsal margin of the
    articular faces, extending the floor of the neural canal anteroposteriorly
  - Distal shafts of the anterior chevrons anteroposteriorly compressed, not
    tapering to a transversely flattened distal end
  - A triangular hollow, bounded dorsally by a horizontal ridge, on the lateral
    surface of the base of the pubic process of the ilium
