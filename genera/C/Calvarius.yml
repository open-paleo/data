genus: Calvarius
parent: Styracosterna
etymology: "Named for the type locality Serrat del Calvari (Hill of Calvary) in Catalonia, Spain; further derived from Catalan 'calvari' meaning 'suffering', referencing the genus's proximity to the K-Pg extinction event. The species name is from Latin 'rapidus' meaning 'fast', referring to inferred cursorial habits."
description: Calvarius is an extinct genus of styracosternan ornithopod from the
  Late Cretaceous (Maastrichtian age) Talarn Formation of Spain. The genus
  contains a single species, Calvarius rapidus, known from a single metatarsal.
  The slender morphology of this bone may indicate Calvarius had a cursorial
  (adapted to run) ecology, in contrast to its slower-moving relatives.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
diagnostic_features:
  - Metatarsal IV maximum length/mediolateral width at mid-length ratio greater
    than nine.
  - Segment distal to medial flange longer than combined length of medial flange
    and proximal extent of metatarsal.
  - Prominent medial flange that is dorsoplantarly compressed and with a
    prominent plantar component in its medioplantar projection.
  - Relatively enlarged medially projected dorsomedial corner of distal surface.
