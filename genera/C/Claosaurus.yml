genus: Claosaurus
parent: Hadrosauromorpha
pronunciation:
  phonetic: KLAY-uh-SOR-uhs
  ipa: /ˌkleɪəˈsɔːrəs/
etymology: "From Greek klao (κλάω) meaning 'broken' and Greek sauros (σαῦρος) meaning 'lizard'. Full meaning: 'broken lizard', referring to the unusual position of the fossils when discovered."
description: Claosaurus is a genus of hadrosauroid dinosaur that lived during
  the Late Cretaceous Period (Santonian-Campanian) of what is now North America.
  The type and only known valid species is Claosaurus agilis. Traditionally
  classified as an early member of the family Hadrosauridae, a 2008 analysis
  found Claosaurus to be outside of the clade containing Hadrosaurus and other
  hadrosaurids, making it the closest non-hadrosaurid relative of true
  hadrosaurids within the clade Hadrosauromorpha.
dispute:
  summary: >
    Claosaurus agilis has at times been called a basal hadrosaurid, but
    recent analyses consistently place it among the derived
    non-hadrosaurid hadrosauromorphs, outside Hadrosauridae (Tsogtbaatar
    and others, 2019; Jones, 2026).
  history:
    - date: "2026-06-27"
      note: Placed at Hadrosauromorpha; the historical basal-hadrosaurid
        interpretation reflected, not adopted.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - marine
diagnostic_features:
  - Only a single row of teeth in use at one time (unlike Hadrosaurus-type
    multiple rows)
  - Cervical vertebrae very short and strongly opisthocolian
  - Fore limbs very small
  - Seven vertebrae in the sacrum, firmly coossified
  - Caudal vertebrae longer than wide, tail quite elongate
  - Ilium intermediate in form between Hadrosaurus and Stegosaurus, with very
    slender and elongate portion in front of acetabulum
appearance:
  integument: scaled
  evidence: inferred
