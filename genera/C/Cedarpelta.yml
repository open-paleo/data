genus: Cedarpelta
parent: Ankylosauridae
pronunciation:
  phonetic: SEE-dar-PEL-tuh
etymology: Named for the Cedar Mountain Formation of Utah where the fossils were found, combined with Greek 'pelta' meaning 'shield', referring to its ankylosaurid armor.
description: Cedarpelta is an extinct genus of basal ankylosaurid dinosaur from
  Utah that lived during the Early Cretaceous period in what is now the
  Mussentuchit Member of the Cedar Mountain Formation. The type and only species, Cedarpelta
  bilbeyhallorum, is known from multiple specimens including partial skulls and
  postcranial material. It was named in 2001 by Kenneth Carpenter, James
  Kirkland, Don Burge, and John Bird. Cedarpelta has an estimated length of 7
  metres (23 feet) and weight of 5 tonnes (11,023 lbs). The skull of Cedarpelta
  lacks extensive cranial ornamentation and is one of the only known ankylosaurs
  with individual skull bones that are not completely fused together.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
