genus: Camarillasaurus
parent: Spinosauridae
placement: incertae sedis
dispute:
  summary: >
    Camarillasaurus cirugedae was originally described as a basal ceratosaur
    (Sánchez-Hernández and Benton, 2014), but that reading is superseded: recent
    analyses recover it as a spinosaurid. Its subfamily placement is unstable —
    recovered as a spinosaurine by Barker et al. (2021) and Rauhut et al. (2025,
    as a derived spinosaurine near Spinosaurus), but treated as a basal
    spinosaurid, possibly outside both subfamilies, by Santos-Cubedo et al.
    (2023). Spinosauridae is the least-inclusive clade the current hypotheses
    accept.
  history:
    - date: "2026-07-01"
      note: Placed at Spinosaurinae following the recent reassessments; the original ceratosaurian identification is superseded.
    - date: "2026-07-09"
      note: Broadened to Spinosauridae incertae sedis. The spinosaurid identity
        is well supported but the subfamily placement is unstable (spinosaurine
        versus basal spinosaurid outside both subfamilies), so the conservative
        shared node is adopted.
etymology: From Camarillas (the village of Camarillas in Teruel Province, Spain, near where fossils were found) + Greek sauros (σαῦρος) meaning 'lizard'; overall meaning 'Camarillas lizard'.
pronunciation:
  phonetic: cam-a-REE-yuh-SOR-us
description: Camarillasaurus is an extinct genus of spinosaurid theropod
  dinosaurs from the Early Cretaceous period (Barremian) of Camarillas, Teruel
  Province, in what is now northeastern Spain. Described in 2014, it was
  originally identified as a ceratosaurian theropod, but later studies suggested
  affinities to the Spinosauridae. Camarillasaurus is one of several spinosaurid
  taxa known from the Iberian peninsula, the others being Iberospinus,
  Protathlitis, Baryonyx, Riojavenatrix, and Vallibonavenatrix.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Extremely broad tibia proximal end with anteroposterior/mediolateral axis
    ratio of 2.8, the highest of any theropod
  - Deep narrow longitudinal groove placed anterolaterally to the crista
    fibularis on the medial tibial surface, giving the tibial shaft a g-shaped
    cross section
  - Chevron with a deep broad longitudinal groove along the full length of the
    shaft on both anterior and posterior sides, arising from a fossa below the
    haemal canal
