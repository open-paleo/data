genus: Changyuraptor
parent: Microraptorinae
etymology: From Chinese 'chang' meaning 'long', 'yu' meaning 'feather', and Latin 'raptor' meaning 'thief' or 'seizer', referring to its long feathers.
pronunciation:
  phonetic: JYAHNG-yoo-RAP-tor
description: Changyuraptor is a genus of "four-winged", predatory dinosaurs. It
  is known from a single fossil specimen representing the species Changyuraptor
  yangi, which was discovered from Early Cretaceous (125 million year old)
  deposits in Liaoning Province, China. C. yangi belongs to the group of
  dromaeosaurid theropod dinosaurs called the Microraptoria.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
  - forested
diagnostic_features:
  - Forelimb proportionally much longer relative to hindlimb than in other
    microraptorines (forelimb 96% of hindlimb length including digits)
  - Humerus much longer (420%) than ulna, as opposed to Microraptor zhaoianus in
    which these bones are more comparable in length
  - Well-developed semi-lunate carpal covering all of proximal ends of
    metacarpals I and II, as opposed to the small semi-lunate carpal covering
    about half the base in most other microraptorines
  - Fewer caudal vertebrae (estimated 22) than Microraptor zhaoianus (25-26) and
    Tianyuraptor ostromi (28)
  - Rectrices significantly longer than in other microraptorines; constitute the
    longest feathers recorded in any non-avian theropod
  - Midshaft of metatarsal IV significantly broader than that of metatarsal III
    or metatarsal II
appearance:
  features:
    - feathered wings
    - hindlimb feathers
    - feathered tail
  integument: feathered
  evidence: direct
