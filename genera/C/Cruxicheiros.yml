genus: Cruxicheiros
parent: Tetanurae
etymology: From Latin crux ('cross') + Greek cheir ('hand'), meaning 'cross hand', in reference to the Cross Hands Quarry in Warwickshire, England where the fossils were discovered.
pronunciation:
  phonetic: CRU-ee-KEE-ross
description: Cruxicheiros is a genus of theropod dinosaur which lived in the
  Middle Jurassic of England. The type species is C. newmanorum, described by
  Roger Benson and Jonathan Radley in 2010.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - coastal
diagnostic_features:
  - Proximomedially inclined ridge within the trochanteric fossa of the femur,
    running nearly parallel to the posterior flange of the femoral caput; absent
    in all other known basal theropods.
  - Prominent posterior flange of the femoral caput extending further
    posteriorly than the posterior surface of the femoral head.
  - Dorsal neural spines with relatively low dorsoventral height (approximately
    equal in length to transverse processes) combined with prominent rugose
    ridges and transversely expanded dorsal ends.
  - Vertebrae with more numerous, smaller internal pneumatic chambers (not the
    two large chambers divided by a midline septum typical of megalosauroids).
  - Fused and swollen scapulocoracoid suture.
