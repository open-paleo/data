genus: Choconsaurus
parent: Titanosauria
etymology: Named after Villa El Chocón, the locality in Neuquén Province, Argentina where the holotype was found, + Greek sauros ('lizard'), meaning 'El Chocón lizard'.
description: Choconsaurus is an extinct genus of herbivorous sauropod dinosaur
  belonging to the group Titanosauriformes, which lived in the area of
  present-day Argentina at the end of the Cretaceous.
dispute:
  summary: >
    Placed within Titanosauria as incertae sedis. The describing analysis (Simon
    et al., 2018) recovered Choconsaurus as a non-eutitanosaurian (basal)
    titanosaur, but reported near-equal support for two positions, a basal
    titanosaur versus a non-titanosaurian (derived) somphospondylan, so its
    membership in Titanosauria is not secure. It is parked at the base of
    Titanosauria following the preferred result.
  history:
    - date: "2026-06-30"
      note: >
        Placed at Titanosauria incertae sedis; the describing analysis found
        near-equal support for a non-titanosaurian somphospondylan position.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Small notch on the dorsal margin of the posterior articular surface of the
    cervical centra
  - Dorsal neural spine with subparallel lateral margins in anterior and
    posterior views
  - Dorsal vertebrae with a rough and wide prespinal lamina extending for nearly
    the entire length of the neural spine
  - Mid- and posterior dorsal vertebrae with accessory laminae placed between
    the posterior centrodiapophyseal lamina and the accessory posterior
    centrodiapophyseal lamina
  - Anterior caudal vertebrae bearing a hyposphene
  - Scapular blade with rounded expansion on acromial side and acromial process
    nearly at the midpoint of the scapular body
