genus: Carnotaurus
parent: Furileusauria
pronunciation:
  phonetic: KAHR-no-TAWR-us
  ipa: /ˌkɑːrnoʊˈtɔːrəs/
etymology: "From Latin caro/carnis meaning 'flesh/meat' and Latin taurus meaning
  'bull'. Full meaning: 'meat-eating bull' or 'flesh bull', referring to its
  bull-like horns and carnivorous diet."
description: Carnotaurus is a genus of theropod dinosaur that lived in South
  America during the Late Cretaceous period, between 69 and 66 million years
  ago. The only species is Carnotaurus sastrei. Known from a single
  well-preserved skeleton, it is one of the best-understood theropods from the
  Southern Hemisphere. The skeleton, found in 1984, was uncovered in the Chubut
  Province of Argentina from rocks of the La Colonia Formation. Carnotaurus is a
  derived member of the Abelisauridae, a group of large theropods that occupied
  the large predatorial niche in the southern landmasses of Gondwana during the
  late Cretaceous. Within the Abelisauridae, the genus is often considered a
  member of the Brachyrostra, a clade of short-snouted forms restricted to South
  America.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - coastal
appearance:
  features:
    - brow horns
    - reduced forelimbs
  integument: scaled
  evidence: direct
diagnostic_features:
  - Skull short and tall with a deep, narrow snout and prominent supraorbital
    (frontal) horns
  - Orbit divided into two parts, an upper rounded section projected
    anterolaterally for the eye and a lower laterally projected section
  - Supratemporal opening small, with a high posterior wall formed by the parietal
    and squamosal and a low lateral border
  - Forelimbs greatly reduced, with very short, stout radius and ulna that bear
    large convex distal ends
