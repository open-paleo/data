genus: Chienkosaurus
parent: Tetanurae
etymology: lizard of Jiange County
description: Chienkosaurus is a dubious genus of carnivorous theropod dinosaur
  from the Late Jurassic Kuangyuan Series of China. It was probably related to
  Szechuanosaurus.
diet: carnivore
locomotion: bipedal
diagnostic_features:
  - Teeth thick and sharply pointed with fine denticulations on both anterior
    and posterior sides
  - Anterior denticulations finer than posterior denticulations (ca. 1/3 mm vs.
    ca. 1 3/4 mm long)
  - Both rows of denticulations supported by prominent ridges, with the anterior
    ridge stronger
  - Denticulations begin at tip of tooth and stop near the base on complete
    specimens
  - Premaxillary teeth relatively depressed with lingual side more flat than
    labial side (D-shaped cross-section)
