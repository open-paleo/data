genus: Chienkosaurus
parent: Tetanurae
placement: incertae sedis
dispute:
  summary: >
    Chienkosaurus ceratosauroides is a nomen dubium based on four isolated teeth,
    three of which have been shown to be non-theropod, and it has often been treated
    as a synonym of Szechuanosaurus. It is placed conservatively at Tetanurae incertae
    sedis.
  history:
    - date: "2026-07-02"
      note: Placed at Tetanurae incertae sedis; regarded as a nomen dubium.
etymology: lizard of Jiange County
description: Chienkosaurus is a dubious genus of carnivorous theropod dinosaur
  from the Late Jurassic of Sichuan, China, known from teeth found in the beds
  Young (1942) called the Kuangyuan Series, at Locality 47 south of Guangyuan.
  It was probably related to Szechuanosaurus.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "38601"
  - source: wikidata
    id: Q3667794
species:
  - name: Chienkosaurus ceratosauroides
    etymology: "From the genus name *Ceratosaurus* and Greek '-oides'
      (resembling); meaning 'resembling Ceratosaurus'."
    status: nomen dubium
    type_species: true
    period:
      name:
        - Late Jurassic
    location:
      country: CN
      locality: Locality 47 (Chentsianyen escarpment), south of Kuangyuan
      region: CN-SC
      notes: >
        Young (1942) gives Locality 47 as "belonging to the top part of the
        Kuangyuan Series and immediately below the Chentsianyen conglomerate".
        Young and colleagues (1943) place the Kuangyuan Series concordantly
        above the Tsienfuyen Series and date the two together to "Upper
        Jurassic time (Purbeckian)", with the overlying conglomerate
        "tentatively regarded as of Cretaceous in age by its stratigraphic
        position". Dong and colleagues (1983) write that the region's red
        clastics "were formerly referred to as the Guangyuan Group", and that
        Chienkosaurus and Szechuanosaurus "are derived from the same
        stratigraphic position, the Guangyuan Group". Li and
        colleagues (2011) list the species in the upper Shaximiao Formation,
        in a basin-wide faunal list.
    type_specimen:
      specimen_id: [IVPP V237]
      specimen_type: holotype
      institution: IVPP
      material: Four isolated teeth.
      completeness: fragmentary
    erected_in: young1942a
references:
  - id: young1942a
  - id: young1943a
    notes: Places the Kuangyuan Series concordantly above the Tsienfuyen Series, below a conglomerate tentatively dated Cretaceous, and dates the two series Upper Jurassic.
  - id: dong1983a
    notes: Places Chienkosaurus and Szechuanosaurus in the same stratigraphic position, the Guangyuan Group, and synonymizes the one carnosaur tooth with Szechuanosaurus.
  - id: li2011a
    notes: Lists the species in the upper member of the Shaximiao Formation in a basin-wide faunal list, without discussing the Guangyuan locality.
