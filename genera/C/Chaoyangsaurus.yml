genus: Chaoyangsaurus
parent: Chaoyangsauridae
pronunciation:
  phonetic: chow-yahng-SAWR-us
etymology: Named after Chaoyang, the region in Liaoning Province, China where fossils were found, + Greek sauros ('lizard'), meaning 'Chaoyang lizard'.
description: Chaoyangsaurus is a genus of marginocephalian dinosaur from the
  Late Jurassic (about between 150.8 and 145.5 million years ago) of China.
  Chaoyangsaurus belonged to the Ceratopsia (Greek for "horned faces").
  Chaoyangsaurus, like all ceratopsians, was primarily a herbivore.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Quadratojugal overlaps the posterior (caudal) surface of the quadrate shaft
    rather than its lateral surface.
  - Quadrate shaft lacks a broad lateral surface; lateral margin is very thin
    anteroposteriorly with no anterior ramus.
  - Posteroventral margin of the quadrate shaft is convex mediolaterally, not
    concave or planar as in other ornithischians.
  - Dorsal margin of the lower jaw extends nearly horizontally from the coronoid
    process to the jaw articulation, with ventral margin curving posterodorsally
    along the angular region.
  - A distinct ridge separates the planar lateral and ventral surfaces of the
    angular, which meet at approximately a right angle.
