genus: Caseosaurus
parent: Herrerasauria
dispute:
  summary: >
    Caseosaurus crosbyensis was revalidated as a herrerasaurian with an
    emended diagnosis by Baron and Williams (2018), who could not resolve
    its position within Herrerasauria; it is regarded by some workers as a
    nomen dubium.
  history:
    - date: "2026-06-30"
      note: >
        Placed at Herrerasauria, the least-inclusive clade its describers
        support.
pronunciation:
  ipa: /ˌkeɪzioʊˈsɔːrəs/
  phonetic: KAY-zee-oh-SOR-uhs
etymology: "Named after Ermine Cowles Case, the scientist who discovered it, combined with Greek sauros meaning 'lizard'. Full meaning: 'Case's lizard'."
description: Caseosaurus is a genus of saurischian dinosaur that lived
  approximately 221.5 to 212 million years ago during the latter part of the
  Triassic Period in what is now Texas, North America. It was a small,
  lightly-built, bipedal, ground-dwelling carnivore, and could grow up to 2 m
  (6.6 ft) long.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Ilium with an elongate and dorsoventrally narrow posterior blade
  - Narrow ridge on the lateral margin extending from the anterodorsal margin of
    the acetabulum to the anterodorsal anterior spine
  - Highly reduced brevis fossa
  - Semicircular margin dorsal to the acetabulum
appearance:
  integument: unknown
