genus: Caseosaurus
parent: Herrerasauridae
pronunciation:
  ipa: /ˌkeɪzioʊˈsɔːrəs/
  phonetic: KAY-zee-oh-SOR-əs
description: Caseosaurus is a genus of saurischian dinosaur that lived
  approximately 221.5 to 212 million years ago during the latter part of the
  Triassic Period in what is now Texas, North America. It was a small,
  lightly-built, bipedal, ground-dwelling carnivore, and could grow up to 2 m
  (6.6 ft) long.
diet: carnivore
