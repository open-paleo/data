genus: Caseosaurus
parent: Herrerasauria
dispute:
  summary: >
    Caseosaurus crosbyensis was revalidated as a herrerasaurian with an
    emended diagnosis by Baron and Williams (2018), who could not resolve
    its position within Herrerasauria; it is regarded by some workers as a
    nomen dubium.
pronunciation:
  ipa: /ˌkeɪzioʊˈsɔːrəs/
  phonetic: KAY-zee-oh-SOR-uhs
etymology: "Named after Ermine Cowles Case, the scientist who discovered it, combined with Greek sauros meaning 'lizard'. Full meaning: 'Case's lizard'."
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Ilium with an elongate and dorsoventrally narrow posterior blade
  - Narrow ridge on the lateral margin extending from the anterodorsal margin of
    the acetabulum to the anterodorsal anterior spine
  - Highly reduced brevis fossa
  - Semicircular margin dorsal to the acetabulum
appearance:
  integument: unknown
identifiers:
  - source: pbdb
    id: "66660"
species:
  - name: Caseosaurus crosbyensis
    etymology: "A Latinized rendering of Crosby County in Texas, the site of the holotype's discovery."
    pronunciation:
      phonetic: kroz-bee-EN-sis
    status: disputed
    type_species: true
    period:
      name:
        - Late Triassic
      stage:
        - Carnian
        - Norian
    location:
      country: US
      region: US-TX
      formation: Tecovas
    size:
      length_m:
        min: 2
        max: 2
      weight_kg:
        min: 50
        max: 50
    erected_in: hunt1998a
    type_specimen:
      specimen_id: [UMMP 8870]
      specimen_type: holotype
      institution: UMMP
      material: Isolated hip bone (ilium), ~141 mm
      completeness: fragmentary
references:
  - id: hunt1998a
  - id: baron2018c
    notes: Re-evaluated Caseosaurus as a herrerasaurian with an emended diagnosis.
  - id: marsh2019a
    notes: Treats Caseosaurus crosbyensis as a nomen dubium, following the
      apomorphy-based identification of its holotype to Dinosauriformes.
  - id: novas2021a
    notes: Follows the nomen dubium reading while accepting herrerasaur
      affinity for the material.
