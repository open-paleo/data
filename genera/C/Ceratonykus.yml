genus: Ceratonykus
parent: Parvicursorinae
etymology: From Greek keras/keratos ('horn') + onyx/nykos ('claw'), meaning 'horned claw'.
description: Ceratonykus is a monospecific genus of alvarezsaurid dinosaur from
  Mongolia that lived during the Late Cretaceous (Maastrichtian) in what is now
  the Barun Goyot Formation. The type and only species, Ceratonykus oculatus, is
  known from a fragmentary skeleton, including an incomplete skull, of an adult
  individual. It was named and described in 2009 by Vladimir Alifanov and
  Rinchen Barsbold. Its describers questioned the traditional placement of
  alvarezsaurs in Theropoda, instead suggesting they were ornithischians, but
  this has not been accepted since. Ceratonykus has an estimated length of 75
  centimetres (2.46 feet) and weight of 760 grams (1.68 pounds). It has been
  considered as a possible junior synonym of Parvicursor.
diet: carnivore
locomotion: bipedal
