genus: Ceratonykus
parent: Parvicursorinae
dispute:
  summary: >
    Ceratonykus oculatus is consistently recovered as a parvicursorine
    alvarezsaurid (Alifanov and Barsbold, 2009; Kubo et al., 2023; Meso et al.,
    2024). Averianov and Lopatin (2022) argued that it is very similar to
    Parvicursor remotus and is likely a junior synonym of it; this synonymy is
    not followed by Kubo et al. (2023) or by the reference-work treatment of
    Jones (2026), which retain both as valid genera.
  history:
    - date: "2026-07-01"
      note: Placed at Parvicursorinae following the prevailing analyses (P2); retained as valid pending resolution of the proposed synonymy with Parvicursor.
etymology: From Greek keras/keratos ('horn') + onyx/nykos ('claw'), meaning 'horned claw'.
pronunciation:
  phonetic: suh-RAH-toe-NY-kus
description: Ceratonykus is a monospecific genus of alvarezsaurid dinosaur from
  Mongolia that lived during the Late Cretaceous (Maastrichtian) in what is now
  the Barun Goyot Formation. The type and only species, Ceratonykus oculatus, is
  known from a fragmentary skeleton, including an incomplete skull, of an adult
  individual. It was named and described in 2009 by Vladimir Alifanov and
  Rinchen Barsbold. Its describers questioned the traditional placement of
  alvarezsaurs in Theropoda, instead suggesting they were ornithischians, but
  this has not been accepted since. Ceratonykus has an estimated length of 75
  centimeters (2.46 feet) and weight of 760 grams (1.68 pounds). It has been
  considered as a possible junior synonym of Parvicursor.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - arid
diagnostic_features:
  - Femora strongly curved and nearly half as long as tibiotarsus (shorter than
    in all other parvicursorids)
  - Tarsometatarsals 3.5 times as long as third metatarsals (third metatarsals
    more reduced than in other parvicursorids)
  - Carpometacarpus bears spikelike bones (interpreted as possible ungual
    phalanges of additional digits)
  - Natural endocast lacks vertical flexure at brain floor; optic lobes
    displaced ventrally; acoustic tubercles unusually wide
  - Deep proximodorsal notch between second and fourth metatarsals; dorsal and
    palmar surfaces of these bones ridgelike with deep grooves between them
  - Frontals each nearly four times as long as wide; narrowing rostrally into a
    narrow wedge; prefrontals adjoining each other medially
