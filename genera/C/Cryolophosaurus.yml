genus: Cryolophosaurus
parent: Neotheropoda
placement: incertae sedis
dispute:
  summary: >
    Cryolophosaurus ellioti was originally described as an allosaurid and has been
    recovered as a basal tetanuran in some analyses, but recent work places it
    outside Averostra and Tetanurae as a non-averostran neotheropod in a grade with
    Dilophosaurus and Zupaysaurus (Nesbitt et al., 2009; Marsh and Rowe, 2020; Jones
    and Viola, 2026). It is placed conservatively at Neotheropoda incertae sedis.
  history:
    - date: "2026-07-02"
      note: Moved from Tetanurae to Neotheropoda incertae sedis following the prevailing view that it is a non-averostran (pre-tetanuran) neotheropod.
pronunciation:
  ipa: /ˌkraɪəˌloʊfəˈsɔːrəs/
  phonetic: KRY-uh-LOH-fuh-SAWR-uhs
etymology: "From Greek kryos, 'cold/icy/frozen', + Greek lophos, 'crest', + Greek sauros, 'lizard'; means 'frozen-crested lizard', referring to its discovery in Antarctica and its distinctive head crest"
description: Cryolophosaurus is a genus of large theropod dinosaur known from
  only a single species, Cryolophosaurus ellioti, from the Early Jurassic of
  Antarctica. It was one of the largest theropods of the Early Jurassic, with
  the subadult, being estimated to have reached 6-7 meters (20-23 ft) long and
  weighed 350-465 kilograms (772-1,025 lb).
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - polar
diagnostic_features:
  - Nasals extend posteriorly as high ridges that join with a large furrowed
    lacrimal crest
  - Frontal crest runs approximately perpendicular to the length of the skull
    and curves anteriorly as it rises, with furrowed surface bearing small
    vertical projections along the dorsal surface
  - Orbital horn fused to the crest on each side
  - Jugal crosses the lower lateral temporal opening and sutures with the
    squamosal, splitting the opening into two parts
  - Pneumatic lacrimal present but lacks the large lacrimal opening typical of
    larger carnosaurian tetanurans
appearance:
  features:
    - solid cranial crest
  integument: scaled
  evidence: inferred
