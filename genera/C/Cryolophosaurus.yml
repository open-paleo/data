genus: Cryolophosaurus
parent: Tetanurae
pronunciation:
  ipa: /ˌkraɪəˌloʊfəˈsɔːrəs/
  phonetic: KRY-ə-LOH-fə-SAWR-əs
etymology: "From Greek kryos, 'cold/icy/frozen', + Greek lophos, 'crest', + Greek sauros, 'lizard'; means 'frozen-crested lizard', referring to its discovery in Antarctica and its distinctive head crest"
description: Cryolophosaurus is a genus of large theropod dinosaur known from
  only a single species, Cryolophosaurus ellioti, from the Early Jurassic of
  Antarctica. It was one of the largest theropods of the Early Jurassic, with
  the subadult, being estimated to have reached 6–7 metres (20–23 ft) long and
  weighed 350–465 kilograms (772–1,025 lb).
diet: carnivore
locomotion: bipedal
