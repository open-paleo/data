    category: pathology
    significance: Nearly complete articulated skeleton preserving a complete tail
      with pathologies in thirteen vertebrae, including spina bifida in two
      vertebrae, the first reported example of this condition in dinosaurs, plus
      osteoarthritis and five pathologically fused caudal vertebrae.
    discovered:
      year: 1992
      by: Jeffrie Parker and colleagues
    references:
