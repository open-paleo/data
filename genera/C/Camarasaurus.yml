synonyms:
  - name: Morosaurus
    type: junior subjective
    reason: Now widely recognized as indistinguishable from Camarasaurus.
  - name: Uintasaurus
    type: junior subjective
    reason: U. douglassi was found to be indistinguishable from Camarasaurus lentus
      and is now treated as a junior synonym.
  - name: Cathetosaurus
    type: possible subjective
    reason: Erected by Jensen (1988) for C. lewisi and synonymized with
      Camarasaurus by McIntosh et al. (1996); some workers have since argued for
      its resurrection as a distinct genus.
