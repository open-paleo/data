  - name: Camarasaurus grandis
    etymology: From Latin 'grandis' meaning 'large' or 'great', referring to the
      animal's size.
    status: valid
    type_species: false
    period:
      name:
        - Late Jurassic
      stage:
        - Kimmeridgian
        - Tithonian
      from_ma: 154.8
      to_ma: 145
    location:
      country: US
      region: Wyoming
      formation: Morrison
      locality: Marsh Quarry 1, Como Bluff
    holotype:
      specimen_id:
        - YPM 1901
      specimen_type: holotype
      institution: YPM
      material: Partial skeleton including cervical and caudal vertebrae, a femur, and
        metapodials.
    diagnostic_features:
      - Neural arch of the anterior dorsal vertebrae borne on highly elevated
        pedicels above the centra (the arch rests directly on the centrum in C.
        lentus).
      - Femoral great trochanter positioned distinctly below the femoral head and
        continuous with it.
    erected_in: marsh1877c
    described_in: mcintosh1996a
  - name: Camarasaurus lentus
    status: valid
    type_species: false
    period:
      name:
        - Late Jurassic
      stage:
        - Kimmeridgian
        - Tithonian
      from_ma: 154.8
      to_ma: 145
    location:
      country: US
      region: Wyoming
      formation: Morrison
      locality: Como Bluff
    holotype:
      specimen_id:
        - YPM 1910
      specimen_type: holotype
      institution: YPM
      material: "Partial postcranial skeleton: vertebral column C2–caudal 8, cervical
        rib, left scapula, right coracoid, humeri, left radius, ilia, left
        ischium, right pubis, left hindlimb/pes, right tibia"
    diagnostic_features:
      - Smaller than C. grandis, with proportionally shorter fore- and hindlimbs.
      - Vertebrae shorter and more massive, with smaller internal pneumatic
        cavities.
      - Cervical and dorsal centra more strongly depressed (dorsoventrally
        compressed) than in other species.
      - Neural arch resting directly on the centrum rather than elevated on
        pedicels above the articular faces (elevated in C. grandis and C.
        supremus).
      - Pubic foramen open posteriorly (entirely enclosed in C. supremus and C.
        grandis).
      - Axis with a depressed neural spine rising at a low angle (steeply
        inclined in C. supremus).
    erected_in: marsh1889b
    described_in: gilmore1925a
  - name: Camarasaurus lewisi
    etymology: Honors Arnold D. Lewis, a field and laboratory preparator who
      trained the author.
    status: valid
    type_species: false
    period:
      name:
        - Late Jurassic
      stage:
        - Kimmeridgian
        - Tithonian
      from_ma: 154.8
      to_ma: 145
    location:
      country: US
      region: Colorado
      formation: Morrison
      member: Brushy Basin
      locality: Dominguez-Jones Quarry, Pit 1, Mesa County
      coordinates:
        - 38.806
        - -108.388
    holotype:
      specimen_id:
        - BYU 9047
      specimen_type: holotype
      institution: BYU
      material: "Articulated skeleton: atlas/axis plus 12 cervical vertebrae with
        ribs; right humerus, radius, ulna, partial manus; 12 dorsal vertebrae; 1
        dorsosacral vertebra; 20 dorsal ribs; 4 sacral vertebrae and ribs
        co-ossified with 1 ilium; 1 pubis; both ischia; 43 anterior caudal
        vertebrae with articulated chevrons"
    size:
      weight_kg:
        min: 9100
        max: 13600
    diagnostic_features:
      - Presacral neural spines bifid except the atlas/axis and the last dorsal,
        the cleft persisting from cervical 3 through dorsal 11 (ending in the
        mid-dorsal region in other species).
      - Cleft in the dorsal neural spines V-shaped rather than U-shaped,
        extending farther posteriorly than in other species.
      - Prominent pre-epipophyseal ridges on the cervical postzygapophyses;
        suprapostzygapophyseal laminae not confluent with the epipophyses.
      - Anterior iliac processes rotated ventrally 18-20 degrees below the axis
        of the vertebral column.
      - Diagonal bone-struts connecting the metapophyseal spurs of the second and
        third sacral neural spines to supracostal plates on the third and fourth
        sacral ribs.
      - Sacrocostal plate more strongly developed than in other species, even in
        very aged individuals.
      - Chevron heads with two articular surfaces of unequal orientation
        (anterior facet horizontal, posterior sloping about 60 degrees
        posteroventrally); anterior caudal chevrons about one-third longer than
        in C. supremus.
      - Forelimb more slender than in C. lentus, similar to that of C. grandis.
    synonyms:
      - name: Cathetosaurus lewisi
        type: reassigned
        reason: Originally erected as the type species of a new genus Cathetosaurus
          (Jensen, 1988); McIntosh et al. (1996) found Cathetosaurus
          indistinguishable from Camarasaurus at the generic level and
          recombined the species as Camarasaurus lewisi.
    erected_in: jensen1988a
    described_in: mcintosh1996b
notable_specimens:
