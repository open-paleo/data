    institution: CM
    category: exceptional-preservation
    significance: Nearly complete and articulated juvenile skeleton unearthed at
      Dinosaur National Monument; one of the best sauropod specimens known to
      science, with nearly every element preserved in articulation, and one of
      only two specimens preserving a complete tail.
    discovered:
      year: 1914
      by: Earl Douglass
    references:
