genus: Camarasaurus
parent: Camarasauridae
etymology: From Greek kamara (καμάρα) meaning 'vaulted chamber' or 'anything
  with an arched cover' + Greek sauros (σαῦρος) meaning 'lizard'; overall
  meaning 'chambered lizard', referring to the hollow pleurocoels in its
  cervical vertebrae.
pronunciation:
  ipa: /ˌkæmərəˈsɔːrəs/
  phonetic: KAM-uhr-uh-SOR-uhs
description: Camarasaurus is a genus of sauropod dinosaur that lived during the
  Late Jurassic in what is now the United States. Its fossils are primarily
  known from the Morrison Formation dating to the Kimmeridgian and Tithonian
  ages of the Jurassic, between 155 and 145 million years ago (mya). It was
  named by Edward Drinker Cope in 1877; it definitively contains three species,
  C. supremus, the type species, C. grandis, and C. lentus, while some
  researchers consider C. lewisi to be in its own genus, Cathetosaurus. The
  generic name means "chambered lizard", referring to the hollow chambers, known
  as pleurocoels, in its cervical vertebrae (Greek καμαρα [kamara] meaning
  'vaulted chamber', or anything with an arched cover, and σαυρος [sauros]
  meaning 'lizard'). Hundreds of specimens have been excavated to date,
  including some nearly complete skeletons. It is among the best understood
  dinosaurs, with detailed studies of its anatomy, paleobiology, paleoecology,
  and more.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Dorsal vertebral centra hollow with two large internal chambers separated by
    a thin longitudinal median septum, communicating with exterior via a large
    lateral foramen below the diapophysis base.
  - Neural arches extraordinarily elevated with neural spines set transversely
    to the vertebral axis; spine of anterior dorsal strongly
    emarginate/bifurcate.
  - Cervical centra very elongate, exceeding proportions known in other
    Dinosauria and Crocodilia, with a deep linear lateral foramen running most
    of the centrum length.
  - Anterior zygapophyses of neural arches separated by a deep median fissure;
    posterior zygapophyses united, bearing a pendant hyposphen that locks into
    the anterior fissure of the succeeding vertebra.
  - Scapula relatively very large (1.517 m long) with a prominent mesoscapular
    process absent in Cetiosaurus; sacrum short, only four coossified centra.
  - Caudal vertebrae amphicoelous and lacking the lateral pneumatic fossae
    present in dorsal centra; composed of finely spongy rather than hollow bone.
