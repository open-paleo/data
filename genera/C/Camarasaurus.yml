genus: Camarasaurus
parent: Camarasauridae
etymology: From Greek kamara (καμάρα) meaning 'vaulted chamber' or 'anything with an arched cover' + Greek sauros (σαῦρος) meaning 'lizard'; overall meaning 'chambered lizard', referring to the hollow pleurocoels in its cervical vertebrae.
pronunciation:
  ipa: /ˌkæmərəˈsɔːrəs/
  phonetic: KAM-uhr-uh-SOR-uhs
description: Camarasaurus is a genus of sauropod dinosaur that lived during the
  Late Jurassic in what is now the United States. Its fossils are primarily
  known from the Morrison Formation dating to the Kimmeridgian and Tithonian
  ages of the Jurassic, between 155 and 145 million years ago (mya). It was
  named by Edward Drinker Cope in 1877; it definitively contains three species,
  C. supremus, the type species, C. grandis, and C. lentus, while some
  researchers consider C. lewisi to be in its own genus, Cathetosaurus. The
  generic name means "chambered lizard", referring to the hollow chambers, known
  as pleurocoels, in its cervical vertebrae (Greek καμαρα [kamara] meaning
  'vaulted chamber', or anything with an arched cover, and σαυρος [sauros]
  meaning 'lizard'). Hundreds of specimens have been excavated to date,
  including some nearly complete skeletons. It is among the best understood
  dinosaurs, with detailed studies of its anatomy, paleobiology, paleoecology,
  and more.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
