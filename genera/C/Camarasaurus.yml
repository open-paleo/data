    specimen_id:
      - SMA 0002
    institution: SMA
    category: exceptional-preservation
    significance: One of the best-known Camarasaurus skeletons, nearly every element
      articulated, with skin impressions showing hexagonal scales on the
      hindlimb and a patch of soft tissue interpreted as gums over the lower jaw
      and teeth. Among the oldest individuals identified, with five co-occurring
      pathologies.
    discovered:
      year: 1992
      by: Swiss field workers of the Sauriermuseum Aathal
    references:
      - tschopp2015b
      - wiersma2016a
  - specimen_id:
