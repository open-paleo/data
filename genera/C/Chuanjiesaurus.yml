genus: Chuanjiesaurus
parent: Mamenchisauridae
pronunciation:
  phonetic: chwahn-jyeh-SAWR-us
etymology: Named for the village of Chuanjie in Yunnan Province, China, where
  the fossils were found, combined with Greek 'sauros' meaning 'lizard'.
description: Chuanjiesaurus is a genus of sauropod dinosaurs from the middle
  Jurassic Period. They lived in what is now China. The type species,
  Chuanjiesaurus anaensis, was first described by Fang, Pang, Lü, Zhang, Pan,
  Wang, Li and Cheng in 2000. Fossils of the species were found in the village
  of Chuanjie, Lufeng County, Yunnan Province, (in Chuanjie Formation deposits)
  and are named after the location where the fossils were discovered. Holtz gave
  a length of 25 meters (82 ft).
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Cervical vertebrae relatively long and opisthocoelous, with well-developed
    but shallow pleurocoels and low neural spines.
  - Anterior caudals procoelous; posteriorly the posterior condyle weakens and
    centra become gently amphicoelous.
  - Caudal neural spines alter in morphology from baton-shaped to plate-shaped;
    haemal spines bifid.
  - Proximal scapula conspicuously broadened; proximal coracoid oval.
  - Ilium relatively large and nearly semicircular, with well-developed pubic
    peduncle located anterior to the midline and a weak iliac peduncle.
  - Forelimb/hind limb index 0.83/1; ulna/humerus index 0.65/1; tibia/femur
    index 0.65/1.
appearance:
  features:
    - elongate neck
  integument: scaled
  evidence: inferred
