genus: Chialingosaurus
parent: Stegosauria
placement: incertae sedis
pronunciation:
  phonetic: JYAH-LING-o-SAWR-us
etymology: Named after the Chialing River (now Jialing River) in Sichuan
  Province, China, where fossils were discovered, + Greek sauros ('lizard'),
  meaning 'Chialing lizard'.
description: Chialingosaurus is a genus of herbivorous stegosaurian dinosaur
  similar to Kentrosaurus from the Upper Shaximiao Formation, Late Jurassic beds
  in Sichuan Province in China. Its age makes it one of the oldest species of
  stegosaurs, living about 160 million years ago. Since it was an herbivore,
  scientists think that Chialingosaurus probably ate ferns and cycads, which
  were plentiful during the period when Chialingosaurus was alive.
dispute:
  summary: >
    Chialingosaurus is a nomen dubium: its holotype is a juvenile, and no
    autapomorphies have been identified (Maidment and Wei, 2006). It is
    retained at Stegosauria incertae sedis.
  history:
    - date: "2026-06-26"
      note: Placed at Stegosauria incertae sedis, nomen dubium with no diagnostic features.
    - date: "2026-10-08"
      note: Type species set to nomen dubium and diagnostic features removed, following Maidment and Wei (2006) and Maidment and colleagues (2008).
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
appearance:
  integument: armored
  evidence: inferred
identifiers:
  - source: pbdb
    id: "38804"
  - source: wikidata
    id: Q132494
  - source: gbif
    id: "4823129"
species:
  - name: Chialingosaurus kuani
    etymology: "Named for geologist Kuan Yaowu (also spelled Guan Yao-Wu), who
      collected the fossils in 1957 while surveying the Chialing River."
    status: nomen dubium
    type_species: true
    period:
      name:
        - Middle Jurassic
        - Late Jurassic
      stage:
        - Bajocian
        - Bathonian
        - Callovian
        - Oxfordian
    location:
      country: CN
      locality: Taipingtsai
      region: CN-SC
      formation: Shaximiao
      part: upper
    type_specimen:
      specimen_id: [ IVPP V2300 ]
      specimen_type: holotype
      institution: IVPP
      material: Six vertebrae, a typical spine and probably two more spines, middle part
        of left scapula, both humeri, right radius, distal part of right ischium, left
        femur and metatarsal III, and a few limb bone fragments.
      completeness: partial
    erected_in: young1959a
notable_specimens:
  - specimen_id: [CV 202]
    institution: CFEC
    species: Chialingosaurus kuani
    category: complementary
    significance: "Referred skeleton preserving a partial skull and lower jaws, anatomy absent in the skull-less holotype, along with vertebrae, limb elements and four plates. The material does not overlap the holotype, and Zhou considered the two possibly the same individual."
    references: [dong1983a]
references:
  - id: young1959a
  - id: dong1983a
  - id: maidment2006a
    notes: Found no autapomorphies for Chialingosaurus, treating it as a nomen dubium.
