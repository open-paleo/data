genus: Chialingosaurus
parent: Stegosauria
pronunciation:
  phonetic: JYAH-LING-o-SAWR-us
etymology: Named after the Chialing River (now Jialing River) in Sichuan
  Province, China, where fossils were discovered, + Greek sauros ('lizard'),
  meaning 'Chialing lizard'.
description: Chialingosaurus is a genus of herbivorous stegosaurian dinosaur
  similar to Kentrosaurus from the Upper Shaximiao Formation, Late Jurassic beds
  in Sichuan Province in China. Its age makes it one of the oldest species of
  stegosaurs, living about 160 million years ago. Since it was an herbivore,
  scientists think that Chialingosaurus probably ate ferns and cycads, which
  were plentiful during the period when Chialingosaurus was alive.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Slenderly built skeleton with relatively long anterior limb;
    humerus-to-femur ratio of 1.62, intermediate between Scelidosaurus and
    Kentrosaurus.
  - Humerus beam well developed, approximately 100 mm long, with less-expanded
    proximal and distal ends compared to Stegosaurus and Kentrosaurus.
  - Femur straight and slender, lacking a fourth trochanter.
  - Dorsal spine plate-like and relatively small; spine base deeply grooved with
    an acute anterior angle of approximately 55 degrees.
  - Metatarsal III sharply laterally compressed and unusually slender relative
    to other stegosaurids.
