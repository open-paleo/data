genus: Centrosaurus
parent: Centrosaurini
pronunciation:
  phonetic: SEN-troh-SOR-uhs
  ipa: /ˌsɛntroʊˈsɔːrəs/
etymology: "From Greek kentron (κέντρον) meaning 'point' and Greek sauros
  (σαῦρος) meaning 'lizard'. Full meaning: 'pointed lizard', referring to the
  small hornlets along the margin of its frill."
description: Centrosaurus is a genus of centrosaurine ceratopsid dinosaur from
  the Campanian age of the Late Cretaceous of Canada. Its remains have been
  found in the Dinosaur Park Formation, dating from 76.5 to 75.5 million years
  ago. The type and only species seen as valid today is Centrosaurus apertus.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Fontanelles of the crest included entirely within the parietal part of the
    expansion (not bounded laterally by the squamosal)
  - Posterior border of crest bears a pair of greatly modified hooked
    epoccipital processes (large hook-like spurs of bone) on the hinder border
  - Crest broadly expanded laterally, broader than long, with a robust
    transverse posterior bar that is concave in outline behind
  - Squamosals confined to the antero-lateral edge of the frill, contributing
    little to its overall formation
  - Large oval fontanelles one on either side of the median line, bounded behind
    by the transverse bar and laterally/anteriorly by thin side extensions
appearance:
  features:
    - nasal horn
    - brow horns
    - epoccipitals
    - frill spikes
    - cranial bosses
  integument: scaled
  evidence: direct
