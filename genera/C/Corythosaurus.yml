genus: Corythosaurus
parent: Lambeosaurinae
pronunciation:
  phonetic: ko-RITH-o-SAWR-us
  ipa: /kəˌrɪθəˈsɔːrəs/
etymology: From Greek korys (κόρυς), 'helmet', + Greek sauros, 'lizard'; means
  'helmeted lizard', referring to its helmet-like head crest
description: Corythosaurus is a genus of hadrosaurid "duck-billed" dinosaur from
  the Late Cretaceous period, about 77-75.7 million years ago, in what is now
  western North America. Its name is derived from the Greek word κόρυς, meaning
  "helmet", named and described in 1914 by Barnum Brown. Corythosaurus is now
  thought to be a lambeosaurine, thus related to Lambeosaurus, Nipponosaurus,
  Velafrons, Hypacrosaurus, and Olorotitan. Corythosaurus has an estimated
  length of 7.7-9 meters (25-30 ft) and has a skull, including the crest, that
  is 70.8 centimeters (27.9 in; 2.32 ft) tall.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Skull short with a high anterior helmet-like crest formed by nasals,
    prefrontals, and frontals
  - Nasals not separated in front by premaxillaries (unique among known
    hadrosaur genera at time of description)
  - Narial opening small; mouth narrow with elongate expanded portion of
    premaxillary in front of nares
  - Integument composed of low polygonal non-imbricating tuberculate scales on
    sides, back, and tail, with rows of conical limpet-like scales on belly
  - Prefrontal roughly triangular and less extensive than in Stephanosaurus;
    apparently forms no part of the orbital border
appearance:
  integument: scaled
  evidence: direct
