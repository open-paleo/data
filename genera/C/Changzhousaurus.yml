genus: Changzhousaurus
parent: Deinonychosauria
placement: incertae sedis
dispute:
  summary: >
    Changzhousaurus was described from a specimen with a mosaic of troodontid,
    dromaeosaurid, anchiornithid, and avialan features; no quantitative analysis
    was run, and its describers preferred an early-diverging deinonychosaurian
    interpretation while conceding anchiornithine or avialan status is not
    impossible (Xu et al., 2026). It is placed at Deinonychosauria incertae sedis.
  history:
    - date: "2026-07-01"
      note: Placed at Deinonychosauria incertae sedis (least-inclusive uncontested clade); mosaic morphology, no phylogenetic analysis, family-level placement unresolved.
pronunciation:
  phonetic: chahng-joh-SAWR-us
etymology: Named after Changzhou city (Jiangsu Province, China), honoring the
  Changzhou Municipal Government, combined with Greek 'sauros' (lizard); meaning
  'Changzhou lizard'.
description: Changzhousaurus is an extinct genus of paravian theropod dinosaur
  known from the Early Cretaceous (Aptian age) Jiufotang Formation of China. The
  genus contains a single species, Changzhousaurus sinensis, known from a nearly
  complete, articulated skeleton with extensive associated feather traces,
  preserved as a part and counterpart.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
  - forested
appearance:
  features:
    - feathered wings
    - hindlimb feathers
    - feathered tail
    - sickle claw
  integument: feathered
  evidence: direct
diagnostic_features:
  - Premaxilla with a nearly vertical nasal process, a very small prenarial
    portion, and a large, sub-square subnarial portion
  - Anterior caudal vertebrae with a wide ventral intervertebral space occupied by
    a knob-like chevron lacking a distal process
  - Ossified intervertebral discs between the middle and posterior caudal
    vertebrae
  - Furcula with constant width throughout its length
  - Scapula with a rod-like acromion process, a dorsally curved and very thick
    blade, and a mushroom-like expanded distal end
  - About sixteen highly elongated tail feathers, around four times femoral
    length, near the end of the bony tail
identifiers:
