    notes: First described and figured the holotype, making the name available;
      the valid authorship is Chinshakiangosaurus chunghoensis Ye vide Dong,
      1992.
  - id: upchurch2007a
    notes: Re-evaluation of the holotype dentary and reassessment of the taxon
