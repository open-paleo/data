genus: Chinshakiangosaurus
parent: Sauropoda
etymology: Chinshakiang lizard
pronunciation:
  phonetic: JIN-shah-jiahng-uh-SOR-us
description: Chinshakiangosaurus is a genus of basal sauropod dinosaur. The only
  species, Chinshakiangosaurus chunghoensis, is known from a fragmentary
  skeleton found in Early Jurassic rocks in China. It is one of the few basal
  sauropods with preserved skull bones and therefore important for the
  understanding of the early evolution of this group, and also shows that early
  sauropods may have possessed fleshy cheeks.
diet: herbivore
locomotion: quadrupedal
