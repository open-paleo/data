genus: Chinshakiangosaurus
parent: Sauropoda
etymology: Named after the Chinshakiang (now Jinsha River) in China, + Greek
  sauros ('lizard'), meaning 'Chinshakiang lizard'.
pronunciation:
  phonetic: JIN-shah-jiahng-uh-SOR-us
description: Chinshakiangosaurus is a genus of basal sauropod dinosaur. The only
  species, Chinshakiangosaurus chunghoensis, is known from a fragmentary
  skeleton found in Early Jurassic rocks in China. It is one of the few basal
  sauropods with preserved skull bones and therefore important for the
  understanding of the early evolution of this group, and also shows that early
  sauropods may have possessed fleshy cheeks.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "68151"
  - source: wikidata
    id: Q145213
  - source: gbif
    id: "4822882"
species:
  - name: Chinshakiangosaurus chunghoensis
    etymology: "Named for the village of Zhonghe (Chungho in older romanization)
      near the discovery site in Yunnan Province, China."
    status: valid
    type_species: true
    period:
      name:
        - Early Jurassic
      stage:
        - Hettangian
    location:
      country: CN
      locality: Zhonghe
      region: CN-YN
      formation: Fengjiahe
      part: lower
    type_specimen:
      specimen_id: [ IVPP V14474 ]
      specimen_type: holotype
      institution: IVPP
      material: Partial skeleton including a nearly complete left dentary, a
        cervical vertebra, dorsal vertebrae, several anterior caudal vertebrae,
        both scapulae, an incomplete pelvic girdle, and the hind limbs.
      completeness: partial
    size:
