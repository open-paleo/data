genus: Chinshakiangosaurus
parent: Sauropoda
etymology: Named after the Chinshakiang (now Jinsha River) in China, + Greek
  sauros ('lizard'), meaning 'Chinshakiang lizard'.
pronunciation:
  phonetic: JIN-shah-jiahng-uh-SOR-us
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "68151"
  - source: wikidata
    id: Q145213
  - source: gbif
    id: "4822882"
species:
  - name: Chinshakiangosaurus chunghoensis
    etymology: "Named for the village of Zhonghe (Chungho in older romanization)
      near the discovery site in Yunnan Province, China."
    status: valid
    type_species: true
    period:
      name:
        - Early Jurassic
    location:
      country: CN
      locality: Zhonghe
      region: CN-YN
      formation: Fengjiahe
      part: lower
    type_specimen:
      specimen_id: [ IVPP V14474 ]
      specimen_type: holotype
      institution: IVPP
      material: Partial skeleton including a nearly complete left dentary, a
        cervical vertebra, dorsal vertebrae, several anterior caudal vertebrae,
        both scapulae, an incomplete pelvic girdle, and the hind limbs.
      completeness: partial
    size:
      weight_kg:
        min: 3000
        max: 3000
      hip_height_m:
        min: 3
        max: 3
      length_m:
        min: 12.0
        max: 13.0
    erected_in: dong1992a
    described_in: upchurch2007a
references:
  - id: yeh1975a
    notes: Proposed the name Chinshakiangosaurus chunghoensis without a
      description, leaving it a nomen nudum.
  - id: dong1992a
    notes: First described and figured the holotype, making the name available;
      the valid authorship is Chinshakiangosaurus chunghoensis Ye vide Dong,
      1992.
  - id: upchurch2007a
    notes: Re-evaluation of the holotype dentary and reassessment of the taxon
      as provisionally valid; documents the holotype material, locality, and
      horizon.
  - id: paul2024a
    notes: Source of the mass estimate.
  - id: jones2026b
    notes: Source of the hip height estimate.
