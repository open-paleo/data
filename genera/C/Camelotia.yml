genus: Camelotia
parent: Sauropodiformes
etymology: from Camelot
description: Camelotia is a large-bodied sauropodomorph from the latest Triassic
  (Rhaetian) of southwest England. It is best known from a partial postcranial
  skeleton found in the Westbury Formation and named by Peter M. Galton in 1985.
  Subsequent work has generally placed Camelotia as a relatively derived
  sauropodomorph close to the origin of Sauropoda, although its exact position
  among early non-sauropod sauropodomorphs remains debated. It is sometimes
  placed in Melanorosauridae as a close relative of Melanorosaurus. With a body
  length and mass estimated at 8–10 metres (26–33 ft) and 3.8 tonnes (8,400 lb),
  respectively, it is one of the largest sauropodomorphs known from the
  Triassic.
