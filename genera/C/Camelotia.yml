genus: Camelotia
parent: Sauropodiformes
placement: incertae sedis
pronunciation:
  phonetic: kam-e-LOH-tee-a
etymology: Named after Camelot, the legendary castle and court of King Arthur, referring to the discovery location in southwest England (near the supposed location of Camelot); overall meaning 'from Camelot'.
description: Camelotia is a large-bodied sauropodomorph from the latest Triassic
  (Rhaetian) of southwest England. It is best known from a partial postcranial
  skeleton found in the Westbury Formation and named by Peter M. Galton in 1985.
  Subsequent work has generally placed Camelotia as a relatively derived
  sauropodomorph close to the origin of Sauropoda, although its exact position
  among early non-sauropod sauropodomorphs remains debated. It is sometimes
  placed in Melanorosauridae as a close relative of Melanorosaurus. With a body
  length and mass estimated at 8-10 meters (26-33 ft) and 3.8 tonnes (8,400 lb),
  respectively, it is one of the largest sauropodomorphs known from the
  Triassic.
dispute:
  summary: >
    Camelotia borealis is a fragmentary, large sauropodiform close to the
    origin of Sauropoda; its position is labile and it is sometimes
    referred to Melanorosauridae.
  history:
    - date: "2026-06-29"
      note: Placed at Sauropodiformes incertae sedis; Sauropoda boundary unresolved, position labile due to incomplete material.
diagnostic_features:
  - Height exceeds length for centra of the posterior dorsal and anterior caudal
    vertebrae
  - Lesser trochanter extends close to proximal end of femur
  - Proximal end of tibia only slightly expanded anteroposteriorly relative to
    the shaft
