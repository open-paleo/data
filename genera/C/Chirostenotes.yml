etymology: "From Greek cheir meaning 'hand' and Greek stenos meaning 'narrow'. Full meaning: 'narrow-handed', referring to the narrow, slender hands of the fossil."
description: Chirostenotes is a genus of oviraptorosaurian dinosaur from the
  late Cretaceous (about 76.5–75 million years ago) of Alberta, Canada. The type
  species is Chirostenotes pergracilis.
