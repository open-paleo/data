genus: Chuanqilong
parent: Ankylosauridae
etymology: From Chinese chuanqi (传奇, 'legendary') + long (龙, 'dragon'), meaning
  'legendary dragon'.
pronunciation:
  phonetic: shwahn-chee-long
description: Chuanqilong is a monospecific genus of basal ankylosaurid dinosaur
  from the Liaoning Province, China that lived during the Early Cretaceous (late
  Barremian to Aptian stage, 122.0 to 118.9 Ma) in what is now the Jiufotang
  Formation. The type and only species, Chuanqilong chaoyangensis, is known from
  a nearly complete skeleton with a skull of a juvenile individual. It was
  described in 2014 by Fenglu Han, Wenjie Zheng, Dongyu Hu, Xing Xu, and Paul M.
  Barrett. Chuanqilong shows many similarities with Liaoningosaurus and may
  represent a later ontogenetic stage of the taxon.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - lacustrine
diagnostic_features:
  - Glenoid fossa for quadrate situated at same level as the dentary tooth row
    (unlike all other ankylosaurians in which it lies ventral to the tooth row).
  - Distally tapering ischium with constriction at midshaft length (unique among
    ankylosaurians).
  - Slender, wedge-like lacrimal forming rostral margin of orbit.
  - Long, slender retroarticular process.
  - Ratio of humerus to femur length = 0.88, notably higher than most known
    ankylosaurians.
  - Width of proximal humerus is half the length of the humeral shaft (ratio
    ~0.50, distinct from Liaoningosaurus at 0.38).
