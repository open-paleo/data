genus: Camposaurus
parent: Coelophysinae
pronunciation:
  ipa: /ˌkæmpoʊˈsɔːrəs, -pə-/
  phonetic: KAMP-o-SOR-uhs
etymology: "Named for Charles Lewis Camp, an American paleontologist, combined with Greek 'sauros' meaning 'lizard'."
description: Camposaurus is a coelophysid dinosaur genus from the Norian stage
  of the Late Triassic period of North America. The pertinent fossil remains
  date back to the early to middle Norian stage, and is widely regarded as the
  oldest known neotheropod.
diet: carnivore
locomotion: bipedal
