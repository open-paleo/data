genus: Camposaurus
parent: Coelophysidae
pronunciation:
  ipa: /ˌkæmpoʊˈsɔːrəs, -pə-/
  phonetic: KAMP-o-SOR-uhs
etymology: "Named for Charles Lewis Camp, an American paleontologist, combined
  with Greek 'sauros' meaning 'lizard'."
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Tarsals fused to the tibia and fibula (shared only with Rioarribasaurus and
    Syntarsus among ceratosaurs)
  - Ventral margin of astragalus in anterior/posterior view is horizontal rather
    than deeply concave
  - Fibula in contact with tibia in anterior view for a distance equal to at
    least one and a half times the width of the astragalus plus calcaneum
  - Femoral head more rectangular than in Coelophysis and Syntarsus
  - Dorsal centra more waisted in ventral view than in Coelophysis and Syntarsus
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "66658"
  - source: wikidata
    id: Q29057464
species:
  - name: Camposaurus arizonensis
    etymology: "Named for Arizona, the US state where the holotype was discovered."
    pronunciation:
      phonetic: ayr-i-zoh-NEN-sis
    status: valid
    type_species: true
    period:
      name:
        - Late Triassic
      stage:
        - Carnian
        - Norian
    location:
      country: US
      locality: Placerias Quarry
      region: US-AZ
      formation: Chinle
      member: Mesa Redondo
      notes: Hunt and colleagues (1998) place the taxon in the Adamanian, which
        they call late Tuvalian (late Carnian); Novas and colleagues (2021) date
        the Placerias Quarry to about 219 Ma, which is Norian.
    type_specimen:
      specimen_id: [ UCMP 34498 ]
      specimen_type: holotype
      institution: UCMP
      material: Associated right and left distal hindlimbs and fused astragali and
        calcanea (fused right tibia/fibula/astragalus/calcaneum)
      completeness: fragmentary
    erected_in: hunt1998a
references:
  - id: novas2021a
    notes: Gives the Placerias Quarry as "ca. 219 Ma".
  - id: hunt1998a
