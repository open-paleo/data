genus: Camposaurus
parent: Coelophysidae
pronunciation:
  ipa: /ˌkæmpoʊˈsɔːrəs, -pə-/
  phonetic: KAMP-o-SOR-uhs
etymology: "Named for Charles Lewis Camp, an American paleontologist, combined
  with Greek 'sauros' meaning 'lizard'."
description: Camposaurus is a coelophysid dinosaur genus from the Norian stage
  of the Late Triassic period of North America. The pertinent fossil remains
  date back to the early to middle Norian stage, and is widely regarded as the
  oldest known neotheropod.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Tarsals fused to the tibia and fibula (shared only with Rioarribasaurus and
    Syntarsus among ceratosaurs)
  - Ventral margin of astragalus in anterior/posterior view is horizontal rather
    than deeply concave
  - Fibula in contact with tibia in anterior view for a distance equal to at
    least one and a half times the width of the astragalus plus calcaneum
  - Femoral head more rectangular than in Coelophysis and Syntarsus
  - Dorsal centra more waisted in ventral view than in Coelophysis and Syntarsus
appearance:
  integument: scaled
  evidence: inferred
