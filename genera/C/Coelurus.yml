genus: Coelurus
parent: Coelurosauria
etymology: From Greek 'koilos' (hollow) and 'oura' (tail); meaning 'hollow tail',
  referring to the extensively excavated, thin-walled vertebrae described in
  the holotype.
pronunciation:
  phonetic: seel-YOOR-us
description: Coelurus is a genus of small coelurosaurian theropod from the Late
  Jurassic Morrison Formation of Wyoming, United States. The single valid
  species, Coelurus fragilis, was described by Othniel Charles Marsh in 1879
  and is known from a partial skeleton with characteristically hollow,
  thin-walled vertebrae. It was a lightly built bipedal carnivore with
  elongate hind limbs.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Dorsal and lumbar vertebrae centra so extensively excavated that walls are
    reduced to a thin shell (~1 mm thick).
  - Vertebral cavities apparently lack internal partitions, with smooth inner
    wall surfaces.
  - Trunk vertebrae elongate and biconcave with high neural arches united to
    centra by suture.
  - Sides of vertebrae somewhat excavated with small openings into the central
    cavity.
  - Cup at each end of centra unusually smooth and regular.
  - Zygapophyses positioned close together and oriented nearly vertical.
