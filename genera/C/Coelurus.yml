genus: Coelurus
parent: Coelurosauria
placement: incertae sedis
dispute:
  summary: >
    The placement of Coelurus is debated. It is commonly recovered near the base
    of Tyrannosauroidea, sometimes in a reduced Coeluridae with Tanycolagreus
    (Hartman et al., 2019; Jones et al., 2026), but a base-of-Compsognathidae
    position has not been ruled out, and Delcourt et al. (2025) recovered it as
    the earliest-branching ornithomimosaur. It is placed conservatively at
    Coelurosauria incertae sedis.
  history:
    - date: "2026-07-01"
      note: Placed at Coelurosauria incertae sedis (least-inclusive uncontested clade); Coeluridae/basal-Tyrannosauroidea and ornithomimosaur hypotheses proposed. Coeluridae not adopted as a node (contested, sparsely populated).
etymology: From Greek 'koilos' (hollow) and 'oura' (tail); meaning 'hollow tail',
  referring to the extensively excavated, thin-walled vertebrae described in
  the holotype.
pronunciation:
  phonetic: seel-YOOR-us
description: Coelurus is a genus of small coelurosaurian theropod from the Late
  Jurassic Morrison Formation of Wyoming, United States. The single valid
  species, Coelurus fragilis, was described by Othniel Charles Marsh in 1879
  and is known from a partial skeleton with characteristically hollow,
  thin-walled vertebrae. It was a lightly built bipedal carnivore with
  elongate hind limbs.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Dentary very gracile
  - All vertebral centra elongated and very thin-walled
  - All neural spines long and low
  - Paired pleurocoels on some cervicals; triangular diapophyseal ala angled
    sharply ventrolaterally; centroprezygapophyseal lamina forming a fossa
    lateral to the neural canal; centrodiapophyseal lamina present; caudal
    prezygapophyses very short
  - Pubic foot very arcuate ventrally and projecting posterodorsally; pubic
    fenestra at the middle of the pubic apron
  - Metatarsus very long and gracile, almost as long as the tibia or femur
appearance:
  integument: unknown
identifiers:
  - source: pbdb
    id: "38528"
  - source: wikidata
    id: Q131228
  - source: gbif
    id: "4822575"
species:
  - name: Coelurus fragilis
    etymology: From Latin 'fragilis' (fragile, slender), referring to the
      delicate, thin-walled hollow vertebrae of the holotype.
    status: valid
    type_species: true
    period:
      name:
        - Late Jurassic
      stage:
        - Kimmeridgian
        - Tithonian
    location:
      country: US
      region: US-WY
      formation: Morrison
      locality: Quarry 13 East
    type_specimen:
      specimen_id:
        - YPM 1991
        - YPM 1992
        - YPM 1993
      specimen_type: syntype
      institution: YPM
      material: Proximal and mid-caudal vertebrae (centra and neural arches) and a
        cervical vertebra, the thin-walled vertebrae illustrated by Marsh (1881).
      completeness: fragmentary
      notes: Coelurus fragilis was based on a series of vertebrae; Marsh marked
        YPM 1991 as the type, and Carpenter et al. (2005) treat YPM 1991-1993 as
        syntypes (no lectotype has been designated). The much more complete
        skeleton YPM 2010 is the type of Coelurus agilis Marsh (1884), here
        referred to C. fragilis.
    size:
      weight_kg:
        min: 25
        max: 25
      hip_height_m:
        min: 0.6
        max: 0.6
      length_m:
        min: 1.8
        max: 1.8
    erected_in: marsh1879a
    described_in: carpenter2005b
    synonyms:
      - name: Coelurus agilis
        type: junior subjective
        reason: Erected by Marsh (1884) on the more complete skeleton YPM 2010;
          Carpenter et al. (2005) regarded it as a junior subjective synonym of
          Coelurus fragilis.
notable_specimens:
  - specimen_id: [YPM 2010]
    institution: YPM
    species: Coelurus fragilis
    category: complementary
    significance: "Much more complete partial skeleton (cervical, dorsal, and caudal vertebrae plus pelvic and limb elements) from Quarry 13, Como Bluff. Originally the holotype of Coelurus agilis Marsh 1884, referred to C. fragilis by Carpenter et al. (2005); the principal source for the genus's modern anatomy."
    references: [carpenter2005b]
references:
  - id: marsh1879a
  - id: ostrom1980a
    notes: Compares the type material of the two genera and concludes they are
      distinct rather than synonymous.
  - id: carpenter2005b
    notes: Redescribes both genera as distinct taxa, provides revised diagnoses,
      and treats YPM 2010 (the Coelurus agilis type) as referred material of C.
      fragilis.
  - id: delcourt2025a
    notes: Phylogenetic reanalysis recovering Coelurus fragilis as basal-most
      ornithomimosaur under equal-weight parsimony; authors note this does not
      settle the longstanding placement ambiguity.
  - id: paul2024a
    notes: Source of the mass estimate.
  - id: jones2026c
    notes: Source of the hip height estimate.
  - id: hartman2019a
    notes: New paravian description's theropod phylogeny placed Coelurus near basal Tyrannosauroidea.
  - id: marsh1884a
    notes: Named Coelurus agilis (YPM 2010), later synonymized with Coelurus fragilis.
