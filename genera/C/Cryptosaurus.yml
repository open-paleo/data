    journal: Quarterly Journal of the Geological Society of
      London
    volume: "31"
    issue: "1-4"
    pages: 149-151
    publisher: Geological Society of London
    doi: 10.1144/gsl.jgs.1875.031.01-04.12
  - id: seeley1869b
    authors: Seeley, H. G.
    year: 1869
    title: Index to the fossil remains of Aves, Ornithosauria,
