genus: Cryptosaurus
parent: Ankylosauria
placement: incertae sedis
etymology: From Greek 'kryptos' (hidden) and 'sauros'
  (lizard); meaning 'hidden lizard', in reference to the
  rarity of the find.
pronunciation:
  phonetic: KRIP-to-SOR-us
description: >
  Cryptosaurus is a dubious genus of dinosaur known from a
  partial femur from the Late Jurassic of England. The sole
  species is Cryptosaurus eumerus.
dispute:
  summary: >
    Cryptosaurus is known only from a single femur and is an indeterminate ankylosaur, not assignable below Ankylosauria.
  history:
    - date: "2026-06-26"
      note: Placed at Ankylosauria incertae sedis, indeterminate single-element holotype.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - marine
appearance:
  integument: armored
diagnostic_features:
  - Femoral shaft triangular in cross-section at both proximal
    and distal ends, with flat outer side and compressed inner
    side proximally.
  - Proximal articular surface in two portions — an inner
    subspherical head and a continuous outer subquadrate facet
    obliquely concave from within outward.
  - Great trochanter a mastiform process partly separated from
    the anterior shaft by a deep narrow groove on the outer
    side.
  - Inner trochanter placed entirely on the posterior aspect of
    the shaft, at approximately mid-shaft.
  - Distal articular surface lacks an anterior intercondylar
    groove; inner condyle large, separated from the outer
    condyle by a narrow interspace.
identifiers:
  - source: pbdb
    id: "56556"
  - source: wikidata
    id: Q18578567
  - source: gbif
    id: "4575739"
synonyms:
  - name: Cryptodraco eumerus
    type: junior objective
    reason: Lydekker (1889) proposed Cryptodraco as a
      replacement name for Cryptosaurus, believing the latter
      to be preoccupied by an earlier reptile name. The
      perceived senior homonym was actually a misspelling of
      Cystosaurus (Geoffroy Saint-Hilaire, 1831) in the French
      Bibliothèque universelle, so Cryptosaurus was never
      preoccupied and Cryptodraco is an unnecessary
      replacement name.
species:
  - name: Cryptosaurus eumerus
    etymology: From Greek 'eu' (well) and 'merus' (thigh);
      meaning 'well-formed thigh', in reference to the stout
      build of the holotype femur.
    status: nomen dubium
    type_species: true
    period:
      name:
        - Late Jurassic
      stage:
        - Oxfordian
    location:
      country: GB
      region: GB-CAM
      formation: Ampthill Clay
      coordinates:
        - 52.1833
        - -0.1333
    type_specimen:
      specimen_id:
        - CAMSM J.46882
      specimen_type: holotype
      institution: CAMSM
      material: A single right femur, approximately 31 cm long,
        with a slight antero-posterior flexure in the lower
        third of the shaft; articular ends lack epiphyses.
      completeness: fragmentary
    erected_in: seeley1875b
references:
  - id: seeley1875b
  - id: seeley1869b
    notes: Coins the name Cryptosaurus eumerus with a brief shelf-location note
      but no diagnosis or description — a nomen-nudum precursor to the 1875 description.
  - id: geoffroysaint-hilaire1831a
    notes: Introduced the nomen nudum Cystosaurus; a later misspelling of this
      name led Lydekker (1889) to treat Cryptosaurus as preoccupied and propose
      the replacement name Cryptodraco.
  - id: lydekker1889b
    notes: Proposed the replacement name Cryptodraco for Cryptosaurus.
