genus: Coloradisaurus
parent: Massospondylidae
pronunciation:
  phonetic: ko-lo-RAHD-i-SAWR-us
etymology: Named after the Los Colorados Formation in La Rioja Province, Argentina, where fossils were found, + Greek sauros ('lizard'), meaning 'Los Colorados lizard'.
description: Coloradisaurus is a genus of massospondylid sauropodomorph
  dinosaur. It lived during the Late Triassic period (Norian stage) in what is
  now La Rioja Province, Argentina. It is known from two specimens collected
  from the Los Colorados Formation of the Ischigualasto-Villa Unión Basin.
locomotion: bipedal
paleoenvironment:
  - fluvial
  - arid
diet: herbivore
diagnostic_features:
  - Antorbital region clearly shorter than in Plateosaurus-Lufengosaurus, with
    proportionally long frontals
  - Antorbital fenestra partially beneath the orbit, with pronounced dorsal
    maxillary process
  - Orbit proportionally large, with sclerotic ring
  - Mandibular symphysis and posterior half of mandible shorter than in
    Plateosaurus
  - Cervical vertebrae low and long, bearing long, thin cervical ribs
  - Occipital region with forward inclination of the dorsal surface, more
    dorsally projected than in Plateosaurus
appearance:
  integument: scaled
  evidence: inferred
