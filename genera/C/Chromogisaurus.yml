genus: Chromogisaurus
parent: Saturnaliidae
description: Chromogisaurus is an extinct genus of saturnaliid sauropodomorph
  which existed in Argentina during the Late Triassic (Carnian) period. It is
  from the Cancha de Bochas, Valle Pintado member of the Ischigualasto
  Formation. It was a small, bipedal herbivore, about 2 metres (6 ft 7 in) in
  length.
diet: herbivore
locomotion: bipedal
