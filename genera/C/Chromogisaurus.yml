genus: Chromogisaurus
parent: Saturnaliidae
etymology: "From Greek chroma meaning 'color' and Greek ge meaning 'earth', combined with Greek sauros meaning 'lizard'. Full meaning: 'colored earth lizard', a reference to the Valle Pintado ('Painted Valley') where it was found."
pronunciation:
  phonetic: kroh-MO-gee-SOR-us
description: Chromogisaurus is an extinct genus of saturnaliid sauropodomorph
  which existed in Argentina during the Late Triassic (Carnian) period. It is
  from the Cancha de Bochas, Valle Pintado member of the Ischigualasto
  Formation. It was a small, bipedal herbivore, about 2 meters (6 ft 7 in) in
  length.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Proximal caudals without median notch separating the postzygapophyses
  - Femoral lateral surface with deep and large fossa immediately below the
    trochanteric shelf (autapomorphy)
  - Metatarsal II with strongly dorsoventrally asymmetric distal condyles
    (autapomorphy)
  - Ilium with strongly posteriorly developed postacetabular process
  - Incipiently perforated acetabulum
appearance:
  integument: scaled
  evidence: inferred
