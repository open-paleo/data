genus: Compsognathus
parent: Compsognathidae
pronunciation:
  phonetic: komp-SOG-na-thus
  ipa: /kɒmpˈsɒɡnəθəs/
etymology: "From Greek kompsos (κομψός) meaning 'elegant/refined/dainty' and Greek gnathos (γνάθος) meaning 'jaw'. Full meaning: 'elegant jaw' or 'dainty jaw'."
description: Compsognathus is a genus of small, bipedal, carnivorous theropod
  dinosaur. Members of its single species Compsognathus longipes could grow to
  around the size of a chicken. They lived about 150 million years ago, during
  the Tithonian age of the late Jurassic period, in what is now Europe.
  Paleontologists have found two well-preserved fossils, one in Germany in the
  1850s and the second in France more than a century later. Today, C. longipes
  is the only recognized species, although the French specimen was once thought
  to belong to a separate species named C. corallestris.
diet: carnivore
locomotion: bipedal
