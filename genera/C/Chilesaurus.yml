genus: Chilesaurus
parent: Dinosauria
placement: incertae sedis
etymology: "Named after Chile, the country in South America where it was discovered, combined with Greek sauros meaning 'lizard'. Full meaning: 'Chile lizard'."
pronunciation:
  phonetic: CHIH-lee-SOR-us
description: Chilesaurus is an extinct genus of herbivorous dinosaur. While its
  exact classification is uncertain, many researchers believe it is a theropod,
  with a minority of academics suggesting that it may be an ornithischian. The
  type and only known species so far is Chilesaurus diegosuarezi. Chilesaurus
  lived between 148-147 million years ago (Mya) in the Late Jurassic period of
  Chile. Showing a combination of traits from theropods, ornithischians, and
  sauropodomorphs, this genus has far-reaching implications for the evolution of
  dinosaurs, such as whether the traditional saurischian-ornithischian split is
  superior or inferior to the proposed group Ornithoscelida. This however, has
  been contested by several other authors, who believe that the weight of
  evidence supports its membership within Theropoda, and possibly as a member of
  Tetanurae.
dispute:
  summary: >
    Chilesaurus diegosuarezi is an enigmatic herbivorous dinosaur of highly
    contested affinities, combining theropod, ornithischian, and sauropodomorph
    features. It was originally described as a basal tetanuran theropod (Novas and
    others, 2015), but later analyses have recovered it as an early-diverging
    ornithischian within Ornithoscelida (Baron and Barrett, 2017, 2018). Because
    the credible hypotheses span Theropoda and Ornithischia, it is placed
    conservatively at Dinosauria incertae sedis.
  history:
    - date: "2026-06-29"
      note: Placed provisionally at Ornithischia; the placement straddles the Saurischia-Ornithischia boundary.
    - date: "2026-07-02"
      note: Moved from Ornithischia to Dinosauria incertae sedis; the theropod, ornithischian, and sauropodomorph hypotheses remain unresolved.
    - date: "2026-07-09"
      note: Dispute corrected — the "basal sauropodomorph" hypothesis attributed
        to Müller and others (2018) is unfounded, as that paper does not treat
        Chilesaurus (the sauropodomorph result traced to a since-corrected
        dataset). Retained at Dinosauria incertae sedis on the
        theropod-versus-ornithischian split.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - deltaic
  - fluvial
diagnostic_features:
  - Premaxilla short and deep with prominent plate-like postnarial process
  - Teeth leaf-shaped, finely denticulate only on crown apex of erupting teeth
  - Coracoid subquadrangular in side view with transversely thick margins
  - Manual digit II with short pre-ungual phalanges; manual digit III atrophied
  - Pubis fully retroverted with rod-like shaft distally unexpanded
  - Femur lacks mediodistal crest; tibia lacks fibular crest
