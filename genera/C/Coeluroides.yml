genus: Coeluroides
parent: Abelisauroidea
etymology: From Coelurus (a related theropod genus, itself
  from Greek 'koilos' (hollow) and 'oura' (tail)) and Greek
  '-oides' (resembling); meaning 'Coelurus-like'.
description: >
  Coeluroides is an extinct genus of theropod dinosaur that
  lived during the Late Cretaceous Period in what is now India.
  It is based solely on the holotype caudal vertebrae GSI
  K27/562, K27/574 and K27/595, discovered in a layer of the
  Lameta Formation. The type species, C. largus, was described
  by Friedrich von Huene and Charles Alfred Matley in 1933.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Mid-caudal vertebrae with wide, almost horizontally
    oriented and well-separated pre- and postzygapophyses.
  - Transverse processes notably expanded and triangular in
    outline, deeply excavated on their dorsal surface.
  - Axially extended neural-spine base on mid-caudals.
  - Centra of caudal vertebrae 9-11 cm long; centrum well
    rounded in transverse section near the articular face and
    in the middle, fairly narrow at mid-length.
