genus: Coeluroides
parent: Abelisauroidea
placement: incertae sedis
dispute:
  summary: >
    Coeluroides largus is based on a few vertebrae from the Lameta Formation and
    is widely regarded as a nomen dubium (Olshevsky, 1991; Tykoski and Rowe,
    2004). Carrano and Sampson (2008) found the material too fragmentary for
    specific diagnosis and argued that the Lameta theropod assemblage is likely
    over-split, with Coeluroides and several other named taxa probably
    representing only one or two abelisaurids. Novas and colleagues (2004) left
    its validity open, noting only that it may represent a valid indeterminate
    abelisauroid — a weak and isolated case. It is retained as a nomen dubium.
  history:
    - date: "2026-06-30"
      note: >
        Placed at Abelisauroidea incertae sedis.
    - date: "2026-07-21"
      note: Dispute expanded and kept nomen dubium — Olshevsky (1991), Tykoski
        and Rowe (2004), and Carrano and Sampson (2008, over-split argument)
        treat it as dubious/indeterminate, against only a weak "may be valid"
        from Novas and colleagues (2004).
etymology: From Coelurus (a related theropod genus, itself
  from Greek 'koilos' (hollow) and 'oura' (tail)) and Greek
  '-oides' (resembling); meaning 'Coelurus-like'.
pronunciation:
  phonetic: see-loo-ROY-deez
description: >
  Coeluroides is an extinct genus of theropod dinosaur that
  lived during the Late Cretaceous Period in what is now India.
  It is based solely on the holotype caudal vertebrae GSI
  K27/562, K27/574 and K27/595, discovered in a layer of the
  Lameta Formation. The type species, C. largus, was described
  by Friedrich von Huene and Charles Alfred Matley in 1933.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "38620"
  - source: wikidata
    id: Q309615
  - source: gbif
    id: "4822573"
species:
  - name: Coeluroides largus
    etymology: "Likely from Latin 'largus' meaning 'abundant/copious'."
    status: nomen dubium
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Maastrichtian
    location:
      country: IN
      locality: Bara Simla
      region: IN-MP
      formation: Lameta
      bed: Carnosaur
    type_specimen:
      specimen_id:
        - GSI K27/562
        - GSI K27/574
        - GSI K27/595
      specimen_type: syntype
      institution: GSI
      material: Three caudal vertebrae; originally identified as dorsal vertebrae by
        Huene and Matley (1933) and reinterpreted as caudals by Welles (1984) and Molnar
        (1990). A fourth possibly conspecific vertebra (K 27/695) and a tentatively
        referred posterior caudal (K 27/587) were noted by the original authors but not
        included in the type series.
      completeness: fragmentary
    erected_in: huene1933a
references:
  - id: huene1933a
    notes: Original description of Coeluroides largus on three vertebrae from
      the Lameta Formation. The authors identified the elements as dorsal
      vertebrae; later workers recognized them as caudals.
  - id: olshevsky1991a
    notes: Listed Coeluroides largus as a nomen dubium.
  - id: wilson2003a
    notes: Grouped Coeluroides among Lameta theropods based on bones of dubious
      association or immature individuals.
  - id: novas2004b
    notes: Follows Welles (1984) and Molnar (1990) in treating the type
      vertebrae as caudals. Leaves the validity of C. largus open, noting it
      may be a valid indeterminate abelisauroid.
  - id: tykoski2004a
    notes: Listed Coeluroides largus among nomina dubia.
  - id: carrano2008a
    notes: Found the material too fragmentary for specific diagnosis and argued
      the Lameta theropod assemblage is likely over-split, with Coeluroides
      possibly among only one or two abelisaurids present.
