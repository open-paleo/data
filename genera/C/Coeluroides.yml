      material: Three caudal vertebrae from the Carnosaur bed
        at Bara Simla, Jubbulpore. Huene and Matley (1933)
        originally identified the elements as dorsal vertebrae;
        Welles (1984) and Molnar (1990) reinterpreted them as
        caudals. A fourth possibly conspecific vertebra
        (K 27/695) and a tentatively referred posterior caudal
        (K 27/587) were noted by the original authors but not
        included in the type series.
