genus: Chadititan
parent: Rinconsauria
etymology: From Spanish chadi ('salt' or referring to the salt flats of the
  Salitral Moreno region) + Greek Titan (a giant from mythology), meaning 'titan
  of the salt'.
description: Chadititan is an extinct genus of titanosaurian dinosaurs from the
  Late Cretaceous (Campanian) Anacleto Formation of Argentina. The genus
  contains a single species, C. calvoi, known from several fragmentary
  skeletons. Chadititan is characterized by its small size compared to related
  taxa and its particularly gracile limbs.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Gracile humerus with very deep anterior excavation having well-defined
    dorsal and lateral margins
  - Homogeneously procoelous caudal vertebrae throughout the caudal series
  - Anterior caudals with neural arch continuous with the anterior margin of the
    vertebral centrum (not separated by a notch)
  - Caudal vertebrae elongate and transversely compressed with width/length
    index of 0.4-0.5 in anterior caudals
  - Femoral head dorsomedially projected, far from the level of the greater
    trochanter
