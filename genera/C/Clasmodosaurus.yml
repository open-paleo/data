genus: Clasmodosaurus
parent: Sauropoda
pronunciation:
  phonetic: KLAZ-mo-do-SAWR-us
etymology: From Greek 'klasma' (fragment) and 'odon' (tooth)
  plus 'sauros' (lizard); meaning 'fragment-tooth lizard',
  alluding to the fragmentary tooth material on which the
  genus was based.
description: >
  Clasmodosaurus is a sauropod from the Late Cretaceous of
  southern Patagonia, Argentina, founded on a few isolated
  teeth. Ameghino allied it with Ornithopsis; Huene (1929)
  reported the teeth as sauropod and as coelurosaurian in
  different parts of the same work, and finally judged them
  most likely to belong to a teleosaur, a marine crocodyliform.
  Powell (1986) reinterpreted them as titanosaurid, while
  holding that dental morphology alone cannot diagnose a
  dinosaur genus.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Tooth crown straight and sub-oval in cross-section in the
    lower portion, becoming laterally compressed and obliquely
    sharpened in the upper portion with lingual curvature.
  - Enamel smooth and shiny, bearing flat longitudinal folds —
    two on the labial surface and four on the lingual surface
    — each well separated from the others.
  - Longitudinal folds traverse the tooth crown in straight
    lines and pass without alteration into the root.
  - Posterior edge of the crown rectilinear, vertical and
    sharpened; anterior edge forming a convex arc, wider and
    more rounded, not sharpened.
  - Very small pulp lumen visible at apical fracture surfaces.
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "66270"
  - source: wikidata
    id: Q1768702
  - source: gbif
    id: "4823416"
species:
  - name: Clasmodosaurus spatula
    etymology: "From Latin 'spatula' (small flat blade), likely referring to
      the shape of the type teeth."
    status: nomen dubium
    type_species: true
    period:
      name:
        - Late Cretaceous
    location:
      country: AR
      region: AR-Z
      locality: Río Sehuen
      notes: The erecting paper places the type teeth no more finely than the
        Cretaceous of Patagonia, in the Guaranitic formation, an obsolete name
        covering much of the Patagonian Upper Cretaceous. Huene (1929) fixes the
        locality from Carlos Ameghino's account, on the eastern slope of a
        southern tributary of the Río Sehuen, about 50 km east of Lago Viedma
        and 30 km south of the settlement of Mata Amarilla, in the area Ameghino
        called Par Aik. Powell (1986) refers that locality only tentatively to
        the Cardiel Formation and gives its age as Late Cretaceous, reporting
        both Coniacian and Maastrichtian estimates for the unit. Successive
        workers have circumscribed the Upper Cretaceous units of this part of
        the Austral Basin differently — the Cerro Fortaleza Formation has also
        been treated as the Pari Aike, Chorrillo and Mata Amarilla formations —
        and no unqualified formation assignment has been published for these
        teeth.
    type_specimen:
      specimen_type: syntype
      status: unknown
      institution: MLP
      material: Three teeth (one cylindrical crown fragment with root base, one apical
        crown fragment, and one small nearly complete posterior crown); Huene (1929)
        figured them as plate 40, figs. 3-5.
      completeness: fragmentary
    synonyms:
      - name: Clasmodon spatula
        type: informal
        reason: The label placed by Ameghino on the original
          specimens read "Clasmodon spatula"; Huene (1929) noted
          this as a labeling variant rather than a formally
          published name.
    erected_in: ameghino1899b
    described_in: huene1929a
references:
  - id: ameghino1899b
    notes: In Spanish. Erects Clasmodosaurus spatula (p. 9) with a short
      diagnosis of the teeth, allying it with Ornithopsis Seeley; available
      under ICZN Article 12, though widely regarded as a nomen dubium.
  - id: huene1929a
    notes: Full redescription of the three type teeth — crown outline, labial
      and lingual enamel folds, crown edges and pulp lumen — with the first
      illustration (plate 40, figs. 3-5), and the type locality.
  - id: powell1986a
    notes: In Spanish. Places the type teeth at the Río Sehuen locality, Santa
      Cruz Province, refers that locality tentatively to the Cardiel Formation,
      and reinterprets the teeth as titanosaurid.
  - id: lacovara2014a
    notes: Records that the beds of the Cerro Fortaleza Formation have also been
      referred to the Pari Aike, Chorrillo and Mata Amarilla formations.
