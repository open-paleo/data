genus: Clasmodosaurus
parent: Sauropoda
pronunciation:
  phonetic: KLAZ-mo-do-SAWR-us
etymology: From Greek 'klasma' (fragment) and 'odon' (tooth)
  plus 'sauros' (lizard); meaning 'fragment-tooth lizard',
  alluding to the fragmentary tooth material on which the
  genus was based.
description: >
  Clasmodosaurus is a genus of titanosaurian sauropod dinosaur
  from the Mata Amarilla Formation and the Cerro Fortaleza
  Formation. It lived during the Late Cretaceous in what is now
  Argentina. It is known from five fossilized and assorted
  teeth, but is diagnosed by a unique combination of
  characters.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Tooth crown straight and sub-oval in cross-section in the
    lower portion, becoming laterally compressed and obliquely
    sharpened in the upper portion with lingual curvature.
  - Enamel smooth and shiny, bearing flat longitudinal folds —
    two on the labial surface and four on the lingual surface
    — each well separated from the others.
  - Longitudinal folds traverse the tooth crown in straight
    lines and pass without alteration into the root.
  - Posterior edge of the crown rectilinear, vertical and
    sharpened; anterior edge forming a convex arc, wider and
    more rounded, not sharpened.
  - Very small pulp lumen visible at apical fracture surfaces.
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "66270"
  - source: wikidata
    id: Q1768702
  - source: gbif
    id: "4823416"
synonyms:
