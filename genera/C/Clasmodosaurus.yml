    type: informal
    reason: The label placed by Ameghino on the original
      specimens read "Clasmodon spatula"; Huene (1929) noted
      this as a labeling variant rather than a formally
      published name.
species:
  - name: Clasmodosaurus spatula
    etymology: "From Latin 'spatula' (small flat blade), likely referring to
      the shape of the type teeth."
    status: nomen dubium
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Cenomanian
        - Turonian
      from_ma: 100.5
      to_ma: 89.8
    location:
      country: AR
      region: Santa Cruz
      formation: Mata Amarilla
      coordinates:
        - -49.583328
        - -69.566673
    type_specimen:
      specimen_type: syntype
      status: unknown
      institution: MLP
      material: Three teeth (one cylindrical crown fragment with root base, one apical
