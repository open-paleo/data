genus: Caudipteryx
parent: Caudipterygidae
pronunciation:
  phonetic: kaw-DIP-ter-iks
etymology: From Latin cauda ('tail') + Greek pteryx ('feather' or 'wing'), meaning 'tail feather'.
description: "Caudipteryx is a genus of small oviraptorosaurian dinosaurs that
  lived in China during the Early Cretaceous, around 124.6 million years ago.
  They were feathered and extremely bird-like in their overall appearance, to
  the point that some paleontologists suggested it was a bird. Two species have
  been described: C. zoui (the type species), in 1998, and C. dongi, in 2000.
  Caudipteryx had a stout trunk, long legs, and was probably a swift runner. Its
  discovery has led to many intensive studies and debate over the relationship
  between birds and dinosaurs."
diet: omnivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
  - forested
appearance:
  features:
    - feathered wings
    - feathered tail
  integument: feathered
diagnostic_features:
  - Elongate, hooked premaxillary teeth with broad roots; maxilla and dentary
    edentulous.
  - Tail short, comprising approximately 22 vertebrae and equal to about
    one-quarter of total body length.
  - Arm long relative to other non-avian theropods; hindlimb-to-forelimb ratio
    approximately 2.5.
  - Short manual unguals, less than 70% the length of the penultimate phalanx.
  - Remiges attached to second digit (second metacarpal, phalanx II-1, and base
    of phalanx II-2), with symmetrical vanes.
