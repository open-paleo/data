genus: Cariocecus
parent: Hadrosauroidea
etymology: Named for Cariocecus (also spelled Cariociecus), the Iberian god of
  war who became syncretised with Mars and Ares.
description: Cariocecus bocagei is an extinct species of hadrosauroid ornithopod
  dinosaurs known from the Early Cretaceous of what is now Portugal. C. bocagei
  is the only species in the genus Cariocecus. It is known from a partial skull
  that was discovered in 2016 and subsequently given a scientific name and
  description in 2025. This specimen represents the first iguanodontian skull to
  be found in the country.
