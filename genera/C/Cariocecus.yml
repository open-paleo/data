genus: Cariocecus
parent: Hadrosauroidea
etymology: Named for Cariocecus (also spelled Cariociecus), the Iberian god of
  war who became syncretised with Mars and Ares.
description: Cariocecus bocagei is an extinct species of hadrosauroid ornithopod
  dinosaurs known from the Early Cretaceous of what is now Portugal. C. bocagei
  is the only species in the genus Cariocecus. It is known from a partial skull
  that was discovered in 2016 and subsequently given a scientific name and
  description in 2025. This specimen represents the first iguanodontian skull to
  be found in the country.
dispute:
  summary: >
    Cariocecus bocagei is a basal hadrosauroid from the Lower Cretaceous
    of Portugal described by Bertozzo and others (2025).
  history:
    - date: "2026-06-27"
      note: Placed at Hadrosauroidea following the describers (Bertozzo
        and others, 2025); the placement is provisional.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - coastal
appearance:
  integument: scaled
  evidence: inferred
diagnostic_features:
  - Rostral ramus of the jugal completely co-ossified to the maxilla, forming a
    single bone unit
  - Supraorbital bone articulates solely with the lachrymal, with no contact
    with the prefrontal
  - Trilobated shape of the dorsal border of the ascending process of the
    supraoccipital
