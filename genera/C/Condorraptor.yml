genus: Condorraptor
parent: Piatnitzkysauridae
etymology: From Cerro Condor (a nearby village in Argentina) + Latin raptor, 'robber/thief'; means 'robber from Cerro Condor'
pronunciation:
  phonetic: CON-dohr-RAP-tuh
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
diagnostic_features:
  - Posterior incision between fibular condyle and medial part of proximal tibia
    absent (apomorphic reversal of neotheropodan synapomorphy)
  - Large, shallow depression laterally on the base of the cnemial crest
  - Pleurocoel in anterior cervical vertebrae placed behind the posteroventral
    corner of the parapophyses (posteroventral rather than dorsal/posterodorsal
    position)
  - Large nutrient foramina on the lateral side of the ischial peduncle of the
    ilium
  - Metatarsal IV with a distinct step dorsally between shaft and distal
    articular facet
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "64061"
  - source: wikidata
    id: Q2415707
  - source: gbif
    id: "4967089"
species:
  - name: Condorraptor currumili
    etymology: "Named for Hipolito Currumil, the landowner who discovered the fossil locality in the Cañadón Asfalto Basin of Argentina."
    status: valid
    type_species: true
    period:
      name:
        - Middle Jurassic
      stage:
        - Aalenian
        - Bajocian
    location:
      country: AR
      locality: Las Chacritas
      region: AR-U
      formation: Cañadón Asfalto
      notes: >
        Cúneo and colleagues (2013) date the strata above the uppermost
        basalt flow in the Cerro Cóndor area, which hold this taxon,
        "essentially early Middle Jurassic in age (Aalenian to probably
        Bajocian)", adding that the data "do not preclude a latest Toarcian
        age for the strata closest to the basalt horizons". The "Middle
        Jurassic (Callovian)" of Rauhut (2005) is the older age of the
        whole formation.
    size:
      length_m:
        min: 4.5
        max: 4.5
      weight_kg:
        min: 200
        max: 200
    type_specimen:
      specimen_id: [MPEF-PV 1672]
      specimen_type: holotype
      institution: MPEF
      material: Incomplete left tibia
      completeness: fragmentary
    erected_in: rauhut2005b
references:
  - id: rauhut2005b
  - id: cúneo2013a
    notes: Dates the interval overlying the uppermost basalt flow at Cerro
      Cóndor, which holds this taxon, as Aalenian to probably Bajocian, with a
      latest Toarcian age not precluded near the basalt.
  - id: benson2010c
    notes: Recovered Condorraptor as a piatnitzkysaurid megalosauroid, sister to Piatnitzkysaurus.
