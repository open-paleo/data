genus: Condorraptor
parent: Piatnitzkysauridae
etymology: From Cerro Condor (a nearby village in Argentina) + Latin raptor, 'robber/thief'; means 'robber from Cerro Condor'
description: Condorraptor is an extinct genus of megalosauroid theropod
  dinosaur. Its genus name means 'robber from Cerro Condor', referencing a
  nearby village, while its species name, currumili, is named after Hipolito
  Currumil, the landowner and discoverer of the locality. It was among the
  earliest large South American theropods, having been found in Lower Jurassic
  strata of the Cañadón Asfalto Formation in the Cañadón Asfalto Basin of
  Argentina. The type species, described in 2005, is Condorraptor currumili. It
  is based on a tibia, with an associated partial skeleton that may belong to
  the same individual. Initially described as a basal tetanuran, Benson (2010)
  found it to be a piatnitzkysaurid megalosauroid and the sister taxon of
  Piatnitzkysaurus, a finding supported by later studies.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
