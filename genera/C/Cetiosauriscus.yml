    institution: NHMUK
    category: pathology
    significance: "A distal caudal tail tip from a different individual, once referred to Cetiosauriscus. Across ten biconvex vertebrae it shows injury at two points, with breakage that later healed, identified as the same form of pathology seen in the tail of Diplodocus."
    references: [woodward1905a]
references:
  - id: woodward1905a
    notes: Original description of the holotype skeleton (R3078), as Cetiosaurus
      leedsi; made the holotype of C. stewarti by Charig (1980).
  - id: huene1927c
    notes: Erects the genus Cetiosauriscus, originally with C. leedsi as the
      type species.
  - id: huene1927b
    notes: Concise diagnosis of the genus in the "Short review of the present
      knowledge of the Sauropoda".
  - id: charig1980a
    notes: Describes Cetiosauriscus stewarti, later designated the type species
      of Cetiosauriscus by ICZN Opinion 1801 (1995).
  - id: charig1993a
    notes: Petition to the ICZN to designate C. stewarti as the type species of
      Cetiosauriscus.
  - id: iczn1995a
    notes: Designated C. stewarti Charig, 1980 as the type species of
      Cetiosauriscus, replacing the original type C. leedsi.
  - id: jones2026b
    notes: Source of the hip height estimate.
  - id: moore2020a
    notes: Source of the non-neosauropod eusauropod placement (near Omeisaurus),
      followed by later work.
  - id: tschopp2015a
    notes: Recovered Cetiosauriscus as a non-neosauropod eusauropod near Omeisaurus
      under implied weighting, though within Diplodocimorpha under equal weighting.
  - id: moore2023a
    notes: Mamenchisaurid phylogeny; treats Cetiosauriscus as a non-neosauropod
      eusauropod near Omeisaurus, following Moore et al. (2020).
