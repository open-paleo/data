genus: Cetiosauriscus
parent: Eusauropoda
dispute:
  summary: >
    Long allied with diplodocoids, Cetiosauriscus is no longer regarded as a
    member of Diplodocoidea. Tschopp et al. (2015) recovered it outside
    Neosauropoda as a non-neosauropod eusauropod (near Omeisaurus) under implied
    weighting, though within Diplodocimorpha under equal weighting; the
    non-neosauropod eusauropod reading follows Moore et al. (2020) and is
    continued by later work (Jones, 2026). Its precise position among eusauropods
    is unresolved.
  history:
    - date: "2026-06-30"
      note: >
        Removed from Diplodocoidea (formerly placed at Flagellicaudata) and
        reparented to Eusauropoda incertae sedis as a non-neosauropod eusauropod
        (Tschopp et al., 2015; Jones, 2026); finer placement among eusauropods
        remains unresolved.
    - date: "2026-07-02"
      note: Confirmed placement at Eusauropoda incertae sedis; recovered as a non-neosauropod eusauropod, with the historical diplodocid interpretation superseded and its finer position unresolved.
pronunciation:
  ipa: /ˌsiːtioʊˈsɔːrɪskəs/
  phonetic: SEE-tee-oh-SOR-iss-kuhs
etymology: "From Greek 'ketos' meaning 'sea monster' or 'whale', 'sauros'
  meaning 'lizard', and '-iskos' meaning 'resembling', meaning 'resembling
  Cetiosaurus' (the whale lizard)."
description: Cetiosauriscus is a genus of sauropod dinosaur that lived between
  166 and 164 million years ago during the Callovian (Middle Jurassic Period) in
  what is now England. A herbivore, Cetiosauriscus had - by sauropod standards -
  a moderately long tail, and longer forelimbs, making them as long as its
  hindlimbs. It has been estimated as about 15 m (49 ft) long and between 4 and
  10 t (3.9 and 9.8 long tons; 4.4 and 11.0 short tons) in weight.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - marine
appearance:
  integument: scaled
  evidence: inferred
diagnostic_features:
  - Extraordinarily short presacral and anterior caudal vertebrae
  - Posterior dorsal vertebrae with deep but circumferentially small pleurocoels
  - Fused neural spines on the middle sacral vertebrae
  - Broad, steeply inclined neural spines proportional to centrum length
  - Low, elongate ilium, lower than in Cetiosaurus, with a slender femur
  - Short humerus (about 0.69 of femoral length) with a proportionally long
    forearm, the radius lacking the proximal "Cetiosaurus beak"
