genus: Comptonatus
parent: Hadrosauriformes
etymology: From Compton (the village near the Isle of Wight discovery site) + Latin tonatus ('thundered'), meaning 'the Compton thunderer'.
description: Comptonatus is a genus of ornithopod dinosaur from the early
  Cretaceous period. Its remains are known from the Wessex Formation in England.
  The type and only species is C. chasei.
