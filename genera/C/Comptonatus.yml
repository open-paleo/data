genus: Comptonatus
parent: Hadrosauriformes
etymology: From Compton (the village near the Isle of Wight discovery site) + Latin tonatus ('thundered'), meaning 'the Compton thunderer'.
pronunciation:
  phonetic: COMP-tuh-NAH-tuss
description: Comptonatus is a genus of ornithopod dinosaur from the early
  Cretaceous period. Its remains are known from the Wessex Formation in England.
  The type and only species is C. chasei.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
diagnostic_features:
  - Parietal 'tubercle' and step dorsolateral to ascending process of
    supraoccipital
  - Exoccipital bar/bridge overhangs the exoccipital pillar
  - Dentary straight across entire ventral margin in lateral view
  - Tall neural spines on proximal caudal vertebrae (neural spine >3× height of
    centrum, ~4× in Cd1)
  - Coracoid boss on dorsolateral medial surface, with medial cavity buttressed
    by cornuate ridge
  - Prepubic blade markedly dorsoventrally expanded, ratio of maximum to minimum
    depth ~2.5
appearance:
  integument: scaled
  evidence: inferred
