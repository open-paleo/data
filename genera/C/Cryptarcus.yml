genus: Cryptarcus
parent: Chasmosaurinae
etymology: From Latin 'crypticus' (hidden) and 'arcus' (arch); refers both
  to the morphology of the transverse parietal bar and to the type species
  long being hidden within the genus Chasmosaurus.
pronunciation:
  phonetic: krip-TAR-kus
description: Cryptarcus is a genus of ceratopsid dinosaur found in the
  Dinosaur Park Formation of Alberta, dating to the middle Campanian age
  of the Late Cretaceous. The holotype skull measures approximately 94
  centimeters in length.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Posteroventral process of premaxilla terminates with a spatulate,
    non-tapering distal end.
  - Episquamosal bases become progressively longer posteriorly until the
    second-to-last episquamosal; the most posterior episquamosal then
    reverses the trend by being distinctly smaller.
  - Epiparietals 1 and 2 both have low dome-shaped profiles with
    lenticular loci.
  - Epiparietals 1 and 2 are fused with a visible suture and located
    entirely on the dorsal surface of the posterior parietal bar within
    the midline embayment.
  - Medial-most epiparietal (ep1) located at the base of the deep median
    parietal embayment with its locus nearly touching its bilateral
    counterpart at the midline.
  - Lateral portion of epiparietal 2 turns onto the posterior edge of the
    transverse parietal bar while its anteromedial end occupies the
    dorsal bar surface.
