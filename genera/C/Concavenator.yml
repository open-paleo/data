genus: Concavenator
parent: Carcharodontosauridae
etymology: From Latin Conca, an old name for Cuenca (the Spanish city near the
  discovery site), + Latin venator ('hunter'), meaning 'Cuenca hunter'.
description: Concavenator is a genus of carcharodontosaurian dinosaur that lived
  in Spain during the Early Cretaceous epoch, about 125 million years ago. The
  genus contains a single species, Concavenator corcovatus, named and described
  in 2010 from a nearly complete skeleton collected from the Las Hoyas fossil
  site of the La Huérguina Formation.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
diagnostic_features:
  - Four recesses on the nasal bones (three connected), with heavily rugose
    dorsal surface on the nasal bone.
  - Large, rounded, thickened postorbital brow occupying one-third of the orbit.
  - Tall neurapophyses of the eleventh and twelfth dorsal vertebrae exceeding
    five times the height of the centra, forming a pointed hump-like structure
    restricted to two presacral vertebrae.
  - Relatively high, cranially directed neurapophyses of the second and third
    caudal vertebrae with small thorn-like caudal processes at the base of each
    neurapophysis of the proximal caudal vertebrae.
  - Series of small bumps (quill knobs) along the posterolateral crest of the
    ulna, interpreted as feather follicle attachment sites.
