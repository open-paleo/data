genus: Concavenator
parent: Carcharodontosauridae
etymology: From Latin Conca, an old name for Cuenca (the Spanish city near the discovery site), + Latin venator ('hunter'), meaning 'Cuenca hunter'.
description: Concavenator is a genus of carcharodontosaurian dinosaur that lived
  in Spain during the Early Cretaceous epoch, about 125 million years ago. The
  genus contains a single species, Concavenator corcovatus, named and described
  in 2010 from a nearly complete skeleton collected from the Las Hoyas fossil
  site of the La Huérguina Formation.
diet: carnivore
locomotion: bipedal
