genus: Chingkankousaurus
parent: Tyrannosauroidea
pronunciation:
  phonetic: Jin-gang-kou
etymology: "Named after Ch'ing-kang-kou (Wade-Giles romanization; pinyin:
  Jin-gang-kou, meaning 'diamond port', Chinese: 金刚口), the village in Shandong
  Province, China where it was found, combined with Greek sauros meaning
  'lizard'. Full meaning: 'Chingkangkou lizard'."
description: Chingkankousaurus is a genus of theropod dinosaur containing the
  single species Chingkankousaurus fragilis. C. fragilis is known only from a
  single fossilized bone fragment (specimen number IVPP V 836) from the late
  Cretaceous Period Wangshi Series of Shandong province in eastern China.
dispute:
  summary: >
    Chingkankousaurus fragilis is a nomen dubium based on the posterior part
    of a single right scapula (IVPP V 836) from the Late Cretaceous of
    Shandong, China. Brusatte et al. (2013) upheld its identification as a
    scapula and placed it within Tyrannosauroidea, more derived than Guanlong
    and Dilong, but found no autapomorphies or unique character combination to
    diagnose the specimen. Holtz (2004) had referred it to Tarbosaurus and
    treated the species as a nomen dubium; Brusatte et al. (2013) considered
    that referral possible but unprovable, retaining the specimen as an
    indeterminate tyrannosauroid.
  history:
    - date: "2026-07-20"
      note: Species status set to nomen dubium following Brusatte et al.
        (2013), who found no diagnostic features on the holotype scapula but
        confirmed a tyrannosauroid placement.
diet: carnivore
locomotion: bipedal
