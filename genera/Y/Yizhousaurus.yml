genus: Yizhousaurus
parent: Sauropodiformes
etymology: "Named for the Yizhou region (Chuxiong Yi Autonomous Region) of Yunnan, China, combined with Greek 'sauros' meaning 'lizard'."
description: Yizhousaurus is a genus of basal sauropodiform dinosaurs which
  existed in what is now Lufeng Formation, Yunnan Province of southern China
  during the lower Jurassic period. Identified from a nearly complete and
  exquisitely preserved skeleton, it is the most complete basal sauropod
  currently known with intact skull. Although its name was revealed in a 2010
  Geological Society of America abstract by Sankar Chatterjee, T. Wang, S.G.
  Pan, Z. Dong, X.C. Wu, and Paul Upchurch, it wasn't validly named and
  described until 2018. The type species is Yizhousaurus sunae.
locomotion: facultative
paleoenvironment:
  - fluvial
  - lacustrine
diet: herbivore
diagnostic_features:
  - Lateral plates appressed to labial sides of premaxillary and maxillary teeth
    but not dentary teeth
  - Antorbital fenestra anteroposteriorly narrow and pipe-shaped in outline
  - Lacrimal shaft vertical with respect to maxillary ramus
  - Anterior tip of dentary anterodorsally curved over alveolar margin
  - Tiny external mandibular fenestra approximately 5% of mandibular length
  - Subelliptical cross-section of femoral midshaft with long axis oriented
    mediolaterally
