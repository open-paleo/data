genus: Yueosaurus
parent: Iguanodontia
etymology: "Named for 'Yue', the ancient name for Zhejiang Province, China, combined with Greek 'sauros' meaning 'lizard'."
pronunciation:
  phonetic: yoo-SOR-us
description: Yueosaurus is an extinct genus of basal neornithischian dinosaur
  known from Zhejiang Province, China.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
diagnostic_features:
  - Prominent and slightly ventrally directed cervical parapophyses
  - Slender and posteriorly inclined caudal neural spines
  - Anteroventral expansion of scapula exceeds posteroventral expansion;
    posterior edge nearly perpendicular to shaft
  - Scapula bears distinctive ventroscapular groove
  - Scapula possesses supraglenoidal buttress and supraglenoid fossa
  - Distal fibula anteroposteriorly compressed and tightly appressed to tibia
appearance:
  integument: scaled
  evidence: inferred
