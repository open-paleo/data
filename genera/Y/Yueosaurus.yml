genus: Yueosaurus
parent: Jeholosauridae
etymology: "Named for 'Yue', the ancient name for Zhejiang Province, China, combined with Greek 'sauros' meaning 'lizard'."
pronunciation:
  phonetic: yoo-SOR-us
description: Yueosaurus is an extinct genus of basal neornithischian dinosaur
  known from Zhejiang Province, China.
dispute:
  summary: >
    Yueosaurus tiantaiensis, formerly treated as a basal ornithopod, is
    recovered as a basal neornithischian (a jeholosaurid, in a clade
    with Jeholosaurus outside Cerapoda) by Boyd (2015) and Jones (2026);
    it is not an iguanodontian.
  history:
    - date: "2026-06-29"
      note: Reparented from Iguanodontia to Neornithischia incertae
        sedis following Boyd (2015) and Jones (2026); finer
        (jeholosaurid) placement deferred to the Neornithischia pass
        (P2).
    - date: "2026-06-29"
      note: Placed at Jeholosauridae (with Jeholosaurus) following Boyd
        (2015), Madzia and others (2018), Manitkoon and others (2023),
        and Jones (2026) (P3); Fonseca and others (2024) instead place
        Jeholosaurus in Thescelosaurinae, rendering Jeholosauridae
        inapplicable.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
diagnostic_features:
  - Prominent and slightly ventrally directed cervical parapophyses
  - Slender and posteriorly inclined caudal neural spines
  - Anteroventral expansion of scapula exceeds posteroventral expansion;
    posterior edge nearly perpendicular to shaft
  - Scapula bears distinctive ventroscapular groove
  - Scapula possesses supraglenoidal buttress and supraglenoid fossa
  - Distal fibula anteroposteriorly compressed and tightly appressed to tibia
appearance:
  integument: scaled
  evidence: inferred
