genus: Yulong
parent: Oviraptoridae
etymology: "From Chinese 豫 (yù), the one-character abbreviation of Henan Province (referencing the genus's occurrence there), and 龙 (lóng) meaning 'dragon', a common suffix for Chinese dinosaur names."
pronunciation:
  phonetic: ee-yuh-long
description: Yulong is an extinct genus of derived oviraptorid theropod dinosaur
  known from the Late Cretaceous Qiupa Formation of Henan Province, central China.
  It contains a single species, Yulong mini. It is known from many juvenile specimens
  that represent some of the smallest known oviraptorids and also a single subadult
  specimen.
diet: omnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Posterodorsal corner of antorbital fenestra and anteroventral corner of
    external naris at same level
  - Distinct opening in premaxilla anteroventral to external naris
  - Antorbital fossa partly bordered by premaxilla anterodorsally
  - Lacrimal process of premaxilla does not contact anterodorsal process of
    lacrimal
  - Parietal almost as long as frontal; in dorsal view, posterior margin forms
    straight line between postzygapophyses in fourth and fifth cervicals
  - Femur longer than ilium
appearance:
  features:
    - keratinous beak
    - feathered wings
  integument: feathered
  evidence: direct
identifiers:
  - source: pbdb
    id: "255219"
  - source: wikidata
    id: Q96676155
species:
  - name: Yulong mini
    etymology: "From Latin 'mini', meaning 'small' or 'miniature', in reference to the diminutive size of the specimens, which represent juvenile individuals."
    status: valid
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Maastrichtian
    location:
      country: CN
      locality: Qiupa Town
      region: CN-HA
      formation: Qiupa
      notes: Wei and colleagues (2022) give Yankan Village, Qiupa Town, for a referred
        subadult, but map the holotype's site separately.
    size:
      length_m:
        min: 0.5
        max: 0.5
      weight_kg:
        min: 2
        max: 2
      hip_height_m:
        min: 0.2
        max: 0.2
    erected_in: lü2013d
    type_specimen:
      specimen_id:
        - HGM 41HIII-0107
      specimen_type: holotype
      institution: HGM
      material: An exceptionally well-preserved skeleton with skull and lower jaws.
      completeness: partial
      notes: HGM 41HIII-0108 to -0111 are referred specimens (additional juvenile
        skulls and postcrania from nearby quarries), not part of the holotype.
notable_specimens:
  - specimen_id: [HGM 41HIII-0706]
    institution: HGM
    category: ontogeny
    significance: The first non-hatchling specimen of Yulong mini, a subadult about
      five or six years old by radius histology, preserving dorsal and caudal
      vertebrae, partial pectoral girdles and forelimbs; from Yankan Village,
      Qiupa Town.
    references: [wei2022a]
references:
  - id: lü2013d
  - id: jones2026c
    notes: Source of the body length, mass, and hip height estimates, and the
      appearance features.
  - id: wei2022a
    notes: Describes the subadult HGM 41HIII-0706, the first non-hatchling
      specimen, with a revised diagnosis and bone histology.
