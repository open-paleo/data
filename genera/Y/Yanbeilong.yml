genus: Yanbeilong
parent: Stegosaurinae
pronunciation:
  phonetic: yen-BAY-long
etymology: From Chinese yanbe meaning 'north of Yanmen Pass' (a region of Shanxi Province, China) and long meaning 'dragon'; translates as 'north of Yanmen Pass dragon'
description: Yanbeilong is an extinct genus of stegosaurian dinosaurs from the
  Early Cretaceous (Albian age) Zuoyun Formation of Shanxi, China. The genus
  contains a single species, Yanbeilong ultimus, known from a single partial
  skeleton including several vertebrae and the pelvic girdle. It is one of the
  youngest known stegosaurs, alongside Mongolostegus from Mongolia and unnamed
  stegosaurine remains from the Hekou Group of China, both of which date to the
  Aptian-Albian ages.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - High neural arch and small neural canal of dorsal vertebrae with neural arch
    to canal height ratio of 4.16–5.64 in most middle and posterior dorsals
  - Fewer true sacrals (three) as an adult than other known stegosaurs except
    Hesperosaurus mjosi
  - More slanted pre-acetabular processes that diverge widely from parasagittal
    plane, extending anteroventrally in lateral view
