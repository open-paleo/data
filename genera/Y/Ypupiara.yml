genus: Ypupiara
parent: Unenlagiinae
etymology: From Tupi (indigenous Brazilian language) meaning 'the one who lives in the water,' derived from a figure in Tupi mythology
description: Ypupiara is an extinct genus of unenlagiine theropod from the Late
  Cretaceous Serra da Galga Formation of Brazil. It was the first member of the
  Dromaeosauridae to be discovered in South America and the first member of the
  Unenlagiinae to be discovered, but not the first to be identified as such. The
  type and only species, Y. lopai, is known solely from a specimen that was
  destroyed in a fire in 2018.
diet: carnivore
locomotion: bipedal
