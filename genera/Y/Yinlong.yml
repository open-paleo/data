genus: Yinlong
parent: Chaoyangsauridae
etymology: From Mandarin Chinese yin (隱) meaning 'hidden' and long (龍) meaning
  'dragon'; translates as 'hidden dragon,' a reference to the film Crouching
  Tiger, Hidden Dragon filmed near the discovery site in Xinjiang
description: Yinlong is a genus of basal ceratopsian dinosaur from the Late
  Jurassic Period of China. By far the earliest known ceratopsian, it was a
  small, primarily bipedal herbivore.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Distinct fossa along the midline of the frontals
  - Trapezoidal quadratojugal longer than deep
  - Sharp ridges and grooves on the anterior surface of the proximal half of the
    paroccipital process
  - Long basipterygoid process oriented posteroventrally
  - Slit-like carotid canal laterally bordered by a lamina
  - Prominent tubercle on the posteroventral surangular and vertical wear facet
    with a basal shelf on premaxillary teeth
appearance:
  features:
    - cranial bosses
    - keratinous beak
  integument: scaled
  evidence: inferred
