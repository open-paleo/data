genus: Yixianosaurus
parent: Maniraptora
etymology: Named after the Yixian Formation of Liaoning, China where it was
  found, combined with Greek sauros meaning 'lizard'; translates as 'Yixian
  lizard'
description: Yixianosaurus is a maniraptoran theropod dinosaur genus from the
  Early Cretaceous of China.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
  - forested
diagnostic_features:
  - Manus 140% as long as humerus, longer than all other non-avian maniraptorans
    except Protarchaeopteryx and Epidendrosaurus
  - Manual phalanx II22 longer than metacarpal II, a feature unique among
    maniraptorans except Epidendrosaurus
  - Manual phalanx III23 244% as long as phalanx III21, the largest ratio among
    known maniraptorans
  - Manual phalanx III22 bears a proximoventral heel, a feature shared with
    basal dromaeosaurs
  - Scapula significantly shorter than humerus, a derived feature characteristic
    of Maniraptora
appearance:
  features:
    - elongate forelimbs
    - enlarged manual claws
  integument: feathered
  evidence: direct
