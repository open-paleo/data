references:
  - id: zhang2026a
    notes: Erects Yantaloong as the first turiasaurian sauropod from East Asia;
      proposes an expanded Turiasauria including Lapparentosaurus, Atlasaurus,
      and Jobaria.
  - id: huang2021a
    notes: >
      Places the Chuanjie Formation, which Zhang and colleagues (2026)
      correlate with the Zhanghe, in the Middle Jurassic from the top of the
      Toarcian to the Bathonian.
