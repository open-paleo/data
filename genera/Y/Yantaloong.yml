genus: Yantaloong
parent: Eusauropoda
etymology: From Chinese 'Yanta' (wild goose tower, a noted historical site in
  the Chuxiong Yi Autonomous Prefecture where the holotype was collected) and
  Mandarin 'loong' (dragon).
pronunciation:
  phonetic: YAN-tah-loong
description: Yantaloong is an extinct genus of basal eusauropod dinosaur from
  the Middle Jurassic middle Zhanghe Formation at Zhongbanjing Village,
  Yuanmou County, Chuxiong Yi Autonomous Prefecture, Yunnan Province, China.
  The single species, Yantaloong lini, is known from six nearly complete
  presacral vertebrae of an adult individual. Phylogenetic analyses by Zhang
  et al. (2026) recover Yantaloong as an early-branching member of an
  expanded Turiasauria, in a clade with Lapparentosaurus, Atlasaurus, and
  Jobaria, sister to the 'traditional' Iberian / North American
  turiasaurians. The authors claim Yantaloong is the first turiasaurian
  sauropod known from East Asia and argue its presence undermines the
  hypothesized East Asian sauropodomorph isolation. The expanded Turiasauria
  definition is single-paper-recent; the conservative parent Eusauropoda is
  used here pending broader adoption.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Posterior-most cervical vertebra bears a bifurcated posterior
    centrodiapophyseal lamina (bif.PCDL) and a bifurcated centropostzygapophyseal
    lamina (bif.CPOL).
  - Anterior-most dorsal vertebra has both an upper and a lower anterior
    centroparapophyseal lamina (u.ACPL and l.ACPL), with a small fossa at the
    anteroventral corner of the parapophysis.
  - Middle dorsal vertebrae bear a lamina-like anteromedial
    centropostzygapophyseal lamina (am.CPOL) and a prezygoparapophyseal
    lamina (PRPL) bifurcated both dorsally and ventrally with a ventral PRPL
    fossa.
  - Middle dorsal vertebrae possess a rhombus-shaped hyposphene supported by
    a vertical ventral infrahyposphenal lamina and paired ventrolateral
    infrahyposphenal laminae.
  - Posterior dorsal neural arches bear a dorsoventrally elongated oval-shaped
    hyposphene.
