      region: CN-YN
      formation: Zhanghe
      locality: Zhongbanjing Village
      part: middle
      notes: >
        Zhang and colleagues (2026) give "Zhanghe Formation, Middle
        Jurassic". They also relay a correlation of the Zhanghe with the
        Chuanjie Formation, which Huang and colleagues (2021) place in
        "the Middle Jurassic, including the top of Toarcian to
        Bathonian"; the Toarcian rests only on that relayed correlation.
    type_specimen:
