    etymology: Honors Professor Wenxun Lin for contributions to Chinese economic
      history studies and support for paleontological research in Yunnan.
    status: valid
    type_species: true
    period:
      name:
        - Middle Jurassic
      stage:
        - Aalenian
        - Bajocian
        - Bathonian
    location:
