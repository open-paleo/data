genus: Yunyangosaurus
parent: Tetanurae
etymology: "Named for Yunyang County in Chongqing, China, where the fossils were found, combined with Greek 'sauros' meaning 'lizard'."
description: Yunyangosaurus is a genus of possible megalosauroid dinosaur from
  the Xintiangou Formation in Chongqing, China. The type and only species is
  Yunyangosaurus puanensis. The name was first published in the 2019 SVP
  abstract book by Dai (2019) before it was formally described by Dai et al.
  (2020).
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
diagnostic_features:
  - Mediolateral width of axial centrum tapers ventrally, resulting in
    subtriangular outline in posterior view
  - Axis with accessory medial spinopostzygapophyseal lamina
  - Ball-like structure at anterior margin base of axial neural spine
  - Cervical epipophyses prominent and posteriorly oriented
  - Posterior cervical and anterior dorsal vertebrae with transversely
    bifurcated neural spines
  - Distinctive fossae immediately ventral to dorsal parapophyses
