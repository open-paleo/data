genus: Yeneen
parent: Saltasauroidea
etymology: "Named after Yeneen, an entity in Tehuelche (Aonikenk) culture tied to cold and winter weather; references the type locality La Invernada, a Spanish word for the wintering location of cattle."
pronunciation:
  phonetic: YEN-een
description: Yeneen is an extinct genus of titanosaurian sauropod dinosaurs
  known from the Late Cretaceous (Santonian age) Bajo de la Carpa Formation of
  Argentina. The genus contains a single species, Yeneen houssayi, known from at
  least one partial skeleton. Its discovery highlights the diversity of
  titanosaurs in this formation, which also includes Bonitasaura, Inawentu,
  Overosaurus, Rinconsaurus, and Traukutitan.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - arid
diagnostic_features:
  - Subcircular fossa on the anterolateral border of the postzygapophysis of the
    second dorsal vertebra in anterior view, bounded laterally by the
    postzygodiapophyseal lamina and medially by an accessory medial lamina
  - Prezygapophyseal centrodiapophyseal and centrodiapophyseal fossae of the
    fourth dorsal vertebra subdivided by accessory laminae that meet the
    paradiapophyseal lamina medially, enclosing small pneumatic cavities
  - Centrodiapophyseal lamina of the fifth through eighth dorsal vertebrae split
    into anterior and posterior branches with a dorsoventral groove between them
  - Spinoprezygapophyseal lamina well developed in the middle and posterior
    dorsal vertebrae
  - Subelliptical pneumatic fossa in the tenth dorsal vertebra, between the
    anterior and posterior spinodiapophyseal laminae
  - Acute spinoprezygapophyseal lamina in the anterior caudal vertebra,
    projecting laterally over the anterolateral border of the neural spine toward
    its distal end and forming a deep spinoprezygapophyseal fossa with the
    prespinal lamina
  - Medial aspect of the acetabulum formed almost entirely by the third sacral
    rib, with only a small contribution from the second and fourth
appearance:
  integument: scaled
  evidence: inferred
