genus: Yuzhoulong
parent: Macronaria
etymology: Named after Yuzhou, the ancient name for Chongqing, China, combined with Chinese long meaning 'dragon'; translates as 'Chongqing dragon'
pronunciation:
  phonetic: yoo-zho-long
description: Yuzhoulong is a genus of macronarian sauropod dinosaur from the
  Middle Jurassic Shaximiao Formation of Chongqing, China. The type and only
  species is Yuzhoulong qurenensis.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Two similar-sized accessory fossae on posterior surface of dorsal
    diapophyses of anterior dorsal vertebrae
  - Accessory lamina connecting spinopostzygapophyseal lamina and diapophysis of
    middle dorsal vertebrae
  - Preacetabular process of ilium prominent dorsolaterally twisted, nearly
    perpendicular to iliac blade
  - Anteriormost dorsal neural spine bifurcated; anterior dorsal spines
    transversely extended with sub-parallel lateral margins
  - Proximodistal length of humeral shaft to femoral shaft ratio less than 0.6
appearance:
  integument: scaled
  evidence: inferred
