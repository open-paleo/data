genus: Yimenosaurus
parent: Plateosauridae
pronunciation:
  phonetic: yee-MUHN-o-SAWR-us
etymology: Named after Yimen County (also written as Yiman) in Yunnan Province,
  China where it was found, combined with Greek sauros meaning 'lizard';
  translates as 'Yiman reptile'
description: Yimenosaurus is an extinct genus of plateosaurid sauropodomorph
  dinosaur that lived in China in the Early Jurassic. The genus was first named
  in 1990 by Ziqi Bai, Jie Yang and Guohui Wang, along with its type and only
  species, Yimenosaurus youngi. The species name honors renowned Chinese
  paleontologist Yang Zhongjian, the father of Chinese paleontology, known as
  C.C. Young in English. Known material includes the holotype, an almost
  complete skull and mandible, as well as incomplete cervical and dorsal
  vertebrae, a mostly complete sacrum, an ilium, ischia, partial ribs and
  complete femur, and a paratype, a well-preserved postcrania with a fragmentary
  skull. In 2010 Paul estimated its length at 9 meters (30 ft) and its weight at
  2 tonnes (2.2 short tons).
dispute:
  summary: >
    Yimenosaurus youngi was originally referred to Plateosauridae but has
    not been included in modern phylogenetic analyses, so its placement is
    provisional (Jones, 2026).
  history:
    - date: "2026-06-29"
      note: Reparented from the deprecated Prosauropoda to Plateosauridae following the historical assignment (P2); not tested in a modern analysis.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Moderate to large prosauropod attaining nine meters in length with
    relatively delicate skull
  - Cranial construction with relatively long and gracile elements composing the
    skull
  - Elliptical external nares and large triangular antorbital fenestra
  - Premaxilla and ascending process of maxilla relatively well developed with
    shortened ventral dental margin
  - Mandible relatively delicately constructed with well-developed mandibular
    fenestra positioned higher than in Lufengosaurus and Plateosaurus
  - Amphicoelous cervical and dorsal vertebrae with low neural arches and
    spines, lacking pleurocoels
  - Four premaxillary teeth, 17-18 maxillary teeth, 21-23 dentary teeth with
    compact arrangement
  - Teeth with relatively high spoon-shaped crowns with gently convex labial
    margin and conspicuous striations
  - Robust femur with conspicuous sinuous curvature and well-developed fourth
    trochanter located posterodorsally on midshaft
  - Short humerus three-fifths femur length, thick, lacking curvature with
    well-developed medial head
