genus: Yuanyanglong
parent: Oviraptorosauria
pronunciation:
  phonetic: ywen-YAHNG-long
etymology: From Chinese yuanyang meaning 'mandarin duck' (or 'lovebird') and
  long meaning 'dragon'; translates as 'lovebird dragon,' likely referring to
  the two individuals found together
description: Yuanyanglong is an extinct genus of oviraptorosaurian theropod
  dinosaurs from the Early Cretaceous Miaogou Formation of China. The genus
  contains a single species, Yuanyanglong bainian, known from two partial
  skeletons.
diet: omnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
appearance:
  integument: feathered
  evidence: inferred
diagnostic_features:
  - Preacetabular process of the ilium approximately 40% longer than the
    postacetabular process
  - Hook-like anteroventral process of the ilium extending only to the level of
    the dorsal acetabular margin
  - Reduced anterior process of the pubic boot, shorter than the hooked
    posterior process
  - Exceptionally slender tibiotarsus, with a distal-end mediolateral width to
    whole-bone length ratio of about 0.08
identifiers:
  - source: pbdb
    id: "502773"
  - source: wikidata
    id: Q130638027
species:
  - name: Yuanyanglong bainian
    etymology: "From the Chinese 'bainian' (百年) meaning 'a hundred years',
      commemorating the centenary of the first named oviraptorosaur taxa,
      Chirostenotes and Oviraptor, described in 1924."
    status: valid
    type_species: true
    period:
      name:
        - Early Cretaceous
      stage:
        - Aptian
        - Albian
      from_ma: 121.4
      to_ma: 100.5
    location:
      country: CN
      locality: Maortu
      region: Nei Monggol
      formation: Miaogou
      coordinates:
        - 40.271702
        - 105.75

    holotype:
      specimen_id: [ PV02476-1 ]
      specimen_type: holotype
      institution: IMM
      material: "Articulated partial skeleton: nearly complete, well-articulated
        pelvic girdle, partial hindlimb (most of the pes absent), partial pectoral
        girdle, forelimb (manus absent), and several vertebrae and ribs."
      completeness: partial
    erected_in: hao2025
notable_specimens:
  - specimen_id: [PV02476-2]
    institution: IMM
    species: Yuanyanglong bainian
    category: complementary
    significance: "Referred specimen found in association with the holotype on the same block. It preserves an incomplete skull, partial hindlimb, incomplete pelvis, dorsal vertebrae, and partial sacrum, adding cranial anatomy absent from the holotype, which lacks a skull."
