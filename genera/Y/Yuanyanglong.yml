genus: Yuanyanglong
parent: Oviraptorosauria
etymology: From Chinese yuanyang meaning 'mandarin duck' (or 'lovebird') and
  long meaning 'dragon'; translates as 'lovebird dragon,' likely referring to
  the two individuals found together
description: Yuanyanglong is an extinct genus of oviraptorosaurian theropod
  dinosaurs from the Early Cretaceous Miaogou Formation of China. The genus
  contains a single species, Yuanyanglong bainian, known from two partial
  skeletons.
