genus: Yangchuanosaurus
parent: Metriacanthosauridae
pronunciation:
  phonetic: YAHNG-CHWAHN-o-SAWR-us
etymology: Named for Yongchuan (historically romanized as Yangchuan), the
  district in Sichuan Province, China, where the fossils were found, combined
  with Greek 'sauros' meaning 'lizard'.
description: Yangchuanosaurus is an extinct genus of metriacanthosaurid theropod
  dinosaur that lived in China from the Middle Jurassic to Late Jurassic periods
  (Bathonian to Tithonian stages), and was similar (although slightly larger) in
  size and appearance to its North American and European relative, Allosaurus.
  Yangchuanosaurus hails from the Upper Shaximiao Formation and was the largest
  predator in a landscape that included the sauropods Mamenchisaurus and
  Omeisaurus and the stegosaurs Chialingosaurus, Tuojiangosaurus and
  Chungkingosaurus. This theropod was named after the area in which was
  discovered, Yongchuan, in China.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - "Skull with two pairs of antorbital fenestrae: first pair very large and
    triangular (inverted), second pair small and triangular"
  - Maxillary depression located behind the nasal naris; no gap between
    parietal, parietal process, and frontal bones
  - Angular bone slopes slightly posteriorly, elongating the mandibular lobe;
    large mandibular foramen in posterior mandible
  - Dental formula Pm4 M14-15 / D14-15; teeth laterally flattened, curved
    posteriorly, with serrated ridges (12 denticles per 5 mm)
  - Pubis fused to distal end of ischium; pubic foot poorly developed; ascending
    process of astragalus poorly formed
appearance:
  features:
    - nasal crest
  integument: scaled
  evidence: inferred
