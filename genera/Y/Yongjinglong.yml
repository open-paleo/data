genus: Yongjinglong
parent: Euhelopodidae
dispute:
  summary: >
    Yongjinglong was originally described as a derived titanosaurian
    saltasaurid (Li et al., 2014), but most recent analyses instead recover it
    within Euhelopodidae (Mannion et al., 2019; Shan et al., 2025; Jones,
    2026).
  history:
    - date: "2026-06-30"
      note: >
        Placed at Euhelopodidae following the prevailing recent analyses; the
        original derived-titanosaur placement is noted.
etymology: From Yongjing County, Gansu Province, China (near where the holotype was found) and Chinese long ('dragon'), meaning 'Yongjing dragon'
pronunciation:
  phonetic: yoong-jeeng-long
description: Yongjinglong is an extinct genus of titanosauriform sauropod
  dinosaur known from the Early Cretaceous of Lanzhou-Minhe Basin of Gansu
  Province, China. It contains a single species, Yongjinglong datangi.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - lacustrine
diagnostic_features:
  - Long-crowned, spoon-shaped premaxillary tooth
  - Axially elongate parapophyses on cervical vertebrae
  - Very deep lateral pneumatic foramina spanning cervical and cervicodorsal
    vertebral centra
  - Low unbifurcated neural spine forming cranially-pointing triangular plate in
    middle dorsal vertebra
  - XI-shaped configuration of laminae on middle dorsal vertebral arches
  - Very long scapular blade with exceptionally straight cranial and caudal edges
  - Tall deep groove on lateral surface of distal radius shaft
appearance:
  integument: scaled
  evidence: inferred
