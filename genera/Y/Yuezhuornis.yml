genus: Yuezhuornis
parent: Avialae
etymology: '"Yuezhuo" (Mandarin), a Chinese mythological bird, + "ornis" (Greek),
  bird'
description: Yuezhuornis is an extinct genus of basal avialan known from the
  Late Jurassic (Kimmeridgian–Tithonian ages) Nanyuan Formation of China. The
  genus contains a single species, Yuezhuornis yangyuanensis, known from a
  partial skeleton and skull. It has significantly shorter arms than its closest
  relatives—being proportionally more similar to many non-avialan
  theropods—implying it was incapable of flight. It was a close relative of
  Zhengheornis, which is known from the same locality.
locomotion: bipedal
diagnostic_features:
  - Maxillary teeth serrated distally and not constricted below the crowns
    (possible autapomorphy)
  - Slender jugal with a reduced quadratojugal process and a blunt-ended
    postorbital process (possible autapomorphy)
  - Penultimate manual phalanges with enlarged ventral heels proximally
    (possible autapomorphy)
  - Forelimb one-third shorter than the hind limb, with the humerus shorter than
    the femur
  - Trapezoidal coracoid with an anterior surface sculpted by numerous pits
  - Metatarsals II-IV not ginglymoid; pedal phalanx II-1 (or II-2) with a
    dorsally placed collateral ligament fossa and a large proximoventral heel
