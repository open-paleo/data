genus: Yamanasaurus
parent: Saltasaurinae
etymology: "Named after the locality of Yamana in southern Ecuador where the fossils were found, combined with Greek sauros meaning 'lizard'; translates as 'Yamana lizard'"
description: Yamanasaurus is an extinct genus of saltasaurine titanosaurian
  dinosaur from the Río Playas Formation of Ecuador, which dates to the
  Campanian-Maastrichtian of the late Cretaceous period (approximately 75-70
  million years ago). The type and only species is Yamanasaurus lojaensis,
  representing the first non-avian dinosaur described from Ecuador. The
  holotype, consisting of fragments of a humerus, radius, tibia, two sacral
  vertebrae and a single caudal, was discovered in 2017.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Anterior to mid-caudal vertebrae with a dorsoventrally compressed condyle,
    the posterior tip raised relative to the midline, and no longitudinal ventral
    ridge
  - Spongy inner structure with absence of internal cavities (camellate bone) in
    anterior-mid caudal vertebrae
  - Last sacral centrum as long as tall with small ovoid shallow blind fossa on
    lateral side
  - Radius robust with flattened diaphysis and marked neck under epiphysis with
    heptagonal proximal articular surface
