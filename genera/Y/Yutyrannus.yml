genus: Yutyrannus
parent: Proceratosauridae
etymology: feathered tyrant
description: Yutyrannus is a genus of proceratosaurid tyrannosauroid dinosaur
  which contains a single known species, Yutyrannus huali. This species lived
  during the early Cretaceous period in what is now northeastern China. Three
  fossils of Yutyrannus huali — all found in the rock beds of Liaoning Province
  — are the largest-known dinosaur specimens that preserve direct evidence of
  feathers.
