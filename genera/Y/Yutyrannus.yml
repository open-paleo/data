genus: Yutyrannus
parent: Proceratosauridae
etymology: "From Mandarin Chinese 'yu' meaning 'feather' and Latinized Greek
  'tyrannos' meaning 'tyrant', translating as 'feathered tyrant'."
description: Yutyrannus is a genus of proceratosaurid tyrannosauroid dinosaur
  which contains a single known species, Yutyrannus huali. This species lived
  during the early Cretaceous period in what is now northeastern China. Three
  fossils of Yutyrannus huali - all found in the rock beds of Liaoning Province
  - are the largest-known dinosaur specimens that preserve direct evidence of
  feathers.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
  - forested
appearance:
  features:
    - nasal crest
    - elongate forelimbs
  integument: feathered
diagnostic_features:
  - Rugose, highly fenestrated midline crest formed by premaxillae and nasals
  - Anteroventrally projecting orbital process at junction of frontal and jugal
    processes of postorbital
  - Large concavity on lateral surface of main body of postorbital
  - External mandibular fenestra located mostly within surangular
  - Long filamentous feathers extensively covering body
