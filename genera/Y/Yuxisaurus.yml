    notes: Named Yuxisaurus and recovered it as an early-diverging thyreophoran
      near Emausaurus, outside Eurypoda.
  - id: jones2026a
    notes: Treats Yuxisaurus as an early-diverging thyreophoran.
  - id: fonseca2024a
    notes: Recovered Yuxisaurus outside Eurypoda.
  - id: sánchez-fenollosa2025a
    notes: Recovered Yuxisaurus outside Eurypoda.
