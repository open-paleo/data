genus: Yuxisaurus
parent: Thyreophora
etymology: Named after Yuxi, a city in Yunnan Province, China (the type
  locality), combined with Greek sauros ('lizard'), meaning 'Yuxi lizard'
pronunciation:
  phonetic: YOO-she-SOR-us
description: Yuxisaurus is an extinct genus of early thyreophoran dinosaur from
  the Early Jurassic (Sinemurian-Toarcian) Fengjiahe Formation of southwestern
  China. The genus contains a single species, Yuxisaurus kopchicki, known from a
  partial skeleton and many osteoderms.
dispute:
  summary: >
    Yuxisaurus is an Early Jurassic Chinese thyreophoran recovered as an
    early-diverging member of the clade, most closely related to
    Emausaurus and outside Eurypoda (Yao and others, 2022; Jones, 2026). A
    later analysis tentatively recovered it as a basal parankylosaur, but
    with poor support.
  history:
    - date: "2026-06-29"
      note: Placed at Thyreophora (basal grade) following Yao and others (2022) and Jones (2026); a weakly supported parankylosaur alternative is recorded.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
appearance:
  integument: armored
diagnostic_features:
  - Deep, subtriangular, dorsoventrally elongated depression on either side of
    the nuchal crest
  - V-shaped notch on the dorsal margin of the paroccipital process
  - Basal tubera considerably ventrally offset with respect to the occipital
    condyle, clearly visible in posterior view
  - Basipterygoid processes ventrally offset with respect to the basal tubera,
    creating a dorsoventrally deep, stepped basicranial profile in lateral view
  - Cultriform process ventrally offset with respect to the occipital condyle in
    lateral view
  - Angular with elongate, dorsally deflected posterior process that almost
    reaches the posterior margin of the retroarticular process
  - Atlas intercentrum with symmetrical anterolaterally directed low ridges and
    associated arrow-like depressions on its ventral surface
  - Relatively short anterior cervical centra (length/height ratio less than 1.5)
  - Cervical centra lack ventral keels
  - Border of the medial condyle of the distal femur invaginated to form a
    broad, U-shaped trough
