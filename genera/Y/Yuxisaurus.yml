genus: Yuxisaurus
parent: Thyreophora
description: Yuxisaurus is an extinct genus of early thyreophoran dinosaur from
  the Early Jurassic (Sinemurian-Toarcian) Fengjiahe Formation of southwestern
  China. The genus contains a single species, Yuxisaurus kopchicki, known from a
  partial skeleton and many osteoderms.
