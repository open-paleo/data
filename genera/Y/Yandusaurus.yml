genus: Yandusaurus
parent: Neornithischia
pronunciation:
  phonetic: YEN-DOO-SAWR-us
etymology: From Yandu (the ancient name for Zigong, Sichuan Province, China,
  meaning 'salt capital') and Greek sauros ('lizard'), meaning 'Yandu lizard'
description: Yandusaurus is a genus of basal neornithischian dinosaur from the
  middle Jurassic (Bathonian age, approximately 168 to 162 Ma) of eastern Asia.
  The type species is Y. hongheensis, described in 1979 from the Lower Shaximiao
  Formation of Sichuan Province, China.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
appearance:
  features:
    - keratinous beak
  integument: scaled
  evidence: inferred
