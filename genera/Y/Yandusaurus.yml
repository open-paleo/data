genus: Yandusaurus
parent: Neornithischia
pronunciation:
  phonetic: YEN-DOO-SAWR-us
etymology: From Yandu (the ancient name for Zigong, Sichuan Province, China,
  meaning 'salt capital') and Greek sauros ('lizard'), meaning 'Yandu lizard'
description: Yandusaurus is a genus of basal neornithischian dinosaur from the
  middle Jurassic (Bathonian age, approximately 168 to 162 Ma) of eastern Asia.
  The type species is Y. hongheensis, described in 1979 from the Lower Shaximiao
  Formation of Sichuan Province, China.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
appearance:
  features:
    - keratinous beak
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "52891"
  - source: wikidata
    id: Q980959
  - source: gbif
    id: "4823168"
  - source: eol
    id: "52571968"
synonyms:
  - name: Honghesaurus
    type: nomen nudum
    reason: Informal name; never met ICZN requirements for formal publication and is
      treated as referable to Yandusaurus. Per Olshevsky's Dinosaur Genera List.
  - name: Yubasaurus
    type: nomen nudum
    reason: Informal name; never met ICZN requirements for formal publication and is
      treated as referable to Yandusaurus. Per Olshevsky's Dinosaur Genera List.
species:
  - name: Yandusaurus hongheensis
    etymology: "Named for the Honghe River near which the holotype was found."
    status: valid
    type_species: true
    period:
      name:
        - Middle Jurassic
        - Late Jurassic
      stage:
        - Bajocian
        - Bathonian
        - Callovian
        - Oxfordian
    location:
      country: CN
      locality: Hongheba, Zigong
      region: CN-SC
      formation: Shaximiao
      part: upper
      notes: Li and colleagues (2011), reviewing the Shaximiao's dinosaur
        assemblages, place this species in the upper member at Hongheba,
        apart from the Dashanpu taxa of the lower member. Weishampel and
        colleagues (2004) and Jones (2026) instead file it under the lower
        Shaximiao, in faunal lists that group the Sichuan taxa together.
    type_specimen:
      specimen_id: [ GCC V20501 ]
      specimen_type: holotype
      institution: CUT
    size:
      length_m:
        min: 3.0
        max: 3.0
      weight_kg:
        min: 7
        max: 140
    erected_in: he1979a
