genus: Yamatosaurus
parent: Hadrosauridae
etymology: "Named after Yamato, an ancient name for Japan, combined with Greek sauros meaning 'lizard' (or Latin saurus); translates as 'Yamato reptile'"
description: Yamatosaurus is a genus of basal hadrosaurid from the Late
  Cretaceous (Maastrichtian)-aged Kita-Ama Formation of Awaji Island, Japan. The
  genus contains a single species, Yamatosaurus izanagii.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - marine
diagnostic_features:
  - Dentary teeth with crown-root angle between 110-130 degrees
  - Low angle between dentary symphysis and lateral surface of dentary
  - Ventrally facing ventral surface of surangular
  - Single functional tooth per tooth position in middle dental battery (unique
    among Eolambia and higher taxa)
  - Complete absence of branched ridges on dentary tooth occlusal surfaces
