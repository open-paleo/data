genus: Yamatosaurus
parent: Hadrosauridae
etymology: "The generic name, Yamatosaurus, refers to Yamatai, also known as
  Yamato, an ancient region in Japan ruled by the Yamato Kingdom, while the
  specific name, Y. izanagii, refers to the deity Izanagi, who created eight
  islands in Yamato: Awaji Island (where the holotype was discovered) Shikoku,
  Oki, Kyushu, Iki, Tsushima, Sado and Honshu."
description: Yamatosaurus is a genus of basal hadrosaurid from the Late
  Cretaceous (Maastrichtian)-aged Kita-Ama Formation of Awaji Island, Japan. The
  genus contains a single species, Yamatosaurus izanagii.
diet: herbivore
