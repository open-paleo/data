genus: Yingshanosaurus
parent: Stegosauria
etymology: Named after Yingshan (a locality in Sichuan Province, China),
  combined with Greek sauros meaning 'lizard'; translates as 'Yingshan lizard'
description: Yingshanosaurus is an extinct genus of stegosaurian dinosaurs from
  the Middle Jurassic of what is now Southwestern China. It is known from a
  partial skeleton discovered in 1983, including back, sacrum, and tail
  vertebrae, forelimb and hindlimb bones, shoulder and hip bones, and several
  osteoderms, including plates and a shoulder spine. The genus contains a single
  species, Yingshanosaurus jichuanensis, named and described in 1994. For some
  time after its discovery and scientific description, many paleontologists were
  unaware of the Chinese research published on it and questioned its validity.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
appearance:
  integument: armored
diagnostic_features:
  - Dorsal neural spines with enlarged, truncated apices and ~60° angle to
    transverse processes
  - Sacral region nearly completely closed with five fused vertebrae including
    one strengthened lumbar
  - Anterior caudal neural spines not bifurcating at apex, expanded at top
  - Femur to tibia ratio 1:0.69, relatively large forelimb proportions
  - Plate-like osteoderms arranged symmetrically left and right
  - Reinforced pelvic girdle with deep acetabulum and prominent pubic tubercle
