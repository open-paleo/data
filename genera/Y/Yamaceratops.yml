genus: Yamaceratops
parent: Neoceratopsia
etymology: "Named after Yama, a Tibetan Buddhist deity, combined with Greek 'keras' meaning 'horn' and 'ops' meaning 'face'"
pronunciation:
  phonetic: YAH-mah-SEH-ruh-tops
description: Yamaceratops is a genus of primitive ceratopsian that lived during
  the Late Cretaceous in what is now Mongolia. The genus contains a single
  species, Y. dorngobiensis. It was a relatively small dinosaur, with an
  estimated length of 50 cm (1.6 ft) and weighing around 2 kg (4.4 lb).
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Unkeeled rostral unlike all other Neoceratopsia (optimization-dependent
    unique trait)
  - Rostral patterned with anastomosing ridges and grooves
  - Angular with two tubercles along ventral edge (unique trait)
  - Subtemporal part of jugal lobate and deeper than suborbital section
  - Epijugal ossification present
appearance:
  features:
    - neck frill
  integument: scaled
  evidence: inferred
