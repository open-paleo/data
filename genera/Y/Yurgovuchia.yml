genus: Yurgovuchia
parent: Dromaeosaurinae
etymology: coyote
description: Yurgovuchia is a genus of dromaeosaurid theropod dinosaurs that
  lived in North America during the Early Cretaceous period in what is now the
  Cedar Mountain Formation. It contains a single species, Yurgovuchia doellingi.
  The remains were discovered in Utah, United States.
