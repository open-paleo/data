genus: Yurgovuchia
parent: Dromaeosaurinae
etymology: From the Ute language meaning 'coyote,' referencing the indigenous peoples of Utah where it was found
pronunciation:
  phonetic: yuhr-go-VOO-chee-uh
description: Yurgovuchia is a genus of dromaeosaurid theropod dinosaurs that
  lived in North America during the Early Cretaceous period in what is now the
  Cedar Mountain Formation. It contains a single species, Yurgovuchia doellingi.
  The remains were discovered in Utah, United States.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Centrum of axis with single pneumatopore on each side
  - Cranial end of centrum of third cervical vertebra not beveled
  - Cervical prezygapophyses flexed
  - Epipophyses of cervical vertebrae above postzygapophyseal facets
  - Cervico-dorsal vertebrae with hypapophyses and without pneumatopores
  - Cranial faces of centra of proximal caudal vertebrae round
  - Pubis without pubic tubercle
