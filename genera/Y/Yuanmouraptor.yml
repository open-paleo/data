genus: Yuanmouraptor
parent: Metriacanthosauridae
etymology: From 'Yuanmou' (Yuanmou County, Yunnan Province, China, the type
  locality) and Latin 'raptor' (robber).
description: Yuanmouraptor is an extinct genus of basal metriacanthosaurid
  theropod from the early Middle Jurassic (Aalenian-Bajocian) Zhanghe
  Formation at Xiabanjing Village, Yuanmou County, Chuxiong Yi Autonomous
  Prefecture, Yunnan Province, China. The single species, Yuanmouraptor
  jinshajiangensis, is known from a near-complete skull with mandible
  (reconstructed length ~60 cm) articulated with 10 cervical vertebrae and
  the first dorsal (LFGT-ZLJ0115). Zou et al. (2025) recover Yuanmouraptor
  as the most basal-branching member of Metriacanthosauridae in their
  equal-weights phylogenetic analysis.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Anterior process of postorbital sheet-shaped with depth remaining consistent
    throughout its length.
  - Ventral ramus of postorbital bearing a laterally twisted trough running
    along its lateral surface.
  - Strongly posteriorly elongated epipophyses on anterior cervical vertebrae.
  - Strongly ventromedially excavated pneumatic foramen on the third cervical
    vertebra.
  - Posterior cervical vertebrae with sheet-shaped and subrectangular neural
    spines.
