genus: Yunnanosaurus
parent: Sauropodiformes
pronunciation:
  ipa: /juːˌnænoʊˈsɔːrəs/
  phonetic: yoo-NAN-oh-SOR-uhs
etymology: "Named for Yunnan Province, China, where the fossils were found,
  combined with Greek 'sauros' meaning 'lizard'."
description: Yunnanosaurus is an extinct genus of sauropodomorph dinosaur that
  lived approximately 199 to 183 million years ago in what is now the Yunnan
  Province, in China, for which it was named. Yunnanosaurus was a large sized,
  moderately-built, ground-dwelling, quadrupedal herbivore, that could also walk
  bipedally, and ranged in size from 7 meters (23 feet) long and 2 m (6.5 ft)
  high to 4 m (13 ft) high in the largest species.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Teeth subcylindrical and sharply pointed
appearance:
