genus: Yunnanosaurus
parent: Sauropodiformes
placement: incertae sedis
pronunciation:
  ipa: /juːˌnænoʊˈsɔːrəs/
  phonetic: yoo-NAN-oh-SOR-uhs
etymology: Named for Yunnan Province, China, where the fossils were found,
  combined with Greek 'sauros' meaning 'lizard'.
description: Yunnanosaurus is an extinct genus of sauropodomorph dinosaur that
  lived approximately 199 to 183 million years ago in what is now the Yunnan
  Province, in China, for which it was named. Yunnanosaurus was a large sized,
  moderately-built, ground-dwelling, quadrupedal herbivore, that could also walk
  bipedally, and ranged in size from 7 meters (23 feet) long and 2 m (6.5 ft)
  high to 4 m (13 ft) high in the largest species.
dispute:
  summary: >
    Yunnanosaurus huangi is most commonly recovered among non-sauropodan
    sauropodiforms: Sekiya et al. (2013) recovered the Yunnanosaurus clade as
    the sister taxon of Sauropoda, and Zhang et al. (2018) treated it among
    the uncontroversial non-sauropodan sauropodomorphs of the Lufeng Basin.
    Rauhut et al. (2020) instead recovered it within Massospondylidae, in a
    subclade with Jingshanosaurus and Seitaad.
  history:
    - date: 2026-06-29
      note: Placed at Sauropodiformes incertae sedis following the prevailing view and
        Jones (2026); the Massospondylidae alternative is recorded.
    - date: "2026-07-28"
      note: Retained at Sauropodiformes incertae sedis following Sekiya et al.
        (2013) and Zhang et al. (2018); the Massospondylidae placement of Rauhut
        et al. (2020) is recorded as the competing hypothesis.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Small external naris, about 10% of maximum skull length
  - Robust, rostrocaudally expanded nasal process of the premaxilla
  - Ventral projection from the caudal margin of the ascending maxillary
    process
  - Nutritive foramina absent from the lateral surface of the maxilla
  - Shallow, subcircular fossa on the lateral surface of the ventral lachrymal
    process
  - Midline boss near the rostral end of the frontals
  - Prominent midline boss on the parietals
  - Rostrolateral process of the parietal rostrocaudally expanded relative to
    the width of the caudolateral process
  - Maxillary teeth mesiodistally narrow and lacking denticles
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "56630"
  - source: wikidata
    id: Q427650
  - source: gbif
    id: "4817967"
species:
  - name: Yunnanosaurus huangi
    etymology: Named for Huang Chiching (T.K. Huang), the director of the National
      Geological Survey of China at the time the species was described.
    status: valid
    type_species: true
    period:
      name:
        - Early Jurassic
      stage:
        - Hettangian
        - Sinemurian
    location:
      country: CN
      region: CN-YN
      formation: Lufeng
      locality: Huangchiatien
      member: Zhangjiawa
      notes: Barrett and colleagues (2007) give the Dark Red Beds of the
        Lower Lufeng Formation, which Norman and colleagues (2007) and Zhang
        and colleagues (2018) equate with the Zhangjiawa Member.
    size:
      weight_kg:
        min: 240
        max: 240
      length_m:
        min: 7
        max: 13
      hip_height_m:
        min: 2
        max: 4
    type_specimen:
      specimen_id:
        - NGMJ 004546
      specimen_type: holotype
      institution: NGMJ
      material: Almost complete skeleton with skull, atlas and axis, further
        cervical, dorsal and caudal vertebrae, haemal arches, left scapula,
        sternum, both humeri, right ulna, partial left manus, pelvic girdle,
        hindlimbs and two metatarsals
      completeness: partial
      former_ids:
        - from_id: IVPP V 20
          to_id: NGMJ V0116
          from_institution: IVPP
          to_institution: NGMJ
          reason: rehoused
          source: barrett2007a
          notes: No source cited here records the date of the move, and the
            original number remains in use; Zhang (2024) cites the specimen as
            "IVPP V 20/NJGM 004546".
        - from_id: NGMJ V0116
          to_id: NGMJ 004546
          reason: renumbered
          source: barrett2007a
          notes: NGMJ V0116 is the number carried on the display-case label.
            Barrett and colleagues (2007) give NGMJ 004546 as the correct
            accession number.
    erected_in: young1940a
    described_in: barrett2007a
  - name: Yunnanosaurus youngi
    etymology: Honors Professor C. C. Young, who first studied the Lufeng Basin
      dinosaurs and erected the family Yunnanosauridae.
    status: valid
    type_species: false
    period:
      name:
        - Middle Jurassic
      stage:
        - Bajocian
        - Bathonian
    location:
      country: CN
      region: CN-YN
      formation: Zhanghe
      locality: Banqing Houshanliangzi, Jiangyi
    type_specimen:
      specimen_id:
        - CXMVZA 185
      specimen_type: holotype
      institution: CPM
      material: "Partial postcranial skeleton: 10 cervical, 14 dorsal, 3 fused sacral,
        17 caudal vertebrae, both pubes, ischia, and right ilium; no skull,
        pectoral girdle, forelimbs, or hindlimbs."
    size:
      length_m:
        min: 13
        max: 13
    diagnostic_features:
      - Sixth cervical vertebra the longest in the vertebral column.
      - Neural spines of the posterior cervical vertebrae short, with an expanded
        distal end wider than its anteroposterior length.
      - Three sacral vertebrae tightly fused, with a stout sacrocostal yoke
        contacting the inner surface of the ilium.
      - Ventral margin of the postacetabular process of the ilium slightly
        concave (reversed V-shaped in Y. huangi).
      - Ischium longer than the pubis, the latter with a rounded distal end
        (pubis longer than ischium in Y. huangi).
    erected_in: lü2007d
notable_specimens:
  - specimen_id:
      - ZMNH-M8739
    institution: ZMNH
    category: ontogeny
    significance: Juvenile referred to Yunnanosaurus robustus with partial cranial
      material and an almost complete postcranial skeleton; comparison with
      adult Y. huangi reveals very distinctive growth changes and characteristic
      dentition suggesting a potentially unique feeding mechanism.
    references:
      - sekiya2013a
references:
  - id: young1940a
  - id: sekiya2013a
    notes: Recovered the Yunnanosaurus clade as the sister taxon of Sauropoda.
  - id: zhang2018a
    notes: Treated Yunnanosaurus among the uncontroversial non-sauropodan
      sauropodomorphs of the Lufeng Basin.
  - id: rauhut2020a
    notes: Recovered Yunnanosaurus within Massospondylidae, in a subclade with
      Jingshanosaurus and Seitaad.
  - id: paul2024a
    notes: Source of the mass estimate.
  - id: jones2026b
    notes: Placement and assessment in the Princeton Encyclopedia of Dinosaurs.
  - id: lü2007d
    notes: Erects Yunnanosaurus youngi on skeleton CXMVZA 185 from the Middle
      Jurassic Zhanghe Formation of Yuanmou, Yunnan.
  - id: zhang2024a
  - id: barrett2007a
    notes: Redescribes the holotype skull and emends the diagnosis on cranial
      characters alone. Gives the type locality as Huangchiatien village, in
      the Dark Red Beds of the Lower Lufeng Formation.
  - id: young1942b
    notes: Young's full description of the genus and species, which later work
      cites as the original description.
  - id: norman2007a
    notes: Records that the Dull Purplish Beds and Dark Red Beds were formally
      designated the Shawan and Zhangjiawa members.
