genus: Yunmenglong
parent: Euhelopodidae
pronunciation:
  phonetic: YOON-mung-long
etymology: Named after the Yunmengshan area of Henan Province, China where it was found, combined with Chinese long meaning 'dragon'; translates as 'Yunmeng dragon'
description: Yunmenglong is an extinct genus of somphospondylan sauropod known
  from the late Early Cretaceous of Henan Province, central China. Its remains
  were discovered in the Haoling Formation of the Ruyang Basin. The type species
  is Yunmenglong ruyangensis, described in 2013 by Junchang Lü et al. on the
  basis of an incomplete postcranial skeleton. Yunmenglong shares some
  characters with Euhelopus, Qiaowanlong, and Erketu; a phylogenetic analysis
  places it as a sister taxon of Qiaowanlong, both grouped with Erketu in a
  position more derived than Euhelopus but basal to Titanosauria.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Distal end of neural spine of caudal vertebrae ball-shaped with coarse
    surfaces, without postspinal fossa
  - Extreme elongation of cervical vertebrae with elongation index > 2.5,
    reaching greatest length in sixth and seventh elements
  - Epipophyses of postaxial cervical vertebrae much elongated and rod-like,
    extending beyond posterior margins of postzygapophyses
  - "Two fossae on longitudinal depression of lateral surfaces of cervicals:
    anterior shallow and posterior deep piercing centrum"
  - Neural canal of dorsal vertebra triangular in posterior view, located within
    large concavity formed by centropostzygapophyseal laminae
