genus: Yunmenglong
parent: Somphospondyli
etymology: Named after the Yunmengshan area of Henan Province, China where it was found, combined with Chinese long meaning 'dragon'; translates as 'Yunmeng dragon'
description: Yunmenglong is an extinct genus of somphospondylan sauropod known
  from the late Early Cretaceous of Henan Province, central China. Its remains
  were discovered in the Haoling Formation of the Ruyang Basin. The type species
  is Yunmenglong ruyangensis, described in 2013 by Junchang Lü et al. on the
  basis of an incomplete postcranial skeleton. Yunmenglong shares some
  characters with Euhelopus, Qiaowanlong, and Erketu; a phylogenetic analysis
  places it as a sister taxon of Qiaowanlong, both grouped with Erketu in a
  position more derived than Euhelopus but basal to Titanosauria.
diet: herbivore
locomotion: quadrupedal
