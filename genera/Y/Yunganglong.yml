genus: Yunganglong
parent: Hadrosauroidea
etymology: Honoring the Yungang Grottoes (a UNESCO World Heritage site in Shanxi Province, China near the fossil locality) and Chinese long ('dragon'), meaning 'Yungang dragon'
description: Yunganglong is an extinct genus of basal hadrosauroid dinosaur
  known from the early Late Cretaceous lower Zhumapu Formation of Zuoyun County,
  Shanxi Province of northeastern China. It contains a single species,
  Yunganglong datongensis.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
diagnostic_features:
  - Caudal surface of supraoccipital inclined steeply forward at approximately
    45°
  - Caudolaterally extended horizontal portion of paroccipital process and
    accompanying squamosal
  - Pendent portion of paroccipital process does not curve cranially
  - Intercondylar extensor groove of femur deep, U-shaped, partially enclosed by
    expansion of medial and lateral condyles
