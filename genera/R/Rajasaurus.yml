genus: Rajasaurus
parent: Majungasaurinae
pronunciation:
  ipa: /ˌrɑːdʒəˈsɔːrəs/
  phonetic: RAH-juh-sore-us
etymology: "From Sanskrit/Hindi 'raja' (king) + Greek 'sauros' (lizard), meaning
  'king lizard'."
description: "Rajasaurus is a genus of carnivorous abelisaurid theropod dinosaur
  from the Late Cretaceous of India, containing one species: Rajasaurus
  narmadensis. The bones were excavated from the Lameta Formation in the Gujarat
  state of Western India, probably inhabiting what is now the Narmada River
  Valley. It was formally described by paleontologist Jeffrey A. Wilson and
  colleagues in 2003 based on a partial skeleton comprising the braincase,
  spine, hip bone, legs, and tail-a first for an Indian theropod. The dinosaur
  likely measured 6.6 meters (22 ft), and had a single horn on the forehead
  which was probably used for display and head-butting. Like other abelisaurids,
  Rajasaurus was probably an ambush predator."
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Median nasofrontal prominence, with frontals forming only posterior rim
  - Supratemporal fenestrae anteroposteriorly elongate, with length
    approximately 150% transverse breadth of frontal
  - Robust ilium with transverse ridge separating brevis fossa from acetabulum
appearance:
