genus: Rajasaurus
parent: Majungasaurini
pronunciation:
  ipa: /ˌrɑːdʒəˈsɔːrəs/
etymology: "From Sanskrit/Hindi 'raja' (king) + Greek 'sauros' (lizard), meaning 'king lizard'."
description: "Rajasaurus is a genus of carnivorous abelisaurid theropod dinosaur
  from the Late Cretaceous of India, containing one species: Rajasaurus
  narmadensis. The bones were excavated from the Lameta Formation in the Gujarat
  state of Western India, probably inhabiting what is now the Narmada River
  Valley. It was formally described by palaeontologist Jeffrey A. Wilson and
  colleagues in 2003 based on a partial skeleton comprising the braincase,
  spine, hip bone, legs, and tail–a first for an Indian theropod. The dinosaur
  likely measured 6.6 metres (22 ft), and had a single horn on the forehead
  which was probably used for display and head-butting. Like other abelisaurids,
  Rajasaurus was probably an ambush predator."
diet: carnivore
locomotion: bipedal
