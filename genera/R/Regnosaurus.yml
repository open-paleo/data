genus: Regnosaurus
parent: Thyreophora
pronunciation:
  phonetic: REG-noh-SAWR-us
etymology: "Named for the Regni, the ancient Roman name for the people of
  Sussex, England, where the fossils were found, combined with Greek 'sauros'
  meaning 'lizard'; meaning 'Sussex lizard.'"
description: Regnosaurus is an extinct genus of herbivorous presumably armored
  dinosaur known from the early Cretaceous Wealden Formation of England. The
  genus contains a single species, Regnosaurus northamptoni, known from a single
  partial jaw bone. Regnosaurus has traditionally been regarded as a stegosaur,
  possibly related to the Jurassic Huayangosaurus of China. Later research
  considers it to be a dubious, indeterminate thyreophoran.
dispute:
  summary: >
    Regnosaurus is a nomen dubium whose assignment to Stegosauria is contested.
    Maidment et al. (2008) found no stegosaurian synapomorphies in the single
    dentary fragment and reassigned it to Thyreophora indeterminate, whereas
    some reference works (Jones and Viola, 2026) still list it as a stegosaur
    nomen dubium. It is placed at Thyreophora pending diagnostic material.
  history:
    - date: "2026-06-26"
      note: Reparented from Stegosauria to Thyreophora incertae sedis, no stegosaurian synapomorphies (Maidment et al., 2008); Stegosauria membership contested.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
appearance:
  integument: armored
diagnostic_features:
  - Generically or subgenerically distinct from Iguanodon mantelli
  - Internal structure of teeth corresponds more nearly with Iguanodon than with
    Hylaeosaurus
  - Member of herbivorous reptile family
