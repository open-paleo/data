        scapula, right humerus, and right ischium.
      completeness: partial
      notes: Lavocat designated no holotype, which would leave the material he
        collected as syntypes, but Wilson and Allain (2015) ascribe every element
        to one holotype under ICZN Article 73.1.2, on his own statement that the
        remains certainly pertain to a single individual. Several bones he listed
        are no longer in the collection, among them four of the six articulated
        caudal vertebrae, most of the ten dorsal ribs, and one of the two pelvic
        bones.
