genus: Rebbachisaurus
parent: Rebbachisaurinae
pronunciation:
  phonetic: re-BASH-i-SAWR-us
etymology: "Named for the Aït Rebbach, a Berber tribal group in the Errachidia
  Province of Morocco near where the fossils were found, combined with Greek
  'sauros' meaning 'lizard'; meaning 'Aït Rebbach lizard.'"
description: Rebbachisaurus is a genus of sauropod dinosaur that lived in what
  is now Africa during the Late Cretaceous period, between 99 and 97 million
  years ago. The only valid species is R. garasbae. However, two other species
  have been assigned to the genus; R. tessonei, now Limaysaurus tessonei, and
  the nomen dubium R. tamesnensis. Known from a single, incomplete skeleton,
  much of R. garasbae's anatomy is unknown. The skeleton, discovered in 1948,
  was unearthed in the Errachidia Province of Morocco from strata of the Kem Kem
  Beds.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - deltaic
  - fluvial
  - lacustrine
diagnostic_features:
  - Scapula with proximal region widened and rounded like a racket; proximal
    anterior border convex (versus concave in other known sauropods)
  - Dorsal vertebrae exceptionally tall with small relative vertebral centrum
    height reaching 1m45-1m50 from inferior centrum border to spinous process
    apex
  - Dorsal vertebra with very large paired pleurocoels separated by distinct
    median septum with bracing partitions
  - Dorsal vertebra centrum 23×23 cm anteroposteriorly 20-21 cm, much smaller
    than corresponding Apatosaurus elements while vertebral height approached or
    exceeded
    Apatosaurus dimensions
