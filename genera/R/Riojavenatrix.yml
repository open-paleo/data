genus: Riojavenatrix
parent: Baryonychinae
dispute:
  summary: >
    Riojavenatrix lacustris is an unstable spinosaurid; its describing analysis
    (Isasmendi et al., 2024) prefers a baryonychine placement, and Rauhut et al.
    (2025) recover it as a derived baryonychine under implied weights, but both
    find it can also fall among early-branching spinosaurines.
  history:
    - date: "2026-07-01"
      note: Placed at Baryonychinae following the preferred results of Isasmendi et al. (2024) and Rauhut et al. (2025); an early-spinosaurine position cannot be excluded.
etymology: "Named for La Rioja Province, Spain, where the fossils were found, combined with Latin 'venatrix' meaning 'huntress'; meaning 'La Rioja huntress.'"
pronunciation:
  phonetic: ree-YO-ha-VEH-nuh-trix
description: Riojavenatrix is a genus of spinosaurid theropod dinosaurs from the
  Early Cretaceous Enciso Group of La Rioja, Spain. The type species is Riojavenatrix
  lacustris.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - lacustrine
diagnostic_features:
  - Lateromedially thick and triangular pubic boot with straight posterolateral
    margin
  - Anteroposteriorly expanded ischial boot with anterodorsally oriented tip and
    angular anterodistal surface
  - Narrow, restricted articular groove on femoral head proximal surface,
    anteromedially–posterolaterally inclined
  - Medial femoral condyle with only slight posteromedial orientation of long
    axis
  - Vertical ridge on medial margin of astragalus ascending process
  - Height of astragalus ascending process more than twice the astragalar body
    height
  - Anterior depression with dorsally located foramen on lateral surface of
    calcaneum
appearance:
  integument: scaled
  evidence: inferred
