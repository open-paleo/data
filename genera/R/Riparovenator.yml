genus: Riparovenator
parent: Baryonychinae
dispute:
  summary: >
    Riparovenator milnerae was erected as a distinct baryonychine spinosaurid,
    sister to the co-occurring Ceratosuchops inferodios (Barker et al., 2021),
    and both were kept distinct by Rauhut et al. (2025). Its distinctness as a
    genus is contested, however: Sereno et al. (2022) tentatively referred the
    Wessex baryonychine material to a single taxon, Ceratosuchops, attributing
    the differences to individual variation, and Santos-Cubedo et al. (2023)
    followed that synonymy by omitting Riparovenator from their count of valid
    baryonychine genera, while Cau (2025) left the question open pending a
    detailed comparative analysis. Its status as a genus distinct from
    Ceratosuchops therefore remains unresolved.
  history:
    - date: "2026-07-01"
      note: Placed at Baryonychinae following Barker et al. (2021) and Rauhut et al. (2025) (P2/P4; the tribe Ceratosuchopsini is not retained); the proposed synonymy with Ceratosuchops is unresolved.
    - date: "2026-07-21"
      note: Status set to disputed — Riparovenator's distinctness from
        Ceratosuchops is genuinely unresolved (kept distinct by Barker et al.,
        2021, and Rauhut et al., 2025; tentatively synonymized by Sereno et al.,
        2022, and Santos-Cubedo et al., 2023; left open by Cau, 2025). The
        difference is treated as individual, not ontogenetic, variation.
pronunciation:
  phonetic: ri-PAIR-o-ven-AY-tor
etymology: From Latin riparius (of the riverbank) and venator (hunter); meaning "riverbank hunter".
description: Riparovenator is a genus of baryonychine spinosaurid dinosaur from
  the Early Cretaceous (Barremian) period of Britain. The genus contains a
  single species, Riparovenator milnerae.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Notched dorsal orbital margin between prefrontal and postorbital process of
    frontal
  - Deeply inset facial nerve (CN VII) foramen that is largely obscured from
    lateral view
  - Deep subcondylar recess with depth over 1/3 of mediolateral width
  - Reduced exposure of ventral surface of basipterygoid processes in lateral
    view
  - Curved dorsal margin of frontal process of nasal in lateral view
  - Straight dorsal margin of dorsum sellae
  - Exoccipital components of occipital condyle closely spaced
  - Mediolaterally thick crests bordering subcondylar recess
  - Lateral margins of basipterygoid processes concave in ventral view
