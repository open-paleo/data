references:
  - id: barker2021a
    notes: Erected Riparovenator milnerae as a distinct baryonychine spinosaurid,
      sister to Ceratosuchops.
  - id: sereno2022a
    notes: Tentatively referred the Wessex baryonychine material to a single
      taxon, Ceratosuchops, treating Riparovenator's distinguishing features as
      individual variation.
  - id: santos-cubedo2023a
    notes: Followed the synonymy of Sereno et al. (2022), omitting Riparovenator
      from their count of valid baryonychine genera.
  - id: rauhut2025a
    notes: Recovered Riparovenator as a baryonychine spinosaurid, keeping it
      distinct from Ceratosuchops.
  - id: cau2025a
    notes: Left the Riparovenator–Ceratosuchops synonymy open, deferring to a
      future detailed comparison.
