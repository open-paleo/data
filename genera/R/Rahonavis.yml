genus: Rahonavis
parent: Paraves
dispute:
  summary: >
    Rahonavis has an unusually contested position even among unenlagiines. It was
    originally described as a bird more derived than Archaeopteryx (Forster et al.,
    1998), and several analyses continue to recover it on the avialan stem (Agnolín
    and Novas, 2013; Cau, 2018; as the Overoraptor + Rahonavis clade sister to
    Avialae in Motta et al., 2020). Other analyses recover it as a dromaeosaurid
    unenlagiine (Makovicky et al., 2005; Turner et al., 2012; Hartman et al., 2019,
    the last requiring ten extra steps to make it avialan). Because the
    unenlagiine (dromaeosaurid) and stem-avialan hypotheses straddle the
    Dromaeosauridae-Avialae split, Paraves is the least-inclusive clade both
    accept.
  history:
    - date: "2026-07-01"
      note: Placed in Unenlagiinae following the dromaeosaurid hypothesis (Makovicky et al., 2005; Turner et al., 2012; Hartman et al., 2019); the recurring avialan-bird hypothesis is recorded. This per-genus dispute supplements the clade-level Unenlagiinae debate.
    - date: "2026-07-09"
      note: Broadened from Unenlagiinae to Paraves incertae sedis. The unenlagiine
        dromaeosaurid hypothesis (Makovicky et al., 2005; Hartman et al., 2019)
        and the stem-avialan hypothesis (Motta et al., 2020; Agnolín and Novas,
        2013)
        remain a live split straddling the Dromaeosauridae-Avialae boundary, so
        the conservative shared node is adopted.
pronunciation:
  phonetic: rah-HOON-a-vis
etymology: "From Malagasy 'rahona' meaning 'cloud' or 'menace' and Latin 'avis' meaning 'bird', named for its bird-like nature and discovery in Madagascar."
description: Rahonavis is a genus of bird-like theropod from the Late Cretaceous
  (Maastrichtian, from about 70 to 66 mya) of what is now northwestern
  Madagascar. It is known from a partial skeleton (UA 8656) found by Catherine
  Forster and colleagues in Maevarano Formation rocks at a quarry near
  Berivotra, Mahajanga Province. Rahonavis was a small predator, at about 70
  centimeters (2.3 ft) long and 0.45-2.27 kg (1-5 lbs), with the typical
  dromaesaurid-like raised sickle claw on the second toe. It was the first
  coelurosaur discovered in Africa, with Nqwebasaurus being the second.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - arid
diagnostic_features:
  - Robust, hyperextendible second pedal digit terminating in sickle-like claw
  - Hyposphene-hypantra articulations on dorsal vertebrae retained
  - Six fused sacral vertebrae
  - Reversed hallux characteristic of birds
  - Elongate ulna with six quill knobs for secondary flight feathers
  - Vertical pubis with well-developed hypopubic cup
  - Greatly reduced fibula lacking contact with calcaneum
appearance:
  features:
    - quill knobs
    - sickle claw
  integument: feathered
  evidence: direct
