genus: Rhinorex
parent: Saurolophinae
etymology: From Greek rhinos ('nose') and Latin rex ('king')
pronunciation:
  phonetic: ri-no-rex
description: Rhinorex is a genus of kritosaurin hadrosaur from the Late
  Cretaceous Neslen Formation, in central Utah. Its exact placement in time is
  uncertain, though it probably dates to 75 million years ago and was discovered
  in estuarine sediments.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - coastal
  - estuarine
  - deltaic
diagnostic_features:
  - "Anteroventral process of nasal with fish-hook morphology: wide, triangular,
    with small dorsally-directed bump"
  - Posteroventral process of premaxilla with slight dorsal expansion on medial
    margin at midpoint
  - Large rugose boss on posterodorsal corner of circumnarial fossa
  - Jugal with postorbital process oriented perpendicular to main jugal body
  - Nasal lacking solid raised crest on posterior region, instead breaking
    nearly horizontally
appearance:
  features:
    - nasal crest
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "305972"
  - source: wikidata
    id: Q18091433
  - source: eol
    id: "43524850"
species:
  - name: Rhinorex condrupus
    etymology: From Latin condo ('bury') and rupes ('cliffs'), referring to
      discovery in the Book Cliffs of Utah
    status: valid
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Campanian
    location:
      country: US
      locality: Thompson Canyon
      region: US-UT
      formation: Neslen
    type_specimen:
      specimen_id: [BYU 13258]
      specimen_type: holotype
      institution: BYU
      material: Partial but mostly articulated skeleton and skull with partial pelvis
        and vertebral column.
      completeness: partial
    size:
      length_m:
        min: 7
        max: 7
    erected_in: gates2014a
references:
  - id: gates2014a
    notes: Recovers Rhinorex as the sister of Gryposaurus in parsimony and
      Bayesian analyses, and places the holotype in estuarine sediments on the
      margin of the Western Interior Seaway.
  - id: jones2026a
    notes: Source of the body length estimate, and the appearance features.
