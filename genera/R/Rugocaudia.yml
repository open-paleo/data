genus: Rugocaudia
parent: Titanosauriformes
etymology: From Latin 'rugosus' (wrinkled, rough) + 'cauda' (tail), meaning 'wrinkled tail' or 'rough-tailed', referring to the texture of the caudal vertebrae.
description: Rugocaudia is a potentially dubious genus of early titanosauriform
  sauropod dinosaurs known from the Early Cretaceous of Montana, United States.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Condyle and cotyle margins greatly expressed with rugose texture
  - Paired large depressions on anterior condyle margin near neural arch of
    anterior caudals
  - Neurovascular foramina on condyle/cotyle margins with greater frequency
    posteriorly
  - Distalmost caudal vertebrae exhibiting convex-upward bend in lateral view
  - Midcaudal vertebrae centra square in lateral and transverse view
