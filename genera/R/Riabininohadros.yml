genus: Riabininohadros
parent: Styracosterna
etymology: "Named for Russian paleontologist Anatoly Nikolaevich Riabinin, who first described the type material, combined with 'hadros' as in Hadrosauridae; meaning 'Riabinin's hadrosaur.'"
description: Riabininohadros is an extinct genus of ankylopollexian dinosaur
  from the Maastrichtian of Crimea. Its type species is Riabininohadros weberi,
  emended to Riabininohadros weberae. It was originally classified as a species
  of Orthomerus, until 2015.
diet: herbivore
