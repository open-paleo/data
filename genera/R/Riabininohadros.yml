genus: Riabininohadros
parent: Styracosterna
pronunciation:
  phonetic: ree-ah-BEE-ni-no-HAD-ros
etymology: "Named for Russian paleontologist Anatoly Nikolaevich Riabinin, who
  first described the type material, combined with 'hadros' as in Hadrosauridae;
  meaning 'Riabinin's hadrosaur.'"
description: Riabininohadros is an extinct genus of ankylopollexian dinosaur
  from the Maastrichtian of Crimea. Its type species is Riabininohadros weberi,
  emended to Riabininohadros weberae. It was originally classified as a species
  of Orthomerus, until 2015.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - marine
diagnostic_features:
  - Tibia strongly flattened at distal end and expanded at proximal end
  - Medial condyle at distal end of tibia considerably shorter than lateral
    condyle, situated at considerable distance from one another
  - Medial and lateral condyles at distal end of third metatarsal separated from
    one another and situated at some distance apart
  - Large distance between medial and lateral condyles on distal portion of
    tibia forms small depression and triangular distal end
  - Strong expansion of tibia at distal and proximal ends with very gradual
    narrowing toward center
  - Contact between second and third metatarsals expressed over more than
    two-thirds of third metatarsal length
