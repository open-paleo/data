genus: Riabininohadros
parent: Styracosterna
pronunciation:
  phonetic: ree-ah-BEE-ni-no-HAD-ros
etymology: "Named for Russian paleontologist Anatoly Nikolaevich Riabinin, who
  first described the type material, combined with 'hadros' as in Hadrosauridae;
  meaning 'Riabinin's hadrosaur.'"
description: Riabininohadros is an extinct genus of ankylopollexian dinosaur
  from the Maastrichtian of Crimea. Its type and only species, Riabininohadros
  weberae, was originally described as a species of Orthomerus before being
  placed in its own genus.
dispute:
  summary: >
    Riabininohadros weberi (formerly Orthomerus weberi) is a fragmentary
    European taxon; Lopatin and Averianov (2020) recovered it as a
    primitive styracosternan well outside Hadrosauroidea, whereas it was
    historically associated with hadrosaurids and Jones (2026) places it
    more basally within Ankylopollexia.
  history:
    - date: "2026-06-27"
      note: Placed at Styracosterna following Lopatin and Averianov
        (2020); the more basal position reflected, not adopted.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - marine
diagnostic_features:
  - Extensor groove between the distal femoral condyles completely open
    laterally, with the anterior ends of the medial and lateral condyles at
    different levels
  - Bridge between the distal femoral condyles positioned near the anterior
    margin of the bone rather than centrally, associated with reduction of the
    lateral condyle
  - Lateral malleolus of the tibia noticeably longer than the medial condyle and
    directed distally
  - Deep notch along the posteromedial edge of the proximal surface of the third
    metatarsal, extending distally onto the proximal third of the bone
  - Large depression on the distal lateral femoral condyle for the anterior
    cruciate ligament
appearance:
  integument: scaled
  evidence: inferred
