      weberi.
  - id: nessov1995a
    notes: Emended the specific epithet from weberi to weberae.
  - id: averianov2019a
    notes: Redescription of the holotype, correcting several of Riabinin's
      original element identifications.
  - id: ulansky2015a
    notes: Coined the name Riabininohadros for Orthomerus weberae, but the name
      was unavailable under the ICZN (no diagnosis, no ISSN or ISBN, and not
      registered in ZooBank).
  - id: lopatin2020a
    notes: Formally erected the genus Riabininohadros to make the name available
      and valid.
  - id: jones2026a
    notes: Source of the body length estimate.
