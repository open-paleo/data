genus: Rukwatitan
parent: Rinconsauria
etymology: Named for the Rukwa Rift Basin in Tanzania where it was found, combined with Greek 'titan' meaning 'giant'.
pronunciation:
  phonetic: ruk-wah-TI-tuhn
description: Rukwatitan is a genus of titanosaur sauropod dinosaur from the
  Galula Formation in Tanzania. It lived around 100 million years ago, during
  the middle Cretaceous. The species, which shared features with another
  southern African species, Malawisaurus dixeyi, measured 30 feet (9.1 m) from
  the head to the tip of the tail, and had forelimbs that were estimated around
  6.5 feet (2.0 m) long. Its fossils were found embedded in a cliff face near
  Lake Rukwa in the Rukwa Valley, from which it gets its name.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Carotid processes on posterior cervical vertebrae
  - Deep coracobrachialis fossa on proximal humerus bounded by strong anteriorly
    projecting deltopectoral crest
  - Subquadrangular cross-section of humerus at midshaft (flattened anterior,
    medial, lateral, and posterior surfaces)
  - Slender, curved, teardrop-shaped pubic peduncle on ilium with tail curving
    posteriorly
  - Paired shallow fossae on ventral surface of posterior cervical vertebrae not
    separated by thin keel
  - Accessory tubercle on ventral surface of cervical rib capitulum lateral to
    capituloparapophysial suture
appearance:
  integument: scaled
  evidence: inferred
