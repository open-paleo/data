genus: Rinchenia
parent: Citipatinae
etymology: Named after Mongolian paleontologist Byambyn Rinchen, with the
  Latinised suffix '-ia' forming the genus name.
description: Rinchenia is a genus of oviraptorid dinosaur that lived in Asia
  during the Late Cretaceous epoch in what is now Mongolia, Nemegt Formation.
  The type and only known species, Rinchenia mongoliensis, was originally
  classified as a species within the genus Oviraptor (named Oviraptor
  mongoliensis), but a subsequent reexamination found differences significant
  enough to warrant a separate genus. The name Rinchenia was coined for this new
  genus, though not formally described in detail.
diet: omnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
appearance:
  integument: feathered
  evidence: inferred
diagnostic_features:
  - Tall, domed cranial crest composed primarily of the nasals, whose enlarged
    lateral descending processes form a honeycombed lattice perforated by
    pneumatic cavities
  - Frontal taller than anteroposteriorly long, bearing a lateral ridge for the
    postorbital with parallel frontal and jugal processes
  - Interfingering jugal-quadratojugal contact, unique among oviraptorids
  - Ilium with an anterodorsally expanded, large preacetabular blade, the
    preacetabular process ventrally hooked and pointed
  - Femur with the popliteal fossa overhung by the medial distal condyle, forming
    a tunnel for the cruciate ligaments
