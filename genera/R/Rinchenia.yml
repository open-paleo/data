genus: Rinchenia
parent: Citipatinae
description: Rinchenia is a genus of oviraptorid dinosaur that lived in Asia
  during the Late Cretaceous epoch in what is now Mongolia, Nemegt Formation.
  The type and only known species, Rinchenia mongoliensis, was originally
  classified as a species within the genus Oviraptor (named Oviraptor
  mongoliensis), but a subsequent reexamination found differences significant
  enough to warrant a separate genus. The name Rinchenia was coined for this new
  genus, though not formally described in detail.
diet: omnivore
