genus: Rinconraptor
parent: Megaraptoridae
etymology: From 'Rincón', for Rincón de los Sauces in Patagonia, and Latin 'raptor'
  (thief).
description: Rinconraptor is an extinct genus of megaraptorid theropod dinosaur
  known from the Late Cretaceous (Santonian age) Bajo de la Carpa Formation of
  Argentina. The genus contains a single species, Rinconraptor pipoae, known
  from a partial postcranial skeleton.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Ectepicondyle of the humerus set apart from the distal end of the humerus
  - Lateral margin of the tibia straight in proximal view
  - Cnemial crest and medial condyle of the tibia subquadrangular in proximal
    view
