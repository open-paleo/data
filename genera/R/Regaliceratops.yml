genus: Regaliceratops
parent: Triceratopsini
etymology: From Latin regalis (royal) and Greek keras (horn) and ops (face); meaning "Royal horned face".
pronunciation:
  phonetic: ree-guh-li-seh-ruh-tops
description: Regaliceratops is a monospecific genus of chasmosaurine ceratopsid
  dinosaur from Alberta, Canada that lived during the Late Cretaceous (middle
  Maastrichtian stage, 68.5 to 67.5 Ma) in what is now the St. Mary River
  Formation. The type and only species, Regaliceratops peterhewsi, is known only
  from an adult individual with a nearly complete skull lacking the lower jaw,
  which was nicknamed "Hellboy". Regaliceratops was named in 2015 by Caleb M.
  Brown and Donald M. Henderson. Regaliceratops has an estimated length of 5
  meters (16 ft) and body mass of 2 metric tons (2.2 short tons). The skull of
  Regaliceratops displays features more similar to centrosaurines, which
  suggests convergent evolution in display morphology in ceratopsids.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Single, midline epiparietal ossification (P0) rostrodorsally offset from
    plane of frill, projecting caudal to parietal with triangular cross-section
  - Prominent midline ridge on parietal confluent with median epiparietal (P0
    locus)
  - Paired epiparietal ossifications (P1-2) long, flat, and roughly pentagonal
    or spade shaped; largest frill epiossifications in Chasmosaurinae (max 201
    mm)
  - Prominent postorbital ridge running diagonally from supraorbital horncore to
    base of squamosal
  - Parietal fenestrae small or subequal in size to orbit
  - Nasal horncore larger than postorbital horncores; large, steeply sided, one
    of the tallest in Chasmosaurinae (240-280 mm estimated)
