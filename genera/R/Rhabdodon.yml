genus: Rhabdodon
parent: Rhabdodontidae
pronunciation:
  phonetic: RAB-do-don
etymology: From Greek rhabdos (fluted, rod-like) and odon (tooth); meaning "fluted tooth".
description: Rhabdodon is a genus of ornithopod dinosaur that lived in Europe
  approximately 72-69 million years ago in the Late Cretaceous. The genus
  contains a single species, R. priscus. It is similar in build to a very robust
  "hypsilophodont" (non-iguanodont ornithopod), though all modern phylogenetic
  analyses find this to be an unnatural grouping, and Rhabdodon to be a basal
  member of Iguanodontia. It was large amongst its relatives, measuring 4 m (13
  ft) long and weighing 250 kg (550 lb), with some specimens possibly reaching
  up to 6 m (20 ft) long.
diet: herbivore
locomotion: bipedal
