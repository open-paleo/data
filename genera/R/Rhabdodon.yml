genus: Rhabdodon
parent: Rhabdodontidae
pronunciation:
  phonetic: RAB-do-don
etymology: From Greek rhabdos (fluted, rod-like) and odon (tooth); meaning "fluted tooth".
description: Rhabdodon is a genus of ornithopod dinosaur that lived in Europe
  approximately 72-69 million years ago in the Late Cretaceous. The genus
  contains a single species, R. priscus. It is similar in build to a very robust
  "hypsilophodont" (non-iguanodont ornithopod), though all modern phylogenetic
  analyses find this to be an unnatural grouping, and Rhabdodon to be a basal
  member of Iguanodontia. It was large among its relatives, measuring 4 m (13
  ft) long and weighing 250 kg (550 lb), with some specimens possibly reaching
  up to 6 m (20 ft) long.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Pleurodont dental system with teeth in common alveolar groove, compressed
    and fluted vertically
  - Teeth not housed in distinct alveoli but adhered by root side to inner jaw
    face
  - Teeth regularly fluted in vertical direction on lateral faces, irregularly
    undulating in cross-section when fully developed
  - Lower jaw with parallelism of upper and lower borders
  - External jaw surface with holes positioned above midpoint of bone, more
    closely spaced than in Iguanodon
  - Opercular bone covering alveolar groove reaching height of upper jaw border
  - Lumbar vertebra slightly bi-concave with large vertebral foramen
  - Articulation of consecutive vertebrae as in crocodiles with anterior
    articular processes exterior and inferior
  - Sacral vertebrae ankylosed together in single unit
