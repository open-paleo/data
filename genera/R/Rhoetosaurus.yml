genus: Rhoetosaurus
parent: Gravisauria
dispute:
  summary: >
    Rhoetosaurus is recovered as a non-eusauropodan gravisaurian, possibly
    the most derived of all known non-eusauropods (Nair and Salisbury,
    2012), a placement followed by Jones (2026). Some earlier treatments
    allied it with basal eusauropods or the historical Cetiosauridae.
  history:
    - date: "2026-06-29"
      note: >
        Moved from Eusauropoda to Gravisauria (non-eusauropod) following
        Nair and Salisbury (2012) and Jones (2026); the basal-eusauropod
        alternative is unresolved.
pronunciation:
  phonetic: REET-o-SAWR-us
etymology: "Named for Rhoetus, a giant (Titan) in Greek mythology, combined with
  Greek 'sauros' meaning 'lizard'; meaning 'Rhoetus lizard.'"
description: "Rhoetosaurus is a genus of sauropod dinosaur from the Late
  Jurassic (Oxfordian) Walloon Coal Measures of what is now eastern Australia.
  Rhoetosaurus is estimated to have been about 15 meters (49 ft) long, weighing
  about 9 tonnes (8.9 long tons; 9.9 short tons). Subsequent authors have
  sometimes misspelled the name: Rhaetosaurus (de Lapparent and Laverat, 1955);
  Rheteosaurus (Yadagiri, Prasad and Satsangi, 1979)."
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - wetland
diagnostic_features:
  - Caudal vertebrae amphicoelous with giant anterior elements and expanded
    elliptical articulating surfaces
  - Median constriction on centra, more pronounced in posterior elements
  - Prezygapophyses elongated with vertical articulating surfaces (orthozygous),
    not oblique
  - Hyposphene well developed but postzygapophyses absent
  - Neural spines stout and not greatly elongated, anterior ones subrectangular
    with median recess on posterior margin
  - Anterior chevrons massive and not elongated, intervertebral in attachment,
    not confluent at vertebral attachment
  - Neural canal relatively large in anterior caudals
appearance:
  integument: scaled
  evidence: inferred
