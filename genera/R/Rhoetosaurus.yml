genus: Rhoetosaurus
parent: Gravisauria
dispute:
  summary: >
    Rhoetosaurus is recovered as a non-eusauropodan gravisaurian, possibly
    the most derived of all known non-eusauropods (Nair and Salisbury,
    2012), a placement followed by Jones (2026). Some earlier treatments
    allied it with basal eusauropods or the historical Cetiosauridae.
  history:
    - date: "2026-06-29"
      note: >
        Moved from Eusauropoda to Gravisauria (non-eusauropod) following
        Nair and Salisbury (2012) and Jones (2026); the basal-eusauropod
        alternative is unresolved.
pronunciation:
  phonetic: REET-o-SAWR-us
etymology: "Named for Rhoetus, a giant (Titan) in Greek mythology, combined with
  Greek 'sauros' meaning 'lizard'; meaning 'Rhoetus lizard.'"
description: "Rhoetosaurus is a genus of sauropod dinosaur from the Middle
  Jurassic (Bathonian to Callovian) Walloon Coal Measures of what is now eastern
  Australia.
  Rhoetosaurus is estimated to have been about 15 meters (49 ft) long, weighing
  about 9 tonnes (8.9 long tons; 9.9 short tons). Subsequent authors have
  sometimes misspelled the name: Rhaetosaurus (de Lapparent and Laverat, 1955);
  Rheteosaurus (Yadagiri, Prasad and Satsangi, 1979)."
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - wetland
diagnostic_features:
  - Tibia with multiple distal crests and sulci medially
  - Concentric proximal fossa on the medial surface of the tibia
  - Mid-lateral surface of the fibula osteologically featureless, lacking a
    tubercle or scar
  - Proximal articular surfaces of the metatarsals elliptical and narrow
    dorsoplantarly, developed to a lesser extent in Shunosaurus
  - Prominent crest and apical process on the medial side of the cranial face of
    metatarsal II, with lesser ridges also present in diplodocids
  - Second phalanx of digit II triangular in dorsal outline
  - Lateral crest on the first phalanx of digit IV
  - Accessory fossa or groove on the medial face of the pedal unguals
appearance:
  integument: scaled
  evidence: inferred
