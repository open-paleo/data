    etymology: Named for Juan Carlos Muñoz, attendant of the paleontology area
      of the Museo Carlos Ameghino in Cipolletti, for his constant support of
      paleontological research in the region.
    pronunciation:
      phonetic: moo-NYOH-sie
    status: valid
