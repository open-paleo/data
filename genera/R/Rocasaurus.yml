genus: Rocasaurus
parent: Saltasaurinae
pronunciation:
  phonetic: ROH-kah-SAWR-us
etymology: "Named for General Roca, a city in Río Negro Province, Argentina,
  near where the fossils were found, combined with Greek 'sauros' meaning
  'lizard'; meaning 'General Roca lizard.'"
description: Rocasaurus is a genus of titanosaurian sauropod that lived in South
  America. Rocasaurus was discovered in Argentina in 2000, within the Allen
  Formation which is dated to be middle Campanian to early Maastrichtian in age
  (75 to 70 million years ago in the Late Cretaceous). This genus grew up to 8
  meters (26 ft) long, making it one of the smaller sauropods. It seems to be
  closely related to saltasaurid dinosaurs, like Saltasaurus and Neuquensaurus.
  The type species, Rocasaurus muniozi, was formally described by Leonardo
  Salgado and Azpilicueta in 2000.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Distal expansion on lateral margin of pubis
  - Ischium with extensive lamina, notably more extensive than in Saltasaurus
    and Neuquensaurus
  - Caudal vertebrae with deep ventral cavity divided by longitudinal partition
  - Posterior articulation of caudal centra notably depressed and extended
    ventrally forward
  - Neural spine wide and anteroposteriorly compressed in dorsal vertebrae
