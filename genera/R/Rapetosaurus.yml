genus: Rapetosaurus
parent: Saltasauroidea
pronunciation:
  ipa: /rəˌpeɪtuːˈsɔːrəs/
  phonetic: ruh-PAY-too-SOR-uhs
etymology: "From Malagasy 'rapeto' (a giant mischievous creature in Malagasy
  folklore) + Greek 'sauros' (lizard), meaning 'Rapeto lizard'."
description: Rapetosaurus is a genus of titanosaurian sauropod dinosaur that
  lived in Madagascar from 70 to 66 million years ago, at the end of the
  Cretaceous Period. Only one species, Rapetosaurus krausei, has been
  identified. Like other sauropods, Rapetosaurus was a quadrupedal herbivore. It
  is calculated to have reached lengths of 15 m (49 ft) in adulthood.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - arid
diagnostic_features:
  - Expanded antorbital fenestra extends over tooth row
  - Preantorbital fenestra positioned posterior to antorbital fenestra
  - Subnarial foramen anteriorly positioned and dorsoventrally elongate
  - Jugal process of maxilla posterodorsally elongate and narrow
  - Frontals with median dome
  - Quadrate with V-shaped quadratojugal articulation
  - Gracile cylindrical teeth with high-angle planar wear facets
appearance:
  features:
    - elongate neck
  integument: armored
  evidence: direct
