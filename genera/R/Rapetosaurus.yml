notable_specimens:
  - specimen_id: [FMNH PR 2209]
    institution: FMNH
    species: Rapetosaurus krausei
    category: most-complete
    significance: "A juvenile referred skeleton missing only a few tail vertebrae, described as the most complete titanosaur skeleton ever recovered and the only one with the head still attached to the body. It was recovered in the Mahajanga Basin of northwest Madagascar and published in 2001."
    references: [curryrogers2001a]
  - specimen_id: [UA 9998]
    institution: UADBA
    species: Rapetosaurus krausei
    category: ontogeny
    significance: "A neonatal individual weighing about 40 kilograms and 39 to 77 days old at death, estimated at 3.4 kilograms when it hatched. Its bones indicate precocial development with little to no parental care, and it likely starved to death during a Cretaceous drought."
    references: [curryrogers2016a]
