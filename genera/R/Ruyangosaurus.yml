genus: Ruyangosaurus
parent: Somphospondyli
dispute:
  summary: >
    The position of Ruyangosaurus is uncertain. It was described as a non-
    titanosauriform macronarian (Lü et al., 2009), recovered as a basal
    titanosaur by some analyses (Moore et al., 2020; Mo et al., 2023), and
    increasingly allied with Euhelopodidae by others (Mannion et al., 2019;
    Wang et al., 2021).
  history:
    - date: "2026-06-30"
      note: >
        Placed conservatively at Somphospondyli given the unresolved
        euhelopodid versus titanosaurian debate.
pronunciation:
  phonetic: roo-YAHNG-oh-SAWR-us
etymology: Named for Ruyang County in Henan Province, China where it was
  discovered, combined with Greek '-saurus' meaning 'lizard'.
description: Ruyangosaurus is a genus of titanosauriform sauropod dinosaur
  recovered from the Early Cretaceous Haoling Formation of China. The type
  species is R. giganteus, described in 2009 by Lü Junchang et al.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - lacustrine
diagnostic_features:
  - Relatively small neural canal and short neural spines
  - Large, irregularly triangular deep fossa (postparapophyseal fossa) on the
    lateral surface of the neural arch
  - Lack of centroprezygapophyseal lamina
  - Two spinodiapophyseal laminae and the diapophysis form a deep concavity on
    the lateral surface of the base of the neural spine
  - Posterior centrodiapophyseal lamina stoutest among the laminae
  - Centropostzygapophyseal lamina weak and plate-like, forming a triangular
    concavity with the postzygodiapophyseal lamina and posterior
    centrodiapophyseal lamina
appearance:
  integument: scaled
  evidence: inferred
