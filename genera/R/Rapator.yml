genus: Rapator
parent: Neovenatoridae
etymology: "Problematic etymology - von Huene provided no explanation; 'Rapator'
  appears rarely in Medieval Latin meaning 'violator', possibly intended as
  'plunderer' or 'predator'."
description: Rapator is a genus of theropod dinosaur from the Griman Creek
  Formation of New South Wales, Australia, dating to the Cenomanian age of the
  Cretaceous period. It contains only the type species, Rapator
  ornitholestoides, which was originally named by Friedrich von Huene in 1932.
diet: carnivore
