genus: Rapator
parent: Megaraptora
dispute:
  summary: >
    Rapator ornitholestoides is a megaraptoran based on a single manual element and
    is widely regarded as a nomen dubium (Agnolín et al., 2010). It was formerly
    placed in Neovenatoridae; recent analyses recover megaraptorans near
    Tyrannosauroidea rather than among carcharodontosaurians. It is placed
    conservatively at Megaraptora incertae sedis.
  history:
    - date: "2026-07-01"
      note: Moved from the deprecated Neovenatoridae to Megaraptora incertae sedis; a nomen dubium.
pronunciation:
  phonetic: RAP-uh-tor
etymology: "Problematic etymology - von Huene provided no explanation; 'Rapator'
  appears rarely in Medieval Latin meaning 'violator', possibly intended as
  'plunderer' or 'predator'."
description: Rapator is a genus of theropod dinosaur from the Griman Creek
  Formation of New South Wales, Australia, dating to the Cenomanian age of the
  Cretaceous period. It contains only the type species, Rapator
  ornitholestoides, which was originally named by Friedrich von Huene in 1932.
diet: carnivore
