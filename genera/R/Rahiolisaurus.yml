genus: Rahiolisaurus
parent: Majungasaurinae
dispute:
  summary: >
    The placement of Rahiolisaurus is disputed. It was included in
    Majungasaurinae by the erecting analysis (Tortosa and colleagues, 2014),
    whereas Filippi and colleagues (2016) recovered it as a basal brachyrostran
    and later analyses find it unstable — Pol and colleagues (2024) could not
    place it, pruning it from their consensus.
  history:
    - date: "2026-06-30"
      note: >
        Placed at Majungasaurinae following the erecting analysis (Tortosa
        et al., 2014); the basal-Brachyrostra alternative (Filippi et al.,
        2016) and its instability in later analyses are recorded.
etymology: Named after Rahioli, the village in Gujarat, India, near where the fossils were recovered, combined with Greek 'sauros' (lizard).
pronunciation:
  phonetic: RA-hee-O-lee-SOR-us
description: Rahiolisaurus is a genus of abelisaurid theropod dinosaur which
  existed in India during the Late Cretaceous period. It was described in 2010,
  based on fossils recovered from the Lameta Formation in the Indian state of
  Gujarat. These fossils include elements from at least seven different
  individuals and are believed to have been from the Maastrichtian stage,
  sometime between 70 and 66 million years ago, making it one of the last
  non-avian dinosaurs known in the fossil record. Despite representing a variety
  of different growth stages, all recovered fossils from the locality indicate a
  single species, the type species Rahiolisaurus gujaratensis.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Premaxillary interdental plates fused and lacking vertical ridges
  - Dental foramina absent
  - Premaxillary teeth with teardrop-shaped cross section, faint mesial keel,
    rounded distal edge
  - Iliac blade with deep caudal notch on postacetabular process
  - Metatarsal I rod-like
  - Metatarsal II strongly narrow proximally
appearance:
  features:
    - reduced forelimbs
  integument: scaled
  evidence: inferred
