genus: Rinconsaurus
parent: Rinconsauria
etymology: Named for Rincón de los Sauces, the locality in Neuquén Province, Argentina where it was discovered, combined with Greek '-saurus' meaning 'lizard'.
pronunciation:
  phonetic: RIN-con-SOR-us
description: Rinconsaurus is a genus of titanosaur sauropod dinosaur from the
  Late Cretaceous in what is now Argentina. The type species, Rinconsaurus
  caudamirus, was described by Calvo and Riga in 2003, and is based on three
  partial skeletons.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - arid
diagnostic_features:
  - Neural spines in mid-anterior dorsal vertebrae inclined posteriorly more
    than 60 degrees with respect to vertical
  - Middle caudal vertebrae with bony processes supporting articular surfaces of
    postzygapophyses
  - Procoelous posterior caudal centra with intercalation of
    amphicoelous-biconvex or amphicoelous-opisthocoelous-biconvex centra
appearance:
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "68591"
  - source: wikidata
    id: Q135538
  - source: gbif
    id: "4822766"
  - source: eol
    id: "4531336"
species:
  - name: Rinconsaurus caudamirus
    etymology: "From Latin 'cauda' meaning 'tail' and 'mirus' meaning 'amazing' or 'wonderful', referring to the unusual shape of the tail vertebrae."
    status: valid
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Santonian
    location:
      country: AR
      locality: Cañadón Río Seco
      region: AR-Q
      formation: Bajo de la Carpa
      notes: The site's bearing from Rincón de los Sauces reverses between sources,
        two kilometers north in Calvo and González Riga (2003) and two
        kilometers south in Pérez-Moreno and colleagues (2023).
    size:
      hip_height_m:
        min: 2.2
        max: 2.2
      length_m:
        min: 11.0
        max: 11.0
      weight_kg:
        min: 3210
        max: 5390
    erected_in: calvo2003a
    type_specimen:
      specimen_id: [MAU-Pv-CRS-26]
      specimen_type: holotype
      institution: MAU
      material: Eight articulated anterior and middle caudal vertebrae, six
        articulated posterior caudal vertebrae, and a right ilium
      completeness: partial
      notes: The right ilium was relabeled MAU-Pv-CRS-275/2 after publication and
        now carries both numbers, and a left ilium labeled MAU-Pv-CRS-275/1 was
        added to the material, neither change reported in print. Pérez-Moreno and
        colleagues (2023) cite the right ilium under its original number and keep
        it as the holotype's only ilium, treating the left one as a paratype, the
        original left ilium being unaccounted for. They present this as provisional
        until the history of the ilia is established.
references:
  - id: calvo2003a
    notes: Erects the species and assigns the type locality to the Río Neuquén
      Formation of the Neuquén Group.
  - id: jones2026b
    notes: Source of the hip height estimate.
  - id: pérezmoreno2023a
    notes: Reports the horizon as the base of the Bajo de la Carpa Formation, and
      revises the type series, excluding the supposed prefrontal as a notosuchian
      ilium.
