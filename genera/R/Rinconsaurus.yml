genus: Rinconsaurus
parent: Rinconsauria
etymology: Named for Rincón de los Sauces, the locality in Neuquén Province, Argentina where it was discovered, combined with Greek '-saurus' meaning 'lizard'.
pronunciation:
  phonetic: RIN-con-SOR-us
description: Rinconsaurus is a genus of titanosaur sauropod dinosaur from the
  Late Cretaceous in what is now Argentina. The type species, Rinconsaurus
  caudamirus, was described by Calvo and Riga in 2003, and is based on three
  partial skeletons.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - arid
diagnostic_features:
  - Neural spines in mid-anterior dorsal vertebrae inclined posteriorly more
    than 60 degrees with respect to vertical
  - Middle caudal vertebrae with bony processes supporting articular surfaces of
    postzygapophyses
  - Procoelous posterior caudal centra with intercalation of
    amphicoelous-biconvex or amphicoelous-opisthocoelous-biconvex centra
