genus: Rugops
parent: Abelisauridae
etymology: From Latin 'ruga' (wrinkle) + Greek 'ops' (face, eye), meaning
  'wrinkle face', referring to the pitted and rough surface of the skull.
description: Rugops is a monospecific genus of basal abelisaurid theropod
  dinosaur that lived during the Late Cretaceous period (Cenomanian stage,
  approximately 95 million years ago) in what is now the Echkar Formation in
  Niger. The type and only species, Rugops primus, is known only from a partial
  skull. It was named and described in 2004 by Paul Sereno, Jeffery Wilson and
  Jack Conrad. Rugops has an estimated length of 4.4-5.3 meters (14-17 ft) and
  weight of 410 kilograms (900 lb). The top of its skull bears several pits
  which correlates with overlaying scale and the front of the snout would have
  had an armor-like dermis.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Small fenestra in skull roof between prefrontal, frontal, post-orbital and
    lacrimal
  - Row of seven small invaginated depressions on dorsal surface of each nasal
  - Textured external surface with groove-and-pit ornamentation
  - U-shaped dental arcade
  - Broad maxillary-jugal contact
  - Subrectangular alveoli
