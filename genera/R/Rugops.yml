genus: Rugops
parent: Abelisauridae
etymology: From Latin 'ruga' (wrinkle) + Greek 'ops' (face, eye), meaning
  'wrinkle face', referring to the pitted and rough surface of the skull.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Small fenestra in skull roof between prefrontal, frontal, post-orbital and
    lacrimal
  - Row of seven small invaginated depressions on dorsal surface of each nasal
  - Textured external surface with groove-and-pit ornamentation
  - U-shaped dental arcade
  - Broad maxillary-jugal contact
  - Subrectangular alveoli
appearance:
  features:
    - cranial bosses
    - nasal crest
  integument: scaled
  evidence: inferred
identifiers:
  - source: pbdb
    id: "71394"
  - source: wikidata
    id: Q133025
  - source: gbif
    id: "4822826"
  - source: eol
    id: "4532799"
species:
  - name: Rugops primus
    etymology: "From Latin 'primus' meaning 'first', referring to Rugops being one
      of the earliest abelisaurids known with a heavily textured skull."
    pronunciation:
      phonetic: PRYE-mus
    status: valid
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Cenomanian
    location:
      country: NE
      locality: Iguidi
      region: NE-1
      formation: Farak
      notes: >
        Sereno and colleagues (2026) assign the Iguidi (In Abangharit) area to
        the Farak Formation, from Faure's type sections north of Tanout, its
        fauna, and its position beneath the Cenomanian–Turonian limestone
        exposed to the west.
    type_specimen:
      specimen_id: [ MNBH IGU1 ]
      specimen_type: holotype
      institution: MNBH
      material: Partial cranium lacking the posterolateral portions of the skull roof
        and palate
      completeness: fragmentary
    size:
      hip_height_m:
        min: 1.5
        max: 1.5
      length_m:
        min: 4.4
        max: 6.0
      weight_kg:
        min: 410
        max: 750
    erected_in: sereno2004a
pronunciation:
  phonetic: roo-gops
references:
  - id: sereno2026a
    notes: Concludes that "both the Jenguebi and Iguidi (In Abangharit) fossil
      areas represent exposures of the Farak Formation".
  - id: sereno2004a
  - id: jones2026c
    notes: Source of the hip height estimate, and the appearance features.
