genus: Ratchasimasaurus
parent: Styracosterna
etymology: Named after Nakhon Ratchasima province in Thailand where the fossil was found, combined with Greek sauros (lizard); meaning "Nakhon Ratchasima lizard".
pronunciation:
  phonetic: rat-KAS-ee-muh-SOR-us
description: Ratchasimasaurus is a genus of iguanodontian ornithopod dinosaur
  from Early Cretaceous (Aptian stage) Khok Kruat Formation of Nakhon Ratchasima
  province in northeastern Thailand. The type and only species is R. suranareae,
  named after Thao Suranari, a 19th-century war heroine. It is diagnosed by a
  uniquely elongated, dorsoventrally compressed dentary ramus, though one study
  regarded the genus as a nomen dubium on the grounds that its characters are
  widespread in Styracosterna.
dispute:
  summary: >
    Ratchasimasaurus suranareae is diagnosed by a uniquely elongated,
    dorsoventrally compressed dentary ramus (Jones, 2026); its position
    is debated between basal Styracosterna (Jones, 2026) and basal
    Hadrosauroidea (Madzia and others, 2021), and a minority view has
    treated it as a nomen dubium.
  history:
    - date: "2026-06-27"
      note: Placed at Styracosterna, the least-inclusive clade these
        results agree on; nomen dubium.
    - date: "2026-07-14"
      note: Retained as valid; the dentary autapomorphy is upheld by
        recent literature (Jones, 2026), with the nomen dubium view
        treated as a minority opinion.
diet: herbivore
locomotion: facultative
paleoenvironment:
  - fluvial
diagnostic_features:
  - Proportionally elongated and flat dentary with length/height ratio > 6 (6.9
    in holotype)
  - Dorsoventrally compressed dentary ramus, unique among Iguanodontia
  - Caudally inclined coronoid process
  - Buccal shelf present between coronoid process and caudal tooth row
  - Alveolar trough molded to tooth crown and root shape
  - Short diastema between predentary attachment and first alveolus
