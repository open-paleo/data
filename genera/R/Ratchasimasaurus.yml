genus: Ratchasimasaurus
parent: Hadrosauroidea
etymology: Nakhon Ratchasima lizard
description: Ratchasimasaurus is a genus of iguanodontian ornithopod dinosaur
  from Early Cretaceous (Aptian stage) Khok Kruat Formation of Nakhon Ratchasima
  province in northeastern Thailand. The type and only species is R. suranareae,
  named after Thao Suranari, a 19th-century war heroine. It was considered by
  one study to be a nomen dubium, diagnosed with characters widespread in
  Styracosterna.
diet: herbivore
