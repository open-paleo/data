genus: Rhomaleopakhus
parent: Mamenchisauridae
etymology: From Greek rhomaleos (strong) and pachys (forearm, thick); meaning "strong forearm".
description: Rhomaleopakhus is a genus of mamenchisaurid sauropod dinosaur from
