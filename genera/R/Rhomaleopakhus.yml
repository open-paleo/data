genus: Rhomaleopakhus
parent: Mamenchisauridae
etymology: From Greek rhomaleos (strong) and pachys (forearm, thick); meaning "strong forearm".
pronunciation:
  phonetic: ro-mah-LAY-oh-PAK-us
description: Rhomaleopakhus is a genus of mamenchisaurid sauropod dinosaur from
  the Late Jurassic Kalaza Formation of China. The type and only species is
  Rhomaleopakhus turpanensis.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Humeral deltopectoral crest terminates distally in narrow ridge separated
    from main body by distinct grooves
  - Prominent ridge projecting posteromedially on posterior surface of radial
    shaft below proximal end
  - Radial distal articular surface markedly concave in central and medial
    portions
  - One of the most robust ulnae known, with maximum proximal end width to
    proximodistal length ratio of 0.50
  - Only non-somphospondylan eusauropod with long-axes of proximal and distal
    radius surfaces twisted through ~90°
appearance:
  integument: scaled
  evidence: inferred
