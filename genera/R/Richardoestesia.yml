genus: Richardoestesia
parent: Dromaeosauridae
placement: incertae sedis
dispute:
  summary: >
    The type species, Richardoestesia gilmorei, rests on a pair of dentaries
    and is treated as valid (Currie and colleagues, 1990; Averianov and Sues,
    2019). The isolated teeth referred to Richardoestesia across many
    formations and a long span of time probably represent several taxa
    (Larson and Currie, 2013; Averianov and Sues, 2019), so the name serves
    largely as a tooth form taxon. Its describers assigned it only to
    Maniraptora, family unknown, and it is retained provisionally at
    Dromaeosauridae incertae sedis.
  history:
    - date: 2026-07-01
      note: Retained at Dromaeosauridae incertae sedis; tooth/form taxon, formally
        Maniraptora family-unknown, dromaeosaurid affinity uncertain.
    - date: "2026-10-09"
      note: Status of the type species confirmed valid; the summary separates the jaw-based type species from the tooth-based referrals.
pronunciation:
  phonetic: ri-KARD-o-es-TEE-zee-a
etymology: Named in honor of paleontologist Richard Estes, with the Latinised
  possessive form 'Richardoestesia' combining the first name Richard with the
  surname Estes.
description: Richardoestesia is a morphogenus of theropod dinosaur teeth,
  originally described from the Late Cretaceous of what is now Canada. Its
  two species are the type species R. gilmorei and R. asiatica from
  Uzbekistan, first named Asiamericana asiatica. A third, R. isosceles from
  Texas, is a nomen dubium. It has been
  used as a morphotaxon to describe other theropod teeth widely displaced in
  time and space from the type species. If all teeth assigned to the genus are
  truly reflective of the animals biology and taxonomic state (as some teeth go
  as far back as the Late Jurassic), it would have been one of the longest
  lasting dinosaur genera, perhaps also being the most widely distributed.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Anterior mandibular teeth relatively straight with convex posterior outline
    in lateral view for distal half of tooth
  - Posterior teeth relatively short and recurved
  - Denticles shorter than other Judithian theropods, length 0.15 mm
  - Up to five denticles per millimeter on posterior carina of mandibular teeth
  - Curvature always present in proximal portion of tooth, contrasting with
    Maastrichtian Richardoestesia
appearance:
  integument: feathered
  evidence: inferred
identifiers:
  - source: pbdb
    id: "58873"
  - source: wikidata
    id: Q2029022
  - source: gbif
    id: "4822949"
  - source: eol
    id: "4531529"
synonyms:
  - name: Asiamericana
    type: junior subjective
    reason: Sues and Averianov (2013) referred its type species, Asiamericana
      asiatica Nessov, 1995, to Richardoestesia after finding denticles on the
      holotype tooth.
species:
  - name: Richardoestesia gilmorei
    etymology: Named for Charles Whitney Gilmore, the paleontologist who originally
      described the jaws as part of Chirostenotes pergracilis.
    status: valid
    type_species: true
    period:
      name:
        - Late Cretaceous
      stage:
        - Campanian
    location:
      country: CA
      locality: Dinosaur Provincial Park
      region: CA-AB
      formation: Dinosaur Park
      notes: Currie and colleagues (1990) locate the holotype only to a township
        section.
    type_specimen:
      specimen_id:
        - NMC 343
      specimen_type: holotype
      institution: CMN
      material: Pair of dentaries with unerupted and germ teeth
      completeness: fragmentary
    erected_in: currie1990a
  - name: Richardoestesia isosceles
    etymology: From 'isosceles', for the isosceles-triangle outline of the tooth
      crown in lateral view.
    status: nomen dubium
    type_species: false
    period:
      name:
        - Late Cretaceous
      stage:
        - Campanian
    location:
      country: US
      region: US-TX
      formation: Aguja
      locality: Talley Mountain microsites (VL-489), Big Bend National Park
    type_specimen:
      specimen_id:
        - LSUMG 489:6238
      specimen_type: holotype
      institution: LSUM
      material: An isolated tooth.
    erected_in: sankey2001a
  - name: Richardoestesia asiatica
    etymology: From Latin asiatica ("Asian"), for its occurrence in the Asian part
      of the ancient continent Asiamerica.
    status: valid
    type_species: false
    period:
      name:
        - Late Cretaceous
      stage:
        - Turonian
    location:
      country: UZ
      region: UZ-NW
      formation: Bissekty
      locality: Dzharakuduk
    type_specimen:
      specimen_id:
        - CCMGE 460/12457
      specimen_type: holotype
      institution: CCMGE
      material: An isolated tooth.
      completeness: fragmentary
    diagnostic_features:
      - Mesial carina fully serrated on most teeth, unlike R. gilmorei.
      - No interdenticular sulci, unlike R. gilmorei.
      - Denticle size varies sporadically along the carinae on most teeth.
      - A large area lacking enamel on the central part of the crown base on most
        teeth.
    erected_in: sues2013a
    described_in: averianov2019b
references:
  - id: currie1990a
    notes: Erects the species and gives the holotype horizon as the "Judith
      River (Oldman) Formation, Dinosaur Provincial Park, Alberta".
  - id: larson2013a
    notes: Treated Richardoestesia as a tooth morphotype rather than a natural taxon.
  - id: sankey2001a
    notes: Erects Richardoestesia isosceles on an isolated tooth (LSUMG 489:6238)
      from the Aguja Formation of Big Bend, Texas.
  - id: averianov2019b
    notes: Places the R. gilmorei holotype in the Campanian Dinosaur Park
      Formation, revises the diagnosis of R. asiatica, and treats R. isosceles
      as a nomen dubium.
  - id: sues2013a
    notes: Transfers Asiamericana asiatica to Richardoestesia, noting that the
      holotype tooth has fine denticles.
  - id: nessov1995a
    notes: Erects Asiamericana asiatica on three isolated teeth from the
      Bissekty Formation.
