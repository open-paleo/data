genus: Richardoestesia
parent: Dromaeosauridae
dispute:
  summary: >
    Richardoestesia is a jaw- and tooth-based taxon most often treated as a form
    taxon or nomen dubium; its describers assigned it only to Maniraptora, family
    unknown (Currie et al., 1990), and it is used across many formations to denote a
    general tooth morphology rather than a natural taxon (Larson and Currie, 2013).
    Its referral to Dromaeosauridae is uncertain; it is retained provisionally at
    Dromaeosauridae incertae sedis.
  history:
    - date: "2026-07-01"
      note: Retained at Dromaeosauridae incertae sedis; tooth/form taxon, formally Maniraptora family-unknown, dromaeosaurid affinity uncertain.
pronunciation:
  phonetic: ri-KARD-o-es-TEE-zee-a
etymology: Named in honor of paleontologist Richard Estes, with the Latinised
  possessive form 'Richardoestesia' combining his first name Richard with his
  surname Estes.
description: Richardoestesia is a morphogenus of theropod dinosaur teeth,
  originally described from the Late Cretaceous of what is now Canada, the
  United States, and possibly also Uzbekistan. It currently contains two
  species, R. gilmorei and R. isosceles, and a possible third, R. asiatica,
  although it has been classified in its own genus Asiamericana. It has been
  used as a morphotaxon to describe other theropod teeth widely displaced in
  time and space from the type species. If all teeth assigned to the genus are
  truly reflective of the animals biology and taxonomic state (as some teeth go
  as far back as the Late Jurassic), it would have been one of the longest
  lasting dinosaur genera, perhaps also being the most widely distributed.
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Anterior mandibular teeth relatively straight with convex posterior outline
    in lateral view for distal half of tooth
  - Posterior teeth relatively short and recurved
  - Denticles shorter than other Judithian theropods, length 0.15 mm
  - Up to five denticles per millimeter on posterior carina of mandibular teeth
  - Curvature always present in proximal portion of tooth, contrasting with
    Maastrichtian Richardoestesia
