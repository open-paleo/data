genus: Ruixinia
parent: Somphospondyli
dispute:
  summary: >
    Ruixinia was described as a somphospondylan, favored by its describers as
    a basal titanosaur (Mo et al., 2023), but has been recovered within
    Euhelopodidae by Han et al. (2024).
  history:
    - date: "2026-06-30"
      note: >
        Placed conservatively at Somphospondyli given the unresolved
        euhelopodid versus titanosaurian debate.
etymology: "Named in honor of Ruixin Zhang, who made significant contributions to the infrastructure and collection of the Erlianhaote Dinosaur Museum."
pronunciation:
  phonetic: roo-eh-sheen
description: Ruixinia is an extinct genus of somphospondylan sauropod dinosaur
  from the Early Cretaceous (Barremian) Yixian Formation of China. The genus
  contains a single species, Ruixinia zhangi, known from a partial articulated
  skeleton. This specimen preserves the most complete series of caudal vertebrae
  known from any Asian titanosauriform.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - lacustrine
  - forested
diagnostic_features:
  - Distinct foramina present at the anterodorsal corner of the pleurocoels of
    the mid-posterior dorsals
  - Anterior caudal neural spines bifid
  - Anterior caudal neural spines with projecting subtriangular processes on the
    anterior margins
  - Distinct grooves present on the lateral surface of neural arches in Caudals
    2-12
  - Transition point present between Caudal 22 and Caudal 23 with size
    discontinuity
  - Distalmost six caudals fused
  - Chevron 18 with a bifurcated posterior process
  - Chevron 20 approximately pentagonal in lateral view
  - Chevrons 23-36 plank-shaped and unfused distally
  - Lateral bulge developed on the lateral surface of the posterior lobe of the
    ilium
  - Posterior margin of the tibial shaft strongly convex
appearance:
  integument: scaled
  evidence: inferred
