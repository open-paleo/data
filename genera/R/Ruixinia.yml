genus: Ruixinia
parent: Euhelopodidae
etymology: "Named in honour of Ruixin Zhang, who made significant contributions to the infrastructure and collection of the Erlianhaote Dinosaur Museum."
description: Ruixinia is an extinct genus of somphospondylan sauropod dinosaur
  from the Early Cretaceous (Barremian) Yixian Formation of China. The genus
  contains a single species, Ruixinia zhangi, known from a partial articulated
  skeleton. This specimen preserves the most complete series of caudal vertebrae
  known from any Asian titanosauriform.
