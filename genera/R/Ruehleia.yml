genus: Ruehleia
parent: Plateosauria
placement: incertae sedis
pronunciation:
  phonetic: ROO-lee-uh
etymology: Named for German paleontologist Hugo Rühle von Lilienstern, who
  collected paleontological material from the region.
description: Ruehleia is a genus of sauropodomorph dinosaur from the Late
  Triassic period of Germany. The type species is R. bedheimensis, described by
  Galton in 2001, and is named for the German paleontologist Hugo Rühle von
  Lilienstern. Discovered in 1952, the holotype consists of one nearly complete
  skeleton, including cervical (neck), dorsal (back), and caudal (tail)
  vertebrae; a partial sacrum; a scapulocoracoid; pelvic bones; most limb bones;
  and a partially complete manus (hands). The fossils were found in the
  Trossingen Formation of central Germany and date to the Norian stage, around
  216 to 208 million years ago.
dispute:
  summary: >
    Ruehleia bedheimensis is a German Late Triassic sauropodomorph usually
    treated as a plateosaurid, but the analysis of Wang and others (2025)
    instead places it with Plateosauravus as a basal massopodan.
  history:
    - date: "2026-06-29"
      note: Placed at Plateosauria incertae sedis; Plateosauridae versus basal Massopoda unresolved.
locomotion: bipedal
paleoenvironment:
  - fluvial
  - arid
diet: herbivore
appearance:
  integument: scaled
  evidence: inferred
