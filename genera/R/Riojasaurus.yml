genus: Riojasaurus
parent: Riojasauridae
pronunciation:
  phonetic: ree-OH-hah-SAWR-us
etymology: Named after La Rioja Province in Argentina where it was found,
  combined with Greek sauros (lizard); meaning "lizard from La Rioja".
description: Riojasaurus was a herbivorous sauropodomorph dinosaur named after
  La Rioja Province in Argentina where it was found in the Los Colorados
  Formation in the Ischigualasto-Villa Unión Basin by José Bonaparte. It lived
  during the Late Triassic (Norian stage) and grew to about 6.6 meters (22 ft)
  long. Riojasaurus is the only known riojasaurid to live in South America.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - arid
appearance:
  features:
    - elongate forelimbs
  integument: scaled
  evidence: inferred
diagnostic_features:
  - Femur relatively straight in dorsal view
  - Femoral head projects medially, forming a right angle with the shaft
  - Humerus robust, with a broad internal tuberosity and deltopectoral crest,
    and a short diaphysis constrained by the proximal and distal expansions
  - Ilium robust, with a broad posterior projection, the preacetabular process
    only slightly longer than the postacetabular process
  - Pubis with straight lateral and medial edges
  - Tibia plus astragalus length equal to 90% of femur length, humerus equal to
    80% of femur length, and humerus plus radius equal to 67% of femur plus
    tibia length
