genus: Riojasaurus
parent: Riojasauridae
pronunciation:
  phonetic: ree-OH-hah-SAWR-us
etymology: Named after La Rioja Province in Argentina where it was found,
  combined with Greek sauros (lizard); meaning "lizard from La Rioja".
description: Riojasaurus was a herbivorous sauropodomorph dinosaur named after
  La Rioja Province in Argentina where it was found in the Los Colorados
  Formation in the Ischigualasto-Villa Unión Basin by José Bonaparte. It lived
  during the Late Triassic (Norian stage) and grew to about 6.6 meters (22 ft)
  long. Riojasaurus is the only known riojasaurid to live in South America.
diet: herbivore
locomotion: bipedal
