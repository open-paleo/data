genus: Rativates
parent: Ornithomimidae
etymology: "From Latin 'ratis' meaning 'raft' (in reference to the bird group Ratites) and 'vates' meaning 'seer'; the ornithomimids seemingly foretold the future existence of the ratites they resembled."
description: Rativates is a genus of ornithomimid theropod dinosaur from the
  Campanian-aged (Late Cretaceous) Dinosaur Park Formation of Alberta, Canada.
  The type species is Rativates evadens.
diet: herbivore
locomotion: bipedal
paleoenvironment:
  - fluvial
  - coastal
diagnostic_features:
  - Maxilla with contact for jugal short and blunt rather than long and tapered
  - Mid-caudal neural spines mound-like and anteroposteriorly reduced at tail
    transition
  - Posterior contact of ischial shafts convex and completely fused
  - Distal end of third metatarsal without concavity on flexor surface, with
    straight flexor edge in distal view
  - Relatively enlarged medial condyle of tibia
