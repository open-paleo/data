genus: Raptorex
parent: Tyrannosauroidea
placement: incertae sedis
pronunciation:
  phonetic: RAP-tor-eks
etymology: From Latin raptor ('robber') and rex ('king')
description: Raptorex is a controversial genus of tyrannosaurid dinosaur. Its
  fossil remains consist of a single juvenile specimen probably uncovered in
  Mongolia, or possibly northeastern China. The type species is R. kriegsteini,
  described in 2009 by Sereno and colleagues. The genus name is derived from
  Latin raptor, "robber", and rex, "king". The specific name honors Roman
  Kriegstein, a survivor of the Holocaust, whose son Henry Kriegstein donated
  the specimen to the University of Chicago for scientific study.
dispute:
  summary: >
    Raptorex kriegsteini was named by Sereno et al. (2009) from a single small
    skeleton (holotype LH PV18) they interpreted as a subadult from the Lower
    Cretaceous of China. Fowler et al. (2011) reassessed LH PV18 as a probable
    juvenile of currently unknown provenance, rejecting the Lower Cretaceous
    China origin, and argued it more likely represents a juvenile of a larger
    Late Cretaceous Mongolian tyrannosaurid — possibly Tarbosaurus, as in its
    original sale description — concluding that Raptorex should be regarded as a
    nomen dubium pending stronger evidence.
  history:
    - date: "2026-06-25"
      note: Kept at Tyrannosauroidea incertae sedis; validity and provenance contested (likely a juvenile tyrannosaurine).
diet: carnivore
locomotion: bipedal
paleoenvironment:
  - fluvial
diagnostic_features:
  - Narrow accessory pneumatic fossa within antorbital fossa dorsal to maxillary
    fenestra
  - Jugal suborbital ramus of particularly narrow depth (transverse width
    approximately 60% of vertical depth)
  - Absence of vertical crest on iliac blade dorsal to acetabulum
  - Proportionately large skull measuring approximately 40% of trunk length
  - Enlarged olfactory bulbs approximately 60% of maximum cerebral hemispheres
    width
  - Diminutive forelimb with humeral length 29% that of femur
