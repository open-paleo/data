genus: Rayososaurus
parent: Rebbachisauridae
description: Rayososaurus is an extinct genus of sauropod dinosaur in the family
  Rebbachisauridae. Rayososaurus was named by Argentinian paleontologist José
  Bonaparte in 1996. Its type and only accepted species is Rayososaurus
  agrioensis. The species Limaysaurus tessonei was at one point included in
  Rayososaurus as Rayososaurus tessonei.
