genus: Rayososaurus
parent: Rebbachisauridae
dispute:
  summary: >
    Rayososaurus is a valid rebbachisaurid distinct from Limaysaurus, from which
    it was separated when the species formerly referred to it was moved to the
    new genus Limaysaurus (Salgado et al., 2004). Its position within
    Rebbachisauridae is poorly constrained owing to its fragmentary holotype: it
    has been recovered within Limaysaurinae (Carballido et al., 2012), and is
    frequently excluded from analyses.
  history:
    - date: "2026-06-30"
      note: >
        Retained at Rebbachisauridae, the least inclusive uncontested node; the
        fragmentary holotype precludes a stable subfamily assignment.
pronunciation:
  phonetic: rie-YOH-soh-SAWR-us
etymology: Named after the Rayoso Formation in Neuquén Province, Argentina,
  where the specimen was excavated, combined with Greek 'sauros' (lizard).
description: Rayososaurus is an extinct genus of sauropod dinosaur in the family
  Rebbachisauridae. Rayososaurus was named by Argentinian paleontologist José
  Bonaparte in 1996. Its type and only accepted species is Rayososaurus
  agrioensis. The species Limaysaurus tessonei was at one point included in
  Rayososaurus as Rayososaurus tessonei.
diet: herbivore
locomotion: quadrupedal
paleoenvironment:
  - fluvial
  - arid
appearance:
  integument: scaled
  evidence: inferred
diagnostic_features:
  - Scapular acromion process very well developed and directed markedly posteriorly
  - Ventral margin of the scapular blade with a strong, pointed, ventrodistally
    directed expansion
  - V-shaped angle between the acromion process and the dorsodistal margin of the
    scapular blade
