# Region registry: ISO 3166-2 subdivision code -> English name.
#
# `location.region` holds the CODE; the build resolves it to the name and emits
# both (`region` and `region_code`) into dist/. Storing the code lets an
# external registry settle spelling, rank words and exonyms in one move,
# instead of us arbitrating Bayern vs Bavaria or Amur vs Amur Oblast.
#
# Only codes actually in use are listed, as with institutions.yaml. Add a code
# here in the same commit that first uses it.
#
# Two traps, both of which produced wrong assignments before being caught:
#
#   1. SUPERSEDED CODES. France's 2016 reform retired FR-P (Lower Normandy) for
#      FR-NOR (Normandy), and both are still published in reference data, so one
#      place can resolve to two codes. Only current codes belong here.
#   2. RECYCLED CODES. Morocco's 2015 twelve-region reform reused its numbers
#      for different regions, so the published deprecation data cannot tell the
#      old MA-05 from the new one. The Moroccan block is pinned by hand, as are
#      six other codes whose deprecation flags are false positives.
#
# Not every country has subdivisions -- Antarctica has none at all -- so
# `region` stays optional and those records carry only a locality.

