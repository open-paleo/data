<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Paleo — Import Report</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.5;
            color: #1a1a1a;
            background: #f5f5f5;
            min-height: 100vh;
        }

        .site-header {
            background: #2d5016;
            color: #fff;
            padding: 1.5rem 1rem;
            text-align: center;
        }

        .site-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .site-header p {
            font-size: 0.9rem;
            opacity: 0.85;
        }

        .container {
            max-width: 960px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .upload-area {
            text-align: center;
            padding: 3rem 1rem;
            border: 2px dashed #ccc;
            border-radius: 8px;
            background: #fff;
            cursor: pointer;
            transition: border-color 0.15s;
        }

        .upload-area:hover {
            border-color: #2d5016;
        }

        .upload-area p {
            margin-bottom: 1rem;
            color: #666;
        }

        .upload-area input[type="file"] {
            display: none;
        }

        .upload-area label {
            display: inline-block;
            padding: 0.5rem 1.5rem;
            background: #2d5016;
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .upload-area label:hover {
            background: #3a6b1e;
        }

        .dashboard {
            display: none;
        }

        .dashboard.visible {
            display: block;
        }

        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .summary-card {
            background: #fff;
            border-radius: 8px;
            padding: 1.25rem;
            border: 1px solid #e0e0e0;
            text-align: center;
        }

        .summary-card .value {
            font-size: 2rem;
            font-weight: 700;
            color: #2d5016;
            display: block;
        }

        .summary-card .label {
            font-size: 0.8rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .section {
            background: #fff;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .section h2 {
            font-size: 1.1rem;
            margin-bottom: 1rem;
            color: #2d5016;
        }

        .bar-chart {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .bar-row {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .bar-label {
            width: 120px;
            font-size: 0.85rem;
            text-align: right;
            flex-shrink: 0;
        }

        .bar-track {
            flex: 1;
            height: 20px;
            background: #eee;
            border-radius: 4px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            background: #2d5016;
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .bar-value {
            width: 40px;
            font-size: 0.85rem;
            font-weight: 600;
            flex-shrink: 0;
        }

        .gap-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .gap-tag {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.25rem 0.75rem;
            background: #fff3e0;
            color: #e65100;
            border-radius: 16px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .gap-tag .count {
            background: #e65100;
            color: #fff;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
        }

        .clades-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
        }

        .clade-tag {
            padding: 0.2rem 0.6rem;
            background: #e8f5e9;
            color: #2d5016;
            border-radius: 4px;
            font-size: 0.8rem;
        }

        .genus-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        .genus-table th {
            text-align: left;
            padding: 0.5rem 0.75rem;
            background: #f5f5f5;
            border-bottom: 2px solid #e0e0e0;
            font-weight: 600;
        }

        .genus-table td {
            padding: 0.5rem 0.75rem;
            border-bottom: 1px solid #eee;
        }

        .genus-table tr:hover td {
            background: #f9f9f9;
        }

        .coverage-badge {
            display: inline-block;
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .coverage-high {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .coverage-mid {
            background: #fff3e0;
            color: #e65100;
        }

        .coverage-low {
            background: #ffebee;
            color: #c62828;
        }

        .genus-gaps {
            display: flex;
            flex-wrap: wrap;
            gap: 0.25rem;
        }

        .genus-gap {
            font-size: 0.75rem;
            padding: 0.1rem 0.4rem;
            background: #f5f5f5;
            border-radius: 3px;
            color: #888;
        }

        .table-controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            align-items: center;
        }

        .table-controls input {
            flex: 1;
            padding: 0.4rem 0.75rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            font: inherit;
            font-size: 0.85rem;
        }

        .table-controls select {
            padding: 0.4rem 0.75rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            font: inherit;
            font-size: 0.85rem;
            background: #fff;
        }

        .timestamp {
            font-size: 0.8rem;
            color: #999;
            text-align: right;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>

<header class="site-header">
    <h1>Open Paleo</h1>
    <p>Batch Import Report</p>
</header>

<div class="container">
    <div id="upload" class="upload-area">
        <p>Drop a <strong>report.json</strong> file here or click to browse</p>
        <label for="file-input">Choose File</label>
        <input type="file" id="file-input" accept=".json">
    </div>

    <div id="dashboard" class="dashboard">
        <div id="timestamp" class="timestamp"></div>

        <div id="summary-cards" class="summary-cards"></div>

        <div class="section">
            <h2>Field Coverage</h2>
            <div id="gap-chart" class="bar-chart"></div>
        </div>

        <div class="section">
            <h2>Most Common Gaps</h2>
            <div id="gap-tags" class="gap-tags"></div>
        </div>

        <div id="clades-section" class="section" style="display: none;">
            <h2>New Clades Added</h2>
            <div id="clades-list" class="clades-list"></div>
        </div>

        <div class="section">
            <h2>Genera Details</h2>
            <div class="table-controls">
                <input type="text" id="search-input" placeholder="Search genera...">
                <select id="sort-select">
                    <option value="name">Sort by name</option>
                    <option value="coverage-desc">Coverage (high first)</option>
                    <option value="coverage-asc">Coverage (low first)</option>
                    <option value="gaps-desc">Most gaps first</option>
                </select>
            </div>
            <table class="genus-table">
                <thead>
                    <tr>
                        <th>Genus</th>
                        <th>Issue</th>
                        <th>Coverage</th>
                        <th>Gaps</th>
                    </tr>
                </thead>
                <tbody id="genus-tbody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
(function ()
{
    "use strict";

    const uploadArea = document.getElementById("upload");
    const fileInput = document.getElementById("file-input");
    const dashboard = document.getElementById("dashboard");

    let reportData = null;

    /**
     * Handles file selection from the file input or drag-and-drop.
     *
     * @param file - The selected File object.
     */
    function handleFile(file)
    {
        const reader = new FileReader();

        reader.onload = function (event)
        {
            try
            {
                reportData = JSON.parse(event.target.result);
                render(reportData);
            }
            catch
            {
                alert("Invalid JSON file");
            }
        };

        reader.readAsText(file);
    }

    fileInput.addEventListener("change", function ()
    {
        if (fileInput.files.length > 0)
        {
            handleFile(fileInput.files[0]);
        }
    });

    uploadArea.addEventListener("dragover", function (event)
    {
        event.preventDefault();
        uploadArea.style.borderColor = "#2d5016";
    });

    uploadArea.addEventListener("dragleave", function ()
    {
        uploadArea.style.borderColor = "#ccc";
    });

    uploadArea.addEventListener("drop", function (event)
    {
        event.preventDefault();
        uploadArea.style.borderColor = "#ccc";

        if (event.dataTransfer.files.length > 0)
        {
            handleFile(event.dataTransfer.files[0]);
        }
    });

    /**
     * Renders the full dashboard from a parsed report object.
     *
     * @param report - The parsed report.json data.
     */
    function render(report)
    {
        uploadArea.style.display = "none";
        dashboard.classList.add("visible");

        renderTimestamp(report.timestamp);
        renderSummaryCards(report);
        renderGapChart(report.genera);
        renderGapTags(report.genera);
        renderClades(report.newCladesAdded);
        renderGenusTable(report.genera);
        bindControls(report.genera);
    }

    /**
     * Renders the timestamp line.
     *
     * @param timestamp - The ISO timestamp string.
     */
    function renderTimestamp(timestamp)
    {
        const date = new Date(timestamp);

        document.getElementById("timestamp").textContent =
            "Generated " + date.toLocaleDateString("en-US", {
                year: "numeric",
                month: "long",
                day: "numeric",
                hour: "2-digit",
                minute: "2-digit",
            });
    }

    /**
     * Renders the top-level summary metric cards.
     *
     * @param report - The parsed report data.
     */
    function renderSummaryCards(report)
    {
        const container = document.getElementById("summary-cards");
        const averageCoverage = report.genera.length > 0
            ? Math.round(
                report.genera.reduce(
                    function (sum, genus) { return sum + genus.fieldsPopulated; }, 0,
                ) / report.genera.length * 100 / report.genera[0].fieldsTotal,
            )
            : 0;

        const cards = [
            { value: report.totalIntakeIssues, label: "Intake issues" },
            { value: report.generaProcessed, label: "Processed" },
            { value: report.skippedAlreadyExists, label: "Already exist" },
            { value: averageCoverage + "%", label: "Avg coverage" },
            { value: report.newCladesAdded.length, label: "New clades" },
        ];

        container.innerHTML = "";

        for (const card of cards)
        {
            const element = document.createElement("div");

            element.className = "summary-card";
            element.innerHTML =
                "<span class=\"value\">" + escapeHtml(String(card.value)) + "</span>" +
                "<span class=\"label\">" + escapeHtml(card.label) + "</span>";
            container.appendChild(element);
        }
    }

    /**
     * Renders a horizontal bar chart showing per-field coverage rates.
     *
     * @param genera - The array of genus report entries.
     */
    function renderGapChart(genera)
    {
        const container = document.getElementById("gap-chart");
        const allFields = [
            "etymology", "description", "pronunciation", "diet",
            "locomotion", "holotype", "size", "reference",
        ];

        const total = genera.length;

        if (total === 0)
        {
            container.innerHTML = "<p>No genera to display.</p>";
            return;
        }

        const gapCounts = {};

        for (const field of allFields)
        {
            gapCounts[field] = 0;
        }

        for (const genus of genera)
        {
            for (const gap of genus.gaps)
            {
                if (gapCounts[gap] !== undefined)
                {
                    gapCounts[gap]++;
                }
            }
        }

        container.innerHTML = "";

        for (const field of allFields)
        {
            const populated = total - (gapCounts[field] ?? 0);
            const percentage = Math.round(populated / total * 100);

            const row = document.createElement("div");

            row.className = "bar-row";
            row.innerHTML =
                "<span class=\"bar-label\">" + escapeHtml(field) + "</span>" +
                "<div class=\"bar-track\"><div class=\"bar-fill\" style=\"width: " + percentage + "%\"></div></div>" +
                "<span class=\"bar-value\">" + percentage + "%</span>";
            container.appendChild(row);
        }
    }

    /**
     * Renders gap frequency tags showing the most common missing fields.
     *
     * @param genera - The array of genus report entries.
     */
    function renderGapTags(genera)
    {
        const container = document.getElementById("gap-tags");
        const gapCounts = {};

        for (const genus of genera)
        {
            for (const gap of genus.gaps)
            {
                gapCounts[gap] = (gapCounts[gap] ?? 0) + 1;
            }
        }

        const sorted = Object.entries(gapCounts).sort(
            function (first, second) { return second[1] - first[1]; },
        );

        container.innerHTML = "";

        for (const [gap, count] of sorted)
        {
            const tag = document.createElement("span");

            tag.className = "gap-tag";
            tag.innerHTML =
                escapeHtml(gap) +
                " <span class=\"count\">" + count + "</span>";
            container.appendChild(tag);
        }
    }

    /**
     * Renders the new clades section if any were added.
     *
     * @param clades - The array of new clade names.
     */
    function renderClades(clades)
    {
        const section = document.getElementById("clades-section");
        const container = document.getElementById("clades-list");

        if (!clades || clades.length === 0)
        {
            section.style.display = "none";
            return;
        }

        section.style.display = "";
        container.innerHTML = "";

        for (const clade of clades)
        {
            const tag = document.createElement("span");

            tag.className = "clade-tag";
            tag.textContent = clade;
            container.appendChild(tag);
        }
    }

    /**
     * Renders the genus detail table.
     *
     * @param genera - The array of genus report entries.
     */
    function renderGenusTable(genera)
    {
        const tbody = document.getElementById("genus-tbody");

        tbody.innerHTML = "";

        for (const genus of genera)
        {
            const row = document.createElement("tr");
            const percentage = Math.round(genus.fieldsPopulated / genus.fieldsTotal * 100);
            let badgeClass = "coverage-high";

            if (percentage < 50)
            {
                badgeClass = "coverage-low";
            }
            else if (percentage < 75)
            {
                badgeClass = "coverage-mid";
            }

            let gapsHtml = "";

            for (const gap of genus.gaps)
            {
                gapsHtml += "<span class=\"genus-gap\">" + escapeHtml(gap) + "</span>";
            }

            const issueLink = genus.issueNumber
                ? "<a href=\"https://github.com/open-paleo/data/issues/" + genus.issueNumber + "\">#" + genus.issueNumber + "</a>"
                : "";

            row.innerHTML =
                "<td>" + escapeHtml(genus.name) + "</td>" +
                "<td>" + issueLink + "</td>" +
                "<td><span class=\"coverage-badge " + badgeClass + "\">" +
                genus.fieldsPopulated + "/" + genus.fieldsTotal +
                " (" + percentage + "%)</span></td>" +
                "<td><div class=\"genus-gaps\">" + gapsHtml + "</div></td>";

            tbody.appendChild(row);
        }
    }

    /**
     * Binds search and sort controls to re-render the genus table.
     *
     * @param genera - The array of genus report entries.
     */
    function bindControls(genera)
    {
        const searchInput = document.getElementById("search-input");
        const sortSelect = document.getElementById("sort-select");

        /**
         * Filters and sorts genera, then re-renders the table.
         */
        function update()
        {
            const query = searchInput.value.toLowerCase();
            const sortBy = sortSelect.value;

            let filtered = genera;

            if (query)
            {
                filtered = genera.filter(
                    function (genus) { return genus.name.toLowerCase().includes(query); },
                );
            }

            const sorted = filtered.slice().sort(function (first, second)
            {
                if (sortBy === "coverage-desc")
                {
                    return second.fieldsPopulated - first.fieldsPopulated;
                }
                else if (sortBy === "coverage-asc")
                {
                    return first.fieldsPopulated - second.fieldsPopulated;
                }
                else if (sortBy === "gaps-desc")
                {
                    return second.gaps.length - first.gaps.length;
                }

                return first.name.localeCompare(second.name);
            });

            renderGenusTable(sorted);
        }

        searchInput.addEventListener("input", update);
        sortSelect.addEventListener("change", update);
    }

    /**
     * Escapes HTML special characters to prevent XSS.
     *
     * @param text - The string to escape.
     * @returns The escaped string.
     */
    function escapeHtml(text)
    {
        const element = document.createElement("span");

        element.textContent = text;
        return element.innerHTML;
    }
})();
</script>

</body>
</html>
