  Ornithischia:
    description: |
      Ornithischia, meaning "bird-hipped," is one of the two traditionally recognized major clades of dinosaurs. Ornithischians are united by a distinctive pelvic anatomy in which the pubis is rotated posteriorly to lie parallel with the ischium, convergently resembling the pelvic arrangement of birds (though birds are actually saurischians). The clade includes the armored thyreophorans (stegosaurs and ankylosaurs), the horned ceratopsians, the dome-headed pachycephalosaurs, and the duck-billed ornithopods. All ornithischians were herbivorous.
    taxonomy:
      - Life
      - Animalia
      - Chordata
      - Vertebrata
      - Sarcopterygii
      - Tetrapoda
      - Reptilia
      - Archosauria
      - Dinosauria
      - Ornithischia
    described: 1888
    authors: Seeley
    diagnostic_features:
      - Opisthopubic pelvis with posteriorly directed pubis parallel to ischium
      - Predentary bone at the tip of the lower jaw
      - Ossified tendons along the vertebral column in many taxa
      - Leaf-shaped cheek teeth with denticulate margins
      - Palpebral bone in the orbit
      - Herbivorous diet across all members
    references:
      - id: Seeley1888ornithischia
        authors: Seeley, H.G.
        year: 1888
        title: On the classification of the fossil animals commonly named Dinosauria
        journal: Proceedings of the Royal Society of London
        volume: "43"
