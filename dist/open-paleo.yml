  Siamosaurus:
    genus: Siamosaurus
    parent: Spinosauridae
    etymology: Siam lizard
    description: Siamosaurus is a potentially dubious genus of spinosaurid dinosaur that lived in what is now Thailand and possibly China during the Early Cretaceous period (Barremian to Aptian) and is the first reported spinosaurid from Asia. It is confidently known only from tooth fossils; the first were found in the Sao Khua Formation, with more teeth later recovered from the younger Khok Kruat Formation. The only species Siamosaurus suteethorni, whose name honours Thai palaeontologist Varavudh Suteethorn, was formally described in 1986. In 2009, four teeth from China previously attributed to a pliosaur—under the species "Sinopliosaurus" fusuiensis—were identified as those of a spinosaurid, possibly Siamosaurus. It is yet to be determined if two partial spinosaurid skeletons from Thailand and an isolated tooth from Japan also belong to Siamosaurus.
