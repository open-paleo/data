    description: |
      A genus of hadrosaurid dinosaur from the Late Cretaceous of North America. Parasaurolophus is best known for its large, elaborate cranial crest that extends back from the skull in a long, curved tube. The hollow crest likely functioned as a resonating chamber for producing sounds and for visual display.
