  Noasauridae:
    description: |
      Noasauridae is a family of small to medium-sized ceratosaurian theropod dinosaurs known primarily from Gondwanan continents during the Cretaceous period. Noasaurids were lightly built, gracile predators or omnivores, and represent the smaller-bodied counterpart to their sister group Abelisauridae within Abelisauria. Notable members include Noasaurus, Masiakasaurus, and Elaphrosaurus.
