    description: |
      Tetanurae, meaning "stiff tails," is a large clade of theropod dinosaurs characterized by stiffened tails with interlocking zygapophyses in the distal caudal vertebrae, and the reduction of the hand to three functional digits. Tetanurans include the megalosauroids, allosaurs, and coelurosaurs (including birds). The clade represents the majority of theropod diversity from the Middle Jurassic onward.
