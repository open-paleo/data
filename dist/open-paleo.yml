      - Ornithischia
      - Cerapoda
    described: 1986
    authors: Sereno
    diagnostic_features:
      - Well-developed coronoid process on the dentary
      - Asymmetrical enamel distribution on teeth facilitating shearing occlusion
      - Reduction or loss of premaxillary teeth
      - Diastema between premaxillary and maxillary tooth rows
      - Specialized jaw mechanics for efficient oral processing of vegetation
    references:
      - id: Sereno1986
        authors: Sereno, P.C.
        year: 1986
        title: Phylogeny of the bird-hipped dinosaurs (Order Ornithischia)
        journal: National Geographic Research
        volume: "2"
        pages: 234-256
  Ceratopsia:
    description: |
      Ceratopsia, meaning "horned faces," is a clade of marginocephalian ornithischian dinosaurs characterized by a unique rostral bone at the tip of the upper jaw and a parietosquamosal frill extending from the back of the skull. The clade includes small, bipedal basal forms such as Psittacosaurus and large, quadrupedal ceratopsids like Triceratops and Styracosaurus. Ceratopsians were exclusively herbivorous and were most diverse in the Late Cretaceous of North America and Asia. Horns above the eyes and nose evolved in more derived members.
    taxonomy:
      - Life
      - Animalia
      - Chordata
      - Vertebrata
      - Sarcopterygii
      - Tetrapoda
      - Reptilia
      - Archosauria
      - Dinosauria
      - Ornithischia
      - Cerapoda
      - Marginocephalia
      - Ceratopsia
    described: 1890
    authors: Marsh
    diagnostic_features:
      - Rostral bone forming a sharp, beak-like tip of the upper jaw
      - Parietosquamosal frill extending posterodorsally from the skull
      - Jugal flanges (flared cheek horns) on the skull
      - Shearing dentition with double-rooted cheek teeth
      - Nasal and supraorbital horns in derived ceratopsids
      - Predentary bone with a sharp cutting edge
    references:
      - id: Marsh1890
        authors: Marsh, O.C.
        year: 1890
        title: Additional characters of the Ceratopsidae, with notice of new Cretaceous dinosaurs
        journal: American Journal of Science
        volume: "39"
        pages: 418-426
  Ceratopsidae:
    description: |
      Ceratopsidae is a family of large-bodied ceratopsian ornithischian dinosaurs known from the Late Cretaceous of western North America (and possibly Asia). Ceratopsids are among the most recognizable dinosaurs, characterized by elaborate cranial ornamentation including large nasal and supraorbital horns, expansive parietosquamosal frills often decorated with epiossifications (epoccipitals and epiparietals), and a robust, barrel-shaped body. The family is divided into Chasmosaurinae (long-frilled forms like Triceratops) and Centrosaurinae (short-frilled forms like Centrosaurus).
    taxonomy:
