    description: Thescelosaurus is a genus of ornithischian dinosaur that lived during the Late Cretaceous period in western North America. It was named and described in 1913 by the paleontologist Charles W. Gilmore; the type species is T. neglectus. Two other species, T. garbanii and T. assiniboiensis, were named in 1976 and 2011, respectively. Additional species have been suggested but are currently not accepted. Thescelosaurus is the eponymous member of its family, the Thescelosauridae. Thescelosaurids are either considered to be basal ("primitive") ornithopods, or are placed outside of this group within the broader group Neornithischia.
