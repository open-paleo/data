  Aphanosauria:
    description: |
      Aphanosauria is a clade of early avemetatarsalian archosaurs from the Middle to Late Triassic, known from South America, Europe, and possibly Africa. Members of Aphanosauria were quadrupedal or semi-quadrupedal and possessed a long neck and tail. They are among the earliest-diverging members of the bird-line (Avemetatarsalia) and are important for understanding the early evolution of archosaurs prior to the origin of pterosaurs and dinosaurs.
    taxonomy:
      - Life
      - Animalia
      - Chordata
      - Vertebrata
      - Sarcopterygii
      - Tetrapoda
      - Reptilia
      - Archosauria
      - Aphanosauria
    described: 2017
    authors: Ezcurra et al.
  Archosauromorpha:
    description: |
      Archosauromorpha is a major clade of diapsid reptiles that includes archosaurs (birds, crocodilians, and their extinct relatives) and several related groups such as tanystropheids and rhynchosaurs. The clade originated in the Permian and diversified extensively during the Triassic, with members surviving to the present day as birds and crocodilians.
