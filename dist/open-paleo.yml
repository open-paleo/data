  Triunfosaurus:
    genus: Triunfosaurus
    parent: Somphospondyli
    etymology: Triunfo Basin reptile
    description: Triunfosaurus is a genus of somphospondylan sauropod dinosaur from the Early Cretaceous of Brazil. It contains a single species, T. leonardii, described by Carvalho et al. in 2017. As a genus, Triunfosaurus can be distinguished from all other titanosaurs by the unique proportions of its ischium. It was initially described as a basal titanosaur, making it the earliest basal titanosaur known; however, subsequent research questioned the identification of the taxon as a titanosaur, instead reassigning it to the Somphospondyli.
    diet: herbivore
