    description: "Zhenyuanlong is a genus of dromaeosaurid dinosaur from the Yixian Formation of Liaoning, China. It lived during the Aptian age of the early Cretaceous period, approximately 125 million years ago. It is known from a single specimen belonging to the species Zhenyuanlong suni (Chinese: 孫氏振元龍). This type specimen preserved a nearly complete skeleton that contains traces of feathers, including long tail feathers and large wings. In addition to further complicating diversity of Liaoning dromaeosaurids, this specimen provides the first direct evidence of well-developed pennaceous feathers in a large, non-flying dromaeosaur, raising the question of what function such wings would serve."
