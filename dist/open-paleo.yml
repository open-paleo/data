  Sauropoda:
    description: |
      Sauropoda is a clade of large to gigantic sauropodomorph dinosaurs that includes the largest terrestrial animals in Earth's history. Sauropods were obligate quadrupeds with columnar limbs, extremely elongated necks containing 12 or more cervical vertebrae, long tails, and relatively small skulls. Extensive skeletal pneumaticity (air-filled bones) reduced body mass and may have aided respiration. Sauropods were globally distributed throughout the Jurassic and Cretaceous periods and occupied large-bodied herbivore niches on every continent.
