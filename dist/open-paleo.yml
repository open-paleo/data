        pages: 60-204
  Diplodocidae:
    description: |
      Diplodocidae is a family of diplodocoid sauropod dinosaurs known primarily from the Late Jurassic of North America, with additional occurrences in Africa and Europe. Diplodocids are characterized by their extremely elongated bodies with long, whip-like tails, elongate and shallow skulls with anteriorly restricted pencil-shaped teeth, and bifurcated (forked) neural spines on cervical and dorsal vertebrae. Notable members include Diplodocus, Apatosaurus, and Brontosaurus.
