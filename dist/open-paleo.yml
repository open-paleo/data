    description: |
      Theropoda, meaning "beast feet," is a clade of predominantly bipedal saurischian dinosaurs. Most theropods were carnivorous, though several lineages independently evolved herbivory or omnivory. Theropods are characterized by hollow (pneumatic) bones, three-toed weight-bearing hindlimbs, and a furcula (wishbone). The clade includes all living birds (Aves), making Theropoda one of the most successful vertebrate lineages in Earth's history.
