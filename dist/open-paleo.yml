  Brachiosaurus:
    genus: Brachiosaurus
    parent: Brachiosauridae
    etymology: arm lizard
    description: |
      A genus of sauropod dinosaur from the Late Jurassic of North America. Brachiosaurus is unusual among sauropods for its proportionally long forelimbs, giving it a giraffe-like posture with the body sloping upward toward the head. It was one of the tallest and largest dinosaurs known from relatively complete remains.
