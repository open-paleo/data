  Pachycephalosauria:
    description: |
      Pachycephalosauria, meaning "thick-headed lizards," is a clade of marginocephalian ornithischian dinosaurs characterized by a dramatically thickened skull roof (frontoparietal dome). These bipedal herbivores or omnivores were most diverse during the Late Cretaceous of North America and Asia. The thickened dome has been hypothesized to have served in intraspecific head-butting or flank-butting contests, though this remains debated. Notable genera include Pachycephalosaurus, Stegoceras, and Dracorex.
