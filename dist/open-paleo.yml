  Titanosauria:
    description: |
      Titanosauria is a diverse and species-rich clade of macronarian sauropod dinosaurs that dominated herbivore niches across Gondwana and Laurasia during the Cretaceous period. Titanosaurs include both the largest known dinosaurs (Argentinosaurus, Patagotitan) and some of the smallest sauropods (Magyarosaurus). Many titanosaurs possessed osteoderms (bony armor plates) embedded in the skin, a feature unique among sauropods. The clade was the last major sauropod radiation before the end-Cretaceous extinction.
