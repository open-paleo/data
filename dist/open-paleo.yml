clades:
  Abelisauridae:
    description: |
      Abelisauridae is a family of ceratosaurian theropod dinosaurs that were dominant predators in Gondwanan landmasses during the Cretaceous period. Abelisaurids are characterized by short, deep skulls, heavily ornamented cranial bones, and dramatically reduced forelimbs that are even more vestigial than those of tyrannosaurids. Notable members include Carnotaurus, Majungasaurus, and Abelisaurus. The family was most diverse in South America, Madagascar, and India.
    taxonomy:
      - Life
      - Animalia
      - Chordata
      - Vertebrata
      - Sarcopterygii
      - Tetrapoda
      - Reptilia
      - Archosauria
      - Dinosauria
      - Saurischia
      - Theropoda
      - Ceratosauria
      - Abelisauridae
    described: 1985
    authors: Bonaparte & Novas
    diagnostic_features:
      - Short, deep skull with rugose ornamentation on frontal and nasal bones
      - Extremely reduced forelimbs with vestigial digits
      - Thickened skull roof bones
      - Robust and short cervical vertebrae
      - Well-developed femoral musculature attachment sites indicating powerful hindlimbs
    references:
      - id: BonaparteNovas1985
        authors: Bonaparte, J.F. & Novas, F.E.
        year: 1985
        title: Abelisaurus comahuensis, n.g., n.sp., Carnosauria del Cretacico Tardio de Patagonia
        journal: Ameghiniana
        volume: "21"
        pages: 259-265
