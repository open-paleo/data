  Spinosauridae:
    description: |
      Spinosauridae is a family of large megalosauroid theropod dinosaurs characterized by elongated, crocodile-like snouts and conical, unserrated teeth adapted for piscivory (fish-eating). Many spinosaurids possessed enlarged dorsal neural spines forming a sail or ridge along the back. The family includes Spinosaurus, one of the largest known theropods, which shows evidence of semi-aquatic habits. Spinosaurids are known from the Cretaceous of Africa, Europe, and South America.
