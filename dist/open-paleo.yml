  Styracosterna:
    description: |
      Styracosterna, meaning "spiked stern," is a clade of ankylopollexian ornithopod dinosaurs characterized by a spike-like first manual ungual (thumb spike) that is more developed and conical than in basal ankylopollexians. The clade includes Iguanodon and more derived ornithopods leading to Hadrosauriformes. Styracosternans became the dominant large-bodied herbivores in many Early to Late Cretaceous ecosystems worldwide.
