    description: |
      Sauropodomorpha is a major clade of saurischian dinosaurs comprising the long-necked herbivorous dinosaurs and their ancestors. The clade ranges from small, facultatively bipedal early forms of the Late Triassic to the giant quadrupedal sauropods that dominated terrestrial herbivore niches throughout the Jurassic and Cretaceous. Sauropodomorphs include the largest land animals ever to have lived and are characterized by their elongated necks, small heads relative to body size, and herbivorous or omnivorous diets.
