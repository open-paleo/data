  Ornithomimosauria:
    description: |
      Ornithomimosauria, meaning "bird-mimic lizards," is a clade of coelurosaurian theropod dinosaurs known from the Cretaceous of North America, Asia, Europe, and Africa. Often called "ostrich dinosaurs," ornithomimosaurs were characterized by long legs adapted for swift running, elongate necks, small skulls with toothless beaks (in derived forms), and large eyes. They were likely omnivorous or herbivorous, representing a significant ecological departure from the ancestral carnivorous theropod condition.
    taxonomy:
      - Life
      - Animalia
      - Chordata
      - Vertebrata
      - Sarcopterygii
      - Tetrapoda
      - Reptilia
      - Archosauria
      - Dinosauria
      - Saurischia
      - Theropoda
      - Tetanurae
      - Avetheropoda
      - Coelurosauria
      - Ornithomimosauria
    described: 1972
    authors: Russell
    diagnostic_features:
      - Toothless, keratinous beak in derived members
      - Elongate cervical vertebrae forming a long, S-curved neck
      - Large orbits with well-developed sclerotic rings
      - Long, gracile hindlimbs adapted for cursorial locomotion
      - Arctometatarsalian foot in derived forms
      - Elongate manus with subequal metacarpals
    references:
      - id: Russell1972
        authors: Russell, D.A.
        year: 1972
        title: Ostrich dinosaurs from the Late Cretaceous of western Canada
        journal: Canadian Journal of Earth Sciences
        volume: "9"
        pages: 375-402
  Ornithopoda:
    description: |
      Ornithopoda, meaning "bird feet," is a clade of cerapodan ornithischian dinosaurs that includes the iguanodonts and hadrosaurs along with numerous smaller, basal members. Ornithopods were among the most successful and widespread herbivorous dinosaurs, ranging from small bipedal forms in the Jurassic to large quadrupedal hadrosaurs in the Late Cretaceous. They are characterized by their efficient jaw mechanism that allowed transverse (pleurokinetic) chewing of plant material, a feature rare among reptiles.
    taxonomy:
      - Life
      - Animalia
      - Chordata
      - Vertebrata
      - Sarcopterygii
      - Tetrapoda
      - Reptilia
      - Archosauria
      - Dinosauria
      - Ornithischia
      - Cerapoda
      - Ornithopoda
    described: 1881
    authors: Marsh
    diagnostic_features:
      - Pleurokinetic skull allowing lateral movement of the maxillae during chewing
      - Tridactyl (three-toed) pes with hoof-like unguals
      - Absence of premaxillary teeth (keratinous beak present)
      - Well-developed dental battery in advanced forms
      - Tendency toward facultative or obligate quadrupedality in larger taxa
      - Elongate prepubic process of the pubis
    references:
      - id: Marsh1881ornithopoda
        authors: Marsh, O.C.
        year: 1881
