  Ornithischia:
    description: |
      Ornithischia, meaning "bird-hipped," is one of the two traditionally recognized major clades of dinosaurs. Ornithischians are united by a distinctive pelvic anatomy in which the pubis is rotated posteriorly to lie parallel with the ischium, convergently resembling the pelvic arrangement of birds (though birds are actually saurischians). The clade includes the armored thyreophorans (stegosaurs and ankylosaurs), the horned ceratopsians, the dome-headed pachycephalosaurs, and the duck-billed ornithopods. All ornithischians were herbivorous.
    taxonomy:
      - Life
      - Animalia
      - Chordata
      - Vertebrata
