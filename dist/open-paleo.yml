  Maniraptora:
    description: |
      Maniraptora, meaning "hand snatchers," is a clade of coelurosaurian theropod dinosaurs that includes dromaeosaurids, troodontids, oviraptorosaurs, therizinosaurs, and birds (Aves). Maniraptorans are characterized by elongated arms relative to body size, a semilunate carpal bone enabling a folding mechanism in the wrist, and the widespread presence of pennaceous feathers. The clade represents the closest relatives of and includes modern birds, making it one of the most significant groups in understanding avian origins.
    taxonomy:
      - Life
      - Animalia
      - Chordata
      - Vertebrata
      - Sarcopterygii
      - Tetrapoda
      - Reptilia
      - Archosauria
