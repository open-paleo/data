  Spinophorosaurus:
    genus: Spinophorosaurus
    parent: Gravisauria
    description: Spinophorosaurus is a genus of sauropod dinosaur that lived in what is now Niger during the Middle Jurassic period. The first two specimens were excavated in the 2000s by German and Spanish teams under difficult conditions. The skeletons were brought to Europe and digitally replicated, making Spinophorosaurus the first sauropod to have its skeleton 3D printed, and were to be returned to Niger in the future. Together, the two specimens represented most of the skeleton of the genus, and one of the most completely known basal sauropods of its time and place. The first skeleton was made the holotype specimen of the new genus and species Spinophorosaurus nigerensis in 2009; the generic name ("spine-bearing lizard") refers to what was initially thought to be spiked osteoderms, and the specific name (Niger and -ensis) refers to where it was found. A juvenile sauropod from the same area was later assigned to the genus.
