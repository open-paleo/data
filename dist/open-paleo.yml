clades:
  Abelisauridae:
    description: |
      Abelisauridae is a family of ceratosaurian theropod dinosaurs that were dominant predators in Gondwanan landmasses during the Cretaceous period. Abelisaurids are characterized by short, deep skulls, heavily ornamented cranial bones, and dramatically reduced forelimbs that are even more vestigial than those of tyrannosaurids. Notable members include Carnotaurus, Majungasaurus, and Abelisaurus. The family was most diverse in South America, Madagascar, and India.
    taxonomy:
      - Life
      - Animalia
      - Chordata
      - Vertebrata
      - Sarcopterygii
      - Tetrapoda
      - Reptilia
      - Archosauria
      - Dinosauria
      - Saurischia
      - Theropoda
      - Ceratosauria
      - Abelisauridae
    described: 1985
    authors: Bonaparte & Novas
    diagnostic_features:
      - Short, deep skull with rugose ornamentation on frontal and nasal bones
      - Extremely reduced forelimbs with vestigial digits
      - Thickened skull roof bones
      - Robust and short cervical vertebrae
      - Well-developed femoral musculature attachment sites indicating powerful hindlimbs
    references:
      - id: BonaparteNovas1985
        authors: Bonaparte, J.F. & Novas, F.E.
        year: 1985
        title: Abelisaurus comahuensis, n.g., n.sp., Carnosauria del Cretacico Tardio de Patagonia
        journal: Ameghiniana
        volume: "21"
        pages: 259-265
  Allosauridae:
    description: |
      Allosauridae is a family of large carnosaur theropod dinosaurs best known from the Late Jurassic of North America and Europe. The family is typified by Allosaurus, one of the most abundant and well-studied large predatory dinosaurs. Allosaurids were apex predators characterized by large skulls with prominent lacrimal horns, powerful forelimbs with three clawed digits, and laterally compressed serrated teeth.
    taxonomy:
      - Life
      - Animalia
      - Chordata
      - Vertebrata
      - Sarcopterygii
      - Tetrapoda
      - Reptilia
      - Archosauria
      - Dinosauria
      - Saurischia
      - Theropoda
      - Tetanurae
      - Avetheropoda
      - Carnosauria
      - Allosauridae
    described: 1878
    authors: Marsh
    diagnostic_features:
      - Prominent lacrimal horns or hornlets above the eyes
      - Large skull with paired nasal crests
      - Laterally compressed, recurved, serrated teeth
      - Three-fingered manus with large manual unguals
      - Robust cervical vertebrae with well-developed epipophyses
    references:
      - id: Marsh1878
        authors: Marsh, O.C.
        year: 1878
        title: Notice of new dinosaurian reptiles
        journal: American Journal of Science
        volume: "15"
        pages: 241-244
