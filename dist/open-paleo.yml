  Spinosaurus:
    genus: Spinosaurus
    parent: Spinosauridae
    etymology: spine lizard
    description: |
      A genus of spinosaurid dinosaur from the Late Cretaceous of North Africa. Spinosaurus may have been the largest of all known carnivorous dinosaurs, even larger than Tyrannosaurus. It is distinguished by the tall neural spines on its vertebrae, which formed a prominent sail or hump along its back. Recent discoveries suggest it was semi-aquatic, adapted for hunting fish.
