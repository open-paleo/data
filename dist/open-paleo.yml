  Megalosauroidea:
    description: |
      Megalosauroidea is a superfamily of large-bodied basal tetanuran theropods that includes Megalosauridae and Spinosauridae. These predators were prominent during the Middle Jurassic through Late Cretaceous. Megalosauroids were among the first dinosaurs to be scientifically described and include some of the most specialized predatory forms, such as the semi-aquatic spinosaurids.
