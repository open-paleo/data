      Thyreophora, meaning "shield bearers," is a clade of armored ornithischian dinosaurs that includes Stegosauria and Ankylosauria. Thyreophorans are characterized by the presence of dermal armor in the form of osteoderms (bony scutes, plates, or spines) embedded in the skin along the body. The clade appeared in the Early Jurassic and persisted until the end of the Cretaceous, with a global distribution. Thyreophorans were obligate quadrupeds and herbivores.
