  Dinocephalia:
    description: |
      Dinocephalia is an extinct group of large therapsids from the Middle Permian. They were among the first large terrestrial vertebrates, with some members exceeding 3 meters in length. Dinocephalians included both herbivorous and carnivorous forms and are characterized by thickened skull bones, often interpreted as adaptations for head-butting behavior. The group went extinct at the end of the Capitanian stage.
    taxonomy:
