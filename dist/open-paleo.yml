      - Dinocephalia
  Dinosauria:
    description: |
      Dinosauria is a clade of archosaurian reptiles that first appeared during the Triassic period, approximately 233 million years ago. Dinosaurs are united by a suite of anatomical features including a fully upright (parasagittal) stance, a fully open (perforated) acetabulum in the pelvis, and three or more sacral vertebrae. The clade encompasses two major lineages, Saurischia and Ornithischia, and includes all descendants of their most recent common ancestor, extending to modern birds (Aves).
    taxonomy:
      - Life
      - Animalia
      - Chordata
      - Vertebrata
      - Sarcopterygii
      - Tetrapoda
      - Reptilia
      - Archosauria
      - Dinosauria
    described: 1842
    authors: Owen
    diagnostic_features:
      - Fully erect, parasagittal hindlimb posture
      - Perforated (fully open) acetabulum
      - Three or more sacral vertebrae
      - Elongate deltopectoral crest on the humerus
      - Asymmetrical fourth trochanter on the femur
      - Open hip socket allowing pillar-erect stance
    references:
      - id: Owen1842
        authors: Owen, R.
        year: 1842
        title: Report on British fossil reptiles, Part II
        journal: Report of the British Association for the Advancement of Science
        volume: "11"
        pages: 60-204
  Diplodocidae:
    description: |
      Diplodocidae is a family of diplodocoid sauropod dinosaurs known primarily from the Late Jurassic of North America, with additional occurrences in Africa and Europe. Diplodocids are characterized by their extremely elongated bodies with long, whip-like tails, elongate and shallow skulls with anteriorly restricted pencil-shaped teeth, and bifurcated (forked) neural spines on cervical and dorsal vertebrae. Notable members include Diplodocus, Apatosaurus, and Brontosaurus.
    taxonomy:
