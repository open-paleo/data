  Saurischia:
    description: |
      Saurischia, meaning "lizard-hipped," is one of the two major clades of dinosaurs. Saurischians retain an ancestral pelvic configuration in which the pubis points forward and downward, in contrast to the retroverted pubis of ornithischians. The clade includes the bipedal, mostly carnivorous theropods and the long-necked, herbivorous sauropodomorphs. Saurischia is defined as all dinosaurs more closely related to birds than to Triceratops.
