        pages: 1-252
  Hadrosauriformes:
    description: |
      Hadrosauriformes is a clade of styracosternan ornithopod dinosaurs that includes the hadrosaurs (duck-billed dinosaurs) and their immediate relatives such as Iguanodon. Hadrosauriforms are characterized by well- developed dental batteries consisting of multiple stacked replacement teeth, broad and flattened snouts (often described as duck-billed), and large body size. The clade was globally distributed during the Cretaceous period and represents one of the most successful ornithischian radiations.
