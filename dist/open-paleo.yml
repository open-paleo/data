  Ceratosauria:
    description: |
      Ceratosauria is a clade of early-diverging theropod dinosaurs that radiated primarily during the Jurassic and Cretaceous periods. Many ceratosaurs possessed prominent cranial ornamentation, including horns and crests. The group was particularly diverse in Gondwanan landmasses and includes the abelisaurids, noasaurids, and the Jurassic ceratosaurids. Ceratosaurs generally retained four digits on the hand, unlike the three-fingered condition of more derived theropods.
