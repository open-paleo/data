  Macronaria:
    description: |
      Macronaria, meaning "large nostrils," is a clade of neosauropod dinosaurs characterized by large nasal openings (external nares) that are typically larger than the orbits. The clade includes brachiosaurids, titanosaurs, and their relatives, and was particularly diverse and dominant during the Cretaceous period. Macronarians tended to have more robust, box-like skulls with spatulate teeth, in contrast to the elongate skulls and peg-like teeth of diplodocoids.
