  Zhuchengtitan:
    genus: Zhuchengtitan
    parent: Saltasauridae
    etymology: Zhucheng titan
    description: Zhuchengtitan is a genus of titanosaurian sauropod dinosaur from the Late Cretaceous of Shandong, China. It contains a single species, Z. zangjiazhuangensis, named by Mo Jinyou and colleagues in 2017 from a single humerus. Zhuchengtitan can be identified by the extreme width of the top end of its humerus, as well as the expansion of the deltopectoral crest on its humerus; both of these characteristics indicate that it was likely closely related to Opisthocoelicaudia. However, it differs from the latter by the flatter bottom articulating surface of its humerus. Zhuchengtitan lived in a floodplain environment alongside Shantungosaurus, Zhuchengtyrannus, and Sinoceratops.
