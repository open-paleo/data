  Troodontidae:
    description: |
      Troodontidae is a family of small, bird-like maniraptoran theropod dinosaurs known from the Cretaceous of North America, Asia, and Europe. Troodontids are notable for possessing the largest brain-to-body-size ratio among non-avian dinosaurs, suggesting relatively high intelligence. They had large, forward- facing eyes indicating good binocular vision, long and slender legs adapted for speed, and a retractable sickle claw on the second toe (smaller than in dromaeosaurids). Troodontids are among the closest known relatives of Aves.
