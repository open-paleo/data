    genus: Velociraptor
    parent: Dromaeosauridae
    etymology: swift thief
    description: |
      A genus of small dromaeosaurid dinosaur from the Late Cretaceous of Mongolia. Despite its popular depiction as a large predator, Velociraptor was roughly the size of a turkey, about 2 metres long and 15 kilograms. It possessed a large, sickle-shaped claw on the second toe of each foot, characteristic of dromaeosaurids.
