    description: Yamanasaurus is an extinct genus of saltasaurine titanosaurian dinosaur from the Río Playas Formation of Ecuador, which dates to the Campanian-Maastrichtian of the late Cretaceous period (approximately 75-70 million years ago). The type and only species is Yamanasaurus lojaensis, representing the first non-avian dinosaur described from Ecuador. The holotype, consisting of fragments of a humerus, ulna, tibia, two sacral vertebrae and a single caudal, was discovered in 2017.
