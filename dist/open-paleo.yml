  Iguanodon:
    genus: Iguanodon
    parent: Styracosterna
    etymology: iguana tooth
    description: |
      A genus of ornithopod dinosaur from the Early Cretaceous of Europe. Iguanodon was one of the first dinosaurs ever scientifically described and is one of the founding members of the group Dinosauria. It is notable for its large thumb spike, which was originally mistakenly placed on its nose in early reconstructions.
