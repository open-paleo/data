  Ankylopollexia:
    description: |
      Ankylopollexia, meaning "fused thumb," is a clade of ornithopod dinosaurs characterized by a robust, conical thumb spike formed by a modified and enlarged pollex (first manual digit). This distinctive feature likely served as a defensive weapon or for intraspecific combat. Ankylopollexians range from medium-sized bipedal forms such as Camptosaurus to the large iguanodonts and hadrosaurs. The clade represents one of the most diverse and successful ornithischian radiations.
    taxonomy:
      - Life
      - Animalia
      - Chordata
      - Vertebrata
      - Sarcopterygii
      - Tetrapoda
      - Reptilia
      - Archosauria
      - Dinosauria
      - Ornithischia
      - Cerapoda
      - Ornithopoda
      - Ankylopollexia
    described: 1986
    authors: Sereno
    diagnostic_features:
      - Conical, spike-like thumb (pollex) formed by a fused and enlarged first manual ungual
      - Robust metacarpal I fused to or tightly articulating with the carpus
      - Progressive reduction of manual digit V
      - Elongate and robust prepubic process
      - Trend toward increasingly complex dental batteries in derived members
    references:
      - id: Sereno1986ankylopollexia
        authors: Sereno, P.C.
        year: 1986
        title: Phylogeny of the bird-hipped dinosaurs (Order Ornithischia)
        journal: National Geographic Research
        volume: "2"
        pages: 234-256
  Ankylosauria:
    description: |
      Ankylosauria is a clade of heavily armored thyreophoran ornithischian dinosaurs known from the Middle Jurassic to the end of the Cretaceous. Ankylosaurs were low-slung, quadrupedal herbivores encased in extensive dermal armor consisting of osteoderms arranged in transverse rows across the body, often supplemented by lateral spines. Some ankylosaurs, particularly ankylosaurids, possessed a massive bony tail club used for defense. The clade includes Ankylosauridae and Nodosauridae.
    taxonomy:
      - Life
      - Animalia
      - Chordata
      - Vertebrata
      - Sarcopterygii
      - Tetrapoda
      - Reptilia
      - Archosauria
      - Dinosauria
      - Ornithischia
      - Thyreophora
      - Ankylosauria
    described: 1923
    authors: Osborn
    diagnostic_features:
      - Extensive dermal armor covering the dorsal surface and flanks
      - Low, wide body plan with short, robust limbs
      - Fused osteoderms on the skull forming a solid cranial shield
      - Tail club present in Ankylosauridae (modified distal caudal vertebrae and osteoderms)
      - Laterally projecting cervical or shoulder spines in many taxa
      - Secondary palate present
    references:
      - id: Osborn1923
        authors: Osborn, H.F.
        year: 1923
        title: Two Lower Cretaceous dinosaurs of Mongolia
        journal: American Museum Novitates
        volume: "95"
        pages: 1-10
  Ankylosauridae:
    description: Ankylosauridae is a family of armored dinosaurs within Ankylosauria, and is the sister group to Nodosauridae. The oldest known ankylosaurids date to around 122 million years ago, and the clade went extinct 66 million years ago during the Cretaceous–Paleogene extinction event. These animals were mainly herbivorous and were obligate quadrupeds, with leaf-shaped teeth and robust, scute-covered bodies. Ankylosaurids possess a distinctly domed and short snout, wedge-shaped osteoderms on their skull, scutes along their torso, and a tail club.
    taxonomy:
