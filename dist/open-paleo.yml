  Ankylosaurinae:
    description: Ankylosaurinae is a subfamily of ankylosaurid dinosaurs, existing from the Early Cretaceous about 105 million years ago until the end of the Late Cretaceous, about 66 mya. Many genera are included in the clade, such as Ankylosaurus, Pinacosaurus, Euoplocephalus, and Saichania.
