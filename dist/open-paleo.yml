  Diplodocus:
    genus: Diplodocus
    parent: Diplodocidae
    etymology: double beam
    description: |
      A genus of diplodocid sauropod dinosaur from the Late Jurassic of western North America. Diplodocus is among the most easily identifiable dinosaurs, with its classic sauropod shape of a long neck and tail, with four sturdy legs. It was one of the longer dinosaurs, with some species reaching over 25 metres in length.
