  Hadrosauridae:
    description: |
      Hadrosauridae is a family of large ornithopod dinosaurs commonly known as duck-billed dinosaurs. Hadrosaurs were the most diverse and abundant large herbivorous dinosaurs of the Late Cretaceous, with a global distribution. They are characterized by highly specialized dental batteries consisting of hundreds of closely packed teeth forming a continuous grinding surface, broad and flat edentulous premaxillary bills, and in the subfamily Lambeosaurinae, elaborate hollow cranial crests likely used for vocalization and display. Hadrosaurs include the two major subgroups Hadrosaurinae (flat-headed forms) and Lambeosaurinae (crested forms).
    taxonomy:
      - Life
      - Animalia
      - Chordata
      - Vertebrata
      - Sarcopterygii
      - Tetrapoda
      - Reptilia
      - Archosauria
      - Dinosauria
      - Ornithischia
      - Cerapoda
      - Ornithopoda
      - Ankylopollexia
      - Styracosterna
      - Hadrosauriformes
      - Hadrosauridae
    described: 1869
    authors: Cope
    diagnostic_features:
      - Highly specialized dental batteries with hundreds of interlocking teeth
      - Broad, spatulate, edentulous premaxillary bill
      - Hollow cranial crests in Lambeosaurinae (extensions of nasal passages)
      - Complete loss of the thumb spike
      - Extensive ossified tendons forming a lattice along the vertebral column
      - Hoof-like unguals on weight-bearing digits
    references:
      - id: Cope1869
        authors: Cope, E.D.
        year: 1869
        title: Synopsis of the extinct Batrachia, Reptilia, and Aves of North America
        journal: Transactions of the American Philosophical Society
        volume: "14"
        pages: 1-252
  Hadrosauriformes:
    description: |
      Hadrosauriformes is a clade of styracosternan ornithopod dinosaurs that includes the hadrosaurs (duck-billed dinosaurs) and their immediate relatives such as Iguanodon. Hadrosauriforms are characterized by well- developed dental batteries consisting of multiple stacked replacement teeth, broad and flattened snouts (often described as duck-billed), and large body size. The clade was globally distributed during the Cretaceous period and represents one of the most successful ornithischian radiations.
    taxonomy:
      - Life
      - Animalia
      - Chordata
      - Vertebrata
      - Sarcopterygii
      - Tetrapoda
      - Reptilia
      - Archosauria
      - Dinosauria
      - Ornithischia
      - Cerapoda
      - Ornithopoda
      - Ankylopollexia
      - Styracosterna
      - Hadrosauriformes
    described: 1997
    authors: Sereno
    diagnostic_features:
      - Well-developed dental battery with multiple replacement teeth in each tooth position
      - Broad, flattened premaxilla forming a duck-like bill
      - Reduced or absent thumb spike compared to basal styracosternans
      - Elongate and dorsoventrally flattened rostrum
      - Three or more replacement teeth per tooth family
