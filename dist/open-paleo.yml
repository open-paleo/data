  Yehuecauhceratops:
    genus: Yehuecauhceratops
    parent: Nasutoceratopsini
    etymology: ancient horned face
    description: Yehuecauhceratops is a genus of horned centrosaurine ceratopsid dinosaur from the Late Cretaceous of Coahuila, Mexico. It contains a single species, Y. mudei, described from two partial specimens by Rivera-Sylva et al. in 2016 and formally named by Rivera-Sylva et al. in 2017. It was a small centrosaurine with a body length of 3 metres (9.8 ft), making it smaller than Agujaceratops and Coahuilaceratops, the other two ceratopsids in its environment; the three may have been ecologically segregated. A ridge bearing a single roughened projection near the bottom of the squamosal bone, which probably supported a small horn, allows Yehuecauhceratops to be distinguished from other centrosaurines. Its affinities to nasutoceratopsin centrosaurines, such as Avaceratops and Nasutoceratops, are supported by various morphological similarities to the former.
