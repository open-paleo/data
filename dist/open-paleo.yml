    description: |
      Tapinocephalidae is a family of large herbivorous dinocephalians from the Middle Permian Karoo Basin of South Africa. Members are characterized by massive, heavily built bodies and distinctively thickened cranial roofs. Tapinocephalids were among the largest land animals of their time and are divided into the subfamilies Tapinocephalinae and Struthiocephalinae.
