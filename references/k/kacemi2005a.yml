id: kacemi2005a
authors: "Kacemi, A."
year: 2005
title: Cartographie et dynamique sédimentaire de la série fin Dogger – début
  Crétacé (Djara – Rhoundjaïa) des Monts des Ksour (Atlas saharien, Algérie)
  [Mapping and sedimentary dynamics of the late Dogger to early Cretaceous
  series (Djara to Rhoundjaïa) of the Ksour Mountains, Saharan Atlas, Algeria]
publisher: Université d'Oran, Oran, Algeria
notes: >
  Unpublished Mémoire de Magistère in Sciences de la Terre. The source of the
  unit-by-unit equivalence scheme for the Ksour Mountains that later work
  follows, in which the Djara Formation spans the Lower Bathonian to the
  Callovian-Oxfordian and the Aïssa Formation above it is
  Kimmeridgian-Portlandian.
