id: powell1986a
authors: Powell, J. E.
year: 1986
title: Revisión de los titanosáuridos de América del Sur
publisher: Universidad Nacional de Tucumán, Tucumán, Argentina
notes: >
  Unpublished doctoral thesis, 493 pp., as cited in Powell's own 2003 revision
  of it. The two are separate works: this thesis is in Spanish, while the
  revision published on it, Powell (2003), is in English. The thesis is
  retained here because the literature cites it as the first mention of several
  names, which as a thesis it did not make available.
