authors: "Dawson, G. M."
year: 1883
title: "Preliminary report on the geology of the Bow and Belly rivers region, North-west Territory, with special reference to coal deposits"
journal: "Geological and Natural History Survey and Museum of Canada, Report of Progress, 1880–82"
issue: "pt. B"
pages: "1–23"
notes: >-
  Issued twice: as a separate pamphlet, "Preliminary Note on the Geology of the Bow and Belly River
  Districts, N. W. Territory, with special reference to the coal deposits" (Montreal, Dawson
  Brothers, 1882, pp. 1-19), and in the Geological and Natural History Survey and Museum of
  Canada's Report of Progress for 1880-82, part B, pages 1-23. This record follows the Report of
  Progress printing, which is the form the literature on the Belly River beds cites.
