id: liu1997a
authors: "Liu, Y. G."
year: 1997
title: The Lithostratigraphy of Jiangxi Province
publisher: China University of Geosciences Press, Wuhan, China
notes: >
  The authority for subdividing the Upper Cretaceous of the Ganzhou Basin into
  the Ganzhou and Guifeng groups, and for equating the Guifeng Group with the
  Nanxiong Formation. One volume of a provincial lithostratigraphy series, and
  the works citing it do not agree on how to render it: this record follows Jin
  and colleagues (2022), while Zhu and colleagues (2024) give the author as Liu
  GY and the title as "Petrostratigraphy in Jiangxi province". Both give the
  same year and publisher. The companion Sichuan volume is cited in three
  further forms elsewhere, so the variation is the series', not this volume's.
  Neither form has been checked against the book.
