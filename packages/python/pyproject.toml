[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "open-paleo"
# Placeholder: the staging script sets the version from schema_version.
version = "0.0.0"
description = "Pydantic models and JSON Schema for the Open Paleo dataset"
readme = "README.md"
license = "CC-BY-4.0"
license-files = ["LICENSE"]
authors = [{ name = "Open Paleo contributors" }]
requires-python = ">=3.9"
# A range, not an exact pin: a library pinning pydantic would conflict with
# every project that installs it. 2.10 is the first release that does not warn
# about the model_plate_id field.
dependencies = ["pydantic>=2.10,<3"]
keywords = ["paleontology", "dinosaurs", "phylogeny", "dataset", "json-schema", "pydantic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/open-paleo/data"
Repository = "https://github.com/open-paleo/data"
Issues = "https://github.com/open-paleo/data/issues"
Changelog = "https://github.com/open-paleo/data/blob/main/CHANGELOG.md"

# The package is staged under scratch/, which the repository's .gitignore
# excludes; without ignore-vcs, hatchling would leave every file out.
[tool.hatch.build]
ignore-vcs = true

[tool.hatch.build.targets.wheel]
packages = ["src/open_paleo"]
