# Stratigraphic unit registry. Keyed by unit name; where two units share one,
# the key takes a country suffix in parentheses to separate them.
#
# Curated from primary literature, never mined. Every claim cites the paper it
# was read from, and quotation marks mean that paper's own words. A rank or an
# age inferred from phrasing is a guess, not a source.
#
# Quotations are the source's wording. Where a paper carries an outright
# typographical error -- "Masstrichitian", "its lower potion" -- the quotation
# silently corrects it; nothing that changes a claim is ever altered silently.
# A paper not written in English is quoted in English translation.
#
#   rank       supergroup | group | subgroup | formation | member | bed.
#              Omitted when no source states one; absence is not a claim.
#   informal   true when the unit is established informally, at whatever rank
#   parent     the containing unit. Containment is stored only on the child;
#              the inverse is derived, never written down.
#   variants   alternate and legacy names a paper prints for this unit. Not
#              rank words, not spellings, not rank claims.
#   period     required. The epoch(s) the unit spans, oldest first: named by
#              a source, or else the epochs of `stages`, or else the parent's.
#   stages     the stages the unit spans, oldest first and contiguous. Refines
#              `period`; absent means no source gives a stage, never undated.
#              Both are the union of what sources publish, a bound for checking
#              records against rather than a choice between readings.
#   dispute    { summary, history } as on genera, for what the literature
#              genuinely disagrees on: rank, naming, containment.
#   references [{ id, notes }] pointing at references/ store entries.
#
# How each field is filled is set out in CONTRIBUTING.md, under
# Stratigraphic Registry.

"83":
  rank: bed
  informal: true
  parent: Süntel
  period: [Late Jurassic]
  stages: [Kimmeridgian]
  references:
    - id: evers2020a
      notes: >
        Corrects which bed of the Langenberg quarry section the vertebrates come
        from: after the subdivision of Fischer (1991), "most of the terrestrial
        vertebrate remains (including the sauropod dinosaur Europasaurus
        holgeri and all theropod bones) were found in bed 83, not in bed 93 as
        erroneously stated in some publications". A light grey-greenish marly
        limestone assigned to the "Mittleres Kimmeridge", "a northwest-German
        equivalent to the lower part of the upper Kimmeridgian". The bone-rich
        sections are 30 to 50 cm thick.
    - id: sander2006a
      notes: >
        Carries the superseded number, giving the Europasaurus horizon as "Late
        Jurassic, middle Kimmeridgian marine carbonate rock, bed 93 of section
        at Langenberg quarry".
    - id: zuo2017a
      notes: >
        Places the Kimmeridgian of the Langenberg section in the Süntel
        Formation: ostracod zones 9 to 12 of that section correspond to the
        Lower Süntel Formation.
    - id: fischer1991a

Abajo Shale:
  rank: member
  parent: Aguja
  period: [Late Cretaceous]
  stages: [Campanian]
  references:
    - id: lehman2024a
      notes: >
        The dedicated stratigraphy of the Campanian Aguja Formation of West
        Texas, which designates a type section for the member in the
        southwestern foothills of Rattlesnake Mountain. Dark gray and olive
        carbonaceous mudstone with lignite and coal near the base, recessive
        and slope-forming, 70 to nearly 100 m thick in the western outcrop belt
        and thinning eastward, and divisible into three units where thickest.
        It sits above the La Basa Sandstone Member and below the Rattlesnake
        Mountain Sandstone Member.
    - id: beveridge2022a
      notes: >
        Dates the member under its earlier informal name, comparing the Last
        Chance Creek Member fauna of the Wahweap Formation with that of the
        "early Campanian Lower Shale Member of the Aguja Formation".

Adamantina:
  rank: formation
  parent: Bauru
  period: [Late Cretaceous]
  stages: [Turonian, Coniacian, Santonian, Campanian, Maastrichtian]
  dispute:
    summary: >
      The age is read two ways, a whole epoch apart at the older end. Santucci
      and colleagues (2022) give "Adamantina Formation, Campanian-early
      Maastrichtian"; Machado and colleagues (2013) give "Adamantina Formation
      (Turonian-Santonian".
  references:
    - id: dias-brito2001a
      notes: >
        Dates the unit by charophytes and ostracods rather than by vertebrates.
        "Chara" barbosai and Ilyocypris cf. riograndensis from this formation
        are Turonian-Santonian, against a Maastrichtian assemblage in the Ponte
        Alta Member of the Marilia Formation above, the two separated by a
        hiatus of more than 11 Ma. Places the top of the formation at a sequence
        boundary, "the Adamantina Formation (Turonian-Santonian)".
    - id: santucci2022a
      notes: >
        Gives the younger reading and places it in the Bauru Group: "Bauru Group
        (Upper Cretaceous), Adamantina Formation, Campanian–early
        Maastrichtian", following Batezelli (2017) and Dias and colleagues
        (2020), and repeats it for the Presidente Prudente locality as
        "Adamantina Formation (=Presidente Prudente Formation), Campanian–early
        Maastrichtian".
    - id: machado2013a
      notes: >
        In the abstract the unit is the "Adamantina Formation
        (Turonian-Santonian, Bauru Basin)"; the introduction calls it "the Late
        Cretaceous Adamantina Formation whose age is disputed, being regarded as
        Turonian-Santonian ... or Campanian-Maastrichtian", following Dias Brito
        and colleagues (2001) for the older age and Gobbo Rodrigues and
        colleagues (1999) for the younger.
    - id: cavalcanti2026a
      notes: >
        Keeps the name in current use, listing it among the four formations into
        which "the Bauru Group is divided".
    - id: batezelli2015a
      notes: >
        Relays the younger of the two ostracod readings: Gobbo-Rodrigues (2001)
        identified five named ostracod species "in the Adamantina and Marilia
        formations", and "according to this author, the fossil assemblage can
        be compared to the Neuquen (Argentina) and Republic of Congo
        assemblages, with Campanian-Maastrichtian ages". Worth reading beside
        the Turonian-Santonian that Dias-Brito and colleagues published the
        same year, also on ostracods: the disagreement on this entry is not two
        kinds of evidence competing but one kind, contemporaneous, split four
        stages apart.
    - id: dias2020a
      notes: >
        Gives this formation no stage of its own: its one Campanian belongs to
        the Uberaba, "considered to have been deposited in the Campanian, based
        on lithostratigraphic relationships with the Adamantina and Marilia
        formations", and its one Maastrichtian to the Marilia, "the youngest
        among the Cretaceous formations of the region". What it supplies is a
        floor, relayed: "Castro et al. (2018) dated the youngest detrital
        zircon grain of the basal section of the Adamantina Formation at 87.78
        plus or minus 0.06 Ma (CA-ID-TIMS), giving the maximum depositional age
        for Adamantina Formation in the Triangulo Mineiro region." A maximum
        depositional age bounds only the old end, this one is scoped to the
        basal section in one region, and it is not this paper's own result.
        Also records the alternative name, the Adamantina being the "Vale do
        Rio do Peixe Formation in Paula e Silva et al., 2009".

Agua de la Peña:
  rank: group
  period: [Late Triassic, Early Jurassic]
  stages: [Norian, Rhaetian]
  references:
    - id: ezcurra2010a
      notes: >
        The Ischigualasto Formation crops out in the San Juan and La Rioja
        provinces of northwestern Argentina "as part of the Agua de la Peña
        Group of the Ischigualasto-Villa Unión Basin", a containment credited to
        Bossi (1971), and lies between the Los Rastros Formation below and the
        Los Colorados Formation above. A locality map of the group's
        southeastern outcrop covers both provinces.
    - id: arcucci2003a
      notes: >
        Places the Los Colorados Formation as "the upper part of the Agua de la
        Peña Group in the Ischigualasto-Villa Union Basin in western
        Argentina".
    - id: ezcurra2007b
      notes: >
        Gives the same containment for the Zupaysaurus horizon, "Los Colorados
        Formation (Norian ...), Agua de la Peña Group (La Esquina Fauna), in
        the Ischigualasto-Villa Unión Basin".

Aguja:
  rank: formation
  period: [Late Cretaceous]
  stages: [Campanian, Maastrichtian]
  references:
    - id: lehman2024a
      notes: >
        The formation preserves deposits that "accumulated along the western
        shoreline of the Cretaceous Western Interior Seaway in the Big Bend
        region of Texas during Campanian time", but the post-pyroclastic
        interval in the uppermost Alto Shale, recording "renewed sedimentation
        at the end of Aguja deposition", "likely extends into early
        Maastrichtian time".
    - id: prieto-márquez2019b
      notes: >
        Independently gives "Aguja Formation (lower Campanian".
    - id: befus2008a
      notes: >
        The Peña Mountain pyroclastic deposits lie "within Upper Cretaceous
        floodplain deposits in the Aguja Formation"; the lower part of the upper
        shale member "contains a diverse assemblage of fossil mammals and
        reptiles (including dinosaurs) that indicate a Late Campanian age",
        while fossils are sparser in the upper part of that member, which "could
        extend into the Early Maastrichtian". The youngest concordant U-Pb
        analyses of zircon from three basaltic bombs yield "a weighted mean age
        of 76.9 ± 1.2 Ma, consistent with the presence of Late Campanian
        vertebrate fossils in the upper Aguja Formation".

Alagteeg:
  rank: formation
  period: [Late Cretaceous]
  stages: [Campanian]
  references:
    - id: averianov2020a
      notes: >
        Gives the Abdarainurus type horizon as "Alagteeg Formation, Upper
        Cretaceous" and describes the lithology -- "red-brown sandstone with
        gravel intercalated with grey sandstone and siltstone", fluvial, near
        the bottom of the section -- but states the limit: "The geological age
        of the Alagteeg Formation is not well constrained".
    - id: averianov2021b
      notes: >
        Places Abdarainurus barsboldi in "the Campanian(?) Alagteeg Formation of
        Mongolia", with the stage queried.

Alcobaça:
  rank: formation
  period: [Late Jurassic]
  stages: [Oxfordian, Kimmeridgian, Tithonian]
  references:
    - id: schneider2009a
      notes: >
        Dates the unit twice and not consistently: "The Alcobaca formation can
        be placed in the latest Late Oxfordian to Late Kimmeridgian" in one
        place, and "the earliest Kimmeridgian to Early Tithonian Alcobaca
        formation" in another. One range ends where the other begins, so the
        paper supports the Oxfordian through Tithonian span without settling
        where inside it the unit sits.
    - id: mateus2017a
      notes: >
        Gives "the upper Kimmeridgian shallow-marine to deltaic Alcobaça
        Formation, which underlies the Lourinhã Formation", and treats the two
        as "the units that contain the most vertebrate remains" in the
        Lusitanian Basin.

Alcântara:
  rank: formation
  period: [Late Cretaceous]
  stages: [Cenomanian]
  references:
    - id: kellner2011b
      notes: >
        The Laje do Coringa rocks on Cajual Island, which yielded the Oxalaia
        holotype, "belong to the Alcântara Formation, Itapecuru Group of the São
        Luís Basin whose age is regarded as Cenomanian (Late Cretaceous)", on
        Góes and Rossetti's authority. The paper's title carries the same date,
        "the Cretaceous (Cenomanian) Alcântara Formation".
    - id: bittencourt2011a
      notes: >
        Within the Itapecuru Group the Alcântara Formation was "deposited during
        the early Cenomanian in an estuarine environment", while the Albian
        belongs to the "Undifferentiated Unit" beneath it and the unit above
        runs from the Late Cretaceous into the Paleocene. Bittencourt and Langer
        follow Rossetti here, and treat the informal "Itapecuru Formation" of
        the Itapecuru-Mirim region as roughly the same rocks as that
        Undifferentiated Unit, which matters because the two are the source of
        the formation's dinosaur records at Ilha do Cajual and Praia da Baronesa
        on the one hand and Coroatá and Mata on the other.
    - id: lindoso2019a
      notes: >
        The type horizon of Itapeuasaurus cajapioensis is the "Alcântara
        Formation, São Luís Basin, lower Upper Cretaceous (Cenomanian)", and the
        Laje do Coringa bone bed at Cajual Island "records the Alcântara
        Formation (lower Cenomanian)". Lindoso and colleagues keep the Albian
        for the underlying Itapecuru Formation and the undifferentiated unit,
        which they call lower-middle Albian.
    - id: sales2017a
      notes: >
        Gives "the Alcântara Formation (Cenomanian, São Luís-Grajaú Basin)" and
        says what the age rests on: "due to its macrofossil and palynological
        content, the Alcântara Formation is usually regarded as the Cenomanian
        strata" of that basin.
    - id: bandeira2024a
      notes: >
        Tabulates it as "Albian - Cenomanian".

Alemoa:
  rank: member
  parent: Santa Maria
  period: [Late Triassic]
  stages: [Carnian]
  references:
    - id: marsola2018a
      notes: >
        Nhandumirim waldsangae comes from "the upper levels of the Alemoa Member
        of the Santa Maria Formation, 1-1.5 m below the contact with the
        overlying Caturrita Formation" at the Waldsanga, or Cerro da Alemoa,
        site in urban Santa Maria. Following da Rosa, Marsola and colleagues
        describe the member as exposed there in lower, intermediate and upper
        levels, the first two distal floodplain deposits and the third a
        proximal floodplain, and relate the site to the Hyperodapedon Assemblage
        Zone of the Candelária Sequence on the strength of its rhynchosaurs.
        Correlation with the Ischigualasto Formation makes that zone "late
        Carnian in age", an age they see corroborated by detrital dating of the
        mudstones at the Saturnalia tupiniquim level, "which has yielded a
        maximum age of ca. 233 Ma".
    - id: darosa2005a
      notes: >
        Pelites of the Alemoa Member are one of the two Mesozoic units da Rosa
        and Faccini use to map post-depositional faulting across central Rio
        Grande do Sul, and the contact they trace with the overlying Caturrita
        Formation shifts from one structural block to the next: about 90 m
        across the Vacacaí Mirim lineament, where it sits at 120 m northeast of
        Santa Maria and at 210 m in the São João do Polêsine block, and at least
        20 m across the Rio Botucaraí lineament. They caution that "The
        determination of the contact between the Alemoa Member and the Caturrita
        Formation is not secure, due to its recurrent character", and in the
        Candelária region they record the member carrying the Therapsida
        Cenozone at Sanga de Pinheiros and the Rhynchosauria Cenozone in the
        Cipriano region. The paper dates the deposits it maps only as Middle to
        Late Triassic, taking the Rosário do Sul Group as a whole.
    - id: langer2018a
      notes: >
        Cerro da Alemoa, in the eastern outskirts of Santa Maria, is "the
        type-section of the Alemoa Member of the Santa Maria Formation (Andreis
        et al., 1980), with a 20 meters-thick sequence of massive reddish
        mudstones, intercalated with fine sandstones", its most distinctive
        feature the calcareous concretions that locally form crusts of
        restricted lateral extent. Langer and colleagues sampled that section
        for U-Pb geochronology, from material that "represents the typical
        Alemoa Member mudstone and comes from 5 m below its top", and report the
        resulting 233.23 Ma weighted mean as a maximum depositional age for the
        Santa Maria Formation at the site; fossils in the upper 10 m are better
        preserved than those below, which calcitic cementation has distorted.
    - id: bittencourt2009a
      notes: >
        Gives "Alemoa Member of the Santa Maria Formation (Carnian".
    - id: cabreira2016a
      notes: >
        Places it in its wider framework: "Alemoa Member, Santa Maria Formation;
        Candelária Sequence, Paraná Basin ...; Hyperodapedon Assemblage Zone,
        Carnian, Late Triassic".

Allaru Mudstone:
  rank: formation
  period: [Early Cretaceous]
  stages: [Albian]
  references:
    - id: poropat2017a
      notes: >
        Places it above the Toolebuc and dates both: rare sauropod specimens
        come from "the Toolebuc Formation and the Allaru Mudstone, both of which
        constitute upper Albian marine ... deposits".
    - id: leahey2015a
      notes: >
        Records a recalibration: U-Pb dating of detrital zircons in the Rolling
        Downs Group "suggests that some of the palynomorph zones may need to be
        temporally recalibrated, with the deposition of the Allaru Mudstone
        restricted to the upper Albian".
    - id: bell2018a
      notes: >
        Places it below the Mackunda, Muttaburrasaurus sp. coming "from the
        underlying Allaru Mudstone" while the M. langdoni holotype "comes from
        the Mackunda Formation (late Albian-early Cenomanian)".

Allen:
  rank: formation
  period: [Late Cretaceous]
  stages: [Campanian, Maastrichtian]
  references:
    - id: coria2012a
      notes: >
        Gives "Allen Formation, Late Campanian/Early Maastrichtian".
    - id: bandeira2024a
      notes: >
        Independently tabulates it as "Allen Formation | Campanian -
        Maastrichtian".
    - id: powell2003a
      notes: >
        Places the lower member, source of the Cinco Saltos and Lago Pellegrini
        titanosaurs, in the "Late Cretaceous, Early Maastrichtian", following
        Ballent (1980), and reports that Uliana and Dellape (1981) "have
        estimated for this formation a Campanian-Maastrichtian age".
    - id: uliana1981a
    - id: ballent1980a
      notes: >
        A brackish-water ostracod fauna from a whitish-gray fossiliferous
        limestone near Lago Pellegrini, immediately below about 10 m of
        saccharoidal gypsum: "The microfauna is assigned to the Upper Cretaceous
        (Lower Maastrichtian)." "For the present association from the uppermost
        part of the Allen Formation, an age of lower Maastrichtian is
        suggested."

Allison:
  rank: member
  parent: Menefee
  period: [Late Cretaceous]
  stages: [Campanian]
  references:
    - id: dalman2021a
      notes: >
        Gives "Allison Member of the Menefee Formation (Upper Cretaceous, early
        Campanian".
    - id: mcdonald2021a
      notes: >
        Places it in section and gives the later reading: "Allison Member,
        Menefee Formation, approximately 120 meters below the overlying Cliff
        House Sandstone; middle Campanian".

Altmühltal:
  rank: formation
  period: [Late Jurassic]
  stages: [Kimmeridgian, Tithonian]
  references:
    - id: foth2025a
      notes: >
        Gives the age and the position in the Bavarian succession: Archaeopteryx
        "is only known from the lower Tithonian of Bavaria, Germany, with nine
        out of eleven specimens ... unearthed from the Altmühltal Formation",
        the Mörnsheim Formation overlies it, and the Painten Formation below it
        reaches the Kimmeridgian-Tithonian boundary.
    - id: pittman2020a
      notes: >
        Equates the formation with the traditional name, tabulating
        Archaeopteryx horizons as "Solnhofen Limestone (Altmühltal Formation)"
        and dating them 152.1 to 148 Ma; its table of European occurrences gives
        the same unit as "Late Jurassic" and "Tithonian". Entered under both
        names, since both are in use.

Alto Shale:
  rank: member
  parent: Aguja
  period: [Late Cretaceous]
  stages: [Campanian, Maastrichtian]
  references:
    - id: lehman2024a
      notes: >
        The dedicated Aguja stratigraphy, which gives the rank and the parent: a
        progradational deltaic succession "includes the upper part of the
        McKinney Springs Tongue, Terlingua Creek Sandstone Member of the Aguja
        Formation, and lower part of the Alto Shale Member of the Aguja
        Formation". Gives no stage for the member itself; the drainage change
        evident in its upper part "persisted through Maastrichtian time during
        deposition of the Javelina Formation", which is the unit above.
    - id: lehman2019a
      notes: >
        The member's vertebrate fauna, under the informal name "upper shale
        member", "has been collected almost exclusively from levels well below
        the pyroclastic deposits, and so must have an age between 80 and 77 Ma
        (middle Campanian)". The pyroclastic deposits in the uppermost part of
        the member yield U/Pb ages from "c. 77 Ma", after Befus and colleagues
        (2008), to "c. 73 Ma", after Breyer and colleagues (2007).
    - id: befus2008a
      notes: >
        Dates the pyroclastic deposits inside the member by U-Pb, a weighted
        mean of 76.9 plus or minus 1.2 Ma across three basaltic bombs,
        "consistent with the presence of Late Campanian vertebrate fossils in
        the upper Aguja Formation". Its summary reading is "a Late Campanian
        (to possibly Early Maastrichtian) age for the pyroclastic deposits",
        and the Maastrichtian is hedged and confined to the top: fossils are
        "generally less abundant and diagnostic in the upper part of the upper
        shale member ... and that part of the member could extend into the
        Early Maastrichtian". Uses Lehman's informal name throughout and never
        the formal one, so a search on the member's name returns nothing from
        a paper that discusses it at length.
    - id: breyer2007a
      notes: >
        Gives a weighted mean concordia age of 72.6 plus or minus 1.5 Ma on
        zircons from a basaltic block. Its own independent constraint is a
        maximum rather than an age: a normal fault juxtaposes the Javelina
        Formation in the hanging wall against the pyroclastic rocks,
        "indicating the pyroclastic strata must be Maastrichtian or older". The
        "Upper Campanian/Lower Maastrichtian" it gives for the member is
        attributed in the same sentence to Lehman and is not its own. Also uses
        the informal name.
        Both this paper and Befus and colleagues calibrate against Ogg and
        colleagues (2004), "who place the upper boundary of the Campanian at
        70.6 plus or minus 0.6 Ma". Later timescales put that boundary at about
        72.1 Ma, so a determination that sat comfortably within the Campanian
        when published now straddles the boundary: the figure spans 71.1 to
        74.1 Ma at one sigma. The measurement is the datum and the stage name
        has moved beneath it, which is worth knowing before either number is
        read as a stage assignment.

Ambolafotsy:
  rank: formation
  informal: true
  period: [Late Cretaceous]
  stages: [Turonian]
  references:
    - id: farke2013a
      notes: >
        Names the unit and marks it informal: the section containing the
        Dahalokely site "is informally termed the ''Ambolafotsy Formation,''
        and is divided into lower, middle ... and upper units". Turonian, near
        Ampandriambengy in the Diego (Ambilobe) Basin of northernmost
        Madagascar, and dated by the marine deposits that bracket it rather
        than by fossils of its own.
    - id: rauhut2016b
      notes: >
        Independently calls it "the informally termed 'Ambolafotsy Formation'
        (Turonian) of northern Madagascar".

Ampthill Clay:
  rank: formation
  parent: Ancholme
  period: [Late Jurassic]
  stages: [Oxfordian]
  references:
    - id: maidment2020a
      notes: >
        Gives the age directly, contrasting Sarcolestes leedsi from "the
        Callovian Oxford Clay Formation" with Cryptosaurus eumerus from "the
        Oxfordian Ampthill Clay Formation".
    - id: barron2012a
      notes: >
        Gives the containment: north of Oxford the marine mudstone succession
        above the Great Oolite Group "is divided in ascending order the
        Kellaways, Oxford Clay, West Walton, Ampthill Clay and Kimmeridge Clay
        formations, which are assembled into the ... Ancholme Group".
    - id: naish2007a
      notes: >
        Records it as dinosaur-bearing, "The overlying Ampthill Clay of the
        Midlands has also yielded dinosaurs".

Anacleto:
  rank: formation
  parent: Neuquén
  period: [Late Cretaceous]
  stages: [Coniacian, Santonian, Campanian]
  references:
    - id: santucci2022a
      notes: >
        Gives "Anacleto Formation (lower-middle Campanian".
    - id: gianechini2015a
      notes: >
        Independently gives the "Upper Cretaceous (Anacleto Formation, lower
        Campanian".
    - id: martinelli2004a
      notes: >
        Lists "Anacleto (Santonian; Neuquén Province" among the Patagonian
        formations with carcharodontosaurid remains, citing Alcober and
        colleagues (1998).
    - id: alcober1998a
      notes: >
        A conference abstract, on a page carrying several, and it does not name
        this unit. It reports "Exposures of the Late Cretaceous (ca.
        Cenomanian) Rio Colorado Formation in Mendoza Province", so its age
        statement is far older than this entry's stages, is qualified by "ca.",
        attaches to a unit at a rank above this one, and concerns Mendoza
        rather than Neuquen. It should not be read as contradicting the entry.
    - id: garrido2010a
      notes: >
        Paleomagnetic work at Auca Mahuevo has the formation's lower deposits in
        a reversed-polarity interval correlated with C33R (83.5 to 79.5 Ma) and
        its upper levels in a normal-polarity interval correlated with C33N
        (79.5 to 74.5 Ma), so that "the age of the Fm. Anacleto would be
        situated in the Lower to Middle Campanian". Legarreta and Gulisano
        (1989) had given these deposits an age between 83 and 80 Ma, "situated
        within the Early Campanian".
    - id: legarreta1989a
    - id: coria1996a
      notes: >
        An older reading, and at member rank: the type horizon of Gasparinisaura
        cincosaltensis at Cinco Saltos is "Rio Colorado Formation, Anacleto
        Member, Upper Cretaceous: Coniacian-Santonian", following Cruz and
        colleagues (1989), Legarreta and Gulisano (1989) and Bonaparte (1991).

Ancholme:
  rank: group
  period: [Middle Jurassic, Late Jurassic, Early Cretaceous]
  stages: [Callovian, Oxfordian, Kimmeridgian, Tithonian, Berriasian]
  references:
    - id: barron2012a
      notes: >
        Names the group and its constituent formations north of Oxford, the
        Kellaways, Oxford Clay, West Walton, Ampthill Clay and Kimmeridge Clay
        in ascending order, and gives the span as Callovian to Kimmeridgian.
        Records that the group and the Corallian Group "are mutually exclusive
        in geographical range".

Andakhuduk:
  rank: formation
  variants: [Andaikhudag, Andakhudag]
  period: [Early Cretaceous]
  stages: [Hauterivian, Barremian, Aptian]
  references:
    - id: khand2000a
      notes: >
        "This fossil assemblage suggests the Hauterivian-Barremian age" for the
        150-700 m of bituminous paper shale, siltstone and aleurite, which the
        paper equates with the "Ondai Sayr by Berkey and Morris" (1927) and
        places above the Undurukhaa Formation and below the Khulsangol. Sinitsa
        (1993) is reported as referring the same formation in seven Valley of
        Lakes depressions to the Upper Jurassic, an assignment the authors
        neither adopt nor reject.
    - id: napoli2019a
      notes: >
        Gives the assignment and the age for the Ondai Sayr locality in the
        Tsaagan Nor basin of central Mongolia, which "has also been considered
        the Andakhuduk Formation", the age "generally considered to be
        Barremian".
    - id: jerzykiewicz1991a
      notes: >
        Characterizes it as the offshore lacustrine facies of the Gobi Basin,
        beneath the Khulsyngol (or Dushilin) Formation. Weighs two datings and
        takes the younger: "Although abundant molluscan and ostracod fossils
        have been cited as evidence of a Barremian to Hauterivian age ..., an
        Aptian age, suggested by similarities in plant megafossils to dated
        remains in eastern Siberia ..., is accepted here."

Anembalemba:
  rank: member
  parent: Maevarano
  period: [Late Cretaceous]
  stages: [Maastrichtian]
  references:
    - id: krause2007a
      notes: >
        The member is 10 to 15 m thick and yielded the vast majority of the
        Majungasaurus crenatissimus specimens collected by the Mahajanga Basin
        Project, though "some specimens (primarily isolated teeth) were also
        found in the Mesorobe and Miadana members". It "preserves sediments
        deposited during flooding events between crystalline highlands to the
        east and the Mozambique Channel to the west in a lowland floodplain
        setting reflective of a highly seasonal, semiarid climate".
    - id: carrano2008a
      notes: >
        Hedges the older bound, "Anembalemba Member, Maevarano Formation; ?upper
        Campanian-Maastrichtian, Late Cretaceous".
    - id: carrano2012a
      notes: >
        Gives the narrower "Anembalemba Member, Maevarano Formation;
        Maastrichtian".

Angostura Colorada:
  rank: formation
  period: [Late Cretaceous]
  stages: [Campanian, Maastrichtian]
  references:
    - id: leanza2004a
      notes: >
        Leanza and colleagues place the Angostura Colorada Formation among "the
        equivalent units in north-eastern Patagonia" and admit its taxa to their
        Allenian tetrapod assemblage because it and the Los Alamitos Formation
        "represent similar environments, age and faunas" as the Allen Formation,
        the Neuquén Basin's own carrier of that assemblage. From it they list
        Aeolosaurus sp. and related titanosaurs, and hadrosaurids including
        Kritosaurus australis, common at Laguna Carri-Laufquen; they also report
        Hugo and Leanza's (2001a) correlation of the basal member of the Allen
        Formation with this unit. The Late Campanian-Early Maastrichtian age
        they print is the Allenian assemblage's and covers five formations at
        once, and they warn that "tetrapod assemblages cannot be used in order
        to determine the age of a certain stratigraphic unit".
    - id: santucci2022a
      notes: >
        Gives "Angostura Colorada Formation (Upper Cretaceous, late
        Campanian-early Maastrichtian)" for the Aeolosaurus rionegrinus type at
        Casa de Piedra, Estancia Maquinchao, Río Negro.
    - id: powell2003a
      notes: >
        Gives the same horizon for that type as "Late Cretaceous, Late
        Senonian", and for other Río Negro localities "Senonian probably
        Campanian-Maastrichtian", noting that one fossiliferous level has also
        been read as the Coli Toro Formation.

Anjiagou:
  rank: bed
  parent: Jianshangou
  period: [Early Cretaceous]
  references:
    - id: wang2016a
      notes: >
        Places it inside the Jianshangou Member, which "is divided into 4 units:
        the basal Dajianshanzi Bed, a shallow-water lacustrine unit with
        abundant mollusks and rooted zones; the Anjiagou Bed, the main
        tetrapod-bearing unit, consisting of microlaminated dark gray
        mudstones". Gives no stage for the bed.

Antlers:
  rank: formation
  parent: Trinity
  period: [Early Cretaceous]
  stages: [Aptian, Albian]
  references:
    - id: d'emic2012a
      notes: >
        Gives "Antlers Formation (Lower Cretaceous, Aptian-Albian". D'Emic
        (2013) records that it is laterally equivalent to the Twin Mountains
        Formation.
    - id: suarez2021a
      notes: >
        Places it within its group by state: in Oklahoma and adjacent Texas the
        Trinity Group "consists almost entirely of the Antlers Formation,
        although the Holly Creek Formation is present in extreme southeast
        McCurtain County".
    - id: d'emic2013a
      notes: >
        Gives the Sauroposeidon holotype horizon as "Early Cretaceous
        (Aptian–Albian) Antlers Formation of southern Oklahoma, USA", and
        describes the unit as "a lateral equivalent of the Trinity Group of
        Texas".

Arcillas de Morella:
  rank: formation
  period: [Early Cretaceous]
  stages: [Barremian, Aptian]
  references:
    - id: santos-cubedo2023a
      notes: >
        Gives "Arcillas de Morella Formation (late Barremian" and describes it
        as "a stratigraphic unit from the Lower Cretaceous (upper Barremian)".
    - id: mocho2023a
      notes: >
        Independently gives "Arcillas de Morella Formation (upper Barremian".
    - id: malafaia2020b
      notes: >
        Reports the earlier lower Aptian dating: the deposits "were interpreted
        as belonging to the lower Aptian based on geomagnetic polarity data" by
        Salas and colleagues (1995), but more recent ammonite, palynological and
        strontium isotope work "indicate that the Arcillas de Morella Fm. should
        be placed in the upper Barremian".
    - id: salas1995a

Argiles Rutilantes:
  rank: formation
  period: [Late Cretaceous]
  stages: [Campanian]
  dispute:
    summary: >
      This name and "Argiles et Grès à Reptiles" may be two names for one unit.
      Tabuce and colleagues (2013) describe the Aix-en-Provence Basin
      localities as sitting in "an argillite formation characterized by
      fluviatile deposits and lacustrine beds (historically named Lower
      'Argiles et Grès à Reptiles' Formation or Lower 'Argiles Rutilantes'
      Formation) dated from the Lower Rognacian, a local continental stage",
      and add that the Rognacian "has been equivocally proposed to be
      equivalent to the late Campanian-Maastrichtian period". Whether the two
      historical names denote one unit or two is not settled by the sources
      read.
  references:
    - id: tortosa2014a
      notes: >
        "Lower Argiles Rutilantes Formation, upper part of the Lower Rognacian,
        Late Campanian" for the Jas Neuf Sud locality near Pourrières, Var.
    - id: tabuce2013a
      notes: >
        Treats the name as one of two historical names for the same argillite
        formation, and dates it by the Lower Rognacian local stage rather than
        by an international one.

Argiles et Grès à Reptiles:
  rank: formation
  period: [Late Cretaceous]
  stages: [Campanian, Maastrichtian]
  dispute:
    summary: >
      Two problems at once. The name may be an alternative for the Argiles
      Rutilantes -- Tabuce and colleagues (2013) give both as historical names
      for a single argillite formation of the Lower Rognacian -- and separately,
      most of the papers describing taxa from these localities name no formation
      at all. Garcia and colleagues (2010), Díez Díaz and colleagues (2020) and
      Godefroit and colleagues (2017) all give only the "'Begudian' (local
      stage)" with a lithology, as does Allain and Taquet (2000) for La
      Boucharde. Díez Díaz and colleagues (2018) are the source that does name
      it: "This sequence occurs in the Argiles et Grès à Reptiles Formation
      (Aix-en-Provence Basin), which is upper Campanian."
  references:
    - id: díezdíaz2018a
      notes: >
        The one read source that states the formation: the Velaux-La Bastide
        Neuve locality "is considered to be upper Campanian (Argiles et Grès à
        Reptiles Formation, Aix-en-Provence Basin)".
    - id: tabuce2013a
      notes: >
        Pairs the name with Argiles Rutilantes as historical names for one
        formation, dated by the Lower Rognacian.
    - id: poropat2021a
      notes: >
        Tabulates the Atsinganosaurus velauciensis specimens MMS/VBN.09.41 and
        MMS/VBN.09.167 under the formation with an age spanning the Campanian
        and Maastrichtian, citing Díez Díaz and colleagues (2018).
    - id: garcia2010a
      notes: >
        Names no formation, which is why it is cited here through the locality
        rather than the unit. The Atsinganosaurus velauciensis type locality is
        "La Bastide Neuve, Velaux; Aix-en-Provence Basin, Bouches-du-Rhone,
        France", and the type horizon "Glauconitic grainstone limestone, Upper
        Campanian (Begudian continental local stage) based on charophytes ...
        and dinosaur eggshells according the local biostratigraphical
        context".
    - id: díezdíaz2020a
      notes: >
        Names no formation either. The Garrigatitan meridionalis type locality
        is "La Bastide Neuve, Velaux; Aix-en-Provence Basin, Bouches-du-Rhone,
        France" and the type horizon "'Begudian' (local stage) sandstones,
        upper Campanian, Upper Cretaceous", the holotype and paratype from
        "level B3 of sequence 2, and the referred material from level B2 of the
        same sequence".
    - id: godefroit2017a
      notes: >
        The third describing paper to give a local stage and no formation. The
        Matheronodon provincialis horizon and locality are "'Begudian' (local
        stage) sandstones, late Campanian, Late Cretaceous. Velaux-La Bastide
        Neuve, Aix-en-Provence Basin, Bouches-du-Rhone, southern France.
    - id: allain2000a
      notes: >
        Names neither a formation nor a local stage, and places its locality in
        a different basin from the other three: the Pyroraptor material comes
        from "new discoveries of Upper Campanian to Lower Maastrichtian
        dinosaur remains at La Boucharde locality in the Arc Basin of
        southeastern France". The unit assignment for this record therefore
        rests on the locality-to-basin chain rather than on anything this paper
        states.

Arlington:
  rank: member
  parent: Woodbine
  period: [Late Cretaceous]
  stages: [Cenomanian]
  references:
    - id: head1998a
      notes: >
        Fixes the age by the unit above: the member "is capped by the Tarrant
        Member of the Eagleford Group, which is within the Conlinoceras
        tarrantense zone, at the base of the middle Cenomanian. Therefore the
        Arlington Member is 95.78 ± 0.61 Ma, at youngest". Gives the age of the
        type locality within it as "Woodbine Formation, early Late Cretaceous,
        Mid-Cenomanian, 95 Ma". Mudstone with thin sandstones grading up to
        massive sandstone, with two lignitic layers.

Arnstadt:
  rank: formation
  period: [Late Triassic]
  stages: [Norian, Rhaetian]
  references:
    - id: sues2025a
      notes: >
        Records it as a correlative rather than a synonym: a type horizon is
        given as "Lower Stubensandstein (S1), Löwenstein Formation (equivalent
        of Arnstadt Formation), Middle Keuper Subgroup. Age: Late Triassic
        (Norian: Lacian)." Equivalence between two areas, as with Ifezouane and
        Gara Sbaa, so neither name is recorded as a variant of the other. Dates
        the upper part of the formation, which yielded Eudimorphodon teeth in
        Bitburg-Prüm, as "Upper Triassic (late Norian–Rhaetian)".

Arundel:
  rank: formation
  period: [Late Jurassic, Early Cretaceous]
  stages: [Hauterivian, Barremian, Aptian, Albian]
  references:
    - id: carrano2024a
      notes: >
        Gives the rank duality and the setting: "The Arundel Clay (or Arundel
        Formation) of the Potomac Group crops out intermittently in Maryland and
        the District of Columbia, and may persist in the subsurface in
        Virginia", and confirms Acrocanthosaurus in it, a taxon that "ranged
        across North America during Aptian–Albian time". Places the Dinosaur
        Park locality near Muirkirk in the "Arundel Clay, late Aptian, Lower
        Cretaceous", its palynoflora supporting "a late Aptian age for the
        vertebrate-bearing layer".
    - id: d'emic2013a
      notes: >
        Records that the unit's age was long misread: the first North American
        sauropod came from it and "was originally thought to be Late Jurassic in
        age".
    - id: hunt2018a
      notes: >
        Gives the age of its fauna as "the Early Cretaceous Arundel fauna
        (Albian-Aptian", citing Ostrom (1970) and Kirkland and colleagues (1998,
        2016).
    - id: ostrom1970a
      notes: >
        Dates this unit only relative to another, and the comparison runs
        against the entry's youngest stage. Comparing the Cloverly fauna with
        those of "the Arundel Formation of Maryland", the Glen Rose and the
        Wealden, it finds "at least partial contemporaneity of the Cloverly and
        Glen Rose Formations and a somewhat greater age for the Arundel and
        Wealden beds", the Cloverly itself being "probably Late Aptian and
        Early Albian". So the Arundel is placed older than a unit that is late
        Aptian to early Albian, which is a bound by comparison rather than a
        determination.
    - id: kirkland1998c
    - id: kirkland2016a
      notes: >
        About a different unit on another continent - the Cedar Mountain
        Formation of east-central Utah - and it never names this one. It
        contributes nothing to the entry.
    - id: farke2014a
      notes: >
        The unit's age is imprecisely known, but an early Albian age is "far
        more likely" than the Barremian–Aptian boundary age proposed by
        Chinnery-Allgeier and Kirkland (2010): "no data known to us place it
        anywhere near the Barremian–Aptian boundary". The neoceratopsian teeth
        from the Arundel Clay of Maryland are "believed to be early Albian".
    - id: hunt1995a
      notes: >
        Its two Pleurocoelus species, Pleurocoelus nanus and Pleurocoelus altus,
        are listed under "Arundel Fm." at stage "Haut/Bar" — Hauterivian to
        Barremian — in a global tabulation of Early Cretaceous sauropod
        occurrences.

Arén Sandstone:
  rank: formation
  period: [Late Cretaceous]
  stages: [Campanian, Maastrichtian]
  references:
    - id: csiki-sava2015a
      notes: >
        Gives the name and the span: the "shallow marine-deltaic Arén
        Sandstone" and the Tremp Formation are the two units holding the
        uppermost Cretaceous of Huesca, Lleida and Barcelona, and are
        diachronous, the Arén Sandstone running "from late Campanian to late
        Maastrichtian".
    - id: prieto-márquez2013a
      notes: >
        Gives the relationship to the Tremp, which "overlies and is partly
        equivalent laterally to the upper Campanian-Maastrichtian Arén
        Sandstone", and records that its deposits have been read as
        barrier-island, beach or deltaic in origin.
    - id: cruzado-caballero2010a
      notes: >
        Uses the rank word in place of the lithic term, placing the Blasi 1
        locality of Arén, Huesca, in "the upper part of the Arén Formation, late
        Maastrichtian in age", and in the type horizon narrows that level to
        "Late Cretaceous, latest Maastrichtian (upper part of chron 30n)". Arén
        is also a town and the name of a Tremp-syncline sector, which the lithic
        form disambiguates.

Ashdown:
  rank: formation
  parent: Hastings Beds
  period: [Early Cretaceous]
  stages: [Berriasian, Valanginian, Hauterivian]
  variants: [Ashdown Beds, Ashdown Sands]
  references:
    - id: barker2023a
      notes: >
        Gives the position and the naming history: the Hastings Group is
        "comprised of the older (late Berriasian–early Valanginian) Ashdown
        Formation, followed by the Wadhurst Clay Formation (Valanginian) and
        Tunbridge Wells Formation (late Valanginian ...)". The term "Ashdown
        Sands" is "now defunct", having been introduced by Drew (1861) "before
        being formalised to Ashdown Formation by" Rawson (1992). Rejects the
        older "Ashdown Sand (Hauterivian)" provenance that Charig and Milner
        (1997) gave a spinosaurid crown from near Bexhill: the site exposes only
        the Wadhurst Clay, so the tooth "cannot be Hauterivian or from the
        Ashdown Formation".
    - id: taylor2007a
      notes: >
        Uses the intermediate name, "the Ashdown Beds Formation, which
        straddles the Berriasian/Valanginian boundary", and records that the
        part exposed at Ecclesbourne Glen is Berriasian.
    - id: taylor2018a
      notes: >
        Gives "the Berriasian-Valanginian (earliest Cretaceous) Ashdown
        Formation of the Wealden Supergroup of southern England".
    - id: charig1997a
      notes: >
        Dates the part at Bexhill-on-Sea as Hauterivian, recording a baryonychid
        tooth crown from the "Ashdown Sand, (Hauterivian) at Redlands Bricks,
        Ashdown Works, Scallets Wood, Turkey Road, Bexhill-on-Sea, East Sussex".
    - id: drew1861a
      notes: >
        Coins the name: the lower sands "make very high ground, are spread over
        a large area, and show a very great thickness on Ashdown Forest, which
        is the central part of all the Hastings Sand country: no name, I think,
        can be better for these than Ashdown Sands". The same paragraph names
        the Wadhurst Clay and the Grinstead Clay.
    - id: rawson1992a

Assenta:
  rank: member
  parent: Lourinhã
  period: [Late Jurassic, Early Cretaceous]
  stages: [Tithonian, Berriasian]
  references:
    - id: mateus2017a
      notes: >
        Names it as one of the upper members of the Lourinhã Formation and
        contrasts it with the Santa Rita Member to the northwest, a meandering
        fluvial system "with intercalations of shallow-marine lagoonal"
        carbonates exposed at the top of the section at Porto da Calada.
        Proposes "a late early Tithonian to earlier Berriasian age" for the
        member and, from the tentative magnetostratigraphy of Salminen and
        colleagues (2013), puts the Tithonian–Berriasian boundary near its top
        at Porto da Calada, so that "the last few meters of the Assenta Mb. can
        be considered as earliest Berriasian".
    - id: russo2021a
      notes: >
        Places it at "the uppermost part of the Lourinhã Formation" and gives
        an "uppermost lower Tithonian-upper Tithonian age".
    - id: rotatori2022a
      notes: >
        Records the lateral equivalence: in the Turcifal sub-basin "the only
        member outcropping is the Assenta Member, which is laterally equivalent
        to the Santa Rita Member", the Lourinhã elsewhere carrying the Porto
        Novo/Praia da Amoreira, Praia Azul and Santa Rita Members.
    - id: salminen2013a
      notes: >
        Dates this member directly by magnetostratigraphy, and ends at the
        Tithonian: "At the Porto da Calada section, the Assenta member of the
        Lourinha Formation is Tithonian in age", with the parent given as
        "Kimmeridgian-Tithonian in age". So it supports the Tithonian and not
        the Berriasian, which rests on the entry's other references.

Açu:
  rank: formation
  period: [Early Cretaceous, Late Cretaceous]
  stages: [Albian, Cenomanian]
  references:
    - id: pereira2024a
      notes: >
        Gives "the Açu Formation (Albian-Cenomanian), Potiguar Basin, Ceará
        state, north-east Brazil" for the Tiamat type, the first Early
        Cretaceous titanosaur known from the unit.
    - id: mannion2025a
      notes: >
        Repeats the Albian to Cenomanian span and records rebbachisaurid
        material from it.
    - id: buffetaut2024a
      notes: >
        Independently gives "the Albian-Cenomanian Açu Formation of Brazil" for
        abelisaurid teeth.

Aïn el Guettar:
  rank: formation
  period: [Early Cretaceous]
  stages: [Aptian, Albian]
  references:
    - id: fanti2015a
      notes: >
        Places it in the Tataouine basin succession of southern Tunisia,
        "the overlying lower Albian Ain El Guettar (Chenini, Oum ed Diab and
        Rhadouane members)", above the Merbah el Asfer Group and below the
        Zebbag Formation. Prints the name without the diaeresis, a spelling
        rather than an alternate name.
    - id: fanti2013a
      notes: >
        Gives the Tataouinea horizon as "the Oum ed Diab Member of the Ain el
        Guettar Formation at the Jebel El Mra", the beds "dated as early Albian
        based on lateral correlation with marine units and associate vertebrate
        fauna".
    - id: mannion2025a
      notes: >
        Independently gives "the lower Albian Aïn el Guettar Formation of
        Tunisia" and treats it as contemporaneous with the Elrhaz Formation of
        Niger; its table dates Tataouinea hannibalis from the formation as
        "Early Albian (Early Cretaceous)".
    - id: ibrahim2020a
      notes: >
        Regards "the Aptian-Albian age as most likely, given the recent
        discovery of diagnostic remains of the giant crocodyliform Sarcosuchus
        ... and the smaller notosuchian Araripesuchus". Surveys the older
        readings in order to set them aside, giving the range as "as old as
        Barremian (Busson 1967, 1970) or as young as late Albian (Fanti et al.
        2015)" - though Fanti and colleagues in fact give the early Albian, in
        their abstract and in their type horizon block, and never the late
        Albian.

Aïssa:
  rank: formation
  period: [Middle Jurassic, Late Jurassic]
  stages: [Bathonian, Callovian, Oxfordian, Kimmeridgian]
  references:
    - id: amar-bekada2023a
      notes: >
        Places the Aïssa Formation in the Malm at "Kimmeridgian-Portlandian",
        with its lower member Kimmeridgian, "upper Jurassic", and its upper
        member Portlandian, while the Callovian-Oxfordian sits in the Djara
        Formation beneath it. The formation is about 625 m thick at Djebel
        Djeraouine, a regressive megasequence of deltaic sequences that builds
        the great anticlines of Djebel Aïssa and Djebel Mekther, and it is
        overlain by the Tiloula Formation. The section introducing the Malm is
        looser, calling it Oxfordian, Kimmeridgian and Portlandian and
        "represented largely by the Formation of Aissa".
    - id: mannion2019a
      notes: >
        Gives "the Callovian Aïssa Formation of Algeria" for Chebsaurus.
    - id: läng2010a
      notes: >
        Gives the coarser reading, "the Middle Jurassic Aïssa formation of the
        Naama Province, Algeria", for further material of the same taxon. For
        the Chebsaurus site itself it lists past datings of "'indeterminate
        Dogger'", Bathonian, Callovian "or Oxfordian to Portlandian", and,
        granting that "it is not so easy to determine clearly the age", supposes
        after Kacemi (2005) that Chebsaurus "should be dated from the
        Callovian".

Bahariya:
  rank: formation
  period: [Late Cretaceous]
  stages: [Cenomanian]
  references:
    - id: stromer1915a
      notes: >
        Gives "Baharîje Beds (lowermost Cenomanian", using the German
        transliteration of the name.
    - id: stromer1931a
      notes: >
        Uses the same name and age in the later monograph.
    - id: smith2001a
      notes: >
        Gives "the Upper Cretaceous [Cenomanian: 93.5 to 99.0 million years ago
        (Ma)] Bahariya Formation" and places the Paralititan site in its coastal
        deposits.

Bajada Colorada:
  rank: formation
  period: [Early Cretaceous]
  stages: [Berriasian, Valanginian, Hauterivian]
  references:
    - id: gallina2021a
      notes: >
        Gives "the Lower Cretaceous Bajada Colorada Formation
        (Berriasian-Valanginian", narrowing it to "late Berriasian-Valanginian"
        in the stratigraphic occurrence of Ninjatitan.
    - id: coria2019a
      notes: >
        Uses the narrower Valanginian.
    - id: riguetti2022a
      notes: >
        Thyreophoran remains come from "the Lower Cretaceous rocks of the Bajada
        Colorada Formation (Berriasian-Hauterivian)" of Neuquén Province, a
        diversity of osteoderms "showing either a mixture of thyreophorans at
        the site, or a new, still poorly understood lineage".

Bajo Barreal:
  rank: formation
  period: [Late Cretaceous]
  stages: [Cenomanian, Turonian]
  references:
    - id: ibiricu2013a
      notes: >
        Places the formation in the "Upper Cretaceous: Cenomanian-Turonian", and
        for the part that yielded Katepensaurus reports the settled position:
        "The age of the Lower Member of the Bajo Barreal Formation is widely
        regarded as Cenomanian-Turonian."
    - id: navarrete2011a
      notes: >
        Lists the four published ages for the formation - Senonian,
        Albian-Cenomanian, mid-Cenomanian to late Turonian and late Cenomanian
        to early Turonian - and prefers the Cenomanian-Turonian readings, which
        "would be the one that best fits these faunistic connections" with
        equivalent units in the Neuquén basin. Drusilasaura itself comes from
        "the Upper Member of the Bajo Barreal Formation (Cenomanian-Turonian)",
        high in that member and below the Laguna Palacios Formation, so its own
        range "could extend to the late Turonian and even to the Coniacian".
    - id: martínez2016a
      notes: >
        Holds the formation to the Cenomanian-Turonian, tabulating the "Fossil
        vertebrate fauna of the Upper Cretaceous (Cenomanian-Turonian) Bajo
        Barreal Formation of central Patagonia, Argentina" and resting that on
        radiometric dates from tuffs within the unit together with zircon ages
        supporting a Cenomanian Lower Member. It dismantles the younger reading:
        Clyde and colleagues "argued for a much younger (Campanian) age for the
        Bajo Barreal Formation", but the strata they investigated "have recently
        been reassigned" to the Lago Colhué Huapi Formation. The Albian in
        circulation comes from palynology of "a subsurface equivalent of the
        Bajo Barreal Formation, the Caleta Olivia Member of the Cañadón Seco
        Formation", not from this unit.
    - id: casal2015a
      notes: >
        Gives "Bajo Barreal Formation (middle Cenomanian-late Turonian", and
        erects the Lago Colhué Huapi Formation above it: that unit "overlies
        the Bajo Barreal Formation (Upper Member)" rather than replacing any
        part of it, so this formation lost no rock in the split. What moved
        were occurrences at the eastern localities, where "stratigraphic and
        chronological aspects of these levels have historically been confused".
    - id: casal2007a
      notes: >
        Carries the superseded reading. Assigns "a Campanian-Maastrichtian?
        age for the upper levels of this stratigraphic unit, outcropping in the
        southeast of Lago Colhué Huapi", on Aeolosaurus and "other
        paleontological records from the same locality, in addition to geologic
        observations", and calls it preliminary. The same research group
        separated those beds as the Lago Colhué Huapi Formation eight years
        later, so this is history rather than a competing age for the rock now
        called Bajo Barreal.

Bajo de la Carpa:
  rank: formation
  parent: Neuquén
  period: [Late Cretaceous]
  stages: [Coniacian, Santonian, Campanian]
  references:
    - id: filippi2026a
      notes: Gives "Bajo de la Carpa Formation, Santonian".
    - id: porfiri2024a
      notes: >
        Independently, "the age of the Bajo de la Carpa Formation is interpreted
        as Santonian" within the Upper Cretaceous, and the formation belongs to
        the Neuquén Group. Bajo means low or depression and is part of the
        proper name; the mistranslation "Lower La Carpa" appears in some
        sources.
    - id: garrido2010a
      notes: >
        Santonian, on two independent grounds: Legarreta and Gulisano (1989)
        give the deposits an age between 86 and 83 Ma, "placing it within the
        Santonian", and "a Santonian age is also attributed by Bonaparte (1991)
        on the basis of its paleontological content, a criterion later followed
        by Hugo & Leanza (2001) and which is also adopted in this work". Cruz
        and colleagues (1989) instead give the whole Río Colorado Subgroup, this
        formation and the Anacleto, "an age of 88.5 to 80 Ma, corresponding to
        the Coniacian–Early Campanian interval".
    - id: legarreta1989a
    - id: bonaparte1991a
    - id: hugo2001a
      notes: >
        Sets out the Neuquen Group's three subgroups with a span for each: "the
        Cenomanian-lower Turonian Limay Subgroup comprising the Candeleros,
        Huincul and Cerro Lisandro Formations; the upper Turonian-Coniacian Rio
        Neuquen Subgroup including the Portezuelo and Plottier Formations; and
        the Santonian-lower Campanian Rio Colorado Subgroup comprising the Bajo
        de la Carpa and Anacleto Formations." The statement is made twice in
        identical terms, and dates the group as a whole "from early Cenomanian
        (97 plus or minus 3 Ma) to early Campanian (74 plus or minus 3 Ma)".
    - id: cruz1989a
      notes: >
        A sequence-stratigraphic analysis that runs the whole scheme one rank
        below the registry: it gives "The Portezuelo (sandstones) and Plottier
        (pelites) members of the Rio Neuquen Formation" and "the members Bajo
        de la Carpa (sandstones) and Anacleto (pelites), of the Rio Colorado
        Formation", where the file and Hugo and Leanza (2001) make those two
        subgroups. Its own framework is Depositional Sequences I to IX, and its
        ages sit in a comparative stratigraphic chart rather than in the text,
        so it is a rank datum and a sequence framework rather than a dating.
    - id: martinelli2004a
      notes: >
        Coniacian-Santonian, presumed rather than measured: the formation's "age
        is presumed to be Coniacian-Santonian", after Legarreta and Gulisano
        (1989) and Bonaparte (1991). The same range accompanies its Dinilysia
        patagonica and Neuquensaurus australis records.
    - id: pérez-moreno2023a
      notes: >
        Carries the top into the Campanian: the Rinconsaurus caudamirus type
        locality "is located at the base of the Bajo de la Carpa Formation
        (middle Santonian–Campanian; Filippi 2015)". The abstract instead gives
        "the Bajo de la Carpa Formation (Santonian)".

Balabansai:
  rank: formation
  period: [Middle Jurassic, Late Jurassic]
  stages: [Bathonian, Callovian, Oxfordian]
  references:
    - id: rauhut2024a
      notes: >
        Gives the span and how it is arrived at: the formation "is currently
        dated by palynomorphs and vertebrate assemblages as late Middle Jurassic
        (Bathonian-Callovian".
    - id: averianov2005a
      notes: >
        Uses the Russian rank word and the narrower age, "Balabansai Svita
        (Callovian". The svita-or-formation duality is the same as for the
        Bostobe and the Baynshiree.
    - id: nessov1995a
      notes: >
        Red sandstone and grey clays "at the base of the Balabansai Formation"
        are "Middle Jurassic, upper Bathonian", and the "Upper part of the
        Balabansai Formation (interval 6-9 m from its top)" at Dzhiddasai I is
        "Middle -?Upper Jurassic, Callovian - ?Oxfordian".

Balde de Leyes:
  rank: formation
  parent: Marayes
  period: [Early Jurassic]
  references:
    - id: colombi2015a
      notes: >
        Erects the unit: "The new stratigraphic unit is defined as the Balde de
        Leyes Formation, a name assigned due to its proximity to this locality",
        separating it from the Quebrada del Barro Formation below, so that "the
        age of the Quebrada del Barro Formation was defined as Late Triassic and
        that of the new unit as Early Jurassic, based on the precise
        stratigraphic position of the vertebrates found". The series comes from
        correlation: the formation "is assigned to the Early Jurassic by its
        correlation with the Cañón del Colorado Formation of the Mogna
        depocentre and the Upper Elliot Formation of the Karoo basin, South
        Africa". No stage is given.
    - id: martínez2017a
      notes: >
        Places it at the top of the Marayes Group in the Marayes-El Carrizal
        Basin of northwestern Argentina, above the Quebrada del Barro Formation,
        and gives only the series, Lower Jurassic.
    - id: apaldetti2011a
      notes: >
        Describes the Leyesaurus type from the Quebrada del Barro Formation,
        the unit this one was later separated from, and argues on the
        affinities of that taxon with Massospondylus for "a younger age for the
        Quebrada del Barro Formation than previously postulated".

Baruungoyot:
  rank: formation
  period: [Late Cretaceous]
  stages: [Santonian, Campanian, Maastrichtian]
  variants: [Barun Goyot, Barungoyot, Lower Nemegt Beds, Barungoyotskaya]
  dispute:
    summary: >
      The older limit is contested and both readings are current. Gradzinski and
      colleagues (1977) confine the formation to the "?middle Campanian", and
      Kielan-Jaworowska (1974) and Averianov and Lopatin (2022) likewise give it
      as Campanian. Shuvalov (2000) instead dates it Santonian-Campanian from
      basalts within the svita, Karczewska and Ziembinska-Tworzydlo (1983) reach a
      "?Late Santonian" from charophytes, and the Santonian is still applied to
      the formation by Alifanov and Barsbold (2009) and by Chinzorig and
      colleagues (2017). Van Itterbeeck and colleagues (2005) treat the question
      as closed against the Santonian, but the source they rely on does not
      support them.
  references:
    - id: gradziński1977a
      notes: >
        Assigns the Gobi formations as "best guesses": the Djadokhta "?upper
        Santonian and/or ?lower Campanian", this formation "?middle Campanian",
        and the Nemegt "?upper Campanian and ?lower Maastrichtian". This is the
        assignment Karczewska and Ziembinska-Tworzydlo (1983) relay when they
        date the unit.
    - id: khand2000a
      notes: >
        Leaf prints of Ginkgo, Platanus, Trochodendroides, Nelumbo and Quereuxia
        come from "The Santonian-Campanian deposits of the Baruungoyot Formation
        in the Altan uul-4", while Table 2 sets the formation against the
        Campanian alone and the mollusc scheme of Martinson (1982) makes the
        Baruungoyotian Campanian. Shuvalov and Stankevich (1977) had applied the
        name to the eastern Gobi red beds this paper calls the Javkhlant
        Formation. It closes by conceding that "The position of some
        stratigraphic divisions, for example, Bayanshiree, Baruungoyot and
        others, more lower divisions remain to be quite unclear."
    - id: gradziński1974a
      notes: >
        Redefines the unit and dates it: the formation, "previously termed Lower
        Nemegt Beds", is "composed of clastic continental sediments of red-beds
        type; it is probably of Campanian age", exceeds 110 m, and is overlain
        gradationally by the Nemegt Formation, "probably of Maastrichtian age".
        It records that Martinson and colleagues (1969) had introduced
        "Barungoyotskaya svita" for the same beds.
    - id: averianov2022a
      notes: >
        Gives the unit as Campanian, placing the Ondogurvel holotype at Nemegt
        in the "Barungoyot Formation, Upper Cretaceous (Campanian)".
    - id: pittman2020a
      notes: >
        Pairs the "Campanian Djadokhta Formation (and the similar Wulansuhai
        (Bayan Mandahu) Formation in China)" with the "Campanian-Maastrichtian
        Barun Goyot".
    - id: vanitterbeeck2005b
      notes: >
        Records that Karczewska and Ziembinska-Tworzydlo (1983) "proposed a
        Santonian age for the Barun Goyot Formation; however, radiometric
        calibrations ... have provided a Campanian age for this formation", and
        on that basis rejects their age for the overlying Nemegt Formation. The
        calibrations are credited to Shuvalov (2000), who dates the svita
        Santonian-Campanian rather than Campanian, so this rejection does not
        carry the weight it is given here. Elsewhere the paper reads the unit as
        an equivalent of the North American Judithian and so "mid- and Late
        Campanian", and it notes that the Campanian is "supported by the
        radiometric ages of the volcanic layers within the Barun Goyot
        Formation".
    - id: shuvalov2000a
      notes: >
        Heads the section "Baruungoyot Svita (Santonian-Campanian)" and
        concludes in its own voice, "Hence, we date the Baruungoyot Svita as
        Santonian-Campanian". Reports basalt dates of 75 plus or minus 7 Ma from
        the upper part of the svita at Chuluut Uul in the South Gobi and 80 Ma
        from North Mongolia, and records that most researchers give a Senonian
        and most likely Campanian age while Kielan-Jaworowska lowered the
        Djadokhta to Coniacian-Santonian on mammal remains. The svita as used
        here unites the Djadokhta Formation with other red-bed units, so it is
        broader than the formation of the Polish-Mongolian usage.
    - id: alifanov2009a
      notes: >
        Gives the Ceratonykus oculatus holotype horizon at Khermiin Tsav in the
        Nemegt Depression as "Upper Cretaceous, ?Lower Santonian, Baruungoyot
        Formation".
    - id: chinzorig2017a
      notes: >
        Sets the formation above the Djadokhta and gives it as
        "Santonian-Campanian", the Djadokhta in turn unconformably overlying the
        "Bayanshiree Formation (Cenomanian-Turonian)".
    - id: fanti2012a
      notes: >
        Collects the Nemegtomaia barsboldi nesting specimen "from the upper beds
        of the Baruungoyot Formation (Campanian-Maastrichtian)" along the
        Northern Sayr, and describes the Nemegt Basin exposures as "the upper
        Campanian - lower Maastrichtian Baruungoyot and Nemegt formations". The
        mechanism it gives for the young end is the "Baruungoyot-Nemegt
        interfingering interval", which matches the gradational contact
        Gradzinski and Jerzykiewicz (1974) describe.
    - id: fowler2020b
      notes: >
        Gives Parvicursor and Ceratonykus as from the "Barun Goyot Formation
        (lower Maastrichtian)", beside the "Nemegt Formation (~upper Campanian
        to ~lower Maastrichtian)".
    - id: karczewska1983a
      notes: >
        "The Barun Goyot Formation (and its stratigraphic equivalent red beds of
        Khermeen Tsav) is probably of ?Late Santonian age", which agrees with
        what Kielan-Jaworowska (1974) read from the development of the
        multituberculates. Charophytes put the overlying Nemegt Formation no
        younger than the Lower Campanian, so that among the Upper Cretaceous
        continental deposits of the Gobi Desert the "underlying Barun Goyot
        Formation and Djadokhta Formations must be older than the Lower
        Campanian".
    - id: kielan-jaworowska1974a
      notes: >
        Dates the unit Campanian in its own voice, without attribution: "In the
        younger Asiatic Barun Goyot Formation, which is of Campanian age, the
        multituberculate fauna so far described consists of" three genera, and
        the paper adds that "The post-Campanian multituberculate records are
        very scanty in Asia". It names no Santonian for this formation; its one
        Santonian is an alternative for the Djadokhta that the paper declines.

Bauru:
  rank: group
  period: [Early Cretaceous, Late Cretaceous]
  stages: [Aptian, Albian, Cenomanian, Turonian, Coniacian, Santonian,
    Campanian, Maastrichtian]
  references:
    - id: soares2020a
      notes: >
        Keeps the Caiuá as a group of its own, recording that Fernandes (1992)
        and Fernandes and Coimbra (1994) "further separated the basin succession
        into two groups: the Caiuá Group and the Bauru Group", and gives the
        latter's contents as "the vertically superposed Araçatuba, Uberaba,
        Adamantina, and Marília formations". The age stated here is the basin's
        rather than the group's: "The basin evolved from the Coniacian to the
        Maastrichtian". It also raises the Serra da Galga and Ponte Alta members
        of the Marília Formation to the Serra da Galga Formation, restricted to
        the northeastern margin.
    - id: iori2021a
      notes: >
        Dates the whole group "between the Coniacian and Maastrichtian ages",
        after Fernandes and Coimbra (2000), and keeps the Caiuá outside it: "The
        Bauru Basin is composed by Caiuá and Bauru groups." It adds that "The
        exact age of the formations included within the Bauru Group is not
        consensual", the Marília Formation being the agreed exception, and that
        "The hierarchical organization of the units of the Bauru Group is not
        yet consensual".
    - id: brum2021a
      notes: >
        Divides the group in two by age, the first interval "formed by aeolian
        to fluvial-aeolian sandstones of the Aptian, and the second by alluvial
        and fluvial conglomerates, sandstones and mudstones dating from the
        Santonian to the Maastrichtian". The scheme followed is that of Soares
        and colleagues (1980) as updated by Pinheiro and colleagues (2018), with
        eight formations, so the Aptian aeolian sandstones sit inside the group
        rather than in a separate Caiuá Group. The same paper elsewhere places
        "the Caiuá desert, which is primarily Aptian" outside the group,
        surrounding it, so both circumscriptions appear here side by side.
    - id: machado2013a
      notes: >
        Dates the group by way of one of its formations, giving "Adamantina
        Formation (Turonian-Santonian".
    - id: cavalcanti2026a
      notes: >
        Gives the contents: "the Bauru Group is divided into the Adamantina,
        Uberaba, Marília, and Serra da Galga formations".
    - id: santucci2022a
      notes: >
        Dates its units, the Adamantina "Campanian-early Maastrichtian" and the
        Marília Maastrichtian, and relates the group's development to "the
        extensive alkaline magmatism in the north/northeast area of the basin".

Bayan Mandahu:
  rank: formation
  period: [Late Cretaceous]
  stages: [Campanian]
  references:
    - id: godefroit2008b
      notes: >
        Gives the age by correlation: the formation is "correlated with the
        Djadokhta Formation in Mongolia, Campanian".
    - id: longrich2010a
      notes: >
        Hedges the same reading, "considered to be Late Cretaceous in age,
        probably Campanian".
    - id: xu2013a
      notes: >
        Shows the other naming convention for the same rock, writing
        "Wulansuhai Formation of Bayan Mandahu" and treating Bayan Mandahu as
        the area. This name is the Western literature's for the eastern outcrop
        of the unit entered as Ulansuhai. The two names attach to different
        ground, this one to the eastern outcrop and Ulansuhai to the type area,
        so they are a geographic split rather than two spellings of one name.

Bayanshiree:
  rank: formation
  period: [Late Cretaceous]
  stages: [Cenomanian, Turonian, Coniacian, Santonian, Campanian, Maastrichtian]
  variants: [Bayn Shireh, Bayn Shire, Bayn Shiree, Baynshire, Baynshiree, Baynshirenskaya]
  references:
    - id: khand2000a
      notes: >
        Three ages sit side by side without reconciliation: "Fossil evidence
        suggests that the Bayanshiree Formation is Cenomanian-Santonian in age"
        in the eastern Gobi, "the Bayanshiree Formation (Cenomanian-Turonian)"
        where the Segnosaurus and Erlikosaurus material is discussed, and "the
        Bayanshiree Formation (Turonian-Santonian)" for the plant beds at Khar
        Khutul; Martinson's (1982) Bayanshireenian mollusc assemblage is "late
        Cenomanian-Santonian". The formation is taken as "the lowermost part of
        the Upper Cretaceous" once Shuvalov (1980) had placed the Baruunbayan
        Formation below it. The paper's own verdict is that the position of this
        division and the Baruungoyot "remain to be quite unclear".
    - id: eberth2009a
      notes: >
        Thickness and the faunal basis for the age: exposures of "the 280 m
        thick, buff-colored Baynshiree Formation/Svita" at Shine Us Khudag, Khar
        Khutul and Bayn Shiree "produce a rich assemblage of
        Cenomanian-Santonian vertebrate and invertebrate fossils". Records the
        unit as a formation and a svita in the same breath. Workers in the
        Eastern Gobi, it says, have shown the formation and the conformably
        overlying Shine Us Khudag redbeds together "to be Late Cretaceous in age
        (Cenomanian-Campanian)".
    - id: tsogtbaatar2019a
      notes: >
        "Baynshire Formation (Cenomanian-Santonian)". The age rests on fossils
        rather than dates: the beds at Bayshin Tsav, Khongil Tsav and Bayn
        Shire "are thought to be late Cenomanian to Santonian in age based on
        their molluscan, ostracode, and vertebrate faunas and named the
        Baynshire Svita".
    - id: hicks1999a
      notes: >
        Calls it the "lower Upper Cretaceous Bayn Shireh Formation", which has
        "been assigned a 'Baynshirenian' biostratigraphic age that may range
        from Cenomanian to early Campanian", an age "cited in the literature as
        ranging from the late Cenomanian to early Santonian ... and more
        recently from the Turonian to lower Campanian". Its own paleomagnetic
        results put the formation as "most likely deposited near the end of the
        Cretaceous Long Normal Interval, no later than the latest Santonian".
    - id: jin2012a
      notes: >
        Gives Garudimimus as "from the Bayanshiree Svita (Cenomanian-Campanian",
        crediting the age to Makovicky and colleagues (2004).
    - id: makovicky2004a
    - id: maryańska1977a
      notes: >
        Reports that Maleev (1952) regarded the Talarurus-bearing sediments at
        Bayn Shireh "as the youngest Cretaceous sediments in Mongolia, i.e.
        Maastrichtian in age", an opinion "not confirmed by later
        investigations", and judges "An Upper Cenomanian to Lower Santonian age
        ascribed to these sediments by Martinson (1973, 1975)" as "more
        probable".

Bayin-Gobi:
  rank: formation
  period: [Early Cretaceous]
  stages: [Aptian, Albian]
  references:
    - id: pu2013a
      notes: >
        Gives "Bayin-Gobi Formation (Aptian-Albian)" and counts it among "the
        Lower Cretaceous deposits of China", setting it beside "Suzhousaurus
        megatherioides from Xinminpu Group (Albian".
    - id: zanno2010a
      notes: >
        Gives the narrower "Bayin Gobi Formation (lacustrine facies), Inner
        Mongolia, Albian", spelling the name without the hyphen.

Bayn Dzak:
  rank: member
  parent: Djadokhta
  period: [Late Cretaceous]
  stages: [Cenomanian, Turonian, Coniacian, Santonian, Campanian, Maastrichtian]
  references:
    - id: khand2000a
      notes: >
        Barsbold (1972) used the name at formation rank for the whole of the
        Djadokhta, which this paper lists among its synonyms as the "Bayan Dzak
        Formation by Barsbold".
    - id: dashzeveg2005a
      notes: >
        Erects it as one of two: "The considerably enlarged formation comprises
        a lower Bayn Dzak Member, dominated by moderate reddish orange sands
        with subordinate mudstone units, and an upper Tugrugyin Member". Reviews
        the earlier ages for its fauna, which "has been reported to range from
        Cenomanian to Early Maastrichtian", from the "early Late Cretaceous" of
        Berkey and Morris (1927) and "a range between the Coniacian and the
        Santonian" from Polish authors to the Campanian of most later workers.
        Its own magnetostratigraphy through the member "suggests, but does not
        clearly establish, that the sediments were deposited during the rapid
        sequence of polarity changes in the late part of the Campanian
        incorporating the end of Chron 33 and Chron 32 between about 75 and 71
        Ma".
    - id: dingus2008a
      notes: >
        Uses it as a comparison rather than an assignment for Ukhaa Tolgod:
        "The strata at Ukhaa Tolgod are referred to the Djadokhta Formation. As
        seen in the Bayn Dzak Member at Bayn Dzak, facies E-1, E-2, S, and M
        dominate the lower part of the section at Ukhaa Tolgod". It does not
        place Ukhaa Tolgod in this member.
    - id: berkey1927a

Bayo Overo:
  rank: member
  parent: Cerro Barcino
  period: [Early Cretaceous, Late Cretaceous]
  stages: [Aptian, Albian, Cenomanian]
  references:
    - id: carrano2012a
      notes: >
        Gives the horizon of the Megalosaurus inexpectatus type, MACN 18.172, as
        "Bayo Overo Member, Cerro Barcino Formation; Albian–Cenomanian, late
        Early–early Late Cretaceous".
    - id: canale2014a
      notes: >
        Places it at the top of the formation, which "culminates with Bayo
        Overo Member".
    - id: martinelli2007b
      notes: >
        Dates it as Aptian to Albian in a table of Early Cretaceous continental
        tetrapods from Argentina, listing Chubutisaurus insignis from the
        "Aptian-Albian, Bayo Overo Member, Cerro Barcino Fm".

Belle Fourche:
  rank: member
  parent: Frontier
  period: [Early Cretaceous, Late Cretaceous]
  stages: [Albian, Cenomanian]
  dispute:
    summary: >
      Member in the United States, formation in Canada. Carpenter (1998) gives
      "Belle Fourche Member (Middle Cenomanian ...), Frontier Formation" and
      records the reassignment that produced it: Merewether and colleagues
      (1979) "revised the Frontier Formation in Wyoming, and reidentified
      Dunbar's Frontier Formation as the Belle Fourche Member of the Frontier
      Formation". Pittman and colleagues (2020) tabulate a "Belle Fourche
      Formation" in Canada at the same Cenomanian age.
  references:
    - id: carpenter1998c
      notes: >
        Gives the rank, parent and age, and the history of the reassignment. The
        age differs by level: the Nodosaurus textilis horizon is "Belle Fourche
        Member (Middle Cenomanian ...), Frontier Formation", after Merewether
        and colleagues (1978) and Merewether (1983), and the Stegopelta
        landerensis horizon is the "Base of Belle Fourche Member (latest Albian
        or earliest Cenomanian ...)", after Merewether (1983).
    - id: pittman2020a
      notes: >
        Uses formation rank for the Canadian occurrence.
    - id: merewether1979a
      notes: >
        The specialist treatment of the parent formation, and the entry's
        plainest statement of age: "The Frontier Formation in eastern Wyoming
        is divided into as many as three members, which are, from older to
        younger, the Belle Fourche Member of Cenomanian age, the unnamed member
        of early and middle Turonian age, and the Wall Creek Member of late
        Turonian and early Coniacian age." It names no Albian anywhere.
        It also separates two units that share the name: in the Powder River
        Basin "the shale, siltstone, and sandstone of the Belle Fourche Member
        grade eastward into shale of the Belle Fourche Shale and calcareous
        shale of the lower part of the Greenhorn Formation". A third, the Belle
        Fourche Formation of Canada, is the unit Pittman and colleagues (2020)
        report. This entry is the Wyoming member.
    - id: merewether1983a

Belly River:
  rank: group
  period: [Late Cretaceous]
  stages: [Santonian, Campanian]
  references:
    - id: eberth2005a
      notes: >
        Gives the rank, the contents and the span. At Dinosaur Provincial Park
        "the complete Belly River Group (outcrop and subsurface) is
        approximately 280 m thick and consists of the Foremost (170 m), Oldman
        (40 m), and Dinosaur Park (70 m) formations", and "the entire Belly
        River Group ... ranges in age from 80.0 to 74.2 Ma". Records that the
        name began as Dawson's (1883) Belly River "series", which
        "unintentionally included within it the underlying Pakowki marine
        shales".
    - id: lull1942a
      notes: >
        Treats it as the Belly River formation, "equivalent in age to the Judith
        River", and sets it beside the Lance among the formations "of the late
        Cretaceous". Divides it into "the Milk River, Pakowki, Foremost, and
        Pale beds", the Pale beds forming its upper part.
    - id: brown2013a
      notes: >
        Says the group "spans 80-75 Ma in age" and belongs to the Judith River
        clastic wedge of southern Alberta, which represents the western margin
        of the Western Interior Basin "throughout much of the Campanian".
    - id: dawson1883a
      notes: >
        Names the unit and positions it, and gives no stage. It works entirely
        in North American series terms - Laramie, Pierre, Fox Hills, Niobrara,
        Judith River, Fort Union, St. Mary River, Willow Creek - and its
        correlation table puts the "Belly River series", of "Sandstones, shales
        and sandy clays" with fresh and brackish water molluscs, below the
        Pierre and against a queried Niobrara. The rank is series here, and the
        correlation carries the author's own question mark.
    - id: rozhdestvensky1968a
      notes: >
        The most ancient and most plentiful North American hadrosaur remains
        "were found in the Belly River Formation which has been dated to the
        Campanian and Upper Santonian", older than those of "the Maastrichtian
        Edmonton Formation". Uses the name at formation rank and treats the unit
        as corresponding to the Two Medicine Formation.

Bissekty:
  rank: formation
  period: [Late Cretaceous]
  stages: [Turonian, Coniacian, Santonian]
  references:
    - id: sues2016a
      notes: >
        Dates it and its neighbor above: "Bissekty Formation (Upper
        Cretaceous: middle-upper Turonian) and Aitym Formation (Upper
        Cretaceous: upper Turonian - ?Coniacian".
    - id: kuzmin2020a
      notes: >
        Independently gives "Bissekty Formation (Turonian".
    - id: nessov1995a
      notes: >
        At Dzharakuduk the base of the formation is "Upper Cretaceous, upper
        Turonian", levels about 52 and 57 m above the base are Coniacian, and a
        "Level near the top of the Bissekty Formation (site CBI-7a) ... Upper
        Cretaceous, Coniacian-? lower Santonian". Notes that "Earlier, the
        entire formation was dated as late Turonian ... or as undivided late
        Turonian - Santonian".

Black Creek:
  rank: formation
  period: [Late Cretaceous]
  stages: [Campanian, Maastrichtian]
  references:
    - id: baird1979a
      notes: >
        The dedicated treatment of the North Carolina dinosaurs, giving "Late
        Cretaceous dinosaurs from the Black Creek Formation (Campanian) of
        Sampson and Bladen counties". It quotes Brett and Wheeler (1961) that
        upstream and updip from Elizabethtown the formation "was, without doubt,
        deposited during Taylor time represented by the Exogyra ponderosa zone
        (or older near the base)", and concludes that the dinosaurs "are
        Tayloran, i.e. Campanian, late Cretaceous, in age".
    - id: molnar1990b
      notes: >
        Independently gives "the Campanian Black Creek Formation of Bladen and
        Sampson counties, North Carolina".
    - id: brett-surman1989a
      notes: >
        Lists "Black Creek Fm, Campanian-Maastrichtian" among the formations
        with hadrosaurian remains.
    - id: brett1961a

Black Ven Marl:
  rank: member
  parent: Charmouth Mudstone
  period: [Early Jurassic]
  stages: [Sinemurian]
  variants: [Black Ven Marls]
  references:
    - id: norman2019a
      notes: >
        Gives the Scelidosaurus range as "Charmouth Mudstone Formation (Upper
        Sinemurian), Black Ven Marl Member, Asteroceras obtusum Zone, Obtusum
        Subzone", and records that nearly all well-provenanced specimens come
        "from either the Topstones or Stonebarrow Flatstones Beds (upper
        Sinemurian) in the Black Ven Marls on The Spittles-Black Ven cliff".
    - id: norman2020a
      notes: >
        Repeats the same range and zone for further material.

Blackleaf:
  rank: formation
  period: [Early Cretaceous, Late Cretaceous]
  stages: [Albian, Cenomanian]
  references:
    - id: varricchio2007a
      notes: >
        Gives "the mid-Cretaceous Blackleaf Formation of southwest Montana" for
        the Oryctodromeus burrow, the first trace and body fossil evidence of
        burrowing in a dinosaur.
    - id: tykoski2023a
      notes: >
        Cites work on "a vertebrate microsite in the mid-Cretaceous
        (Albian-Cenomanian) Blackleaf Formation, southwest Montana", and groups
        it with the Twin Mountains and Cloverly as older deposits each
        preserving a small-bodied ornithopod.
    - id: bonde2022a
      notes: >
        Dates it Cenomanian, "the Cenomanian Wayan and Blackleaf formations",
        and sets the unit beside the Mussentuchit Member and the Wayan Formation
        as contemporaneous western North American units.
    - id: ullmann2011a
      notes: >
        Writes of "the Albian-Cenomanian Blackleaf Formation" in a study of its
        BL1 microsite, which lies "102 m above the Kootenai-Blackleaf contact,
        a stratigraphic position within the Flood Member within this outcrop
        region". The Lima Peaks outcrops "primarily represent the early
        Cenomanian siliciclastic and volcaniclastic Vaughn Member", with the
        lower Flood Member locally exposed, and the zircon dates it reports
        suggest "the underlying Flood Member is the latest Albian in the Lima
        Peaks area".

Blue Lias:
  rank: formation
  period: [Early Jurassic]
  stages: [Hettangian, Sinemurian]
  references:
    - id: baron2024a
      notes: >
        Gives "Blue Lias Formation, Lower Lias Group, Charmouth, UK" at
        "Hettangian-Sinemurian, Early Jurassic".
    - id: martill2016a
      notes: >
        Places a specimen "close to the base of the Blue Lias Formation (Lower
        Jurassic, Hettangian)", making it "the oldest known Jurassic dinosaur",
        and notes that a lithological change at its base "historically was used
        by some workers as a lithological definition of the base of the
        Jurassic".
    - id: ezcurra2020a
      notes: >
        Resolves material within it by ammonite zone, to "the upper part of the
        Rugby Limestone Member (liasicus up to semicosatum zones)" and to "the
        angulata zone".

Bonebed I:
  rank: bed
  informal: true
  parent: Kitadani
  period: [Early Cretaceous]
  references:
    - id: shibata2015b
      notes: >
        Names it the lowest of the quarry's bonebeds: "At least four bonebeds
        are recognized at this locality", of which "The lowermost one, the
        Bonebed I (BB I), has yielded Fukuiraptor, Fukuisaurus, other dinosaur
        bones and teeth, and other vertebrates including crocodilians, turtles
        and fishes". Follows Behrensmeyer's (2007) definition of bonebed.
    - id: hattori2023a
      notes: >
        Gives the Tyrannomimus material as "collected from the same layer
        (Bonebed I)", at the Kitadani Dinosaur Quarry.
    - id: behrensmeyer2007a

Bonebed IV:
  rank: bed
  informal: true
  parent: Kitadani
  period: [Early Cretaceous]
  references:
    - id: shibata2015b
      notes: >
        Gives the Koshisaurus horizon as the fourth bone bed of the quarry,
        which it abbreviates BB IV: "This lenticular horizon has a limited
        exposure of approximately four square-meters in the quarry", the
        elements all from one size class and none duplicated. Writes the lowest
        bonebed in full as "Bonebed I (BB I)".

Bostobe:
  rank: formation
  period: [Late Cretaceous]
  stages: [Cenomanian, Turonian, Coniacian, Santonian, Campanian]
  variants: [Bostobin, Bostobinskaya, Bostobynskaya, Bostobine, Bostoba]
  references:
    - id: nessov1997a
      notes: >
        Gives the unit the same age at every locality cataloged, Santonian to
        lower Campanian, and separates it from a neighbor at Shakh-Shakh:
        "Bostobinskian Formation, but not Beleutinskian, Santonian-Lower
        Campanian. Finds predominantly from the lower half of the age interval."
        Earlier readings of the fossiliferous clay lenses are set against that
        and not adopted - at Kzyl-Dzhar a "Lens of gray clays in the
        Bostobinskian Formation, Turonian (Zherikhin, 1978, p. 78) or, most
        likely, Santonian-Lower Campanian", and at Taldysay a lens dated "Upper
        Coniacian-Lower Campanian (Zherikhin, 1978, p. 80) or Santonian-Lower
        Campanian". Resolved by horizon the lower part is Santonian alone, while
        near the Baibishe well "in the upper half of the formation, a rich
        vertebrate complex was found, named the Baibishinskian (Late
        Santonian-Early Campanian)".
    - id: godefroit2012a
      notes: >
        Gives "Bostobinskaya Svita (Santonian-Campanian", the Russian
        adjectival form of the name.
    - id: nessov1995a
      notes: >
        Gives "Bostobin Formation (Santonian - early Campanian", a third
        rendering of the same name. For the Shakh-Shakh beds it lists the
        earlier "upper Turonian - lower Santonian" dating of Rozhdestvensky
        (1964, 1971) and Rozhdestvensky and Khozatsky (1967), then judges them
        "more probably ... Santonian - lower Campanian rather than Cenomanian -
        Turonian (Rozhdestvensky, 1964b) or Turonian (Rozhdestvensky, 1976)".
    - id: norman1997a
      notes: >
        Records how the Akkurgan beds came to be assigned here, Shilin and
        Suslov (1982) allocating "this locality and its beds to the
        Bostobinskaya Svita ... on the basis of a general similarity of
        lithofacies with other outcrops of the Bostobinskaya Svita in this
        region" rather than by a traced correlation, with "A Late Cretaceous
        age ... proposed (Santonian-Campanian-87-74 Ma) on the basis of
        comparative palaeobotanical observations".
    - id: rozhdestvensky1964b
    - id: rozhdestvensky1967a
    - id: shilin1982a
      notes: >
        Ties the unit to its age in defining it: "The sand-clay deposits of the
        Santonian-Campanian predominantly gray-colored or red-colored in
        appearance, widely developed in the Lower Syr Darya uplift, are
        distinguished as the Bostobine Formation", and gives the Akkurgan
        holotype horizon as "Santonian-Campanian, Bostobine Formation".
    - id: rozhdestvensky1971a
    - id: rozhdestvensky1976a
      notes: >
        Does not name this formation. The text is a turtle description
        mentioning Kazakhstan, and contains no form of the unit's name, so it
        contributes nothing to the entry's age.

Brushy Basin:
  rank: member
  parent: Morrison
  period: [Late Jurassic]
  stages: [Kimmeridgian, Tithonian]
  references:
    - id: carrano2012a
      notes: >
        Allosaurus occurs in the "Salt Wash and Brushy Basin Members, Morrison
        Formation; Kimmeridgian–Tithonian, Late Jurassic", a span given for the
        two members together. Ceratosaurus comes from the "lower Brushy Basin
        Member, Morrison Formation; Kimmeridgian–Tithonian, Late Jurassic", and
        Marshosaurus from the "Brushy Basin Member, Morrison Formation;
        Kimmeridgian, Late Jurassic".
    - id: chure2000a
      notes: >
        Uses "Brushy Basin Member, Morrison Formation" with "AGE: Kimmeridgian,
        Late Jurassic" for the material it describes.

Bull Canyon:
  rank: formation
  parent: Dockum
  period: [Late Triassic]
  stages: [Norian]
  references:
    - id: nesbitt2007a
      notes: >
        Equates the two names and gives the occurrence, "Bull Canyon Formation
        (= Cooper Canyon Formation), Dockum Group, Quay County, New Mexico" at
        "Norian, Late Triassic", for Gojirasaurus. Martz and colleagues (2013)
        withdrew the equation, and the two are entered separately.
    - id: martz2013a
      notes: >
        Withdraws that correlation. The Post Quarry assemblage had been read as
        Revueltian "largely because the Cooper Canyon Formation was accepted as
        correlative with the Bull Canyon Formation of New Mexico"; "However,
        recent lithostratigraphic revisions (Martz 2008) have cast doubt on" it.
    - id: hunt1998a
      notes: >
        Uses the other containment, "the Bull Canyon Formation (Chinle Group:
        Norian), east-central New Mexico", and records that dinosaurs form only
        a small part of its fauna.

Bull Cliff:
  rank: member
  parent: Blue Lias
  period: [Early Jurassic]
  stages: [Hettangian]
  references:
    - id: martill2016a
      notes: >
        Constrains the Dracoraptor horizon "on lithological grounds to one of
        two limestone horizons within the Blue Lias Formation of the Lower Lias
        Group ... and specifically within the lower Bull Cliff Member
        (stratigraphic terminology follows that of Simms)" in the Bristol
        Channel Basin. Records that aragonitic bivalves are absent from the
        member, whose assemblage "is thus a chemical lag dominated by calcitic
        fossils". Dates that horizon, which lies below the first Psiloceras
        planorbis and above the last Triassic conodont, against the traditional
        reading: "these strata have traditionally been regarded as Late Rhaetian
        age and are informally called the Pre-Planorbis Beds", but on isotopic,
        lithological, faunal and pollen evidence "the new dinosaur should be
        regarded as being of Early Hettangian age".

Bulldog Shale:
  rank: formation
  parent: Marree
  period: [Early Cretaceous]
  stages: [Aptian, Albian]
  references:
    - id: barrett2010b
      notes: >
        Settles which unit the Coober Pedy and Andamooka opal beds belong to:
        lithostratigraphic work "has now firmly placed the Coober Pedy and
        Andamooka opaliferous beds within the Bulldog Shale (a constituent of
        the Marree Subgroup, which was formerly called the Marree Formation)",
        against earlier readings that offered the Cadna-owie or Marree
        Formations as alternatives. Dates it "Aptian: Lower Cretaceous".
    - id: poropat2014a
      notes: >
        Gives the fuller span, "the lower Aptian to lower Albian Bulldog Shale
        of South Australia", deposited in cool marine conditions on the
        evidence of glendonites and lonestones.

Bungil:
  rank: formation
  period: [Early Cretaceous]
  stages: [Valanginian, Hauterivian, Barremian, Aptian]
  references:
    - id: molnar1980b
      notes: >
        Gives the Minmi horizon as "Minmi Member of the Bungil Formation" near
        Roma, southeast Queensland, at "Lower Cretaceous, probably Aptian",
        the material preserved in calcareous concretions and articulated when
        found.
    - id: leahey2015a
      notes: >
        Tabulates the Minmi holotype as "Minmi Member, Bungil Formation
        (Valanginian-Barremian)".
    - id: agnolín2010a
      notes: >
        Gives both readings in one paper, listing the Roma locality as "Bungil
        Formation, Aptian" in its locality map and the horizon as "Bungil
        Formation (Barremian-Valanginian: Early Cretaceous" in the systematic
        section, the latter after Scheibner and Basden (1998), a range that
        carries the formation through the Hauterivian.
    - id: scheibner1998a

Bushveld Sandstone:
  rank: formation
  period: [Late Triassic, Early Jurassic]
  dispute:
    summary: >
      Which southern African unit this correlates with is unsettled, and the
      candidates are superposed rather than adjacent, so they cannot both hold.
      Van Heerden (1979) makes it "more or less the same age as the Elliot
      Formation farther south"; Smith and colleagues (1993) instead list it
      among equivalents of the Clarens, which overlies the Elliot. Haughton
      (1924) shows why the question is hard: he treats the name as covering the
      Transvaal Stormberg entire and undivided, with no Molteno, Elliot or
      Clarens separated inside it, so a correlation to any one of them is a
      correlation to part of what the name denotes.
  references:
    - id: haughton1924a
      notes: >
        Uses it as a horizon name throughout, giving "Horizon. Bushveld
        Sandstone" for material from Wiepe and from Haakdoornbult in the
        Waterberg district, and sets out what the name covers: "The Stormberg
        Series in the Transvaal is preserved as a number of outliers, forming
        the Bushveld Series, of which the most important occur on the Springbok
        Flats".
    - id: vanheerden1979a
      notes: >
        Correlates it southward, noting that although "it is geographically far
        removed from other finds", "the Bushveld Sandstone is more or less the
        same age as the Elliot Formation farther south".
    - id: smith1993a
      notes: >
        Places it instead with the Clarens: "Biostratigraphic and lithofacies
        equivalents to the Clarens sandstone are present in the Lebombo belt
        north of Swaziland, northern Transvaal (Bushveld sandstone), Zimbabwe
        (Forest sandstone), Botswana (Bodibeng sandstone) and Namibia (Etjo
        sandstone), and a general Late Triassic to Early Jurassic age is
        inferred for these deposits as a whole."
    - id: vanhoepen1916a
      notes: >
        Places the unit rather than dating it, and works only in South African
        local units - Dwyka, Ecca, Beaufort, Stormberg, Karroo - naming no
        international stage or period anywhere. The limestone bed yielding
        Gigantoscelus "lies not far above the gravel bed of the
        'Coal-measures'" but "also apparently does not lie far from the
        Bushveld Sandstone and it may even be that it belongs to the uppermost
        part of the latter", from which the paper concludes that "Dwyka beds
        and Stormberg beds have been demonstrated in the Transvaal".

Bückeberg:
  rank: formation
  period: [Early Cretaceous]
  stages: [Berriasian, Valanginian]
  variants: [German Wealden]
  references:
    - id: hornung2012a
      notes: >
        The dedicated treatment of its dinosaur tracks, giving "The Berriasian
        Bückeberg Formation", recording that it is "traditionally referred to
        as the 'German Wealden'", and running it from the middle Berriasian
        upward.
    - id: raven2020a
      notes: >
        Gives "the Lower Cretaceous Bückeberg Formation (early Valanginian) of
        Gronau, Westfalen, northwestern Germany".
    - id: bonde2012a
      notes: >
        Correlates the Danish Late Berriasian beds with "the middle part of the
        German Wealden (Middle Bückeberg Formation, W 3-W 4 ...)" and with the
        Durlston Beds of the Upper Purbeck.

Cabaços:
  rank: formation
  period: [Middle Jurassic, Late Jurassic]
  stages: [Callovian, Oxfordian, Kimmeridgian]
  variants: [Cabaços Beds]
  references:
    - id: mateus2009b
      notes: >
        Gives "Cabaços Fm., Oxfordian, Pedrógão" for the Alocodon type,
        crediting the age to Azerêdo and colleagues (2002).
    - id: mateus2017a
      notes: >
        Records the older name and scheme, Choffat (1901) having recognized the
        Lower Lusitanian of the southern Lusitanian Basin as divided into "the
        Cabaços Beds and the Montejunto Beds".
    - id: azerêdo2002a
      notes: >
        The lowermost Upper Jurassic deposits above the basinwide Middle-Upper
        Jurassic disconformity, 40 to 150 m of pedogenic limestones, ferruginous
        or lignitic marls and clays, and lacustrine, restricted-lagoonal and
        marginal-marine marls and limestones. It "lacks good biostratigraphical
        markers, but is traditionally attributed to the Middle Oxfordian", an
        age carried by the dasycladacean Heteroporella lusitanica, whose
        basinwide occurrence is succeeded by or lateral to levels with Middle
        Oxfordian ammonites; because that alga "is virtually absent in the
        lowermost part of the formation", the base "could also encompass the
        Lower Oxfordian or even the uppermost Callovian", reaching below the
        Middle-Late Jurassic boundary.
    - id: choffat1901a
      notes: >
        Prints the unit as "Cabaco beds", singular and at bed rank, which is
        why the entry's name returns nothing from it. Places them in his
        Lusitanian Stage against the Oxfordian, "(Zone with Ammonites
        bimammatus)", at about 500 m, concluding that "Considerations ... lead
        me to regard this member as representing the zone of Peltoceras
        bimammatum". His column puts a lacuna immediately beneath these beds,
        with the Callovian below it - "The upper bed of the Callovian is formed
        by thin strata containing Cosmoceras Dunkani" - so on his reading the
        Callovian lies under a gap rather than within this unit.
    - id: schneider2009a
      notes: >
        Two layers sampled from the middle part of the formation at the
        Cesareda-Serra d'El Rei plateau carry it into the Kimmeridgian: although
        the relative errors are large, "a Late Oxfordian to Early Kimmeridgian
        age (155.3–154.4 Ma; bimammatum-platynota zones) may be derived". The
        initial transgression at Cesareda, in brackish water below those marine
        horizons, most likely occurred during the Middle Oxfordian, following
        Azerêdo and colleagues (2002).

Cabullona:
  rank: group
  period: [Late Cretaceous]
  stages: [Campanian]
  references:
    - id: serrano-brañas2016a
      notes: >
        Names the group by way of the Packard Shale Formation inside it, in
        northeastern Sonora, Mexico, "Upper Cretaceous (Campanian)".
    - id: sullivan2006c
      notes: >
        Names the Corral de Enmedio and Packard Formations as its constituents
        in Sonora, and records that correlating them "to rocks of Judithian or
        Kirtlandian age is not possible at present".

Caiuá:
  rank: group
  period: [Early Cretaceous, Late Cretaceous]
  stages: [Aptian, Albian]
  references:
    - id: fernandes2000a
      notes: >
        Erects it alongside the Bauru: the Upper Cretaceous sequence "is now
        divided in two groups, partially contemporaneous: Caiuá Group (Rio
        Paraná, Goio Erê and Santo Anastácio formations) and Bauru Group". Its
        deposits are "great dune complexes of the sand sea (Caiuá Desert)" with
        rarer "deposits of torrential rain runoff (wadis)". No stage is stated
        for the group itself.
    - id: langer2019a
      notes: >
        Independently gives it as "composed of three coeval units: the Rio
        Paraná, Goio Erê, and Santo Anastácio formations".
    - id: dias2020a
      notes: >
        Belongs to the first of the two second-order sequences into which
        Batezelli (2017) divides the Bauru Basin, "an Early Cretaceous Sequence
        1 and a Late Cretaceous Sequence 2, separated by a regional unconformity
        (Unconformity K-1). Sequence 1 is represented by eolian and fluvial
        deposits of the Caiuá Group units", the younger sequence holding the
        Araçatuba, Adamantina, Uberaba and Marília formations.
    - id: batezelli2015a
      notes: >
        "Aptian-Albian ages to the Caiuá Group" have been suggested by some
        authors, "Based on stratigraphic relationship with Bauru Group, facies
        analysis and evidences of climatic variations", after Fulfaro and
        colleagues (1999) and Dias-Brito and colleagues (2001). Its own fossil
        content is pterosaur bone fragments, tentatively tapejarid, from three
        horizons of reddish sandstone in the Goio Erê Formation.

Calcaire de Caen:
  rank: formation
  period: [Middle Jurassic]
  stages: [Bathonian]
  variants: [Calcaires de Caen]
  references:
    - id: holtz2004a
      notes: >
        Tabulates the Poekilopleuron bucklandii type as "Calcaire de Caen
        (Calvados), France | middle Bathonian", and elsewhere writes "Calcaire
        de Caen Formation" for the same unit. A reference work, and the only
        cited source giving the unit's rank and age together.
    - id: allain2002a
      notes: >
        Gives the Poekilopleuron? valesdunensis horizon as "Progracilis zone of
        the 'Calcaire de Caen' formation, Middle Jurassic (Middle Bathonian)",
        the holotype having come from the Pierre de Caen of the formation,
        "dated from the beginning of the Middle Bathonian".

Calcaires de Clerval:
  rank: formation
  period: [Late Jurassic]
  stages: [Oxfordian]
  references:
    - id: mannion2017a
      notes: >
        Gives the type horizon for Vouivria as "Calcaires de Clerval Formation,
        possibly from the Tidalites de Mouchard Member", at the Damparis quarry
        near Dole, Jura, eastern France, and dates the formation by ammonites,
        its deposition ranging "from the Rotoides to the Stenocycloides subzones
        in the region", which puts Vouivria at "late middle Oxfordian to early
        late Oxfordian, Late Jurassic". Before the fossils were assigned to this
        formation, Buffetaut (1988) "attributed the dinosaur assemblage to the
        upper Oxfordian" and Broin and colleagues (1991) "placed it in the lower
        Kimmeridgian", then in 1992 proposed "a middle Oxfordian age, at the top
        of the Transversarium zone".
    - id: buffetaut1988a
    - id: debroin1991a
    - id: debroin1992a

Calcareous Grit:
  rank: formation
  period: [Late Jurassic]
  stages: [Oxfordian]
  references:
    - id: galton1985d
      notes: >
        Gives the Priodontognathus maxilla as probably from "the Calcareous
        Grit (Oxfordian, Upper Jurassic) of Yorkshire", on Seeley (1893).
    - id: hoffstetter1957a
      notes: >
        Reaches the same unit from the matrix rather than the record, Judd and
        Etheridge finding that the Pecten fibrosus it contains "appears to
        correspond to the Calcareous Grit (Corallian) of Yorkshire; this is the
        most probable estimate, in any case the only one resting on concrete
        argumentation".
    - id: barron2012a
      notes: >
        Uses the fuller name for the lower part, the "Lower Calcareous Grit
        Formation (Oldstead Oolite Member)", which in the Hambleton Hills rests
        unconformably on the Osgodby Formation.
    - id: seeley1893a
      notes: >
        Names no stage: the paper's terms are lithostratigraphic throughout -
        Coralline Oolite, Corallian, Calcareous Grit, Oxford Clay - and it
        contains no Oxfordian and no Jurassic. The parenthesis "(Oxfordian,
        Upper Jurassic)" that Galton (1985) attaches when citing this paper is
        his modernisation, not Seeley's wording.
        It is the primary for the matrix attribution: "There was no evidence of
        the stratigraphical position of the fossil other than the matrix in
        which it was contained which resembled Calcareous Grit, and a fossil
        within it which is a typical example of the variety of Pecten vagans,
        named P. fibrosus. On this evidence Professor Judd, F.R.S., and Mr. R.
        Etheridge, F.R.S. ... suggested that the fossil was from the Calcareous
        Grit of Yorkshire."
        The paper concerns two specimens and only one has a locality. The femur
        is from a quarry near Slingsby with an 1838 label quoted in full; the
        maxilla has no stratigraphic evidence beyond the matrix and no
        traceable earlier history. Seeley only raises the possibility that they
        are one animal - "It is possible that it may be a portion of the head
        of the Slingsby reptile ... If this suggestion should be supported by
        further evidence" - so the maxilla does not inherit the Slingsby
        locality.

Calizas de La Huérguina:
  rank: formation
  period: [Early Cretaceous]
  stages: [Barremian]
  variants: [La Huérguina]
  references:
    - id: pittman2020a
      notes: >
        An appendix locality table gives "Calizas de la Huérguina Formation
        (128.5–125 Ma)" for the Las Hoyas enantiornithines, with no error stated
        on either end. Converted against this project's own stage boundary
        table, that span opens in the Hauterivian and closes in the Barremian,
        crossing the boundary at 125.77 Ma.
    - id: ortega2010a
      notes: >
        Gives "Calizas de La Huérguina Formation, Upper Barremian (Lower
        Cretaceous); La Cierva township, Cuenca, Spain", for the Las Hoyas site.
        In the Spanish construction "Calizas de" is the head noun, not an
        appended rank word. The disagreement that remains is below stage level:
        this reading is upper Barremian where Perez-Moreno and colleagues (1994)
        give lower.
    - id: carrano2012a
      notes: >
        Independently gives "Las Hoyas locality, La Cierva township, Cuenca,
        Spain; Calizas de La Huérguina Formation; late Barremian, Early
        Cretaceous".
    - id: pérez-moreno1994a
      notes: >
        Dates the Las Hoyas fossil site, which yielded the Pelecanimimus
        holotype, as "Calizas de La Huérguina Formation, Upper Hauterivian–Lower
        Barremian (Lower Cretaceous)". This is the only Hauterivian reading for
        the unit and nothing has re-asserted it since; later work places the
        site in the Barremian.

Camarillas:
  rank: formation
  period: [Early Cretaceous]
  stages: [Barremian]
  references:
    - id: ruiz-omeñaca2012a
      notes: >
        Gives the "Camarillas Formation, which is Barremian".
    - id: verdú2017a
      notes: >
        Places it in the local succession as "Camarillas Formation (lower
        Barremian)", above the El Castellar and below the Artoles, Morella and
        Areniscas de las Parras de Martín formations. The Iguanodon galvensis
        material at Galve comes from its "lower Barremian (Lower Cretaceous)
        deposits", an age drawn from charophytes, ostracods and palynology.

Cambridge Greensand:
  rank: member
  parent: West Melbury Marly Chalk
  period: [Early Cretaceous, Late Cretaceous]
  stages: [Albian, Cenomanian]
  references:
    - id: raven2020a
      notes: >
        Gives the rank and parent outright: "Cambridge Greensand Member of the
        West Melbury Marly Chalk Formation (Cenomanian".
    - id: barrett2020a
      notes: >
        Gives the age and the reworking that makes its fauna older than its
        matrix: the member "(lower Cenomanian: Upper Cretaceous) has yielded a
        diverse fauna of terrestrial and marine tetrapods, whose remains are
        largely reworked from the underlying Gault Formation (upper Albian".

Cancha de Bochas:
  rank: member
  parent: Ischigualasto
  period: [Late Triassic]
  stages: [Carnian]
  references:
    - id: martínez2025a
      notes: >
        Gives "Cancha de Bochas Member, Ischigualasto Formation, late Carnian".
    - id: alcober2010a
      notes: >
        The Sanjuansaurus type horizon, in the member "40 m above the base of
        the Ischigualasto Formation", is given as "Late Triassic, Carnian (ca.
        231.4 Ma)" and "lies at approximately the same level as the dated ash,
        which implies a late Carnian age for the specimen."

Candeleros:
  rank: formation
  parent: Neuquén
  period: [Late Cretaceous]
  stages: [Cenomanian]
  references:
    - id: calvo1999a
      notes: >
        Dates the unit at member rank under the older scheme, as "the Candeleros
        Member of the Rio Limay Formation", whose "age of this Member has been
        dated as Albian based on the vertebrate fauna". The Albian-Cenomanian
        that dinosaur tracks had given the member is narrowed in the same
        paragraph, a more primitive vertebrate fauna and new African discoveries
        allowing the author "to confirm that this member is Albian in age", and
        an Araripesuchus closely related to a species from the Middle Albian
        Romualdo Member is taken to imply "an Albian age for the Candeleros
        Member". Every age given here is reached by faunal correlation rather
        than by dating the rock.
    - id: hugo2001a
      notes: >
        Assigns the Candeleros Formation to the Lower Cenomanian on the General
        Roca sheet: its base must post-date the Principal Miránica unconformity,
        correlated with a global discontinuity placed in the Lower Cenomanian at
        97 ± 3 Ma, and "consequently, this unit is assigned to the Lower
        Cenomanian". The sheet's stratigraphic chart carries the unit under the
        Cenomanian at the base of the Río Limay Subgroup, and the subgroup as a
        whole is assigned to the Cenomanian-lower Turonian.
    - id: garrido2010a
      notes: >
        Assigns the formation a Lower Cenomanian age - "On the basis of the
        existing information, the Candeleros Fm. is assigned a Lower Cenomanian
        age" - resting it on zircon dating that puts the start of deposition
        above the δ1 unconformity in the basal Cenomanian and on the Main
        Miranic (Patagonídica) Unconformity beneath it, placed in the
        Cenomanian. Calvo (1991) had put the same deposits in the Albian from
        vertebrate ichnology; that reading is reported and then set aside. A
        figure caption contrasts "the Candeleros Formation (Cenomanian) and the
        Lohan Cura Formation (Albian)", the Albian unit being the one it rests
        on south of the Huincul Ridge.
    - id: carballido2010a
      notes: >
        Traces a taxon to it and dates it: the formation "can with a good
        measure of certainty be pinpointed as the unit of origin of
        Rayososaurus agrioensis, inferring for this an age within the early
        Cenomanian".
    - id: riguetti2022a
      notes: >
        Independently gives "Candeleros Formation (Cenomanian".

Cannonball:
  rank: member
  parent: Öösh
  period: [Early Cretaceous]
  references:
    - id: rougier2001a
      notes: >
        Gives the containment under the older spelling of the formation,
        "Cannonball Member of Oshih Formation of Berkey and Morris (1927),
        possibly equivalent of Tevsh Formation (Undurukhin),
        Valanginian-Neocomian", and places the mammal material in "the middle
        section of the gray-whitish Cannonball Member at the Oshih Depression".
    - id: andres2005a
      notes: >
        Dates the beds themselves rather than the formation, and as alternatives
        rather than a span: "LOCALITY AND HORIZON: ''Cannonball'' beds of the
        Oosh Formation (type area) ... AGE: Early Cretaceous
        (Berriasian-Valanginian or Aptian-Albian)." The two ranges do not touch,
        and the paper holds them apart.

Cape Lamb:
  rank: member
  parent: Snow Hill Island
  period: [Late Cretaceous]
  stages: [Campanian, Maastrichtian]
  dispute:
    summary: >
      Which formation contains it is not settled, and one paper gives both
      answers. Rozadilla and colleagues (2016) correlate an ornithopod level "to
      Snow Hill Island Formation, Cape Lamb Member, NG Sequence, Gunnarites
      Assemblage 10", and elsewhere in the same paper give a horizon as "Cape
      Lamb Member of the Lopez de Bertodano Formation (Maastrichtian)". Motta
      and colleagues (2025) use the Snow Hill Island reading.
  references:
    - id: ely2019a
      notes: >
        Dates it directly: "The Cape Lamb Member on Vega Island ... contains the
        lower part of the Maastrichtian Stage in Antarctica, based on an
        isotopic date of 71.0 +/- 0.2 Ma".
    - id: rozadilla2016a
      notes: >
        Gives both parent formations, and dates the member early Maastrichtian
        on the Gunnarites antarcticus ammonite assemblage.
    - id: motta2026a
      notes: >
        Gives the Imperobator horizon in the James Ross Basin as "the Snow Hill
        Island Formation (Cape Lamb Member; late Campanian–early
        Maastrichtian)".
    - id: motta2025a
      notes: >
        Gives the lower Maastrichtian and no Campanian: the Imperobator
        antarcticus remains are "from the Cape Lamb Member (lower
        Maastrichtian) of the Snow Hill Island Formation, Antarctica", repeated
        in the Spanish abstract.

Carbon:
  rank: member
  parent: Horseshoe Canyon
  period: [Late Cretaceous]
  stages: [Maastrichtian]
  references:
    - id: eberth2012a
      notes: >
        An estimated age range of "∼68.4–67.5 Ma" spans the member, which
        "Ranges from the upper one-half of the 31n magnetochron to the lowermost
        30n magnetochron"; no error is published on either end. Both ends fall
        inside the Maastrichtian on this project's own stage boundary table.
    - id: eberth2020a
      notes: >
        Assesses Eotriceratops xerinsularis "from the Carbon Member" at 68.8
        Ma, and places the Albertosaurus bonebed near the top of the underlying
        Tolman Member, about 8 m below the Tolman-Carbon member contact.

Carnosaur:
  rank: bed
  informal: true
  parent: Lameta
  period: [Late Cretaceous]
  stages: [Maastrichtian]
  references:
    - id: carrano2008a
      notes: >
        Gives the occurrence in full: "Bara Simla Hill, Jabalpur, Madhya
        Pradesh, India; 'Carnosaur Bed', 'infratrappean beds' of the Lameta
        Formation; Maastrichtian, Late Cretaceous (Matley 1921)". Both this
        paper and Walker keep the name in quotation marks, and it traces to
        Matley (1921) rather than to a formal erection, which is why it carries
        `informal`.
    - id: walker1964a
      notes: >
        Records what the name denotes: Matley "gave an account of the discovery
        of a large mass of bones from a single spot, the 'Carnosaur Bed' of Bara
        Simla Hill, Jubbulpore". A single quarry horizon rather than a mappable
        unit.
    - id: matley1921a

Castrillo de la Reina:
  rank: formation
  period: [Early Cretaceous]
  stages: [Barremian, Aptian]
  references:
    - id: torcidafernández-baldor2011a
      notes: >
        Gives "Castrillo de la Reina Formation (Late Barremian-Early Aptian),
        Burgos, Spain".
    - id: dieudonné2026a
      notes: >
        Independently gives "the upper Barremian to lower Aptian (Lower
        Cretaceous) Castrillo de la Reina Formation", whose continental
        sediments lie mostly near Salas de los Infantes, and supports that age
        through the laterally contiguous Leza Formation, whose marine-influenced
        top, following Suárez-González (2015), might correspond to sea-level
        peaks generally dated in the middle to upper part of the lower Aptian.
    - id: suárez-gonzález2015a

Caturrita:
  rank: formation
  period: [Late Triassic]
  stages: [Carnian, Norian]
  references:
    - id: müller2023a
      notes: >
        Gives the older reading, that the formation "is considered early
        Norian".
    - id: peyredefabrègues2015a
      notes: >
        Tabulates material from it as "Late Triassic (Norian-Rhaetian", west of
        Candelária, Rio Grande do Sul.
    - id: leal2004a
      notes: >
        Gives the Unaysaurus site at Água Negra, near Santa Maria, as "Late
        Triassic (Carnian-Norian) Caturrita Formation", crediting Andreis and
        colleagues (1980), and puts the formation at "c. 225 million years old".
        Sets it above the Carnian Santa Maria Formation.
    - id: andreis1980a

Cañadón Asfalto:
  rank: formation
  period: [Early Jurassic, Middle Jurassic, Late Jurassic]
  stages: [Toarcian, Aalenian, Bajocian, Bathonian, Callovian, Oxfordian]
  references:
    - id: pol2020a
      notes: >
        Dates the base directly. The Bagualia bone bed, "positioned close to
        the base of the Cañadón Asfalto Formation", gives 179.17 +/- 0.12 Ma by
        CA-ID-TIMS on zircon -- "Early Jurassic, Toarcian".
    - id: cúneo2013a
      notes: >
        The older reading, and the top of the envelope: the formation "has been
        traditionally considered Middle to Late Jurassic (Callovian-Oxfordian)
        in age mainly based on its record of freshwater invertebrates" and
        plants. Reports Salani's (2007) whole-rock K-Ar date of 170.9 +/- 4.4 Ma
        (Aalenian-Bajocian) from the basal formation and U-Pb zircon dates of
        161 +/- 3 Ma. Its own U-Pb CA-TIMS dates give "a mid-late Toarcian to
        Aalenian (-Bajocian?) age for the Cañadón Asfalto Formation", and the
        middle to upper sections, above the uppermost basalt flow at Cerro
        Cóndor, "can now be considered essentially early Middle Jurassic in age
        (Aalenian to probably Bajocian)". Names two members, "lower
        lacustrine/tuffaceous (Las Chacritas)" and "upper siliciclastic fluvial
        (Puesto Almada)".
    - id: salani2007a
    - id: holwerda2021a
      notes: >
        "The early Middle Jurassic (Toarcian-Bajocian, possibly earliest
        Bathonian) Cañadón Asfalto Formation" conformably overlies the
        Pliensbachian to early Toarcian Lonco Trapial Formation, and "the
        youngest radiometric age for this formation has been given as
        Bajocian-Bathonian" by Cabaleri and colleagues (2010). The Patagosaurus
        holotype comes from Cerro Cóndor North, in beds "dated to latest
        Early–Middle Jurassic".

Cañadón Calcáreo:
  rank: formation
  period: [Late Jurassic]
  stages: [Oxfordian, Kimmeridgian, Tithonian]
  references:
    - id: rauhut2017a
      notes: >
        The formation is a unit of terrestrial sediments deposited in the
        Cañadón Asfalto Basin during its post-rift phase, with a mainly
        lacustrine basal part followed by fluvial and overbank deposits, and is
        dated "Late Jurassic (Oxfordian–Tithonian)" — in the body,
        "Oxfordian–?Tithonian". A tuff at the top of the lacustrine section at
        Puesto Almada "has recently been dated at 157 Ma (latest Oxfordian;
        Cúneo et al., 2013)", and although other workers assign that section to
        a Puesto Almada Member of the Cañadón Asfalto Formation instead, "there
        is agreement in the Late Jurassic age of these rocks". Besides the
        theropod described here it has yielded diplodocoid and macronarian
        neosauropods, basal crocodylomorphs, and coccolepid and basal teleost
        fishes.
    - id: reutter2026a
      notes: >
        Gives the Bicharracosaurus horizon as "Higher parts of the Cañadón
        Calcáreo Formation, Oxfordian-Kimmeridgian, Late Jurassic", following
        Cúneo and colleagues (2013), and says the base "was dated (157.4 Mya) to
        the Oxfordian-Kimmeridgian boundary".
    - id: carballido2011a
      notes: >
        Dates it "most probably Oxfordian-Tithonian".
    - id: cúneo2013a
      notes: >
        Reports the Early Cretaceous reading and rejects it: the palynofloral
        assemblage "that was once considered to be early Cretaceous in age, is
        now entirely constrained to the Late Jurassic". Sets the two sides out
        first - Late Jurassic on the vertebrates, "Early Cretaceous on the basis
        of its palynofloral and invertebrate contents" - and then finds the Late
        Jurassic "supported by the new U-Pb geochronologic results".

Cañón del Colorado:
  rank: formation
  period: [Late Triassic, Early Jurassic]
  stages: [Hettangian, Sinemurian, Pliensbachian, Toarcian]
  references:
    - id: martínez2009a
      notes: >
        Gives the Adeopapposaurus horizon as "the Upper Pelitic Member ... of
        the Lower Jurassic Cañón del Colorado Formation", from outcrops in the
        southwestern Sierra de Mogna, San Juan, northwestern Argentina. Gives
        only the series.
    - id: barrett2019a
      notes: >
        Independently gives "the Cañón del Colorado Formation (Lower Jurassic)
        of Argentina".
    - id: apaldetti2011a
      notes: >
        Sets it beside the Norian units of the region, the Los Colorados,
        Laguna Colorada and Quebrada del Barro, as the Lower Jurassic one.
    - id: martínez2011b
      notes: >
        Assigns the formation "an Early Jurassic age (Hettangian-Toarcian)",
        from the Adeopapposaurus remains in its middle member and the Hettangian
        to Toarcian biochron of Massospondylus, its sister taxon; the paper also
        formally divides the unit into lower, middle and upper members. It
        reviews the older Triassic reading, in which "Casamiquela and Miolano
        (1983) assigned it an Upper Triassic age" from prosauropod vertebrae and
        Milana and colleagues (1995) "assigned this formation to the Upper
        Triassic".
    - id: casamiquela1983a
    - id: milana1995a
      notes: >
        The formation "has been assigned a Tertiary age but lies above the
        Patquia Formation of Late Permian age". The paper reports its new Sierra
        de Mogna locality, 60 km north of San Juan, which has yielded two
        partial skeletons of a plateosaurid-type prosauropod, as of Upper
        Triassic-Lower Jurassic age: "Age determination is based on the known
        stratigraphic range of plateosaurids; however, the authors are inclined
        to a Late Triassic age assignment based on regional geologic
        considerations."

Cedar Mountain:
  rank: formation
  period: [Early Cretaceous, Late Cretaceous]
  stages: [Berriasian, Valanginian, Hauterivian, Barremian, Aptian, Albian, Cenomanian]
  references:
    - id: sprinkel2012a
      notes: >
        In central and southern Utah the formation is "Barremian(?) to earliest
        Cenomanian based on dinosaur biostratigraphy" and radiometric data,
        while in northeastern Utah "Its age in northeastern Utah is early to
        late Albian", resting on a detrital zircon age of 104.46 +/- 0.95 Ma
        associated with the Abydosaurus skull and on palynology from the
        overlying Dakota Formation. Sprinkel and colleagues also hold that these
        northeastern beds are not time equivalent to the Mussentuchit Member of
        the western San Rafael Swell, so the Albian age applies to the region
        rather than to the whole unit.
    - id: mori2009a
      notes: >
        Detrital zircon brackets run member by member: "the Yellow Cat/Poison
        Strip Members range from 125 to 121 Ma (Early Aptian)", "the Ruby Ranch
        Member ranges from 120 - 117 Ma to 111 Ma (Late Aptian to earliest
        Albian)", and "the Mussentuchit Member ranges from about 109 - 105 Ma to
        99 to 96 Ma (mid-Albian to mid-Cenomanian) and perhaps as young as 91 Ma
        (Turonian)". Anomalously young zircons from the overlying Dakota
        Sandstone leave Mori willing to let the Mussentuchit fauna "range to
        late Cenomanian or early Turonian", a limit he says needs checking in a
        future study. Earlier plant biostratigraphy had put the whole formation
        "between Barremian and Cenomanian".
    - id: kirkland2007a
      notes: >
        Paleontological and geological evidence "suggests an age range of
        Albian-Barremian is represented in the Cedar Mountain Formation", while
        an ash within the uppermost Mussentuchit Member "indicates an early
        Cenomanian age" and correlates with the Mowry Shale "near the base of
        the Upper Cretaceous". Kirkland and Madsen argue against extending the
        name to the basal Cretaceous of southwestern Utah, because those
        conglomerates are not contiguous with the type area and were derived
        from different source areas.
    - id: kirkland2016a
      notes: >
        Gives the naming history and the basal member: "Stokes (1952) renamed
        the shale the Cedar Mountain Formation and included the Buckhorn
        Conglomerate Member as its basal member", on a type section "on the
        southwest flank of Cedar Mountain at the north end of the San Rafael
        Swell". Its southwestern Utah exposures are "of latest Albian to
        earliest Cenomanian" age; the formation as a whole is older at the base.

Cerro Barcino:
  rank: formation
  parent: Chubut
  period: [Early Cretaceous, Late Cretaceous]
  stages: [Hauterivian, Barremian, Aptian, Albian, Cenomanian, Turonian,
    Coniacian, Santonian, Campanian]
  references:
    - id: carrano2012a
      notes: >
        Gives a member inside it, "the Albian-Cenomanian Bayo Overo Member of
        the Cerro Barcino Formation at Paso de Indios".
    - id: rauhut2004a
      notes: >
        Places it in its group and puts the probable source of Genyodectes in
        "the lower part of the Cerro Barcino Formation (Chubut Group;
        Aptian-Albian)". Dates its lower two units as "the Puesto la Paloma
        (Barremian-Aptian) and Cerro Castaño (Aptian-Albian) members", and gives
        the Genyodectes horizon as "?Cerro Castaño Member, Cerro Barcino
        Formation; Aptian-Albian, Lower Cretaceous".
    - id: canale2014a
      notes: >
        Uses the narrower "Cerro Barcino Formation (Albian" for the Cerro
        Castaño Member, while the formation as a whole "has been regarded as
        Hauterivian to Senonian (Campanian?) in age" after Page and colleagues
        (1999).

Cerro Carnerero:
  rank: formation
  parent: Lonco Trapial
  period: [Early Jurassic, Middle Jurassic]
  stages: [Pliensbachian, Toarcian, Aalenian, Bajocian]
  dispute:
    summary: >
      The age is openly unsettled and no radiometric date resolves it. Rauhut
      (2003) gives "the Cerro Carnerero Formation (Toarcian-Bajocian)" and
      records that the age "is still uncertain. Although usually cited as
      Bajocian ..., it has also been regarded as Early Jurassic by some
      authors". Pol and colleagues (2022) give "Pliensbachian-early Toarcian"
      and repeat that the unit "has been regarded as Early to Middle Jurassic by
      different authors". Upchurch and colleagues (2004) tabulate it as Bajocian
      alone.
  references:
    - id: rauhut2003c
      notes: >
        Reviews the Amygdalodon type material, gives the Toarcian to Bajocian
        reading, and places the unit as "the basal formation of the Lonco
        Trapial Group". Citing Page and colleagues (1999) that volcanism in the
        area started in the Aalenian, it narrows the estimate: "a late Toarcian
        to Aalenian age seems to be most likely for the Cerro Carnerero
        Formation, but more data is needed to confirm this".
    - id: pol2022a
      notes: >
        Gives the older reading, "the Cerro Carnerero Formation
        (Pliensbachian–early Toarcian)", for the earliest South American
        Jurassic sauropod, from Cañadón Puelman southwest of Cerro Carnerero,
        Chubut. It notes the unit "has been regarded as Early to Middle Jurassic
        by different authors" and, from Pliensbachian ammonites in underlying
        horizons and the overlying Lonco Trapial Formation dated at 185 Ma,
        concludes it is likely that it "was deposited at some point during the
        Pliensbachian or the early Toarcian".
    - id: upchurch2004a
      notes: >
        A reference work, tabulating the unit as Bajocian.
    - id: page1999a

Cerro Castaño:
  rank: member
  parent: Cerro Barcino
  period: [Early Cretaceous]
  stages: [Aptian, Albian]
  references:
    - id: rauhut2004a
      notes: >
        Places it in the formation's internal order: the outcropping Chubut
        Group includes "the lowermost Los Adobes Formation
        (Hauterivian-Barremian) and the lower two units of the Cerro Barcino
        Formation, the Puesto la Paloma (Barremian-Aptian) and Cerro Castaño
        (Aptian-Albian) members".
    - id: canale2014a
      notes: >
        Gives the Tyrannotitan type horizon as "Cerro Castaño Member, Cerro
        Barcino Formation, Albian", at the La Juanita farm.
    - id: carrano2012a
      notes: >
        Independently gives "Cerro Castaño Member, Cerro Barcino Formation;
        Aptian-Albian, Early Cretaceous".

Cerro Fortaleza:
  rank: formation
  period: [Late Cretaceous]
  stages: [Campanian, Maastrichtian]
  references:
    - id: novas2019a
      notes: >
        Gives the age and the open question beside it: the dinosaur-bearing
        deposits of the "Cerro Fortaleza Formation (radimetrically dated as
        Campanian; Sickman et al., 2018)", and asks whether the Chorrillo
        Formation is equivalent to it.
    - id: sickmann2018a
      notes: >
        Detrital zircon from samples "throughout the terrestrial Cerro Fortaleza
        Formation" between Lago Viedma and Lago Argentino gives "maximum
        depositional ages throughout the Campanian", the highest at 76.2 +/- 1.6
        Ma, and the paper calls the unit "Campanian-Maastrichtian(?)". In the
        southeast of its study area the Eocene Man Aike Formation rests
        unconformably "on Campanian to Maastrichtian rocks (Cerro Fortaleza
        Formation)".
    - id: santucci2022a
      notes: >
        Gives the Dreadnoughtus holotype and paratype as from the "Cerro
        Fortaleza Formation, Magallanes-Austral Basin, Campanian-Maastrichtian
        (Upper Cretaceous", following Sickmann and colleagues (2018), but the
        Puertasaurus type locality as "Cerro Fortaleza Formation (=Pari Aike
        Formation), Magallanes-Austral Basin, Campanian (Upper Cretaceous)".

Cerro Lisandro:
  rank: formation
  parent: Neuquén
  period: [Late Cretaceous]
  stages: [Cenomanian, Turonian]
  references:
    - id: leanza2004a
      notes: >
        Places it in its subgroup and dates it: the Río Limay Subgroup "is
        composed of the Candeleros, Huincul and Cerro Lisandro formations, with
        a thickness of at least 350 m", and "the age of the Cerro Lisandro
        Formation can be regarded as Late Cenomanian-Early Turonian".
    - id: gonzálezriga2013a
      notes: >
        Gives "the Cerro Lisandro Formation (middle-late Turonian, Upper
        Cretaceous)".
    - id: garrido2010a
      notes: >
        With neither absolute dates nor biostratigraphy for the unit, the age is
        taken from its stratigraphic relationships: "Fm. Cerro Lisandro is
        tentatively assigned in this work to the Middle – Upper Turonian". Hugo
        and Leanza (2001) and Leanza and colleagues (2004) instead "place this
        unit between the Late Cenomanian and the Early Turonian", and the 91 to
        90 Ma of Legarreta and Gulisano (1989) would make it Middle Turonian.
    - id: legarreta1989a
    - id: hugo2001a
      notes: >
        Sets out the Neuquen Group's three subgroups with a span for each: "the
        Cenomanian-lower Turonian Limay Subgroup comprising the Candeleros,
        Huincul and Cerro Lisandro Formations; the upper Turonian-Coniacian Rio
        Neuquen Subgroup including the Portezuelo and Plottier Formations; and
        the Santonian-lower Campanian Rio Colorado Subgroup comprising the Bajo
        de la Carpa and Anacleto Formations." The statement is made twice in
        identical terms, and dates the group as a whole "from early Cenomanian
        (97 plus or minus 3 Ma) to early Campanian (74 plus or minus 3 Ma)".

Cerro del Pueblo:
  rank: formation
  period: [Late Cretaceous]
  stages: [Campanian, Maastrichtian]
  references:
    - id: longrich2024b
      notes: >
        The formation "is dated to the end of the Campanian".
    - id: serrano-brañas2025a
      notes: >
        Independently places the type locality of Mexidracon in "Campanian
        (Upper Cretaceous) strata of the Cerro del Pueblo Formation of the
        Difunta Group", and writes that the coastal plain in which the formation
        was deposited "developed during the Late Campanian (ca. 72.5 Ma)".
    - id: sullivan2006c
      notes: >
        Records that the formation, previously "considered early Maastrichtian
        in age", is "now considered to be of late Campanian age" on
        magnetostratigraphy and ammonite correlation. On its own revised
        Kirtlandian it is "early Edmontonian age (=latest Campanian)", with the
        lower part possibly correlative to the latest Kirtlandian.

Chalk:
  rank: group
  period: [Late Cretaceous]
  stages: [Cenomanian, Turonian, Coniacian, Santonian, Campanian, Maastrichtian]
  references:
    - id: hopson2005a
      notes: >
        The dedicated lithostratigraphy, which defines the group and its
        internal divisions including the Grey Chalk Subgroup that holds the West
        Melbury Marly Chalk, and gives the group's age as "Upper Cretaceous,
        Cenomanian to Maastrichtian." Records that the Hunstanton Formation,
        though a formation, is "not part of the newly defined Chalk Group, and
        as defined it is older than the major hiatus at the base of the
        Cenomanian".

Chaochuan:
  rank: formation
  parent: Yongkang
  period: [Early Cretaceous, Late Cretaceous]
  stages: [Aptian, Albian, Cenomanian]
  references:
  - id: chen2013a
    notes: >
      Second of the three formations of the Yongkang Group in the Yongkang Basin
      of Zhejiang, above the Guantou and below the Fangyan, and a lacustrine
      purplish sandstone with interbedded igneous rock. Radiometric dates range
      from 105 to 96 Ma, an Albian to Cenomanian span, and fossil comparison
      places deposition in the early Late Cretaceous; the Dongyangopelta horizon
      is given as "Late Early to early Late Cretaceous (Albian - Cenomanian)".
  - id: zheng2012a
    notes: >
      Reports dates of 101 to 96 Ma and treats the Chaochuan, Liangtoutang
      and Lanxi Formations as stratigraphically and temporally equivalent on
      faveoloolithid egg taxa, with paleomagnetic support for the Chaochuan
      to Liangtoutang correlation.
  - id: oyabu2026a
    notes: >
      Repeats the Albian to Cenomanian span for the formation in Zhejiang.
  - id: pond2023a
    notes: >
      Calls it "the Albian–Aptian Chaochuan Formation", the source of
      Zhejiangosaurus and Dongyangopelta.

Charmouth Mudstone:
  rank: formation
  period: [Early Jurassic]
  stages: [Sinemurian, Pliensbachian]
  references:
    - id: norman2019a
      notes: >
        Gives "Charmouth Mudstone Formation (Upper Sinemurian)" for
        Scelidosaurus, resolved within it to the Black Ven Marl Member and the
        Asteroceras obtusum Zone.
    - id: yao2022a
      notes: >
        Gives "Sinemurian-early Pliensbachian, Charmouth Mudstone Formation,
        UK".
    - id: naish2007a
      notes: >
        Records that ammonites place most Scelidosaurus specimens in "the
        Woodstone Nodule Bed in the Charmouth Mudstone Formation", and that the
        articulated skeleton came from the Black Ven landslip between Lyme
        Regis and Charmouth.
    - id: sánchez-fenollosa2025a
      notes: >
        Independently gives "Charmouth Mudstone Formation, late Sinemurian,
        UK".

Chilson:
  rank: member
  parent: Lakota
  period: [Early Cretaceous]
  stages: [Berriasian, Valanginian]
  references:
    - id: boyd2015b
      notes: >
        Names it the basal of the Lakota Formation's three members, before the
        Minnewaste Limestone and the Fuson, and equates it with "Unit L1 ...
        recognized by a predominance of interbedded siltstone and mudstone, and
        numerous coal beds".
    - id: farke2014a
      notes: >
        Suggests that the pre-Aptian basal part of the Cloverly Formation may
        correlate with "the lower Lakota (L1 interval or Chilson Member)
        Formation, Wyoming and South Dakota, and the lower Cedar Mountain
        (Yellow Cat Member) Formation, Utah, both of which may be as old as
        Berriasian–Valanginian".
    - id: sohn1979a
      notes: >
        Places the ostracode faunule that Roth (1933) assumed came from the
        Morrison Formation in this member: "the faunule is from Lower Cretaceous
        rocks and belongs in the Chilson Member of the Lakota Formation,
        probably Unit 2". It estimates the timespan of the member's
        ostracode-bearing rocks as "less than 10 m.y., somewhere between 118
        m.y. and 128 m.y. before the present".
    - id: roth1933a
    - id: cifelli2014a
      notes: >
        The type horizon of the new mammals from Hell Canyon, Fall River County,
        is the "Chilson Member, Lakota Formation (Lower Cretaceous: upper
        Berriasian–Valanginian)". The lower part of Chilson Member unit 2 in the
        southern Black Hills "has been comparatively well sampled
        micropaleontologically", and age constraints for that part of the
        section "are late Berriasian–Valanginian"; no ostracods or charophytes
        are known from unit 1 beneath it, and "upper age constraints for the
        member remain to be firmly established".

Chinle:
  rank: formation
  period: [Late Triassic]
  stages: [Carnian, Norian, Rhaetian]
  references:
    - id: hunt1998a
      notes: >
        Chinle Group strata "range from late Carnian (early Tuvalian) to
        Rhaetian in age", a span Hunt and colleagues credit to Lucas and divide
        into four land-vertebrate faunachrons running from the Otischalkian up
        to the Apachean, which they equate with the Rhaetian. They work at group
        rank throughout, uniting "All Upper Triassic nonmarine strata in the
        western United States" in the Chinle Group and dividing it into about 25
        formations; the name Chinle Formation appears in the paper only in the
        titles of works they cite.
    - id: martz2017a
      notes: >
        Puts the base of the Chinle Formation at roughly the base of the Norian,
        the Tr-3 unconformity beneath it being "a major erosional hiatus" that
        "may make the base of the Chinle Formation roughly equivalent to the
        base of the Norian stage". The Apachean interval that takes in the
        formation's uppermost members runs from about 207 to 202 Ma "during the
        Rhaetian", and the Triassic-Jurassic boundary, "well calibrated at 201.3
        Ma", "may lie between the Dinosaur Canyon Member and the overlying
        Whitmore Point Member ... or even higher in the Whitmore Point Member",
        both in the Moenave Formation above.
    - id: lucas1992a
      notes: >
        Treats the unit at group rank in the Chama Basin and north-central New
        Mexico and dates it outright: these strata "are assigned to the Middle
        Triassic Moenkopi Formation and the Upper Triassic Chinle Group". Its
        youngest division there, the Rock Point Formation, carries a new
        phytosaur genus and "a diverse body of evidence suggests that these
        strata are of late Norian/Rhaetian age", and the group is truncated
        above by post-Triassic, pre-Entrada erosion beneath the Middle Jurassic
        Entrada Sandstone.
    - id: cather2013a
      notes: >
        Tests the group-rank scheme against mapping and rejects it. Lucas and
        colleagues "raised the Chinle to group rank, broadened its geographic
        extent, and raised numerous units within it to formation rank.
        Subsequent mapping has demonstrated, however, that many of these new
        formation-rank units are not viable map units and that the Chinle
        should be considered a formation, not a group, in much of New Mexico."
        Even where the Chinle is divisible, the map units "do not correspond
        well to the various formations previously proposed by stratigraphers".
    - id: tykoski2004a
      notes: >
        Tabulates material from it at both "late Carnian" and "late Norian",
        which is most of the span.
    - id: srivastava2026a
      notes: >
        Carries the youngest bound, the Chama Basin exposures being "of latest
        Triassic age, possibly Rhaetian".
    - id: sues2025a
      notes: >
        Pairs the formation with the Norian in the American Southwest.

Chipping Norton Limestone:
  rank: formation
  parent: Great Oolite
  period: [Middle Jurassic]
  stages: [Bajocian, Bathonian]
  references:
    - id: barron2012a
      notes: >
        The lithostratigraphic framework entry, giving the parent as the Great
        Oolite Group and the age as "Bajocian-Bathonian, Parkinsoni Zone to
        Zigzag Zone", and listing Chipping Norton Limestone and Chipping Norton
        Formation among previous names.
    - id: benson2010c
      notes: >
        Resolves material within it to a member and an ammonite zone, the "Hook
        Norton Limestone Member of the Chipping Norton Limestone Formation
        (lowest Bathonian, Zigzag ammonite zone) of New Park Quarry".
    - id: benson2010a
      notes: >
        Gives "the Chipping Norton Limestone Formation (Middle Jurassic: Lower
        Bathonian) of Cross Hands Quarry, near Little Compton, Warwickshire".

Chorrillo:
  rank: formation
  period: [Late Cretaceous]
  stages: [Campanian, Maastrichtian]
  references:
    - id: novas2019a
      notes: >
        Gives "The Chorrillo Formation (Upper Cretaceous,
        Campanian-Maastrichtian", crediting Arbe (2002) and Nullo and colleagues
        (2006), and sets it in the local succession as "the upper
        Campanian-lower Maastrichtian Chorrillo Formation". Leaves open whether
        it "is equivalent or not with the dinosaur-bearing, continental deposits
        of the Cerro Fortaleza Formation".
    - id: motta2026a
      notes: >
        Gives "Chorrillo Formation (Late Cretaceous, Maastrichtian".
    - id: arbe2002a
    - id: nullo2006a

Chuanjie:
  rank: formation
  period: [Middle Jurassic]
  stages: [Aalenian, Bajocian, Bathonian]
  references:
    - id: fang2000a
      notes: >
        Fang and colleagues erect the Chuanjie Formation for units 21-35 of the
        Laochangqing-Dajianfeng section, carry it as J2 throughout, and give the
        type horizon of Chuanjiesaurus a'naensis as "Lower Middle Jurassic
        Chuanjie Fm. at Laochangqing, Chuanjie Township, Lufeng Co. Yunnan
        Province". The unit "disconformably overlies the Zhangjia'ao member of
        the Lufeng Fm. and is conformable with the overlying Laoluocun Fm.",
        which sets it above the beds Huang and colleagues later dated to the
        Toarcian.
    - id: huang2005a
      notes: >
        Magnetic polarity correlation makes the formation run from "the upper
        Aalenian through the lower Bathonian", with the overlying Laoluocun
        Formation covering the upper Bathonian through lower Callovian. The base
        is "a discontinuity surface, with roughly the lower part of the basal
        Aalenian Stage of the Middle Jurassic missing", and the interval cut out
        there is preserved in the green sandstone member of the Zhanghe
        Formation at Yubacun. Huang and colleagues put the Toarcian in the
        underlying Lufeng Formation, not in the Chuanjie.
    - id: zhang2026a
      notes: >
        Relays the span as "the top of Toarcian to Bathonian" for the Central
        Yunnan exposures, attributing it to Huang and colleagues (2021). The
        attribution is a stage too low: Huang's correlation chart puts this
        formation at Aalenian to Bathonian and gives the Toarcian to the Lower
        Lufeng Formation directly beneath it. The clause is subordinate, its
        main clause is Middle Jurassic, and the paragraph is about the Zhanghe
        Formation, which the Chuanjie enters only as a correlative.
    - id: huang2021a
      notes: >
        A national compilation whose text never treats Yunnan - the five
        stratigraphic regions and four detailed basin sections do not include
        it, and the formation's name appears only in the correlation chart for
        South China, West China and Tibet. In the Central Yunnan column of that
        chart the unit spans the Aalenian to the Bathonian, its top at the
        Bathonian-Callovian boundary and its base at the base of the Middle
        Jurassic, with the Toarcian below it belonging to the Lower Lufeng.
        Being a chart in a compilation rather than a determination, it
        corroborates rather than decides.
    - id: ren2020a
      notes: >
        Gives the narrower reading, that the formation "was regarded to be
        Middle Jurassic (Bajocian".

Chubut:
  rank: group
  period: [Early Cretaceous, Late Cretaceous]
  stages: [Hauterivian, Barremian, Aptian, Albian, Cenomanian, Turonian,
    Coniacian, Santonian, Campanian, Maastrichtian]
  references:
    - id: canale2014a
      notes: >
        Places the Cerro Barcino within it, giving "the Cerro Castaño Member of
        Cerro Barcino Formation (Albian; Chubut Group), Central Patagonia,
        Argentina".
    - id: bonaparte1979c
      notes: >
        Splits the group's age by region. In the Sierra San Bernardo, earlier
        authors placed its formations in the Upper Cretaceous, and the sauropods
        of the Castillo, Bajo Barreal and Laguna Palacios formations there
        support a pre-Maastrichtian Senonian age; east of Paso de Indios the
        group is older, interpreted by Chebli and colleagues (1976) as spanning
        the Barremian-Aptian interval in part, with Musacchio and Chebli (1975)
        reporting Aptian microfossils from the Cerro Barcino Member of the Gorro
        Frigio Formation.
    - id: casal2015a
      notes: >
        Has the group's lacustrine and fluvio-lacustrine systems developing from
        the Aptian, following Hechem and colleagues (1987), to the Campanian,
        following Hechem and colleagues (1990). Names the Lago Colhué Huapi
        Formation within it, above the Bajo Barreal and below the Laguna
        Palacios or Salamanca, and argues that its fossils and position rule out
        the Cenomanian U-Pb ages of the Laguna Palacios as the group's minimum
        age.
    - id: musacchio1975a
      notes: >
        Non-marine ostracods and charophytes of "Wealden aspect" from the Cerro
        Barcino Member, locally the oldest unit of the group, at Paso de Indios
        in Patagonia correspond in age to the associations of the Cloverly,
        Peterson and other equivalent formations of the Rocky Mountains: "The
        microfossils of Paso de Indios studied suggest a Lower Cretaceous age
        (near to or just Aptian)."
    - id: hechem1987a
    - id: hechem1990a
    - id: chebli1976a
    - id: martínez1998a
      notes: >
        The group's age "is controversial although there is major agreement in
        assigning it to the Upper Cretaceous", the assignments listed being
        Senonian (Huene 1929; Sciutto and Martínez 1994), Maastrichtian
        (Menéndez 1959) and Senonian-pre-Maastrichtian (Bonaparte and Gasparini,
        1979), while "Older ages have been suggested by Lesta and Ferello
        (Valanginian - lower Senonian, 1972) and Lesta et al.
        (Barremian-Campanian, 1980)". Martínez reads the faunal assemblage of
        the Bajo Barreal Formation, especially the sauropods, as indicating a
        possible Cenomanian age, and orders the group from the Matasiete
        (Aptian) up through the Castillo, Bajo Barreal and Laguna Palacios
        formations.
    - id: rauhut2004a
      notes: >
        In the country between Laguna del Mate and Manantial Pelado, where the
        type of Genyodectes serus most likely came from, "the only Mesozoic
        sedimentary unit cropping out in this area is the Chubut Group
        (Hauterivian-Cenomanian", after the provincial geological map of Lizuaín
        and colleagues (1995). Its units outcropping just northwest of the
        Cañadón Grande include the lowermost Los Adobes Formation
        (Hauterivian-Barremian) and the Puesto la Paloma (Barremian-Aptian) and
        Cerro Castaño (Aptian-Albian) members of the Cerro Barcino Formation,
        following Nullo (1983).

Ciénaga del Río Huaco:
  rank: formation
  period: [Late Cretaceous]
  stages: [Campanian, Maastrichtian]
  references:
  - id: hechenleitner2020a
    notes: >
      Campanian to Maastrichtian red beds at Quebrada de Santo Domingo in
      the Andes of La Rioja, northwestern Argentina, yielding two
      titanosaurs from different stratigraphic positions and egg clutches in
      three levels spread over three kilometers.
  - id: santucci2022a
    notes: >
      Repeats the Campanian to Maastrichtian span.
  - id: velandia2025a
    notes: >
      Refers isolated abelisaurid teeth from the Quebrada Santo Domingo
      locality to the formation and calls it Upper Cretaceous.

Clarens:
  rank: formation
  period: [Late Triassic, Early Jurassic]
  stages: [Rhaetian, Hettangian, Sinemurian, Pliensbachian, Toarcian]
  variants: [Cave Sandstone]
  references:
    - id: sereno2012a
      notes: >
        Gives the legacy name and the age: the "predominantly cream-colored,
        playa-aeolian Clarens Formation (formerly Cave Sandstone), the age of
        which is regarded as Early Jurassic (ca. 195 Ma, Sinemurian)". Notes it
        is "less accessible and less fossiliferous" than the Upper Elliot below.
    - id: bordy2020a
      notes: >
        Carries it younger than Sereno does, on the same radioisotopic work that
        dates the Elliot below it: "A mainly Pliensbachian age is obtained for
        the Clarens Formation."
    - id: norman2011a
      notes: >
        Sets the competing readings out side by side in the Heterodontosaurus
        tucki provenance: "Clarens Formation (formerly 'Cave Sandstone',
        Stormberg Series): Hettangian-Sinemurian (Olsen & Galton, 1984),
        Pliensbachian-Toarcian (Yates et al., 2004). The most probable age for
        the Clarens Formation: latest Sinemurian-Pliensbachian (Jourdan et al.,
        2005, 2007, 2008)."
    - id: peyredefabrègues2015a
      notes: >
        Tabulates Heterodontosaurus at "Early Jurassic (Hettangian-
        Pliensbachian)" in this formation, independently of Norman.
    - id: bordy2015a
      notes: >
        Places it in the succession, the Elliot being "sandwiched between the
        underlying Molteno and overlying Clarens formations of the Stormberg
        Group".
    - id: simmons1965a
      notes: >
        Under the legacy name, gives Heterodontosaurus tucki as from "the
        transitional beds of the Upper Triassic Cave Sandstones, South Africa",
        reporting Crompton and Charig (1962). Its own account of the Stormberg
        succession dates "The overlying Cave Sandstone (Triassic-Jurassic)"
        above the Red Beds.
    - id: olsen1984a
      notes: >
        The dedicated treatment of the question, titled for it - a review of
        the Stormberg assemblages "with special emphasis on the footprints and
        the age of the Stormberg". It concludes that "the lower Stormberg
        assemblage is Late Triassic (Carnian-Norian) in age while the upper
        Stormberg assemblage is Early Jurassic (Hettangian-Pliensbachian) in
        age", and defines the upper Stormberg as the "upper Elliot and Clarens
        formations", correlating it with the upper Newark Supergroup, the Glen
        Canyon and the lower Lufeng Series. So it supports Hettangian to
        Pliensbachian here and neither the Rhaetian nor the Toarcian.
    - id: yates2004b
      notes: >
        An upper Elliot paper, which mentions this formation in passing as the
        unit above rather than dating it.
    - id: jourdan2005a
      notes: >
        Also never names this formation, and dates the Karoo magmatism rather
        than the sedimentary succession.
    - id: jourdan2007a
      notes: >
        A high-resolution argon geochronology of the Karoo large igneous
        province. It never names this formation and contains no stage name at
        all, working entirely in absolute ages - some sixty dated values. Its
        bearing on the entry is through the province it dates rather than
        through the unit.
    - id: jourdan2008a
      notes: >
        Dates the lavas above the formation rather than the formation, and is
        the only one of these three Karoo papers to name it: some intrusive
        events occurred "before the Lesotho lava-pile emplacement ... as
        attested by pipe-related deposits in the Clarens formation". The lava
        pile is given elsewhere in the same paper as "the 1.9 km-thick Lesotho
        lava pile (181.6 plus or minus 0.7 Ma)" and again as "dated at 181.6
        plus or minus 0.7 Ma", so the unit is older than about that figure.
        Note the sentence that names the Clarens prints the age as 81.6 rather
        than 181.6; the error is in the published paper, not in our copy, and
        the same paper gives the correct figure twice elsewhere.
    - id: crompton1962a
      notes: >
        The Heterodontosaurus tucki type description, and one of the two
        sources behind the Rhaetian. Its horizon line is hedged and uses the
        legacy name and a regional term rather than a stage: "In the
        transitional beds of the Cave Sandstone, below the basalt; probably of
        Upper Keuper age."
    - id: haughton1924a
      notes: >
        A Rhaetic age for the Cave Sandstone, on the archosaur evidence:
        Notochampsa istedana is read as a thecodont standing between Aetosaurus
        of the German Keuper and the Jurassic crocodilians, so "this would
        denote a Rhaetic age for the Cave Sandstone which has yielded the
        intermediate form". Concludes that Stormberg sedimentation "began in
        Middle Triassic time and ended in the Rhaetic".

Clearwater:
  rank: formation
  period: [Early Cretaceous]
  stages: [Aptian, Albian]
  references:
    - id: brown2017a
      notes: >
        Gives the Borealopelta horizon as "Wabiskaw Member, Clearwater
        Formation, Aptian stage" at the Suncor Millennium Mine near Fort
        McMurray, Alberta, while the same paper's geological setting calls it
        "the Albian-aged Wabiskaw Member of the Clearwater Formation overlying
        the bitumen-rich McMurray Formation".
    - id: brown2020b
      notes: >
        Places Borealopelta in "the Early Cretaceous (Clearwater Formation) of
        northern Alberta" and tabulates the same horizon as "Clearwater
        Formation (Albian)". Describes the unit as fully marine, which is why
        the specimen has no associated macroflora.

Cloverly:
  rank: formation
  period: [Early Cretaceous, Late Cretaceous]
  stages: [Valanginian, Hauterivian, Barremian, Aptian, Albian, Cenomanian]
  references:
    - id: kirkland1993a
      notes: >
        Gives "Cloverly Formation and related Aptian to Albian" units.
    - id: ostrom1970a
      notes: >
        Reaches the same span from three lines of evidence: the age "on the
        bases of fossil invertebrate and paleobotanical evidence, as well as
        the fossil vertebrates, is probably Late Aptian and Early Albian".
    - id: darton1906a
      notes: >
        Sandstones and sandy clays 100 to 200 feet thick lying on the Morrison
        along both flanks of the Bighorn Mountains, best exposed near Cloverly,
        Wyoming, "the locality from which the formation was given its name", and
        correlated with the Lakota sandstone, Fuson formation and Dakota
        sandstone of the Black Hills region. "So far the formation has not
        yielded any fossils which throw light on its age, for only a few
        fragments of leaves and pine needles have been observed. On the basis of
        the above correlation it represents the later deposits of the lower
        Cretaceous and the earliest deposits of the upper Cretaceous."
    - id: cuenca-bescós2003a
      notes: >
        The Gobiconodon ostromi skeleton from Montana comes from the formation,
        and "The age of the Cloverly fauna is Aptian–Albian", following Ostrom
        (1970); a paleogeographic map of the gobiconodontid localities labels it
        "Cloverly (Aptian–Albian, USA)".
    - id: d'emic2019a
      notes: >
        New U–Pb zircon dates and a reanalysis of published biostratigraphic,
        paleomagnetic and radiometric data "suggest that deposition of the
        Cloverly Formation spanned the Valanginian–Cenomanian stages (ca. 140
        Ma–98 Ma), a longer time interval than the commonly cited Aptian–Albian
        depositional timeframe". The basal Pryor Conglomerate was deposited ca.
        140 to 130 Ma, the interval of "fluvially dominated deposition during
        the Valanginian–Hauterivian", while the flora of the overlying Little
        Sheep Mudstone Member near Ten Sleep, Wyoming, "dates to the
        Barremian–early Albian". The Himes Member and Greybull Sandstone follow
        in the mid to late Albian to early Cenomanian, which "opens up the
        possibility that the uppermost Cloverly Formation and Greybull Sandstone
        were deposited in the earliest Cenomanian".

Coal Ridge:
  rank: member
  parent: Judith River
  period: [Late Cretaceous]
  stages: [Campanian]
  references:
    - id: mallon2016a
      notes: >
        Gives "Coal Ridge Member of the Judith River Formation in Montana, USA,
        which dates to ~76 Ma (upper Campanian".
    - id: warner-cowgill2025a
      notes: >
        Places a Daspletosaurus site about 13 m below the overlying Woodhawk
        Member in "the Upper Cretaceous (Late Campanian) Coal Ridge Member of
        the Judith River Formation". The member lies above the Judith
        River-Belly River discontinuity, dated by Rogers and colleagues to about
        76.3 Ma, and the paper brackets the site between a maximum model age of
        76.12 +0.14/-0.47 Ma and a minimum of 75.81 +0.33/-0.37 Ma, the latter
        judged the more reliable.

Colalura Sandstone:
  rank: formation
  period: [Middle Jurassic]
  stages: [Bajocian]
  references:
    - id: long1998a
      notes: >
        Describes the Ozraptor type from "the Colalura Sandstone of Western
        Australia" at "Middle Jurassic (Bajocian)", the unit "referred to the
        Sowerbyi and perhaps Sauzei and Humphriesianium Zones of the European
        Middle Bajocian" and yielding abundant fossil wood and bivalves.
    - id: holtz2004a
      notes: >
        A reference work, tabulating the unit as Bajocian for the same taxon.

Colorado City:
  rank: formation
  parent: Dockum
  period: [Late Triassic]
  stages: [Carnian, Norian]
  dispute:
    summary: >
      Whether the unit exists is the live question, not its rank. Lehman and
      Chatterjee (2005) map the Otis Chalk strata out of it altogether: the
      beds were thought older than the Tecovas "Because of the supposedly
      'primitive' elements of the Otis Chalk fauna", and were called the Iatan
      Member and then the Colorado City Member, but "our mapping shows that
      these strata are actually within the upper part of the Cooper Canyon
      Formation", so the fauna "actually occurs very high stratigraphically
      within the Dockum succession". That reasoning is circular if the fauna is
      then dated by the unit. Rank is the lesser question: Lovelace and
      colleagues (2025) write "the Colorado City Formation (lower Dockum
      Group)" and Hunt and colleagues (1998) "Colorado City Member of Dockum
      Formation".
  references:
    - id: sarigül2016a
      notes: >
        The Otis Chalk quarries of Howard County, Texas expose its middle part:
        "The Otis Chalk quarries include beds from the middle portion of the
        Colorado City Formation", after Lucas and Anderson (1993) and Lucas and
        colleagues (1993); Otis Chalk Quarry 3 yielded the holotype of
        Dromomeron gregorii. At formation rank within the Dockum Group, it is
        treated as "a correlate of the lower part of the Tecovas Formation",
        following Lucas and Anderson, while "Lithostratigraphic equivalency of
        the Dockum Group exposures south to Garza County in Texas is pending and
        needs more detailed studies".
    - id: lehman2005a
      notes: >
        The mapping that rejects the unit, placing the Otis Chalk strata in the
        upper Cooper Canyon Formation instead.
    - id: lovelace2025a
      notes: >
        Uses formation rank and brackets the age, restricting the Otis Chalk
        localities "to somewhere between the late Carnian (c. 231 Mya; this
        study) to no younger than early Norian".
    - id: hunt1998a
      notes: >
        Uses member rank under a Dockum Formation, and makes the Otis Chalk
        fauna of this unit the type fauna of the Otischalkian.

Conques:
  rank: formation
  parent: Tremp
  period: [Late Cretaceous]
  stages: [Maastrichtian]
  references:
    - id: prieto-márquez2019a
      notes: >
        Places it in the "Conques Formation and uppermost Maastrichtian"
        interval. It is one of three formations of the Tremp Group defined and
        datable only in the eastern Tremp Syncline; facies alone will not
        separate it from the Talarn, both being red fluvial beds, so the
        magnetochron does the work -- C31r with red fluvial floodplain is this
        unit, C29r is the Talarn.
    - id: augustin2023a
      notes: >
        Treats it as a member, placing the Pareisactus scapula in "the Upper
        Cretaceous (lower Maastrichtian) Conques Member of the Tremp Formation
        in north-eastern Spain".

Cooper Canyon:
  rank: formation
  parent: Dockum
  period: [Late Triassic]
  stages: [Norian]
  references:
    - id: martz2013a
      notes: >
        The dedicated re-evaluation of the Post Quarry assemblage, treating the
        unit as the "Cooper Canyon Formation (Dockum Group, Upper Triassic) of
        southern Garza County, western Texas" and noting that its lower unit,
        like the lowermost Tecovas Formation, may fall in the Otischalkian
        biozone. It also withdraws the correlation with the Bull Canyon: the
        assemblage had been read as Revueltian "largely because the Cooper
        Canyon Formation was accepted as correlative with the Bull Canyon
        Formation of New Mexico", but "recent lithostratigraphic revisions
        (Martz 2008) have cast doubt on" it.
    - id: carpenter1997a
      notes: >
        Gives the Gojirasaurus type locality as "Revuelto Creek, Quay County,
        New Mexico, Cooper Canyon Formation, Dockum Group", at "late Early
        Norian based on magnetostratigraphy", and elsewhere "middle Norian".
    - id: nesbitt2007a
      notes: >
        Equates it with the Bull Canyon Formation, writing "Bull Canyon (=
        Cooper Canyon) Formations" for the Protoavis occurrence in Garza
        County, Texas. Martz and colleagues (2013) withdrew the equation, and
        the two are entered separately.

Cotham:
  rank: member
  parent: Lilstock
  period: [Late Triassic]
  stages: [Rhaetian]
  references:
    - id: evans2025a
      notes: >
        Places the Newtonsaurus material "most likely extracted from sandstones
        of the Cotham Member of the Lilstock Formation (Penarth Group,
        Rhaetian)", the associated bivalve Protocardia crowcombeia occurring in
        this member and in the Westbury Formation.

Couche III:
  rank: bed
  informal: true
  period: [Late Cretaceous]
  stages: [Maastrichtian]
  references:
    - id: longrich2017a
      notes: >
        Establishes what the name is. The phosphates "are divided locally by OCP
        into a series of beds or 'couches'... From top to bottom these are Sillon
        B, Faisceau A, Couche 0, Couche 0' and Couche 1 (lower Eocene), Couche 2
        (Paleocene), Couche III and Niveaux inferieurs (Maastrichtian)". A mining
        company's working subdivision rather than a formally erected unit, which
        is why it carries `informal` and no parent: the papers name no formation
        above it, only "the phosphates" of the Ouled Abdoun Basin.
    - id: longrich2026a
      notes: >
        The fullest statement, and the only one reaching the lower part:
        "Couche III is late Maastrichtian, Couche II is Paleocene, and Couches 0
        and I are Early Eocene in age. Upper Couche III is of latest
        Maastrichtian age, and dates to the final million years of the
        Maastrichtian. Lower Couche III appears to be slightly older. Its
        precise age is unknown, but the shark fauna resembles that of Upper
        Couche III, suggesting it is late, but not latest, Maastrichtian in
        age." It puts the gap between the two parts at "A significant period of
        time (≥1 Ma)".
    - id: longrich2021a
      notes: >
        Dates the upper part: "Upper Couche III is late Maastrichtian based on
        selachian biostratigraphy (Noubhani and Cappetta, 1997); carbon and
        oxygen isotope chemostratigraphy constrain it to the final ~1 Ma of the
        Cretaceous (Kocsis et al., 2014)."

Coyote Point:
  rank: member
  parent: Wahweap
  period: [Late Cretaceous]
  stages: [Campanian]
  references:
  - id: beveridge2022a
    notes: >
      Formalizes the four widely used informal subdivisions of the Wahweap
      Formation on the Kaiparowits Plateau as the Last Chance Creek, Reynolds
      Point, Coyote Point and Pardner Canyon Members; this is the former upper
      member. A sequence boundary at its top is inferred to be the globally
      recognized 80 Ma boundary. A Bayesian age-stratigraphic model puts the
      member's base at 80.61 +0.39/-0.51 Ma and its top at 79.00 +0.98/-0.99
      Ma, the upper figure carrying "a large uncertainty window of
      approximately two million years" because a depositional hiatus sits at
      that contact. Pushed to the far ends of both windows, 81.00 to 78.01 Ma,
      the member stays within the Campanian on this project's own stage
      boundary table.
  - id: mcfeeters2026a
    notes: >
      Places the oldest known Laramidian lambeosaurine in the member.

Craie glauconieuse:
  rank: formation
  period: [Late Cretaceous]
  stages: [Cenomanian]
  references:
    - id: hoyez2020a
      notes: >
        The dedicated stratigraphy of the Cenomanian of the Caux coast of
        Normandy, which distinguishes three formations bounded by hardgrounds
        and makes this the first, "bounded at its base by the Octeville erosion
        surface and at its top by the HG (hardground) Rouen 1", below the Rouen
        Chalk and the Antifer Chalk. The paper's English version renders the
        name Glauconitic Chalk.
    - id: buffetaut2024a
      notes: >
        Fixes the Caletodraco horizon within it by sequence and ammonite zone,
        the specimen referable "to the C3 sequence of Hoyez et al.,
        corresponding to the Mantelliceras dixoni zone of the lower Cenomanian
        glauconitic Chalk", and records that the unit of the Pays de Caux is a
        marine deposit.

Csehbánya:
  rank: formation
  period: [Late Cretaceous]
  stages: [Santonian]
  references:
    - id: ősi2005a
      notes: >
        States that the "Csehbanya Formation is Santonian" and gives the
        Hungarosaurus type horizon as "Csehbanya Formation, Upper Cretaceous
        (Santonian)", spelling the name without diacritics.
    - id: ősi2012a
      notes: >
        Independently gives the "Csehbánya Formation ... of Santonian" age, and
        describes Mochlodon vorosi from "the Upper Cretaceous (Santonian)
        continental deposits of the Csehbánya Formation of Iharkút, western
        Hungary".

Cullín Grande:
  rank: member
  parent: Lohan Cura
  period: [Early Cretaceous]
  stages: [Aptian, Albian]
  references:
    - id: martinelli2007b
      notes: >
        Early Albian, Leanza and Hugo (1995, 1997, 2001) having divided the
        formation "into two sub-units: the Puesto Quiroga Member (Late Aptian)
        and the Cullín Grande Member (Early Albian)", and Leanza (2002) having
        correlated the member with the Pichi Neuquén and Cañadón de la Zorra
        members of the upper Rayoso Formation "and assigned to the Early
        Albian". The member "includes 95 m of interstratified coarse-grained red
        sandstones, with intercalations of mudstone levels", a sandy meandering
        fluvial system at Cerro de Los Leones whose well-developed pedogenic
        calcrete points to "semi-arid conditions during the deposition of the
        Cullín Grande Member". Four fossiliferous levels are logged there, the
        sauropods concentrated in level 2 and turtles abundant in the lower
        pelitic level.
    - id: leanza2004a
      notes: >
        Names it one of the formation's two subunits, Leanza and Hugo (1995)
        having "divided the Lohan Cura Formation (177 m) into two subunits ...:
        the Puesto Quiroga and the Cullín Grande members".
    - id: bellardini2022a
      notes: >
        Makes it "the upper unit of the Lohan Cura Formation" and gives the
        lithology, the outcrops on the southern flank of the Cerro de los
        Leones being "composed of a thick succession of mudstones with thin
        intercalations of fine-grained sandstones".
    - id: bellardini2022b
      notes: >
        Places the Agustinia quarry in "the lower section of the Cullin Grande
        Member (Bajada del Agrio Group, Lohan Cura Formation, Lower Cretaceous,
        Albian)", writing the name without the diacritic here.
    - id: salgado2004a
      notes: >
        Gives both Agustinia and a titanosaurian from "the Aptian-Albian Cullín
        Grande Member of the Lohan Cura Formation".
    - id: bonaparte2006a
      notes: >
        Gives the discovery context, the Agustinia material coming from "the
        upper levels (Cullín Grande Member) of the Lohan Cura Formation" at
        Cerro de los Leones, 10 km west of Picún Leufú.
    - id: leanza1995a
      notes: >
        Erects the member: "Cullin Grande Member nom. nov.: Its type locality is
        found on the northwestern slope of the homonymous hill, where it shows
        92.20 m in thickness", the upper of the two the formation is divided
        into. It states no stage for the member itself; the Aptian it discusses
        is a maximum for the whole formation.

Cutzamala:
  rank: formation
  period: [Late Cretaceous]
  stages: [Santonian]
  references:
    - id: martini2009a
      notes: >
        The naming authority and the unit's own account of its age. The
        formation "was introduced by Campa-Uranga and Ramirez (1979) to describe
        a thick succession of continental red beds widely exposed along the
        Cutzamala River basin, east of the village of San Lucas", and is divided
        here "into a lower folded part and an upper unfolded part". "The age of
        the Cutzamala Formation is not well constrained": a lava flow
        interbedded in the basal beds near the dinosaur site gives 84 Ma,
        "indicating a possible maximum age of late Santonian", while pollen and
        hadrosaur remains put the lower part in the Maastrichtian and the Late
        Cretaceous. For the upper part, "No data are available", and the authors
        "suggest a Paleocene and/or earliest Eocene age".
    - id: villanueva-amadoz2014a
      notes: >
        Records the long disagreement over the age. The 1979 assignment to the
        Late Cretaceous "provoked a debate among different authors who disagreed
        between Late Cretaceous or Paleogene", and at La Barranca de los Bonetes
        two results from one section stand unreconciled: palynology, reported by
        Martínez-Hernández and colleagues (2000), by which "the palynological
        association studied determines an age younger than the late Paleocene",
        and the hadrosaur remains Benammi and colleagues (2005) found "in the
        same stratigraphic column (La Barranca de los Bonetes) where the
        aforementioned palynological samples were collected", which they
        attributed "to the Late Cretaceous in a broad sense". The two readings
        rest partly on the same material: that association "was restudied in
        greater detail by Benammi et al. (2005)", and the younger reading is
        "based according to Benammi et al. (2005) on the last occurrence of
        these taxa", where Martini and colleagues (2009) read Momipites from the
        same section on first occurrence.
    - id: ramírez-velasco2022a
      notes: >
        Gives the Huehuecanauhtlus horizon as the Cutzamala Formation "exposed
        in Tuzantla, Michoacan, southern Mexico, from the Late Santonian", and
        resolves it further to the Barranca Los Bonetes Unit.

Dakota:
  rank: formation
  period: [Early Cretaceous, Late Cretaceous]
  stages: [Albian, Cenomanian]
  references:
    - id: eaton1960a
      notes: >
        Describes the Silvisaurus type from "the Terra Cotta clay member of the
        Dakota Formation (Cretaceous), Ottawa County, Kansas", the site
        standing "midway in the Terra Cotta clay member ... hence about one
        third of the way up in the Dakota (now classified as uppermost Lower
        Cretaceous in the Kansas region)". Reads the setting as a low-relief
        coastal plain under warm-temperate deciduous forest.
    - id: tykoski2023a
      notes: >
        Sets the same taxon among the sparse Cenomanian dinosaurs of Appalachia.
    - id: kirkland2016a
      notes: >
        Equates it with the Naturita Formation, writing of strata "below the
        Naturita Formation (= Dakota Formation)" in northeastern Utah; on the
        Colorado Plateau these strata "are Upper Cretaceous and not Lower
        Cretaceous" and so are referred to the Naturita. Cites Sprinkel and
        colleagues (2012) for a Dakota of "Albian-Cenomanian" age: at Dinosaur
        National Monument palynomorphs and microfaunas support "an Albian age
        for ... at least the lower part of the Dakota Formation", and its base
        yields "middle to late Albian palynomorphs". Elsewhere in Utah the
        Naturita (= Dakota) holds microvertebrate faunas of "middle to late
        Cenomanian (95 to 93 Ma)" age.
    - id: sprinkel2012a
      notes: >
        "The Dakota Formation yields middle to late Albian palynoflora in
        northeastern Utah", from the basal mudstone and shale unit, which
        "contains an assemblage of dinoflagellate cysts that indicate a marine
        to marginal marine environment of middle to late Albian age", and from
        the carbonaceous shale unit; a bentonite in the middle carbonaceous
        interval gives a U-Pb zircon age of 101.4 ± 0.4 Ma, compatible with a
        late Albian age for that interval. "To the south, the Dakota Formation
        is Cenomanian based on the contained molluscan assemblage ...
        radiometric ages ... and palynology."

Dalangshan:
  rank: formation
  period: [Late Cretaceous]
  stages: [Maastrichtian]
  references:
    - id: pittman2020a
      notes: >
        Gives "the Maastrichtian Dalangshan Formation of Guangdong, southern
        China" for the Heyuannia type, and tabulates the formation as Late
        Cretaceous, Maastrichtian.
    - id: zheng2024a
      notes: >
        Independently gives the "Maastrichtian Dalangshan Formation, Guangdong
        Province" and reports large tyrannosauroid teeth from it.

Darbazin:
  rank: formation
  period: [Late Cretaceous]
  stages: [Coniacian, Santonian, Campanian]
  variants: [Dabrazinskaya]
  dispute:
    summary: >
      The Kazaklambia holotype sits at a contact, which is why two unit names
      compete for it. The Stratigraphic Dictionary of the USSR has the Darbazin
      lying "transgressively on the Syuksyuk Formation", and records that
      according to Belenky (1966) "most of the S[yuksyuk] Formation corresponds
      to the Dinosaur Horizon, and its top to the base of the Lower Darbazin
      subformation". Rozhdestvensky (1964) puts the skeleton in "the lower part
      of the Darbaza Suite" following Belenky (1961); Bell and colleagues (2013)
      follow that reading. So the disagreement is over which side of a boundary
      the specimen lies on, not over which name a single unit takes. The age of
      the lower subformation is contested in the same source: its author
      "referred the lower subformation to the Cenomanian-Turonian; R. F.
      Muzafarova ... to the Coniacian-Santonian".
  references:
    - id: nessov1997a
      notes: >
        Places the unit mainly in the Campanian, and is explicit that its lowest
        beds are hard to separate from the underlying Syuksyuk. At the "Grey
        Mesa" exposure the lower part is "Gray sandstones of the lower
        Darbazinsky Subsuite, lower Campanian?-middle Campanian", and nearby
        "Vertebrate remains come from gray sandstones of the lower part of the
        Darbaza Formation (Early?-Middle Campanian)." At the Darbaza locality
        the same interval is read lower: "Syuksyukian Formation or, more likely,
        lower part of the Darbazinian Formation, Santonian or Santonian-Lower
        Campanian." At Kazgurt the attribution runs the other way, the bone bed
        going to the "Upper part of the Syuksyukian Formation (Suslov, 1987),
        Santonian (apparently erroneously, the bone-bearing level is sometimes
        noted in the lower part of the Darbazinian Formation)". So the base of
        the unit sits in the Santonian in one part of the Pritashkent Chuly and
        in the lower Campanian in another.
    - id: vereshchagin1979a
      notes: >
        The dictionary entry, headed "Upper Cretaceous". "Named after Darbaza
        Station, Pritashkent district, Central Asia. N. E. Minakova, 1941",
        subdivided into three subformations, the upper of which is the Temirchin
        Formation. "Belongs to the Senonian, the upper subformation possibly to
        the Campanian as well"; Minakova put the lower subformation in the
        Cenomanian–Turonian, Muzafarova in the Coniacian–Santonian. The station
        name is why the adjectival form is Darbazinskaya.
    - id: rozhdestvensky1964a
      notes: >
        Places the dinosaur-bearing band "to the lower part of the Darbaza
        Suite ... no later than the Upper Turonian", on Belenky's authority, and
        describes the Syuk-Syuk site as 45 km north of Tashkent.
    - id: bell2013a
      notes: >
        Gives the type locality as "rocks of the Dabrazinskaya Svita at the
        Syuk-Syuk well site, 45 km northwest of Tashkent (Uzbekistan) in
        southeastern Kazakhstan", and records that the age of the unit "is
        poorly constrained; however, it is generally regarded as Santonian in
        age". Prints the unit name with r and b transposed.
    - id: belenky1961a
    - id: belenky1966a
    - id: minakova1941a
    - id: muzafarova1963a
    - id: nessov1995a
      notes: >
        Rejects the two oldest readings by name in one sentence, while
        reassigning the bed they rest on. Of the Syuk-Syuk wells locality it
        gives "Lower part of the Darbazin Formation (Rozhdestvensky, 1964a).
        Syuk-Syuk Formation (Stratigraphic Dictionary, 1979), rather than the
        Beleutin Formation ... Upper Cretaceous, Santonian. The age was earlier
        regarded as younger than that for Jaxartosaurus at Alymtau ... and was
        dated as early Santonian ..., but it is not late Turonian (Belenky and
        Mirkamalova, 1965) nor Cenomanian - Turonian (Rozhdestvensky, 1964b;
        Rozhdestvensky and Khozatsky, 1965)."

Dawangzhangzi:
  rank: member
  parent: Yixian
  period: [Early Cretaceous]
  stages: [Hauterivian, Barremian, Aptian]
  variants: [Dakangpu]
  dispute:
    summary: >
      Most sources write "Bed" for this unit; Chang and colleagues (2017)
      write unit, dividing the formation "from bottom to top into the Lujiatun
      Unit, Lower Lava Unit, Jianshangou Unit, Upper Lava Unit, Dawangzhangzi
      Unit and Jingangshan Unit" while arguing from new dates that the
      accepted order needs reinterpreting.
  references:
    - id: wang2001a
      notes: >
        States the equivalence of the two names outright -- "The Dakangpu Bed is
        the same as the Dawangzhangzi Bed of the middle Yixian Formation" --
        having written "Dakangpu member, the middle part of the Yixian Formation
        (comparable to Dawangzhangzi Bed)" in its own horizon line. That line
        dates the horizon by the Jurassic-Cretaceous boundary used:
        "Hauterivian, Early Cretaceous (based on a 135 Ma J/K boundary) or
        Barremian, Early Cretaceous (a 144 Ma J/K boundary)".
    - id: wu2012a
      notes: >
        Gives the Bolong horizon as the "Dakangpu Member (equivalent to the
        Dawangzhangzi Beds) of the middle part of Yixian Formation, Late
        Barremian–Early Aptian".
    - id: qiu2019a
      notes: >
        Gives "The Dakangpu Bed (same horizon to Dawangzhangzi Bed) of Yixian
        Formation" for the Xingtianosaurus locality.
    - id: jin2008a
      notes: >
        Correlates it across provinces, referring material "to the
        Dawangzhangzi Bed of the Yixian Formation in Lingyuan, western
        Liaoning".
    - id: chang2017a
      notes: >
        Places it sixth in the formation's succession and writes unit rank
        throughout.

De-na-zin:
  rank: member
  parent: Kirtland
  period: [Late Cretaceous]
  stages: [Campanian, Maastrichtian]
  references:
    - id: sullivan1999a
      notes: >
        Gives the Nodocephalosaurus horizon as "Kirtland Formation (De-na-zin
        Member), Upper Cretaceous (Upper Campanian)", a member "now considered
        to be late Campanian in age". It takes the 40Ar/39Ar ash dates of
        Fassett and Steiner (1997) as bracketing the member "at 73 ma, which
        correlates to the middle late Campanian".
    - id: jasinski2026a
      notes: >
        Places it in the Kirtland succession: it "is lithologically distinct
        from the underlying upper Campanian Hunter Wash and Farmington members
        of the Kirtland Formation and the disconformable overlying upper
        Maastrichtian" unit.
    - id: wiersma2018a
      notes: >
        Places Nodocephalosaurus in "the upper-most Campanian–lower-most
        Maastrichtian ... De-na-zin Member of the Kirtland Formation", citing
        ages of 73.04 ± 0.25 Ma from Fassett and Steiner (1997) and 73.49 ± 0.25
        Ma from Fowler (2017).
    - id: fassett1997a
      notes: >
        Never names this member; its work is at formation level and above, on
        the magnetic polarity of the Fruitland, Kirtland and Ojo Alamo section.
        Any age it supplies reaches this entry through the parent.
    - id: fowler2017a
      notes: >
        Never names this member either, working at Kirtland Formation level. It
        is a recalibration paper, recomputing earlier argon dates against a
        corrected standard, so its figures may differ from the same authors'
        published values without disagreeing about the rocks.

Deadhorse Coulee:
  rank: member
  parent: Milk River
  period: [Late Cretaceous]
  stages: [Santonian]
  references:
    - id: evans2013b
      notes: >
        Gives the parent and the age: "The Deadhorse Coulee Member of the Milk
        River Formation has been dated as Late Santonian in age".
    - id: ryan2012b
      notes: >
        Records that the place has been renamed while the unit has not: a
        horizon is given as "Black Coulee (formerly Deadhorse Coulee ...),
        approximately 10 km east of Writing-on-Stone Provincial Park, Alberta,
        from the Deadhorse Coulee Member of the Milk River Formation (late
        Santonian)". Same pattern as Bayn Dzak against Bayan Zag: the locality
        takes the current name, the unit keeps the name it was erected under.

Demopolis:
  rank: formation
  period: [Late Cretaceous]
  stages: [Campanian]
  variants: [Demopolis Chalk]
  references:
    - id: carr2005a
      notes: >
        Describes Appalachiosaurus from "the Late Cretaceous (Middle Campanian)
        Demopolis Formation of Alabama".
    - id: longrich2024d
      notes: >
        Tabulates the same taxon as early Campanian in the formation.

Densuș-Ciula:
  rank: formation
  period: [Late Cretaceous]
  stages: [Campanian, Maastrichtian]
  references:
    - id: norman2004a
      notes: >
        Tabulates the "Densus-Ciula Formation (Hunedoara), Romania | late
        Maastrichtian", writing the name without diacritics.
    - id: ősi2012a
      notes: >
        Independently gives "Densus Ciula Formation; late Maastrichtian" for
        Zalmoxes material.
    - id: augustin2022a
      notes: >
        States that "the Upper Cretaceous deposits from the northwestern part of
        the basin", the Hațeg Basin, "have been assigned to the Densus-Ciula
        Formation of early to late Maastrichtian age".
    - id: magyar2026a
      notes: >
        Gives the Middle Member, the formation's main fossil-bearing level and
        the source of Kryptohadros, as "representing probably the upper part of
        upper Campanian to lower part of upper Maastrichtian", after Albert and
        colleagues (2025) and Csiki-Sava and colleagues (2016).
    - id: albert2025a
      notes: >
        A dedicated revision, and the strongest source on the entry for its
        older stage. Combining geological mapping with zircon uranium-lead
        geochronology, sedimentology and micropalaeontology, it finds that the
        shift from marine to continental deposition in the western Hateg Basin
        "occurred significantly earlier (by middle late Campanian) than
        hitherto considered, and that the lower Densus-Ciula Formation -
        previously thought to be restricted to the Maastrichtian - covers a
        good part of the upper Campanian as well". Its title carries the same
        conclusion, evidence of late Campanian to early Maastrichtian
        syntectonic deposition. So it names the reading it overturns, which
        several of this entry's other references still give.
    - id: csiki-sava2016a
      notes: >
        A basal tuff of the formation's 'lower' subunit, near Rachitova, yielded
        "a K-Ar radiometric age of 69.8 ± 1.3 Ma, placing it within the early
        Maastrichtian", and the Densuș beds, which lie unconformably above upper
        Campanian flysch, are correlated with it. The upper part of the 'middle'
        subunit, near Tuștea, "can be constrained to the early part of the late
        Maastrichtian", while the 'upper' member, long referred to the lower
        Paleogene until volcanoclastic material and vertebrates were found in
        it, is "now also considered to be Maastrichtian" and, from its position
        overlying the 'middle' member, "can be constrained to the later part of
        the late Maastrichtian". The General Berthelot and Crăguiș localities
        high in the succession are "probable late Maastrichtian", "although more
        precise age constraints are still needed".

Denver:
  rank: formation
  period: [Late Cretaceous]
  stages: [Maastrichtian]
  references:
    - id: carpenter2002a
      notes: >
        The dedicated treatment of the Denver Basin dinosaurs, which are "the
        southernmost part of the Triceratops-dominated Maastrichtian or Lancian
        fauna" and are unevenly distributed among the basin's formations,
        suggesting ecological segregation. Sets the Laramie Formation beside it
        as the distal lowland of the same basin.
    - id: claessens2016a
      notes: >
        Gives Ornithomimus velox as from the "late Maastrichtian Denver
        Formation". The type site lies "high in the Denver Formation" and is
        radiometrically constrained to between 67 and 66.5 Ma, after Raynolds
        and colleagues (2007).
    - id: gilmore1920a
      notes: >
        Lists the Ornithomimus velox type as from the "Denver Formation, Upper
        Cretaceous".
    - id: raynolds2007a
      notes: >
        Does not name this formation either: its many mentions of Denver are
        the basin and the museum. It works in D1 and D2 synthems rather than in
        formations, and its Maastrichtians are one sentence about
        Cretaceous-Paleogene boundary indicators and three reference-list
        titles.
    - id: holtz1995a
      notes: >
        Marsh (1890) named Ornithomimus velox, and on it Ornithomimidae, from
        "the Upper Cretaceous portion of the Denver Formation of Colorado".
    - id: marsh1890b
      notes: >
        Does not name this formation. It places the Triceratops material in
        "the so-called Laramie formation" and in "the Ceratops beds of
        Wyoming". Whether that Laramie covers what is now this unit is a
        correlation rather than a reading, since the name was used broadly in
        1890.

Dharmaram:
  rank: formation
  period: [Late Triassic, Early Jurassic]
  stages: [Norian, Rhaetian, Hettangian, Sinemurian]
  references:
  - id: kutty2007a
    notes: >
      Gives the upper Dharmaram Formation of the Pranhita-Godavari Valley as
      Lower Jurassic, Sinemurian, and relates its fauna to those of the
      Upper Elliot and Clarens Formations of southern Africa, the Kayenta
      Formation of Arizona and the Lower Lufeng Group of China.
  - id: novas2010a
    notes: >
      Dates the lower Dharmaram Formation "?latest Norian–Rhaetian, Late
      Triassic", agreeing "with previous authors in considering the Lower
      Dharmaram Formation as probably latest Norian–Rhaetian in age"; the Norian
      end of that reading is hedged in the original.
  - id: bandyopadhyay2010a
    notes: >
      Tabulates the formation as "late Late Triassic to early Early Jurassic",
      and gives its upper part, which yielded Lamplughsaura, as early Early
      Jurassic, Hettangian.

Dinosaur Beds:
  period: [Late Jurassic, Early Cretaceous]
  stages: [Barremian, Aptian]
  references:
    - id: gomani2005a
      notes: >
        The dedicated treatment of Malawisaurus, whose material all comes from
        "the same area of the Dinosaur Beds (Dixey 1928 ...) near Mwakasyunguti,
        Karonga District, northern Malawi". The unit is "considered to be of
        Early Cretaceous (?Aptian) age, based on biochronology". The paper uses
        no rank word with the name.
    - id: gorscak2019a
      notes: >
        Sets it beside the Mtuka Member of the Galula Formation as the
        "nearby Aptian? Dinosaur Beds of Malawi", hedging the stage in the same
        way.
    - id: widlansky2018a
      notes: >
        Records that the Malawi Dinosaur Beds "have traditionally been assigned
        an Aptian age, based on the vertebrate fauna as well as a lacustrine
        ostracod assemblage", and that the ostracods, tentatively referred to
        Horcquia, "constrain the age of the Dinosaur Beds to Late Jurassic –
        Aptian, with strongest support for a Barremian – Aptian age", after
        Colin and Jacobs (1990). Notes that the beds "lack rigorous age
        constraint from radiometric dating" and that no magnetostratigraphic
        study of them has been made.
    - id: dixey1928a
      notes: >
        The describing account - "it remains in this paper to offer an account
        of the Dinosaur Beds themselves" - and it names no international stage
        anywhere, its whole chronology being a handful of mentions of the
        Cretaceous and the Jurassic. What it gives is geography and structure:
        the beds "lie within the Nyasan Rift Valley at an average distance of
        about 8 miles from the north-western shores of Lake Nyasa", running
        from Florence Bay north-westwards to the Songwe River, resting mostly
        on crystalline rocks and locally on upper Karroo mudstones.
    - id: colin1990a

Dinosaur Park:
  rank: formation
  parent: Belly River
  period: [Late Cretaceous]
  stages: [Campanian]
  references:
    - id: eberth2005a
      notes: >
        The uppermost of the three Belly River formations, 70 m thick at the
        Park, overlying the Oldman across a regional disconformity.
    - id: eberth1993b
      notes: >
        Erects the formation, bounded at its base by a regional discontinuity,
        and dates it from a 76 Ma bentonite at the top of the underlying Oldman
        Formation and a 74 Ma bentonite in the basal Bearpaw Formation just
        above it: "These radiometric ages indicate a late Campanian age for the
        Dinosaur Park Formation in the Dinosaur Provincial Park area."
    - id: vanderreest2017a
      notes: >
        Gives the Latenivenatrix horizon as "upper Dinosaur Park Formation,
        upper Campanian, Upper Cretaceous".
    - id: tong2021a
      notes: >
        "Dinosaur Park Fm. Late Cretaceous (Campanian)" is the formation and age
        given for Judithemys sukhanovi of Dinosaur Provincial Park, Alberta, in
        a compiled table of macrobaenid carapace lengths.

Djadokhta:
  rank: formation
  variants: [Djadochta, Djadohta, Bayan Dzak, Bayanzag]
  period: [Late Cretaceous]
  stages: [Cenomanian, Turonian, Coniacian, Santonian, Campanian, Maastrichtian]
  references:
    - id: khand2000a
      notes: >
        "Fossil criteria indicate that the formation is Campanian in age", with
        Loope and colleagues (1998) and Lillegraven and McKenna (1986) cited for
        "late Campanian-early Maastrichtian"; Table 2 sets it instead against
        the Coniacian. Barsbold (1972) had called the same unit the Bayan Dzak
        Formation, and Berkey and Morris (1927) spelled it Djadohta. Because "No
        physical contact between the Djadokhta and Baruungoyot Formations has
        yet been discovered" and Dashzeveg and colleagues (1995) blur the two
        faunas, the authors keep both units "with assignment pending further
        publications".
    - id: tsogtbaatar2014a
      notes: >
        Gives "Djadokhta Formation (Campanian", and the Plesiohadros horizon at
        Alag Teeg as "Djadokhta Formation, ?Upper Campanian, Upper Cretaceous".
        It cautions that "it is unknown if a Campanian age applies to the entire
        formation throughout the region."
    - id: handa2012a
      notes: >
        Independently assigns the Üüden Sair beds to the "Djadokhta Formation
        (Campanian" and describes them as eolian cross-laminated sandstone.
    - id: norell2016a
      notes: >
        The Zos Canyon beds "conformably underlie the Campanian Djadokhta
        Formation at Ukhaa Tolgod, Omnogov Aimag, Mongolia". For Ukhaa Tolgod
        itself, Dingus and colleagues (2008) "carefully documented the geology
        of the Ukhaa Tolgod beds and suggested a Campanian age for these
        sediments", which this paper takes to be "in general agreement with
        previous studies of this and other Djadokhta localities".
    - id: dingus2008a
      notes: >
        Faunas from the formation "have been assigned a Campanian–Early
        Maastrichtian age by Lillegraven and McKenna (1986) and Averianov
        (1997), based primarily on biochronologic interpretations". Pending
        further evidence the paper itself takes the vertebrate fauna at Ukhaa
        Tolgod to reflect a Campanian age, and on the superposition proposed by
        Dashzeveg and colleagues (2005) the Tugrugyin Shireh fauna "must be
        somewhat younger than that from Bayn Dzak, although the extent of this
        age difference is presently uncertain".
    - id: dashzeveg2005a
      notes: >
        Gradziński and colleagues (1977) "estimated the age of the Djadokhta
        Formation as ?upper Santonian and/or ?lower Campanian", one of a spread
        of biochronologic readings of the Bayn Dzak fauna running "from
        Cenomanian to Early Maastrichtian", among which "there has historically
        been little consensus". The paper's own magnetostratigraphy of the
        Flaming Cliffs section suggests deposition "during the rapid sequence of
        polarity changes in the late part of the Campanian ... between about 75
        and 71 Ma", a correlation it says "cannot yet be certainly established".
    - id: barsbold1983a
      notes: >
        Following Kielan-Jaworowska, "the age of the Djadokhtaskaya horizon,
        i.e. actually the Djadokhtaskaya Svita, is defined as within the
        Coniacian-Santonian interval", from a primitive mammal fauna in the
        lower part of the horizon that fills the gap between the Albian forms of
        the Trinity Sandstone and the Campanian of the Judith River beds. The
        upper part of the horizon, the Barungoyotskaya Svita, is taken as
        Campanian by correlation with North America, so that "the lower and
        upper age limits of the Djadokhtaskaya horizon are considered to
        correspond to the Lower Senonian and Campanian".

Dockum:
  rank: group
  period: [Middle Triassic, Late Triassic]
  stages: [Carnian, Norian]
  references:
    - id: cather2013a
      notes: >
        Records that the group's rank was set aside rather than disproved: Lucas
        and colleagues "abandoned the Dolores Formation in Colorado and Dockum
        Group in eastern New Mexico, despite their unquestionable priority over
        the Chinle, and restricted the Dockum in Texas to the sole formation
        within the Chinle Group. Extension of the term Chinle to Colorado and
        Texas has not been widely accepted." It designates "all Upper Triassic
        strata east of 105.5° W in New Mexico as part of the Dockum Group".
    - id: martz2013a
      notes: >
        Uses group rank with the Cooper Canyon Formation inside it and calls the
        group Upper Triassic, giving only the series.
    - id: nesbitt2007a
      notes: >
        Gives the same containment for the Bull Canyon Formation in Quay
        County, New Mexico.
    - id: lehman2005a
      notes: >
        Dates the group in Texas by its tetrapods: "the stratigraphic
        distribution of Dockum tetrapods supports only correlation with strata
        equivalent to the Carnian and Norian Stages of Germany", and "The
        boundary between the Trujillo and the Cooper Canyon Formations
        approximates the stage boundary." A Rb/Sr age of about 210 Ma that Long
        and Lehman (1994) obtained from the upper part of the Cooper Canyon
        Formation makes it "possible that strata correlative with the Rhaetian
        Stage are indeed present in the Dockum Group", though the paper adds
        that no direct biostratigraphic correlation with the Rhaetian can be
        made.
    - id: long1994a
      notes: >
        Carnian to Norian, at group rank: "Redbeds of the Upper Triassic
        (Carnian to Norian) Dockum Group are widely exposed around the Southern
        High Plains of the Texas Panhandle and adjacent eastern New Mexico",
        with the Trujillo Sandstone and Cooper Canyon Formation "in the upper
        Dockum".
    - id: lucas1993b
    - id: galton1985c
      notes: >
        Middle Triassic and formation rank, in figure captions crediting
        Chatterjee (1985): a Postosuchus maxilla and a poposaurid ilium both
        come "from Dockum Formation (Middle Triassic) of Texas, U.S.A.".

Dongxing:
  rank: formation
  period: [Late Jurassic]
  stages: [Kimmeridgian]
  references:
    - id: ren2024a
      notes: >
        Erects Jingia, since renamed Jingiella, the first mamenchisaurid from
        the unit, from "purplish-red calcareous silty mudstones on the upper
        portion of the Lower Member of the Dongxing Formation" in Guangxi.
        Plants, palynomorphs and bivalves from the Lower Member "indicate the
        Late Jurassic age", and "the sauropod-bearing horizon perhaps belongs to
        the middle Late Jurassic (Kimmeridgian?)".
    - id: mo2025a
      notes: >
        Records the same occurrence while describing the second eusauropod from
        Guangxi.

Dongyuemiao:
  rank: member
  parent: Ziliujing
  period: [Early Jurassic]
  stages: [Sinemurian, Pliensbachian, Toarcian]
  references:
    - id: yao2025a
      notes: >
        Gives a type locality with coordinates in the "Dongyuemiao Member of the
        Ziliujing Formation, Early Jurassic, late Sinemurian-Pliensbachian",
        and records that the member "is generally accepted to be of
        Pliensbachian age based on regional stratigraphy".
    - id: mcphee2016a
      notes: >
        Says the "Gongxianosaurus-bearing Dongyuemiao Member" has "been regarded
        as Toarcian in age".
    - id: allain2008a
      notes: >
        Places it in sequence: Gongxianosaurus "comes from the Early Jurassic
        Dongyuemiao Member of the Ziliujing Formation, which postdates the
        probably basal Jurassic Lufeng fauna".

Dorotea:
  rank: formation
  period: [Late Cretaceous]
  stages: [Campanian, Maastrichtian]
  references:
    - id: novas2019a
      notes: >
        Gives "the Dorotea Formation (Upper Cretaceous, Campanian-Maastrichtian)"
        and treats it as "partially equivalent to" the Chorrillo Formation across
        the border in Argentina, using "the equivalent Dorotea beds" to argue the
        lower Chorrillo is "late Campanian, at least".
    - id: alarcón-muñoz2023a
      notes: >
        Gives the Gonkoken nanoi horizon as "late Campanian to early
        Maastrichtian, Dorotea Formation", in the Río de las Chinas Valley,
        Magallanes Region.

Douira:
  rank: formation
  parent: Kem Kem
  period: [Late Cretaceous]
  stages: [Cenomanian]
  references:
    - id: ibrahim2020a
      notes: >
        Erects it as the upper of the two formations of the Kem Kem Group,
        above the Gara Sbaa Formation, and correlates it with Dubar's Aoufous
        Formation of the eastern High Atlas. Places it in the Cenomanian,
        99.0-93.5 Ma.
    - id: kellermann2025a
      notes: >
        Records where the Carcharodontosaurus neotype now sits, the skull from
        the "Kem Kem Beds" of Morocco being "now referred to the Douira
        Formation of the Kem Kem Group".
    - id: cau2025a
      notes: >
        Distinguishes it from the Gara Sbaa by locality, the Carcharodontosaurus
        neotype coming "from the Douira Formation (sensu ...) found at Gara
        Sbaa locality" while other material comes from the base of the Gara
        Sbaa Formation at Taouz.

Doushan:
  rank: formation
  parent: Qingshan
  period: [Early Cretaceous]
  stages: [Barremian, Aptian]
  references:
    - id: averianov2006a
      notes: >
        Places it "in the upper part of Qingshan Group in Shandong Province,
        China", gives radiometric dates of 119 to 121 Ma, and argues that "This
        time interval is within the Aptian ..., not Barremian, as was thought
        by Gao & Cheng (1999) with reference to the same stratigraphic charts".
    - id: sereno2010a
      notes: >
        Gives the Psittacosaurus sinensis type horizon as "Qingshan Group,
        Doushan Formation; Doushan village, 5 km northwest of Laiyang, Shandong
        Province".

Durlston:
  rank: formation
  parent: Purbeck
  period: [Early Cretaceous]
  stages: [Berriasian]
  references:
    - id: galton2009a
      notes: >
        Gives the Owenodon dentary as from "the Purbeck Limestone Formation
        (=Durlston Formation, Upper Purbeck, mid-Berriasian, Allen &
        Wimbledon, 1991) of Durlston Bay, Swanage, Dorset".
    - id: norman2012a
      notes: >
        Gives the same locality and horizon as "Durlston Bay-the Durlston
        Formation (Lower Cretaceous)", the specimen collected from the "Cherty
        freshwater beds" of middle Berriasian age.

Dzharakuduk:
  rank: formation
  period: [Late Cretaceous]
  stages: [Cenomanian]
  references:
    - id: averianov2016a
      notes: >
        Distinguishes it from the Bissekty Formation, which crops out at the
        Dzharakuduk wells: the Urbacodon dentary comes from "the Dzharakuduk
        Formation (Upper Cretaceous: lower Cenomanian) at the Itemir locality
        (IT-01) in the Itemir-Dzharakuduk Depression of the central Kyzylkum
        Desert". So the name serves both a formation and a locality complex,
        and the two occurrences are at different places and different ages.

Echkar:
  rank: formation
  parent: Tegama
  period: [Late Cretaceous]
  stages: [Cenomanian]
  references:
    - id: brusatte2007a
      notes: >
        Gives "the Late Cretaceous (Cenomanian) Echkar Formation of Niger, which
        is roughly coeval with Cenomanian beds elsewhere in northern Africa".
    - id: ibrahim2020a
      notes: >
        Sets it in its regional context, sharing vertebrate taxa with southern
        Algeria and with "the Echkar and Farak formations in Niger". Sereno and
        colleagues' GAD 5 survey level spans the upper Elrhaz and the lower
        part of this formation, crossing the boundary between the two.

Ejinhoro:
  rank: formation
  period: [Early Cretaceous]
  stages: [Barremian, Aptian, Albian]
  references:
    - id: russell1996a
      notes: >
        The Psittacosaurus neimongoliensis type locality, near Yangpo village in
        the Ordos region of Inner Mongolia, is an Ejinhoro Formation exposure of
        "greenish-yellow siltstones intercalated with reddish, locally
        chaotically bedded, ledge-forming sandstones", yielding Wuerhosaurus
        ordosensis, sauropod teeth and pterosaur bones alongside the
        psittacosaurs. Those strata "do not appear to conform to
        characterization of Ejinhoro Formation as 'brick red with greyish green
        clastics'" on the regional geological map, and that facies turns up
        instead at localities the map assigns to the Zhidan Group. No age is
        given for the unit, only the remark that the age of most of the new
        psittacosaur occurrences is uncertain.
    - id: pittman2020a
      notes: >
        Gives "the Aptian-Albian Ejinhoro Formation of Nei Mongol, China" as the
        Sinornithoides horizon.
    - id: jia2024a
      notes: >
        States that "the Ejinhoro Formation was interpreted as late Barremian in
        age (Cuenca-Bescos and Canudo)", for the Ordos Basin, Inner Mongolia.
    - id: maidment2008a
      notes: >
        Places the Wuerhosaurus ordosensis material in "the Lower Cretaceous
        Ejinhoro Formation of Yang-Paul, Ordos Basin, Inner Mongolia", after
        Dong (1993).
    - id: dong1993b
      notes: >
        The Wuerhosaurus ordosensis material was "collected in the Lower
        Cretaceous Ejinhoro Formation (Dong 1992) of the Ordos Basin, Inner
        Mongolia", whose "extensive exposures ... in this area are Lower
        Cretaceous and produce characteristic invertebrate and vertebrate
        fossils of the endemic central Asian Psittacosaurus fauna".
    - id: cuenca-bescós2003a
      notes: >
        Ejinhoro is the oldest of the three Gobiconodon localities restudied by
        Averianov and Skutchas (2000): "From bottom to top the localities
        Ejinhoro, Khoboor and Shestakovo range from the Barremian to the
        Albian". The paper's paleogeographic map labels the unit "Ejinhoro
        (Barremian, Gobi, China)".
    - id: averianov2000a
    - id: dong1992a

El Disecado:
  rank: member
  parent: El Gallo
  period: [Late Cretaceous]
  stages: [Campanian]
  references:
    - id: sullivan2006c
      notes: >
        Dates it by tuff, "The youngest tuff date, taken from within the El
        Disecado Member, is 73.59 ±0.09 Ma", and correlates the part above that
        date with the De-na-zin Member of the Kirtland Formation.
    - id: prieto-márquez2012b
      notes: >
        Places the Magnapaulia type strata at locality LACM 7253, which "pertain
        to the El Disecado Member", with "an estimated age of 73.6-73.0 million
        years". An estimated age of "73.6–73.0 million years" covers the member,
        given with no error on either end. Both ends stay inside the Campanian
        on this project's own stage boundary table, clearing the Maastrichtian
        boundary by 0.8 million years.
    - id: rivera-sylva2011a
      notes: >
        Gives "El Disecado Member of the El Gallo Formation (Campanian), El
        Jabón ravine, Baja California, Mexico" for nodosaurid material.

El Gallo:
  rank: formation
  period: [Late Cretaceous]
  stages: [Campanian]
  references:
    - id: prieto-márquez2012b
      notes: >
        Gives the Magnapaulia occurrence as "late Campanian strata of the El
        Gallo Formation, near the western coastline of the state of Baja
        California Norte, northwestern Mexico".
    - id: sullivan2006c
      notes: >
        Names its La Escarpa and El Disecado Members and ties the base of the
        former to the base of the Bearpaw Formation of Alberta.
    - id: molnar1974a
      notes: >
        Gives the local succession, the La Bocana Roja Formation unconformably
        underlying it and the Rosario Formation unconformably overlying it.
    - id: rivera-sylva2018a
      notes: >
        Reports a since-lost ankylosaurid osteoderm "from the 'El Gallo
        Formation' in Baja California (Campanian, Upper Cretaceous)", and a
        nodosaurid tooth from the El Jabón Creek locality in the El Disecado
        member.

El Mers III:
  rank: formation
  period: [Middle Jurassic]
  stages: [Bathonian, Callovian]
  references:
    - id: maidment2021a
      notes: >
        Gives "El Mers III Formation (Upper Bathonian/Callovian, Middle
        Jurassic: 168.3–163.5 million years ago)" for the Spicomellus site at
        Boulahfa, south of Boulemane. Maidment and colleagues (2020) had placed
        the horizon in the El Mers II Formation, but later field observations
        suggest "it may lie slightly higher in the stratigraphy".
    - id: zafaty2024a
      notes: >
        Independently gives "El Mers III Formation (Bathonian-?Callovian",
        hedging the younger end, and, following Charrière and colleagues (2011),
        gives the Thyreosaurus horizon as "El Mers III Formation, Middle
        Jurassic, Bathonian-?Callovian".
    - id: charrière2011a

Elliot:
  rank: formation
  period: [Late Triassic, Early Jurassic]
  stages: [Carnian, Norian, Rhaetian, Hettangian, Sinemurian, Pliensbachian,
    Toarcian]
  variants: [Red Beds]
  dispute:
    summary: >
      The age of the lower part is contested four ways and the formation spans a
      system boundary. Galton and Upchurch (2004) list the readings for the
      Lower Elliot side by side -- "Carnian, Shubin and Sues 1991; Carnian
      and/or Norian, Olsen and Galton 1984; Norian, Lucas and Hancox 2001; early
      to mid-Norian, Harris et al. 2002" -- while Sereno (2012) puts the Upper
      Elliot in the "earliest Jurassic (202-197 Ma, Hettangian)". Bordy and
      colleagues (2020) are the first to date the succession radioisotopically
      and reach a narrower answer than any of the above.
  references:
    - id: galton2004a
      notes: >
        Sets out the competing ages for the Lower Elliot, and places
        Euskelosaurus browni in it at "late Carnian or early Norian".
    - id: sereno2012a
      notes: >
        Gives the Upper Elliot as "predominantly red fluvial-aeolian ...
        (formerly part of Red Beds), the age of which is regarded as earliest
        Jurassic (202-197 Ma, Hettangian)", which is also the source for the
        legacy name. It contrasts that unit's "Massospondylus Range Zone" with
        the "Euskelosaurus Range Zone" of the "Upper Triassic Lower Elliot
        Formation".
    - id: bordy2020a
      notes: >
        The first radioisotopic framework for the upper Stormberg, from detrital
        zircon maximum depositional ages and magnetostratigraphy: "Our work
        suggests a mid-Norian-Rhaetian age for the lower Elliot Formation and a
        Hettangian-Sinemurian age for the upper Elliot Formation, although the
        precise stratigraphic position of the Triassic/Jurassic
        (Rhaetian/Hettangian) boundary remains somewhat uncertain."
    - id: sciscio2017a
      notes: >
        Its magnetostratigraphy supports "a Late Triassic-Early Jurassic age for
        the Elliot Formation", and its proposed correlation of the upper part of
        the upper Elliot with the Hartford Basin and St. Audrie's Bay "places
        the UEF EF6.2r – EF9n as Hettangian–Sinemurian in age". Reviewing
        earlier readings of the upper Elliot, it reports that Norman and
        colleagues (2011) speculated that its age "may be younger and either
        spans the Pliensbachian-Toarcian or the upper Sinemurian".
    - id: olsen1984a
      notes: >
        The lower Elliot's vertebrates — a traversodont cynodont and a
        rauisuchid, in a unit that is in part a red lateral equivalent of gray
        Molteno beds that have yielded Carnian plants — make up the lower
        Stormberg assemblage, and "the skeletal remains support a Late Triassic
        (Carnian and/or Norian) age for this deposit". Comparison with the
        European type section "strongly suggests that the lower Stormberg
        assemblage is Late Triassic (Carnian-Norian) in age while the upper
        Stormberg assemblage", the upper Elliot together with the Clarens, "is
        Early Jurassic (Hettangian-Pliensbachian) in age".
    - id: shubin1991a
      notes: >
        Argues in Romer Zones rather than stages, placing the "Upper Elliot and
        Clarens Formations, southern Africa" in "Romer Zone C: Absence of
        Carnian and Norian Families", alongside the McCoy Brook, the Kayenta
        and the Lower Lufeng - the same grouping Olsen and Galton (1984) reach
        by a different route. Also uses the Knollenmergel and the Lias.
    - id: lucas2001a
      notes: >
        Places the lower part in the Norian and caveats itself in the same
        breath: "the overlying lower Elliot Formation is most likely Norian in
        age. However, these are not strong correlations, and additional data
        are needed to confirm correlation of the southern African Upper
        Triassic strata." Calls the container "the now defunct 'Stormberg
        Group'".
    - id: harris2002a
      notes: >
        Reaches this unit as a comparison, and argues directly against the
        Carnian. Euskelosaurus browni, Blikanasaurus cromptoni and
        Melanorosaurus readi, "all from the lower Elliot Formation", are "of
        probable Revueltian (early-mid Norian) age", and "Previous reports
        placing the lower Elliot Formation in the Carnian ... were based on the
        mistaken assumption that traversodontid cynodonts, which co-occur with
        the South African prosauropods, are unknown from strata younger than
        Carnian." It argues in land-vertebrate faunachrons - Revueltian,
        Adamanian - rather than in stages.
    - id: norman2011a
      notes: >
        The upper part of the formation, "formerly 'upper Red Beds'", is
        "probably of Early Jurassic age", either "Hettangian-Sinemurian" after
        Olsen and Galton (1984) or "Pliensbachian-Toarcian" after Yates and
        colleagues (2004), though the paper prefers a narrower reading: "The
        most probable age for the upper part of the Elliot Formation is upper
        Sinemurian", on a personal communication from R. Irmis.

Elrhaz:
  rank: formation
  parent: Tegama
  period: [Early Cretaceous]
  stages: [Aptian, Albian]
  references:
    - id: carrano2012a
      notes: >
        Places it in its group and gives the span, with a query on the stage:
        "Elrhaz Formation, Tegama Group; Aptian–Albian?, Early Cretaceous".
        Elsewhere it gives the formation as "Aptian–Albian" without the query.
    - id: holtz2004a
      notes: >
        Gives the narrower "late Aptian" for the Agadez exposures.

Enciso:
  rank: group
  period: [Early Cretaceous]
  stages: [Barremian, Aptian]
  references:
    - id: isasmendi2024a
      notes: >
        Erects Riojavenatrix from "the Enciso Group (uppermost Barremian–lower
        Aptian) from Igea (La Rioja, Spain)", which it also calls "the Early
        Cretaceous Enciso Group". After Suarez-Gonzalez and colleagues (2013,
        2015) and Hernán (2018), most of the group is "early Aptian in age, with
        likely lowermost upper Aptian deposits in the uppermost part of the
        group", and the type locality is "most likely to be lower Aptian".
    - id: rauhut2025a
      notes: >
        Independently gives "the latest Barremian - Early Aptian Enciso Group
        of La Rioja province".
    - id: suarez-gonzalez2015a
      notes: >
        The ages here are the Leza Formation's, not this group's: "The Leza
        Formation is a mixed carbonate-clastic unit, upper Barremian-lower
        Aptian in age". This group is reached only by lateral equivalence,
        which the paper states in both directions - "the Leza Fm changes
        laterally, towards the south, to the overlying Enciso Group" and
        "Towards the NE margin of the basin, the Enciso Group changes laterally
        to the Leza Fm". So the late Barremian to early Aptian that later
        papers attribute here is sound but indirect, and it constrains only the
        Leza-equivalent part; that is why the group is given as reaching higher
        than the Leza does. One of the paper's four mentions of the name is not
        the unit at all but the town, in a figure-legend key.
    - id: hernán2018a
    - id: suarez-gonzalez2013a
      notes: >
        Dates the group directly rather than by transfer from the Leza: the
        authors "re-examined the microfossil content of the Enciso Gr facies in
        the area surrounding Soto en Cameros" and "found previously unrecorded
        marine microfossils (dasycladales and foraminifers) in two levels of
        the Enciso Gr". Their conclusion is that "the Leza Fm, the Jubera Fm
        and the Enciso Gr belong to the same depositional sequence, upper
        Barremian - lower Aptian in age", the dasycladale Salpingoporella
        urladanasi and a foraminifer compared to Istriloculina constraining
        each end.
        The paper is also where the unit's fifty-year disagreement is
        tabulated, and the spread is wide: the group has been called
        Berriasian, early Valanginian, Hauterivian to Barremian, Barremian,
        Barremian to Aptian, and upper Valanginian to Barremian by different
        workers between 1966 and 2009. The one modern dissent, a revised
        ostracod biostratigraphy by Schudack and Schudack (2009) excluding the
        Aptian, is cited here and answered with the new microfossil data, and
        the Barremian-Aptian reading is what later work follows.

Escucha:
  rank: formation
  period: [Early Cretaceous]
  stages: [Aptian, Albian]
  references:
  - id: kirkland2013a
    notes: >
      Described in 1971 as the Formación Lignitos de Escucha, beneath the
      Formación Arenas de Utrillas, and divided in two by a regional
      unconformity. The formation has generally been read as early to middle
      Albian, overlying Aptian strata in central basinal settings and overlain
      by the upper Albian Utrillas Formation, but calcareous plankton and
      palynomorphs place the lower Escucha in the late Aptian, and marine
      ostracods confirm an Albian age for the upper part northeast of Teruel.
      Places Europelta in the Lower Cretaceous, in the lower Albian carbonaceous
      member of the lower Escucha near Ariño, where palynomorphs, ostracods and
      charophytes indicate that the site "is completely of early Albian age".
  - id: mcdonald2012a
    notes: >
      Describes Proa from "the Lower Cretaceous (lower Albian) Escucha Formation
      of Teruel Province", from "lower Albian beds in the upper Aptian–lower
      Albian Escucha Formation" at Ariño, in the Middle Interval with Coal of
      the formation's Lower Sedimentary Succession.
  - id: santos-cubedo2021a
    notes: >
      Places the Ariño occurrence in the Oliete sub-basin and dates it early
      Albian.

Eumeralla:
  rank: formation
  period: [Early Cretaceous]
  stages: [Hauterivian, Barremian, Aptian, Albian]
  references:
    - id: herne2019a
      notes: >
        Places it in its group and basin, "Eumeralla Formation, Otway Group,
        Otway Basin (lower Aptian)".
    - id: agnolín2010a
      notes: >
        The Dinosaur Cove localities of the Eumeralla Formation, Otway Group,
        are "late Aptian-early Albian: late Early Cretaceous", after Wagstaff
        and McEwen Mason (1989).
    - id: bell2018a
      notes: >
        Treats the "Eumeralla Formation (late Hauterivian–Albian) in Victoria"
        as older than the early Cenomanian Griman Creek Formation at Lightning
        Ridge, and places Leaellynasaura in "the lower Albian of the Eumeralla
        Formation (Otway Basin)".
    - id: wagstaff1989a
      notes: >
        Never names this formation, and dates localities at group level: "the
        localities in Otway Group sediments are of late Aptian-early Albian age
        (Crybelosporites striatus Subzone ...) and the localities in the
        Strzelecki Group of Valanginian-Aptian age". So it supports neither the
        Hauterivian nor the Barremian here, and what it does support is
        narrower than the entry and about localities rather than the unit. Its
        own caveat belongs with it: "This age determination is dependent on the
        isochronicity of spore-pollen zones across eastern Australia."

Farak:
  rank: formation
  period: [Early Cretaceous, Late Cretaceous]
  stages: [Albian, Cenomanian]
  references:
    - id: sereno2026a
      notes: >
        Gives the Spinosaurus mirabilis horizon as "Farak Formation; Cenomanian
        ~95 million years ago", at Sirig Taghat in the Jenguebi area of the
        Agadez Region of Niger, and places it among the four terrestrial
        formations of the Iullemeden Basin south of the Aïr Massif that were
        "initially informally described as 'Continentale intercalaire'".
    - id: hunt1995a
      notes: >
        Lists Rebbachisaurus tamesnensis and Aegyptosaurus baharijensis from the
        "Farak Fm." of Niger in its Early Cretaceous sauropod table, with the
        stage given as "Alb/Cen", Albian/Cenomanian.

Farmington:
  rank: member
  parent: Kirtland
  period: [Late Cretaceous]
  stages: [Campanian]
  references:
    - id: jasinski2026a
      notes: >
        Names it among the Kirtland's members, the De-na-zin being
        "lithologically distinct from the underlying upper Campanian Hunter Wash
        and Farmington members of the Kirtland Formation".
    - id: fassett1997a
      notes: >
        The C33n-C32r polarity reversal lies in the upper part of "the Upper
        Cretaceous continental Farmington Sandstone Member of the Kirtland
        Shale" at Hunter Wash, in the southwest San Juan Basin; ash beds
        bracketing that reversal "establish its age as 73.50 ± 0.18 Ma". Ash H,
        in the upper part of the member, dates to 73.37 ± 0.18 Ma and ash J,
        very near its top, to 73.04 ± 0.25 Ma.

Farta Pão:
  rank: formation
  period: [Late Jurassic, Early Cretaceous]
  stages: [Kimmeridgian, Tithonian, Berriasian]
  references:
    - id: mateus2017a
      notes: >
        Explains the unit's current meaning and why its subdivisions changed
        rank: "The main change was the creation of a new meaning for the Farta
        Pão Formation, chosen (after Schneider et al., 2009) because it was the
        oldest available name uniting the (also proposed) Sobral, Arranhó I,
        Arranhó II, and Freixial Members." Reports the formation as "dated as
        latest Kimmeridgian to latest Tithonian" by Schneider and colleagues
        (2009), and its top in the older sense of Wilson (1988), together with
        the Freixial, as "considered as Berriasian based on foraminifera,
        ostracods and charophytes".
    - id: mocho2014a
      notes: >
        Gives the same history from the other side: Schneider, Fürsich and
        Werner (2009) "included as members of the Farta Pão Formation the
        previous Sobral, Arranhó (divided into the Arranhó I and II members),
        and Freixial Formations".
    - id: schneider2009a
      notes: >
        Dates the unit directly by Sr-isotope stratigraphy on oyster shells and
        erects its members: "The Farta Pao formation ranges from the latest
        Kimmeridgian to the latest Tithonian. The largely synchronous Sobral,
        Arranho I, and Arranho II members are overlain by the late Early to
        Late Tithonian Freixial Member", and "Herein, we propose four members
        for the Farta Pao formation". The topmost member is dated directly and
        comes out Jurassic: three of four samples near Chamboeira "indicate a
        Late Tithonian age, which corresponds to foraminiferal and
        dasycladacean data", and the Freixial is "obviously the youngest
        Jurassic lithostratigraphic unit of the area". The paper's three
        mentions of the Berriasian attach to other things - a basin-scale
        megasequence envelope, and an upper Alcobaca reading it reports and
        discounts because "the authors did not provide an explanation for this
        interpretation".
    - id: wilson1988a

Fengjiahe:
  rank: formation
  period: [Early Jurassic]
  stages: [Hettangian, Sinemurian, Pliensbachian, Toarcian]
  references:
    - id: yao2022a
      notes: >
        Describes Yuxisaurus from "the Lower Jurassic Fengjiahe Formation of
        Yunnan Province", and gives the locality and span of the upper part:
        "Upper part of the Fengjiahe Formation, near Jiaojiadian village, Yimen
        County, Yuxi Prefecture, Yunnan Province, China; late
        Sinemurian–Toarcian", a span taken from the magnetostratigraphic age
        Huang and colleagues (2005) gave the laterally equivalent Lufeng
        Formation.
    - id: sánchez-fenollosa2025a
      notes: >
        Independently gives "Fengjiahe Formation, late Sinemurian-Toarcian".
    - id: zhen1985a
      notes: >
        Identifies it with the "lower Lufeng series" of Young (1951) and reports
        its dating from non-marine invertebrates: Chen and colleagues (1982)
        "assigned a Hettangian-Pliensbachian age to the Fengjiahe Formation".
        Identifies it with Young's "lower Lufeng series" and reports its dating
        from non-marine invertebrates: Chen and colleagues (1982) "assigned a
        Hettangian-Pliensbachian age to the Fengjiahe Formation".
    - id: huang2005a
      notes: >
        A magnetostratigraphic study of the Jurassic in the Lufeng area, and it
        places this unit and its neighbors in the Lower Jurassic: its
        stratigraphic table carries the Fengjiahe and the Lufeng formations
        both as J1, with the Lufeng's Zhangjiaba and Shawan members beneath
        that heading and the Triassic units below them. It correlates the upper
        part of the Lufeng Formation with the upper Toarcian, reads sites low
        in the section as "roughly" middle Sinemurian, and records that the
        interval "from the base of the Zhangjiaba Member through the Shawan
        Member has unstable rock magnetism with disordered directions", so the
        members themselves are the part it cannot correlate. It concludes that
        the transitional Yubacun Formation, between the Upper Triassic Zhaijie
        and the Lower Jurassic Lufeng, "should be assigned to the Jurassic
        System". It names no Norian, and its single Rhaetian is a polarity zone
        below this unit. Note it spells the member Zhangjiaba, a third form
        beside Zhangjia'ao and Zhangjiawa.
    - id: chen1982a
    - id: young1951a

Ferruginous Sands:
  rank: formation
  parent: Lower Greensand
  period: [Early Cretaceous]
  stages: [Aptian]
  references:
    - id: barker2020a
      notes: >
        Places it in the Lower Greensand Group, the Vectaerovenator horizon
        being "formed of the three strata of the Lower Greensand Group: the
        uppermost members of the Ferruginous Sands Formation (late Aptian in
        age ...)" and the units above it.

Figuerola:
  rank: formation
  period: [Late Cretaceous]
  stages: [Maastrichtian]
  references:
    - id: prieto-márquez2021a
      notes: >
        Gives the Fylax dentary as from "uppermost Maastrichtian strata (within
        chron C29r) of the Figuerola Formation, in the Àger syncline of the
        southern Pyrenees in northeastern Spain". The Àger syncline is a
        separate minibasin from the Tremp syncline and carries its own unit
        names.

Fleming Fjord:
  rank: group
  period: [Late Triassic]
  stages: [Norian, Rhaetian]
  references:
    - id: clemmensen2020a
      notes: >
        Erects the group and gives its span and setting: "The Norian-early
        Rhaetian, lacustrine Fleming Fjord Group was deposited at about 41° N on
        the northern part of the supercontinent Pangaea", the dating resting on
        "sparse invertebrate fossils, land-derived palynomorphs, vertebrate
        remains, and palaeomagnetic data". The Malmros Klint Formation and the
        Carlsberg Fjord and Tait Bjerg Members lie inside it. Raises the Fleming
        Fjord Formation to a group of three formations, the Edderfugledal,
        Malmros Klint and Ørsted Dal, and gives its span and setting: "The
        Norian-early Rhaetian, lacustrine Fleming Fjord Group was deposited at
        about 41° N on the northern part of the supercontinent Pangaea", having
        "been dated to the Late Triassic (most likely Norian - early Rhaetian)
        based on sparse invertebrate fossils, land-derived palynomorphs,
        vertebrate remains, and palaeomagnetic data". Magnetochronological work
        by Kent and Clemmensen (1996) "supports that the vertebrate bearing red
        beds of the Fleming Fjord Group are of late Norian age".
    - id: kent1996a
      notes: >
        Magnetostratigraphy of a 210 m section through the Malmros Klint Member
        and the lowermost Carlsberg Fjord beds, correlated to the
        cyclostratigraphically calibrated Newark Basin polarity sequence,
        "suggests that the sampled interval represents about a 3.5 m.y. interval
        of the late Norian", running on that correlation from about 211 to about
        207.5 Ma. Conchostracans in the Edderfugledal and Malmros Klint Members
        "suggest a Late Triassic (?Carnian to ?Norian) age, while ostracods,
        pelecypods, and palynomorphs in the Tait Bjerg Beds indicate that the
        uppermost part of the Fleming Fjord Formation is Rhaetian in age".

Foremost:
  rank: formation
  parent: Belly River
  period: [Late Cretaceous]
  stages: [Campanian]
  references:
    - id: eberth2005a
      notes: >
        The lowest of the three, 170 m thick, "paralic to non-marine" and
        gradationally overlying "marine shales of the Pakowki (Claggett)
        Formation". Contains the McKay and Taber coal zones at bottom and top
        and the Herronton Sandstone Zone above the Taber. Dated by the
        "Baculites asperiformis ammonite biozone ... estimated age of 80 Ma",
        concurring with 79.14 +/- 0.15 Ma from an ash 30 m above its base.
    - id: eberth1993b
      notes: >
        Dates it with the Milk River as "the early to middle Campanian Milk
        River and Foremost formations", citing Leckie (1989) and Ogunyomi and
        Hills (1977) for northeastward sediment transport in their nonmarine
        portions.
    - id: leckie1989a
    - id: ogunyomi1977a

Forest Marble:
  rank: formation
  parent: Great Oolite
  period: [Middle Jurassic]
  stages: [Bajocian, Bathonian]
  references:
    - id: naish2007a
      notes: >
        Places Cetiosaurus oxoniensis in "the Bajocian-Bathonian Forest Marble
        Formation of Oxfordshire".
    - id: barron2012a
      notes: >
        Places it in the regional picture: in Wessex mudstone deposition
        "continued up to the late Bathonian (Frome Clay and Forest Marble
        formations)", and a late Bathonian sea-level rise "extended marine mud
        deposition even further north-east (Forest Marble Formation)".
    - id: upchurch2003a
      notes: >
        Gives the Cardiodon type tooth as coming "from the Middle Jurassic
        Forest Marble of Bradford-On-Avon, Wiltshire", and, following Phillips
        (1871), puts the Bletchingdon Station Cetiosaurus bones in "the Forest
        Marble (Bathonian ...) sediments immediately above the Great Oolite",
        taking the Bathonian age from Cope and colleagues (1980).
    - id: phillips1871a
      notes: >
        Names the unit once, in a measured section and in lower case, with no
        age attached: "The strata covering the solid oolite were thus noted,
        March 21, 1870: - Thin skerry beds of Forest marble and shaly clay." So
        it is a bed-by-bed record rather than a dating, although it is the
        source later work follows for the Cardiodon tooth.
    - id: cope1980a
    - id: cifelli2014a
      notes: >
        Lower molars of Palaeoxonodon "from the Forest Marble (Bathonian) of
        Britain" are very close in size and appearance to a stem zatherian from
        the Lakota Formation, the two separated by 25 Ma.

Forest Sandstone:
  rank: formation
  period: [Late Triassic, Early Jurassic]
  stages: [Rhaetian, Hettangian, Sinemurian, Pliensbachian]
  references:
    - id: viglietti2018a
      notes: >
        Corrects the Vulcanodon horizon and dates the unit by correlation: the
        taxon "is from lower in the stratigraphy than previously documented,
        lying within the uppermost Forest Sandstone rather than the interbedded
        sandstones of the Batoka Basalt Formation", and "the upper part of the
        Forest Sandstone correlates with the Clarens Formation of the main Karoo
        Basin, implying that Vulcanodon is likely Sinemurian-Pliensbachian in
        age". Because Visser (1984) suggested that northern basins could be
        older than their main Karoo equivalents and that an unconformity may lie
        beneath the basalt, the Vulcanodon stratum "could be as old as the
        Rhaetian or as young as the Pliensbachian".
    - id: rauhut2003b
      notes: >
        Gives the occurrence as "Forest Sandstone, Matabeleland, Zimbabwe" and
        the range of Syntarsus rhodesiensis as "Early Jurassic
        (Hettangian-Sinemurian)".
    - id: bristowe2004a
      notes: >
        Gives "Early Jurassic: Hettangian ... Forest Sandstone Formation".
    - id: raath1969a
      notes: >
        Following Bond (1955), who correlated the unit at Southcote Farm,
        northwest of Bulawayo, "with the Upper part of the South African Red
        Beds" on the basis of its fossils, concludes: "The deposits are thus
        Upper Karroo (Upper Triassic) in age."
    - id: visser1984a
      notes: >
        A review of the Stormberg Group and Drakensberg Volcanics, in which
        this unit appears only in passing as the Zimbabwean correlative; the
        paper works throughout in the legacy name Cave Sandstone. It recognizes
        "Four Late Triassic depositional basins which were tectonically
        controlled", and gives the capping lavas as "the Drakensberg Volcanics
        with radiometric ages of 114 My to 194 My". That eighty-million-year
        span is 1984-vintage potassium-argon work; Jourdan and colleagues
        (2008) date the same Lesotho pile at 181.6 plus or minus 0.7 Ma by
        argon-argon, so the bracket here is superseded rather than open.
    - id: bond1955a

Fort:
  rank: member
  parent: Jaisalmer
  period: [Middle Jurassic]
  stages: [Bathonian]
  references:
    - id: bajpai2023a
      notes: >
        Gives the Tharosaurus horizon as "a shale unit situated at the base of
        the early-middle Bathonian Fort Member" in the Jaisalmer Basin of
        Rajasthan, western India.
    - id: mannion2025a
      notes: >
        Places it below the "Bathonian Badabag Member of the Jaisalmer
        Formation, which overlies the Fort Member that yielded Tharosaurus", so
        the sibling above carries a stage while this member's own age comes from
        elsewhere.
    - id: vanderlinden2025a
      notes: >
        Places Tharosaurus indicus, described by Bajpai and colleagues (2023),
        "from the Middle Jurassic Fort Member of the Jaisalmer Formation of
        India".

Fort Crittenden:
  rank: formation
  period: [Late Cretaceous]
  stages: [Campanian]
  references:
    - id: dalman2018a
      notes: >
        Describes Crittendenceratops from "the upper Campanian Fort Crittenden
        Formation of Adobe Canyon within the Santa Rita Mountains of
        southeastern Arizona", calling the deposits "Upper Cretaceous (Latest
        Campanian)"; the material came from "late Campanian shale beds (~73 Ma)"
        of the lower, shale member.
    - id: sullivan2006c
      notes: >
        Dates it from K/Ar ages on the volcanics above and below it: "These ages
        indicate a Campanian age for the Fort Crittenden Formation, and suggest
        it is about 74 Ma, within the Kirtlandian time interval." It recalls
        Stoyanow's (1949) report of fish, turtles and "Gorgosaurus" "from Upper
        Cretaceous strata (Fort Crittenden Formation)" in Adobe Canyon, and
        extends the late Campanian age of the Ringbone Formation of southwestern
        New Mexico to it "by correlation".
    - id: stoyanow1949a
      notes: >
        The naming paper, and it gives no stage: "The Sonoita group readily
        admits of two divisions: the lower - Fort Buchanan formation, and the
        upper - Fort Crittenden formation, both names adopted from the near-by
        ruins of two old forts." The unit is the upper division of the Sonoita
        Group, above the Fort Buchanan Formation and separated from it by a
        comparatively thin conglomeratic bed, and the group is correlated with
        the Cabullona Group of northeastern Sonora. Its only age statement is a
        floor reached from the presence of dinosaurs at all: "Like Schrader, I
        was inclined to regard these strata as Tertiary. However, a find of
        dinosaurian teeth and bones clearly indicates a pre-Eocene age for this
        unit." The Gorgosaurus that later papers recall from here is not an
        identification: Barnum Brown, by personal communication, compares two
        teeth to "a carnivorous dinosaur skull of about the size of a large
        specimen of Gorgosaurus libratus", which is a statement about size.

Frenchman:
  rank: formation
  period: [Late Cretaceous]
  stages: [Campanian, Maastrichtian]
  references:
    - id: brown2011a
      notes: >
        Describes Thescelosaurus assiniboiensis from "the Frenchman Formation
        (late Maastrichtian) of Saskatchewan".
    - id: boyd2015a
      notes: >
        Assigns Thescelosaurus assiniboiensis, known from a single specimen, to
        "the Late Cretaceous Frenchman Formation of Saskatchewan, Canada".
    - id: brett-surman1989a
      notes: >
        Campanian, in a world list of formations with hadrosaurian remains:
        "Frenchman Fm, Campanian".

Frontier:
  rank: formation
  period: [Early Cretaceous, Late Cretaceous]
  stages: [Albian, Cenomanian, Turonian, Coniacian]
  references:
    - id: carpenter1998c
      notes: >
        Gives the formation and its Belle Fourche Member at "Middle Cenomanian",
        and records that Merewether and colleagues "revised the Frontier
        Formation in Wyoming" in the course of erecting that member.
    - id: merewether1979a
      notes: >
        The specialist treatment, and the source of the formation's younger
        stages. Its abstract gives the eastern Wyoming section as containing
        "invertebrate fossils of Cenomanian, Turonian, and Coniacian age", and
        resolves the formation internally: it "is divided into as many as three
        members, which are, from older to younger, the Belle Fourche Member of
        Cenomanian age, the unnamed member of early and middle Turonian age,
        and the Wall Creek Member of late Turonian and early Coniacian age".
        The Albian appears nowhere in it.

Fruitland:
  rank: formation
  period: [Late Cretaceous]
  stages: [Campanian]
  references:
    - id: jasinski2011a
      notes: >
        Gives "Fruitland Formation (Fossil Forest Member), late Campanian".
    - id: ford2000a
      notes: >
        Pairs it with its neighbor at the same age, "Fruitland Formation, late
        Campanian, Late Cretaceous" and "Kirtland Formation, late Campanian".
    - id: fassett1997a
      notes: >
        The Hunter Wash traverse crossed "the upper part of the continental
        Upper Cretaceous Fruitland Formation, the Kirtland Shale, and the lower
        part of the Tertiary Ojo Alamo Sandstone". Its 40Ar/39Ar ages on ash
        beds in the formation run from 75.56 ± 0.41 Ma, for an ash in "the upper
        part of the stratigraphically lowest outcropping Fruitland Formation
        coal bed in the San Juan Basin", to 74.11 ± 0.62 Ma for one "at the top
        of a coal bed at the top of the Fruitland Formation".

Fuson:
  rank: member
  parent: Lakota
  period: [Early Cretaceous]
  stages: [Valanginian, Hauterivian, Barremian]
  references:
    - id: boyd2015b
      notes: >
        Relocates the Dakotadon type locality and confirms "its provenance from
        unit L2 (lower Fuson Member equivalent) of the Lakota Formation", giving
        that position, after Cifelli and colleagues (2014), "a late Valanginian
        to early Barremian age", a span that takes in the whole Hauterivian and
        is slightly older than the Barremian previously published. Names it the
        uppermost of the formation's three members.
    - id: ostrom1970a
      notes: >
        Records the historical correlation across the region, Darton having
        written that "The Cloverly formation is believed to represent the
        Lakota sandstone, Fuson formation and Dakota sandstones of the Black
        Hills region".
    - id: cifelli2014a
      notes: >
        The Stagebarn Canyon Road mammals come from "OMNH 1254, Fuson Member,
        Lakota Formation (Lower Cretaceous: upper Valanginian–lower Barremian),
        Meade County, South Dakota, USA", a span that runs through the
        Hauterivian. The assignment rests on ostracods, the assemblage matching
        those of the eastern sequences rather than those of the Chilson Member:
        "Estimated age constraints for the section including OMNH locality
        V1254, and other ostracod assemblages of the eastern sequences, are late
        Valanginian–early Barremian."
    - id: darton1906a
      notes: >
        Inert on age and about a different region. A survey folio of the
        Bighorn country, it reaches this unit only as a Black Hills
        correlative: "The Cloverly formation is believed to represent the
        Lakota sandstone, Fuson formation, and Dakota sandstone of the Black
        Hills region." In some 428,000 characters it names no international
        stage at all, working only in Upper and Lower Cretaceous and Jurassic.

G1:
  rank: bed
  informal: true
  parent: Villalba de la Sierra
  period: [Late Cretaceous]
  references:
    - id: díezdíaz2016a
      notes: >
        Names the bed and its setting: "The bed in which the described specimen
        was collected was identified as G1 ..., corresponding to the proximal
        part of a flooded muddy plain, close to distributary channels", within
        the upper Villalba de la Sierra Formation at Lo Hueco, upper Campanian
        to lower Maastrichtian. The string does double duty, the paper also
        using G1 for one of the site's excavation areas.

GAD 5:
  rank: bed
  informal: true
  parent: Elrhaz
  period: [Early Cretaceous]
  stages: [Aptian, Albian]
  dispute:
    summary: >
      Which units it spans is read two ways, and the two sides are not
      evenly weighted. Taquet (1976), who describes the locality, places it
      in one formation - "Deposit of Gadoufaoua, GAD 5 formation (upper part
      of the formation of Elrhaz), Tegama series, Aptian" - and never
      mentions the Echkar at all, so the primary source does not recognize
      the boundary the disagreement is about. Galton (1982) and Carrano and
      colleagues (2008) keep it inside one formation too, but Galton's
      horizon line is close enough to Taquet's that the one-formation side
      reads as one determination restated rather than three independent
      votes. Sereno and colleagues (1999) instead have it crossing a
      boundary, GAD 5 "corresponds with the upper part of the Elrhaz
      Formation and the lower part of the Echkar Formation" - a reading that
      appears twenty-three years after the describing work and is the only
      support anywhere for the Albian, since Taquet's three uses of that
      stage are all for other taxa in other places.
  references:
    - id: taquet1976a
      notes: >
        Aptian, and the upper part of the Elrhaz Formation: the Ouranosaurus
        type locality is "Deposit of Gadoufaoua, GAD 5 formation (upper part of
        the formation of Elrhaz), Tégama series, Aptian", and the distribution
        line reads "Deposit of Gadoufaoua GAD 5, Elrhaz formation, Tégama
        series, Aptian, north-east Niger". The holotype skeleton came from "the
        superior part of the GAD 5, partly situated above a sandstone and
        conglomerate layer well readily identifiable, forming a cliff (cliff of
        Elrhaz)". The paratype, from the edge of an airfield 4 km south of the
        Innocents, is placed at the same level. The copy held is an English
        translation of the French monograph, so its "GAD 5 formation" is the
        translator's word and not a rank claim by Taquet, who is describing a
        numbered level.
    - id: galton1982a
      notes: >
        Separates the level from the place under its own headings, LOCALITY
        "Gadoufaoua, the region of niveau des Innocents" against HORIZON "GAD
        5, upper part of El Rhaz formation, Tégama Series, Aptian (Lower
        Cretaceous)".
    - id: sereno1999a
      notes: >
        Gives the numbering scheme and the crosscut: in the Gadoufaoua region
        "the Tegama Group was divided into eight GAD levels", GAD being "an
        abbreviation for Gadoufaoua", and GAD 5 "corresponds with the upper
        part of the Elrhaz Formation and the lower part of the Echkar
        Formation, which yielded all of the sauropod remains".
    - id: taquet1998a
      notes: >
        Gives both together in the Cristatusaurus type-locality line,
        "Gadoufaoua; GAD 5, niveau des Innocents, Tegama Formation, Aptian".
    - id: carrano2008a
      notes: >
        Tabulates abelisaurid and noasaurid material from "Elrhaz Formation
        (GAD 5); Aptian-Albian, Early Cretaceous" at Gadoufaoua.

Galula:
  rank: formation
  period: [Early Cretaceous, Late Cretaceous]
  stages: [Aptian, Albian, Cenomanian, Turonian, Coniacian, Santonian,
    Campanian]
  references:
    - id: gorscak2019a
      notes: >
        Dates the formation through its two members, which sit far apart: "the
        Mtuka Member (Aptian-Cenomanian) and Namba Member (Campanian".
    - id: gorscak2017a
      notes: >
        Gives the earlier whole-formation estimate, "middle Cretaceous
        (Aptian-Cenomanian".

Gamma:
  rank: member
  parent: Snow Hill Island
  period: [Late Cretaceous]
  stages: [Campanian, Maastrichtian]
  variants: [Herbert Sound]
  dispute:
    summary: >
      Which formation contains it is not settled. Soto-Acuña and colleagues
      (2024) give the "Gamma Member of Snow Hill Island Formation (upper
      Campanian)"; Salgado and colleagues (2006) give "the Gamma Member of the
      Santa Marta Formation (Marambio Group) (upper Campanian)".
  references:
    - id: ely2019a
      notes: >
        Gives the alternate name and the position: "The Herbert Sound or Gamma
        Member, underlies the Cape Lamb Member ... within the Snow Hill Island
        Formation", and dates it uppermost Campanian.
    - id: soto-acuña2024a
      notes: >
        Uses the Snow Hill Island reading, referring osteoderms to "the
        Campanian-Maastrichtian Gamma Member of the Snow Hill Island".
    - id: salgado2006a
      notes: >
        Uses the Santa Marta reading, and fixes a level, the Antarctopelta
        fossils being "collected about 90 m from the base of the Gamma Member".

Ganzhou:
  rank: group
  period: [Late Cretaceous]
  stages: [Cenomanian, Turonian, Coniacian]
  references:
    - id: yao2026a
      notes: >
        Gives the subdivision that created it: the strata "were further
        subdivided into the lower Ganzhou Group composed of the Maodian and
        Zhoutian formations, and the upper Guifeng Group consisting of the
        Hekou, Tangbian and Lianhe formations in ascending order". No age is
        stated for the group itself.
    - id: xing2024a
      notes: >
        Places the Zhoutian within it, "Zhoutian Formation, Ganzhou Group
        (Turonian-early Coniacian; Upper Cretaceous; 96-90 Ma)", an age from
        zircon dating that applies to the Zhoutian, which with the Maodian makes
        up the group. Counts the group among "the Upper Cretaceous Ganzhou and
        Guifeng groups" of the Jiangxi red beds.

Gaogou:
  rank: formation
  period: [Late Cretaceous]
  stages: [Cenomanian, Turonian]
  references:
    - id: pu2017a
      notes: >
        Gives the Beibeilong locality in Heimaogou, Xixia County, Henan, as "the
        Upper Cretaceous Gaogou Formation (Cenomanian-Turonian)".
    - id: wang2013c
      notes: >
        Records that the name was also applied loosely elsewhere in Henan.
        Of the egg-bearing red beds of the Xiaguan-Gaoqiu Basin it writes that
        "this set of 'red beds' has variously been called the 'Gaogou
        Formation,' 'Majiacun Formation,' 'Sangping Formation,' and 'Xiaguan
        Formation,' but none of these names was based on a formally measured
        stratigraphic section", which is what that paper supplies for the
        Xiaguan.

Gara Sbaa:
  rank: formation
  parent: Kem Kem
  period: [Late Cretaceous]
  stages: [Cenomanian]
  references:
    - id: ibrahim2020a
      notes: >
        Erects it: the strata "are recognized here as the Kem Kem Group, which
        is composed of the lower Gara Sbaa and upper Douira formations", each
        given its own chapter. Notes that the age of the "Kem Kem beds" "has
        been regarded variously as mid or early Late Cretaceous
        (Albian-Cenomanian)". The name is also a locality -- Rebbachisaurus
        garasbae came "from the locality Gara Sbaa" -- so the string does
        double duty.

Golmayo:
  rank: formation
  period: [Early Cretaceous]
  stages: [Hauterivian, Barremian]
  references:
    - id: royo-torres2017a
      notes: >
        Gives "the Golmayo Formation (upper Hauterivian-lower Barremian) in
        Soria province (Spain)" as the Soriatitan golmayensis type unit.
    - id: fuentesvidarte2016a
      notes: >
        Independently places the Zorralbo I site in the "Lower Cretaceous (upper
        Hauterivian/lower Barremian), Golmayo Formation (Iberian Range)".

Great Oolite:
  rank: group
  period: [Middle Jurassic]
  stages: [Bajocian, Bathonian, Callovian]
  references:
    - id: carrano2012a
      notes: >
        Group rank and one of its formations in a single occurrence line:
        "White Limestone Formation, Great Oolite Group; middle-late Bathonian,
        Middle Jurassic".
    - id: barron2012a
      notes: >
        Pairs it with the group below: across England "the Lower Jurassic Lias
        Group is overlain in turn by the Inferior Oolite and Great Oolite groups
        of Aalenian to earliest Callovian age". The group's own age entry is
        narrower, "Late Bajocian to Early Callovian: Parkinsoni Zone to Herveyi
        Zone".
    - id: naish2007a
      notes: >
        Dates a formation inside it, "the Bajocian-Bathonian Forest Marble
        Formation of Oxfordshire".
    - id: rauhut2010a
      notes: >
        Gives the horizon of Proceratosaurus at Minchinhampton, Gloucestershire,
        as "Great Oolite, Late Bathonian, Middle Jurassic".

Griman Creek:
  rank: formation
  period: [Early Cretaceous, Late Cretaceous]
  stages: [Albian, Cenomanian]
  references:
    - id: bell2019b
      notes: >
        New zircon dates put the fossil-bearing beds at Lightning Ridge in the
        Late Cretaceous: “The GCF preferred maximum depositional age range is
        early to mid-Cenomanian, with a range of 100.2–96.6 Ma”, dates that
        “confirm an early to mid-Cenomanian age for the fauna, rather than
        Albian, as has been reported previously”. The range is a local one —
        “this age range relates to the available exposures (and its fauna)
        around Lightning Ridge” and may not carry to “exposures of the GCF in
        other parts of the Surat Basin”, for which the paper reports
        fission-track ages of about 107 to 99 Ma and “a middle Albian age” from
        Queensland core palynology without setting either aside. Its conclusions
        add that “the local stratigraphy around Lightning Ridge cannot at this
        stage be tied into the regional stratigraphy of the GCF”.
    - id: agnolín2010a
      notes: >
        Gives "Griman Creek Formation, early-middle Albian".
    - id: bell2018a
      notes: >
        Carries the younger reading, "Griman Creek Formation (Cenomanian",
        which is why both stages are held.

Grinstead Clay:
  rank: formation
  parent: Hastings Beds
  period: [Early Cretaceous]
  stages: [Valanginian]
  dispute:
    summary: >
      Rank is contested, and the naming authority settles the position
      without settling the rank. Barker and colleagues (2023) set the
      disagreement out: the unit "subdivides the Tunbridge Wells Sands
      Formation" in one scheme "and from which the ''Suchosaurus
      cultridens'' type specimen was discovered ..., is downgraded to a
      member of the latter formation in other works". Galton (2009) uses
      formation rank and places it "at the top of the Hastings Group"; Raven
      and colleagues (2020) use formation throughout; and Norman and
      colleagues (2013) cannot keep one usage, writing Formation in the body
      and Member in both figure captions. Drew (1861), who names the unit,
      uses no rank word anywhere - he has "the bed of clay", "the second
      stratum", "the lower sands", the vocabulary of rank postdating him -
      but he is explicit about position: the clay "appears in the Tunbridge
      Wells Sand" and "divides the sand into Upper and Lower Tunbridge Wells
      Sand". That bears on the parent whichever rank is chosen, and it
      points away from the recorded one. The Tunbridge Wells Sand has no
      entry of its own.
  references:
    - id: raven2020a
      notes: >
        The Hylaeosaurus armatus holotype came from Tilgate Forest near
        Cuckfield, West Sussex, at a quarry the paper calls "An imprecisely
        located quarry", and its horizon is given as "Lower Cretaceous,
        Valanginian" after Austen and Batten (2018). The unit is treated as a
        formation throughout, abbreviated "GC Fm" in the paper's stratigraphic
        scheme for the Wealden Supergroup.
    - id: norman2013a
      notes: >
        Places the Whiteman's Green quarries at Cuckfield, West Sussex, the
        likely source of the Iguanodon anglicus lectotype and of the Kukufeldia
        tilgatensis dentary, in "Hastings Group Beds of the Grinstead Clay
        Formation ... which is a mappable lithological unit that is exposed in
        the more westerly parts of the Weald", and dates those outcrops
        "upper-middle Valanginian in age (~137 Ma)". The figure captions for
        both specimens instead call the unit the Grinstead Clay Member, "upper
        middle Valanginian".
    - id: drew1861a
      notes: >
        Coins the name: "The bed of clay that appears in the Tunbridge Wells
        Sand, and thickens to 50 ft. to the westward, may well be called
        Grinstead Clay, from its occurring on the north side of the town of East
        Grinstead ... This clay of course divides the sand into Upper and Lower
        Tunbridge Wells Sand." Drew traces it west from Penshurst Park, where 17
        feet of clay rests on a bed of white rock-sand with the Wadhurst Clay
        not far beneath, to the Balcombe Tunnel cuttings, where more than 40 ft.
        can be measured and he estimates about 50 ft. in all; at East Grinstead
        the red clay at its top is "a very useful mark by which to recognize
        this stratum", passing down into brown clay, brown shale or blue shale.
        He gives the clay no age.
    - id: barker2023a
      notes: >
        States the rank disagreement, and confirms the unit as the source of the
        Suchosaurus type specimen.
    - id: galton2009a
      notes: >
        Uses formation rank and dates it "~135 Ma (later middle Valanginian)",
        elsewhere "later mid-Valanginian", placing it at the top of the Hastings
        Group. Mostly spells the unit Grinsted, but lists it once as Grinstead
        Clay among the Hastings Beds.

Gruhalde:
  rank: member
  parent: Klettgau
  period: [Late Triassic]
  stages: [Carnian, Norian, Rhaetian]
  references:
    - id: zahner2019a
      notes: >
        Gives the parent and the position: the Frick Plateosaurus material "is
        derived from the middle part of the Gruhalde Member of the Klettgau
        Formation", and a new layer sits "1m beneath the Triassic-Jurassic
        boundary, uppermost Gruhalde Member, Klettgau Formation, latest
        Norian", in the Gruhalde clay pit at Frick, Canton Aargau.
    - id: rauhut2020a
      notes: >
        Places the Bratelen Bonebeds "on top of the Gruhalde Member", where the
        studied sauropodomorph material comes from.
    - id: jordan2016a
      notes: >
        Formally defines the member within the newly named Klettgau Formation
        and gives its chronostratigraphic age as "Carnian to Rhaetian (?)",
        following the German scheme of the DSK and of Kozur and Bachmann (2008);
        it "encompasses all strata formerly called «Bunte Mergel», «Obere Bunte
        Mergel», and «Knollenmergel»", with the Gruhalde clay pit at Frick AG as
        its type locality. In the middle part of the type section, where
        coarse-grained sand allows correlation with the German Löwenstein
        Formation, "The presence of Plateosaurus remains points to a Late Norian
        age".

Grès supérieurs:
  rank: formation
  period: [Early Cretaceous]
  stages: [Barremian, Aptian, Albian]
  references:
    - id: allain1999a
      notes: >
        Gives the type horizon for Tangvayosaurus as "Grès supérieurs
        Formation, Aptian-Albian" at Tang Vay, Savannakhet Province, Laos, dated
        "by the occurrence of fresh water pelecypods of the Trigonioidacea
        super-family".
    - id: allain2012a
      notes: >
        Gives the correlation: the formation "is considered here the lateral
        equivalent of the Khok Kruat and Phu Pan formations in neighboring
        Thailand and is probably late Barremian to early" Aptian. The
        correlation is a lateral equivalence between countries, not an alternate
        name.

Grès à Reptiles:
  rank: formation
  period: [Late Cretaceous]
  stages: [Campanian, Maastrichtian]
  references:
    - id: leloeuff1998a
      notes: >
        Type horizon for Variraptor: "Grès à Reptiles Formation; Late Campanian
        to Early Maastrichtian ...; La Bastide Neuve (Fox-Amphoux, Var,
        France)", the locality lying "in the Fox-Amphoux syncline, 35 km west of
        Draguignan". The bare name is this paper's own for the Var succession
        rather than a shortening of the Argiles et Grès à Reptiles, which is the
        Aix-en-Provence basin's formation. The two are separate units, not two
        spellings. The same name is used here for Roques-Hautes in the
        Bouches-du-Rhône.
    - id: turner2012a
      notes: >
        Records Variraptor mechinorum from the "Late Campanian to Early
        Maastrichtian, Late Cretaceous, Grès à Reptiles Formation, La Bastide
        Neuve".

Grünbach:
  rank: formation
  period: [Late Cretaceous]
  stages: [Campanian]
  references:
    - id: csiki-sava2015a
      notes: >
        Gives the age and what it rests on: the "Grünbach Formation was dated as
        early Campanian on the basis of foraminiferan (Globotruncana elevata
        Zone) and nannoplankton data (Zone UC 15)", and the Muthmannsdorf fauna
        comes from it. Records that Suess (1881) had suggested a pre-Turonian age.
    - id: augustin2023a
      notes: >
        Places it in its group and names the workings: the Mochlodon suessi
        material came from the "'coal-bearing series' of Muthmannsdorf, which
        was mined until the end of the 19th century and which is assignable to
        the lower Campanian Grünbach Formation of the Gosau Group".
    - id: suess1881a
      notes: >
        Describes the horizon before it had a name - the formation and the
        locality are named nowhere in the paper - identifying it by position in
        the Gosau succession of the "Neue Welt" south of Vienna, as the
        freshwater sandstones, marls and coal with Melanopsis, Unio and a palm
        flora above the basal breccia: "It is this horizon which has yielded
        the reptilian bones." The pre-Turonian age sometimes quoted from it
        follows from one correlation rather than from the fossils of this unit:
        the rudist-coral limestone higher in the same succession is taken to be
        "the true French Turonian zone of Hippurites cornu-vaccinum", and the
        conclusion is drawn from below it - "it is certain that they are older
        than the true Turonian deposits, and especially older than the zone of
        Hippurites cornu-vaccinum". The datum is the zone, so recalibrating it
        removes the deduction; the relative succession the paper gives is the
        Gosau Group as still understood.

Guettioua:
  rank: formation
  period: [Middle Jurassic]
  stages: [Bathonian]
  references:
    - id: allain2008a
      notes: >
        Gives "The Bathonian Guettioua Formation has yielded the skeleton of the
        sauropod Atlasaurus imelakei", and names "its lateral equivalent in the
        Middle Atlas, the El Mers Formation". Places it last of the three
        formations of the sequence, after the Djebel Sidal and the Iouaridene.
        The lateral equivalence is between areas, not an alternate name.
    - id: dai2022a
      notes: >
        Lists it among the Middle Jurassic dinosaur-bearing units worldwide,
        beside the Shaximiao, Zhiluo, Shishugou, Forest Marble and Cañadón
        Asfalto.
    - id: mannion2019a
      notes: >
        Refers to Atlasaurus as "the late Middle Jurassic Moroccan
        non-neosauropod eusauropod Atlasaurus imelakei (Guettioua Formation)",
        and counts it among the sauropods of "the Bathonian of Morocco".

Gugyedong:
  rank: formation
  parent: Hayang
  period: [Early Cretaceous]
  stages: [Aptian]
  references:
    - id: kim1983a
      notes: >
        Gives the Ultrasaurus tabriensis horizon as "the Gugyedong Formation of
        the Hayang Group", a light gray granite cobble-bearing paraconglomerate
        that is "an exceptional intercalation in the red beds of the Cretaceous
        System in Korea". No stage is given.
    - id: wilson2005a
      notes: >
        A reference work, tabulating the same occurrence as Aptian.

Guichón:
  rank: formation
  period: [Early Cretaceous, Late Cretaceous]
  stages: [Aptian, Albian, Cenomanian, Turonian, Coniacian, Santonian,
    Campanian, Maastrichtian]
  dispute:
    summary: >
      The age is openly unresolved across most of the Cretaceous. Soto and
      colleagues (2012) state it plainly: "the age of the Guichón Formation is
      not clear. Proposed ages range from Aptian ... to Santonian-?Campanian",
      with the geological evidence and the fossil evidence pulling different
      ways. Soto Núñez and colleagues (2026) argue from a sauropod "deeply
      nested within Aeolosaurini", a "Coniacian-Maastrichtian clade", for the
      younger end.
  references:
    - id: soto2012a
      notes: >
        States the range of proposed ages, "from Aptian ... to
        Santonian-?Campanian": the unconformity with the overlying Mercedes
        Formation and the facies likeness to the Albian Migues Formation "led
        some authors ... to suggest an Early Cretaceous age for this unit".
        Reports the unit's correlation with the Argentinean Puerto Yeruá
        Formation, and concludes that a derived lithostrotian with Sphaerovum
        eggshells "provides an important biostratigraphic criterion to allocate
        the Guichón Formation ... to the Late Cretaceous".
    - id: sotonúñez2026a
      notes: >
        Argues the younger end from faunal affinity: in "the Upper Cretaceous
        Guichón Formation", a new sauropod nested in Aeolosaurini, "a
        Coniacian-Maastrichtian clade", "provides additional evidence that
        suggests this age". Notes that the unit was first dated "'Cenomanian or
        older'" by Rusconi (1933) and "even Aptian" by Goso and Perea (2003),
        concludes that "most lines of evidence seem to point to a latest
        Cretaceous age for the Guichón/Puerto Yeruá Formation, perhaps late
        Santonian-early Campanian", and places the formation between "the
        Hauterivian basaltic flows of the Arapey Formation" below and "the
        Campanian-Maastrichtian Mercedes Formation" above.
    - id: bandeira2024a
      notes: >
        Tabulates it as "Turonian - Santonian" for an unnamed iguanodont from
        Uruguay, following von Huene (1934) and Soto and colleagues (2012).
    - id: rusconi1933a
    - id: goso2003a
    - id: huene1934b

Guifeng:
  rank: group
  period: [Late Cretaceous]
  stages: [Campanian, Maastrichtian]
  references:
    - id: yao2026a
      notes: >
        Gives the group's order, "the upper Guifeng Group consisting of the
        Hekou, Tangbian and Lianhe formations in ascending order", and dates the
        topmost of those: the Lianhe Formation "can be dated to the Maastrichtian
        according to the spore and pollen assemblages".
    - id: zhu2024a
      notes: >
        Places the Tangbian Formation in the group, "This set of strata is
        classified locally as Tangbian Formation, which belongs to Guifeng
        Group".
    - id: xing2024a
      notes: >
        Names the group's three formations in Jiangxi, "the Guifeng Group
        consists of the Hekou, Tangbian, and Lianhe formations", and places it
        above the Ganzhou Group, with its Maodian and Zhoutian formations, as
        the upper of "the Upper Cretaceous Ganzhou and Guifeng groups".

Haifanggou:
  rank: formation
  period: [Middle Jurassic, Late Jurassic]
  stages: [Bathonian, Callovian, Oxfordian]
  references:
    - id: wang2019a
      notes: >
        Gives "Haifanggou Formation, Yanliao Biota (Oxfordian" for the
        Ambopteryx horizon, a stratigraphic equivalent of the formation, and
        reports that "growing evidence suggests that the Haifanggou Formation
        preserves the early phase of this biota (early Oxfordian)". It also
        reports studies assigning the Wubaiding Village strata to the Haifanggou
        Formation, by which "the main salamander-bearing sediments were
        deposited during the Callovian age".
    - id: pittman2020a
      notes: >
        Places Pedopenna in "the Middle Jurassic Bathonian Haifanggou
        Formation", distinct from the "Late Jurassic Oxfordian Tiaojishan
        Formation" that yields Anchiornis, and elsewhere calls the unit the
        "Middle and Late Jurassic Haifanggou Formation".

Hakobuchi:
  rank: formation
  parent: Yezo
  period: [Late Cretaceous]
  stages: [Campanian, Maastrichtian]
  references:
    - id: kobayashi2019a
      notes: >
        Gives the Kamuysaurus horizon in "the Upper Cretaceous Hakobuchi
        Formation of the Yezo Group" as "the middle of IVb unit (early
        Maastrichtian) of the Hakobuchi Formation of the Yezo Group", from
        marine outer-shelf deposits along the Shirafunezawa Creek in the
        northern Hobetsu area of Mukawa town, Hokkaido.
    - id: takashima2004a
      notes: >
        Defines the formation, corresponding to the Hakobuchi Group of Matsumoto
        (1942), as a "Lower Campanian–Paleocene shallow-marine
        sandstone-conglomerate unit", "deposited during the Campanian–Early
        Maastrichtian and Late Paleocene interval". The Campanian age rests on
        Globotruncana rugosa in its lower part, with a Paleocene foraminifer in
        the upper part.
    - id: matsumoto1942a

Hall Lake:
  rank: formation
  period: [Late Cretaceous]
  stages: [Campanian, Maastrichtian]
  references:
    - id: dalman2022b
      notes: >
        Describes Sierraceratops from the "Upper Cretaceous (uppermost
        Campanian–Maastrichtian) Hall Lake Formation of south-central New
        Mexico", and fixes the lower part by a U-Pb age reported by Amato and
        colleagues (2017) "of 73.2 ± 0.7 Ma on a tuff bed about 10 m above the
        base", which makes the dinosaurs of the 23 to 43 m interval above the
        base "likely late Campanian in age".
    - id: amato2017a
      notes: >
        The pink tuff, 10 to 15 m above the base of the Hall Lake Member of the
        Upper Cretaceous McRae Formation, gave a U-Pb zircon age of 73.2 ± 0.7
        Ma, so that "the middle and upper parts of the Jose Creek Member and at
        least the lower 15 m of the overlying Hall Lake Member are 75–73 Ma in
        age (late Campanian)". Two dinosaur fossils from the member, a
        Tyrannosaurus rex jaw fragment and Torosaurus horn and frill fragments,
        "indicate a late Maastrichtian age", although "the stratigraphic
        positions of the fossils within the Hall Lake Member are uncertain", and
        whether the member crosses the Cretaceous-Paleogene boundary "is not
        known".

Hanson:
  rank: formation
  period: [Early Jurassic]
  stages: [Sinemurian, Pliensbachian]
  references:
    - id: smith2007b
      notes: >
        Gives "the Early Jurassic Hanson Formation of the Central Transantarctic
        Mountains". Gives only the series, not a stage.
    - id: smith2007a
      notes: >
        Brackets it rather than dating it: Dicroidium odontopteroides in the
        Falla Formation "300 meters below the vertebrate bearing layers" and
        spore assemblages there "provide an upper bound of Carnian-Norian (Late
        Triassic) for the base of the Hanson Formation", while "a radiometric
        date of 177±2 Ma of the overlying Prebble Formation and Kirkpatrick
        Basalt" gives "a lower bound of Aalenian (earliest Middle Jurassic) for
        the top".
    - id: benson2010b
      notes: >
        Gives Cryolophosaurus ellioti as "from the Hanson Formation
        (Sinemurian–Pliensbachian) of Antarctica".

Haoling:
  rank: formation
  period: [Early Cretaceous]
  stages: [Aptian, Albian]
  references:
    - id: han2024a
      notes: >
        Gives "Haoling Formation, Early Cretaceous (Aptian".
    - id: sethapanichsakul2026a
      notes: >
        Gives "Haoling Formation, Aptian-Albian".

Hasandong:
  rank: formation
  period: [Early Cretaceous]
  stages: [Hauterivian, Barremian]
  references:
    - id: dong2001a
      notes: >
        Describes Pukyongosaurus from the Early Cretaceous Hasandong Formation
        of the Gyeongsang Basin, Korea, on seven incomplete cervicals, a dorsal,
        a complete haemal arch and fragments from a single individual. Gives
        only the series, not a stage.
    - id: wilson2009a
      notes: >
        Its table of Cretaceous Asian sauropods dates the Hasandong occurrences,
        Pukyongosaurus millenniumi and the teeth of 'Chiayusaurus asianensis'
        and unnamed titanosaurid and camarasaurid forms, as Barremian.
    - id: carrano2012a
      notes: >
        Its table of unnamed tetanuran occurrences dates KS 7001, the
        megalosaurid material of Lim and colleagues (2002), as "Hasandong
        Formation; Hauterivian–Barremian; Early Cretaceous", and lists the
        allosaurid specimens KPE 8004 and 8005 of Park and colleagues (2000)
        from the same formation as "Barremian, Early Cretaceous".

Hastings Beds:
  rank: group
  parent: Wealden
  period: [Early Cretaceous]
  stages: [Berriasian, Valanginian, Hauterivian]
  references:
    - id: taylor2007a
      notes: >
        Gives "the Berriasian-Valanginian Hastings Beds Group of Ecclesbourne
        Glen, East Sussex, England", and contrasts it with "the Barremian
        Wessex Formation of the Isle of Wight" as the older mainland Wealden.
    - id: barker2023a
      notes: >
        Gives the group's contents and their ages, "the older (late
        Berriasian-early Valanginian) Ashdown Formation, followed by the
        Wadhurst Clay Formation (Valanginian) and Tunbridge Wells Formation
        (late Valanginian)", and makes it "the basal unit of the Wealden
        Supergroup within the Weald sub-basin". Prints the shorter name Hastings
        Group.
    - id: norman2013a
      notes: >
        Heads its stratigraphic review "Hastings Group, Valanginian Stage",
        also using the shorter name.
    - id: galton2009a
      notes: >
        Puts the Grinstead Clay at the top of it -- the finds were made "from
        the Grinsted Clay Formation (later mid-Valangian ...) at the top of the
        Hastings Group" -- spelling both the clay Grinsted and the group
        Hastings.
    - id: naish2007a
      notes: >
        Places the group in the Lower Cretaceous: "the Lower Cretaceous of
        southern England is also noted for the dinosaur-bearing Hastings Beds
        Group, Weald Clay Group and Wealden Group of Kent, Sussex, and the Isle
        of Wight". Its exposures in West and East Sussex, with those of the
        Weald Clay Group, have yielded large theropod and iguanodontian
        material, and it also produces dinosaur remains in Kent.

Hayang:
  rank: group
  period: [Early Cretaceous]
  stages: [Aptian]
  references:
    - id: kim1983a
      notes: >
        Names the group by way of the Gugyedong Formation inside it, in the
        Cretaceous of Korea.

Hekou:
  rank: group
  period: [Early Cretaceous]
  stages: [Valanginian, Hauterivian, Barremian, Aptian, Albian]
  references:
    - id: you2006a
      notes: >
        "the Lower Cretaceous Hekou Group of the Lanzhou Basin, Gansu, China".
        No stage is given.
    - id: li2014a
      notes: >
        Scopes it to the wider basin: "the Hekou Group (Lower Cretaceous) of
        the Lanzhou-Minhe Basin, Gansu Province, China".
    - id: yang2013a
      notes: >
        Argues that the Hekou Group yielding Taohelong is probably equivalent in
        age to the Barremian, since its closest relatives, Polacanthus foxii
        from England and Gastonia burgei from North America, are both Barremian.
        The specimen comes from shallow lacustrine beds in the middle of the
        group, in the fifth of its eight informal lithostratigraphic units.
    - id: averianov2025b
      notes: >
        Places Daxiatitan in "the Aptian part of the Hekou Group in Gansu,
        China", following You and colleagues (2008).
    - id: you2008a
      notes: >
        Gives an epoch and a rank above this entry's, describing Daxiatitan
        binglingi as "discovered from the Lower Cretaceous Hekou Group of
        Lanzhou Basin, Gansu Province". No stage name and no numeric age appear
        anywhere in the paper, so it supports the entry's period and none of
        its stages.
    - id: oyabu2026a
      notes: >
        Reviewing the Asian nodosaurids, places Taohelong jinchengensis in "the
        Hekou Group (Valanginian–Albian ... ) in Gansu Province", taking that
        range from the Cretaceous timescale of Xi and colleagues (2018).

Hell Creek:
  rank: formation
  period: [Late Cretaceous]
  stages: [Maastrichtian]
  references:
    - id: arbour2017b
      notes: >
        Places its material "61-67 m below Cretaceous-Palaeogene boundary, late
        Maastrichtian".
    - id: sullivan2006a
      notes: Independently gives the formation as "late Maastrichtian".
    - id: woodruff2023a
      notes: >
        Gives the Sphaerotholus triregnum holotype as from "the lower half of
        the Hell Creek Formation (upper Maastrichtian, Upper Cretaceous)", about
        45 km southwest of Jordan in Garfield County, Montana.

Hikagenosawa:
  rank: formation
  parent: Yezo
  period: [Early Cretaceous, Late Cretaceous]
  stages: [Albian, Cenomanian]
  references:
    - id: oyabu2026a
      notes: >
        Gives the nodosaurid skull as from "the upper part of the marine
        Hikagenosawa Formation (upper Cenomanian) in Yubari City, Hokkaido,
        Japan", preserved in a concretion, and places the unit in the Yezo
        Group, which is "mainly marine deposits" but has produced several
        dinosaurs.
    - id: hayakawa2005a
      notes: >
        The original description of the same specimen, from the Cenomanian of
        the same locality.
    - id: takashima2004a
      notes: >
        Defines it in the Yezo Group as the "Upper Albian-Middle Cenomanian
        mudstone-dominant unit". "The late Albian-middle Cenomanian ammonoids
        Mortoniceras rostratum (Sowerby), Mariella bergeri (Brongniart),
        Mantelliceras saxbii (Sharpe) and Cunningtoniceras cunningtoni (Sharpe)
        occur in the formation", and planktonic foraminifers from it indicate "a
        Late Albian-Late Cenomanian age". Its key-bed table dates the Kanajiri
        Sandstone Member, in the lower middle part of the formation, as latest
        Albian.

Himes:
  rank: member
  parent: Cloverly
  period: [Early Cretaceous, Late Cretaceous]
  stages: [Albian, Cenomanian]
  references:
    - id: tanaka2024a
      notes: >
        Gives "Himes Member of the Cloverly Formation in Wyoming, USA (Albian".
    - id: d'emic2019a
      notes: >
        The flora of the Himes Member "dates to the middle Albian–earliest
        Cenomanian". Detrital zircons give maximum depositional ages of 107.0 ±
        1.3 Ma near the base of the member south of Cody and 103.6 ± 1.3 Ma for
        its fluvial sandbody northwest of Lovell, and the paper puts the Himes
        Member and Greybull Sandstone together in "the mid–late Albian to early
        Cenomanian (ca. 109–98 Ma)".

Hongqin:
  rank: formation
  period: [Middle Jurassic]
  references:
  - id: huang2014a
    notes: >
      Middle Jurassic of Shexian, Huangshan, Anhui, and the source of the
      first Jurassic dinosaur described from the province.
  - id: ren2018a
    notes: >
      Purple sandstones interbedded with purple shales in the Tunxi Basin of
      Anhui, assigned to the Middle Jurassic on invertebrates.
  - id: li2025a
    notes: >
      Lists the formation among the Middle Jurassic units of China that
      yield mamenchisaurids.

Hongtuling:
  rank: formation
  period: [Late Cretaceous]
  references:
    - id: zhao2008a
      notes: >
        Gives the unit as Early Cretaceous in a compiled distribution field,
        which stacks the locality "Hongtuling range, Luonan, Shaanxi", the unit
        "Hongtuling Formation" and the age on three separate lines rather than
        stating them in a sentence. Xue and colleagues give the same horizon at
        the same locality as Upper Cretaceous twice over, and the remarks that
        close this entry cite Holtz and colleagues (2004), whose volume gives
        the occurrence as Late Cretaceous.
    - id: xue1996a
      notes: >
        Gives the Qinlingosaurus horizon as "Hongtuling, Luonan, Shaanxi; Upper
        Cretaceous Hongtuling Formation". Gives only the series, not a stage.

Hongtuya:
  rank: formation
  parent: Wangshi
  period: [Late Cretaceous]
  stages: [Campanian]
  references:
    - id: an2015a
      notes: >
        The formation "was deposited during the Campanian", from a 77.3 Ma
        maximum depositional age for "the dinosaur bone beds of the Hongtuya
        Formation"; the paper also places it in "the Late Cretaceous Wangshi
        Group" and says it "was deposited in the latest Cretaceous".
    - id: yao2026a
      notes: >
        Narrows it to "middle to late Campanian". Where the unit sits within the
        Wangshi Group is contested.

Hornitos:
  rank: formation
  period: [Late Cretaceous]
  stages: [Campanian, Maastrichtian]
  references:
    - id: rubilar-rogers2021a
      notes: >
        Describes Arackar from "the Upper Cretaceous (Campanian–Maastrichtian)
        beds of the Hornitos Formation, Atacama Region, northern Chile", the
        holotype coming from the lower to middle levels of the formation at La
        Higuera ravine.
    - id: powell2003a
      notes: >
        Describes the lithology, after Chong Diaz (1985), as "sandstones,
        mudstones, conglomerates and limestones, with intercalated andesitic
        flows and breccias", the material coming from a calcareous-marly bed,
        and gives the age from the same source as "Late Cretaceous?-Early
        Tertiary".

Horseshoe Canyon:
  rank: formation
  period: [Late Cretaceous]
  stages: [Campanian, Maastrichtian]
  references:
    - id: larson2010a
      notes: >
        Gives the span and where the stage boundary falls within it: the
        formation "was deposited during late Campanian and early Maastrichtian
        time, with the boundary between these two stages approximately
        equivalent to the boundary between" the units it names, the Drumheller
        Marine Tongue being the marker.
    - id: eberth2012a
      notes: >
        The stratigraphic revision that gives "The Upper Cretaceous paralic to
        nonmarine Horseshoe Canyon Formation" its members: it "is divided into
        seven mappable members: Strathmore, Drumheller, Horsethief, Morrin,
        Tolman, Carbon, and Whitemud (bottom to top)". In its thickest and most
        complete sections the formation spans "approximately 7 million years,
        ranging from late Campanian (∼74.0 Ma; magnetochron 33n) to late
        Maastrichtian", about 67 Ma, following Lerbekmo and Braman (2002).
    - id: lerbekmo2002a
      notes: >
        Places the Campanian-Maastrichtian boundary inside the formation rather
        than at either of its limits, concluding that the boundary, "if placed
        at the base of the Hoploscaphites constrictus Zone, occurs at the top
        of 32n.1n", which is why the unit carries both stages.
        It also explains why other sources give the formation different tops:
        this paper counts the Whitemud and Battle as formations in their own
        right, listing "the overlying continental Edmonton Group (Horseshoe
        Canyon, Whitemud, Battle, and Scollard formations)", whereas Eberth and
        Braman (2012) make the Whitemud the topmost member of this formation.
        The two are describing the same rock with the boundary drawn in
        different places, not disagreeing about its age.
        Two cautions on its numbers. Its magnetostratigraphy reassigns the
        thick normal interval low in the formation, so that from the Drumheller
        Marine Tongue down to the middle of the basal sandstone the section
        "all belongs to magnetozone 32n", where earlier work had read it as
        33n. And its own radiometric anchor is not fully published: the Dorothy
        Bentonite, 20 m below the top of 33n, "has yielded a Rb/Sr date on
        biotite of 73.2 Ma (H. Baadsgaard and J.F. Lerbekmo, unpublished
        data)", the other anchor being an external date of 79.34 Ma for the
        base of that chron.

Horsethief:
  rank: member
  parent: Horseshoe Canyon
  period: [Late Cretaceous]
  stages: [Campanian, Maastrichtian]
  references:
    - id: eberth2012a
      notes: >
        One of the "seven mappable members: Strathmore, Drumheller, Horsethief,
        Morrin, Tolman, Carbon, and Whitemud (bottom to top)". No stage is given
        for the member alone; the paper groups it with those above it as the
        interval during which "there were more complex and frequent changes in
        climate, volcanism, orogenesis, landscape weathering, and soil
        formation".
    - id: eberth2020a
      notes: >
        Provisionally places the Campanian–Maastrichtian boundary inside the
        member, in its upper part: "we propose that the C-M boundary lies in the
        upper Horsethief Member, and conservatively assign it an interpolated
        age range of 71.8–71.4 Ma". Interpolates its base at 72.2 ± 0.1 Ma and
        the overlying Horsethief-Morrin boundary at 71.5 ± 0.1 Ma.

Houcheng:
  rank: formation
  period: [Late Jurassic, Early Cretaceous]
  stages: [Tithonian, Berriasian]
  references:
    - id: butler2011a
      notes: >
        Cites the Xuanhuaceratops description as from "the Upper Jurassic
        Houcheng Formation of Hebei, China". Gives only the series, not a stage.
    - id: han2015a
      notes: >
        Sets it among the Upper Jurassic ceratopsian-bearing units of China,
        though it places the formation in Liaoning rather than Hebei.
    - id: liu2012a
      notes: >
        Treats it as the Hebei name of "the Upper Jurassic-Lower Cretaceous
        Tuchengzi Formation (called the Houcheng Formation in Hebei Province)",
        and dates the Tuchengzi/Houcheng Formation from "the latest Jurassic
        (Tithonian) to the earliest Cretaceous (Berriasian)" on reported ages of
        156 to 139 Ma.

Huajiying:
  rank: formation
  period: [Early Cretaceous]
  stages: [Hauterivian, Barremian]
  dispute:
    summary: >
      How Qiaotou relates to this unit is read three ways. Pittman and
      colleagues (2020) equate the names outright, writing "the
      Hauterivian-Barremian Huajiying (Qiaotou) Formation of Hebei, China". Ji
      and colleagues (2005) instead describe Jinfengopteryx from "the middle
      part of the Qiaotou Formation" as a unit in its own right. Xing and
      colleagues (2020) make it a member, placing the vertebrate fossils "in the
      lower part of the formation (Sichakou and Qiaotou members)".
  references:
    - id: jin2008a
      notes: >
        Dates the formation Early Cretaceous and sets out its members: the
        bird-bearing beds and the underlying intermediate-basic volcanics are
        assigned to "the Early Cretaceous Huajiying Formation" as its second and
        first members in the Sichakou and Senjitu area, and the Senjitu bird
        localities lie in the Qiaotou sedimentary member of that formation. The
        Protopteryx-bearing lower assemblage is about 130.7 Ma, the earliest
        vertebrate assemblage known in the Jehol Biota, while the age of the
        Qiaotou assemblage "is not very clear yet by now" and the 122.1-126.9 Ma
        figures published for it are "not widely accepted due to lack of
        accuracy".
    - id: xing2020a
      notes: >
        Uses member rank for both the Sichakou and the Qiaotou inside this
        formation, and dates them by 40Ar/39Ar "to the weighted mean age of
        130.7 Mya" in the Sichakou Basin of Fengning Autonomous County, Hebei.
    - id: pittman2020a
      notes: >
        Equates the two names and dates the unit Hauterivian-Barremian, noting
        that Jinfengopteryx from it is the oldest Asian troodontid record and
        "was originally described as an avialan".
    - id: ji2005a
      notes: >
        Never names this unit, and uses a different rank for the part it does
        name. Jinfengopteryx is placed in "the middle part of the Qiaotou
        Formation in Waigoumen area, Fengning County", at formation rank,
        where the registry and the entry's other references make the Qiaotou a
        member within this formation. No stage appears anywhere in it, so the
        reference is a rank datum and a locality rather than an age.

Huincul:
  rank: formation
  parent: Neuquén
  period: [Late Cretaceous]
  stages: [Cenomanian, Turonian]
  dispute:
    summary: >
      Where the unit's top falls is unsettled and both readings are in current
      use. Hugo and Leanza (2001) confine it to the Cenomanian, placing the
      Turonian of the Rio Limay Subgroup in the Cerro Lisandro Formation above,
      and Leanza and colleagues (2004) follow them with "probably Late
      Cenomanian"; Bellardini and colleagues give "upper Cenomanian" in 2023 and
      again in 2025. Garrido (2010) instead makes a tentative assignment to the
      upper Cenomanian to Turonian, which most later work adopts. Simon and
      colleagues (2025) set the two out side by side rather than choosing. A
      third reading, Corbella and colleagues' fission-track date implying a
      Turonian to Santonian span, is not current: Garrido rejects the dated tuff
      as too altered and no later work follows it.
  references:
    - id: lerzo2024a
      notes: >
        Sidersaura marae was found in "rocks of the Huincul Formation (upper
        Cenomanian – Turonian) of Neuquén Province, Argentina", in the basal
        levels of the unit at Barda Atravesada de Las Campanas near Villa El
        Chocón. For the unit as a whole the paper follows Garrido (2010), under
        whom "the age of the Huincul Formation corresponds to upper
        Cenomanian-Turonian".
    - id: nogueira2024a
      notes: >
        Chakisaurus nekul, the first named ornithischian from the unit, comes
        from "the Huincul Formation (Cenomanian-Turonian, Upper Cretaceous) at
        the Pueblo Blanco Natural Reserve, Río Negro province, Argentina". The
        geological setting repeats that span, placing the formation in the
        Neuquén Group after Garrido (2010), and describes it as yellowish and
        greenish fine- to medium-grained sandstones that are sometimes
        tuffaceous.
    - id: apesteguía2016a
      notes: >
        "The fossiliferous Huincul Formation (Late Cenomanian-Early Turonian) is
        widely exposed in Neuquen and Rio Negro provinces of northern Patagonia,
        Argentina", and the holotype of Gualicho shinyae comes from near its
        base on the Meseta de la Renteria. The age matters to the argument: it
        is what makes the Huincul dinosaur fauna comparable with the Kem Kem,
        Bahariya and Echkar assemblages of North Africa, and with the Bajo
        Barreal Formation and the Bayo Overo Member of the Cerro Barcino
        Formation in Patagonia.
    - id: bellardini2023a
      notes: >
        Places the articulated rebbachisaurid MAU-Pv-EO-629 in "the lower
        section of Huincul Formation (upper Cenomanian)" at El Orejano, where
        only the basal layers of the unit are exposed, and calls these "the
        Upper Cretaceous outcrops of the Huincul Formation (upper Cenomanian)".
        The surrounding stratigraphy is set out explicitly: the Rayoso Formation
        of the Bajada del Agrio Group below is Aptian-Albian, while the
        Candeleros, Huincul and Cerro Lisandro formations of the Neuquen Group
        are Cenomanian-Turonian.
    - id: simón2025a
      notes: >
        Sets out the competing age estimates for the unit at Villa El Chocon,
        where it overlies the Candeleros Formation and is overlain by the Cerro
        Lisandro Formation: late Cenomanian, between 93 and 91 Ma, after
        Legarreta and Gulisano (1989) and Leanza (1999), or upper Cenomanian to
        Turonian after Garrido (2010). The paper itself uses "upper
        Cenomanian-Turonian" throughout, takes the new rebbachisaurid from the
        lower levels, and reads the upper levels, "those that presumably
        correspond to the Turonian", as the interval that no longer yields
        rebbachisaurids.
    - id: bellardini2025a
      notes: Gives "Huincul Formation (upper Cenomanian".
    - id: cerroni2020a
      notes: >
        Gives "Huincul Formation (Cenomanian-Turonian".
    - id: baiano2020a
      notes: >
        Places the Huinculsaurus level at "the top of the Huincul Formation
        (upper Cenomanian-Turonian" at Aguada Grande, Neuquén Province,
        following Keidel (in Wichmann, 1927) and Garrido (2010).
    - id: wichmann1927a
    - id: garrido2010a
      notes: >
        "Although this unit has some palyno-floristic studies and radiometric
        data, the age of its deposits is not yet well established." Legarreta
        and Gulisano (1989) put it between 93 and 91 Ma, "between the upper
        Cenomanian and the lower Turonian", while Hugo and Leanza (2001) and
        Leanza and colleagues (2004) place it "exclusively within the upper
        Cenomanian", and an 88 ± 3 Ma tuff at the base of the unit at Cerro
        Policía, reported by Corbella and colleagues (2004), is too altered for
        the paper to accept without more data. Weighing these, the paper makes
        "a tentative assignment ... of the Huincul Fm. to an age between the
        Upper Cenomanian and the Turonian".
    - id: legarreta1989a
    - id: hugo2001a
      notes: >
        Assigns the Rio Limay Subgroup to the Cenomanian to lower Turonian
        while placing the Huincul Formation itself in the Cenomanian, the
        Turonian part of that span belonging to the Cerro Lisandro Formation
        above it. Dates the Neuquen Group as a whole from the early Cenomanian
        at 97 plus or minus 3 Ma to the early Campanian at 74 plus or minus 3
        Ma. This is the source behind the readings that keep the unit out of the
        Turonian.
    - id: corbella2004a
      notes: >
        Reports the first radiometric age for the Neuquen Group, a
        fission-track determination on an ash-flow tuff at the base of the unit,
        giving a mean of 88 plus or minus 3.9 Ma and a depositional range of
        84.1 to 91.9 Ma - from the base of the Turonian to the top of the
        Santonian. The authors read this as making the formation younger than
        previously thought, deposition beginning around the early Turonian and
        possibly persisting to the late Santonian if the error is taken at its
        full width, and add that this need not make the underlying Candeleros
        Formation much younger. Garrido (2010) declines the determination on the
        ground that the tuff is too altered.
    - id: leanza2004a
      notes: >
        "The age of the Huincul Formation is probably Late Cenomanian",
        following Hugo and Leanza (2001), while the Rio Limay Subgroup that
        contains it "can be regarded as Cenomanian to Early Turonian" and the
        overlying Cerro Lisandro Formation as "Late Cenomanian-Early Turonian".
        Describes the unit as yellowish and greenish fine- to medium-grained
        sometimes tuffaceous sandstones, 50 to 250 m thick, conformably between
        the Candeleros below and the Cerro Lisandro above, with a white tuff up
        to 2.5 m thick close to its base in the Cerro Policia region.

Huiquanpu:
  rank: formation
  period: [Late Cretaceous]
  stages: [Cenomanian, Turonian, Coniacian, Santonian, Campanian]
  references:
    - id: pang2000a
      notes: >
        Gives "the Upper Cretaceous Huiquanpu Formation, Tianzhen County, Shanxi
        Province" for the Huabeisaurus type, and from the associated
        ankylosaurid Tianzhenosaurus, hadrosaurids, ostracods and charophytes
        takes "the Huabeisaurus-bearing beds" to be "Late Cretaceous probably
        Campanian in age".
    - id: pang2024a
      notes: >
        Resolves a specimen to "the second member of the Upper Cretaceous
        Huiquanpu Formation", a numbered member. Its charophyte assemblage shows
        "transitional features between the Early and Late Cretaceous, but with
        clear Late Cretaceous character, so it is appropriately assigned to the
        Cenomanian–Campanian of the Late Cretaceous"; the ostracods and the
        spore and pollen assemblage indicate the middle to late part of the Late
        Cretaceous, and paleomagnetic correlation places the upper
        dinosaur-bearing interval in the Campanian, at about 83 to 72 Ma.

Hunter Wash:
  rank: member
  parent: Kirtland
  period: [Late Cretaceous]
  stages: [Campanian]
  references:
    - id: dalman2025a
      notes: >
        Gives "Hunter Wash Member of the Kirtland Formation, Upper Cretaceous
        (late Campanian".
    - id: jasinski2011a
      notes: >
        Independently dates the member late Campanian.

Hypsilophodon:
  rank: bed
  informal: true
  parent: Wessex
  period: [Early Cretaceous]
  stages: [Barremian, Aptian]
  references:
    - id: galton1974a
      notes: >
        Gives the age and why it is loose: "the absence of ostracods in the
        Marls and the lower part of the Shales makes it difficult to determine
        accurately the age of the Hypsilophodon Bed. It is probably Barremian
        ... but it might possibly be Early Aptian". Locates it "in the cliff at
        beach level about 100 yd west of Cowleaze Chine".
    - id: galton2009a
      notes: >
        Places it "at top of Wessex Formation (=Wealden Marls)", and dates that
        upper part "~126 Ma (late Barremian)". Named after the taxon it yields,
        like the Carnosaur and Sauropod beds of the Lameta.

Ilek:
  rank: formation
  period: [Early Cretaceous]
  stages: [Valanginian, Hauterivian, Barremian, Aptian, Albian]
  references:
    - id: leshchinskiy2000a
      notes: >
        States that the age of the formation's deposits "was determined as
        Valanginian-Aptian?". Palynomorphs from the upper part of the formation
        are "characteristic of Aptian-Albian", and the Chulyma reference
        borehole section yielded, also from the upper part, gastropods and
        pelecypods "characteristic of Hauterivian-Barremian".
    - id: averianov2024a
      notes: >
        Uses the narrower "Ilek Formation, Lower Cretaceous (Aptian".
    - id: cuenca-bescós2003a
      notes: >
        Maschenko and Lopatin (1998) "described new gobiconodontids from the
        Early Cretaceous site of Shestakovo (Western Siberia, Russia) in the
        Ilek Formation dated as Aptian–Albian"; the paper adds that the
        Shestakovo vertebrate assemblage "is comparable to that of Khoboor,
        suggesting a similar age".
    - id: maschenko1998a
      notes: >
        Makes no determination of its own and relays two mutually exclusive
        ones: the unit's fossil-bearing deposits "were dated as of Neocomian
        (OSYKO, 1958) or as of Aptian-Albian age (ROZHDESTVENSKY, 1960)". Two
        authors, forty years old, reported in a mammal paper about Shestakovo
        which adds nothing about the unit. Note the archaic term, which no
        modern-stage search would find.

Ilhas:
  rank: group
  period: [Early Cretaceous]
  stages: [Valanginian, Hauterivian, Barremian]
  references:
    - id: bandeira2024a
      notes: >
        Names the group by way of the Marfim Formation inside it, in the
        Recôncavo Basin of Bahia, Brazil, and dates the group "Valanginian –
        Barremian", one of "the Lower Cretaceous Massacará and Ilhas groups".
        The Marfim Formation within it is given as "Valanginian – Hauterivian".

Ilseongsan:
  rank: formation
  period: [Early Cretaceous, Late Cretaceous]
  stages: [Albian, Cenomanian]
  references:
    - id: jung2026a
      notes: >
        Gives the Doolysaurus horizon as "the mid-Cretaceous Ilseongsan
        Formation of Aphae Island (Aphaedo)" in Korea, and dates the formation
        "mid-Cretaceous (Albian–early Cenomanian; ~113–97 Ma)". That age follows
        biostratigraphic data and a 97.55 Ma date on the Maewolli Tuff higher in
        the section, rather than an earlier K-Ar estimate of 77–83 Ma.

Inferior Oolite:
  rank: group
  period: [Middle Jurassic]
  stages: [Aalenian, Bajocian, Bathonian]
  references:
    - id: barron2012a
      notes: >
        Gives the rank and pairs it with its neighbor above: across England "the
        Lower Jurassic Lias Group is overlain in turn by the Inferior Oolite and
        Great Oolite groups of Aalenian to earliest Callovian age". The span
        quoted covers both groups together, so the span covers more than this
        unit alone. The entry for this group alone gives its age as "Aalenian to
        Bathonian, Opalinum Zone to Zigzag Zone" and no parent unit, and the
        group "ranges from Early Aalenian to earliest Bathonian in age". Also
        records that "Aalenian to lower Bajocian strata are absent adjacent to
        the Mendip High".
    - id: carrano2012a
      notes: >
        Places Duriavenator in the "upper part of Inferior Oolite Group; late
        Bajocian, Middle Jurassic" at Sherborne, Dorset, and Magnosaurus in the
        "middle part of Inferior Oolite; early Bajocian, Middle Jurassic" at
        nearby Nethercomb.

Iren Dabasu:
  rank: formation
  period: [Late Cretaceous]
  stages: [Cenomanian, Turonian, Coniacian, Santonian, Campanian, Maastrichtian]
  references:
    - id: zanno2010a
      notes: >
        Gives "Iren Dabasu Formation, Late Cretaceous (Campanian-Maastrichtian",
        while noting that its dates "have not yet been firmly established":
        micropaleontological studies "support a Campanian-Maastrichtian age,
        whereas macrovertebrates support a Cenomanian-early Campanian age".
    - id: tsogtbaatar2019a
      notes: >
        Uses the narrower Campanian for the Inner Mongolian exposures.
    - id: vanitterbeeck2005b
      notes: >
        The charophytes and ostracods of the Iren Nor site date the formation as
        "Campanian–Maastrichtian", which "can probably be refined to the latest
        Campanian–Early Maastrichtian" by correlation with the Nemegt Formation.
        The paper reviews older estimates: Berkey and Morris (1927) "proposed a
        Lower Cretaceous age for the Iren Dabasu Formation" on Iguanodon, the
        primitive hadrosaurs have been read as "an early Late Cretaceous age
        (Cenomanian–Turonian)", and derived theropods as "mid to late Late
        Cretaceous (Coniacian–Santonian–?Early Campanian)"; the microfossil age
        calls the vertebrate-based estimates into question.

Irhazer:
  rank: group
  period: [Early Jurassic, Middle Jurassic, Late Jurassic, Early Cretaceous]
  stages: [Bajocian, Bathonian, Callovian, Oxfordian, Kimmeridgian,
    Tithonian, Berriasian, Valanginian, Hauterivian, Barremian]
  references:
    - id: remes2009a
      notes: >
        Group rank and the unit above it: the site sits "at the base of the
        Irhazer Group (''Argiles de l'Irhazer'' below the Tiourarén Formation)".
        The group "has traditionally been considered Jurassic to ''Neocomian''
        in age", but after a late Middle to early Late Jurassic age proposed for
        the overlying Tiourarén Formation, the position of Spinophorosaurus at
        the base of the group is "consistent with an even earlier age,
        presumably Middle Jurassic (Bajocian-Bathonian)", and "it cannot be
        excluded that the Argiles de l'Irhazer are even older (Lower Jurassic)".
    - id: rauhut2009a
      notes: >
        Places the Tiouaren Formation as "the uppermost unit of the Irhazer
        Group", originally included in the upper part of the "argiles de
        l'Ihrazer". Records that Greigert and Pougnet (1967) "also assumed an
        Early Cretaceous age for the 'argiles de l'Ihrazer'" on conchostracans
        and bivalves, evidence the paper finds weak before arguing a
        pre-Kimmeridgian, probably late Middle Jurassic age for the Tiouaren
        Formation.
    - id: greigert1967a
    - id: greigert1967b

Isalo III:
  rank: formation
  period: [Middle Jurassic]
  stages: [Bathonian]
  references:
    - id: rauhut2009a
      notes: >
        Late Middle Jurassic, Archaeodontosaurus "from the Isalo III Formation
        seems to be a very basal form ... , almost surprisingly basal for a late
        Middle Jurassic taxon", with Lapparentosaurus "from the same unit" and
        much harder to place. Its sauropods stand apart from northern Africa,
        the Jobaria and Atlasaurus group showing no "close relationship with
        roughly contemporaneous sauropod faunas from the Cañadón Asfalto
        Formation of Argentina, or (as far as can be said) the Isalo III
        Formation of Madagascar", a split that might follow from aridity across
        central Gondwana. The southern Gondwanan pattern of uniformly more basal
        dinosaurs "might be true for the Isalo III Formation of Madagascar,
        though some uncertainty remains, due to the problematic phylogenetic
        position of Lapparentosaurus".
    - id: royo-torres2020a
      notes: >
        Gives a type horizon in "the middle part of the Isalo III Formation
        (Bathonian, Middle Jurassic)" on the Loza River, north-western
        Madagascar.
    - id: mannion2010a
      notes: >
        Independently gives "the Bathonian Isalo III Formation" near the Kamoro
        River.
    - id: buffetaut2005a
      notes: >
        Uses the subdivision "Isalo IIIb Formation, Bathonian", the age resting
        on "fossiliferous marine intercalations".

Isalo IIIb:
  rank: formation
  parent: Isalo III
  period: [Middle Jurassic]
  stages: [Bathonian]
  references:
    - id: buffetaut2005a
      notes: >
        Gives the Archaeodontosaurus horizon in the Kamoro River area, where
        "variegated clays and sandstones of the Isalo IIIb Formation crop out.
        This formation contains fossiliferous marine intercalations indicating a
        Bathonian age", after Collignon (1953), and the type stratum as "Isalo
        IIIb Formation, Bathonian (Middle Jurassic)".
    - id: raveloson2019a
      notes: >
        Treats the containing unit as a subgroup rather than a formation: "The
        Isalo III subgroup is divided into two subunits: Isalo IIIa and Isalo
        IIIb", with the top of the series recognized as "Isalo IIIb-Bathonien
        Facies Mixte Dinosauriens".
    - id: mannion2010a
      notes: >
        Independently places the Archaeodontosaurus dentary in "the Isalo IIIb
        Formation (near Ambondromamy) within the Majunga Basin".
    - id: collignon1953a

Ischigualasto:
  rank: formation
  parent: Agua de la Peña
  period: [Middle Triassic, Late Triassic]
  stages: [Ladinian, Carnian, Norian]
  references:
    - id: ezcurra2010a
      notes: >
        Dates a member inside it, a recalculated age of "about 219.4-220.4 ± 1.7
        Ma" locating "the top of the Valle de la Luna Member of the
        Ischigualasto Fm. in the mid-Norian". Dates the formation's own base
        rather than a member: "the deposition of the sedimentary unit began
        approximately 231 Ma during the late Carnian", with "The lower third of
        the Ischigualasto Fm. (late Carnian)" holding Herrerasaurus, Eoraptor
        and Panphagia. Two further dates bracket it upward - a bentonite about
        80 m above the base in the Cancha de Bochas Member at 227.8 plus or
        minus 0.3 Ma, and plagioclase about 610 m above the base at the top of
        the Valle de la Luna Member at 217.0 plus or minus 1.7 Ma before the
        correction noted above. Follows Currie and colleagues (2009) in
        recognizing four members, from lowest to highest the La Pena, Cancha de
        Bochas, Valle de la Luna and Quebrada de la Sal.
    - id: martínez2025a
      notes: >
        Gives "Ischigualasto Formation, late Carnian".
    - id: martínez2009b
      notes: >
        Calls it "the early Carnian Ischigualasto Formation". An age of "228 My
        (earliest Carnian) for a level 20 meters above the base of the
        Ischigualasto Formation" leads it to suggest "that deposition of the
        formation may have begun during the Ladinian".
    - id: reig1963a
      notes: >
        Takes the Ischigualasto fauna to be "somewhat more modern than the
        typical Middle Triassic faunas of Santa María (Brazil) and Tanganyika",
        concluding that "The fauna of the Ischigualasto Beds then represents the
        highest Middle Triassic, equivalent to the upper Ladinian".
    - id: novas2021a
      notes: >
        Gives "The Late Triassic (late Carnian–earliest Norian) Ischigualasto
        Formation of Argentina", citing earlier ash-bed dates near its bottom
        and top of 231.4 ± 0.3 and 225.9 ± 0.9 Ma in San Juan Province and 230.2
        ± 1.9 and 221.4 ± 1.2 Ma in La Rioja Province.
    - id: cox1965a
      notes: >
        If Colbert's (1963) view that saurischians arose only at the start of
        the Late Triassic is accepted, "it would indicate a Carnian age for the
        Ischigualasto deposits, from which Reig (1963) has described a
        carnosaurian and two genera of coelurosaurian saurischians". "Such an
        Upper Triassic date for this fauna is also supported by the presence of
        a pseudosuchian, Aetosauroides", which Casamiquela (1961) held to be
        close to Aëtosaurus from the Norian of Germany. The Carnian reading is
        offered as provisional, the Argentinian fauna being one "which has above
        provisionally been assigned to the Carnian".
    - id: casamiquela1961a
      notes: >
        Gives the horizon of its two new stagonolepoids as the middle and upper
        thirds of the unit and the age as "Middle to Upper Triassic of the
        Ischigualasto-Ischichuca basin." Names no stage.

Itapecuru:
  rank: formation
  period: [Early Cretaceous]
  stages: [Aptian, Albian]
  references:
    - id: carvalho2003a
      notes: >
        Gives the Amazonsaurus type as from "Aptian-Albian strata of the
        Itapecuru Formation, Parnaíba Basin, Maranhão State, northern Brazil".
    - id: mayer2026a
      notes: >
        Records that the age is being refined: the fossil record "indicates a
        general referral to the Aptian-Albian, but more recently gathered
        palynological data narrow the age of its lower portion to the late
        Aptian".
    - id: lindoso2019a
      notes: >
        Notes the faunal overlap with its neighbor, "many common taxa ...
        recorded in the Alcântara and Itapecuru formations", suggesting "a
        homogeneous paleocommunity".

Itat:
  rank: formation
  period: [Middle Jurassic]
  stages: [Bathonian]
  references:
    - id: averianov2010a
      notes: >
        Describes Kileskus from "the Middle Jurassic (Bathonian) Itat Formation
        at Berezovsk Quarry, Krasnoyarsk Territory (West Siberia, Russia)".
    - id: averianov2018a
      notes: >
        Places it among the continental terrigenous Jurassic units of the
        Chulim-Yenisei sedimentary basin, with the Makarovo and Tyazhin
        Formations.

Itombe:
  rank: formation
  period: [Late Cretaceous]
  stages: [Turonian]
  references:
    - id: mateus2011a
      notes: >
        Records how the Tadi Beds came to be placed in it: Antunes and Cappetta
        (2002) "reconfirm the late Turonian age of these beds, and place them
        in the 'Itombe Formation'", against an original reading that made them
        the base of the 'Senonian'.
    - id: antunes2002a

Izumi:
  rank: group
  period: [Late Cretaceous]
  stages: [Maastrichtian]
  references:
    - id: kobayashi2021a
      notes: >
        Names the group by way of the Kita-ama Formation inside it, the
        Yamatosaurus specimen coming from "the Maastrichtian horizon of the
        Kita-ama Formation, Izumi Group, in Sumoto City of the Awaji Island in
        Hyogo Prefecture".

Jaisalmer:
  rank: formation
  period: [Middle Jurassic]
  stages: [Bathonian]
  references:
    - id: bajpai2023a
      notes: >
        Describes Tharosaurus from "the Middle Jurassic (early-middle
        Bathonian) strata of Jaisalmer Basin, western India", from the base of
        the Fort Member.
    - id: mannion2025a
      notes: >
        Gives the internal order, "the Bathonian Badabag Member of the
        Jaisalmer Formation, which overlies the Fort Member".
    - id: zhang2026a
      notes: >
        Lists among turiasaurs "a heart-shaped tooth found from the Middle
        Jurassic Jaisalmer Formation of India", reported by Sharma and
        colleagues (2022).
    - id: sharma2022a

Javelina:
  rank: formation
  period: [Late Cretaceous]
  stages: [Campanian, Maastrichtian]
  references:
    - id: lehman2006a
      notes: >
        Publishes the date the unit's Maastrichtian rests on and states the
        stage outright: "A U-Pb age of 69.0 ± 0.9 Ma obtained from monazite in a
        tuff bed in the Javelina Formation confirms that these strata are of
        latest Cretaceous (Maastrichtian) age." It supersedes the authors' own
        preliminary report, which it says later workers referred to although
        "the full data and basis for the age assessment have not been presented
        and so are subject to misinterpretation. Here, we provide a thorough
        account of our suggested age determination." The figure comes from a
        207Pb/204Pb against 235U/204Pb isochron on five multigrain fractions,
        "an approach chosen to avoid the effects of 230Th-derived excess 206Pb".
        The tuff "occurs approximately in the middle of the fluvio-lacustrine
        Javelina Formation, about 90 m stratigraphically below the position of
        the Cretaceous-Tertiary boundary", on Tornillo Creek in Big Bend
        National Park. The date requires the unit's reversed-polarity interval
        to correlate with C31r rather than C29r, and a hiatus of as much as 2 Ma
        may lie within the formation.
    - id: wick2013a
      notes: >
        Describes Bravoceratops from "the lowermost part of the Javelina
        Formation (early Maastrichtian) of Big Bend National Park, TX, USA". The
        locality section puts the site "in the base of the Javelina Formation,
        terminal Campanian to early Maastrichtian in age", inferred from its
        position at least 57 m below a tuff in the middle of the formation dated
        to 69±0.9 Ma.
    - id: maxwell1967a
      notes: >
        Erects the formation when redefining the Tornillo Clay as the Tornillo
        Group, divided into "the Javelina Formation of Late Cretaceous age and
        the Black Peaks (Paleocene) and Hannold Hill (Lower Eocene) Formations
        of early Tertiary age".
    - id: breyer2007a
      notes: >
        "Middle to Upper Maastrichtian" where it lies in the hanging wall of the
        southeastern boundary fault of the Rosillos Mountains fault block in Big
        Bend, an outward-dipping normal fault that juxtaposes "sediments of the
        Javelina Formation (Middle to Upper Maastrichtian) in the hanging wall
        of the fault with the pyroclastic strata in the footwall". Elsewhere
        calls it "the Upper Cretaceous Javelina Formation", whose position
        across that fault indicates the pyroclastic rocks below "must be
        Maastrichtian or older", and records that McDowell and colleagues (2004)
        reported a U-Pb monazite age of 69 ± 1 Ma from a tuff in it.

Javkhlant:
  rank: formation
  period: [Late Cretaceous]
  stages: [Santonian, Campanian, Maastrichtian]
  references:
    - id: eberth2009a
      notes: >
        Formally redescribes the Shine Us Khudag redbeds as the formation,
        noting they "have variously been assigned to the Jibhalanta Suite,
        Javkhlant Formation, Baruungoyot Svita, Djadokhta Formation, and the
        'Barunbayan'" and "since 1969 have been regarded by most stratigraphers
        working in the area as having a Santonian-Campanian age". The paper
        itself accepts that the formation at Shine Us Khudag is "Late Cretaceous
        in age" and "can only tentatively accept the previously proposed
        biostratigraphically derived Santonian-Campanian age range".
    - id: son2022a
      notes: >
        Gives "Javkhlant Formation, ?Santonian-Campanian", hedging the older
        end. This is the paper that also corrects the Khugenetjavkhlant
        locality spelling, the formation name sharing its second element.
    - id: fowler2020b
      notes: >
        Gives the age of the Javkhlant Formation, which yielded Albinykus, as
        "Campanian–Maastrichtian" after Nesbitt and colleagues (2011), "or
        Santonian–Campanian" after Norell and Barta (2016).
    - id: nesbitt2011a
      notes: >
        Gives the age as a relay with a query on its older end: material was
        "collected from the Javkhlant Formation, Shine Us Khudag redbeds at
        Khugenetslavkant ... considered to be ?Santonian-Campanian in age
        (Eberth et al., 2009)". It gives no Maastrichtian.
    - id: norell2016a
      notes: >
        "The Javkhlant beds at Shine Us Khudug that produced the Haya griva type
        material have been assigned a Santonian-Campanian age based on, among
        other things, ostracods", after Jerzykiewicz and Russell (1991), Khand
        and colleagues (2000) and Jerzykiewicz (2001); because Haya griva occurs
        at both sites, the Zos Canyon beds 600 km away are recognized as "coeval
        with the Javkhlant beds at Shine Us Khudug" and of the same
        Santonian-Campanian age. Calls the white to reddish-brown beds of the
        eastern Gobi "the Upper Cretaceous Javkhlant Formation".
    - id: jerzykiewicz2000a
    - id: jerzykiewicz1991a
      notes: >
        Never names this formation. It is a survey of the Gobi Basin's late
        Mesozoic stratigraphy and vertebrates, dense on the neighboring units
        - the Nemegt, Djadokhta and Barun Goyot - and contributes nothing
        directly here.
    - id: khand2000a
      notes: >
        "The fossil horizon of the Javkhlant Formation is correlative with the
        Santonian-Campanian Stage" -- the statement behind the
        Santonian-Campanian age that Norell and Barta (2016) relay to this
        paper. Shuvalov and Stankevich (1977) had called these beds the
        Baruungoyot Formation; here they are 15-60 m of red sandstone and sandy
        clay resting on the Bayanshiree and overlain by the Nemegt Formation.

Jehol:
  rank: group
  period: [Early Cretaceous]
  stages: [Barremian, Aptian]
  references:
    - id: yao2019a
      notes: >
        "the Lower Cretaceous Jehol Group of Lingyuan, Liaoning Province,
        China". Gives only the series, not a stage.
    - id: zhou2026a
      notes: >
        Records that the Early Cretaceous microraptorines other than Jian "have
        been recovered from Barremian–Aptian sediments of the Jehol Group of
        northeastern China".
    - id: barrett2007b
      notes: >
        The group "consists of the Jiufotang, Yixian and Dabeigou (?)
        Formations" and crops out in Liaoning Province and adjacent areas of
        northeastern China. "Although biostratigraphical correlations initially
        indicated a Late Jurassic age for these units, recently obtained
        radiometric dates and reinterpretation of the biostratigraphical
        evidence indicate that the group was deposited during the late Early
        Cretaceous"; those dates also show that the
        Eosestheria-Ephemeropsis-Lycoptera assemblage the group shares with the
        Mengyin Formation of Shandong "is of late Early Cretaceous age".

Jiangjunding:
  rank: formation
  parent: Wangshi
  period: [Late Cretaceous]
  stages: [Campanian, Maastrichtian]
  references:
    - id: borinder2021a
      notes: >
        Gives the Tanius type as from "Upper Cretaceous strata of the
        Jiangjunding Formation (Wangshi Group) in Shandong Province", recovered
        by a Sino-Swedish expedition in 1923. Dates the formation as "Upper
        Cretaceous (upper Campanian–lower Maastrichtian)" and, following Xing
        and colleagues (2014), says its outcrops near the find site, "the most
        likely source unit" for the type, "stratigraphically range from the
        upper Campanian to lower Maastrichtian".
    - id: buffetaut1995a
      notes: >
        Records Young's (1958) placement of the locality that yielded the
        Tanius type "in the lower part of the Wangshi Group, below the
        Jingangkou" locality.
    - id: young1958a

Jianshangou:
  rank: member
  parent: Yixian
  period: [Early Cretaceous]
  stages: [Barremian]
  dispute:
    summary: >
      The Yixian's internal subdivisions are ranked inconsistently across
      sources. Wang and colleagues (2016) write "the Jianshangou Member, a
      cyclical lacustrine mudstone"; Chang and colleagues (2017) call the same
      thing a unit, listing the formation as divided "from bottom to top into
      the Lujiatun Unit, Lower Lava Unit, Jianshangou Unit, Upper Lava Unit,
      Dawangzhangzi Unit and Jingangshan Unit"; Jin and colleagues (2008) call
      it "the Jianshangou Bed".
  references:
    - id: wang2016a
      notes: >
        Uses member rank and describes the lithology, "a cyclical lacustrine
        mudstone containing a taphocoenosis of articulated compression fossils
        with soft tissue" preservation.
    - id: jin2008a
      notes: >
        Calls it "the Jianshangou Bed" and correlates it with the Dawangzhangzi
        Bed of the same formation.
    - id: chang2017a
      notes: >
        Places it third in the formation's succession and writes unit rank
        throughout, dating it contemporaneous with the Lujiatun.
    - id: chen1998a
      notes: >
        Calls it the Jianshangou "intercalated bed (60 m thick)" at the base of
        the Yixian and weighs its age: the beds are "probably younger than the
        Solnhofen Lithographic Limestones (Early Tithonian)", and "the presence
        of Psittacosaurus in the same beds is more consistent with an Early
        Cretaceous age", as are the palynomorphs and a recent radiometric date
        of the Yixian Formation, though "other radiometric dating attempts have
        indicated older ages".
    - id: huang2026a
      notes: >
        Barremian, on a radiometric date: the holotype comes from the
        "Jianshangou Unit (125.457 ± 0.051 Ma; Barremian, Lower Cretaceous) of
        the Yixian Formation, Jehol Group", the date taken from the U-Pb zircon
        work of Zhong and colleagues (2021) on tuff layers from the top, middle
        and bottom of the Yixian Formation. Uses unit rather than member rank.

Jingangkou:
  rank: formation
  parent: Wangshi
  period: [Late Cretaceous]
  stages: [Campanian, Maastrichtian]
  references:
    - id: prieto-márquez2013b
      notes: >
        Gives the parent and the type area: "Lower Campanian ... Jingangkou
        Formation, Wangshi Group, near the village of Chingkankou, 20 km south
        of the city of Laiyang, Shandong Province", and elsewhere calls it "the
        Campanian (Upper Cretaceous) Jingangkou Formation of Shandong".
        Tsintaosaurus spinorhinus comes from a bonebed in it.
    - id: yao2026a
      notes: >
        Sets it beside its neighbor: "the Hongtuya (?middle to late Campanian)
        and Jingangkou (?late Campanian to early Maastrichtian) formations in
        Zhucheng and Laiyang", both hedged.

Jinhua:
  rank: formation
  period: [Early Cretaceous, Late Cretaceous]
  stages: [Aptian, Albian, Cenomanian, Turonian, Coniacian]
  references:
    - id: tang2001a
      notes: >
        Gives the Jiangshanosaurus type as from "the lower part of the Jinhua
        Formation in Jiangshan, Zhejiang. The geological age is Late Early
        Cretaceous (Albian)".
    - id: mannion2019b
      notes: >
        Calls it "The early Late Cretaceous Jinhua Formation", and records that
        its lower section, which yielded Jiangshanosaurus, was "then dated as
        Albian (late Early Cretaceous), but now regarded as early Late
        Cretaceous in age".
    - id: mayer2026a
      notes: >
        Treats it as Turonian-Coniacian, placing Dongyangosaurus sinensis and
        Jiangshanosaurus lixianensis as "both from the Turonian-Coniacian Jinhua
        Formation" in a reconstruction of lithostrotian ancestral range, while
        calling the lithostrotian affinities of those two taxa controversial.
    - id: wilson2005a
      notes: >
        Lists Jiangshanosaurus lixianensis, spelled "Jianshanosaurus", from the
        Jinhua Formation as "Aptian-Albian" in a table of "Cretaceous Asian
        sauropod genera, listed in order of their stratigraphic appearance",
        crediting the age to Tang and colleagues (2001).

Jiufotang:
  rank: formation
  period: [Early Cretaceous]
  stages: [Aptian, Albian]
  references:
    - id: zhou2003a
      notes: >
        Records that the age is not directly constrained: it "is unknown;
        however, it is generally believed to be Aptian (Wang and Zhou 2002),
        which is slightly younger than the Santana Formation of Brazil".
    - id: sereno2010a
      notes: >
        Uses "Jiufotang Formation (Aptian".
    - id: zhou2006a
      notes: >
        Gives the formation, in the upper Jehol Group, as "Late Early
        Cretaceous", its age "recently determined as 120.3 ± 0.7 Ma, based on
        ⁴⁰Ar/³⁹Ar dating on the sanidine crystals from tuffs interbedded within
        the fossil-bearing deposits" by He and colleagues (2004).
    - id: wang2002a
    - id: he2004a
      notes: >
        The primary behind the radiometric figure the entry's other references
        relay: "40Ar/39Ar step heating analyses of K-feldspar and the SHRIMP
        U-Pb zircon data indicate that tuffs at the Shangheshou section erupted
        at 120.3 plus or minus 0.7 million years ago. This result confirms an
        Aptian age for the Jiufotang Formation that was mainly based on
        biostratigraphic evidence." The Albian appears nowhere in it. Where the
        paper calls that figure a minimum age it is speaking of the fossils
        rather than of the unit, the tuffs being interbedded with the
        fossil-bearing shales.
    - id: tong2021a
      notes: >
        Aptian in a review of macrobaenid turtle occurrences: Liaochelys
        jianchangensis of Jianchang, western Liaoning, comes from the "Jiufotang
        Fm. Early Cretaceous (Aptian)", as does Jeholochelys lingyuanensis of
        Lingyuan.
    - id: turner2012a
      notes: >
        Carries the formation into the Albian: Microraptor gui is distributed
        "Aptian-Albian, Early Cretaceous, Jiufotang Formation, Xiasanjiazi,
        Chaoyang County, western Liaoning", and Microraptor zhaoianus over the
        same interval in the "Yixian and Jiufotang Formations".

Juans Lake:
  rank: bed
  parent: Allison
  period: [Late Cretaceous]
  stages: [Campanian]
  references:
    - id: mcdonald2018a
      notes: >
        Miller and colleagues (1991) divided the Allison Member into the Lower
        Beds, Juans Lake Beds and La Vida Beds, and McDonald and Wolfe's field
        area is predominantly fluvial mudstones and sandstones in the Juans Lake
        Beds, which yielded the three specimens of the nodosaurid Invictarx
        zephyri along with turtles, neosuchians and hadrosaurid, ceratopsid and
        theropod material. Their horizon statement gives the beds as "lower
        Campanian, Upper Cretaceous", on a framework built from the Menefee's
        approximately 84.0-78.5 Ma span in the correlation chart of Molenaar and
        colleagues (2002), Baculites perplexus in the overlying Cliff House
        Sandstone at 78.0 to 78.5 Ma, and an Ar/Ar date of 78.22 Ma that Lucas
        and colleagues (2005) obtained from a bentonite near the top of the
        formation in the Gallina hogback.
    - id: mcdonald2021a
      notes: >
        Places it precisely: "Juans Lake Beds ..., upper part of the Allison
        Member, Menefee Formation, approximately 120 meters below the overlying
        Cliff House Sandstone; middle Campanian".
    - id: mcdonald2018b
      notes: >
        Gives the same position with the older reading, "Juans Lake Beds ...,
        upper part of the Allison Member, Menefee Formation; lower Campanian,
        Upper Cretaceous".

Judith River:
  rank: formation
  period: [Late Cretaceous]
  stages: [Campanian]
  references:
    - id: arbour2017a
      notes: >
        The formation "of northern Montana was deposited over an approximately 4
        Myr interval during the Campanian (Late Cretaceous)".
    - id: sues1978a
      notes: Independently gives "Judith River Formation (Campanian".

Jydegaard:
  rank: formation
  parent: Nyker
  period: [Early Cretaceous]
  stages: [Berriasian, Valanginian]
  references:
    - id: bonde2012a
      notes: >
        Gives the Dromaeosauroides horizon as "The base of the Jydegaard
        Formation (Late Berriasian) at Robbedale", which has produced three
        dinosaurian tooth crowns.
    - id: christiansen2003a
      notes: >
        Places it as the youngest formation of the Nyker Group, whose facies and
        fauna have been reported as "Wealden-like". Gives the dromaeosaurid
        tooth horizon as "Lower Cretaceous (Berriasian-Valanginian), Jydegaard
        Formation"; the basal 2-3 meters are "considered Late Berriasian to
        ?Early Valanginian, i.e. Ryazanian in age", while the entire formation
        "supposedly includes most or all of the Valanginian, perhaps even
        younger stages".
    - id: pittman2020a
      notes: >
        Tabulates the formation as Berriasian to Valanginian.

Kaiparowits:
  rank: formation
  period: [Late Cretaceous]
  stages: [Campanian, Maastrichtian]
  references:
    - id: wiersma2018a
      notes: >
        Gives a "late Campanian" age for the formation.
    - id: sullivan2006c
      notes: >
        Assigns "a Campanian age based on analysis of palynomorphs and the
        absence of Maastrichtian" indicators.
    - id: loewen2013b
      notes: >
        Gives "the Upper Cretaceous Wahweap and Kaiparowits formations of
        southern Utah", the Kaiparowits "dating to ~76.6–74.5 Ma" and "divided
        into three informal units: lower, middle, and upper".
    - id: sullivan1999b
      notes: >
        "The Kaiparowits Formation has been correlated to the early
        Maastrichtian (Gregory and Moore, 1931) and the late Maastrichtian
        (Lohrengel, 1969) on the basis of invertebrates and pollen,
        respectively", but sides with Eaton (1991), for whom the palynomorph and
        mammal data "supported a Campanian age for this formation" and "the
        Kaiparowits is late early(?) to late Campanian". The lower third, source
        of two referred specimens of Parasaurolophus cyrtocristatus, "has been
        interpreted as Judithian age, but remains equivocal".

Kaladongar:
  rank: formation
  period: [Early Jurassic, Middle Jurassic]
  stages: [Pliensbachian, Toarcian, Aalenian, Bajocian]
  references:
    - id: natarajan2026a
      notes: >
        Describes a diminutive neosauropod from "the ?upper Lower Jurassic
        (Pliensbachian) to Bajocian strata of the Kaladongar Formation (Khadir
        Uplift), Kachchh Basin, India". On the restructured lithostratigraphy of
        Fürsich and colleagues (2023), which divides the formation at the Khadir
        Uplift into the Cheriya Bet Conglomerate, Mouwana Variegated, Lower
        Flagstone and Middle Sandstone members, it spans "an age duration from
        the ? upper Lower Jurassic (poorly constrained; possibly as early as
        Pliensbachian) to upper Bajocian". The fossil-bearing section near
        Amrapar village, at the transition from the upper Mouwana Variegated
        Member to the Lower Flagstone Member, is itself "poorly constrained and
        may range from somewhere between ?upper Lower Jurassic to Bajocian".
    - id: weishampel2004a
      notes: >
        A reference work, tabulating the unit in Gujarat as Aalenian to
        Bathonian on Satyanarayana and colleagues (1999).
    - id: satyanarayana1999a
      notes: >
        The oldest stratigraphic unit of Kutch, a thick sequence of
        conglomerate, sandstone and shale exposed in the Kaladongar (black
        hills) range of Patcham Island, "referable to ?Aalenian-Early Bajocian
        age (earliest Middle Jurassic)" and subdivided on lithology into three
        informal members: the lowest Dingi Hill, the middle Kaladongar Sandstone
        and the upper Babia Cliff Sandstone. The dinosaur bones and petrified
        tree trunks reported here come from the lowest sandstone beds at Kuar
        Bet, rocks lithologically similar to the Dingi Hill Member although
        exact correlation is not possible for want of marker beds.

Kalazha:
  rank: formation
  period: [Late Jurassic]
  stages: [Kimmeridgian, Tithonian]
  references:
    - id: upchurch2021a
      notes: >
        Gives "Lower part of the Kalazha Formation (Upper Jurassic: upper
        Kimmeridgian-Tithonian) of Qiketai, Shanshan County, Turpan Basin", and
        records a provenance disagreement: the authors "have not been able to
        establish the basis for Xing et al.'s assertion that the Hudiesaurus
        specimens were found in the Qigu rather than the Kalazha Formation".
    - id: upchurch2004a
      notes: >
        Tabulates the Hudiesaurus type as Tithonian.
    - id: fang2015a
      notes: >
        The youngest Jurassic unit of the southern Junggar Basin, the "Upper
        Jurassic Kalazha Formation" of a succession that consists of "the Lower
        Jurassic Badaowan Formation, the Middle Jurassic Sangonghe and Xishanyao
        Formations, and the Upper Jurassic Toutunhe, Qigu and Kalazha
        Formations". Its "thick, poorly sorted and matrix-supported
        conglomerates with a series of coarsening-upward sequences" are alluvial
        fan deposits that reworked the underlying sedimentary strata, marking
        rapid tectonic uplift of the Tian Shan and rapid lake regression.

Kallamedu:
  rank: formation
  period: [Late Cretaceous]
  stages: [Maastrichtian]
  references:
    - id: galton2017a
      notes: >
        Gives "the Kallamedu Formation (Upper Cretaceous, Maastrichtian) of
        southern India" while rejecting a reported stegosaurian dermal plate
        from it on histological grounds.
    - id: longrich2017a
      notes: >
        Tabulates abelisaurid material from it as late Maastrichtian.

Kayenta:
  rank: formation
  period: [Late Triassic, Early Jurassic, Middle Jurassic]
  stages: [Hettangian, Sinemurian, Pliensbachian, Toarcian]
  references:
    - id: tykoski2004a
      notes: >
        Tabulates Dilophosaurus wetherilli from the Arizona exposures as
        "Hettangian or Sinemurian", hedging between the two, but elsewhere gives
        "The Kayenta Formation (Sinemurian-Pliensbachian) of Arizona".
    - id: nesbitt2007a
      notes: >
        Gives the narrower "Kayenta Formation (Sinemurian", and calls it "the
        well-sampled Lower Jurassic Kayenta Formation".
    - id: marsh2020a
      notes: >
        Records that when the Dilophosaurus holotype was collected, the
        formation "was hypothesized to be Early Jurassic or Late Triassic in
        age, based predominantly on vertebrate biostratigraphy", and itself
        gives the Silty Facies as "Early Jurassic, Sinemurian–Pliensbachian".
    - id: olsen1984a
      notes: >
        The Glen Canyon tritylodontid Kayentatherium, although related to
        Tritylodon of the Stormberg, "actually suggests an Early to Middle
        Jurassic age for at least the Kayenta Formation of the Glen Canyon
        Group" on Kermack's (1982) reading, against the earlier use of the same
        Tritylodon-like tritylodontid by Lewis and colleagues (1961) to conclude
        that the whole group is Late Triassic.
    - id: kermack1982a
    - id: lewis1961a
      notes: >
        Proposes the Late Triassic age, with a query. A review of the
        paleontologic and stratigraphic evidence "resulted in the proposal that
        the Kayenta formation and the lower part of the Navajo sandstone be
        assigned a Late Triassic (?) age", which the Geologic Names Committee of
        the United States Geological Survey then approved. The fossils are
        Protosuchus and an undescribed tritylodont from near the top of the unit
        on Comb Ridge, and the freshwater gastropods Valvata gregorii and
        Lymnaea hopii: "Therefore the evidence, although not conclusive,
        strongly suggests that the Kayenta formation is of Late Triassic age."
        Rejects the Early Jurassic age drawn from the limb proportions of the
        dinosaur Welles described from the unit.
    - id: haubold1990a
      notes: >
        Places the Scutellosaurus lawleri horizon, "silty marsh sediments of the
        Kayenta Formation of the ?Toarcian, near Rock Head, Arizona", beside the
        lower Pliensbachian belemnite marls of Scelidosaurus and the lower
        Toarcian Posidonia Shale of Emausaurus as the stratigraphically similar
        origins of the three basal thyreophorans.

Kem Kem:
  rank: group
  period: [Early Cretaceous, Late Cretaceous]
  stages: [Albian, Cenomanian]
  dispute:
    summary: >
      Two naming systems are live for these beds and both name real rock.
      Ibrahim and colleagues (2020) erect the Gara Sbaa and Douira formations
      for the Kem Kem itself, arguing the units there are mappable and
      distinctive, and correlate them with Dubar's Ifezouane and Aoufous, which
      were erected on the eastern flank of the High Atlas and applied to the
      Kem Kem by later workers including Smyth and colleagues (2020). So
      Ifezouane corresponds to Gara Sbaa and Aoufous to Douira, but they are
      correlatives from different areas rather than alternative spellings, and
      reading a source that says Ifezouane means applying the correlation. The
      age is unsettled in its own right: Smyth and colleagues report that it
      "remains controversial, with an Albian or Early Cenomanian age being
      considered likely by most recent workers".
  references:
    - id: sereno1996a
      notes: >
        The beds take their name here: "We informally recognize this distinct,
        nonmarine deltaic facies as the Kem Kem beds, which can be divided
        equally into two units that together attain a maximum thickness of
        approximately 200 m", in place of the informal lower red sandstone unit
        and upper marly unit that Choubert described for the region. "Nine
        elasmobranch species strongly support a Cenomanian age for the deposit",
        about 93 million years ago, and the beds rest erosionally on Paleozoic
        strata beneath a carbonate platform of Late Cenomanian through Turonian
        age.
    - id: evers2015a
      notes: >
        Reads the Kem Kem as Cenomanian: after reviewing Choubert's, Dubar's and
        Cavin and colleagues' schemes for southeastern Morocco, it holds that
        "the Kem Kem assemblage is Cenomanian, and most likely Early Cenomanian
        in age", the traditional reading having been "Infracenomanien", at the
        base of the Cenomanian. Cavin and colleagues (2010) are followed in
        finding no evidence for pre-Cenomanian fossils at the base of the
        Cretaceous series, and the shark and dinosaur assemblages match the
        Early Cenomanian Bahariya Formation. The Albian ages that appear in the
        paper belong to Algerian localities such as Gara Samani, not to the Kem
        Kem.
    - id: ibrahim2020a
      notes: >
        The dedicated treatment, titled "Geology and paleontology of the Upper
        Cretaceous Kem Kem Group of eastern Morocco", which is where the group
        rank and the two-formation subdivision come from.
    - id: smyth2020a
      notes: >
        Uses the Ifezouane and Aoufous names, and states the age controversy
        quoted above.

Kenton:
  rank: member
  parent: Morrison
  period: [Late Jurassic]
  stages: [Tithonian]
  references:
    - id: danison2024a
      notes: >
        Uses member rank, the Saurophaganax material having been "recovered
        from the Kenton 1 Quarry in the Kenton Member of the Upper Jurassic
        Morrison Formation of Oklahoma".
    - id: chure1995a
      notes: >
        Gives the same quarry without the member name, "Quarry 1, Morrison
        Formation, east of Kenton, Cimarron County, OK", the position "12.04m
        (39. 5feet) below top of the Morrison Fm."
    - id: carrano2012a
      notes: >
        Correlates that level, "Stovall Quarry 1, east of Kenton, Cimarron
        County, Oklahoma, USA; upper Brushy Basin Member equivalent, Morrison
        Formation; ?Tithonian, Late Jurassic".

Khodzhakul:
  rank: formation
  period: [Early Cretaceous, Late Cretaceous]
  stages: [Albian, Cenomanian]
  references:
    - id: nessov1997a
      notes: >
        Splits the unit between two faunal assemblages: "In the Khodzhakul'skian
        suite of Southwestern Kyzylkums, two faunistic complexes are
        established: the Khodzhakul' complex (lower and middle parts of the
        suite) of the Late Albian, and the Shejkhdjejli complex (upper part of
        the suite) of the Early Cenomanian." The locality catalog follows that
        split, giving the upper part as lower Cenomanian at Sheikhdjeli II,
        Khodzhakul'sai, Ayazkala and Kyrkkyz, and the lower or middle part as
        upper Albian at Khodzhakul I and Parlykala. Records that "Until the
        discovery here of shark remains, the entire Khodzhakul Suite was dated
        to the Cenomanian", and corrects an earlier reading of the Chelpyk beds,
        placing them in the "Upper part of the Khodzhakul Formation (but not the
        lower part of the Beshtybinsk Formation, Nessov, 1977a), Cenomanian".
    - id: averianov2025c
      notes: >
        Gives "the lower Cenomanian Khodzhakul Formation" in Uzbekistan, the
        third ecosystem known to contain both carcharodontosaurid and
        tyrannosauroid apex predators.
    - id: nessov1995a
      notes: >
        Gives a holotype horizon in the "Upper Cretaceous, lower Cenomanian,
        upper part of the Khodzhakul Formation", at the northern edge of the
        Sheikhdzheili Mountains, and dates the lower part of the formation
        "Lower Cretaceous, lower middle Albian" and its lower or middle part
        "Lower Cretaceous, upper Albian".
    - id: tong2021a
      notes: >
        Cenomanian in a review of macrobaenid turtle occurrences:
        Tienfucheloides is placed in the "Khodzhakul Formation (Cenomanian),
        Uzbekistan" after Danilov and colleagues (2018), the same turtle being
        called elsewhere in the paper one "from the Late Cretaceous of
        Uzbekistan".
    - id: danilov2018a

Khok Kruat:
  rank: formation
  period: [Early Cretaceous, Late Cretaceous]
  stages: [Barremian, Aptian, Albian]
  references:
    - id: buffetaut2011a
      notes: >
        Gives "Khok Kruat Formation (Early Cretaceous, Aptian".
    - id: sethapanichsakul2026a
      notes: >
        Gives the formation as Aptian–Albian: "Palynomorph data indicate an
        upper Aptian age, with the possibility that the upper part of the
        formation extends into the Albian based on the overlying
        Albian–Cenomanian Mahasarakham Formation". Its vertebrate fauna "shows
        similarities to that of the Aptian Xinlong Formation of China".
    - id: racey1996a
      notes: >
        Reassigns the Khorat Group formations, the Khok Kruat among them, "to
        the Early Cretaceous (Berriasian to Aptian) on the basis of new
        palynological data", and for this uppermost unit of the group concludes
        that "the formation is suggested to be Lower Cretaceous (?Aptian) in
        age", hedging the stage. That rests on the unreleased Esso palynological
        data quoted by Sattayarak and colleagues (1991), which "assigned the
        upper part of the Khok Kruat Formation to the uppermost Aptian", and on
        Albian-Cenomanian palynomorphs from the lower part of the overlying Maha
        Sarakham Formation.
    - id: sattayarak1991a
    - id: shibata2011a
      notes: >
        Leaves the age open — "The age of this formation has not been determined
        yet because of lack of any crucial fossils to date" — and relays
        Hasegawa and colleagues (2010), who "pointed out a possibility of
        Barremian age based on magnetostratigraphic data from the overlying Phu
        Thok Formation", while adding that "no direct information from the Khok
        Kruat Formation was obtained for its age". Traditionally an
        Aptian-Albian age is read from palynology and vertebrate records, and
        this study follows "the Aptian age determination".
    - id: jia2022a
      notes: >
        Upper Cretaceous: the paleomagnetic case for primary remanence in the
        Nam Phong Formation turns on "the regional angular unconformity between
        the Upper Cretaceous Khok Kruat Formation and the Maha Sarakham
        Formation in the Nakhon Thai Basin". The stratigraphic review places it
        last among the "Cretaceous Sao Khua, Phu Phan, and Khok Kruat
        formations", in angular unconformable contact with the overlying Maha
        Sarakham Formation, after Ridd and colleagues (2011).

Khuren Dukh:
  rank: formation
  period: [Early Cretaceous]
  stages: [Barremian, Aptian, Albian]
  references:
    - id: ito2006a
      notes: >
        Erects it: the Choyr Basin infill "is newly defined as the Khalzan Uul
        and Khuren Dukh formations based on detailed mapping of lateral and
        vertical variations in component lithofacies assemblages". Reports that
        earlier studies "concluded that the age of the Khuren Dukh Formation is
        either Aptian-Albian or middle-late Albian", later refined "as late
        Albian, based on new palynological data". The strata had previously been
        assigned to the Shinekhudag or Zuunbayan formations, a reassignment
        rather than a renaming.
    - id: makovicky2006a
      notes: >
        Reports that the Khuren Dukh beds "have been interpreted as Aptian–early
        Albian in age" but "have also been dated as Barremian" by Shuvalov
        (2000).
    - id: nichols2006a
      notes: >
        Takes a "latest Early Cretaceous (Albian) age for the Khuren Dukh
        Formation" from Asteropollis asteroides pollen, recovered in samples
        from its informal middle member, and says the pollen's co-occurrence
        with Tricolpites "confirms the age of the Khuren Dukh Formation as
        middle to late Albian".
    - id: shuvalov2000a
      notes: >
        Spells the locality Huren Dukh, which is why a search on the entry's
        form returns nothing, and gives no Barremian for it. Three independent
        lines all agree on the same span: "Iguanodon orientalis is similar to a
        specimen previously described from the Khamaryn Khural region ... from
        the Aptian-Albian", "The molluscs are characteristic of the
        Aptian-Albian", and the spore-pollen assemblage. So this reference
        supports the Aptian and Albian only.

Kimmeridge Clay:
  rank: formation
  parent: Ancholme
  period: [Late Jurassic, Early Cretaceous]
  stages: [Kimmeridgian, Tithonian, Berriasian]
  references:
    - id: sánchez-fenollosa2023a
      notes: >
        Gives the formation a range rather than a single stage, placing
        Camptosaurus prestwichii "from the lower part of the Kimmeridge Clay
        Formation (Kimmeridgian-Berriasian) of UK".
    - id: barron2012a
      notes: >
        Places it at the top of the Ancholme Group, above the Ampthill Clay
        Formation.
    - id: sánchez-fenollosa2025a
      notes: >
        Gives "Kimmeridge Clay Formation, Upper Jurassic (Kimmeridgian".
    - id: ősi2012a
      notes: >
        Tabulates it as "Kimmeridge Clay; Kimmeridgian".

Kirkwood:
  rank: formation
  period: [Late Jurassic, Early Cretaceous]
  stages: [Tithonian, Berriasian, Valanginian, Hauterivian]
  references:
    - id: mcphee2016b
      notes: >
        Gives "Kirkwood Formation (lowermost Cretaceous,
        ?Berriasian–Hauterivian", hedging the older end, and concludes that the
        fossiliferous sections "most reasonably date" to "the early Early
        Cretaceous". Reports that "Early research suggested that the basal-most
        deposits of the Kirkwood Formation were perhaps Late Jurassic in age".
    - id: galton1981a
      notes: >
        Reads it as diachronous: the formation "and the underlying Enon
        Conglomerate Formation are time transgressive and fall within the
        Berriasian to Lower Valanginian".
    - id: forster2022a
      notes: >
        Reports that Muir and colleagues (2017) "assigned a Tithonian to
        Valanginian age for the entire Kirkwood Fm", and argues from
        foraminiferal dating of the base of the Sundays River Formation that
        this "would indicate an Early Cretaceous age (early-mid Valanginian) for
        the Kirkwood Fm stratotype exposure and bone-bearing fossil site".
    - id: muir2017a
      notes: >
        The formation "has been constrained to Tithonian – Valanginian in the
        Algoa Basin", which "by inference suggests a Cretaceous age for at least
        parts of the Enon Formation in that area", since Dingle and colleagues
        (1983) hold the two formations to have been deposited contemporaneously.
        Its "datable volcaniclastic layers ... may provide the best means to
        infer the age range of the Enon, but preliminary U-Pb analysis of zircon
        from these layers have yielded ages ranging from Middle Jurassic to
        Early Cretaceous". The mudstone- and sandstone-dominated Kirkwood
        generally conformably overlies the conglomeratic Enon but locally
        interfingers with it.
    - id: dingle1983a

Kirtland:
  rank: formation
  period: [Late Cretaceous]
  stages: [Campanian, Maastrichtian]
  references:
    - id: dalman2025a
      notes: Gives "Kirtland Formation, Upper Cretaceous (late Campanian".
    - id: ford2000a
      notes: >
        Gives "Kirtland Formation, Maastrichtian".
    - id: fassett1997a
      notes: >
        Hunt and Lucas (1992) concluded that "the lower Kirtland is Edmontonian
        (early Maestrichtian) in age", whose figure 11 shows all of the upper
        Kirtland Shale to be Edmontonian as well. Cautions that the abundant
        vertebrates near the Hunter Wash section, where the C33n-C32r polarity
        reversal falls within the Kirtland Shale, are of limited value in fixing
        its age, the faunal data being difficult to interpret "because of the
        endemic nature of taxa and uncertainties in differentiating between
        geographic and age differences in faunal assemblages".
    - id: hunt1992a
      notes: >
        Puts the whole formation in the Maastrichtian and declines to carry the
        Campanian up into it: "Diverse evidence indicates that the Fruitland is
        of Judithian (late Campanian) age, the pre-Naashoibito Kirtland is of
        Edmontonian (early Maastrichtian) age and the Naashoibito is of Lancian
        (late Maastrichtian) age." Of the marine invertebrates that date the
        Fruitland below, "it is not possible to further deduce that the marine
        invertebrates indicate that the entire Kirtland is also late Campanian
        in age". The reading of each vertebrate biochron as a stage is the
        paper's own. Names the Bisti, Hunter Wash and De-na-zin members and
        moves the Naashoibito here from the Fruitland.

Kita-ama:
  rank: formation
  parent: Izumi
  period: [Late Cretaceous]
  stages: [Maastrichtian]
  references:
    - id: kobayashi2021a
      notes: >
        Describes Yamatosaurus from "the marine Maastrichtian Kita-ama
        Formation in Japan", the specimen recovered in Sumoto City on Awaji
        Island, Hyogo Prefecture.

Kitadani:
  rank: formation
  period: [Early Cretaceous]
  stages: [Hauterivian, Barremian, Aptian, Albian]
  references:
    - id: azuma2010a
      notes: >
        Reports that its nonmarine molluscs "indicate that it belongs to
        Hauterivian to early Aptian in age", and that the formation "could be
        assigned to Barremian" on the occurrence of Nippononaia ryosekiana, the
        reading it uses for the type horizon, "The Kitadani Formation (Akaiwa
        subgroup, Tetori Group) of the Early Cretaceous (Barremian)".
    - id: you2009a
      notes: >
        Gives "Kitadani Formation (Aptian-Albian".

Klettgau:
  rank: formation
  period: [Late Triassic]
  stages: [Carnian, Norian, Rhaetian]
  references:
    - id: sues2025a
      notes: >
        Gives "the Klettgau Formation (lower to middle Rhaetian) of
        Füllinsdorf-Schönthal ... near Basel", and treats the Swiss unit as
        correlative with the German Exter Formation.
    - id: rauhut2020a
      notes: >
        Says the type material most probably came from the uppermost part of
        what is "now called Gruhalde Member of the Klettgau Formation, uppermost
        Norian", after Jordan and colleagues (2016), and that the Bratelen
        Bonebeds on top of that member record an erosional event "at the end or
        after the deposition of the Gruhalde Member (late Norian?)". Contrasts
        them with the sandy bonebeds of the Belchen Member of the Klettgau
        Formation "in Canton Baselland and Solothurn", dated "by
        palynostratigraphy to lower, middle and upper Rhaetian".
    - id: jordan2016a
      notes: >
        Formally defines the unit and its six members, from the Ergolz Member at
        the base to the Belchen Member at the top, and gives its
        chronostratigraphic age as "Carnian to Rhaetian", after the Deutsche
        Stratigraphische Kommission and Kozur and Bachmann (2008); the abstract
        instead calls it "the Norian to Rhaetian Klettgau Formation". The
        Gansingen Member "starts with partly porous dolomite with Carnian
        bivalves".

Kota:
  rank: formation
  period: [Early Jurassic, Middle Jurassic]
  stages: [Sinemurian, Pliensbachian, Toarcian, Aalenian]
  dispute:
    summary: >
      The age is unresolved and the estimates are not all stage-level.
      Bandyopadhyay and colleagues (2010) give "the Early Jurassic Kota
      Formation (Sinemurian to Pliensbachian) of India". Kareem and colleagues
      (2024) report that "the precise age of the Kota Formation has long
      remained unresolved" and that "most estimates ... are based on faunal data
      and range from the Early to Middle Jurassic".
  references:
    - id: bandyopadhyay2010a
      notes: >
        Calls it "the Early Jurassic Kota Formation (Sinemurian to
        Pliensbachian)" in the abstract but also "Early to early Middle
        Jurassic". Records that "on the basis of fishes, the Kota Formation has
        long been considered to be of Liassic age", and that Bandyopadhyay and
        Roychowdhury (1996) and Bandyopadhyay and Sengupta (2006) suggested the
        Lower Kota ranges from Sinemurian to Pliensbachian, "while the age of
        the upper Kota is Toarcian and may even be extended to Middle Jurassic
        (?Aalenian)".
    - id: kareem2024a
      notes: >
        States that the age remains unresolved and that most estimates rest on
        faunal data.
    - id: rincón2022a
      notes: >
        Reports that the formation's "age estimate has varied from Early
        Jurassic to Early Cretaceous depending upon the biostratigraphic
        indicator", and that an "Early–Middle Jurassic age is currently accepted
        for the upper part of the Kota Formation", where Kotasaurus and
        Barapasaurus were collected.
    - id: bandyopadhyay1996a
    - id: bandyopadhyay2006a

Kuwajima:
  rank: formation
  parent: Tetori
  period: [Early Cretaceous]
  stages: [Berriasian, Valanginian, Hauterivian, Barremian]
  references:
    - id: averianov2005a
      notes: >
        Cites the dedicated treatment of the site, "Fossils of the Kuwajima
        'Kaseki-kabe' (fossil-bluff). Scientific report on a Neocomian (Early
        Cretaceous) fossil assemblage from the Kuwajima Formation". Gives only a
        Neocomian age, an informal grouping of stages rather than a stage.
    - id: chinzorig2025a
      notes: >
        Cites the Albalophosaurus description as from "the Lower Cretaceous
        Kuwajima Formation of Japan".
    - id: sano2017a
      notes: >
        Infers a Barremian age for the Kaseki-kabe locality in the uppermost
        part of the formation because "it is younger than the age of the last
        brackish horizon (lower part of the Kuwajima Formation, late
        Hauterivian), and earlier than the Barremian-Aptian Akaiwa Formation".
    - id: ohashi2009a
      notes: >
        The formation is "tentatively regarded as Valanginian–Hauterivian in
        age", with the upper Itoshiro Subgroup placed in the Early Cretaceous
        from the ammonite-dated Kuzuryu Subgroup below, the uppermost Barremian
        to Aptian Kitadani Formation above, and a bivalve correlation with the
        Hauterivian Ryoseki Formation. The Albalophosaurus type comes from the
        "uppermost Kuwajima Formation, Lower Cretaceous
        (Valanginian–Hauterivian)".
    - id: wilson2005a
      notes: >
        Tabulates the formation, source of an unnamed titanosauriform, as
        "?Berriasian-?Hauterivian" after Barrett and colleagues (2002), with
        both bounds queried.

L11:
  rank: bed
  informal: true
  parent: Wessex
  period: [Early Cretaceous]
  variants: [Black Band]
  references:
    - id: naish2022a
      notes: >
        Places it in the scheme and in section: Stewart (1978) "assigned bed
        numbers to each of the plant debris beds within the Wessex Formation and
        E. lengi was recovered from L11, the plant debris bed above the Grange
        Chine Sandstone". The horizon is "the L11 plant debris bed above the
        Grange Chine Sandstone of the Wessex Formation of the Wealden
        Supergroup. It dates to the Barremian". The published name is "L11 plant
        debris bed", of which the bare numeral is a truncation.
    - id: lockwood2025a
      notes: >
        Gives the equation that makes Black Band a name for this bed rather than
        a separate one: MIWG 6643 came "from the 'Black Band' (bed L11 in
        Stewart ...), a plant debris bed cropping out c. 100 m east of Grange
        Chine, lying above the Grange Chine Sandstone in the Wessex Formation".
    - id: stewart1978a

L5:
  rank: bed
  informal: true
  parent: Wessex
  period: [Early Cretaceous]
  references:
    - id: pond2023a
      notes: >
        Gives "Plant debris bed L5 (Gale ...), Wessex Formation, Wealden Group",
        and places it: "Plant debris bed L5 lies close to the base of the
        exposed Wessex Formation on the Island, which is thought to be earliest
        Barremian in age". Cites the numbering to Gale in the horizon line and
        to Stewart later in the same paper, where Lockwood and colleagues credit
        Stewart throughout.

L9:
  rank: bed
  informal: true
  parent: Wessex
  period: [Early Cretaceous]
  references:
    - id: lockwood2021a
      notes: >
        Gives the horizon as "Wessex Formation, early Barremian, Lower
        Cretaceous", from "a plant debris bed (L9 of Stewart ...) to the west of
        Grange Chine on the south coast of the Isle of Wight", and records that
        the specimen "was found associated with one of the UK's most complete
        theropods, Neovenator salerii".

La Amarga:
  rank: formation
  period: [Early Cretaceous]
  stages: [Hauterivian, Barremian, Aptian]
  references:
    - id: pereda-suberbiola2013a
      notes: >
        Gives the formation, one of its members and the span together: "La
        Amarga Formation, Puesto Antigual Member; Barremian-lower Aptian" of
        Neuquén.
    - id: salgado2006b
      notes: >
        Groups under the formation "a thick package of continental sediments of
        lower Cretaceous age" and places the Zapalasaurus type in its Piedra
        Parada Member, "whose age is regarded as Barremian-lower Aptian".
        Reviews earlier datings, among them a correlation with the upper part of
        the Agrio Formation "to the Hauterivian–Barremian" and Leanza and Hugo's
        (1995, 1997) age for the three members "ranging from the late
        Hauterivian to the Barremian".
    - id: musacchio1975a
      notes: >
        Barremian, in two passing comparisons with the Chubut Group ostracods:
        Cypridea feruglioi "has certain morphological affinities with Cypridea
        australis Musacchio from the La Amarga Formation (Barremian) of
        Neuquén", and the Brazilian species missing from the Chubut material are
        likewise not found in "the La Amarga Formation [Barremian] of Neuquén".

La Bocana Roja:
  rank: formation
  period: [Late Cretaceous]
  stages: [Cenomanian, Turonian, Coniacian, Santonian, Campanian]
  references:
    - id: chure2000a
      notes: >
        Gives the Labocania horizon as "LACM locality 7257, Arroyo del Rosario,
        Baja California, Mexico", in the La Bocana Roja Formation, at
        "?Campanian".
    - id: molnar1974a
      notes: >
        Following Kilmer (1963), describes it as "red mudstones and tuffs
        unconformably underlying" the El Gallo Formation. Says it "may thus be
        presumed late Campanian or earlier in age" from a late Campanian
        potassium-argon date in the El Gallo, and is "probably not older than
        Cenomanian" because it contains hadrosaurian fossils.
    - id: paul1988a
      notes: >
        Gives Labocania anomala from the "La Bocana Roja Formation of Baja
        California", dated "Campanian of the late Late Cretaceous".
    - id: kilmer1963a

La Colonia:
  rank: formation
  period: [Late Cretaceous]
  stages: [Campanian, Maastrichtian]
  references:
    - id: pérez-moreno2024a
      notes: >
        Gives "La Colonia Formation (Campanian-Maastrichtian".
    - id: pol2024a
      notes: >
        Uses the narrower "La Colonia Formation (Maastrichtian, Upper
        Cretaceous)". Koleken was found "close to the base of the stratigraphic
        section", and "The age of the base of this unit has been recently
        restricted to the early Maastrichtian".
    - id: martinelli2004a
      notes: >
        Gives "The La Colonia Formation (Campanian-Maastrichtian)" as "exposed
        in the north-central Chubut Province", and counts it with Los Alamitos
        among "the Campanian-Maastrichtian Los Alamitos and La Colonia
        formations", the richest Mesozoic mammal localities in South America.

La Quinta:
  rank: formation
  period: [Late Triassic, Early Jurassic, Middle Jurassic, Late Jurassic,
    Early Cretaceous]
  stages: [Hettangian, Sinemurian, Pliensbachian, Toarcian, Aalenian]
  references:
    - id: rincón2022a
      notes: >
        Gives the "Lower Jurassic La Quinta Formation (Dept. Cesar, Colombia)"
        in its title and the "Lower–Middle Jurassic La Quinta Formation" in its
        text. From U/Pb ages of about 175 Ma on subvolcanic samples underlying
        the fossil horizons near Manaure, infers that Perijasaurus is "latest
        Toarcian or earliest Aalenian in age".
    - id: langer2014a
      notes: >
        Places its material in "the earliest Jurassic of the La Quinta
        formation, Venezuelan Andes", so the unit crosses a national border.
        Reviews earlier readings: in the Perijá Andes, conchostracans "range in
        age from Late Triassic/Early Jurassic, in the lower part of the unit, to
        Late Jurassic/Early Cretaceous, in its upper part", and volcanic rocks
        give dates that "range from Middle to Late Jurassic"; together, it says,
        the radioisotopic dates and fossil evidence suggest that "the deposition
        of the La Quinta Formation started in the Late Triassic".
    - id: barrett2014a
      notes: >
        Dates the Laquintasaura bonebed, in a road cut between La Grita and
        Seboruco in Táchira State, Venezuela, by CA-TIMS U–Pb zircon analysis to
        a maximum depositional age "placing it in the earliest Jurassic
        (Hettangian)". Earlier estimates for the unit, it notes, "were poorly
        constrained and ranged from Late Permian–Lower Cretaceous".

Lago Colhué Huapi:
  rank: formation
  period: [Late Cretaceous]
  stages: [Coniacian, Santonian, Campanian, Maastrichtian]
  references:
    - id: casal2015a
      notes: >
        Erects the unit and fixes its position: it "overlies the Bajo Barreal
        Formation (Upper Member) and it is covered by the Laguna Palacios or
        Salamanca Formation", with base and top transitional. The Bajo Barreal
        Upper Member survives the split. What the new unit resolved was
        attribution rather than rock: "stratigraphic and chronological aspects
        of these levels have historically been confused, which in many cases
        resulted in the conflicting and questionable stratigraphic placement of
        their fossils". From its dinosaurs the paper concludes that "the age of
        the proposed formation is comprised between Coniacian–Maastrichtian":
        caudal vertebrae preliminarily assigned to Rebbachisauridae, from the
        first red mudstones at estancia Ocho Hermanos, suggest those levels
        correspond "at most to the Coniacian", and the Aeolosaurus–hadrosaur
        association at the headwaters of the Río Chico indicates that the
        sediments there "should correspond, at least, to the Early Campanian".
    - id: casal2007a
      notes: >
        The earliest age reading for these beds, made before the unit existed:
        "a Campanian-Maastrichtian? age for the upper levels of this
        stratigraphic unit, outcropping in the southeast of Lago Colhué Huapi",
        then attributed to the upper Bajo Barreal.
    - id: ibiricu2019a
      notes: >
        Gives "Lago Colhue Huapi Formation, Coniacian–Maastrichtian", and places
        Sektensaurus within it in "the Upper Cretaceous (Campanian)".
    - id: ibiricu2025a
      notes: >
        Places the formation in the "Upper Cretaceous (Coniacian–Maastrichtian)"
        and carries the younger bound: studies of its uppermost part,
        "particularly those of palynomorphs, support a late Maastrichtian age
        for these strata", while its middle section is "Santonian –?lower
        Maastrichtian".

Laguna Colorada:
  rank: formation
  period: [Late Triassic, Early Jurassic]
  stages: [Norian, Rhaetian, Hettangian, Sinemurian]
  dispute:
    summary: >
      Whether the unit is Triassic or Jurassic is unsettled. Apaldetti and
      colleagues (2011) place Mussaurus in "the Norian Laguna Colorada
      Formation"; Bandeira and colleagues (2024) tabulate the heterodontosaurid
      from the same unit as Sinemurian.
  references:
    - id: apaldetti2011a
      notes: >
        Gives the Triassic reading, listing Mussaurus among the taxa of "the
        Norian Laguna Colorada Formation".
    - id: bandeira2024a
      notes: >
        Gives the Jurassic reading, tabulating "cf. Heterodontosaurus sp. |
        Argentina | Laguna Colorada Formation | Sinemurian".
    - id: pol2021a
      notes: >
        U–Pb dates from tuffaceous siltstones intercalated with the
        Mussaurus-bearing interval, in the middle of the formation at its type
        locality, "assign an Early Jurassic (Sinemurian) maximum age for the
        Mussaurus bearing sediments", although the unit "has long been regarded
        as Late Triassic (Norian) in age". Describes it as "a 170 m-thick
        succession of fluvio-lacustrine sediments deposited in a post-rift
        thermally induced sag basin during the Early Jurassic".

Lakota:
  rank: formation
  period: [Early Cretaceous]
  stages: [Berriasian, Valanginian, Hauterivian, Barremian, Aptian]
  references:
    - id: boyd2015b
      notes: >
        Relocating a type locality confirmed "its provenance from unit L2 (lower
        Fuson Member equivalent) of the Lakota Formation", and "recently revised
        ages for the members ... based on charophyte and ostracod
        biostratigraphy" constrain the taxon to the late Valanginian to early
        Barremian. "Early interpretations of the age of the Lakota Formation
        varied from Valanginian to Aptian"; the ostracod, charophyte and
        mammalian work since then extends "the lower-most units to the
        Berriasian" and limits "the upper-most to the Barremian".
    - id: kirkland1993a
      notes: >
        Gives the younger reading, that the formation "has been dated
        independently of vertebrate fossils as Barremian".
    - id: weishampel1989a
      notes: >
        Gives the horizon of Iguanodon lakotaensis as the Lakota Formation,
        "Early Cretaceous, possibly Barremian", following Sohn (1979), and
        treats the genus's presence as "further evidence of a possible Barremian
        age for the unit".
    - id: sohn1979a
      notes: >
        States its conclusion on its own title page, and it is an exclusion
        rather than an assignment: the monograph is a "Revision of nonmarine
        Lower Cretaceous ostracode genera from the Black Hills ... On the basis
        of this revision, the Lakota Formation is considered to be pre-Aptian
        in age". So it assigns no stage and rules one out. The entry's other
        references agree with it: an upper Berriasian to lower Barremian
        correlation, a Barremian dated independently of vertebrates, and a
        "possibly Barremian" that is itself following this paper.
    - id: cifelli2014a
      notes: >
        The "nonmarine Lower Cretaceous Lakota Formation of the Black Hills
        region" is "correlated with the upper Berriasian–lower Barremian", lying
        between the underlying Morrison Formation and Aptian–Albian units
        exposed elsewhere in North America; "A pre-Aptian age for the Lakota
        Formation (Fig. 2, Berriasian to Barremian) is generally supported by
        charophyte data". Within the unit, the lower part of Chilson Member unit
        2 is constrained to "late Berriasian–Valanginian" and the sampled Fuson
        Member section to "late Valanginian–early Barremian", so that its
        mammals come from two horizons of different estimated age.

Lameta:
  rank: formation
  period: [Late Cretaceous]
  stages: [Maastrichtian]
  references:
    - id: chatterjee1978a
      notes: >
        Reads the unit as wholly Late Cretaceous and younger than the age Huene
        and Matley had given it: the Indosuchus horizon is "Lameta Group in the
        Narmada Valley, India, late Cretaceous", and correlation with the
        Ariyalur Stage "adds strength to the Maestrichtian assignment of the
        upper limit of the group". The lower third is "at least younger than the
        Turonian as tyrannosaurs are known to occur in the highest Cretaceous",
        with a lower limit that "may extend down to Santonian". The unit is
        handled at group rank, after Chanda and Bhattacharyya (1966), with a
        Greensand, a Limestone and a Sandy Limestone inside it.
    - id: wilson2003a
      notes: >
        Dates the formation Maastrichtian throughout, mapping "principal Late
        Cretaceous (Maastrichtian) dinosaur localities in the Lameta Formation"
        and placing the Rajasaurus skeleton in "latest Cretaceous
        (Maastrichtian) beds near Rahioli" in Gujarat. The bones lie in a
        conglomeratic layer below an egg-bearing limestone equivalent to the
        "Main Lameta limestone" at Bara Simla, which "has been regarded as
        latest Cretaceous (Maastrichtian) in age on the basis of
        microvertebrates and associated microfossils" and on its position
        beneath the Deccan Trap flood basalts.
    - id: huene1933a
      notes: >
        Huene and Matley date the Lameta fauna by correlation with Depéret's
        Madagascan beds and conclude "we may take the fossiliferous beds at
        Jubbulpore to be Turonian and the Pisdura beds to be lowest Senonian",
        arguing from plentiful allosaurids, coelurids and compsognathids and
        from the unspecialized nodosaur Lametasaurus that these rocks record "an
        age not high in the Upper Cretaceous". This is the source of the
        mid-Cretaceous stages attached to the formation, and it is a correlation
        later work replaces with a Maastrichtian age.
    - id: jain1997a
      notes: >
        The horizon of Titanosaurus colberti at Dongargaon is given as "Late
        Cretaceous (Maastrichtian)", and "A Maastrichtian age for the Lameta
        Formation, in general, is also suggested by Buffetaut (1987), Dogra et
        al. (1988), Udhoji and Mohabey (1991), and Chatterjee (1992)". Jain and
        Bandyopadhyay set that against a sequence of earlier readings for the
        Dongargaon exposure, from a Paleocene-to-Eocene age for the fish fauna
        through a post-Cretaceous age and a Santonian-to-Maastrichtian range,
        and conclude with Mohabey and colleagues that the biota indicates "a
        terminal Cretaceous (=Maastrichtian) age".
    - id: carrano2008a
      notes: Gives "Lameta Formation; Maastrichtian".
    - id: chure2000a
      notes: >
        Independently, "Lameta Formation AGE: Maastrichtian".

Lance:
  rank: formation
  period: [Late Cretaceous]
  stages: [Maastrichtian]
  references:
    - id: boyd2009a
      notes: >
        Gives "Lance Formation of Wyoming (Maastrichtian".
    - id: sullivan2006a
      notes: >
        Pairs it with its correlative at the same age: "Lance Formation,
        Montana and Wyoming; Hell Creek Formation, South Dakota; late
        Maastrichtian".
    - id: lull1915a
      notes: >
        Describes the unit as "The late Cretaceous beds of Wyoming, which have
        received from the United States Geological Survey the official
        designation of Lance formation", beds that had earlier gone by the names
        Laramie formation, Converse County beds, and Ceratops beds.
    - id: csiki-sava2016a
      notes: >
        Upper Maastrichtian, in a comparison: a Transylvanian theropod tooth
        morphotype "resembles in its shape teeth from the upper Maastrichtian
        Lance Formation of North America assigned by Longrich (2008) to the
        possible troodontid Pectinodon".

Laramie:
  rank: formation
  period: [Late Cretaceous]
  stages: [Maastrichtian]
  references:
    - id: carpenter2002a
      notes: >
        Counts it, with the Arapahoe and Denver Formations, among the "Upper
        Cretaceous strata of the Denver Basin". Places it in the basin as "the
        delta plain environment of the Laramie Formation" at Locality 9, one of
        only two places in the basin that have yielded semiarticulated
        specimens, and, following Lehman (1987, 2001), treats the basin's
        dinosaurs as the southernmost part of the Triceratops-dominated
        Maastrichtian fauna.
    - id: csiki1998a
      notes: >
        Cites the dedicated faunal treatment, "Vertebrate fauna of the Laramie
        Formation (Maastrichtian), Weld County, Colorado".
    - id: novas1996a
      notes: >
        Gives "Ornithomimus" minutus, which Holtz (1995) had considered a
        possible member of the Mononykus lineage, as from the "Laramie
        Formation, Late Maastrichtian".
    - id: holtz1995a
      notes: >
        A theropod phylogeny, which names this unit once in some 214,000
        characters and not in connection with any age. It contributes nothing
        to the entry's stage.
    - id: carpenter1979a

Las Leoneras:
  rank: formation
  period: [Late Triassic, Early Jurassic]
  stages: [Sinemurian, Pliensbachian, Toarcian]
  references:
    - id: pol2011b
      notes: >
        Gives the competing readings and what constrains them: the unit has been
        "referred to the Pliensbachian–Toarcian" or to the "Upper
        Sinemurian–Toarcian", "although no direct datings of these sediments are
        available", and its age "is certainly constrained by the Middle Jurassic
        dating of the volcanic facies of the overlying Lonco Trapial Formation".
        The context is "consistent with a Lower Jurassic age for the Las
        Leoneras Formation. However, an Upper Triassic age cannot be completely
        ruled out at the moment, as there is not a well-defined lower constraint
        for the age of this unit."
    - id: cúneo2013a
      notes: >
        Places its base, the deposition of "the fluvial and lacustrine strata
        of the Las Leoneras Formation over the basement igneous and metamorphic
        rocks (Mamil Choike Formation)" beginning in the Early Jurassic.
    - id: pol2020a
      notes: >
        Sets it below the volcanic Lonco Trapial Formation and records that it
        "yielded Leonerasaurus taquetrensis", one of the youngest documented
        non-eusauropod sauropodomorphs.

Lecho:
  rank: formation
  period: [Late Cretaceous]
  stages: [Campanian, Maastrichtian]
  references:
    - id: powell2003a
      notes: >
        Places it in its wider framework and fixes the fossil level: "Lecho
        Formation, Balbuena Subgroup, Salta Group. The fossiliferous level lies
        22 m above the base of this unit." Gives the El Brete estancia as "11 km
        west of El Tala, upon National Route 9 in the Department of Candelaria,
        in southern Salta Province" -- note Hendrickx and colleagues (2024) give
        Route 6 rather than Route 9 for the site's road.
    - id: powell1992a
      notes: >
        Repeats the 22 m level and brackets the age: the formation "underlies
        the Yacoraite Formation", and correlation with the Colorado River and
        Allen faunas "infers a Campanian-Maastrichtian age for the Lecho
        Formation".
    - id: hendrickx2024a
      notes: >
        Gives "the Maastrichtian Lecho Formation of Salta, Argentina" and logs
        the occurrence of Noasaurus within it against the overlying
        "Maastrichtian–Danian Yacoraite Formation of the Balbuena Subgroup,
        Salta Group", dating that occurrence "early or mid Maastrichtian, Upper
        Cretaceous". Notes the formation "is typically regarded as belonging to
        the latest stages of the Cretaceous, either as (?Upper)
        Campanian–Maastrichtian ... or strictly Maastrichtian".

Lehmhagen:
  rank: member
  parent: Posidonia Shale
  period: [Early Jurassic]
  stages: [Toarcian]
  references:
    - id: ansorge2025a
      notes: >
        Gives the unit and its position in the Grimmen clay pit, "units 2-7,
        Posidonia Shale Formation, Lehmhagen Member, lower Toarcian,
        semicelatum Subzone".

Lewisville:
  rank: formation
  parent: Woodbine
  period: [Late Cretaceous]
  stages: [Cenomanian]
  dispute:
    summary: >
      Formation or member of the Woodbine. Tykoski and colleagues (2023) title
      their paper for "the Lewisville Formation (middle Cenomanian) of Texas";
      McDonald and colleagues (2017) twice write of "the Lewisville Member of
      the Woodbine Formation of Texas".
  references:
    - id: tykoski2023a
      notes: >
        Uses formation rank and gives the age as middle Cenomanian.
    - id: mcdonald2017a
      notes: >
        Uses member rank under the Woodbine.

Liangtoutang:
  rank: formation
  parent: Tiantai
  period: [Early Cretaceous, Late Cretaceous]
  stages: [Aptian, Albian, Cenomanian]
  variants:
  - Laijia
  references:
  - id: zheng2012a
    notes: >
      Places the formation in the Tiantai Group between the Tangshang and
      Chichengshan Formations, a red sandstone of shallow lacustrine origin rich
      in eggs and bones. Notes that it "has been assigned previously to late
      Early Cretaceous" and radiometrically dated at 105.9 to 103.2 Ma, while
      fossil comparison and stratigraphic correlation point to the early Late
      Cretaceous, and settles on "the mid-Cretaceous, Albian–Cenomanian". The
      Aptian printed in the abstract is at odds with the paper's own keywords
      and conclusion.
  - id: zheng2018a
    notes: >
      Records Laijia Formation as an alternate name and gives the age as
      mid-Cretaceous, Albian to Cenomanian, 105.9 to 96 Ma, from three
      radiometric studies and stratigraphic correlation, giving the horizon as
      "later Early to early Late Cretaceous (Albian-Cenomanian)"; the formation
      had been widely accepted as early Late Cretaceous before those dates.
  - id: xing2024a
    notes: >
      Repeats the Albian to Cenomanian span.

Lianhe:
  rank: formation
  parent: Guifeng
  period: [Late Cretaceous]
  stages: [Maastrichtian]
  references:
    - id: yao2026a
      notes: >
        Gives a bonebed "within the middle of the Upper Cretaceous
        (Maastrichtian) Lianhe Formation at the Zhutongkeng locality, Shahe
        Town, Zhanggong District, Ganzhou City, Jiangxi Province".
    - id: xing2024a
      notes: >
        Places it third in the Guifeng Group, after the Hekou and the Tangbian.

Lianmuqin:
  rank: formation
  parent: Tugulu
  period: [Early Cretaceous]
  stages: [Valanginian, Hauterivian, Barremian, Aptian, Albian]
  references:
    - id: jia2024a
      notes: >
        Places it "of the Tugulu Group in the late Valanginian".
    - id: zheng2023a
      notes: >
        Gives the group's order -- "the Tugulu Group consists (in ascending
        order) of the Qingshuihe, Hutubihe, Shengjinkou, and Lianmuqin
        Formations" -- and reads this unit as possibly "deposited as early as
        the Valanginian". Paleontological evidence indicates "an Aptian-Albian
        age for the Lianmuqin Formation of the southern Junggar Basin", and the
        paper's age model puts "the Lianmuqin Formation as Valanginian to
        Albian".

Liburnian:
  rank: formation
  period: [Late Cretaceous]
  stages: [Santonian, Campanian, Maastrichtian]
  references:
    - id: dallavecchia2009a
      notes: >
        Gives the Tethyshadros horizon as "A lens of well-bedded, black
        limestone, 10 meters-thick and 70 meters long, in the upper
        Campanian-Paleocene Liburnian Formation near the Villaggio del
        Pescatore, Trieste Province, north-eastern Italy".
    - id: dallavecchia2020a
      notes: >
        Narrows the horizon within it, the holotype coming from "the basal part
        of the Liburnian Formation (upper Campanian or lower Maastrichtian) of
        NE Italy".
    - id: dai2025a
      notes: >
        Independently places Tethyshadros in the "lower Liburnian Formation in
        Trieste Province of northeast Italy", late Campanian to early
        Maastrichtian.
    - id: csiki-sava2015a
      notes: >
        Places the Tethyshadros site at Villaggio del Pescatore in "calcareous
        deposits of the Liburnia Formation" and traces its dating: "first
        reported as Santonian ... or Santonian–Campanian", its age was later
        revised by Dalla Vecchia (2009) to late Campanian to early
        Maastrichtian, "based on biostratigraphic data and lithostratigraphic
        correlations".

Lilstock:
  rank: formation
  parent: Penarth
  period: [Late Triassic]
  stages: [Rhaetian]
  references:
    - id: evans2025a
      notes: >
        Gives the rank, parent and age together, "the Cotham Member of the
        Lilstock Formation (Penarth Group, Rhaetian)", and names the Langport
        Member as its other subdivision.
    - id: martill2016a
      notes: >
        Places conodonts in "the Late Triassic Langport Member of the Lilstock
        Formation (Penarth Group) at Lavernock Point", 4 m beneath the
        Dracoraptor site.

Loe-ein:
  rank: formation
  period: [Late Jurassic, Early Cretaceous]
  stages: [Kimmeridgian]
  dispute:
    summary: >
      Both the age and the name are unsettled, and the two readings are an epoch
      apart. Dong (1990) gives Monkonosaurus "from the Loe-ein Formation
      (Kimmeridgian or Neocomian)", hedging between the Late Jurassic and the
      Early Cretaceous. Pereda-Suberbiola and colleagues (2013) record that
      Weishampel and colleagues (2004) instead place the taxon in "the Lura
      Formation (? = Loe-ein Formation), which is Early Cretaceous in age", so
      whether the two names denote one unit is itself in question.
  references:
    - id: dong1990b
      notes: >
        Gives the hedged age, Monkonosaurus coming "from the Loe-ein Formation
        (Kimmeridgian or Neocomian)", and sets it beside Wuerhosaurus from the
        Tugulu Group.
    - id: pereda-suberbiola2013a
      notes: >
        States that the age "is uncertain", records Dong's Late Jurassic to
        Early Cretaceous reading, and gives the competing Lura Formation
        assignment.
    - id: weishampel2004b
      notes: >
        A list row rather than prose, and the source of the queried synonymy:
        "Lura Formation (?= Loe-ein Formation; Zhao 1983; Dong 1990b; Sun et
        al. 1992)" for Xizang Zizhiqu, with Monkonosaurus lawulacus under it at
        "Age: Early Cretaceous (Sun et al., 1992; Yao et al., in press)". The
        question mark on the equation is the compendium's own. The age is an
        epoch rather than a stage, and is itself relayed, one of its two
        sources being in press at the time, so it adds nothing to the
        Kimmeridgian.

Lohan Cura:
  rank: formation
  period: [Early Cretaceous]
  stages: [Aptian, Albian]
  references:
    - id: carballido2012a
      notes: >
        Dates it by way of a member inside it, "The age of this member is
        considered as Aptian-Albian" for the Puesto Quiroga.
    - id: bellardini2022a
      notes: >
        Gives "the fluvial sediments of the Lohan Cura Formation (Albian)" at
        Cerro de los Leones, and refers the Ligabuesaurus beds there to the
        lower section of the Cullín Grande Member, "the upper member of the
        Lohan Cura Formation (Bajada del Agrio Group, Lower Cretaceous,
        Albian)".
    - id: bellardini2022b
      notes: >
        Independently gives the same.
    - id: garrido2010a
      notes: >
        Albian, as the unit beneath the Neuquén Group: south of the Huincul
        Ridge "the Candeleros Formation rests concordantly on deposits of the
        Lohan Cura Formation, the latter with an estimated age in the Albian",
        following Leanza and Hugo (1995) and Leanza (1999). At the El Sauce
        field near Picún Leufú the boundary between the two is a level of
        evaporites, gypsum interlaminated with fine green mudstones, which forms
        the top of the Lohan Cura.
    - id: leanza1995a
      notes: >
        Erects the formation: the name "is proposed to identify a set of
        continental sedimentites that overlie Formation La Amarga in
        unconformity and are covered in the same manner by Formation Candeleros,
        reaching 177.20 m in thickness", with Cerro Lohan Cura as the type
        locality and the Puesto Quiroga and Cullin Grande members from bottom to
        top. Its age is bracketed rather than measured: the minimum comes from
        "the age of the unconformity existing at the base of the Neuquen Group
        which, according to Orchuela and Ploszkiewicz (1984), can be estimated
        at the Lower Cenomanian (97±3 Ma)", and the maximum "can reach the
        Aptian".
    - id: leanza1999a

Lonco Trapial:
  rank: group
  period: [Early Jurassic, Middle Jurassic]
  stages: [Pliensbachian, Toarcian, Aalenian, Bajocian, Bathonian]
  references:
    - id: pol2011b
      notes: >
        Uses the unit as the upper age constraint on the Las Leoneras Formation,
        calling the andesite and volcaniclastic deposits that unconformably
        cover it Middle Jurassic. Already records the strain in that assignment:
        the sedimentary facies at the base of the unit in this region carry a
        well preserved taphoflora "that was originally regarded as Middle
        Jurassic in age", but new evidence makes it Early Jurassic.
    - id: pol2020a
      notes: >
        Dates the volcanic rocks directly: a U-Pb zircon date of 180.330 +/-
        0.068 Ma from the massive pyroclastic interval "provides a direct age
        constraint on its peak volcanic activity" and is congruent with the
        previously determined 188.9-178.8 Ma bracket, which the paper glosses as
        Pliensbachian-Toarcian. The timing puts this volcanism alongside the
        Karoo-Ferrar large igneous province and the early Toarcian oceanic
        anoxic event.
    - id: cúneo2013a
      notes: >
        Brackets the unit between U-Pb zircon dates on tuffs in the formations
        below and above it, a weighted mean of 188.946 +/- 0.096 Ma in the upper
        Las Leoneras Formation and 178.766 +/- 0.092 Ma in the lower Canadon
        Asfalto Formation, and concludes its age is "entirely within the Early
        Jurassic (Pliensbachian-Toarcian)", explicitly older than the Middle to
        Late Jurassic ages of 176 to 146 Ma that K-Ar geochronology had
        supported. Records that the conglomeratic and volcanic-dominated facies
        have carried the alternative names Taquetren Formation, Cerro Carnerero
        Formation and Canadon Puelman beds, "collectively grouped under the
        so-called Lonco Trapial Group", and that the flora at the base of the
        unit at Canadon del Zaino is restricted to the Pliensbachian.
    - id: rauhut2003c
      notes: >
        Names the group by way of its basal unit, the Cerro Carnerero being
        "the basal formation of the Lonco Trapial Group" in Chubut Province,
        Argentina.

Longjiang:
  rank: formation
  period: [Early Cretaceous]
  references:
  - id: wang2023a
    notes: >
      Lowest of the three Lower Cretaceous formations exposed in the
      Dayangshu Basin of the Great Khingan Range fold belt, beneath the
      Jiufengshan and Ganhe Formations; intermediate lava and clastic rocks
      yielding a Jehol-type assemblage at the Pigeon Hill locality.
  - id: wang2022a
    notes: >
      Gives the horizon for the Pigeon Hill material as Longjiang Formation,
      Lower Cretaceous.

Lonzée:
  rank: member
  period: [Late Cretaceous]
  stages: [Coniacian, Santonian, Campanian]
  references:
    - id: godefroit2007a
      notes: >
        Gives the Craspedodon teeth as "discovered in the Lonzée Member
        (?Coniacian-Santonian, Upper Cretaceous) in the surroundings of the
        village of Lonzée (Namur Province, Belgium)". Names no containing unit.
    - id: robaszynski2001a
      notes: >
        Its belemnites and inoceramids give the member a "? Coniacian –
        Santonian -? basal Campanian" age, the belemnites indicating Santonian
        and the inoceramids partly Coniacian. Its known occurrence "is
        restricted to the area around Lonzée near Gembloux (Namur)", about 3 m
        thick, with no stratotype fixed and no outcrops left.

Los Alamitos:
  rank: formation
  period: [Late Cretaceous]
  stages: [Campanian, Maastrichtian]
  references:
    - id: alarcón-muñoz2023a
      notes: >
        Gives the Huallasaurus horizon as "Arroyo Verde Puelén Department, Río
        Negro Province, late Campanian to early Maastrichtian, Los Alamitos
        Formation".
    - id: bandeira2024a
      notes: >
        Tabulates the same taxon and unit as "Campanian" to "Maastrichtian" on
        Bonaparte and colleagues (1984) and Rozadilla and colleagues (2021).
    - id: powell2003a
      notes: >
        Places the Estancia Los Alamitos titanosaurid locality in the "Lower
        section of the Los Alamitos Formation" and dates it "Late Cretaceous,
        Campanian or probably Early Maastrichtian", after Bonaparte (1984).
        Gives the Aeolosaurus rionegrinus horizon as the Los Alamitos Formation,
        "Late Cretaceous, Campanian-Maastrichtian", after Bonaparte and
        colleagues (1984).
    - id: bonaparte1984b
      notes: >
        The primary for both stages, and it gives them in its title: "Los
        Alamitos Formation (Campanian-Maastrichtian) of southeastern Rio
        Negro". Presents the unit's lithology, paleontology and paleoecology in
        its type area, with the succession running from the Jurassic Marifil
        through the Chubut Group.
    - id: rozadilla2021a
      notes: >
        Places the unit among "Campanian-Maastrichtian sedimentary units in
        northern Patagonia", beside the Allen, in the course of reviewing South
        American hadrosaurids.
    - id: bonaparte1984c

Los Bastos:
  rank: formation
  parent: Neuquén
  period: [Late Cretaceous]
  stages: [Coniacian]
  references:
    - id: gonzálezriga2013a
      notes: >
        Places it in the group and dates it, Malarguesaurus having been "found
        in strata assigned to Los Bastos Formation (early-middle Coniacian)"
        in the middle levels of the Neuquén Group, with Mendozasaurus in the
        upper levels of the Sierra Barrosa Formation.
    - id: bellardini2022a
      notes: >
        Independently gives "the Los Bastos Formation (Coniacian) of
        north-western Neuquén Basin (Mendoza Province, Argentina)".
    - id: garrido2010a
      notes: >
        Erects it for a succession of red mudstones with minor sandstone
        intercalations above the Portezuelo Formation and below the newly named
        Sierra Barrosa Formation, in the Río Neuquén Subgroup, with its type
        locality at the Los Bastos hydrocarbon deposit between Sierra Barrosa
        and Cerro Senillosa. Absolute dating is lacking: "Based on stratigraphic
        relations, an age ranging from Early Coniacian to Middle Coniacian is
        inferred for this unit."

Los Blanquitos:
  rank: formation
  period: [Late Cretaceous]
  stages: [Santonian, Campanian, Maastrichtian]
  references:
    - id: powell1979a
      notes: >
        Places the Arroyo Morterito dinosaurs in "the upper section of the Los
        Blanquitos Formation (Pirgua Subgroup, Salta Group) of the Upper
        Cretaceous (Upper Senonian)", and concludes that "the Senonian
        (Campanian-Maestrichtian) age of the Los Blanquitos Formation can be
        reaffirmed", which radiometric dates from the Pirgua Subgroup also
        support. The overlying Yacoraite Formation is limited to the
        Maastrichtian.
    - id: carrano2012a
      notes: >
        Gives the Unquillosaurus pubis as coming "from the Los Blanquitos
        Formation (late Santonian-?Campanian) of Arroyo El Morterito", Salta,
        Argentina, keeping the Campanian as a query.

Los Colorados:
  rank: formation
  parent: Agua de la Peña
  period: [Late Triassic, Early Jurassic]
  stages: [Norian, Rhaetian]
  references:
    - id: arcucci2003a
      notes: >
        Gives the containment, the formation being "the upper part of the Agua
        de la Peña Group in the Ischigualasto-Villa Union Basin in western
        Argentina". Reports its age as "widely considered as Norian", and
        records that Heckert and Lucas (2000) referred it instead to the
        Rhaetian, "basing this statement upon correlations of other tetrapod
        genera, mainly aetosaurs". Arcucci and colleagues doubt that referral,
        since recognizing a European marine stage in this predominantly
        terrestrial basin is difficult, and settle on "the latest part of the
        Late Triassic".
    - id: galton2004a
      notes: >
        Tabulates "Los Colorados Formation | Norian" for La Rioja.
    - id: peyredefabrègues2015a
      notes: >
        Independently gives the Esquina locality as "Late Triassic (Norian".
    - id: shubin1991a
      notes: >
        The formation's tetrapod assemblage is "generally considered to be Late
        Triassic in age", but in this cluster analysis it "weakly clustered with
        those from the Early Jurassic, emphasizing its peculiar, seemingly
        intermediate faunal composition". The reading is left open, the analysis
        supporting "the impression that this assemblage may either represent an
        intermediate fauna or that sampling of this formation may have
        encompassed both Late Triassic and Early Jurassic strata", with the
        published information insufficient to show whether all the taxa came
        from the same stratigraphic level.

Los Llanos:
  rank: formation
  period: [Late Cretaceous]
  stages: [Campanian]
  references:
    - id: velandia2025a
      notes: >
        Gives the Vitosaura horizon at "the Tama locality, in outcrops of the
        Campanian Los Llanos Formation", La Rioja Province, northwestern
        Argentina, in a paleosol level of the Tama pedotype about 28 meters
        above the underlying Patquía Formation, and confirms abelisaurids in the
        unit. Hedges that age in the systematic section: "A Late Cretaceous age
        (possibly Campanian) has been suggested for the Los Llanos Formation
        based on an association of microfossils" and vertebrates.

Los Molles:
  rank: formation
  period: [Early Jurassic, Middle Jurassic]
  stages: [Toarcian, Aalenian, Bajocian]
  references:
    - id: salgado2017a
      notes: >
        "The specimen was found in the marine-deltaic deposits of the Los Molles
        Formation (Toarcian-Bajocian), which in this sector reaches a thickness
        of approximately 1,042 m", and the same span stands unattributed in the
        abstract. The horizon is fixed biostratigraphically rather than by the
        formation: the ammonite Sonninia altecostata places the fossil-bearing
        level in the early Bajocian, some 40 m below the contact with the
        overlying Bajocian-Bathonian Lajas Formation, in laminated pelites rich
        in ammonitiferous concretions.
    - id: brown2020b
      notes: >
        Gives the Isaberrysaura horizon as "Los Molles Formation
        (Toarcian-Bajocian), Neuquén Province, Argentina", and records the
        cycad seeds preserved as gut contents.
    - id: hui2021a
      notes: >
        Narrows the occurrence, Isaberrysaura being "known from the Bajocian
        part of the Los Molles Formation of Argentina".

Lourinhã:
  rank: formation
  period: [Late Jurassic, Early Cretaceous]
  stages: [Kimmeridgian, Tithonian, Berriasian]
  references:
    - id: schneider2009a
      notes: >
        Fluvial sandstones of the unit were laid down in the northernmost sector
        of the Lusitanian Basin while the Alcobaça and other formations
        accumulated elsewhere, and the body of sandstone "gradually expanded
        southward to the Torres Vedras area and covered the entire NLB and large
        parts of the CLB", so that "Stratigraphically, the unit spans the entire
        Kimmeridgian and Tithonian". Sr-isotope ages on oyster shells contradict
        the model of Pena dos Reis and colleagues (1996), which included the
        Arranhó in this formation and had the formation start only in the late
        Early Tithonian. Which beds belong here has shifted with each author:
        the Praia Azul and Sobral were moved into the Farta Pão Formation, where
        this paper keeps the Sobral as a member, and the Sobral has elsewhere
        been treated as a basal member of this formation.
    - id: mateus2009b
      notes: >
        The 400-m-thick formation "consists of mostly alluvial sediments,
        deposited during the early rifting of the Atlantic Ocean in the
        Kimmeridgian and Tithonian", its succession shifting repeatedly between
        flood-plain mud and fluvial sands in a way that favors the preservation
        of tracks. Elsewhere puts the same deposition in "latest Jurassic,
        Tithonian–Kimmeridgian times" after Hill (1989), and its conclusions
        carry the age again: "The Lourinhã Formation (Kimmeridgian/Tithonian)
        contains a rich and diverse dinosaur ichno- and somatofossil fauna".
    - id: mateus2017a
      notes: >
        The dedicated treatment, titled "The Lourinhã Formation: the Upper
        Jurassic to lowermost Cretaceous of the Lusitanian Basin, Portugal",
        which is where the formation rank and the span come from. The
        Berriasian is in its text and not only in that title: the last field
        stop "examines the top of the Assenta Member of the Lourinhã Formation
        ... upper Tithonian to lowermost Berriasian) and the Porto da Calada
        Formation ... Berriasian) and thus includes the Jurassic-Cretaceous
        boundary". Notes the
        deposits "can reach almost 400 m".

Lower Greensand:
  rank: group
  period: [Early Cretaceous]
  stages: [Aptian, Albian]
  references:
    - id: barker2020a
      notes: >
        Gives the rank and its contents: the succession at Knock Cliff "is
        formed of the three strata of the Lower Greensand Group: the uppermost
        members of the Ferruginous Sands Formation (late Aptian in age ...),
        the Sandrock Formation (age undetermined), and the Monk's Bay Sandstone
        Formation (Albian in age ...)". Names the "Aptian Ferruginous Sands
        Formation of the Lower Greensand Group".

Lufeng:
  rank: formation
  period: [Late Triassic, Early Jurassic]
  stages: [Norian, Rhaetian, Hettangian, Sinemurian, Pliensbachian, Toarcian]
  references:
    - id: barrett2005b
      notes: >
        Places the Lower Lufeng Formation in the "Lower Jurassic" and records
        its traditional split "into two horizons: the lower Dull Purplish Beds
        (Hettangian) and upper Dark Red Beds (Sinemurian)". Both are informal
        horizon names; the paper keeps them over the member names Fang and
        colleagues (2000) proposed, noting "this system has not been widely
        accepted".
    - id: raven2019a
      notes: Gives the whole as "Lufeng Formation (Hettangian-Sinemurian".
    - id: xing2012b
      notes: >
        Recounts the dating of the Lower Lufeng Formation: it "was originally
        thought to be Late Triassic" (Bien, 1940; Young, 1951), but
        "biostratigraphical correlates (both vertebrate and invertebrate)
        indicate an Early Jurassic (Hettangian–Sinemurian) age". Sinosaurus
        specimen ZLJT01 comes from the lowermost (Shawan member) portion of the
        formation.
    - id: young1951a
    - id: fang2000a
      notes: >
        Erects the nomenclature this entry uses and places all of it in the
        Lower Jurassic: the formal definitions sit under a Lower Jurassic
        heading and carry J1 symbols, with the Triassic units below them. The
        paper names no international stage anywhere, and no Norian, Rhaetian or
        Upper Triassic appears in it, so the Triassic stages on this entry are
        not from here.
    - id: bien1940a
      notes: >
        The founding Triassic reading, and it hedges its own upper part. Its
        title is the claim - the discovery of Triassic saurischian and
        primitive mammalian remains at Lufeng - and it concludes that "the
        lower part of the so-called 'Younger Red Bed Formation' of Lufeng has
        been accurately dated as of Upper Triassic in age". But its summary
        separates the two halves: the lower series "has been reliably dated as
        of Upper Triassic in age (uppermost middle Keuper), while the ... Upper
        Lufeng Series might still be of Upper Triassic (upper Keuper), though
        the possibilities of its being post-Trias, or Lias are not completely
        ruled out". The argument is conducted in Keuper and Lias, and no
        international stage appears in it.
    - id: olsen1984a
      notes: >
        "Floral evidence strongly suggests that the lower Lufeng, too, is Early
        Jurassic in age", after Cui (1976) and Sigogneau-Russell and Sun (1981).
        The Lower Lufeng Series shares morganucodontid mammals, tritylodontids,
        prosauropod and ornithischian dinosaurs and protosuchian crocodiles at
        family level with the upper Stormberg assemblage of southern Africa,
        which the paper dates Early Jurassic (Hettangian to Pliensbachian).
    - id: cui1976a
    - id: sigogneau-russell1981a
      notes: >
        Places the unit in the Early Jurassic and contradicts the Triassic
        reading for its upper part specifically. Under an Early Jurassic
        heading it records that the purple beds are "differently allocated
        according to the various authors either to the Rhaetic or to the
        earliest Jurassic", while "The upper level at least, composed of dark
        red beds (mudstones and sandstones), is now admitted, both by
        geologists and paleontologists, to be Liassic", the argument running
        through a coal level correlated into Szechuan. It adds that "further
        study is necessary before its age can be definitively set", and
        elsewhere writes of the famous Chinese "Triassic" mammals in its own
        quotation marks.
    - id: you2014b
      notes: >
        Biostratigraphic correlation makes the age "probably early - middle
        Early Jurassic (Hettangian - Pliensbachian)" after Luo and Wu (1995),
        while "Magnetostratigraphic analysis has indicated late Sinemurian –
        ?Toarcian for the age of the Lufeng Formation" after Huang and
        colleagues (2005). In the Lufeng area the formation overlies the Lower
        Jurassic Yubacun Formation and is disconformably overlain by the Middle
        Jurassic Chuanjie Formation.
    - id: huang2005a
      notes: >
        A magnetostratigraphic study of the Jurassic in the Lufeng area, and it
        places this unit and its neighbors in the Lower Jurassic: its
        stratigraphic table carries the Fengjiahe and the Lufeng formations
        both as J1, with the Lufeng's Zhangjiaba and Shawan members beneath
        that heading and the Triassic units below them. It correlates the upper
        part of the Lufeng Formation with the upper Toarcian, reads sites low
        in the section as "roughly" middle Sinemurian, and records that the
        interval "from the base of the Zhangjiaba Member through the Shawan
        Member has unstable rock magnetism with disordered directions", so the
        members themselves are the part it cannot correlate. It concludes that
        the transitional Yubacun Formation, between the Upper Triassic Zhaijie
        and the Lower Jurassic Lufeng, "should be assigned to the Jurassic
        System". It names no Norian, and its single Rhaetian is a polarity zone
        below this unit. Note it spells the member Zhangjiaba, a third form
        beside Zhangjia'ao and Zhangjiawa.

Lujiatun:
  rank: member
  parent: Yixian
  period: [Early Cretaceous]
  stages: [Hauterivian, Barremian, Aptian, Albian]
  dispute:
    summary: >
      Rank and age both move between sources, as with the Yixian's other
      subdivisions. Sereno and colleagues call it the "Lujiatun Beds" in both
      2009 and 2010, not a member, and date it "Hauterivian-Barremian" in the
      first and "late Barremian or earliest Albian" in the second.
  references:
    - id: sereno2009a
      notes: >
        Gives "Lujiatun Beds [Hauterivian-Barremian stages, ~130 million years
        ago (Ma)] of the Lower Cretaceous" in the main text, but its notes date
        the same beds "to the late Early Cretaceous (Barremian-Aptian, ~125
        Ma)".
    - id: sereno2010a
      notes: >
        Gives "Lujiatun Beds, lowermost Yixian Formation (late Barremian or
        earliest Albian", placing it at the base of the formation.
    - id: cuenca-bescós2003a
      notes: >
        "Lujiatum Beds, Yixian Formation (Hauterivian, Liaoning, China)" is one
        of the gobiconodontid localities plotted on the Hauterivian
        paleogeographic map here.

Lulworth:
  rank: formation
  parent: Purbeck
  period: [Late Jurassic, Early Cretaceous]
  stages: [Tithonian, Berriasian]
  references:
    - id: naish2008a
      notes: >
        Gives a member and the younger reading, Echinodon becklesii coming
        "probably from the Berriasian Warbarrow Tout Member of the Lulworth
        Formation of Durlston Bay, Dorset".
    - id: galton1978a
      notes: >
        Records the disagreement behind the older bound: the material occurs "in
        the Lulworth Beds of CASEY (1971, Upper Volgian or 'Tithonian', Upper
        Jurassic)", while "problems of determination of the age of the Lulworth
        Beds are reviewed by DODSON et al (1964) who assign them to the
        Berriasian". Its own horizon for Echinodon is the "freshwater Dirt Bed
        (Mammal Bed) in lower part of Lulworth Beds (Middle Purbeck Beds, Lower
        Cretaceous)". Uses "Lulworth Beds" where later work uses Formation.

Lytle:
  rank: member
  parent: Purgatoire
  period: [Early Cretaceous]
  stages: [Aptian, Albian]
  references:
    - id: brill2007a
      notes: >
        Relocates the Theiophytalia type, which comes not from the Morrison
        Formation "but in the lower Lytle Member of the Purgatoire Formation
        (Dakota Group), which is of Aptian-Albian age", and gives the type
        horizon as "Lower Lytle member of the Purgatoire Formation (Lower
        Cretaceous)". Places the site on the ridge running south towards
        Colorado City.
    - id: mcdonald2010b
      notes: >
        Independently gives "the Aptian-Albian Lytle Member of the Purgatoire
        Formation of Colorado".

Löwenstein:
  rank: formation
  period: [Late Triassic]
  stages: [Norian]
  references:
    - id: yates2003b
      notes: >
        Gives "Löwenstein Formation, Middle Norian".
    - id: sues2004a
      notes: >
        Hedges the same, placing material from "the Lowenstein Formation of
        southern Germany" in the "Upper Triassic (?Norian".

Maanshan:
  rank: member
  parent: Ziliujing
  period: [Early Jurassic]
  references:
    - id: mcphee2016a
      notes: >
        Gives the Sanpasaurus horizon as "the Maanshan Member of the Ziliujing
        Formation, Weiyuan region, Sichuan Province", records the alternate
        rendering Ma'anshan, and places it "directly above the Dongyuemiao
        Member". Bounds rather than dates it: if the Dongyuemiao is Toarcian,
        "then the age of the Maanshan Member is no older than the late Early
        Jurassic".
    - id: dong1983a
      notes: >
        Gives the cetiosaurine sauropod material from Zizhong and Weiyuan
        counties as from the "Early Jurassic Maanshan Mem., Ziliujing Fm.", but
        holds that age as a correlation: the member's age "is provisionally
        regarded as Early Jurassic pending future confirmation", on the strength
        of its fauna and of Lepidotes in the overlying Daanzhai Member.

Maastricht:
  rank: formation
  period: [Late Cretaceous]
  stages: [Maastrichtian]
  references:
    - id: madzia2019a
      notes: >
        Places the Orthomerus dolloi material in it while recording that "the
        precise stratigraphical setting of the material is unknown" beyond that,
        and sets the unit at the top of the local sequence, running "from the
        Vijlen Member (Gulpen Formation) up to the uppermost unit of the
        Meerssen Member (Maastricht Formation)".
    - id: dallavecchia2020a
      notes: >
        Gives "the marine Maastricht Formation ('Chalk'; late Maastrichtian in
        age) of the Limburg (Belgium and the Netherlands)".
    - id: carrano2008a
      notes: >
        Tabulates Betasuchus bredai as "Maastricht Formation; Maastrichtian,
        Late", near Maastricht, Limburg.

Mackunda:
  rank: formation
  parent: Manuka
  period: [Early Cretaceous, Late Cretaceous]
  stages: [Albian, Cenomanian, Turonian]
  references:
    - id: herne2026a
      notes: >
        Gives the Muttaburrasaurus langdoni type horizon as "Mackunda Formation,
        Cenomanian-lower Turonian (96.3 ± 8.6 Ma to 93.51 ± 1.19 Ma)", southeast
        of Muttaburra in central western Queensland, and separately records that
        Tucker and colleagues (2016) dated the formation to the upper Albian,
        about 104 to 102 Ma.
    - id: agnolín2010a
      notes: >
        Gives the Muttaburrasaurus type horizon as "the upper part of the
        Mackunda Formation (late Albian-early Cenomanian)", near Rock Hole on
        the Thomson River, Queensland.
    - id: bartholomai1981a
      notes: >
        Places it "within the Manuka Sub-Group" and records the associated
        shallow-water marine invertebrates from nearby concretions.
    - id: bell2018a
      notes: >
        Repeats the late Albian to early Cenomanian span and sets it above the
        Allaru Mudstone.

Maevarano:
  rank: formation
  period: [Late Cretaceous]
  stages: [Maastrichtian]
  references:
    - id: tykoski2004a
      notes: >
        Tabulates the formation as Campanian for Majunga, Madagascar.
    - id: pittman2020a
      notes: >
        Tabulates the formation as Late Cretaceous, Maastrichtian, and gives
        Rahonavis ostromi as from "the Maastrichtian Maevarano Formation" of the
        Mahajanga Basin, Madagascar.
    - id: krause2007a
      notes: >
        Restricts it to the Maastrichtian: "Though previously regarded as
        ranging in age from Turonian to Campanian, there is no litho-, bio-, or
        magnetostratigraphic evidence to suggest anything other than a
        Maastrichtian age for the Maevarano Formation", following Rogers and
        colleagues in the same volume. The vast majority of the specimens
        collected by the Mahajanga Basin Project came from the "10- to 15-m
        thick Anembalemba Member".

Magnesian Conglomerate:
  rank: formation
  period: [Late Triassic]
  stages: [Norian, Rhaetian]
  references:
    - id: owen1842a
      notes: >
        Thecodontosaurus comes from "the dolomitic conglomerate at Redland near
        Bristol, a formation considered to belong to the oldest or lowest
        division of the new red sandstone series", with Palaeosaurus platyodon
        and P. cylindrodon from the same rock. Its reptiles rank among the
        oldest known: "The Monitors of the Thuringian Zechstein are older than
        the Labyrinthodonts of the Keuper; and among British Reptiles, the
        thecodont Lizards of the Magnesian conglomerate have equal claims to a
        more ancient origin." Both names serve for the one unit, "dolomitic
        conglomerate" in the description and "Magnesian conglomerate" in the
        discussion.
    - id: galton2007a
      notes: >
        The Durdham Down bone bed is not in this unit: the Clifton deposit was
        "long equated with the Magnesian Conglomerate, which occurs very close
        by", but on the recent literature summarized by Benton and colleagues
        (2000) it is "a Triassic (Rhaetian) dolomitized cave breccia or fissure
        fill (not in Magnesian/Dolomitic Conglomerate ... ) in Lower
        Carboniferous (Dinantian) marine limestone". That old equation carried
        an age with it, the rock having been "originally thought to represent
        the 'lower division of the New Red Sandstone' (so Permian ... )", which
        Etheridge (1870) replaced with a Muschelkalk or Lower Keuper
        correlation. Sanders (1862) "showed two outliers of the Magnesian
        Conglomerate (as N.R.S., for New Red Sandstone) in the northern part of
        Clifton", matching the two quarries mapped by Lavars in 1875.
    - id: galton1990a
      notes: >
        Gives the Thecodontosaurus occurrence as "Magnesian Conglomerate, Avon,
        England; Fissure Fillings, South Glamorgan, Wales" at "?Norian-Rhaetian",
        on more than 100 disarticulated elements.
    - id: peyredefabrègues2015a
      notes: >
        Uses formation rank and fixes the locality, "Magnesian Conglomerate
        Formation" at the "Quarry of Durdham Down, Clifton, Bristol England",
        Late Triassic, Norian to Rhaetian.

Majiacun:
  rank: formation
  period: [Late Cretaceous]
  stages: [Cenomanian, Turonian, Coniacian, Santonian, Campanian, Maastrichtian]
  references:
    - id: lü2010a
      notes: >
        Gives "Majiacun Formation (Upper Cretaceous: Coniacian-Campanian", with
        the Xixiasaurus type horizon in its "Mid-lower part", and infers from
        the troodontid's affinity with Byronosaurus that the formation "may be
        Campanian". Reviews the earlier readings: it "was described as
        Cenomanian to Turonian" by Zhou and colleagues (1983) on spores, pollen
        and dinosaur eggs, and on bivalves and gastropods "is regarded as
        Coniacian to Campanian ... and Santonian to Maastrichtian, respectively"
        by Chen and colleagues (2007) and Pan and colleagues (2007).
    - id: xing2014a
      notes: >
        Narrows the formation but resolves a bed within it: it "extends in age
        from the late Coniacian through to the end of the Santonian, the
        dinosaur-bearing bed very likely dates to the middle Santonian".
    - id: zhou1983a
    - id: chen2007a
    - id: pan2007a

Maleri:
  rank: formation
  period: [Late Triassic]
  stages: [Carnian, Norian, Rhaetian]
  references:
    - id: ezcurra2025a
      notes: >
        Treats the Lower and Upper Maleri as separate dinosaur-bearing
        formations of the Pranhita-Godavari Basin, dated "the Lower Maleri
        (middle-late Carnian), Upper Maleri (early Norian)". Places Maleriraptor
        in the Upper Maleri, "early Norian, Late Triassic", and elsewhere gives
        that upper unit's dinosaur assemblage as "early-middle Norian".
    - id: novas2010a
      notes: >
        Treats the unit as two formations: the Lower Maleri Formation,
        correlated with the Hyperodapedon Assemblage Zone, "is thus interpreted
        as Ischigualastian in age (i.e. late Carnian-early Norian)" after Langer
        (2005), while the overlying Upper Maleri Formation, for which earlier
        authors had advocated a Norian or early Norian age, is given as "?late
        Norian-earliest Rhaetian, Late Triassic".
    - id: cox1965a
      notes: >
        Rhynchosaurs occur in "the mid-Norian Maleri beds of India", which the
        paper raises as a possible relict occurrence, "the group persisting in
        an Indian continent which appears at that time to have been still in a
        more southerly and perhaps isolated position than it is today".

Malmros Klint:
  rank: formation
  parent: Fleming Fjord
  period: [Late Triassic]
  stages: [Norian]
  references:
    - id: beccari2021a
      notes: >
        Gives "The Late Triassic (Norian) outcrops of the Malmros Klint
        Formation, Jameson Land (Greenland)", which "have yielded numerous
        specimens of non-sauropod sauropodomorphs".
    - id: clemmensen2020a
      notes: >
        Records that most vertebrate bones of the group "have been found in
        uppermost Malmros Klint Formation, and in the Carlsberg Fjord and Tait
        Bjerg Members".

Manuka:
  rank: subgroup
  period: [Early Cretaceous, Late Cretaceous]
  stages: [Albian, Cenomanian, Turonian]
  references:
    - id: gray2002a
      notes: >
        Composes the subgroup and places it in the group above: the Mackunda and
        Winton formations "were made part of the newly-proposed Manuka Subgroup
        (Vine & others, 1967)", and "The Wilgunyah and Manuka Subgroups
        constitute the Rolling Downs Group of Whitehouse (1955)".
    - id: tucker2013a
      notes: >
        Records the same composition, that Gray and colleagues (2002) "grouped
        the Winton together with the Mackunda Formation to form the Manuka
        Subgroup".
    - id: bartholomai1981a
      notes: >
        Names the subgroup by way of the Mackunda Formation inside it, in
        Queensland, following Vine and colleagues.

Marayes:
  rank: group
  period: [Late Triassic, Early Jurassic]
  stages: [Norian, Rhaetian]
  references:
    - id: martínez2017a
      notes: >
        Names the group and its four constituent formations in the Marayes-El
        Carrizal Basin of northwestern Argentina, "from base to top, the
        Esquina Colorada (Middle Triassic), the Carrizal (upper Carnian-lower
        Norian), the Quebrada del Barro (upper Norian-Rhaetian) and the Balde
        de Leyes (Lower Jurassic) formations", crediting the group to Bossi
        (1976).
    - id: bossi1976a

Marfim:
  rank: formation
  parent: Ilhas
  period: [Early Cretaceous]
  stages: [Valanginian, Hauterivian]
  references:
    - id: bandeira2024a
      notes: >
        Gives the Tietasaura horizon, shale facies at a beach near the
        Plataforma Station in Salvador City, Bahia, "associated with the
        Valanginian" to "Hauterivian Marfim Formation (Ilhas Group, Recôncavo
        Basin)".
    - id: mannion2025a
      notes: >
        Independently refers a diplodocine vertebra to "the Valanginian" to
        "Hauterivian Marfim Formation" of northeastern Brazil.

Marnes Rouges Inférieures:
  rank: formation
  period: [Late Cretaceous]
  stages: [Maastrichtian]
  references:
    - id: powell2003a
      notes: >
        Uses the French name and dates the unit: "The fossiliferous level is
        included in the 'Marnes Rouges inferieures' Formation, (Marnes Rouges de
        la Maurine Member). This unit is considered Maastrichtian in age and is
        considered to have been formed under fluvial conditions". Which unit
        "This unit" takes is slightly open, the nearest antecedent being the
        member named in the parenthesis.
    - id: leloeuff1995a
      notes: >
        Gives the Ampelosaurus type horizon as "Marnes Rouges Inférieures
        Formation, member of the red marls of the Maurine (Bilotte, 1985)" at
        Bellevue, Campagne-sur-Aude, and dates it lower Maastrichtian.

Marnes d'Auzas:
  rank: formation
  period: [Late Cretaceous]
  stages: [Maastrichtian]
  variants: [Auzas Marls]
  references:
    - id: prieto-márquez2013a
      notes: >
        Gives the Canardia horizon as "the basal section of the upper
        Maastrichtian Marnes d'Auzas Formation" southwest of
        Marignac-Laspeyres in the Petites-Pyrénées, about 65 km southwest of
        Toulouse, Haute-Garonne.

Marnes de Dives:
  rank: formation
  period: [Middle Jurassic, Late Jurassic]
  stages: [Callovian, Oxfordian]
  references:
    - id: carrano2012a
      notes: >
        Gives the occurrence in full: "Vaches Noires cliffs, near Dives,
        Calvados, Basse-Normandie, France; Marnes de Dives; late Callovian,
        Middle Jurassic", for the Piveteausaurus braincase. Uses the name
        without a rank word. Gives Streptospondylus altdorfensis, from the same
        cliffs near Honfleur, a wider "late Callovian-early Oxfordian, late
        Middle-early Late Jurassic".
    - id: paul1988a
      notes: >
        Gives "Marnes de Dives Formation of France" at the "Upper Callovian of
        the Middle Jurassic", supplying the rank word the other source omits.

Marnes de la Maurine:
  rank: member
  parent: Marnes Rouges Inférieures
  variants: [Marnes Rouges de la Maurine]
  period: [Late Cretaceous]
  stages: [Maastrichtian]
  references:
    - id: leloeuff1995a
      notes: >
        Names it as the member of the containing formation that holds the
        Ampelosaurus type, "member of the red marls of the Maurine (Bilotte,
        1985)", lower Maastrichtian.

Marree:
  rank: subgroup
  period: [Early Cretaceous]
  stages: [Aptian, Albian]
  variants: [Marree Formation]
  references:
    - id: barrett2010b
      notes: >
        Gives the rank and the legacy name, the Bulldog Shale being "a
        constituent of the Marree Subgroup, which was formerly called the
        Marree Formation".
    - id: molnar1980a
      notes: >
        Ranks it as a formation and dates it: Kakuru comes "from the Aptian
        Marree Formation, at Andamooka, South Australia", and "The opalbearing
        horizon, the Marree Formation, is Aptian in age", after Carr and
        colleagues (1979).
    - id: carr1979a

Marília:
  rank: formation
  parent: Bauru
  period: [Late Cretaceous]
  stages: [Campanian, Maastrichtian]
  references:
    - id: santucci2022a
      notes: >
        Gives "Serra da Galga Member, Marília Formation, Bauru Group,
        Maastrichtian", and its table of South American titanosaurs lists each
        of the formation's species as "Maastrichtian (LK)", Late Cretaceous.
    - id: cavalcanti2026a
      notes: >
        Narrows it to the "Marília Formation (late Maastrichtian) at the
        paleontological site of Peirópolis in Minas Gerais State".
    - id: santucci2006a
      notes: >
        Reports that a "late Campanian / early Maastrichtian age" has been
        suggested for "the lower Marília Formation (Serra da Galga Member) in
        Uberaba", following Bertini and colleagues (2000) and Santucci and
        Bertini (2001).
    - id: bertini2000a
    - id: santucci2001a
      notes: >
        Scoped to a member and to its base: twelve of its twenty mentions of
        this formation are the Serra da Galga Member, and the claim is that
        "the base of the Serra da Galga Member ... indicates a Late
        Campanian/Early Maastrichtian age for this portion of the Bauru Group".
        It states the same age a second way, in the Latinate convention common
        in Brazilian stratigraphy - "indicative of Neocampanian/Eomaastrichtian
        age for the respective portions of these units" - where the prefixes
        mean late and early.
    - id: dias2020a
      notes: >
        "It is the youngest among the Cretaceous formations of the region, with
        a Maastrichtian age", following Dias-Brito and colleagues (2001), and
        corresponds to "conglomerates and coarse sandstones with calcite
        cementation", deposited by an anastomosed fluvial system that reworked
        coalescing alluvial fans.
    - id: dias-brito2001a
      notes: >
        Dates the unit by charophytes and ostracods rather than by vertebrates.
        Amblyochara sp. and Neuquenocypris minor mineira nov. subsp., from the
        Ponte Alta Member, are "Maastrichtian (probably Late Maastrichtian) in
        age", against a Turonian-Santonian assemblage in the Adamantina
        Formation below; "a hiatus, encompassing more than 11 Ma, separates
        those two formations." Treats the formation as the upper of two
        sequences, "[Maastrichtian (Neomaastrichtian?)]".

Mata Amarilla:
  rank: formation
  period: [Late Cretaceous]
  stages: [Cenomanian, Turonian, Coniacian, Santonian]
  variants: [Pari Aike]
  references:
    - id: novas2019a
      notes: >
        Keeps Mata Amarilla and Cerro Fortaleza apart and dates them separately:
        "the Mata Amarilla Formation is Cenomanian in age (approximately 97my;
        Varela et al., 2012), Cerro Fortaleza Formation is Campanian (around
        76.2Ma, based on studies by Sickman et al., 2018)". In the dinosaur
        succession of southwestern Santa Cruz the oldest assemblage is "the
        Cenomanian Mata Amarilla Formation", and carcharodontosaurid remains
        near the Shehuen River are said to agree with that age. The paper
        records that the correlations among these continental beds remain under
        intense debate.
    - id: sickmann2018a
      notes: >
        Folds the outcrops mapped as Mata Amarilla into the Cerro Fortaleza
        Formation and redates them: the "Cerro Fortaleza Formation" as delimited
        here "includes rocks that have sometimes been named 'Mata Amarilla
        Formation'", and thirteen detrital-zircon samples give maximum
        depositional ages showing the terrestrial deposits between Lago Viedma,
        Lago Argentino and Tres Lagos "are no older than Campanian". The single
        Cenomanian tuff age of Varela and colleagues (2012) is rejected on four
        grounds, among them that Cenomanian deep-marine facies lie between these
        terrestrial rocks and the Andean source to the west; the redefinition
        runs "from Cenomanian-Santonian to Campanian-Maastrichtian", though in
        the north of the basin "this age range may approach Santonian to
        Coniacian".
    - id: varela2012a
      notes: >
        Dates the middle section directly: twenty U-Pb laser-ablation spot
        analyses on zircons from a tuff 29 m above the lower/middle contact at
        Estancia Mata Amarilla give a concordia age of 96.2 +/- 0.7 Ma, "which
        corresponds to the middle Cenomanian", and the formation as a whole is
        "early Upper Cretaceous, extending from the Cenomanian to the
        Santonian". The onset of deposition of the lower section is bracketed to
        the "upper Albian-lower Cenomanian, ~100 Ma" because the underlying
        Piedra Clavada Formation is lower Albian. The paper was written because
        the invertebrate, dinosaur, fish, turtle, plesiosaur and floral evidence
        had given irreconcilable ages, among them a Maastrichtian assignment of
        the dinosaurs on the stratigraphic criteria of Kraemer and Riccardi
        (1997).
    - id: martínez2016a
      notes: >
        Gives "the Cenomanian" to "Coniacian Mata Amarilla Formation of Santa
        Cruz Province" and the angiosperm leaf assemblage recovered from it.
    - id: novas2013a
      notes: >
        Records the older name and gives the age of the Orkoraptor beds "(i.e.,
        Mata Amarilla Formation, former Pari Aike Formation)" as seemingly
        Cenomanian to Santonian.
    - id: bandeira2024a
      notes: >
        Tabulates Loncosaurus from the formation as Cenomanian.

McClelland Ferry:
  rank: member
  parent: Judith River
  period: [Late Cretaceous]
  stages: [Campanian]
  references:
    - id: ramezani2022a
      notes: >
        A Bayesian age-stratigraphic model built on three U-Pb bentonite ages
        constrains the member's base to 78.70 +2.0/-0.11 Ma and its top to
        76.269 +0.052/-0.34 Ma, the base treated as a maximum estimate because
        the correlated Taber coal zone "is expected to be time transgressive".
        Taken to the far ends of both error bars, 80.70 to 75.93 Ma, the member
        falls wholly within the Campanian on this project's own stage boundary
        table.
    - id: arbour2017a
      notes: >
        Gives its position and the surface that bounds it: "the mid-Judith
        discontinuity (MJD), which marks the boundary between the lower
        McClelland Ferry Member and the upper Coal Ridge Member of the Judith
        River Formation", identified "in the middle of the 180 m thick unit".
        The same paper dates the formation to about 4 Myr within the Campanian.
    - id: loewen2024a
      notes: >
        Places Lokiceratops in "the lower portion of the McClelland Ferry Member
        of the Judith River Formation in the Kennedy Coulee region along the
        Canada-USA border".
    - id: mallon2016a
      notes: >
        Treats it and the Coal Ridge as the two terrestrial members, listing
        taxa "from terrestrial McClelland Ferry or Coal Ridge members".

McNairy Sand:
  rank: member
  parent: Ripley
  period: [Late Cretaceous]
  stages: [Maastrichtian]
  references:
    - id: baird1979a
      notes: >
        Gives the bed as "the McNairy Sand Member of the Ripley Formation,
        considered early Maestrichtian in age", and reassesses the vertebrae
        Gilmore compared with Hypsibema crassicauda.
    - id: gilmore1945a
      notes: >
        Reaches the same correlation from lithology, the material being
        "identical with the beds immediately underlying the Owl Creek formation
        (Upper Cretaceous) of southeastern Missouri. On this basis they would
        be correlated with the McNairy sand member of the Ripley formation".

Meileyingzi:
  rank: bed
  parent: Jiufotang
  period: [Early Cretaceous]
  references:
    - id: sereno2010a
      notes: >
        Gives the Psittacosaurus meileyingensis type horizon as "Meileyingzi
        Beds, Jiufotang Formation (Aptian); Beipiao, Liaoning Province,
        People's Republic of China".

Menefee:
  rank: formation
  period: [Late Cretaceous]
  stages: [Santonian, Campanian]
  references:
    - id: dalman2021a
      notes: >
        Gives "Menefee Formation (Upper Cretaceous, early Campanian".
    - id: sullivan1999b
      notes: >
        Independently gives "Menefee Formation (early Campanian", and reasons
        that a holotype from the formation "would indicate a Santonian-early
        Campanian age for this specimen".

Mengyin:
  rank: formation
  period: [Late Jurassic, Early Cretaceous]
  stages: [Tithonian, Berriasian, Valanginian, Hauterivian, Barremian, Aptian]
  references:
    - id: mannion2019a
      notes: >
        Records the redating: the formation "(which yielded the clade specifier
        Euhelopus) is now thought to be earliest Cretaceous
        (Berriasian-Valanginian) in age".
    - id: mannion2026a
      notes: >
        Independently gives "the Berriasian" to "Valanginian Mengyin Formation
        of eastern China".
    - id: xu2015b
      notes: >
        Treats it as the "lowermost Cretaceous Mengyin Formation": its
        biostratigraphic age was once disputed among Late Jurassic, Late
        Jurassic–Early Cretaceous, and Early Cretaceous, but it "is currently
        regarded to be deposited during the Early Cretaceous". Its youngest
        detrital zircons (145 ± 4 Ma) and the maximum zircon age of the
        overlying Qingshan Formation volcanics (135.6 ± 3.9 Ma) constrain
        deposition to "145–136 Ma".
    - id: wilson2009a
      notes: >
        Reviews the formation's age: first considered "Early Cretaceous
        (?Neocomian)" by Wiman (1929), then given "a Late Jurassic age (early
        Tithonian)" that most authors accepted, while Barrett and Wang (2007)
        inferred "a possible Aptian age". Citing "a growing consensus that the
        Mengyin Formation is Early Cretaceous, rather than Late Jurassic", the
        paper ascribes a Barremian–Aptian range to Euhelopus zdanskyi.
    - id: wiman1929a
      notes: >
        Names the unit in a form the registry's headword cannot match -
        "Meng-Yin-Series", hyphenated and at series rank - and gives only an
        epoch, at second hand and hedged: "Following T'an, the dinosaurs come
        from three different formations: 1. The Meng-Yin-Series is from the
        Lower Cretaceous", after noting that "T'an made only a very cautious
        estimate of age determinations". This is the earliest reading the
        entry's later references review and set aside.
    - id: barrett2007b
    - id: tong2021a
      notes: >
        Once considered Late Jurassic by some authors, among them Dong (1992),
        the formation "has been recently dated using detrital zircons as 145–136
        Ma, corresponding to the Berriasian–lower Valanginian", after Xu and Li
        (2015); the turtle occurrences are tabulated as "Early Cretaceous
        (Berriasian–Valanginian)". Its Sinemys–Ordosemys turtle assemblage is
        treated as typical of the basal Cretaceous formations, and the
        Luohandong Formation of the Ordos Basin is correlated with it on
        vertebrate evidence.
    - id: dong1992a
    - id: moore2020a
      notes: >
        A stratigraphic series of non-conflicting detrital zircon ages from the
        Luxi Basin, after Xu and Li (2015), narrows the formation's
        long-uncertain age: "These data indicate that the Mengyin Formation is
        144–130.7Ma ... constraining the age of Euhelopus to the
        Berriasian–Hauterivian". Before that, the unit "has historically been
        considered Late Jurassic (early Tithonian) to Early Cretaceous in age",
        as late as the Aptian.
    - id: upchurch2015a
      notes: >
        Tabulates Euhelopus from the "Mengyin Formation (Barremian-Aptian),
        China" in its summary of putative Early Cretaceous non-titanosauriform
        macronarians and other broad-toothed sauropods, compiled "according to
        previous studies".

Mesa Redondo:
  rank: member
  parent: Chinle
  period: [Late Triassic]
  stages: [Carnian]
  references:
    - id: nesbitt2007a
      notes: >
        Equates it with another member name and gives the age, the Camposaurus
        occurrence being in the "Bluewater Creek (= Mesa Redondo) Member of the
        Chinle Formation near Fort Wingate, New Mexico, USA" at "?Late Carnian,
        Late Triassic".
    - id: langer2018a
      notes: >
        Places it with the Shinarump among the basal members of the formation,
        and records that they fall in the Carnian-Norian gap in fossil
        preservation.

Mesaverde:
  rank: group
  period: [Late Cretaceous]
  stages: [Campanian]
  references:
    - id: gates2014a
      notes: >
        Names the group by way of the Neslen Formation inside it, citing the
        record of "a tyrannosaurid dinosaur from the Mesa Verde Group (Neslen
        Formation) of Utah".
    - id: kirkland2007a
      notes: >
        Calls it "The Campanian Mesaverde Group" where it runs along the Coal
        Cliffs of the Wasatch Plateau, divided into "an upper Price River
        Formation and a lower coal-rich Black Hawk Formation separated by the
        Castlegate Sandstone".
    - id: wolfe1998a
      notes: >
        Refers to "the Upper Cretaceous Mesaverde Group of the San Juan Basin",
        with which Zuni basin strata were once thought to correlate in part.

Miaogou:
  rank: formation
  period: [Early Cretaceous]
  stages: [Barremian, Aptian, Albian]
  references:
    - id: hao2025a
      notes: >
        Gives "Miaogou Formation (Aptian-Albian" and "the Lower Cretaceous
        Miaogou Formation", noting that the Maortu deposits "are consistently
        assigned to the upper Lower Cretaceous" and "further to the
        Barremian-Albian age proposed by" Van Itterbeeck and colleagues (2001).
        It also records what the formation absorbed: fossils from the Maortu
        locality in Chilantai "were mistakenly claimed to belong to" the
        Wulanhushao (Suhongtu), Dashuigou and Ulansuhai formations, but the unit
        "actually belongs to the Miaogou Formation, which incorporated the
        formerly abandoned Dashuigou Formation and Wulanhushao Formation". Those
        are reassignments and absorptions rather than alternate names for the
        Miaogou Formation.
    - id: vanitterbeeck2001a
      notes: >
        The source of the Barremian-Albian, argued from charophytes rather than
        relayed: "Based on the charophytan evidence, the continental strata in
        the Dashuiguo area are considered to be Barremian-Albian in age." The
        unit is never named here - the paper dates the Dashuiguo area, and
        reaches this formation only through Hao and colleagues' statement that
        the Miaogou incorporated the formerly abandoned Dashuigou Formation.
        Note the two sources spell that name differently, Dashuiguo here
        against Dashuigou there. Two further constraints the relay does not
        carry. The dinosaur-bearing locality is dated separately and more
        narrowly: at "the Moartu locality, situated in the vicinity of the
        studied area", Probactrosaurus gobiensis and P. alashanicus gave "an
        Aptian-Albian age ... based on the phylogenetic position of the
        described dinosaurs". And the correlated formations "belong to the
        Khukhetian 'Age' which according to Jerzykiewicz & Russell (1991) ends
        before the Late Albian, at about 100 Ma", which caps the young end.

Middle Dinosaur:
  rank: member
  variants: [Middle Saurian Bed]
  parent: Tendaguru
  period: [Late Jurassic]
  stages: [Kimmeridgian, Tithonian]
  references:
    - id: bussert2009a
      notes: >
        Says the member "was tentatively identified as late Kimmeridgian or
        Tithonian".
    - id: rauhut2011a
      notes: >
        Carries it "to late Tithonian".
    - id: sobral2012a
      notes: >
        Gives the member, "from which Dysalotosaurus was collected", a late
        Kimmeridgian, Late Jurassic age, citing Witzmann and colleagues (2008).
    - id: witzmann2008a
      notes: >
        Names the unit the "Middle Saurian Bed" and dates it to one stage:
        material comes from "the Middle Saurian Bed of Tendaguru ...
        (Kimmeridgian, Upper Jurassic)", repeated as "the Upper Jurassic Middle
        Saurian Bed (Kimmeridgian) of site 'dy'". It supports the Kimmeridgian
        and not the Tithonian.

Milk River:
  rank: formation
  period: [Late Cretaceous]
  stages: [Santonian, Campanian]
  references:
    - id: larson2013a
      notes: >
        Gives "the uppermost Santonian Milk River Formation (Upper Cretaceous),
        Alberta", and notes it is often indistinguishable faunally from the
        time-equivalent John Henry Member of the Straight Cliffs Formation of
        Utah.
    - id: averianov2019b
      notes: >
        Independently gives "the Milk River Formation (Santonian) of Alberta".
    - id: currie1990a
      notes: >
        Places it in the lower Campanian: all the tooth types of
        Saurornitholestes, Dromaeosaurus, Troodon, Richardoestesia and
        tyrannosaurids "are found in the Lower Campanian Milk River Formation of
        southern Alberta".

Minmi:
  rank: member
  parent: Bungil
  period: [Early Cretaceous]
  stages: [Valanginian, Hauterivian, Barremian, Aptian]
  references:
    - id: molnar1980b
      notes: >
        Describes it as consisting of "medium to fine sands, silts and muds,
        with calcareous concretions", mapped near Roma in southeast Queensland,
        and dates the Minmi holotype horizon "Lower Cretaceous, probably
        Aptian".
    - id: leahey2015a
      notes: >
        Carries the older bound, "Minmi Member, Bungil Formation
        (Valanginian-Barremian)", a range that takes in the Hauterivian. Its
        text nonetheless describes the Minmi paravertebra holotype as "from the
        lower Aptian ... Minmi Member of the Bungil Formation near Roma".

Mirambell:
  rank: formation
  period: [Early Cretaceous]
  stages: [Barremian]
  references:
    - id: bertozzo2025a
      notes: >
        Gives "Portellsaurus sosbaynati (Mirambell Formation, early
        Barremian)".
    - id: lockwood2024a
      notes: >
        Carries the fuller span, "Portellsaurus sosbaynati (Mirambell
        Formation, early Barremian" to "early late Barremian)".
    - id: santos-cubedo2021a
      notes: >
        Gives "Mirambell Formation (Early Cretaceous, early Barremian)", and for
        the formation at Portell "early Barremian to early late Barremian,
        corresponding to the Atopochara trivolvis triquetra biozone".

Monmouth:
  rank: formation
  period: [Early Cretaceous]
  references:
    - id: white1973a
      notes: >
        Gives the Ornithotarsus type horizon as "Upper Cretaceous, Monmouth
        Formation" in Monmouth County, New Jersey, at Union on Raritan Bay. No
        stage is given.
    - id: prieto-márquez2006a
      notes: >
        Records the competing readings for the same material: it was named
        "from the Monmouth Formation near Keyport, New Jersey", while both
        Cope and Lull and Wright "stated that the bones were discovered in the
        shores of Raritan Bay ..., from clays belonging to the Lower
        Cretaceous", and a later worker assigned it questionably to the
        Campanian Woodbury Formation.

Moon-Airel:
  rank: formation
  period: [Late Triassic, Early Jurassic]
  stages: [Rhaetian, Hettangian]
  references:
    - id: ezcurra2007a
      notes: >
        Gives the Lophostropheus horizon as "the Moon-Airel Formation
        (uppermost Rhaetian-lowermost Hettangian; Normandy, France)".
    - id: carrano2004a
      notes: >
        Gives the locality and the same span, "Airel Quarry, Normandy, France.
        Horizon: Moon-Airel Formation; Rhaetian-Hettangian, Upper
        Triassic-Early Jurassic".

Mooreville Chalk:
  rank: formation
  period: [Late Cretaceous]
  stages: [Santonian, Campanian]
  references:
    - id: prieto-márquez2016b
      notes: >
        Dates its base by nanoplankton: "the lower 32 m of the Mooreville Chalk
        in central Alabama falls within the upper Santonian", the material
        sitting "less than 24 cm above the conformable contact with the
        underlying Tombigbee Sand Member of the Eutaw" Formation.
    - id: gates2021a
      notes: >
        Places a horizon in the "unnamed lower member of the Mooreville Chalk
        Fm., approximately 10 m above the Santonian/Campanian boundary", and
        records that the boundary "occurs 105' (32m) above the contact of the
        Tombigbee Greensand Member of the Eutaw Formation".
    - id: pittman2020a
      notes: >
        Tabulates the "Mooreville Chalk Formation" of the United States as "Late
        Cretaceous", "Campanian", on the authority of Clarke (2004).
    - id: clarke2004a
      notes: >
        Early Campanian after Parris and Echols (1992), and "approximately the
        same age as or slightly younger than the uppermost deposits represented
        in the Niobrara Formation" after Martin and Stewart (1982). The
        Ichthyornis antecessor holotype comes from the top of the unit just
        below the base of the Arcola Limestone Member, at Hewletts Farm in
        Greene County, Alabama.
    - id: parris1992a
    - id: martin1982a
      notes: >
        A relay, at a different rank, and Campanian only: "Olson (1976)
        documented Ichthyornis antecessor from the Mooreville Formation (early
        Campanian) of Alabama." It says nothing about the Santonian, which
        rests on the entry's nannoplankton reference.

Moreno:
  rank: formation
  period: [Late Cretaceous]
  stages: [Maastrichtian]
  references:
    - id: prieto-márquez2014a
      notes: >
        Gives the Augustynolophus horizon as the "upper Maastrichtian Moreno
        Formation, central California, USA".
    - id: ramírez-velasco2022a
      notes: >
        Lists it among the late Campanian to Maastrichtian hadrosaurid-bearing
        units of western North America.

Moreno Hill:
  rank: formation
  period: [Late Cretaceous]
  stages: [Turonian]
  references:
    - id: mcdonald2010a
      notes: >
        Gives "Moreno Hill Formation (middle Turonian", with the horizon as
        "Lower member of the Moreno Hill Formation, middle Turonian, Upper
        Cretaceous".
    - id: wolfe1998a
      notes: >
        Independently gives "Moreno Hill Formation (Cretaceous, Turonian".

Morrison:
  rank: formation
  period: [Late Jurassic, Early Cretaceous]
  stages: [Oxfordian, Kimmeridgian, Tithonian, Berriasian]
  references:
    - id: mannion2019a
      notes: >
        Gives the span: "the Late Jurassic (Oxfordian-Tithonian) Morrison
        Formation of the western USA".
    - id: kirkland2016a
      notes: >
        Dates the top. A recalibrated 40Ar/39Ar age of 150.00 +/- 0.52 Ma from
        near the top of the Brushy Basin Member puts "the top of the Morrison
        Formation ... to the lower third of the Tithonian Stage near but not to
        the end of the Jurassic".
    - id: chure2000a
      notes: >
        Works at "Kimmeridgian, Jurassic" throughout for the Salt Wash Member,
        the horizon of the material it describes.
    - id: darton1906a
      notes: >
        Places the formation in the Bighorn uplift on the Cretaceous side of a
        then-open question: "From stratigraphic evidence in other regions, the
        Morrison formation is provisionally classed in the early Cretaceous." Of
        its saurian remains, "Opinions are divided as to whether these are of
        late Jurassic or early Cretaceous age."
    - id: cifelli2014a
      notes: >
        Gives it as "mainly Kimmeridgian–Tithonian, though time of deposition
        for the unit as a whole may also include the late Oxfordian and early
        Berriasian", after Kowallis and colleagues (1998) and Miall and
        colleagues (2008). Across the Western Interior foreland basin it is the
        "nonmarine Upper Jurassic (to possibly lower Berriasian) strata" beneath
        the unconformity at the base of the Lower Cretaceous.

Mtuka:
  rank: member
  parent: Galula
  period: [Early Cretaceous, Late Cretaceous]
  stages: [Aptian, Albian, Cenomanian]
  references:
    - id: widlansky2018a
      notes: >
        Magnetostratigraphy leaves the member spanning both epochs: it "is
        likely Aptian–Cenomanian given its normal polarity and stratigraphic
        position below the Namba Member", about 150 m of section "dominated by
        normal polarity, consistent with deposition in the lower portion of the
        CNS". The Late Cretaceous assignment in the same study belongs to the
        overlying Namba Member, "no older than Late Cretaceous
        (Cenomanian–Campanian)"; the paleomagnetic poles, which are calculated
        for the two members together and overlap ages from 100 to 30 Ma, are the
        one place the Mtuka is drawn into a Late Cretaceous reading.
    - id: gorscak2019a
      notes: >
        Gives "newly constrained ages for the Mtuka Member (Aptian" to
        "Cenomanian)" and sets it below the younger Namba Member of the same
        formation.
    - id: bandeira2024a
      notes: >
        Narrows the occurrence, Mnyamawamtuka coming from "the Aptian Mtuka
        Member of the Galula Formation".

Mulichinco:
  rank: formation
  period: [Early Cretaceous]
  stages: [Valanginian]
  references:
    - id: coria2020a
      notes: >
        Gives the horizon of Lajasvenator as "Mulichinco Formation (upper
        Valanginian, Lower Cretaceous)", at the Pilmatué locality northeast of
        Las Lajas, Neuquén Province, where the formation's terrestrial levels
        are exposed.
    - id: coria2019a
      notes: >
        Independently gives "Mulichinco Formation (Valanginian, Lower
        Cretaceous, Neuquén Basin, Argentina)", with the horizon as "Mulichinco
        Formation, Valanginian, Lower Cretaceous".

Murtoi:
  rank: formation
  period: [Early Cretaceous]
  stages: [Berriasian, Valanginian, Hauterivian, Barremian, Aptian]
  references:
    - id: averianov2017a
      notes: >
        Describes Tengrisaurus from "the Lower Cretaceous (Barremian?) Murtoi
        Formation at Mogoito locality, near Gusinoe Lake in Buryatia, Russia".
    - id: averianov2019b
      notes: >
        Reports teeth from "the Barremian" to "Aptian Murtoi Formation of
        Buryatia, Russia".
    - id: averianov2021e
      notes: >
        Gives "Murtoi Formation, Lower Cretaceous (Barremian-Aptian)", and
        records the older dating: the formation "has traditionally been dated as
        Berriasian–Hauterivian", but "the studies based on vertebrates suggest a
        younger, late Barremian to middle Aptian age".

Mussentuchit:
  rank: member
  parent: Cedar Mountain
  period: [Early Cretaceous, Late Cretaceous]
  stages: [Albian, Cenomanian]
  references:
    - id: kirkland2007a
      notes: >
        An ash bed places the member in the earliest Late Cretaceous: "A
        radiometric age of 98.37 + 0.07 million years, obtained by the Oklahoma
        Museum of Natural History (OMNH) from volcanic ash within the
        Mussentuchit Member, indicates an early Cenomanian age (Cifelli and
        others, 1997, 1999)". The Albian that earlier work read from its
        palynomorphs is explained as predating "the lower placement of the
        Albian-Cenomanian boundary based on ammonite correlations with the type
        Cenomanian in Europe".
    - id: mori2009a
      notes: >
        Carries the wider reading, from U-Pb detrital zircon ages at three
        measured sections: "the Mussentuchit Member ranges from about 109–105 Ma
        to 99 to 96 Ma (mid-Albian to mid-Cenomanian) and perhaps as young as 91
        Ma (Turonian)", with the young zircon ages from the overlying Dakota
        Sandstone raising the possibility that "the Mussentuchit Member, if not
        the Mussentuchit fauna itself, may range to late Cenomanian or early
        Turonian". The same thesis reports the sanidine dating of others as
        "early Cenomanian", so the Albian extension rests on the zircon ages
        alone.
    - id: kirkland2016a
      notes: >
        Radiometric ages confine the member to the earliest Late Cretaceous:
        dates of 96.7 to 98.2 Ma indicate that "the Mussentuchit Member was
        deposited over an interval of 1.5 Ma during the early Cenomanian", and
        the faunal turnover it preserves falls "at the base of the Cenomanian of
        Utah at about 100 to 98 Ma". The Albian read from its palynomorphs
        predates "the lower placement of the Albian-Cenomanian boundary based on
        ammonite correlations with the type Cenomanian in Europe", so it is the
        same rocks under an older boundary rather than an older age. The wider
        mid-Albian to Turonian bracket of Mori (2009) is set aside here, its
        detrital zircon ages carrying "stratigraphic misinterpretations relative
        to the stratigraphic framework presented herein and limited sample
        sizes".
    - id: zanno2013a
      notes: >
        Gives "Mussentuchit Member ... Upper Cretaceous (Cenomanian".
    - id: mcdonald2017a
      notes: >
        Places it in its parent, "the Mussentuchit Member of the Cedar Mountain
        Formation of Utah".

Naashoibito:
  rank: member
  parent: Ojo Alamo
  period: [Late Cretaceous]
  stages: [Maastrichtian]
  dispute:
    summary: >
      Which formation contains it is contested. Sullivan and colleagues (2011)
      put it in the Ojo Alamo -- "Ojo Alamo Formation (Naashoibito Member),
      Alamo Wash local fauna (early Maastrichtian". Longrich and colleagues
      (2024) instead write "Naashoibito Member of the Kirtland Formation in
      New Mexico". The disagreement is about placement rather than about which
      units exist: both candidate parents are units in their own right.
  references:
    - id: sullivan2011a
      notes: >
        Places it in the Ojo Alamo and dates the Alamo Wash local fauna early
        Maastrichtian.
    - id: longrich2024b
      notes: >
        Places the same member in the Kirtland Formation instead.
    - id: fowler2011a
      notes: >
        Gives its giant Alamosaurus specimens as all from "the Naashoibito
        Member (Lower Maastrichtian, Upper Cretaceous) of the Ojo Alamo
        Formation (San Juan Basin, New Mexico)", the type stratum of Alamosaurus
        sanjuanensis.

Nam Phong:
  rank: formation
  period: [Late Triassic, Early Jurassic, Middle Jurassic, Late Jurassic]
  stages: [Norian, Rhaetian, Hettangian, Sinemurian, Pliensbachian]
  references:
    - id: buffetaut2000a
      notes: >
        Bounds the age rather than dating it directly: "The fluviatile Nam
        Phong Formation contains palynomorphs showing that it cannot be younger
        than Rhaetian", and it overlies the Huai Hin Lat Formation.
    - id: bandyopadhyay2010a
      notes: >
        Tabulates the Isanosaurus horizon as "Nam Phong Formation" of
        northeastern Thailand at "Late Triassic" and "(Norian-Rhaetian)".
    - id: rincón2022a
      notes: >
        Notes that the formation "was initially interpreted to be Late Triassic
        in age, but recent revisions have suggested an Early Jurassic age",
        following Laojumpon and colleagues (2017).
    - id: wang2025a
      notes: >
        Reports that Isanosaurus was described as a Late Triassic dinosaur, but
        that "the Nam Phong Formation was dated as Late Jurassic afterwards".
    - id: laojumpon2017a
      notes: >
        Splits the formation in two on seismic analysis: "The Lower Nam Phong
        Formation which was formed in Upper Triassic period" and "the Upper Nam
        Phong Formation, which is neither older than Pliensbachian nor younger
        than Late Jurassic period". Palynology makes the formation "not older
        than Pliensbachian (Late Early Jurassic period)", after Racey (2009),
        and its sauropods, judged "more similar to the Early Jurassic than
        Triassic dinosaurs", are placed in the upper part.
    - id: racey1996a
      notes: >
        "The Nam Phong Formation is dated accurately for the first time as late
        Norian to Rhaetian" on palynology: common Ovalipollis ovalis and
        undifferentiated striate bisaccate pollen indicate "an age no younger
        than Rhaetian and no older than Ladinian", and with the lack of Rhaetian
        markers suggesting a Norian age for the underlying Huai Hin Lat
        Formation, "the Nam Phong Formation must be late Norian or Rhaetian in
        age". Petrographically "the Triassic Nam Phong Formation" has more in
        common with the Huai Hin Lat below than with the Khorat Group above,
        from which a probable hiatus of unknown duration, possibly spanning the
        entire Jurassic, separates it.

Namba:
  rank: member
  parent: Galula
  period: [Late Cretaceous]
  stages: [Cenomanian, Turonian, Coniacian, Santonian, Campanian]
  dispute:
    summary: >
      Campanian or considerably older. Gorscak and colleagues (2019) give "newly
      constrained ages for the Mtuka Member (Aptian-Cenomanian) and Namba Member
      (Campanian)"; the same group in 2022 writes that "although the Namba
      Member may potentially date to the Campanian, the possibility remains that
      this unit is somewhat older, perhaps Cenomanian-Santonian in age based on
      an alternative interpretation" of the paleontological data.
  references:
    - id: gorscak2019a
      notes: >
        Gives the Campanian reading, alongside the Mtuka Member's
        Aptian-Cenomanian: new paleomagnetic data date "the overlying Namba
        Member as either Campanian or Cenomanian–Santonian", and its analyses
        adopt "the preferred hypothesis of late Campanian" of Widlansky and
        colleagues (2018).
    - id: gorscak2022a
      notes: >
        Calls it the "Upper Cretaceous Namba Member of the Galula Formation",
        which "may potentially date to the Campanian", and raises the older
        alternative, "perhaps Cenomanian-Santonian in age", a range through the
        Turonian and Coniacian. That reading rests on "an alternative
        interpretation of the paleomagnetic data derived from this unit".
    - id: widlansky2018a
      notes: >
        The first direct age determination for this member, by
        magnetostratigraphy rather than vertebrate biostratigraphy, and the
        source of all five stages as its own stated bracket: "We propose two
        potential correlations for relating these reversals to the GPTS, with
        the first one favored here: (1) These reversals may be equivalent to
        Chron C32 (Campanian), or (2) the reversals may represent short
        excursions during the upper part of the CNS (C34n). Together these
        interpretations constrain the age of the Namba Member to Cenomanian -
        Campanian, a significant refinement over previous constraints." The
        preferred correlation is the Campanian one, which is the reading later
        papers give. Its youngest independent constraint is doubly hedged and
        should not be cited as a determination: a single grain of about 118 Ma
        from the upper part of the member, "(E. M. Roberts, unpublished data)",
        suggesting deposition after the middle Early Cretaceous "if supported
        by subsequent observations".

Nanxiong:
  rank: formation
  period: [Late Cretaceous]
  stages: [Campanian, Maastrichtian]
  references:
    - id: zheng2024a
      notes: >
        Gives "Nanxiong Formation (Maastrichtian", and for the type locality at
        Shahe Town, Ganzhou, "Nanxiong Formation (Upper Cretaceous,
        Maastrichtian)".
    - id: foster2021a
      notes: >
        Independently gives the same.
    - id: dong1979a
      notes: >
        Dates it by faunal correlation: the Nanxiong fauna "is correlative with
        those from the Mongolian Nemegt Fm. and the Subashen Fm.", and so "The
        Nanxiong Fm. is thus correlated to the Senonian or Campanian".

Nanyuan:
  rank: formation
  period: [Late Jurassic]
  stages: [Tithonian]
  references:
    - id: xu2023a
      notes: >
        Gives the horizon with a radiometric age: "Near Yangyuan Village,
        Zhenghe Country, Nanping City, Fujian Province; Upper Jurassic, Nanyuan
        Formation (Tithonian stage; 149.9-150.2 Ma)", the Fujianvenator-bearing
        beds being "black carbonaceous mudstone and shale, interstratified with
        tuffite".
    - id: wang2026a
      notes: >
        Independently gives the same locality and horizon for a second paravian.

Navajo Sandstone:
  rank: formation
  period: [Early Jurassic]
  stages: [Sinemurian, Pliensbachian, Toarcian]
  references:
    - id: nesbitt2007a
      notes: >
        Gives its relation to the unit below and a hedged age: "interfingering
        with and directly overlying the Kayenta Formation, the Navajo Sandstone
        (?Pliensbachian) contains a single small coelophysoid, Segisaurus
        halli". Notes that the scarcity of vertebrates in it "leaves a crucial
        gap in the theropod record".
    - id: kirkland1993a
      notes: >
        Sets the Navajo in the wider western succession alongside the other
        Lower Cretaceous and Jurassic units of the region.
    - id: sertich2010a
      notes: >
        Describes Seitaad ruessi from the base of the "Lower Jurassic Navajo
        Sandstone", which it gives as "the uppermost unit of the Glen Canyon
        Group with an age no earlier than Pliensbachian".
    - id: olsen1984a
      notes: >
        Early Jurassic, by way of a figured footprint: Navahopus falcipollex,
        traced from Baird (1980) and there suggested to have been produced by a
        prosauropod dinosaur, comes from "the Navajo Sandstone (E. Jurassic) of
        the Glen Canyon Group, Arizona".
    - id: baird1980a
      notes: >
        "This evidence suggests a Sinemurian to Pliensbachian age for the Navajo
        Sandstone", the evidence being a Corollina-dominated microflora from the
        Whitmore Point Member of the Moenave correlated with the lower Liassic;
        Olsen and Galton (1977) show the Glen Canyon Group beginning in the
        Hettangian and continuing through the Sinemurian until well along in the
        Pliensbachian, and Galton's (1971) correlation of the Navajo with the
        now lower Liassic Portland Formation stands. The Navahopus falcipollex
        type trackway comes from "Cross-stratified dune sand of the upper Navajo
        Sandstone, Glen Canyon Group, Lower Jurassic (Sinemurian-Pliensbachian)"
        on the Kaibito Plateau.
    - id: tykoski2004a
      notes: >
        Segisaurus halli, "the geologically youngest known, unequivocal
        coelophysoid", is based on a small incomplete skeleton "from the Navajo
        Sandstone (Pliensbachian-Toarcian) of northeastern Arizona".

Nemegt:
  rank: formation
  period: [Late Cretaceous]
  stages: [Campanian, Maastrichtian]
  references:
    - id: khand2000a
      notes: >
        In the eastern Gobi the formation rests on the Javkhlant and "appears to
        be of the Maastrichtian age"; at Bugiin Tsav the plant-bearing beds are
        given as "the Nemegt Formation (Campanian-Maastrichtian)". The beds
        Shuvalov (1974) had called the Nemegt Formation and Khand (1987) the
        Upper Nemegt Formation are separated here as the Nogoontsav Formation,
        20 m thick and conformably above the Nemegt. The authors add that "The
        uppermost Maastrichtian strata have not been documented in Mongolia."
    - id: osmólska1987a
      notes: >
        "Nemegt Formation, zone of Tarbosaurus bataar and Saurolophus
        angustirostris, ?Late Campanian or ?Early Maastrichtian" -- hedged on
        both sides.
    - id: evans2018a
      notes: >
        The Guriliin Tsav beds "have been assigned a Maastrichtian" age.
    - id: wilson2005a
      notes: >
        Gives the Nemegtosaurus mongoliensis occurrence as "Nemegt Formation,
        Upper Cretaceous (mid-Maastrichtian", following Jerzykiewicz and Russell
        (1991).
    - id: jerzykiewicz1991a
    - id: karczewska1983a
      notes: >
        Charophytes make the "Nemegt Formation (Upper Cretaceous)" older than
        had been supposed: the assemblage "cannot be considered younger than the
        Lower Campanian", standing between two Upper Cretaceous assemblages of
        the Chinese Red Beds and keeping taxa known from the Lower/Upper
        Cretaceous transition. That reading disagrees with Fox (1978), for whom
        the unit is "of the uppermost Campanian to Maastrichtian age", and with
        the "?Upper Campanian and/or ?Lower Maastrichtian" of Gradziński,
        Kielan-Jaworowska and Maryańska (1977).
    - id: fox1978a
    - id: gradziński1977a

Neslen:
  rank: formation
  parent: Mesaverde
  period: [Late Cretaceous]
  stages: [Campanian]
  references:
    - id: gates2014a
      notes: >
        Describes Rhinorex from "the Upper Cretaceous Neslen Formation of
        central Utah", and cites the tyrannosaurid record from the unit for
        "upper Campanian Laramidian biogeography".
    - id: loewen2013a
      notes: >
        Cites the same work for the formation, placing it in the Mesaverde
        Group of Utah at upper Campanian.
    - id: prieto-márquez2019b
      notes: >
        Places Rhinorex condrupus in "the Neslen Formation of eastern Utah, in
        late Campanian strata dated to 75-74.5 Ma", citing Gates and Scheetz
        (2014).

Neuquén:
  rank: group
  period: [Late Cretaceous]
  stages: [Cenomanian, Turonian, Coniacian, Santonian, Campanian]
  references:
    - id: leanza2004a
      notes: >
        The group "was laid down during nearly 20 myr from the Cenomanian
        through to the Early Campanian", above the Main Miranican unconformity
        and below the Huantraiquican one that separates it from the Malargüe
        Group. A section devoted to it repeats the span as "between the
        Cenomanian and Early Campanian, and thus represents a total duration of
        nearly 24.9 myr", credits Stipanicic and colleagues (1968) with first
        using the name for these strata, and divides it into the Río Limay, Río
        Neuquén and Río Colorado subgroups after Cazau and Uliana (1973). No
        radioisotopic dating was then available for the group, the ages coming
        instead from the unconformity-bounded intervals of the basin's
        tectonosedimentary evolution.
    - id: bonaparte1979c
      notes: >
        Reviews the sauropods of the Neuquén and Chubut Groups and their
        chronological relations, dating the Neuquén Group in the vocabulary of
        its day as "Pre-Maastrichtian Senonian" after Cazau and Uliana (1973)
        and Bertels (1969), and repeating that age for every specimen horizon
        within it. Argues that the sauropods of the Río Colorado and Río Neuquén
        Formations and those of the Laguna Palacios, Bajo Barreal and Castillo
        Formations of the Chubut Group are contemporaneous.
    - id: hugo2001a
      notes: >
        On the General Roca sheet the group is the oldest sedimentary cycle
        mapped, "accumulated in the Upper Cretaceous, more precisely between the
        Cenomanian and the lower Campanian": its base is the intercretaceous
        unconformity of the Main Miranic phase, placed in the Lower Cenomanian
        at 97 +/- 3 Ma, and its top the Huantraiquic unconformity at 74 +/- 3
        Ma, about 23 million years of deposition. Its three subgroups are
        assigned in turn to the Cenomanian to lower Turonian, the upper Turonian
        to Coniacian, and the Santonian to lower Campanian.
    - id: garrido2010a
      notes: >
        The group is a succession of non-marine fluvial, aeolian and shallow
        lacustrine deposits laid down "between the Lower Cenomanian and the
        Middle Campanian (Upper Cretaceous)", reaching a maximum thickness of
        about 1,200 m and bounded below by the Patagonidic unconformity and
        above by the Huantraiquic one, "placed at the base of the Cenomanian ...
        and in the Middle Campanian" respectively. This lithostratigraphic
        restatement reorganizes it into three subgroups and nine formations,
        erecting the Los Bastos and Sierra Barrosa Formations. The Albian is
        given to the underlying Lohan Cura Formation, below the group's basal
        unconformity.
    - id: gonzálezriga2013a
      notes: >
        Names the group and places two sauropod-bearing units within it, the
        Los Bastos Formation in its middle levels and the Sierra Barrosa
        Formation in its upper levels, in Mendoza Province.

New Egypt:
  rank: formation
  period: [Late Cretaceous]
  stages: [Maastrichtian]
  references:
    - id: brett-surman1989a
      notes: >
        Tabulates "New Egypt Fm, Maastrichtian" among the North American
        hadrosaur-bearing units.
    - id: larson2010a
      notes: >
        Pairs it with the Hornerstown Formation of New Jersey and uses the
        shared fish fauna to argue a connection with the Horseshoe Canyon.
    - id: prieto-márquez2006a
      notes: >
        Gives the Hadrosaurus minor holotype horizon at Barnsboro, Gloucester
        County, New Jersey, as "New Egypt (Navesink) Formation, Upper Cretaceous
        (Maastrichtian)", using the New Egypt and Navesink names
        interchangeably.

Niobrara Chalk:
  rank: formation
  period: [Late Cretaceous]
  stages: [Turonian, Coniacian, Santonian, Campanian]
  references:
    - id: carpenter2007b
      notes: >
        Gives the Coniacian for the Smoky Hill Chalk within it.
    - id: weishampel2004a
      notes: >
        A reference work, tabulating the "Niobrara Chalk Formation (Kansas),
        Niobrara Chalk Formation (Nebraska)" as "Coniacian-early Campanian".
        Prints the lithic term and the rank word together, which the
        stratigraphic codes treat as alternatives rather than as a pair.
    - id: huene1929a
      notes: >
        Gives the archaic reading, "Niobrara Formation (more or less Turonian",
        which nothing later supports.
    - id: carpenter1995a
      notes: >
        Calls its dinosaur fauna "the best known assemblage from the middle
        Santonian–early Campanian interval of the Late Cretaceous of North
        America", and dates these animals by the Smoky Hill Chalk Member, which,
        following Stewart (1990), "is Coniacian to Santonian in age" near
        Hackberry Creek and lies "near the Santonian–Campanian boundary" in
        Logan County.
    - id: sues2009a
      notes: >
        Gives the Niobrara Chalk Formation that yielded Claosaurus as "Late
        Coniacian to Early Santonian in age", following Carpenter and colleagues
        (1995).
    - id: stewart1990a
    - id: clarke2004a
      notes: >
        Calls the Ichthyornis horizon "the Late Cretaceous Niobrara Chalk of
        Kansas" and, following Stewart and colleagues (1990), gives "The entire
        Smoky Hill Chalk Member of the Niobrara Formation is upper
        Coniacian–lower Campanian in age". Most of the Yale Ichthyornis material
        "would appear to be from the late Santonian–early Campanian".

Nyker:
  rank: group
  period: [Late Jurassic, Early Cretaceous]
  stages: [Tithonian, Berriasian, Valanginian]
  references:
    - id: lindgren2008a
      notes: >
        The group's terrestrial to marginal marine strata are "principally Lower
        Cretaceous" and crop out in the Holsterhus, Nyker, Knudsker, Salene,
        Bøsthøj and Arnager-Sose fault blocks of southwestern Bornholm, blocks
        formed by repeated down-faulting and tilting along the Fennoscandian
        Border Zone during the Triassic and Jurassic. The succession "spans the
        Berriasian–Valanginian interval, although its lowermost parts may be of
        Tithonian age", after Christensen (1974). Its lowest formation, the
        Rabekke, divides into the Homanshald and Skyttegård Members, the former
        resting disconformably on the Lower Jurassic Hasle Formation.
    - id: christiansen2003a
      notes: >
        Gives the span and the contents: the group "spans from (Tithonian?)
        Berriasian to Valanginian in age, and has previously yielded vertebrate
        remains from particularly its youngest Formation, the Jydegaard
        Formation", on Bornholm.

Obernkirchen:
  rank: member
  parent: Bückeberg
  period: [Early Cretaceous]
  stages: [Berriasian]
  references:
    - id: hornung2012a
      notes: >
        Places the Osterwald tracksites "in the more proximal, fluvial and
        alluvial deposits of the Obernkirchen Member", within the Berriasian
        Bückeberg Formation.

Obernkirchen Sandstein:
  rank: bed
  parent: Obernkirchen
  period: [Early Cretaceous]
  stages: [Berriasian]
  variants: [Obernkirchen Sandstone, Oberer Hauptsandstein]
  references:
    - id: hornung2012a
      notes: >
        The dedicated account of the unit and its tracksites: "13 dinosaur
        tracksites have been identified in the Obernkirchen Sandstone
        (Obernkirchen Member, Bückeberg Formation, Late Berriasian)". The unit
        "forms a thin interval within the Obernkirchen Member, the lower member
        of the Bückeberg Formation", and the paper treats the Oberer
        Hauptsandstein as the same rock: "The OHS is equivalent to the
        Obernkirchen Sandstone sensu stricto and the latter term is used herein
        exclusively as a synonym of the OHS."
    - id: butler2008b
      notes: >
        Gives the Stenopelix horizon, a partially articulated postcranial
        skeleton "preserved as impressions in sandstone blocks, from the
        Obernkirchen Sandstein of Germany (Early Cretaceous: Berriasian)".

Ohyamashimo:
  rank: formation
  period: [Early Cretaceous]
  stages: [Albian]
  references:
    - id: kubota2024a
      notes: >
        From zircon U–Pb ages at the base of the formation and in the overlying
        Sawada Formation, "the middle part of the Ohyamashimo Formation is
        assigned to be the early to middle Albian in age", the level where the
        Hypnovenator horizon likely lies. Hypnovenator "stands as the only Early
        Cretaceous troodontine troodontid".
    - id: tanaka2024a
      notes: >
        Independently gives the "Lower Cretaceous Albian Ohyamashimo Formation",
        and places the Miyada site in "the lower part of the Ohyamashimo
        Formation (early Albian; c. 112 Ma)".

Ojo Alamo:
  rank: formation
  period: [Late Cretaceous]
  stages: [Maastrichtian]
  references:
    - id: sullivan2011a
      notes: >
        Gives the formation with its member and fauna, "Ojo Alamo Formation
        (Naashoibito Member), Alamo Wash local fauna (early Maastrichtian".
    - id: paul2025a
      notes: >
        Contrasts its material with "the much later partial skeletons from the
        late Maastrichtian", placing the formation earlier within that stage.
    - id: gilmore1946b
      notes: >
        Gives the Alamosaurus type material as "from the Ojo Alamo formation,
        Upper Cretaceous, in New Mexico".

Oldman:
  rank: formation
  parent: Belly River
  period: [Late Cretaceous]
  stages: [Campanian]
  variants: [Pale Beds]
  references:
    - id: eberth2005a
      notes: >
        The middle of the three, 40 m thick at the Park, "made up of
        light-colored alluvial sandstones and mudstones that were first referred
        to as the 'Pale Beds' by Dowling (1916, 1917)". It "conformably overlies
        the Herronton Sandstone Zone at the top of the Foremost but is truncated
        at the top by a regional disconformity", and it "records the maximum
        regression of the Western Interior Seaway during the Campanian".

On Gong:
  rank: formation
  period: [Early Cretaceous]
  stages: [Aptian, Albian]
  references:
    - id: mannion2011b
      notes: >
        The Mongolosaurus haplodon holotype came from "the Hu Khung Ulan
        locality in Inner Mongolia ... from the Lower Cretaceous On Gong
        Formation", collected by Walter Granger in 1928 on the Central Asiatic
        Expeditions, and the horizon is given as "Aptian-Albian (?), Early
        Cretaceous". That stage assignment is reached through correlation rather
        than from the unit itself: following Dong (1993) the formation "has been
        suggested to be approximately equivalent to the Ondai Sair Formation
        (included within the Hühteeg Svita Formation) of Mongolia", which
        Shuvalov (1974) and Weishampel and colleagues (2004) date as
        Aptian-Albian. Quoting Gilmore (1933), Mongolosaurus "is the only
        dinosaur so far found in the On Gong Formation".
    - id: averianov2025b
      notes: >
        Gives the Mongolosaurus material as from "the Aptian-Albian On Gong
        Formation of Inner Mongolia, China".
    - id: han2024a
      notes: >
        Tabulates the same occurrence at Hu Khung Ulan, Inner Mongolia, as Early
        Cretaceous, with the age hedged as Aptian and possibly Albian.

Ornatenton:
  rank: formation
  period: [Middle Jurassic]
  stages: [Callovian]
  references:
    - id: rauhut2016a
      notes: >
        Describes Wiehenvenator from "the marine middle Callovian Ornatenton
        Formation of north-eastern Northrhine-Westphalia, Germany".
    - id: rauhut2024a
      notes: >
        Cites the same unit for the oldest record of Torvosaurus, "from the
        Callovian Ornatenton Formation of north-western Germany".

Osoushinai:
  rank: formation
  period: [Late Cretaceous]
  stages: [Campanian]
  references:
    - id: kobayashi2022a
      notes: >
        Gives the Paralitherizinosaurus horizon as "the lower Campanian
        Osoushinai Formation in Nakagawa Town of Hokkaido Prefecture", and its
        title places the formation in the Upper Cretaceous. One passage,
        recounting Murakami and colleagues' (2008) description, instead calls it
        "the upper Campanian Osoushinai Formation".

Oum ed Diab:
  rank: member
  parent: Aïn el Guettar
  period: [Early Cretaceous]
  stages: [Albian]
  references:
    - id: fanti2013a
      notes: >
        Gives the Tataouinea horizon and the setting: the member "represents
        sandy shoreface ... and tidal flat/foreshore deposits", its beds "dated
        as early Albian based on lateral correlation with marine units and
        associate vertebrate fauna".
    - id: fanti2015a
      notes: >
        Places it second of the formation's three members, between the Chenini
        below and the Rhadouane above, and fixes the Tataouinea level at about
        1.5 m above "the fossil-rich conglomerate that marks the erosive
        contact between the Chenini and the overlying Oum ed Diab members".

Oxford Clay:
  rank: formation
  parent: Ancholme
  period: [Middle Jurassic, Late Jurassic]
  stages: [Callovian, Oxfordian]
  references:
    - id: naish2007a
      notes: >
        Dates it by way of a member inside it, "Oxfordian Oxford Clay dinosaurs
        include Metriacanthosaurus parkeri from the Weymouth Member".
    - id: barron2012a
      notes: >
        Places it second in the Ancholme Group, above the Kellaways and below
        the West Walton Formation, and dates it "Mid to Late Jurassic, Early
        Callovian to Early Oxfordian, Calloviense Zone to Cordatum Zone". In the
        Cleveland Basin it "is represented here only by the uppermost part
        (Weymouth Member), which is entirely Upper Jurassic (Oxfordian)".
    - id: ősi2012a
      notes: >
        Gives "Oxford Clay Formation; Callovian".
    - id: norman2007a
      notes: >
        Narrows it to the "Oxford Clay (middle Callovian) of England", setting
        it beside the "Marnes à Belemnopsis latesulcata Formation (early
        Callovian".
    - id: cox1992a
      notes: >
        "The Oxford Clay is a marine argillaceous deposit of Callovian-Oxfordian
        age. It is developed throughout southern, central and eastern England,
        and ranges up to about 185 m in thickness." It is classified here as a
        Formation, its three traditional subdivisions given member status and
        renamed the Peterborough, Stewartby and Weymouth members for the Lower,
        Middle and Upper Oxford Clay.

Packard Shale:
  rank: formation
  parent: Cabullona
  period: [Late Cretaceous]
  stages: [Campanian]
  references:
    - id: serrano-brañas2016a
      notes: >
        Gives the Tototlmimus horizon as "Packard Shale Formation, Cabullona
        Group; Upper Cretaceous (Campanian)", the type locality lying "1 km
        east-southeast of rancho Corral de Enmedio".

Painten:
  rank: formation
  period: [Late Jurassic]
  stages: [Kimmeridgian, Tithonian]
  references:
    - id: reisdorf2012a
      notes: >
        Names two of its members and the ages they carry: the "Schamhaupten
        Member ..., which is classified as part of the Painten Formation", is
        given a "Late Kimmeridgian age (Beckeri Zone, Ulmense Subzone)", while
        material from Jachenhausen "can be considered to be from the Painten
        Formation (Zandt Member ...), and thus of an assumed Early Tithonian
        age".
    - id: foth2025a
      notes: >
        Places the Schamhaupten specimen "from the Kimmeridgian/Tithonian
        boundary in the lowermost part of the Painten Formation", and
        distinguishes it laterally from the Altmühltal: the "Solnhofen
        limestone" sensu stricto "is part of the Altmühltal Formation ...
        whereas the contemporaneous plattenkalks more to the east belong to the
        Painten Formation".

Paja:
  rank: formation
  period: [Early Cretaceous]
  stages: [Barremian, Aptian]
  references:
    - id: carballido2015a
      notes: >
        Gives the Padillasaurus horizon as "marine sediments of the Paja
        Formation (Barremian), close to the locality of Villa de Leiva",
        Colombia.
    - id: bellardini2022a
      notes: >
        Reports the same postcranial elements as "found in the Barremian-Aptian
        outcrops of the Colombian Paja Formation".

Paluxy:
  rank: formation
  parent: Trinity
  period: [Early Cretaceous]
  stages: [Aptian, Albian]
  references:
    - id: d'emic2013a
      notes: >
        Gives the Astrophocaudia horizon as "the Trinity Group, uppermost part
        of the middle unit of the Paluxy Formation", "which is lower Albian
        (112.2-106 Ma) in age", while dating the formation as a whole, for the
        Cedarosaurus hind limb, "Paluxy Formation, Aptian-Albian".
    - id: britt2017a
      notes: >
        Independently gives "the lower Albian Paluxy Formation of the Trinity
        Group of Texas".
    - id: martínez2004a
      notes: >
        Gives the source of the titanosauriform SMU 61732 as the "Early
        Cretaceous Paluxy Formation of Texas".
    - id: musacchio1975a
      notes: >
        "The Paluxy Formation (Trinity Group) is referred by some authors to the
        Albian (Stephenson et al., 1942, and Scott, G., 1940)", a remark made in
        passing while comparing Argentine ostracod and charophyte associations
        with North American ones. Flabellochara harrisi in the Paluxy limestone
        "would extend the range of the species to the Albian".

Papo Seco:
  rank: formation
  period: [Early Cretaceous]
  stages: [Barremian]
  references:
    - id: mateus2011b
      notes: >
        Places Baryonyx material in "the Barremian (Papo Seco Formation) of
        Portugal", at Praia das Aguncheiras, Cabo Espichel, "in layers 36-38 of
        Choffat".
    - id: bertozzo2025a
      notes: >
        Gives "the Papo Seco Formation (lower Barremian)" at Praia do Areia do
        Mastro, Cabo Espichel, and calls it "the Early Cretaceous Papo Seco
        Formation of the Lusitanian Basin".

Parecis:
  rank: group
  period: [Late Cretaceous]
  stages: [Campanian, Maastrichtian]
  references:
    - id: delcourt2017a
      notes: >
        Records a reassignment out of a neighboring group: the Fazenda Roncador
        locality had been placed in the Bauru Group, but "recent work has shown
        that this locality is actually part of the Parecis Group and that it is
        of Campanian-Maastrichtian age".
    - id: weska2006a
      notes: >
        "The rocks of the Parecis and Bauru groups in Mato Grosso were deposited
        during the Upper Cretaceous", in erosive unconformity over the older
        Parecis and Paraná basins. Suggests one stratigraphic column for both
        basins, with the Bauru Group suppressed in Mato Grosso, so that "the
        Parecis Group can be characterized by the Paredão Grande, Salto das
        Nuvens, Cachoeira do Bom Jardim, and Utiariti formations".

Patuxent:
  rank: formation
  period: [Early Cretaceous]
  stages: [Aptian]
  references:
    - id: d'emic2012a
      notes: >
        Large-bodied theropod material from the Arundel clay of the Patuxent
        Formation is cut back to indeterminate here: USNM 3049, the incomplete
        caudal centrum Harris (1998b) read as a theropod distinct from
        Acrocanthosaurus, "does not possess any features unique to theropods, so
        it could pertain to an ornithischian or a sauropod rather than a
        theropod", and isolated teeth such as USNM 3121 are "similar to
        Acrocanthosaurus in proportions, denticulation, and the presence of weak
        banding" without being referable to it. D'Emic and colleagues treat the
        Maryland unit as one of three Lower Cretaceous North American sources of
        such fragments, alongside the Cedar Mountain and Cloverly formations,
        and name no stage for it.
    - id: oreska2013a
      notes: >
        Ten formally described genera are counted for the Patuxent, against 28
        for the Antlers and at least 46 for the Mussentuchit Member of the Cedar
        Mountain Formation, and the Patuxent fauna is the least similar of the
        four Lower Cretaceous assemblages Oreska and colleagues compare by
        Sørensen index: under their broader definition of taxonomic similarity,
        0.353 against the Cloverly, 0.373 against the Antlers and 0.253 against
        the Mussentuchit. They read that partly as real geographic or temporal
        separation and partly as sampling, since "In addition to being poorly
        sampled for vertebrates, the Patuxent Formation yields multiple taxa not
        identified below the family level, which were therefore omitted from the
        analysis." The formation enters the comparison through its Arundel Clay
        facies and carries no stage anywhere in the paper.
    - id: stanford2011a
      notes: >
        Palynologic assemblages make the Patuxent Formation "the oldest
        stratigraphic unit exposed in the Atlantic Coastal Plain of Maryland",
        of "an Aptian age, evidently in the younger end of this interval", while
        the occurrence given for Propanoplosaurus marylandicus reads "Patuxent
        Formation, Potomac Group (early Aptian in age)". The formation crops out
        in a narrow belt running south-southwest from the Delaware-Maryland
        border to Fredericksburg, Virginia, and its lithology varies markedly
        along that belt, dominated by medium to coarse sands, sandstones and
        pebble conglomerates interbedded with siderite-cemented sandstones, gray
        and red siltstones, lignite-bearing light gray clays and red clays laid
        down in distal deltaic fans and sluggish river floodplains. Stanford and
        colleagues place the Arundel Clay, source of every earlier Early
        Cretaceous dinosaur find in the region, as lenses at various
        stratigraphic levels within the Potomac Group rather than at one
        horizon.
    - id: arbour2015a
      notes: >
        Gives the Propanoplosaurus horizon as "the early Aptian Patuxent
        Formation of Maryland".
    - id: carrano2012a
      notes: >
        Gives the same unit with its facies, "the Early Cretaceous Patuxent
        Formation (Arundel Clay facies, Aptian) of Maryland".

Paw Paw:
  rank: formation
  period: [Early Cretaceous]
  stages: [Albian]
  references:
    - id: lee1996a
      notes: >
        Gives "the Paw Paw Formation (late Albian), Tarrant County, Texas" as
        the Pawpawsaurus campbelli type horizon.
    - id: carpenter1998c
      notes: >
        Repeats the age and prints coordinates for two type localities in the
        formation, "~32°52'N, ~97°18'W" and "~97°20'W, 32°56'N", Tarrant County.
    - id: coombs1995a
      notes: >
        Gives the Texasetes pleurohalio horizon as "Paw Paw Formation (sandy
        member of Dennison Formation); Comanche Series, upper Albian, Lower
        Cretaceous", within the town limits of Blue Mound, north of Fort Worth.

Pebbly Arkose:
  rank: formation
  period: [Late Triassic]
  stages: [Carnian, Norian]
  references:
    - id: barrett2024a
      notes: >
        Gives "the Pebbly Arkose Formation (Norian, Upper Triassic) of the
        Upper Karoo Group of Zimbabwe".
    - id: griffin2022a
      notes: >
        Places Mbiresaurus raathi in "the midsection of the ?late Carnian Pebbly
        Arkose Formation, Dande Communal Land, Mbire District", and calls that
        locality "the oldest definitive dinosaurian locality in Africa".

Pen:
  rank: formation
  period: [Late Cretaceous]
  stages: [Santonian, Campanian]
  references:
    - id: lehman2024a
      notes: >
        Treats it as intertonguing with the Aguja Formation across the Big Bend
        region of west Texas, the two together recording four major
        depositional intervals, and cites work on the "Campanian Aguja and Pen
        Formations, south Texas".
    - id: rivera-sylva2018a
      notes: >
        Names Acantholipan gonzalezi on CPC 272 and gives its horizon as "the
        Pen Formation (Upper Cretaceous, Santonian)", at the Los Primos locality
        south of San Miguel, Coahuila.
    - id: rivera-sylva2011a
      notes: >
        Gives the horizon of nodosaurid specimen B (CPC 272) as "the shale of
        the marine member of the Pen Formation (Campanian), south of San Miguel,
        Coahuila, Mexico".

Penarth:
  rank: group
  period: [Late Triassic]
  stages: [Rhaetian]
  references:
    - id: evans2025a
      notes: >
        Gives the group and its Rhaetian age with the Lilstock Formation inside
        it.
    - id: martill2016a
      notes: >
        Gives the cliff on the east side of Lavernock Point as exposing "the top
        of the Late Triassic Penarth Group", and uses the same containment for
        the Langport Member of the Lilstock Formation there.

Peruc-Korycany:
  rank: formation
  period: [Late Cretaceous]
  stages: [Cenomanian]
  references:
    - id: fejfar2005a
      notes: >
        Explains why the combined name exists. The Peruc and Korycany Beds are
        "of the local stratigraphic column", the boundary between them "is
        irregular, with paralic development of several marine incursions into
        terrestrial areas", and "Some marine deposits of the Korycany Beds and
        continental sediments of the Peruc Beds are considered to be
        isochronous" -- a facies relationship rather than superposition.
        "Therefore, we use the term Peruc-Korycany Formation to characterize
        the mixed lithologies deposited in this area". Places the dinosaur
        remains in "the near-shore marine sediments of the Peruc-Korycany
        Formation", at formation rank and no finer.
    - id: madzia2017a
      notes: >
        Refines the horizon to "the upper Cenomanian strata (Korycany Beds of
        the Peruc-Korycany Formation) of the Czech Republic". The Korycany Beds
        are a facies designation of the local column, not a mappable
        subdivision of the formation.
    - id: csiki-sava2015a
      notes: >
        Describes it as "upper Cenomanian rudist-bearing sandy beach deposits".

Peterborough:
  rank: member
  parent: Oxford Clay
  period: [Middle Jurassic]
  stages: [Callovian]
  references:
    - id: ruiz-omeñaca2007a
      notes: >
        Records the renaming that created it: "Cox et al. (1992) renamed the
        lower Oxford Clay the Peterborough Member of the Oxford Clay Formation".
        Dates the Callovosaurus horizon as "Peterborough Member (=lower Oxford
        Clay), Middle Jurassic, middle Callovian (Jason Zone)", noting that the
        specimen has also been listed as upper or middle-upper Callovian.
    - id: barron2012a
      notes: >
        Treats its limits, downgrading a unit that had been given member status
        to a bed because "it is a natural part of the Peterborough Member - it
        contains typical Peterborough lithologies in places and passes into it
        laterally in a rather indefinite way".

Petrified Forest:
  rank: member
  parent: Chinle
  period: [Late Triassic]
  stages: [Carnian, Norian]
  dispute:
    summary: >
      Member or formation. Nesbitt and colleagues (2007) use "Petrified Forest
      Member, Chinle Formation" for Rio Arriba County, New Mexico; Hunt and
      colleagues (1998) write of the "Blue Mesa and Painted Desert Members of
      Petrified Forest Formation", promoting it and giving it members of its
      own. The Chinle-and-Dockum literature carries several such competing
      schemes.
  references:
    - id: nesbitt2007a
      notes: >
        Uses member rank under the Chinle and gives the age as "Norian, Late
        Triassic".
    - id: hunt1998a
      notes: >
        Uses formation rank, with the Blue Mesa and Painted Desert as its
        members.
    - id: long1995a
      notes: >
        Dates the lower and upper parts separately in the distribution of
        Chindesaurus bryansmalli: "Late Carnian: Lower Petrified Forest Member,
        Chinle Formation; Apache County, Arizona" and "Early Norian: upper
        Petrified Forest Member, Chinle Formation".
    - id: lucas1992a
      notes: >
        In the Chama basin the unit "includes three age-diagnostic taxa, the
        aetosaur Typothorax coccinarum and the phytosaurs Pseudopalatus
        pristinus and P. buceros", which "are restricted to strata of
        early-middle Norian age"; palynomorphs from it likewise "indicate a
        Norian age for the Petrified Forest and Rock Point Formations". Farther
        south, a large metoposaurid in the lower part of the unit near San
        Ysidro suggests that part is correlative with the Salitral, whose
        aetosaur Longosuchus is "restricted to late Carnian strata". Uses
        formation rank within the Chinle Group, and a figure caption gives
        "Upper Triassic Petrified Forest Formation".

Phu Kradung:
  rank: formation
  period: [Late Jurassic, Early Cretaceous]
  stages: [Kimmeridgian, Tithonian, Berriasian, Valanginian]
  references:
    - id: manitkoon2023a
      notes: >
        Titles its material as from "the Phu Kradung Formation (Upper Jurassic)
        of Northeastern Thailand" and elsewhere calls the unit Late
        Jurassic-Early Cretaceous.
    - id: nilpanapan2026a
      notes: >
        States the limit of what can be resolved: the evidence is "not
        sufficient to tightly constrain the age. Consequently, the formation is
        best regarded as spanning the latest Jurassic and possibly extending
        into the earliest Cretaceous (Berriasian)."
    - id: samathi2024a
      notes: >
        Reviews how the formation has been dated: it "was first considered Late
        Triassic to Early Jurassic age by Ward and Bunnag (1964)", Racey and
        colleagues (1996) later proposed a Late Jurassic or probably Early
        Cretaceous age, and Tong and colleagues (2021) suggested on the turtle
        Yakemys that its upper part is Early Cretaceous. The paper itself calls
        it the "Upper Jurassic Phu Kradung Formation".
    - id: ren2024a
      notes: >
        Dates it as Kimmeridgian, citing Jia and colleagues (2022), placing the
        mamenchisaurid teeth and posterior cervical vertebra reported by
        Suteethorn and colleagues (2013) "in Phu Kradung Formation
        (Kimmeridgian".
    - id: tucker2022a
      notes: >
        Notes that "the Phu Kradung Formation has been tentatively placed within
        the Middle to Late Jurassic", as an example of the poor and conflicting
        biostratigraphic age control on the units of the Khorat Group.
    - id: ward1964a
    - id: racey1996a
      notes: >
        Precise about the rest of the Khorat Group and explicitly imprecise
        about this unit. It dates the Nam Phong "accurately for the first time
        as late Norian to Rhaetian" and reassigns the Phra Wihan, Sao Khua, Phu
        Phan and Khok Kruat "to the Early Cretaceous (Berriasian to Aptian) on
        the basis of new palynological data" - but of this formation it says
        only that the age "is probably Late Jurassic or Early Cretaceous,
        although this cannot be determined with confidence". Two epochs offered
        as alternatives and disclaimed in the same sentence.
    - id: tong2021a
      notes: >
        "The evidence from the turtle assemblages seems to support a Late
        Jurassic age for the lower part of the formation and an Early Cretaceous
        age for its upper part", the macrobaenid Yakemys alongside Basilochelys
        in the upper part giving "further support for the Early Cretaceous age
        of the upper part of the Phu Kradung Formation". Following Racey (2009),
        that upper part is "basal Cretaceous (Berriasian–?Valanginian) in age",
        while the age of the formation as a whole "is still uncertain", the
        palynology and detrital zircon work indicating only that it "ranges from
        Late Jurassic to Early Cretaceous".
    - id: jia2022a
      notes: >
        Puts a floor under the unit that excludes every pre-Late Jurassic
        reading. Detrital zircon U-Pb on sample Nt17 gives youngest apparent
        ages of "154±6 Ma and 161±3 Ma", establishing a maximum possible
        depositional age of about 154 Ma, and the paper calls the unit the Late
        Jurassic or Upper Jurassic Phu Kradung throughout. Its paleomagnetic
        result for this formation passed the fold test, unlike its sampling of
        the Sao Khua. It records that Carter and Bristow (2003) had reached a
        Late Jurassic to Early Cretaceous depositional age by fission track and
        detrital zircon.
    - id: suteethorn2013a
      notes: >
        Gives the unit as "the Upper Jurassic-Lower Cretaceous Phu Kradung
        Formation" in its title and as "a Upper Jurassic to Lower Cretaceous
        continental unit" in its text, and records that "the age of the Phu
        Kradung Formation is controversial" while noting its vertebrate fauna
        resembles those of the Late Jurassic of China. Epochs only; it names no
        stage.
    - id: racey2009a
      notes: >
        Late Jurassic to Early Cretaceous, with the palynology and the
        vertebrates pulling apart: the palynological data of Racey and Goodall
        (2009) "indicate that most of the Phu Kradung Formation is Early
        Cretaceous", "whereas the vertebrate dating suggests that the Phu
        Kradung Formation is Late Jurassic (Tithonian) or Early Cretaceous in
        age". From a personal communication by Buffetaut that the gap between
        the Phu Kradung and Sao Khua vertebrate assemblages is wider than that
        between the Sao Khua and Khok Kruat, it infers that if the Khok Kruat
        Formation is Aptian and the Sao Khua therefore Barremian, "the Phu
        Kradung Formation would be earliest Cretaceous (Berriasian) or Latest
        Jurassic (Tithonian)".

Pichi Neuquén:
  rank: member
  parent: Rayoso
  period: [Early Cretaceous]
  stages: [Aptian, Albian]
  dispute:
    summary: >
      Two readings, neither superseded and neither testable against a date.
      Canudo and colleagues (2018) put it in the present tense: "There is no
      consensus regarding the age of this member, for no direct datings have
      been taken. Some authors place it in the Aptian (Musacchio and Vallati
      2000), whereas Leanza (2003) considers it to be rather more modern
      (lower Albian)." They decline to choose between them, and the Aptian
      to lower Albian range they go on to give is ascribed to the
      rebbachisaurid they describe rather than to the member. Neither
      disputant is read here; both are known through that account, and the
      Aptian side is credited to a five-page contribution to a congress on
      the Barremian-Aptian regression at Bajada del Agrio.
  references:
    - id: canudo2018a
      notes: >
        Names it third of the formation's four members around Agrio del Medio,
        "from the oldest to youngest these are the Rincon, Quili Malal, Pichi
        Neuquen, and Canadon de la Zorra members". Gives the member's age as
        unsettled and says why: "There is no consensus regarding the age of this
        member, for no direct datings have been taken", the Aptian credited to
        Musacchio and Vallati (2000) and a "rather more modern (lower Albian)"
        reading to Leanza (2003). The range the paper itself gives, "an age
        range from Aptian to lower Albian", is ascribed to the new
        rebbachisaurid rather than to the member; its bones came "from the
        middle part of the Pichi Neuquen Member, approximately 44 metres from
        its base".
    - id: wilson2015a
      notes: >
        Tabulates the rebbachisaurid occurrence as "Rayoso (Pichi Neuquen M.)"
        at "Aptian/lower Albian".

Piedra Parada:
  rank: member
  parent: La Amarga
  period: [Early Cretaceous]
  stages: [Barremian, Aptian]
  references:
    - id: salgado2006b
      notes: >
        Barremian to early Aptian, "Barremian-lower Aptian" in the abstract and
        "upper Barremian–lower Aptian" in the type horizon line, the latter
        after Leanza and Hugo (1997). The member's deposits "form a monotonous
        fluvial sequence composed of sandstones, conglomerates, sandy mudstones,
        and siltstones" over a thickness of 110 to 190 m, and until the
        Zapalasaurus holotype "paleontological records from these levels had not
        been previously documented".
    - id: apesteguía2007a
      notes: >
        Names it the uppermost of the formation's three members, "from base to
        top): Puesto Antigual Member, Bañados de Caichigüe Member, and Piedra
        Parada Member".
    - id: carballido2010a
      notes: >
        Places Zapalasaurus in it, "from more modern levels (Piedra Parada
        Member), dated as Barremian-Aptian".
    - id: leanza1995a
      notes: >
        Erects the member: "Piedra Parada Member nom. nov.: Constitutes the
        upper section of Formation La Amarga. It transitionally covers the
        Banados de Caichigue Member and is covered in unconformity by the Lohan
        Cura Formation", with the Piedra Parada area as its type locality, where
        it is 109.40 m thick. No stage is given for the member.

Pierre de Caen:
  rank: bed
  parent: Calcaire de Caen
  period: [Middle Jurassic]
  stages: [Bathonian]
  references:
    - id: allain2002a
      notes: >
        Gives the Dubreuillosaurus horizon as "the Pierre de Caen of the
        Calcaires de Caen Formation dated from the beginning of the Middle
        Bathonian". Uses the plural form of the formation name.
    - id: carrano2012a
      notes: >
        Fixes it by ammonite zone, "Procerites progracilis Zone, Pierre de
        Caen, Calcaires de Caen; middle Bathonian, Middle Jurassic", near
        Conteville, Calvados, Basse-Normandie.

Pingling:
  rank: formation
  period: [Late Cretaceous]
  stages: [Maastrichtian]
  references:
    - id: lü2005a
      notes: >
        Gives the type locality of Shixinggia as "Pingling Formation,
        Maastrichtian, Late Cretaceous", citing Zhao and colleagues (1991), and
        lists "Upper Cretaceous, Pingling Formation, Nanxiong Basin, Guangdong
        Province of southern China" among its key words.
    - id: an2015a
      notes: >
        Sets it among the oviraptorosaur-bearing units of China, with the
        Yuliangzi, Wulansuhai, Gaogou and Majiacun Formations.
    - id: zhao1991a
      notes: >
        Puts the top of the formation at the Cretaceous-Paleogene boundary: the
        contact "between the Pingling Formation and the Shanghu Formation,
        located in the upper part of geomagnetic polarity zone 29R, has been
        determined to be the K/T boundary", and that chron "includes the upper
        part of the Pingling Formation and the base of the Shanghu Formation".
        The paper names a stage only for the eggshell assemblage the formation
        shares with the Yuanpu, "dating to the latest Late Cretaceous
        (Maastrichtian)".

Plottier:
  rank: formation
  parent: Neuquén
  period: [Late Cretaceous]
  stages: [Coniacian, Santonian]
  references:
    - id: filippi2011a
      notes: >
        Gives "Plottier Formation (Coniacian-Santonian", with the Petrobrasaurus
        quarry in "the mid-high part of the Plottier Formation", and states the
        horizon as "Claystones of the Plottier Formation. Santonian (Upper
        Cretaceous) of the Neuquén Basin."
    - id: salgado2023a
      notes: >
        Uses the narrower "Plottier Formation, Santonian".
    - id: garrido2010a
      notes: >
        Reads the microfossil work of Musacchio (2006) and Musacchio and Vallati
        (2007) as giving the formation "an age within the Coniacian–Santonian
        interval", and adopts the Late Coniacian of Hugo and Leanza (2001) as
        "the most probable, potentially extending to the Early Santonian". Under
        the scheme proposed here the unit is narrower than in the usage of
        Salgado and colleagues (2009), whose Plottier would also take in the Los
        Bastos and Sierra Barrosa Formations.
    - id: hugo2001a
      notes: >
        Contradicts the Santonian and places this formation within its
        subgroup. It states twice that the Rio Neuquen Subgroup, which contains
        the Portezuelo and this unit, is upper Turonian to Coniacian, and puts
        the Santonian to lower Campanian in the overlying Rio Colorado
        Subgroup. Its stratigraphic chart resolves the subgroup internally,
        with the Portezuelo against the Turonian and this formation against the
        Coniacian.
    - id: musacchio2006a
      notes: >
        The source of the Santonian, and it hedges the unit attribution twice.
        The assemblage is from brick-red mudstones at El Zampal in Mendoza,
        described as "very similar to those that are conspicuous for the
        Plottier Formation in other parts of the basin", with the name itself
        printed in quotation marks; the locality is far from the type area. The
        Turonian-Santonian assignment is itself tentative, the gyrogonites and
        ostracods having "not provided, on the basis of available material,
        firm correlation criteria".
    - id: musacchio2007a
      notes: >
        Reports the same Zampal and Calmu-Co material at greater length, "For
        the first time, a non marine microfossil assemblage containing
        charophytes, megaspores, seed remains and ostracods ... from the
        Plottier Formation", in the Malargue Department of southern Mendoza.
        The Santonian on this entry rests on this material and its companion
        paper rather than on the type area.
    - id: salgado2009b
      notes: >
        Gives the formation no age. It describes vertebrates from El Anfiteatro
        in northern Rio Negro recovered "in beds of Cerro Lisandro, Portezuelo,
        and Plottier formations", so it is a locality and containment record
        rather than a dating.

Point Loma:
  rank: formation
  period: [Late Cretaceous]
  stages: [Campanian]
  references:
    - id: arbour2015a
      notes: >
        Gives the Aletopelta holotype locality in Carlsbad, California, SDNHM
        Locality 3392, and the horizon as "Point Loma Formation, upper
        Campanian".
    - id: ford2000a
      notes: >
        Independently gives "the Point Loma Formation, late Campanian, Late
        Cretaceous".

Poison Strip Sandstone:
  rank: member
  parent: Cedar Mountain
  period: [Early Cretaceous]
  stages: [Hauterivian, Barremian, Aptian, Albian]
  references:
    - id: tidwell2001a
      notes: >
        Uses the name throughout and records that the unit "was previously
        thought to correlate with the mid-Aptian Cloverly Formation".
    - id: kirkland2016a
      notes: >
        Describes it as "a complex of well-cemented sandstone beds that
        indicate deposition in amalgamated low-sinuosity" channels, using the
        rank word in place of the lithic term.
    - id: dicroce2001a
      notes: >
        Calls it the "Lower Cretaceous Poison Strip Member" and gives
        "Barremian-Aptian / Poison Strip Member" for Planicoxa venenica in its
        table, while the text concludes that "Most likely, this age is
        Barremian, the same as the Yellow Cat Member".
    - id: carpenter1999a
      notes: >
        Dates it from its ankylosaur: "Sauropelta suggests that the Poison Strip
        Sandstone is Aptian-Albian age because it is also present in the
        Cloverly Formation of Montana and Wyoming".
    - id: eberth2006a
      notes: >
        Dates the base of the unit from palynomorphs in "an organic-rich sample
        collected at the base of the overlying Poison Strip Sandstone", which
        "indicate an age range of latest Neocomian (Hauterivian) to Aptian, and
        probably Barremian", a result credited to G. Waanders as a personal
        communication.
    - id: sprinkel2012a
      notes: >
        Aptian: the lower three members of the Cedar Mountain Formation "were
        initially assigned tentative ages based on dinosaur biostratigraphy:
        Barremian for the Yellow Cat Member in the northern Paradox Basin,
        Aptian for the Poison Strip Member, and Aptian to middle Albian for the
        Ruby Ranch Member", a subdivision the paper credits to Kirkland and
        colleagues (1997, 1999).

Popo Agie:
  rank: formation
  period: [Middle Triassic, Late Triassic]
  stages: [Carnian]
  references:
    - id: lovelace2025a
      notes: >
        Describes the "oldest known equatorial dinosaur-bearing assemblage
        (mid-late Carnian Popo Agie FM, Wyoming, USA)", and reports its
        dinosauromorphs and detrital ages from "the Late Triassic (Carnian) Popo
        Agie Formation of Wyoming, USA".
    - id: martínez2025a
      notes: >
        Cites the same work for the mid-late Carnian age of the unit.
    - id: galton1985c
      notes: >
        Assigns the unit to the Middle Triassic in a figure caption,
        illustrating a Poposaurus ilium "from Popo Agie Beds (Middle Triassic)
        of Wyoming, U.S.A." after Galton (1977).
    - id: galton1977b

Portezuelo:
  rank: formation
  parent: Neuquén
  period: [Late Cretaceous]
  stages: [Turonian, Coniacian, Santonian]
  references:
    - id: baiano2022a
      notes: >
        Gives "Portezuelo Formation (Turonian–Coniacian, Upper Cretaceous" for
        the Elemgasem holotype, which comes from a red mudstone level 36 m above
        the base of the unit at Sierra del Portezuelo.
    - id: porfiri2024a
      notes: >
        Uses it as the older term of a stratigraphic contrast, against
        "the stratigraphically younger, larger-bodied Austroraptor cabazai from
        the Campanian-Maastrichtian".
    - id: calvo2004b
      notes: >
        Reports that its age "has been interpreted as Turonian through Santonian
        on the basis of sequence stratigraphy", following Leanza (1999) and
        Leanza and Hugo (2001); the abstract gives the narrower "Portezuelo
        Formation (Upper Turonian-Lower Coniacian)" for the new Megaraptor
        specimen, which came from red claystones at the top of the formation.
    - id: leanza1999a
    - id: leanza2001a
    - id: garrido2010a
      notes: >
        The unit "currently lacks absolute dating or biostratigraphic studies
        that would establish a reliable age", so the age adopted follows Hugo
        and Leanza (2001) and Leanza and colleagues (2004), who "tentatively
        place this unit between Late Turonian – Early Coniacian, a criterion
        also adopted in this work". Cruz and colleagues (1989) had assigned it
        90.5 to 88.5 Ma, "spanning from Middle Turonian to basal Early
        Coniacian".
    - id: hugo2001a
      notes: >
        Sets out the Neuquen Group's three subgroups with a span for each: "the
        Cenomanian-lower Turonian Limay Subgroup comprising the Candeleros,
        Huincul and Cerro Lisandro Formations; the upper Turonian-Coniacian Rio
        Neuquen Subgroup including the Portezuelo and Plottier Formations; and
        the Santonian-lower Campanian Rio Colorado Subgroup comprising the Bajo
        de la Carpa and Anacleto Formations." The statement is made twice in
        identical terms, and dates the group as a whole "from early Cenomanian
        (97 plus or minus 3 Ma) to early Campanian (74 plus or minus 3 Ma)".
    - id: cruz1989a
      notes: >
        A sequence-stratigraphic analysis that runs the whole scheme one rank
        below the registry: it gives "The Portezuelo (sandstones) and Plottier
        (pelites) members of the Rio Neuquen Formation" and "the members Bajo
        de la Carpa (sandstones) and Anacleto (pelites), of the Rio Colorado
        Formation", where the file and Hugo and Leanza (2001) make those two
        subgroups. Its own framework is Depositional Sequences I to IX, and its
        ages sit in a comparative stratigraphic chart rather than in the text,
        so it is a rank datum and a sequence framework rather than a dating.
    - id: leanza2004a

Portland:
  rank: formation
  period: [Early Jurassic]
  stages: [Hettangian, Sinemurian, Pliensbachian, Toarcian]
  references:
    - id: hendrickx2022a
      notes: >
        Gives "Portland Formation, Hettangian-Sinemurian; Lower Jurassic", for a
        crouching-theropod trace from Massachusetts.
    - id: galton2004a
      notes: >
        Tabulates Anchisaurus polyzelus from the Portland Formation of
        Connecticut and of Massachusetts as "Pliensbachian or Toarcian", and
        gives Ammosaurus major as "from the Pliensbachian or Toarcian of
        Connecticut".
    - id: tykoski2004a
      notes: >
        Tabulates "?Portland Formation (Massachusetts)" as
        "Pliensbachian-Toarcian" and hedges the assignment itself.
    - id: olsen1984a
      notes: >
        The protosuchian crocodiles and anchisaurid prosauropods it shares with
        the upper Stormberg assemblage "are associated with palynoflorules
        ranging in age from Pliensbachian to Toarcian", and K/Ar dates of
        194-185 Ma from the basalt flows underlying the formation indicate "an
        Early Jurassic age for the basalts ... and overlying beds". A figure
        caption gives the type of Grallator cursorius as from the "Portland
        Formation (Sinemurian - Toarcian) of the Hartford Basin, Massachusetts".

Posidonia Shale:
  rank: formation
  period: [Early Jurassic]
  stages: [Toarcian]
  references:
    - id: haubold1990a
      notes: >
        Gives the Emausaurus ernsti horizon as "lowermost Lias epsilon, lower
        Toarcian, Dactylioceras tenuicostatum zone (equivalent to the Posidonia
        Shale), clay pit near Grimmen west of Greifswald,
        Mecklenburg-Vorpommern".
    - id: ansorge2025a
      notes: >
        Treats the Toarcian strata of the eastern North German Basin and
        distinguishes the newly named Grimmen Formation from the Posidonia Shale
        Formation, whose "facies and fauna are largely unknown in international
        literature" by comparison.
    - id: sues2025a
      notes: >
        Places the "Posidonia shales" of Germany above the Triassic succession
        that Alberti (1834) divided into Buntsandstein, Muschelkalk and Keuper,
        and gives them as "Early Jurassic in age".
    - id: vonalberti1834a

Poudingue Ferrugineux:
  rank: formation
  period: [Early Cretaceous]
  stages: [Aptian, Albian]
  references:
    - id: averianov2025b
      notes: >
        Tabulates "Normanniasaurus genceyi | Europe | France | Albian |
        Poudingue Ferrugineux" on Le Loeuff and colleagues (2013).
    - id: leloeuff2013a
      notes: >
        Dates the Normanniasaurus levels of the formation at Bléville, Le Havre,
        as "lower to middle Albian" (Breton, 1998). It also records that a
        catalog (1880) of the 1877 geological exhibition in Le Havre listed a
        crocodilian from "the Poudingue ferrugineux, then considered as Aptian".
    - id: breton1998a
    - id: anonymous1880a

Praia Azul:
  rank: member
  parent: Lourinhã
  period: [Late Jurassic]
  stages: [Kimmeridgian, Tithonian]
  references:
    - id: mateus2017a
      notes: >
        Describes it as "lower coastal plain alluvium with three
        brackish-marine faunally distinct transgressive carbonate levels" and
        dates it "uppermost Kimmeridgian to lowermost Tithonian". Pairs it with
        the Sobral, writing of the "Praia Azul/Sobral Member".
    - id: rotatori2022a
      notes: >
        Gives "Praia Azul Member of Lourinhã Formation, lower Tithonian".
    - id: hill1989a
      notes: >
        "The younger deltaic sediments of the Praia Azul member have been dated
        as basal Tithonian by Leinfelder (1987)", a date the paper then uses to
        cap the underlying Praia da Amoreira member. Treats it as one of the
        tongues of marine and deltaic facies intercalated to the south with the
        fluvial younger members of the Lourinhã formation.

Praia da Amoreira-Porto Novo:
  rank: member
  parent: Lourinhã
  period: [Late Jurassic]
  stages: [Kimmeridgian, Tithonian]
  variants: [Amoreira-Porto Novo, Porto Novo]
  dispute:
    summary: >
      Rank is unsettled and the disagreement is current. Mateus and colleagues
      (2017) treat it as two members of the Lourinhã mapped together -- "The
      Porto Novo and the Praia da Amoreira Members (Hill, 1989) were mapped
      together by Manuppella et al. (1999) and we follow this approach in this
      work" -- while Mocho and colleagues (2019) and Malafaia and colleagues
      (2020), both later, write "Praia da Amoreira-Porto Novo Formation". The
      two cannot nest: no cited source puts the Lourinhã above formation rank,
      so treating this unit as a formation places it beside the Lourinhã rather
      than inside it.
  references:
    - id: mocho2019a
      notes: >
        "Praia da Amoreira-Porto Novo Formation, upper Kimmeridgian-lowermost
        Tithonian".
    - id: malafaia2020a
      notes: >
        "Praia da Amoreira-Porto Novo Formation (upper Kimmeridgian)" in the
        locality and horizon line.
    - id: mateus2017a
      notes: >
        Treats it as two members mapped together and explains the history,
        crediting the original pair to Hill (1989) and the joint mapping to
        Manuppella and colleagues (1999).
    - id: antunes2003a
      notes: >
        Calls it a unit and gives the Ceratosaurus horizon as "Late Jurassic,
        ?Upper Kimmeridgian/ Tithonian, Amoreira - Porto Novo Unit"; for
        Dinheirosaurus it gives "Late Jurassic, Kimmeridgian to Tithonian,
        Amoreira-Porto Novo Unit and Bombarral Unit".
    - id: hill1989a
      notes: >
        The Praia da Amoreira member has "yielded no biostratigraphically useful
        palynomorphs, and its age can only be inferred from its stratigraphic
        position above the Abadia formation which is of late Oxfordian to
        mid-Kimmeridgian age (Ellwood 1987)"; with the overlying Praia Azul
        dated as basal Tithonian, "it is probable that the Praia da Amoreira
        member is of mid-to-late Kimmeridgian age". Its distal alluvial fan
        sediments were laid down "during a late Jurassic rifting phase", and the
        paper keeps the Praia da Amoreira and Porto Novo as separate members of
        the Lourinhã formation, the first succeeded on the coast by the second.
    - id: manuppella1999a

Presidente Prudente:
  rank: formation
  parent: Bauru
  period: [Late Cretaceous]
  stages: [Campanian, Maastrichtian]
  references:
    - id: bandeira2016a
      notes: >
        Calls it "the Late Cretaceous Presidente Prudente Formation (Bauru
        Group, Paraná Basin)" and gives the unit as "considered
        Campanian-Maastrichtian in age" for deposits of sandstones and mudstones
        near the Raposo Tavares road, São Paulo State.
    - id: fernandes2000a
      notes: >
        The revision that erected it, crediting it to Fernandes (1998) and
        listing it among the Bauru Group's formations.
    - id: fernandes1998a

Prince Creek:
  rank: formation
  period: [Late Cretaceous]
  stages: [Coniacian, Santonian, Campanian, Maastrichtian]
  references:
    - id: fiorillo2012a
      notes: >
        Gives that the "Prince Creek Formation ranges in age from latest
        Campanian" onward.
    - id: fiorillo2014a
      notes: >
        Describes it as "an alluvial unit comprised of sediments shed northward
        from the rising Brooks Range during late Campanian" time. Fiorillo and
        colleagues (2013) give the same wording, and Fiorillo and colleagues
        (2010) carry a Campanian-to-Maastrichtian range.
    - id: brett-surman1989a
      notes: >
        Lists "Prince Creek Fm, Coniacian ?" in a world list of formations with
        hadrosaurian remains, the age followed by a query.
    - id: fiorillo2010a
      notes: >
        Gives "The Late Cretaceous (Campanian-Maastrichtian) Prince Creek
        Formation". Pollen work by Frederiksen (1990) suggests the Ocean Point
        vertebrate deposits are "close to the Campanian-Maastrichtian boundary",
        and the paper's own pollen analyses near Kikak Creek "suggest an
        earliest Maastrichtian age" for the Kikak-Tegoseak Quarry bonebed.
    - id: fiorillo2013a
      notes: >
        Gives the unit as "an alluvial unit ... from late Campanian to
        Paleocene time", with "radioisotopic dates ... range from 68 Ma to 71
        Ma". It supports neither of the entry's two older stages.
    - id: frederiksen1990a
      notes: >
        Its title carries the age - a pollen zonation and correlation of
        Maastrichtian marine beds at the Ocean Point dinosaur locality - and it
        sets the unit in the Colville Group. The Turonian it gives belongs to
        the underlying Seabee Formation, dated "at least partly of Turonian
        age".

Puesto Antigual:
  rank: member
  parent: La Amarga
  period: [Early Cretaceous]
  stages: [Barremian, Aptian]
  references:
    - id: gallina2016a
      notes: >
        Gives "Puesto Antigual Member of the La Amarga Formation, Barremian,
        Lower Cretaceous".
    - id: pereda-suberbiola2013a
      notes: >
        Carries the younger bound, giving the stegosaur material as from the
        "basal Puesto Antigual Member, La Amarga Formation, Lower Cretaceous,
        Barremian-lower Aptian", after Leanza and colleagues (2004).
    - id: leanza2004a
      notes: >
        Dates the parent formation and not this member. Under the heading for
        the La Amarga Formation the paper says that "this unit may be regarded
        as Barremian-Early Aptian in age", on "basin analysis, stratigraphical
        relationships and tectonosedimentary aspects" relayed from Leanza and
        Hugo, and only then introduces the three subunits of which this is the
        lowest. No member-level age is given here, and the formation's range is
        not biostratigraphic or radiometric.

Puesto Quiroga:
  rank: member
  parent: Lohan Cura
  period: [Early Cretaceous]
  stages: [Aptian, Albian]
  references:
    - id: carballido2012a
      notes: >
        Gives the Comahuesaurus horizon as the "Northern slope of Cerro Aguada
        del León" in the "La Picasa area, South Central Neuquén", "Lohan Cura
        Formation, Puesto Quiroga Member", and records that "The age of this
        member is considered as Aptian-Albian ..., and therefore has been
        correlated with the Rayoso Formation of the Bajada del Agrio Group in
        the central area of the basin".
    - id: wilson2015a
      notes: >
        Tabulates the same occurrence as "Lohan Cura (Puesto Quiroga M.)" at
        "Aptian/Albian".
    - id: salgado2004a
      notes: >
        Gives "the Lower Cretaceous (Aptian-Albian) Puesto Quiroga Member of the
        Lohan Cura Formation" and places its rebbachisaurid material in "the
        middle-upper section of the Puesto Quiroga Member, the basalmost unit of
        the Lohan Cura Formation".

Purbeck:
  rank: group
  period: [Late Jurassic, Early Cretaceous]
  stages: [Tithonian, Berriasian]
  references:
    - id: clements1993a
      notes: >
        The bed-by-bed type-section account of the group at Durlston Bay,
        Swanage, which is the thickest well-exposed Purbeck section in the
        country, with the gastropod and ostracod faunas logged through it.
        Treats the strata as the Purbeck Limestone Group, divided into the
        Durlston Formation above and the Lulworth Formation below after Townson
        (1975), where others have ranked the same strata as a formation; the
        traditional Lower, Middle and Upper divisions rest partly on
        biostratigraphy and are kept only informally. Where the
        Jurassic/Cretaceous boundary falls within the sequence "remains very
        uncertain", the paleontological basis for Casey's (1963) placement of it
        having been challenged.
    - id: barker2023a
      notes: >
        The group is "a succession that underlies the Wealden Supergroup ... and
        spans the Jurassic-Cretaceous boundary (Tithonian–Berriasian ...)".
        Within the Weald sub-basin it reaches the surface in three fault-bounded
        inliers north and northwest of Battle in East Sussex, surrounded by the
        overlying Hastings Group and representing the oldest exposed rocks in
        the region; there it is represented by both the Lulworth and the
        Durlston Formations, "which are principally Berriasian in age".
    - id: galton2009a
      notes: >
        Names the scheme by way of its upper part, giving the Owenodon horizon
        as "the Purbeck Limestone Formation (=Durlston Formation, Upper
        Purbeck, mid-Berriasian ...)". The Lulworth Formation is its lower
        division and is entered separately.

Purgatoire:
  rank: formation
  period: [Early Cretaceous]
  stages: [Aptian, Albian]
  references:
    - id: brill2007a
      notes: >
        Gives the rank, the containment and the age together, the Theiophytalia
        skull coming from "the lower Lytle Member of the Purgatoire Formation
        (Dakota Group), which is of Aptian-Albian age". Other workers use the
        Dakota at formation rank, so the name carries both ranks in the
        literature.
    - id: mcdonald2010a
      notes: >
        Records the reassignment, the skull "formerly referred to the Late
        Jurassic iguanodontian Camptosaurus and recently determined to have
        been found in the Early Cretaceous Purgatoire Formation of Colorado".

Qiaotou:
  rank: member
  parent: Huajiying
  period: [Late Jurassic, Early Cretaceous]
  stages: [Hauterivian, Barremian]
  references:
    - id: xing2020a
      notes: >
        Makes it one of the two members of the lower Huajiying Formation with
        the Sichakou, the vertebrate fossils occurring "in the lower part of
        the formation (Sichakou and Qiaotou members) dated by 40Ar/39Ar to the
        weighted mean age of 130.7 Mya".
    - id: pittman2020a
      notes: >
        Treats the name as a synonym of the formation instead, writing "the
        Hauterivian-Barremian Huajiying (Qiaotou) Formation of Hebei, China".
        Its table of the Mesozoic avialan record nonetheless lists the Qiaotou
        Formation separately from the Huajiying, as Barremian and Early
        Cretaceous.
    - id: ji2005a
      notes: >
        "The age of the Qiaotou Formation is equivocal. It has been suggested to
        be Late Jurassic by some paleontologists, or Early Cretaceous by
        others", with isotopic dating still in process; the paper treats the
        unit at formation rank. The Jinfengopteryx holotype comes from the
        middle part of the unit, which is stratigraphically lower than the
        Sinosauropteryx-bearing beds of the Yixian Formation, and the associated
        fossils are common elements of the Jehol Biota.

Qiketai:
  rank: formation
  period: [Middle Jurassic]
  dispute:
    summary: >
      Which unit the Xinjiangtitan material comes from is contested, and the
      formation's own age with it. Maisch and Matzke (2019) place the taxon in
      "strata attributed to the Qiketai Formation, which is probably coeval to
      the Toutunhe Formation of the Junggar Basin and may therefore be lower
      Early Jurassic rather than Middle Jurassic in age". Upchurch and
      colleagues (2021) instead give the horizon as the "Lower part of the
      Kalazha Formation (Upper Jurassic: upper Kimmeridgian-Tithonian) of
      Qiketai, Shanshan County". So the same locality name attaches to a
      formation and to a village, and the two readings are an epoch apart.
  references:
    - id: maisch2019a
      notes: >
        Attributes Xinjiangtitan to the Qiketai Formation, correcting Xing and
        colleagues (2015), and argues the unit "is probably coeval to the
        Toutunhe Formation of the Junggar Basin and may therefore be lower Early
        Jurassic rather than Middle Jurassic in age". The same paper calls
        Xinjiangtitan an "Upper Jurassic mamenchisaurid", notes that the
        Toutunhe Formation "has recently been regarded as Upper Jurassic", and
        says "The stratigraphic position of the Qiketai Formation remains
        controversial."
    - id: upchurch2021a
      notes: >
        Gives the competing Kalazha reading, treating Qiketai as the locality
        in Shanshan County, Turpan Basin, Xinjiang.
    - id: wu2013a
      notes: >
        Lists the Jurassic strata of the Shanshan area "from bottom to top" as
        "the Middle Jurassic Xishancun Formation, Sanjianfang Formation, Qiketai
        Formation, Qigu Formation, and the Upper Jurassic Kalazha Formation",
        placing the Qiketai Formation below the Middle Jurassic Qigu Formation
        that yields Xinjiangtitan.
    - id: xing2015a
      notes: >
        Never names this formation, and places the taxon that brings it here
        somewhere else: its table gives "Xinjiangtitan shanshanensis QG" and
        its abbreviation key resolves QG as the Qigu Formation, in the paper's
        Middle Jurassic column. So it contributes nothing to this unit's age,
        and it is a second vote for the Qigu attribution alongside Wu and
        colleagues (2013). Across the entry's references the horizon readings
        now stand at two for the Qigu, one for this formation and one for the
        Kalazha.

Qingshan:
  rank: group
  period: [Early Cretaceous]
  stages: [Barremian, Aptian, Albian]
  references:
    - id: averianov2006a
      notes: >
        Places the Doushan Formation "in the upper part of Qingshan Group in
        Shandong Province, China", radiometrically dated at 119 to 121 Ma and
        so within the Aptian.
    - id: sereno2010a
      notes: >
        Gives the same containment for the Psittacosaurus sinensis type
        horizon.
    - id: xu2015b
      notes: >
        Lists the Jiaolai basin fill as "the Early Cretaceous Laiyang and
        Qingshan Formations (Groups) and the Late Cretaceous Wangshi Formation
        (Group)", and reports that volcanic rocks from the Qingshan in that
        basin "gave whole-rock 40Ar–39Ar ages clustering at 120–105 Ma".
    - id: zhen1985a
      notes: >
        Treats the unit as the "Qingshan Formation in Shandong", whose
        Psittacosaurus fauna "is clearly of Early Cretaceous (probably
        Aptian-Albian) age based on the non-marine invertebrates from the
        Qingshan Formation", after Chen (1983).

Qiupa:
  rank: formation
  period: [Late Cretaceous]
  stages: [Campanian, Maastrichtian]
  references:
    - id: lü2018a
      notes: >
        Gives "Qiupa Formation (Late Maastrichtian)" and describes the skeleton
        as "discovered from the Late Cretaceous Qiupa Formation of Luanchuan".
    - id: pittman2020a
      notes: >
        Tabulates it across both stages, Campanian and Maastrichtian.

Quantou:
  rank: formation
  period: [Early Cretaceous, Late Cretaceous]
  stages: [Aptian, Albian, Cenomanian]
  dispute:
    summary: >
      The age is openly unsettled. Jin and colleagues (2009) record that
      "numerous authors have variously assigned Aptian, Albian, or Cenomanian
      ages to the Quantou Formation", and note that the Liufangzi locality "was
      assigned to the Quantou Formation primarily on the basis of the lithology
      ..., but to date, no microfossils that could be compared to the type
      section have been collected in this area". So both the age and some
      assignments to the unit rest on lithology alone.
  references:
    - id: jin2009a
      notes: >
        States the three competing ages, "Numerous authors have variously
        assigned Aptian, Albian, or Cenomanian ages to the Quantou Formation",
        and the lithological basis of the Liufangzi assignment, giving the
        Liufangzi horizon as "Quantou Formation (late Early Cretaceous or early
        Late Cretaceous)".

Quebrada del Barro:
  rank: formation
  parent: Marayes
  period: [Late Triassic, Early Jurassic]
  stages: [Norian, Rhaetian]
  references:
    - id: martínez2017a
      notes: >
        Gives "the late Norian-Rhaetian Quebrada del Barro Formation,
        northwestern Argentina".
    - id: apaldetti2011a
      notes: >
        Calls it "an Upper Triassic-Lower Jurassic unit", its age "originally
        proposed as Cretaceous ... and later as Upper Triassic". It lists the
        formation as "Norian?" and questions the Norian age that Bossi and
        Bonaparte (1978) based on a Riojasaurus referral, that record being
        "known only by a partial pes without any diagnostic features"; from
        Leyesaurus, found in its "uppermost level", it suggests "the Quebrada
        del Barro Formation may be of Lower Jurassic age".
    - id: bossi1978a

Quiricó:
  rank: formation
  period: [Early Cretaceous]
  stages: [Barremian, Aptian]
  references:
    - id: zaher2011a
      notes: >
        Gives "outcrops of Aptian age in the Quiricó Formation of the
        Sanfranciscana Basin", its lacustrine deposits sitting "in the lower
        part of the Sanfranciscana sequence".
    - id: zaher2020a
      notes: >
        Places it in its group, "the Quiricó Formation, Areado Group,
        Sanfranciscana Basin".
    - id: pereira2024a
      notes: >
        Gives the unit as "Barremian-Aptian".
    - id: martínez2016a
      notes: >
        Places Tapuiasaurus in "the Lower Cretaceous Quiricó Formation of
        Brazil" and notes it "was recovered from Aptian strata".

Quseir:
  rank: formation
  period: [Late Cretaceous]
  stages: [Campanian]
  variants: [Baris]
  references:
    - id: gorscak2022a
      notes: >
        Gives "the Upper Cretaceous (Campanian) Quseir Formation of the Kharga
        Oasis, Egypt".
    - id: sallam2018a
      notes: >
        Gives the alternate name directly, writing "the Quseir (=Baris)
        Formation of Kharga Oasis", and places Mansourasaurus in the same unit
        at the Dakhla Oasis.

Rayoso:
  rank: formation
  period: [Early Cretaceous]
  stages: [Aptian, Albian]
  references:
    - id: canudo2018a
      notes: >
        Calls it "one of the Lower Cretaceous units that outcrop in the Neuquén
        Basin" and names its four members around Agrio del Medio, "from the
        oldest to youngest these are the Rincón, Quili Malal, Pichi Neuquén, and
        Cañadón de la Zorra members".
    - id: averianov2021b
      notes: >
        Tabulates the Lavocatisaurus occurrence in the formation as
        "Aptian-Albian".
    - id: vanderlinden2025a
      notes: >
        Places Lavocatisaurus agrioensis in "the Aptian to lower Albian part of
        the Rayoso Formation", which it elsewhere calls the "Lower Cretaceous
        Rayoso Formation of Argentina".

Reuchenette:
  rank: formation
  period: [Late Jurassic]
  stages: [Kimmeridgian]
  references:
    - id: comment2015a
      notes: >
        The formation "covers almost the entire Kimmeridgian (Upper Jurassic) of
        Ajoie", where it "is subdivided into four members: the Vabenau Member
        ..., the Banné Member ... known for its richness in invertebrates, the
        Courtedoux Member ... with several dinosaur trace fossil levels, and the
        Chevenez Member (nov.), in the upper part of the formation". At the type
        locality "the thickness of the formation is approximately 150 m".
    - id: carrano2012a
      notes: >
        Places the Amanzia material, from the "'Virgulian' Basse Montagne
        quarry near Moutier, Kanton Bern, Switzerland", in what is "now known
        to belong to the lower Reuchenette Formation (early Kimmeridgian)".

Reynolds Point:
  rank: member
  parent: Wahweap
  period: [Late Cretaceous]
  stages: [Campanian]
  references:
    - id: beveridge2022a
      notes: >
        Formalizes it as the second of the Wahweap Formation's four members,
        above the Last Chance Creek and below the Coyote Point, and places the
        Last Chance Creek to Reynolds Point boundary at 81.55 Ma against a
        formation base of 82.17 Ma.
    - id: kirkland2010a
      notes: >
        Under the unit's earlier informal name, dates a level near its base from
        the 40Ar/39Ar date Jinnah and colleagues (2007) obtained on "an ash near
        the base of the middle mudstone member of the Wahweap Formation, 54 m
        above the base of the formation", which "indicates an early Middle
        Campanian age". The Diabloceratops type locality, near the middle of the
        member, "would date at ~79.57 Ma, well into the Middle Campanian".
    - id: jinnah2007a
      notes: >
        A conference abstract, and the source of the date this member's age
        rests on. It reports the first radiometric dating of the Wahweap
        Formation, by laser-fusion single-crystal 40Ar/39Ar on sanidine
        phenocrysts from a bentonite 54 m above the base of the roughly 400 m
        thick formation, yielding an age of 80.1 plus or minus 0.3 Ma.
        Combined with a previously dated ash of about 75.9 Ma at the base of
        the overlying Kaiparowits Formation it gives a sediment accumulation
        rate of about 8.2 cm per thousand years. The dated horizon lies within
        this member, which Kirkland and colleagues (2010) reach under its
        earlier informal name, the middle mudstone member.

Rio Paraná:
  rank: formation
  parent: Caiuá
  period: [Early Cretaceous, Late Cretaceous]
  references:
    - id: langer2019a
      notes: >
        Calls it "the likely early Late Cretaceous Rio Paraná Formation" at the
        Vespersaurus type locality, but states no stage for it. Following some
        stratigraphic schemes, places it in its group as one of "three coeval
        units: the Rio Paraná, Goio Erê, and Santo Anastácio formations", and
        reassigns a site to it: the Cruzeiro do Oeste deposits had been put in
        the Goio Erê, "but the site is located in an area more commonly mapped
        as covered by sediments of the Rio Paraná Formation. This assignment is
        confirmed here, based on a recent in loco revaluation".
    - id: sotonúñez2026a
      notes: >
        Calls it "the upper Lower Cretaceous Rio Paraná Formation", the
        exception among the mostly upper Late Cretaceous units it compares, and
        attributes the distinct composition of its fauna to "its older age (e.g.
        presence of tapejarids, absence of saltasaurines)".

Rio Piranhas:
  rank: formation
  period: [Early Cretaceous]
  stages: [Berriasian, Valanginian, Hauterivian, Barremian]
  references:
    - id: carvalho2017a
      notes: >
        Describes Triunfosaurus and gives the span, "The age of the Rio Piranhas
        Formation is considered to range from Berriasian to early Hauterivian",
        with its horizon as "Rio Piranhas Formation, Triunfo Basin. Lower
        Cretaceous (Berriasian-lower Hauterivian)".
    - id: averianov2025b
      notes: >
        Gives the unit two readings: Triunfosaurus is "similarly aged
        (Berriasian-Hauterivian)" to Ninjatitan, "from the Rio Piranhas
        Formation of Brazil", while an isolated fibula comes from "the
        Hauterivian-Barremian Rio Piranhas Formation of Paraiba, Northeast
        Brazil".

Ripley:
  rank: formation
  period: [Late Cretaceous]
  stages: [Campanian, Maastrichtian]
  references:
    - id: baird1979a
      notes: >
        Dates it by way of the member inside it, "the McNairy Sand Member of the
        Ripley Formation, considered early Maestrichtian in age".
    - id: gilmore1945a
      notes: >
        Places it beneath the Owl Creek Formation in southeastern Missouri, and
        gives the horizon of the Glen Allen vertebrae as "McNairy sand member,
        Ripley formation, Upper Cretaceous".
    - id: brett-surman1989a
      notes: >
        Lists it among the world's formations with hadrosaurian remains as
        "Ripley Fm, Campanian".

Rock Point:
  rank: member
  parent: Chinle
  period: [Late Triassic]
  stages: [Norian, Rhaetian]
  dispute:
    summary: >
      Member or formation, and the split runs by scheme rather than by evidence.
      Nesbitt and colleagues (2020) name it outright: Lucas and Hunt (1993) and
      Rinehart and colleagues (2009) "proposed correlation with the Rock Point
      Member of that formation ('Rock Point Formation' in their nomenclature)".
      Hunt and colleagues use Member eight times in 1991 and Formation nine
      times in 1998, either side of the revision that raised it.
      The age is separately disputed, between a Norian and a Rhaetian reading.
      Long and Murry (1995) give "?Early Norian", Litwin and colleagues (1991)
      read an early Norian from palynology, and Rinehart and colleagues (2009),
      weighing magnetostratigraphy against two biostratigraphies, "favor the
      late Norian age"; against them Martz and colleagues place most of the
      member in an Apachean holochronozone falling "during the Rhaetian", and
      Novas and colleagues (2021) write of "the Rhaetian Rock Point Member".
      Several papers carry both without choosing, and Nesbitt and colleagues
      (2020) still report the question open. A late Rhaetian to Hettangian
      reading is sometimes attributed to this unit and should not be: its
      source is not held, the paper that relays it does so to reject it, and
      the nearest Hettangian in the literature belongs to the Glen Canyon
      Group, from which Olsen and Galton expressly exclude these beds.
  references:
    - id: nesbitt2020a
      notes: >
        Uses member rank and identifies formation rank as the other scheme's
        house style.
    - id: hunt1991a
      notes: >
        Uses member rank, placing the famous Whitaker quarry "in the Rock Point
        Member of the Chinle Formation at Ghost Ranch, New Mexico".
    - id: long1995a
      notes: >
        Uses member rank inside a Chinle Formation and gives "?Early Norian",
        setting it beside the upper Petrified Forest and Siltstone Members.
    - id: cather2013a
      notes: >
        Declines the rename for the New Mexico beds it was applied to: "Lucas
        and Hunt (1992) renamed these beds the Rock Point Formation for a unit
        at the top of the Chinle in the Four Corners area that they regarded to
        be correlative. Subsequent magnetostratigraphic analysis, however, has
        called into question this correlation ... Until this controversy is
        resolved, we favor a return to the use of the term siltstone member for
        these beds."
    - id: lucas1993a
      notes: >
        Carries the Rhaetian only inside the title of a work it cites, Hunt's
        "Redonda Formation and Rock Point Member of the Chinle Formation
        (southwestern United States): are they Rhaetian (latest Triassic) in
        age?"
    - id: rinehart2009a
      notes: >
        Dates the Whitaker quarry within the member and declines to settle it:
        on magnetostratigraphy and two biostratigraphies "the quarry is of
        Apachean (late Norian-Rhaetian) age", and "Clearly, the Whitaker quarry
        is Late Triassic in age (not Hettangian), and either late Norian or
        Rhaetian. We favor the late Norian age". Records a third reading against
        both: Zeigler and Geissman (2009) "assigned a late Rhaetian-Hettangian
        age to the Rock Point Formation in the Chama basin" on paleopole
        similarity.
    - id: lucas1992a
      notes: >
        Gives the unit a phytosaur of "late Norian/Rhaetian" age, using
        formation rank.
    - id: hunt1998a
      notes: >
        Dates the unit by faunachron rather than by stage, and the two are
        never adjacent in the text: the formation is assigned to the Apachean
        five times, and the calibration is given separately - "four separate
        faunachrons: the Otischalkian (late Carnian: early Tuvalian), Adamanian
        (late Carnian: late Tuvalian), Revueltian (early-late Norian:
        Lacian-Sevatian) and Apachean (Rhaetian)". So it is a Rhaetian reading
        for this unit, reachable only through that equivalence, and the
        calibration is credited to Lucas and Hunt (1993) rather than
        established here.

Romualdo:
  rank: formation
  period: [Early Cretaceous]
  stages: [Aptian, Albian]
  dispute:
    summary: >
      Formation or member, depending on how the Santana is treated. Arai and
      Assine (2020) use formation rank and report that the unit "has been
      extended into the Albian"; Sues and colleagues (2002) write "Romualdo
      Member is probably younger than early Albian". A member of the Santana
      Formation becomes a formation wherever the Santana itself is read as a
      group.
  references:
    - id: naish2004a
      notes: >
        The Mirischia holotype's horizon is "Romualdo Member of the Santana
        Formation, Araripe Group. Lower Cretaceous (Martill and Wilby, 1993). A
        ?late Albian age is inferred by Pons et al. (1990)", and the paper's
        title carries the same "?Albian, Early Cretaceous" reading. The member
        is treated as the concretion-bearing part of the Santana Formation,
        deposited under brackish or quasi-marine conditions, with the dinosaur
        material allochthonous.
    - id: sayão2020a
      notes: >
        Carries both Early Cretaceous readings at once: the title dates the unit
        Albian, while the horizon statement assigns the new theropod to the
        lower strata of the formation, Aptian, in dark shale about 2.5 m above
        the contact with the Ipubi Formation and some 30 m below the concretion
        level. On rank it reports a settled view, that "there is a consensus to
        consider the former Santana Formation ... as the Santana Group, that is
        further divided from base to top, into the Barbalha, Crato, Ipubi and
        Romualdo formations".
    - id: sales2017a
      notes: >
        Reads the unit as Albian: "geological data indicate a transitional
        depositional setting for the majority of the stratigraphic sequence of
        the Romualdo Formation and a late Early Cretaceous (Albian) age", with
        the holotypes of Irritator and Angaturama both placed in "Romualdo
        Formation; Albian, Lower Cretaceous". Formation rank is adopted
        explicitly, following Valença and colleagues, for "the
        lithostratigraphic unit of the concretion-bearing beds", and the paper
        records marine strata with echinoids and mollusks in the western part of
        the formation above those beds.
    - id: delcourt2025a
      notes: >
        Calls the unit "a world-famous Early Cretaceous (Aptian) fossil
        Konservat Lagerstätte that crops out along the margins of the Araripe
        Plateau", using formation rank throughout. The theropods it revises come
        from "The upper carbonate concretion levels of the Romualdo Formation
        (Aptian, Brazil)", the same beds that yielded the spinosaurids, while
        Aratasaurus "was recovered from the lower levels of that unit".
    - id: arai2020a
      notes: >
        Uses formation rank and extends its range into the Albian.
    - id: sues2002a
      notes: >
        Uses member rank, and dates it only relatively, "probably younger than
        early Albian".

Ruby Ranch:
  rank: member
  parent: Cedar Mountain
  period: [Early Cretaceous]
  stages: [Aptian, Albian]
  references:
    - id: kirkland2016a
      notes: >
        Gives that the member "ranges in age from approximately middle Aptian to
        middle Albian".
    - id: carpenter2001a
      notes: >
        Independently gives "Ruby Ranch Member (Aptian-Albian".
    - id: sprinkel2012a
      notes: >
        "Aptian to middle Albian for the Ruby Ranch Member", one of the
        tentative ages the lower three members of the Cedar Mountain Formation
        were initially assigned "based on dinosaur biostratigraphy". Around
        Dinosaur National Monument the bulk of the formation "best fit the Ruby
        Ranch Member", although the paper holds that it is "unwarranted" to
        carry the central Utah member names into northeastern Utah.

Río Playas:
  rank: formation
  period: [Late Cretaceous]
  stages: [Campanian, Maastrichtian]
  references:
    - id: apesteguía2020a
      notes: >
        Describes Yamanasaurus from "rocks of the Río Playas Formation, which
        is regarded as Campanian-Maastrichtian in age", in the Alamor-Lancones
        Basin of southern Ecuador.
    - id: santucci2022a
      notes: >
        Narrows the occurrence to "Río Playas Formation, late Maastrichtian
        (Upper Cretaceous)" in the Yamana region of Loja Province.

Sainte-Barbe Clays:
  rank: formation
  period: [Late Jurassic, Early Cretaceous]
  stages: [Barremian, Aptian]
  references:
    - id: mcdonald2010b
      notes: >
        Gives Iguanodon bernissartensis as from "the Sainte-Barbe Clays
        Formation of Belgium".
    - id: bertozzo2025a
      notes: >
        Gives the age and the fuller name, Iguanodon and Mantellisaurus having
        co-existed in "the upper Barremian-lower Aptian Bernissart Sainte-Barbe
        Formation of Bernissart in Belgium".
    - id: yans2012a
      notes: >
        Dates the formation in the Iguanodon Sinkhole at Bernissart as "late
        Late Barremian to earliest Aptian" from its angiosperm pollen and carbon
        isotope trend, narrowing the conclusion of Robaszynski and colleagues
        (2001) that this formation "was Late Jurassic to Early Cretaceous in
        age".
    - id: robaszynski2001a
      notes: >
        A lithostratigraphic lexicon entry. Its age statement - "Late Jurassic
        ('Purbeckian') to Early Cretaceous (Aptian) and possibly even extending
        into Early Cenomanian" - follows a list of four formations and covers
        the Wealden-facies set as a whole rather than this one; the Barremian
        does not appear in it. What it gives precisely is the stratotype, "in
        the former Ste-Barbe pit of Bernissart where the iguanodontid dinosaurs
        were discovered".

Salt Wash:
  rank: member
  parent: Morrison
  period: [Late Jurassic]
  stages: [Kimmeridgian]
  references:
    - id: chure2020a
      notes: >
        Gives a holotype horizon in "the Salt Wash Member of the Upper Jurassic
        (Kimmeridgian) Morrison Formation", with referred specimens "in the
        stratigraphically equivalent lower part of the Morrison Formation in
        Wyoming".
    - id: chure2000a
      notes: >
        Independently gives "the Salt Wash Member of the Morrison Formation
        (Kimmeridgian, Jurassic)" at Dinosaur National Monument, the quarry
        being "Kimmeridgian in age (Kowallis et al. 1998)".
    - id: carrano2012a
      notes: >
        Pairs it with its neighbor above across the formation's span, "Salt
        Wash and Brushy Basin Members, Morrison Formation;
        Kimmeridgian-Tithonian".

Saltrio:
  rank: formation
  period: [Early Jurassic]
  stages: [Sinemurian]
  references:
    - id: benson2010b
      notes: >
        Records the material "from the Saltrio Formation (Sinemurian) near
        Saltrio" in Regione Lombardia, Italy.
    - id: carrano2012a
      notes: >
        Uses the same unit and age for the theropod informally called
        'Saltriosaurus'.
    - id: dalsasso2018a
      notes: >
        Describes it as a marine limestone "which deposited at the bottom of an
        open sea basin during Early Jurassic (Sinemurian) times", an age its
        ammonites support. The Saltriovenator bones lie in the bucklandi Zone of
        its lower banks, "the earliest portion of the early Sinemurian
        substage".

Santa Maria:
  rank: formation
  period: [Early Triassic, Middle Triassic, Late Triassic]
  stages: [Anisian, Ladinian, Carnian]
  references:
    - id: langer2004a
      notes: >
        Tabulates it as "?early Carnian" for Rio Grande do Sul.
    - id: colbert1970a
      notes: >
        Reviews an age that "has been regarded either as of Middle Triassic or
        Late Triassic": Caster (1952) had the formation covering a sequence
        "from the final stages of the Early Triassic through the Late Triassic",
        and Cox (1965) suggested it "might be of Ladinian age, antedating
        slightly the Carnian Ischigualasto Formation". Colbert weighs the
        cynodonts and pseudosuchians, favoring "a possible late Middle Triassic
        or Ladinian age", against the rhynchosaurs and dinosaurs, favoring "a
        possible Upper Triassic or Carnian age", and suggests placing the Santa
        Maria and Ischigualasto faunas "within the lower or Carnian phase of the
        Upper Triassic".
    - id: reig1963a
      notes: >
        Tentatively assigns the Middle Triassic fauna of Santa María in Brazil,
        with that of Tanganyika, to the upper Anisian or lower Ladinian, a
        little older than the Ischigualasto fauna it places in the upper
        Ladinian.
    - id: caster1952a
      notes: >
        Argues from South African correlation rather than from stages, working
        in Beaufort beds and the Cynognathus zone, and calls these rocks "the
        Santa Maria beds". Its one chronological remark points the other way
        from the Middle Triassic reading and rests on a single specimen: "A
        lone saurischian gives the Santa Maria fauna a late Triassic aspect."
    - id: cox1965a
      notes: >
        "All the specimens came from the Santa Maria Formation, of probably
        Middle Triassic age" - an epoch rather than a stage, and one that
        excludes the Carnian.
    - id: shubin1991a
      notes: >
        Places both of the formation's assemblage zones in the early Late
        Triassic: the Manda, Yerrapalli and Ischichuca formations "show
        affinities to the two early Late Triassic assemblages from the Santa
        Maria Formation of southern Brazil", its Dinodontosaurus and Scaphonyx
        zones, which it correlates with Romer's Zone B/C alongside the
        Ischigualasto Formation.

Santo Domingo:
  rank: formation
  period: [Late Triassic]
  stages: [Carnian]
  references:
    - id: hechenleitner2025a
      notes: >
        Reports "a new Late Triassic tetrapod assemblage from the Santo Domingo
        Formation in Quebrada Santo Domingo (QSD), a remote locality in the
        Andes of La Rioja province", and sets it among the Carnian tetrapod
        faunas. The same locality also exposes the Cretaceous Ciénaga del Río
        Huaco Formation.

Sao Khua:
  rank: formation
  period: [Early Cretaceous]
  stages: [Berriasian, Valanginian, Hauterivian, Barremian, Aptian]
  references:
    - id: buffetaut2009a
      notes: >
        Brackets it rather than dating it directly: the formation "can thus be
        considered as later than earliest Cretaceous and earlier than Aptian",
        which leaves Valanginian to Barremian. Records the
        "Valanginian–Hauterivian age" that Buffetaut and Suteethorn (1999)
        suggested, adding that the formation "may be somewhat younger
        (Barremian?)".
    - id: samathi2019a
      notes: >
        Narrows it within that, "Sao Khua Formation, probably upper Barremian,
        Lower Cretaceous", following the late Barremian age Tumpeesawan and
        colleagues (2010) drew from non-marine bivalves.
    - id: buffetaut1999a
      notes: >
        Brackets the unit by excluding both ends: "The Sao Khua Formation can
        therefore safely be placed in the Lower Cretaceous. Its exact age is
        still somewhat uncertain: it is probably younger than Berriasian and
        older than Aptian." Both limits are exclusive, so what is left is
        Valanginian to Barremian, and the whole is hedged by "probably". That
        span contains the narrower radiometric reading elsewhere on this entry
        rather than competing with it.
    - id: tumpeesuwan2010a
      notes: >
        Supports one stage, by faunal correlation: "The temporal distribution
        of this subgenus is limited to the Late Barremian Formations of Japan
        and Korea, thus we suggest a Late Barremian age for the Sao Khua
        Formation", the subgenus being Pseudohyria (Matsumotoina). That is a
        bivalve correlation to other basins, a different class of evidence from
        the detrital-zircon and magnetostratigraphic readings elsewhere on this
        entry, and it should be weighed as such rather than counted as another
        vote. Note the author's name is misspelled Tumpeesawan where Samathi
        and colleagues (2019) relay this work.
    - id: racey1996a
      notes: >
        Sets aside the Late Jurassic age that Buffetaut and Ingavat (1986) and
        Buffetaut and colleagues (1993) drew from the vertebrate fauna: "the Sao
        Khua Formation is probably Early Cretaceous in age rather than Late
        Jurassic", although the sauropods on their own "would indicate a Late
        Jurassic to Early Cretaceous age", the span the palynology of Hahn
        (1982) also gave. Bracketed below by palynomorphs from the underlying
        Phra Wihan Formation, which show it "is no older than Early Cretaceous
        in age", and above by the Aptian Khok Kruat Formation, "the Sao Khua
        Formation must fall within the age range Berriasian-Aptian".
    - id: hahn1982a
    - id: buffetaut1986b
      notes: >
        Dates the unit by the Phu Wiang vertebrates, a floodplain assemblage the
        paper finds "very similar to assemblages from well-known late Jurassic
        localities in western North America (Morrison Formation) and China
        (Shangshaximiao Formation of Sichuan)": "Its vertebrate fauna thus
        indicates a late Jurassic age for the Sao Khua Formation, which is in
        agreement with other palaeontological and magnetostratigraphical
        evidence". Names no stage.
    - id: buffetaut1993a
    - id: martin1994a
      notes: >
        "Magnetostratigraphic data suggest a somewhat older, Middle Jurassic,
        age", following Maranate and Vella (1982), against the Late Jurassic the
        formation "was usually thought to be ... on the basis of its vertebrate
        fauna" and the Early Cretaceous that palynology of the underlying Phra
        Wihan Formation implies. "Pending a clarification of its geological age,
        the Sao Khua Formation will be considered here as Late Jurassic to Early
        Cretaceous in age." The magnetostratigraphy credited here to Maranate and
        Vella in 1982 is their 1986 study, as this paper's own reference list
        gives it; Racey and colleagues (1996) report the same work and supply
        the stages, "Maranate and Vella (1986) suggested a Middle Jurassic
        (Bathonian-Callovian) age for the Sao Khua Fm on the basis of
        palaeomagnetic data". The 1982 report is attached to the Phu Kradung
        Formation where it is cited elsewhere.
    - id: jia2022a
      notes: >
        Puts a radiometric floor under the Early Cretaceous reading. Detrital
        zircon U-Pb gives "maximum possible depositional ages of approximately
        208, approximately 154, and approximately 140 Ma for the Nam Phong
        Formation, Phu Kradung Formation, and Sao Khua Formation,
        respectively, indicating that the Phra Wihan Formation and the
        overlying Sao Khua Formation are Early Cretaceous deposits", the 140 Ma
        peak "constraining the lower limit of its depositional age to the Early
        Cretaceous, which is generally consistent with previous interpretations
        based on paleontological data that it approximately belongs to the
        Berriasian to Barremian stages". The constraint is geochronological and
        not magnetostratigraphic: the paper's paleomagnetic samples from its
        three sites in this formation "did not yield meaningful paleomagnetic
        results".

Sauropod:
  rank: bed
  informal: true
  parent: Lameta
  period: [Late Cretaceous]
  references:
    - id: huene1933a
      notes: >
        Gives the section it belongs to at Bara Simla, running "Deccan trap,
        Upper sands, Upper limestone, Mottled nodular beds, Lower or Main
        Limestone, Green sand, and White clays of Jabalpur formation, with
        Sauropod bed, Ossiferous conglomerate, and Carnosaur bed indicated".
        The counterpart to the Carnosaur bed, from the same Matley scheme.
    - id: wilson2003b
      notes: >
        Records the attribution and its uncertainty: "Matley's research at Bara
        Simla suggested that the 'Sauropod bed' yielded the fossils", against an
        alternative reading placing them in the "'Ossiferous conglomerate'".
        Keeps the name in quotation marks, as the Carnosaur sources do.

Scollard:
  rank: formation
  period: [Late Cretaceous]
  stages: [Maastrichtian]
  references:
    - id: eberth2020a
      notes: >
        The base of the Scollard in the Red Deer River valley is placed at 66.88
        Ma, an age interpolated by Eberth and Kamo (2019), and coincides with
        the base of the R. collaris-P. reductus palynomorph biozone; a bentonite
        75 cm lower, in the uppermost Battle Formation, dates to 66.936 ± 0.047
        Ma by U-Pb CA-ID-TIMS. The Edmonton Group lithostratigraphic column
        splits the formation into a "Cretaceous portion of the Scollard
        Formation" and a "Paleogene portion of the Scollard Formation".
    - id: sankey2001a
      notes: >
        Microvertebrate collections from the Scollard are placed at 65-60 Ma, in
        a comparison drawn "from the Milk River (84-82.5 Ma), Oldman and
        Dinosaur Park (79.5-74 Ma), Horseshoe Canyon (72-67 Ma), and Scollard
        (65-60 Ma) formations", the figures taken from Eberth and Ryan (1992).
        Paleoecologically the upper Aguja tooth fauna of Big Bend, Texas, is
        read as closer to the lower Scollard than to units of its own age:
        Richardoestesia isosceles outnumbers R. gilmorei, Troodon and
        Dromaeosaurus are absent to rare, and pachycephalosaurids are present to
        common, a combination taken as the signature of drier, open habitat.
        Saurornitholestes cf. langstoni is present but slightly less abundant
        than in the Milk River and Horseshoe Canyon formations.
    - id: eberth2012a
      notes: >
        In the Red Deer River valley the basal sandstones of the Scollard cap
        the Tolman Bridge section, above the Battle Formation that drapes the
        Whitemud Member at the top of the Horseshoe Canyon Formation.
        Palynostratigraphy from 572 outcrop and core samples separates a lower
        Scollard whose strata have "reduced numbers of gymnosperms with greater
        numbers of angiosperms" from an "upper Scollard Formation where coals
        are abundant and conditions were judged independently to be wetter". Two
        palynomorphs of the underlying Carbon Member carry up into it:
        Wodehouseia spinata "becomes more common in the Battle and Scollard
        formations", and Scollardia trapaformis "has been rarely seen in the
        base of the Scollard Formation".
    - id: arbour2015a
      notes: >
        Gives an ankylosaur holotype from the left bank of the Red Deer River,
        Alberta, in the "Scollard Formation, 45.4m below K-Pg boundary,
        Maastrichtian".
    - id: arbour2017b
      notes: >
        Repeats the same locality and horizon for the same specimen.
    - id: pittman2020a
      notes: >
        Tabulates it in the troodontid fossil record, for Troodon, as Late
        Cretaceous to Paleogene and Maastrichtian to Paleocene in age.

Scunthorpe Mudstone:
  rank: formation
  period: [Early Jurassic]
  stages: [Sinemurian]
  references:
    - id: ezcurra2020a
      notes: >
        Gives the Sarcosaurus type horizon as the "Bucklandi zone of the
        Scunthorpe Mudstone Formation, Lias Group, Early Jurassic (lowermost
        Sinemurian)" at Barrow upon Soar, Leicestershire.

Sebeș:
  rank: formation
  variants: [Șard]
  period: [Late Cretaceous]
  stages: [Campanian, Maastrichtian]
  references:
    - id: turner2012a
      notes: >
        Gives the Balaur distribution as "Maastrichtian, Late Cretaceous, Sebes
        Formation, Alba County, Romania", writing the name without the
        diacritic.
    - id: díaz2025a
      notes: >
        Dates the formation as "uppermost Campanian–upper Maastrichtian", naming
        it "the major fossil-bearing unit" of the Transylvanian Basin.
    - id: csiki-sava2016a
      notes: >
        Rests the dating on stratigraphic position: the lower part conformably
        overlies upper Campanian marine deposits, so "the early Maastrichtian
        age of the transitional and continental beds from the lower Sebeș
        Formation ... is rather well established", and palynology from the lower
        part of the continental succession supports it, though "It is also
        conceivable that in the Petrești area their deposition already started
        during the latest Campanian". The estimated thickness of the unit makes
        it "possible that most of the Maastrichtian is represented", but the
        upper constraints are poor, the coarser-grained top being covered along
        erosional unconformities by much younger beds.

Sembar:
  rank: formation
  period: [Late Jurassic]
  stages: [Kimmeridgian]
  references:
    - id: malkani2003a
      notes: >
        Reports the "First Kimmeridgian (Late Jurassic) dinosaur fossils ...
        discovered in the lowest horizon of Sembar Formation just near the
        contact of Zidi/Chiltan Limestone", in the Karkh area of Pakistan.

Sengoku:
  rank: formation
  period: [Early Cretaceous]
  stages: [Hauterivian, Barremian]
  references:
    - id: carrano2012a
      notes: >
        Gives the Wakinosaurus tooth as from "the Sengoku Formation
        (Hauterivian-Barremian) of Fukuoka, Japan".
    - id: okazaki1992a
      notes: >
        The original description, giving the locality at Sengokukyo,
        Miyata-machi, Kurate Gun, Fukuoka Prefecture, and the horizon as
        "Sengoku Formation, Wakino Subgroup, Kwanmon Group. Neocomian (Early
        Cretaceous)."

Seonso Conglomerate:
  period: [Late Cretaceous]
  stages: [Santonian, Campanian]
  references:
    - id: huh2011a
      notes: >
        Gives "The Seonso Conglomerate (?Santonian - Campanian, Late Cretacous)
        of Boseong site 5 (southern coast of Korean Peninsula)". Uses no rank
        word with the name.
    - id: boyd2015a
      notes: >
        Independently places the Koreanosaurus material in "the Late Cretaceous
        Seonso Conglomerate of South Korea".

Serra da Galga:
  rank: formation
  parent: Bauru
  period: [Late Cretaceous]
  stages: [Campanian, Maastrichtian]
  dispute:
    summary: >
      Formation or member of the Marília. Cavalcanti and colleagues (2026) list
      it as one of four formations of the Bauru Group, alongside the Marília
      rather than inside it. Santucci and colleagues (2022) instead write
      "Serra da Galga Member, Marília Formation, Bauru Group, Maastrichtian".
      Under the formation reading the parent is the Bauru Group; under the
      other it would be the Marília.
  references:
    - id: cavalcanti2026a
      notes: >
        Lists it at formation rank among the Bauru Group's four formations.
    - id: santucci2022a
      notes: >
        Uses member rank under the Marília, with a Maastrichtian age.
    - id: silvajunior2022a
      notes: >
        Places it at formation rank in the Bauru Group, giving "Serra da Galga
        Formation (Bauru Group, Late Cretaceous)".
    - id: silvajunior2021a
      notes: >
        Calls the formation "almost consensually accepted as of
        Campanian-Maastrichtian age", citing Soares and colleagues (2021).
    - id: soares2020a
      notes: >
        The erecting paper, and the source of the rank the entry uses. It shows
        "how the previously named Serra da Galga and Ponte Alta members reveal
        a unique set of lithological, architectural, and genetic signatures
        that permits to separate them from the Marilia Formation", and proposes
        "a new lithostratigraphic classification for the unit ... the Serra da
        Galga Formation". The scheme it replaces is Barcelos (1984), who
        "organized the formation into three members: the Echapora Member in the
        southeastern and northwestern parts, and the Serra da Galga and Ponte
        Alta members restricted to the northeastern part", so the new formation
        takes in the former Serra da Galga and Ponte Alta while the Echapora
        stays with the Marilia. Sources that still use member rank are
        following the older scheme rather than disputing this one.
        It gives this unit no stage. Its only age statement is for the basin,
        which "evolved from the Coniacian to the Maastrichtian, based on
        biostratigraphic information ... and absolute dating of igneous
        intrusions close to the margins of the basin", and it contains no
        Campanian at all.

Shanyang:
  rank: formation
  period: [Late Cretaceous]
  references:
    - id: holtz2004a
      notes: >
        Tabulates the Shanyangosaurus type material against "Shanyang Formation
        (Shaanxi), People's Republic of China" and "Late Cretaceous" in separate
        cells, and in running text calls it "the mid- to late Maastrichtian
        Shanyang Formation of Shaanxi, China", attributing the occurrence to Xue
        and colleagues (1996), who give only the series.
    - id: zhao2008a
      notes: >
        Prints the locality "Niupanggou, Shanyang, Shanxi", the unit and "Early
        Cretaceous" on three stacked lines of a distribution field, giving the
        province as Shanxi where Xue and colleagues give Shaanxi. The same
        volume prints Early Cretaceous in the same form for the Hongtuling
        Formation; those are the two units erected in Xue and colleagues (1996),
        and in each entry the remarks immediately following cite Holtz and
        colleagues (2004), whose table gives this formation as Late Cretaceous.
    - id: xue1996a
      notes: >
        Gives a tyrannosaurid tooth from "Wujiagou, Shanyang, Shaanxi; Upper
        Cretaceous Shanyang Formation". Gives only the series.
    - id: horner2004a
      notes: >
        Tabulates Shantungosaurus giganteus as Campanian in a row whose
        occurrence cell names both the Wangshi Group of Shandong and this
        formation in Shaanxi, so the age is given across two units rather than
        for this one.

Shawan:
  rank: member
  parent: Lufeng
  period: [Early Jurassic]
  stages: [Hettangian]
  references:
    - id: liang2024a
      notes: >
        Gives "Shawan member of the lower Lufeng Formation (Hettangian". This
        is the lower of the pair formalized by Fang and colleagues (2000) out of
        the informal Dark Purple Beds, the upper being the Zhangjiawa.
    - id: xing2012b
      notes: >
        Gives the Sinosaurus specimen ZLJT01 as from "Lower Jurassic, Shawan
        member, Lufeng Formation (Lower Lufeng Formation)", the "lowermost
        (Shawan member) portion" of the formation.
    - id: fang2000a
      notes: >
        The erecting paper, which subdivides the region's red beds by "erecting
        the following nomenclature", giving "the Lufeng Fm. (including the
        Shawan and Zhangjia'ao members)" and reducing the earlier formations to
        member status. Its type section is "at Shawan and Dahuangtian, Lufeng
        Co.". It names no international stage anywhere, working only in J1, J2
        and J3, so the Hettangian on this entry is not from here. Both spellings of the companion member appear
        here: Zhangjia'ao five times, in the list of erected names, two table
        rows, the naming history and the paper's own descriptive prose; and
        Zhangjiawa once, as the formal definition header. Frequency favors the
        first and position the second.

Shaximiao:
  rank: formation
  period: [Middle Jurassic, Late Jurassic]
  stages: [Bajocian, Bathonian, Callovian, Oxfordian, Kimmeridgian, Tithonian]
  variants: [Dashanpu]
  dispute:
    summary: >
      The age is in flux and the lower and upper parts are dated separately.
      Mannion and colleagues (2019) record that "Wang et al. (2018) recently
      dated the Shaximiao (=Dashanpu) Formation as Oxfordian, rather than the
      late Middle Jurassic (Bathonian-Callovian) age that has been the consensus
      for some time", and say outright that "the ages of several Jurassic
      stratigraphic units from China are in a state of flux". Sánchez-Fenollosa
      and colleagues (2025) split it, giving the lower Shaximiao as
      "Bathonian-early Oxfordian" and the upper as "?Kimmeridgian-?Tithonian".
      Xiashaximiao and Shangshaximiao are the lower and upper parts rather than
      spellings: xia and shang are Chinese for lower and upper.
  references:
    - id: mannion2019a
      notes: >
        Records Wang and colleagues' (2018) Oxfordian redating and the consensus
        it displaces, "the late Middle Jurassic (Bathonian-Callovian) age that
        has been the consensus for some time", and gives Dashanpu as an
        equivalent name.
    - id: sánchez-fenollosa2025a
      notes: >
        Dates the two parts separately, lower "Bathonian-early Oxfordian" and
        upper "?Kimmeridgian-?Tithonian", both hedged in the source.
    - id: sadleir2008a
      notes: >
        Uses "Lower Shaximiao Formation (Bajocian or Bathonian-Callovian)", the
        oldest bound among the sources cited.
    - id: li2011a
      notes: >
        Argues that "the entire Shaximiao Formation is of Bajocian-Callovian age
        (middle-late part of Middle Jurassic)", putting the upper member "of
        Middle Jurassic age (Bathonian-Callovian)" in the abstract but "namely
        the Bajocian-Bathonian" in the discussion. It records the reading it
        argues against: the invertebrates placed the formation in the Middle
        Jurassic, "although vertebrate fossils tended to indicate a Late
        Jurassic age for the upper member of the Shaximiao Formation".
    - id: buffetaut1999a
      notes: >
        Treats the lower and upper parts as separate formations of different
        ages, contrasting the Sao Khua sauropods with "the increasingly well
        known sauropods from the Middle Jurassic Xiashaximiao Formation and the
        Late Jurassic Shanshaximiao Formation of China".

Shengjinkou:
  rank: formation
  parent: Tugulu
  period: [Early Cretaceous]
  stages: [Valanginian]
  references:
    - id: zheng2023a
      notes: >
        Places it third in the Tugulu Group's ascending order and dates it on
        clam shrimp, which "places the upper Shengjinkou Formation within the
        Valanginian Stage". Its clam shrimp and sporopollen fossils, together
        with siyuichthyid fish, "indicate an Early Cretaceous biostratigraphic
        age".
    - id: mannion2026a
      notes: >
        Independently gives "the Shengjinkou Formation of north-west China,
        dated to the upper Valanginian".

Shishugou:
  rank: formation
  period: [Middle Jurassic, Late Jurassic]
  stages: [Aalenian, Bajocian, Bathonian, Callovian, Oxfordian]
  references:
    - id: moore2020a
      notes: >
        Calls it the "Middle-Late Jurassic Shishugou Formation" and splits it by
        level: Klamelisaurus from the lower part is "late Callovian" while
        Mamenchisaurus sinocanadorum "was collected from its middle or upper
        beds (Oxfordian".
    - id: moore2018a
      notes: >
        Places its material "within the earliest Oxfordian": radiometric ages of
        162.2 ± 0.2 and 159.7 ± 0.3 Ma for the T-1 and T-BW tuffs at Wucaiwan
        put "the Bellusaurus quarry, and much of the Shishugou Formation, within
        the earliest Oxfordian (early Late Jurassic)". Sets that against
        "earlier studies that considered the Shishugou Formation to be as old as
        Aalenian in age", following Upchurch and Barrett (2005).
    - id: eberth2001a
      notes: >
        Splits its fauna by age, following Dong (1992): "The Middle Jurassic
        vertebrate assemblage from the Shishugou Formation in northeastern
        Junggar consists of fish, lungfish, turtles, crocodilians, amphibians,
        small sauropods, theropods, hypsilophodontids, ankylosaurs, therapsids,
        and lizards", while "The Late Jurassic assemblage from the Shishugou
        Formation is less diverse". The Shishugou Megasequence, which at
        Huoxiaoshan is made up of the 450-m-thick formation alone, "is regarded
        as Bathonian to Oxfordian in age".
    - id: dong1992a

Sichakou:
  rank: member
  parent: Huajiying
  period: [Early Cretaceous]
  stages: [Hauterivian]
  references:
    - id: xing2020a
      notes: >
        Places it and the Qiaotou as the two members of the lower Huajiying
        Formation in the Sichakou Basin of Fengning Autonomous County, Hebei:
        vertebrate fossils occur "in the lower part of the formation (Sichakou
        and Qiaotou members) dated by 40Ar/39Ar to the weighted mean age of
        130.7 Mya". Gives the Protopteryx horizon in the lacustrine shales as
        "Sichakou member (Hauterivian, Lower Cretaceous)".
    - id: jin2008a
      notes: >
        Uses the fuller name, "Sichakou Sedimentary Member of the Early
        Cretaceous Huajiying Formation in the Sichakou basin, Fengning, Hebei",
        and sets it above the First Volcanic Member of the same formation.

Sierra Barrosa:
  rank: formation
  parent: Neuquén
  period: [Late Cretaceous]
  stages: [Turonian, Coniacian]
  references:
    - id: filippi2019a
      notes: >
        Puts the Kaijutitan holotype in the "Sierra Barrosa Formation (upper
        Coniacian, Upper Cretaceous)".
    - id: salgado2009a
      notes: >
        Uses the same words for a locality rather than the unit, placing the
        "Sierra Barrosa locality (Anacleto Formation, Late Cretaceous, early
        Campanian". The formation takes its name from the place, so the string
        appears in both roles and at different ages.
    - id: garrido2010a
      notes: >
        Erects the unit as Sierra Barrosa Formation, nom. nov., for the
        sandstones between the Los Bastos and Plottier Formations that Herrero
        Ducloux (1938, 1939) had called the "Upper Portezuelo". With no absolute
        dating available, "Based on stratigraphic relations, this unit is
        assigned to the Middle-Late Coniacian."
    - id: coria2016a
      notes: >
        The Murusraptor holotype comes from "the Upper Cretaceous Sierra Barrosa
        Formation (Turonian-Coniacian) of Neuquén Province, Argentina", the unit
        placed in the Río Neuquén Subgroup of the Neuquén Group; the horizon
        given for the specimen itself narrows this to "Sierra Barrosa Formation
        (Coniacian)".

Smoky Hill Chalk:
  rank: member
  parent: Niobrara Chalk
  period: [Late Cretaceous]
  stages: [Coniacian, Santonian, Campanian]
  references:
    - id: carpenter2007b
      notes: >
        Gives "Smoky Hill Chalk, Niobrara Formation, Cretaceous, Coniacian".
    - id: pittman2020a
      notes: >
        Names it as the "Smoky Hill Chalk Member of the Niobrara Formation" and,
        after Bell and Chiappe (2015), dates it "late Coniacian–early
        Campanian", a range that takes in the Santonian.
    - id: bell2015b
      notes: >
        A species-level phylogeny that does not name this member; the Niobrara
        appears once in some 67,000 characters. It contributes nothing to the
        entry's age.
    - id: clarke2004a
      notes: >
        "The entire Smoky Hill Chalk Member of the Niobrara Formation is upper
        Coniacian–lower Campanian in age (Stewart et al., 1990)", and "The top
        of the Smoky Hill Chalk Member, close to Marker Unit 23 of Hattin
        (1982), is in the early Campanian". Within the member, Stewart (1990)
        put the interval containing Marker Units 8 to 10 of Hattin (1982) in the
        upper Santonian, so the overlying Marker Units 15 to 20, the source of
        nearly all the fossil vertebrates after Bennett (1990), must be "at the
        earliest, from later in the upper Santonian through the early
        Campanian".
    - id: stewart1990b
    - id: stewart1990a
    - id: hattin1982a
      notes: >
        Works out the age in the Kansas type area from the Western Interior
        inoceramid and ammonite zones, converting each zone to a stage: "Strata
        of the Smoky Hill Chalk Member (Coniacian-Campanian) are exposed
        extensively in the type area, where 12 key sections are the basis for a
        composite section that is 181.8 m (596.3 ft) thick." The base falls at
        the bottom of the Inoceramus (Volviceramus) grandis Range Zone, which
        "places the contact close to the Lower/Upper Coniacian boundary", and
        the highest, fossil-poor beds "are also assignable to the Lower
        Campanian".
    - id: bennett1990a

Snow Hill Island:
  rank: formation
  period: [Late Cretaceous]
  stages: [Campanian, Maastrichtian]
  dispute:
    summary: >
      Which formation contains the Gamma Member is not settled. Soto-Acuña and
      colleagues (2024) give the "Gamma Member of Snow Hill Island Formation";
      Coria and colleagues (2011) place the same member in "the Gamma Member of
      the Santa Marta Formation (Marambio Group)". So the two names compete for
      the unit above the member rather than for the member itself.
  references:
    - id: motta2025a
      notes: >
        Gives "Snow Hill Island Formation (Cape Lamb Member, Lower
        Maastrichtian".
    - id: pittman2020a
      notes: >
        Tabulates the formation as Late Cretaceous, Maastrichtian.
    - id: soto-acuña2024a
      notes: >
        Gives the "Gamma Member of Snow Hill Island Formation (upper
        Campanian)".
    - id: coria2011a
      notes: >
        A one-page conference abstract that does not name this formation and
        assigns the material elsewhere: the Antarctopelta holotype is placed in
        "lower levels of the Gamma Member of the Santa Marta Formation
        (Marambio Group, upper Campanian)". Neither of those units is in the
        registry.

Sobral:
  rank: member
  parent: Farta Pão
  period: [Late Jurassic]
  stages: [Kimmeridgian, Tithonian]
  references:
    - id: mocho2014a
      notes: >
        Gives the age as "upper Kimmeridgian to lower Tithonian", and records
        that the demotion to member is recent: Schneider, Fürsich and Werner
        (2009) "included as members of the Farta Pão Formation the previous
        Sobral, Arranhó ..., and Freixial Formations". Still writes "The Sobral
        Member or Formation" for the older literature.
    - id: mateus2017a
      notes: >
        "the Praia Azul/Sobral Member can be considered with confidence as
        latest Kimmeridgian to earliest Tithonian", pairing it with the Praia
        Azul.
    - id: antunes2003a
      notes: >
        Calls it the "Sobral Unit" and dates it Tithonian: the Lusotitan horizon
        is "Late Jurassic, Tithonian, Sobral Unit", and the Lourinhanosaurus
        material is "Lower Tithonian, Sobral Unit".
    - id: schneider2009a
      notes: >
        The paper that makes this a member and places it: it proposes "four
        members for the Farta Pao formation", of which "The largely synchronous
        Sobral, Arranho I, and Arranho II members are overlain by the late
        Early to Late Tithonian Freixial Member", with the Arranho I marking
        the Kimmeridgian-Tithonian boundary and the formation running latest
        Kimmeridgian to latest Tithonian. It also records the rival history a
        reader is likely to meet: earlier work included the Sobral in the Farta
        Pao, while Pena dos Reis and colleagues (1996) made it a basal member
        of the Lourinha Formation instead.

Solnhofen Lithographic Limestone:
  rank: formation
  period: [Late Jurassic]
  stages: [Kimmeridgian, Tithonian]
  variants: [Altmühltal, Solnhofen Limestone, Solnhofen Formation]
  references:
    - id: chen1998a
      notes: >
        Dates it "(Early Tithonian)" while comparing the Chinese bird-bearing
        beds against it.
    - id: chiappe2010a
      notes: >
        Gives the German name alongside, "the Solnhofen Lithographic
        Limestones (Solnhofener Plattenkalk)", and places the Stark Quarry top
        limestones, uppermost Kimmeridgian, slightly older than them.
    - id: holtz2004a
      notes: >
        A reference work, hedging between two stages for the Compsognathus type
        horizon, "the Kimmeridgian or basal Tithonian Solnhofen Lithographic
        Limestone of Jachenhausen". Not unioned, since the hedge is between
        stages rather than across them.
    - id: pittman2020a
      notes: >
        Equates the traditional name with the Altmühltal Formation, which is
        entered separately under that name, and tabulates the unit as "Late
        Jurassic", "Tithonian".
    - id: foth2025a
      notes: >
        Dates the southern Franconian "partially laminated, partially silty
        limestones of late Kimmeridgian to early Tithonian age, commonly
        referred to as the 'Solnhofen limestone'", and states that the base of
        the Altmühltal Formation, which holds the Solnhofen limestone sensu
        stricto, "begins with the latest Kimmeridgian".

St. Mary River:
  rank: formation
  period: [Late Cretaceous]
  stages: [Campanian, Maastrichtian]
  references:
    - id: brown2015a
      notes: >
        Gives "St. Mary River Formation (Maastrichtian".
    - id: voris2020a
      notes: >
        Spans the boundary, treating the formation "of southernmost Alberta and
        northern Montana" as potentially recording taxa that "persisted from the
        late Campanian into the early Maastrichtian".
    - id: brown1942a
      notes: >
        Gives the Leptoceratops cerorhynchus horizon as "St. Mary River
        formation, Upper Cretaceous, near Buffalo Lake, Blackfeet Indian
        Reservation, Montana", the skeleton coming from "the lower part of the
        St. Mary River formation".
    - id: pittman2020a
      notes: >
        Dates it jointly with two other Alberta units, listing Troodon material
        from "the Campanian-Maastrichtian Wapiti, Horseshoe Canyon and St. Mary
        River formations of Alberta, Canada".

Stewartby:
  rank: member
  parent: Oxford Clay
  period: [Middle Jurassic]
  stages: [Callovian]
  references:
    - id: barsbold1997a
      notes: >
        Records the formalization, the three units "traditionally been termed
        the lower, middle, and upper Oxford Clay" having been "formally renamed
        by Cox et al. (1992) as the Peterborough, Stewartby, and Weymouth
        Members". Dates the member in describing it: "The Stewartby Member
        (Callovian) is dominated by pale to medium gray, silty, calcareous,
        blocky mudstones".
    - id: barron2012a
      notes: >
        Lists it among the formal subdivisions of the formation, between the
        Peterborough Member below and the Weymouth Member above.

Straw-yellow Sandstone:
  rank: member
  parent: Wangjiashan
  period: [Middle Jurassic]
  stages: [Bathonian]
  references:
    - id: ning2024a
      notes: >
        Considers it late Bathonian on megafossil plants, palynoflora and the
        invertebrates of the overlying Oil Shale Member, the Baiyinosaurus
        material coming "from the upper part of the Straw-yellow Sandstone
        Member ..., whose age is considered to be Middle Jurassic, late
        Bathonian". It "was deposited mainly in a lake deltaic setting, and the
        succession is characterized by its straw-yellow colour".

Sudmoor Point Sandstone:
  rank: bed
  parent: Wessex
  period: [Early Cretaceous]
  stages: [Hauterivian, Barremian]
  references:
    - id: longrich2024c
      notes: >
        Dates the exposures, which "probably date to around 125-126 Ma", the
        specimen being "probably either earliest Barremian or latest Hauterivian
        in age". The paper hedges between two stages rather than giving a range
        across them.
    - id: lockwood2021a
      notes: >
        Fixes the stage boundary relative to the locality, "The base of the
        Barremian stage within the Wessex Formation lies west of Sudmoor Point
        and has been dated to 126.5 Ma".

Suining:
  rank: formation
  period: [Late Jurassic, Early Cretaceous]
  stages: [Aptian]
  references:
    - id: wang2019c
      notes: >
        Dates it by zircon: "our new and more precise zircon U-Pb zircon age
        data allow novel correlation of the Suining Formation with other Lower
        Cretaceous (Aptian) units". Records the older dating it replaces, that
        the formation "was proposed to be Late Jurassic based on lateral
        correlations of the bivalve, Estheria, ostracod and vertebrate
        assemblages", and still labels it "Upper Jurassic Suining Formation" in
        its map, following "the traditional classification of these formations".
        Records that Mamenchisaurus anyuensis "is known from the top of the
        Suining Formation and the bottom of the Penglaizhen Formation in Anyue
        County".
    - id: moore2020a
      notes: >
        Places it in the succession, the formation "overlies the Shaximiao
        Formation and has yielded Qijianglong and M. anyuensis". This is the
        date that makes the Mamenchisaurus species span an implausible interval,
        recorded on that genus's dispute.

Sunjiawan:
  rank: formation
  period: [Early Cretaceous, Late Cretaceous]
  stages: [Albian, Cenomanian, Turonian]
  references:
    - id: lü2007b
      notes: >
        Gives the Crichtonsaurus benxiensis horizon as "Sunjiawan Formation
        (Cenomanian-Turonian)", deferring to Dong (2002) for the formation's
        age.
    - id: xing2024a
      notes: >
        Sets it beside its correlatives at the same age, "Sunjiawan Formation,
        Cenomanian", against the Liangtoutang and Baynshire.
    - id: jiang2006a
      notes: >
        Tentatively makes the formation late Albian: from K-Ar ages on the
        underlying Zhanglaogongtun Formation and the age of the Fuxin Formation
        below it, "the Zhanglaogongtun and the overlying Sunjiawan formations
        are tentatively considered as late Albian in age in this paper."
    - id: dong2002a
      notes: >
        Places Crichtonsaurus bohlini in the "basal purplish-red coarse sandy
        conglomerate bed of the Sunjiawan Formation, early Late Cretaceous", and
        says the fossil "supports the Late Cretaceous age of this unit
        (Cenomanian-Turonian)".
    - id: averianov2020a
      notes: >
        Places Borealosaurus in the "Lower Cretaceous (Albian) Sunjiawan
        Formation of Liaoning Province, China".

Sustut:
  rank: group
  period: [Late Cretaceous]
  stages: [Campanian, Maastrichtian]
  references:
    - id: arbour2019a
      notes: >
        Names the group by way of the units inside it, giving the Ferrisaurus
        horizon as "Tatlatui Member, Tango Creek Formation, Sustut Group" in
        British Columbia. Dates that site by pollen: the presumed holotype
        locality yielded "the Maastrichtian marker taxon Pseudoaquilapollenites
        bertillonites, indicating an age of approximately 68.2–67.2 Ma for the
        site".

Syuksyuk:
  rank: formation
  period: [Late Cretaceous]
  stages: [Turonian, Coniacian, Santonian, Campanian]
  references:
    - id: vereshchagin1979a
      notes: >
        The dictionary entry. "Named after Syuksyuk settlement, Pritashkent
        district, Central Asia. G. A. Belenky, 1966", with the stratotype "at
        Syuksyuk settlement, 10 km east of Dzhilga railway station". It "lies on
        the Dzhamsugum Formation and is overlain by the Darbazin Formation.
        Belongs to the Upper Turonian-Coniacian", and most of it corresponds to
        the informally named Dinosaur Horizon.
    - id: nessov1995a
      notes: >
        Uses the name at formation rank, and carries the unit later than the
        dictionary does. Kyrkkuduk I, the Jaxartosaurus locality on the northern
        foot of the Alymtau Ridge, is "Syuk-Syuk Formation. Upper Cretaceous,
        Santonian." At the Syuk-Syuk locality itself the horizon is the "Lower
        part of the Darbazin Formation (Rozhdestvensky, 1964a). Syuk-Syuk
        Formation (Stratigraphic Dictionary, 1979), rather than the Beleutin
        Formation", also Santonian. An undescribed theropod is placed "from the
        Santonian - lower Campanian of Syuk-Syuk, Kazakhstan".
    - id: nessov1997a
      notes: >
        Shows how hard the contact with the Darbazin is to fix, moving beds
        both ways at two localities. At Darbaza the beds are "Syuksyukian
        Formation or, more likely, lower part of the Darbazinian Formation,
        Santonian or Santonian-Lower Campanian"; at Kazgurt they are "Upper
        part of the Syuksyukian Formation (Suslov, 1987), Santonian", with the
        rival attribution called erroneous rather than this one.
    - id: rozhdestvensky1964a
      notes: >
        Assigns the dinosaur-bearing band at this site to "the lower part of
        the Darbaza Suite ... no later than the Upper Turonian", on Belenky's
        authority, and places the locality 45 km north of Tashkent. The
        attribution is superseded: Nessov (1995) puts the same bed in this
        formation instead, and the Turonian is a ceiling rather than a
        determination.

Sânpetru:
  rank: formation
  variants: [Sînpetru]
  period: [Late Cretaceous]
  stages: [Campanian, Maastrichtian]
  references:
    - id: augustin2023a
      notes: >
        Gives "Sînpetru Formation (Maastrichtian", spelling the unit with î.
    - id: díaz2025a
      notes: >
        Also spells it Sînpetru, and sets it beside its neighbor: "Sînpetru
        Formation (Maastrichtian) in the central part of the basin; the partly
        volcanoclastic Densus-Ciula Formation (Maastrichtian". The name is also
        spelled Sânpetru, following the Romanian orthographic reform that
        replaced î with â in this position; both read primaries use the older
        form, so the two spellings are current side by side in the literature.
    - id: godefroit2009a
      notes: >
        Places the Nălaţ-Vad locality, discovered in 2002, in this formation in
        the Haţeg Basin, dating the unit "(Maastrichtian, Late Cretaceous)", and
        reports palaeomagnetic work by Panaiotu and Panaiotu (2002) suggesting
        that "this formation should entirely belong to the lower Maastrichtian".
    - id: panaiotu2002a
    - id: csiki-sava2016a
      notes: >
        Magnetostratigraphic sampling of the western bank of the Sibișel Valley,
        after Panaiotu and Panaiotu (2010), "definitively established a
        dominantly early to early late Maastrichtian age for the entire Sibișel
        Valley succession, well constrained to the time interval between C32N1
        and the basalmost part of C30R through identification of several
        magnetic reversals", so that the stratotype section "represents roughly
        the time interval between 71.6 and 68.2 Ma, and currently can be
        considered the most precisely dated continuous succession of the
        continental uppermost Cretaceous from Transylvania". The succession on
        the eastern bank is unconstrained and is provisionally correlated with
        the lower-middle part of the left side, "and thus early to earliest late
        Maastrichtian in age". At the upper middle to terminal part of the
        stratotype, palynologically calibrated magnetostratigraphy "supports an
        early late Maastrichtian age".
    - id: panaiotu2010a
      notes: >
        Magnetostratigraphy of ten localities along the Sibișel Valley starts
        the lower member earlier than had been assumed: with the
        Campanian-Maastrichtian boundary at 70.6 ± 0.5 Ma, the correlation
        "implies the starting of the sedimentation in this part of the Sânpetru
        Formation during the Late Campanian, earlier than it was usually
        assumed", so that "the Sânpetru formation is Late
        Campanian–Maastrichtian in age". That turns on where the boundary is
        placed: at 72.5 ± 0.5 Ma "the Sânpetru Formation developed only inside
        the Maastrichtian".

São José do Rio Preto:
  rank: formation
  parent: Bauru
  period: [Late Cretaceous]
  stages: [Santonian, Campanian]
  references:
    - id: delcourt2018b
      notes: >
        Gives "the São José do Rio Preto (SJRP) Formation (Bauru Group),
        Santonian", the age resting "on the stratigraphy and faunal
        association".
    - id: navarro2022a
      notes: >
        Gives "the Upper Cretaceous (Santonian-Campanian) São José do Rio Preto
        Formation of Bauru Basin".
    - id: fernandes2000a
      notes: >
        The revision that erected it, listing the Bauru Group as comprising the
        "Uberaba, Vale do Rio do Peixe, Araçatuba, São José do Rio Preto,
        Presidente Prudente and Marília formations".

Süntel:
  rank: formation
  period: [Late Jurassic]
  stages: [Kimmeridgian]
  references:
    - id: zuo2017a
      notes: >
        The dedicated sedimentology of the Kimmeridgian carbonate ramp of the
        Lower Saxony Basin, covering "the Lower to Middle Süntel Formation"
        above the Korallenoolith Formation, their boundary diachronous and
        "corresponding to the Oxfordian-Kimmeridgian boundary or Early
        Kimmeridgian". The formation is constrained by the ostracod genus
        Macrodentina, ostracod zones 9 to 12 marking the Lower Süntel in the
        Langenberg section.
    - id: hornung2012a
      notes: >
        Gives the outcrop pattern in Lower Saxony, the unit buried across wide
        areas but exposed in local uplifts including the southeastern Süntel,
        the Deister, the Bückeberge and the Hils mountains.

Tadi:
  rank: bed
  parent: Itombe
  period: [Late Cretaceous]
  stages: [Turonian]
  references:
    - id: mateus2011a
      notes: >
        Gives the Angolatitan horizon as "Tadi Beds, Itombe Formation, Late
        Turonian (around 90 M.a.), Late Cretaceous", the beds being "about 50 m
        thick" and dated late Turonian on their fish fauna, after an original
        reading that made them the base of the 'Senonian' (= Coniacian). Antunes
        and Cappetta (2002) place them in the Itombe Formation.
    - id: antunes2002a

Talarn:
  rank: formation
  parent: Tremp
  period: [Late Cretaceous]
  stages: [Maastrichtian]
  references:
    - id: serrano2021a
      notes: >
        Carries the formation in the "upper Maastrichtian", and dates the Sant
        Romà d'Abella strata inside it by magnetostratigraphy: "This locality
        corresponds to the upper Maastrichtian (C29r chron) strata of the Talarn
        Formation".
    - id: dallavecchia2020a
      notes: >
        Gives "the uppermost Maastrichtian Talarn Formation, which originated
        during the magnetochron C29r".
    - id: prieto-márquez2022a
      notes: >
        Places it in its group and dates it by magnetostratigraphy: "the Talarn
        Formation of the Tremp Group and isotopic, magnetostratigraphic, and
        biochronological calibrations indicate that the locality correlates with
        the middle part of the C29r magnetochron (latest Maastrichtian". This is
        also the statement that settles the Tremp's rank. The unit does not
        reach the western Tremp Syncline, where the coarser `group: Tremp` is
        the correct resolution; and it straddles the K-Pg, running from the
        latest Maastrichtian into the Danian, so the name alone does not fix a
        dinosaur-bearing horizon's age. About 3.85 Ma of section is missing
        between it and the Conques.

Tangbian:
  rank: formation
  parent: Guifeng
  period: [Late Cretaceous]
  stages: [Campanian]
  references:
    - id: zhu2024a
      notes: >
        Describes Huaxiazhoulong from "the Upper Cretaceous Tangbian Formation
        of Jiangxi Province, southern China", and states, after Xi and
        colleagues (2019, 2021), that the "Tangbian Formation was deposited in
        Campanian".
    - id: xing2024a
      notes: >
        Places it second in the Guifeng Group, between the Hekou and the
        Lianhe.

Tango Creek:
  rank: formation
  parent: Sustut
  period: [Late Cretaceous]
  stages: [Campanian, Maastrichtian]
  references:
    - id: arbour2019a
      notes: >
        Reassigns the Ferrisaurus skeleton, which "is likely from the Tango
        Creek Formation, rather than the Brothers Peak Formation as originally
        reported", on new stratigraphic and palynological data.
    - id: ryan2023a
      notes: >
        Gives the span, the Tatlatui Member of the formation straddling "the
        Campanian-Maastrichtian boundary in this part of the Sustut Basin".

Tatlatui:
  rank: member
  parent: Tango Creek
  period: [Late Cretaceous]
  stages: [Campanian, Maastrichtian]
  references:
    - id: arbour2019a
      notes: >
        Gives the Ferrisaurus horizon as "Tatlatui Member, Tango Creek
        Formation, Sustut Group", from the confluence of the Sustut River and
        Birdflat Creek.
    - id: ryan2023a
      notes: >
        Places the member across "the Campanian-Maastrichtian boundary in this
        part of the Sustut Basin".

Taveiro:
  rank: formation
  period: [Late Cretaceous]
  stages: [Campanian, Maastrichtian]
  references:
    - id: antunes1991a
      notes: >
        Gives the Taveirosaurus type horizon as "Sands and clays of Taveiro,
        Late Campanian ? and Maestrichtian (the new taxon is Maestrichtian)", in
        Portugal: Maastrichtian, with a questioned late Campanian part. The
        Euronychodon entry repeats the age for the "Clays and sands of Taveiro".

Taynton Limestone:
  rank: formation
  parent: Great Oolite
  period: [Middle Jurassic]
  stages: [Bathonian]
  variants: [Taynton Stone]
  references:
    - id: barron2012a
      notes: >
        The formal entry, giving the parent as the Great Oolite Group and the
        age as "Bathonian, Progracilis" zone, and the original name: "Name
        introduced (as Taynton Stone) by Woodward ... for a 'freestone' within
        the Great Oolite sequence". Records that the "Stonesfield Slate Beds"
        "are now known to lie at three levels within the ooidal limestone beds
        of the Taynton Limestone Formation, necessitating their continued
        informal status".
    - id: benson2010c
      notes: >
        Gives the Megalosaurus type horizon as "one or more discrete horizons
        ('Stonesfield Slate' ...) within the Taynton Limestone Formation (middle
        Bathonian Procerites progracilis ammonite zone) of Stonesfield,
        Oxfordshire".
    - id: carrano2012a
      notes: >
        Places the Megalosaurus bucklandii type series in the "'Stonesfield
        Slate' facies of the Taynton Limestone Formation", and gives the
        Stonesfield ilium of Iliosuchus as from the "Taynton Limestone
        Formation, Bathonian, Middle Jurassic, England".

Tecovas:
  rank: formation
  parent: Dockum
  period: [Late Triassic]
  stages: [Carnian, Norian]
  references:
    - id: baron2018c
      notes: >
        Gives the Caseosaurus holotype as from "Tecovas Formation, Crosby
        County, Texas, USA; Carnian, Late Triassic".
    - id: hunt1998a
      notes: >
        Uses member rank instead, "Tecovas Member of Dockum Formation", for
        Crosby County, on the same Chinle-and-Dockum rank question as the Bull
        Canyon, Cooper Canyon, Colorado City and Rock Point.
    - id: novas2021a
      notes: >
        Places the "Caseosaurus crosbyensis" holotype in "the upper
        Carnian–lower Norian Tecovas Member (correlated with the Blue Mesa
        Member of the Chinle Formation, constrained to 225–218 Ma based on
        radioisotopic datings ...) of the Dockum Group", using member rank there
        but "Tecovas Formation/lower Cooper Canyon Formation" elsewhere.

Tegama:
  rank: group
  period: [Early Cretaceous, Late Cretaceous]
  stages: [Aptian, Albian, Cenomanian]
  references:
    - id: sereno1999a
      notes: >
        Gives group rank and the survey subdivision laid over it: at Gadoufaoua
        "the Tegama Group was divided into eight GAD levels", of which "GAD 5
        corresponds with the upper part of the Elrhaz Formation and the lower
        part of the Echkar Formation". States no stage for the group as a whole.

Tendaguru:
  rank: formation
  period: [Late Jurassic, Early Cretaceous]
  stages: [Oxfordian, Kimmeridgian, Tithonian, Berriasian, Valanginian, Hauterivian]
  references:
    - id: mannion2019a
      notes: >
        Works only in the Late Jurassic part, writing of "The Late Jurassic
        (Kimmeridgian-Tithonian) Tendaguru Formation" and, in its opening
        sentence, of "The Late Jurassic section of the Tendaguru Formation of
        southeastern Tanzania". Every sauropod treated is placed in the "Upper
        Dinosaur Member (Upper Saurian Bed), Tendaguru Formation; Tithonian,
        Late Jurassic", so the narrower age is the dinosaur-bearing interval
        rather than the formation's full span.
    - id: schrank2005a
      notes: >
        Dates the unit by its dinoflagellate cysts, recovered from "the
        dinosaur-bearing Tendaguru Beds (Upper Jurassic-Lower Cretaceous)", and
        resolves four assemblages running from "the Rigaudella
        aemula-Chlamydophorella wallala assemblage from the Nerinea Bed
        (Oxfordian to Kimmeridgian)" up to the Trigonia schwarzi Bed, for which
        the evidence "indicates a late Valanginian to Hauterivian age". The many
        Callovian records in the paper are ranges of individual species in
        Australia, Europe and elsewhere rather than ages for these beds.
    - id: bussert2009a
      notes: >
        Raises the Tendaguru Beds to formation rank and dates the unit end to
        end: "The age of the whole formation apparently ranges at least from the
        middle Oxfordian to the Valanginian through Hauterivian or possibly
        Aptian." In the type area that falls into a Late Jurassic lower part,
        "from the middle Oxfordian through the Tithonian (Lower to Upper
        Dinosaur Member)", and an Early Cretaceous top, "from the Valanginian
        through Hauterivian or possibly Aptian (Rutitrigonia bornhardti-schwarzi
        Member)". A Callovian age appears only as an older opinion of Dietrich's
        for the Lower Dinosaur Member, and the Jurassic/Cretaceous boundary
        within the formation is left "as yet uncertain".
    - id: rauhut2011a
      notes: >
        Gives the full span, "Tendaguru Formation, Tanzania (Oxfordian-
        Tithonian". Narrower readings exist: Upchurch and colleagues (2004)
        tabulate it as Kimmeridgian.
    - id: upchurch2004a

Terra Cotta:
  rank: member
  parent: Dakota
  period: [Early Cretaceous]
  stages: [Albian]
  references:
    - id: carpenter1998c
      notes: >
        Gives the Silvisaurus type horizon as "Terra Cotta Clay (Albian:
        Hamilton, 1994), Dakota Formation", in Ottawa County, Kansas, using the
        fuller name with its lithology word.
    - id: eaton1960a
      notes: >
        Places the type site "midway in the Terra Cotta clay member of the
        Dakota Formation, hence about one third of the way up in the Dakota (now
        classified as uppermost Lower Cretaceous in the Kansas region)", and
        gives the type specimen's horizon as "Terra Cotta clay member of the
        Dakota Formation, Lower Cretaceous".

Tetori:
  rank: group
  period: [Middle Jurassic, Late Jurassic, Early Cretaceous]
  stages: [Bajocian, Bathonian, Callovian, Oxfordian, Kimmeridgian,
    Tithonian, Berriasian, Valanginian, Hauterivian, Barremian, Aptian,
    Albian]
  references:
    - id: averianov2005a
      notes: >
        Names the group by way of the Kuwajima Formation inside it, in central
        Japan.
    - id: chinzorig2025a
      notes: >
        Uses the same containment for the Lower Cretaceous Kuwajima Formation.
    - id: chure2000a
      notes: >
        Gives the "Katsuyamasaurus" horizon as "Akaiwa Subgroup, Tetori Group"
        and its age as "Valanginian through Albian", an age for the Akaiwa
        Subgroup rather than the whole group.
    - id: tong2021a
      notes: >
        "Macrobaenid remains have been reported from the Early Cretaceous Tetori
        Group, Japan, but the detailed systematic study is still outstanding."
        The age is given in passing, while reviewing the Asian macrobaenid
        record rather than dating the unit.
    - id: azuma2000a
      notes: >
        Divides the group into three subgroups, "Kuzuryu, Itoshiro, and Akaiwa",
        which together "range in time from Bajocian to Albian", following Maeda
        (1961).
    - id: sano2015a
      notes: >
        Treats the group in its broad sense as "The Middle Jurassic–Early
        Cretaceous Tetori (or Tedori) Group" and proposes dividing it in the
        Hakusan Region into a "Middle–Late Jurassic Kuzuryu Group" and an
        "unconformably overlying Early Cretaceous Tetori Group (sensu stricto)".
        The restricted group is dated "Early Cretaceous (Berriasian–Aptian)".

Tiantai:
  rank: group
  period: [Early Cretaceous, Late Cretaceous]
  stages: [Aptian, Albian, Cenomanian]
  references:
  - id: zheng2012a
    notes: >
      Names the group and its three constituent formations, the Tangshang,
      Liangtoutang and Chichengshan, in ascending sequence in the Tiantai
      Basin of Zhejiang.
  - id: zheng2018a
    notes: >
      Gives the same three-formation succession where the group crops out in
      the Huzhen Basin, and calls it Cretaceous.

Tiaojishan:
  rank: formation
  period: [Middle Jurassic, Late Jurassic]
  stages: [Callovian, Oxfordian, Kimmeridgian]
  variants: [Lanqi]
  references:
    - id: xu2016b
      notes: >
        Pins the unit to a single stage: "The Lanqi/Tiaojishan Formation is
        probably Oxfordian", supported by 40Ar/39Ar dates of 161.8 +/- 0.4 Ma
        from the basal portion and 159.5 +/- 0.6 Ma from the top of the Lanqi
        Formation of western Liaoning. The Daxishan Locality at Linglongta
        "exposes the Oxfordian Lanqi/Tiaojishan Formation", and the Oxfordian
        Linglongta phase of the Yanliao Biota, 164 to 159 million years ago, is
        drawn from it; the underlying Haifanggou/Jiulongshan Formation is
        Bathonian-Callovian.
    - id: sullivan2014a
      notes: >
        Reviews the radiometric control on the formation and finds it straddles
        the epoch boundary: the dating of Zhang and colleagues (2008) puts the
        upper boundary at 156-153 Ma and the lower boundary at about 165 Ma,
        "values that comfortably span the Middle-Late Jurassic boundary", while
        Yang and Li (2008) allow 166 to 148 Ma and Chang and colleagues (2009)
        put the lower bound at 160.7 +/- 0.4 Ma. The Daohugou strata are left
        unresolved: they "might either extend across the Jiulongshan-Tiaojishan
        boundary or be entirely referable to the upper Jiulongshan or lower
        Tiaojishan formation", so what the paper says about their age is not a
        date for this unit.
    - id: peng2012a
      notes: >
        Assigns the unit a late Middle to Late Jurassic age and reports a SHRIMP
        U-Pb zircon date of 160.7 Myr on basal andesites in the fossil-bearing
        succession at Linglongta, which the paper correlates with the formation.
        The wider figure sometimes quoted for the unit, "from the Middle
        Jurassic (Toarcian) to the latest Jurassic (Tithonian)", is the range
        across previously published estimates rather than the paper's own, and
        labels the Toarcian as Middle Jurassic; the dating results the paper
        accepts run 152 to 165 Myr in northern Hebei, western Liaoning and
        Daohugou.
    - id: godefroit2013a
      notes: >
        States the span. SHRIMP U-Th-Pb gives "ages between 165 +/- 1.2 Ma and
        153 +/- 2 Ma", and "these results indicate that the age of the
        Tiaojishan Formation is between the Callovian (Middle Jurassic) and the
        Kimmeridgian (Late Jurassic)". Writes the name "Tiaojishan (= Lanqi)".
    - id: liu2012a
      notes: >
        SHRIMP U-Pb zircon dates tied to the fossil horizons themselves rather
        than to regional samples, giving weighted means of 160.5 +/- 0.99,
        161.0 +/- 1.44 and 158.5 +/- 1.6 Ma. Writes the unit "Lanqi/Tiaojishan".

Tidwell:
  rank: member
  parent: Morrison
  period: [Late Jurassic]
  stages: [Oxfordian]
  references:
    - id: foster2016a
      notes: >
        Relocates and dates the Dystrophaeus type, further excavation having
        "confirmed that the specimen is from the lower half of the Tidwell
        Member, making it one of the lowest stratigraphic occurrences of
        vertebrate fossils in the Morrison Formation". "Preliminary U-Pb zircon
        dates indicate the site is Oxfordian in age, approximately 158 ± 3 Ma".
    - id: kirkland2016a
      notes: >
        Places it at the base of the formation, the section dropping "through
        the basal Tidwell Member of the Morrison Formation into the upper
        Summerville Formation of the San Rafael Group".

Tiourarén:
  rank: formation
  parent: Irhazer
  period: [Middle Jurassic, Late Jurassic, Early Cretaceous]
  stages: [Bathonian, Callovian, Oxfordian, Kimmeridgian, Tithonian,
    Berriasian, Valanginian, Hauterivian, Barremian]
  references:
    - id: mannion2025a
      notes: >
        Gives the current reading: Jobaria tiguidensis comes from "the
        Bathonian-Callovian Tiouraren Formation of Niger", crediting Rauhut and
        López-Arbarello (2009) alongside Sereno and colleagues (1999).
    - id: holtz2004a
      notes: >
        Carries the superseded Cretaceous reading, tabulating the formation as
        Barremian. Upchurch and colleagues (2004) give a similar
        Hauterivian-Barremian range in the same volume. The Jurassic redating
        has since been adopted, so this is history rather than a live
        disagreement.
    - id: remes2009a
      notes: >
        Places it above the Irhazer Group, the site sitting "at the base of the
        Irhazer Group (''Argiles de l'Irhazer'' below the Tiourarén Formation)".
        On its age, it reports that "the pre-Aptian and post-Triassic age of the
        Tiourarén Formation has been critically discussed" by Rauhut and
        López-Arbarello (2009), "leading to the conclusion that the represented
        fauna fits more parsimoniously in a late Middle Jurassic to early Late
        Jurassic scene".
    - id: sereno1994a
      notes: >
        Suggests the fauna from the Tiourarén beds "may be somewhat older
        (Hauterivian or Barremian, 125 to 135 million years ago) because they
        lie stratigraphically below the Gadoufaoua fauna", which is regarded as
        Aptian or Albian.
    - id: upchurch2004a
      notes: >
        A distribution table row, and it gives two formations one age cell:
        Jobaria tiguidensis is listed against "Tiourare'n Formation (Agadez),
        Farak Formation (Tahoua), Niger" with the age "Hauterivian Barremian,
        ?late Albian early Cenomanian". The span therefore covers both units
        together and cannot be read as this one's. The paper's body says only
        that "Jobaria was found in the Tiourare'n Formation of Niger (Sereno et
        al. 1999)", with no age. The unit name is split by a line break inside
        the table cell, so a search for it returns nothing from either mention.
    - id: rauhut2009a
      notes: >
        The paper devoted to the question, and the source of the Jurassic
        reading. It finds that the formation itself "does not provide any
        evidence for such an age, and the geological relations only help to
        constrain the upper limit for the age of the formation (Aptian)",
        while "the described dinosaur taxa are phylogenetically nested with
        late Middle Jurassic to Early Late Jurassic taxa from other localities,
        and thus indicate a pre-Kimmeridgian, probably late Middle Jurassic age
        for the Tiouaren Formation". The Bathonian and Callovian come from the
        comparanda rather than from the rock: Afrovenator groups with the
        Bathonian Dubreuillosaurus and the Callovian Eustreptospondylus. Spells
        the unit Tiouaren throughout.
    - id: sereno1999a
      notes: >
        The describing paper, and the source of the Cretaceous reading it is
        usually cited for: the fossils come from "the Neocomian [~140 to 130
        million years ago (Ma)] Tiouraren Formation", against "Aptian-Albian
        (~115 to 105 Ma) horizons of the Tegama Group in the Gadoufaoua
        region". The age is given as a numeric interval with an archaic term
        rather than as stages, and no stage name for this unit appears in the
        paper.
    - id: rauhut2016a
      notes: >
        Uncertain in age, and Jurassic rather than Cretaceous: the formation
        "has traditionally been regarded as Early Cretaceous", but Rauhut and
        López-Arbarello (2009) "argued that it is considerably older, and
        probably Middle to earliest Late Jurassic in age", an assignment "widely
        accepted since" and adopted here, with most authors favoring a late
        Middle Jurassic age. A table of Middle Jurassic theropod records gives
        the formation as "?Bathonian-?Oxfordian".

Tolar:
  rank: formation
  period: [Late Cretaceous]
  stages: [Cenomanian, Turonian, Coniacian, Santonian, Campanian, Maastrichtian]
  references:
    - id: kellner2011a
      notes: >
        Describes titanosaur remains "collected in the Tolar Formation (Upper
        Cretaceous) at the Atacama Desert (Antofagasta Region), northern Chile".
        Gives only the series.
    - id: rubilar-rogers2021a
      notes: >
        Sets the same material beside Arackar and Yamanasaurus, from "the Upper
        Cretaceous Tolar Formation in the Atacama Desert".
    - id: santucci2022a
      notes: >
        Tabulates Atacamatitan from the "Tolar Fm., Chile" as
        "Cenomanian–Maastrichtian (LK)". The text adds that before Atacamatitan
        "the inferred age for the Tolar Formation had not been precisely
        defined", and that the specimen "implies a Cretaceous age at least for
        the outcrops of this formation near the city of Conchi Viejo".

Tolman:
  rank: member
  parent: Horseshoe Canyon
  period: [Late Cretaceous]
  stages: [Maastrichtian]
  references:
    - id: eberth2020a
      notes: >
        Dates the bonebed in it directly: "the Albertosaurus bonebed -- a
        monodominant assemblage of tyrannosaurids in the Tolman Member -- is
        assessed an age of 70.1 Ma", occurring "near the top of the Tolman
        Member ..., ~8 m below the Tolman-Carbon member contact".
    - id: fowler2020b
      notes: >
        Gives "Tolman Member, Horseshoe Canyon Formation, Alberta; lower
        Maastrichtian".
    - id: eberth2012a
      notes: >
        The revision that erected it, one of the formation's seven mappable
        members, with "stacked and multilateral sandstones, near the base of the
        Tolman Member" forming a resistant ridge.
    - id: boyd2015a
      notes: >
        Gives the Parksosaurus warreni holotype as "discovered in the Late
        Cretaceous Tolman Member of the Horseshoe Canyon Formation (Edmonton
        Group) of Alberta, Canada".

Toqui:
  rank: formation
  period: [Late Jurassic]
  stages: [Tithonian]
  references:
    - id: carrano2012a
      notes: >
        Gives tetanuran material from "the Tithonian Toqui Formation of
        southern Chile".
    - id: mannion2019a
      notes: >
        Independently records that "A locality in the Tithonian Toqui Formation
        of southern Chile also demonstrates the presence of a diplodocine in
        the Late Jurassic of South America".
    - id: novas2015a
      notes: >
        Gives the Chilesaurus locality as "a fossil locality in the Upper
        Jurassic Toqui Formation of southern Chile", and the horizon as "Toqui
        Formation, Tithonian, latest Jurassic".

Torleite:
  rank: formation
  period: [Late Jurassic]
  stages: [Kimmeridgian]
  references:
    - id: foth2025a
      notes: >
        Places the formation below the Painten: "the upper part of the Torleite
        Formation, which underlies the Painten Formation, yielded important
        vertebrate fossils as well". It gives the Torleite no age of its own.
    - id: foth2020a
      notes: >
        Gives "the Torleite Formation (upper Kimmeridgian) of the Jurassic
        limestones of Bavaria", the unit holding the Sciurumimus and Juravenator
        holotypes.

Tornhöj:
  rank: member
  parent: Jydegaard
  period: [Early Cretaceous]
  stages: [Berriasian]
  references:
    - id: christiansen2003a
      notes: >
        Makes it the vertebrate-bearing part of the formation: "The most
        important part for vertebrate remains of the Jydegaard Formation is the
        basal part of the sandy Tornhöj Member, which rests directly on the
        Robbedale Formation, in the large 'Carl Nielsen's sandpit' at
        Robbedale", by far the richest vertebrate locality.

Toutunhe:
  rank: formation
  period: [Middle Jurassic, Late Jurassic]
  stages: [Bajocian, Bathonian, Callovian]
  references:
    - id: arbour2015a
      notes: >
        Gives the Tianchisaurus horizon as "upper part of the Toutunhe
        Formation, Middle Jurassic", in the Sangonghe Valley of Fukang County,
        Xinjiang, 35 km northwest of Urumqi. Gives only the series.
    - id: averianov2005a
      notes: >
        Places it below the Qigu Formation in the southern Junggar Basin and
        records a similar vertebrate assemblage from it. "The Toutunhe Formation
        is dated on the basis of palynoflora as Bathonian", following Wang
        (2001), while Eberth and colleagues (2001) gave it as
        "Bathonian–Callovian", though "the reasons for this are not evident from
        their paper".
    - id: maisch2019a
      notes: >
        Notes that "The Toutunhe Formation has recently been regarded as Upper
        Jurassic", following Fang and colleagues (2015), whose syndepositional
        zircon dates of 151 to 161 Ma from the Toutunhe, Qigu and Kalaza
        formations "indicate that these three formations span most of the Upper
        Jurassic from the Oxfordian to the Tithonian".
    - id: wang2001b
    - id: eberth2001a
      notes: >
        At the Manas section, "A 200-m-thick variegated mudstone and sandstone
        alluvial interval at the base of the Toutunhe Formation, however,
        suggests an episode of increasing seasonal dryness during the Middle
        Jurassic (Bajocian)", while "Carbonaceous shales and carbonaceous roots
        and rootlets in the overlying portion of the Toutunhe Formation suggest
        a return to warm and humid conditions at the end of the Middle Jurassic
        (Callovian)". The base stays hedged: "a Bajocian or Bathonian age is
        equally likely for the lower redbeds section of the Toutunhe Formation
        at Manas", a reading the paper sets against "all previous
        interpretations that claim ... a late Middle Jurassic age
        (Bathonian–Callovian) for the Toutunhe Formation".
    - id: fang2015a
      notes: >
        The formation is one of "the Upper Jurassic Toutunhe, Qigu and Kalazha
        Formations" of the southern Junggar Basin, and "is the first to contain
        abundant late Jurassic magmatic zircons", which formed "nearly at the
        same time as the sedimentation age of the Toutunhe Formation (younger
        than 161.2 Ma)". From that the authors deduce "relatively large scale
        volcanic activity occurred during the deposition period of the Toutunhe
        Formation (late Jurassic)".

Tremp:
  rank: group
  period: [Late Cretaceous]
  stages: [Campanian, Maastrichtian]
  references:
    - id: prieto-márquez2022a
      notes: >
        Gives group rank by naming a formation inside it, "the Talarn Formation
        of the Tremp Group". A unit that contains a named formation is a group.
    - id: pereda-suberbiola2009a
      notes: >
        Uses the coarser scheme, "the Maastrichtian of the Tremp Formation, in
        Lleida", and places the Blasi sites other than Blasi 1, which lies on
        top of the Aren Sandstone, in its lower part, giving the Arenysaurus
        type horizon as "lower part of the Tremp Formation; Late Cretaceous,
        Late Maastrichtian". This is not a competing claim: an older "Tremp
        Formation" and a newer "Talarn Formation" are the same rock at two
        resolutions, and the coarse reading is the correct one in the western
        syncline, where the Talarn does not reach and the Conques and Talarn
        criteria cannot be observed.
    - id: csiki-sava2015a
      notes: >
        Treats it at formation rank as the "transitional-to-continental"
        counterpart of the Arén Sandstone and calls both units diachronous, the
        Tremp ranging "from late Campanian to early Paleogene".

Trinity:
  rank: group
  period: [Early Cretaceous]
  stages: [Aptian, Albian]
  references:
    - id: hunt2018a
      notes: >
        "the Lower Cretaceous (Albian-Aptian) Trinity Group of Arkansas".
    - id: suarez2021a
      notes: >
        Gives the contents, which differ by state: in central Texas it
        "consists of the Twin Mountains, Glen Rose, and Paluxy formations, in
        ascending order", while in Oklahoma "it consists almost entirely of the
        Antlers Formation, although the Holly Creek Formation is present in
        extreme southeast McCurtain County".
    - id: stoyanow1949a
      notes: >
        "Imlay (1939a, p. 1738, Table 2) tentatively correlated the Glance,
        Morita, and the lower member of the Mural limestone with the Trinity
        group of Texas (Upper Aptian-Lower Albian), assigning the upper member
        of the Mural and the Cintura formation to the Fredericksburg (Middle
        Albian)." The upper Aptian to lower Albian age is Imlay's, relayed in
        this paper as part of the history of readings of the Bisbee group of
        southeastern Arizona rather than argued from the Texas section.

Tropic Shale:
  rank: formation
  period: [Late Cretaceous]
  stages: [Turonian]
  references:
    - id: cullen2021a
      notes: >
        Gives Nothronychus graffami as from "the Upper Cretaceous Tropic Shale
        (early Turonian) of Utah".
    - id: hedrick2015a
      notes: >
        Independently gives "the Tropic Shale (early Turonian) in south-central
        Utah", and contrasts it with the middle Turonian Moreno Hill Formation.

Trossingen:
  rank: formation
  period: [Late Triassic]
  stages: [Norian, Rhaetian]
  references:
    - id: galton2004a
      notes: >
        Uses formation rank and carries it "?into Rhaetic", listing it among the
        Norian prosauropod units of Germany. Elsewhere it has the formation as
        "upper Norian", with Plateosaurus skeletons in mass accumulations in the
        middle to late Norian at Trossingen.
    - id: yates2003b
      notes: >
        Uses Trossingen as a locality rather than a unit, giving "Trossingen,
        Baden-Württemberg, Germany; middle Löwenstein Formation, Middle Norian".
        The string does double duty, as with Sierra Barrosa and Gara Sbaa, and
        the Löwenstein is the unit below.
    - id: sues2025a
      notes: >
        Puts the "Untere Saurierschicht" of the formation, in the Middle Keuper
        Subgroup, in the "Late Triassic (Norian: Sevatian)".

Tuchengzi:
  rank: formation
  period: [Middle Jurassic, Late Jurassic, Early Cretaceous]
  stages: [Tithonian, Berriasian]
  references:
    - id: butler2008b
      notes: >
        Gives the Chaoyangsaurus horizon as "the Tuchengzi Formation of Liaoning
        Province, China" and records the age as read two ways, "Middle or Late
        Jurassic: Middle Jurassic, Zhao et al. 1999; Tithonian, Weishampel et
        al. 2004b". The hedge crosses an epoch boundary.
    - id: averianov2006a
      notes: >
        Cites radiometric work on the unit, "New 40Ar/39Ar dating of the Yixian
        and Tuchengzi Formations", supporting a Cretaceous age for the
        feathered-dinosaur beds of Liaoning.
    - id: wang2016a
      notes: >
        Treats the formation as "?Jurassic-Early Cretaceous", saying it "yields
        definitive Early Cretaceous ages", after Chang and colleagues (2009),
        "but may extend into the Jurassic".
    - id: chang2009a
    - id: swisher2002a
      notes: >
        A tuff from the upper part of the formation "gave a mean 40Ar/39Ar age
        of 139.4 ± 0.19 (1SD) ± 0.05 (SE) Ma, based on 19 single sanidine
        crystal analyses". "This represents the first isotopic dating for the
        Tuchengzi Formation and although considered previously middle Jurassic
        in age, at least the upper part of the formation can be referred to the
        Early Cretaceous." On that result the continental Jurassic-Cretaceous
        boundary in northeastern China "must be sought for within the lower part
        of the Tuchengzi Formation or within underlying formations".
    - id: liu2012a
      notes: >
        The formation is "referred to the latest Jurassic (Tithonian) to the
        earliest Cretaceous (Berriasian)" deposits of northern North China, on
        previously published K–Ar, SHRIMP U–Pb and LA-ICP-MS ages of 156–139 Ma.
        Places it in the regional succession as "the Upper Jurassic-Lower
        Cretaceous Tuchengzi Formation (called the Houcheng Formation in Hebei
        Province)", between the Lanqi/Tiaojishan Formation below and the
        Zhangjiakou Formation above.

Tugrugyin:
  rank: member
  parent: Djadokhta
  period: [Late Cretaceous]
  stages: [Campanian]
  references:
    - id: dashzeveg2005a
      notes: >
        Erects it as the upper of the formation's two members and orders the
        faunas by superposition: "the Bayn Dzak fauna lived somewhat earlier
        than that from Tugrugyin Shireh based on the superposition of the
        members, it is not clear how much earlier". New magnetostratigraphy runs
        "through the Bayn Dzak Member up into the basal Tugrugyin Member". Maps
        the oldest rocks at Tugrugyin Shireh as "Late Cretaceous sands,
        primarily representing the Tugrugyin Member of the Djadokhta Formation".
    - id: turner2007a
      notes: >
        Gives "The Tugrugyin Member of the Djadokhta Formation (Campanian),
        Tugrugyin Shireh, Ömnögov, Mongolia" as the Mahakala type horizon.

Tugulu:
  rank: group
  period: [Early Cretaceous]
  stages: [Valanginian, Hauterivian, Barremian, Aptian, Albian]
  references:
    - id: zheng2023a
      notes: >
        Treats it as "the Lower Cretaceous Tugulu Group" and concludes that "The
        Tugulu Group thus formed during the Early Cretaceous". Gives the group's
        order and dates its formations, which is what carries the older bound:
        "the Tugulu Group consists (in ascending order) of the Qingshuihe,
        Hutubihe, Shengjinkou, and Lianmuqin Formations". The Hutubihe
        sporopollen assemblage indicates "a Valanginian age", the paper "places
        the upper Shengjinkou Formation within the Valanginian Stage", and the
        Lianmuqin "could have been deposited as early as the Valanginian". A
        group's envelope has to admit the ages published for the units inside
        it.
    - id: sereno2010a
      notes: >
        Gives a type horizon line: "Tugulu Group (Aptian), Delunshan, Junggar
        Basin, Xinjiang Uygur Autonomous Region, People's Republic of China".
    - id: meso2024a
      notes: >
        Calls the unit the "Barremian-Aptian Tugulu Group", with Xiyunykus and
        Tugulusaurus from its "upper section".
    - id: tong2021a
      notes: >
        Dracochelys bicuspis comes from the "Tugulu Group (Early Cretaceous),
        Junggar Basin, China" and Wuguia from the "Hutubihe Fm. and Lianmuxin
        Fm., Tugulu Group (Early Cretaceous), Junggar Basin, Xinjiang, China".
        The occurrence table hedges one of those formations further, giving
        "Lianmuxin Fm. (Tugulu Group) Early Cretaceous (Aptian–Albian?)".
    - id: tucker2022a
      notes: >
        "Strata of the Tugulu Group (China) likely span the Valanginian;
        however, it is unclear which of its formations dates to this age", the
        Qingshuihe, Hutubihe and Lianmuqin all having "variably been dated to
        the Valanginian".
    - id: tumanova2018a
      notes: >
        Wuerhosaurus homheni comes from the Tugulu Group of northwestern China,
        whose deposits "were previously dated Neocomian–Albian" by Dong (1992)
        and "apparently correspond to the Tsagaantsav Horizon in Mongolia"; that
        horizon, dated Neocomian by Shuvalov (2000) and Barremian–Aptian by
        Lucas (2006), "more probably should be assigned to the
        Hauterivian–Barremian".

Turney Ranch:
  rank: formation
  period: [Early Cretaceous, Late Cretaceous]
  stages: [Albian, Cenomanian]
  references:
    - id: britt2017a
      notes: >
        Gives Sonorasaurus as a brachiosaurid from "the Albian-to-Cenomanian
        Turney Ranch Formation of Arizona".
    - id: d'emic2016a
      notes: >
        Places it in the Bisbee Group and records that the taxon "potentially
        represents one of the youngest sauropods" of the North American
        Cretaceous record.

Twin Mountains:
  rank: formation
  parent: Trinity
  period: [Early Cretaceous]
  stages: [Aptian, Albian]
  references:
    - id: andrzejewski2019a
      notes: >
        Gives "the Twin Mountains Formation (Aptian) of north-central Texas",
        and places the overlying Glen Rose "biostratigraphically near the
        Aptian-Albian boundary (~113 Ma)".
    - id: d'emic2013a
      notes: >
        Gives the age and the correlation: "Early Cretaceous (Aptian-Albian)
        Twin Mountains Formation of north-central Texas", which "is laterally
        equivalent to the Antlers Formation".

Two Medicine:
  rank: formation
  period: [Late Cretaceous]
  stages: [Campanian]
  references:
    - id: burnham2000a
      notes: >
        Places its material "approximately two-thirds of the way above the base
        of the unit, Upper Cretaceous, Campanian".
    - id: livius2026a
      notes: Independently gives the formation "in Montana (Campanian".

Udurchukan:
  rank: formation
  period: [Late Cretaceous]
  stages: [Campanian, Maastrichtian]
  references:
    - id: godefroit2011a
      notes: >
        Places holotypes from both Blagoveschensk and Kundur in the "Udurchukan
        Formation, Maastrichtian, Upper Cretaceous".
    - id: xing2022a
      notes: >
        Narrows it to "Udurchukan Formation (middle Maastrichtian".
    - id: alifanov2010a
      notes: >
        The Kundur remains come from grayish green clays in "the roof of the
        Udurchukan Formation (previously referred to as the Tsagayan Formation
        or Lower Tsagayan Formation)". The bone-bearing beds of the Amur Region
        "were dated to the Campanian–Maastrichtian boundary" by Bolotsky and
        Kurzanov (1991), "or a wide range from the Late Campanian to the Middle
        Maastrichtian" by Nessov (1997), while more recent work places them
        variously in the early, middle or late Maastrichtian; the paper puts its
        own material at "Upper Cretaceous, Maastrichtian, Udurchukan Formation".

Ukureyskaya:
  rank: formation
  variants: [Ukurey]
  period: [Middle Jurassic, Late Jurassic]
  references:
    - id: godefroit2014a
      notes: >
        Gives the Kulindadromeus horizon as "the base of the Ukureyskaya
        Formation, dated as Middle to Late Jurassic", at the Kulinda locality in
        the Chernyshevsky District of the Chita Region, southeastern Siberia.
        The age is hedged across an epoch boundary.
    - id: li2019a
      notes: >
        Gives the narrower reading, "the Middle Jurassic Ukureyskaya Formation
        of Chita Region, Russia".
    - id: cincotta2019a
      notes: >
        Dates the lower part of the unit radiometrically and from both sides.
        Concordia ages "constrain the maximum age of the volcaniclastic deposits
        at 172.8 plus or minus 1.6 Ma, corresponding to the Aalenian (Middle
        Jurassic)", while the palynological assemblage "includes taxa that are
        correlated to Bathonian palynozones from western Siberia, and therefore
        constrains the minimum age of the deposits". Both are stated of the
        deposits rather than of the animal, although the abstract's headline
        sentence makes the taxon the subject. The conclusions give "a Bathonian
        age for the deposits, corresponding to an age ranging between 168.3 and
        166.1 Ma". This holds for the lower part only - "The excavated sections
        at Kulinda belong to the lower part of the Ukurey Formation" - and the
        paper widens the unit rather than redating it: "The stratigraphic range
        of the Ukurey Formation is therefore wider than previously assumed, its
        lower part extending to the Middle Jurassic", which is "older than the
        previous Late Jurassic to Early Cretaceous ages tentatively based on
        local stratigraphic correlations". Prints the name Ukurey Formation
        throughout.

Ulaanoosh:
  rank: formation
  variants: [Ulaanuush]
  period: [Early Cretaceous, Late Cretaceous]
  stages: [Aptian, Albian, Cenomanian]
  references:
    - id: yu2020a
      notes: >
        Gives the span and the distribution: "The age of the Ulaanoosh Formation
        ranges from late Early to early Late Cretaceous (Albian-Cenomanian)
        based on vertebrate and invertebrate fossils such as dinosaurs, dinosaur
        eggs, molluscs, ostracods, and turtles", the unit being "distributed in
        the areas of Ulaanoosh, Alguu Ulaan Tsav, Baruunbayan, and Zuunbayan".
        Of its two members, it dates "The lower member (Aptian-Albian)". Beds
        once mapped as the Baruunbayan Formation "are now considered to be part
        of the Ulaanoosh Formation".

Ulansuhai:
  rank: formation
  period: [Late Cretaceous]
  stages: [Turonian, Coniacian, Santonian, Campanian]
  references:
    - id: xu2013a
      notes: >
        Gives "Wulansuhai Formation, Campanian", spelling the name with an
        initial W.
    - id: xu2011c
      notes: >
        Treats Bayan Mandahu as the locality and this as the unit there,
        recording a specimen from "Bayan Mandahu, ''North Canyon'' locality,
        Wulatehouqi, Inner Mongolia; Wulansuhai" Formation. The Bayan Mandahu
        Formation of the Western literature is the same unit's eastern outcrop,
        not a separate one.
    - id: hao2025a
      notes: >
        Fossils from the Maortu locality in Chilantai "were mistakenly claimed
        to belong to" the Wulanhushao (Suhongtu), Dashuigou and Ulansuhai
        formations, but "this fossil-bearing unit ... actually belongs to the
        Miaogou Formation", so an age given for the Ulansuhai Formation at
        Maortu is an age for the Miaogou Formation. Its location map names the
        unit at Bayan Mandahu and Suhongtu the "Upper Cretaceous Ulansuhai
        Formation".
    - id: evans2021a
      notes: >
        Puts the formation after the Cenomanian with a hedge on how much after:
        its age "is constrained to be post-Cenomanian by radiometric dating of
        underlying basalts but may be as old as Turonian", after Kobayashi and
        colleagues (2003).
    - id: kobayashi2003b
      notes: >
        Gives the epoch and no stage: "the Upper Cretaceous Ulansuhai Formation
        in Nei Mongol". No stage term appears anywhere in the paper, so it
        supports none of this entry's four.

Upper Dinosaur:
  rank: member
  parent: Tendaguru
  period: [Late Jurassic, Early Cretaceous]
  stages: [Kimmeridgian, Tithonian, Berriasian]
  variants: [Upper Saurian Bed]
  references:
    - id: mannion2019a
      notes: >
        Gives both the name and its alternate: "Upper Dinosaur Member (Upper
        Saurian Bed), Tendaguru Formation; Tithonian, Late Jurassic".
    - id: rauhut2011a
      notes: >
        Places the member in the "late Tithonian-earliest Cretaceous", following
        Bussert and colleagues (2009), and narrows its locality MW to the "upper
        Tithonian".
    - id: bussert2009a
      notes: >
        Leaves open whether the member reaches into the Cretaceous: "More work
        is needed to decide unambiguously whether the Upper Dinosaur Member is
        wholly Late Jurassic or, in part, Early Cretaceous." U-Pb dating of a
        Brachiosaurus brancai pelvic bone from the member gave Romer (2001) "an
        age range from ca. 140 to 150 Ma", falling approximately in the
        Tithonian and the Berriasian, while the absence of Cicatricosisporites
        reported by Schrank (2005) "could indicate a Tithonian age".
    - id: schrank2005a
      notes: >
        Radiometric work on dinosaur bone from the Upper Saurian Bed "did not
        allow a precise age determination, but resulted in a possible minimum
        age of 140 to 150 Ma ... that corresponds to Berriasian to Tithonian",
        the dating after Romer (2001) and the conversion to stages after Haq and
        Van Eysinga (1998).
    - id: romer2001a
      notes: >
        A uranium-lead study of Brachiosaurus brancai bone, which uses the
        alternate name Upper Saurian Bed and disclaims its own precision: "No
        precise age can be determined from the data, although the most
        consistent solution falls in the range of 140 to 150 Ma." The method
        gives a floor rather than an age - "Diagenetic incorporation of uranium
        into bone material establishes a minimum age for the fossil" - and the
        paper notes that unrecognized additions of radiogenic lead produce "an
        overestimation of the age". So the figure permits a Berriasian without
        asserting one.
    - id: wild1991a
      notes: >
        Gives the Janenschia robusta stratum typicum as "Upper Saurian marl,
        upper Kimmeridgian", following Janensch (1961).

Upper Weald Clay:
  rank: formation
  parent: Weald Clay
  period: [Early Cretaceous]
  stages: [Barremian]
  references:
    - id: norman2013a
      notes: >
        Puts the formation at the top of the Weald Sub-basin succession, which
        runs "from the upper Berriasian (Ashdown Beds Formation) to the top of
        the Barremian (Upper Weald Clay Formation)", and dates its exposures at
        Smokejacks Brickworks near Ockley, Surrey, and at Henfield, West
        Sussex, as "middle Barremian (~128 Ma)" after Batten (2011).
    - id: barker2023a
      notes: >
        Gives the formation and its stage together for the Baryonyx walkeri
        holotype, which is "from the Barremian Upper Weald Clay Formation of
        Surrey". Most British spinosaurid skeletal material comes from "the
        Barremian strata of Surrey (Upper Weald Clay Formation)".
    - id: raven2020a
      notes: >
        Barremian, and coeval with the Wessex Formation of the neighboring
        sub-basin: "The Upper Weald Clay Formation of the Weald Sub-basin and
        the Wessex Formation of the Wessex Sub-basin overlap temporally (both
        are Barremian; Batten, 2011)."

Valle de la Luna:
  rank: member
  parent: Ischigualasto
  period: [Late Triassic]
  stages: [Carnian, Norian]
  references:
    - id: sciscio2017a
      notes: >
        Two 40Ar/39Ar dates on the member conflict: "(i) 40Ar/39Ar date of the
        Valle de la Luna Member (feldspars): 217.0±1.7 Ma by Shipman (2004);
        (ii) 40Ar/39Ar date of the Valle de la Luna Member (ISCH-6-611):
        225.9±0.9 Ma by Martínez et al. (2011)". Both come from the upper part
        of the member, whose beds underlie the Los Colorados Formation and are
        its "sole radiometric controls"; the mismatch is attributed to "the
        low-precision methods of 40Ar/39Ar dating, the complexity in
        underpinning a central age-date plateau, or ... other sedimentological
        complications".
    - id: ezcurra2010a
      notes: >
        A recalculated age of "about 219.4–220.4 ± 1.7 Ma" for an ash at its top
        locates "the top of the Valle de la Luna Member of the Ischigualasto Fm.
        in the mid-Norian". With the recalculated date from the lower part of
        the formation, it concludes that "the Carnian–Norian boundary should be
        located close to the middle of the formation probably within the Valle
        de la Luna Member".
    - id: peyredefabrègues2015a
      notes: >
        Uses it as the locality for Eoraptor in the Ischigualasto Formation of
        San Juan Province, Argentina.

Vectis:
  rank: formation
  parent: Wealden
  period: [Early Cretaceous]
  stages: [Barremian, Aptian]
  references:
    - id: lockwood2021a
      notes: >
        At "40 m or more" thick after Radley and Barker (1998), it is a fraction
        of the roughly 180 m of Wessex Formation beneath it, and is built of
        "argillaceous deposits and occasional interbedded sandstone and shelly
        limestones" laid down in a shallow coastal lagoon. The Barremian–Aptian
        boundary lies "within the Shepherds Chine Member, which forms the
        youngest unit of the formation", after Kerth and Hailwood (1988) and
        Robinson and Hesselbo (2004).
    - id: bonsor2023a
      notes: >
        Magnetostratigraphy puts the base of the Aptian inside the formation's
        youngest member: "The Shepherd's Chine Member is younger than
        magnetostratigraphic cron CM-0, signifying that the base of the Aptian
        passes through the unit", after Kerth and Hailwood (1988). Three members
        make it up, "the Cowleaze Chine Member and the younger Shepherd's Chine
        Member, both dominated by grey dysaerobic mudstones, intercalated by a
        2–6 m thick arenaceous unit, the Barnes High Sandstone Member, deposited
        at the mouth-bar of a distributary river system as it entered a brackish
        lagoon", and it was "formerly known as the Wealden Shales".
    - id: lockwood2024a
      notes: >
        The Barremian-Aptian boundary falls inside the formation's youngest
        unit: "The overlying Vectis Formation has been shown to contain the
        Barremian–Aptian boundary within the Shepherds Chine Member, which forms
        the youngest unit of the formation", after Kerth and Hailwood (1988) and
        Robinson and Hesselbo (2004). The younger of the two formations the Isle
        of Wight Wealden Group is divided into, it is "approximately 40 m of
        clays and shales, with occasional interbedded sandstones and shelly
        limestones containing the bivalve Filosina gregaria and small oysters,
        deposited predominantly in a shallow coastal lagoon of varying
        salinity".
    - id: barker2020a
      notes: >
        Gives the age and what makes the unit unusual, only the Wealden fossils
        "in the Vectis Formation (Barremian to lower Aptian) come from strata
        with an obvious marine contribution".
    - id: barker2023a
      notes: >
        Places spinosaurid material in "the Isle of Wight (Wessex Formation and
        base of the Vectis Formation)".

Villalba de la Sierra:
  rank: formation
  period: [Late Cretaceous]
  stages: [Campanian, Maastrichtian]
  references:
  - id: díezdíaz2016a
    notes: >
      Printed in full as the Margas, Arcillas y Yesos de Villalba de la
      Sierra Formation. The Lo Hueco site at Fuentes, Cuenca, lies in its
      upper part and is given as upper Campanian to lower Maastrichtian.
  - id: mocho2024a
    notes: >
      Repeats the late Campanian to early Maastrichtian age for the Lo Hueco
      bonebed.
  - id: csiki-sava2015a
    notes: >
      Places the formation's Lo Hueco assemblage among the late Campanian to
      early Maastrichtian faunas of Spain.

Villar del Arzobispo:
  rank: formation
  period: [Late Jurassic, Early Cretaceous]
  stages: [Kimmeridgian, Tithonian, Berriasian]
  dispute:
    summary: >
      What is disputed is the unit's upper boundary, and so its definition,
      rather than the age of any bed. Aurell and colleagues (2016) erect the
      Aguilar del Alfambra and Galve formations for beds previously counted as
      the upper Villar del Arzobispo, which leaves a restricted unit ending
      around the late Tithonian and moves the Las Zabacheras site, the source of
      Aragosaurus, into the Galve Formation. Campos-Soto and colleagues (2019)
      log the same sections afterwards, keep the unit in the broad sense and
      state outright that "there is not agreement on the age or on the
      nomenclature of the unit with Aragosaurus ischiaticus". Both frameworks
      are in current use, so the stages given here span the broad sense and the
      restricted sense is recorded rather than adopted.
  references:
    - id: campos-soto2019a
      notes: >
        Logging the Las Zabacheras, Cedrillas and El Castellar sections after
        the Aguilar del Alfambra and Galve formations were erected, these authors
        keep the unit in the broad sense and record that "there is not agreement
        on the age or on the nomenclature of the unit with Aragosaurus
        ischiaticus". Larger benthic foraminifera date the dinosaur-bearing
        record of eastern Spain, which they correlate with the Villar del
        Arzobispo Formation, to the "Kimmeridgian–Tithonian" and "locally, in the Las
        Zabacheras-Galve area, a Kimmeridgian–Early Berriasian? age", against
        previous work that ran it from the Kimmeridgian into the Berriasian,
        Valanginian, Hauterivian, Barremian or even the Aptian-Albian. They
        record that "since the 90s, the Kimmeridgian age was discarded and they
        were assigned to the Tithonian–Berriasian", and that the unit has more
        recently been dated as Kimmeridgian at Benagéber and
        Kimmeridgian-Tithonian in the western Peñagolosa sub-basin. They propose
        redefining the formation on its Cedrillas parastratotype.
    - id: aurell2016a
      notes: >
        "Two new lithostratigraphic units are defined and characterized, the
        Aguilar del Alfambra and the Galve formations", replacing a framework
        that "considered only two lithostratigraphic units (the Villar del
        Arzobispo and El Castellar formations) bounded by a single regional
        unconformity, and this resulted in significant misinterpretations". The
        Aguilar del Alfambra takes beds previously counted as the upper Villar
        del Arzobispo, and the erosive unconformity between the two falls
        "around the late Tithonian", tied to a relative fall in sea level "at
        the end of the Jurassic in the studied Galve sub-basin". On this
        proposal "the site of Las Zabacheras is located in the lower part of the
        Galve Formation and the Las Cerradicas tracksite in the upper levels of
        the Villar del Arzobispo Formation", the Galve being "poorly constrained
        from late Berriasian to Hauterivian". The restricted unit is 140 to 170 m thick
        across most of the sub-basin and carries Anchispirocyclina lusitanica at
        several levels, a foraminifer they say ranges from the middle Tithonian
        to the earliest Berriasian. The framework they replace, with a single
        regional unconformity, had the formation running from the Tithonian to
        the middle Berriasian.
    - id: canudo2012a
      notes: >
        The unit at Galve is "middle Tithonian–upper part of the early
        Berriasian", with the "Jurassic–Cretaceous boundary" "assumed to be
        located near the top of the unit" on correlation with the more open
        eastern domains of the basin. A charophyte from a carbonate level close
        to the top near Las Zabacheras "characterizes a charophyte biochronozone
        that is from the upper part of the early Berriasian or middle Berriasian
        in age". Canudo and colleagues use that top, and the low-angle
        unconformity above it, to place Aragosaurus in the overlying El
        Castellar Formation instead.
    - id: sánchez-fenollosa2023a
      notes: >
        Gives "Villar del Arzobispo Formation (upper Kimmeridgian-Tithonian".
    - id: royo-torres2014a
      notes: >
        Gives the Aragosaurus type locality as "Villar del Arzobispo Formation
        (upper Tithonian-lower Berriasian)".

Wabiskaw:
  rank: member
  parent: Clearwater
  period: [Early Cretaceous]
  stages: [Aptian, Albian]
  references:
    - id: brown2017a
      notes: >
        Gives the Borealopelta horizon as "Wabiskaw Member, Clearwater
        Formation, Aptian stage" in the locality line and "the Albian-aged
        Wabiskaw Member" in the geological setting, the member overlying the
        bitumen-rich McMurray Formation.
    - id: brown2020b
      notes: >
        Places the specimen "near the base of a 3 m thick greenish-grey, very
        fine- to medium-grained glauconitic sandstone unit within the marine
        Wabiskaw Member", about 8 m above the McMurray Formation. Spells the
        name Wabiska in one table and Wabiskaw in the text.

Wadhurst Clay:
  rank: formation
  parent: Hastings Beds
  period: [Early Cretaceous]
  stages: [Valanginian]
  references:
    - id: norman2013a
      notes: >
        Heads its section "Hastings Group, Valanginian Stage" and treats the
        Wadhurst Clay Formation within it, with the large-bodied ornithopod
        material "distributed within the middle and upper-middle Valanginian".
    - id: galton2009a
      notes: >
        Places it in the succession, the Hastings Beds running "in descending
        order the Upper Tunbridge Wells Sands, Grinstead Clay, Lower Tunbridge
        Wells Sands, Wadhurst Clay, Ashdown Beds", and gives "~137 Ma (middle
        Valanginian) for the Wadhurst Clay of East Sussex".
    - id: norman2015a
      notes: >
        Gives the Hypselospinus fittoni horizon as "Lower Cretaceous, Hastings
        Group, Wadhurst Clay Formation", with the age "Valanginian: 139–137
        Mya".
    - id: drew1861a
      notes: >
        Coins the name, in the paragraph that also names the Ashdown Sands and
        the Grinstead Clay: the clay can be traced to the sands below and its
        position seen "in the cuttings at the ends of the Wadhurst Tunnel", so
        "I have on these accounts thought it well to take the name of Wadhurst
        Clay for the second stratum".

Wahweap:
  rank: formation
  period: [Late Cretaceous]
  stages: [Campanian]
  references:
    - id: lund2016a
      notes: >
        Calls it the "Upper Cretaceous (middle-late Campanian) Wahweap
        Formation" in the abstract and the "late Campanian Wahweap Formation" in
        the introduction.
    - id: beveridge2022a
      notes: >
        Treats the formation "and its constituent biotic assemblages" as a
        Campanian reference section. Its title calls it "the Upper Cretaceous
        Wahweap Formation", and its age model places the formation boundaries at
        about 82.17 and 77.29 Ma, "coinciding with the first half of the
        Campanian Stage".
    - id: jinnah2007a
      notes: >
        The Upper Cretaceous formation of southern Utah is a series of
        fossil-bearing fluvial and floodplain sandstones and mudstones laid down
        on a low-relief coastal to alluvial plain in the central Western
        Interior Basin. Single-crystal 40Ar/39Ar dating of sanidine from a
        bentonite near the base of the formation yields 80.1 ± 0.3 Ma, and with
        a previously dated ash at the base of the overlying Kaiparowits
        Formation gives an accumulation interval of about 80.8 to 76.1 Ma,
        making the unit "considerably younger than the Milk River Fm (84.5-83.5
        Ma)".

Wallangulla Sandstone:
  rank: member
  parent: Griman Creek
  period: [Early Cretaceous, Late Cretaceous]
  stages: [Albian, Cenomanian]
  references:
    - id: agnolín2010a
      notes: >
        Gives the older reading and the parent, "Wallangulla Sandstone Member of
        the Griman Creek Formation (Albian: late Early Cretaceous)", at
        Lightning Ridge.
    - id: bell2018a
      notes: >
        Gives the younger reading and the wider frame, "Wallangulla Sandstone,
        GCF, Cenomanian, Rolling Downs Group of the Surat Basin".

Walloon Coal Measures:
  rank: subgroup
  period: [Early Jurassic, Middle Jurassic, Late Jurassic]
  stages: [Bajocian, Bathonian, Callovian, Oxfordian, Kimmeridgian, Tithonian]
  dispute:
    summary: >
      Rank is unsettled. Nair and Salisbury (2012) equate the unit with a
      subgroup -- "Walloon Coal Measures (= Walloon Subgroup; coeval with the
      Birkhead Formation of the Eromanga Basin)" -- while group rank is also in
      use for it.
  references:
    - id: nair2012a
      notes: >
        Gives the subgroup equivalence and the Eromanga Basin correlative in its
        figure caption for the Rhoetosaurus type area. The Rhoetosaurus material
        comes from the lowermost section, whose age, "based on
        palynostratigraphy ... is late Bathonian-middle Callovian".
    - id: todd2019a
      notes: >
        The unit was considered Lower Jurassic when Longman (1926) placed the
        Rhoetosaurus horizon in it, but "presently the age of the unit is
        considered Middle to Upper Jurassic (Callovian to Tithonian) based on
        extensive new high-precision ID-TIMS U-Pb geochronology of volcanic
        tuffs from throughout the succession", against earlier palynology that
        "suggested a late Bathonian to middle Callovian age (~167-164 Ma)".
        Detrital zircon from the sandstone matrix of the Rhoetosaurus specimen
        gives a maximum depositional age of 162.6 ± 1.1 Ma, "no older than early
        Oxfordian", which correlates "with the base of the Walloon Coal
        Measures, just above the Eurombah Formation, in the western Surat
        Basin".
    - id: leahey2015a
      notes: >
        Places a queried stegosaurian footprint from the Balgowan Colliery on
        the Darling Downs, known from replica QM F5701, in the "Middle Jurassic
        (Bajocian–Bathonian) Walloon Coal Measures", following Hill, Playford
        and Woods (1966).

Wangjiashan:
  rank: formation
  period: [Middle Jurassic]
  stages: [Bathonian]
  references:
    - id: ning2024a
      notes: >
        Describes Baiyinosaurus from "the Middle Jurassic Wangjiashan Formation
        of the Pingchuan District, Baiyin City, Gansu Province, China", and
        makes it one of the two Middle Jurassic lithostratigraphic units of the
        area with the Longfengshan Formation, above a disconformity with Upper
        Triassic rocks. The material is "from the upper part of the Straw-yellow
        Sandstone Member of the Wangjiashan Formation, whose age is considered
        to be Middle Jurassic, late Bathonian", a date based on the member's
        plants and palynoflora and the invertebrates of the overlying Oil Shale
        Member.

Wangmen:
  rank: formation
  period: [Early Jurassic, Middle Jurassic]
  references:
    - id: mo2025a
      notes: >
        Describes Huashanosaurus from "the Lower and Middle Jurassic Wangmen
        Formation of Ningming County, Guangxi, South China". It records that
        "Previous work showed that the Wangmen Fm. is early Early Jurassic in
        age", while "the new eusauropod discovery indicates that the Wangmen Fm.
        is probably somewhat younger Early–Middle Jurassic in age", the range
        Meng (2000) had proposed from charophytes. It gives series, not stages.
    - id: meng2000a

Wangshi:
  rank: group
  period: [Early Cretaceous, Late Cretaceous]
  stages: [Coniacian, Santonian, Campanian, Maastrichtian]
  dispute:
    summary: >
      Both the rank word and the internal order vary by source. Yu and
      colleagues (2018) write "the Upper Cretaceous Wangshi Group of
      Shandong"; Brusatte and colleagues (2013) write "Wangshi Series"; Dong
      (1978) writes "the Wangshi Formation of Laiyang". The internal order is
      contradictory too: Borinder and colleagues (2021) place the Hongtuya
      below the Jiangjunding, the Zhucheng literature puts the Hongtuya at the
      top of the group, and Zhang and colleagues (2019) leave it out of the
      Laiyang succession altogether. A single ordered column cannot be
      assembled without resolving that first: the Laiyang and Zhucheng basins
      may not share a scheme.
  references:
    - id: yu2018a
      notes: Gives group rank and an Upper Cretaceous age for the Shandong beds.
    - id: brusatte2013a
      notes: >
        Calls it a series and dates it "Campanian-?Maastrichtian", citing
        Weishampel and colleagues (2004) and Zhao and colleagues (2008).
    - id: buffetaut1995a
      notes: >
        Relays two readings. After Sloan, as quoted by Dong (1992), "the Wangshi
        'Formation' may range in age from Coniacian to Maastrichtian"; after
        Chen (1983), "the upper part of the Wangshi Group may be correlated with
        the 'Belly River or Edmonton beds of North America', which means
        Campanian to Maastrichtian, while the lower part may be early Late
        Cretaceous in age".
    - id: xu2019a
      notes: >
        Places the lower part of the group in the Early Cretaceous: "The lower
        part of the Wangshi Group should be assigned to the upper Lower
        Cretaceous." It correlates the Malanggou and Tianjialou formations with
        the Linjiazhuang and Xingezhuang formations of the lower Wangshi Group.
    - id: weishampel2004b
    - id: dong1978b
    - id: borinder2021a
      notes: >
        Treats the unit at group rank and dates a formation within it: material
        comes from "Upper Cretaceous (upper Campanian-lower Maastrichtian)
        sediments in the Jiangjunding Formation, which is a subunit of the
        Wangshi Group". It also records a radiometric tie on the unit beneath,
        "A radiometric date of 72.9-73.5 Ma ... from the uppermost section of
        the underlying Hongtuya Formation".
    - id: zhang2019a
    - id: zhao2008a
      notes: >
        Uses formation rank and gives only the epoch, in a distribution line:
        Chingkankousaurus fragilis from "Laiyang, Shandong Wangshi Formation
        Late Cretaceous". The name appears once in the paper, so it is a
        listing rather than a treatment, and the rank follows the older usage
        this entry's other references record.
    - id: chen1983a
      notes: >
        "The Late Cretaceous Wangshi Group of E Shandong, composed of red beds,
        is well-known for its hadrosaurian fauna, which occurs in the upper part
        of this group", and on that fauna "the upper part of the Wangshi Group
        may correspond to the Belly River beds or Edmonton beds of Northern
        America". The lower part, on its ostracods, pelecypods, gastropods and
        conchostracans, "may be early Late Cretaceous in age".
    - id: dong1992a
    - id: rozhdestvensky1968a
      notes: >
        Coniacian to Santonian on hadrosaur evidence: Tanius is morphologically
        a later form than Bactrosaurus, so placing the unit in the Cenomanian
        below the Iren Dabasu Formation "is hardly proper", and "the most likely
        location of the Wangshih Formation is, as the layer with Jaxartosaurus,
        in the Coniacian–Santonian interval".

Wapiti:
  rank: formation
  period: [Late Cretaceous]
  stages: [Campanian, Maastrichtian]
  references:
    - id: bell2015a
      notes: >
        Gives "the upper Campanian Wapiti Formation, west-central Alberta".
    - id: currie2008a
      notes: >
        Carries the younger bound, "the Campanian-Maastrichtian Wapiti
        Formation", and records that before the Pipestone Creek bone bed "only a
        waterworn hadrosaur pedal phalanx and fragmentary bones had been
        reported" from it. It dates the bone bed itself to the "Late Cretaceous,
        Late Campanian", with palynology from along the Wapiti River "consistent
        with a Late Campanian age for this section of the Wapiti Formation".

Weald Clay:
  rank: group
  period: [Early Cretaceous]
  stages: [Hauterivian, Barremian, Aptian]
  references:
    - id: norman2013a
      notes: >
        Uses group rank and gives the span, heading a section "Weald Clay
        Group, Barremian-Lower Aptian Stages", with an Upper Weald Clay
        Formation inside it.
    - id: barker2023a
      notes: >
        Names the constituent formation directly, the Baryonyx holotype coming
        from "the Barremian Upper Weald Clay Formation of Surrey".
    - id: raven2020a
      notes: >
        The Weald Clay Group is "Hauterivian–Barremian" here, following Batten
        and Austen (2011): the Weald Sub-basin contains "the Weald Clay Group
        (Hauterivian–Barremian ... ), which contains the Upper and Lower Weald
        Clay formations". Horshamosaurus rudgwickensis comes from this group in
        West Sussex.
    - id: harrison1973a
      notes: >
        Assigns the Weald Clay to the "Lower Cretaceous" and places the Wyleyia
        valdensis horizon at Henfield, Sussex, partway up it: ostracods
        "indicate that they lie about 500–600 feet below the top of the Weald
        Clay. This would establish the horizon as being in the middle of the
        Reeves Group II, in the Barremian Substage of the Neocomian Stage."
    - id: batten2011a

Wealden:
  rank: supergroup
  period: [Early Cretaceous]
  stages: [Berriasian, Valanginian, Hauterivian, Barremian, Aptian]
  dispute:
    summary: >
      Supergroup and group are both in current use for this unit. Mannion and
      colleagues (2019) write of "the earliest Cretaceous (Berriasian-
      Hauterivian) sections of the Wealden Supergroup", and Raven and
      colleagues (2020) title their revision "British Wealden Supergroup
      (Berriasian-Aptian) Ankylosaurs". Group rank is also in common use for
      it.
  references:
    - id: mannion2019a
      notes: >
        Supergroup rank and the older half of the range, Berriasian to
        Hauterivian.
    - id: raven2020a
      notes: >
        Supergroup rank and the full span, Berriasian to Aptian, in its title,
        which its abstract repeats as "the Lower Cretaceous Wealden Supergroup
        (Berriasian–Aptian) of Britain". Within it, the Weald Sub-basin holds
        "the Hastings Beds Group (Berriasian–Valanginian)" and, after Batten and
        Austen (2011), "the Weald Clay Group (Hauterivian–Barremian ...)"; in
        the Wessex Sub-basin, where it ranks as a group, it holds "the Wessex
        (Valanginian–Barremian) and Vectis (Aptian) formations".
    - id: batten2011a
    - id: racey1996a
      notes: >
        Small theropods "tentatively referred to as spinosaurids are known only
        from the Cretaceous (Aptian-Albian) of North Africa and possibly also
        from the Wealden (Barremian) of southern England". The unit appears only
        as a faunal comparison for the Sao Khua Formation of northeastern
        Thailand.

Wessex:
  rank: formation
  parent: Wealden
  period: [Early Cretaceous]
  stages: [Berriasian, Valanginian, Hauterivian, Barremian, Aptian]
  references:
    - id: pond2023a
      notes: >
        "the Wessex Formation is considered Barremian", and describes its plant
        debris beds as lenses of organic-rich sediment "distributed apparently
        at random throughout the succession" -- the horizons most Isle of Wight
        dinosaurs come from.
    - id: longrich2022a
      notes: >
        Independently gives "Wessex Formation (Lower Cretaceous, Barremian",
        while its faunal table covers "the Early Cretaceous
        (Hauterivian-Barremian) Wessex Formation".
    - id: raven2020a
      notes: >
        Following Batten (2011), the Wealden Group of the Wessex Sub-basin
        "contains the Wessex (Valanginian-Barremian) and Vectis (Aptian)
        formations, although only Barremian-Aptian strata are exposed at the
        surface".
    - id: batten2011b
    - id: pittman2020a
      notes: >
        The type of Ornithodesmus cluniculus is "Six fused sacral vertebrae from
        the Berriasian-Barremian Wessex Formation of the U.K.", a specimen the
        paper takes as probably dromaeosaurid. Its dromaeosaurid table gives the
        same formation as Barremian, following Howse and Milner (1993).
    - id: norman2012a
      notes: >
        The Iguanodon seelyi holotype from Brook Chine, Isle of Wight, comes
        from the "Wealden Group, Wessex Formation, (Late Barremian–Early
        Aptian)", while the Mantellisaurus atherfieldensis holotype from
        Atherfield Point is placed in the "Wealden Group, Wessex Formation
        (upper Barremian)".

West Melbury Marly Chalk:
  rank: formation
  period: [Early Cretaceous, Late Cretaceous]
  stages: [Albian, Cenomanian]
  references:
    - id: hopson2005a
      notes: >
        Defines the formation and names Copt Point among its primary reference
        sections.
    - id: barrett2020a
      notes: >
        Gives "West Melbury Marly Chalk Formation (Upper Cretaceous;
        Cenomanian)" and notes that its vertebrate remains are "reworked from
        the underlying Gault Formation (Lower Cretaceous; upper Albian".
    - id: raven2020a
      notes: >
        Independently gives "West Melbury Marly Chalk Formation (Cenomanian".

Westbury:
  rank: formation
  parent: Penarth
  period: [Late Triassic]
  stages: [Rhaetian]
  references:
    - id: evans2025a
      notes: >
        Places it beside the Cotham Member, the bivalve Protocardia crowcombeia
        "occurring in the Westbury Formation and Cotham Member of the Lilstock
        Formation of the Rhaetian".
    - id: ezcurra2007a
      notes: >
        Lists it among the well-represented Rhaetian sedimentary units of
        Europe, with the Lower Höganäs Formation of Sweden and the Rhaetian
        Beds of Wales.
    - id: galton1985a
      notes: >
        Gives the type horizon at Wedmore, Somerset, as "Wedmore Stone of
        Westbury Formation in Penarth Group (Rhaetic, Upper Triassic)".

Weymouth:
  rank: member
  parent: Oxford Clay
  period: [Late Jurassic]
  stages: [Oxfordian]
  references:
    - id: naish2007a
      notes: >
        Gives the Metriacanthosaurus horizon as "the Weymouth Member (formerly
        Upper Oxford Clay) of Weymouth, Dorset", and records that two reference
        works "incorrectly stated that M. parkeri is from the Corallian Oolite
        Formation".
    - id: barsbold1997a
      notes: >
        Records the formalization of the three Oxford Clay members by Cox and
        colleagues (1992), this being the uppermost, and calls it "The Oxfordian
        Weymouth Member".
    - id: cox1992a
      notes: >
        Erects the member. The Oxford Clay is classified as a formation and
        "The three traditional subdivisions - Lower, Middle and Upper - are
        endorsed as lithostratigraphic units and named the Peterborough Member,
        Stewartby Member and Weymouth Member, respectively", this being the
        uppermost, "(formerly termed Upper Oxford Clay)". Its lithology is
        "Predominantly pale-grey, blocky, smooth-textured, calcareous mudstone
        ... Generally rather poorly fossiliferous". The age here is the
        formation's and not the member's - "The Oxford Clay is a marine
        argillaceous deposit of Callovian-Oxfordian age" - so this supports the
        Oxfordian only through the parent. All three members run from Dorset to
        Humberside, and this one "is also present in North Yorkshire where it
        is the sole representative of the Oxford Clay Formation".

Willow Tank:
  rank: formation
  period: [Late Cretaceous]
  stages: [Cenomanian]
  references:
    - id: bonde2022a
      notes: >
        Describes Nevadadromeus from "the Upper Cretaceous (Cenomanian) Willow
        Tank Formation of Southern Nevada", and makes it one of only three
        formations preserving its fauna.
    - id: avrahami2024a
      notes: >
        Cites the same unit and age for that taxon.

Winton:
  rank: formation
  parent: Manuka
  period: [Early Cretaceous, Late Cretaceous]
  stages: [Albian, Cenomanian, Turonian]
  references:
    - id: poropat2020a
      notes: >
        Gives "Winton Formation; Cenomanian-lowermost Turonian".
    - id: beeston2024a
      notes: >
        Hedges the younger end, "lower Upper Cretaceous (Cenomanian-?
        lowermost Turonian".
    - id: hocknull2021a
      notes: >
        Reviews the palynology of Monteil (2006) that gave the formation "a Late
        Albian to Cenomanian chronostratigraphic age", and treats the detrital
        zircon results cautiously, saying they "indicate a probable temporal age
        range of between 103 to 92 million years ago (Late Albian to earliest
        Turonian) for the maximal depositional ages of portions of the Winton
        Formation". Gives the Australotitan holotype horizon as "Cenomanian-?
        Turonian, Winton Formation."
    - id: hocknull2009a
      notes: >
        Reports that the formation "is approximately 1100 m thick and is
        ascribed a late Albian-Cenomanian age by Burger", with its lower section
        in an Albian and its upper section in a Cenomanian palynomorph zone.
        Dates the dinosaurs from "the basal portion of the Winton Formation" as
        "latest Albian", describing them as from the "late Early Cretaceous
        (latest Albian) Winton Formation".
    - id: monteil2006a
    - id: burger1986a

Woburn Sands:
  rank: formation
  period: [Early Cretaceous]
  references:
    - id: galton1981a
      notes: >
        Gives the Craterosaurus horizon as "the Woburn Sands (Neocomian, Lower
        Cretaceous) near Potton, Bedfordshire, England". The Neocomian is an
        informal grouping of stages rather than a stage.
    - id: barron2012a
      notes: >
        Places it above the Kimmeridge Clay Formation in the
        Bedfordshire-Cambridgeshire succession.

Wonthaggi:
  rank: formation
  period: [Early Cretaceous]
  stages: [Valanginian, Hauterivian, Barremian, Aptian, Albian]
  references:
    - id: herne2019a
      notes: >
        Places it in its group and dates one locality in it: "The Flat Rocks
        locality in the Wonthaggi Formation (Strzelecki Group) of the Gippsland
        Basin, southeastern Australia, hosts fossils of a late Barremian
        vertebrate fauna". That late Barremian age rests on renewed
        palynological work; earlier palynology, following Wagstaff and McEwen
        Mason (1989), "suggested that the region of the Wonthaggi Formation
        encompassing the Flat Rocks locality was middle Valanginian–middle
        Barremian in age".
    - id: agnolín2010a
      notes: >
        Carries the younger bound, "Wonthaggi Formation, early Aptian", which it
        glosses at its Victorian localities as "early Aptian: late Early
        Cretaceous". It also gives the full span, "the middle Valanginian-Aptian
        Wonthaggi Formation of the Strzelecki Group", which takes in the
        Hauterivian.
    - id: carrano2012a
      notes: >
        Treats the theropod ungual once referred to Megalosaurus (NMV P.10058)
        as coming from "the Valanginian–Albian Wonthaggi Formation".
    - id: wagstaff1989a
      notes: >
        Never names this formation. The five apparent hits on its name are a
        spore epithet, Foraminisporis wonthaggiensis, named after the same
        town and appearing in the zone definitions and a range chart. What the
        paper dates is localities at group level: "the localities in Otway
        Group sediments are of late Aptian-early Albian age ... and the
        localities in the Strzelecki Group of Valanginian-Aptian age". This
        unit is a Strzelecki one, so the reference supports Valanginian to
        Aptian and not the Albian. The base of that zone is contested within
        the paper itself - the first appearance of the spore "has been dated as
        middle Valanginian ... However, Helby et al. (1987) correlate this
        first appearance with the base of the Valanginian stage" - and an
        independent tie-point is given, "Fission-track dating of Kilcunda
        (Lindsay 1982) gave an age of 128 plus or minus 8 m.y.". The paper's
        own condition travels with all of it: "This age determination is
        dependent on the isochronicity of spore-pollen zones across eastern
        Australia."

Woodbine:
  rank: group
  period: [Late Cretaceous]
  stages: [Cenomanian]
  dispute:
    summary: >
      Group or formation, and what sits inside it moves with the answer. Tykoski
      and colleagues (2023) use group rank, placing "the Lewisville Formation of
      the Woodbine Group (middle Cenomanian) of north Texas". Head (1998) and
      McDonald and colleagues (2017) use formation rank, the first with "the
      Arlington Member of the Woodbine Formation" and the second with "the
      Lewisville Member of the Woodbine Formation". Either way, the unit
      contains both the Arlington and the Lewisville.
  references:
    - id: tykoski2023a
      notes: >
        Uses group rank with the Lewisville as a formation inside it, and dates
        its deposits "lower middle Cenomanian".
    - id: head1998a
      notes: >
        Uses formation rank with the Arlington as a member, and fixes the middle
        Cenomanian by the overlying Tarrant Member of the Eagleford Group. Gives
        the age of the Flower Mound type locality as "early Late Cretaceous,
        Mid-Cenomanian, 95 Ma".
    - id: mcdonald2017a
      notes: >
        Uses formation rank with the Lewisville as a member.

Woodbury:
  rank: formation
  period: [Late Cretaceous]
  stages: [Campanian]
  references:
    - id: horner2004a
      notes: >
        A reference work, tabulating Hadrosaurus foulkii from the
        "Merchantville Formation, Woodbury Formation, Marshalltown Formation
        (New Jersey), United States" at Campanian.
    - id: brett-surman1989a
      notes: >
        Independently tabulates "Woodbury Fm, Campanian" among the North
        American hadrosaur-bearing units.
    - id: prieto-márquez2006a
      notes: >
        Gives the type horizon of Hadrosaurus foulkii at Haddonfield, New
        Jersey, as "Woodbury Formation, Campanian, Upper Cretaceous".

Xert:
  rank: formation
  period: [Early Cretaceous]
  stages: [Barremian, Aptian]
  references:
    - id: canudo2008a
      notes: >
        Describes Tastavinsaurus "from the Early Cretaceous (Aptian) of Spain",
        the holotype recovered "from the Arsis-1 site in Peñarroya de Tastavins
        (Teruel) at the base of the marine Xert Formation".
    - id: mocho2023a
      notes: >
        Dates the formation to the latest Barremian, following Bover-Arnal and
        colleagues (2016): the underlying Arcillas de Morella is "dated to the
        late Barremian, and Xert and Forcall formations to the latest Barremian
        and early Aptian, respectively". Records that the Arcillas de Morella
        "passes gradually to bioclastic limestones of the Calizas y Margas de
        Xert Fm." toward its top.
    - id: bover-arnal2016a
      notes: >
        A dedicated chronostratigraphy of the basin, constraining the unit from
        both ends and placing the system boundary above it. An ammonite
        assigned to the Late Barremian Martelites sarasini Zone was collected
        in the lowermost part of the formation, which "allows a precise age
        calibration of the lower part of the Xert Formation"; strontium ratios
        from oyster shells in its upper part "are consistent with a latest
        Barremian-earliest Aptian age"; and "The Barremian-Aptian boundary is
        tentatively placed close above the base of the succeeding transgressive
        marls of the Forcall Formation by analogy with nearby Tethyan basins".
        So on this paper the formation is essentially Barremian, with only its
        very top possibly reaching the earliest Aptian. It names the earlier
        vertebrate work it is re-dating, Canudo and colleagues (2008) among it.

Xiagou:
  rank: formation
  parent: Xinminpu
  period: [Early Cretaceous]
  stages: [Aptian, Albian]
  references:
    - id: zhou2026a
      notes: >
        Places the formation in the "Lower Cretaceous (lower Aptian)", and
        following Suarez and colleagues (2013) says the bird-bearing quarries in
        the Changma Basin "were deposited during the early Aptian". It notes
        "recent arguments that the Xiagou Formation is actually late early
        Aptian to early Albian in age" but judges that the early Aptian dates
        cast doubt on the Changma fauna being younger than the other Jehol bird
        localities.
    - id: you2018a
      notes: >
        Maps beds to formations across two basins: the gray-variegated beds
        belong to the Xiagou "and have an Aptian age, the red beds in both the
        Yujingzi and Gongpoquan basins represent the beginning of the Zhonggou
        Formation with an early Albian" age.
    - id: suarez2013a
      notes: >
        Reaches its own determination chemostratigraphically, correlating
        carbon-isotope segments with the Selli Equivalent and oceanic anoxic
        event 1a, which "firmly places the age of the bird quarries in the
        early Aptian Age". The scope is the horizon rather than the formation -
        "the Xiagou lacustrine strata in this locality", "the age of the bird
        quarries" - so it dates a level, not the unit. It sets that against
        three earlier readings it reports: a Hauterivian from pollen, a
        Barremian from ostracodes and charophytes, and a Barremian-Aptian from
        similarity to the Jehol.
    - id: tong2021a
      notes: >
        Places the macrobaenid turtle Changmachelys bohlini in the "Xiagou Fm.
        (Aptian), Changma Basin, Gansu, China" after Brinkman and colleagues
        (2013), tabulating the same horizon as "Xiagou Fm. Early Cretaceous
        (Aptian)" and calling it elsewhere "the Lower Cretaceous Xiagou
        Formation, Gansu, China".
    - id: brinkman2013b
      notes: >
        "The age of the Xiagou Formation has been interpreted as Aptian on the
        basis of studies of stable carbon isotope chemostratigraphy", and the
        paper adopts that reading, giving its new turtle the age "Xiagou
        Formation, Early Cretaceous, Aptian." Treats the unit as the lower unit
        of the Xinminpu Group, correlates it with the Jiufotang Formation of
        Liaoning and places it above the Yixian.

Xiaguan:
  rank: formation
  period: [Early Cretaceous, Late Cretaceous]
  stages: [Albian, Cenomanian, Turonian, Coniacian, Santonian, Campanian]
  references:
    - id: wang2013c
      notes: >
        Formally establishes the unit, and records what it replaces. The
        egg-bearing red beds of the Xiaguan-Gaoqiu Basin in Neixiang and
        Zhenping Counties, southwestern Henan, had "variously been called the
        'Gaogou Formation,' 'Majiacun Formation,' 'Sangping Formation,' and
        'Xiaguan Formation,' but none of these names was based on a formally
        measured stratigraphic section", no invertebrate or plant fossils useful
        for dating having been found. A section measured in 2011 yielded
        ostracods, bivalves, gastropods, charophytes and plant megafossils,
        making it "possible to formally establish the 'Xiaguan Formation' as a
        formation-level stratigraphic unit". On age the paper hedges in one
        place, the formation "may be the early-middle Late Cretaceous, and most
        possibly to be the middle-late Turonian to the middle Campanian", and
        states in another that it "should be middle-late Turonian to middle
        Campanian".
    - id: xu2000a
      notes: >
        Dates the red beds of the Xiaguan Basin, under the name Sangping
        Formation, as Early Cretaceous on the evidence of Nanyangosaurus: the
        occurrence "supports an Early Cretaceous age of Xiaguan redbed", and
        "the Sangping Formation may represent Albian deposits".

Xiaoyan:
  rank: formation
  period: [Late Cretaceous]
  stages: [Campanian, Maastrichtian]
  references:
    - id: butler2008b
      notes: >
        Gives the Wannanosaurus type as from "the Xiaoyan Formation of Anhui
        Province, China (Late Cretaceous: Campanian)".
    - id: butler2009b
      notes: >
        Gives "the Xiaoyan Formation (Campanian-?early Maastrichtian) of Anhui
        Province".

Xinhe:
  rank: formation
  period: [Middle Jurassic]
  stages: [Bathonian]
  references:
    - id: li2025a
      notes: >
        Describes a non-neosauropod eusauropod from "the Middle Jurassic Xinhe
        Formation of Gansu Province, northwestern China", found in sandstone of
        the lower part of the formation. "The megafossil plants, palynoflora
        from the lower part, as well as the lacustrine invertebrate assemblage
        from the upper part of the Xinhe Formation ... indicate that the
        dinosaur-bearing horizon is late Bathonian in age."
    - id: gao2019a
      notes: >
        Places it in the local succession: "The Qingtujing Group has been
        divided into two lithostratigraphic units, the Longfengshan Formation
        and the Xinhe Formation", and gives a vertebrate locality "near the
        bottom of the upper part of the Xinhe Formation" at Qingtujing,
        Jinchang City, Gansu.

Xinlong:
  rank: formation
  period: [Early Cretaceous]
  stages: [Aptian, Albian]
  references:
    - id: ji2022a
      notes: >
        Reads the age narrowly, adopting the view of Mo and colleagues (2016)
        that "the geological age of the fossil-bearing Member 2 of the Xinlong
        Formation should be the Aptian, in the late Early Cretaceous".
    - id: sethapanichsakul2026a
      notes: >
        Gives "Xinlong Formation, Aptian-Albian".
    - id: mo2016a
      notes: >
        Gives the Aptian and not the Albian, which appears once in the paper
        and not for this unit. The age is reached by faunal correlation: the
        assemblage "seems to be particularly close to that from the Khok Kruat
        Formation, considered as Aptian in age, as shown especially by sharks
        and turtles and by the presence of iguanodontians. An Aptian age is
        therefore proposed for the Xinlong Formation." Note the correlation is
        onto a unit whose own Aptian is itself reported rather than
        established here, and that the age is given for the formation; the
        division into members is a later paper's framing.

Xinminpu:
  rank: group
  period: [Early Cretaceous, Late Cretaceous]
  stages: [Barremian, Aptian, Albian]
  references:
    - id: tang2001b
      notes: >
        The dedicated lithostratigraphy, which gives the rank, the setting and
        the span: the group "was deposited in a fluviolacustrine setting in
        Mesozoic graben basins under a semi-arid, subtropical climate", and
        "sediments of the lower part ... are considered to be Late
        Barremian-Aptian in age, although the middle and upper parts could be
        as young as Albian". Prints the name Xinminbao.
    - id: you2005b
      notes: >
        Gives "the Early Cretaceous Xinminpu Group in the Gongpoquan Basin of
        Gansu Province, China", a series-level statement rather than a stage.
    - id: zanno2010a
      notes: >
        Places the uppermost part of the group, in the Gongpoquan Basin of the
        Mazongshan area, at "late Early or early Late Cretaceous", and gives the
        group in the Yujingzi Basin as Early Cretaceous, "Aptian-Albian", both
        following Tang and colleagues (2001). Prints the name as "Xinminpu (=
        Xinminbao) Group".
    - id: chen1983a
      notes: >
        In the Yumen district "the Lower Cretaceous Xinminpu Group is subdivided
        into the Xiangou Formation (below) and the Zhonggou Formation (above)",
        conglomerates, sandstones, siltstones, mudstones and shales carrying
        conchostracans, ostracods, pelecypods, gastropods, an insect and a fish.
        Its relation "to the Upper Jurassic Chijinpu Formation is disconformable
        or unconformable in this district, but the aspect of their molluscan
        fossils is very close".

Xintiangou:
  rank: formation
  period: [Early Jurassic, Middle Jurassic]
  stages: [Toarcian, Aalenian, Bajocian]
  references:
    - id: li2019a
      notes: >
        Gives both a biostratigraphic and a radiometric reading: on sporopollen
        and Euestheria the formation "is regarded as the early Middle Jurassic",
        while "preliminary U-Pb dating suggests the Xintiangou Formation ranges
        between 180 and 170 Ma, corresponding to the Aalenian-Toarcian age
        (Middle Jurassic to Early Jurassic)". Places it between the Ziliujing
        below and the Lower Shaximiao above.
    - id: li2011a
      notes: >
        Reaches the age by elimination, leaving "an Aalenian-Bajocian time for
        the underlying, Middle Jurassic Xintiangou Formation" once the
        Shunosaurus-Omeisaurus assemblage above is placed in the
        Bajocian-Bathonian.
    - id: dai2020a
      notes: >
        Gives a locality in it as "Laojun Village, Puan Township, Yunyang City,
        Chongqing, China", and notes a U-Pb date on the lowest beds of the
        overlying Shaximiao.

Yalovach:
  rank: formation
  period: [Late Cretaceous]
  stages: [Santonian]
  references:
    - id: averianov2007a
      notes: >
        Gives the Kansai locality as "This important lower Santonian vertebrate
        locality in the Yalovach Formation of the northern Fergana Depression
        in northern Tajikistan".
    - id: averianov2019b
      notes: >
        Sets it beside the Bostobe Formation of Kazakhstan as a
        "relatively well-sampled Santonian-age" unit.

Yellow Cat:
  rank: member
  parent: Cedar Mountain
  period: [Early Cretaceous]
  stages: [Berriasian, Valanginian, Hauterivian, Barremian, Aptian]
  references:
    - id: senter2012b
      notes: >
        Places it in its parent and hedges the Barremian: "Yellow Cat Member of
        the Cedar Mountain Formation (Early Cretaceous, Barremian? - Aptian".
    - id: kirkland2016a
      notes: >
        Reads it as spanning the Aptian, against the hedged Barremian of the
        other.
    - id: joeckel2019a
      notes: >
        Zircons from ten horizons give youngest single-grain ages "ranging from
        142.5±2.7 Ma to 133.7 ± 2.7 Ma (Berriasian–late Valanginian)", and a new
        palynoflora "is provisionally assigned to the middle Berriasian–early
        Hauterivian stages". The ages hold for the sections sampled: "Although
        earlier studies documented the presence of Barremian–Aptian strata in
        other parts of the Yellow Cat Member, the stratigraphic sections
        examined for this zircon U-Pb geochronologic study range through the
        Berriasian, Valanginian, and Hauterivian stages." The member is diachronous rather
        than fixed to those stages: the paper does not set aside the younger
        dates elsewhere, citing a 124 Ma age near Dalton Wells as
        "demonstrating that the unit ranges upward into the early Aptian" and
        maximum depositional ages south of Green River putting parts of it no
        older than Barremian to Aptian, and concludes that "the stratigraphic
        architecture of the Yellow Cat Member is probably more complex than
        earlier conceptions based on lithostratigraphic perspectives". So the
        member's name alone does not fix a horizon's age.
    - id: sprinkel2012a
      notes: >
        "Barremian for the Yellow Cat Member in the northern Paradox Basin" is
        one of the tentative ages the lower three members of the Cedar Mountain
        Formation were initially assigned "based on dinosaur biostratigraphy".
        The member "extends below the interval of extensive calcretes
        development" to take in a strongly mottled, iron-stained interval with
        floating chert pebbles and an Early Cretaceous dinosaur fauna, and is
        "correlative, at least in part, with the Buckhorn Conglomerate".

Yezo:
  rank: group
  period: [Early Cretaceous, Late Cretaceous]
  stages: [Aptian, Albian, Cenomanian, Turonian, Coniacian, Santonian,
    Campanian, Maastrichtian]
  references:
    - id: kobayashi2022a
      notes: >
        Describes the group as "composed of mainly Upper Cretaceous marine
        sediments and rich in invertebrate and vertebrate fossils, including
        sharks, plesiosaurs, mosasaurs, turtles, pterosaurs, non-avian
        dinosaurs, and birds", with the hedge in "mainly" left unexplained.
        Paralitherizinosaurus comes from "The Osoushinai Formation (early
        Campanian) of the Yezo Group" at Nakagawa.
    - id: takashima2004a
      notes: >
        Redefines the group at both ends. Its scheme runs "the Soashibetsugawa
        Formation (Lower Aptian mudstone unit)" upward through six more to "the
        Hakobuchi Formation (Lower Campanian Paleocene shallow-marine
        sandstone-conglomerate unit)", so the group begins in the Aptian rather
        than the upper Albian. The Hakobuchi is erected here as a formation that
        "corresponds to the Hakobuchi Group of Matsumoto", absorbing what
        earlier schemes kept above the group.
    - id: hayakawa2005a
      notes: >
        The superseded slicing: the Cretaceous strata comprise the group at
        "(Upper Albian-Santonian)" with "the Hakobuchi Group
        (Campanian-Paleocene)" above it as a separate group.
    - id: kobayashi2019a
      notes: >
        Follows the redefinition, describing Kamuysaurus from "the Late
        Cretaceous Hakobuchi Formation, Yezo Group".
    - id: suzuki2004a
      notes: >
        Records the renaming of the horizon rather than of the group: the
        "Upper Ammonites Bed" is "now Upper Yezo Group", and Matsumoto and
        Obata (1979) "advocated a late Santonian-early Campanian age, based on
        correlated molluscs". Note the source names the Upper Yezo Group
        specifically; whether the bare name should be read as that subdivision
        is unresolved, so no stages are recorded.
    - id: matsumoto1942a
    - id: matsumoto1979a
      notes: >
        Names the group once, and places it in the Japanese correlation-unit
        notation rather than in stages: plant fossils, pollen and other
        non-marine fossils are admixed in "the Yezo Group (K3-K5, part of
        K6a), the Izumi Group (K6), the Choshi Cretaceous (K2, K3a), and the
        Miyako Group (K3a to part of K3b)". No passage defines those units in
        stage terms, so the assignment is recorded as the paper gives it.

Yimen:
  rank: formation
  period: [Early Jurassic, Middle Jurassic]
  references:
    - id: li2010a
      notes: >
        Describes Tonganosaurus from "the Lower Jurassic Yimen Formation of
        Huili, Sichuan". Gives only the series.
    - id: maisch2019a
      notes: >
        Records that the taxon "from the Lower Jurassic Yimen Formation of
        southern Sichuan is currently the oldest known member" of
        Mamenchisauridae.
    - id: mcphee2016a
      notes: >
        Tabulates Tonganosaurus from it with a putative age of "?Lower–Middle
        Jurassic", and singles the unit out in recommending "caution in
        accepting the current age estimates" for the Early Jurassic
        sauropod-bearing units of China, since Tonganosaurus has been assigned
        to Mamenchisauridae, "a group otherwise restricted to the Middle–Late
        Jurassic".

Yixian:
  rank: formation
  period: [Early Cretaceous]
  stages: [Valanginian, Hauterivian, Barremian, Aptian, Albian]
  references:
    - id: zhou2006b
      notes: >
        Places Psittacosaurus lujiatunensis in the "lowest part of the Yixian
        Formation (Hauterivian, Early Cretaceous)." It reports the 40Ar/39Ar
        date of Wang and colleagues (2001), first as "A basalt sample from the
        lower part of the Jianshangou sequence at Sihetun has yielded a
        40Ar/39Ar date of 128.4 ± 0.2 Ma" and later for "the upper parts of the
        Lujiatun beds of the Yixian Formation in western Liaoning", and
        concludes that "the age of these beds appears to be Hauterivian".
    - id: jiang2006a
      notes: >
        Concludes from published radiometric ages, which mostly "range from 119
        to 133 Ma ... with a concentration around 125 Ma (Barremian)", that "The
        age of the Yixian Formation is, therefore, late Hauterivian to early
        Barremian."
    - id: pittman2020a
      notes: >
        Treats the formation as Barremian–Aptian, alongside the Aptian Jiufotang
        Formation: "The Barremian-Aptian Yixian Formation and Aptian Jiufotang
        Formation of northeastern China, which yield part of the Jehol Biota".
    - id: wang2001c
    - id: tong2021a
      notes: >
        Manchurochelys manchoukuoensis comes from the "Yixian Formation
        (Barremian–Aptian), Liaoning, China", and the occurrence table repeats
        "Yixian Fm. Early Cretaceous (Barremian–Aptian)" for it, for Ordosemys
        liaoxiensis of western Liaoning and for Xiaochelys ningchengensis of
        Inner Mongolia. The ages accompany the cited turtle records rather than
        being argued in this paper.
    - id: jin2012a
      notes: >
        The "lowest more fluvial, volcanoclastic beds" of the formation, which
        yielded Hexing qingyi and, before it, Shenzhousaurus orientalis, are
        "Lower Valanginian–Lower Barremian, Lower Cretaceous" and "older than
        128 million years and younger than 139 million years", the dating
        following Swisher and colleagues (2002).
    - id: sereno2010a
      notes: >
        Type horizons for Psittacosaurus lujiatunensis and P. major read
        "Lujiatun Beds, lowermost Yixian Formation (late Barremian or earliest
        Albian)". Elsewhere the same lowermost beds, Lujiatun and Jianshangou,
        are "no older than 123–125 Ma, straddling the Barremian-Aptian boundary"
        on the radiometric dates of He and colleagues (2006) and Zhou and
        colleagues (2007), with the youngest Liaoning psittacosaurs lying below
        the Aptian-Albian boundary.

Yongkang:
  rank: group
  period: [Early Cretaceous, Late Cretaceous]
  stages: [Aptian, Albian, Cenomanian]
  references:
  - id: chen2013a
    notes: >
      Names the group and its three mid-Cretaceous constituent formations,
      the Guantou, Chaochuan and Fangyan, in ascending sequence in the
      Yongkang Basin of Zhejiang.

Yubacun:
  rank: formation
  period: [Early Jurassic]
  stages: [Hettangian, Sinemurian]
  references:
    - id: hu2026a
      notes: >
        Records that Wudingloong, "discovered from the Lower Jurassic Yubacun
        Formation, is considered the earliest-diverging sauropodomorph in East
        Asia". Gives only the series.
    - id: huang2005a
      notes: >
        On paleomagnetic correlation assigns "the variegated transitional bed
        from the Upper Triassic to the Lower Jurassic" to the Jurassic,
        "corresponding roughly to the Hettangian through lower Sinemurian". At
        the Yangjiazhuang section the upper part "corresponds to the lower part
        of the Early Jurassic Sinemurian and the top of the Hettangian", while
        lower samples from the formation there fall in a polarity zone "spanning
        the Early Jurassic Hettangian to the Late Triassic Rhaetian".

Yuliangzi:
  rank: formation
  period: [Late Cretaceous]
  stages: [Maastrichtian]
  references:
    - id: xing2022a
      notes: >
        Gives "the upper Yuliangzi Formation (middle Maastrichtian)" and the
        correlation across the border: stratigraphic data "indicate that the
        Yuliangzi Formation is temporally and lithologically equivalent to the
        Udurchukan Formation". The Wulaga locality lies in the "Upper parts of
        the Udurchukan and Yuliangzi formations that are contemporaneous
        deposits both in the southern Zeya-Bureya Basin, middle Maastrichtian,
        Late Cretaceous".
    - id: yao2026a
      notes: >
        Hedges the older end, "the Yuliangzi Formation (?early to middle
        Maastrichtian) in Jiayin and Xunke, Heilongjiang Province".
    - id: godefroit2000a
      notes: >
        Reports the bonebeds "excavated in the Late Maastrichtian Yuliangze
        Formation near Jiayin (Heilongjang Province, northeastern China)",
        printing the name Yuliangze, and gives the type stratum as "Yuliangze
        Formation (Late Maastrichtian, Late Cretaceous)". It proposes the Late
        Maastrichtian age because preliminary palynological studies place the
        formation in the Wodehouseia spinata–Aquilapollenites subtilis
        palynozone.

Zhanghe:
  rank: formation
  period: [Middle Jurassic]
  stages: [Aalenian, Bajocian, Bathonian]
  references:
    - id: xing2013a
      notes: >
        Gives "Zhanghe Formation, the lower Middle Jurassic (Aalenian-Bajocian".
    - id: zou2025a
      notes: >
        Independently gives "Zhanghe Formation, early Middle Jurassic,
        Aalenian/Bajocian".
    - id: zhen1985a
      notes: >
        Relays that Chen and colleagues (1982), "on the basis of non-marine
        invertebrates assigned a Middle Jurassic (Bajocian-Bathonian) age to the
        Zhanghe Formation", the name now used for the beds Young (1951) called
        the "upper Lufeng series" or "variegated beds".
    - id: chen1982a
    - id: young1951a

Zhangjiawa:
  rank: member
  parent: Lufeng
  period: [Late Triassic, Early Jurassic]
  stages: [Norian, Rhaetian, Hettangian, Sinemurian]
  variants: [Deep Red Beds, Dark Red Beds]
  references:
    - id: irmis2004a
      notes: >
        Records the formalization and the informal names it replaced: the Lufeng
        "was informally divided into two subunits, the lower 'Dark Purple Beds'
        and upper 'Deep Red Beds' (Bien 1941). Fang et al. (2000) formalized
        these units into the Shawan Member and Zhangjiawa Member, respectively."
    - id: zhang2026b
      notes: >
        Describes it as the upper of the two, "which consists of dark red
        siltstone facies", above the dark purple Shawan Member.
    - id: luo1994a
      notes: >
        Argues that the upper faunal assemblage from the Dark Red Beds is "Early
        Jurassic in age, most probably Sinemurian, and definitely no older than
        Hettangian", agreeing with Sun and colleagues (1985) on the Early
        Jurassic age.
    - id: young1948a
      notes: >
        Gives the Lukousaurus yini horizon as "Upper Triassic Dark Red Beds of
        the Lower Lufeng Series".
    - id: fang2000a
      notes: >
        Erects the nomenclature this entry uses and places all of it in the
        Lower Jurassic: the formal definitions sit under a Lower Jurassic
        heading and carry J1 symbols, with the Triassic units below them. The
        paper names no international stage anywhere, and no Norian, Rhaetian or
        Upper Triassic appears in it, so the Triassic stages on this entry are
        not from here.
    - id: bien1941a
    - id: sun1985a
    - id: barrett2012a
      notes: >
        Takes the Dark Red Beds as Early Jurassic after Luo and Wu (1994),
        giving the horizon of the Pachysuchus imperfectus holotype as "Dark Red
        Beds, Lower Lufeng Formation (? Hettangian-Sinemurian, Lower Jurassic".
        Reidentifying that holotype as an indeterminate sauropodomorph removes
        the phytosaur record that had been used to argue a Late Triassic age for
        the Lower Lufeng Formation.
    - id: carroll1977a
      notes: >
        The Fulengia youngi holotype from Ta Ti in the Lufeng Basin comes from
        the "Dark Red Beds, Lower Lufeng series, Upper Triassic, equivalent to
        the Norian or Rhaetic of Europe".
    - id: huang2005a
      notes: >
        A magnetostratigraphic study of the Jurassic in the Lufeng area, and it
        places this unit and its neighbors in the Lower Jurassic: its
        stratigraphic table carries the Fengjiahe and the Lufeng formations
        both as J1, with the Lufeng's Zhangjiaba and Shawan members beneath
        that heading and the Triassic units below them. It correlates the upper
        part of the Lufeng Formation with the upper Toarcian, reads sites low
        in the section as "roughly" middle Sinemurian, and records that the
        interval "from the base of the Zhangjiaba Member through the Shawan
        Member has unstable rock magnetism with disordered directions", so the
        members themselves are the part it cannot correlate. It concludes that
        the transitional Yubacun Formation, between the Upper Triassic Zhaijie
        and the Lower Jurassic Lufeng, "should be assigned to the Jurassic
        System". It names no Norian, and its single Rhaetian is a polarity zone
        below this unit. Note it spells the member Zhangjiaba, a third form
        beside Zhangjia'ao and Zhangjiawa.

Zhengyang:
  rank: formation
  period: [Late Cretaceous]
  references:
    - id: dai2025a
      notes: >
        Describes Qianjiangsaurus from the Zhengyang Formation of the Qianjiang
        district, southwest China, at Late Cretaceous. Gives only the series.
    - id: ma2026a
      notes: >
        Places a second hadrosauroid skull "from the top of the Upper
        Cretaceous Zhengyang Formation that is stratigraphically comparable to
        the horizon of the Q. changshengi holotype".

Zhenzhuchong:
  rank: member
  parent: Ziliujing
  period: [Early Jurassic]
  stages: [Sinemurian]
  references:
    - id: dong1983a
      notes: >
        Zhenzhuchong is carried at formation rank here for the Sichuan Basin,
        after a spell as a member of the Ziliujing Group and, before that, as
        the Zhenzhuchong clays of Tan and Li (1933); at the 1978 Symposium on
        the Mesozoic Stratigraphy of Sichuan "There was agreement that this unit
        should be provided formational status with an age of Early Jurassic".
        The age rests on the Lufeng fauna the unit carries, Gyposaurus sinensis
        and Sinosaurus from Dafang County, Guizhou, and a plateosaurid ungual
        close to Lufengosaurus from Hulin, Weiyuan County, which "confirms
        that the Zhenzhucheng Fm. produces an Early Jurassic (Rhaeto-Liassic)
        Lufeng Fauna", the paper's one use of that spelling against sixteen of
        Zhenzhuchong, with a Cyathidites undulatisportes pollen zone and a
        Coniopteris-dominated macroflora read the same way. It sits above the
        Late Triassic Shunjiahe Formation and below the Ziliujing Formation,
        whose Dongyuemiao Member yields the Liassic Bishanopliosaurus.
    - id: han2023a
      notes: >
        "the Lower Jurassic Zhenzhuchong Member (possibly in Sinemurian),
        Ziliujing Formation". The age is hedged in the source.
    - id: wang2025a
      notes: >
        Independently gives "the Zhenzhuchong Member of the Ziliujing Formation
        of Pingba district of Guizhou Province". Elsewhere in the literature
        Zhenzhuchong is used at formation rank for the Sichuan Basin; both
        cited papers use member.

Zhiluo:
  rank: formation
  period: [Middle Jurassic, Late Jurassic]
  stages: [Bathonian, Callovian, Oxfordian]
  references:
    - id: bajpai2023a
      notes: >
        Records the revision, the Lingwulong horizon having "recently been
        revised from the late Toarcian-Bajocian Yanan Formation to the
        Bathonian-Callovian Zhiluo Formation", and notes that Ren and
        colleagues assign the taxon a Callovian age.
    - id: dai2022a
      notes: >
        Gives the same revision with a younger upper age, the horizon moving
        "from Yan'an Formation (Aalenian-Bajocian) to Zhiluo Formation
        (Bathonian-early Oxfordian)".

Zhonggou:
  rank: formation
  parent: Xinminpu
  period: [Early Cretaceous]
  stages: [Albian]
  references:
    - id: you2014a
      notes: >
        Places it in its group: "Zhonggou Formation, Xinminpu Group, Lower
        Cretaceous (Albian".
    - id: zheng2023a
      notes: >
        Independently gives the "Zhonggou Formation of Jiuquan Basin, which is
        interpreted as Albian".

Zhoutian:
  rank: formation
  parent: Ganzhou
  period: [Late Cretaceous]
  stages: [Cenomanian, Turonian, Coniacian]
  references:
    - id: xing2024a
      notes: >
        Gives a type horizon of "Zhoutian Formation, Ganzhou Group
        (Turonian-early Coniacian; Upper Cretaceous; 96-90 Ma)", from beds
        "from which no vertebrate body fossils have previously been reported".
    - id: han2024a
      notes: >
        Describes the lithology, "reddish siltstone and sandstone, with
        interbedded halite beds", and places the Gandititan type at Datangkeng,
        Ganxian District, Ganzhou City, Jiangxi Province. Following Li and
        colleagues (2017), "Palynological analysis suggests an early Late
        Cretaceous (Cenomanian–Turonian) age".
    - id: li2017a

Zhumapu:
  rank: formation
  period: [Late Cretaceous]
  references:
  - id: wang2013a
    notes: >
      Reaches 722 m in the Zuoyun area of Shanxi, overlying the Zuoyun
      Formation across a parallel unconformity and covered by Tertiary
      basalts. Dated to the early Late Cretaceous on biostratigraphic
      correlation from angiosperms, spores and pollen, ostracods and
      bivalves; no radiometric age has been obtained.
  - id: wang2015a
    notes: >
      Reports a second hadrosauroid from the same locality and horizon and
      repeats the early Late Cretaceous age.
  - id: jia2024a
    notes: >
      Places the sand-mudstone of the formation conformably above the Zuoyun
      Formation in the Yungang Basin.

Ziliujing:
  rank: formation
  period: [Early Jurassic, Middle Jurassic]
  stages: [Sinemurian, Pliensbachian, Toarcian]
  references:
    - id: han2023a
      notes: >
        "the Lower Jurassic Zhenzhuchong Member ..., Ziliujing Formation", for
        the Qianlong type locality in Guizhou.
    - id: wang2025a
      notes: >
        Independently gives "the Lower Jurassic Ziliujing Formation of
        neighboring Guizhou Province". Gives only the series.
    - id: yao2025a
      notes: >
        Gives the Archaeocursor horizon as the "Dongyuemiao Member of the
        Ziliujing Formation, Early Jurassic, late Sinemurian-Pliensbachian": the
        member "is generally accepted to be of Pliensbachian age", and
        geochemical and palynological data "even suggest a late Sinemurian to
        early Pliensbachian age for this member." For the top of the formation
        it says "The uppermost layer of the Ziliujing Formation, the Da'anzhai
        Member, has been solidly dated to the Toarcian stage".
    - id: dong1983a
      notes: >
        Calls the age "rather controversial, as bivalve and conchostracan
        workers recognize the age as Middle Jurassic" while "The crocodiles and
        fish are Early Jurassic elements", and "provisionally regards the
        Ziliujing Fm. as Early to Middle Jurassic predominantly based upon the
        bivalve data".

Zuoyun:
  rank: formation
  period: [Early Cretaceous]
  stages: [Albian]
  references:
    - id: jia2024a
      notes: >
        Describes Yanbeilong from "the late Early Cretaceous Zuoyun Formation
        (Albian in age) of Zuoyun County, Shanxi Province", and describes the
        unit as purple-red conglomerate with mudstone, beneath the Zhumapu
        Formation.
    - id: sánchez-fenollosa2025a
      notes: >
        Independently gives "Ya. ultimus (Albian, Zuoyun Formation, China)".

Zuunbayan:
  rank: formation
  period: [Early Cretaceous]
  stages: [Hauterivian, Barremian, Aptian, Albian]
  variants: [Dzunbain, Dzun Bayn]
  references:
    - id: khand2000a
      notes: >
        The name covers two units this paper keeps apart: the Shinekhudag
        Formation, whose "fossil record indicates the age as
        Hauterivian-Barremian", was "the lower Zuunbayan Formation" of Vasilev
        and colleagues (1959), and the Khukhteeg Formation, "considered to be
        Aptian-Albian in age", was "the upper Zuunbayan Formation". Khosbayar
        (1996) separately established a Zuunbayan Formation in the Tamtsag
        basin, "correlative with the Shinekhudag and Khukhteeg Formations in the
        basins of Dornogobi", but "the description of them was not published".
    - id: arbour2015a
      notes: >
        Leads with this spelling and lists the others, "Zuunbayan (= Dzun Bayn,
        Dzunbayn, Dzunbain) Formation (roughly equivalent to the
        Khukhtyk/Huhteg Svita), Aptian-Albian", for the Shamosaurus holotype at
        Khamryn-Us in the southeastern Gobi.
    - id: tumanova2018a
      notes: >
        Gives "the Dzunbain Formation (Aptian–Albian or Upper Aptian–Lower
        Albian)" at the Khamryn-Us locality on the Barun-Khadyn-Khyar Stony
        Plateau, about 160 km southeast of Sain Shand, and resolves the
        Mongolostegus holotype horizon further as "Lower Cretaceous,
        Aptian–Albian, Khukhtykskii Horizon, Dzunbain Formation".
    - id: xing2024a
      notes: >
        Independently gives "Dzunbain Formation, Aptian-Albian" for
        Shamosaurus.
    - id: sohn1979a
      notes: >
        Dates it as Barremian under the spelling Dzunbain, giving the horizon of
        the type species of the ostracod Limnocypridea, L. abscondida, as
        "Dzunbain Formation (Barremian), SE Mongolia".
    - id: vanitterbeeck2004a
      notes: >
        Under the name Dzun Bayn suite, the unit ranges "in age from Hauterivian
        to Albian", after Khand and colleagues (2000). Its ostracod fauna is the
        closest match to that of the Dashuiguo Formation of Inner Mongolia,
        which on ostracod evidence makes that formation Barremian–Albian.

Öösh:
  rank: formation
  period: [Early Cretaceous]
  stages: [Berriasian, Valanginian, Hauterivian, Barremian, Aptian, Albian]
  dispute:
    summary: >
      Which regional unit it belongs to is unsettled, and the two answers give
      ages that barely overlap. Andres and Ji (2005) set it out: the formation
      "has most often been assigned to the Hüteeg Svita, Hüteeg Gorizont
      (Aptian-Albian), but, more recently authors have assigned it to the
      Öndörukhaa Svita, Tsagaantsav Gorizont (Berriasian-Valanginian". Pittman
      and colleagues (2020) tabulate it as Berriasian-Barremian, between the
      two.
  references:
    - id: andres2005a
      notes: >
        Describes the formation as "an approximately 600-m-thick Early
        Cretaceous succession" and reports that it "has most often been assigned
        to the Hüteeg Svita, Hüteeg Gorizont (Aptian–Albian), but, more recently
        authors have assigned it to the Öndörukhaa Svita, Tsagaantsav Gorizont
        (Berriasian-Valanginian)". For the pterosaur from the "cannonball" beds,
        which form the lowest part of the formation, it gives the age as "Early
        Cretaceous (Berriasian–Valanginian or Aptian–Albian)".
    - id: pittman2020a
      notes: >
        Tabulates "Öösh Formation | Mongolia | Cretaceous Early |
        Berriasian-Barremian".
    - id: cuenca-bescós2003a
      notes: >
        Correlates the unit, under the spelling Oshih, to the Tsagantsavian,
        which comprises "a basaltic layer of 130 Ma", and lists it in a
        paleogeographic figure of the Hauterivian as "4, Oshih (Hauterivian,
        Gobi, China)". Because the chronostratigraphy of the Lower Cretaceous
        "is still a matter of discussion", it adds that "Oshih can also be
        Valanginian or Barremian in age (sensu Gradstein et al. 1999)".
