clade: Dicraeosauridae
description: >
  Dicraeosauridae is a family of flagellicaudatan sauropods that are the sister
  group to the whip-tailed diplodocids. The family includes genera such as
  Amargasaurus, Suuwassea, and Brachytrachelopan, and its members are best known
  from Africa, South America, and North America, spanning the Early or Middle
  Jurassic through the Early Cretaceous; several Asian taxa, including
  Lingwulong and Tharosaurus, have been proposed as dicraeosaurids, though this
  remains contested. The group stands apart from other advanced sauropods, which
  trend toward gigantism, in being relatively small at roughly 10 to 13 meters
  long and in bearing distinctively short necks built from comparatively few
  vertebrae. Their most striking feature is a series of extremely tall neural
  spines running along the neck and back, reaching bizarre proportions in forms
  such as Amargasaurus and Bajadasaurus. As obligate herbivores with short
  necks, they are thought to have browsed close to the ground or at mid height.
  Amargasaurus was the latest-surviving member, persisting into the Early
  Cretaceous.
type_genus: Dicraeosaurus
erected_in: huene1927c
described_in: sereno1998a
diagnostic_features:
  - Tall, dorsoventrally elongate neural spines on the cervical and dorsal
    vertebrae, bifurcated along much of the column
  - Relatively short neck with comparatively few, foreshortened cervical
    vertebrae
  - Postparietal fenestra present, with an expanded crista prootica on the
    braincase
  - Reduced or absent pneumaticity of the presacral vertebral centra
references:
  - id: huene1927c
    notes: Work credited as the authority for the family Dicraeosauridae.
  - id: sereno1998a
    notes: Provided the stem-based phylogenetic definition of Dicraeosauridae.
