clade: Dicraeosauridae
description: >
  Dicraeosauridae is a family of flagellicaudatan sauropods known from the Middle
  Jurassic to Early Cretaceous of South America, Africa, North America, and Asia.
  Dicraeosaurids are small to medium-sized, short-necked diplodocoids with tall,
  often bifurcated cervical and dorsal neural spines that reach extreme lengths
  in forms such as Amargasaurus and Bajadasaurus. The family is defined as the
  stem-based clade of all flagellicaudatans more closely related to Dicraeosaurus
  than to Diplodocus (Sereno, 1998).
type_genus: Dicraeosaurus
erected_in: huene1927c
described_in: sereno1998
diagnostic_features:
  - Tall, dorsoventrally elongate neural spines on the cervical and dorsal
    vertebrae, bifurcated along much of the column.
  - Relatively short neck with comparatively few, foreshortened cervical
    vertebrae.
  - Postparietal fenestra present, with an expanded crista prootica on the
    braincase.
  - Reduced or absent pneumaticity of the presacral vertebral centra.
