clade: Ornithischia
description: >
  Ornithischia, meaning "bird-hipped," is one of the two traditionally
  recognized major clades of dinosaurs. Ornithischians are united by a
  distinctive pelvic anatomy in which the pubis is rotated posteriorly to lie
  parallel with the ischium, convergently resembling the pelvic arrangement of
  birds (though birds are actually saurischians). The clade includes the armored
  thyreophorans (stegosaurs and ankylosaurs), the horned ceratopsians, the
  dome-headed pachycephalosaurs, and the duck-billed ornithopods, together with
  a grade of small early-diverging forms and the early-branching
  Heterodontosauridae. All ornithischians were herbivorous.
erected_in: seeley1888ornithischia
described_in: madzia2021a
diagnostic_features:
  - Opisthopubic pelvis with the pubis rotated posteriorly to parallel the ischium
  - Predentary bone capping the tip of the lower jaw
  - Leaf-shaped cheek-tooth crowns with denticulate margins
  - Palpebral (supraorbital) bone roofing the orbit
  - Ossified epaxial tendons along the vertebral column in many members
references:
  - id: seeley1888ornithischia
    notes: Erected Ornithischia.
  - id: madzia2021a
    notes: Provides the modern phylogenetic definition of Ornithischia.
