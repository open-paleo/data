clade: Parvicursorinae
description: >
  Parvicursorinae is the derived subfamily of alvarezsaurids that dominated the
  Late Cretaceous of Asia, with a few members in North America. It contains the
  smallest, most specialized alvarezsaurs, in which the forelimb is reduced to a
  stout, single-clawed digging or probing tool and the hindlimb is elongate and
  extensively fused. Defined as the most inclusive clade containing Parvicursor
  but not Patagonykus (Xu and colleagues, 2010), it takes priority over
  Mononykinae as originally defined, though Agnolín and colleagues (2012) rename
  that group Mononykini, as a smaller clade within it; its internal
  relationships are poorly resolved and largely form a polytomy (Fowler and
  colleagues, 2020).
type_genus: Parvicursor
erected_in: karhu1996a
diagnostic_features:
  - Absence of pleurocoels in the cervical vertebrae
  - Absent or reduced, laterally facing fibular facet of the astragalus
  - Broad ascending process of the astragalus covering most of the anterior
    surface of the distal tibia
  - Notch on the medial edge of the ascending process of the astragalus
  - Metatarsal III not reaching the proximal end of the metatarsus
  - Penultimate manual phalanges with a straight shaft
references:
  - id: karhu1996a
  - id: xu2010a
    notes: Described Xixianykus as a basal parvicursorine and defined
      Parvicursorinae as all taxa closer to Parvicursor than to Patagonykus.
  - id: agnolín2012a
    notes: Noted that Mononykinae, as first defined, is a junior synonym of
      Parvicursorinae, and renamed the smaller group Mononykini.
  - id: fowler2020b
    notes: Recovered Trierarchuncus within a polytomy of parvicursorines.
