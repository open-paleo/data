clade: Diplodocimorpha
description: >
  Diplodocimorpha is the node-based clade comprising Rebbachisauridae,
  Flagellicaudata (Dicraeosauridae plus Diplodocidae), and their most recent
  common ancestor, to the exclusion of basal diplodocoids such as
  Haplocanthosaurus. The name was coined by Calvo and Salgado (1995) and given
  its current phylogenetic definition by Taylor and Naish (2005) as the least
  inclusive clade containing Diplodocus and Rebbachisaurus.
erected_in: calvo1995
described_in: taylor2005
diagnostic_features:
  - Contains the narrow-toothed rebbachisaurids and the whip-tailed
    flagellicaudatans to the exclusion of basal diplodocoids.
  - Further retraction and enlargement of the external nares relative to basal
    diplodocoids.
  - Marked reduction of the hyposphene-hypantrum accessory articulations in the
    dorsal vertebrae of derived members.
