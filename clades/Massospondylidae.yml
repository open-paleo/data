clade: Massospondylidae
description: >
  Massospondylidae is a family of early massopod sauropodomorph dinosaurs that
  lived from the Late Triassic to the Early Jurassic, with a near-global spread
  that reached Asia, Africa, North America, South America, and Antarctica. It is
  defined as a stem-based group encompassing all animals more closely related to
  Massospondylus carinatus than to Plateosaurus or Saltasaurus. Large cladistic
  analyses of early sauropodomorphs consistently recover a core membership that
  includes Adeopapposaurus, Coloradisaurus, Glacialisaurus, Leyesaurus,
  Lufengosaurus, and the relatively basal Indian form Pradhania, with genera
  such as Mussaurus and Xixiposaurus also sometimes placed here. Its members
  were small to medium-sized, long-necked, facultatively bipedal herbivores or
  omnivores that represent an early-branching lineage of sauropodomorphs rather
  than close relatives of the true sauropods.
type_genus: Massospondylus
erected_in: huene1914a
described_in: apaldetti2011a
diagnostic_features:
  - Snout with a depression behind the external naris
  - Strongly ventrally curved symphyseal end of the dentary
  - Cervical vertebrae 4 or 5 more than four times longer than the anterior
    centrum height
  - Lacrimal with a web of bone spanning the junction of its anterior and ventral rami
references:
  - id: huene1914a
    notes: Erected Massospondylidae.
  - id: apaldetti2011a
    notes: Phylogenetic analysis of Massospondylidae membership.
