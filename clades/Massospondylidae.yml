clade: Massospondylidae
description: >
  Massospondylidae is a family of early massopod sauropodomorph dinosaurs that
  lived from the Late Triassic to the Early Jurassic, with a near-global spread
  that reached Asia, Africa, North America, South America, and Antarctica. It is
  defined as a stem-based group encompassing all animals more closely related to
  Massospondylus carinatus than to Plateosaurus or Saltasaurus (Sereno, 2007).
  Most recent analyses recover a monophyletic Massospondylidae that usually
  includes Massospondylus, Coloradisaurus and Lufengosaurus with a variable
  number of other taxa, though some have found it to contain Massospondylus
  alone (Barrett and colleagues, 2019); Fernández and Werneburg (2022) add
  Adeopapposaurus, Glacialisaurus and Leyesaurus, and Pradhania falls within the
  family for Novas and colleagues (2010) but in Unaysauridae for Barrett and
  colleagues (2026). Its members were small to medium-sized, long-necked,
  facultatively bipedal herbivores or omnivores that represent an
  early-branching lineage of sauropodomorphs rather than close relatives of the
  true sauropods.
type_genus: Massospondylus
erected_in: huene1914a
described_in: sereno2007a
diagnostic_features:
  - Snout with a depression behind the external naris
  - Strongly ventrally curved symphyseal end of the dentary
  - Cervical vertebrae 4 or 5 more than four times longer than the anterior
    centrum height
  - Lacrimal with a web of bone spanning the junction of its anterior and ventral rami
references:
  - id: huene1914a
    notes: Erected Massospondylidae.
  - id: sereno2007a
    notes: Defined Massospondylidae as the most inclusive clade containing
      Massospondylus carinatus but not Plateosaurus engelhardti or Saltasaurus
      loricatus.
  - id: apaldetti2011a
    notes: Recovered Massospondylidae with an expanded membership in the analysis
      describing Leyesaurus.
  - id: barrett2019a
    notes: Redescribed the Massospondylus neotype, tracing the family's
      definition to Sereno (1998) as amended and noting that most analyses
      recover it with a variable membership.
  - id: sereno1998a
    notes: Gave the original stem-based definition of Massospondylidae, with
      Plateosaurus as the external specifier.
  - id: fernández2022a
    notes: Listed Massospondylus, Leyesaurus, Adeopapposaurus, Glacialisaurus,
      Coloradisaurus and Lufengosaurus in Massospondylidae.
  - id: novas2010a
    notes: Described new Maleri sauropodomorphs and recovered Pradhania,
      included in its analysis, nested within Massospondylidae.
  - id: barrett2026a
    notes: Described a new sauropodomorph and recovered Pradhania in a
      monophyletic Unaysauridae.
