clade: Massospondylidae
description: >
  Massospondylidae is a family of small to medium-sized, long-necked
  sauropodomorphs from the Late Triassic to Early Jurassic, with a near-global
  distribution and built around Massospondylus. Its members are facultatively
  bipedal herbivores or omnivores; the family forms an early-branching lineage
  within Massopoda, outside the sauropodiform grade.
type_genus: Massospondylus
erected_in: huene1914
described_in: apaldetti2011
diagnostic_features:
  - Snout with a depression behind the external naris
  - Strongly ventrally curved symphyseal end of the dentary
  - Cervical vertebrae 4 or 5 more than four times longer than the anterior
    centrum height
  - Lacrimal with a web of bone spanning the junction of its anterior and ventral rami
