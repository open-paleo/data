clade: Pachycephalosaurinae
description: >
  Pachycephalosaurinae is the derived subfamily of pachycephalosaurid dinosaurs,
  encompassing the dome-headed members of the group that are more closely
  related to Pachycephalosaurus than to the earlier-branching Stegoceras. Its
  members were small, bipedal, plant-eating ornithischians known from the
  Cretaceous of North America and Asia, distinguished by a thickened skull roof
  formed from the fused and greatly enlarged frontal and parietal bones.
  Alongside the classic high-domed forms, the subfamily also takes in several
  flatter-skulled taxa that fall on the Pachycephalosaurus side of the family
  tree, some of which may represent juveniles or females of domed species. The
  heavily ossified skulls are typically ornamented with blunt horns and nodes
  around their margins, and the domes themselves have often been interpreted as
  weapons used in intraspecific head- or flank-butting.
type_genus: Pachycephalosaurus
erected_in: sternberg1945a
described_in: williamson2003a
diagnostic_features:
  - Fully domed frontoparietal (sensu Sereno, 1998)
  - Supratemporal fenestrae closed in adults
  - Parietosquamosal contact positioned caudodorsal to the occiput
  - Epaxial muscle scars restricted to a position dorsolateral to the foramen
    magnum
references:
  - id: sternberg1945a
    notes: Named Pachycephalosauridae; Pachycephalosaurinae dates from this work
      by ICZN coordination.
  - id: williamson2003a
    notes: Provided the modern stem-based usage of Pachycephalosaurinae.
  - id: sereno1998a
    notes: Source of the phylogenetic definition applied to the frontoparietal character.
