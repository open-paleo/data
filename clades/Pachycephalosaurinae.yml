clade: Pachycephalosaurinae
description: >
  Pachycephalosaurinae is the derived subfamily of pachycephalosaurids, used in
  its modern sense for all pachycephalosaurids more closely related to
  Pachycephalosaurus than to Stegoceras. It comprises the fully domed forms
  together with several flat-headed taxa recovered on the Pachycephalosaurus
  side of the family. The subfamily dates by coordination from Sternberg's 1945
  naming of Pachycephalosauridae, and was given its modern, stem-based usage by
  Williamson and Carr (2003) following Sereno.
type_genus: Pachycephalosaurus
erected_in: sternberg1945
described_in: williamson2003
diagnostic_features:
  - Fully domed frontoparietal (sensu Sereno, 1998)
  - Supratemporal fenestrae closed in adults
  - Parietosquamosal contact positioned caudodorsal to the occiput
  - Epaxial muscle scars restricted to a position dorsolateral to the foramen
    magnum
references:
