clade: Pachycephalosaurinae
rank: subfamily
type_genus: Pachycephalosaurus
identifiers:
  - source: pbdb
    id: "67626"
  - source: wikidata
    id: Q33156385
erected_in: sternberg1945a
described_in: madzia2021a
diagnostic_features:
  - Fully domed frontoparietal (sensu Sereno, 1998)
  - Supratemporal fenestrae closed in adults
  - Parietosquamosal contact positioned caudodorsal to the occiput
  - Epaxial muscle scars restricted to a position dorsolateral to the foramen
    magnum
references:
  - id: sternberg1945a
    notes: Named Pachycephalosauridae; Pachycephalosaurinae dates from this work
      by ICZN coordination.
  - id: madzia2021a
    notes: Defined Pachycephalosaurinae as the largest clade containing
      Pachycephalosaurus wyomingensis but not Stegoceras validum.
  - id: williamson2003a
    notes: Recovered Pachycephalosaurinae under Sereno's definition, with node
      synapomorphies shown in its cladogram.
  - id: sereno1998a
    notes: Defined Pachycephalosaurinae as pachycephalosaurids closer to
      Pachycephalosaurus than to Stegoceras, crediting the name to Sternberg
      (1945).
