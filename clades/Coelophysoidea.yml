clade: Coelophysoidea
description: >
  Coelophysoidea is a superfamily of small to medium-sized, lightly built
  neotheropod dinosaurs that were among the first dinosaurs to achieve a
  near-global distribution, ranging from the Late Triassic to the Early
  Jurassic. As restricted here it comprises the family Coelophysidae together
  with a grade of basal non-coelophysid forms; larger crested taxa such as
  Dilophosaurus, once included, are now placed on the stem leading to Averostra.
  Coelophysoids were slender, long-necked bipedal predators with elongate,
  low-snouted skulls.
type_genus: Coelophysis
erected_in: nopcsa1928c
described_in: holtz1994a
diagnostic_features:
  - Elongate, lightly built skull with a low, narrow, pointed snout
  - Subnarial gap between the premaxillary and maxillary tooth rows
  - Elongate cervical vertebrae with low neural spines, producing a long,
    flexible neck
  - Slender cursorial hindlimbs with a tightly appressed metatarsus
references:
  - id: nopcsa1928c
    notes: Original proposal of the coelophysid family-group name.
  - id: holtz1994a
    notes: Raised Coelophysoidea to a phylogenetically defined superfamily.
