clade: Coelophysoidea
description: >
  Coelophysoidea is a clade of slender, carnivorous theropod dinosaurs that was
  widespread during the Late Triassic and Early Jurassic, with fossils known
  from most continents. It contains the family Coelophysidae along with a range
  of other early forms, including such genera as Coelophysis, Procompsognathus,
  and Liliensternus. Its members were lightly built bipeds ranging from about 1
  to 6 meters in length, with long, narrow skulls opened by large fenestrae and
  light skeletons suited to fast, agile running; some species bore delicate
  cranial crests. Coelophysoids are regarded as basal neotheropods lying outside
  the more advanced Averostra, and many taxa once grouped here, including the
  larger crested forms, are now placed elsewhere along the early theropod stem.
type_genus: Coelophysis
erected_in: nopcsa1928c
described_in: holtz1994a
diagnostic_features:
  - Elongate, lightly built skull with a low, narrow, pointed snout
  - Subnarial gap between the premaxillary and maxillary tooth rows
  - Elongate cervical vertebrae with low neural spines, producing a long,
    flexible neck
  - Slender cursorial hindlimbs with a tightly appressed metatarsus
references:
  - id: nopcsa1928c
    notes: Named the subfamily Coelophysinae within Podokesauridae, from which the
      superfamily name takes its authorship by coordination.
  - id: holtz1994a
    notes: Named Coelophysoidea as a new taxon for the clade of coelophysids and
      Dilophosaurus, equivalent to Node 2 of Rowe and Gauthier (1990), and
      diagnosed it.
  - id: rowe1990a
    notes: Grouped the ceratosaurs other than Ceratosaurus as an unnamed Node 2,
      diagnosed by a subnarial gap and axial characters, with Dilophosaurus as
      sister to its other members.
