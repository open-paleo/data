clade: Patagonykinae
description: >
  Patagonykinae is a subfamily of large-bodied, plesiomorphic South American
  alvarezsaurids comprising Patagonykus and Bonapartenykus from the Late
  Cretaceous of Patagonia. It groups the biggest known alvarezsaurs, which
  retain comparatively robust proportions relative to the miniaturized Asian
  parvicursorines.
type_genus: Patagonykus
erected_in: agnolín2012a
diagnostic_features:
  - Large body size relative to other alvarezsaurids
  - Longitudinal ridge on the lateral surface of the coracoid
  - Strongly sculptured ventral half of the coracoid
  - Medially deflected coracoid
dispute:
  summary: >
    The phylogenetic position of Patagonykinae is contested. It is recovered
    within Alvarezsauridae — as the sister group of the remaining alvarezsaurids
    — by its naming analysis (Agnolín et al., 2012) and by the most recent
    comprehensive alvarezsaur analysis (Meso et al., 2024), a placement also
    adopted by the reference-work treatment of Jones (2026).
    Other analyses instead recover Patagonykus and Bonapartenykus outside
    Alvarezsauridae as non-alvarezsaurid alvarezsauroids: Xu et al. (2018) place
    them as successive outgroups along the alvarezsaurian stem, while Hartman et
    al. (2019) group them with Bannykus and Xiyunykus as patagonykines, and the
    clade's composition varies between studies.
  history:
    - date: "2026-07-01"
      note: Placed within Alvarezsauridae following the naming analysis and the recent comprehensive analyses; the alternative non-alvarezsaurid position and the clade's monophyly remain unresolved.
    - date: "2026-07-28"
      note: Retained within Alvarezsauridae following the naming analysis
        (Agnolín et al., 2012) and the most recent comprehensive alvarezsaur
        analysis (Meso et al., 2024); the non-alvarezsaurid alvarezsauroid
        position of Xu et al. (2018) and Hartman et al. (2019) is recorded as the
        competing hypothesis.
references:
  - id: agnolín2012a
  - id: hartman2019a
    notes: Recovered Patagonykus and Bonapartenykus outside Alvarezsauridae,
      joined by Xiyunykus and Bannykus as patagonykines, though cautioning this
      arrangement is not heavily favored.
  - id: xu2018c
    notes: Recovered Patagonykus and Bonapartenykus outside Alvarezsauridae as
      successive outgroups on the alvarezsaurian stem, with Achillesaurus sister
      to Alvarezsauridae.
  - id: makovicky2026a
    notes: Alnashetri redescription; treats Patagonykus only as an anatomical
      comparator and assigns Patagonykinae no phylogenetic position.
  - id: jones2026c
    notes: Placement and assessment in the Princeton Encyclopedia of Dinosaurs.
  - id: meso2024a
    notes: Recovered Patagonykinae in its comprehensive alvarezsaur analysis.
