clade: Patagonykinae
description: >
  Patagonykinae is a subfamily of large-bodied, plesiomorphic South American
  alvarezsaurids comprising Patagonykus and Bonapartenykus from the Late
  Cretaceous of Patagonia. Coined by Agnolín et al. (2012) for these two
  genera, it groups the biggest known alvarezsaurs, which retain comparatively
  robust proportions relative to the miniaturized Asian parvicursorines.
type_genus: Patagonykus
erected_in: agnolín2012a
diagnostic_features:
  - Large body size relative to other alvarezsaurids
  - Longitudinal ridge on the lateral surface of the coracoid
  - Strongly sculptured ventral half of the coracoid
  - Medially deflected coracoid
dispute:
  summary: >
    The phylogenetic position of Patagonykinae is contested. It is recovered
    within Alvarezsauridae — as the sister group of the remaining alvarezsaurids
    — by its naming analysis (Agnolín et al., 2012) and by the most recent
    comprehensive analyses (Meso et al., 2024; Makovicky et al., 2026), a
    placement also adopted by the reference-work treatment of Jones (2026).
    Other analyses instead recover Patagonykus and Bonapartenykus outside
    Alvarezsauridae as non-alvarezsaurid alvarezsauroids, sometimes alongside
    Bannykus and Xiyunykus (Xu et al., 2018; Hartman et al., 2019), and its
    monophyly is not recovered in every study.
  history:
    - date: "2026-07-01"
      note: Placed within Alvarezsauridae following the naming analysis and the recent comprehensive analyses; the alternative non-alvarezsaurid position and the clade's monophyly remain unresolved.
references:
  - id: agnolín2012a
  - id: hartman2019a
    notes: Found Patagonykinae's monophyly not consistently recovered in this paravian phylogenetic analysis.
  - id: xu2018c
    notes: Recovered Patagonykus and Bonapartenykus outside Alvarezsauridae as non-alvarezsaurid alvarezsauroids
  - id: makovicky2026a
    notes: New Alnashetri specimen supports its placement outside Alvarezsauridae in Patagonykinae
  - id: jones2026c
    notes: Placement and assessment in the Princeton Encyclopedia of Dinosaurs.
  - id: meso2024a
    notes: Recovered Patagonykinae in its comprehensive alvarezsaur analysis.
