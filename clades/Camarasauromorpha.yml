clade: Camarasauromorpha
description: >
  Camarasauromorpha is a node-based clade of macronarian sauropod dinosaurs
  comprising the most recent common ancestor of Camarasauridae and
  Titanosauriformes, together with all of its descendants (Salgado and
  colleagues, 1997). It is the most basal group within the larger macronarian
  radiation, and it includes a handful of basal forms, such as Europasaurus,
  whose finer placement within Macronaria remains unresolved.
  Fragmentary limb bones from the Middle Jurassic of Kachchh, western India, are
  the oldest known record of the clade. Camarasauromorphs are distinguished from
  the narrower-toothed diplodocoid sauropods by their broad, spatulate teeth and
  a more robustly built body plan.
erected_in: salgado1997a
diagnostic_features:
  - Opisthocoelous dorsal vertebral centra
  - Reduced or absent posterior centroparapophyseal lamina in the middle and
    posterior dorsal vertebrae
  - Proximal end of the radius subtriangular in outline
  - Expanded, plate-like sternal elements
references:
  - id: salgado1997a
    notes: Named Camarasauromorpha as a new taxon, defined as the most recent
      common ancestor of Camarasauridae and Titanosauriformes and all its
      descendants, and diagnosed it.
