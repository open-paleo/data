clade: Camarasauromorpha
description: >
  Camarasauromorpha is a node-based clade of macronarian sauropods comprising
  the most recent common ancestor of Camarasaurus and the titanosaurs, together
  with all of its descendants. It unites the Late Jurassic Camarasauridae with
  Titanosauriformes (brachiosaurids plus somphospondylans) and includes a
  number of basal forms whose finer placement remains unresolved. The clade
  marks the macronarian transition toward the broad-toothed, robustly built
  body plan that dominated the Cretaceous.
erected_in: salgado1997
diagnostic_features:
  - Opisthocoelous dorsal vertebral centra
  - Reduced or absent posterior centroparapophyseal lamina in the middle and
    posterior dorsal vertebrae
  - Proximal end of the radius subtriangular in outline
  - Expanded, plate-like sternal elements
references:
  - id: salgado1997
    authors: Salgado, L.; Coria, R. A.; Calvo, J. O.
    year: 1997
    title: "Evolution of titanosaurid sauropods. I: phylogenetic analysis based
      on the postcranial evidence"
    journal: Ameghiniana
    volume: "34"
    pages: 3-32
