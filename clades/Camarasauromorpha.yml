clade: Camarasauromorpha
description: >
  Camarasauromorpha is a node-based clade of macronarian sauropod dinosaurs
  comprising the most recent common ancestor of Camarasauridae and
  Titanosauriformes, together with all of its descendants (Salgado and
  colleagues, 1997). It may be synonymous with Macronaria (Canudo and
  colleagues, 2008), and it includes a handful of basal forms, such as
  Europasaurus, whose finer placement within Macronaria remains unresolved.
  Fragmentary Middle Jurassic remains from Khadir Island, western India, were
  once assigned to the clade, but Mannion and Moore (2025) find no neosauropod
  features in them. Camarasaurus itself is distinguished from Diplodocus by an
  abbreviated face and large spoon-shaped teeth (Gilmore, 1925).
erected_in: salgado1997a
diagnostic_features:
  - Opisthocoelous dorsal vertebral centra
  - Reduced or absent posterior centroparapophyseal lamina in the middle and
    posterior dorsal vertebrae
  - Proximal end of the radius subtriangular in outline
  - Expanded, plate-like sternal elements
references:
  - id: salgado1997a
    notes: Named Camarasauromorpha as a new taxon, defined as the most recent
      common ancestor of Camarasauridae and Titanosauriformes and all its
      descendants, and diagnosed it.
  - id: canudo2008a
    notes: Noted that Camarasauromorpha may be synonymous with Macronaria.
  - id: mannion2025a
    notes: Rejected the camarasauromorph assignment of Middle Jurassic sauropod
      remains from Khadir Island, India.
  - id: gilmore1925a
    notes: Distinguished the skull of Camarasaurus from that of Diplodocus by
      its abbreviated face and spoon-shaped teeth.
