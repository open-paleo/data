clade: Hadrosauriformes
description: >
  Hadrosauriformes is the clade of styracosternan ornithopods containing the
  most recent common ancestor of Iguanodon and Hadrosaurus and all its
  descendants. It unites the iguanodontid-grade forms with the hadrosauroids and
  the duck-billed Hadrosauridae, and its members are large herbivores with
  increasingly complex dental batteries and broad, edentulous bills. The clade
  was globally distributed and represents one of the most successful
  ornithischian radiations of the Cretaceous.
erected_in: sereno1997
described_in: madzia2021
diagnostic_features:
  - Dental battery with multiple stacked replacement teeth per tooth position
  - Broad, flattened, edentulous premaxillary bill
  - Reduction or loss of the manual pollex spike in derived members
  - Elongate, dorsoventrally low rostrum
