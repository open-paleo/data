clade: Hadrosauriformes
description: >
  Hadrosauriformes is a clade of styracosternan ornithopods defined as the most
  recent common ancestor of Iguanodon and Hadrosaurus and all its descendants,
  uniting iguanodontid-grade forms with the hadrosauroids and the duck-billed
  Hadrosauridae. Across the clade, dental batteries grew increasingly complex,
  and the snout trended from the narrower beak of early iguanodontian-grade
  members toward the broad, edentulous bill of the most derived hadrosaurids.
  Its members were large-bodied herbivores known from Europe, Asia, Africa, and
  the Americas, making Hadrosauriformes one of the most geographically
  widespread and successful ornithischian radiations of the Cretaceous.
erected_in: sereno1997a
described_in: madzia2021a
diagnostic_features:
  - Dental battery with multiple stacked replacement teeth per tooth position
  - Broad, flattened, edentulous premaxillary bill
  - Reduction or loss of the manual pollex spike in derived members
  - Elongate, dorsoventrally low rostrum
references:
  - id: sereno1997a
    notes: Named Hadrosauriformes.
  - id: madzia2021a
    notes: Provides the modern phylogenetic definition of Hadrosauriformes.
