clade: Limaysaurinae
description: >
  Limaysaurinae is the South American rebbachisaurid subfamily within Khebbashia,
  now typically restricted to Limaysaurus and Cathartesaura. It was erected by
  Whitlock (2011) and is defined as the stem-based clade of all rebbachisaurids
  more closely related to Limaysaurus than to Nigersaurus. Its members are mid-
  to Late Cretaceous Patagonian sauropods.
type_genus: Limaysaurus
erected_in: whitlock2011
diagnostic_features:
  - Scapular acromion broad, its total length at least half that of the scapula.
  - Contact between the spinoprezygapophyseal and spinopostzygapophyseal laminae
    forming a lateral lamina on the anterior caudal neural spines.
  - Accessory lateral lamina developed on the anterior caudal vertebrae.
references:
  - id: whitlock2011
    authors: Whitlock, J. A.
    year: 2011
    title: "A phylogenetic analysis of Diplodocoidea (Saurischia: Sauropoda)"
    journal: Zoological Journal of the Linnean Society
    volume: "161"
    issue: "4"
    pages: 872-915
    doi: 10.1111/j.1096-3642.2010.00665.x
    url: http://dx.doi.org/10.1111/j.1096-3642.2010.00665.x
    notes: Erected the subfamilies Limaysaurinae and Nigersaurinae.
