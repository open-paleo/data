clade: Limaysaurinae
description: >
  Limaysaurinae is a subfamily of rebbachisaurid sauropod dinosaurs, one of the
  two subfamilies recognized within the rebbachisaurid clade Khebbashia. It is a
  stem-based group that gathers those rebbachisaurids more closely related to
  Limaysaurus than to Nigersaurus, and in current usage is typically restricted
  to the South American genera Limaysaurus and Cathartesaura. Its members were
  medium-sized, long-necked sauropods that lived in Patagonia during the mid- to
  Late Cretaceous. Like other rebbachisaurids, they were among the last
  surviving diplodocoids, persisting alongside the titanosaurs until fairly late
  in the Cretaceous.
type_genus: Limaysaurus
erected_in: whitlock2011a
diagnostic_features:
  - Scapular acromion broad, its total length at least half that of the scapula.
  - Contact between the spinoprezygapophyseal and spinopostzygapophyseal laminae
    forming a lateral lamina on the anterior caudal neural spines.
  - Accessory lateral lamina developed on the anterior caudal vertebrae.
references:
  - id: whitlock2011a
    notes: Erected the subfamilies Limaysaurinae and Nigersaurinae.
