clade: Heterodontosauridae
description: >
  Heterodontosauridae is a family of small, early-diverging ornithischian
  dinosaurs, most of them fox-sized and less than two meters long including a
  long tail. Their fossils are relatively rare, but the group achieved a
  near-worldwide distribution, turning up on every continent except Australia
  and Antarctica and ranging from the Early Jurassic into the Early Cretaceous.
  The family is best known for its strongly heterodont dentition: enlarged,
  canine-like tusks in both the upper and lower jaws, set off by a gap called a
  diastema, together with chisel-shaped cheek teeth whose overlapping crowns
  formed a continuous grinding surface convergent with the dental batteries of
  later hadrosaurs and ceratopsians. Its members include the South African
  Abrictosaurus, Lycorhinus, and Heterodontosaurus, along with later and more
  far-flung forms such as Echinodon, Fruitadens, and the filament-bearing
  Tianyulong, with the more derived, largely southern-hemisphere genera grouped
  in the subfamily Heterodontosaurinae. Their diet was herbivorous or possibly
  omnivorous, and their long, slender hindlimbs suggest they were fast,
  primarily bipedal runners.
type_genus: Heterodontosaurus
erected_in: kuhn1966a
described_in: sereno2012a
dispute:
  summary: >
    Heterodontosauridae is placed as an early-diverging clade near the base of
    Ornithischia, outside Genasauria, following the prevailing view (Butler and
    colleagues, 2008; Boyd, 2015); Sereno's (2012) reanalysis of the Butler and
    colleagues matrix also leaves heterodontosaurids in a polytomy at the base of
    Ornithischia. Dieudonné and colleagues (2020) instead recover
    heterodontosaurids as a paraphyletic grade of
    basal Marginocephalia within Pachycephalosauria.
diagnostic_features:
  - Enlarged caniniform teeth in both the premaxilla and the dentary
  - Postcaniniform diastema separating the caniniform from the cheek-tooth row
  - Cheek-tooth crowns with a swollen base and well-developed apical wear facets
  - Reduced or episodic tooth replacement rather than continuous replacement
  - Small body size with elongate, gracile, cursorial hindlimbs
references:
  - id: kuhn1966a
    notes: Origin of the family-group name Heterodontosauridae.
  - id: sereno2012a
    notes: Monographic revision and phylogenetic definition of
      Heterodontosauridae.
  - id: butler2008b
    notes: Ornithischian phylogenetic analysis recovering Heterodontosauridae
      outside Genasauria, close to the base of Ornithischia.
  - id: dieudonné2020a
    notes: Recovered heterodontosaurids as a paraphyletic grade of basal Marginocephalia within Pachycephalosauria
  - id: jones2026a
    notes: Places Heterodontosauridae as the first-diverging branch of
      Ornithischia, noting an alternative placement at the base of
      Pachycephalosauria.
  - id: boyd2015a
    notes: Recovered Heterodontosauridae as an early-diverging ornithischian clade.
