clade: Heterodontosauridae
description: >
  Heterodontosauridae is a clade of small, early-diverging ornithischian
  dinosaurs notable for their strongly differentiated (heterodont) dentition,
  including enlarged caniniform tusks set off from the cheek teeth by a diastema.
  Known from the Late Triassic to the Early Cretaceous of Gondwana and Laurasia,
  they comprise a basal Laurasian grade (Echinodon, Fruitadens, Tianyulong) and
  the more derived, largely Gondwanan Heterodontosaurinae. They are here placed
  near the base of Ornithischia, outside Genasauria.
type_genus: Heterodontosaurus
erected_in: kuhn1966a
described_in: sereno2012a
dispute:
  summary: >
    Heterodontosauridae is placed as an early-diverging clade near the base of
    Ornithischia, outside Genasauria, following the prevailing view (Butler and
    others, 2008; Sereno, 2012; Boyd, 2015) and Jones (2026). Dieudonné and
    others (2020) instead recover heterodontosaurids as a paraphyletic grade of
    basal Marginocephalia within Pachycephalosauria.
  history:
    - date: "2026-06-29"
      note: Placed at Ornithischia outside Genasauria following the prevailing
        view and Jones (2026) (P3, P6); the Marginocephalia placement of
        Dieudonné and others (2020) is recorded as a minority alternative.
diagnostic_features:
  - Enlarged caniniform teeth in both the premaxilla and the dentary
  - Postcaniniform diastema separating the caniniform from the cheek-tooth row
  - Cheek-tooth crowns with a swollen base and well-developed apical wear facets
  - Reduced or episodic tooth replacement rather than continuous replacement
  - Small body size with elongate, gracile, cursorial hindlimbs
references:
  - id: kuhn1966a
    notes: Origin of the family-group name Heterodontosauridae.
  - id: sereno2012a
    notes: Monographic revision and phylogenetic definition of
      Heterodontosauridae.
