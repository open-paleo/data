clade: Saltasauridae
description: >
  Saltasauridae is a family of derived saltasauroid titanosaurs comprising the
  armored, often dwarfed Saltasaurinae (Saltasaurus, Neuquensaurus and
  relatives) and the larger Opisthocoelicaudiinae (Opisthocoelicaudia and
  relatives), together with their most recent common ancestor and all
  descendants. The family was given a stem-based phylogenetic definition by
  Sereno (1998) and recovered in the revision of Wilson and Upchurch (2003).
  Members are among the most derived titanosaurs and include the last surviving
  sauropods of the Maastrichtian.
erected_in: sereno1998a
described_in: wilson2003b
type_genus: Saltasaurus
diagnostic_features:
  - Six co-ossified sacral vertebrae
  - Strongly procoelous caudal vertebrae with prominent distal condyles
  - Osteoderms present, including large and small morphotypes
  - Posterior dorsal vertebrae with reduced neural spines
references:
  - id: sereno1998a
    notes: Provided the stem-based phylogenetic definition of Saltasauridae.
  - id: wilson2003b
    notes: Recovered Saltasauridae and its constituent subfamilies in revising
      Titanosaurus.
