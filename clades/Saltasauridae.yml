clade: Saltasauridae
description: >
  Saltasauridae is a family of armored, herbivorous titanosaurian sauropods from
  the Late Cretaceous, known from fossils across South America, North America,
  Africa, Asia, and Europe. It splits into two subfamilies: the Saltasaurinae,
  which includes the often small and armored Saltasaurus, Neuquensaurus, and
  Rocasaurus, and the Opisthocoelicaudiinae, which includes larger forms such as
  Opisthocoelicaudia and the giant Alamosaurus. As sauropods they were
  quadrupeds with small heads, peg-like teeth, long necks, and counterbalancing
  tails, and were among the last of their kind, persisting until the very end of
  the Cretaceous. They are recognized by convexities in certain tail vertebrae
  and by distinctive markings on the coracoid bones of the shoulder. Many
  members bore bony scutes, or osteoderms, embedded in the skin of their backs,
  though such armor has not been found in every genus and its distribution
  across the group remains uncertain.
erected_in: powell1992a
described_in: wilson2003b
type_genus: Saltasaurus
diagnostic_features:
  - Six co-ossified sacral vertebrae
  - Strongly procoelous caudal vertebrae with prominent distal condyles
  - Osteoderms present, including large and small morphotypes
  - Posterior dorsal vertebrae with reduced neural spines
references:
  - id: powell1992a
    notes: Named the subfamily Saltasaurinae as new, from which the family name
      takes its authorship by coordination.
  - id: sereno1998a
    notes: Defined Saltasauridae as the node of Opisthocoelicaudia and
      Saltasaurus, with Saltasaurinae and Opisthocoelicaudiinae as its two stems.
  - id: wilson2003b
    notes: Defined Saltasauridae as the most recent common ancestor of
      Opisthocoelicaudia skarzynskii and Saltasaurus loricatus and all its
      descendants, adopting Sereno's node-stem triplet.
