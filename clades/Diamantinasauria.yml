clade: Diamantinasauria
rank: unranked
erected_in: poropat2021a
described_in: beeston2024a
diagnostic_features:
  - Sternal plate D-shaped rather than reniform
  - Absence of hyposphene-hypantrum articulations throughout the dorsal series
  - Confluence of the spinopostzygapophyseal and centropostzygapophyseal fossae
    owing to loss of the intrapostzygapophyseal lamina
  - Scapular blade bearing a fossa and a tuberosity on its medial surface near
    the acromion
  - Ulna with a prominent interosseous ridge on the distal anterior surface
dispute:
  summary: >
    The position of Diamantinasauria relative to Titanosauria is unstable.
    In equal-weights analyses, Poropat and colleagues (2016) recover
    Diamantinasaurus and Savannasaurus as non-lithostrotian titanosaurs, and
    Poropat and colleagues (2023) recover the named clade in the same
    position, whereas the most recent dedicated analyses recover the clade
    as the sister group to Titanosauria, just outside it (Beeston and
    colleagues, 2024, under both equal and extended implied weighting; Han
    and colleagues, 2024). It is placed conservatively as a
    non-titanosaurian somphospondylan following the most recent dedicated
    work.
references:
  - id: poropat2021a
  - id: poropat2016a
    notes: Described Savannasaurus; recovered it and Diamantinasaurus as
      non-lithostrotian titanosaurs, and Wintonotitan as a non-titanosaurian
      somphospondylan.
  - id: poropat2023a
    notes: Equal-weights analysis recovers Diamantinasauria as a non-lithostrotian titanosaur clade near the base of Titanosauria, but outside Titanosauria under extended implied weighting.
  - id: han2024a
    notes: Recovers Diamantinasauria as sister taxon to Titanosauria rather than a sub-clade within it
  - id: jones2026b
    notes: Places Diamantinasauria within Titanosauria as a likely
      early-branching group of Diamantinasaurus, Sarmientosaurus, Savannasaurus
      and Australotitan, reviewing its varied placements.
  - id: beeston2024a
    notes: Recovered Diamantinasauria as the sister group of Titanosauria under
      both equal and extended implied weighting, with Sarmientosaurus as its
      earliest-diverging member.
