clade: Diamantinasauria
description: >
  Diamantinasauria is a clade of somphospondylan titanosauriforms erected for
  the Australian Diamantinasaurus and Savannasaurus and their close relatives,
  including the Argentine Sarmientosaurus. Members are medium to large sauropods
  of the mid-Cretaceous of Gondwana, characterized by a distinctive D-shaped
  sternal plate and features of the braincase and appendicular skeleton. The
  clade is recovered by the most recent dedicated analyses as the sister group
  to Titanosauria, just outside that clade, marking it as one of the most
  derived non-titanosaurian somphospondylan lineages.
erected_in: poropat2021a
diagnostic_features:
  - Sternal plate D-shaped rather than reniform
  - Absence of hyposphene-hypantrum articulations throughout the dorsal series
  - Confluence of the spinopostzygapophyseal and centropostzygapophyseal fossae
    owing to loss of the intrapostzygapophyseal lamina
  - Scapular blade bearing a fossa and a tuberosity on its medial surface near
    the acromion
  - Ulna with a prominent interosseous ridge on the distal anterior surface
dispute:
  summary: >
    The position of Diamantinasauria relative to Titanosauria is unstable. Equal-
    weights analyses by Poropat et al. (2016, 2023) recover the constituent taxa
    within Titanosauria as non-lithostrotian titanosaurs, whereas the most recent
    dedicated analyses recover the clade as the sister group to Titanosauria,
    just outside it, under both weighting schemes (Beeston et al., 2024; Han et
    al., 2024). The Princeton Encyclopedia (Jones, 2026) treats it as most likely
    an early-branching titanosaurian group. It is placed here conservatively as a
    non-titanosaurian somphospondylan following the most recent dedicated work.
  history:
    - date: "2026-06-30"
      note: >
        Placed under Somphospondyli as the sister group to Titanosauria
        following Beeston et al. (2024) and Han et al. (2024); the competing
        placement within Titanosauria (Poropat et al., 2016, 2023; Jones, 2026)
        is noted and remains unresolved.
references:
  - id: poropat2021a
  - id: poropat2016a
    notes: Describes new Australian sauropods, recovering Diamantinasauria taxa as non-lithostrotian titanosaurs.
  - id: han2024a
    notes: Recovers Diamantinasauria as sister taxon to Titanosauria rather than a sub-clade within it
  - id: jones2026b
    notes: Placement and assessment in the Princeton Encyclopedia of Dinosaurs.
