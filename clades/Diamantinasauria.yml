clade: Diamantinasauria
description: >
  Diamantinasauria is a clade of somphospondylan titanosauriform sauropods with
  close affinities to Titanosauria, known from the early Late Cretaceous of
  South America and Australia. It groups the Australian Diamantinasaurus,
  Savannasaurus, and Australotitan from the Winton Formation of Queensland with
  the Patagonian Sarmientosaurus of the Bajo Barreal Formation, and may also
  include Wintonotitan. This shared membership across two continents points to a
  faunal connection between Australia and South America by way of Antarctica
  during the Cretaceous. Distinguishing traits are drawn from the sternal plate,
  braincase, and limb skeleton, and dental microwear suggests these animals were
  mid-height browsers that fed on vegetation roughly one to ten meters above the
  ground. While the group is consistently recovered as a coherent clade, its
  exact position relative to Titanosauria has shifted between analyses.
erected_in: poropat2021a
diagnostic_features:
  - Sternal plate D-shaped rather than reniform
  - Absence of hyposphene-hypantrum articulations throughout the dorsal series
  - Confluence of the spinopostzygapophyseal and centropostzygapophyseal fossae
    owing to loss of the intrapostzygapophyseal lamina
  - Scapular blade bearing a fossa and a tuberosity on its medial surface near
    the acromion
  - Ulna with a prominent interosseous ridge on the distal anterior surface
dispute:
  summary: >
    The position of Diamantinasauria relative to Titanosauria is unstable. Equal-
    weights analyses by Poropat et al. (2016, 2023) recover the constituent taxa
    within Titanosauria as non-lithostrotian titanosaurs, whereas the most recent
    dedicated analyses recover the clade as the sister group to Titanosauria,
    just outside it (Beeston et al., 2024, under both equal and extended implied
    weighting; Han et al., 2024). The Princeton Encyclopedia (Jones, 2026) treats it as most likely
    an early-branching titanosaurian group. It is placed here conservatively as a
    non-titanosaurian somphospondylan following the most recent dedicated work.
  history:
    - date: "2026-06-30"
      note: >
        Placed under Somphospondyli as the sister group to Titanosauria
        following Beeston et al. (2024) and Han et al. (2024); the competing
        placement within Titanosauria (Poropat et al., 2016, 2023; Jones, 2026)
        is noted and remains unresolved.
references:
  - id: poropat2021a
  - id: poropat2016a
    notes: Describes new Australian sauropods, recovering Diamantinasauria taxa as non-lithostrotian titanosaurs.
  - id: poropat2023a
    notes: Equal-weights analysis recovers Diamantinasauria as a non-lithostrotian titanosaur clade near the base of Titanosauria, but outside Titanosauria under extended implied weighting.
  - id: han2024a
    notes: Recovers Diamantinasauria as sister taxon to Titanosauria rather than a sub-clade within it
  - id: jones2026b
    notes: Placement and assessment in the Princeton Encyclopedia of Dinosaurs.
  - id: beeston2024a
    notes: Recovered Diamantinasauria as the sister group to Titanosauria.
