clade: Sinovenatorinae
description: >
  Sinovenatorinae is a subfamily of small, basal troodontids from the Early
  Cretaceous Jehol Biota of China, grouping Sinovenator with Mei, Sinusonasus,
  and Daliansaurus, and in some analyses Jianianhualong. Its members are among
  the smallest and most basal of the troodontids, the bird-like, gracile
  theropods known for their large braincases and long, slender legs built for
  fast running. Members of the group share a distinctively wide, flattened
  fourth metatarsal. The clade's exact composition and internal relationships
  remain debated, with some analyses instead recovering these Chinese taxa as a
  graded succession of lineages rather than a single well-defined clade.
type_genus: Sinovenator
erected_in: shen2017b
diagnostic_features:
  - Small body size with a proportionally large braincase
  - Anterior dentary teeth more closely packed than posterior teeth
  - Metatarsal IV mediolaterally wide
dispute:
  summary: >
    The monophyly and composition of Sinovenatorinae are contested. It was erected
    by Shen and colleagues (2017) for the Early Cretaceous Chinese troodontids Sinovenator,
    Mei, Sinusonasus and Daliansaurus. Hartman and colleagues (2019) also recover a clade
    of that name among the first-branching troodontids, but with a different
    membership — excluding Sinusonasus and Daliansaurus, which they place closer to
    Hesperornithoides, and including Xiaotingia and Jianianhualong instead. Yin
    and colleagues (2018) recover these taxa as an intermediate grade rather
    than a clade, and Jones (2026) notes that studies "seldom agree on the
    clade's membership." It is retained in its original sense.
  history:
    - date: "2026-07-01"
      note: Retained as a broadly used but membership-unstable subfamily (Shen and colleagues, 2017; Hartman and colleagues, 2019); the grade hypothesis (Yin and colleagues, 2018) bears on the subfamily rather than on its member genera.
    - date: "2026-07-28"
      note: Retained in the original sense of Shen and colleagues (2017); the
        differing membership of Hartman and colleagues (2019) and the grade
        hypothesis of Yin and colleagues (2018) bear on the subfamily rather
        than on its member genera.
references:
  - id: shen2017b
    notes: Erected Sinovenatorinae with a stem-based definition, recovering
      Sinovenator, Mei, Sinusonasus and Daliansaurus within it.
  - id: hartman2019a
    notes: Recovered Sinovenatorinae with a different membership, excluding
      Sinusonasus and Daliansaurus and including Xiaotingia and Jianianhualong.
  - id: yin2018a
    notes: Recovers Sinovenator, Sinusonasus, and the new specimen as an intermediate grade, not a clade
  - id: jones2026c
    notes: Placement and assessment in the Princeton Encyclopedia of Dinosaurs.
