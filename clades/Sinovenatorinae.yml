clade: Sinovenatorinae
description: >
  Sinovenatorinae is a subfamily of small, basal troodontids from the Early
  Cretaceous Jehol Biota of China, grouping Sinovenator with Mei, Sinusonasus,
  and Daliansaurus, and in some analyses Jianianhualong. Its members are among
  the smallest and most basal of the troodontids, the bird-like, gracile
  theropods known for their large braincases and long, slender legs built for
  fast running. Members of the group share a distinctively wide, flattened
  fourth metatarsal. The clade's exact composition and internal relationships
  remain debated, with some analyses instead recovering these Chinese taxa as a
  graded succession of lineages rather than a single well-defined clade.
type_genus: Sinovenator
erected_in: shen2017b
diagnostic_features:
  - Small body size with a proportionally large braincase
  - Anterior dentary teeth more closely packed than posterior teeth
  - Metatarsal IV mediolaterally wide
dispute:
  summary: >
    The monophyly of Sinovenatorinae is contested. It was erected by Shen et al.
    (2017) for the Early Cretaceous Chinese troodontids (Sinovenator, Mei,
    Sinusonasus, Daliansaurus) and recovered by Hartman et al. (2019), but Yin et
    al. (2018) instead recover these taxa as an intermediate grade rather than a
    clade, and Jones et al. (2026) note that studies "seldom agree on the clade's
    membership," with Sinusonasus and Daliansaurus sometimes drawn toward
    Troodontinae. It is retained here in its original sense.
  history:
    - date: "2026-07-01"
      note: Retained as a broadly used but membership-unstable subfamily (Shen et al., 2017; Hartman et al., 2019); the grade hypothesis (Yin et al., 2018) is recorded here rather than on member genera.
references:
  - id: shen2017b
  - id: hartman2019a
    notes: Recovered Sinovenatorinae troodontid grouping in its paravian phylogenetic analysis.
  - id: yin2018a
    notes: Recovers Sinovenator, Sinusonasus, and the new specimen as an intermediate grade, not a clade
