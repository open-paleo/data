clade: Majungasaurinae
description: >
  Majungasaurinae is a subfamily of derived abelisaurids erected by Tortosa and
  colleagues for a mainly Indo-Madagascan radiation, defined as all abelisaurids
  more closely related to Majungasaurus than to Carnotaurus. Its members include
  Majungasaurus, Rajasaurus, Indosaurus, and Rahiolisaurus, together with the
  European Arcovenator, and are diagnosed by details of the frontal ornamentation
  and braincase. It is the reciprocal sister subclade to Brachyrostra within
  Abelisauridae.
type_genus: Majungasaurus
erected_in: tortosa2014
diagnostic_features:
  - Single median frontal horn or dome (rather than paired cornual structures).
  - Thickened frontals with a distinct nuchal crest.
  - Reduced supratemporal fossa on the frontal.
  - Fusion of the frontals in mature individuals.
dispute:
  summary: >
    The validity and rank of Majungasaurinae are contested. Most analyses since
    Tortosa and colleagues (2014) recover and use the subfamily for the
    Indo-Madagascan abelisaurids, but Pol and colleagues (2024) recovered
    Abelisaurus within this clade and argued that Majungasaurinae is therefore a
    junior synonym of Abelisaurinae (Bonaparte and Novas, 1985). That result
    rests on the unstable position of Abelisaurus and has not been broadly
    adopted, so the clade is retained here under its prevailing name.
  history:
    - date: "2026-06-30"
      note: Kept as Majungasaurinae following Tortosa and colleagues (2014) and
        the prevailing recent literature (P3, P5); the proposed synonymy with
        Abelisaurinae (Pol and colleagues, 2024) is recorded but not adopted.
references:
  - id: tortosa2014
    authors: Tortosa, T.; Buffetaut, E.; Vialle, N.; Dutour, Y.; Turini, E.;
      Cheylan, G.
    year: 2014
    title: "A new abelisaurid dinosaur from the Late Cretaceous of southern France:
      Palaeobiogeographical implications"
    journal: Annales de Paléontologie
    volume: "100"
    issue: "1"
    pages: 63-86
    publisher: Elsevier BV
    doi: 10.1016/j.annpal.2013.10.003
    notes: Named Arcovenator and erected the subfamily Majungasaurinae.
