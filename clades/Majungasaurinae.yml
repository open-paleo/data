clade: Majungasaurinae
description: >
  Majungasaurinae is a subfamily of abelisaurid theropods, one of the two main
  branches of the family Abelisauridae, and is defined as all abelisaurids more
  closely related to Majungasaurus than to Carnotaurus. It represents a largely
  Indo-Madagascan radiation of the Late Cretaceous whose members include
  Majungasaurus, Rajasaurus, Indosaurus, and Rahiolisaurus, alongside European
  forms such as Arcovenator. These were mid-sized, bipedal predators with tall,
  deep skulls and powerful jaws but greatly reduced, immobile forearms; their
  stout legs suited striding rather than fast running, and they are thought to
  have preyed mainly on the large sauropods they lived among. The group is set
  apart from its sister branch, the carnotaurines, chiefly by features of the
  frontal bones and braincase. Its ancestors originated in Gondwana and became
  distinct from their South American relatives as the southern landmasses broke
  apart.
type_genus: Majungasaurus
erected_in: tortosa2014a
diagnostic_features:
  - Single median frontal horn or dome (rather than paired cornual structures)
  - Thickened frontals with a distinct nuchal crest
  - Reduced supratemporal fossa on the frontal
  - Fusion of the frontals in mature individuals
dispute:
  summary: >
    The validity and rank of Majungasaurinae are contested. Most analyses since
    Tortosa and colleagues (2014) recover and use the subfamily for the
    Indo-Madagascan abelisaurids, but Pol and colleagues (2024) recovered
    Abelisaurus within this clade and argued that Majungasaurinae would therefore
    become a junior synonym of the nominotypical subfamily Abelisaurinae — the
    subfamily automatically based on Abelisaurus, type genus of Abelisauridae
    (Bonaparte and Novas, 1985). That result
    rests on the unstable position of Abelisaurus and has not been broadly
    adopted, so the clade is retained here under its prevailing name.
  history:
    - date: "2026-06-30"
      note: Kept as Majungasaurinae following Tortosa and colleagues (2014) and
        the prevailing recent literature; the proposed synonymy with
        Abelisaurinae (Pol and colleagues, 2024) is recorded but not adopted.
references:
  - id: tortosa2014a
    notes: Named Arcovenator and erected the subfamily Majungasaurinae.
  - id: bonaparte1985b
    notes: Erected the family Abelisauridae for type genus Abelisaurus comahuensis; the nominotypical subfamily Abelisaurinae derives from it automatically (ICZN Art. 37), with the same authorship.
  - id: pol2024a
    notes: Recovered Abelisaurus within Majungasaurinae and argued the subfamily is a junior synonym of Abelisaurinae.
