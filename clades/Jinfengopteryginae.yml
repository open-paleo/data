clade: Jinfengopteryginae
description: >
  Jinfengopteryginae is a subfamily of small, bird-like troodontid dinosaurs
  known from the Cretaceous of Eurasia. The group contains relatively few
  genera, among them Jinfengopteryx, the European Tamarro, and Liaoningvenator,
  with some analyses also referring Philovenator and several unnamed specimens
  to it. Its members were small-bodied, ranging from roughly 0.5 to 2 meters
  long, and, like other troodontids, bore a raised sickle claw on each foot.
  They were feathered, with plumage around the body and neck and especially
  long, vaned feathers along the tail, and are thought to have been about as
  capable in the air as gliding forms such as Microraptor. Distinguishing
  features cited for the group include large antorbital openings in the skull
  and a forked jugal bone. Unlike most troodontids, which were primarily
  carnivorous, some specimens preserve possible plant material in the gut,
  hinting at omnivory. The monophyly of the group is contested (see dispute).
type_genus: Jinfengopteryx
erected_in: turner2012a
diagnostic_features:
  - Enlarged triangular accessory antorbital (maxillary) fenestra
  - Anteriorly bifurcated sublacrimal jugal
  - Plantar displacement of the proximal end of metatarsal III relative to
    metatarsals II and IV
dispute:
  summary: >
    The validity of Jinfengopteryginae is contested. It was erected by Turner,
    Makovicky and Norell (2012) and recovered by Sellés et al. (2021), who place
    Jinfengopteryx, Liaoningvenator, Tamarro and Philovenator within it, but other
    analyses do not find it to be a meaningful monophyletic group: Hartman et al.
    (2019) recover Jinfengopteryx in a highly unstable position — as likely to
    fall within Sinovenatorinae as to join the Almas group — and place
    Liaoningvenator closer to troodontines. It is retained here following the
    analyses that recover it.
  history:
    - date: "2026-07-01"
      note: Retained as a broadly used but contested subfamily (Turner et al., 2012; Sellés et al., 2021); the non-monophyly hypothesis (Hartman et al., 2019; Pei et al., 2022) is recorded here rather than on member genera.
    - date: "2026-07-28"
      note: Retained as a broadly used but contested subfamily (Turner et al.,
        2012; Sellés et al., 2021); the non-monophyly hypothesis (Hartman et al.,
        2019) is recorded here rather than on member genera.
references:
  - id: turner2012a
    notes: Erected Jinfengopteryginae, with Jinfengopteryx recovered as sister to
      nearly all other troodontids.
  - id: sellés2021a
    notes: Recovered Jinfengopteryginae, placing Jinfengopteryx, Liaoningvenator,
      Tamarro and Philovenator within it.
  - id: hartman2019a
    notes: Recovered Jinfengopteryx in a highly unstable position, as likely to
      fall within Sinovenatorinae as to join the Almas group, with Liaoningvenator
      closer to troodontines.
