clade: Jinfengopteryginae
description: >
  Jinfengopteryginae is a subfamily of small troodontids erected for the type
  genus Jinfengopteryx and its relatives, including Liaoningvenator and the
  European Tamarro. Members are small-bodied, relatively basal troodontids known
  in part from feathered specimens. The monophyly of the group is contested (see
  dispute).
type_genus: Jinfengopteryx
erected_in: turner2012a
diagnostic_features:
  - Small body size with a short, deep skull
  - Plantar displacement of the proximal end of metatarsal III relative to metatarsals II and IV
  - Numerous small, unserrated or weakly serrated teeth
dispute:
  summary: >
    The validity of Jinfengopteryginae is contested. It was erected by Turner,
    Makovicky and Norell (2012) and recovered by Sellés et al. (2021), who place
    Jinfengopteryx, Liaoningvenator, and Tamarro within it, but other analyses do
    not find it to be a meaningful monophyletic group: Hartman et al. (2019)
    recover its putative members in unstable positions, and Pei et al. (2022) fold
    Jinfengopteryx into Sinovenatorinae. It is retained here following the analyses
    that recover it.
  history:
    - date: "2026-07-01"
      note: Retained as a broadly used but contested subfamily (Turner et al., 2012; Sellés et al., 2021); the non-monophyly hypothesis (Hartman et al., 2019; Pei et al., 2022) is recorded here rather than on member genera.
references:
  - id: turner2012a
