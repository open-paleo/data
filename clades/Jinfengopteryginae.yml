clade: Jinfengopteryginae
rank: subfamily
type_genus: Jinfengopteryx
identifiers:
  - source: pbdb
    id: "433872"
  - source: wikidata
    id: Q21011927
erected_in: turner2012a
diagnostic_features:
  - Enlarged triangular accessory antorbital (maxillary) fenestra
  - Anteriorly bifurcated sublacrimal jugal
  - Plantar displacement of the proximal end of metatarsal III relative to
    metatarsals II and IV
dispute:
  summary: >
    The validity of Jinfengopteryginae is contested. It was erected by Turner,
    Makovicky and Norell (2012) and recovered by Sellés and colleagues (2021),
    who place Jinfengopteryx, Liaoningvenator, Tamarro and Philovenator within
    it, but other analyses do not find it to be a meaningful monophyletic group:
    Hartman and colleagues (2019) recover Jinfengopteryx in a highly unstable
    position — as likely to fall within Sinovenatorinae as to join the Almas
    group — and place Liaoningvenator closer to troodontines. Pei and colleagues
    (2021) recover Jinfengopteryx as the sister taxon of Mei, in a clade with
    Sinovenator. It is retained following the analyses that recover it.
references:
  - id: turner2012a
    notes: Erected Jinfengopteryginae, with Jinfengopteryx recovered as sister to
      nearly all other troodontids.
  - id: sellés2021a
    notes: Recovered Jinfengopteryginae, placing Jinfengopteryx, Liaoningvenator,
      Tamarro and Philovenator within it.
  - id: hartman2019a
    notes: Recovered Jinfengopteryx in a highly unstable position, as likely to
      fall within Sinovenatorinae as to join the Almas group, with Liaoningvenator
      closer to troodontines.
  - id: pei2021a
    notes: Described Papiliovenator and recovered Jinfengopteryx as the sister
      taxon of Mei, in a clade with Sinovenator.
