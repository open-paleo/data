clade: Herrerasauridae
description: >
  Herrerasauridae is a family of early carnivorous dinosaurs from the Late
  Triassic (Carnian-Norian) of South America and North America, comprising
  Herrerasaurus, Staurikosaurus, Sanjuansaurus and Gnathovorax. They were the
  dominant predators of the Ischigualasto and Santa Maria faunas, the largest
  reaching roughly six meters in length. Herrerasaurids were bipedal
  hunters with grasping, tridactyl hands and a partly opisthopubic pelvis.
type_genus: Herrerasaurus
erected_in: benedetto1973a
described_in: novas1992a
diagnostic_features:
  - Intramandibular joint between the dentary and postdentary bones allowing
    the lower jaw to flex
  - Elongate, functionally tridactyl manus bearing large recurved trenchant
    claws
  - Partly opisthopubic pelvis with an elongate, distally expanded pubis
  - Only two sacral vertebrae
dispute:
  summary: >
    The position of Herrerasauridae is long contested: it has been recovered as
    a basal theropod, as a basal saurischian outside Theropoda, as the sister
    group of the sauropodomorph-theropod clade, and (Baron and Williams, 2018)
    even outside Dinosauria. Its content (Herrerasaurus, Staurikosaurus,
    Sanjuansaurus, Gnathovorax) is stable.
  history:
    - date: "2026-06-30"
      note: >
        Placed within Saurischia outside Theropoda, the least-contentious
        position, following Jones (2026) and the recent herrerasaurian analyses
        (Novas and others, 2021; Ezcurra and others, 2025).
references:
  - id: benedetto1973a
    notes: Original proposal of the family Herrerasauridae.
  - id: novas1992a
    notes: Provided the phylogenetic definition of Herrerasauridae adopted here.
  - id: ezcurra2025a
    notes: Herrerasaurian analysis supporting placement within Saurischia outside Theropoda.
  - id: novas2021a
    notes: Recent herrerasaurian analysis supporting placement within Saurischia outside Theropoda
  - id: jones2026c
    notes: Placement and assessment in the Princeton Encyclopedia of Dinosaurs.
  - id: baron2018c
    notes: Assessed Caseosaurus and its implications for early herrerasaurian evolution.
