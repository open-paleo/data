clade: Herrerasauridae
rank: family
type_genus: Herrerasaurus
identifiers:
  - source: pbdb
    id: "38510"
  - source: wikidata
    id: Q134186
  - source: gbif
    id: "3239004"
  - source: eol
    id: "4531439"
erected_in: benedetto1973a
described_in: novas1992a
diagnostic_features:
  - Intramandibular joint between the dentary and postdentary bones allowing
    the lower jaw to flex
  - Elongate, functionally tridactyl manus bearing large recurved trenchant
    claws
  - Partly opisthopubic pelvis with an elongate, distally expanded pubis
  - Only two sacral vertebrae
dispute:
  summary: >
    The position of Herrerasauridae is long contested: it has been recovered as
    a basal theropod (Nesbitt and colleagues, 2009), as the sister group of
    Sauropodomorpha (Baron and colleagues, 2017), as the sister group of the
    sauropodomorph-theropod clade (Novas and colleagues, 2021), and (Baron and
    Williams, 2018) even outside Dinosauria. Its unambiguous record long
    consisted of Herrerasaurus, Sanjuansaurus, Staurikosaurus and Gnathovorax,
    while Chindesaurus is a herrerasaur in some analyses but not in others
    (Ezcurra and colleagues, 2025).
references:
  - id: benedetto1973a
    notes: Original proposal of the family Herrerasauridae.
  - id: novas1992a
    notes: Provided the phylogenetic definition of Herrerasauridae used for the clade.
  - id: ezcurra2025a
    notes: Herrerasaurian analysis supporting placement within Saurischia outside Theropoda.
  - id: novas2021a
    notes: Recent herrerasaurian analysis supporting placement within Saurischia outside Theropoda.
  - id: jones2026c
    notes: Places Herrerasauridae within Saurischia but outside Theropoda as its
      least contentious position, noting placements within Theropoda or as
      sister to Sauropodomorpha.
  - id: baron2018c
    notes: Assessed Caseosaurus and its implications for early herrerasaurian evolution.
  - id: nesbitt2009a
    notes: Described Tawa and recovered Herrerasauridae, with Staurikosaurus and
      Chindesaurus, at the base of Theropoda with weak support.
  - id: baron2017a
    notes: Proposed Ornithoscelida and recovered Herrerasauridae as the sister
      clade of Sauropodomorpha.
