clade: Rinconsauria
description: >
  Rinconsauria is a clade of colossosaurian titanosaurs erected by Calvo et al.
  (2007) for Rinconsaurus and Muyelensaurus and their relatives. Its members are
  small- to medium-sized titanosaurs of the Late Cretaceous of South America,
  distinguished by strongly procoelous caudal vertebrae with anteriorly
  displaced neural arches and a distinctive caudal morphology. Several analyses
  recover the Aeolosaurini within Rinconsauria, making it the parent of that
  more derived tribe.
erected_in: calvo2007b
diagnostic_features:
  - Middle caudal vertebrae with neural arches set on the anterior half of the
    centrum
  - Strongly procoelous caudal centra with well-developed distal condyles
  - Anterior caudal neural spines posterodorsally inclined
  - Small to medium body size
references:
  - id: calvo2007b
    authors: Calvo, J. O.; González Riga, B. J.; Porfiri, J. D.
    year: 2007
    title: A new titanosaur sauropod from the Late Cretaceous of Neuquén, Patagonia,
      Argentina
    journal: Arquivos do Museu Nacional, Rio de Janeiro
    volume: "65"
    issue: "4"
    pages: 485-504
    notes: Erected Rinconsauria.
