clade: Rinconsauria
description: >
  Rinconsauria is a clade of titanosaurian sauropod dinosaurs from the Late
  Cretaceous of South America. Its members are all relatively small for
  titanosaurs, generally less than about 11 meters long. The group is anchored
  on Rinconsaurus and Muyelensaurus, the two genera used to define it, and most
  analyses that include both recover it with that original content, though in
  some it forms a more inclusive group with Lognkosauria nested inside
  (Carballido and colleagues, 2022). Most recent analyses recover it as the
  sister group of Lognkosauria within the larger clade Colossosauria (Carballido
  and colleagues, 2022), though those built on the matrix of Gorscak and
  O'Connor separate the two, and most place Aeolosaurus close to or within
  Rinconsauria (Díez Díaz and colleagues, 2025).
erected_in: calvo2007b
diagnostic_features:
  - Suboval tooth crowns with labial and lingual faces differentiated by crests
  - Bony processes supporting the postzygapophyseal facets in the middle caudal
    vertebrae
  - Posterior caudal centra depressed posteriorly
references:
  - id: calvo2007b
    notes: Erected Rinconsauria.
  - id: carballido2022a
    notes: Found that most analyses recover Rinconsauria with its original
      content, as the sister lineage of Lognkosauria.
  - id: díezdíaz2025a
    notes: Reported that analyses on the Gorscak and O'Connor matrix separate
      Rinconsauria and Lognkosauria, and that most place Aeolosaurus close to or
      within Rinconsauria.
