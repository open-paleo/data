clade: Rinconsauria
description: >
  Rinconsauria is a clade of titanosaurian sauropod dinosaurs from the Late
  Cretaceous of South America. Its members are all relatively small for
  titanosaurs, generally less than about 11 meters long. The group is anchored
  on Rinconsaurus and Muyelensaurus, the two genera used to define it, but its
  wider membership is highly unstable: various phylogenetic analyses have placed
  more than twenty other titanosaur genera within it, and few of those
  assignments are consistent from one study to the next. Several analyses
  recover it as the sister group of Lognkosauria within the larger clade
  Colossosauria, while others tie it closely to the Aeolosaurini, at times
  finding that tribe nested inside Rinconsauria.
erected_in: calvo2007b
diagnostic_features:
  - Middle caudal vertebrae with neural arches set on the anterior half of the
    centrum
  - Strongly procoelous caudal centra with well-developed distal condyles
  - Anterior caudal neural spines posterodorsally inclined
  - Small to medium body size
references:
  - id: calvo2007b
    notes: Erected Rinconsauria.
