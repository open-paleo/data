clade: Diplodocinae
description: >
  Diplodocinae is a subfamily of diplodocid sauropod dinosaurs that lived from
  the Late Jurassic to the Early Cretaceous, roughly 161 to 136 million years
  ago, with fossils known from North America, Europe, Africa, and South America.
  Its members include Diplodocus, Barosaurus, Galeamopus, Tornieria,
  Supersaurus, Leinkupal, and Ardetosaurus. These are among the most gracile and
  elongate of the diplodocids, distinguished by especially long necks and tails
  built from extremely elongate cervical vertebrae and slender overall
  proportions.
type_genus: Diplodocus
erected_in: marsh1884b
described_in: taylor2005a
diagnostic_features:
  - Mid-cervical vertebrae extremely elongate, with elongation indices commonly
    exceeding four.
  - Slender, gracile cervical and dorsal proportions relative to Apatosaurinae.
  - Cervical ribs slender and not ventrally displaced.
references:
  - id: marsh1884b
  - id: taylor2005a
    notes: Provided the stem-based phylogenetic definition of Diplodocinae.
