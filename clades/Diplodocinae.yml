clade: Diplodocinae
description: >
  Diplodocinae is the diplodocid subfamily containing Diplodocus and its closest
  relatives, including Barosaurus, Galeamopus, Tornieria, Supersaurus,
  Dinheirosaurus, Leinkupal, and Ardetosaurus. Its members are the most
  gracile and elongate diplodocids, with especially long necks and tails. The
  subfamily is defined as the stem-based clade of all diplodocids more closely
  related to Diplodocus than to Apatosaurus (Taylor and Naish, 2005).
type_genus: Diplodocus
erected_in: marsh1884b
described_in: taylor2005a
diagnostic_features:
  - Mid-cervical vertebrae extremely elongate, with elongation indices commonly
    exceeding four.
  - Slender, gracile cervical and dorsal proportions relative to Apatosaurinae.
  - Cervical ribs slender and not ventrally displaced.
references:
  - id: marsh1884b
  - id: taylor2005a
    notes: Provided the stem-based phylogenetic definition of Diplodocinae.
