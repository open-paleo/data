clade: Stegosaurinae
description: >
  Stegosaurinae is a subfamily of stegosaurid dinosaurs comprising Stegosaurus
  and its closest relatives, defined as the stegosaurs more closely related to
  Stegosaurus than to Dacentrurus. Its plate-backed members range in age from
  the Middle Jurassic to the Early Cretaceous, with fossils known from North
  America, Europe, and Asia. Stegosaurinae is among the most derived
  stegosaurian lineages, and some of its members, including Stegosaurus itself,
  bear large, broad dorsal plates arranged in two staggered, alternating rows
  along the back. Alongside the more spike-bearing Dacentrurinae, it makes up
  one of the two principal branches of the most advanced stegosaurids.
type_genus: Stegosaurus
erected_in: marsh1880a
described_in: sánchez-fenollosa2025a
diagnostic_features:
  - Large parasagittal dorsal plates, alternating in derived members
  - Maximum-clade membership defined by closer relationship to Stegosaurus
    stenops than to Dacentrurus armatus
references:
  - id: marsh1880a
    notes: Named Stegosauridae; Stegosaurinae dates from this work by ICZN
      coordination.
  - id: sánchez-fenollosa2025a
    notes: Provided a modern phylogenetic definition of Stegosaurinae.
