clade: Stegosaurinae
description: >
  Stegosaurinae is a subfamily of stegosaurid dinosaurs containing Stegosaurus
  and its closest relatives, the plate-bearing stegosaurids of the Late Jurassic
  and Early Cretaceous of North America, Europe, and Asia. Members are
  characterized by large, often alternating dorsal plates and a derived sacral
  and pelvic morphology. The subfamily dates by coordination from Marsh's
  naming of Stegosauridae and was given a modern phylogenetic definition by
  Sánchez-Fenollosa and Cobos (2025) as the stegosaurids closer to Stegosaurus
  than to Dacentrurus.
type_genus: Stegosaurus
erected_in: marsh1880
described_in: sánchez-fenollosa2025
diagnostic_features:
  - Large parasagittal dorsal plates, alternating in derived members
  - Maximum-clade membership defined by closer relationship to Stegosaurus
    stenops than to Dacentrurus armatus
