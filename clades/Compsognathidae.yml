clade: Compsognathidae
description: >
  Compsognathidae is a family of small, conservatively built coelurosaurian
  theropod dinosaurs known from the Late Jurassic and Early Cretaceous of
  Europe, Asia, and South America. Its members were lightly built carnivores
  that preyed on small vertebrates such as lizards, and several are among the
  smallest dinosaurs known, most no larger than about a meter long. For many
  years Compsognathus was the group's only member, but paleontologists have
  since added a number of presumably related genera, including Sinosauropteryx,
  Sinocalliopteryx, Huaxiagnathus, Aristosuchus, Mirischia, and Scipionyx,
  several of which preserve some of the earliest known primitive feathers.
  Assignment to the family has traditionally hinged on a distinctive short,
  stocky first metacarpal supporting an enlarged thumb, though the lack of
  features shared by all members has left both its monophyly and its exact
  membership contested.
type_genus: Compsognathus
erected_in: cope1871a
diagnostic_features:
  - Small body size with a proportionally long tail
  - Skull low and lightly built with numerous small teeth
  - Manus with a robust, enlarged first digit
  - Filamentous integument preserved in several members
dispute:
  summary: >
    The monophyly and membership of Compsognathidae are unresolved. Traditional
    classifications and Jones et al. (2026) recover a monophyletic Compsognathidae
    that includes the type genus Compsognathus together with the Jehol taxa
    (Sinosauropteryx, Sinocalliopteryx, Huaxiagnathus) and others. Several recent
    dedicated analyses reject this: Hartman et al. (2019) recover only a reduced
    Compsognathidae, with the Jehol taxa and Mirischia branching more basally;
    Qiu et al. (2025) place the Jehol taxa plus Mirischia in a separate clade,
    Sinosauropterygidae, from which Compsognathus is excluded in one of their two
    analyses but not the other; and Cau (2024) argues the
    family is an artifact of coding immature specimens and that its members are
    scattered across Tetanurae. The clade is retained here in its traditional,
    broadly used sense pending consensus.
  history:
    - date: "2026-07-01"
      note: Retained as the least-inclusive named clade the field still broadly uses for Compsognathus and the compsognathid-grade taxa; the Sinosauropterygidae and polyphyly hypotheses are reflected here rather than adopted. Member taxa carry no per-genus dispute for this clade-level debate.
references:
  - id: cope1871a
    notes: Listed Compsognathidae under the division Symphypoda with
      Compsognathus as its genus.
  - id: cau2024a
    notes: Argued Compsognathidae is an artifact of coding immature specimens, with its members scattered across Tetanurae.
  - id: hartman2019a
    notes: Recovered only a reduced Compsognathidae, with Jehol taxa and Mirischia branching more basally.
  - id: qiu2025a
    notes: Placed Jehol compsognathid-like taxa plus Mirischia in separate clade Sinosauropterygidae.
  - id: jones2026c
    notes: Recovers a monophyletic Compsognathidae including Compsognathus
      and the Jehol taxa.
