clade: Genasauria
description: >
  Genasauria is a clade that encompasses the great majority of ornithischian
  dinosaurs, excluding only the earliest-diverging forms such as Lesothosaurus.
  It unites two major branches: Thyreophora, the armored dinosaurs including
  ankylosaurs, stegosaurs, and more primitive relatives like Scelidosaurus; and
  Cerapoda, which gathers the ornithopods, ceratopsians, pachycephalosaurs, and
  various small early forms. Members were primarily herbivores that typically
  held their heads about a meter off the ground, suggesting they fed mainly on
  ground-level plants such as ferns, cycads, and other low-growing gymnosperms.
  A hallmark of the group is the presence of fleshy cheeks bounding inset tooth
  rows, an adaptation for more efficient processing of plant material in the
  mouth.
erected_in: sereno1986a
described_in: madzia2021a
diagnostic_features:
  - Buccal emargination of the tooth rows, with maxillary and dentary teeth inset
    from the lateral jaw margin (implying muscular cheeks)
  - Spout-shaped, edentulous anterior margin of the predentary and premaxilla
  - Reduced number of premaxillary teeth
  - Cheek-tooth crowns bearing a prominent primary ridge
references:
  - id: sereno1986a
    notes: Erected Genasauria.
  - id: madzia2021a
    notes: Provides the modern phylogenetic definition of Genasauria.
