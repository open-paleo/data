clade: Genasauria
description: >
  Genasauria is the major ornithischian clade that excludes the earliest-
  diverging forms (such as Heterodontosauridae and a grade of small basal
  ornithischians), uniting Thyreophora with Neornithischia and so encompassing
  the great majority of ornithischian diversity. Its members share evidence of
  fleshy cheeks bounding inset tooth rows, an adaptation for more efficient oral
  processing of plant material.
erected_in: sereno1986a
described_in: madzia2021a
diagnostic_features:
  - Buccal emargination of the tooth rows, with maxillary and dentary teeth inset
    from the lateral jaw margin (implying muscular cheeks)
  - Spout-shaped, edentulous anterior margin of the predentary and premaxilla
  - Reduced number of premaxillary teeth
  - Cheek-tooth crowns bearing a prominent primary ridge
references:
  - id: sereno1986a
    notes: Erected Genasauria.
  - id: madzia2021a
    notes: Provides the modern phylogenetic definition of Genasauria.
