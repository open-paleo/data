clade: Carcharodontosaurinae
description: >
  Carcharodontosaurinae is the subfamily of derived carcharodontosaurids
  containing Carcharodontosaurus and its closest relatives, including the giant
  South American forms Giganotosaurus, Mapusaurus, Meraxes, and Tyrannotitan. It
  comprises the largest members of the family; some authors use the informal tribe
  "Giganotosaurini" for the South American radiation within it. The subfamily was
  established within the phylogeny of Allosauroidea by Brusatte and Sereno in 2008.
type_genus: Carcharodontosaurus
erected_in: brusatte2008b
diagnostic_features:
  - Very large body size, among the largest of all theropods
  - Deep, robust skull with extensive rugose cranial ornamentation
  - Fused interdental plates
  - Reduced, gracile forelimbs relative to body size
references:
  - id: brusatte2008b
    authors: Brusatte, S. L.; Sereno, P. C.
    year: 2008
    title: "Phylogeny of Allosauroidea (Dinosauria: Theropoda): comparative analysis
      and resolution"
    journal: Journal of Systematic Palaeontology
    volume: "6"
    issue: "2"
    pages: 155-182
