clade: Carcharodontosaurinae
description: >
  Carcharodontosaurinae is a subfamily of carcharodontosaurid theropods that
  contains Carcharodontosaurus together with a closely knit group of South
  American giants, Giganotosaurus, Mapusaurus, Meraxes, Taurovenator, and
  Tyrannotitan, often grouped together as the tribe Giganotosaurini. It includes
  some of the largest members of the family, with some species rivaling
  Tyrannosaurus and Spinosaurus in size and ranking among the biggest land
  carnivores known. Carcharodontosaurus lived in North Africa while the
  Giganotosaurini radiated across South America, so together these animals
  spanned much of Gondwana during the Cretaceous.
type_genus: Carcharodontosaurus
erected_in: brusatte2008b
diagnostic_features:
  - Very large body size, among the largest of all theropods
  - Deep, robust skull with extensive rugose cranial ornamentation
  - Fused interdental plates
  - Reduced, gracile forelimbs relative to body size
references:
