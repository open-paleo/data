clade: Noasauridae
description: >
  Noasauridae is a family of small to medium-sized ceratosaurian theropods, the
  gracile sister group of Abelisauridae within Abelisauroidea. Known mainly from
  the Gondwanan continents but also from the Jurassic of Africa and Asia,
  noasaurids were lightly built predators and omnivores. The family is usually
  divided into the sickle-clawed Noasaurinae and the toothless, long-necked
  Elaphrosaurinae, subtended by a grade of basal forms such as Deltadromeus and
  Kiyacursor.
type_genus: Noasaurus
erected_in: bonaparte1980
diagnostic_features:
  - Small body size and lightly constructed, gracile skeleton.
  - Elongate cervical vertebrae relative to abelisaurids.
  - Strongly modified, enlarged manual or pedal ungual in some members.
  - Slender, cursorial hindlimb proportions.
references:
