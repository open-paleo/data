    authors: Bonaparte, J. F.; Powell, J. E.
    year: 1980
    title: A continental assemblage of tetrapods from the Upper Cretaceous beds of
      El Brete, northwestern Argentina
      (Sauropoda-Coelurosauria-Carnosauria-Aves)
    journal: Mémoires de la Société Géologique de France, Nouvelle Série
    volume: "139"
    pages: 19-28
    notes: Named Noasaurus and the family Noasauridae.
