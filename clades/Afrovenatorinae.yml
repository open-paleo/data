clade: Afrovenatorinae
description: >
  Afrovenatorinae is one of the two subfamilies of Megalosauridae, a family of
  carnivorous theropod dinosaurs within the broader group Megalosauroidea. It is
  defined to include all megalosaurids more closely related to Afrovenator than
  to Megalosaurus, and it stands as the sister group to Megalosaurinae. Its
  members are the generally more gracile, largely Middle Jurassic megalosaurids
  and include such genera as Dubreuillosaurus, Magnosaurus, Leshansaurus and
  Piveteausaurus. The subfamily is set apart from other megalosaurids by details
  of the skull and pelvis.
type_genus: Afrovenator
erected_in: carrano2012a
diagnostic_features:
  - Squared anterior margin of the maxillary antorbital fenestra
  - Puboischiadic plate broadly open along the midline
references:
  - id: carrano2012a
