clade: Afrovenatorinae
description: >
  Afrovenatorinae is the subfamily of megalosaurid theropods erected by Carrano,
  Benson and Sampson (2012) for Afrovenator, Dubreuillosaurus, Magnosaurus,
  Piveteausaurus and Leshansaurus (with Poekilopleuron tentatively). Defined as
  all megalosaurids closer to Afrovenator than to Megalosaurus, it groups the
  more gracile, largely Middle Jurassic megalosaurids and is the sister group of
  Megalosaurinae. The subfamily is used in preference to the sometimes-cited
  Eustreptospondylinae.
type_genus: Afrovenator
erected_in: carrano2012
diagnostic_features:
  - Squared anterior margin of the maxillary antorbital fenestra
  - Puboischiadic plate broadly open along the midline
references:
