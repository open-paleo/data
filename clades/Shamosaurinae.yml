clade: Shamosaurinae
description: >
  Shamosaurinae is a small subfamily of early-diverging ankylosaurid dinosaurs
  from the Cretaceous of Asia, sister to the derived Ankylosaurinae. It is
  typified by Shamosaurus and Gobisaurus, which share a distinctive premaxillary
  furrow and retain a relatively elongate, less ornamented skull lacking the
  fully developed tail club of ankylosaurines.
type_genus: Shamosaurus
erected_in: tumanova1983a
described_in: arbour2015a
diagnostic_features:
  - Premaxillary furrow on the anterior palate
  - Elongate skull relative to derived ankylosaurines
  - Less extensive cranial caputegular ornamentation
references:
  - id: tumanova1983a
    notes: Named Shamosaurus and the subfamily Shamosaurinae.
  - id: arbour2015a
    notes: Recovered Shamosaurinae (Gobisaurus + Shamosaurus) as sister to
      Ankylosaurinae.
