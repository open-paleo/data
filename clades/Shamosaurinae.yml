clade: Shamosaurinae
description: >
  Shamosaurinae is a basal subfamily of ankylosaurid dinosaurs, the heavily
  armored, quadrupedal herbivores of the Cretaceous. It is defined as the group
  containing Gobisaurus and Shamosaurus but excluding the more derived
  Ankylosaurus (Madzia and colleagues, 2021), and is recognized only when those
  two Asian genera form a clade to the exclusion of the ankylosaurines. As
  early-diverging members near the base of the family, its genera retain a
  comparatively long, lightly ornamented skull and lack the fully developed tail
  club that distinguishes their later ankylosaurid relatives.
type_genus: Shamosaurus
erected_in: tumanova1983a
described_in: madzia2021a
diagnostic_features:
  - Premaxillary furrow on the anterior palate
  - Elongate skull relative to derived ankylosaurines
  - Less extensive cranial caputegular ornamentation
references:
  - id: tumanova1983a
    notes: Named Shamosaurus and the subfamily Shamosaurinae.
  - id: madzia2021a
    notes: Defined Shamosaurinae as the largest clade containing Gobisaurus
      domoculus and Shamosaurus scutatus but not Ankylosaurus magniventris.
  - id: arbour2015a
    notes: Recovered Shamosaurinae (Gobisaurus + Shamosaurus) as sister to
      Ankylosaurinae.
