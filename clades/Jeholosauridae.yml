clade: Jeholosauridae
description: >
  Jeholosauridae is a family of small, herbivorous neornithischian dinosaurs
  that lived across East Asia during the Cretaceous Period, roughly from the
  Aptian to the Cenomanian. It is named for the genus Jeholosaurus, a lightly
  built early ornithischian. The group's exact makeup is unsettled: as first
  proposed it was defined to include the Chinese Changchunsaurus, the Mongolian
  Haya, and Yueosaurus alongside Jeholosaurus, but later analyses have
  rearranged these taxa. Some studies keep Changchunsaurus and Haya within the
  family while shifting Yueosaurus to the related Thescelosauridae, whereas
  other comprehensive analyses recover Changchunsaurus and Haya within
  Thescelosaurinae and restrict Jeholosauridae to Jeholosaurus and Yueosaurus.
  In these later trees the clade sits as an early-diverging lineage near the
  base of Neornithischia, stemward of Thescelosauridae and Cerapoda.
type_genus: Jeholosaurus
erected_in: han2012a
described_in: madzia2021a
diagnostic_features:
  - Straight humeral shaft lacking strong sigmoid curvature
  - Fossa on the greater trochanter of the femur (fossa trochanteris)
  - Six or more sacral vertebrae
  - Lateral swelling of the ischiadic peduncle of the ilium
references:
  - id: han2012a
    notes: Erected Jeholosauridae.
  - id: madzia2021a
    notes: Provides the modern phylogenetic definition of Jeholosauridae.
