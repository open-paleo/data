clade: Jeholosauridae
description: >
  Jeholosauridae is a clade of small basal neornithischians named for the East
  Asian genus Jeholosaurus. Although originally proposed to include the Chinese
  Changchunsaurus and Mongolian Haya, most recent comprehensive analyses
  recover those taxa within Thescelosaurinae and restrict Jeholosauridae to
  Jeholosaurus and Yueosaurus, recovered as an early-diverging neornithischian
  lineage lying stemward of Thescelosauridae and Cerapoda.
type_genus: Jeholosaurus
erected_in: han2012
described_in: madzia2021
diagnostic_features:
  - Straight humeral shaft lacking strong sigmoid curvature
  - Fossa on the greater trochanter of the femur (fossa trochanteris)
  - Six or more sacral vertebrae
  - Lateral swelling of the ischiadic peduncle of the ilium
