clade: Jeholosauridae
description: >
  Jeholosauridae is a family of small, herbivorous neornithischian dinosaurs
  that lived across East Asia during the Cretaceous Period, roughly from the
  Aptian to the Cenomanian. It is named for the genus Jeholosaurus, a lightly
  built early ornithischian. The group's exact makeup is unsettled. Han and
  colleagues (2012), who named it, included Jeholosaurus, Haya and
  Changchunsaurus, the composition Madzia and colleagues (2021) give under their
  primary reference phylogeny; other analyses recover a Jeholosaurus plus
  Yueosaurus clade, which Madzia and colleagues treat as the family, and place
  Haya near Thescelosaurinae and Orodrominae (Barta and Norell, 2021). In these
  later trees the clade sits as an early-diverging lineage near the base of
  Neornithischia, stemward of Thescelosauridae and Cerapoda.
type_genus: Jeholosaurus
erected_in: han2012a
described_in: madzia2021a
references:
  - id: han2012a
    notes: Named Jeholosauridae for Jeholosaurus, Haya and Changchunsaurus.
  - id: madzia2021a
    notes: Provides the modern phylogenetic definition of Jeholosauridae.
  - id: barta2021a
    notes: Redescribed Haya and recovered it in a polytomy with Thescelosaurinae
      and Orodrominae, and Jeholosaurus with Yueosaurus as a clade.
