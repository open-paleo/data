clade: Hadrosauridae
description: >
  Hadrosauridae is a family of large ornithopod dinosaurs commonly known as
  duck-billed dinosaurs. Hadrosaurs were the most diverse and abundant large
  herbivorous dinosaurs of the Late Cretaceous and had a near-global
  distribution. They are characterized by highly specialized dental batteries of
  hundreds of closely packed teeth forming a continuous grinding surface and by
  broad, edentulous premaxillary bills. The family divides into two major
  subfamilies: the predominantly solid-crested or crestless Saurolophinae and the
  hollow-crested Lambeosaurinae. A grade of early-diverging taxa, including the
  type genus Hadrosaurus, Eotrachodon, Aquilarhinus, and Yamatosaurus, lies
  outside both subfamilies.
type_genus: Hadrosaurus
erected_in: cope1869b
described_in: madzia2021
diagnostic_features:
  - Dental batteries with hundreds of interlocking teeth forming a single
    continuous occlusal surface
  - Broad, spatulate, edentulous premaxillary bill
  - Complete loss of the manual first digit and its ungual
  - Extensive ossified epaxial tendons forming a lattice along the vertebral
    column
  - Hoof-like unguals on the weight-bearing pedal digits
