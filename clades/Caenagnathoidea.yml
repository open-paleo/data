clade: Caenagnathoidea
description: >
  Caenagnathoidea is the derived clade of oviraptorosaurs comprising the two
  families Oviraptoridae and Caenagnathidae and their most recent common
  ancestor. Its members share a deep, edentulous skull with an extensive
  keratinous beak, a shortened tail, and the most specialized cranial and
  mandibular morphologies within Oviraptorosauria. The superfamily is
  consistently recovered and widely used, uniting the crested Asian oviraptorids
  with the toothless, often long-legged caenagnathids of Asia and North America.
type_genus: Caenagnathus
erected_in: sternberg1940a
described_in: lamanna2014a
diagnostic_features:
  - Fully edentulous jaws sheathed in a keratinous rhamphotheca
  - Deep, foreshortened skull with a secondarily pneumatized palate
  - Dentary with an elongate symphysis bearing lingual occlusal ridges
  - Mandibular articular facet for the quadrate formed almost entirely by the articular
references:
  - id: sternberg1940a
  - id: lamanna2014a
