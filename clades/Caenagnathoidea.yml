clade: Caenagnathoidea
rank: superfamily
type_genus: Caenagnathus
identifiers:
  - source: pbdb
    id: "68046"
  - source: wikidata
    id: Q846771
  - source: eol
    id: "52570716"
erected_in: sternberg1940a
described_in: osmólska2004a
diagnostic_features:
  - Fully edentulous jaws sheathed in a keratinous rhamphotheca
  - Deep, foreshortened skull with a secondarily pneumatized palate
  - Dentary with an elongate symphysis bearing lingual occlusal ridges
  - Mandibular articular facet for the quadrate formed almost entirely by the articular
references:
  - id: sternberg1940a
    notes: Named the family Caenagnathidae, from which the superfamily
      Caenagnathoidea takes its authorship by coordination.
  - id: osmólska2004a
    notes: Diagnosed Caenagnathoidea by unambiguous synapomorphies, under the
      definition of Maryańska and colleagues (2002).
  - id: maryańska2002a
    notes: Defined the clade, under the name Oviraptoroidea, as the least
      inclusive clade containing Oviraptor philoceratops and Caenagnathus
      collinsi.
  - id: lamanna2014a
    notes: Recovered Caenagnathoidea in the analysis describing Anzu, listing its
      synapomorphies.
