clade: Caenagnathoidea
description: >
  Caenagnathoidea is a superfamily of advanced oviraptorosaurs, the feathered,
  beaked maniraptoran dinosaurs of the Cretaceous Period. It groups the two
  principal families of that lineage, Caenagnathidae and Oviraptoridae, together
  with their most recent common ancestor. Its members lived across what are now
  Asia and North America and share the short, deep, parrot-like skulls typical
  of oviraptorosaurs, but in a more specialized form: the jaws are entirely
  toothless and sheathed in a horny beak, and the skull and palate are
  extensively hollowed by air spaces. The group unites the often crested
  oviraptorids, best known from Asia, with the toothless, frequently long-legged
  caenagnathids of both Asia and North America. It is a stable and widely used
  grouping, standing just apart from close relatives such as the similarly
  beakless Avimimus, which falls outside it.
type_genus: Caenagnathus
erected_in: sternberg1940a
described_in: lamanna2014a
diagnostic_features:
  - Fully edentulous jaws sheathed in a keratinous rhamphotheca
  - Deep, foreshortened skull with a secondarily pneumatized palate
  - Dentary with an elongate symphysis bearing lingual occlusal ridges
  - Mandibular articular facet for the quadrate formed almost entirely by the articular
