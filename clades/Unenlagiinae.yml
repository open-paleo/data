clade: Unenlagiinae
description: >
  Unenlagiinae is a clade of mostly Gondwanan paravian theropods, including the
  type genus Unenlagia together with Buitreraptor, Austroraptor, Neuquenraptor,
  and Rahonavis, and several fragmentary forms. Members range from turkey-sized,
  long-armed predators to the five-meter, short-armed, long-snouted Austroraptor,
  and are characterized by elongate, lightly built snouts with numerous small
  teeth. Their placement relative to Dromaeosauridae and Avialae is contested (see
  dispute).
type_genus: Unenlagia
erected_in: bonaparte1999e
diagnostic_features:
  - Elongate, low snout with a high tooth count
  - Small, weakly recurved teeth with reduced or absent serrations
  - Metatarsal III not pinched proximally (subarctometatarsalian condition in some members)
dispute:
  summary: >
    The position of Unenlagiinae is contested. Most analyses recover it as an
    early-diverging clade within Dromaeosauridae (Turner et al., 2012; Brum et al.,
    2021), the arrangement adopted here and by Jones et al. (2026). Hartman et al.
    (2019) instead recover unenlagiines and halszkaraptorines together as
    Unenlagiidae, sister to the rest of Deinonychosauria and just outside
    Dromaeosauridae, while Agnolín and Novas (2013) and Motta et al. (2020) place
    Unenlagiidae on the avialan stem (Averaptora), closer to birds than to
    Dromaeosaurus. It is placed conservatively within Dromaeosauridae following the
    prevailing view.
  history:
    - date: "2026-07-01"
      note: Placed within Dromaeosauridae following the prevailing view (Turner et al., 2012; Brum et al., 2021); the sister-to-Deinonychosauria (Hartman et al., 2019) and avialan (Agnolín and Novas, 2013) hypotheses are recorded here. Member genera carry no per-genus dispute for this clade-level debate, except Rahonavis (individually recovered as a bird in some analyses).
references:
  - id: bonaparte1999e
