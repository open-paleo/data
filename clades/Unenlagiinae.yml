clade: Unenlagiinae
description: >
  Unenlagiinae is a clade of long-snouted, paravian theropod dinosaurs known
  mainly from the Late Cretaceous of South America, with most members discovered
  in Argentina and additional forms reported from Antarctica and possibly
  Australia. The group includes Unenlagia, Buitreraptor, Austroraptor,
  Neuquenraptor, and Rahonavis among others, ranging from turkey-sized,
  long-armed predators to Austroraptor, which reached roughly 5 to 6 meters and
  ranks among the largest dromaeosaurids. Members are distinguished by very
  elongated, lightly built snouts bearing numerous small teeth, a tail stiffened
  by long chevrons and vertebral processes, a reduced second toe claw, a
  backward-oriented pubis, and slender hindlimbs with a subarctometatarsalian
  foot. These slender feet and less rigid joints likely gave them greater
  running speed than their Laurasian relatives, suiting them to catching
  smaller, faster prey. Their distinctive anatomy is thought to reflect the
  geographic isolation of Gondwana following the breakup of Pangaea. Their
  placement relative to Dromaeosauridae and Avialae remains contested (see
  dispute).
type_genus: Unenlagia
erected_in: bonaparte1999e
described_in: turner2012a
diagnostic_features:
  - Elongate, low snout with a high tooth count
  - Small, weakly recurved teeth with reduced or absent serrations
  - Metatarsal III not pinched proximally (subarctometatarsalian condition in some members)
  - Supraacetabular crest of the ilium reduced, not forming a hood over the
    acetabulum
  - Vertically oriented pubis
  - Ilium with a concave dorsocaudal margin
dispute:
  summary: >
    The position of Unenlagiinae is contested. Most analyses recover it as an
    early-diverging clade within Dromaeosauridae (Turner and colleagues, 2012;
    Brum and colleagues, 2021), the arrangement followed. Hartman and colleagues
    (2019) instead recover unenlagiines and halszkaraptorines together as
    Unenlagiidae, the sister group of a dromaeosaurid plus troodontid clade,
    while Agnolín and Novas (2013) place Unenlagiidae on the avialan stem
    (Averaptora), closer to birds than to Dromaeosaurus; Motta and colleagues
    (2020), using the Agnolín and Novas dataset, recover Overoraptor and
    Rahonavis rather than the unenlagiids as the sister group of Avialae. It is
    placed conservatively within Dromaeosauridae following the prevailing view.
  history:
    - date: "2026-07-01"
      note: Placed within Dromaeosauridae following the prevailing view (Turner and colleagues, 2012; Brum and colleagues, 2021); the sister-to-Deinonychosauria (Hartman and colleagues, 2019) and avialan (Agnolín and Novas, 2013) hypotheses remain in competing use. Member genera carry no per-genus dispute for this clade-level debate, except Rahonavis (individually recovered as a bird in some analyses).
references:
  - id: bonaparte1999e
    notes: Named the family Unenlagiidae, spelled Unenlagidae in the text, for
      Unenlagia and a Malagasy genus, from which the subfamily Unenlagiinae
      takes its authorship by coordination.
  - id: turner2012a
    notes: Emended diagnosis and stem-based definition of Unenlagiinae; recovered
      it as an early-diverging clade within Dromaeosauridae.
  - id: brum2021a
    notes: Supported the adopted Unenlagiinae arrangement in describing a new unenlagiine dromaeosaurid.
  - id: hartman2019a
    notes: Recovered unenlagiines and halszkaraptorines together as Unenlagiidae outside Dromaeosauridae.
  - id: motta2020a
    notes: Described Overoraptor and recovered it with Rahonavis as the sister
      group of Avialae, separate from the unenlagiids, using the dataset of
      Agnolín and Novas (2013).
  - id: agnolín2013a
    notes: Treated unenlagiines as avialans closer to birds rather than dromaeosaurids.
  - id: jones2026c
    notes: Adopts Unenlagiinae as an early-diverging clade within
      Dromaeosauridae.
  - id: makovicky2005a
    notes: Described Buitreraptor and placed Bonaparte's family as the subfamily
      Unenlagiinae within Dromaeosauridae.
