clade: Dacentrurinae
description: >
  Dacentrurinae is a subfamily of stegosaurid dinosaurs uniting the forms most
  closely related to Dacentrurus, including Miragaia, Adratiklit, and
  Thyreosaurus. Its members lived during the Middle to Late Jurassic of Europe
  and North Africa. Compared with their close relatives the Stegosaurinae,
  dacentrurines tend to carry narrower spines running along the back rather than
  broad plates concentrated toward the tail, and their forelimb bones show
  robust proportions suggesting powerful musculature. Dacentrurinae and
  Stegosaurinae are sister lineages within the more inclusive clade
  Neostegosauria. Sánchez-Fenollosa and Cobos (2025) also recover the East
  African Kentrosaurus and the North American Alcovasaurus within Dacentrurinae.
type_genus: Dacentrurus
erected_in: mateus2009a
described_in: sánchez-fenollosa2025a
diagnostic_features:
  - Two pairs of long terminal caudal dermal spines (thagomizer)
  - Dorsal centra wider than long in the Dacentrurus-Adratiklit-Thyreosaurus
    subgroup
references:
  - id: mateus2009a
    notes: Erected the subfamily Dacentrurinae.
  - id: sánchez-fenollosa2025a
    notes: Formalized Dacentrurinae and expanded its membership.
