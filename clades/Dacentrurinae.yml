clade: Dacentrurinae
description: >
  Dacentrurinae is a subfamily of stegosaurid dinosaurs erected for the
  long-spined European and African plated dinosaurs allied to Dacentrurus.
  Members are distinguished from other stegosaurids by their elongate paired
  terminal tail spines and relatively gracile build. The subfamily was named in
  the description of Miragaia and has since been expanded to include several
  Middle to Late Jurassic taxa from Europe and North Africa.
type_genus: Dacentrurus
erected_in: mateus2009
described_in: sánchez-fenollosa2025
diagnostic_features:
  - Two pairs of long terminal caudal dermal spines (thagomizer)
  - Dorsal centra wider than long in the Dacentrurus-Adratiklit-Thyreosaurus
    subgroup
