clade: Proceratosauridae
description: >
  Proceratosauridae is a family of small, early-diverging tyrannosauroids,
  defined as all theropods more closely related to Proceratosaurus than to
  Tyrannosaurus, Allosaurus, Compsognathus, Coelurus, Ornithomimus, or
  Deinonychus. Named for the crested Middle Jurassic Proceratosaurus, it
  contains the earliest and most basal members of Tyrannosauroidea.
type_genus: Proceratosaurus
erected_in: rauhut2010
diagnostic_features:
  - Strongly enlarged external nares
  - Slight anterior offset of the maxillary ascending ramus from the anterior
    margin of the maxillary body
  - Midline cranial crest or horn on the nasals
references:
  - id: rauhut2010
    authors: Rauhut, O. W. M.; Milner, A. C.; Moore-Fay, S.
    year: 2010
    title: Cranial osteology and phylogenetic position of the theropod dinosaur
