clade: Proceratosauridae
description: >
  Proceratosauridae is a family of tyrannosauroid theropod dinosaurs that lived
  from the Middle Jurassic to the Early Cretaceous, representing some of the
  earliest and most basal members of the tyrannosaur lineage. It is defined as
  all theropods more closely related to Proceratosaurus than to Tyrannosaurus,
  Allosaurus, Compsognathus, Coelurus, Ornithomimus, or Deinonychus (Rauhut,
  Milner and Moore-Fay, 2010). Unlike the giant, short-armed tyrannosaurids that
  came later, proceratosaurids were generally small and retained fairly long,
  three-fingered arms capable of grasping prey, though Sinotyrannus, a member in
  the analysis of Loewen and colleagues (2013), grew much larger. The group is
  distinguished above all by an elaborate midline crest along the nasals and by
  greatly elongated external nares. Its members include Proceratosaurus,
  Guanlong and Kileskus (Averianov and colleagues, 2010), with Sinotyrannus,
  Stokesosaurus and Juratyrant added by Loewen and colleagues (2013); the
  analysis that coined the name recovered Proceratosaurus and Guanlong as its
  members (Rauhut, Milner and Moore-Fay, 2010).
type_genus: Proceratosaurus
erected_in: rauhut2010a
diagnostic_features:
  - Strongly enlarged external nares
  - Slight anterior offset of the maxillary ascending ramus from the anterior
    margin of the maxillary body
  - Midline cranial crest or horn on the nasals
references:
  - id: averianov2010a
    notes: Described Kileskus and diagnosed Proceratosauridae, arguing the name
      was a nomen nudum as published by Rauhut and colleagues (2010).
  - id: rauhut2010a
    notes: Coined Proceratosauridae with a phylogenetic definition, having
      listed the characters uniting Proceratosaurus with Guanlong.
  - id: loewen2013a
    notes: Recovered Proceratosauridae as two subclades, one of Stokesosaurus,
      Juratyrant and Sinotyrannus and one of Proceratosaurus, Kileskus and
      Guanlong.
