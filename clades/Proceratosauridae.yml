clade: Proceratosauridae
description: >
  Proceratosauridae is a family of tyrannosauroid theropod dinosaurs that lived
  from the Middle Jurassic to the Early Cretaceous, representing some of the
  earliest and most basal members of the tyrannosaur lineage. It is defined as
  all theropods more closely related to Proceratosaurus than to Tyrannosaurus,
  Allosaurus, Compsognathus, Coelurus, Ornithomimus, or Deinonychus. Unlike the
  giant, short-armed tyrannosaurids that came later, proceratosaurids were
  generally small and retained fairly long, three-fingered arms capable of
  grasping prey, though possible members such as Yutyrannus and Sinotyrannus
  grew much larger. The group is distinguished above all by an elaborate midline
  crest along the nasals and by greatly elongated external nares. Genera
  commonly assigned to the family include Proceratosaurus, Guanlong, Kileskus,
  and Sinotyrannus, with taxa such as Stokesosaurus, Juratyrant, and Dilong
  recovered here in some analyses.
type_genus: Proceratosaurus
erected_in: rauhut2010a
diagnostic_features:
  - Strongly enlarged external nares
  - Slight anterior offset of the maxillary ascending ramus from the anterior
    margin of the maxillary body
  - Midline cranial crest or horn on the nasals
