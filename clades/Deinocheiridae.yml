clade: Deinocheiridae
description: >
  Deinocheiridae is one of the two principal ornithomimosaur families, revived by
  Lee et al. (2014) with the redescription of Deinocheirus. Its members are
  generally large, robustly proportioned ornithomimosaurs that retained a
  non-arctometatarsalian pes, in contrast to the cursorial Ornithomimidae. The
  family includes the giant Deinocheirus, the Mongolian Garudimimus, and the
  Mexican Paraxenisaurus; the older family Garudimimidae is treated as a junior
  synonym.
type_genus: Deinocheirus
erected_in: osmólska1970a
described_in: lee2014a
diagnostic_features:
  - Large body size with robust, non-cursorial hindlimb proportions
  - Pes non-arctometatarsalian, with metatarsal III not pinched proximally
  - Broad, low pedal unguals
  - Dorsoventrally deep dentary in taxa preserving the lower jaw
references:
  - id: osmólska1970a
    notes: Erected the family Deinocheiridae for Deinocheirus mirificus.
  - id: lee2014a
    notes: Redescription of Deinocheirus that revalidated Deinocheiridae as a
      distinct ornithomimosaur family.
