clade: Deinocheiridae
description: >
  Deinocheiridae is a family of ornithomimosaurian dinosaurs that lived across
  Asia and North America during the Cretaceous, roughly 115 to 69 million years
  ago. Alongside the more lightly built, cursorial ornithomimids, it represents
  one of the two main branches of the ornithomimosaurs, but its members tended
  to be large and robustly proportioned, retaining broader, less specialized
  feet rather than the tightly pinched running foot of their relatives. The
  group ranged from the comparatively primitive Beishanlong to the giant,
  deep-jawed Deinocheirus at its most derived, and also takes in the Mongolian
  Garudimimus and the Mexican Paraxenisaurus, with Harpymimus and Hexing
  sometimes assigned here as well. The once-separate family Garudimimidae is now
  treated as a junior synonym, since Deinocheiridae contains its type genus.
type_genus: Deinocheirus
erected_in: osmólska1970a
described_in: lee2014a
diagnostic_features:
  - Large body size with robust, non-cursorial hindlimb proportions
  - Pes non-arctometatarsalian, with metatarsal III not pinched proximally
  - Broad, low pedal unguals
  - Dorsoventrally deep dentary in taxa preserving the lower jaw
references:
  - id: osmólska1970a
    notes: Erected the family Deinocheiridae for Deinocheirus mirificus.
  - id: lee2014a
    notes: Redescription of Deinocheirus that revalidated Deinocheiridae as a
      distinct ornithomimosaur family.
