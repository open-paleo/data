    id: "138556"
  - source: wikidata
    id: Q1851719
erected_in: canale2009a
diagnostic_features:
  - Strongly convex ventral margin of the dentary, with the symphysis directed
    upward
  - Distal end of the postorbital's jugal process expanded front to back
  - Proximal and middle caudal transverse processes greatly expanded distally,
    with a well-developed cranial process
  - Hyposphene–hypantrum accessory articulations on the anterior caudal
    vertebrae
  - Hatchet-shaped distal end of the cnemial crest
  - Subrectangular ascending process of the astragalus
references:
  - id: canale2009a
    notes: Named Skorpiovenator and Brachyrostra, defining and diagnosing the
      clade in its supplement; the dentary and astragalus characters are
      ambiguous synapomorphies.
