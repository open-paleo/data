clade: Brachyrostra
description: >
  Brachyrostra, whose name means "short snouts," is a clade of abelisaurid
  theropod dinosaurs known mainly from the Cretaceous of South America. It is
  defined as all abelisaurids more closely related to Carnotaurus than to
  Majungasaurus, and it groups horned genera such as Carnotaurus and Aucasaurus
  with their close relatives; the more deeply nested Furileusauria and, within
  it, the tribe Carnotaurini fall inside the clade. Members are the most derived
  of the abelisaurids, relatively lightly built for large theropods and
  distinguished by very short, narrow skulls and extremely reduced forearms,
  even more so than in other members of the family. Many carried horns or
  roughened bosses on the frontal and nasal bones, interpreted as supports for
  cornified structures or dermal armor. They were also swift runners, with an
  enlarged tail-based locomotory musculature that made them among the fastest
  large theropods known. Long thought to be exclusively South American, the
  group is now recognized as far afield as France with the taxon Caletodraco.
erected_in: canale2008a
diagnostic_features:
  - Proportionally shortened, deep snout
  - Progressive enclosure of the orbit by the postorbital and lacrimal
  - Strongly ornamented cranial bones
  - Anteriorly expanded cnemial crest of the tibia in derived members
references:
  - id: canale2008a
    notes: Named Skorpiovenator and erected the clade Brachyrostra for the South
      American abelisaurid radiation.
