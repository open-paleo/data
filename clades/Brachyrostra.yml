clade: Brachyrostra
description: >
  Brachyrostra is a clade of derived, mostly South American abelisaurids erected
  by Canale and colleagues, defined as all abelisaurids more closely related to
  Carnotaurus than to Majungasaurus. It groups short-snouted forms such as
  Ilokelesia, Ekrixinatosaurus, and Skorpiovenator with the more deeply nested
  Furileusauria, and is the reciprocal sister subclade to Majungasaurinae within
  Abelisauridae. Brachyrostrans are characterized by proportionally short, deep
  skulls with a progressively enclosed orbit.
erected_in: canale2008
diagnostic_features:
  - Proportionally shortened, deep snout.
  - Progressive enclosure of the orbit by the postorbital and lacrimal.
  - Strongly ornamented cranial bones.
  - Anteriorly expanded cnemial crest of the tibia in derived members.
references:
