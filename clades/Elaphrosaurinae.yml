clade: Elaphrosaurinae
description: >
  Elaphrosaurinae is a subfamily of ceratosaurian theropod dinosaurs, usually
  classified within the family Noasauridae. Its members were lightly built
  animals with small skulls, long necks, and long legs, and the group ranges
  from the Middle Jurassic through the Late Cretaceous. Most of the best-known
  forms, including Elaphrosaurus and Limusaurus, lived during the Jurassic,
  while Huinculsaurus extends the group into the Cretaceous. Adults were
  completely toothless, their jaws instead edged with a horny beak, and evidence
  from Limusaurus — including preserved gastroliths and chemical signatures —
  suggests they were largely herbivorous, though juveniles retained teeth and
  may have been omnivorous or carnivorous. The subfamily is distinguished by
  cervical vertebrae with strongly concave articular faces and cervical ribs
  fused to the vertebral bodies, along with unusually small hips set against
  long legs, the thigh bone measuring more than 1.3 times the length of the
  ilium.
type_genus: Elaphrosaurus
erected_in: rauhut2016b
diagnostic_features:
  - Extreme transverse constriction of the posterior cervical and anterior
    dorsal vertebral centra.
  - Elongate, low cervical vertebrae producing a long neck.
  - Reduction or complete loss of the dentition (edentulism in Limusaurus).
  - Gracile, cursorial hindlimb proportions.
dispute:
  summary: >
    The position of Elaphrosaurinae within Ceratosauria is unsettled. Rauhut and
    Carrano (2016), Pol and colleagues (2024), and most reference works place it
    inside Noasauridae as the sister subclade to Noasaurinae, the arrangement
    adopted here. However, one of the three data matrices analyzed by Hendrickx
    and colleagues (2024) recovered Elaphrosaurinae outside Noasauridae, near the
    base of Ceratosauria as the sister group of Neoceratosauria, and the position
    is acknowledged as weakly constrained.
  history:
    - date: "2026-06-30"
      note: Placed within Noasauridae following Rauhut and Carrano (2016) and the
        prevailing recent analyses; the basal-Ceratosauria alternative of
        Hendrickx and colleagues (2024) is recorded but not adopted.
references:
  - id: rauhut2016b
    notes: Placed Elaphrosaurus in Noasauridae and erected the subfamily
      Elaphrosaurinae.
  - id: hendrickx2024a
    notes: One matrix placed Elaphrosaurinae outside Noasauridae, as sister to Neoceratosauria.
  - id: pol2024a
    notes: Recovered Elaphrosaurinae as a noasaurid subclade.
