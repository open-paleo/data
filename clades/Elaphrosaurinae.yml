clade: Elaphrosaurinae
description: >
  Elaphrosaurinae is a subfamily of noasaurids erected by Rauhut and Carrano for
  Elaphrosaurus and its close relatives, defined as all noasaurids more closely
  related to Elaphrosaurus than to Noasaurus. Its members — Elaphrosaurus,
  Limusaurus, and the derived Huinculsaurus — are long-necked, lightly built
  ceratosaurs that span the Middle Jurassic to the Late Cretaceous and show a
  trend toward reduction or loss of the dentition. The clade is diagnosed by
  distinctive elongate, transversely constricted cervical and anterior dorsal
  vertebrae.
type_genus: Elaphrosaurus
erected_in: rauhut2016b
diagnostic_features:
  - Extreme transverse constriction of the posterior cervical and anterior
    dorsal vertebral centra.
  - Elongate, low cervical vertebrae producing a long neck.
  - Reduction or complete loss of the dentition (edentulism in Limusaurus).
  - Gracile, cursorial hindlimb proportions.
dispute:
  summary: >
    The position of Elaphrosaurinae within Ceratosauria is unsettled. Rauhut and
    Carrano (2016), Pol and colleagues (2024), and most reference works place it
    inside Noasauridae as the sister subclade to Noasaurinae, the arrangement
    adopted here. However, one of the three data matrices analyzed by Hendrickx
    and colleagues (2024) recovered Elaphrosaurinae outside Noasauridae, near the
    base of Ceratosauria as the sister group of Neoceratosauria, and the position
    is acknowledged as weakly constrained.
  history:
    - date: "2026-06-30"
      note: Placed within Noasauridae following Rauhut and Carrano (2016) and the
        prevailing recent analyses (P3); the basal-Ceratosauria alternative of
        Hendrickx and colleagues (2024) is recorded but not adopted (P5).
references:
  - id: rauhut2016b
    authors: Rauhut, O. W. M.; Carrano, M. T.
    year: 2016
    title: The theropod dinosaur Elaphrosaurus bambergi Janensch, 1920, from the
      Late Jurassic of Tendaguru, Tanzania
    journal: Zoological Journal of the Linnean Society
    volume: "178"
    issue: "3"
    pages: 546-610
    publisher: Oxford University Press (OUP)
    doi: 10.1111/zoj.12425
    notes: Placed Elaphrosaurus in Noasauridae and erected the subfamily
      Elaphrosaurinae.
