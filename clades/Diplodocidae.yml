clade: Diplodocidae
description: >
  Diplodocidae is a family of flagellicaudatan sauropods known primarily from the
  Late Jurassic of North America, with additional records in Africa, Europe, and
  South America. Diplodocids are characterized by extremely elongate bodies and
  whip-like tails, long shallow skulls with anteriorly restricted pencil-shaped
  teeth, and bifurcated neural spines on the cervical and dorsal vertebrae. The
  family splits into the subfamilies Apatosaurinae and Diplodocinae and is
  defined as the stem-based clade of all flagellicaudatans more closely related
  to Diplodocus than to Dicraeosaurus (Sereno, 1998).
type_genus: Diplodocus
erected_in: marsh1884diplodocidae
described_in: sereno1998a
diagnostic_features:
  - Extremely elongate tail terminating in a whip-like series of rod-shaped
    distal caudals.
  - Pencil-shaped (cylindrical) teeth restricted to the front of the jaws.
  - Bifurcated neural spines on the cervical and anterior dorsal vertebrae.
  - Tail chevrons with both anterior and posterior projections (double-beamed)
    in the middle of the tail.
