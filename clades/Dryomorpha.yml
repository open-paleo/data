clade: Dryomorpha
description: >
  Dryomorpha is a clade of iguanodontian ornithopod dinosaurs that brings
  together the small, gracile dryosaurids and the more robust, thumb-spiked
  ankylopollexians, along with forms such as Hesperonyx whose position within
  the clade is uncertain. It is defined as the smallest clade containing Dryosaurus
  and Iguanodon, and so unites the last common ancestor of those animals with
  all of its descendants. The clade captures a key stage in ornithopod
  evolution, spanning the transition from lightly built browsers toward the
  large, quadrupedal bulk feeders that culminated in the hadrosaurs, or
  duck-billed dinosaurs, of the Cretaceous.
erected_in: sereno1986a
described_in: madzia2021a
diagnostic_features:
  - Antorbital fenestra closed or greatly reduced
  - Brevis shelf of the ilium broadly exposed in lateral view
  - Loss of the first distal tarsal
  - Reduced manual and pedal digit counts relative to basal iguanodontians
references:
  - id: sereno1986a
    notes: Named Dryomorpha as a new gigafamily, misprinted "Dyromorpha" in the
      classification and spelled "Dryomorpha" in the text.
  - id: madzia2021a
    notes: Provides the modern phylogenetic definition of Dryomorpha.
