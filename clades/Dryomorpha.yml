clade: Dryomorpha
description: >
  Dryomorpha is the clade of iguanodontian ornithopods comprising Dryosauridae
  and Ankylopollexia and their most recent common ancestor. It unites the small,
  gracile dryosaurids with the robust, thumb-spiked ankylopollexians and the
  lineage leading to the hadrosaurs, marking the transition toward the large
  bulk-feeding ornithopods of the Cretaceous.
erected_in: sereno1986
described_in: madzia2021
diagnostic_features:
  - Antorbital fenestra closed or greatly reduced
  - Brevis shelf of the ilium broadly exposed in lateral view
  - Loss of the first distal tarsal
  - Reduced manual and pedal digit counts relative to basal iguanodontians
