clade: Eutitanosauria
description: >
  Eutitanosauria is a clade of titanosaurs that gathers together the more
  derived members of the group. Under its current node-based definition it spans
  the smallest grouping that contains both Patagotitan and Saltasaurus, making
  it the immediate parent of two major branches: Colossosauria, which includes
  the enormous lognkosaurs and the comparatively small-bodied rinconsaurs, and
  Saltasauroidea, which includes the smaller, heavily armored saltasaurids.
  Members are distinguished by the loss of the hyposphene-hypantrum articulation
  between the vertebrae, and many bore bony osteoderms embedded in the skin.
  Because the definition has shifted repeatedly and often overlaps with the
  broader Lithostrotia, the label is frequently left unused or unlabeled on
  phylogenetic trees.
erected_in: sanz1999a
described_in: carballido2022a
diagnostic_features:
  - Absence of a prominent prespinal lamina on anterior caudal vertebrae
  - Strongly procoelous caudal centra throughout the tail
  - Eye-shaped (reniform) sternal plates
  - Reduced or absent carpal ossification and loss of manual phalanges
dispute:
  summary: >
    The content and rank of Eutitanosauria, and its position relative to
    Lithostrotia, vary among analyses. Sanz et al. (1999) introduced the name
    for a clade of advanced titanosaurs, and Carballido et al. (2022) recovered
    it as a node defined by Patagotitan plus Saltasaurus nested within
    Lithostrotia. Other analyses do not recover an equivalent node or place its
    constituent taxa differently, and some workers treat "Eutitanosauria" as an
    informal grouping. It is placed here within Lithostrotia following Carballido
    et al. (2022), the most recent dedicated reappraisal of titanosaur
    systematics.
  history:
    - date: "2026-06-30"
      note: >
        Placed within Lithostrotia as the parent of Colossosauria and
        Saltasauroidea following the node-stem framework of Carballido et al.
        (2022); the competing treatments of its content and position are noted.
references:
  - id: sanz1999a
    notes: Introduced the name Eutitanosauria.
  - id: carballido2022a
    notes: Recovered and redefined Eutitanosauria as the node Patagotitan +
      Saltasaurus, parent of Colossosauria and Saltasauroidea.
