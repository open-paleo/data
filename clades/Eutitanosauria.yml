clade: Eutitanosauria
rank: unranked
erected_in: sanz1999a
described_in: carballido2022a
diagnostic_features:
  - Loss of the hyposphene-hypantrum articulation in the posterior dorsal
    vertebrae
  - Reduced fourth trochanter of the femur
  - Dermal osteoderms present
dispute:
  summary: >
    The content and rank of Eutitanosauria, and its position relative to
    Lithostrotia, vary among analyses. Sanz and colleagues (1999) introduced the
    name for a clade of advanced titanosaurs, and Carballido and colleagues
    (2022) redefined it as the node of Patagotitan and Saltasaurus, whose two
    stems are Colossosauria and Saltasauroidea. Whether that node lies within
    Lithostrotia depends on the position of Malawisaurus: in most analyses
    Lithostrotia includes nearly all titanosaurs, but in others it is the sister
    of Colossosauria and so falls within Eutitanosauria (Carballido and
    colleagues, 2022). Its content is highly labile among analyses, and many
    studies neither define nor label it (Carballido and colleagues, 2022). It is
    placed within Lithostrotia, following the majority topology.
references:
  - id: sanz1999a
    notes: Introduced the name Eutitanosauria.
  - id: carballido2022a
    notes: Redefined Eutitanosauria as the node of Patagotitan and Saltasaurus,
      with Colossosauria and Saltasauroidea as its two stems.
