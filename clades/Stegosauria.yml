clade: Stegosauria
description: >
  Stegosauria is a clade of herbivorous, armored ornithischian dinosaurs
  belonging to the Thyreophora, best known for the arrays of bony plates and
  spikes that run along the back, hips, and tail. Stegosaurs lived from the
  Middle Jurassic into the Early Cretaceous, with fossils recovered mostly
  across the Northern Hemisphere as well as Africa and South America. They were
  quadrupedal plant-eaters with small, narrow heads and hindlimbs much longer
  than the forelimbs, and a broad pelvis that held the tail out almost
  horizontally behind the animal. The tail ended in paired spikes, informally
  called a thagomizer, which at least in older adults served as a defensive
  weapon. The clade contains two families: the small, early-diverging
  Huayangosauridae and the larger, more diverse Stegosauridae, which account for
  the great majority of known genera and reached their peak diversity in the
  Late Jurassic before declining through the Cretaceous.
type_genus: Stegosaurus
erected_in: marsh1877a
described_in: maidment2008a
diagnostic_features:
  - Parasagittal rows of alternating or paired dorsal plates and/or spines
  - Tail spines (thagomizer) used for defense
  - Hindlimbs substantially longer than forelimbs
  - Small skull with simple, leaf-shaped teeth and weak jaw musculature
  - Low, arched body profile
  - Relatively small brain (low encephalization quotient)
references:
  - id: marsh1877a
    notes: Erected the order Stegosauria.
  - id: maidment2008a
    notes: Comprehensive systematic revision of Stegosauria.
