  - source: wikidata
    id: Q2334389
  - source: eol
    id: "47458333"
erected_in: franco-rosas2004a
described_in: carballido2017a
type_genus: Aeolosaurus
diagnostic_features:
  - Anterior and middle caudal neural spines strongly inclined anteriorly
  - Caudal prezygapophyses elongate, projecting beyond the anterior margin of the
    centrum
  - Strongly procoelous caudal centra with prominent distal condyles
  - Haemal arches with an anterior expansion
references:
  - id: franco-rosas2004a
    notes: Named Aeolosaurini as the most inclusive clade containing Aeolosaurus
      rionegrinus and Gondwanatitan faustoi but not Saltasaurus loricatus or
      Opisthocoelicaudia skarzynskii, and diagnosed it.
  - id: carballido2017a
    notes: Redefined Aeolosaurini as the least inclusive clade containing
      Aeolosaurus rionegrinus and Gondwanatitan faustoi, in the analysis
      describing Patagotitan, which places Aeolosaurus within Rinconsauria.
