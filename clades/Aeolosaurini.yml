clade: Aeolosaurini
description: >
  Aeolosaurini is a tribe of rinconsaurian titanosaurs erected by Franco-Rosas
  et al. (2004) for Aeolosaurus, Gondwanatitan and their relatives, and given a
  formal phylogenetic content by Carballido et al. (2017) and subsequent
  analyses. Its members are medium-sized Late Cretaceous titanosaurs of South
  America and Africa, diagnosed chiefly by distinctive anteriorly inclined
  caudal neural spines and prezygapophyses that project well beyond the front of
  the centrum, giving the tail a characteristic articulation.
erected_in: franco-rosas2004
described_in: carballido2017
type_genus: Aeolosaurus
diagnostic_features:
  - Anterior and middle caudal neural spines strongly inclined anteriorly
  - Caudal prezygapophyses elongate, projecting beyond the anterior margin of the
    centrum
  - Strongly procoelous caudal centra with prominent distal condyles
  - Haemal arches with an anterior expansion
