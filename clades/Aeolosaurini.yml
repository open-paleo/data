clade: Aeolosaurini
description: >
  Aeolosaurini is a clade of titanosaurian sauropod dinosaurs from the
  Cretaceous Period, best known from Argentina and Brazil. Its members include
  Aeolosaurus, Gondwanatitan, Maxakalisaurus, Panamericansaurus, and
  Rinconsaurus, and the group spans a wide range of body sizes, from relatively
  small forms such as Shingopana and Overosaurus to large animals like
  Aeolosaurus maximus. The clade is distinguished by a suite of features in the
  tail vertebrae, including angled centra, elongated prezygapophyses, and neural
  arches shifted forward relative to the centra. In life these traits may have
  given the tail a strong downward curve, which could have increased the pull of
  the caudofemoralis longus muscle used to draw back the hindlimb.
erected_in: franco-rosas2004a
described_in: carballido2017a
type_genus: Aeolosaurus
diagnostic_features:
  - Anterior and middle caudal neural spines strongly inclined anteriorly
  - Caudal prezygapophyses elongate, projecting beyond the anterior margin of the
    centrum
  - Strongly procoelous caudal centra with prominent distal condyles
  - Haemal arches with an anterior expansion
references:
  - id: franco-rosas2004a
    notes: Erected the tribe Aeolosaurini.
  - id: carballido2017a
    notes: Recovered Aeolosaurini within Rinconsauria in a dedicated
      phylogenetic analysis.
