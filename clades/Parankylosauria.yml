clade: Parankylosauria
description: >
  Parankylosauria is an early-diverging clade of armored dinosaurs that lived
  across the former southern supercontinent of Gondwana — in what are now South
  America, Antarctica, and Australia — during the Cretaceous. It is recovered as
  the first lineage to branch off from the rest of the ankylosaurs, making it
  the sister group to Euankylosauria, the ankylosaurids and nodosaurids that
  dominate the Northern Hemisphere. Its members, including Stegouros,
  Antarctopelta, and Kunbarrasaurus, were relatively small, roughly 1.5 to 4
  meters long, and retained a number of primitive traits shared with early
  armored dinosaurs and stegosaurs but lost in other ankylosaurs, such as
  longer, more slender limbs and simple, narrow hips. Their skulls bear elongate
  snouts with distinctive narrow nasal bones and lack the elaborate horns and
  bosses seen in other ankylosaurs. Rather than a knob-like tail club, several
  parankylosaurs carried a frond-like tail weapon known as a macuahuitl, formed
  from flattened osteoderms arranged along both sides of the tail.
erected_in: soto-acuña2021a
described_in: soto-acuña2024a
diagnostic_features:
  - Slender, gracile limbs relative to other ankylosaurs
  - Thin dermal sacral shield
  - Dorsoventrally flattened distal caudal osteoderms (in the Stegouros tail
    weapon)
  - Teeth with denticles confluent with enamel ridges and an asymmetric bulged
    cingulum
dispute:
  summary: >
    The monophyly of Parankylosauria is contested. Soto-Acuña et al. (2021)
    erected it for Stegouros, Antarctopelta, and Kunbarrasaurus and recovered
    it across five matrices, with support from Soto-Acuña et al. (2024). Using
    a different matrix, Maidment et al. (2025) did not recover the clade and
    instead dispersed its putative members across Ankylosauria and Thyreophora.
    Whether it is a genuine clade sister to Euankylosauria or a convergent
    Gondwanan grade remains open; Patagopelta and Minmi are contested members
    placed elsewhere here.
  history:
    - date: "2026-06-26"
      note: Kept as a node with the three core Gondwanan taxa (Stegouros, Antarctopelta, Kunbarrasaurus) following Soto-Acuña et al. (2021, 2024); monophyly contested by Maidment et al. (2025).
references:
  - id: soto-acuña2021a
    notes: Described Stegouros and erected Parankylosauria.
  - id: soto-acuña2024a
    notes: Reappraisal of Antarctopelta supporting Parankylosauria.
  - id: maidment2025b
    notes: New Spicomellus phylogeny dispersed putative Parankylosauria members across Ankylosauria and Thyreophora
