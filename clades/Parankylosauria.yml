clade: Parankylosauria
description: >
  Parankylosauria is an early-diverging clade of Gondwanan armored dinosaurs
  erected for Stegouros and its relatives, recovered as the sister group to
  Euankylosauria (Ankylosauridae + Nodosauridae). Its members are small,
  slender-limbed ankylosaurs, several bearing a distinctive frond-like tail
  weapon (the macuahuitl of Stegouros) rather than a knob-like tail club.
erected_in: soto-acuña2021a
described_in: soto-acuña2024a
diagnostic_features:
  - Slender, gracile limbs relative to other ankylosaurs
  - Thin dermal sacral shield
  - Dorsoventrally flattened distal caudal osteoderms (in the Stegouros tail
    weapon)
  - Teeth with denticles confluent with enamel ridges and an asymmetric bulged
    cingulum
dispute:
  summary: >
    The monophyly of Parankylosauria is contested. Soto-Acuña et al. (2021)
    erected it for Stegouros, Antarctopelta, and Kunbarrasaurus and recovered
    it across five matrices, with support from Soto-Acuña et al. (2024). Using
    a different matrix, Maidment et al. (2025) did not recover the clade and
    instead dispersed its putative members across Ankylosauria and Thyreophora.
    Whether it is a genuine clade sister to Euankylosauria or a convergent
    Gondwanan grade remains open; Patagopelta and Minmi are contested members
    placed elsewhere here.
  history:
    - date: "2026-06-26"
      note: Kept as a node with the three core Gondwanan taxa (Stegouros, Antarctopelta, Kunbarrasaurus) following Soto-Acuña et al. (2021, 2024); monophyly contested by Maidment et al. (2025) (P6).
references:
  - id: soto-acuña2021a
    notes: Described Stegouros and erected Parankylosauria.
  - id: soto-acuña2024a
    notes: Reappraisal of Antarctopelta supporting Parankylosauria.
