clade: Caudipterygidae
description: >
  Caudipterygidae is a family of small, feathered oviraptorosaurian theropod
  dinosaurs from the Early Cretaceous of China, known from the Yixian and
  Jiufotang Formations roughly 125 to 120 million years ago (He and colleagues,
  2008). It groups Caudipteryx with close relatives such as Similicaudipteryx,
  forms that sit near the base of the oviraptorosaur radiation.
  Similicaudipteryx has a dagger-shaped pygostyle, the fused bone at the tip of
  the tail that in birds anchors a fan of feathers, whereas the distal caudal
  vertebrae of Caudipteryx are not fused (He and colleagues, 2008). The family
  was erected by Zhou and Wang (2000) with Caudipteryx as its only genus;
  Similicaudipteryx (He and colleagues, 2008) and Xingtianosaurus (Qiu and
  colleagues, 2019) were added later. Its standing as a natural group remains
  debated, with some analyses recovering it as a clade and others treating its
  members as a paraphyletic grade of basal oviraptorosaurs.
type_genus: Caudipteryx
erected_in: osmólska2004a
diagnostic_features:
  - Small anterior premaxillary and maxillary teeth, absent posteriorly
  - Elongate hindlimb with a cursorial, gracile build
  - Short forelimb bearing remiges and a rectricial fan of pennaceous feathers
  - Gastrolith clusters preserved in the abdominal region
synonyms:
  - name: Caudipteridae
    type: emended spelling
    reason: Original spelling of the family, erected by Zhou and Wang (2000)
      and emended to Caudipterygidae by Osmólska and colleagues (2004).
dispute:
  summary: >
    The status of Caudipterygidae as a natural clade is debated. Dedicated
    oviraptorosaur analyses recover it as monophyletic: Lamanna and
    colleagues (2014) for Caudipteryx and Similicaudipteryx, and Qiu and
    colleagues (2019) adding Xingtianosaurus, though the latter found the
    family supported by a single character with the three genera in an
    unresolved polytomy. Hartman and colleagues (2019) instead find a grade
    of short-armed basal oviraptorosaurs including Similicaudipteryx,
    Caudipteryx and Avimimus,, and Funston and colleagues (2020) and Cau and
    Madzia (2021) do not recover it either.
  history:
    - date: "2026-07-01"
      note: >
        Retained as a family following the dedicated oviraptorosaur analyses
        (Lamanna and colleagues, 2014; Funston and colleagues, 2020); the clade-versus-grade
        question is unresolved.
    - date: "2026-07-28"
      note: Retained as a family following the dedicated oviraptorosaur analyses
        (Lamanna and colleagues, 2014; Qiu and colleagues, 2019); the clade-versus-grade question
        is unresolved.
references:
  - id: zhou2000b
    notes: Erected the family (as Caudipteridae) for Caudipteryx.
  - id: lamanna2014a
    notes: Oviraptorosaur phylogeny recovering Caudipterygidae as monophyletic in
      strict consensus, for Caudipteryx and Similicaudipteryx.
  - id: qiu2019a
    notes: Erected Xingtianosaurus as a caudipterid and recovered Caudipteridae as
      monophyletic on a single character, with Caudipteryx, Similicaudipteryx and
      Xingtianosaurus in a polytomy.
  - id: hartman2019a
    notes: Recovered Similicaudipteryx as the first-branching oviraptorosaur and
      described basal oviraptorosaurs as a grade of short-armed taxa including
      Caudipteryx.
  - id: jones2026c
    notes: Places Caudipteryx and Similicaudipteryx with Incisivosaurus among the
      basal oviraptorosaurs, without recognizing Caudipterygidae.
  - id: osmólska2004a
    notes: >
      Writes the family as Caudipterygidae (emend.), crediting it to Zhou and
      Wang (2000).
  - id: he2008a
    notes: Described Similicaudipteryx, the first caudipterid from the Jiufotang
      Formation, with a dagger-like pygostyle unlike the unfused tail tip of
      Caudipteryx.
  - id: funston2020a
    notes: Recognized the basal caudipterygids as one of four main
      oviraptorosaur clades.
  - id: cau2021a
    notes: Did not recover Caudipterygidae; Caudipteryx is the sister of Microvenator.
