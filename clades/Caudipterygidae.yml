clade: Caudipterygidae
description: >
  Caudipterygidae is a family of small, feathered oviraptorosaurian theropod
  dinosaurs from the Early Cretaceous of China, known from the Yixian and
  Jiufotang Formations roughly 125 to 120 million years ago. It groups
  Caudipteryx with close relatives such as Similicaudipteryx, forms that sit
  near the base of the oviraptorosaur radiation. A distinguishing trait of the
  group is a unique dagger-shaped pygostyle, the fused bone at the tip of the
  tail that in birds anchors a fan of feathers. For a time the family held only
  a single genus and was regarded as redundant, until further members were
  recognized. Its standing as a natural group remains debated, with some
  analyses recovering it as a clade and others treating its members as a
  paraphyletic grade of basal oviraptorosaurs.
type_genus: Caudipteryx
erected_in: zhou2000b
diagnostic_features:
  - Small anterior premaxillary and maxillary teeth, absent posteriorly
  - Elongate hindlimb with a cursorial, gracile build
  - Short forelimb bearing remiges and a rectricial fan of pennaceous feathers
  - Gastrolith clusters preserved in the abdominal region
synonyms:
  - name: Caudipteridae
    type: emended spelling
    reason: Original spelling of the family, erected by Zhou and Wang (2000)
      and emended to Caudipterygidae by Osmólska et al. (2004).
dispute:
  summary: >
    The status of Caudipterygidae as a natural clade is debated. Dedicated
    oviraptorosaur analyses recover it as monophyletic: Lamanna et al. (2014) for
    Caudipteryx and Similicaudipteryx, and Qiu et al. (2019) adding
    Xingtianosaurus, though the latter found the family supported by a single
    character with the three genera in an unresolved polytomy. Larger maniraptoran
    matrices (Hartman et al., 2019) and the Princeton Encyclopedia (Jones, 2026)
    instead treat these taxa as a paraphyletic grade of basal oviraptorosaurs.
  history:
    - date: "2026-07-01"
      note: >
        Retained as a family following the dedicated oviraptorosaur analyses
        (Lamanna et al., 2014; Funston et al., 2020); the clade-versus-grade
        question is unresolved.
    - date: "2026-07-28"
      note: Retained as a family following the dedicated oviraptorosaur analyses
        (Lamanna et al., 2014; Qiu et al., 2019); the clade-versus-grade question
        is unresolved.
references:
  - id: zhou2000b
    notes: Erected the family (as Caudipteridae) for Caudipteryx.
  - id: lamanna2014a
    notes: Oviraptorosaur phylogeny recovering Caudipterygidae as monophyletic in
      strict consensus, for Caudipteryx and Similicaudipteryx.
  - id: qiu2019a
    notes: Erected Xingtianosaurus as a caudipterid and recovered Caudipteridae as
      monophyletic on a single character, with Caudipteryx, Similicaudipteryx and
      Xingtianosaurus in a polytomy.
  - id: hartman2019a
    notes: Recovered Similicaudipteryx as the first-branching oviraptorosaur and
      described basal oviraptorosaurs as a grade of short-armed taxa including
      Caudipteryx.
  - id: jones2026c
    notes: Placement and assessment in the Princeton Encyclopedia of Dinosaurs.
