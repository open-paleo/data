clade: Troodontinae
description: >
  Troodontinae is the derived subfamily of troodontids, containing the largest
  and most encephalized members, including the type genus Troodon together with
  Saurornithoides, Zanabazar, Gobivenator, and their North American and Asian
  relatives. Members have deep, anteromedially deflected dentaries and reach the
  greatest body sizes in the family. The subfamily's membership varies between
  analyses.
type_genus: Troodon
erected_in: vanderreest2017a
diagnostic_features:
  - Anteromedially deflected dentary with a U-shaped symphysis
  - Enlarged denticles on the dentary teeth
  - Elongate ambiens process on the anterior margin of the iliopubic symphysis
  - Large body size relative to other troodontids
references:
  - id: vanderreest2017a
