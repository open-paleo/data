clade: Troodontinae
description: >
  Troodontinae is a subfamily of troodontid dinosaurs, comprising the more
  derived members of the family that lived across North America and Asia during
  the Cretaceous. It is defined as the least inclusive clade containing
  Saurornithoides mongoliensis and Troodon formosus, and unites genera such as
  Troodon, Saurornithoides, Zanabazar, Gobivenator, Stenonychosaurus,
  Latenivenatrix, Linhevenator, and Philovenator. Like other troodontids, these
  were small, bird-like maniraptorans with a retractable, sickle-clawed second
  toe and some of the largest brains known among dinosaurs, but troodontines
  include the biggest and most heavily encephalized members of the group. Their
  lower jaws are distinctively deep and deflected inward toward the midline,
  setting them apart from more primitive troodontids. The exact membership of
  the subfamily varies between phylogenetic analyses.
type_genus: Troodon
erected_in: gilmore1924a
described_in: vanderreest2017a
diagnostic_features:
  - Anteromedially deflected dentary with a U-shaped symphysis
  - Enlarged denticles on the dentary teeth
  - Elongate ambiens process on the anterior margin of the iliopubic symphysis
  - Large body size relative to other troodontids
references:
  - id: gilmore1924a
    notes: Origin of the family-group name (Troodontidae), and by coordination
      the subfamily Troodontinae.
  - id: vanderreest2017a
    notes: First proposed the name at subfamily rank and supplied its diagnosis
      and phylogenetic definition.
