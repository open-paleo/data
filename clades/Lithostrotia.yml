diagnostic_features:
  - Strongly procoelous anterior and middle caudal vertebrae with prominent
    distal condyles
  - Osteoderms present in many members
  - Sharply angled, anterolaterally directed preacetabular process of the ilium
  - Six sacral vertebrae
references:
  - id: upchurch2004a
    notes: Erected Lithostrotia for the osteoderm-bearing derived titanosaurs.
  - id: carballido2022a
    notes: Reviewed Lithostrotia, whose content ranges from nearly all
      titanosaurs to a small group depending on where Malawisaurus falls, noting
      after Gorscak (2016) that Malawisaurus may be a chimera.
  - id: gorscak2016a
    notes: Found that the Malawi material referred to Malawisaurus represents at
      least two distinct morphs.
