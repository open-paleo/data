clade: Lithostrotia
description: >
  Lithostrotia is a clade of derived titanosaur sauropods that lived through the
  Early and Late Cretaceous, encompassing much of the group's diversity from
  Malawisaurus through the more derived saltasauroids and colossosaurians. Its
  name means "inlaid with stones," referring to the bony osteoderms preserved in
  many of its members, though those osteoderms are not actually diagnostic of
  the clade: they appear sporadically inside and outside it and may have evolved
  more than once. The trait that truly sets it apart is its tail, with caudal
  vertebrae whose front faces are strongly concave, so that they socketed
  together, except for the most distal ones. The clade excludes more basal
  titanosaurs such as Andesaurus, Argentinosaurus, and Phuwiangosaurus, which
  retain flatter or only weakly hollowed tail vertebrae. Its boundaries remain
  unsettled, because the anchoring genus Malawisaurus may be a mix of unrelated
  remains, and different analyses have recovered Lithostrotia as anything from a
  small group to one taking in nearly all titanosaurs.
erected_in: upchurch2004a
diagnostic_features:
  - Strongly procoelous anterior and middle caudal vertebrae with prominent
    distal condyles
  - Osteoderms present in many members
  - Sharply angled, anterolaterally directed preacetabular process of the ilium
  - Six sacral vertebrae
references:
  - id: upchurch2004a
    notes: Erected Lithostrotia for the osteoderm-bearing derived titanosaurs.
