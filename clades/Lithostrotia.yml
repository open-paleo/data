clade: Lithostrotia
description: >
  Lithostrotia is a clade of derived titanosaurs comprising Malawisaurus, the
  more derived saltasauroids and colossosaurians, and all descendants of their
  most recent common ancestor. Named for the bony osteoderms borne by many of
  its members (Greek lithostrotos, "inlaid with stones"), the clade captures the
  bulk of Cretaceous titanosaur diversity and is diagnosed largely by strongly
  procoelous caudal vertebrae. It excludes a grade of more basal titanosaurs
  such as Andesaurus and Argentinosaurus that retain amphiplatyan or only weakly
  procoelous anterior caudals.
erected_in: upchurch2004
diagnostic_features:
  - Strongly procoelous anterior and middle caudal vertebrae with prominent
    distal condyles
  - Osteoderms present in many members
  - Sharply angled, anterolaterally directed preacetabular process of the ilium
  - Six sacral vertebrae
references:
  - id: upchurch2004
    authors: Upchurch, P.; Barrett, P. M.; Dodson, P.
    year: 2004
    title: Sauropoda
    book: The Dinosauria, 2nd edition
    publisher: University of California Press
    pages: 259-322
    notes: Erected Lithostrotia for the osteoderm-bearing derived titanosaurs.
