clade: Ankylosauria
description: >
  Ankylosauria is a clade of herbivorous ornithischian dinosaurs that includes
  the great majority of the armored dinosaurs, whose bodies were sheathed in
  bony osteoderms much like a turtle's shell. Its members were bulky, low-slung
  quadrupeds carried on short, powerful limbs. The group first appeared in North
  Africa during the Middle Jurassic and persisted until the end of the Late
  Cretaceous. It was traditionally split into the Nodosauridae and the
  Ankylosauridae, a dichotomy that Raven and colleagues (2023) do not recover.
  The basal Parankylosauria, known from the latest Cretaceous of southern
  Gondwana, split from all other ankylosaurs before about 167 million years ago
  (Soto-Acuña and colleagues, 2021). Together with the plated and spiked
  stegosaurs, ankylosaurs make up the Thyreophora, the armored branch of
  ornithischians distinct from the ornithopods and marginocephalians.
type_genus: Ankylosaurus
erected_in: osborn1923b
described_in: madzia2021a
diagnostic_features:
  - Extensive dermal armor covering the dorsal surface and flanks
  - Low, wide body plan with short, robust limbs
  - Fused osteoderms on the skull forming a solid cranial shield
  - Tail club present in Ankylosauridae (modified distal caudal vertebrae and
    osteoderms)
  - Laterally projecting cervical or shoulder spines in many taxa
  - Secondary palate present
references:
  - id: osborn1923b
    notes: Used the name Ankylosauria, as 'the armored suborder Ankylosauria',
      in describing Psittacosaurus; Madzia and colleagues (2021) credit the name
      to this paper.
  - id: madzia2021a
    notes: Defined Ankylosauria as the largest clade containing Ankylosaurus
      magniventris but not Stegosaurus stenops.
  - id: raven2023a
    notes: Comprehensive recent phylogeny of the armored dinosaurs.
  - id: soto-acuña2021a
    notes: Named Parankylosauria for Stegouros and its Gondwanan relatives,
      inferring an origin before the earliest euankylosaurs some 167 million
      years ago.
