clade: Ankylosauria
description: >
  Ankylosauria is a clade of herbivorous ornithischian dinosaurs that includes
  the great majority of the armored dinosaurs, whose bodies were sheathed in
  bony osteoderms much like a turtle's shell. Its members were bulky, low-slung
  quadrupeds carried on short, powerful limbs. The group first appeared in North
  Africa during the Middle Jurassic and persisted until the end of the Late
  Cretaceous. It is traditionally split into two main Northern Hemisphere
  families, the Nodosauridae and the Ankylosauridae, while the more basal
  Parankylosauria arose in southern Gondwana during the Cretaceous. Together
  with the plated and spiked stegosaurs, ankylosaurs make up the Thyreophora,
  the armored branch of ornithischians distinct from the ornithopods and
  marginocephalians.
type_genus: Ankylosaurus
erected_in: osborn1923b
described_in: raven2023a
diagnostic_features:
  - Extensive dermal armor covering the dorsal surface and flanks
  - Low, wide body plan with short, robust limbs
  - Fused osteoderms on the skull forming a solid cranial shield
  - Tail club present in Ankylosauridae (modified distal caudal vertebrae and
    osteoderms)
  - Laterally projecting cervical or shoulder spines in many taxa
  - Secondary palate present
references:
  - id: osborn1923b
    notes: Erected the clade Ankylosauria.
  - id: raven2023a
    notes: Comprehensive recent phylogeny of the armored dinosaurs.
