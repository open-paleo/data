clade: Rebbachisauridae
description: >
  Rebbachisauridae is a family of diplodocoid sauropods known mainly from the
  Cretaceous of Gondwana, with records in Europe and possibly North America.
  Rebbachisaurids retained relatively broad, squared muzzles bearing batteries
  of replacement teeth and are characterized by the loss of the
  hyposphene-hypantrum accessory articulations and by distinctive, often
  high-spined dorsal and sacral vertebrae. The family is defined as the
  stem-based clade of all diplodocoids more closely related to Rebbachisaurus
  than to Diplodocus (Salgado et al., 2004).
type_genus: Rebbachisaurus
erected_in: bonaparte1997a
described_in: salgado2004a
diagnostic_features:
  - Loss of the hyposphene-hypantrum accessory articulations in the anterior
    caudal vertebrae (retained in the basalmost members).
  - Spinodiapophyseal lamina present and often festooned on the dorsal neural
    spines.
  - Middle caudal centra nearly cylindrical with a flattened ventral margin.
  - Scapular acromion expanded, with a racquet-shaped distal scapular blade in
    many taxa.
references:
  - id: bonaparte1997a
    notes: Nomenclatural note credited as the authority for Rebbachisauridae.
  - id: salgado2004a
    notes: Applied the stem-based definition of Rebbachisauridae and named
      Limaysaurus.
