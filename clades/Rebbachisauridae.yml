clade: Rebbachisauridae
description: >
  Rebbachisauridae is a family of diplodocoid sauropods known from fragmentary
  remains from the Cretaceous of Gondwana and beyond, with records in South
  America, Africa, Europe, and possibly North America and Central Asia. They
  include such genera as Nigersaurus and Limaysaurus, and are grouped into
  subfamilies, chiefly the Limaysaurinae and the Rebbachisaurinae, both nested
  within the clade Khebbashia. Though firmly placed within the superfamily
  Diplodocoidea, rebbachisaurids lack the divided (bifid) cervical neural spines
  of the diplodocids and dicraeosaurids and are regarded as more primitive than
  those groups. They are set apart from other sauropods by their distinctive
  teeth, which show low-angle internal wear facets and asymmetrical enamel, and
  some members such as Nigersaurus evolved dental batteries comparable to those
  of hadrosaurs and ceratopsians. Restricted to the early and middle part of the
  Late Cretaceous, they were the last surviving diplodocoids and lived alongside
  the titanosaurs until fairly late in the period.
type_genus: Rebbachisaurus
erected_in: bonaparte1997a
described_in: salgado2004a
diagnostic_features:
  - Loss of the hyposphene-hypantrum accessory articulations in the anterior
    caudal vertebrae (retained in the basalmost members).
  - Spinodiapophyseal lamina present and often festooned on the dorsal neural
    spines.
  - Middle caudal centra nearly cylindrical with a flattened ventral margin.
  - Scapular acromion expanded, with a racquet-shaped distal scapular blade in
    many taxa.
references:
  - id: bonaparte1997a
    notes: Nomenclatural note credited as the authority for Rebbachisauridae.
  - id: salgado2004a
    notes: Applied the stem-based definition of Rebbachisauridae and named
      Limaysaurus.
