clade: Chaoyangsauridae
description: >
  Chaoyangsauridae is a family of small, early-diverging ceratopsian dinosaurs
  from Asia (and possibly Europe, if the German genus Stenopelix belongs here).
  They are among the earliest known marginocephalians, with the oldest remains
  dating to roughly 160 million years ago in the Late Jurassic and others
  extending into the Early Cretaceous. Its members bore sharp beaks for snipping
  off leaves and only a very small frill, retaining many primitive features
  while already showing the rostral bone that characterizes ceratopsians. Han
  and colleagues (2015) recover Chaoyangsaurus, Xuanhuaceratops, Yinlong and
  Hualianceratops as a weakly supported clade, sister to Psittacosaurus, with
  that pair the sister group of the remaining neoceratopsians.
type_genus: Chaoyangsaurus
erected_in: zhao2006a
described_in: han2015a
diagnostic_features:
  - Semicircular process near the mandibular glenoid
  - Flat dorsal surface of the squamosal bearing a stalked quadrate process
  - Deep sulcus dividing the quadrate condyles
  - Laterally ridged angular
  - Reduced predentary
  - Rostrally converging dentary margins
synonyms:
  - name: Chaoyoungsauridae
    type: emended spelling
    reason: Family-group name made available by Zhao (1983) as the superfamily
      Chaoyoungosauroidea; cited as Chaoyoungsauridae and modified to
      Chaoyangsauridae by Zhao and colleagues (2006).
references:
  - id: zhao2006a
    notes: Described Xuanhuaceratops and proposed Chaoyangsauridae, modified from
      a name of Zhao (1983), as all taxa closer to Chaoyangsaurus youngi than to
      Triceratops or Psittacosaurus.
  - id: han2015a
    notes: Revised diagnosis of Chaoyangsauridae; recovered as monophyletic
      outside Neoceratopsia.
  - id: zhao1983a
    notes: >
      Erects the superfamily Chaoyoungosauroidea for Chaoyangsaurus, the name
      Zhao and colleagues (2006) modify into Chaoyangsauridae.
