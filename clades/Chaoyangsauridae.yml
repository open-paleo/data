clade: Chaoyangsauridae
description: >
  Chaoyangsauridae is a family of small, early-diverging ceratopsian dinosaurs
  from Asia (and possibly Europe, if the German genus Stenopelix belongs here).
  They are among the earliest known marginocephalians, with the oldest remains
  dating to roughly 160 million years ago in the Late Jurassic and others
  extending into the Early Cretaceous. Its members bore sharp beaks for snipping
  off leaves and only a very small frill, retaining many primitive features
  while already showing the rostral bone that characterizes ceratopsians. The
  family is usually taken to comprise Chaoyangsaurus, Xuanhuaceratops, Yinlong,
  and Hualianceratops, and lies outside the more advanced Neoceratopsia.
type_genus: Chaoyangsaurus
erected_in: zhao2006a
described_in: han2015a
diagnostic_features:
  - Semicircular process near the mandibular glenoid
  - Flat dorsal surface of the squamosal bearing a stalked quadrate process
  - Deep sulcus dividing the quadrate condyles
  - Laterally ridged angular
  - Reduced predentary
  - Rostrally converging dentary margins
references:
  - id: zhao2006a
    notes: Described Xuanhuaceratops and proposed the family Chaoyangsauridae.
  - id: han2015a
    notes: Revised diagnosis of Chaoyangsauridae; recovered as monophyletic
      outside Neoceratopsia.
