clade: Chaoyangsauridae
description: >
  Chaoyangsauridae is a clade of small, early-diverging ceratopsians from the Late
  Jurassic and Early Cretaceous of Asia (and, if Stenopelix belongs here, Europe),
  comprising Chaoyangsaurus, Xuanhuaceratops, Yinlong, and Hualianceratops. They
  are among the most basal known ceratopsians, lying outside Neoceratopsia, and
  retain many primitive marginocephalian features alongside the diagnostic
  ceratopsian rostral bone.
type_genus: Chaoyangsaurus
erected_in: zhao2006
described_in: han2015
diagnostic_features:
  - Small body size with a proportionally large head
  - Primitive, low rostral bone
  - Retention of premaxillary teeth
  - Short, incipient parietosquamosal shelf without a true frill
