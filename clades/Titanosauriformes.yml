clade: Titanosauriformes
description: >
  Titanosauriformes is a clade of macronarian sauropods defined as the least
  inclusive group containing Brachiosaurus and Saltasaurus, and comprising the
  two sister lineages Brachiosauridae and Somphospondyli. The clade originated
  in the Late Jurassic and persisted to the end of the Cretaceous, achieving a
  global distribution and including the largest known terrestrial animals.
  Titanosauriforms are united by features of the vertebrae and limb girdles,
  many fragmentary basal members being assignable no more precisely than to this
  node.
erected_in: salgado1997a
diagnostic_features:
  - Camellate (somphospondylous) internal tissue in the presacral vertebrae
  - Anterior caudal vertebrae with the neural arch placed on the anterior half
    of the centrum
  - Biconvex or procoelous distalmost caudal vertebrae in many members
  - Reduced olecranon process of the ulna
  - Femur with a prominent lateral bulge below the greater trochanter
references:
  - id: salgado1997a
