clade: Titanosauriformes
description: >
  Titanosauriformes is a clade of macronarian sauropods defined as the least
  inclusive group containing Brachiosaurus and Saltasaurus, comprising the two
  sister lineages Brachiosauridae and Somphospondyli. The clade is known from
  the fossil record beginning in the Late Jurassic and persisted to the end of
  the Cretaceous, achieving a global distribution across most continents.
  Titanosauriforms include some of the largest known terrestrial animals, among
  them the giant titanosaurs of the Late Cretaceous.
erected_in: salgado1997a
diagnostic_features:
  - Camellate (somphospondylous) internal tissue in the presacral vertebrae
  - Anterior caudal vertebrae with the neural arch placed on the anterior half
    of the centrum
  - Biconvex or procoelous distalmost caudal vertebrae in many members
  - Reduced olecranon process of the ulna
  - Femur with a prominent lateral bulge below the greater trochanter
