clade: Iguanodontia
description: >
  Iguanodontia is the major clade of derived ornithopod dinosaurs containing the
  rhabdodontomorphs, dryomorphs, and the lineage leading to the duck-billed
  hadrosaurids, together with (in recent analyses) the Gondwanan Elasmaria. Its
  members range from small cursorial forms to the giant iguanodonts and
  hadrosaurs, and are united by dental and pedal specializations for bulk
  herbivory. Iguanodontians were among the most abundant and widespread plant
  eaters of the Cretaceous.
erected_in: baur1891a
described_in: madzia2021a
diagnostic_features:
  - Loss of the primitive ornithopod first premaxillary tooth
  - Reduced or absent antorbital and surangular foramina
  - Femoral fourth trochanter pendant in form
  - Wide, ventrally flattened pedal unguals approaching a hoof-like form
references:
  - id: baur1891a
    notes: Named Iguanodontia.
  - id: madzia2021a
    notes: Provides the modern phylogenetic definition of Iguanodontia.
