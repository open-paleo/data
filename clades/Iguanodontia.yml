clade: Iguanodontia
description: >
  Iguanodontia is a major clade of derived ornithopod dinosaurs that includes
  the lineage leading up to the duck-billed hadrosaurs. While the most primitive
  ornithopods were small bipeds, advanced iguanodontians became quadrupedal and
  grew to large body size, so the group spans everything from modest cursorial
  forms to some of the largest plant eaters of their era. Members were
  traditionally lumped into a superfamily and family of "iguanodontids," but
  phylogenetic studies have shown that assemblage to be a paraphyletic grade
  rather than a natural cluster of close relatives. Larger, more derived
  iguanodontians were bulk feeders, able to subsist on tough, low-nutrition
  vegetation thanks to a long gut passage time and an increasingly sophisticated
  chewing apparatus. They were among the most successful and widespread
  herbivores of the Cretaceous.
erected_in: baur1891a
described_in: madzia2021a
diagnostic_features:
  - Loss of the primitive ornithopod first premaxillary tooth
  - Reduced or absent antorbital and surangular foramina
  - Femoral fourth trochanter pendant in form
  - Wide, ventrally flattened pedal unguals approaching a hoof-like form
references:
  - id: baur1891a
    notes: Named Iguanodontia.
  - id: madzia2021a
    notes: Provides the modern phylogenetic definition of Iguanodontia.
