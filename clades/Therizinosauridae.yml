  - id: zanno2009a
    notes: Gave the node-based definition of Therizinosauridae, with Nothronychus as an internal specifier.
  - id: kobayashi2025a
    notes: Followed the stem-based definition of Kobayashi and colleagues (2022).
  - id: liao2026a
    notes: Followed the definition of Zanno (2010).
  - id: pu2013a
    notes: Recovered the derived therizinosaurs, with the intermediate genera, as one unresolved Therizinosauridae.
  - id: sues2016a
    notes: Recovered the derived therizinosaurs, with the intermediate genera, as one unresolved Therizinosauridae.
