clade: Therizinosauridae
description: >
  Therizinosauridae is the family of large-bodied, derived therizinosaurs known
  from the Cretaceous of Asia and North America. Herbivorous despite their
  theropod ancestry, therizinosaurids possess a suite of unusual adaptations
  including enormously elongated manual unguals (up to a meter long in
  Therizinosaurus), a wide, barrel-shaped torso housing an enlarged gut, a small
  skull with an edentulous, keratin-sheathed premaxilla and leaf-shaped cheek
  teeth, an opisthopubic pelvis, and a broad, functionally tetradactyl foot. The
  family's boundary is drawn differently by different workers: a narrow
  node-based definition anchored on Nothronychus, Segnosaurus, Erlikosaurus and
  Therizinosaurus (Zanno, 2010) excludes several intermediate genera, whereas a
  broader stem-based definition anchored on Therizinosaurus but not Alxasaurus
  (Kobayashi et al., 2022, 2025) draws them in.
type_genus: Therizinosaurus
erected_in: maleev1954a
described_in: zanno2010a
diagnostic_features:
  - Enormously elongated manual unguals, especially on digit I
  - Wide, barrel-shaped torso accommodating an enlarged herbivorous gut
  - Small skull with an edentulous premaxilla and leaf-shaped cheek teeth
  - Opisthopubic (posteriorly directed) pubis
  - Broad, functionally tetradactyl pes with a weight-bearing first digit
references:
