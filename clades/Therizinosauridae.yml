clade: Therizinosauridae
description: >
  Therizinosauridae is a family of large, derived therizinosaur dinosaurs known
  mainly from the Late Cretaceous of Asia and North America, though footprints
  and isolated remains suggest the group ranged across much of the Laurasian
  supercontinent, reaching Europe and Africa. As of 2025 it comprises roughly
  nine well-supported genera, among them Segnosaurus, Erlikosaurus,
  Nothronychus, and the giant Therizinosaurus, whose elongated hand claws
  reached about a meter long, the largest of any known land animal. Despite
  their theropod ancestry these were herbivores that converged on a body plan
  resembling that of ground sloths: a wide, rounded belly carried on a broad
  pelvis, stout four-toed feet with a weight-bearing first digit, a long neck,
  and a small skull tipped with a keratinous beak and leaf-shaped teeth unlike
  those of other theropods. Their pelvis was unusually opisthopubic, with the
  pubis directed backward as in birds and ornithischians, and a nearly avian
  inner ear gave them acute hearing and balance. They nested in colonies, laying
  clutches of eggs, and are widely regarded as the theropods most specialized
  for plant eating.
type_genus: Therizinosaurus
erected_in: maleev1954a
described_in: zanno2009a
diagnostic_features:
  - Enormously elongated manual unguals, especially on digit I
  - Wide, barrel-shaped torso accommodating an enlarged herbivorous gut
  - Small skull with an edentulous premaxilla and leaf-shaped cheek teeth
  - Opisthopubic (posteriorly directed) pubis
  - Broad, functionally tetradactyl pes with a weight-bearing first digit
dispute:
  summary: >
    Which genera Therizinosauridae holds depends on its definition. Zanno
    and colleagues (2009) define it as the least inclusive clade containing
    Nothronychus, Segnosaurus, Erlikosaurus and Therizinosaurus, a
    definition Zanno (2010) and Liao and colleagues (2026) follow; under it
    Erliansaurus, Neimongosaurus and Enigmosaurus fall outside the family.
    Kobayashi and colleagues (2022) redefine it as the most inclusive clade
    containing Therizinosaurus but not Alxasaurus, citing the poor
    resolution among derived therizinosaurs; that definition draws all three
    in, and Kobayashi and colleagues (2025) follow it. Analyses that leave
    the derived therizinosaurs unresolved place some or all of these genera
    inside even the narrower clade (Pu and colleagues, 2013; Sues and
    Averianov, 2016).
references:
