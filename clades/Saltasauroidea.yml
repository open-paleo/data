clade: Saltasauroidea
description: >
  Saltasauroidea is a stem-based clade of derived titanosaurs defined as all taxa
  closer to Saltasaurus than to Patagotitan. It is the sister branch of
  Colossosauria within Eutitanosauria in the framework of Carballido et al.
  (2022), having been named by França et al. (2016). Saltasauroidea unites the
  heavily armored, often dwarfed Saltasauridae with a range of other derived
  titanosaurs (including the nemegtosaurids and the European lirainosaurines in
  some analyses), and accounts for much of the terminal-Cretaceous titanosaur
  diversity of Gondwana and Laurasia.
erected_in: frança2016a
described_in: carballido2022a
type_genus: Saltasaurus
diagnostic_features:
  - Strongly procoelous caudal vertebrae throughout the tail
  - Osteoderms present in many members
  - Posterior dorsal vertebrae with well-developed lateral pneumatic foramina
  - Reduced and block-like carpus and manus
references:
  - id: frança2016a
    notes: Introduced the name Saltasauroidea.
  - id: carballido2022a
    notes: Recovered Saltasauroidea as the Saltasaurus-line stem of
      Eutitanosauria.
