clade: Saltasauroidea
description: >
  Saltasauroidea is a superfamily of titanosaurian sauropod dinosaurs, defined
  as all taxa closer to Saltasaurus than to Patagotitan. This definition splits
  the derived titanosaur group Eutitanosauria roughly in half, making
  Saltasauroidea the sister branch to the inversely defined Colossosauria. As
  originally proposed the clade united the aeolosaurins and the heavily armored,
  often dwarfed saltasaurids, along with intermediate genera such as Baurutitan,
  Diamantinasaurus, and Isisaurus. Later analyses placed the long-skulled
  Nemegtosauridae alongside Saltasauridae within the group while excluding the
  aeolosaurins. Its members account for much of the terminal-Cretaceous
  titanosaur diversity across both Gondwana and Laurasia.
erected_in: powell1992a
described_in: carballido2022a
type_genus: Saltasaurus
diagnostic_features:
  - Strongly procoelous caudal vertebrae throughout the tail
  - Osteoderms present in many members
  - Posterior dorsal vertebrae with well-developed lateral pneumatic foramina
  - Reduced and block-like carpus and manus
references:
  - id: powell1992a
    notes: Origin of the family-group name (Saltasaurinae), and by coordination
      the superfamily Saltasauroidea.
  - id: frança2016a
    notes: Introduced the name Saltasauroidea and its branch-based definition.
  - id: carballido2022a
    notes: Recovered Saltasauroidea as the Saltasaurus-line stem of
      Eutitanosauria.
