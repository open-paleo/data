clade: Troodontidae
description: >
  Troodontidae is a family of small, bird-like maniraptoran theropod dinosaurs
  known from the Jurassic and Cretaceous of North America, Asia, and Europe.
  Troodontids possessed among the largest brain-to-body-size ratios of non-avian
  dinosaurs, large forward-facing eyes, long slender legs, and closely packed
  teeth. The family includes the basal Sinovenatorinae, the Jinfengopteryginae,
  and the derived Troodontinae, and is one of the closest relatives of birds.
type_genus: Troodon
erected_in: gilmore1924a
diagnostic_features:
  - Numerous, closely packed teeth with large denticles on the distal carina
  - Large, forward-facing orbits with well-developed binocular vision
  - Enlarged braincase with a high encephalization quotient
  - Slender, subarctometatarsalian metatarsus with an asymmetric metatarsal IV trochlea
  - Retractable pedal ungual II smaller than in dromaeosaurids
