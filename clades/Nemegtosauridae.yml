erected_in: upchurch1995a
described_in: wilson2005a
type_genus: Nemegtosaurus
diagnostic_features:
  - Low, elongate skull with a long preorbital region
  - Slender, peg-like teeth concentrated at the front of the jaws
  - Posteriorly retracted external nares
  - Frontals excluded from the margin of the supratemporal fenestra
dispute:
  summary: >
    The monophyly and content of Nemegtosauridae are contested. Wilson (2005)
    refers Nemegtosaurus and Quaesitosaurus to Nemegtosauridae, a clade of
    derived titanosaurs, but most trees in the reanalysis of Wilson and
    colleagues (2016) break up the family, and Nemegtosaurus has been speculated
    to be the skull of the otherwise-headless Opisthocoelicaudia, a hypothesis
    Wilson (2005) considers untestable until associated skull and body material
    is found. The family is placed within Saltasauroidea, following Wilson's
    (2002) recovery of a clade uniting Nemegtosauridae and Saltasauridae among
    derived titanosaurs, with its monophyly flagged as unresolved.
references:
  - id: upchurch1995a
    notes: Erected Nemegtosauridae.
  - id: wilson2002a
    notes: Recovered Nemegtosauridae (Nemegtosaurus and Rapetosaurus) in a clade
      with Saltasauridae within Titanosauria.
  - id: wilson2005a
    notes: Redescribed Nemegtosaurus and defended its placement in Nemegtosauridae
      among derived titanosaurs.
  - id: zaher2011a
    notes: Described Tapuiasaurus and recovered it in Nemegtosauridae, closer to
      Rapetosaurus than to Nemegtosaurus.
  - id: wilson2016a
    notes: Restudied the skull of Tapuiasaurus as a basal titanosaur; with it
      rescored and new Isisaurus data added, the original matrix no longer
      recovers the three nemegtosaurids together.
