clade: Nemegtosauridae
description: >
  Nemegtosauridae is a family of derived titanosaurs erected by Upchurch (1995)
  for Nemegtosaurus and given a modern phylogenetic treatment by Wilson (2005)
  following his redescription of the Nemegtosaurus skull. Long known mainly from
  cranial material, its core members — Nemegtosaurus and Quaesitosaurus of the
  Late Cretaceous of Mongolia — possess elongate, low skulls with slender,
  pencil-like teeth restricted to the front of the jaws, a morphology once
  thought diplodocoid but now recognized as titanosaurian.
erected_in: upchurch1995a
described_in: wilson2005a
type_genus: Nemegtosaurus
diagnostic_features:
  - Low, elongate skull with a long preorbital region
  - Slender, peg-like teeth concentrated at the front of the jaws
  - Posteriorly retracted external nares
  - Frontals excluded from the margin of the supratemporal fenestra
dispute:
  summary: >
    The monophyly and content of Nemegtosauridae are contested. Wilson (2005)
    recovered Nemegtosaurus and Quaesitosaurus as a clade of derived titanosaurs,
    but several subsequent analyses fail to recover the family or place its
    members separately within Saltasauroidea, and some workers have suggested
    that Nemegtosaurus is the skull of the otherwise-headless Opisthocoelicaudia.
    The family is retained here within Saltasauroidea following Wilson (2005),
    with its monophyly flagged as unresolved.
  history:
    - date: "2026-06-30"
      note: >
        Retained within Saltasauroidea following Wilson (2005); the unresolved
        monophyly and the proposed Nemegtosaurus / Opisthocoelicaudia synonymy
        are noted and remain unresolved.
references:
  - id: upchurch1995a
    notes: Erected Nemegtosauridae.
  - id: wilson2005a
    notes: Redescribed Nemegtosaurus and recovered Nemegtosauridae among derived
      titanosaurs.
