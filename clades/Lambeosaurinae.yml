clade: Lambeosaurinae
description: >
  Lambeosaurinae is a group of crested hadrosaurid dinosaurs that includes
  Lambeosaurus, Corythosaurus, Hypacrosaurus, Parasaurolophus, Tsintaosaurus,
  Olorotitan, and the European and North African genera Arenysaurus and Ajnabia.
  Its members are set apart by elaborate hollow cranial crests that enclose
  looping extensions of the nasal passages, inferred to have functioned in
  vocalization and visual display. The group originated in Laurasia during the
  Late Cretaceous and was initially found across Europe and Asia. Around the
  Campanian, one lineage colonized western North America via Beringia and spread
  south to Mexico, radiating into a diverse array of body plans, while other
  members reached the Late Cretaceous islands of Europe and later crossed into
  northern Africa. Its internal classification into tribes such as Aralosaurini,
  Tsintaosaurini, Parasaurolophini, Lambeosaurini, and the sometimes-recognized
  Arenysaurini remains unsettled.
type_genus: Lambeosaurus
erected_in: parks1923a
described_in: madzia2021a
diagnostic_features:
  - Hollow, crest-bearing nasal passages enclosed within an enlarged supracranial
    crest
  - Marked dorsal expansion and posterodorsal rotation of the premaxillae and
    nasals over the skull roof
  - Truncated, downturned rostrum with a deep premaxillary bill
  - Tall neural spines producing a deep tail and trunk
references:
  - id: parks1923a
    notes: Named Lambeosaurinae.
  - id: madzia2021a
    notes: Provides the modern phylogenetic definition of Lambeosaurinae.
