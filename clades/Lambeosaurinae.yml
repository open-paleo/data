clade: Lambeosaurinae
description: >
  Lambeosaurinae is the hollow-crested subfamily of hadrosaurid dinosaurs,
  including Lambeosaurus, Corythosaurus, Hypacrosaurus, Parasaurolophus,
  Tsintaosaurus, and the European and North African Arenysaurus and Ajnabia. Its
  members are distinguished by elaborate hollow cranial crests housing convoluted
  extensions of the nasal passages, inferred to have functioned in vocalization
  and visual display. The subfamily radiated across Asia, North America, and the
  Late Cretaceous islands of Europe and reached North Africa, and its internal
  tribal classification (variously Aralosaurini, Tsintaosaurini, Parasaurolophini,
  Lambeosaurini, and Arenysaurini) remains unsettled.
type_genus: Lambeosaurus
erected_in: parks1923
described_in: madzia2021
diagnostic_features:
  - Hollow, crest-bearing nasal passages enclosed within an enlarged supracranial
    crest
  - Marked dorsal expansion and posterodorsal rotation of the premaxillae and
    nasals over the skull roof
  - Truncated, downturned rostrum with a deep premaxillary bill
  - Tall neural spines producing a deep tail and trunk
