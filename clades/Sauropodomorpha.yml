clade: Sauropodomorpha
description: >
  Sauropodomorpha is a clade of saurischian dinosaurs that includes the
  long-necked, herbivorous sauropods together with their earlier relatives, the
  basal forms traditionally grouped as "prosauropods." The clade first appeared
  among the earliest dinosaurs in the Late Triassic, around 230 million years
  ago, and persisted until the end-Cretaceous extinction. Its earliest members
  were small bipeds that were omnivorous or even carnivorous, but over time the
  group shifted toward plant-eating, larger body size, and, in the true
  sauropods, quadrupedal locomotion. The sauropods became the dominant
  terrestrial herbivores through much of the Mesozoic and include the largest
  animals ever to walk on land. Their remains have been found on every
  continent, including Antarctica.
erected_in: huene1932a
described_in: sereno2007a
diagnostic_features:
  - Elongated neck with ten or more cervical vertebrae
  - Small skull relative to body size
  - Leaf-shaped or spatulate teeth adapted for herbivory
  - Enlarged external nares
  - Large pollex (thumb) claw on manus digit I
  - Evolutionary trend toward increasing body size
references:
  - id: huene1932a
    notes: Named Sauropodomorpha for the prosauropods together with the
      sauropods, which form their direct continuation (p. 18); the name first
      appears on p. 4.
  - id: sereno2007a
    notes: Defined Sauropodomorpha as the most inclusive clade containing
      Saltasaurus loricatus but not Passer domesticus or Triceratops horridus.
