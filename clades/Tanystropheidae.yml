clade: Tanystropheidae
description: >
  Tanystropheidae is a family of non-archosauriform archosauromorphs from the
  Triassic period, characterized by an extremely elongated neck composed of
  elongate cervical vertebrae with extensive cervical ribs. Members ranged from
  small insectivores to large piscivores. The family was widespread during the
  Triassic, with fossils found in Europe, Asia, the Middle East, and North
  America.
