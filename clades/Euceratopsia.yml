clade: Euceratopsia
description: >
  Euceratopsia is the clade comprising Leptoceratopsidae and Coronosauria and
  their most recent common ancestor — the smallest clade containing Leptoceratops,
  Protoceratops, and Triceratops. It groups the more derived neoceratopsians,
  excluding the basal neoceratopsian grade, and was named to provide a stable name
  for this consistently recovered node.
erected_in: madzia2021
diagnostic_features:
  - Deep, robust dentary with a high coronoid process
  - Strongly developed parietosquamosal frill relative to basal neoceratopsians
  - Enlarged, mediolaterally compressed predentary
references:
  - id: madzia2021
    authors: Madzia, D.; Arbour, V. M.; Boyd, C. A.; Farke, A. A.;
      Cruzado-Caballero, P.; Evans, D. C.
    year: 2021
    title: The phylogenetic nomenclature of ornithischian dinosaurs
    journal: PeerJ
    volume: "9"
    pages: e12362
    doi: 10.7717/peerj.12362
    url: http://dx.doi.org/10.7717/peerj.12362
    notes: Erected Euceratopsia as the smallest clade containing Leptoceratops,
