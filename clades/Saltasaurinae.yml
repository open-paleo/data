clade: Saltasaurinae
rank: subfamily
erected_in: powell1992a
described_in: wilson2003b
type_genus: Saltasaurus
diagnostic_features:
  - Dermal armor of large keeled osteoderms set among numerous small ossicles
  - Strongly procoelous caudal vertebrae with anteriorly displaced neural arches
  - Posterior dorsal vertebrae with reduced, posteriorly inclined neural spines
  - Small body size
references:
  - id: powell1992a
    notes: Named the subfamily Saltasaurinae as new.
  - id: wilson2003b
    notes: Defined Saltasaurinae as all saltasaurids closer to Saltasaurus
      loricatus than to Opisthocoelicaudia skarzynskii, crediting the name to
      Bonaparte and Powell (1980).
  - id: bonaparte1980a
    notes: Credited with the name Saltasaurinae by Wilson and Upchurch (2003).
