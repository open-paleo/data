clade: Saltasaurinae
description: >
  Saltasaurinae is a subfamily of saltasaurid titanosaurs erected by Powell
  (1992) for Saltasaurus and recovered with a modern content by Wilson and
  Upchurch (2003). Its members — Saltasaurus, Neuquensaurus, Rocasaurus and
  relatives — are small, heavily armored titanosaurs of the Late Cretaceous of
  South America, bearing a dense pavement of osteoderms and small bony ossicles
  in the skin. They include some of the smallest of all sauropods.
erected_in: powell1992
described_in: wilson2003b
type_genus: Saltasaurus
diagnostic_features:
  - Dermal armor of large keeled osteoderms set among numerous small ossicles
  - Strongly procoelous caudal vertebrae with anteriorly displaced neural arches
  - Posterior dorsal vertebrae with reduced, posteriorly inclined neural spines
  - Small body size
