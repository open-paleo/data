clade: Saltasaurinae
description: >
  Saltasaurinae is a subfamily of titanosaurian sauropods from the Late
  Cretaceous, ranging from the early Campanian to the Maastrichtian, roughly 80
  to 66 million years ago. Its members are among the smallest of the sauropods,
  retaining the group's characteristic small head, long neck, four columnar
  limbs, and long tail while spanning from forms only about 5.7 meters long to
  the larger Neuquensaurus at around 15 meters. The core South American genera
  include Neuquensaurus, Saltasaurus, Rocasaurus, and Bonatitan, with additional
  members such as Ibirania and outliers like Jainosaurus of India and
  Abditosaurus of Europe extending the group beyond its South American
  heartland. Saltasaurines are the only sauropods in which nearly every species
  is known to bear body armor, a dense covering of large keeled osteoderms set
  among numerous small bony ossicles that likely evolved as defense against
  predatory theropods such as Abelisaurus and Carnotaurus. They also share
  strongly procoelous tail vertebrae and reduced dorsal neural spines, and they
  include the tribe Saltasaurini, which groups the type genus with its closest
  relatives.
erected_in: powell1992a
described_in: wilson2003b
type_genus: Saltasaurus
diagnostic_features:
  - Dermal armor of large keeled osteoderms set among numerous small ossicles
  - Strongly procoelous caudal vertebrae with anteriorly displaced neural arches
  - Posterior dorsal vertebrae with reduced, posteriorly inclined neural spines
  - Small body size
references:
