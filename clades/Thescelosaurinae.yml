clade: Thescelosaurinae
description: >
  Thescelosaurinae is one of the two subfamilies of Thescelosauridae, a group of
  small, plant-eating neornithischian dinosaurs from the Cretaceous of North
  America and East Asia. It unites Thescelosaurus and Parksosaurus, with
  Notohypsilophodon in the analysis of Madzia and colleagues (2021); other
  analyses add small Asian forms, among them Jeholosaurus and Changchunsaurus,
  previously classified in Jeholosauridae (Fonseca and colleagues, 2024), and
  the newly named Doolysaurus (Jung and colleagues, 2026), and it is recognized
  as the counterpart to the smaller, burrow-associated Orodrominae.
  Thescelosaurus, the largest known thescelosaurid, is notably robust and
  large-bodied, though several other thescelosaurine genera, including Haya,
  Changchunsaurus, and Doolysaurus, were much smaller. Like other
  thescelosaurids, they are thought to have been highly selective browsers that
  fed mainly on soft, pulpy plant material.
type_genus: Thescelosaurus
erected_in: sternberg1937a
described_in: madzia2021a
diagnostic_features:
  - Two supraorbital bones that remain unfused
  - Dorsally projecting, finger-like process on the surangular
  - Robust, comparatively large-bodied build relative to orodromines
  - Ilium with a sinuous dorsal margin in derived members
references:
  - id: sternberg1937a
    notes: Origin of the family-group name (Thescelosauridae), and by
      coordination the subfamily Thescelosaurinae.
  - id: sternberg1940c
    notes: Named Thescelosaurinae as a new subfamily.
  - id: madzia2021a
    notes: Provides the modern phylogenetic definition of Thescelosaurinae.
  - id: fonseca2024a
    notes: Recovered Jeholosaurus and Changchunsaurus within Thescelosaurinae,
      rendering Jeholosauridae inapplicable.
  - id: jung2026a
    notes: Described Doolysaurus and recovered it and other small Asian taxa
      within Thescelosaurinae in the Fonseca dataset.
