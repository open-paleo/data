clade: Thescelosaurinae
description: >
  Thescelosaurinae is one of the two subfamilies of Thescelosauridae,
  comprising relatively robust, larger-bodied basal neornithischians from the
  Cretaceous of North America and Asia, including the type genus Thescelosaurus,
  Parksosaurus, and the East Asian Changchunsaurus and Haya. The subfamily is
  defined as the thescelosaurids more closely related to Thescelosaurus than to
  Orodromeus.
type_genus: Thescelosaurus
erected_in: sternberg1940c
described_in: madzia2021a
diagnostic_features:
  - Two supraorbital bones that remain unfused
  - Dorsally projecting, finger-like process on the surangular
  - Robust, comparatively large-bodied build relative to orodromines
  - Ilium with a sinuous dorsal margin in derived members
references:
  - id: sternberg1940c
    notes: Origin of the family-group name Thescelosaurinae.
  - id: madzia2021a
    notes: Provides the modern phylogenetic definition of Thescelosaurinae.
