clade: Saturnaliidae
description: >
  Saturnaliidae is a family of small, basal sauropodomorph dinosaurs from the
  Late Triassic, with fossils known from Brazil, Argentina, and possibly
  Zimbabwe. Its best-supported members are Saturnalia and Chromogisaurus, with
  Pampadromaeus and Panphagia added as close relatives when the group was
  elevated from subfamily to family rank; Eoraptor, Buriolestes, Bagualosaurus,
  and Nhandumirim have also been recovered as possible members in more recent
  phylogenetic analyses. The group is typically defined as the most inclusive
  sauropodomorph clade that contains Saturnalia but not Plateosaurus. Although
  saturnaliids were once treated as a subgroup within Guaibasauridae, most
  recent studies instead place them as an independent lineage at the very base
  of the sauropodomorph family tree. These were lightly built, cursorial animals
  that retained slender proportions and partly serrated teeth suited to a mixed,
  still partly meat-eating diet.
type_genus: Saturnalia
erected_in: ezcurra2010a
diagnostic_features:
  - Small body size with slender, cursorial hindlimb proportions
  - Lanceolate, partly serrated teeth retaining a faunivorous component
  - Elongate, lightly built cervical vertebrae
  - Gracile, plesiomorphic manus and pes
references:
  - id: ezcurra2010a
    notes: Named Saturnaliinae, the family-group name later raised to
      Saturnaliidae; authority by coordination.
