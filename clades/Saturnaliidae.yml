clade: Saturnaliidae
description: >
  Saturnaliidae is a family of small, basal sauropodomorph dinosaurs from the
  Late Triassic, with fossils known from Brazil, Argentina, and possibly
  Zimbabwe. Its best-supported members are Saturnalia and Chromogisaurus, with
  Pampadromaeus and Panphagia added as close relatives when the group was
  elevated from subfamily to family rank; Nhandumirim has been recovered as a
  saturnaliin (Pacheco and colleagues, 2019), and Eoraptor and Buriolestes fall
  within a weakly supported, more inclusive Saturnaliidae in the analysis of
  Lovelace and colleagues (2025). The group is defined as the most inclusive
  sauropodomorph clade that contains Saturnalia but not Plateosaurus (Langer and
  colleagues, 2019). Although saturnaliids were once treated as a subgroup
  within Guaibasauridae (Ezcurra, 2010), Langer and colleagues (2019) recover
  Saturnaliidae as the sister group of Bagualosauria, with Buriolestes and
  Eoraptor branching earlier. These were lightly built, cursorial animals that
  retained slender proportions and partly serrated teeth suited to a mixed,
  still partly meat-eating diet.
type_genus: Saturnalia
erected_in: ezcurra2010a
diagnostic_features:
  - Small body size with slender, cursorial hindlimb proportions
  - Lanceolate, partly serrated teeth retaining a faunivorous component
  - Elongate, lightly built cervical vertebrae
  - Gracile, plesiomorphic manus and pes
references:
  - id: ezcurra2010a
    notes: Described Chromogisaurus and named Saturnaliinae within Guaibasauridae,
      from which the family name takes its authorship by coordination.
  - id: pacheco2019a
    notes: Described Gnathovorax and recovered Nhandumirim as a saturnaliin.
  - id: langer2019b
    notes: Redescribed Pampadromaeus, defined Saturnaliidae as the maximal clade
      containing Saturnalia but not Plateosaurus, and recovered it as sister to
      Bagualosauria.
  - id: lovelace2025a
    notes: Recovered a weakly supported, more inclusive Saturnaliidae containing
      Eoraptor and Buriolestes.
