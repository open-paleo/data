clade: Saturnaliidae
description: >
  Saturnaliidae is a clade of small, gracile, early-diverging sauropodomorphs
  from the Late Triassic (Carnian) of South America, retaining a relatively
  carnivorous-to-omnivorous dentition and slender, cursorial proportions. Its
  core members are Saturnalia and Chromogisaurus; Pampadromaeus and Panphagia
  are sometimes included but their membership is less stable. The family was
  raised from Saturnaliinae and represents one of the basalmost sauropodomorph
  lineages.
type_genus: Saturnalia
erected_in: ezcurra2010a
diagnostic_features:
  - Small body size with slender, cursorial hindlimb proportions
  - Lanceolate, partly serrated teeth retaining a faunivorous component
  - Elongate, lightly built cervical vertebrae
  - Gracile, plesiomorphic manus and pes
references:
  - id: ezcurra2010a
    authors: Ezcurra, M. D.
    year: 2010
    title: "A new early dinosaur (Saurischia: Sauropodomorpha) from the Late
      Triassic of Argentina: a reassessment of dinosaur origin and phylogeny"
    journal: Journal of Systematic Palaeontology
    volume: "8"
    pages: 371-425
    doi: 10.1080/14772019.2010.484650
    notes: Named Saturnaliinae, the family-group name later raised to
      Saturnaliidae; authority by coordination.
