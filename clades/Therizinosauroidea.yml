clade: Therizinosauroidea
description: >
  Therizinosauroidea is the derived superfamily of Therizinosauria,
  conventionally defined as the least inclusive clade containing Beipiaosaurus
  inexpectus and Therizinosaurus cheloniformis and thus excluding the
  basal-most therizinosaurs such as Falcarius. It encompasses the
  intermediate-grade Asian genera that grade morphologically toward the derived
  family Therizinosauridae, combining a maniraptoran forelimb and incipient
  gut and pelvic specializations with a still relatively lightly built skeleton.
  Some authors (notably Senter) have instead used the name for the entire
  therizinosaurian total group, but the nested usage following Russell and Dong
  (1993) and Zanno (2010) is adopted here.
type_genus: Therizinosaurus
erected_in: russell1993b
described_in: zanno2010a
diagnostic_features:
  - Loss of the plesiomorphic subcondylar recess retained in Falcarius
  - Coossification of the sacral neural spines into a supraneural plate
  - Deep, anteriorly hooked cervical epipophyses
  - Femoral head confluent with the neck without an evident transition
  - Progressively enlarged, transversely broadened preacetabular ala of the ilium
references:
  - id: russell1993b
  - id: zanno2010a
