clade: Therizinosauroidea
description: >
  Therizinosauroidea is a superfamily of large, herbivorous maniraptoran
  theropod dinosaurs known mainly from the Cretaceous of Asia, with a possible
  Jurassic tooth from England representing its oldest record. As restricted
  here, it comprises the more derived therizinosaurs, including genera such as
  Beipiaosaurus, Enigmosaurus, Erliansaurus, Neimongosaurus, and Suzhousaurus
  together with the families Alxasauridae and Therizinosauridae, and excludes
  the most primitive members of the broader group Therizinosauria, such as
  Falcarius. Its members share the distinctive therizinosaur mix of features:
  long necks, wide torsos, and four-toed weight-bearing feet reminiscent of
  early plant-eating dinosaurs, backward-pointing and partially fused hip bones
  once thought to recall those of ornithischians, and greatly enlarged, strongly
  curved hand claws. The name has largely replaced the older term Segnosauria in
  phylogenetic work, though some studies instead apply it to the entire
  therizinosaur lineage rather than to this more nested grouping.
type_genus: Therizinosaurus
erected_in: maleev1954a
described_in: zanno2010a
diagnostic_features:
  - Loss of the plesiomorphic subcondylar recess retained in Falcarius
  - Coossification of the sacral neural spines into a supraneural plate
  - Deep, anteriorly hooked cervical epipophyses
  - Femoral head confluent with the neck without an evident transition
  - Progressively enlarged, transversely broadened preacetabular ala of the ilium
references:
  - id: maleev1954a
    notes: Origin of the family-group name (Therizinosauridae), and by
      coordination the superfamily Therizinosauroidea.
  - id: russell1993b
    notes: First used the name at superfamily rank.
