clade: Titanosauria
description: >
  Titanosauria is a diverse clade of sauropod dinosaurs known from every
  continent, including Antarctica, and the last group of long-necked sauropods
  to survive up to the mass extinction at the end of the Cretaceous. It spans
  the widest range of body size of any sauropod group, encompassing some of the
  largest land animals ever to have lived, such as Patagotitan, Argentinosaurus,
  and Puertasaurus, alongside dwarf forms like the island-dwelling
  Magyarosaurus. Titanosaurs had small, wide heads and whip-like tails, and the
  skin of many was studded with a mosaic of small bead-like scales. Together
  with the brachiosaurids and their relatives, they make up the larger clade
  Titanosauriformes, and most members apart from a few basal genera fall within
  a subgroup called Lithostrotia. Their fossil record is the least complete of
  any major sauropod group, and the relationships among the species remain
  poorly resolved.
erected_in: bonaparte1993a
described_in: salgado1997a
diagnostic_features:
  - Procoelous caudal vertebrae (concave anteriorly, convex posteriorly)
  - Osteoderms (bony dermal armor) present in many taxa
  - Wide-gauge (laterally splayed) limb posture
  - Loss of manual phalanges in derived forms
  - Strongly opisthocoelous dorsal and caudal vertebrae
  - Expanded iliac blade with a preacetabular process directed laterally
references:
  - id: bonaparte1993a
    notes: Coined the name Titanosauria.
  - id: salgado1997a
    notes: Provided the first phylogenetic definition of Titanosauria.
