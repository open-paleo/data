clade: Khebbashia
description: >
  Khebbashia is the node-based clade uniting the two derived rebbachisaurid
  subfamilies Limaysaurinae and Rebbachisaurinae, to the exclusion of the basal
  rebbachisaurid grade. It was erected by Fanti et al. (2015) as the least
  inclusive clade containing Limaysaurus, Nigersaurus, and Rebbachisaurus, and
  is defined as a node-based name to avoid conflict with the stem-based
  Rebbachisauridae. Its members include the most specialized rebbachisaurids,
  with broad tooth batteries and gracile limb proportions.
erected_in: fanti2015
diagnostic_features:
  - Teeth bearing both high-angle and low-angle wear facets.
  - Tooth crowns with lingual grooves.
  - Gracile humerus with a robustness index below 0.27.
references:
  - id: fanti2015
    authors: Fanti, F.; Cau, A.; Cantelli, L.; Hassine, M.; Auditore, M.
    year: 2015
    title: "New information on Tataouinea hannibalis from the Early Cretaceous of
      Tunisia and implications for the tempo and mode of rebbachisaurid sauropod
      evolution"
    journal: PLOS ONE
    volume: "10"
    issue: "4"
    pages: e0123475
    doi: 10.1371/journal.pone.0123475
    url: http://dx.doi.org/10.1371/journal.pone.0123475
    notes: Erected the clade Khebbashia for Limaysaurinae plus Rebbachisaurinae.
dispute:
  summary: >
    Khebbashia is recovered as a clade by most recent analyses (Fanti et al.,
    2015; Canudo et al., 2018; Lerzo et al., 2024; Bellardini et al., 2025) and
    is used in the Princeton Encyclopedia (Jones, 2026), but some analyses
    instead recover the rebbachisaurid subfamilies as a grade rather than as a
    monophyletic Khebbashia (Simón and Salgado, 2025). The node is retained here
    on the weight of current usage.
  history:
    - date: "2026-06-30"
      note: >
        Retained as a node uniting Limaysaurinae and Rebbachisaurinae following
        the prevailing recent literature; the competing grade hypothesis (Simón
        and Salgado, 2025) is noted.
