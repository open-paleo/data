clade: Khebbashia
rank: unranked
erected_in: fanti2015a
dispute:
  summary: >
    Khebbashia, the clade containing Limaysaurinae and Rebbachisaurinae, is
    recovered or used across recent analyses (Fanti and colleagues, 2015; Canudo
    and colleagues, 2018; Lerzo and colleagues, 2025), and Simón and Salgado
    (2025) recover it as the sister of Lavocatisaurus. Its monophyly is not
    densely tested in every study: Bellardini and colleagues (2025) place
    Astigmasaura outside it and resolve only Limaysaurinae within it. The node
    is retained on the weight of current usage.
references:
  - id: fanti2015a
    notes: Erected the clade Khebbashia for Limaysaurinae plus Rebbachisaurinae.
  - id: bellardini2025a
    notes: Treated Khebbashia as the clade of Limaysaurinae and Rebbachisaurinae,
      placed Astigmasaura outside it, and resolved only Limaysaurinae within it.
  - id: simón2025a
    notes: Recovered Khebbashia as a monophyletic clade, sister to Lavocatisaurus.
  - id: lerzo2025a
    notes: Recovered Khebbashia as a monophyletic clade uniting the rebbachisaurid subfamilies.
  - id: canudo2018a
    notes: Phylogenetic analysis placed Lavocatisaurus as sister to Khebbashia, i.e. Limaysaurinae plus Rebbachisaurinae
  - id: jones2026b
    notes: Treats Khebbashia as a clade forking into two subfamilies, reviewing
      the genera placed inside it or just outside it.
