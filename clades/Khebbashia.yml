clade: Khebbashia
description: >
  Khebbashia is a node-based clade of rebbachisaurid sauropods that unites the
  two most derived subfamilies, Limaysaurinae and Rebbachisaurinae, to the
  exclusion of the more basal rebbachisaurid forms. It is defined as the least
  inclusive clade containing Limaysaurus tessonei, Nigersaurus taqueti, and
  Rebbachisaurus garasbae, and the node-based framing keeps it distinct from the
  stem-based family Rebbachisauridae. Its members were medium-sized sauropods
  that lived during the Early Cretaceous of South America, Africa, and Europe.
  These were among the most specialized rebbachisaurids, notable for highly
  modified feeding apparatus, with broad batteries of closely packed teeth and
  slender limb proportions.
erected_in: fanti2015a
diagnostic_features:
  - Teeth bearing both high-angle and low-angle wear facets.
  - Tooth crowns with lingual grooves.
  - Gracile humerus with a robustness index below 0.27.
dispute:
  summary: >
    Khebbashia is recovered or used as a clade uniting Limaysaurinae and
    Rebbachisaurinae across recent analyses (Fanti et al., 2015; Canudo et al.,
    2018; Lerzo et al., 2024; Simón and Salgado, 2025) and in the Princeton
    Encyclopedia (Jones, 2026). Its monophyly is not densely tested in every
    study — Bellardini et al. (2025) use the name as an inherited label while
    leaving their Rebbachisaurinae exemplars unresolved — but the node is
    retained here on the weight of current usage.
  history:
    - date: "2026-06-30"
      note: >
        Retained as a node uniting Limaysaurinae and Rebbachisaurinae following
        the prevailing recent literature.
references:
  - id: fanti2015a
    notes: Erected the clade Khebbashia for Limaysaurinae plus Rebbachisaurinae.
  - id: bellardini2025a
    notes: Uses Khebbashia as an inherited clade label; its scored Rebbachisaurinae exemplar remains an unresolved wildcard.
  - id: simón2025a
    notes: Recovered Khebbashia as a monophyletic clade, sister to Lavocatisaurus.
  - id: lerzo2024a
    notes: Recovered Khebbashia as a monophyletic clade uniting the rebbachisaurid subfamilies.
  - id: canudo2018a
    notes: Phylogenetic analysis placed Lavocatisaurus as sister to Khebbashia, i.e. Limaysaurinae plus Rebbachisaurinae
  - id: jones2026b
    notes: Placement and assessment in the Princeton Encyclopedia of Dinosaurs.
