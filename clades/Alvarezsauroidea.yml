clade: Alvarezsauroidea
description: >
  Alvarezsauroidea is a group of small maniraptoran theropod dinosaurs that
  split into two grades separated chiefly by their hand anatomy. The basal,
  non-alvarezsaurid alvarezsauroids include long-armed forms such as
  Haplocheirus from the Late Jurassic of Asia, which retained grasping hands,
  recurved serrated teeth, and a carnivorous diet interpreted as the ancestral
  condition for the clade. The derived family Alvarezsauridae, ranging through
  the Cretaceous, shows a greatly enlarged single functional finger flanked by
  two tiny vestigial digits, along with a long snout and simplified, closely
  spaced teeth; these features have been read as adaptations for digging and for
  feeding on insects such as ants and termites. Most derived members were small,
  roughly 0.5 to 2 meters in body length, and the clade appears to have
  undergone a rare trend toward miniaturization. Fossils are best known from
  Asia but also occur in North and South America and possibly Europe, and
  current evidence points to an Asian origin followed by repeated dispersal
  events.
type_genus: Alvarezsaurus
erected_in: choiniere2010a
diagnostic_features:
  - Elongate basipterygoid processes and a steeply (vertically) inclined
    basisphenoid
  - Hypertrophied internal tuberosity of the humerus, separated from the humeral
    head by a distinct notch and lying level with or projecting above the head
  - Enlarged humeral ectepicondyle
  - Conical lateral distal condyle of the femur projecting further distally than
    the flattened medial condyle
  - Greatly enlarged ungual on manual digit I, much larger than the unguals of
    the other digits
  - First metacarpal with distal condyles lacking collateral ligament fossae
dispute:
  summary: >
    The position of Alvarezsauroidea within Coelurosauria is unsettled. It is
    variously recovered as an early-diverging maniraptoran, as one of the
    first-branching maniraptoriforms (paired with therizinosaurs by Hartman et
    al., 2019), or as close to Ornithomimosauria; Meso et al. (2024) recover it
    as the earliest-diverging maniraptoriform clade, but with weak support. The
    long-armed Jurassic Chinese members are themselves of contested affinity,
    with ornithomimosaur and compsognathid alternatives proposed for Haplocheirus
    and its kin (Hartman et al., 2019; Agnolín et al., 2021).
  history:
    - date: "2026-07-01"
      note: Placed at Maniraptora following the current-consensus hypothesis; the finer position within Maniraptoriformes/Maniraptora remains unresolved.
references:
  - id: choiniere2010a
  - id: hartman2019a
    notes: Recovered Alvarezsauroidea paired with therizinosaurs among early maniraptoriforms.
  - id: agnolín2021b
    notes: Questioned monophyly of Jurassic Chinese alvarezsauroids on cranial grounds
  - id: meso2024a
    notes: Recovered Alvarezsauroidea as the earliest-diverging maniraptoriform clade, with weak support.
