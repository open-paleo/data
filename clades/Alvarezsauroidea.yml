clade: Alvarezsauroidea
rank: superfamily
type_genus: Alvarezsaurus
identifiers:
  - source: pbdb
    id: "162354"
  - source: wikidata
    id: Q2909215
  - source: eol
    id: "47458555"
erected_in: bonaparte1991a
diagnostic_features:
  - Elongate basipterygoid processes and a steeply (vertically) inclined
    basisphenoid
  - Hypertrophied internal tuberosity of the humerus, separated from the humeral
    head by a distinct notch and lying level with or projecting above the head
  - Enlarged humeral ectepicondyle
  - Conical lateral distal condyle of the femur projecting further distally than
    the flattened medial condyle
  - Greatly enlarged ungual on manual digit I, much larger than the unguals of
    the other digits
  - First metacarpal with distal condyles lacking collateral ligament fossae
dispute:
  summary: >
    The position of Alvarezsauroidea within Coelurosauria is unsettled. It is
    variously recovered as an early-diverging maniraptoran, paired with
    therizinosaurs as the first-branching maniraptorans (Hartman and colleagues, 2019),
    or as close to Ornithomimosauria — a topology Hartman and others found only
    four steps longer. Meso and colleagues (2024) instead recover it as the
    earliest-diverging maniraptoriform clade, an arrangement they describe as
    poorly supported, although its place within Maniraptoriformes is well
    supported.
    The long-armed Jurassic Chinese members are themselves of contested affinity,
    with ornithomimosaur and compsognathid alternatives proposed for Haplocheirus
    and its kin (Hartman and colleagues, 2019; Agnolín and colleagues, 2021).
references:
  - id: bonaparte1991a
    notes: Erected Alvarezsauridae on Alvarezsaurus; Alvarezsauroidea is
      coordinate with it.
  - id: choiniere2010a
    notes: Described Haplocheirus and recovered it as the earliest-diverging
      alvarezsauroid, confirming a basal position for the clade within
      Maniraptora.
  - id: hartman2019a
    notes: Recovered Alvarezsauroidea with Therizinosauria as the first-branching
      maniraptorans; an ornithomimosaur sister-group topology is four steps
      longer.
  - id: agnolín2021b
    notes: Questioned the alvarezsauroid affinities of Haplocheirus and other
      Jurassic Chinese forms on cranial grounds, arguing ornithomimosaur
      resemblances; ran no cladistic analysis.
  - id: meso2024a
    notes: Recovered Alvarezsauria within Maniraptoriformes with Bremer support of
      3 and jackknife of 80%, and as its earliest-diverging clade with Bremer
      support of 1 and jackknife below 50%.
