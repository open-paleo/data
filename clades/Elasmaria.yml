clade: Elasmaria
description: >
  Elasmaria is a clade of small to medium-sized ornithopod dinosaurs known from
  Cretaceous deposits across the former supercontinent of Gondwana, including
  South America, Antarctica, Australia, and possibly Africa. It groups together
  many lightly built, bipedal ornithopods that were once loosely lumped as
  "hypsilophodonts." Originally erected to unite just Macrogryphosaurus and
  Talenkauen, the clade was later found to be far more inclusive, drawing in a
  variety of Southern Hemisphere forms such as the Antarctic Morrosaurus and
  Trinisaura, as well as Anabisetia. Its members are distinguished chiefly by
  thin, mineralized plates arranged along the ribs, together with gracile,
  cursorial hindlimbs suited to running. Elasmaria represents a major southern
  radiation of ornithopods that persisted through much of the Cretaceous.
erected_in: calvo2007c
described_in: fonseca2024a
diagnostic_features:
  - Thin, plate-like mineralized intercostal plates on the dorsal ribs (where
    preserved)
  - Gracile, cursorial hindlimb proportions
  - Anterolaterally projecting preacetabular process of the ilium
  - Retention of a small, slender pedal digit I
dispute:
  summary: >
    The position of Elasmaria is contested. Analyses on the matrix of
    Dieudonné and colleagues recover it within Iguanodontia, as the sister
    of Dryomorpha (Dieudonné and colleagues, 2020; Rotatori and colleagues,
    2023) or, most recently, within Dryosauridae (Dieudonné and colleagues,
    2026a, 2026b), and Fonseca and colleagues (2024) place it in
    Euiguanodontia. Madzia and colleagues (2017), Herne and colleagues
    (2019) and Cruzado-Caballero and colleagues (2019) instead recover it
    within Ornithopoda but outside Iguanodontia, Bertozzo and colleagues
    (2025) leave its members unresolved against Iguanodontia, and Boyd
    (2015) placed it outside Ornithopoda, among the thescelosaurines.
references:
  - id: calvo2007c
    notes: Named Elasmaria.
  - id: fonseca2024a
    notes: Provides a modern phylogenetic delimitation of Elasmaria within
      Iguanodontia.
  - id: rozadilla2016a
    notes: Nested Elasmaria within Euiguanodontia in their phylogenetic analysis of Gondwanan ornithopods.
  - id: jones2026a
    notes: Describes Elasmaria as one of the earliest-diverging ornithopod
      branches, with its internal relationships ill-defined.
  - id: dieudonné2026a
    notes: Recovers Elasmaria within Dryosauridae in an analysis of
      ornithischian relationships.
  - id: dieudonné2026b
    notes: Recovers Elasmaria within Dryosauridae, with Gasparinisaura in a
      polytomy with its specifiers.
  - id: boyd2015a
    notes: Ornithischian phylogenetic analysis bearing on the placement of Elasmaria.
  - id: madzia2017a
    notes: Recovered Elasmaria within Ornithopoda, outside Iguanodontia.
  - id: herne2019a
    notes: Recovered Elasmaria as the sister of Clypeodonta, within Ornithopoda.
  - id: cruzado-caballero2019a
    notes: Recovered Elasmaria in a polytomy sister to Iguanodontia.
  - id: dieudonné2020a
    notes: Recovered Elasmaria within Iguanodontia, with Eousdryosaurus as the sister of Dryomorpha.
  - id: rotatori2023a
    notes: Recovered Elasmaria within Iguanodontia, as the sister of Dryomorpha.
  - id: bertozzo2025a
    notes: Recovered elasmarians in a polytomy with Iguanodontia.
  - id: coria2024a
    notes: Did not recover Elasmaria as a clade.
