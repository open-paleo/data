clade: Elasmaria
description: >
  Elasmaria is a clade of small to medium-sized iguanodontian ornithopods largely
  endemic to Gondwana (South America, Antarctica, Australia, and Africa),
  including Talenkauen, Macrogryphosaurus, Anabisetia, and the Antarctic
  Morrosaurus and Trinisaura. Several members bear distinctive thin, mineralized
  intercostal plates along the ribcage. The clade represents a major southern
  radiation of cursorial ornithopods through the Cretaceous.
erected_in: calvo2007c
described_in: fonseca2024
diagnostic_features:
  - Thin, plate-like mineralized intercostal plates on the dorsal ribs (where
    preserved)
  - Gracile, cursorial hindlimb proportions
  - Anterolaterally projecting preacetabular process of the ilium
  - Retention of a small, slender pedal digit I
references:
  - id: calvo2007c
    authors: Calvo, J. O.; Porfiri, J. D.; Novas, F. E.
    year: 2007
    title: "Discovery of a new ornithopod dinosaur from the Portezuelo Formation
      (Upper Cretaceous), Neuquén, Patagonia, Argentina"
    journal: Arquivos do Museu Nacional
    volume: "65"
    pages: 471-483
    notes: Named Elasmaria.
  - id: fonseca2024
    authors: Fonseca, A. O.; Reid, I. J.; Venner, A.; Duncan, R. J.;
      Garcia, M. S.; Müller, R. T.
    year: 2024
    title: A comprehensive phylogenetic analysis on early ornithischian evolution
    journal: Journal of Systematic Palaeontology
    volume: "22"
    pages: "2346577"
    doi: 10.1080/14772019.2024.2346577
    notes: Provides a modern phylogenetic delimitation of Elasmaria within
      Iguanodontia.
dispute:
  summary: >
    The position of Elasmaria is contested. Fonseca and others (2024) and
    Rozadilla and others (2020) recover it within Iguanodontia (as the sister
    group of Dryomorpha in Euiguanodontia), whereas Boyd (2015) recovered it
    outside Ornithopoda among basal neornithischians (Thescelosaurinae), and
    Jones (2026) treats it as a basal ornithopod clade sister to Iguanodontia.
  history:
    - date: "2026-06-29"
      note: Placed within Iguanodontia following the most recent comprehensive
        analysis (Fonseca and others, 2024) and Rozadilla and others (2020); the
        basal-neornithischian (Boyd, 2015) and basal-ornithopod (Jones, 2026)
        alternatives are reflected but not adopted (P3).
