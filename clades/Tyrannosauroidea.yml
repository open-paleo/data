clade: Tyrannosauroidea
rank: superfamily
type_genus: Tyrannosaurus
identifiers:
  - source: pbdb
    id: "58837"
  - source: wikidata
    id: Q131396
  - source: eol
    id: "42332925"
erected_in: osborn1906a
described_in: holtz2004b
diagnostic_features:
  - Tall premaxilla forming a blunt snout tip
  - Fused, rugose-textured nasal bones
  - Small, D-shaped (asymmetric) premaxillary teeth
  - Braincase with a deep otic recess (columellar canal) bearing an internal
    fenestra vestibuli
  - Elongate cochlear duct, indicating heightened sensitivity to low-frequency
    sound
  - Tubular brain endocast with only a slight midbrain flexure
  - Pronounced midbrain peak on the endocast, anterior to the posterior middle
    cerebral vein
  - Indistinct flocculus that barely crosses the plane of the anterior
    semicircular canal
references:
  - id: osborn1906a
    notes: Proposed the family Tyrannosauridae, from which the superfamily name takes
      its authorship by coordination.
  - id: holtz2004b
    notes: Defined Tyrannosauroidea as Tyrannosaurus rex and all taxa closer to
      it than to Ornithomimus velox, Deinonychus antirrhopus or Allosaurus
      fragilis, and diagnosed it.
  - id: brusatte2016a
    notes: Described the braincase and endocast of Timurlengia, showing the
      shallow endocast and long cochlear duct that earlier studies identify as
      tyrannosauroid synapomorphies.
