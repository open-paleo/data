clade: Tyrannosauroidea
description: >
  Tyrannosauroidea is a superfamily of coelurosaurian theropod dinosaurs that
  unites the family Tyrannosauridae with a range of smaller, more basal
  relatives such as the proceratosaurids. The group arose on the northern
  supercontinent Laurasia in the Jurassic and persisted until the end of the
  Cretaceous, when tyrannosauroids became the dominant large predators of the
  Northern Hemisphere, culminating in the giant Tyrannosaurus; their fossils are
  known from what are now North America, Europe, and Asia. All members were
  bipedal carnivores distinguished by a suite of skull and pelvic features,
  including a tall premaxilla that blunted the front of the snout, fused and
  often roughly textured nasal bones, and small, D-shaped premaxillary teeth.
  Early forms were small animals with long, three-fingered forelimbs, whereas
  the later giants reached enormous size yet had proportionately tiny,
  two-fingered arms; the derived forms also developed a pinched third
  metatarsal, the arctometatarsus, tied to running efficiency. Primitive
  filamentous feathers are preserved in several species, and many
  tyrannosauroids bore bony crests of varied shape on the skull that likely
  served for display.
type_genus: Tyrannosaurus
erected_in: osborn1905a
described_in: brusatte2016a
diagnostic_features:
  - Braincase with a deep otic recess (columellar canal) bearing an internal
    fenestra vestibuli
  - Elongate cochlear duct, indicating heightened sensitivity to low-frequency
    sound
  - Tubular brain endocast with only a slight midbrain flexure
  - Pronounced midbrain peak on the endocast, anterior to the posterior middle
    cerebral vein
  - Indistinct flocculus that barely crosses the plane of the anterior
    semicircular canal
references:
