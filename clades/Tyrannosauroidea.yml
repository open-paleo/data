clade: Tyrannosauroidea
description: >
  Tyrannosauroidea is a superfamily of coelurosaurian theropods comprising the
  giant Late Cretaceous Tyrannosauridae together with their smaller, mostly
  earlier-diverging relatives. The group ranges from small-bodied Middle
  Jurassic and Early Cretaceous forms, such as the proceratosaurids, to the
  largest terrestrial predators of the Late Cretaceous of Laurasia.
type_genus: Tyrannosaurus
erected_in: osborn1905
described_in: brusatte2016
diagnostic_features:
  - Braincase with a deep otic recess (columellar canal) bearing an internal
    fenestra vestibuli
  - Elongate cochlear duct, indicating heightened sensitivity to low-frequency
    sound
  - Tubular brain endocast with only a slight midbrain flexure
  - Pronounced midbrain peak on the endocast, anterior to the posterior middle
    cerebral vein
  - Indistinct flocculus that barely crosses the plane of the anterior
    semicircular canal
