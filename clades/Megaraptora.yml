clade: Megaraptora
rank: unranked
type_genus: Megaraptor
identifiers:
  - source: pbdb
    id: "160851"
  - source: wikidata
    id: Q2118897
erected_in: benson2010d
diagnostic_features:
  - Greatly enlarged, transversely compressed and strongly recurved manual ungual on digit I
  - Elongate and gracile forelimb with a robust first metacarpal
  - Extensive postcranial pneumaticity of the vertebrae
  - Long, shallow-snouted skull with small, blade-like teeth
dispute:
  summary: >
    The higher-level position of Megaraptora is debated, though the debate has
    narrowed. It was originally named among allosauroid theropods, as a clade
    within Neovenatoridae (Carcharodontosauria) by Benson, Carrano and Brusatte
    (2010), a placement also recovered by Carrano and colleagues (2012). More
    recent analyses, however, recover Megaraptora within Coelurosauria: the
    dedicated megaraptoran studies of Aranciaga Rolando and colleagues (2022)
    and Ibiricu and colleagues (2025) find it to be the sister group of
    Tyrannosauroidea, the allosauroid-focused analysis of Kellermann and
    colleagues (2025) likewise recovers megaraptorans as coelurosaurs, and the
    broad predatory-dinosaur framework of Cau (2024) places Megaraptora within
    Tyrannosauroidea. The coelurosaurian placement is now the prevailing view
    and is followed; the allosauroid hypothesis is treated as the older,
    minority alternative.
references:
  - id: carrano2012a
    notes: Recovered Megaraptora within Neovenatoridae (Carcharodontosauria) in its Tetanurae phylogeny.
  - id: ibiricu2025a
    notes: Dedicated megaraptorid study recovering Megaraptora within Coelurosauria near Tyrannosauroidea.
  - id: kellermann2025a
    notes: Carcharodontosaurid re-evaluation's allosauroid-focused analysis recovers megaraptorans as coelurosaurs.
  - id: benson2010d
    notes: Named Megaraptora as a clade within Neovenatoridae, placing it among allosauroid theropods.
  - id: aranciagarolando2022a
    notes: Recovered Megaraptora within Coelurosauria as the sister group of
      Tyrannosauroidea.
  - id: cau2024a
    notes: Recovered Megaraptora within Tyrannosauroidea; no support values are
      reported for the placement.
  - id: jones2026c
    notes: Reflects the allosauroid placement of Megaraptora in its
      classification boxes.
