clade: Megaraptora
description: >
  Megaraptora is a clade of medium-to-large predatory theropods known mainly
  from the Cretaceous of Gondwana, with additional records from Asia. They are
  characterized by greatly enlarged, strongly curved manual claws on the first
  two digits and elongate, pneumatic skeletons. The clade comprises the derived
  family Megaraptoridae together with more basal forms such as Fukuiraptor,
  Phuwiangvenator, and Vayuraptor.
type_genus: Megaraptor
erected_in: benson2009d
diagnostic_features:
  - Greatly enlarged, transversely compressed and strongly recurved manual ungual on digit I
  - Elongate and gracile forelimb with a robust first metacarpal
  - Extensive postcranial pneumaticity of the vertebrae
  - Long, shallow-snouted skull with small, blade-like teeth
dispute:
  summary: >
    The higher-level position of Megaraptora is debated, though the debate has
    narrowed. It was originally named among allosauroid theropods, as a clade
    within Neovenatoridae (Carcharodontosauria) by Benson, Carrano and Brusatte
    (2010), a placement also recovered by Carrano et al. (2012) and reflected in
    the classification boxes of Jones et al. (2026). Most analyses since 2016,
    however, recover Megaraptora within Coelurosauria as the sister group of, or
    within, Tyrannosauroidea — including the dedicated megaraptoran studies of
    Aranciaga Rolando et al. (2022) and Ibiricu et al. (2025) and, notably, the
    allosauroid-focused analysis of Kellermann et al. (2025), which likewise
    recovers megaraptorans as coelurosaurs. The coelurosaurian placement is now
    the prevailing view and is followed here; the allosauroid hypothesis is
    treated as the older, minority alternative.
  history:
    - date: "2026-06-25"
      note: Surfaced in the Tyrannosauroidea pilot but is not itself a tyrannosauroid; left at Coelurosauria (a current-consensus hypothesis), with final placement deferred to the theropod backbone pass. Conservative common clade is Avetheropoda.
    - date: "2026-07-01"
      note: Placement resolved at Coelurosauria following the prevailing coelurosaurian consensus (Aranciaga Rolando et al., 2022; Ibiricu et al., 2025; Kellermann et al., 2025), the last recovering megaraptorans as coelurosaurs even in an allosauroid-focused analysis. Member genera carry no per-genus dispute for this clade-level debate.
references:
  - id: benson2009d
