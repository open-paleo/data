clade: Megaraptora
dispute:
  summary: >
    The higher-level position of Megaraptora is contested. Historically placed
    among allosauroid theropods (as carcharodontosaurians / Neovenatoridae, and
    so treated by Jones et al. 2026), it is recovered within Coelurosauria by
    recent analyses — Aranciaga Rolando et al. (2022) and Ibiricu et al. (2025),
    the latter as the sister group of Tyrannosauroidea. The allosauroid-versus-
    coelurosaur question remains unresolved given the fragmentary material.
  history:
    - date: "2026-06-25"
      note: Surfaced in the Tyrannosauroidea pilot but is not itself a tyrannosauroid; left at Coelurosauria (a current-consensus hypothesis), with final placement deferred to the theropod backbone pass. Conservative common clade is Avetheropoda.
