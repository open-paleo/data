clade: Megaraptora
description: >
  Megaraptora is a clade of medium-to-large carnivorous theropod dinosaurs from
  the Cretaceous. They were most diverse in the early Late Cretaceous of South
  America, particularly Patagonia, but ranged widely, with basal members also
  known from Thailand, Japan, and Australia. Megaraptorans are distinguished by
  their powerfully built forelimbs, which were tipped with enormous, strongly
  curved claws on the first two fingers rather than being reduced as in most
  other large theropods. Their skeletons were heavily pneumatized, riddled with
  air pockets, and their slender legs and long foot bones suggest they were
  fast-running hunters. The clade contains the derived family Megaraptoridae,
  united by specialized adaptations of the arm and claws, together with more
  basal forms such as Fukuiraptor and Phuwiangvenator. Their broader
  relationships have long been disputed: once classified among the allosauroids,
  megaraptorans are now most often recovered within Coelurosauria, close to the
  tyrannosauroids.
type_genus: Megaraptor
erected_in: benson2009e
diagnostic_features:
  - Greatly enlarged, transversely compressed and strongly recurved manual ungual on digit I
  - Elongate and gracile forelimb with a robust first metacarpal
  - Extensive postcranial pneumaticity of the vertebrae
  - Long, shallow-snouted skull with small, blade-like teeth
dispute:
  summary: >
    The higher-level position of Megaraptora is debated, though the debate has
    narrowed. It was originally named among allosauroid theropods, as a clade
    within Neovenatoridae (Carcharodontosauria) by Benson, Carrano and Brusatte
    (2009), a placement also recovered by Carrano et al. (2012) and reflected in
    the classification boxes of Jones et al. (2026). Most analyses since 2016,
    however, recover Megaraptora within Coelurosauria as the sister group of, or
    within, Tyrannosauroidea — including the dedicated megaraptoran studies of
    Aranciaga Rolando et al. (2022) and Ibiricu et al. (2025) and, notably, the
    allosauroid-focused analysis of Kellermann et al. (2025), which likewise
    recovers megaraptorans as coelurosaurs. The coelurosaurian placement is now
    the prevailing view and is followed here; the allosauroid hypothesis is
    treated as the older, minority alternative.
  history:
    - date: "2026-06-25"
      note: Not itself a tyrannosauroid; placed at Coelurosauria as a current-consensus hypothesis. Conservative common clade is Avetheropoda.
    - date: "2026-07-01"
      note: Placement resolved at Coelurosauria following the prevailing coelurosaurian consensus (Aranciaga Rolando et al., 2022; Ibiricu et al., 2025; Kellermann et al., 2025), the last recovering megaraptorans as coelurosaurs even in an allosauroid-focused analysis. Member genera carry no per-genus dispute for this clade-level debate.
references:
  - id: carrano2012a
    notes: Recovered Megaraptora within Neovenatoridae (Carcharodontosauria) in its Tetanurae phylogeny.
  - id: ibiricu2025a
    notes: Dedicated megaraptorid study recovering Megaraptora within Coelurosauria near Tyrannosauroidea.
  - id: kellermann2025a
    notes: Carcharodontosaurid re-evaluation's allosauroid-focused analysis recovers megaraptorans as coelurosaurs.
  - id: benson2009e
    notes: Named Megaraptora as a clade within Neovenatoridae, placing it among allosauroid theropods
  - id: aranciagarolando2022a
    notes: Recovered Megaraptora within Coelurosauria as sister to or within Tyrannosauroidea
  - id: jones2026c
    notes: Reflects the allosauroid placement of Megaraptora in its
      classification boxes.
