clade: Gravisauria
description: >
  Gravisauria is a clade of sauropod dinosaurs erected by Allain and Aquesbi
  (2008), defined as the least inclusive clade containing Tazoudasaurus naimi
  and Saltasaurus loricatus. It encompasses the vulcanodontid grade (including
  Vulcanodon and Tazoudasaurus) together with Eusauropoda, and corresponds to
  the node that several recent classifications (following Yates, 2007) treat as
  the principal radiation of fully graviportal sauropods. Gravisaurians are
  united by the acquisition of columnar, weight-bearing limbs and the
  broadening of the dorsal neural spines.
erected_in: allain2008a
diagnostic_features:
  - Dorsal neural spines broader transversely than anteroposteriorly
  - Asymmetry of the femoral distal condyles, with a transversely broader tibial condyle
  - Fully columnar, graviportal forelimbs and hindlimbs
  - Four or more sacral vertebrae
references:
  - id: allain2008a
    notes: Erected Gravisauria and provided the osteological basis for its
      diagnosis.
