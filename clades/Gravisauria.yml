clade: Gravisauria
description: >
  Gravisauria is a clade of sauropod dinosaurs that unites the vulcanodontid
  grade, including Vulcanodon and Tazoudasaurus, with the more derived
  Eusauropoda, along with several basal forms such as Antetonitrus,
  Gongxianosaurus, and Isanosaurus that fall outside Vulcanodontidae. It
  corresponds to the group that some workers instead treat as Sauropoda under a
  narrower definition, and it encompasses essentially the full radiation of the
  massive, fully graviportal sauropods. Members share dorsal vertebrae that are
  broader from side to side than front to back and asymmetrical condyles at the
  lower end of the femur. The clade is thought to have originated in the Early
  Jurassic, around the Pliensbachian and Toarcian roughly 183 million years ago,
  as part of a broader faunal turnover that saw the decline of the prosauropods,
  coelophysoids, and basal thyreophorans.
erected_in: allain2008a
diagnostic_features:
  - Dorsal neural spines broader transversely than anteroposteriorly
  - Asymmetry of the femoral distal condyles, with a transversely broader tibial condyle
  - Fully columnar, graviportal forelimbs and hindlimbs
  - Four or more sacral vertebrae
references:
  - id: allain2008a
    notes: Erected Gravisauria and provided the osteological basis for its
      diagnosis.
  - id: yates2007a
    notes: Source of the Gravisauria concept adopted in recent classifications.
