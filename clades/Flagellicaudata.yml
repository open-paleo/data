clade: Flagellicaudata
description: >
  Flagellicaudata is a node-based clade of diplodocoid sauropod dinosaurs,
  comprising the families Dicraeosauridae and Diplodocidae along with their most
  recent common ancestor and all of its descendants. The name refers to the
  long, whip-like tails characteristic of its members, from the Latin flagellum,
  meaning "whip," and cauda, meaning "tail." Its two constituent families span a
  broad range of body forms: dicraeosaurids are unusual among sauropods for
  having re-evolved short necks, an apparent adaptation for browsing close to
  the ground, whereas diplodocids include some of the longest and most slender
  animals ever known, with greatly elongated necks. Together they represent a
  more derived grouping within Diplodocoidea, nested above the rebbachisaurids.
erected_in: harris2004a
diagnostic_features:
  - Distal caudal vertebrae elongate and rod-like, forming a whip-like tail
  - Bifurcated (forked) neural spines on the cervical and anterior dorsal
    vertebrae
  - Anterior caudal vertebrae with the neural arch positioned on the anterior
    half of the centrum
references:
  - id: harris2004a
    notes: Erected the clade Flagellicaudata when describing Suuwassea.
