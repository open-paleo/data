clade: Flagellicaudata
description: >
  Flagellicaudata is the node-based clade comprising Dicraeosauridae and
  Diplodocidae and their most recent common ancestor, named for the whip-like
  distal tails characteristic of its members. It was erected by Harris and Dodson
  (2004) as the least inclusive clade containing Dicraeosaurus and Diplodocus.
  Flagellicaudatans range from the short-necked, high-spined dicraeosaurids to
  the extremely elongate diplodocids.
erected_in: harris2004a
diagnostic_features:
  - Distal caudal vertebrae elongate and rod-like, forming a whip-like tail.
  - Bifurcated (forked) neural spines on the cervical and anterior dorsal
    vertebrae.
  - Anterior caudal vertebrae with the neural arch positioned on the anterior
    half of the centrum.
references:
  - id: harris2004a
    notes: Erected the clade Flagellicaudata when describing Suuwassea.
