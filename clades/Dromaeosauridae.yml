clade: Dromaeosauridae
description: >
  Dromaeosauridae is a family of small to medium-sized maniraptoran theropod
  dinosaurs commonly known as "raptors," known from the Late Jurassic to the end
  of the Cretaceous and distributed across all continents. Dromaeosaurids were
  agile, feathered predators characterized by an enlarged, sickle-shaped
  retractable claw on the second toe and a stiffened tail. The family includes
  the basal Halszkaraptorinae and the Gondwanan Unenlagiinae, the small
  Microraptorinae, and the derived Eudromaeosauria (Dromaeosaurus, Velociraptor,
  Deinonychus, and relatives). Dromaeosaurids are among the closest known
  relatives of birds.
type_genus: Dromaeosaurus
erected_in: matthew1922
diagnostic_features:
  - Enlarged, hyperextensible, sickle-shaped ungual on pedal digit II
  - Stiffened tail with elongate prezygapophyses and chevrons
  - Pennaceous feathers on the forelimbs and tail
  - Semilunate carpal bone enabling a folding motion of the manus
  - Lateral teeth with denticles larger on the distal than the mesial carina
