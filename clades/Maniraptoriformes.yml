clade: Maniraptoriformes
description: >
  Maniraptoriformes is a clade of coelurosaurian theropod dinosaurs encompassing
  the ornithomimosaurs and the maniraptorans, the latter group including birds,
  the only dinosaur lineage still alive today. It is one of the more exclusive
  subgroups within Coelurosauria, defined as all descendants of the most recent
  common ancestor of Ornithomimus and birds (Holtz, 1996). Its members may have
  been united by the presence of pennaceous feathers and wings, and one proposed
  distinguishing trait is feathers homologous to those of modern birds. The
  grouping Bullatosauria, which united ornithomimosaurs and troodontids,
  collapses into Maniraptoriformes if that pairing is rejected (Padian and
  colleagues, 1999).
erected_in: holtz1996a
references:
  - id: holtz1996a
    notes: Proposed Maniraptoriformes as a new name for the most recent common
      ancestor of Ornithomimus and birds and all its descendants.
  - id: padian1999a
    notes: Noted that Bullatosauria collapses into Maniraptoriformes if
      ornithomimosaurs and troodontids are not each other's closest relatives.
