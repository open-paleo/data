clade: Hadrosauromorpha
description: >
  Hadrosauromorpha is the clade of hadrosauroids comprising Hadrosauridae and the
  non-hadrosaurid forms closer to it than to Probactrosaurus — the grade of taxa
  immediately ancestral to the duck-billed dinosaurs, including Bactrosaurus,
  Gilmoreosaurus, Telmatosaurus, and Tethyshadros. Although the internal
  relationships of these taxa are poorly resolved, the clade is consistently
  recovered and is diagnosed by a suite of derived cranial and dental characters
  approaching the hadrosaurid condition.
erected_in: norman2014a
described_in: madzia2021a
diagnostic_features:
  - Loss of the surangular foramen
  - Shallow embayment of the jugal wing of the quadrate
  - Reduction of the antorbital fenestra
  - Further elaboration of the dental battery toward the hadrosaurid condition
references:
  - id: norman2014a
    notes: Named Hadrosauromorpha.
  - id: madzia2021a
    notes: Provides the modern phylogenetic definition of Hadrosauromorpha.
