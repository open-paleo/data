clade: Hadrosauromorpha
description: >
  Hadrosauromorpha is a clade of iguanodontian ornithopods that divides the
  broader hadrosauroids into the basal forms, which retain compressed hand bones
  and a spike-like thumb, and the more derived forms that have lost them. It
  comprises the duck-billed hadrosaurids together with the stem taxa immediately
  ancestral to them, a group that has variously been taken to include
  Tethyshadros, Bactrosaurus, Gilmoreosaurus, Telmatosaurus, and Levnesovia,
  though membership shifts from one analysis to another and their internal
  relationships remain poorly resolved. Members are distinguished by a suite of
  skull and skeletal traits approaching the hadrosaurid condition: the loss of
  the thumb spike and reduced, less mobile wrist and hand, more slender lower
  forelimb bones, shoulder blades bearing an overhanging projection rather than
  a J-shaped curve, a straight thigh bone, and shortened foot bones. These
  animals lived across Eurasia and North America during the Cretaceous, forming
  the evolutionary grade leading up to the true duck-billed dinosaurs.
erected_in: norman2014a
described_in: madzia2021a
diagnostic_features:
  - Loss of the surangular foramen
  - Shallow embayment of the jugal wing of the quadrate
  - Reduction of the antorbital fenestra
  - Further elaboration of the dental battery toward the hadrosaurid condition
references:
  - id: norman2014a
    notes: Named Hadrosauromorpha.
  - id: madzia2021a
    notes: Provides the modern phylogenetic definition of Hadrosauromorpha.
