clade: Coronosauria
description: >
  Coronosauria is a clade of neoceratopsian dinosaurs, defined as the smallest
  group containing both Protoceratops and Triceratops. Its members show the
  first development of the elaborate neck frill and the fusion of the first
  several neck vertebrae into a single unit, an adaptation that helped support
  their increasingly heavy heads. Two subgroups are generally recognized within
  it: the Protoceratopsidae, a set of small Asian forms including Protoceratops
  and its closest relatives, and the Ceratopsoidea, which contains the large
  horned Ceratopsidae along with related animals such as Zuniceratops.
  Coronosaurs lived during the Cretaceous of Asia and North America.
erected_in: sereno1986a
described_in: madzia2021a
diagnostic_features:
  - Well-developed, broad parietosquamosal frill
  - Syncervical formed by fusion of the first several cervical vertebrae
  - Enlarged external naris
  - Strongly downturned, deep rostrum
references:
  - id: sereno1986a
    notes: Named Coronosauria.
  - id: madzia2021a
    notes: Provides the modern phylogenetic definition of Coronosauria.
