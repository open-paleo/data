clade: Coronosauria
description: >
  Coronosauria is the clade of neoceratopsians comprising Protoceratopsidae and
  Ceratopsoidea and their most recent common ancestor — the smallest clade
  containing Protoceratops and Triceratops. Its members have a well-developed
  parietosquamosal frill and a fused anterior cervical series (syncervical), and
  the clade includes both the Asian protoceratopsids and the lineage leading to
  the large horned Ceratopsidae.
erected_in: sereno1986a
described_in: madzia2021a
diagnostic_features:
  - Well-developed, broad parietosquamosal frill
  - Syncervical formed by fusion of the first several cervical vertebrae
  - Enlarged external naris
  - Strongly downturned, deep rostrum
references:
  - id: sereno1986a
    notes: Named Coronosauria.
  - id: madzia2021a
    notes: Provides the modern phylogenetic definition of Coronosauria.
