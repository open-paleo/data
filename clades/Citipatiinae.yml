clade: Citipatiinae
description: >
  Citipatiinae is the subfamily of crested oviraptorids that originated in
  southern China and includes Citipati and its close relatives. The name was
  erected by Funston et al. (2020) for the crested clade formerly assigned to
  Oviraptorinae, after their analysis recovered the type genus Oviraptor in a
  more basal position outside the group. Its members typically bear tall,
  well-developed cranial crests and retain relatively long, fully functional
  three-fingered hands.
type_genus: Citipati
erected_in: funston2020a
diagnostic_features:
  - Tall, well-developed bony cranial crest
  - Relatively long manus retaining three functional digits
  - Nasal region incorporated into a raised, pneumatic crest
references:
  - id: funston2020a
