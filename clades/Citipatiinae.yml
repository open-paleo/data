clade: Citipatiinae
description: >
  Citipatiinae is a subfamily of oviraptorid dinosaurs, a group of small,
  bird-like, beaked maniraptoran theropods that lived during the Late Cretaceous
  of Asia. It contains Citipati and its close relatives, the larger, long-armed,
  crested oviraptorids that were traditionally lumped into the subfamily
  Oviraptorinae. The clade was recognized after phylogenetic analysis placed
  Oviraptor in a more basal position outside these crested forms, leaving the
  remaining genera to be grouped on their own. Its members are distinguished by
  tall midline cranial crests, comparable to those of a cassowary, together with
  relatively long hands that retain three functional fingers.
type_genus: Citipati
erected_in: funston2020a
diagnostic_features:
  - Tall, well-developed bony cranial crest
  - Relatively long manus retaining three functional digits
  - Nasal region incorporated into a raised, pneumatic crest
references:
  - id: funston2020a
