clade: Rhabdodontidae
description: >
  Rhabdodontidae is a family of small to medium-sized rhabdodontomorph
  ornithopods from the Late Cretaceous of the European archipelago, including
  Rhabdodon, Zalmoxes, Mochlodon, Matheronodon, and Transylvanosaurus. They were
  stocky, short-faced herbivores with distinctive high-crowned, strongly ridged
  teeth adapted to a tough island flora, and they form a characteristic element
  of the insular faunas of Late Cretaceous Europe.
type_genus: Rhabdodon
erected_in: weishampel2003
described_in: madzia2021
diagnostic_features:
  - Tall, narrow maxillary and dentary teeth with one dominant primary ridge
  - Strongly reduced number of tooth positions
  - Deep, robust dentary
  - Heavily built, short-limbed postcranium
