clade: Albertosaurinae
description: >
  Albertosaurinae is one of the two subfamilies of tyrannosaurid dinosaurs, the
  sister group to the Tyrannosaurinae. It comprises the two described genera
  Albertosaurus and Gorgosaurus, both of which lived in the Late Cretaceous of
  western North America, in what is now the United States and Canada, though
  other undescribed species may belong to the group. Albertosaurines are large
  but relatively lightly built tyrannosaurids. Compared with the
  tyrannosaurines, they are more slender and gracile, with shorter, flatter
  skulls, shorter ilia, and proportionally longer, more running-adapted lower
  legs.
type_genus: Albertosaurus
erected_in: currie2003a
diagnostic_features:
  - Frontal with a vertical postorbital suture anteriorly but a distinct
    horizontal shelf posteriorly
  - Jugal pneumatic recess with a horizontal axis and a relatively small opening
  - Lacrimal pneumatic openings set within a single fossa
  - Maxillary fenestra whose anterior margin terminates behind the anterior
    margin of the antorbital fossa
references:
  - id: currie2003a
