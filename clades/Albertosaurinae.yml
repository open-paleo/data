clade: Albertosaurinae
description: >
  Albertosaurinae is one of the two subfamilies of Tyrannosauridae, erected by
  Currie, Hurum and Sabath (2003) and defined as all tyrannosaurids closer to
  Albertosaurus than to Tyrannosaurus. Its members, Albertosaurus and
  Gorgosaurus, are relatively gracile, long-legged tyrannosaurids of the Late
  Cretaceous of western North America.
type_genus: Albertosaurus
erected_in: currie2003
diagnostic_features:
  - Frontal with a vertical postorbital suture anteriorly but a distinct
    horizontal shelf posteriorly
  - Jugal pneumatic recess with a horizontal axis and a relatively small opening
  - Lacrimal pneumatic openings set within a single fossa
  - Maxillary fenestra whose anterior margin terminates behind the anterior
    margin of the antorbital fossa
references:
  - id: currie2003
    authors: Currie, P. J.; Hurum, J. H.; Sabath, K.
    year: 2003
    title: Skull structure and evolution in tyrannosaurid dinosaurs
    journal: Acta Palaeontologica Polonica
    volume: "48"
    issue: "2"
    pages: 227-234
    url: https://app.pan.pl/article/item/app48-227.html
