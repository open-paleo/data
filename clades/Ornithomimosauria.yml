clade: Ornithomimosauria
description: >
  Ornithomimosauria, the "ostrich dinosaurs," is a clade of maniraptoriform
  coelurosaurian theropods known from the Cretaceous of Asia, North America,
  Europe, and Africa. Basal members retained teeth, while the two derived
  families (Deinocheiridae and Ornithomimidae) developed edentulous, keratinous
  beaks. Ornithomimosaurs were lightly built, long-necked, and long-legged, and
  are widely inferred to have been herbivorous or omnivorous, a marked departure
  from the ancestral carnivorous theropod condition.
type_genus: Ornithomimus
erected_in: barsbold1976b
diagnostic_features:
  - Elongate cervical vertebrae forming a long, gracile neck
  - Reduced or absent dentition, with a keratinous beak in derived members
  - Small, lightly built skull with large orbits
  - Long, slender, cursorial hindlimbs
  - Manus with subequal, elongate metacarpals and weakly curved unguals
dispute:
  summary: >
    The higher placement of Ornithomimosauria within Coelurosauria is unsettled.
    The clade is retained here within Arctometatarsalia, following the
    arctometatarsalian-foot hypothesis (Holtz, 1996), but most recent analyses
    instead recover Ornithomimosauria as an early-diverging lineage of
    Maniraptoriformes and do not support a monophyletic Arctometatarsalia. The
    node is retained conservatively at its current position.
  history:
    - date: "2026-06-30"
      note: >
        Subtree rebuilt and member genera re-placed. The clade is kept under
        Arctometatarsalia, with the competing basal-maniraptoriform hypothesis
        recorded as the unresolved alternative.
references:
