clade: Ornithomimosauria
description: >
  Ornithomimosauria, the "ostrich dinosaurs," is a group of theropod dinosaurs
  that bore a superficial resemblance to modern ostriches. Its members lived
  during the Cretaceous of Laurasia, now Asia, Europe, and North America, with
  possible records from Africa, first appearing in the Early Cretaceous and
  persisting until the close of the period. The most primitive forms, such as
  Pelecanimimus and Shenzhousaurus, retained small teeth, while the more derived
  species of the family Ornithomimidae, including Gallimimus and Struthiomimus,
  had toothless beaks. Ornithomimosaurs were lightly built and long-limbed, with
  feathered bodies and long, powerful hind legs that likely made them among the
  fastest of all dinosaurs. Numerous specimens preserving gastroliths in the
  gut, together with their peculiar hook-like hands, suggest that most were
  herbivores or omnivores rather than the carnivores typical of theropods.
type_genus: Ornithomimus
erected_in: barsbold1976b
diagnostic_features:
  - Elongate cervical vertebrae forming a long, gracile neck
  - Reduced or absent dentition, with a keratinous beak in derived members
  - Small, lightly built skull with large orbits
  - Long, slender, cursorial hindlimbs
  - Manus with subequal, elongate metacarpals and weakly curved unguals
dispute:
  summary: >
    The higher placement of Ornithomimosauria within Coelurosauria is unsettled.
    It is retained here within Arctometatarsalia, the grouping proposed on
    arctometatarsalian-foot evidence by Holtz (1994) and redefined by Holtz (1996)
    as a stem-based clade anchored on Ornithomimus. Most recent analyses instead
    recover Ornithomimosauria as an early-diverging lineage of Maniraptoriformes
    and do not support a monophyletic Arctometatarsalia in its original content;
    Meso et al. (2024) treat that early-diverging maniraptoriform position as the
    prevailing view, though their own analysis displaces Ornithomimosauria from it
    in favor of Alvarezsauria. Cau (2024) recovers a third arrangement, pairing
    Ornithomimosauria with Therizinosauroidea as sister taxa outside Maniraptora.
    The node is retained conservatively at its current position.
  history:
    - date: "2026-06-30"
      note: >
        Subtree rebuilt and member genera re-placed. The clade is kept under
        Arctometatarsalia, with the competing basal-maniraptoriform hypothesis
        recorded as the unresolved alternative.
    - date: "2026-07-28"
      note: Retained under Arctometatarsalia; the competing early-diverging
        maniraptoriform hypothesis is recorded here rather than on member genera.
references:
  - id: barsbold1976b
    notes: Erected the clade Ornithomimosauria.
  - id: lee2014a
    notes: Redescription of Deinocheirus establishing the division of
      Ornithomimosauria into Deinocheiridae and Ornithomimidae.
  - id: holtz1994a
    notes: Proposed Arctometatarsalia on arctometatarsalian-foot evidence,
      recovering Ornithomimosauria within it as sister to Troodontidae in
      Bullatosauria.
  - id: holtz1996a
    notes: Replaced the apomorphy-based definition of Arctometatarsalia with a
      stem-based one anchored on Ornithomimus, and coined Maniraptoriformes.
  - id: cau2024a
    notes: Recovered Ornithomimosauria as the sister group of Therizinosauroidea,
      both outside Maniraptora; no support values are reported.
  - id: meso2024a
    notes: Treats an early-diverging maniraptoriform position for
      Ornithomimosauria as the prevailing view, recovering Alvarezsauria in that
      position instead.
