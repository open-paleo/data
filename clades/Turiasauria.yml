clade: Turiasauria
description: >
  Turiasauria is a clade of non-neosauropod eusauropod dinosaurs erected by
  Royo-Torres, Cobos and Alcalá (2006), defined as all eusauropods more closely
  related to Turiasaurus riodevensis than to Saltasaurus loricatus. Originally
  recognized for a Late Jurassic Iberian radiation (Turiasaurus, Losillasaurus,
  Zby), the clade is now known from the Middle Jurassic to Early Cretaceous of
  Europe, Africa, and North America (Mierasaurus, Moabosaurus, Amanzia,
  Narindasaurus, Tendaguria). Turiasaurs lie within Eusauropoda but outside
  Neosauropoda.
erected_in: royo-torres2006a
diagnostic_features:
  - Heart-shaped (cordiform) tooth crowns
  - Vertically oriented cervical neural spines
  - Absence of prespinal and postspinal laminae on the dorsal vertebrae
  - Proximal end of the humerus deflected medially with a prominent deltopectoral crest
  - Vertical ridge on the caudal surface of the distal half of the ulna
references:
  - id: royo-torres2006a
    notes: Erected Turiasauria.
