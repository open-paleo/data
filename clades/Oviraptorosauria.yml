clade: Oviraptorosauria
description: >
  Oviraptorosauria is a clade of feathered maniraptoran theropods from the
  Cretaceous of Asia and North America, most closely related to Paraves within
  Pennaraptora. They are characterized by short, deep skulls trending toward
  edentulism and a keratinous beak, and range from small, long-snouted
  early-diverging forms (Incisivosaurus, Caudipteryx) to the large, crested
  oviraptorids and the toothless caenagnathids of the derived clade
  Caenagnathoidea. Most were herbivores or omnivores, and several are preserved
  with pennaceous feathers, brooding postures, or gastroliths.
type_genus: Oviraptor
erected_in: barsbold1976b
described_in: funston2018
diagnostic_features:
  - Short, deep skull with a reduced dentition trending toward edentulism
  - Downturned, robust dentary with an extensive symphysis
  - Pneumatic, tall-spined cervical vertebrae with a long, mobile neck
  - Shortened tail, in derived members terminating in coossified distal caudals
  - Large, three-fingered grasping hand (reduced in derived oviraptorids)
