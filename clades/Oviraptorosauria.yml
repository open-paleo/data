clade: Oviraptorosauria
description: >
  Oviraptorosauria is a clade of feathered, bipedal maniraptoran theropods from
  the Cretaceous of what are now Asia and North America, and among the dinosaur
  groups closest to the ancestry of birds. Its members are distinguished by
  short, deep, parrot-like skulls, often bearing bony crests, with jaws that
  carry few or no teeth. The most primitive forms, such as Caudipteryx and
  Incisivosaurus, retain a few front teeth, in the latter enlarged into
  prominent bucktoothed incisors, while more derived members are toothless. The
  group spans a wide size range, from turkey-sized early-diverging species to
  the eight-meter Gigantoraptor, and its more advanced members are typically
  divided between the toothless caenagnathids and the crested oviraptorids.
  Several species are preserved with pennaceous feathers on the wings and tail,
  and oviraptorids are famously known from specimens frozen in a brooding
  posture over circular clutches of eggs. Their diet appears to have been
  generalized, ranging from herbivory to omnivory, with some evidence of small
  vertebrates and gastroliths.
type_genus: Oviraptor
erected_in: barsbold1976b
described_in: funston2018a
diagnostic_features:
  - Short, deep skull with a reduced dentition trending toward edentulism
  - Downturned, robust dentary with an extensive symphysis
  - Pneumatic, tall-spined cervical vertebrae with a long, mobile neck
  - Shortened tail, in derived members terminating in coossified distal caudals
  - Large, three-fingered grasping hand (reduced in derived oviraptorids)
