  - source: eol
    id: "42332582"
erected_in: barsbold1976b
described_in: maryańska2002a
diagnostic_features:
  - Short, deep skull with a reduced dentition trending toward edentulism
  - Downturned, robust dentary with an extensive symphysis
  - Pneumatic, tall-spined cervical vertebrae with a long, mobile neck
  - Shortened tail, in derived members terminating in coossified distal caudals
  - Large, three-fingered grasping hand (reduced in derived oviraptorids)
references:
  - id: barsbold1976b
    notes: Diagnosed the infraorder Oviraptorosauria, with Oviraptoridae as its
      only family, crediting the name to Barsbold (1974).
  - id: barsbold1974a
    notes: The 1974 Barsbold paper credited with the name Oviraptorosauria in
      Barsbold (1976).
  - id: maryańska2002a
    notes: Defined Oviraptorosauria as the most inclusive clade containing
      Oviraptor philoceratops but not Passer domesticus, and diagnosed it by five
      unambiguous synapomorphies.
  - id: funston2018a
    notes: Reviewed the anatomy, diversity and ecology of the oviraptorosaurs of
      the Nemegt Basin.
