clade: Neoceratopsia
description: >
  Neoceratopsia is the major clade of ceratopsians containing all forms closer to
  Triceratops than to Chaoyangsaurus or Psittacosaurus. It encompasses a grade of
  small basal taxa (such as Liaoceratops, Aquilops, and Auroraceratops) leading to
  Euceratopsia, the clade uniting Leptoceratopsidae with the frilled and horned
  Coronosauria. Neoceratopsians show a progressive enlargement of the skull and
  development of the parietosquamosal frill.
erected_in: sereno1986
described_in: madzia2021
diagnostic_features:
  - Enlarged skull relative to body size
  - Development of a parietosquamosal frill from the rear of the skull
  - Epijugal ossification capping the jugal
  - Strongly keeled, vaulted rostral and predentary forming a deep beak
