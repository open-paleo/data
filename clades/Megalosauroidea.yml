clade: Megalosauroidea
description: >
  Megalosauroidea is a superfamily of basal tetanuran theropods that unites the
  family Piatnitzkysauridae with the clade Megalosauria (Megalosauridae plus
  Spinosauridae). Defined as all theropods closer to Megalosaurus than to
  Allosaurus or Tyrannosaurus, it ranges from the Middle Jurassic to the Late
  Cretaceous and includes large-bodied terrestrial predators as well as the
  elongate-snouted, semiaquatic spinosaurids. Spinosauroidea and Torvosauroidea
  are junior synonyms.
type_genus: Megalosaurus
erected_in: fitzinger1843a
described_in: carrano2012a
diagnostic_features:
  - U-shaped ventral process of the postorbital
  - Chevrons whose proximal articular surface lacks distinct anterior and
    posterior facets
  - Iliac pubic peduncle with a length-to-width ratio of about 1.3 to 1.4
  - Anterior dorsal vertebrae with prominent ventral keels inset from the lateral
    surfaces
  - Step-like ridge within the infrapostzygapophyseal fossa of the dorsal
    vertebrae
  - Dorsal neural spines about 1.4 to 1.7 times the centrum height
dispute:
  summary: >
    The monophyly of Megalosauroidea is contested. Most analyses recover it as a
    clade of Piatnitzkysauridae plus Megalosauria (Carrano et al., 2012; Benson,
    2010; Rauhut et al., 2016), but Rauhut and Pol (2019) recover the traditional
    megalosauroids as a paraphyletic grade of successive outgroups to
    Allosauroidea within Carnosauria, and Zou et al. (2025) recover
    Piatnitzkysauridae outside Megalosauroidea as the sister group of
    Avetheropoda. Heavy homoplasy at the base of Tetanurae leaves these
    relationships weakly resolved.
  history:
    - date: "2026-07-01"
      note: Retained as a monophyletic clade (Piatnitzkysauridae + Megalosauria) following the prevailing analyses; the paraphyletic-grade hypothesis and the exclusion of Piatnitzkysauridae remain unresolved.
references:
  - id: fitzinger1843a
    notes: Origin of the family-group name Megalosauridae, and by coordination
      the superfamily Megalosauroidea.
  - id: carrano2012a
  - id: rauhut2019a
    notes: Recovered traditional megalosauroids as a paraphyletic grade outside Allosauroidea within Carnosauria.
  - id: zou2025a
    notes: Recovered Piatnitzkysauridae outside Megalosauroidea in a new metriacanthosaurid phylogenetic analysis.
