clade: Abelisauroidea
description: >
  Abelisauroidea is a diverse superfamily of ceratosaurian theropod dinosaurs,
  divided into two families: the abelisaurids and the noasaurids. Though
  typically regarded as a Cretaceous group, its origins trace back to at least
  the Middle Jurassic, when abelisauroids had a nearly global distribution. By
  the Cretaceous they had disappeared from Asia and North America, possibly
  outcompeted by tyrannosauroids, and flourished instead across the southern
  continents of Gondwana, where the advanced abelisaurids persisted as dominant
  terrestrial predators until the Cretaceous-Paleogene extinction 66 million
  years ago. The group spanned a wide range of forms, from small, nimble,
  lightly built noasaurids, some barely 5 feet (1.5 meters) long, to large,
  deep-skulled abelisaurids. Noasaurids retained comparatively long, usable
  arms, whereas the forelimbs of abelisaurids were reduced to tiny, diminished
  stubs.
type_genus: Abelisaurus
erected_in: bonaparte1991b
diagnostic_features:
  - Elongate cervical vertebrae with epipophyses and low neural spines
  - Anterior cervical ribs directed strongly anteroventrally
  - Femur with a proximally placed, medially oriented head and reduced
    trochanteric shelf
references:
  - id: bonaparte1991b
    notes: United Abelisauridae and Noasauridae as closely related Gondwanan
      theropod families, the basis for the superfamily Abelisauroidea.
