clade: Abelisauroidea
description: >
  Abelisauroidea is the superfamily uniting the two major Cretaceous ceratosaur
  radiations, Abelisauridae and Noasauridae, as sister families. Named by
  Bonaparte for the Gondwanan theropod families he recognized as close
  relatives, it is the least-inclusive clade containing both Abelisaurus and
  Noasaurus. Abelisauroids were the dominant terrestrial predators of the
  southern continents through much of the Cretaceous, spanning small, gracile
  noasaurids to large, deep-skulled abelisaurids.
type_genus: Abelisaurus
erected_in: bonaparte1991b
diagnostic_features:
  - Elongate cervical vertebrae with epipophyses and low neural spines.
  - Anterior cervical ribs directed strongly anteroventrally.
  - Femur with a proximally placed, medially oriented head and reduced
    trochanteric shelf.
references:
  - id: bonaparte1991b
    notes: United Abelisauridae and Noasauridae as closely related Gondwanan
      theropod families, the basis for the superfamily Abelisauroidea.
