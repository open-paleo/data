clade: Saurischia
description: >
  Saurischia, meaning "lizard-hipped," is one of the two major divisions of
  dinosaurs, distinguished from the ornithischians by hip structure. Its members
  retain the ancestral, three-pronged pelvic arrangement in which the pubis
  points forward, the same configuration seen in modern lizards and other
  reptiles, rather than the backward-rotated pubis of ornithischians. The group
  encompasses the mostly carnivorous, typically bipedal theropods together with
  the long-necked, herbivorous sauropodomorphs, and because birds are a lineage
  of maniraptoran theropods, they too fall within Saurischia. It is
  traditionally defined as all dinosaurs more closely related to birds than to
  Triceratops. All saurischians except birds died out in the
  Cretaceous-Paleogene extinction event at the end of the Cretaceous, while
  birds survive as the clade's only living descendants.
erected_in: seeley1888b
diagnostic_features:
  - Forward-pointing (anteroventrally directed) pubis in basal members
  - Elongate, mobile neck with cervical vertebrae bearing well-developed
    pleurocoels
  - Asymmetrical hand with digit II longest
  - Subnarial foramen present between premaxilla and maxilla
