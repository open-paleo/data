clade: Apatosaurinae
description: >
  Apatosaurinae is one of the two subfamilies of diplodocid sauropods, the other
  being Diplodocinae, together forming the family Diplodocidae. It contains the
  large, robustly built genera Apatosaurus and Brontosaurus, with the dubious
  Amphicoelias and a species sometimes placed in Atlantosaurus proposed as
  further possible members. All of its members lived during the Late Jurassic
  and are known from the Morrison Formation of the western United States,
  roughly 157 to 147 million years ago. The clade is stem-based, encompassing
  all diplodocids closer to Apatosaurus than to Diplodocus. Compared with the
  more gracile diplodocines, apatosaurines were stockier animals with
  proportionally shorter necks built from short, boxy, heavily constructed
  cervical vertebrae, and their forelimbs and shoulder girdles were unusually
  massive. The exceptional robustness of the neck has prompted the suggestion
  that these sauropods used their necks in combat between individuals.
type_genus: Apatosaurus
erected_in: huene1927c
described_in: tschopp2015a
diagnostic_features:
  - Cervical ribs massive and ventrally displaced well below the centrum
  - Cervical vertebrae short and stout relative to those of diplodocines
  - Robustly constructed forelimb and pectoral girdle
references:
  - id: huene1927c
    notes: Work credited as the authority for the subfamily Apatosaurinae.
  - id: tschopp2015a
    notes: Validly applied Apatosaurinae in a phylogenetic context and
      resurrected Brontosaurus as a distinct genus.
