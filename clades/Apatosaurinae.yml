clade: Apatosaurinae
description: >
  Apatosaurinae is the diplodocid subfamily containing the robustly built
  Apatosaurus and Brontosaurus, known from the Late Jurassic Morrison Formation
  of North America. Apatosaurines are distinguished from the more gracile
  diplodocines by their massive, heavily constructed necks and forelimbs. The
  subfamily was credited to Huene (1927) and validly applied in a phylogenetic
  framework by Tschopp et al. (2015); it is defined as the stem-based clade of
  all diplodocids more closely related to Apatosaurus than to Diplodocus.
type_genus: Apatosaurus
erected_in: huene1927c
described_in: tschopp2015a
diagnostic_features:
  - Cervical ribs massive and ventrally displaced well below the centrum.
  - Cervical vertebrae short and stout relative to those of diplodocines.
  - Robustly constructed forelimb and pectoral girdle.
references:
  - id: huene1927c
    notes: Work credited as the authority for the subfamily Apatosaurinae.
  - id: tschopp2015a
    notes: Validly applied Apatosaurinae in a phylogenetic context and
      resurrected Brontosaurus as a distinct genus.
