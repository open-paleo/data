clade: Spinosauridae
description: >
  Spinosauridae is a family of specialized megalosauroid theropods from the
  Cretaceous of Africa, Europe, Asia and South America. Sister to Megalosauridae
  within Megalosauria, it comprises the subfamilies Baryonychinae and
  Spinosaurinae, the latter including the giant, semiaquatic Spinosaurus.
  Spinosaurids are distinguished by elongate, crocodile-like snouts, subconical
  teeth with reduced or absent serrations, enlarged first-finger claws, and, in
  derived forms, tall dorsal neural spines that form a sail. Baryonychidae is a
  junior synonym.
type_genus: Spinosaurus
erected_in: stromer1915a
diagnostic_features:
  - Elongate, laterally compressed (crocodile-like) rostrum
  - Subconical teeth with reduced or absent serrations
  - Dorsal neural spines 1.9 or more times the centrum height, forming a sail in
    derived taxa
