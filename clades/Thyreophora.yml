clade: Thyreophora
description: >
  Thyreophora, meaning "shield bearers," is the clade of armored ornithischian
  dinosaurs that includes Stegosauria and Ankylosauria together with a basal
  grade of early-diverging forms (Scutellosaurus, Emausaurus, Scelidosaurus, and
  relatives). Thyreophorans are characterized by dermal armor in the form of
  osteoderms (bony scutes, plates, or spines) arranged in parasagittal rows. The
  clade appeared in the Early Jurassic and persisted to the end of the
  Cretaceous, with the basal members being small and facultatively bipedal and
  the derived eurypodans large obligate quadrupeds.
erected_in: nopcsa1915
described_in: madzia2021
diagnostic_features:
  - Parasagittal rows of keeled dermal osteoderms along the dorsal surface
  - Low, transversely broad jugal with a horizontally expanded anterior process
  - Postorbital region of the skull roof thickened and rugose
  - Robust, low-slung body plan trending toward obligate quadrupedality
  - Simple, low-crowned, leaf-shaped cheek teeth
