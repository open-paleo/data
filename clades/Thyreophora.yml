clade: Thyreophora
description: >
  Thyreophora, meaning "shield bearers," is a clade of armored ornithischian
  dinosaurs. It contains two major subgroups, the plated stegosaurs and the
  heavily armored ankylosaurs, together with a grade of early-diverging forms
  such as Scutellosaurus, Emausaurus, and Scelidosaurus. Its members are defined
  by body armor arranged in longitudinal rows along the back and flanks:
  primitive forms bore simple low keeled scutes, while more derived members
  developed elaborate spikes and plates. Thyreophorans first appeared in the
  Early Jurassic and persisted until the end of the Cretaceous. The earliest
  species were small and at least partly bipedal, but the group trended toward a
  robust, low-slung body plan, with the large stegosaurs and ankylosaurs
  becoming obligate quadrupeds whose forelimbs were much shorter than their
  hindlimbs.
erected_in: nopcsa1915a
described_in: madzia2021a
diagnostic_features:
  - Parasagittal rows of keeled dermal osteoderms along the dorsal surface
  - Low, transversely broad jugal with a horizontally expanded anterior process
  - Postorbital region of the skull roof thickened and rugose
  - Robust, low-slung body plan trending toward obligate quadrupedality
  - Simple, low-crowned, leaf-shaped cheek teeth
