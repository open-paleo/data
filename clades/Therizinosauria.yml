clade: Therizinosauria
description: >
  Therizinosauria is the clade of secondarily herbivorous maniraptoran
  theropods, formerly known as "Segnosauria," ranging from the Early
  Cretaceous to the end of the Cretaceous of Asia and North America, with its
  most contentious basal members reaching back into the Early Jurassic. The
  clade spans a transition from small, lightly built early-diverging forms
  retaining grasping hands and functionally tridactyl feet to large-bodied
  later members with barrel-shaped guts, opisthopubic pelves, small
  leaf-toothed skulls bearing a rhamphotheca, and greatly enlarged manual
  unguals. Falcarius and Fukuivenator are among the earliest-diverging members,
  while Therizinosaurus and the therizinosaurids represent the derived extreme.
erected_in: russell1997a
described_in: zanno2010a
diagnostic_features:
  - Distal reduction in dentary tooth size combined with a high tooth count set
    in interdental plates behind a downturned, buccally emarginated dentary
  - Small lanceolate crowns with coarse denticles and a constricted base
  - Enlarged, mediolaterally compressed manual unguals
  - Opisthopubic pelvis with a broadly everted preacetabular process of the ilium
  - Reduced, robust pes trending toward a functionally weight-bearing first digit
dispute:
  summary: >
    The position of Therizinosauria within Maniraptoriformes is unsettled.
    Historically therizinosaurs were recovered within Maniraptora, often as the
    sister group of Oviraptorosauria or of Paraves. More recent analyses
    disagree: Hartman et al. (2019) recover Therizinosauria and Alvarezsauroidea
    as the first-branching maniraptorans, whereas Cau (2024) recovers
    Therizinosauria as the sister group of Ornithomimosauria and outside
    Maniraptora. Support for each alternative is weak, and no single hypothesis
    has become consensus.
  history:
    - date: "2026-07-01"
      note: >
        Placed conservatively within Maniraptoriformes following the least
        inclusive uncontested position; the finer sister-group question
        remains unresolved.
references:
  - id: russell1997a
  - id: zanno2010a
