clade: Therizinosauria
description: >
  Therizinosauria is a clade of secondarily herbivorous maniraptoran theropods,
  once known as segnosaurs, whose fossils come mainly from Cretaceous rocks of
  Asia and North America, with fragmentary remains hinting at a history reaching
  back into the Jurassic of Asia and Europe. Its members range from small,
  lightly built early-diverging forms such as Falcarius and Beipiaosaurus to the
  giant Therizinosaurus, which grew around 10 meters long and ranks among the
  largest known theropods. They combined a puzzling mix of traits: long necks,
  wide barrel-shaped torsos, and four-toed walking feet reminiscent of basal
  sauropodomorphs, together with backward-pointing, partly fused hip bones that
  once suggested a link to the bird-hipped ornithischians. Their most striking
  feature is the enormous claws on their hands, reaching roughly a meter in
  Therizinosaurus, which they likely used to grasp and shear leafy branches much
  as later mammals like ground sloths and giant pandas did. Skin impressions
  show that at least some members bore a coat of down-like feathers along with
  longer, quill-like structures that may have served in display.
erected_in: russell1997a
described_in: zanno2010a
diagnostic_features:
  - Distal reduction in dentary tooth size combined with a high tooth count set
    in interdental plates behind a downturned, buccally emarginated dentary
  - Small lanceolate crowns with coarse denticles and a constricted base
  - Enlarged, mediolaterally compressed manual unguals
  - Opisthopubic pelvis with a broadly everted preacetabular process of the ilium
  - Reduced, robust pes trending toward a functionally weight-bearing first digit
dispute:
  summary: >
    The position of Therizinosauria within Maniraptoriformes is unsettled.
    Historically therizinosaurs were recovered within Maniraptora, often close
    to Oviraptorosauria (Zanno, 2010), a pairing Hartman and colleagues (2019)
    find much less likely. More recent analyses disagree: Hartman and colleagues
    (2019) recover Therizinosauria and Alvarezsauroidea as the first-branching
    maniraptorans, whereas Cau (2024) recovers Therizinosauria as the sister
    group of Ornithomimosauria and outside Maniraptora. Hartman and colleagues
    (2019) find the base of Maniraptoriformes less well supported than consensus
    suggests, with alternative arrangements only a few steps longer.
  history:
    - date: "2026-07-01"
      note: >
        Placed conservatively within Maniraptoriformes following the least
        inclusive uncontested position; the finer sister-group question
        remains unresolved.
references:
  - id: russell1997a
    notes: Defined and diagnosed Therizinosauria in an encyclopedia entry, as
      six named genera and all taxa closer to them; Zanno (2010) credits the
      name to this paper.
  - id: zanno2010a
    notes: Redefined Therizinosauria as the most inclusive clade containing
      Therizinosaurus cheloniformis but not Tyrannosaurus, Ornithomimus,
      Mononykus, Oviraptor or Troodon.
  - id: cau2024a
    notes: Recovered Therizinosauria as the sister group of Ornithomimosauria and outside Maniraptora.
  - id: hartman2019a
    notes: Recovered Therizinosauria and Alvarezsauroidea as first-branching maniraptorans.
