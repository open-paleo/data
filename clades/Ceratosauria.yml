clade: Ceratosauria
description: >
  Ceratosauria is a clade of early-diverging averostran theropod dinosaurs that
  radiated through the Jurassic and Cretaceous, reaching its greatest diversity
  on the Gondwanan landmasses. It comprises a grade of basal ceratosaurs, the
  Jurassic Ceratosauridae, and the derived Abelisauroidea (abelisaurids plus
  noasaurids). Many ceratosaurs bear prominent cranial ornamentation, and the
  group retains a four-fingered hand in its basal members, in contrast to the
  reduced manus of tetanurans.
type_genus: Ceratosaurus
erected_in: marsh1884a
diagnostic_features:
  - Cranial ornamentation (horns, bosses, or rugose crests) in many members.
  - Extensive fusion of the pelvic elements, and of the astragalus and
    calcaneum to the tibia, in mature individuals.
  - Four functional digits retained on the manus in basal members.
  - Sacral and anterior caudal vertebrae with distinctive interlocking
    articulations in derived forms.
references:
  - id: marsh1884a
    notes: Named Ceratosaurus and the order Ceratosauria, along with the family
      Ceratosauridae, on a near-complete skeleton from the Morrison Formation of
      Garden Park, Colorado.
