clade: Ceratosauria
description: >
  Ceratosauria is a clade of theropod dinosaurs that ranged from the Early
  Jurassic through the end of the Cretaceous, reaching its greatest diversity on
  the southern landmasses of Gondwana. It is composed of three major groups: the
  Ceratosauridae, the Noasauridae, and the Abelisauridae, the last of which
  thrived across the southern continents until the mass extinction 66 million
  years ago. Earlier definitions also placed the coelophysoids and
  dilophosaurids within the group, but most recent work excludes them, treating
  ceratosaurs as a more restricted assemblage. Members are generally moderately
  large predators, ranging from small, lightly built noasaurs to the bulky
  Carnotaurus. The clade is distinguished by a robust, often heavily ornamented
  or tall skull and by a marked shortening of the forelimbs, features that grow
  more pronounced in later forms such as the abelisaurids, while basal members
  remain closer in build to other early theropods.
type_genus: Ceratosaurus
erected_in: marsh1884a
described_in: carrano2008a
diagnostic_features:
  - Camellate internal pneumatic structure of the presacral vertebrae
  - Six sacral vertebrae, incorporating an additional dorsosacral
  - Strongly pneumatic sacral neural spines with paired lateral fossae and
    foramina
  - Very low deltopectoral crest on the humerus
  - Continuous ridge on the lateral ilium linking the supra-acetabular crest to
    the brevis shelf
  - Distal ischium expanded into a fused, anteroposteriorly elongate triangular
    foot
  - Enlarged iliofibularis tubercle on the fibula
  - Astragalar distal condyles rotated 10 to 30 degrees anteriorly
  - Fusion of the pelvic elements and of the astragalus and calcaneum in mature
    individuals
references:
  - id: marsh1884a
    notes: Named Ceratosaurus and the order Ceratosauria, along with the family
      Ceratosauridae, on a near-complete skeleton from the Morrison Formation of
      Garden Park, Colorado.
  - id: carrano2008a
    notes: Phylogenetic monograph rediagnosing Ceratosauria (Ceratosaurus plus
      Abelisauroidea) and the source of its diagnostic characters.
