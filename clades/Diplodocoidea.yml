clade: Diplodocoidea
description: >
  Diplodocoidea is a superfamily of neosauropod dinosaurs comprising the
  narrow-snouted rebbachisaurids, the short-necked high-spined dicraeosaurids,
  and the extremely elongate diplodocids, together with basal forms such as
  Haplocanthosaurus. Diplodocoids share slender, pencil-like teeth restricted to
  the front of the jaws, retracted external nares, and squared-off snouts. The
  superfamily is defined as the stem-based clade of all neosauropods more closely
  related to Diplodocus than to Saltasaurus (Wilson and Sereno, 1998).
type_genus: Diplodocus
erected_in: marsh1884diplodocidae
described_in: wilson1998a
diagnostic_features:
  - Tooth crowns slender and subcylindrical (pencil-like), restricted to the
    anterior part of the jaws.
  - External nares retracted to a position dorsal to or behind the orbits.
  - Elevated tooth replacement rates with multiple replacement teeth per
    alveolus.
  - Squared-off (rather than rounded) anterior margin of the snout in dorsal
    view.
references:
  - id: marsh1884diplodocidae
  - id: wilson1998a
    notes: Provided the stem-based phylogenetic definition of Diplodocoidea.
