clade: Diplodocoidea
description: >
  Diplodocoidea is a superfamily of sauropod dinosaurs that includes some of the
  longest animals ever to have lived. It brings together the narrow-snouted
  rebbachisaurids, the short-necked, high-spined dicraeosaurids, and the
  extremely elongate diplodocids, along with basal forms such as
  Haplocanthosaurus. Most diplodocoids had very long necks and long, whip-like
  tails, and among their ranks are slender giants like Supersaurus, Diplodocus,
  and Apatosaurus. The dicraeosaurids are the only known sauropods to have
  re-evolved a short neck, presumably an adaptation for feeding close to the
  ground, a trend taken to the extreme in the highly specialized
  Brachytrachelopan. Diplodocoids are distinguished by slender, pencil-like
  teeth restricted to the front of the jaws and squared-off snouts, and they had
  the highest tooth replacement rates of any vertebrates, with some forms
  erupting new teeth roughly every month.
type_genus: Diplodocus
erected_in: marsh1884b
described_in: wilson1998a
diagnostic_features:
  - Tooth crowns slender and subcylindrical (pencil-like), restricted to the
    anterior part of the jaws
  - External nares retracted to a position dorsal to or behind the orbits
  - Elevated tooth replacement rates with multiple replacement teeth per
    alveolus
  - Squared-off (rather than rounded) anterior margin of the snout in dorsal
    view
references:
  - id: marsh1884b
  - id: wilson1998a
    notes: Provided the stem-based phylogenetic definition of Diplodocoidea.
