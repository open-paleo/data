clade: Unaysauridae
description: >
  Unaysauridae is a clade of early-diverging plateosaurian sauropodomorphs from
  the Late Triassic of Brazil and India, comprising Unaysaurus, Macrocollum, and
  Jaklapallisaurus. Its members are small to medium-sized, long-necked bipeds
  recovered as the sister group of (or basalmost branch within) Plateosauria.
  United mainly by an astragalus with a cranially expanded medial condyle, the
  family's validity has been questioned because some of its synapomorphies rest
  on incomplete material.
type_genus: Unaysaurus
erected_in: müller2018a
dispute:
  summary: >
    Unaysauridae (Unaysaurus, Macrocollum, Jaklapallisaurus) is recovered as a
    valid clade sister to Plateosauria by Müller and others (2018) and is used
    in classification by Jones (2026), but its validity is contested: Beccari and
    others (2021) instead recover Macrocollum and Unaysaurus at the base of
    Plateosauridae and note that its diagnostic astragalar and promaxillary
    characters cannot be confirmed across all members owing to missing material.
  history:
    - date: "2026-06-29"
      note: Kept as a clade following Müller and others (2018) and Jones (2026)
        (P4); the alternative nesting within Plateosauridae (Beccari and others,
        2021) and the validity concerns are recorded here rather than on each
        member genus (P6).
diagnostic_features:
  - Astragalus with a cranially expanded medial condyle (about 1.6 times the
    craniocaudal length of the lateral condyle)
  - Promaxillary fenestra present (where the skull is known)
  - Longitudinal ventral sulcus on the proximal and middle caudal centra
references:
  - id: müller2018a
    authors: Müller, R. T.; Langer, M. C.; Dias-da-Silva, S.
    year: 2018
    title: "An exceptionally preserved association of complete dinosaur skeletons
      reveals the oldest long-necked sauropodomorphs"
    journal: Biology Letters
    volume: "14"
    issue: "11"
    pages: "20180633"
    doi: 10.1098/rsbl.2018.0633
    url: http://dx.doi.org/10.1098/rsbl.2018.0633
    notes: Erected Unaysauridae.
