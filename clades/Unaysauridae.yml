clade: Unaysauridae
description: >
  Unaysauridae is a clade of early-branching sauropodomorph dinosaurs from the
  Late Triassic of Brazil and India, comprising Unaysaurus, Macrocollum, and
  Jaklapallisaurus. These were small to medium-sized, long-necked bipeds
  recovered as the sister group to the more derived plateosaurs. Members are
  united chiefly by a strongly expanded front portion of the inner ankle bone
  and, where the skull is known, by an extra opening in the upper jaw. The
  grouping's validity has been questioned, since several of its defining traits
  cannot be confirmed across all its members owing to their incomplete and
  fragmentary remains, and some analyses instead place Unaysaurus and
  Macrocollum among the plateosaurids.
type_genus: Unaysaurus
erected_in: müller2018a
dispute:
  summary: >
    Unaysauridae (Unaysaurus, Macrocollum, Jaklapallisaurus) is recovered as a
    valid clade sister to Plateosauria by Müller and others (2018) and is used
    in classification by Jones (2026), but its validity is contested: Beccari and
    others (2021) instead recover Macrocollum and Unaysaurus at the base of
    Plateosauridae and note that its diagnostic astragalar and promaxillary
    characters cannot be confirmed across all members owing to missing material.
  history:
    - date: "2026-06-29"
      note: Kept as a clade following Müller and others (2018) and Jones (2026);
        the alternative nesting within Plateosauridae (Beccari and others,
        2021) and the validity concerns are recorded here rather than on each
        member genus.
diagnostic_features:
  - Astragalus with a cranially expanded medial condyle (about 1.6 times the
    craniocaudal length of the lateral condyle)
  - Promaxillary fenestra present (where the skull is known)
  - Longitudinal ventral sulcus on the proximal and middle caudal centra
references:
  - id: müller2018a
    notes: Erected Unaysauridae.
  - id: beccari2021a
    notes: Contested the validity of the unaysaurid genera.
  - id: jones2026b
    notes: Placement and assessment in the Princeton Encyclopedia of Dinosaurs.
