clade: Unaysauridae
rank: family
type_genus: Unaysaurus
erected_in: müller2018a
dispute:
  summary: >
    Unaysauridae (Unaysaurus, Macrocollum, Jaklapallisaurus) is recovered as a
    valid clade sister to Plateosauria by Müller and colleagues (2018), but its
    validity is contested: Beccari and colleagues (2021) instead recover
    Macrocollum and Unaysaurus at the base of Plateosauridae and note that its
    diagnostic astragalar and promaxillary characters cannot be confirmed across
    all members owing to missing material. Membership and position are both
    unsettled. Ezcurra and colleagues (2023) recovered the clade sister to
    Plateosauridae but with resampling frequencies below 30%, and Barrett and
    colleagues (2026) recovered it comprising Unaysaurus, Macrocollum,
    Pradhania, Musango and Musankwa — excluding Jaklapallisaurus — sitting
    outside Massopoda in their strict consensus but as the earliest-diverging
    clade within Massopoda in some of their most-parsimonious trees. Wang and
    colleagues (2025) did not recover the clade at all, splitting Unaysaurus
    into Plateosauridae alongside Plateosaurus while grouping Macrocollum with
    Pradhania and Musankwa at the base of Massopoda.
diagnostic_features:
  - Astragalus with a cranially expanded medial condyle (about 1.6 times the
    craniocaudal length of the lateral condyle)
  - Promaxillary fenestra present (where the skull is known)
  - Longitudinal ventral sulcus on the proximal and middle caudal centra
references:
  - id: müller2018a
    notes: Erected Unaysauridae.
  - id: beccari2021a
    notes: Questioned the validity of Unaysauridae, citing missing data and
      fragmentary specimens, and tested it in the analysis describing Issi.
  - id: ezcurra2023a
    notes: Recovered Unaysauridae sister to Plateosauridae at low resampling
      support.
  - id: wang2025a
    notes: Did not recover Unaysauridae, placing Unaysaurus with Plateosaurus.
  - id: jones2026b
    notes: Reviews Unaysauridae, of Unaysaurus, Macrocollum and
      Jaklapallisaurus, noting its validity has been questioned and its position
      relative to Plateosauridae varies.
  - id: barrett2026a
    notes: Expanded Unaysauridae to include Pradhania, Musango and Musankwa while
      excluding Jaklapallisaurus.
