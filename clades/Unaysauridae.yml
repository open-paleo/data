clade: Unaysauridae
description: >
  Unaysauridae is a clade of early-branching sauropodomorph dinosaurs from the
  Late Triassic of Gondwana, erected for the Brazilian Unaysaurus and Macrocollum
  together with the Indian Jaklapallisaurus. These were small to medium-sized,
  long-necked bipeds recovered as the sister group to the more derived
  plateosaurs. Members are united chiefly by a strongly expanded front portion of
  the inner ankle bone and, where the skull is known, by an extra opening in the
  upper jaw. Which genera belong is unsettled: later work has added the Indian
  Pradhania and the Zimbabwean Musango and Musankwa while dropping
  Jaklapallisaurus, and the grouping's validity has been questioned, since
  several of its defining traits cannot be confirmed across all its members owing
  to their incomplete and fragmentary remains, and some analyses instead place
  Unaysaurus and Macrocollum among the plateosaurids.
type_genus: Unaysaurus
erected_in: müller2018a
dispute:
  summary: >
    Unaysauridae (Unaysaurus, Macrocollum, Jaklapallisaurus) is recovered as a
    valid clade sister to Plateosauria by Müller and others (2018) and is used
    in classification by Jones (2026), but its validity is contested: Beccari and
    others (2021) instead recover Macrocollum and Unaysaurus at the base of
    Plateosauridae and note that its diagnostic astragalar and promaxillary
    characters cannot be confirmed across all members owing to missing material.
    Membership and position are both unsettled. Ezcurra and others (2023)
    recovered the clade sister to Plateosauridae but with resampling frequencies
    below 30%, and Barrett and others (2026) recovered it comprising Unaysaurus,
    Macrocollum, Pradhania, Musango and Musankwa — excluding Jaklapallisaurus —
    sitting outside Massopoda in their strict consensus but as the
    earliest-diverging clade within Massopoda in some of their most-parsimonious
    trees. Wang and others (2025) did not recover the clade at all, splitting
    Unaysaurus into Plateosauridae alongside Plateosaurus while grouping
    Macrocollum with Pradhania and Musankwa at the base of Massopoda.
  history:
    - date: "2026-06-29"
      note: Kept as a clade following Müller and others (2018) and Jones (2026);
        the alternative nesting within Plateosauridae (Beccari and others,
        2021) and the validity concerns are recorded here rather than on each
        member genus.
    - date: "2026-08-04"
      note: Kept as a clade and kept under Plateosauria; the disagreement over
        which genera belong and over whether the clade sits inside or outside
        Massopoda is recorded here, with the affected genera whose own placement
        is unresolved held at Plateosauria incertae sedis.
diagnostic_features:
  - Astragalus with a cranially expanded medial condyle (about 1.6 times the
    craniocaudal length of the lateral condyle)
  - Promaxillary fenestra present (where the skull is known)
  - Longitudinal ventral sulcus on the proximal and middle caudal centra
references:
  - id: müller2018a
    notes: Erected Unaysauridae.
  - id: beccari2021a
    notes: Contested the validity of the unaysaurid genera.
  - id: ezcurra2023a
    notes: Recovered Unaysauridae sister to Plateosauridae at low resampling
      support.
  - id: wang2025a
    notes: Did not recover Unaysauridae, placing Unaysaurus with Plateosaurus.
  - id: jones2026b
    notes: Placement and assessment in the Princeton Encyclopedia of Dinosaurs.
  - id: barrett2026a
    notes: Expanded Unaysauridae to include Pradhania, Musango and Musankwa while
      excluding Jaklapallisaurus.
