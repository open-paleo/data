clade: Metriacanthosaurinae
description: >
  Metriacanthosaurinae is one of the two subfamilies within
  Metriacanthosauridae, a family of allosauroid theropod dinosaurs that lived
  across Europe and Asia from the Middle Jurassic to the Early Cretaceous. It
  comprises the metriacanthosaurids more closely related to Metriacanthosaurus
  than to the other subgroup's namesake, Yangchuanosaurus. Its members are set
  apart from the family's more basal forms chiefly by details of the skull,
  vertebrae, and hindlimb, including a ridged front border to the antorbital
  opening, a keeled underside to the front back-vertebrae, and distinctive
  proportions of the pubis, ischium, and lower leg. Like other
  metriacanthosaurids, these were carnivores whose most notable feature was
  their tall neural spines, and they spanned a wide range of body sizes.
type_genus: Metriacanthosaurus
erected_in: paul1988a
described_in: carrano2012a
diagnostic_features:
  - Anteroventral border of the maxillary antorbital fossa demarcated by a raised
    ridge
  - Pronounced ventral keel on the anterior dorsal vertebrae
  - Straight posterior margin of the iliac postacetabular process
  - Angle of less than 60 degrees between the long axes of the pubic shaft and the
    pubic boot
  - Ventrally curved ischial shaft
  - Bulbous fibular crest on the tibia
references:
  - id: paul1988a
    notes: Origin of the family-group name Metriacanthosauridae, and by
      coordination the subfamily Metriacanthosaurinae.
  - id: carrano2012a
    notes: Provided the phylogenetic definition and diagnosis of
      Metriacanthosaurinae.
