clade: Metriacanthosaurinae
description: >
  Metriacanthosaurinae is the more derived of the two subfamilies of
  Metriacanthosauridae, comprising the metriacanthosaurids more closely related to
  Metriacanthosaurus than to Yangchuanosaurus. It was erected by Carrano, Benson and
  Sampson (2012) and includes Metriacanthosaurus, Sinraptor, and Siamotyrannus,
  distinguished from basal metriacanthosaurids by features of the pelvis and
  hindlimb.
type_genus: Metriacanthosaurus
erected_in: carrano2012
diagnostic_features:
  - Anteroventral border of the maxillary antorbital fossa demarcated by a raised
    ridge
  - Pronounced ventral keel on the anterior dorsal vertebrae
  - Straight posterior margin of the iliac postacetabular process
  - Angle of less than 60 degrees between the long axes of the pubic shaft and the
    pubic boot
  - Ventrally curved ischial shaft
  - Bulbous fibular crest on the tibia
references:
  - id: carrano2012
    authors: Carrano, M. T.; Benson, R. B. J.; Sampson, S. D.
    year: 2012
