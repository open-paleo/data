clade: Spinosaurinae
description: >
  Spinosaurinae is one of the two subfamilies of spinosaurids, the large,
  crocodile-snouted theropod dinosaurs, and forms the sister group to
  Baryonychinae. Its members—including Spinosaurus, Irritator, Ichthyovenator,
  Oxalaia, and Sigilmassasaurus, along with Iberian forms such as
  Vallibonavenatrix—are marked by straight, conical, unserrated teeth and by
  nostrils set even further back on the skull than in baryonychines.
  Spinosaurines include the largest and most specialized spinosaurids, and
  appear to have evolved across the southern landmasses of Gondwana, in Africa
  and South America, during the Cretaceous. In several members the tall,
  reclined neural spines and elongated chevrons of the tail formed a deep,
  paddle-like structure—most pronounced in Spinosaurus—that has been linked to a
  semiaquatic lifestyle. Their jaws and teeth were well suited to processing the
  meat of relatively large vertebrate prey, not just fish.
type_genus: Spinosaurus
