clade: Spinosaurinae
description: >
  Spinosaurinae is the subfamily of derived spinosaurids characterized by
  conical, unserrated teeth, comprising Spinosaurus, Irritator, Ichthyovenator
  and their relatives, including the Iberian taxa Vallibonavenatrix and
  Camarillasaurus. Sister to Baryonychinae, it includes the largest and most
  specialized, semiaquatic spinosaurids.
type_genus: Spinosaurus
