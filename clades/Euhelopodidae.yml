clade: Euhelopodidae
description: >
  Euhelopodidae is a family of long-necked sauropod dinosaurs of disputed
  membership and affinities, most of whose proposed members are known from the
  Early Cretaceous of East Asia. It is generally recovered as an early-diverging
  branch of Somphospondyli, the sauropod lineage that also includes the
  titanosaurs, and its members are marked by distinctive neck vertebrae,
  including forked neural spines toward the base of the neck and elongate,
  strongly air-filled centra. Its content remains uncertain because the
  relationships of Euhelopus itself are unstable: some analyses instead place
  that genus well outside this group, close to Mamenchisaurus, which would
  render the family equivalent to Mamenchisauridae. A core of taxa including
  Erketu, Qiaowanlong, Gobititan, Phuwiangosaurus, and Tangvayosaurus is
  reasonably stable, while the placement of several fragmentary Chinese forms
  shifts between this clade and the base of Titanosauria.
type_genus: Euhelopus
erected_in: romer1956a
described_in: demic2012b
diagnostic_features:
  - Bifid (bifurcated) neural spines on the anterior cervical vertebrae
  - Thick, subhorizontal epipophyseal-prezygapophyseal lamina dividing the
    spinodiapophyseal fossa
  - Pendant, posteriorly projecting cervical ribs
  - Elongate cervical centra with strongly developed pneumatic excavations
dispute:
  summary: >
    Euhelopodidae is recovered and used as a somphospondylan clade by most
    recent analyses (D'Emic, 2012; Mannion et al., 2019; Han et al., 2024;
    Mayer et al., 2026) and the Princeton Encyclopedia (Jones, 2026), and is
    retained here on that basis. However, the position of its type genus
    Euhelopus is contested: Moore et al. (2020) recover Euhelopus outside
    Macronaria, as a non-neosauropod eusauropod of Mamenchisaurus grade in
    several analyses, which would place the clade outside Somphospondyli
    altogether. The internal topology and membership of the clade are also
    weakly supported and vary considerably between studies.
  history:
    - date: "2026-06-30"
      note: >
        Retained as an early-diverging somphospondylan clade following the
        prevailing recent literature and Jones (2026); the competing
        non-neosauropod placement of Euhelopus (Moore et al., 2020) is noted.
references:
  - id: romer1956a
    notes: Renamed Helopus zdanskyi Wiman, 1929 to Euhelopus zdanskyi because
      Helopus was preoccupied; the name Euhelopodidae derives from this genus.
  - id: demic2012b
  - id: mannion2019a
    notes: Taxonomic affinities analysis recovering Euhelopodidae as a somphospondylan clade.
  - id: mayer2026a
    notes: New titanosauriform description that also recovered Euhelopodidae as a somphospondylan clade.
  - id: moore2020a
    notes: Klamelisaurus osteology paper recovering Euhelopus outside Macronaria, at Mamenchisaurus grade.
  - id: han2024a
    notes: Reduced consensus analysis supports Euhelopodidae monophyly, adding Ruixinia as a euhelopodid
  - id: jones2026b
    notes: Placement and assessment in the Princeton Encyclopedia of Dinosaurs.
