  - source: gbif
    id: "4822600"
erected_in: romer1956a
described_in: d'emic2012b
diagnostic_features:
  - Bifid (bifurcated) neural spines on the anterior cervical vertebrae
  - Thick, subhorizontal epipophyseal-prezygapophyseal lamina dividing the
    spinodiapophyseal fossa
  - Pendant, posteriorly projecting cervical ribs
  - Elongate cervical centra with strongly developed pneumatic excavations
dispute:
  summary: >
    Euhelopodidae is recovered and used as a somphospondylan clade by most
    recent analyses (D'Emic, 2012; Mannion and colleagues, 2019; Han and
    colleagues, 2024; Mayer and colleagues, 2026), and is retained on that
    basis. However, the position of its type genus Euhelopus is contested: Moore
    and colleagues (2020) recover Euhelopus outside Macronaria, as a
    non-neosauropod eusauropod of Mamenchisaurus grade in several analyses,
    which would place the clade outside Somphospondyli altogether. The internal
    topology and membership of the clade are also weakly supported and vary
    considerably between studies.
references:
  - id: romer1956a
    notes: Proposed Euhelopus to replace the preoccupied Helopus Wiman and named
      the subfamily Euhelopodinae (p. 621), from which the family name takes its
      authorship by coordination.
  - id: d'emic2012b
  - id: mannion2019a
    notes: Taxonomic affinities analysis recovering Euhelopodidae as a somphospondylan clade.
  - id: mayer2026a
    notes: New titanosauriform description that also recovered Euhelopodidae as a somphospondylan clade.
  - id: moore2020a
    notes: Klamelisaurus osteology paper recovering Euhelopus outside Macronaria, at Mamenchisaurus grade.
  - id: han2024a
    notes: Reduced consensus analysis supports Euhelopodidae monophyly, adding Ruixinia as a euhelopodid.
  - id: jones2026b
    notes: Depicts Euhelopodidae as a somphospondylan clade roughly sister to
      Titanosauria, noting that not all studies accept the group or agree on its
      placement.
