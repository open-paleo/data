clade: Therapsida
description: >
  Therapsida is a major clade of synapsids that includes mammals and their
  extinct close relatives. Therapsids were the dominant large terrestrial
  vertebrates during the Permian period and diversified extensively before
  and after the end-Permian mass extinction. The clade encompasses a wide
  range of body plans, from large herbivorous dinocephalians to the small
  cynodonts that gave rise to mammals.
