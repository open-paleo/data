clade: Metriacanthosauridae
rank: family
type_genus: Metriacanthosaurus
erected_in: paul1988a
described_in: carrano2012a
diagnostic_features:
  - Short or absent anterior ramus of the maxilla
  - Squamosal flange overhanging the quadrate head
  - Longitudinal groove on the lateral surface of the dentary
  - Manus shorter than the forearm
  - Sheet-like, transversely thin mid-caudal neural spines
dispute:
  summary: >
    The position of Metriacanthosauridae within Allosauroidea is contested. Most
    analyses, including the study that established the family's priority over
    Sinraptoridae, recover it as the sister group of Allosauria (Allosauridae plus
    Carcharodontosauria) (Carrano, Benson and Sampson, 2012; Rauhut and colleagues, 2024;
    Zou and colleagues, 2025). Kellermann and colleagues (2025) instead recover Metriacanthosauridae
    as the sister group of Carcharodontosauridae, naming the uniting clade
    Carcharodontosauriformes and excluding Allosaurus from it. The family is
    placed following the prevailing sister-to-Allosauria arrangement; the
    Carcharodontosauriformes hypothesis remains in competing use but is not
    adopted.
references:
  - id: paul1988a
    notes: Named the subfamily Metriacanthosaurinae, from which the family name
      takes its authorship by coordination.
  - id: carrano2012a
  - id: rauhut2024a
    notes: New Metriacanthosauridae-relevant theropod description with phylogeny recovering family as sister to Allosauria.
  - id: zou2025a
    notes: Describes new metriacanthosaurid theropod, supporting Metriacanthosauridae's recognized composition and placement.
  - id: kellermann2025a
    notes: Re-evaluation with phylogeny recovering Metriacanthosauridae as sister to Carcharodontosauridae within Carcharodontosauriformes.
  - id: currie1993c
    notes: Erected Sinraptoridae, a junior synonym of Metriacanthosauridae.
