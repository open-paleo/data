clade: Metriacanthosauridae
description: >
  Metriacanthosauridae is a family of allosauroid theropod dinosaurs that lived
  in Europe and Asia from the Middle Jurassic to the Early Cretaceous. The
  family is split into two subgroups: Metriacanthosaurinae, containing forms
  such as Metriacanthosaurus, and a group of close relatives of Yangchuanosaurus
  that includes Sinraptor. Its members span a wide range of body sizes, and
  their most distinctive feature is their tall neural spines. The group's fossil
  record is largely confined to Asia, with a few members known from Europe, and
  phylogenetic evidence points to a Southeast Asian origin. Metriacanthosauridae
  is the senior synonym of Sinraptoridae.
type_genus: Metriacanthosaurus
erected_in: paul1988a
described_in: carrano2012a
dispute:
  summary: >
    The position of Metriacanthosauridae within Allosauroidea is contested. Most
    analyses, including the study that established the family's priority over
    Sinraptoridae, recover it as the sister group of Allosauria (Allosauridae plus
    Carcharodontosauria) (Carrano, Benson and Sampson, 2012; Rauhut et al., 2024;
    Zou et al., 2025). Kellermann et al. (2025) instead recover Metriacanthosauridae
    as the sister group of Carcharodontosauridae, naming the uniting clade
    Carcharodontosauriformes and excluding Allosaurus from it. The family is placed
    following the prevailing sister-to-Allosauria arrangement; the
    Carcharodontosauriformes hypothesis is reflected here but not adopted.
  history:
    - date: "2026-07-02"
      note: Placed as the sister group of Allosauria within Allosauroidea following Carrano, Benson and Sampson (2012), Rauhut et al. (2024), and Zou et al. (2025); the single-study Carcharodontosauriformes alternative of Kellermann et al. (2025) is not adopted.
references:
  - id: paul1988a
  - id: carrano2012a
  - id: rauhut2024a
    notes: New Metriacanthosauridae-relevant theropod description with phylogeny recovering family as sister to Allosauria.
  - id: zou2025a
    notes: Describes new metriacanthosaurid theropod, supporting Metriacanthosauridae's recognized composition and placement.
  - id: kellermann2025a
    notes: Re-evaluation with phylogeny recovering Metriacanthosauridae as sister to Carcharodontosauridae within Carcharodontosauriformes.
  - id: currie1993c
    notes: Erected Sinraptoridae, a junior synonym of Metriacanthosauridae.
