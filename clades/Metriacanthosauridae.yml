clade: Metriacanthosauridae
description: >
  Metriacanthosauridae is a family of allosauroid theropods known chiefly from the
  Middle and Late Jurassic of Asia and Europe, including Yangchuanosaurus,
  Sinraptor, and their relatives. Metriacanthosaurids were large predators with
  tall dorsal neural spines and are recovered as one of the two principal lineages
  of Allosauroidea, the other being Allosauria. The family is the senior synonym of
  Sinraptoridae Currie and Zhao, 1993.
type_genus: Metriacanthosaurus
erected_in: paul1988a
described_in: carrano2012a
dispute:
  summary: >
    The position of Metriacanthosauridae within Allosauroidea is contested. Most
    analyses, including the study that established the family's priority over
    Sinraptoridae, recover it as the sister group of Allosauria (Allosauridae plus
    Carcharodontosauria) (Carrano, Benson and Sampson, 2012; Rauhut et al., 2024;
    Zou et al., 2025). Kellermann et al. (2025) instead recover Metriacanthosauridae
    as the sister group of Carcharodontosauridae, naming the uniting clade
    Carcharodontosauriformes and excluding Allosaurus from it. The family is placed
    following the prevailing sister-to-Allosauria arrangement; the
    Carcharodontosauriformes hypothesis is reflected here but not adopted.
  history:
    - date: "2026-07-02"
      note: Placed as the sister group of Allosauria within Allosauroidea following Carrano, Benson and Sampson (2012), Rauhut et al. (2024), and Zou et al. (2025); the single-study Carcharodontosauriformes alternative of Kellermann et al. (2025) is not adopted.
references:
  - id: paul1988a
  - id: carrano2012a
