clade: Neornithischia
description: >
  Neornithischia is the major clade of genasaurian ornithischians that excludes
  Thyreophora, uniting the basal "hypsilophodont-grade" forms with the
  thescelosaurids, jeholosaurids, and the more derived Cerapoda (Ornithopoda
  plus Marginocephalia). Its earliest members were small, gracile, cursorial
  bipeds of the Middle to Late Jurassic, and the clade went on to encompass the
  enormous radiations of horned, dome-headed, and duck-billed dinosaurs. It is
  here recovered as the sister group of Thyreophora within Genasauria.
erected_in: cooper1985
described_in: madzia2021
diagnostic_features:
  - Tab-shaped (subrectangular) obturator process on the ischium
  - Articulation between the sacral ribs and the ischiadic peduncle of the ilium
  - Cheek-tooth crowns low and triangular with a well-developed primary ridge
  - Premaxillary dentition reduced and restricted to the anterior premaxilla
