clade: Neornithischia
description: >
  Neornithischia ("new ornithischians") is a clade of ornithischian dinosaurs
  and the sister group of the armored Thyreophora within the larger clade
  Genasauria. It brings together a variety of basal, small-bodied
  early-diverging forms historically lumped together as "hypsilophodonts" —
  including the thescelosaurids — with the more derived Cerapoda, which in turn
  splits into the bird-footed Ornithopoda and the Marginocephalia, the latter
  comprising the dome-headed pachycephalosaurs and the horned ceratopsians.
  Members are set apart by a thicker layer of asymmetrical enamel on the inner
  face of their lower teeth, which wore unevenly during chewing to develop sharp
  ridges that let them break down tougher plant food than other dinosaurs. The
  earliest neornithischians were small, gracile, cursorial bipeds, but the clade
  went on to encompass some of the most successful herbivore radiations of the
  Mesozoic, among them the duck-billed, dome-headed, and horned dinosaurs.
erected_in: cooper1985a
described_in: madzia2021a
diagnostic_features:
  - Tab-shaped (subrectangular) obturator process on the ischium
  - Articulation between the sacral ribs and the ischiadic peduncle of the ilium
  - Cheek-tooth crowns low and triangular with a well-developed primary ridge
  - Premaxillary dentition reduced and restricted to the anterior premaxilla
references:
  - id: cooper1985a
    notes: Erected Neornithischia.
  - id: madzia2021a
    notes: Provides the modern phylogenetic definition of Neornithischia.
