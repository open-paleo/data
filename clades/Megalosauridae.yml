clade: Megalosauridae
description: >
  Megalosauridae is a family of large-bodied basal tetanuran theropods known
  mainly from the Middle to Late Jurassic of Europe, Africa and the Americas,
  including Megalosaurus bucklandii, the first dinosaur to be scientifically
  named. Within Megalosauria it is the sister group of Spinosauridae, and
  comprises the subfamilies Megalosaurinae and Afrovenatorinae together with
  basal forms such as Eustreptospondylus. The family-group name dates from
  Fitzinger (1843).
type_genus: Megalosaurus
erected_in: fitzinger1843
described_in: benson2010c
diagnostic_features:
  - Humeral deltopectoral crest extending at least 0.52 of the way down the
    humeral shaft
  - Absence of a fibular anterolateral tubercle
  - Absence of the quadrate foramen
  - Paroccipital processes directed dorsolaterally to laterally
  - Well-defined longitudinal groove for neurovascular foramina on the lateral
    surface of the dentary
  - Ischial shaft curving anteroventrally, with the antitrochanter absent and the
    symphysis expanded as an apron
