clade: Megalosauridae
description: >
  Megalosauridae is a family of large-bodied carnivorous theropod dinosaurs,
  among the first major radiation of big predatory dinosaurs, appearing in the
  Middle Jurassic and persisting into the Late Jurassic. These relatively
  primitive basal tetanurans comprise Megalosaurinae and a second subfamily,
  called Afrovenatorinae by Carrano and colleagues (2012) and
  Eustreptospondylinae by Rauhut and colleagues (2016), who place
  Eustreptospondylus at its base; Benson (2010) instead recovers
  Eustreptospondylus as the sister taxon of all other megalosaurids once
  Magnosaurus is removed. Long recognized mainly from Europe on the strength of
  fossils from France and the United Kingdom, the group is now known from North
  America and Africa, and possibly Asia (Carrano and colleagues, 2012).
  Megalosauroids and allosauroids were the first theropods to regularly reach
  giant sizes, with members weighing more than a tonne (Carrano and colleagues,
  2012). Afrovenator has a long, low skull with little ornamentation (Carrano
  and colleagues, 2012). Within the broader group Megalosauria, the family is
  closely allied to the spinosaurids.
type_genus: Megalosaurus
erected_in: fitzinger1843a
described_in: benson2010c
diagnostic_features:
  - Humeral deltopectoral crest extending at least 0.52 of the way down the
    humeral shaft
  - Absence of a fibular anterolateral tubercle
  - Absence of the quadrate foramen
  - Paroccipital processes directed dorsolaterally to laterally
  - Well-defined longitudinal groove for neurovascular foramina on the lateral
    surface of the dentary
  - Ischial shaft curving anteroventrally, with the antitrochanter absent and the
    symphysis expanded as an apron
references:
  - id: fitzinger1843a
    notes: Listed the family as "Megalosauri", attributed to Meyer; Carrano and
      colleagues (2012) credit Megalosauridae to this work.
  - id: benson2010c
    notes: Redescribed Megalosaurus, listed the synapomorphies of
      Megalosauridae, and, with Magnosaurus removed, recovered
      Eustreptospondylus as the sister taxon of all other megalosaurids.
  - id: carrano2012a
    notes: Named Afrovenatorinae as a new megalosaurid subfamily.
  - id: rauhut2016a
    notes: Described Wiehenvenator; recovered Eustreptospondylus at the base of
      the second megalosaurid subfamily, which it calls Eustreptospondylinae for
      priority over Afrovenatorinae.
