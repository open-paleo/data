clade: Megalosauridae
description: >
  Megalosauridae is a family of large-bodied carnivorous theropod dinosaurs,
  among the first major radiation of big predatory dinosaurs, appearing in the
  Middle Jurassic and persisting into the Late Jurassic. These relatively
  primitive basal tetanurans comprise two subfamilies, Megalosaurinae and
  Afrovenatorinae, together with the more basal Eustreptospondylus, whose
  placement remains unresolved. Long recognized mainly from Europe on the
  strength of fossils from France and the United Kingdom, the group is now known
  from North America, Africa and South America, and possibly Asia. Megalosaurids
  were obligate bipeds that reached especially giant size, with some members
  weighing more than a tonne. They are distinguished by a long, low skull with
  roughly a 3:1 length-to-height ratio and a relatively unornamented skull roof,
  bearing only very small crests or none at all. Within the broader group
  Megalosauria, the family is closely allied to the spinosaurids.
type_genus: Megalosaurus
erected_in: fitzinger1843a
described_in: benson2010c
diagnostic_features:
  - Humeral deltopectoral crest extending at least 0.52 of the way down the
    humeral shaft
  - Absence of a fibular anterolateral tubercle
  - Absence of the quadrate foramen
  - Paroccipital processes directed dorsolaterally to laterally
  - Well-defined longitudinal groove for neurovascular foramina on the lateral
    surface of the dentary
  - Ischial shaft curving anteroventrally, with the antitrochanter absent and the
    symphysis expanded as an apron
references:
