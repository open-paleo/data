clade: Camarasauridae
description: >
  Camarasauridae is a family of basal macronarian sauropods defined as all taxa
  more closely related to Camarasaurus than to Saltasaurus. Best known from the
  Late Jurassic Morrison Formation of North America, the family also includes
  the Portuguese Lourinhasaurus, with which Camarasaurus forms a clade in recent
  analyses. Camarasaurids were robustly built, medium-sized sauropods with deep,
  arched skulls and stout, spatulate teeth distributed along the jaw margins.
type_genus: Camarasaurus
erected_in: cope1877b
diagnostic_features:
  - Deep, dorsoventrally tall snout with a steeply inclined premaxillary margin
  - Stout, spoon-shaped teeth with broad crowns
  - Cervical vertebrae with deeply excavated, chambered pleurocoels
  - Anterior dorsal neural spines bifurcate
  - Relatively short cervical series compared with other macronarians
