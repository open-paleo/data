clade: Anchiornithidae
description: >
  Anchiornithidae is a clade of small, four-winged, Anchiornis-like paravian
  theropods from the Middle to Late Jurassic of Asia, erected by Foth and Rauhut
  in 2017 with Anchiornis as its type genus. Its members are feathered,
  long-legged forms with extensive hindlimb plumage, and the group is most often
  recovered as the earliest-diverging clade of Avialae, though its position and
  membership remain contentious. Recognized members include Anchiornis,
  Eosinopteryx, Ostromia, Serikornis, Caihong, and Fujianvenator.
type_genus: Anchiornis
erected_in: foth2017
diagnostic_features:
  - Extensive pennaceous feathering on the hindlimb forming a hindwing
  - Elongate, gracile hindlimbs with an unspecialized, non-raptorial pes
  - Skull with a subtriangular profile and numerous small, closely spaced teeth
  - Forelimb shorter than in Archaeopteryx and later avialans
dispute:
  summary: >
    The phylogenetic position of Anchiornithidae is unresolved. It is most often
    recovered as the earliest-diverging clade within Avialae (Foth and Rauhut,
    2017; Pei et al., 2020; Xu et al., 2023), but several analyses instead place
    the anchiornithids within Deinonychosauria, either as basal troodontids
    (Turner et al., 2012) or as archaeopterygid-grade deinonychosaurs (Xu et al.,
    2011; Hartman et al., 2019), and one analysis places them as basal paravians
    outside Eumaniraptora (Lefèvre et al., 2017). Membership at the edges of the
    clade is likewise unstable, with Xiaotingia, Pedopenna, and Yixianosaurus
    variously included or excluded. Support values for these arrangements are
    consistently low.
  history:
    - date: "2026-07-01"
      note: Placed at Eumaniraptora following the consensus of the competing analyses (P2, P3) — the Avialae and Deinonychosauria hypotheses both agree the anchiornithids fall within Eumaniraptora, with the lone basal-Paraves recovery (Lefèvre et al., 2017) reflected here but not controlling the keystone.
references:
  - id: foth2017
    authors: Foth, C.; Rauhut, O. W. M.
    year: 2017
    title: Re-evaluation of the Haarlem Archaeopteryx and the radiation of
      maniraptoran theropod dinosaurs
    journal: BMC Evolutionary Biology
    volume: "17"
    issue: "1"
    publisher: Springer Science and Business Media LLC
    doi: 10.1186/s12862-017-1076-y
