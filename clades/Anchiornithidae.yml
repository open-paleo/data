clade: Anchiornithidae
description: >
  Anchiornithidae is a family of small, lightly built, feathered paravian
  theropod dinosaurs known mostly from the Late Jurassic of China, with the
  majority of fossils coming from the Tiaojishan Formation of Liaoning. Members
  include Anchiornis, Eosinopteryx, Serikornis, Caihong, Aurornis, Pedopenna,
  and Fujianvenator, alongside a few genera found beyond their Chinese
  heartland, such as Ostromia from Germany and the Early Cretaceous
  Yixianosaurus. These were long-legged, long-armed carnivores similar in build
  to Archaeopteryx and early troodontids, and most carried extensive pennaceous
  feathers down the legs as well as the arms, earning them the nickname
  "four-winged dinosaurs." Their arm feathers were slender, symmetrical, and
  unspecialized, likely useless for true flight. The group's exact place among
  paravians is unsettled, having been recovered at various times as the
  earliest-branching birds, as basal members of Troodontidae, or as part of
  Archaeopterygidae, and membership at the edges of the clade remains unstable.
type_genus: Anchiornis
erected_in: foth2017a
diagnostic_features:
  - Extensive pennaceous feathering on the hindlimb forming a hindwing
  - Elongate, gracile hindlimbs with an unspecialized, non-raptorial pes
  - Skull with a subtriangular profile and numerous small, closely spaced teeth
  - Forelimb shorter than in Archaeopteryx and later avialans
dispute:
  summary: >
    The phylogenetic position of Anchiornithidae is unresolved. It is most often
    recovered as the earliest-diverging clade within Avialae (Foth and Rauhut,
    2017; Pei et al., 2020; Xu et al., 2023), but several analyses instead place
    the anchiornithids within Deinonychosauria, either as basal troodontids
    (Turner et al., 2012) or as archaeopterygid-grade deinonychosaurs (Xu et al.,
    2011; Hartman et al., 2019), and one analysis places them as basal paravians
    outside Eumaniraptora (Lefèvre et al., 2017). Membership at the edges of the
    clade is likewise unstable, with Xiaotingia, Pedopenna, and Yixianosaurus
    variously included or excluded. Support values for these arrangements are
    consistently low.
  history:
    - date: "2026-07-01"
      note: Placed at Eumaniraptora following the consensus of the competing analyses — the Avialae and Deinonychosauria hypotheses both agree the anchiornithids fall within Eumaniraptora, with the lone basal-Paraves recovery (Lefèvre et al., 2017) reflected here but not controlling the placement.
references:
  - id: foth2017a
  - id: pei2020a
    notes: Large paravian phylogenetic analysis recovering Anchiornithidae as earliest-diverging avialan clade.
  - id: xu2023a
    notes: New avialan theropod description supporting Anchiornithidae's placement within Avialae.
  - id: turner2012a
    notes: Dromaeosaurid/paravian phylogeny review recovering anchiornithids as basal troodontids.
  - id: hartman2019a
    notes: Maniraptoran phylogeny placing anchiornithids as basal paravians outside Eumaniraptora/within Avialae debate.
  - id: xu2011d
    notes: Recovered Archaeopteryx among deinonychosaurs close to anchiornithids in a paravian phylogeny.
  - id: lefèvre2017a
    notes: Phylogenetic analysis placed Serikornis and allied taxa as basal paravians outside Eumaniraptora
