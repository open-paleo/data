clade: Protoceratopsidae
description: >
  Protoceratopsidae is a clade of small to medium-sized coronosaurian
  neoceratopsians from the Late Cretaceous of Asia, including Protoceratops,
  Bagaceratops, and Breviceratops. They bear a well-developed but solid frill and
  a deep, narrow snout, but lack the large brow horns and frill fenestrae of
  ceratopsids. Following Czepiński's (2019) revision the family absorbs the
  taxa formerly placed in "Bagaceratopsidae."
type_genus: Protoceratops
erected_in: granger1923
described_in: czepiński2019
diagnostic_features:
  - Solid (unfenestrated or minimally fenestrated) parietosquamosal frill
  - Deep, narrow snout with a prominent nasal horn or boss in some members
  - Reduced or absent premaxillary dentition
  - Tall neural spines over the sacrum and tail
