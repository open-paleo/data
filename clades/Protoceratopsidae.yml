  - source: gbif
    id: "3238856"
  - source: eol
    id: "4531818"
erected_in: granger1923a
described_in: madzia2021a
diagnostic_features:
  - Solid (unfenestrated or minimally fenestrated) parietosquamosal frill
  - Deep, narrow snout with a prominent nasal horn or boss in some members
  - Reduced or absent premaxillary dentition
  - Tall neural spines over the sacrum and tail
references:
  - id: granger1923a
    notes: Named Protoceratopsidae.
  - id: madzia2021a
    notes: Defined Protoceratopsidae as the largest clade containing
      Protoceratops andrewsi but not Ceratops montanus, Leptoceratops gracilis
      or Triceratops horridus.
  - id: czepiński2019a
    notes: Revised the protoceratopsids of the Baruungoyot Formation,
      synonymizing several Gobi genera with Bagaceratops.
