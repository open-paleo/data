clade: Protoceratopsidae
description: >
  Protoceratopsidae is a family of small, primitive horned dinosaurs from the
  Late Cretaceous of Asia, with most specimens recovered from China and Mongolia
  and dating to roughly 75 to 71 million years ago. Its members were modest in
  size, around 1 to 2.5 meters long, and included Protoceratops, Bagaceratops,
  and Breviceratops. Like all ceratopsians they were herbivores equipped with a
  hooked beak and slicing tooth batteries, but their bony frill and horns were
  far smaller than those of the later, larger ceratopsids. Distinctive features
  include a wedge-shaped snout carrying tall, narrow nostrils set high on the
  skull, an unusually small antorbital fenestra, and a maxillary sinus not seen
  in other ceratopsians. Along the backbone, the tail bore very long neural
  spines that made it tall and flattened from side to side. The concept has
  narrowed over time, with genera such as Leptoceratops and Montanoceratops now
  assigned instead to the mostly North American Leptoceratopsidae.
type_genus: Protoceratops
erected_in: granger1923a
described_in: czepiński2019a
diagnostic_features:
  - Solid (unfenestrated or minimally fenestrated) parietosquamosal frill
  - Deep, narrow snout with a prominent nasal horn or boss in some members
  - Reduced or absent premaxillary dentition
  - Tall neural spines over the sacrum and tail
references:
  - id: granger1923a
    notes: Named Protoceratopsidae.
  - id: czepiński2019a
    notes: Revised Protoceratopsidae and synonymized several Gobi genera into
      Bagaceratops.
