clade: Coelurosauria
description: >
  Coelurosauria is a large and diverse clade of theropod dinosaurs that includes
  tyrannosauroids, compsognathids, ornithomimosaurs, maniraptorans, and all
  living birds. Coelurosaurs are the most speciose theropod clade and exhibit an
  extraordinary range of body sizes, diets, and ecologies. Many coelurosaurs
  possessed filamentous integumentary structures or true feathers. The clade
  originated by the Middle Jurassic and includes the only dinosaur lineage to
  survive the end-Cretaceous extinction.
erected_in: huene1914
diagnostic_features:
  - Elongate distal caudal vertebrae with reduced or absent transverse processes
  - Filamentous integument or feathers present in many lineages
  - Reduced or absent prefrontal bone
  - Semilunate carpal bone in the wrist of many derived taxa
  - Enlarged cerebrum relative to body size
references:
  - id: huene1914
    authors: Huene, F. von
    year: 1914
    title: "Das naturliche System der Saurischia"
    journal: "Centralblatt fur Mineralogie, Geologie und Palaontologie B"
    volume: "1914"
    pages: "154-168"
