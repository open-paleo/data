clade: Coelurosauria
description: >
  Coelurosauria is a large and diverse subgroup of theropod dinosaurs, defined
  as all theropods more closely related to birds than to carnosaurs. It
  encompasses compsognathids, tyrannosauroids, ornithomimosaurs, and the
  bird-line maniraptorans, along with megaraptorans, whose exact position
  remains uncertain. Coelurosaurs range from some of the largest carnivorous
  dinosaurs, such as Tyrannosaurus, to some of the smallest, and they
  diversified into omnivorous, insectivorous, herbivorous, and carnivorous
  forms. Most feathered dinosaurs found so far are coelurosaurs, and many
  lineages bore filamentous integument or true feathers, though some retained
  scales over parts of the body. The clade appears by the Middle Jurassic and
  includes birds, the only dinosaur lineage to survive the end-Cretaceous
  extinction and the only one alive today.
erected_in: huene1914a
diagnostic_features:
  - Elongate distal caudal vertebrae with reduced or absent transverse processes
  - Filamentous integument or feathers present in many lineages
  - Reduced or absent prefrontal bone
  - Semilunate carpal bone in the wrist of many derived taxa
  - Enlarged cerebrum relative to body size
