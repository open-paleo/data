clade: Heterodontosaurinae
description: >
  Heterodontosaurinae is the derived, largely Gondwanan subfamily of
  Heterodontosauridae, comprising Heterodontosaurus, Lycorhinus, Abrictosaurus,
  Manidens, and Pegomastax. Defined as the heterodontosaurids more closely
  related to Heterodontosaurus than to Tianyulong, Fruitadens, or Echinodon, its
  members show the most specialized heterodontosaurid jaw mechanics, with tall
  cheek-tooth crowns worn into continuous occlusal surfaces.
type_genus: Heterodontosaurus
erected_in: kuhn1966a
described_in: sereno2012a
diagnostic_features:
  - Deep postcaniniform diastema
  - Jaw articulation set well below the level of the cheek-tooth row
  - Enlarged, inset surangular foramen
  - External mandibular fossa developed on the surangular
  - Cheek-tooth crowns taller than wide, worn into systematic occlusal facets
references:
  - id: kuhn1966a
    notes: Origin of the family-group name Heterodontosaurinae.
  - id: sereno2012a
    notes: Provides the phylogenetic definition of Heterodontosaurinae.
