clade: Heterodontosaurinae
description: >
  Heterodontosaurinae is the derived, largely Gondwanan subfamily of the
  heterodontosaurids, a group of small, early ornithischian dinosaurs. It
  gathers the heterodontosaurids more closely related to Heterodontosaurus than
  to Tianyulong, Fruitadens, or Echinodon, and includes such genera as
  Heterodontosaurus, Lycorhinus, Abrictosaurus, Manidens, and Pegomastax. Its
  members display the most specialized heterodontosaurid jaw and tooth anatomy:
  whereas basal relatives kept widely spaced, low-crowned cheek teeth, these
  derived forms bore chisel-shaped teeth with much taller crowns that lost the
  ridge separating crown from root and overlapped to form a continuous surface
  for grinding tough plant food. This chewing apparatus, unusual among early
  ornithischians, foreshadowed the analogous dental batteries later evolved by
  hadrosaurs and ceratopsians.
type_genus: Heterodontosaurus
erected_in: kuhn1966a
described_in: sereno2012a
diagnostic_features:
  - Deep postcaniniform diastema
  - Jaw articulation set well below the level of the cheek-tooth row
  - Enlarged, inset surangular foramen
  - External mandibular fossa developed on the surangular
  - Cheek-tooth crowns taller than wide, worn into systematic occlusal facets
references:
  - id: kuhn1966a
    notes: Origin of the family-group name Heterodontosaurinae.
  - id: sereno2012a
    notes: Provides the phylogenetic definition of Heterodontosaurinae.
