clade: Ceratopsoidea
description: >
  Ceratopsoidea is the clade of coronosaurian neoceratopsians containing Ceratops
  and Triceratops but not Protoceratops — the lineage of large-bodied horned
  dinosaurs and their nearest relatives. Besides Ceratopsidae, it includes the
  basal forms Zuniceratops and Turanoceratops, which approach the ceratopsid
  condition (brow horns, double-rooted teeth) without belonging to Ceratopsidae.
type_genus: Ceratops
erected_in: hay1902
described_in: madzia2021
diagnostic_features:
  - Postorbital (brow) horncores
  - Trend toward double-rooted cheek teeth
  - Frontal excluded from the dorsal orbital margin
  - Large body size relative to other neoceratopsians
