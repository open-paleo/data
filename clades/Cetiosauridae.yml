clade: Cetiosauridae
description: >
  Cetiosauridae is a family-level grouping of basal eusauropod dinosaurs erected
  by Lydekker (1888) and typified by Cetiosaurus. Long used as a wastebasket for
  non-neosauropod sauropods, the family has been revived in a restricted sense
  for a small clade of Middle Jurassic taxa, most consistently Cetiosaurus and
  Patagosaurus (united by loss of the spinodiapophyseal lamina; Holwerda et al.,
  2021), with Chebsaurus and Lapparentosaurus included in some analyses. Its
  validity and contents remain debated, and several studies recover it instead
  as a paraphyletic grade of basal eusauropods.
type_genus: Cetiosaurus
erected_in: lydekker1888
described_in: holwerda2021
diagnostic_features:
  - Loss of the spinodiapophyseal lamina on the dorsal vertebrae
  - Pyramid-shaped, non-bifid dorsal neural spines
  - Generalized non-neosauropod eusauropod axial and appendicular morphology
