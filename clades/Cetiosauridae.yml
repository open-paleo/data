clade: Cetiosauridae
description: >
  Cetiosauridae is a family of basal sauropod dinosaurs from the Jurassic.
  Traditionally it served as a wastebasket for various unrelated species, and
  many of the genera once assigned to it are now placed elsewhere among the
  non-neosauropod eusauropods. In its restricted modern sense it comprises
  Cetiosaurus from the Middle Jurassic of Britain and Patagosaurus from the
  late Early to Middle Jurassic of Patagonia, which share a loss of the
  spinodiapophyseal lamina and pyramid-shaped, non-bifid dorsal neural spines.
  At least one study has suggested that the mamenchisaurids form a subgroup
  within it. Its validity and contents remain debated, with several analyses
  instead recovering it as a paraphyletic grade of early sauropods rather than
  a true clade.
type_genus: Cetiosaurus
erected_in: lydekker1888a
described_in: holwerda2021a
diagnostic_features:
  - Loss of the spinodiapophyseal lamina on the dorsal vertebrae
  - Pyramid-shaped, non-bifid dorsal neural spines
  - Generalized non-neosauropod eusauropod axial and appendicular morphology
references:
  - id: lydekker1888a
    notes: Erected Cetiosauridae.
  - id: holwerda2021a
    notes: Redescription of Patagosaurus supporting a restricted Cetiosauridae
      of Cetiosaurus and Patagosaurus.
