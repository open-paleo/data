clade: Cetiosauridae
description: >
  Cetiosauridae is a family of basal sauropod dinosaurs from the Jurassic.
  Traditionally it served as a wastebasket for various unrelated species, and
  many of the genera once assigned to it are now placed elsewhere among the
  non-neosauropod eusauropods. In its restricted modern sense it comprises
  Cetiosaurus from the Middle Jurassic of Britain and Patagosaurus from the late
  Early to Middle Jurassic of Patagonia, which share the loss of the
  spinodiapophyseal lamina on the dorsal vertebrae (Holwerda and colleagues,
  2021). Its validity and contents remain debated, with earlier analyses instead
  recovering it as a paraphyletic grade of early sauropods rather than a true
  clade (Upchurch, 1998; Läng and Mahammed, 2010).
type_genus: Cetiosaurus
erected_in: lydekker1888a
described_in: upchurch2004a
diagnostic_features:
  - Loss of the spinodiapophyseal lamina on the dorsal vertebrae
  - Pyramid-shaped, non-bifid dorsal neural spines
  - Generalized non-neosauropod eusauropod axial and appendicular morphology
references:
  - id: lydekker1888a
    notes: Named and diagnosed the family Cetiosauridae (p. 133), illustrating
      Morosaurus among its members.
  - id: upchurch2004a
    notes: Defined Cetiosauridae as sauropods closer to Cetiosaurus than to
      Saltasaurus, and diagnosed it.
  - id: holwerda2021a
    notes: Redescribed the Patagosaurus holotype and interpreted the absence of the
      spinodiapophyseal lamina as an apomorphy uniting the cetiosaurids.
  - id: upchurch1998a
    notes: Recovered Cetiosauridae, with Patagosaurus, Cetiosaurus and
      Haplocanthosaurus, as paraphyletic with respect to Neosauropoda.
  - id: läng2010a
    notes: Recovered Cetiosauridae sensu Bonaparte (1986) as paraphyletic in a
      restudy of Chebsaurus.
  - id: bonaparte1986b
    notes: Described the Cerro Cóndor sauropods, placing Patagosaurus in
      Cetiosauridae.
