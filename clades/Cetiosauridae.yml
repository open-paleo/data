clade: Cetiosauridae
description: >
  Cetiosauridae is a family of basal sauropod dinosaurs from the Jurassic.
  Traditionally it served as a wastebasket for various unrelated species, but
  some recent studies find that it may represent a genuine natural group.
  Alongside Cetiosaurus from the Middle Jurassic of Britain, taxa assigned to
  the family include Patagosaurus from the late Early to Middle Jurassic of
  Patagonia and Lapparentosaurus from the Middle Jurassic of Madagascar, which
  share distinctive features not seen in other eusauropods. At least one study
  has suggested that the mamenchisaurids form a subgroup within it. Its validity
  and contents remain debated, with several analyses instead recovering it as a
  paraphyletic grade of early sauropods rather than a true clade.
type_genus: Cetiosaurus
erected_in: lydekker1888a
described_in: holwerda2021a
diagnostic_features:
  - Loss of the spinodiapophyseal lamina on the dorsal vertebrae
  - Pyramid-shaped, non-bifid dorsal neural spines
  - Generalized non-neosauropod eusauropod axial and appendicular morphology
references:
