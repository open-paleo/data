clade: Styracosterna
description: >
  Styracosterna is a clade of ankylopollexian ornithopod dinosaurs defined to
  include Iguanodon and all its relatives that are closer to it than to
  Camptosaurus. It encompasses the classic "iguanodont-grade" forms as well as
  the more derived Hadrosauriformes, which in turn contains the duck-billed
  hadrosaurids. Body size within the clade ranges widely, from small, lightly
  built, likely fast-running species known from the latest Cretaceous to some of
  the largest ornithopod dinosaurs that ever lived. The oldest known
  styracosternans date to the Late Jurassic of Europe, and by the Cretaceous the
  clade had spread worldwide, with hadrosaurids becoming among the dominant
  large plant-eaters of Late Cretaceous ecosystems across Asia, Europe, Africa,
  and the Americas.
erected_in: sereno1986a
described_in: madzia2021a
diagnostic_features:
  - Conical, spike-like manual pollex ungual
  - Elongate snout with an expanded, edentulous premaxilla
  - Reduction of the phalanges in the lateral manual digits
  - Hoof-like unguals on the pedal digits
references:
  - id: sereno1986a
    notes: Named Styracosterna.
  - id: madzia2021a
    notes: Provides the modern phylogenetic definition of Styracosterna.
