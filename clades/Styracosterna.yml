clade: Styracosterna
description: >
  Styracosterna is a clade of ankylopollexian ornithopod dinosaurs containing
  Iguanodon and all taxa closer to it than to Camptosaurus. Its members are
  medium- to large-bodied iguanodontians with a conical, spike-like manual
  pollex and increasingly specialized dentition, and the clade encompasses the
  classic "iguanodont-grade" forms grading into Hadrosauriformes and ultimately
  the duck-billed Hadrosauridae. Styracosternans were dominant large herbivores
  across Early to Late Cretaceous ecosystems worldwide.
erected_in: sereno1986
described_in: madzia2021
diagnostic_features:
  - Conical, spike-like manual pollex ungual
  - Elongate snout with an expanded, edentulous premaxilla
  - Reduction of the phalanges in the lateral manual digits
  - Hoof-like unguals on the pedal digits
