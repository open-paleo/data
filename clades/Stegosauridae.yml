clade: Stegosauridae
description: >
  Stegosauridae is the crown family of Stegosauria, comprising the derived,
  large-bodied plated dinosaurs of the Middle Jurassic through Early Cretaceous.
  Stegosaurids are characterized by relatively long necks, tall dorsal plates or
  spines arranged in parasagittal rows, and a thagomizer of paired terminal tail
  spines. The family is conventionally divided into two subfamilies, the
  long-spined Dacentrurinae and the plate-bearing Stegosaurinae; several basal
  and fragmentary members are not assigned to either subfamily.
type_genus: Stegosaurus
erected_in: marsh1880a
described_in: sánchez-fenollosa2025a
diagnostic_features:
  - Elongated nasal process of the premaxilla forming the anterodorsal margin of
    the external naris
  - Fourth trochanter of the femur extremely reduced or absent
  - Absence of ossified epaxial tendons
  - Transversely enlarged summits on the proximal caudal neural spines
references:
  - id: marsh1880a
    notes: Named the family Stegosauridae.
  - id: sánchez-fenollosa2025a
    notes: Most recent comprehensive revision of stegosaurian phylogeny.
