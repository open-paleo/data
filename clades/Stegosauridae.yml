clade: Stegosauridae
description: >
  Stegosauridae is a family of plated, quadrupedal stegosaurian dinosaurs that
  accounts for the vast majority of known stegosaurian diversity. Its members
  lived from the later part of the Jurassic into the Early Cretaceous and ranged
  widely, with fossils found across the Northern Hemisphere as well as Africa
  and South America. Stegosaurids are set apart from more basal stegosaurians by
  the loss of the premaxillary teeth and of the lateral rows of bony scutes
  along the trunk, together with long, narrow skulls and hindlimbs markedly
  longer than the forelimbs. The most derived forms carry very large, thin
  dorsal plates arranged in two staggered parasagittal rows, along with paired
  spikes at the end of the tail. The family is conventionally divided into two
  subfamilies, the long-spined Dacentrurinae and the plate-bearing
  Stegosaurinae, which together make up the clade Neostegosauria; several basal
  and fragmentary members fall outside this split.
type_genus: Stegosaurus
erected_in: marsh1880a
described_in: madzia2021a
diagnostic_features:
  - Elongated nasal process of the premaxilla forming the anterodorsal margin of
    the external naris
  - Fourth trochanter of the femur extremely reduced or absent
  - Absence of ossified epaxial tendons
  - Transversely enlarged summits on the proximal caudal neural spines
references:
  - id: marsh1880a
    notes: Introduced the name Stegosauridae in passing, suggesting that
      Stegosaurus and Omosaurus might belong to the same family.
  - id: madzia2021a
    notes: Defined Stegosauridae as the largest clade containing Stegosaurus
      stenops but not Huayangosaurus taibaii.
  - id: sánchez-fenollosa2025a
    notes: Revised stegosaurian phylogeny, applying Madzia and colleagues'
      definition of Stegosauridae.
