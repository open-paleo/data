clade: Ankylosauridae
description: >
  Ankylosauridae is a family of armored dinosaurs within Ankylosauria,
  traditionally one of its two major clades alongside the Nodosauridae (Arbour
  and Currie, 2015). Its members were mainly herbivorous, obligate quadrupeds
  with leaf-shaped teeth and robust, scute-covered bodies, distinguished by a
  short, deeply domed snout bearing wedge-shaped cranial osteoderms and, in more
  derived forms, a heavy bony tail club built from interlocking tail vertebrae
  and enlarged, bulbous armor. The family is restricted to Asia and North
  America, with no evidence of ankylosaurids in Gondwana (Arbour and Currie,
  2015). It ranges from the Early Cretaceous, with Aptian forms such as
  Liaoningosaurus and Shamosaurus among its earliest members, to the
  end-Cretaceous extinction. Arbour and Currie (2015) recover Shamosaurinae, the
  small Asian group of Gobisaurus and Shamosaurus, as the sister group of the
  more diverse and derived Ankylosaurinae.
type_genus: Ankylosaurus
erected_in: brown1908a
described_in: arbour2015a
diagnostic_features:
  - Lateral temporal fenestrae closed by cranial ornamentation
  - Skull wider than long with an anteroposteriorly arched roof
  - Nasal process of the premaxilla not visible on the skull roof
  - Three sacral vertebrae
  - Triangular caudal osteoderms; a handle-and-knob tail club in derived members
references:
  - id: brown1908a
    notes: Named the family Ankylosauridae.
  - id: arbour2015a
    notes: Revised Ankylosauridae, restricting it to Asia and North America and
      recovering Shamosaurinae as the sister group of Ankylosaurinae.
