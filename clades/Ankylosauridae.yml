clade: Ankylosauridae
description: >
  Ankylosauridae is a family of armored dinosaurs within Ankylosauria, forming
  the sister group to the nodosaurids. Its members were mainly herbivorous,
  obligate quadrupeds with leaf-shaped teeth and robust, scute-covered bodies,
  distinguished by a short, deeply domed snout bearing wedge-shaped cranial
  osteoderms and, in more derived forms, a heavy bony tail club built from
  interlocking tail vertebrae and enlarged, bulbous armor. The family is known
  exclusively from the Northern Hemisphere, with fossils recovered across North
  America, Europe, and Asia. It ranges from the Early Cretaceous, roughly 122
  million years ago, to the end-Cretaceous extinction 66 million years ago.
  Ankylosaurids are typically divided into the basal Shamosaurinae, a small
  Asian group, and the more diverse and derived Ankylosaurinae.
type_genus: Ankylosaurus
erected_in: brown1908a
described_in: arbour2015a
diagnostic_features:
  - Lateral temporal fenestrae closed by cranial ornamentation
  - Skull wider than long with an anteroposteriorly arched roof
  - Nasal process of the premaxilla not visible on the skull roof
  - Three sacral vertebrae
  - Triangular caudal osteoderms; a handle-and-knob tail club in derived members
references:
  - id: brown1908a
    notes: Named the family Ankylosauridae.
  - id: arbour2015a
    notes: Comprehensive systematic revision of Ankylosauridae.
