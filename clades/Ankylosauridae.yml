clade: Ankylosauridae
description: >
  Ankylosauridae is one of the two principal families of Ankylosauria, the
  tail-clubbed armored dinosaurs of the Cretaceous of Asia and North America.
  Ankylosaurids are obligate quadrupeds with leaf-shaped teeth and robust,
  scute-covered bodies; they are distinguished by a short, deep snout with
  wedge-shaped (caputegular) cranial osteoderms and, in derived members, a
  massive bony tail club. The family comprises the basal Shamosaurinae and the
  derived Ankylosaurinae.
type_genus: Ankylosaurus
erected_in: brown1908
described_in: arbour2015
diagnostic_features:
  - Lateral temporal fenestrae closed by cranial ornamentation
  - Skull wider than long with an anteroposteriorly arched roof
  - Nasal process of the premaxilla not visible on the skull roof
  - Three sacral vertebrae
  - Triangular caudal osteoderms; a handle-and-knob tail club in derived members
