clade: Ankylosauridae
description: Ankylosauridae is a family of armored dinosaurs within
  Ankylosauria, and is the sister group to Nodosauridae. The oldest
  known ankylosaurids date to around 122 million years ago, and the
  clade went extinct 66 million years ago during the
  Cretaceous–Paleogene extinction event. These animals were mainly
  herbivorous and were obligate quadrupeds, with leaf-shaped teeth and
  robust, scute-covered bodies. Ankylosaurids possess a distinctly domed
  and short snout, wedge-shaped osteoderms on their skull, scutes along
  their torso, and a tail club.
