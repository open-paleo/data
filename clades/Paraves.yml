clade: Paraves
description: >
  Paraves is the stem-based paravian clade containing all theropods closer to
  modern birds than to oviraptorosaurs, comprising Eumaniraptora
  (Deinonychosauria plus Avialae) together with a shifting set of basal forms. It
  was coined by Sereno in 1997 and subsequently given a formal phylogenetic
  definition. Its members are small, gracile, feathered theropods, many with
  elongate feathered forelimbs and a raptorial or perching pes.
erected_in: sereno1997a
diagnostic_features:
  - Elongate penultimate manual and pedal phalanges
  - Forelimbs elongate relative to body size, bearing pennaceous feathers
  - Reduced number of maxillary and dentary teeth in many members
  - Distally placed obturator process on the ischium
references:
  - id: sereno1997a
