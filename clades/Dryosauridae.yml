clade: Dryosauridae
description: >
  Dryosauridae is a family of small, gracile, bipedal ornithopod dinosaurs known
  from Middle Jurassic to Early Cretaceous rocks of Africa, Europe, and North
  America. Its members include Dryosaurus, Dysalotosaurus, Valdosaurus,
  Elrhazosaurus, and Callovosaurus, several of which were once dismissed as
  dubious or as species of Dryosaurus before later studies re-established them
  as valid. These were lightly built, long-legged herbivores adapted for
  running, and were originally set apart from the hypsilophodonts because they
  more closely resembled the larger iguanodontians and hadrosaurs. They lacked
  the specialized thumb spike of their more advanced relatives and sit as an
  early branch just outside the ankylopollexian ornithopods.
type_genus: Dryosaurus
erected_in: milnernorman1984a
described_in: madzia2021a
diagnostic_features:
  - Edentulous, beak-like premaxilla
  - Long, slender hindlimbs with an elongate tibia relative to the femur
  - Absence of a manual pollex spike
  - Crownward ridge pattern with a single strong primary ridge on dentary teeth
references:
  - id: milnernorman1984a
    notes: Named Dryosauridae.
  - id: madzia2021a
    notes: Provides the modern phylogenetic definition of Dryosauridae.
