clade: Dryosauridae
description: >
  Dryosauridae is a family of small, gracile, cursorial iguanodontian ornithopods
  of the Late Jurassic to Early Cretaceous, including Dryosaurus, Dysalotosaurus,
  Valdosaurus, and Elrhazosaurus. They were lightly built, long-legged
  herbivores lacking the thumb spike of ankylopollexians, and form the sister
  group of Ankylopollexia within Dryomorpha.
type_genus: Dryosaurus
erected_in: milnernorman1984a
described_in: madzia2021a
diagnostic_features:
  - Edentulous, beak-like premaxilla
  - Long, slender hindlimbs with an elongate tibia relative to the femur
  - Absence of a manual pollex spike
  - Crownward ridge pattern with a single strong primary ridge on dentary teeth
references:
  - id: milnernorman1984a
    notes: Named Dryosauridae.
  - id: madzia2021a
    notes: Provides the modern phylogenetic definition of Dryosauridae.
