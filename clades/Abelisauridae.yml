clade: Abelisauridae
description: >
  Abelisauridae is a family of ceratosaurian theropods that were the dominant
  large predators of the Gondwanan landmasses during the Cretaceous. Abelisaurids
  are characterized by short, deep, heavily ornamented skulls and dramatically
  reduced, vestigial forelimbs. A basal grade of taxa such as Rugops,
  Spectrovenator, and Eoabelisaurus subtends two derived subclades, the
  Indo-Madagascan Majungasaurinae and the mostly South American Brachyrostra.
  Notable members include Carnotaurus, Majungasaurus, and Abelisaurus.
type_genus: Abelisaurus
erected_in: bonaparte1985b
diagnostic_features:
  - Short, deep skull with heavy sculpturing of the frontal, nasal, and
    lacrimal bones.
  - Extremely reduced forelimbs with short, stout metacarpals and vestigial
    manual digits.
  - Thickened, co-ossified skull roof.
  - Short, robust cervical vertebrae with prominent epipophyses.
references:
