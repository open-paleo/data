clade: Abelisauridae
description: >
  Abelisauridae is a family of ceratosaurian theropod dinosaurs that were among
  the dominant large predators of the southern supercontinent Gondwana during
  the Cretaceous. Like most theropods they were carnivorous bipeds, but they are
  distinguished by short, deep skulls whose bones bear pits and rugose surfaces,
  sometimes with horns, and by greatly reduced forelimbs (Delcourt, 2018), with
  unusually robust hind limbs in some members (Carrano and Sampson, 2008). Their
  fossils are found across Africa, South America, southern Europe, the Indian
  subcontinent and Madagascar (Pol and colleagues, 2024). A grade of more basal
  forms such as Rugops gives way to two derived branches: the Indo-Madagascan
  and European Majungasaurinae and the mostly South American Brachyrostra, the
  latter including well-known genera such as Carnotaurus and Aucasaurus (Filippi
  and colleagues, 2016).
type_genus: Abelisaurus
erected_in: bonaparte1985b
diagnostic_features:
  - Short, deep skull with heavy sculpturing of the frontal, nasal, and
    lacrimal bones
  - Extremely reduced forelimbs with short, stout metacarpals and vestigial
    manual digits
  - Thickened, co-ossified skull roof
  - Short, robust cervical vertebrae with prominent epipophyses
references:
  - id: bonaparte1985b
    notes: Named Abelisaurus and the family Abelisauridae. In Spanish.
  - id: filippi2016a
    notes: Described a new brachyrostran and recovered Kryptops and Rugops as
      basal abelisaurids, followed by Majungasaurinae and Brachyrostra.
  - id: delcourt2018c
    notes: Reviewed ceratosaur paleobiology, including the shortened, deepened
      abelisaurid skull and the greatly reduced forelimb that kept some
      mobility.
  - id: pol2024a
    notes: Described a new abelisaurid from the end Cretaceous of Patagonia,
      noting the family's occurrence across Gondwana and in Europe.
  - id: carrano2008a
    notes: Revised the phylogeny of Ceratosauria, noting unusually robust hind
      limb elements in certain abelisaurids.
