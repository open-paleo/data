clade: Abelisauridae
description: >
  Abelisauridae is a family of ceratosaurian theropod dinosaurs that were among
  the dominant large predators of the southern supercontinent Gondwana during
  the Cretaceous. Like most theropods they were carnivorous bipeds, but they are
  distinguished by short, tall skulls whose bones are heavily ornamented with
  grooves, pits, and protrusions, often bearing horns or brow ridges above the
  eyes, and by dramatically reduced, vestigial forelimbs set on stocky hind
  limbs. Most known members ranged from about 5 to 9 meters in length. Their
  fossils are found across Africa, South America, and western Europe, as well as
  the Indian subcontinent and Madagascar. A grade of more basal forms such as
  Rugops and Eoabelisaurus gives way to two derived branches: the
  Indo-Madagascan and European Majungasaurinae and the mostly South American
  Brachyrostra, the latter including well-known genera such as Carnotaurus and
  Aucasaurus.
type_genus: Abelisaurus
erected_in: bonaparte1985b
diagnostic_features:
  - Short, deep skull with heavy sculpturing of the frontal, nasal, and
    lacrimal bones.
  - Extremely reduced forelimbs with short, stout metacarpals and vestigial
    manual digits.
  - Thickened, co-ossified skull roof.
  - Short, robust cervical vertebrae with prominent epipophyses.
references:
  - id: bonaparte1985b
    notes: Named Abelisaurus and the family Abelisauridae. In Spanish.
