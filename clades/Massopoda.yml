clade: Massopoda
description: >
  Massopoda is the large clade of plateosaurian sauropodomorphs containing all
  taxa more closely related to Saltasaurus than to Plateosaurus, thereby uniting
  Massospondylidae, Riojasauridae, the sauropodiform grade, and the sauropods.
  Its members span the small bipedal massospondylids through the gigantic
  quadrupedal sauropods, and the clade encompasses the great majority of
  sauropodomorph diversity.
erected_in: yates2007
diagnostic_features:
  - Anterior end of the premaxilla deflected to form an enlarged narial region
  - Reduced or absent lateral lamina of the prefrontal
  - Distal end of the tibia with a transversely expanded, sub-rectangular outline
  - Trend toward enlarged body size and graviportal limb proportions
references:
