clade: Massopoda
description: >
  Massopoda is a clade of sauropodomorph dinosaurs that lived from the Late
  Triassic through the Late Cretaceous. It is defined as all sauropodomorphs
  more closely related to Saltasaurus than to Plateosaurus, and its name is a
  contraction of Massospondylidae and Sauropoda, two very different groups that
  both fall within it. Nested inside is the more exclusive Sauropodiformes, the
  most inclusive group that contains Saltasaurus but excludes Massospondylus.
  Its members range from small, bipedal massospondylids to the gigantic,
  quadrupedal true sauropods, and together they encompass the great majority of
  sauropodomorph diversity.
erected_in: yates2007a
diagnostic_features:
  - Anterior end of the premaxilla deflected to form an enlarged narial region
  - Reduced or absent lateral lamina of the prefrontal
  - Distal end of the tibia with a transversely expanded, sub-rectangular outline
  - Trend toward enlarged body size and graviportal limb proportions
references:
