clade: Dromaeosaurinae
description: >
  Dromaeosaurinae is a subfamily of eudromaeosaurian dromaeosaurids containing
  the type genus Dromaeosaurus and its close relatives, including the large-bodied
  Utahraptor and Achillobator. Members are robustly built predators with deep,
  massive skulls and comparatively coarse tooth serrations. The precise content of
  the subfamily varies between analyses, but Dromaeosaurus, Utahraptor, and
  Achillobator are consistently included.
type_genus: Dromaeosaurus
erected_in: matthew1922
diagnostic_features:
  - Deep, robust, and heavily constructed skull
  - Large, coarse denticles on both carinae of the lateral teeth
  - Robust, D-shaped premaxillary teeth
