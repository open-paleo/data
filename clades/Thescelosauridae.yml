clade: Thescelosauridae
description: >
  Thescelosauridae is a clade of small to medium-sized basal neornithischians
  that lies outside Cerapoda, comprising the subfamilies Orodrominae and
  Thescelosaurinae. Its members were stocky, ground-dwelling herbivores of the
  Cretaceous, several of them adapted for burrowing, ranging from North America
  and Asia. The junior synonym Parksosauridae Buchholz, 2002 covers the same
  clade; Thescelosauridae has nomenclatural precedence and is the name in
  prevailing use.
type_genus: Thescelosaurus
erected_in: sternberg1937
described_in: madzia2021
diagnostic_features:
  - Fossa developed on the premaxilla-maxilla boundary
  - Fossa on the pterygoid wing of the quadrate
  - Laterally flattened greater trochanter of the femur
  - Overhanging lateral condyle of the tibia
  - Squared to rounded lateral distal tarsal
