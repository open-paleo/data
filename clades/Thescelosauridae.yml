clade: Thescelosauridae
description: >
  Thescelosauridae is a clade of small to medium-sized neornithischian dinosaurs
  from the Cretaceous of North America, East Asia and South America, lying
  outside the more derived Cerapoda. It is divided into two subgroups (Madzia
  and colleagues, 2021): Orodrominae, which includes Orodromeus, Oryctodromeus,
  Zephyrosaurus and Albertadromeus along with the Asian Changchunsaurus, Haya
  and Koreanosaurus, and Thescelosaurinae, which unites Parksosaurus,
  Thescelosaurus and the South American Notohypsilophodon. Other analyses
  instead place Jeholosaurus, Changchunsaurus and other small Asian forms within
  Thescelosaurinae (Fonseca and colleagues, 2024; Jung and colleagues, 2026).
  Its members were stocky, ground-dwelling herbivores that browsed selectively
  on soft, pulpy plant matter. Some of the orodromines appear to have been
  burrowers, a habit demonstrated by Oryctodromeus, whose remains have been
  found preserved within a burrow. The name Parksosauridae has been applied to
  the same group, but Thescelosauridae is the older name.
type_genus: Thescelosaurus
erected_in: sternberg1937a
described_in: madzia2021a
diagnostic_features:
  - Fossa developed on the premaxilla-maxilla boundary
  - Fossa on the pterygoid wing of the quadrate
  - Laterally flattened greater trochanter of the femur
  - Overhanging lateral condyle of the tibia
  - Squared to rounded lateral distal tarsal
references:
  - id: sternberg1937a
    notes: Origin of the family-group name Thescelosauridae.
  - id: madzia2021a
    notes: Defined Thescelosauridae and listed Parksosauridae Buchholz, 2002 as
      a name used for the same contents.
  - id: buchholz2002a
    notes: Coined Parksosauridae, a junior synonym covering the same clade as Thescelosauridae.
  - id: fonseca2024a
    notes: Recovered Jeholosaurus and Changchunsaurus within Thescelosaurinae,
      rendering Jeholosauridae inapplicable.
  - id: jung2026a
    notes: Described Doolysaurus and recovered it and other small Asian taxa
      within Thescelosaurinae in the Fonseca dataset.
