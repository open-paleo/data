clade: Thescelosauridae
description: >
  Thescelosauridae is a clade of small to medium-sized neornithischian dinosaurs
  from the Cretaceous of North America and East Asia, lying outside the more
  derived Cerapoda. It is divided into two subgroups: Orodrominae, which
  includes Orodromeus, Oryctodromeus, Zephyrosaurus, and Albertadromeus, and
  Thescelosaurinae, which unites Parksosaurus, Thescelosaurus, and several
  long-snouted Asian forms once placed with the jeholosaurids. Its members were
  stocky, ground-dwelling herbivores that browsed selectively on soft, pulpy
  plant matter. Some of the orodromines appear to have been burrowers, a habit
  demonstrated by Oryctodromeus, whose remains have been found preserved within
  a burrow. The name Parksosauridae has been applied to the same group of
  animals, but Thescelosauridae holds nomenclatural precedence and is the name
  in prevailing use.
type_genus: Thescelosaurus
erected_in: sternberg1937a
described_in: madzia2021a
diagnostic_features:
  - Fossa developed on the premaxilla-maxilla boundary
  - Fossa on the pterygoid wing of the quadrate
  - Laterally flattened greater trochanter of the femur
  - Overhanging lateral condyle of the tibia
  - Squared to rounded lateral distal tarsal
references:
  - id: sternberg1937a
    notes: Origin of the family-group name Thescelosauridae.
  - id: madzia2021a
    notes: Provides the modern phylogenetic definition of Thescelosauridae and
      treats Parksosauridae as a junior synonym.
  - id: buchholz2002a
    notes: Coined Parksosauridae, a junior synonym covering the same clade as Thescelosauridae.
