clade: Bagualosauria
description: >
  Bagualosauria is the clade of sauropodomorphs comprising Bagualosaurus and all
  more derived forms (Plateosauria, including the sauropods), to the exclusion of
  the basalmost Carnian sauropodomorphs and Saturnaliidae. Erected to capture the
  transition toward bulk herbivory and larger body size, it marks the point on
  the sauropodomorph stem where more leaf-shaped dentition and heavier builds
  appear.
erected_in: pretto2019a
diagnostic_features:
  - Increased body size relative to the basalmost sauropodomorphs
  - Cheek teeth more uniformly leaf-shaped, with coarser marginal serrations
  - More robust, weight-bearing hindlimb proportions
  - Expanded, more anteroposteriorly elongate ilium
references:
  - id: pretto2019a
    notes: Named Bagualosauria.
