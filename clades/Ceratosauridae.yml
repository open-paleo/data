clade: Ceratosauridae
description: >
  Ceratosauridae is a small family of ceratosaurian theropods comprising the
  Late Jurassic Ceratosaurus and the Early Cretaceous Genyodectes, recovered as
  the sister group of Abelisauroidea in most analyses. Its members are
  large-bodied ceratosaurs with elongate, blade-like teeth and, in Ceratosaurus,
  a row of midline osteoderms along the back and tail. The family occupies a
  position outside the abelisaurid–noasaurid radiation.
type_genus: Ceratosaurus
erected_in: marsh1884
diagnostic_features:
  - Greatly elongate maxillary and dentary tooth crowns that extend below the
    ventral margin of the jaws when the mouth is closed.
  - Nasal horn and paired lacrimal ridges (in Ceratosaurus).
  - Row of small median osteoderms along the dorsal midline (in Ceratosaurus).
  - Retention of a relatively deep, unornamented antorbital region compared to
    abelisaurids.
