clade: Ceratosauridae
description: >
  Ceratosauridae is a family of ceratosaurian theropod dinosaurs known mainly
  from the Late Jurassic Ceratosaurus, with the fragmentary Genyodectes of
  Cretaceous Patagonia being the only other widely recognized member. It falls
  within the more exclusive clade Neoceratosauria as the sister group to
  Abelisauroidea, the branch of ceratosaurs that includes the abelisaurids and
  noasaurids. Because Genyodectes is known from such incomplete remains, it is
  difficult to separate features that characterize the whole family from those
  unique to Ceratosaurus, and the traits shown to unite the two genera come
  chiefly from their teeth. Its members were large-bodied predators, and the
  group's limits remain unsettled: animals such as Eoabelisaurus and
  Ostafrikasaurus are probable ceratosaurs whose membership in the family is
  uncertain.
type_genus: Ceratosaurus
erected_in: marsh1884a
diagnostic_features:
  - Greatly elongate maxillary and dentary tooth crowns that extend below the
    ventral margin of the jaws when the mouth is closed
  - Nasal horn and paired lacrimal ridges (in Ceratosaurus)
  - Row of small median osteoderms along the dorsal midline (in Ceratosaurus)
  - Retention of a relatively deep, unornamented antorbital region compared to
    abelisaurids
references:
  - id: marsh1884a
    notes: Named the family Ceratosauridae for Ceratosaurus.
