clade: Megalosaurinae
description: >
  Megalosaurinae is the subfamily of megalosaurid theropods containing the large,
  robust Middle to Late Jurassic predators Megalosaurus, Torvosaurus,
  Duriavenator and Wiehenvenator. Defined as all megalosaurids closer to
  Megalosaurus than to Afrovenator, it is consistently recovered as the sister
  group of Afrovenatorinae within Megalosauridae, with Duriavenator the basalmost
  and stratigraphically oldest member and Torvosaurus the most derived.
type_genus: Megalosaurus
erected_in: fitzinger1843a
described_in: carrano2012a
references:
