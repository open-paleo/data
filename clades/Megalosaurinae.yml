clade: Megalosaurinae
description: >
  Megalosaurinae is one of the two subfamilies of Megalosauridae, a group of
  large, robust carnivorous theropod dinosaurs that lived from the Middle to
  Late Jurassic. It is defined as all megalosaurids more closely related to
  Megalosaurus than to Afrovenator, making it the counterpart to the subfamily
  Afrovenatorinae. Its members include Megalosaurus, Torvosaurus, Duriavenator,
  and Wiehenvenator, which were among the largest predators of their time, with
  some exceeding a tonne in weight. Their fossils come chiefly from Europe and
  North America, and scattered teeth suggest the group may have ranged more
  widely across the Jurassic world.
type_genus: Megalosaurus
erected_in: fitzinger1843a
described_in: carrano2012a
diagnostic_features:
  - Premaxilla with a greater height-to-length ratio below the external naris
    than in other megalosaurids, giving a taller snout tip
references:
  - id: fitzinger1843a
    notes: Origin of the family-group name Megalosauridae, and by coordination
      the subfamily Megalosaurinae.
  - id: carrano2012a
    notes: Provided the phylogenetic definition and diagnosis of Megalosaurinae.
