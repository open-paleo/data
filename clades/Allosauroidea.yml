clade: Allosauroidea
description: >
  Allosauroidea is a superfamily of carnosaurian theropods comprising the
  metriacanthosaurids and the allosaurians (Allosauridae plus Carcharodontosauria).
  Allosauroids were medium- to gigantic-sized bipedal predators that dominated
  many terrestrial ecosystems from the Middle Jurassic to the early Late
  Cretaceous, and are typified by large skulls, frequently ornamented with crests
  or rugosities, and by long, laterally compressed, serrated teeth.
