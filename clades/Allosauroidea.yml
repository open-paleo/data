clade: Allosauroidea
description: >
  Allosauroidea is a superfamily of carnosaurian theropod dinosaurs comprising
  the metriacanthosaurids (sinraptorids), the allosaurids, and the
  carcharodontosaurians. Its members were among the first giant predators in
  theropod history, some weighing more than two tons, and together with the
  megalosauroids they served as apex predators from the Middle Jurassic to the
  early Late Cretaceous. Fossils have been recovered across North America, South
  America, Europe, Africa, and Asia, though in North America and Asia
  allosauroids were eventually replaced by the tyrannosauroids during the Late
  Cretaceous. These medium- to gigantic-sized bipedal hunters are distinguished
  by large, narrow skulls roughly two and a half to three times longer than
  tall, frequently ornamented with crests or rugosities, and by long, laterally
  compressed, serrated teeth well suited to slicing flesh from prey.
type_genus: Allosaurus
erected_in: currie1993c
diagnostic_features:
  - Antorbital sinus invades the interior of the lacrimal, nasal, and jugal
  - Quadrate–quadratojugal fenestra present, with an associated pneumatic sinus
  - Pneumatic basisphenoid recess opening the braincase posteriorly between
    non-pedunculate basal tubera
  - Downturned paroccipital processes
  - Triangular, elongate scapular blade sharply set off from the acromial
    process and glenoid lip
  - Obturator fenestra of the ischium opening into a notch to form a distinct
    obturator process
references:
  - id: currie1993c
    notes: Defined Allosauroidea and provided the shared cranial and postcranial
      characters used here as its diagnosis.
