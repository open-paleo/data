clade: Neosauropoda
description: >
  Neosauropoda is a clade of sauropod dinosaurs that contains the majority of
  sauropod genera and is divided into two major subgroups, Diplodocoidea and
  Macronaria. Its members include familiar long-necked giants such as
  Apatosaurus, Brachiosaurus, and Diplodocus, as well as some of the largest
  land animals ever to have lived, among them Argentinosaurus, Patagotitan, and
  Sauroposeidon. Neosauropods arose in the Early Jurassic, quickly becoming the
  dominant large herbivores, and persisted until the Cretaceous–Paleogene
  extinction; diplodocids and brachiosaurids made up much of the group during
  the Jurassic before being widely replaced by titanosaurs through the
  Cretaceous. Like all sauropods they shared the basic body plan of great size,
  long necks, and columnar legs, but they are set apart by a suite of derived
  features of the skull, teeth, hand, and hindlimb, including the loss of tooth
  denticles and a hand reduced to two or fewer wrist bones.
