clade: Lirainosaurinae
description: >
  Lirainosaurinae is a subfamily of lithostrotian titanosaur sauropods known
  from the Late Cretaceous of Europe, spanning roughly the late Campanian to the
  early Maastrichtian. It groups a set of European titanosaurs, defined as the
  common ancestor of Lirainosaurus and Ampelosaurus and all of its descendants,
  with Atsinganosaurus among them (Díez Díaz and colleagues, 2018) and
  Garrigatitan added later (Díez Díaz and colleagues, 2021). Its members are
  generally small- to medium-sized and gracile forms recovered from France and
  Spain, distinguished by details of their teeth, vertebrae, and osteoderms. The
  subfamily's broader position among titanosaurs remains unsettled; Carballido
  and colleagues (2022) read the results of Díez Díaz and colleagues as placing
  it early within Colossosauria, closer to Lognkosauria than to Saltasaurinae.
erected_in: díezdíaz2018a
type_genus: Lirainosaurus
diagnostic_features:
  - Slender, high-crowned teeth with a low slenderness index relative to other
    titanosaurs
  - Anterior caudal vertebrae with dorsoventrally tall neural arches
  - Osteoderms of relatively small size with a bulb-and-root structure
  - Gracile limb proportions
dispute:
  summary: >
    The higher placement of Lirainosaurinae is unsettled and weakly supported.
    The analyses that erected and expanded it (Díez Díaz and colleagues, 2018,
    2021) recover it within Lithostrotia without resolving deeper nodes,
    explicitly moving Lirainosaurus away from an earlier position close to
    Saltasauridae. Later work scatters its members across Lithostrotia: Vila and
    colleagues (2022) do not recover the subfamily, placing most Ibero-Armorican
    titanosaurs in Opisthocoelicaudiinae and Atsinganosaurus with South American
    taxa such as Argentinosaurus and Patagotitan; Jones (2026) places it within
    Colossosauria; and Díez Díaz and colleagues (2025) recover the subfamily
    only under one weighting scheme (as a clade just outside Saltasauridae) and
    not under another, with Ampelosaurus flagged as possibly chimeric. It is
    placed conservatively at Lithostrotia, the least-inclusive node consistent
    with all of these hypotheses.
  history:
    - date: "2026-06-30"
      note: >
        Retained at Saltasauroidea pending review; the erecting analysis (Díez
        Díaz and colleagues, 2018) recovers the subfamily within Lithostrotia and Jones
        (2026) within Colossosauria.
    - date: "2026-07-13"
      note: >
        Reparented from Saltasauroidea to Lithostrotia. No analysis robustly
        supports a saltasauroid position: Díez Díaz and colleagues (2018, 2021) recover
        the subfamily within Lithostrotia with deeper nodes unresolved, Jones
        (2026) places it in Colossosauria, and Díez Díaz and colleagues (2025) recover
        it (only under implied weighting) just outside Saltasauridae.
        Lithostrotia is the least-inclusive shared node.
references:
  - id: díezdíaz2018a
    notes: Erected Lirainosaurinae; recovered within Lithostrotia, away from Saltasauridae.
  - id: díezdíaz2021a
    notes: Recovered Lirainosaurinae as a monophyletic lithostrotian clade including Garrigatitan.
  - id: vila2022a
    notes: Did not recover Lirainosaurinae, placing most Ibero-Armorican
      titanosaurs in Opisthocoelicaudiinae and Atsinganosaurus with South American
      taxa near Patagotitan.
  - id: díaz2025a
    notes: Recovered Lirainosaurinae just outside Saltasauridae under implied weighting; not monophyletic under equal weights.
  - id: jones2026b
    notes: Placement and assessment in the Princeton Encyclopedia of Dinosaurs.
  - id: carballido2022a
    notes: Read the analyses of Díez Díaz and colleagues as placing
      Lirainosaurinae early within Colossosauria, closer to Lognkosauria than to
      Saltasaurinae.
