clade: Lirainosaurinae
description: >
  Lirainosaurinae is a subfamily of lithostrotian titanosaur sauropods known
  from the Late Cretaceous of Europe, spanning roughly the late Campanian to the
  early Maastrichtian. It groups a set of European titanosaurs—among them
  Lirainosaurus, Ampelosaurus, Atsinganosaurus, Lohuecotitan, and
  Paludititan—along with their common ancestor and all of its descendants. Its
  members are generally small- to medium-sized and gracile forms recovered from
  France, Spain, and Romania, distinguished by details of their teeth,
  vertebrae, and osteoderms. The subfamily's broader position among titanosaurs
  remains unsettled, having been recovered as intermediate between the
  Saltasauridae and clades such as Aeolosaurini and Lognkosauria.
erected_in: díezdíaz2018a
type_genus: Lirainosaurus
diagnostic_features:
  - Slender, high-crowned teeth with a low slenderness index relative to other
    titanosaurs
  - Anterior caudal vertebrae with dorsoventrally tall neural arches
  - Osteoderms of relatively small size with a bulb-and-root structure
  - Gracile limb proportions
dispute:
  summary: >
    The higher placement of Lirainosaurinae is unsettled and weakly supported.
    The analyses that erected and expanded it (Díez Díaz et al., 2018, 2020)
    recover it within Lithostrotia without resolving deeper nodes, explicitly
    moving Lirainosaurus away from an earlier position close to Saltasauridae.
    Later work scatters its members across Lithostrotia: Vila et al. (2022)
    place them near Opisthocoelicaudiinae, the Princeton Encyclopedia (Jones,
    2026) within Colossosauria, and Díez Díaz et al. (2025) recover the
    subfamily only under one weighting scheme (as a clade just outside
    Saltasauridae) and not under another, with Ampelosaurus flagged as possibly
    chimaeric. It is placed conservatively at Lithostrotia, the least-inclusive
    node consistent with all of these hypotheses.
  history:
    - date: "2026-06-30"
      note: >
        Retained at Saltasauroidea pending review; the erecting analysis (Díez
        Díaz et al., 2018) recovers the subfamily within Lithostrotia and Jones
        (2026) within Colossosauria.
    - date: "2026-07-13"
      note: >
        Reparented from Saltasauroidea to Lithostrotia. No analysis robustly
        supports a saltasauroid position: Díez Díaz et al. (2018, 2020) recover
        the subfamily within Lithostrotia with deeper nodes unresolved, Jones
        (2026) places it in Colossosauria, and Díez Díaz et al. (2025) recover
        it (only under implied weighting) just outside Saltasauridae.
        Lithostrotia is the least-inclusive shared node.
references:
  - id: díezdíaz2018a
    notes: Erected Lirainosaurinae; recovered within Lithostrotia, away from Saltasauridae.
  - id: díezdíaz2020a
    notes: Recovered Lirainosaurinae as a monophyletic lithostrotian clade including Garrigatitan.
  - id: vila2022a
    notes: Recovered the Ibero-Armorican lirainosaurines near Opisthocoelicaudiinae.
  - id: díaz2025a
    notes: Recovered Lirainosaurinae just outside Saltasauridae under implied weighting; not monophyletic under equal weights.
  - id: jones2026b
    notes: Placement and assessment in the Princeton Encyclopedia of Dinosaurs.
