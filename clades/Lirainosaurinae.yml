clade: Lirainosaurinae
description: >
  Lirainosaurinae is a subfamily of lithostrotian titanosaur sauropods known
  from the Late Cretaceous of Europe, spanning roughly the late Campanian to the
  early Maastrichtian. It groups a set of European titanosaurs—among them
  Lirainosaurus, Ampelosaurus, Atsinganosaurus, Lohuecotitan, and
  Paludititan—along with their common ancestor and all of its descendants. Its
  members are generally small- to medium-sized and gracile forms recovered from
  France, Spain, and Romania, distinguished by details of their teeth,
  vertebrae, and osteoderms. The subfamily's broader position among titanosaurs
  remains unsettled, having been recovered as intermediate between the
  Saltasauridae and clades such as Aeolosaurini and Lognkosauria.
erected_in: díezdíaz2018a
type_genus: Lirainosaurus
diagnostic_features:
  - Slender, high-crowned teeth with a low slenderness index relative to other
    titanosaurs
  - Anterior caudal vertebrae with dorsoventrally tall neural arches
  - Osteoderms of relatively small size with a bulb-and-root structure
  - Gracile limb proportions
dispute:
  summary: >
    The higher placement of Lirainosaurinae is unsettled. Díez Díaz et al. (2018)
    recovered the subfamily among saltasauroid titanosaurs, and it is placed here
    within Saltasauroidea following that dedicated analysis. The Princeton
    Encyclopedia (Jones, 2026) instead classifies the lirainosaurines within
    Colossosauria. The conflict reflects the unstable position of the European
    titanosaurs across matrices.
  history:
    - date: "2026-06-30"
      note: >
        Placed within Saltasauroidea following Díez Díaz et al. (2018); the
        competing placement within Colossosauria (Jones, 2026) is noted.
references:
  - id: díezdíaz2018a
    notes: Erected Lirainosaurinae.
  - id: jones2026b
    notes: Placement and assessment in the Princeton Encyclopedia of Dinosaurs.
