clade: Noasaurinae
description: >
  Noasaurinae is the subfamily of noasaurids containing Noasaurus and its close
  relatives, defined as all noasaurids more closely related to Noasaurus than to
  Elaphrosaurus. The name dates by coordination from Bonaparte and Powell's
  family Noasauridae and was given a phylogenetic definition by Rauhut and
  Carrano. Its members — Noasaurus, Masiakasaurus, Velocisaurus, Vespersaurus,
  and Laevisuchus — form a Late Cretaceous Gondwanan radiation of small,
  sickle-clawed predators with distinctive procumbent anterior teeth.
type_genus: Noasaurus
erected_in: bonaparte1980
described_in: rauhut2016b
diagnostic_features:
  - Reduced proximal end of metatarsal II.
  - Procumbent, forward-projecting anterior dentary teeth in several members.
  - Strongly recurved, enlarged pedal or manual ungual.
  - Cervical vertebrae with well-developed epipophyses.
