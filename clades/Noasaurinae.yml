clade: Noasaurinae
description: >
  Noasaurinae is a subfamily of small ceratosaurian theropod dinosaurs that
  formed a Late Cretaceous radiation across the southern landmasses, with
  members known from South America, Madagascar, and India (then an island near
  Madagascar), plus indeterminate remains later reported from Australia. Because
  many of its members are fragmentary, much of their appearance and biology is
  inferred from Masiakasaurus, the most complete noasaurine. These animals
  generally had bodies resembling more conventional theropods, but with unusual
  jaws: Masiakasaurus bore a downturned lower jaw whose long, spoon-shaped front
  teeth splayed forward and carried serrations along their outer edges. At least
  one member, Noasaurus, had a large, deeply curved sickle-shaped hand claw,
  while Velocisaurus took the group's foot-bone reductions to an extreme. Their
  diet is uncertain, with proposals ranging from fish to insects and other small
  prey.
type_genus: Noasaurus
erected_in: bonaparte1980a
described_in: rauhut2016b
diagnostic_features:
  - Reduced proximal end of metatarsal II.
  - Procumbent, forward-projecting anterior dentary teeth in several members.
  - Strongly recurved, enlarged pedal or manual ungual.
  - Cervical vertebrae with well-developed epipophyses.
references:
  - id: bonaparte1980a
    notes: Named Noasaurus, the basis for Noasaurinae by coordination.
  - id: rauhut2016b
    notes: Provided the phylogenetic definition of Noasaurinae.
