clade: Allosauria
description: >
  Allosauria is a clade of allosauroid theropods comprising Allosauridae and
  Carcharodontosauria, recovered as the sister group of the metriacanthosaurids
  within Allosauroidea. The group unites the well-known Late Jurassic Allosaurus
  with the giant carcharodontosaurians that were among the largest terrestrial
  predators of the Cretaceous.
erected_in: paul1988a
described_in: carrano2012a
diagnostic_features:
  - Maxilla with a prominent horizontal ridge (lingual bar) between the palatal
    process and the antorbital fenestra
  - Paradental plates of the dentary fused into a continuous medial lamina, with
    the tooth replacement groove absent
  - Retroarticular process wider mediolaterally than the posterior width of the
    dentary
  - Pneumatic pleurocoelous fossae on the sacral vertebral centra
  - Iliac pubic peduncle elongate, more than twice as long as wide
  - Ischial symphysis expanded into an apron
references:
  - id: paul1988a
  - id: carrano2012a
