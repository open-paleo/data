clade: Allosauria
description: >
  Allosauria is a clade of allosauroid theropods comprising Allosauridae and
  Carcharodontosauria, recovered as the sister group of the metriacanthosaurids
  within Allosauroidea. The group unites the well-known Late Jurassic Allosaurus
  with the giant carcharodontosaurians that were among the largest terrestrial
  predators of the Cretaceous.
