clade: Coelophysidae
rank: family
type_genus: Coelophysis
erected_in: nopcsa1928c
described_in: holtz1994a
diagnostic_features:
  - Long, low skull with a pronounced subnarial gap and a loosely attached
    premaxilla
  - Numerous slender, recurved and finely serrated teeth
  - Fused clavicles forming a furcula
  - Elongate, gracile limb bones with a strongly cursorial hindlimb
references:
  - id: nopcsa1928c
    notes: Named the subfamily Coelophysinae within Podokesauridae, from which the
      family name takes its authorship by coordination.
  - id: holtz1994a
    notes: Provided the phylogenetic definition of Coelophysidae used for the clade.
