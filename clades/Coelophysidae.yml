clade: Coelophysidae
description: >
  Coelophysidae is the most diverse and best-documented family of early
  neotheropods, spanning the Late Triassic to Early Jurassic of the Americas,
  Africa, Europe and Asia. It is defined as the least-inclusive clade containing
  Coelophysis and Procompsognathus, and encompasses the derived group uniting
  Coelophysis with Camposaurus, Megapnosaurus and Segisaurus. Coelophysids were
  small, gracile, cursorial predators frequently preserved in dense, sometimes
  monospecific bonebeds.
type_genus: Coelophysis
erected_in: nopcsa1928c
described_in: holtz1994a
diagnostic_features:
  - Long, low skull with a pronounced subnarial gap and a loosely attached
    premaxilla
  - Numerous slender, recurved and finely serrated teeth
  - Fused clavicles forming a furcula
  - Elongate, gracile limb bones with a strongly cursorial hindlimb
references:
  - id: nopcsa1928c
    notes: Original proposal of the coelophysid family-group name.
  - id: holtz1994a
    notes: Provided the phylogenetic definition of Coelophysidae adopted here.
