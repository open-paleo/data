clade: Somphospondyli
description: >
  Somphospondyli is a clade of titanosauriform sauropods defined as all taxa
  more closely related to Saltasaurus than to Brachiosaurus, and is the sister
  group to Brachiosauridae within Titanosauriformes. It contains the diverse,
  largely Cretaceous Titanosauria together with a paraphyletic array of basal,
  non-titanosaurian forms and the East Asian clade Euhelopodidae. The group is
  named for its characteristically spongy, camellate internal bone tissue, which
  pervaded the presacral and sometimes the caudal vertebrae.
erected_in: wilsonsereno1998
diagnostic_features:
  - Spongy (somphospondylous) camellate internal tissue throughout the
    presacral vertebrae
  - Six sacral vertebrae
  - Convex anterior articular surfaces on at least the proximal caudal centra
  - Cervical vertebrae with reduced or absent pleurocoel-dividing laminae
  - Sternal plates with a crescentic (reniform) outline in many members
