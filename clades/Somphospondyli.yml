clade: Somphospondyli
description: >
  Somphospondyli is a clade of titanosauriform sauropod dinosaurs that lived
  from the Late Jurassic to the end of the Cretaceous, with remains found on
  every continent. It embraces all titanosauriforms more closely related to the
  giant, largely Cretaceous titanosaurs than to the brachiosaurids, and so
  unites the diverse Titanosauria with the East Asian euhelopodids and an
  assortment of more basal, non-titanosaurian forms. Members are distinguished
  by details of their vertebrae, including a long neck and internal bone tissue
  riddled with a sponge-like network of air-filled chambers. It is this spongy,
  camellate texture pervading the backbone that gives the group its name.
erected_in: wilson1998a
diagnostic_features:
  - Spongy (somphospondylous) camellate internal tissue throughout the
    presacral vertebrae
  - Six sacral vertebrae
  - Convex anterior articular surfaces on at least the proximal caudal centra
  - Cervical vertebrae with reduced or absent pleurocoel-dividing laminae
  - Sternal plates with a crescentic (reniform) outline in many members
references:
  - id: wilson1998a
