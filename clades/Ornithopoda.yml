clade: Ornithopoda
description: >
  Ornithopoda, meaning "bird feet," is a clade of cerapodan ornithischian
  dinosaurs that includes the iguanodonts and hadrosaurs together with a grade
  of smaller basal members and the restricted Hypsilophodontidae. Ornithopods
  were among the most successful and widespread herbivorous dinosaurs, ranging
  from small Jurassic bipeds to large quadrupedal Late Cretaceous hadrosaurs,
  and are characterized by an efficient pleurokinetic jaw mechanism that allowed
  transverse chewing of plant material.
erected_in: marsh1881a
described_in: madzia2021
diagnostic_features:
  - Pleurokinetic skull permitting lateral rotation of the maxillae during chewing
  - Jugal positioned well above the level of the quadrate condyles
  - Lowered mandibular glenoid, offsetting the jaw joint below the tooth row
  - Dentary crowns lacking a primary labial swelling; dentary tooth roots curved
  - Elongate prepubic process of the pubis
