clade: Ornithopoda
description: >
  Ornithopoda, meaning "bird feet," is a clade of ornithischian dinosaurs that
  includes the iguanodonts and hadrosaurs along with a range of smaller, more
  basal members. Known worldwide, ornithopods were among the most successful
  herbivorous dinosaurs of the Cretaceous, ranging from small, fast-running
  Jurassic bipeds to the large quadrupedal duck-billed hadrosaurs, some of which
  grew as heavy as medium-sized sauropods before dying out in the end-Cretaceous
  extinction. Their key evolutionary advantage was a progressively refined
  chewing apparatus, ultimately the most sophisticated of any non-avian
  dinosaur, that let them process tough plant material through a grinding,
  transverse jaw action. They are further distinguished by their characteristic
  birdlike feet, the lack of body armor, an elongated pubis, and the absence of
  an opening in the lower jaw. Early forms were mainly browsers or fruit-eaters,
  while larger, more derived members were bulk feeders capable of subsisting on
  coarse, low-nutrient vegetation.
erected_in: marsh1881a
described_in: madzia2021a
diagnostic_features:
  - Pleurokinetic skull permitting lateral rotation of the maxillae during chewing
  - Jugal positioned well above the level of the quadrate condyles
  - Lowered mandibular glenoid, offsetting the jaw joint below the tooth row
  - Dentary crowns lacking a primary labial swelling; dentary tooth roots curved
  - Elongate prepubic process of the pubis
references:
  - id: marsh1881a
    notes: Erected Ornithopoda; read before the National Academy of Sciences in November 1881 and published in 1882.
  - id: madzia2021a
    notes: Provides the modern phylogenetic definition of Ornithopoda.
