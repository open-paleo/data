clade: Piatnitzkysauridae
description: >
  Piatnitzkysauridae is a family of comparatively small, basal megalosauroid
  theropods from the Middle to Late Jurassic, comprising Piatnitzkysaurus,
  Condorraptor and Marshosaurus, and in some analyses the Chinese Xuanhanosaurus.
  Named by Carrano, Benson and Sampson (2012), it is the basalmost clade of
  Megalosauroidea and the sister group of Megalosauria.
type_genus: Piatnitzkysaurus
erected_in: carrano2012a
diagnostic_features:
  - Two parallel rows of nutrient foramina on the lateral surface of the maxilla
  - Vertically striated (ridged) paradental plates
  - Reduced atlas-axis parapophyses
  - Anteriorly inclined posterior dorsal neural spines
  - Canted distal humeral condyles
references:
  - id: carrano2012a
