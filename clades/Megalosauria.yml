clade: Megalosauria
description: >
  Megalosauria is a node-based clade of tetanuran theropod dinosaurs, comprising
  the most recent common ancestor of Megalosaurus and Spinosaurus together with
  all of its descendants. It sits within the broader superfamily Megalosauroidea
  and unites two major lineages: the megalosaurids, large-bodied terrestrial
  predators such as Megalosaurus and Torvosaurus, and the specialized
  spinosaurids such as Spinosaurus. The more basal piatnitzkysaurids fall
  outside the clade, while Streptospondylus, known mainly from fragmentary
  remains, is difficult to place with confidence and is treated as a wildcard
  taxon near its base. Its members lived from the Middle Jurassic through the
  Late Cretaceous.
erected_in: bonaparte1850a
described_in: carrano2012a
diagnostic_features:
  - External naris positioned behind the premaxillary tooth row
  - Lateral lamina of the maxilla forming a large shelf that obscures the
    anteroventral corner of the antorbital fossa
  - Broad midline depression on the basioccipital about two-thirds the width of
    the occipital condyle
  - Enlarged, subcircular third dentary alveolus
  - Iliac pubic peduncle with a length-to-width ratio of about 1.55 to 1.75
  - Stout, bar-like medial distal crest on the femur
references:
  - id: bonaparte1850a
    notes: Origin of the name Megalosauria, applied as a node-based clade by
      Carrano et al. (2012).
  - id: carrano2012a
