clade: Megalosauria
description: >
  Megalosauria is the node-based clade uniting Megalosauridae and Spinosauridae
  within Megalosauroidea, to the exclusion of Piatnitzkysauridae. The name,
  coined by Bonaparte in 1850, was applied to this node by Carrano, Benson and
  Sampson (2012). It contains the large megalosaurid predators and the
  specialized spinosaurids, along with basal, poorly resolved members such as
  Streptospondylus and Eustreptospondylus.
erected_in: bonaparte1850
described_in: carrano2012
diagnostic_features:
  - External naris positioned behind the premaxillary tooth row
  - Lateral lamina of the maxilla forming a large shelf that obscures the
    anteroventral corner of the antorbital fossa
  - Broad midline depression on the basioccipital about two-thirds the width of
    the occipital condyle
  - Enlarged, subcircular third dentary alveolus
  - Iliac pubic peduncle with a length-to-width ratio of about 1.55 to 1.75
  - Stout, bar-like medial distal crest on the femur
