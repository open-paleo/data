clade: Deinonychosauria
description: >
  Deinonychosauria is a clade of paravian theropod dinosaurs that lived from the
  Late Jurassic to the Late Cretaceous, with fossils recovered on nearly every
  continent, from North America and Europe to Asia, Africa, South America, and
  Antarctica. It traditionally unites the dromaeosaurids and the troodontids,
  two families whose members bore enlarged, sickle-shaped claws on the second
  toe. That claw was held clear of the ground in a hyperextended position, so
  that only the third and fourth toes carried the animal's weight while walking,
  an arrangement known as functional didactyly. Most deinonychosaurs were
  predators, though some of the smaller troodontids appear to have been at least
  omnivorous. The group has long been considered among the closest relatives of
  birds, but its exact makeup remains debated: some analyses place troodontids
  nearer to birds than to dromaeosaurids, which would leave the composition of
  the clade unstable beyond the dromaeosaurids themselves.
erected_in: colbertrussell1969a
diagnostic_features:
  - Enlarged, retractable sickle-shaped ungual on pedal digit II
  - Functionally didactyl foot with a raised second toe
  - Elongate penultimate phalanx on pedal digit II
  - Modified metatarsal II permitting hyperextension of the second toe
