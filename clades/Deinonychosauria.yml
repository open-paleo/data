clade: Deinonychosauria
description: >
  Deinonychosauria is the clade of paravian theropods comprising Dromaeosauridae
  and Troodontidae, the closest relatives of birds among non-avialan dinosaurs.
  Its members share an enlarged, retractable sickle claw on the second toe and a
  functionally didactyl foot. Deinonychosauria is recovered as the sister group
  of Avialae in most recent analyses.
erected_in: colbertrussell1969
diagnostic_features:
  - Enlarged, retractable sickle-shaped ungual on pedal digit II
  - Functionally didactyl foot with a raised second toe
  - Elongate penultimate phalanx on pedal digit II
  - Modified metatarsal II permitting hyperextension of the second toe
