clade: Tetanurae
rank: unranked
erected_in: gauthier1986a
diagnostic_features:
  - Stiffened distal tail with interlocking zygapophyses
  - Reduction of the hand to three functional digits (loss of digit IV)
  - Maxillary tooth row restricted to anterior portion of skull, not extending
    posterior to antorbital fenestra
  - Large, well-developed maxillary fenestra
  - Tibia longer than or equal to femur
references:
  - id: gauthier1986a
    notes: Named Tetanurae as a new taxon, defined as birds and all other
      theropods closer to birds than to Ceratosauria.
  - id: sereno1994a
    notes: Described Early Cretaceous Saharan theropods and inferred that
      Ceratosauria and Tetanurae diverged during the Late Triassic.
