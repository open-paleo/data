clade: Velociraptorinae
description: >
  Velociraptorinae is a subfamily of eudromaeosaurian dromaeosaurid dinosaurs,
  traditionally comprising the more slender, narrow-snouted species and centered
  on Velociraptor and its close relatives. Its members are found primarily in
  Asia and include such genera as Tsaagan, Kuru, and Adasaurus, though several
  North American forms have also been assigned to it, including Acheroraptor
  (Evans and colleagues, 2013), Dineobellator (Jasinski and colleagues, 2020)
  and possibly Deinonychus (Napoli and colleagues, 2021). Velociraptorine teeth
  are often distinguished by having larger serrations along the rear edge than
  the front, or by lacking front serrations altogether. It is one of three major
  eudromaeosaurian subgroups, and while widely used, its exact composition is
  contentious: recent analyses move Achillobator and Utahraptor into
  Velociraptorinae and place Deinonychus in either it or Dromaeosaurinae
  (Bindellini and colleagues, 2025). Velociraptorines appear in the Late
  Cretaceous, and the bulk of their diversity, including the famous Velociraptor
  itself, is known from Asia.
type_genus: Velociraptor
erected_in: barsbold1983a
diagnostic_features:
  - Long, low, and narrow snout
  - Dorsally deflected caudal margin of the dentary
  - Elongate maxillary and dentary tooth rows with numerous teeth
references:
  - id: barsbold1983a
  - id: evans2013a
    notes: Described Acheroraptor and recovered it within Velociraptorinae.
  - id: jasinski2020a
    notes: Described Dineobellator and recovered it within Velociraptorinae.
  - id: napoli2021a
    notes: Described a new velociraptorine, noting recent analyses that include
      Deinonychus in Velociraptorinae.
  - id: bindellini2025a
    notes: Noted that recent analyses move Achillobator and Utahraptor into
      Velociraptorinae and recover Deinonychus in either subfamily.
