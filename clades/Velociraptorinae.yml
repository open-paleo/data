clade: Velociraptorinae
description: >
  Velociraptorinae is a subfamily of eudromaeosaurian dromaeosaurids centered on
  the predominantly Asian genus Velociraptor and its relatives, including Tsaagan,
  Linheraptor, Shri, and Kuru, with several North American members. Members
  typically have long, low, and narrow snouts. The subfamily is widely used but
  its content is variable, and it is sometimes recovered as a paraphyletic grade
  toward Dromaeosaurinae.
type_genus: Velociraptor
erected_in: barsbold1983a
diagnostic_features:
  - Long, low, and narrow snout
  - Dorsally deflected caudal margin of the dentary
  - Elongate maxillary and dentary tooth rows with numerous teeth
references:
  - id: barsbold1983a
