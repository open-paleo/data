clade: Velociraptorinae
description: >
  Velociraptorinae is a subfamily of eudromaeosaurian dromaeosaurid dinosaurs,
  traditionally comprising the more slender, narrow-snouted species and centered
  on Velociraptor and its close relatives. Its members are found primarily in
  Asia and include such genera as Tsaagan, Kuru, and Adasaurus, though several
  North American forms like Acheroraptor, Dineobellator, and possibly
  Deinonychus have also been assigned to it. Velociraptorine teeth are often
  distinguished by having larger serrations along the rear edge than the front,
  or by lacking front serrations altogether. It is one of three major
  eudromaeosaurian subgroups, and while widely used, its exact composition is
  contentious: analyses vary greatly over which species truly belong, with some
  placing traditional members closer to Dromaeosaurus instead. Velociraptorines
  appear in the Late Cretaceous, and the bulk of their diversity, including the
  famous Velociraptor itself, is known from Asia.
type_genus: Velociraptor
erected_in: barsbold1983a
diagnostic_features:
  - Long, low, and narrow snout
  - Dorsally deflected caudal margin of the dentary
  - Elongate maxillary and dentary tooth rows with numerous teeth
references:
