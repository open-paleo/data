clade: Allosauridae
description: >
  Allosauridae is a family of medium to large, bipedal, carnivorous allosauroid
  theropod dinosaurs from the Late Jurassic, best known from Allosaurus. Their
  overall anatomy is fairly typical of other theropods, which has long made the
  family's precise membership difficult to define; Saurophaganax has been
  attributed to the group, though some later work reinterprets its remains as
  belonging to Allosaurus and a diplodocid sauropod. Allosaurid skulls carry
  prominent horns or hornlets on the lacrimal bones above the eyes that would
  have been sheathed in keratin, and show marked cranial kinesis, with flexible
  joints that cushioned the skull and let the animals gape their jaws very wide.
  Like most theropods they had short forelimbs relative to their hindlimbs, with
  three-fingered hands bearing long, strongly curved claws suited to raking and
  grasping prey. The pubis is greatly elongated and ends in a broad "foot" that
  likely helped support the body's weight when the animal rested in a crouch.
type_genus: Allosaurus
erected_in: marsh1878a
described_in: carrano2012a
diagnostic_features:
  - Prominent lacrimal horns or hornlets above the eyes
  - Strongly downturned paroccipital processes terminating well ventral to the
    basal tubera
  - Shortened quadrate relative to other allosauroids
  - Expanded distal end of the scapula
references:
  - id: marsh1878a
    notes: Named the family Allosauridae.
  - id: carrano2012a
    notes: Revised Tetanurae, restricting Allosauridae to Allosaurus and
      Saurophaganax.
  - id: currie1993c
    notes: Source of the cranial and pectoral diagnostic characters.
