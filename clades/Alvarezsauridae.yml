clade: Alvarezsauridae
description: >
  Alvarezsauridae is a family of small, long-legged maniraptoran theropods known
  from the Late Cretaceous of South America, North America, and Asia, from the
  Cenomanian to the uppermost Maastrichtian (Fowler and colleagues, 2020).
  Though once interpreted as flightless birds, they are now placed outside
  Avialae among the coelurosaurs (Qin and colleagues, 2019). The family includes
  the large-bodied Patagonykinae of Patagonia, the South American Alvarezsaurus,
  and the miniaturized Parvicursorinae, which some authors treat as the senior
  synonym of Mononykinae (Agnolín and colleagues, 2012). Alvarezsaurids are
  highly specialized animals, with tiny but powerful forelimbs ending in compact
  hands dominated by a single greatly enlarged claw, and long, tube-shaped
  snouts filled with numerous tiny teeth. These traits have led most researchers
  to interpret them as insect-eaters that used their stout arms to dig into ant
  and termite nests, while their long legs suggest they were fast, agile
  runners.
type_genus: Alvarezsaurus
erected_in: bonaparte1991a
diagnostic_features:
  - Presacral vertebrae with ball-and-socket (opisthocoelous) intercentral joints
  - Humerus with a figure-of-eight cross-section
  - Hypertrophied olecranon process of the ulna
  - Symmetrical iliac blade
  - Fully procoelous caudal vertebrae
references:
  - id: bonaparte1991a
  - id: qin2019a
    notes: Described a Jurassic alvarezsaurian from China, reviewing the group's
      earlier interpretation as flightless birds and its placement outside
      Avialae.
  - id: agnolín2012a
    notes: Described Bonapartenykus and named Patagonykinae for it and
      Patagonykus, noting Parvicursorinae is treated by some as the senior
      synonym of Mononykinae.
  - id: fowler2020b
    notes: Described Trierarchuncus from the uppermost Maastrichtian Hell Creek
      Formation, the youngest known alvarezsaurid.
