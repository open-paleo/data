clade: Alvarezsauridae
description: >
  Alvarezsauridae is the derived, short-armed family of alvarezsauroids that
  radiated in the Late Cretaceous of South America, Asia, and North America.
  Node-based as the least-inclusive clade containing Alvarezsaurus and Mononykus,
  it comprises the basal South American genera (Alvarezsaurus, Achillesaurus),
  the large-bodied Patagonykinae, and the diverse, miniaturized Asian
  Parvicursorinae. Alvarezsaurids are marked by a dramatically foreshortened,
  powerful forelimb built around the enlarged thumb, and by extensively fused,
  bird-like hindlimb and vertebral features.
type_genus: Alvarezsaurus
erected_in: bonaparte1991a
diagnostic_features:
  - Presacral vertebrae with ball-and-socket (opisthocoelous) intercentral joints
  - Humerus with a figure-of-eight cross-section
  - Hypertrophied olecranon process of the ulna
  - Symmetrical iliac blade
  - Fully procoelous caudal vertebrae
references:
