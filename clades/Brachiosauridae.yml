clade: Brachiosauridae
description: >
  Brachiosauridae is a family of large, quadrupedal, plant-eating sauropod
  dinosaurs and one of the main groups within Titanosauriformes, alongside the
  Euhelopodidae and the Titanosauria. Its members, which include Brachiosaurus,
  the African Giraffatitan, and the possible island dwarf Europasaurus, lived
  from the Late Jurassic into the Cretaceous across what are now North and South
  America, Africa, and Europe. Brachiosaurids are best known for their unusually
  long necks, which let them browse foliage from the tops of tall conifers
  beyond the reach of other sauropods. Their forelimbs are longer than or
  roughly equal to the hindlimbs, more so than in other macronarians, giving
  them an elevated, giraffe-like stance. They also bore broad, spoon-shaped
  teeth suited to biting through tough vegetation, along with distinctive traits
  of the back vertebrae and pelvis that set the group apart.
type_genus: Brachiosaurus
erected_in: riggs1904a
diagnostic_features:
  - Forelimbs longer than or subequal in length to the hindlimbs
  - Humerus elongate, exceeding or approaching femoral length
  - Highly elevated, arched narial region on the skull
  - Spatulate teeth distributed along the full extent of the jaw margins
  - Coracoid with a quadrangular outline
  - Relatively short tail compared with other macronarians
