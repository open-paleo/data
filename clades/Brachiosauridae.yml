clade: Brachiosauridae
description: >
  Brachiosauridae is a family of large, quadrupedal, plant-eating sauropod
  dinosaurs and one of the main groups within Titanosauriformes, alongside the
  Euhelopodidae and the Titanosauria. Its members, which include Brachiosaurus
  and the African Giraffatitan, lived from the Late Jurassic into the Cretaceous
  across what are now North America, Africa and Europe, with Cretaceous members
  known only from North America (D'Emic, 2012). The island dwarf Europasaurus is
  described as a basal macronarian outside the family by Sander and colleagues
  (2006) but recovered as the earliest-diverging brachiosaurid by D'Emic (2012).
  Their long necks are interpreted as extending their vertical reach for high
  browsing (Paul, 1988). Their forelimbs are longer than their hindlimbs (Riggs,
  1904). Brachiosaurus had substantially broader teeth than the later
  Abydosaurus (Chure and colleagues, 2010), and the family is diagnosed by
  traits of the teeth, back vertebrae and pelvis (D'Emic, 2012).
type_genus: Brachiosaurus
erected_in: riggs1904a
described_in: d'emic2012b
diagnostic_features:
  - Forelimbs longer than or subequal in length to the hindlimbs
  - Humerus elongate, exceeding or approaching femoral length
  - Highly elevated, arched narial region on the skull
  - Coracoid with a quadrangular outline
  - Relatively short tail compared with other macronarians
  - Maxillary teeth twisted axially through an arc of 30 to 45 degrees
  - Middle and posterior dorsal vertebrae with elongate, rod-like transverse
    processes
  - Ischium with an abbreviated pubic peduncle
references:
  - id: riggs1904a
    notes: Named the family Brachiosauridae.
  - id: d'emic2012b
    notes: Cladistic revision of basal titanosauriforms providing the modern
      diagnosis of Brachiosauridae.
  - id: sander2006a
    notes: Described Europasaurus as a basal macronarian and showed from bone
      histology that it was an island dwarf.
  - id: paul1988b
    notes: Described the brachiosaurs of the Morrison and Tendaguru,
      interpreting their long necks as an adaptation for high browsing.
  - id: chure2010a
    notes: Described Abydosaurus, noting its narrower teeth than those of the
      older Brachiosaurus.
