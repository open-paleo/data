clade: Brachiosauridae
description: >
  Brachiosauridae is a family of titanosauriform sauropods defined as all taxa
  more closely related to Brachiosaurus than to Saltasaurus, known from the Late
  Jurassic to the mid-Cretaceous of North America, Africa, and Europe.
  Brachiosaurids are distinguished by their unusual proportions, with forelimbs
  longer than or subequal to the hindlimbs, producing a giraffe-like, elevated
  posture suited to high browsing. The family forms a largely Late Jurassic
  grade of basal members (Europasaurus, Vouivria, Brachiosaurus) leading to a
  clade of Cretaceous forms including Giraffatitan and the North American
  Cedarosaurus and Venenosaurus.
type_genus: Brachiosaurus
erected_in: riggs1904a
diagnostic_features:
  - Forelimbs longer than or subequal in length to the hindlimbs
  - Humerus elongate, exceeding or approaching femoral length
  - Highly elevated, arched narial region on the skull
  - Spatulate teeth distributed along the full extent of the jaw margins
  - Coracoid with a quadrangular outline
  - Relatively short tail compared with other macronarians
