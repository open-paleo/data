clade: Scansoriopterygidae
description: >
  Scansoriopterygidae is a family of small, unusual maniraptoran theropod
  dinosaurs from the Middle to Late Jurassic of China, known from a handful of
  well-preserved fossils recovered from the Tiaojishan Formation of Liaoning and
  Hebei. The group includes Scansoriopteryx, Epidexipteryx, Ambopteryx, and Yi,
  and counts among the smallest non-avian dinosaurs known. Its members are set
  apart by an extremely long third finger, longer than the first and second
  digits, the reverse of the usual theropod hand in which the second finger is
  longest. In at least Yi and Ambopteryx, this elongated finger paired with a
  long styliform bone at the wrist to support a bat-like membranous wing used
  for gliding, making scansoriopterygids the only known dinosaurs to develop
  true membranous wings. They also share short, deep skulls with down-turned
  jaws and large front teeth, long arms, and a body covering of simple feathers.
  Their placement among coelurosaurs remains contentious, in part because much
  of the material is fragmentary or juvenile.
type_genus: Scansoriopteryx
erected_in: czerkas2002a
described_in: zhang2008a
diagnostic_features:
  - Greatly elongate third manual digit, longer than the first two
  - Membranous wing supported by an ossified styliform wrist element in some members
  - Short, deep skull with procumbent anterior teeth
  - Small body size with a proportionally large head
dispute:
  summary: >
    The position of Scansoriopterygidae within Coelurosauria is unresolved.
    Several recent analyses place it just outside Paraves, between Oviraptorosauria
    and the paravians (Pei et al., 2020; Cau and Madzia, 2021; Foth et al., 2025),
    while others recover it within Avialae as the first-branching avialan clade
    (Hartman et al., 2019) or near the base of Paraves (Turner et al., 2012). The
    fragmentary and often juvenile nature of much of the material contributes to
    the instability.
  history:
    - date: "2026-07-01"
      note: Retained at Maniraptora, outside Paraves, following the prevailing recent view that scansoriopterygids diverge between Oviraptorosauria and Paraves; the competing within-Avialae and basal-Paraves hypotheses are recorded here.
references:
  - id: czerkas2002a
  - id: zhang2008a
  - id: cau2021a
    notes: Recovered Scansoriopterygidae just outside Paraves, between Oviraptorosauria and the paravians.
  - id: pei2020a
    notes: Placed scansoriopterygids just outside Paraves, between oviraptorosaurs and paravians.
  - id: hartman2019a
    notes: Recovered Scansoriopterygidae within Avialae as the first-branching avialan clade.
  - id: turner2012a
    notes: Recovered scansoriopterygids near the base of Paraves in its paravian phylogeny review.
  - id: foth2025a
    notes: Placed Scansoriopterygidae outside Avialae rather than as first-branching avialans.
