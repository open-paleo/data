described_in: zhang2008a
diagnostic_features:
  - Greatly elongate third manual digit, longer than the first two
  - Membranous wing supported by an ossified styliform wrist element in some members
  - Short, deep skull with procumbent anterior teeth
  - Small body size with a proportionally large head
dispute:
  summary: >
    The position of Scansoriopterygidae within Coelurosauria is unresolved.
    Recent analyses recover it within Oviraptorosauria, as basal members (Cau
    and Madzia, 2021; Foth and colleagues, 2025) or as the basalmost
    oviraptorosaurs under Bayesian inference (Cau, 2018). Others recover it as
    the sister group of Oviraptorosauria outside Avialae (Agnolín and Novas,
    2013), or, for Epidexipteryx alone, at the base of Paraves (Turner and
    colleagues, 2012), or within Avialae as an early-branching avialan clade
    (Zhang and colleagues, 2008; Hartman and colleagues, 2019) — the last also
    recovered by the parsimony analysis of Cau (2018), whose two methods
    disagree, and by Cau (2024), who places it crownward of a paraphyletic
    anchiornithid grade. The fragmentary and often juvenile nature of much of
    the material contributes to the instability.
references:
  - id: czerkas2002a
  - id: zhang2008a
    notes: Gave Scansoriopterygidae its phylogenetic definition and recovered it
      at the base of Avialae.
  - id: cau2021a
    notes: Recovered Scansoriopterygidae within Oviraptorosauria, consistently
      across the unweighted and all implied-weighting analyses.
  - id: cau2018a
    notes: Parsimony analysis recovers scansoriopterygids among basal avialans,
      the Bayesian analysis as the basalmost oviraptorosaurs.
  - id: agnolín2013a
    notes: Recovered scansoriopterygids as non-paravian maniraptorans, sister
      group to Oviraptorosauria.
  - id: pei2020a
    notes: Included scansoriopterygids in its analysis and refers to them as
      non-paravian pennaraptorans, leaving Yi out of its flight-parameter
      estimates.
  - id: hartman2019a
    notes: Recovered Scansoriopterygidae within Avialae as the first-branching avialan clade.
  - id: turner2012a
    notes: Recovered Epidexipteryx as the basalmost paravian;
      Scansoriopterygidae was not recovered, and constraining it costs four
      steps and places it basally in Avialae.
  - id: cau2024a
    notes: Recovered Scansoriopterygidae within Avialae, crownward of a
      paraphyletic anchiornithid grade; no support values are reported.
  - id: foth2025a
    notes: Recovered Scansoriopterygidae as basal members of Oviraptorosauria
      rather than within Paraves.
