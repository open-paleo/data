clade: Scansoriopterygidae
description: >
  Scansoriopterygidae is a clade of small, unusual maniraptoran theropods from
  the Middle to Late Jurassic of China, including Scansoriopteryx, Epidexipteryx,
  Ambopteryx, and Yi, characterized by a greatly elongate third manual digit and,
  in at least some members, membranous, bat-like wings supported by a styliform
  wrist element. The family is named for Scansoriopteryx and was given a
  phylogenetic content by Zhang et al. in 2008. Its position among coelurosaurs is
  contentious, with recent analyses most often placing it just outside Paraves.
type_genus: Scansoriopteryx
erected_in: czerkas2002a
described_in: zhang2008a
diagnostic_features:
  - Greatly elongate third manual digit, longer than the first two
  - Membranous wing supported by an ossified styliform wrist element in some members
  - Short, deep skull with procumbent anterior teeth
  - Small body size with a proportionally large head
dispute:
  summary: >
    The position of Scansoriopterygidae within Coelurosauria is unresolved.
    Several recent analyses place it just outside Paraves, between Oviraptorosauria
    and the paravians (Pei et al., 2020; Cau and Madzia, 2021; Foth et al., 2025),
    while others recover it within Avialae as the first-branching avialan clade
    (Hartman et al., 2019) or near the base of Paraves (Turner et al., 2012). The
    fragmentary and often juvenile nature of much of the material contributes to
    the instability.
  history:
    - date: "2026-07-01"
      note: Retained at Maniraptora, outside Paraves, following the prevailing recent view (P2, P3) that scansoriopterygids diverge between Oviraptorosauria and Paraves; the competing within-Avialae and basal-Paraves hypotheses are recorded here.
references:
  - id: czerkas2002a
  - id: zhang2008a
