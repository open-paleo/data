clade: Avialae
description: >
  Avialae is the bird-line clade of paravian theropods, conventionally the most
  inclusive group containing modern birds but not the deinonychosaurs, and in
  most recent analyses the sister group of Deinonychosauria within Eumaniraptora.
  It encompasses Archaeopteryx and the anchiornithid grade at its base together
  with the pygostylian and ornithothoracine birds. Its members are characterized
  by forelimbs modified into feathered wings and progressive adaptations toward
  powered flight.
erected_in: gauthier1986
diagnostic_features:
  - Forelimb modified into a feathered wing with asymmetric flight feathers
  - Forelimb longer than the hindlimb in most members
  - Caudal series shortened, trending toward a pygostyle in derived members
  - Reversed or partially reversed hallux in many members
references:
