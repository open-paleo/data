clade: Plateosauria
description: >
  Plateosauria is a large, node-based clade within Sauropodomorpha,
  conventionally defined as the last common ancestor of Plateosaurus and
  Massospondylus (Sereno, 2007), or of Plateosaurus and Jingshanosaurus (Galton
  and Upchurch, 2004), together with all of that ancestor's descendants. So
  defined, it unites the Plateosauridae with the more inclusive Massopoda and
  takes in Late Triassic and Early Jurassic sauropodomorphs such as
  Coloradisaurus, Euskelosaurus, Jingshanosaurus, Massospondylus, Mussaurus,
  Sellosaurus, and Yunnanosaurus, while its descendant lineages also encompass
  the giant, long-necked true sauropods. It groups the more derived, generally
  herbivorous members of the lineage, spanning the transition from largely
  bipedal early forms toward larger-bodied, increasingly quadrupedal ones. In
  all, it accounts for the bulk of sauropodomorph diversity above the earliest,
  most basal grade.
erected_in: tornier1913a
described_in: sereno2007a
diagnostic_features:
  - Leaf-shaped cheek teeth with coarse marginal denticles set at an angle to the
    crown margin
  - Robust, weight-bearing limb proportions
  - Enlarged, broad-bladed manual pollex
  - Anteroposteriorly elongate, low ilium
references:
  - id: tornier1913a
    notes: Proposed the suborder Plateosauria, with a diagnosis, as a
      replacement name for Theropoda, its six families including Plateosauridae,
      Anchisauridae and Megalosauridae.
  - id: sereno2007a
    notes: Defined Plateosauria as the least inclusive clade containing
      Massospondylus carinatus and Plateosaurus engelhardti but not Saltasaurus
      loricatus.
  - id: müller2018a
    notes: Recovers Plateosauria as Plateosauridae plus Massopoda, sister to
      Unaysauridae.
  - id: galton2004a
    notes: Defined Plateosauria as Jingshanosaurus, Plateosaurus, their most
      recent common ancestor and all its descendants.
