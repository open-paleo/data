clade: Plateosauria
description: >
  Plateosauria is a clade of sauropodomorph dinosaurs uniting Plateosauridae and
  Massopoda (and, in many analyses, Unaysauridae), encompassing the more derived,
  obligately or facultatively quadrupedal herbivores of the Late Triassic to
  Early Jurassic and all of their descendants including the sauropods. It is
  nested within Bagualosauria and represents the bulk of sauropodomorph
  diversity above the basal Carnian grade.
erected_in: tornier1913a
described_in: müller2018a
diagnostic_features:
  - Leaf-shaped cheek teeth with coarse marginal denticles set at an angle to the
    crown margin
  - Robust, weight-bearing limb proportions
  - Enlarged, broad-bladed manual pollex
  - Anteroposteriorly elongate, low ilium
references:
  - id: tornier1913a
    notes: Origin of the name Plateosauria.
  - id: müller2018a
    notes: Recovers Plateosauria as Plateosauridae plus Massopoda, sister to
      Unaysauridae.
