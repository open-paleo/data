clade: Cerapoda
description: >
  Cerapoda is the derived neornithischian clade that unites Ornithopoda and
  Marginocephalia. Cerapodans share specialized jaw mechanics adapted for
  efficient oral processing of plant material, and the clade encompasses a vast
  range of herbivores from small bipeds to giant quadrupedal hadrosaurs and
  ceratopsids. It is nested within Neornithischia, more derived than the
  thescelosaurid and jeholosaurid grades.
erected_in: sereno1986
described_in: madzia2021
diagnostic_features:
  - Asymmetrical enamel on the cheek-tooth crowns enabling self-sharpening occlusion
  - Dentary crowns bearing prominent ridges on the lingual surface only
  - Well-developed coronoid process on the dentary
  - Reduction or loss of the premaxillary teeth
  - Diastema between the premaxillary and maxillary tooth rows
