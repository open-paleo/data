clade: Cerapoda
description: >
  Cerapoda is the most diverse clade of neornithischian dinosaurs, uniting the
  two great herbivorous lineages Ornithopoda and Marginocephalia; its name is a
  blend of Ceratopsia and Ornithopoda. As that name suggests, it is split into
  two branches: the ornithopods, ranging from small bird-footed forms to the
  more derived iguanodontians and hadrosaurs, and the marginocephalians, which
  comprise the dome-skulled pachycephalosaurs and the frilled, horned
  ceratopsians. Cerapodans span an enormous range of body plans, from small
  bipeds to giant quadrupedal plant-eaters, and share refined tooth and jaw
  mechanics that let them process tough vegetation efficiently. The clade nests
  within Neornithischia, more derived than the small-bodied, early-diverging
  forms such as the thescelosaurids and jeholosaurids.
erected_in: sereno1986a
described_in: madzia2021a
diagnostic_features:
  - Asymmetrical enamel on the cheek-tooth crowns enabling self-sharpening occlusion
  - Dentary crowns bearing prominent ridges on the lingual surface only
  - Well-developed coronoid process on the dentary
  - Reduction or loss of the premaxillary teeth
  - Diastema between the premaxillary and maxillary tooth rows
references:
  - id: sereno1986a
    notes: Erected Cerapoda.
  - id: madzia2021a
    notes: Provides the modern phylogenetic definition of Cerapoda.
