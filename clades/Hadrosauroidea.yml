clade: Hadrosauroidea
description: >
  Hadrosauroidea is the superfamily of hadrosauriform ornithopods containing the
  duck-billed Hadrosauridae and a long grade of non-hadrosaurid relatives such as
  Probactrosaurus, Eolambia, Bactrosaurus, and Telmatosaurus. Its members track
  the acquisition of the hadrosaurid dental battery and broad bill, and the clade
  records the Cretaceous radiation of duck-billed dinosaurs across Asia, North
  America, Europe, and beyond. The basal grade is poorly resolved, but the clade
  Hadrosauromorpha unites the forms closest to Hadrosauridae.
type_genus: Hadrosaurus
erected_in: cope1869b
described_in: madzia2021
diagnostic_features:
  - Dental battery with strongly reduced or absent cingula on the crowns
  - Loss of the manual pollex (thumb spike)
  - Broad, transversely expanded edentulous premaxillary bill
  - Three or more functional teeth per vertical tooth family
