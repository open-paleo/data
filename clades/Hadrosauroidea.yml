clade: Hadrosauroidea
description: >
  Hadrosauroidea is a superfamily of ornithischian dinosaurs that includes the
  duck-billed hadrosaurids and all dinosaurs more closely related to them than
  to Iguanodon. Alongside the advanced duck-bills, it takes in a long series of
  more primitive relatives such as Probactrosaurus, Altirhinus, Eolambia,
  Bactrosaurus, and Telmatosaurus, many of which were once lumped into a
  now-abandoned catch-all "Iguanodontidae." These early forms document the
  gradual assembly of the hadrosaurid body plan, including the specialized
  grinding dental battery and the broad, toothless bill. Their remains have been
  recovered across Asia, Europe, Africa, and the Americas, charting the
  Cretaceous spread of duck-billed dinosaurs, with the closest kin of the true
  hadrosaurids grouped together as Hadrosauromorpha.
type_genus: Hadrosaurus
erected_in: cope1869b
described_in: madzia2021a
diagnostic_features:
  - Dental battery with strongly reduced or absent cingula on the crowns
  - Loss of the manual pollex (thumb spike)
  - Broad, transversely expanded edentulous premaxillary bill
  - Three or more functional teeth per vertical tooth family
references:
  - id: cope1869b
    notes: Hadrosauroidea dates from Cope's naming of Hadrosauridae by ICZN
      coordination of family-group names.
  - id: madzia2021a
    notes: Provides the modern phylogenetic definition of Hadrosauroidea.
