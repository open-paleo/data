clade: Ankylopollexia
description: >
  Ankylopollexia is a clade of iguanodontian ornithopod dinosaurs that ranged
  from the Late Jurassic to the end of the Cretaceous. Its members are united by
  a distinctive conical thumb spike, and the group encompasses everything from
  small, roughly five-meter bipedal forms such as Camptosaurus through the
  iguanodonts to the hadrosaurs, or duck-billed dinosaurs. Universally
  herbivorous, ankylopollexians varied enormously in size, with the largest
  hadrosaurs such as Shantungosaurus reaching around 15 meters in length and
  weighing up to 16 tonnes. First appearing about 156 million years ago, the
  clade became one of the most successful and widespread groups of the
  Cretaceous, spreading across the world before dying out at the close of the
  Maastrichtian.
erected_in: sereno1986a
described_in: madzia2021a
diagnostic_features:
  - Conical, spike-like manual pollex formed by an enlarged first ungual
  - Robust first metacarpal tightly articulating with the carpus
  - Progressive reduction of manual digit V
  - Elongate prepubic process of the pubis
references:
  - id: sereno1986a
    notes: Named Ankylopollexia.
  - id: madzia2021a
    notes: Provides the modern phylogenetic definition of Ankylopollexia.
