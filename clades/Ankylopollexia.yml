clade: Ankylopollexia
description: >
  Ankylopollexia is a clade of dryomorph ornithopod dinosaurs characterized by a
  robust, conical thumb spike formed by an enlarged, modified pollex. It ranges
  from medium-sized bipedal forms such as Camptosaurus through the iguanodonts to
  the hadrosaurs, and represents one of the most diverse and successful
  ornithischian radiations of the Cretaceous.
erected_in: sereno1986a
described_in: madzia2021a
diagnostic_features:
  - Conical, spike-like manual pollex formed by an enlarged first ungual
  - Robust first metacarpal tightly articulating with the carpus
  - Progressive reduction of manual digit V
  - Elongate prepubic process of the pubis
references:
  - id: sereno1986a
    notes: Named Ankylopollexia.
  - id: madzia2021a
    notes: Provides the modern phylogenetic definition of Ankylopollexia.
