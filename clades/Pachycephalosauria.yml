clade: Pachycephalosauria
description: >
  Pachycephalosauria, meaning "thick-headed lizards," is a clade of
  ornithischian dinosaurs that together with the horned ceratopsians makes up
  the group Marginocephalia. Its members were bipedal herbivores and omnivores,
  mostly small animals in the range of 2 to 3 meters long, and lived exclusively
  in the Northern Hemisphere during the Cretaceous, with all known genera coming
  from North America and Asia. They are best known for their heavily ossified
  skulls, which may be domed, flat, or wedge-shaped depending on the species and
  are often ringed with bony nodes and spikes. Because most specimens consist
  only of these durable skull caps, the group is classified almost entirely on
  cranial features, and flat-headed forms may in some cases represent juveniles
  of dome-headed adults. The function of the thickened dome has been much
  debated, with intraspecific head-butting or flank-butting the leading
  hypotheses. Well-known members include Pachycephalosaurus and Stegoceras.
type_genus: Pachycephalosaurus
erected_in: maryańska1974a
described_in: schott2016a
diagnostic_features:
  - Dramatically thickened frontoparietal dome on the skull roof
  - Peripheral ornamentation of nodes and horns around the dome margin
  - Wide, shelf-like squamosal
  - Relatively large orbits
  - Bipedal stance with stiffened tail
  - Broad body with flared iliac blades
references:
  - id: maryańska1974a
    notes: Erected the clade Pachycephalosauria.
  - id: schott2016a
    notes: Comprehensive systematic analysis of pachycephalosaurid diversity.
