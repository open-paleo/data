clade: Nanotyrannidae
description: >
  Nanotyrannidae is a family of eutyrannosaurian theropod
  dinosaurs erected by Zanno and Napoli (2025) for Nanotyrannus
  and any taxa more closely related to it than to Tyrannosaurus
  or Albertosaurus. The family is presently known from the
  Maastrichtian Hell Creek Formation of western North America;
  Bayesian biogeographic analysis also recovers
  Appalachiosaurus and Dryptosaurus within the clade, but the
  authors caution that this placement requires additional data.
described: 2025
authors: Zanno & Napoli

definition: >
  Branch-based. The most inclusive clade containing
  Nanotyrannus lancensis Gilmore, 1946, but excluding
  Tyrannosaurus rex Osborn, 1905 and Albertosaurus sarcophagus
  Osborn, 1905.

diagnostic_features:
  - Absence of a clearly defined embayment for the subnarial
    foramen at the premaxillary/maxillary suture.
  - Unserrated premaxillary tooth crowns that are straight and
    chisel-shaped.
  - Pneumatic foramen in the quadratojugal.
  - Extension of the glenoid fossa onto the lateral surface of
    the scapula.
  - Apomorphically elongate lower hindlimbs (tibia plus
    metatarsus) relative to femur length.

references:
  - id: zanno2025
    authors: Zanno, L. E.; Napoli, J. G.
    year: 2025
    title: Nanotyrannus and Tyrannosaurus coexisted at the close
