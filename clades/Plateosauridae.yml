clade: Plateosauridae
description: >
  Plateosauridae is a family of plateosaurian sauropodomorphs from the Late
  Triassic to earliest Jurassic of Europe and Asia, built around the well-known
  Plateosaurus. In modern usage the family is restricted, with Plateosaurus and
  Issi as its securely included members; several historically referred taxa
  (e.g. Yimenosaurus, Euskelosaurus) are of uncertain or dubious status. Its
  members are medium- to large-bodied, long-necked, facultatively bipedal
  herbivores.
type_genus: Plateosaurus
erected_in: marsh1895a
diagnostic_features:
  - Large external naris
  - Transversely broad, leaf-shaped cheek teeth with coarse marginal denticles
  - Robust, elongate cervical vertebrae
  - Large, recurved manual pollex ungual
references:
  - id: marsh1895a
    notes: Erected Plateosauridae.
