clade: Plateosauridae
description: >
  Plateosauridae is a family of plateosaurian sauropodomorph dinosaurs known
  from the Late Triassic to earliest Jurassic of Europe, Greenland, Africa, and
  Asia, built around the well-known Plateosaurus. Although many early dinosaurs
  have been referred to the family over the years, its membership is now
  restricted, anchored by Plateosaurus and its close relative Issi, with several
  historically included taxa such as Yimenosaurus and Euskelosaurus regarded as
  uncertain or disputed; some analyses also recover Unaysaurus within the group
  (Yates and colleagues, 2010; Rauhut and colleagues, 2020). Its members are
  medium- to large-bodied, long-necked, facultatively bipedal herbivores. Some
  workers treat the older concept Prosauropoda as effectively a synonym of
  Plateosauridae, since both come to contain the same set of taxa. Within the
  broader clade Plateosauria, the family is typically placed as the sister group
  to the more sauropod-like Massopoda.
type_genus: Plateosaurus
erected_in: marsh1895a
diagnostic_features:
  - Large external naris
  - Transversely broad, leaf-shaped cheek teeth with coarse marginal denticles
  - Robust, elongate cervical vertebrae
  - Large, recurved manual pollex ungual
references:
  - id: marsh1895a
    notes: Listed and briefly diagnosed the family Plateosauridae, with
      Zanclodontidae in parentheses, in his classification of the Dinosauria.
  - id: yates2010b
    notes: Described Aardonyx and recovered Plateosauridae as Unaysaurus,
      Plateosaurus gracilis and Plateosaurus engelhardti.
  - id: rauhut2020a
    notes: Recovered Unaysaurus within Plateosauridae in describing new
      sauropodomorph material from Switzerland.
