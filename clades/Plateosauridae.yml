clade: Plateosauridae
description: >
  Plateosauridae is a family of plateosaurian sauropodomorph dinosaurs known
  from the Late Triassic to earliest Jurassic of Europe, Greenland, Africa, and
  Asia, built around the well-known Plateosaurus. Although many early dinosaurs
  have been referred to the family over the years, its membership is now
  restricted, anchored by Plateosaurus and its close relative Issi, with several
  historically included taxa such as Yimenosaurus and Euskelosaurus regarded as
  uncertain or disputed; some analyses also recover forms like Macrocollum and
  Unaysaurus within the group. Its members are medium- to large-bodied,
  long-necked, facultatively bipedal herbivores. Some workers treat the older
  concept Prosauropoda as effectively a synonym of Plateosauridae, since both
  come to contain the same set of taxa. Within the broader clade Plateosauria,
  the family is typically placed as the sister group to the more sauropod-like
  Massopoda.
type_genus: Plateosaurus
erected_in: marsh1895a
diagnostic_features:
  - Large external naris
  - Transversely broad, leaf-shaped cheek teeth with coarse marginal denticles
  - Robust, elongate cervical vertebrae
  - Large, recurved manual pollex ungual
