clade: Heyuanninae
description: >
  Heyuanninae is a subfamily of oviraptorid dinosaurs, small bird-like theropods
  known from the Late Cretaceous of Asia, especially the Gobi Desert and
  southern China. Within Oviraptoridae it is traditionally set apart as the
  short-armed, mainly crestless branch, in contrast to the larger, long-armed,
  crested oviraptorines. Its members were small-handed and weakly clawed, with
  the hand progressively reduced across the group, and include such genera as
  Heyuannia, Conchoraptor, and Khaan. Like other oviraptorids they bore
  toothless, parrot-like beaks and are generally thought to have been primarily
  herbivorous or omnivorous, feeding on the tough, low-growing plants of the
  arid habitats where their fossils are most abundant. Some phylogenetic studies
  have questioned the clean split between crestless and crested oviraptorids,
  suggesting that this traditional division may be partly artificial.
type_genus: Heyuannia
erected_in: barsbold1981a
described_in: funston2020a
diagnostic_features:
  - Small body size with a low, usually uncrested or weakly crested skull
  - Progressive reduction and shortening of the manus, digit III reduced or lost
  - Enlarged, robust first manual digit
  - Synsacrum of seven to eight vertebrae
references:
