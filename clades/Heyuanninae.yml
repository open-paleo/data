clade: Heyuanninae
description: >
  Heyuanninae is the subfamily of small, generally crestless oviraptorids that
  radiated across the Gobi Desert and southern China in the Late Cretaceous. Its
  members are marked by a progressive reduction of the hand, culminating in the
  two-fingered Oksoko, and include Heyuannia, Conchoraptor, Khaan and their
  relatives. The name replaces the older Ingeniinae, which was based on the genus
  "Ingenia" (a junior homonym now referred to Heyuannia).
type_genus: Heyuannia
erected_in: barsbold1981a
described_in: funston2020a
diagnostic_features:
  - Small body size with a low, usually uncrested or weakly crested skull
  - Progressive reduction and shortening of the manus, digit III reduced or lost
  - Enlarged, robust first manual digit
  - Synsacrum of seven to eight vertebrae
references:
  - id: barsbold1981a
  - id: funston2020a
