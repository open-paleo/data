clade: Heyuanninae
rank: subfamily
type_genus: Heyuannia
identifiers:
  - source: pbdb
    id: "427203"
erected_in: yun2019a
diagnostic_features:
  - Small body size with a low, usually uncrested or weakly crested skull
  - Progressive reduction and shortening of the manus, digit III reduced or lost
  - Enlarged, robust first manual digit
  - Synsacrum of seven to eight vertebrae
synonyms:
  - name: Ingeniinae
    type: preoccupied
    reason: Family-group name whose type genus, Ingenia Barsbold, 1981, is
      preoccupied; Yun (2019) coined Heyuanninae as its replacement.
references:
  - id: yun2019a
    notes: Coined Heyuanninae as a replacement name for Ingeniinae, whose type
      genus is preoccupied, and defined it as the least inclusive clade
      containing Heyuannia huangi and Conchoraptor gracilis.
  - id: funston2020a
    notes: Recovered Heyuanninae in the analysis describing Oksoko, and traced
      the reduction of the forelimb and third digit to within the clade.
  - id: barsbold1981a
    notes: Erected the subfamily as Ingeniinae (type genus Ingenia), later
      replaced by Heyuanninae.
  - id: lü2013d
    notes: Described chicken-sized oviraptorids from central China and recovered
      Oviraptorinae as paraphyletic.
