clade: Microraptorinae
description: >
  Microraptorinae (also Microraptoria) is a clade of small, often four-winged
  dromaeosaurids known mainly from the Early Cretaceous Jehol Biota of China,
  with a few later and more widespread members. Many preserve extensive
  pennaceous feathers on both the fore- and hindlimbs, and several were capable
  of gliding or limited powered flight. The clade is commonly recovered as the
  sister group of Eudromaeosauria within Dromaeosauridae.
type_genus: Microraptor
erected_in: senter2004a
diagnostic_features:
  - Small body size with elongate pennaceous feathers on the hindlimb (metatarsal "wing")
  - Proportionally long forelimbs
  - Posterolateral process of the premaxilla separating the maxilla from the naris
  - Slender, weakly recurved teeth with reduced or absent mesial serrations
references:
  - id: senter2004a
