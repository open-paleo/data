clade: Neotheropoda
description: >
  Neotheropoda, meaning "new theropods," is a clade that encompasses nearly all
  theropod dinosaurs, from the small, lightly built coelophysoids of the Late
  Triassic to the more advanced ceratosaurs and tetanurans, the latter of which
  ultimately gave rise to modern birds. Its members are distinguished by a
  reduction of several foot bones, which left the characteristic three-toed
  (tridactyl) footprints associated with theropods. It is the only group of
  theropods to survive the Triassic-Jurassic extinction event, after which it
  radiated into the dominant terrestrial predators of the Jurassic and
  Cretaceous. The more derived members form the clade Averostra, which unites
  the ceratosaurs and the tetanurans; by the Early Jurassic the non-averostran
  lineages had died out.
