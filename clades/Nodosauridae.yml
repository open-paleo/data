clade: Nodosauridae
description: >
  Nodosauridae is one of the two principal families of Ankylosauria, comprising
  the armored dinosaurs that lacked a bony tail club, in contrast to the
  ankylosaurids. Nodosaurids were cosmopolitan through the Cretaceous and are
  typified by Nodosaurus and the well-armored panoplosaurine and struthiosaurine
  lineages, together with the spiny basal polacanthines. They retain prominent
  lateral shoulder and flank spines and a narrower, more elongate skull than
  ankylosaurids.
type_genus: Nodosaurus
erected_in: marsh1890b
described_in: rivera-sylva2018
diagnostic_features:
  - Absence of a bony tail club
  - Narrow, anteroposteriorly elongate skull
  - Prominent laterally projecting cervical, shoulder, and flank spines in many
    taxa
  - Closed lateral temporal fenestra concealed by cranial armor
dispute:
  summary: >
    The monophyly of Nodosauridae is contested. It is the traditional,
    broadly used family for non-tail-clubbed ankylosaurs, but Raven et al.
    (2023) recovered it as paraphyletic and proposed splitting it into
    Panoplosauridae, Polacanthidae, and Struthiosauridae; the basal
    polacanthine taxa (Polacanthus, Hylaeosaurus, Gastonia, Hoplitosaurus)
    variously fall within or outside it across analyses. Open Paleo retains
    the traditional Nodosauridae pending broad consensus.
  history:
    - date: "2026-06-26"
      note: Retained as the traditional two-family Nodosauridae; the Raven et al. (2023) three-family split (Panoplosauridae, Polacanthidae, Struthiosauridae) is reflected but not adopted (P5).
