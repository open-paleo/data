clade: Nodosauridae
description: >
  Nodosauridae is a family of armored, quadrupedal, herbivorous ankylosaurian
  dinosaurs known from the Late Jurassic to the Late Cretaceous of Asia, Europe,
  North America, and possibly South America. Like their close relatives the
  ankylosaurids, nodosaurids were heavily built and clad in rows of bony nodules
  and spines set into the skin and sheathed in keratin, but they lacked the
  mace-like bony tail club of the ankylosaurids and instead retained a more
  flexible tail. Many bore prominent spikes projecting outward from the neck and
  shoulders, and they carried a narrower, more elongate skull than the
  broad-headed ankylosaurids. The family is traditionally composed of the spiny,
  basal polacanthines, together with the panoplosaurine and struthiosaurine
  lineages of the more derived Nodosaurinae. One exceptionally preserved
  nodosaurid, the "mummy" of Borealopelta, retains its armor in life position
  along with keratin and skin traces that record a reddish, countershaded
  coloration.
type_genus: Nodosaurus
erected_in: marsh1890a
described_in: rivera-sylva2018a
diagnostic_features:
  - Absence of a bony tail club
  - Narrow, anteroposteriorly elongate skull
  - Prominent laterally projecting cervical, shoulder, and flank spines in many
    taxa
  - Closed lateral temporal fenestra concealed by cranial armor
dispute:
  summary: >
    The monophyly of Nodosauridae is contested. It is the traditional,
    broadly used family for non-tail-clubbed ankylosaurs, but Raven et al.
    (2023) recovered it as paraphyletic and proposed splitting it into
    Panoplosauridae, Polacanthidae, and Struthiosauridae; the basal
    polacanthine taxa (Polacanthus, Hylaeosaurus, Gastonia, Hoplitosaurus)
    variously fall within or outside it across analyses. Open Paleo retains
    the traditional Nodosauridae pending broad consensus.
  history:
    - date: "2026-06-26"
      note: Retained as the traditional two-family Nodosauridae; the Raven et al. (2023) three-family split (Panoplosauridae, Polacanthidae, Struthiosauridae) is reflected but not adopted.
references:
  - id: marsh1890a
    notes: Named the family Nodosauridae.
  - id: rivera-sylva2018a
    notes: Phylogenetic analysis of nodosaurid relationships.
  - id: raven2023a
    notes: Recovered Nodosauridae as paraphyletic and proposed splitting it into three families.
