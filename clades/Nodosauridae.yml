clade: Nodosauridae
rank: family
type_genus: Nodosaurus
erected_in: marsh1890a
described_in: madzia2021a
diagnostic_features:
  - Absence of a bony tail club
  - Narrow, anteroposteriorly elongate skull
  - Prominent laterally projecting cervical, shoulder, and flank spines in many
    taxa
  - Closed lateral temporal fenestra concealed by cranial armor
dispute:
  summary: >
    The monophyly of Nodosauridae is contested. It is the traditional, broadly
    used family for non-tail-clubbed ankylosaurs, but Raven and colleagues
    (2023) recovered it as paraphyletic, with separate panoplosaurid,
    polacanthid and struthiosaurid radiations, for which they defined the
    existing names Panoplosauridae, Polacanthidae and Struthiosauridae; the
    basal polacanthine taxa (Polacanthus, Hylaeosaurus, Gastonia, Hoplitosaurus)
    variously fall within or outside it across analyses. The traditional
    Nodosauridae is retained pending broad consensus.
references:
  - id: marsh1890a
    notes: Named the family Nodosauridae.
  - id: madzia2021a
    notes: Defined Nodosauridae as the largest clade containing Nodosaurus
      textilis but not Ankylosaurus magniventris.
  - id: rivera-sylva2018a
    notes: Described Acantholipan and recovered it within Nodosauridae, in the
      analysis later used as the family's reference phylogeny.
  - id: raven2023a
    notes: Recovered Nodosauridae as paraphyletic and defined Panoplosauridae,
      Polacanthidae and Struthiosauridae, all existing names, for its separate
      radiations.
