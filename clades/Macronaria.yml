clade: Macronaria
description: >
  Macronaria, meaning "large nostrils," is a clade of neosauropod dinosaurs
  defined as all sauropods more closely related to Saltasaurus than to
  Diplodocus. It is the sister group to Diplodocoidea within Neosauropoda and
  encompasses the basal camarasauromorphs, brachiosaurids, and the titanosaurs,
  becoming the dominant sauropod radiation of the Cretaceous. Macronarians are
  characterized by enlarged external nares and box-like skulls bearing broad,
  spatulate teeth, in contrast to the elongate skulls and peg-like teeth of
  diplodocoids.
erected_in: wilsonsereno1998
diagnostic_features:
  - Enlarged external nares, typically larger than the orbit
  - Spatulate (spoon-shaped) teeth
  - Box-like, dorsoventrally deep skull
  - Opisthocoelous anterior caudal vertebrae
  - Metacarpals arranged in a tubular, U-shaped colonnade
