clade: Leptoceratopsidae
description: >
  Leptoceratopsidae is a clade of small, mostly hornless neoceratopsians from the
  Cretaceous of Asia, North America, and Europe, including Leptoceratops,
  Montanoceratops, Udanoceratops, and Zhuchengceratops. They retain a short frill
  and lack the large brow horns of ceratopsids, but bear deep, robust jaws with a
  distinctive shearing dentition. The clade is the sister group of Coronosauria
  within Euceratopsia.
type_genus: Leptoceratops
erected_in: nopcsa1923a
described_in: he2015a
diagnostic_features:
  - Deep, robust dentary with a high, laterally displaced coronoid process
  - Short parietosquamosal frill lacking large fenestrae
  - Absence of large supraorbital (brow) horns
  - Marked lateral ridge on the surangular
references:
  - id: nopcsa1923a
    notes: Named Leptoceratopsidae (as a subfamily).
  - id: he2015a
    notes: Provides a modern phylogenetic delimitation of Leptoceratopsidae.
