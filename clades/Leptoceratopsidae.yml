clade: Leptoceratopsidae
description: >
  Leptoceratopsidae is a family of neoceratopsian dinosaurs known from Asia,
  western North America, and possibly Europe. Its members closely resembled the
  horned dinosaurs' other relatives, such as the protoceratopsids and
  ceratopsids, but were more primitive and generally smaller. Definitive
  leptoceratopsids lived during the Late Cretaceous, roughly 83 to 66 million
  years ago, with the group ranging in age from the late Santonian
  Gryphoceratops — the oldest and probably smallest known member — to
  Leptoceratops at the very end of the period. Fragmentary material from North
  Carolina and Sweden may extend the family's range into eastern North America
  and Europe, suggesting complex patterns of dispersal across the isolated
  landmasses of the time.
type_genus: Leptoceratops
erected_in: nopcsa1923a
described_in: he2015a
diagnostic_features:
  - Deep, robust dentary with a high, laterally displaced coronoid process
  - Short parietosquamosal frill lacking large fenestrae
  - Absence of large supraorbital (brow) horns
  - Marked lateral ridge on the surangular
references:
  - id: nopcsa1923a
    notes: Named Leptoceratopsidae (as a subfamily).
  - id: he2015a
    notes: Provides a modern phylogenetic delimitation of Leptoceratopsidae.
