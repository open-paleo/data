clade: Pachycephalosauridae
description: >
  Pachycephalosauridae is the principal family of Pachycephalosauria,
  encompassing the dome-headed dinosaurs of the Late Cretaceous of North America
  and Asia together with a few Stegoceras-grade forms bearing incipient or flat
  skull roofs. The family spans the basal Stegoceras-grade taxa and the derived,
  fully domed subfamily Pachycephalosaurinae. It was named by Sternberg in 1945
  with Pachycephalosaurus as its type genus.
type_genus: Pachycephalosaurus
erected_in: sternberg1945
described_in: schott2016
diagnostic_features:
  - Thickened frontoparietal ranging from flat to fully domed
  - Squamosal developed into a deep plate on the occiput with enlarged
    upper-outer corners
  - Variably developed nodes, in rows or clusters, on the squamosal
  - Broad squamosal exposure on the occiput
  - Supratemporal fenestrae ranging from open to closed
