clade: Pachycephalosauridae
description: >
  Pachycephalosauridae is a family of dome-headed ornithischian dinosaurs from
  the Late Cretaceous of western North America and central Asia. Its members are
  small bipedal, herbivorous to omnivorous animals distinguished by heavily
  thickened skulls formed by the fusion of the frontal and parietal bones and
  the closing of the supratemporal fenestrae; the skull roof may be raised into
  a full dome or remain flat or wedge-shaped, and is typically ringed by blunt
  horns and nodes on the squamosals, jugals, and postorbitals. The family spans
  basal, Stegoceras-grade forms with incipient or flat skull roofs through the
  fully domed subfamily Pachycephalosaurinae, defined as sister to Stegoceras
  and encompassing the more derived genera such as Prenocephale, Tylocephale,
  and Pachycephalosaurus. Because most specimens consist only of the durable
  frontoparietal dome, classification within the group relies almost entirely on
  cranial features, and several genera once assigned here have since been
  reidentified as other kinds of animals. The domes are widely interpreted as
  structures used in head- or flank-butting contests, an idea supported by the
  high frequency of healed cranial injuries found on them.
type_genus: Pachycephalosaurus
erected_in: sternberg1945a
described_in: schott2016a
diagnostic_features:
  - Thickened frontoparietal ranging from flat to fully domed
  - Squamosal developed into a deep plate on the occiput with enlarged
    upper-outer corners
  - Variably developed nodes, in rows or clusters, on the squamosal
  - Broad squamosal exposure on the occiput
  - Supratemporal fenestrae ranging from open to closed
references:
  - id: sternberg1945a
    notes: Named the family Pachycephalosauridae.
  - id: schott2016a
    notes: Comprehensive systematic analysis of pachycephalosaurid diversity.
