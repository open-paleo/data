clade: Hypsilophodontidae
description: >
  Hypsilophodontidae is a traditionally used family of small-bodied, bipedal
  ornithopod dinosaurs. Historically it functioned as a wastebasket for a wide
  range of lightly built ornithischians from around the world, spanning the
  Middle Jurassic to the Late Cretaceous, but this broad grouping is now
  generally regarded as an unnatural assemblage. Modern phylogenetic analyses
  have drastically restricted the family, moving most former members into groups
  such as Thescelosauridae and Elasmaria, so that only Hypsilophodon itself and
  one or two close relatives are retained. Some analyses recover it as the only
  non-iguanodontian ornithopods, the sister group of Iguanodontia (Boyd, 2015;
  Fonseca and colleagues, 2024), a result Fonseca and colleagues note contrasts
  with most other studies. Its restricted membership remains unsettled:
  alongside Hypsilophodon from the Barremian of the Isle of Wight, Longrich and
  colleagues (2024) add Vectidromeus, while Fonseca and colleagues (2024) add
  Gideonmantellia.
type_genus: Hypsilophodon
erected_in: dollo1882a
described_in: madzia2021a
diagnostic_features:
  - Accessory tooth-like ossification on the ascending process of the astragalus
  - Straight articular surface of the femoral head
  - Anterior (lesser) trochanter positioned anterior to the greater trochanter
  - Small body size with gracile, cursorial bipedal limb proportions
references:
  - id: dollo1882a
    notes: Listed and briefly diagnosed the family Hypsilophodontidae in his
      classification of the Ornithopoda.
  - id: madzia2021a
    notes: Provides the modern phylogenetic definition of Hypsilophodontidae.
  - id: boyd2015a
    notes: Recovered a restricted Ornithopoda of Hypsilophodon foxii plus
      Iguanodontia.
  - id: longrich2024c
    notes: Described Vectidromeus as a hypsilophodontid, restricting the family
      to Hypsilophodon and Vectidromeus.
  - id: fonseca2024a
    notes: Recovered Hypsilophodontidae as Hypsilophodon and Gideonmantellia,
      the only non-iguanodontian ornithopods, noting this contrasts with most
      other studies.
