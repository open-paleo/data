clade: Hypsilophodontidae
description: >
  Hypsilophodontidae is a clade of small, cursorial, bipedal ornithopods that
  historically served as a wastebasket for nearly all "hypsilophodont-grade"
  ornithischians. Under modern phylogenetic analyses the family has been
  drastically restricted, and is here recovered as a small early-diverging
  ornithopod clade comprising the type genus Hypsilophodon and the closely
  related Vectidromeus, both from the Barremian Wessex Formation of the Isle of
  Wight, England.
type_genus: Hypsilophodon
erected_in: dollo1882
described_in: madzia2021
diagnostic_features:
  - Accessory tooth-like ossification on the ascending process of the astragalus
  - Straight articular surface of the femoral head
  - Anterior (lesser) trochanter positioned anterior to the greater trochanter
  - Small body size with gracile, cursorial bipedal limb proportions
