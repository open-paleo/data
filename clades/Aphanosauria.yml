clade: Aphanosauria
description: >
  Aphanosauria is a clade of early avemetatarsalian archosaurs from the Middle to
  Late Triassic, known from South America, Europe, and possibly Africa. Members of
  Aphanosauria were quadrupedal or semi-quadrupedal and possessed a long neck and
  tail. They are among the earliest-diverging members of the bird-line (Avemetatarsalia)
  and are important for understanding the early evolution of archosaurs prior to the
  origin of pterosaurs and dinosaurs.
described: 2017
authors: Ezcurra et al.
