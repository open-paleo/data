clade: Averostra
description: >
  Averostra, meaning "bird snouts," is a clade of theropod dinosaurs within
  Neotheropoda that encompasses most theropods, uniting the two great branches
  Ceratosauria and Tetanurae. It represents the only lineage of theropods to
  survive beyond the Early Jurassic, and so includes nearly every theropod from
  the Middle Jurassic onward, from the horned ceratosaurs and abelisaurs to the
  megalosaurs, allosaurs, and the feathered coelurosaurs that ultimately gave
  rise to birds. Its members are among the most derived theropods, distinguished
  by the complete loss of the fifth metacarpal, a hand bone that other
  saurischians retained in reduced form. They also share a promaxillary or
  maxillary fenestra, an extra opening near the front of the upper jaw, together
  with fewer teeth in the maxilla, a tooth row set further back along the jaw,
  and a lacrimal fenestra.
erected_in: paul2002a
described_in: ezcurra2007a
