    notes: Coined Averostra (p. 25) as an apomorphy-based name for avepods with
      an accessory maxillary opening into a maxillary sinus, and their
      descendants, in the clade including Dromaeosauridae.
  - id: ezcurra2007a
    notes: Defined Averostra as the node-based clade of Ceratosaurus nasicornis,
      Allosaurus fragilis and all descendants of their common ancestor,
      following Paul's original arrangement.
