clade: Carcharodontosauridae
description: >
  Carcharodontosauridae is a family of giant carnivorous theropod dinosaurs
  forming a clade within Carnosauria. Its members include some of the largest
  land predators ever known, among them Acrocanthosaurus, Giganotosaurus,
  Mapusaurus, and Tyrannotitan, the biggest of which rivaled Tyrannosaurus and
  Spinosaurus in size, with the heaviest estimated at 8 to 10 metric tons.
  Together with the spinosaurids, carcharodontosaurids were the dominant large
  predators of the Early and mid-Cretaceous across Gondwana, and species also
  occur in North America, Europe, and possibly Asia. Their fossil record spans
  the Cretaceous from the Barremian to the Turonian, after which they were
  replaced by smaller abelisaurids in Gondwana and by tyrannosaurids in North
  America and Asia. An advanced South American subfamily, the Giganotosaurinae,
  groups the most closely related giant forms.
type_genus: Carcharodontosaurus
erected_in: stromer1931a
diagnostic_features:
  - Large, laterally compressed teeth with pronounced, shark-like serrations
  - Very large body size, often exceeding 10 meters in length
  - Prominent ornamentation on the lacrimal and postorbital bones
  - Pneumatized cranial bones with extensive sinus systems
  - Elongate, narrow maxilla
