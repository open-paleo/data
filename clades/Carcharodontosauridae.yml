clade: Carcharodontosauridae
rank: family
type_genus: Carcharodontosaurus
erected_in: stromer1931a
described_in: brusatte2008b
diagnostic_features:
  - Large, laterally compressed teeth with pronounced, shark-like serrations
  - Very large body size, often exceeding 10 meters in length
  - Prominent ornamentation on the lacrimal and postorbital bones
  - Pneumatized cranial bones with extensive sinus systems
  - Elongate, narrow maxilla
references:
  - id: stromer1931a
    notes: Named Carcharodontosaurus and wrote that its peculiarity could justify
      a family Carcharodontosauridae; later works credit the family to this
      paper.
  - id: brusatte2008b
    notes: Printed Sereno's revised definition (Carcharodontosaurus saharicus
      but not Sinraptor dongi, Allosaurus fragilis or Passer domesticus) and
      erected Carcharodontosaurinae.
  - id: coria2006a
    notes: Described Mapusaurus and named the subfamily Giganotosaurinae for it
      and Giganotosaurus.
  - id: carrano2012a
    notes: Found little support for a Giganotosaurus plus Mapusaurus clade in a
      phylogenetic revision of Tetanurae.
