clade: Carcharodontosauridae
description: >
  Carcharodontosauridae, meaning "shark-toothed lizards," is a family of giant
  carnosaurian theropods known from the Cretaceous of Africa, South America,
  Europe, Asia, and North America, named by Stromer in 1931 for Carcharodontosaurus.
  The family includes some of the largest terrestrial predators ever known, such as
  Carcharodontosaurus, Giganotosaurus, and Mapusaurus, and is characterized by
  large, laterally compressed, serrated teeth and heavily ornamented skulls.
type_genus: Carcharodontosaurus
erected_in: stromer1931a
diagnostic_features:
  - Large, laterally compressed teeth with pronounced, shark-like serrations
  - Very large body size, often exceeding 10 meters in length
  - Prominent ornamentation on the lacrimal and postorbital bones
  - Pneumatized cranial bones with extensive sinus systems
  - Elongate, narrow maxilla
