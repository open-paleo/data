clade: Eumaniraptora
description: >
  Eumaniraptora is the paravian clade uniting Deinonychosauria (dromaeosaurids
  and troodontids) and Avialae, defined as a node-based taxon anchored on
  Deinonychus and modern birds. It contains the theropods most closely related to
  birds, whose members share elongate feathered forelimbs and a broadly modified
  manus. The clade excludes the more stemward paravians recovered outside the
  Deinonychosauria plus Avialae node.
erected_in: padian1999a
diagnostic_features:
  - Forelimb elongate, approaching or exceeding hindlimb length in many members
  - Large asymmetric pennaceous feathers on the forelimb forming an aerofoil
  - Laterally oriented glenoid permitting a wide arc of forelimb elevation
  - Distal carpal incorporated into a trochlea permitting extensive wrist folding
references:
