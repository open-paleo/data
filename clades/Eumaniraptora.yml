clade: Eumaniraptora
description: >
  Eumaniraptora, the "true maniraptorans," is a node-based clade of bird-line
  theropod dinosaurs that unites the avialans, which include Archaeopteryx and
  the more than 11,000 living species of birds, with the deinonychosaurs, the
  grouping of dromaeosaurids and troodontids. It is the node-based counterpart
  of the stem-based Paraves (Padian and colleagues, 1999), and some analyses
  recover scansoriopterygids as paravians that fall outside Eumaniraptora
  (Godefroit and colleagues, 2013). Its members are marked by long, winged
  forelimbs carrying large asymmetric feathers and an increasingly flexible,
  folding wrist, adaptations that set the stage for flapping flight in this
  lineage. Many forms also bore an enlarged, sickle-shaped claw on the second
  toe that was held retracted off the ground while walking. From small-bodied
  ancestors, dromaeosaurids and troodontids repeatedly evolved into larger
  animals through the Cretaceous, while body size continued to shrink in many of
  the avialans that led to modern birds.
erected_in: padian1999a
diagnostic_features:
  - Forelimb elongate, approaching or exceeding hindlimb length in many members
  - Large asymmetric pennaceous feathers on the forelimb forming an aerofoil
  - Laterally oriented glenoid permitting a wide arc of forelimb elevation
  - Distal carpal incorporated into a trochlea permitting extensive wrist folding
references:
  - id: padian1999a
  - id: godefroit2013b
    notes: Regarded Epidendrosaurus and Epidexipteryx, both scansoriopterygids,
      and Eosinopteryx as basal non-eumaniraptoran paravians.
