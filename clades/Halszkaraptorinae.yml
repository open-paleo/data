clade: Halszkaraptorinae
description: >
  Halszkaraptorinae is a clade of small, early-diverging predatory dinosaurs
  known from the Late Cretaceous of Mongolia, and includes the enigmatic genera
  Halszkaraptor, Natovenator, Mahakala, and Hulsanpes. Its members were roughly
  the size of modern ducks and are distinguished by their unusually long necks,
  along with a suite of features in the tail vertebrae, forelimbs, hips, and
  hindlimbs. On the basis of their forelimb and body proportions, some
  researchers have interpreted these animals as semiaquatic swimmers that used
  their long necks to forage in water while remaining bipedal on land, though
  this lifestyle has been questioned. The clade is usually recovered at or near
  the base of Dromaeosauridae, but its exact placement is contested, with some
  analyses instead allying it with Unenlagiidae or drawing it toward the bird
  lineage.
type_genus: Halszkaraptor
erected_in: cau2017a
diagnostic_features:
  - Elongate cervical vertebrae producing a long neck
  - Numerous small, closely packed teeth
  - Premaxilla with a battery of small teeth and neurovascular foramina
  - Dorsoventrally flattened, elongate forelimb elements
dispute:
  summary: >
    The position of Halszkaraptorinae is contested. It is most often recovered at
    the base of Dromaeosauridae (Cau et al., 2017; Lee et al., 2022), the
    arrangement adopted here, but Hartman et al. (2019) and Jones et al. (2026)
    group it with Unenlagiinae as Unenlagiidae, and some analyses draw that clade
    toward Avialae rather than into Dromaeosauridae. The proposed semiaquatic
    ecology of its members has also been questioned (Fabbri et al., 2022).
  history:
    - date: "2026-07-01"
      note: Placed at the base of Dromaeosauridae following Cau et al. (2017) and Lee et al. (2022); the Unenlagiidae-grouping and avialan-affinity hypotheses are recorded here. Member genera carry no per-genus dispute for this clade-level debate.
references:
  - id: cau2017a
  - id: lee2022a
    notes: Recovered the Halszkaraptorinae arrangement adopted here in describing a streamlined non-avian dinosaur.
  - id: hartman2019a
    notes: Large paravian phylogenetic analysis bearing on Halszkaraptorinae placement, contra adopted arrangement.
  - id: fabbri2022a
    notes: Questioned the proposed semiaquatic ecology of halszkaraptorines.
