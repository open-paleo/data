clade: Halszkaraptorinae
description: >
  Halszkaraptorinae is a clade of small, early-diverging dromaeosaurids from the
  Late Cretaceous of Mongolia, comprising Halszkaraptor, Mahakala, Hulsanpes, and
  Natovenator. Members have long necks, numerous small teeth, and forelimb and
  body proportions that have been interpreted as adaptations for a semiaquatic,
  possibly diving lifestyle. The clade was erected by Cau et al. (2017) and is
  usually recovered at or near the base of Dromaeosauridae.
type_genus: Halszkaraptor
erected_in: cau2017
diagnostic_features:
  - Elongate cervical vertebrae producing a long neck
  - Numerous small, closely packed teeth
  - Premaxilla with a battery of small teeth and neurovascular foramina
  - Dorsoventrally flattened, elongate forelimb elements
dispute:
  summary: >
    The position of Halszkaraptorinae is contested. It is most often recovered at
    the base of Dromaeosauridae (Cau et al., 2017; Lee et al., 2022), the
    arrangement adopted here, but Hartman et al. (2019) and Jones et al. (2026)
    group it with Unenlagiinae as Unenlagiidae, and some analyses draw that clade
    toward Avialae rather than into Dromaeosauridae. The proposed semiaquatic
    ecology of its members has also been questioned (Fabbri et al., 2022).
  history:
    - date: "2026-07-01"
      note: Placed at the base of Dromaeosauridae following Cau et al. (2017) and Lee et al. (2022); the Unenlagiidae-grouping and avialan-affinity hypotheses are recorded here. Member genera carry no per-genus dispute for this clade-level debate.
