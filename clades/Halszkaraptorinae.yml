clade: Halszkaraptorinae
rank: subfamily
type_genus: Halszkaraptor
erected_in: cau2017a
diagnostic_features:
  - Elongate cervical vertebrae producing a long neck
  - Numerous small, closely packed teeth
  - Premaxilla with a battery of small teeth and neurovascular foramina
  - Dorsoventrally flattened, elongate forelimb elements
dispute:
  summary: >
    The position of Halszkaraptorinae is contested. It is most often
    recovered at the base of Dromaeosauridae (Cau and colleagues, 2017; Lee
    and colleagues, 2022), but Hartman and colleagues (2019) pair it with
    Unenlagiinae as Unenlagiidae, the sister of dromaeosaurids plus
    troodontids, and Wang and colleagues (2026) recover that pair closer to
    birds than to dromaeosaurids and troodontids. The proposed semiaquatic
    ecology of its members has also been questioned (Fabbri and colleagues,
    2022).
references:
  - id: cau2017a
  - id: lee2022a
    notes: Recovered the Halszkaraptorinae arrangement the clade follows, in describing a streamlined non-avian dinosaur.
  - id: hartman2019a
    notes: Large paravian phylogenetic analysis bearing on Halszkaraptorinae placement, contra adopted arrangement.
  - id: fabbri2022a
    notes: Questioned the proposed semiaquatic ecology of halszkaraptorines.
  - id: jones2026c
    notes: Treats Halszkaraptorinae with Unenlagiinae as Unenlagiidae.
  - id: wang2026b
    notes: Recovered Halszkaraptorinae with Unenlagiinae closer to birds than to dromaeosaurids and troodontids.
