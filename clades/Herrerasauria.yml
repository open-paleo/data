clade: Herrerasauria
description: >
  Herrerasauria is a clade of carnivorous dinosaurs from the Late Triassic,
  among the oldest dinosaurs known, first appearing roughly 233 million years
  ago during the Carnian stage. Its best-known members come from South America,
  including Herrerasaurus and Staurikosaurus of Argentina and Brazil, though
  possible relatives have also been recovered in North America, Africa, and
  perhaps other continents. Most were small to mid-sized predators, typically no
  more than about 4 meters long. Their anatomy blends primitive and derived
  features: they only superficially resemble later theropods and are not thought
  to be ancestral to any later dinosaur group. Distinctive traits include a hip
  socket that is only partly open, just two sacral vertebrae (the fewest of any
  dinosaur), and a hinged lower jaw. Their exact position on the dinosaur family
  tree remains debated, with analyses variously placing them as basal
  saurischians that diverged before the split between theropods and
  sauropodomorphs, or as early theropods.
erected_in: galton1985a
described_in: langer2004a
diagnostic_features:
  - Predatory dentition with recurved, serrated, laterally compressed teeth
  - Grasping, elongate manus with reduced outer digits
  - Elongate, distally expanded pubis
dispute:
  summary: >
    The scope of Herrerasauria is unsettled: Jones (2026) treats it as a bare
    synonym of Herrerasauridae, while Novas and others (2021), Ezcurra and
    others (2025) and Srivastava and others (2026) recover a broader clade that
    also includes non-herrerasaurid herrerasaurians such as Maleriraptor and,
    variably, the Tawa-Chindesaurus-Daemonosaurus group. Whether the clade lies
    within Saurischia outside Theropoda or at the base of Theropoda is likewise
    contested.
  history:
    - date: "2026-06-30"
      note: >
        Recognized as a clade broader than Herrerasauridae following the recent
        herrerasaurian analyses, and placed within Saurischia outside Theropoda;
        the contested Tawa-Chindesaurus-Daemonosaurus members are placed at
        Saurischia incertae sedis, pending resolution of their position.
references:
  - id: galton1985a
    notes: Source in which the name Herrerasauria was proposed.
  - id: langer2004a
    notes: Provided the phylogenetic definition of Herrerasauria adopted here.
  - id: ezcurra2025a
    notes: New herrerasaurian description with phylogeny recovering a broader Herrerasauria distinct from Herrerasauridae.
  - id: srivastava2026a
    notes: New saurischian description with phylogeny recovering a broader Herrerasauria scope.
  - id: novas2021a
    notes: Recovered Herrerasauria as a broader clade rather than a bare synonym of Herrerasauridae
  - id: jones2026c
    notes: Placement and assessment in the Princeton Encyclopedia of Dinosaurs.
