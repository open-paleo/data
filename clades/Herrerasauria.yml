clade: Herrerasauria
rank: unranked
erected_in: galton1985c
described_in: langer2004a
diagnostic_features:
  - Predatory dentition with recurved, serrated, laterally compressed teeth
  - Grasping, elongate manus with reduced outer digits
  - Elongate, distally expanded pubis
dispute:
  summary: >
    The scope of Herrerasauria is unsettled. Recent analyses recover it as a
    clade broader than Herrerasauridae: Ezcurra and colleagues (2025) place
    Maleriraptor in it outside Herrerasauridae, and Novas and colleagues
    (2021) and Srivastava and Nesbitt (2026) include the
    Tawa-Chindesaurus-Daemonosaurus group, which Srivastava and Nesbitt name
    Morphoraptora. The Princeton Encyclopedia (Jones, 2026) uses
    Herrerasauria as another name for Herrerasauridae. Its position is also
    contested: most analyses place it within Saurischia outside the clade of
    theropods and sauropodomorphs (Langer, 2004; Novas and colleagues, 2021;
    Ezcurra and colleagues, 2025), others recover herrerasaurids at the base
    of Theropoda (Nesbitt and colleagues, 2009; Sues and colleagues, 2011)
    or as the sister of Sauropodomorpha (Baron and colleagues, 2017), and
    Baron and Williams (2018) place Herrerasauria outside Dinosauria.
references:
  - id: galton1985c
    notes: Source in which the name Herrerasauria was proposed.
  - id: langer2004a
    notes: Provided the phylogenetic definition of Herrerasauria used for the clade.
  - id: ezcurra2025a
    notes: New herrerasaurian description with phylogeny recovering a broader Herrerasauria distinct from Herrerasauridae.
  - id: srivastava2026a
    notes: New saurischian description with phylogeny recovering a broader Herrerasauria scope.
  - id: novas2021a
    notes: Recovered Herrerasauria as a broader clade outside Eusaurischia, and
      summarizes the three hypotheses for its position.
  - id: jones2026c
    notes: Uses Herrerasauria as another name for Herrerasauridae, placed within
      Saurischia but outside Theropoda.
  - id: nesbitt2009a
    notes: Recovered Herrerasauridae at the base of Theropoda, with weak support.
  - id: sues2011a
    notes: Supported a basal theropod position for herrerasaurids rather than a basal saurischian one.
  - id: baron2017a
    notes: Recovered Herrerasauridae as the sister of Sauropodomorpha in a redefined Saurischia.
  - id: baron2018c
    notes: Recovered Herrerasauria outside Dinosauria on the dataset of Baron and colleagues (2017).
