clade: Herrerasauria
description: >
  Herrerasauria is a clade of early saurischian dinosaurs uniting Herrerasauridae
  with a small number of more basal or fragmentary relatives, here Maleriraptor
  and Caseosaurus. It is defined as all dinosaurs more closely related to
  Herrerasaurus than to Liliensternus and Plateosaurus, and is placed within
  Saurischia outside the theropod-sauropodomorph divergence. Some authors treat
  Herrerasauria as synonymous with Herrerasauridae, whereas several recent
  analyses recover a broader clade.
erected_in: galton1985a
described_in: langer2004
diagnostic_features:
  - Predatory dentition with recurved, serrated, laterally compressed teeth
  - Grasping, elongate manus with reduced outer digits
  - Elongate, distally expanded pubis
dispute:
  summary: >
    The scope of Herrerasauria is unsettled: Jones (2026) treats it as a bare
    synonym of Herrerasauridae, while Novas and others (2021), Ezcurra and
    others (2025) and Srivastava and others (2026) recover a broader clade that
    also includes non-herrerasaurid herrerasaurians such as Maleriraptor and,
    variably, the Tawa-Chindesaurus-Daemonosaurus group. Whether the clade lies
    within Saurischia outside Theropoda or at the base of Theropoda is likewise
    contested.
  history:
    - date: "2026-06-30"
      note: >
        Recognized as a clade broader than Herrerasauridae following the recent
        herrerasaurian analyses, and placed within Saurischia outside Theropoda;
        the contested Tawa-Chindesaurus-Daemonosaurus members are parked at
        Saurischia and deferred pending the theropod-backbone reconciliation
        (P2, P6).
