clade: Rhabdodontomorpha
description: >
  Rhabdodontomorpha is a clade of early-diverging iguanodontian ornithopods,
  small to large plant-eaters thought to have split from other iguanodont
  lineages as far back as the Middle Jurassic. It brings together the family
  Rhabdodontidae, whose short-snouted members such as Zalmoxes and Mochlodon are
  known largely from Europe, and Tenontosauridae, a North American clade of
  Tenontosaurus, Convolosaurus and Iani that Fonseca and colleagues (2024) named
  and recovered within the group, though most earlier analyses do not unite
  Tenontosaurus with the rhabdodontids (Zanno and colleagues, 2023). Iani, from
  North America, is somewhat transitional in some features between Tenontosaurus
  and other rhabdodontomorphs (Zanno and colleagues, 2023). Other members reach
  into Gondwana, including the Australian Fostoria. Together these animals span
  much of the Cretaceous and retain a number of plesiomorphic ornithopod
  features.
erected_in: dieudonné2016a
described_in: madzia2021a
diagnostic_features:
  - Subrectangular maxillary process of the jugal overlapping the maxilla with
    parallel dorsal and ventral margins
  - Strongly anteroposteriorly bowed humeral shaft
  - Lateral deflection of the preacetabular process of the ilium of at least 30
    degrees
  - Transversely expanded, shelf-like dorsal margin of the preacetabular process
references:
  - id: dieudonné2016a
    notes: Erected Rhabdodontomorpha.
  - id: madzia2021a
    notes: Provides the modern phylogenetic definition of Rhabdodontomorpha.
  - id: fonseca2024a
    notes: Named Tenontosauridae for Tenontosaurus, Convolosaurus and Iani, and
      recovered it with Rhabdodontoidea within Rhabdodontomorpha.
  - id: zanno2023a
    notes: Described Iani as somewhat transitional in some features between
      Tenontosaurus and other rhabdodontomorphs, noting most analyses do not
      unite Tenontosaurus with rhabdodontids.
