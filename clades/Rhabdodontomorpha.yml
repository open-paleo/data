clade: Rhabdodontomorpha
description: >
  Rhabdodontomorpha is a clade of early-diverging iguanodontian ornithopods,
  small to large plant-eaters thought to have split from other iguanodont
  lineages as far back as the Middle Jurassic. It brings together the family
  Rhabdodontidae, whose short-snouted members such as Zalmoxes and Mochlodon are
  known largely from Europe, and the family Tenontosauridae, a North American
  radiation built around Tenontosaurus and its relatives that has been
  tentatively recovered as a basal branch of the group. Iani, from North
  America, is interpreted as a transitional form linking the tenontosaurids to
  the rhabdodontids. Other members reach into Gondwana, including the Australian
  Fostoria. Together these animals span much of the Cretaceous and retain a
  number of plesiomorphic ornithopod features.
erected_in: dieudonné2016a
described_in: madzia2021a
diagnostic_features:
  - Robust, deep dentary with a strongly developed coronoid process
  - Tall-crowned cheek teeth with prominent primary ridges
  - Reduced tooth count relative to other iguanodontians
  - Stocky, graviportal limb proportions in derived members
references:
  - id: dieudonné2016a
    notes: Erected Rhabdodontomorpha.
  - id: madzia2021a
    notes: Provides the modern phylogenetic definition of Rhabdodontomorpha.
