clade: Rhabdodontomorpha
description: >
  Rhabdodontomorpha is an early-diverging clade of iguanodontian ornithopods
  comprising the European Rhabdodontidae and the North American
  Tenontosaurus-grade taxa (Tenontosaurus, Iani, Convolosaurus). Its members are
  small to medium-sized, relatively short-snouted herbivores that retain many
  plesiomorphic ornithopod features, and the clade represents a long-lived
  lineage spanning the Early to Late Cretaceous of Laurasia.
erected_in: dieudonné2016a
described_in: madzia2021a
diagnostic_features:
  - Robust, deep dentary with a strongly developed coronoid process
  - Tall-crowned cheek teeth with prominent primary ridges
  - Reduced tooth count relative to other iguanodontians
  - Stocky, graviportal limb proportions in derived members
references:
  - id: dieudonné2016a
    notes: Erected Rhabdodontomorpha.
  - id: madzia2021a
    notes: Provides the modern phylogenetic definition of Rhabdodontomorpha.
