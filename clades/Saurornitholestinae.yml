clade: Saurornitholestinae
description: >
  Saurornitholestinae is a subfamily of eudromaeosaurian dromaeosaurid dinosaurs
  known only from the Late Cretaceous of western North America. Its members are
  medium-sized predators generally distinguished by their comparatively short
  snouts, and the group is typically taken to include Atrociraptor, Bambiraptor,
  and Saurornitholestes. It is most often recovered as the sister group to a
  clade uniting the dromaeosaurines and velociraptorines. Its exact position is
  contested, however: some analyses instead find its proposed members to be the
  earliest-diverging branch of the eudromaeosaurs rather than a clade of their
  own.
type_genus: Saurornitholestes
erected_in: longrich2009a
diagnostic_features:
  - Short, deep snout relative to velociraptorines
  - Enlarged, strongly recurved anterior maxillary and dentary teeth
  - Second premaxillary tooth enlarged and flattened with ridged enamel
dispute:
  summary: >
    Saurornitholestinae is not universally recovered. It is supported as a
    monophyletic North American subfamily (Saurornitholestes, Atrociraptor, and
    sometimes Acheroraptor and Bambiraptor) by Longrich and Currie (2009), Currie
    and Evans (2019), and Powers et al. (2022). Pei et al. (2020) do not recover
    it, instead placing Saurornitholestes and Bambiraptor as the earliest-diverging
    eudromaeosaurs, with their relative order varying between equal and implied
    weighting. It is retained here following the recent cranial-anatomy studies
    that support it.
  history:
    - date: "2026-07-01"
      note: Retained as a broadly used subfamily (P4 current acceptance; Currie and Evans, 2019; Powers et al., 2022), with the non-recovery by some analyses recorded here rather than on member genera.
    - date: "2026-07-28"
      note: Retained as a broadly used subfamily (Longrich and Currie, 2009;
        Currie and Evans, 2019; Powers et al., 2022); the non-recovery by Pei et
        al. (2020) is recorded here rather than on member genera.
references:
  - id: longrich2009a
    notes: Coined Saurornitholestinae for Saurornitholestes, Atrociraptor and
      Bambiraptor, and Eudromaeosauria for the larger clade.
  - id: pei2020a
    notes: Did not recover Saurornitholestinae; placed Saurornitholestes and
      Bambiraptor as the earliest-diverging eudromaeosaurs, their order varying
      with weighting scheme.
  - id: powers2022a
    notes: Used CT scans to test eudromaeosaurian evolution, supporting a monophyletic North American saurornitholestine subfamily
  - id: currie2019a
    notes: Supported Saurornitholestinae as a monophyletic North American subfamily.
