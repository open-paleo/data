clade: Saurornitholestinae
description: >
  Saurornitholestinae is a subfamily of North American eudromaeosaurian
  dromaeosaurids comprising the type genus Saurornitholestes and Atrociraptor,
  and in some analyses Acheroraptor and Bambiraptor. Members combine relatively
  short, deep snouts with enlarged, blade-like anterior teeth. The subfamily is
  supported by recent cranial studies but is not recovered by all analyses, some
  of which place its members within Velociraptorinae.
type_genus: Saurornitholestes
erected_in: longrich2009a
diagnostic_features:
  - Short, deep snout relative to velociraptorines
  - Enlarged, strongly recurved anterior maxillary and dentary teeth
  - Second premaxillary tooth enlarged and flattened with ridged enamel
dispute:
  summary: >
    Saurornitholestinae is not universally recovered. It is supported as a
    monophyletic North American subfamily (Saurornitholestes, Atrociraptor, and
    sometimes Acheroraptor and Bambiraptor) by Longrich and Currie (2009), Currie
    and Evans (2019), and Powers et al. (2022), but other analyses (Pei et al.,
    2020; Cau and Madzia, 2021) do not recover it and instead place its members
    within Velociraptorinae or as basal eudromaeosaurs. It is retained here
    following the recent cranial-anatomy studies that support it.
  history:
    - date: "2026-07-01"
      note: Retained as a broadly used subfamily (P4 current acceptance; Currie and Evans, 2019; Powers et al., 2022), with the non-recovery by some analyses recorded here rather than on member genera.
references:
  - id: longrich2009a
  - id: cau2021a
    notes: Did not recover Saurornitholestinae, instead placing its members within Velociraptorinae or as basal eudromaeosaurs.
  - id: pei2020a
    notes: Large avialan-relatives phylogeny placing Saurornitholestinae members within Velociraptorinae instead.
  - id: powers2022a
    notes: Used CT scans to test eudromaeosaurian evolution, supporting a monophyletic North American saurornitholestine subfamily
  - id: currie2019a
    notes: Supported Saurornitholestinae as a monophyletic North American subfamily.
