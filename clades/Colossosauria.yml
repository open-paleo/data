clade: Colossosauria
description: >
  Colossosauria is a clade of titanosaur sauropod dinosaurs that lived in South
  America from the latest Early Cretaceous through the Late Cretaceous.
  Originally erected around Mendozasaurus, it is delimited in current usage as
  all titanosaurs closer to Patagotitan than to Saltasaurus, a framework that
  places it as the opposing branch to Saltasauroidea within the larger group
  Eutitanosauria. Its core subgroups are Lognkosauria, which
  includes some of the largest land animals ever known, and the smaller-bodied
  Rinconsauria, so the clade spans a wide range of body sizes. Depending on the
  phylogenetic analysis, it may also take in other similar titanosaurs and
  various unclassified forms on the stem toward either subgroup. Members are
  distinguished mainly by traits of the limb girdles and limbs, including a
  wide-gauge stance.
erected_in: gonzálezriga2019a
described_in: carballido2022a
diagnostic_features:
  - Eye-shaped (reniform) sternal plates with a strong lateral expansion
  - Robust, transversely broad metacarpals forming a vertical colonnade
  - Femur with a prominent lateral bulge below the greater trochanter
  - Forelimb and hindlimb proportions indicating a wide-gauge stance
references:
  - id: gonzálezriga2019a
    notes: Erected Colossosauria (originally defined by reference to
      Mendozasaurus).
  - id: carballido2022a
    notes: Redefined Colossosauria (Patagotitan not Saltasaurus) as the
      Patagotitan-line stem of Eutitanosauria.
