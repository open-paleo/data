clade: Colossosauria
description: >
  Colossosauria is a stem-based clade of derived titanosaurs defined as all taxa
  closer to Patagotitan than to Saltasaurus. Named by González Riga et al.
  (2019) and incorporated into the node-stem framework of Carballido et al.
  (2022), it unites the giant-bodied Lognkosauria (Argentinosaurus, Patagotitan,
  Puertasaurus and relatives) with the smaller-bodied Rinconsauria, and so spans
  the largest known terrestrial animals down to medium-sized forms. Members are
  characterized chiefly by features of the appendicular skeleton.
erected_in: gonzálezriga2019a
described_in: carballido2022a
diagnostic_features:
  - Eye-shaped (reniform) sternal plates with a strong lateral expansion
  - Robust, transversely broad metacarpals forming a vertical colonnade
  - Femur with a prominent lateral bulge below the greater trochanter
  - Forelimb and hindlimb proportions indicating a wide-gauge stance
references:
  - id: gonzálezriga2019a
    notes: Defined Colossosauria.
  - id: carballido2022a
    notes: Recovered Colossosauria as the Patagotitan-line stem of
      Eutitanosauria.
