clade: Orodrominae
description: >
  Orodrominae is one of the two subfamilies of Thescelosauridae, comprising
  small basal neornithischians from the Cretaceous of North America and Asia.
  Several members (Oryctodromeus, Orodromeus, Koreanosaurus) show skeletal
  adaptations associated with a fossorial, burrowing habit. The subfamily is
  defined as the thescelosaurids more closely related to Orodromeus than to
  Thescelosaurus.
type_genus: Orodromeus
erected_in: brown2013
described_in: madzia2021
diagnostic_features:
  - Sharp, pronounced scapular spine
  - D-shaped fibular shaft cross-section throughout its length
  - Long ventral process of the squamosal
  - Sharp ventral keel on the cervical vertebrae
