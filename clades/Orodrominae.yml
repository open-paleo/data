clade: Orodrominae
description: >
  Orodrominae is one of the two subfamilies of Thescelosauridae, a group of
  small plant-eating neornithischian dinosaurs from the Cretaceous of North
  America. It gathers genera such as Orodromeus, Oryctodromeus, Zephyrosaurus,
  and Albertadromeus, and is defined as the thescelosaurids more closely related
  to Orodromeus than to Thescelosaurus. Like other thescelosaurids, its members
  were highly selective browsers that likely fed mainly on soft, pulpy plant
  material. Several orodromines show skeletal features associated with a
  burrowing lifestyle; Oryctodromeus in particular has been found preserved
  inside fossil burrows, its bones packed tightly together in a way rarely seen
  when a carcass is left exposed.
type_genus: Orodromeus
erected_in: brown2013a
described_in: madzia2021a
diagnostic_features:
  - Sharp, pronounced scapular spine
  - D-shaped fibular shaft cross-section throughout its length
  - Long ventral process of the squamosal
  - Sharp ventral keel on the cervical vertebrae
references:
  - id: brown2013a
    notes: Erected Orodrominae.
  - id: madzia2021a
    notes: Provides the modern phylogenetic definition of Orodrominae.
