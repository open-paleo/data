diagnostic_features:
  - Deep, foreshortened, box-like skull, frequently bearing a tall bony crest
  - Robust, edentulous, downturned beak with a shortened snout
  - Pair of tooth-like premaxillary processes projecting into the palate
  - Shortened neck and tail relative to basal oviraptorosaurs
references:
  - id: barsbold1976c
    notes: Erected the family Oviraptoridae.
  - id: maryańska2002a
    notes: Defined Oviraptoridae as the most inclusive clade containing
      Oviraptor philoceratops but not Caenagnathus collinsi, and diagnosed it by
      a cranially concave pubic shaft.
  - id: funston2020a
    notes: Recovered two subfamilies within Oviraptoridae, Citipatiinae and
      Heyuanninae, in the analysis describing Oksoko.
