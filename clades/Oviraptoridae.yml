clade: Oviraptoridae
description: >
  Oviraptoridae is a family of derived, short-skulled oviraptorosaurs known
  almost entirely from the Late Cretaceous of central and eastern Asia. They are
  distinguished by deep, box-like, often prominently crested skulls, a robust
  edentulous beak, and relatively short necks and tails. The family divides into
  two subfamilies, the crested Citipatiinae and the short-armed Heyuanninae,
  with several basal genera (including the type genus Oviraptor) falling outside
  both.
type_genus: Oviraptor
erected_in: barsbold1976b
described_in: funston2020a
diagnostic_features:
  - Deep, foreshortened, box-like skull, frequently bearing a tall bony crest
  - Robust, edentulous, downturned beak with a shortened snout
  - Pair of tooth-like premaxillary processes projecting into the palate
  - Shortened neck and tail relative to basal oviraptorosaurs
references:
