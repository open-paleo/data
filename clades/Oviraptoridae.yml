clade: Oviraptoridae
description: >
  Oviraptoridae is a family of bird-like, feathered maniraptoran theropods known
  only from the Late Cretaceous of Asia, with the finest specimens coming from
  the Gobi Desert of Mongolia and northwestern China. Most were fairly small
  animals, roughly one to two meters long, with toothless parrot-like beaks and,
  in many genera, an elaborate bony head crest resembling that of a cassowary.
  They were probably herbivorous or omnivorous rather than the egg predators
  once imagined, and are famous for fossils preserving adults brooding atop
  circular clutches of eggs, a posture seen today only among birds. The family
  is traditionally split into two subfamilies: the small, short-armed, mostly
  crestless Heyuanninae and the larger, long-armed, crested Citipatiinae, with
  several basal genera falling outside both groups.
type_genus: Oviraptor
erected_in: barsbold1976b
described_in: funston2020a
diagnostic_features:
  - Deep, foreshortened, box-like skull, frequently bearing a tall bony crest
  - Robust, edentulous, downturned beak with a shortened snout
  - Pair of tooth-like premaxillary processes projecting into the palate
  - Shortened neck and tail relative to basal oviraptorosaurs
