clade: Avetheropoda
description: >
  Avetheropoda is a clade of tetanuran theropod dinosaurs comprising Allosaurus,
  modern birds, and all descendants of their most recent common ancestor. In
  effect it unites the two great advanced theropod lineages, the allosauroid
  carnosaurs and the coelurosaurs, which diverge from one another at the base of
  the group; it is often treated as equivalent to Neotetanurae (Carrano and
  colleagues, 2012). Avetheropods account for the bulk of predatory dinosaur
  diversity of the Late Jurassic and Cretaceous, and they include the only
  theropods to survive to the present day, the living birds. They are set apart
  from more basal tetanurans such as the megalosauroids by skeletal details,
  including a femoral head oriented fully medially rather than anteromedially.
  The group is recovered in many analyses (Carrano and colleagues, 2012), though
  Rauhut and colleagues (2024), like some earlier studies, instead unite
  allosauroids and megalosauroids as Carnosauria.
erected_in: paul1988a
described_in: holtz2004a
diagnostic_features:
  - Maxillary fenestra present and well-developed
  - Reduced or absent prefrontal bone
  - Enlarged orbit relative to skull length
  - Fused interdental plates
  - Opisthopubic or mesopubic pelvis in derived members
references:
  - id: paul1988a
    notes: Named Avetheropoda for the bird-like theropods, from compsognathids and
      coelurids to the allosaur-tyrannosaur group and the protobirds.
  - id: holtz2004a
    notes: Defined Avetheropoda as Allosaurus fragilis, Passer domesticus, their
      most recent common ancestor and all its descendants.
  - id: carrano2012a
    notes: Recovered Avetheropoda and treated Neotetanurae as its synonym in a
      classification of Tetanurae.
  - id: rauhut2024a
    notes: Described a new theropod from the Callovian Balabansai Formation and
      recovered Carnosauria, uniting Megalosauroidea and Allosauroidea, rather
      than Avetheropoda.
