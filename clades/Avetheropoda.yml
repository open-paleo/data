clade: Avetheropoda
description: >
  Avetheropoda is a clade of tetanuran theropod dinosaurs comprising Allosaurus,
  modern birds, and all descendants of their most recent common ancestor. In
  effect it unites the two great advanced theropod lineages, the allosauroid
  carnosaurs and the coelurosaurs, which diverge from one another at the base of
  the group; it is often treated as equivalent to Neotetanurae. Avetheropods
  account for the bulk of predatory dinosaur diversity of the Late Jurassic and
  Cretaceous, and they include the only theropods to survive to the present day,
  the living birds. They are set apart from more basal tetanurans such as the
  megalosauroids by skeletal details, including a femoral head oriented fully
  medially rather than anteromedially. The group's monophyly is well supported
  in many analyses, though some recent studies instead favor a model in which
  allosauroids and megalosauroids are each other's closest relatives.
erected_in: paul1988a
diagnostic_features:
  - Maxillary fenestra present and well-developed
  - Reduced or absent prefrontal bone
  - Enlarged orbit relative to skull length
  - Fused interdental plates
  - Opisthopubic or mesopubic pelvis in derived members
