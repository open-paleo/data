clade: Megaraptoridae
description: >
  Megaraptoridae is the derived family of megaraptoran theropods, comprising the
  larger, mostly South American forms together with the Australian
  Australovenator. It contains the type genus Megaraptor and its close relatives
  and excludes the more basal megaraptorans Fukuiraptor and Phuwiangvenator.
  Members were the apex predators of many Late Cretaceous Gondwanan ecosystems.
type_genus: Megaraptor
erected_in: novas2013a
diagnostic_features:
  - Cervical vertebrae with extensive lateral pneumatic fossae and camellate internal structure
  - Strongly opisthocoelous anterior dorsal vertebrae
  - Elongate, gracile metatarsus
  - Manual unguals I and II hypertrophied relative to the pes
references:
  - id: novas2013a
