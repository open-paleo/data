clade: Tapinocephalinae
description: >
  Tapinocephalinae is a subfamily of tapinocephalid dinocephalians, large
  herbivorous therapsids from the Middle Permian of South Africa. Members are
  characterized by a low, depressed skull with a thickened cranial roof,
  interpreted as an adaptation for intraspecific combat. Tapinocephalinae
  includes some of the largest terrestrial animals of the Permian.
