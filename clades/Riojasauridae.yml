clade: Riojasauridae
description: >
  Riojasauridae is a small clade of massopodan sauropodomorphs from the Late
  Triassic comprising Riojasaurus and Eucnemesaurus, medium- to large-bodied,
  heavily built quadrupedal or facultatively quadrupedal herbivores. It is an
  early-branching lineage within Massopoda; its exact position fluctuates between
  sister to Massospondylidae and a more crownward position near Sauropodiformes.
type_genus: Riojasaurus
erected_in: yates2007a
diagnostic_features:
  - Robust, columnar hindlimb with a straight femoral shaft
  - Tall crest-like lesser (anterior) trochanter of the femur
  - Large posterior proximal tubercle on the femur
  - Heavily built, weight-bearing postcranium
references:
  - id: yates2007a
    notes: Erected Riojasauridae.
