clade: Riojasauridae
description: >
  Riojasauridae is a small family of sauropodomorph dinosaurs that lived during
  the Late Triassic, from the late Carnian into the Norian. It contains only two
  genera, Riojasaurus and Eucnemesaurus, whose fossils come from the Los
  Colorados Formation of La Rioja Province, Argentina, and the Lower Elliot
  Formation of South Africa, respectively. As sauropodomorphs rather than true
  sauropods, these were heavily built, medium- to large-bodied plant-eaters that
  were much smaller than the giant sauropods of later periods and may not have
  been fully committed to walking on all fours. The group is defined as a stem
  lineage within Massopoda, an early radiation of long-necked herbivores. Its
  precise placement remains unsettled: Barrett and colleagues (2024) recover it
  at the base of Massopoda, below the massospondylids, whereas Peyre de
  Fabrègues and colleagues (2020) place it crownward of Massospondylidae, nearer
  the sauropod line.
type_genus: Riojasaurus
erected_in: yates2007a
diagnostic_features:
  - Tall crest-like lesser (anterior) trochanter of the femur, higher than wide
  - Large posterior proximal tubercle on the femur
  - Rounded, convex profile of the fourth trochanter of the femur
  - Heavily built, weight-bearing postcranium
references:
  - id: yates2007a
    notes: Erected Riojasauridae.
  - id: barrett2024a
    notes: Recovered Riojasauridae among the earliest-branching massopodans,
      below massospondylids and sauropodiforms.
  - id: peyredefabrègues2020a
    notes: Recovered Riojasauridae crownward of Massospondylidae and the Lufeng
      genera, nearer Sauropoda.
