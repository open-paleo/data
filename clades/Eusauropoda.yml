clade: Eusauropoda
description: >
  Eusauropoda ("true sauropods") is a clade erected by Upchurch (1995) for the
  least inclusive group containing Shunosaurus lii and Saltasaurus loricatus. It
  comprises the great majority of sauropod diversity, including the basal East
  Asian radiation Mamenchisauridae, the non-neosauropod clades Turiasauria and
  Cetiosauridae, and Neosauropoda, with Shunosaurus and Barapasaurus among the
  basalmost members. Eusauropods are diagnosed by extensive cranial and dental
  modifications for bulk herbivory together with further elongation and
  pneumatization of the neck.
erected_in: upchurch1995a
described_in: wilson2002a
diagnostic_features:
  - Broad, spatulate teeth arranged in a transversely broadened tooth row
  - External nares retracted to a position level with or behind the antorbital fenestra
  - Twelve or more cervical vertebrae
  - Forked anterior chevrons
  - Reduced manual and pedal phalangeal formulae
  - Pronounced lateral pneumatic excavation of the presacral vertebrae
references:
  - id: upchurch1995a
    notes: Erected Eusauropoda.
  - id: wilson2002a
    notes: Comprehensive cladistic analysis diagnosing Eusauropoda.
