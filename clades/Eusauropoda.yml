clade: Eusauropoda
description: >
  Eusauropoda ("true lizard foot") is a derived clade of sauropod dinosaurs that
  encompasses the great majority of sauropod diversity. Upchurch (1995) erected
  it for all sauropods except the vulcanodontids, including Shunosaurus and
  Neosauropoda; Wilson and Sereno (1998) define it as sauropods closer to
  Saltasaurus than to Vulcanodon, whereas Salgado and colleagues (1997) applied
  the name to the node of Barapasaurus and Neosauropoda. Its members were
  strictly herbivorous, long-necked quadrupeds that grew to enormous size, and
  their remains have been found on every major continent, ranging in time from
  the Early Jurassic to the latest Cretaceous. The group includes the largely
  Asian family Mamenchisauridae, the clades Turiasauria and Cetiosauridae, and
  Neosauropoda, which in turn contains the widespread diplodocoids and
  titanosaurs. Eusauropods are set apart by skeletal specializations for bulk
  browsing, including broad, U-shaped jaws and lateral plates along the tooth
  rows, together with retracted nostrils, a further-elongated neck built from
  additional cervical vertebrae, and a semi-digitigrade, weight-bearing foot
  posture.
erected_in: upchurch1995a
described_in: wilson2002a
diagnostic_features:
  - Broad, spatulate teeth arranged in a transversely broadened tooth row
  - External nares retracted to a position level with or behind the antorbital fenestra
  - Twelve or more cervical vertebrae
  - Forked anterior chevrons
  - Reduced manual and pedal phalangeal formulae
  - Pronounced lateral pneumatic excavation of the presacral vertebrae
references:
  - id: upchurch1995a
    notes: Erected Eusauropoda for all sauropods except the vulcanodontids.
  - id: wilson2002a
    notes: Comprehensive cladistic analysis diagnosing Eusauropoda.
  - id: wilson1998a
    notes: Defined Eusauropoda as sauropods closer to Saltasaurus than to
      Vulcanodon, and diagnosed it.
  - id: salgado1997a
    notes: Applied the name Eusauropoda to the node of Barapasaurus and
      Neosauropoda.
