clade: Caenagnathidae
description: >
  Caenagnathidae is a family of toothless oviraptorosaurs known from the
  Cretaceous of Asia and North America, ranging from the tiny Caenagnathasia to
  the gigantic Gigantoraptor. They are distinguished by slender, elongate hind
  limbs, lightly built forelimbs, and a deep, edentulous lower jaw with a fused
  symphysis bearing complex lingual occlusal ridges. Internal relationships are
  weakly resolved, with Microvenator, Gigantoraptor and Anomalipes forming a
  basal grade and the remaining, mostly Laramidian genera forming a poorly
  supported crown; no stable subfamily-level division is currently recognized.
type_genus: Caenagnathus
erected_in: sternberg1940a
described_in: funston2020b
diagnostic_features:
  - Fully fused, edentulous mandibular symphysis with paired lingual ridges
  - Deep dentary bearing a prominent lateral fossa and pneumatic foramen
  - Elongate, gracile, cursorial hindlimb with a fused tarsometatarsus in some genera
  - Preacetabular process of the ilium expanded ventrally
references:
