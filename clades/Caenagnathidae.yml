clade: Caenagnathidae
description: >
  Caenagnathidae is a family of beaked, feathered oviraptorosaurs known from the
  Cretaceous of North America and Asia. Its members range enormously in size,
  from the turkey-sized Caenagnathasia to the giant Beibeilong and
  Gigantoraptor, which reached roughly 8 meters in length. Like other
  oviraptorosaurs they had long necks and short tails, but they were more
  lightly built than their oviraptorid relatives, with slender arms and long,
  gracile legs. Their toothless lower jaws were relatively long and shallow,
  hollow and connected to the air-sac system, and lined internally with complex
  ridges, toothlike processes, and shelf-like structures. This variation in body
  size and beak shape suggests that caenagnathids adapted to a range of
  ecological niches, and the group persisted until the very end of the
  Cretaceous, vanishing with the other non-avian dinosaurs.
type_genus: Caenagnathus
erected_in: sternberg1940a
described_in: funston2020b
diagnostic_features:
  - Fully fused, edentulous mandibular symphysis with paired lingual ridges
  - Deep dentary bearing a prominent lateral fossa and pneumatic foramen
  - Elongate, gracile, cursorial hindlimb with a fused tarsometatarsus in some genera
  - Preacetabular process of the ilium expanded ventrally
