clade: Lognkosauria
description: >
  Lognkosauria is a clade of colossosaurian titanosaurs erected by Calvo et al.
  (2007) for Futalognkosaurus, Mendozasaurus and their close relatives. It
  includes several of the most massive land animals ever to have lived —
  Argentinosaurus, Patagotitan, Puertasaurus and Notocolossus among them — and
  is characterized by extremely wide, transversely expanded presacral vertebrae
  and broad, anteroposteriorly compressed neural spines. Members are concentrated
  in the mid- to Late Cretaceous of South America.
erected_in: calvo2007a
diagnostic_features:
  - Cervical and dorsal vertebrae extremely wide transversely, with markedly
    expanded neural spines
  - Anterior caudal vertebrae with wide, dorsoventrally low neural arches
  - Robust, transversely broad limb bones
  - Large body size, including the largest known sauropods
