clade: Lognkosauria
description: >
  Lognkosauria is a clade of giant, long-necked sauropod dinosaurs within
  Titanosauria, encompassing Futalognkosaurus, Mendozasaurus and their close
  relatives. It includes some of the largest and heaviest land animals ever
  known, among them Argentinosaurus, Patagotitan, Puertasaurus, Notocolossus,
  Drusilasaura and Traukutitan, with Malawisaurus possibly related as well. Its
  members lived mainly in the Cretaceous of South America, with occurrences
  reported from Africa and possibly Asia. Lognkosaurians are set apart from
  other titanosaurs by the wide, unusually thick rib loops on their neck
  vertebrae, a relatively narrow neural canal, and huge vaulted neural arches.
  Their trunk vertebrae are also very broad, bearing wing-like lateral processes
  roughly level with the neural canal, and their rib cages are exceptionally
  wide.
erected_in: calvo2007a
diagnostic_features:
  - Cervical and dorsal vertebrae extremely wide transversely, with markedly
    expanded neural spines
  - Anterior caudal vertebrae with wide, dorsoventrally low neural arches
  - Robust, transversely broad limb bones
  - Large body size, including the largest known sauropods
references:
