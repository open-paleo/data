clade: Saurolophinae
description: >
  Saurolophinae is one of the two major subfamilies of hadrosaurid dinosaurs,
  encompassing the solid-crested and crestless duck-bills such as Saurolophus,
  Edmontosaurus, Gryposaurus, Kritosaurus, Brachylophosaurus, and Maiasaura.
  Long known under the largely abandoned name Hadrosaurinae, the clade was
  recircumscribed to exclude the basal type genus Hadrosaurus and is now widely
  recognized for the diverse Late Cretaceous radiation of North America, Asia,
  and South America. Its members bear at most solid cranial crests formed largely
  from the nasal and premaxillary bones, in contrast to the hollow crests of
  Lambeosaurinae.
type_genus: Saurolophus
erected_in: brown1914b
described_in: madzia2021
diagnostic_features:
  - Cranial ornamentation, when present, a solid crest formed mainly by the
    nasals and premaxillae rather than a hollow narial chamber
  - Reflected, often arched dorsal margin of the premaxilla bordering the
    external naris
  - Caudally extended circumnarial fossa
  - Reduced or absent supraorbital contribution to the dorsal orbital margin
