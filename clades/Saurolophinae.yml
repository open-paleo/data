clade: Saurolophinae
description: >
  Saurolophinae is one of the two major subfamilies of hadrosaurid dinosaurs,
  alongside the hollow-crested Lambeosaurinae. It gathers the solid-crested and
  crestless duck-bills long grouped as the "hadrosaurines," including such
  genera as Saurolophus, Edmontosaurus, Gryposaurus, Kritosaurus,
  Brachylophosaurus, and Maiasaura, and is further divided into tribes such as
  Brachylophosaurini and Kritosaurini. The older name Hadrosaurinae was largely
  set aside once its namesake genus, Hadrosaurus, was found to fall outside the
  traditional grouping, and the clade was recircumscribed to exclude it. Where
  its members bear cranial ornamentation at all, it takes the form of a solid
  crest built mainly from the nasal bones rather than the inflated, hollow nasal
  passages seen in lambeosaurines. Saurolophines were a diverse radiation of the
  Late Cretaceous, ranging across North America and Asia and reaching South
  America, where an endemic group of southern kritosaurs is thought to have
  arrived by island-hopping and rafting around 85 million years ago.
type_genus: Saurolophus
erected_in: brown1914b
described_in: madzia2021a
diagnostic_features:
  - Cranial ornamentation, when present, a solid crest formed mainly by the
    nasals and premaxillae rather than a hollow narial chamber
  - Reflected, often arched dorsal margin of the premaxilla bordering the
    external naris
  - Caudally extended circumnarial fossa
  - Reduced or absent supraorbital contribution to the dorsal orbital margin
references:
  - id: brown1914b
    notes: Named Saurolophinae in the provisional classification of the
      Trachodontidae.
  - id: madzia2021a
    notes: Provides the modern phylogenetic definition of Saurolophinae.
