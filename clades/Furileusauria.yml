clade: Furileusauria
description: >
  Furileusauria (meaning "stiff back lizards") is a clade of derived abelisaurid
  theropod dinosaurs nested within Brachyrostra, the short-snouted, largely
  South American branch of the abelisaurids. It is a stem-based group defined by
  the inclusion of Carnotaurus but the exclusion of Ilokelesia, Skorpiovenator,
  and Majungasaurus, and it encompasses most of the latest Cretaceous
  abelisaurids of South America, among them Carnotaurus, Aucasaurus, Viavenator,
  and Llukalkan. Its members were among the larger brachyrostrans, averaging
  roughly 7 meters (23 feet) in length. A more restrictive tribe within the
  group, Carnotaurini, unites Carnotaurus and Aucasaurus. The clade is
  distinguished by a suite of features in the skull, cervical vertebrae, tail,
  and hindlimb, and the recently described French taxon Caletodraco extends its
  range beyond South America into Europe.
erected_in: filippi2016a
diagnostic_features:
  - Cervical epipophyses bearing a stout, anteriorly directed prong.
  - Hypertrophied axial and cervical vertebral processes.
  - Axe-shaped (anteriorly expanded) cnemial crest of the tibia.
  - Mediolaterally compressed shaft of metatarsal II.
references:
  - id: filippi2016a
    notes: Named Viavenator and erected the clade Furileusauria.
