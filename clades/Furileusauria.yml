clade: Furileusauria
description: >
  Furileusauria is a clade of derived brachyrostran abelisaurids erected by
  Filippi and colleagues, defined as the most inclusive clade containing
  Carnotaurus but not Ilokelesia, Skorpiovenator, or Majungasaurus. It
  encompasses most of the latest Cretaceous South American abelisaurids,
  including Carnotaurus, Aucasaurus, Viavenator, and Llukalkan, and is
  diagnosed by derived features of the cervical vertebrae and hindlimb. The
  recently described European Caletodraco extends the clade beyond South
  America.
erected_in: filippi2016a
diagnostic_features:
  - Cervical epipophyses bearing a stout, anteriorly directed prong.
  - Hypertrophied axial and cervical vertebral processes.
  - Axe-shaped (anteriorly expanded) cnemial crest of the tibia.
  - Mediolaterally compressed shaft of metatarsal II.
references:
  - id: filippi2016a
    notes: Named Viavenator and erected the clade Furileusauria.
