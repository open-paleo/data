clade: Ceratopsia
description: >
  Ceratopsia is the clade of beaked, mostly herbivorous ornithischian dinosaurs
  known as the horned dinosaurs, ranging from the Late Jurassic to the end of the
  Cretaceous. They are united by the rostral bone, a unique median ossification
  capping the upper beak. The clade spans small bipedal forms such as
  Psittacosaurus and the Jurassic Chaoyangsauridae through the diverse
  Neoceratopsia, which culminates in the large, frilled and horned Ceratopsidae.
type_genus: Ceratops
erected_in: marsh1890a
described_in: madzia2021
diagnostic_features:
  - Rostral bone, a unique median ossification forming the tip of the upper beak
  - Tall, narrow skull that is triangular in anterior view
  - Laterally flared jugals giving the skull a broad cheek region
  - Vaulted palate
