clade: Carcharodontosauria
description: >
  Carcharodontosauria is a clade of allosauroid theropods comprising
  Carcharodontosauridae and their closest relatives, encompassing many of the
  largest terrestrial predators of the Cretaceous across both Gondwana and
  Laurasia. Its basal members are medium-sized forms that grade into the giant
  carcharodontosaurids. The carcharodontosaurids underwent a worldwide dispersal
  during the Early Cretaceous before the family died out in the Turonian,
  roughly 90 million years ago, after which other large theropods took over the
  apex-predator role.
erected_in: benson2009e
diagnostic_features:
  - Large body size with proportionally large, ornamented skulls
  - Laterally compressed, serrated teeth
  - Extensive cranial pneumaticity
  - Rugose ornamentation on the lacrimal and postorbital bones
references:
  - id: benson2009e
