clade: Lessemsauridae
description: >
  Lessemsauridae is a clade of large-bodied sauropodiform sauropodomorphs from
  the Late Triassic to Early Jurassic of Gondwana, comprising Lessemsaurus,
  Antetonitrus, Ingentia, and Ledumahadi. Its members were among the first
  dinosaurs to attain very large size, with robust, graviportal limbs, and they
  sit at the immediate origin of Sauropoda.
type_genus: Lessemsaurus
erected_in: apaldetti2018a
dispute:
  summary: >
    Lessemsauridae (Lessemsaurus, Antetonitrus, Ingentia, Ledumahadi) sits on the
    Sauropodiformes-Sauropoda boundary, and whether it falls inside or just
    outside Sauropoda is definition-dependent: under the node-based Sauropoda of
    Yates (2007) it is the basalmost sauropod clade, whereas under more
    restrictive stem-based definitions (Salgado and others, 1997; McPhee and
    others, 2014) it is the immediate non-sauropodan sister group of Sauropoda.
    Jones (2026) treats it as a basal subfamily within Sauropoda.
  history:
    - date: "2026-06-29"
      note: Placed at the base of Sauropodiformes, immediately outside Sauropoda,
        as the least-inclusive uncontested placement (it is within
        Sauropodiformes under every definition); the inside-vs-outside-Sauropoda question remains
        unresolved.
diagnostic_features:
  - Very large body size with graviportal, columnar limb proportions
  - Dorsoventrally tall, transversely expanded ("plate-like") dorsal neural spines
  - Slit-shaped neural canals on the dorsal vertebrae
  - Massive, broad scapular blade
references:
  - id: apaldetti2018a
    notes: Erected Lessemsauridae.
  - id: yates2007a
    notes: Phylogenetic analysis of basal sauropodomorphs bearing on the Sauropodiformes-Sauropoda boundary.
  - id: mcphee2014a
    notes: Described Antetonitrus anatomy and its phylogenetic placement among Lessemsauridae.
  - id: salgado1997a
    notes: Provided a restrictive stem-based Sauropoda definition under which Lessemsauridae falls just outside Sauropoda.
  - id: jones2026b
    notes: Placement and assessment in the Princeton Encyclopedia of Dinosaurs.
