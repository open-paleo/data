clade: Lessemsauridae
description: >
  Lessemsauridae is a clade of early sauropodiform dinosaurs that lived from the
  Late Triassic into the Early Jurassic of Gondwana, with fossils known from
  Argentina, South Africa, and possibly Lesotho. It unites Lessemsaurus,
  Antetonitrus, and Ingentia, with Ledumahadi added shortly afterward and the
  genera Kholumolumo and Meroktenos later assigned to the group as well. Its
  members were quadrupeds among the first dinosaurs to reach truly large size,
  with Lessemsaurus estimated near 7 tonnes and Ledumahadi near 12. Unlike the
  columnar-limbed sauropods that followed, lessemsaurids retained somewhat
  flexed forelimbs, and they are further marked by highly pneumatic neck and
  back vertebrae, short but tall and robust cervicals, and a broadly expanded
  shoulder blade. Sitting on the boundary between sauropodiforms and true
  sauropods, the group is recovered either as the most basal sauropods or as
  their immediate sister lineage depending on how Sauropoda is defined.
type_genus: Lessemsaurus
erected_in: apaldetti2018a
dispute:
  summary: >
    Lessemsauridae (Lessemsaurus, Antetonitrus, Ingentia, Ledumahadi) sits
    on the Sauropodiformes-Sauropoda boundary, and whether it falls inside
    or just outside Sauropoda is definition-dependent: under the stem-based
    Sauropoda of Yates (2007), the most inclusive clade containing
    Saltasaurus but not Melanorosaurus, it is the basalmost sauropod clade,
    whereas under the more restrictive node-based definition of Salgado and
    colleagues (1997), adopted by McPhee and colleagues (2014), it is the
    immediate non-sauropodan sister group of Sauropoda.
diagnostic_features:
  - Dorsoventrally tall, transversely expanded ("plate-like") dorsal neural spines
  - Slit-shaped neural canals on the dorsal vertebrae
  - Massive, broad scapular blade
references:
  - id: apaldetti2018a
    notes: Erected Lessemsauridae.
  - id: yates2007a
    notes: Defined Sauropoda as the most inclusive clade containing Saltasaurus
      loricatus but not Melanorosaurus readi.
  - id: mcphee2014a
    notes: Redescribed Antetonitrus and recovered it as the sister taxon of
      Lessemsaurus, adopting the node-based Sauropoda of Salgado and colleagues
      (1997).
  - id: salgado1997a
    notes: Defined Sauropoda as the most recent common ancestor of Vulcanodon
      karibaensis and Eusauropoda and all its descendants.
  - id: jones2026b
    notes: Treats Lessemsauridae as a distinct early branch of sauropods
      including Lessemsaurus, Antetonitrus, Ledumahadi, Ingentia and possibly
      Blikanasaurus.
