clade: Eudromaeosauria
description: >
  Eudromaeosauria is the clade of "true" dromaeosaurids, comprising the mostly
  Laurasian, ground-living predators of the Cretaceous and excluding the small
  Microraptorinae and the Gondwanan Unenlagiinae. It is a node-based clade
  anchored on Dromaeosaurus, Velociraptor, Deinonychus, and Saurornitholestes,
  and is conventionally divided into three subfamilies: Dromaeosaurinae,
  Velociraptorinae, and Saurornitholestinae. Its members bear the largest,
  sharpest sickle claws in the family.
erected_in: longrich2009a
diagnostic_features:
  - Large, deep, and strongly recurved pedal ungual II held clear of the ground
  - Deep, robust dentary
  - Shortened, box-like metatarsus relative to microraptorines
  - Enlarged denticles on the distal carina of the lateral teeth
