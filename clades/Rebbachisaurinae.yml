clade: Rebbachisaurinae
description: >
  Rebbachisaurinae is the derived rebbachisaurid subfamily within Khebbashia
  containing Rebbachisaurus, Nigersaurus, Demandasaurus, and Tataouinea, a
  largely Euro-African group of broad-muzzled, tooth-battery-bearing sauropods.
  It is defined as the stem-based clade of all rebbachisaurids more closely
  related to Rebbachisaurus than to Limaysaurus, and as the eponymous subfamily
  of Rebbachisaurus it takes priority over the synonymous Nigersaurinae
  (Wilson and Allain, 2015).
type_genus: Rebbachisaurus
erected_in: bonaparte1997a
described_in: wilson2015a
diagnostic_features:
  - Deep centroprezygapophyseal fossa on the middle and posterior dorsal
    vertebrae.
  - Divided centropostzygapophyseal lamina on the middle and posterior dorsal
    neural arches.
  - Anterior caudal vertebrae with a triangular lateral expansion of the neural
    spine.
references:
  - id: bonaparte1997a
    notes: As the work establishing the eponymous genus Rebbachisaurus in a
      ranked context, credited as the authority for Rebbachisaurinae, which has
      priority over Nigersaurinae.
  - id: wilson2015a
    notes: Formally defined Rebbachisaurinae and treated Nigersaurinae as a
      junior synonym.
