clade: Rebbachisaurinae
description: >
  Rebbachisaurinae is a subfamily of rebbachisaurid sauropod dinosaurs, one of
  the two branches of the clade Khebbashia alongside Limaysaurinae. It groups
  forms more closely related to Rebbachisaurus than to Limaysaurus, a largely
  Euro-African assemblage that includes Nigersaurus, Demandasaurus, and
  Tataouinea and ranged across South America, Africa, and Europe during the
  Cretaceous. Like other rebbachisaurids, these sauropods lacked the divided
  cervical neural spines of their diplodocid and dicraeosaurid relatives, and
  they bore distinctive teeth with asymmetrical enamel and low-angle internal
  wear facets. Some members, most notably Nigersaurus, developed dental
  batteries reminiscent of those in hadrosaurs and ceratopsians, an unusual
  feeding adaptation for a sauropod. As rebbachisaurids, they were among the
  last surviving diplodocoids, persisting alongside the titanosaurs until
  relatively late in the Cretaceous.
type_genus: Rebbachisaurus
erected_in: bonaparte1997a
described_in: wilson2015a
diagnostic_features:
  - Deep centroprezygapophyseal fossa on the middle and posterior dorsal
    vertebrae
  - Divided centropostzygapophyseal lamina on the middle and posterior dorsal
    neural arches
  - Anterior caudal vertebrae with a triangular lateral expansion of the neural
    spine
references:
  - id: bonaparte1997a
    notes: As the work establishing the eponymous genus Rebbachisaurus in a
      ranked context, credited as the authority for Rebbachisaurinae, which has
      priority over Nigersaurinae.
  - id: wilson2015a
    notes: Formally defined Rebbachisaurinae and treated Nigersaurinae as a
      junior synonym.
