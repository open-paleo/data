clade: Ankylosaurinae
rank: subfamily
type_genus: Ankylosaurus
erected_in: brown1908a
described_in: madzia2021a
diagnostic_features:
  - Well-developed handle-and-knob tail club
  - Numerous bulbous caputegulae (cranial osteoderms) on the skull roof
  - Squamosal and postocular horns forming pronounced cranial projections
  - Anteriorly facing external nares in derived members
references:
  - id: brown1908a
    notes: Named the family Ankylosauridae, from which the subfamily name takes its
      authorship by coordination; Madzia and colleagues (2021) credit
      Ankylosaurinae to Nopcsa (1918).
  - id: nopcsa1918a
    notes: Ranked Ankylosauridae as a subfamily, uniting Euoplocephalus,
      Ankylosaurus, Sarcolestes and Leipsanosaurus; Madzia and colleagues (2021)
      credit Ankylosaurinae to it.
  - id: madzia2021a
    notes: Defined Ankylosaurinae as the largest clade containing Ankylosaurus
      magniventris but not Shamosaurus scutatus.
  - id: arbour2015a
    notes: Recovered Ankylosaurinae as the sister of Gobisaurus plus Shamosaurus,
      crediting the name to Nopcsa (1918) and its definition to Sereno (1998), as
      revised by Vickaryous and colleagues (2004).
  - id: sereno1998a
    notes: Defined Ankylosaurinae as all ankylosaurs closer to Ankylosaurus than
      to Shamosaurus or Minmi, listing it as "Ankylosaurinae (Brown 1908) Nopcsa
      1918".
  - id: vickaryous2004a
    notes: Defined Ankylosaurinae as all ankylosaurs closer to Ankylosaurus than
      to Shamosaurus, modified from Sereno, and diagnosed it.
