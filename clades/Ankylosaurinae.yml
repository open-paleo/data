clade: Ankylosaurinae
description: >
  Ankylosaurinae is the derived subfamily of ankylosaurid dinosaurs, comprising
  the tail-clubbed forms of the Late Cretaceous of Asia and North America such
  as Ankylosaurus, Pinacosaurus, Euoplocephalus, Saichania, and Tarchia. It is
  defined as all ankylosaurids more closely related to Ankylosaurus than to
  Shamosaurus, and dates by ICZN coordination from Brown's 1908 naming of
  Ankylosauridae.
type_genus: Ankylosaurus
erected_in: brown1908a
described_in: arbour2015a
diagnostic_features:
  - Well-developed handle-and-knob tail club
  - Numerous bulbous caputegulae (cranial osteoderms) on the skull roof
  - Squamosal and postocular horns forming pronounced cranial projections
  - Anteriorly facing external nares in derived members
references:
  - id: brown1908a
    notes: Named Ankylosauridae; Ankylosaurinae dates from this work by ICZN
      coordination.
  - id: arbour2015a
    notes: Provides the modern phylogenetic delimitation of Ankylosaurinae.
