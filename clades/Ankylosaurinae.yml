clade: Ankylosaurinae
description: >
  Ankylosaurinae is a subfamily of armored ankylosaurid dinosaurs that ranged
  from the Early Cretaceous, roughly 105 million years ago, to the very end of
  the Late Cretaceous around 66 million years ago. It encompasses the derived,
  tail-clubbed ankylosaurids and includes such genera as Ankylosaurus,
  Pinacosaurus, Euoplocephalus, and Saichania, most of them known from Asia and
  North America. The group is delimited as the largest clade containing
  Ankylosaurus but excluding Shamosaurus. Members are distinguished by details
  of the back of the skull, including a nuchal shelf that hides the occiput when
  the skull is viewed from above and a quadrate condyle partly concealed by a
  bony boss on the quadratojugal.
type_genus: Ankylosaurus
erected_in: brown1908a
described_in: arbour2015a
diagnostic_features:
  - Well-developed handle-and-knob tail club
  - Numerous bulbous caputegulae (cranial osteoderms) on the skull roof
  - Squamosal and postocular horns forming pronounced cranial projections
  - Anteriorly facing external nares in derived members
references:
  - id: brown1908a
    notes: Named Ankylosauridae; Ankylosaurinae dates from this work by ICZN
      coordination.
  - id: arbour2015a
    notes: Provides the modern phylogenetic delimitation of Ankylosaurinae.
