clade: Opisthocoelicaudiinae
description: >
  Opisthocoelicaudiinae is a subfamily of titanosaurian sauropod dinosaurs from
  the Late Cretaceous, with fossils known from Mongolia, Argentina, and the
  United States. Studies have grouped genera such as Alamosaurus and
  Opisthocoelicaudia within it, and its members are large, robustly built
  sauropods. They are distinguished above all by opisthocoelous front tail
  vertebrae — ball-and-socket joints that face the opposite way to the
  socket-and-ball (procoelous) arrangement seen in most other advanced
  titanosaurs — along with stout, columnar limbs. Their hands were highly
  reduced, lacking wrist bones and finger phalanges. The group's relationships
  remain debated: some analyses place it as a close relative of the
  saltasaurines, while others have instead linked Opisthocoelicaudia to other
  Asian sauropods such as Nemegtosaurus and Quaesitosaurus.
erected_in: mcintosh1990a
described_in: wilson2003b
type_genus: Opisthocoelicaudia
diagnostic_features:
  - Opisthocoelous anterior caudal vertebrae
  - Robust, columnar limb bones
  - Strongly developed neural-spine bifurcation reduced or absent
  - Posteriorly positioned, dorsally directed neural spines on anterior caudals
references:
  - id: mcintosh1990a
    notes: Recognized the opisthocoelicaudiine grouping within derived
      titanosaurs.
  - id: wilson2003b
    notes: Recovered Opisthocoelicaudiinae as sister to Saltasaurinae within
      Saltasauridae.
