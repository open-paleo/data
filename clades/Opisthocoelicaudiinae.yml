clade: Opisthocoelicaudiinae
description: >
  Opisthocoelicaudiinae is a subfamily of saltasaurid titanosaurs erected for
  Opisthocoelicaudia (McIntosh, 1990) and recovered as the sister group to
  Saltasaurinae within Saltasauridae in the revision of Wilson and Upchurch
  (2003). Its members are relatively large, robust titanosaurs of the Late
  Cretaceous, distinguished above all by opisthocoelous anterior caudal
  vertebrae — the reverse of the procoely typical of most derived titanosaurs —
  and by stoutly built limbs.
erected_in: mcintosh1990a
described_in: wilson2003b
type_genus: Opisthocoelicaudia
diagnostic_features:
  - Opisthocoelous anterior caudal vertebrae
  - Robust, columnar limb bones
  - Strongly developed neural-spine bifurcation reduced or absent
  - Posteriorly positioned, dorsally directed neural spines on anterior caudals
references:
  - id: mcintosh1990a
    notes: Recognized the opisthocoelicaudiine grouping within derived
      titanosaurs.
  - id: wilson2003b
    notes: Recovered Opisthocoelicaudiinae as sister to Saltasaurinae within
      Saltasauridae.
