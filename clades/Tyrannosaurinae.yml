clade: Tyrannosaurinae
description: >
  Tyrannosaurinae is one of the two subfamilies of Tyrannosauridae. The name
  traces to Osborn (1906) but was given its modern phylogenetic definition by
  Currie, Hurum and Sabath (2003) as all tyrannosaurids closer to Tyrannosaurus
  than to Albertosaurus. It comprises the robust, deep-skulled tyrannosaurids,
  including Tyrannosaurus, Tarbosaurus, and Daspletosaurus, as well as the
  long-snouted alioramins.
type_genus: Tyrannosaurus
erected_in: osborn1906a
described_in: currie2003a
diagnostic_features:
  - Inflated ectopterygoid sinus
  - Jugal anterior ramus deep below the pneumatic opening in mature individuals
  - Parietal sagittal crest extending forward onto the back of the frontals
  - Tall but broad parietal nuchal crest
references:
  - id: osborn1906a
  - id: currie2003a
    notes: Provides the modern phylogenetic definition and cranial diagnosis of
      Tyrannosaurinae.
