clade: Mamenchisauridae
description: >
  Mamenchisauridae is a family of eusauropod dinosaurs known from the Jurassic
  and Early Cretaceous of Asia and Africa, best known for their proportionately
  extremely long necks. The group was predominantly a Chinese radiation,
  including such genera as Mamenchisaurus, Omeisaurus, Chuanjiesaurus,
  Eomamenchisaurus, and Tonganosaurus, but its range extended to the Tanzanian
  outlier Wamweracaudia and, based on fragmentary remains, into Siberia. Some
  members reached gigantic sizes, ranking among the largest of all sauropods.
  The family has historically been confused with the somphospondylan Euhelopus
  and its relatives, and some phylogenetic analyses have again recovered those
  Cretaceous forms as close relatives of the mamenchisaurids.
type_genus: Mamenchisaurus
erected_in: young1972a
described_in: moore2020a
diagnostic_features:
  - Exceptionally elongate cervical vertebrae yielding necks approaching half the total body length
  - High cervical count, commonly 17 to 19 cervical vertebrae
  - Vertically oriented, often unbifurcated cervical neural spines
  - Forked anterior chevrons and, in derived forms, accessory processes on the humerus
  - Procoelous anterior caudal centra in derived members
references:
  - id: young1972a
    notes: Erected Mamenchisauridae for Mamenchisaurus hochuanensis.
  - id: moore2020a
    notes: Modern systematic revision of the Middle-Late Jurassic Chinese
      eusauropods diagnosing Mamenchisauridae.
