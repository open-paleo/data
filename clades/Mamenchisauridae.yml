clade: Mamenchisauridae
description: >
  Mamenchisauridae is a family of basal eusauropod dinosaurs erected by Young
  and Zhao (1972), famous for possessing the proportionally longest necks of any
  known animals. The clade represents a predominantly East Asian (Jurassic
  Chinese) radiation, with an African outlier (Wamweracaudia), and includes
  Mamenchisaurus, Omeisaurus, Klamelisaurus, Chuanjiesaurus, Xinjiangtitan, and
  the "core Mamenchisaurus-like taxa" recovered by Moore et al. (2020). It is
  distinct from the Cretaceous somphospondylan Euhelopodidae, with which several
  of its members were historically confused.
type_genus: Mamenchisaurus
erected_in: young1972a
described_in: moore2020a
diagnostic_features:
  - Exceptionally elongate cervical vertebrae yielding necks approaching half the total body length
  - High cervical count, commonly 17 to 19 cervical vertebrae
  - Vertically oriented, often unbifurcated cervical neural spines
  - Forked anterior chevrons and, in derived forms, accessory processes on the humerus
  - Procoelous anterior caudal centra in derived members
references:
  - id: young1972a
    notes: Erected Mamenchisauridae for Mamenchisaurus hochuanensis.
  - id: moore2020a
    notes: Modern systematic revision of the Middle-Late Jurassic Chinese
      eusauropods diagnosing Mamenchisauridae.
