clade: Mamenchisauridae
rank: family
type_genus: Mamenchisaurus
erected_in: young1972a
described_in: naish2007a
diagnostic_features:
  - Exceptionally elongate cervical vertebrae yielding necks approaching half the total body length
  - High cervical count, commonly 17 to 19 cervical vertebrae
  - Vertically oriented, often unbifurcated cervical neural spines
  - Forked anterior chevrons and, in derived forms, accessory processes on the humerus
  - Procoelous anterior caudal centra in derived members
references:
  - id: young1972a
    notes: Erected Mamenchisauridae for Mamenchisaurus hochuanensis.
  - id: naish2007a
    notes: Defined Mamenchisauridae as all sauropods closer to Mamenchisaurus
      constructus than to Saltasaurus loricatus.
  - id: moore2020a
    notes: Phylogeny of Chinese eusauropods in an osteology of Klamelisaurus;
      their clade is Mamenchisauridae in one analysis and, with Euhelopus inside
      it, Euhelopodidae in the others.
  - id: moore2023a
    notes: Reviewed the published definitions of Mamenchisauridae and adopted
      that of Naish and Martill (2007).
