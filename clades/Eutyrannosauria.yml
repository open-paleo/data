clade: Eutyrannosauria
description: >
  Eutyrannosauria is a clade of derived tyrannosauroid theropod
  dinosaurs comprising Tyrannosauridae and its closest non-
  tyrannosaurid relatives, the North American taxa Appalachiosaurus
  and Dryptosaurus. Members of the clade are characterized by
  large body size, rugose nasal ornamentation, and a suite of
  cranial pneumaticity features. Voris et al. (2025) recover
  Khankhuuluu mongoliensis as the immediate sister taxon of
  Eutyrannosauria.
erected_in: delcourt2018a
described_in: voris2025a

diagnostic_features:
  - Rugose nasals with cornual ornamentation.
  - Lacrimal with an inflated cornual process that expands
    dorsally during ontogeny.
  - Anteroposteriorly expanded dorsal process of the
    quadratojugal.
  - Pneumatic recess on the anterior surface of the quadrate
    condyles.
  - Medial margins of the distal condyle and diaphysis of
    metatarsal III aligned (not offset).

references:
  - id: delcourt2018a
    notes: Erected the clade Eutyrannosauria.
  - id: voris2025a
    notes: Uses Eutyrannosauria (Delcourt and Grillo, 2018) as an established
      clade and recovers Khankhuuluu mongoliensis as its immediate sister taxon.
