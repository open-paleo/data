clade: Eutyrannosauria
description: >
  Eutyrannosauria is a clade of large-bodied tyrannosauroid theropod dinosaurs
  of the Northern Hemisphere, encompassing the family Tyrannosauridae together
  with its closest non-tyrannosaurid relatives, such as the eastern North
  American genera Dryptosaurus and Appalachiosaurus and the southwestern North
  American Bistahieversor. It was defined to set these advanced, often gigantic
  northern forms apart from the more basal, globally distributed
  tyrannosauroids. Members are distinguished by their great size and by
  prominent cranial ornamentation, including roughened, ridge-bearing nasal
  bones. Some analyses further recover a distinct family, Dryptosauridae, of
  non-tyrannosaurid eutyrannosaurs that persisted along the Late Cretaceous
  Atlantic coastline of eastern North America.
erected_in: delcourt2018a
described_in: voris2025a
diagnostic_features:
  - Rugose nasals with cornual ornamentation
  - Lacrimal with an inflated cornual process that expands
    dorsally during ontogeny
  - Anteroposteriorly expanded dorsal process of the
    quadratojugal
  - Pneumatic recess on the anterior surface of the quadrate
    condyles
  - Medial margins of the distal condyle and diaphysis of
    metatarsal III aligned (not offset)
references:
  - id: delcourt2018a
    notes: Erected the clade Eutyrannosauria.
  - id: voris2025a
    notes: Uses Eutyrannosauria (Delcourt and Grillo, 2018) as an established
      clade and recovers Khankhuuluu mongoliensis as its immediate sister taxon.
