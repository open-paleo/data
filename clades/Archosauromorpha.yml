clade: Archosauromorpha
description: >
  Archosauromorpha is a major clade of diapsid reptiles that includes
  archosaurs (birds, crocodilians, and their extinct relatives) and several
  related groups such as tanystropheids and rhynchosaurs. The clade originated
  in the Permian and diversified extensively during the Triassic, with members
  surviving to the present day as birds and crocodilians.
