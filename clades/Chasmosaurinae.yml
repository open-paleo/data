clade: Chasmosaurinae
description: >
  Chasmosaurinae is one of the two subfamilies of Ceratopsidae, comprising the
  long-frilled horned dinosaurs of the Late Cretaceous of North America,
  typified by elongate brow horns, reduced nasal horns, and greatly elongate
  parietosquamosal frills with large parietal fenestrae. The subfamily ranges
  from earlier forms such as Chasmosaurus and Pentaceratops to the derived
  Triceratopsini (Triceratops, Torosaurus, and their relatives). It was named
  by Lambe in 1915 with Chasmosaurus as its type genus.
type_genus: Chasmosaurus
erected_in: lambe1915a
diagnostic_features:
  - Elongate postorbital (brow) horncores, contrasting with the abbreviated
    horns of centrosaurines
  - Reduced nasal horncore or boss
  - Greatly elongate parietosquamosal frill with large parietal fenestrae and
    elongate squamosals
  - Only three epiparietal loci (P1-P3) per side along the parietal lateral
    ramus
  - Premaxilla longer than tall, with subequal dorsal and ventral rami of the
    rostral
references:
  - id: lambe1915a
    notes: Erected the subfamilies Centrosaurinae and Chasmosaurinae.
