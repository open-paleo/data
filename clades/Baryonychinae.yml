clade: Baryonychinae
rank: subfamily
type_genus: Baryonyx
erected_in: charig1986a
described_in: sereno1998b
dispute:
  summary: >
    Baryonychinae is recovered as a monophyletic clade (Baryonyx, Suchomimus and
    relatives) by most analyses (Carrano and colleagues, 2012; Barker and
    colleagues, 2021; Rauhut and colleagues, 2025), and as Baryonyx plus
    Suchomimus once unstable taxa are pruned (Isasmendi and colleagues, 2024),
    but Sales and Schultz (2017)
    argue it is paraphyletic — a series of successive outgroups to Spinosaurinae
    unified by plesiomorphic serrated teeth — and Barker and colleagues (2021) could not
    statistically reject that alternative.
references:
  - id: charig1986a
    notes: Named the family Baryonychidae, from which the subfamily
      Baryonychinae takes its authorship by coordination.
  - id: sereno1998b
  - id: carrano2012a
    notes: Recovered Baryonychinae as a monophyletic clade in its Tetanurae phylogeny.
  - id: barker2021a
    notes: Described Ceratosuchops and Riparovenator, named the tribe
      Ceratosuchopsini, and recovered Baryonychinae as the sister group of
      Spinosaurinae.
  - id: isasmendi2024a
    notes: Described Riojavenatrix; recovered Baryonychinae as Baryonyx plus
      Suchomimus once unstable taxa were pruned, and placed Riojavenatrix in it
      only under a constraint costing three steps.
  - id: rauhut2025a
    notes: Camarillasaurus revision's phylogenetic analysis bears on Baryonychinae monophyly.
  - id: sales2017a
    notes: Argued Baryonychinae is paraphyletic, a grade of outgroups to Spinosaurinae united by plesiomorphic serrated teeth
