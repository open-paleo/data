clade: Baryonychinae
description: >
  Baryonychinae is a subfamily of spinosaurid dinosaurs from the Early
  Cretaceous of Europe and West Africa, including Baryonyx, Suchomimus, and
  their relatives, along with the tribe Ceratosuchopsini (Ceratosuchops,
  Riparovenator, and Suchomimus) recognized by some authors. Its members were
  large, bipedal predators with elongated, crocodile-like skulls whose jaw tips
  fanned out into rosettes of conical teeth, and robust forelimbs bearing
  three-fingered hands with a greatly enlarged first-finger claw. Unlike the
  more derived spinosaurines, baryonychines had only low sails along the back or
  none at all, and they were on average somewhat smaller. Their small, recurved
  teeth show little to no serration and resemble those of crocodiles, an
  arrangement generally read as an adaptation for catching fish, though at least
  one well-preserved member also fed opportunistically on other prey. It is
  usually recovered as the sister group of Spinosaurinae, but its monophyly is
  contested, with some analyses interpreting it instead as a grade of successive
  outgroups united by plesiomorphic serrated teeth.
type_genus: Baryonyx
erected_in: charig1986a
described_in: sereno1998b
dispute:
  summary: >
    Baryonychinae is recovered as a monophyletic clade (Baryonyx, Suchomimus and
    relatives) by most analyses (Carrano et al., 2012; Barker et al., 2021;
    Isasmendi et al., 2024; Rauhut et al., 2025), but Sales and Schultz (2017)
    argue it is paraphyletic — a series of successive outgroups to Spinosaurinae
    unified by plesiomorphic serrated teeth — and Barker et al. (2021) could not
    statistically reject that alternative.
  history:
    - date: "2026-07-01"
      note: Retained as a subfamily following the prevailing analyses; the paraphyly hypothesis (Sales and Schultz, 2017) is recorded as unresolved.
