clade: Baryonychinae
description: >
  Baryonychinae is the subfamily of spinosaurids that retain comparatively
  robust, blade-like serrated teeth, including Baryonyx, Suchomimus and their
  relatives (with the tribe Ceratosuchopsini of some authors). It is generally
  recovered as the sister group of Spinosaurinae, though its monophyly is
  contested. The subfamily is diagnosed relative to Spinosaurinae mainly by
  plesiomorphic craniodental features.
type_genus: Baryonyx
erected_in: charig1986a
described_in: sereno1998b
dispute:
  summary: >
    Baryonychinae is recovered as a monophyletic clade (Baryonyx, Suchomimus and
    relatives) by most analyses (Carrano et al., 2012; Barker et al., 2021;
    Isasmendi et al., 2024; Rauhut et al., 2025), but Sales and Schultz (2017)
    argue it is paraphyletic — a series of successive outgroups to Spinosaurinae
    unified by plesiomorphic serrated teeth — and Barker et al. (2021) could not
    statistically reject that alternative.
  history:
    - date: "2026-07-01"
      note: Retained as a subfamily following the prevailing analyses; the paraphyly hypothesis (Sales and Schultz, 2017) is recorded as unresolved.
references:
  - id: charig1986a
  - id: sereno1998b
  - id: carrano2012a
    notes: Recovered Baryonychinae as a monophyletic clade in its Tetanurae phylogeny.
  - id: barker2021a
    notes: New spinosaurid description supporting monophyletic Baryonychinae grouping.
  - id: isasmendi2024a
    notes: New basal spinosaurid analysis supporting monophyletic Baryonychinae.
  - id: rauhut2025a
    notes: Camarillasaurus revision's phylogenetic analysis bears on Baryonychinae monophyly.
  - id: sales2017a
    notes: Argued Baryonychinae is paraphyletic, a grade of outgroups to Spinosaurinae united by plesiomorphic serrated teeth
