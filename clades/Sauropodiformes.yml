clade: Sauropodiformes
rank: unranked
erected_in: sereno2007a
described_in: mcphee2014a
diagnostic_features:
  - Trend toward obligate quadrupedality with a shortened, weight-bearing manus
  - Robust, columnar limb bones with reduced shaft torsion
  - Broadened, weight-bearing pes with a reduced pollex
  - Massive scapular blade in derived members
references:
  - id: sereno2007a
    notes: Published Sauropodiformes, credited to Sereno's online database of
      2005, as the least inclusive clade containing Mussaurus patagonicus and
      Saltasaurus loricatus.
  - id: mcphee2014a
    notes: Provides the stem-based redefinition of Sauropodiformes used for the clade.
