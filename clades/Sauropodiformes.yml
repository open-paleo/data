clade: Sauropodiformes
description: >
  Sauropodiformes is a clade of sauropodomorph dinosaurs that gathers the true
  sauropods together with their closest non-sauropod relatives. As a stem-based
  group, it embraces every taxon on the sauropod side of the split from
  Massospondylus, running from the "near-sauropod" grade of animals such as
  Anchisaurus, Melanorosaurus, Aardonyx, and Mussaurus, through the
  lessemsaurids, and on to the sauropods themselves. Its members chart one of
  the defining transitions in dinosaur evolution: the shift from the ancestral
  part-time two-legged posture to obligate four-legged walking, accompanied by
  the march toward enormous body size on the line leading to Sauropoda.
erected_in: sereno2007a
described_in: mcphee2014a
diagnostic_features:
  - Trend toward obligate quadrupedality with a shortened, weight-bearing manus
  - Robust, columnar limb bones with reduced shaft torsion
  - Broadened, weight-bearing pes with a reduced pollex
  - Massive scapular blade in derived members
references:
  - id: sereno2007a
    notes: Erected Sauropodiformes.
  - id: mcphee2014a
    notes: Provides the stem-based redefinition of Sauropodiformes adopted here.
