clade: Sauropodiformes
description: >
  Sauropodiformes is the clade of massopodan sauropodomorphs containing all taxa
  more closely related to Saltasaurus than to Massospondylus, spanning the
  "near-sauropod" grade (Anchisaurus, Melanorosaurus, Aardonyx, Mussaurus, and
  relatives) through the lessemsaurids and the sauropods themselves. Its members
  document the transition to obligate quadrupedality and gigantism on the line
  leading to Sauropoda.
erected_in: sereno2007a
described_in: mcphee2014a
diagnostic_features:
  - Trend toward obligate quadrupedality with a shortened, weight-bearing manus
  - Robust, columnar limb bones with reduced shaft torsion
  - Broadened, weight-bearing pes with a reduced pollex
  - Massive scapular blade in derived members
references:
  - id: sereno2007a
    notes: Erected Sauropodiformes.
  - id: mcphee2014a
    notes: Provides the stem-based redefinition of Sauropodiformes adopted here.
