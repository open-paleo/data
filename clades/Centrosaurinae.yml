clade: Centrosaurinae
description: >
  Centrosaurinae is one of the two subfamilies of Ceratopsidae, comprising the
  short-frilled, nasal-ornament-dominated horned dinosaurs of the Late
  Cretaceous of North America and Asia. Centrosaurines concentrate their
  cranial ornamentation on the nasal region and the parietal margin, and span
  the early-diverging nasutoceratopsin and albertaceratopsin lineages as well
  as the derived centrosaurin and pachyrhinosaurin radiations (the latter
  replacing nasal horns with thickened bosses). The subfamily was named by
  Lambe in 1915 with Centrosaurus as its type genus.
type_genus: Centrosaurus
erected_in: lambe1915
diagnostic_features:
  - Cranial ornamentation concentrated on the nasal region and parietal margin,
    with large bladelike epiparietals (more than six loci per side in derived
    forms)
  - Rostrocaudally abbreviated squamosal with a stepped caudomedian margin
  - Wide parietal midline bar with a triangular cross-section that tapers
    laterally
  - Premaxilla with a pronounced ventral angle and a subcircular external
    narial region
  - Narial spine formed by both the nasal and the premaxilla
references:
  - id: lambe1915
    authors: Lambe, L. M.
    year: 1915
    title: "On Eoceratops canadensis, gen. nov., with remarks on other genera
      of Cretaceous horned dinosaurs"
    journal: Geological Survey of Canada Museum Bulletin
    volume: "12"
    issue: "24"
    notes: Erected the subfamilies Centrosaurinae and Chasmosaurinae.
