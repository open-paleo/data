clade: Centrosaurinae
description: >
  Centrosaurinae is one of the two subfamilies of horned ceratopsid dinosaurs,
  encompassing large quadrupedal herbivores of the Late Cretaceous. Its fossils
  come primarily from the northern part of Laramidia, in present-day Alberta,
  Montana, and Alaska, with isolated members reaching as far south as Utah and
  Mexico and one debated occurrence in China. Centrosaurines are typically
  marked by a prominent nasal horn, short horns over the eyes, and an ornamented
  frill projecting from the back of the skull, and are relatively small for
  ceratopsids, roughly the size of a rhinoceros at body lengths of about 2.5 to
  8 meters. The subfamily is divided into several tribes, including the
  early-diverging nasutoceratopsins and albertaceratopsins and the more derived
  centrosaurins and pachyrhinosaurins; the last group replaces the nasal horn
  with a thickened bony boss. Their classification is complicated by wide
  variation between individuals and growth stages, and some researchers argue
  the group may have evolved largely as a single changing lineage rather than
  through repeated branching.
type_genus: Centrosaurus
erected_in: lambe1915a
diagnostic_features:
  - Cranial ornamentation concentrated on the nasal region and parietal margin,
    with large bladelike epiparietals (more than six loci per side in derived
    forms)
  - Rostrocaudally abbreviated squamosal with a stepped caudomedian margin
  - Wide parietal midline bar with a triangular cross-section that tapers
    laterally
  - Premaxilla with a pronounced ventral angle and a subcircular external
    narial region
  - Narial spine formed by both the nasal and the premaxilla
references:
  - id: lambe1915a
    notes: Erected the subfamilies Centrosaurinae and Chasmosaurinae.
