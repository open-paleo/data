clade: Ornithomimidae
description: >
  Ornithomimidae is a family of theropod dinosaurs that bore a superficial
  resemblance to modern ostriches, earning them the nickname "ostrich mimics."
  They were fleet-footed, likely omnivorous or herbivorous animals known mainly
  from the Late Cretaceous of Laurasia, in what is now Asia and North America,
  with a few reports from the Early Cretaceous of Australia. Members had small
  skulls with large eyes set atop long, slender necks, and all bore toothless,
  keratinous beaks. Their forelimbs were long and slender with powerful claws,
  while their long, muscular hindlimbs and elongate feet made them among the
  fastest of all dinosaurs, and like many coelurosaurs their bodies were
  feathered rather than scaly. The family includes Ornithomimus, Struthiomimus,
  Gallimimus, and numerous related genera, though beyond a reliably basal
  Archaeornithomimus its internal relationships remain largely unresolved.
type_genus: Ornithomimus
erected_in: marsh1890b
described_in: kobayashi2005a
diagnostic_features:
  - Arctometatarsalian pes, with metatarsal III pinched between II and IV proximally
  - Edentulous skull bearing a keratinous beak
  - Elongate, gracile, cursorial hindlimbs
  - Long neck formed of elongate cervical vertebrae
references:
  - id: marsh1890b
    notes: Named Ornithomimus and erected the family Ornithomimidae.
  - id: kobayashi2005a
    notes: Identifies the arctometatarsalian pes as the diagnostic synapomorphy
      of Ornithomimidae.
