clade: Ornithomimidae
description: >
  Ornithomimidae is the derived, cursorial family of ornithomimosaurs, comprising
  the toothless, long-limbed "ostrich mimics" of the Late Cretaceous of Asia and
  North America. Members are united by the arctometatarsalian pes and an
  edentulous, beaked skull. The family includes Ornithomimus, Struthiomimus,
  Gallimimus, and numerous related genera; beyond a reliably basal
  Archaeornithomimus, its internal relationships are largely unresolved.
type_genus: Ornithomimus
erected_in: marsh1890b
described_in: kobayashi2005a
diagnostic_features:
  - Arctometatarsalian pes, with metatarsal III pinched between II and IV proximally
  - Edentulous skull bearing a keratinous beak
  - Elongate, gracile, cursorial hindlimbs
  - Long neck formed of elongate cervical vertebrae
