clade: Ornithomimidae
rank: family
type_genus: Ornithomimus
erected_in: marsh1890b
described_in: sereno2017a
diagnostic_features:
  - Arctometatarsalian pes, with metatarsal III pinched between II and IV proximally
  - Edentulous skull bearing a keratinous beak
  - Elongate, gracile, cursorial hindlimbs
  - Long neck formed of elongate cervical vertebrae
references:
  - id: marsh1890b
    notes: Named Ornithomimus and erected the family Ornithomimidae.
  - id: sereno2017a
    notes: "Printed Sereno's definition of Ornithomimidae: the most inclusive
      clade containing Ornithomimus edmontonicus but not Garudimimus,
      Harpymimus, Shenzhousaurus or Pelecanimimus."
  - id: kobayashi2005a
    notes: Redescribed Garudimimus, recovered as the sister taxon of
      Ornithomimidae, and reported the arctometatarsalian pes as the family's
      single unambiguous synapomorphy.
