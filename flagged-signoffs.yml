# Open Paleo — Flagged Source Sign-offs
#
# Each entry records a maintainer's verification of a reference whose
# publisher or journal appears in flagged-sources.yml. A reference id listed
# here with `verified: true` suppresses that reference's flagged-source
# validator warning. See flagged-sources.yml for the policy this complements.
#
# Verification must rest on evidence INDEPENDENT of the flagged source itself:
# third-party citation databases (OpenAlex, Crossref) and citations by
# independent, reputable works. A flagged publisher hosting its own paper is
# not evidence of legitimacy. `cited_by` is the independent citation count at
# the `checked` date (null when no third-party record was found).
# Re-verify periodically.
#
# To sign off a reference: confirm the specific paper is independently cited
# and/or indexed by third parties, peer-reviewed in practice, and free of red
# flags (e.g. retraction), then add an entry keyed by its reference id.

