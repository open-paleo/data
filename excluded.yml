# Genera ruled out of the dataset (institutional memory).
#
# category:
#   non-dinosaurian  — published work concludes the type material cannot be
#                      diagnosed to Dinosauria (placement may still change).
#   nomen-nudum      — name appeared in print/manuscript/thesis/label but was
#                      never validly published under the ICZN.
#
# Fields: genus, category, reason, references (optional).
# Migrated from the former scratch/dismissed-candidates.md.

- genus: Agnosphitys
  category: non-dinosaurian
  reason: Late Triassic dinosauriform from the Magnesian Conglomerate fissure-fill at Cromhall, Avon, England, known from a holotype ilium with a referred partial skeleton (maxilla, humerus, astragalus). Originally placed outside Dinosauria by Fraser, Padian, Walkden & Davis (2002); subsequent phylogenetic analyses give conflicting placements as a basal theropod (Yates 2007), a basal sauropodomorph (Ezcurra 2010), or a silesaurid. No broad consensus that the genus is a dinosaur.
  references:
    - "Phylogenetic relationships of *Chromogisaurus novasi* and other basal dinosaurs (Ezcurra, 2010): includes Agnosphitys in a cladistic analysis and recovers it as a basal sauropodomorph in Guaibasauridae, but excludes the referred material after Langer (2004) and Bonaparte et al. (2007) flagged it as a possible chimera."

- genus: Alwalkeria
  category: non-dinosaurian
  reason: Late Triassic taxon from the Lower Maleri Formation of the Pranhita–Godavari Valley, India, originally described as the basal theropod *Walkeria maleriensis* (Chatterjee, 1987; renamed *Alwalkeria* for preoccupation). The ISI R 306 holotype series proved to be a chimera — Remes & Rauhut (2005) first flagged it, and Lecuona, Ezcurra & Irmis (2016) reinterpreted the skull as crocodylomorph. McDavid, Marchant & Reid (2026) restricted the holotype to the distal right femur ISI R 306b, synonymised Sen & Ray's (2025) *Alickmeron* with it, refuted a lagerpetid assignment, and placed the taxon as Pan-Aves (Avemetatarsalia) incertae sedis — a bird-line archosaur of uncertain position that is not demonstrably a dinosaur.
  references:
    - "*Alickmeron* Sen & Ray, 2025 is an objective junior synonym of *Alwalkeria* (McDavid, Marchant & Reid, 2026): restricts the holotype to the distal femur ISI R 306b and places the taxon as Pan-Aves (Avemetatarsalia) incertae sedis, outside Dinosauria."
    - "Revision of the early crocodylomorph *Trialestes romeri* (Lecuona, Ezcurra & Irmis, 2016): reinterprets the *Alwalkeria* ISI R 306 skull as crocodylomorph, part of the evidence that the holotype series is a chimera."

- genus: Amanasaurus
  category: non-dinosaurian
  reason: Late Triassic (Carnian) silesaurid dinosauriform from the Santa Maria Supersequence of Rio Grande do Sul, Brazil, described by Müller & Garcia (2024) for two partial femora (single species *A. nesbitti*). Treated as a silesaurid in the type description.

- genus: Asilisaurus
  category: non-dinosaurian
  reason: Middle Triassic silesaurid archosaur from the Manda Beds of Tanzania (Anisian–early Carnian), one of the oldest known dinosauromorphs, known from multiple partial skeletons. Treated as a silesaurid since description.

- genus: Cryptoraptor
  category: non-dinosaurian
  reason: Manuscript name (*Cryptoraptor lockleyi*) coined by Adrian Hunt in his 1994 dissertation for NMMNH P-17375, a fragmentary partial skeleton from the Norian Bull Canyon Formation of Quay County, New Mexico. The dissertation was never formally published, so the name has no ICZN standing. The material was re-evaluated by Nesbitt, Irmis & Parker (2007) and found to lack any clear dinosaurian synapomorphies, with the pubis and vertebrae showing *Shuvosaurus*-like (non-dinosaurian archosaur) affinities.
  references:
    - "A critical re-evaluation of the Late Triassic dinosaur taxa of North America (Nesbitt, Irmis & Parker, 2007): redescribes NMMNH P-17375 as Archosauria indet., concluding the material cannot be assigned to Dinosauria because it lacks any clear synapomorphies with the clade."

- genus: Diodorus
  category: non-dinosaurian
  reason: Late Triassic silesaurid dinosauromorph from the Timezgadiouine Formation of the Argana Basin, Morocco, known from a partial dentary and referred teeth (single species *D. scytobrachion*). Treated as a silesaurid since description.

- genus: Dravidosaurus
  category: non-dinosaurian
  reason: Coniacian (Late Cretaceous) reptile from southern India, originally described as a late-surviving stegosaur by Yadagiri & Ayyasami (1979). Chatterjee (1991) reinterpreted the poorly preserved fossils as plesiosaurian remains. No broad consensus on dinosaurian vs. plesiosaurian affinity; the material is too fragmentary for confident placement.

- genus: Eucoelophysis
  category: non-dinosaurian
  reason: Late Triassic (Norian) Chinle Formation archosaur from New Mexico, originally described by Sullivan & Lucas (1999) as a coelophysid theropod. Nesbitt, Irmis & Parker (2007) reinterpreted it as a close relative of *Silesaurus*; Ezcurra (2016) recovered it as the sister-group to Dinosauria. Currently treated as a silesaurid.
  references:
    - "A critical re-evaluation of the Late Triassic dinosaur taxa of North America (Nesbitt, Irmis & Parker, 2007): re-examines Eucoelophysis material and removes it from Coelophysidae, placing it close to *Silesaurus* outside Dinosauria."

- genus: Gamatavus
  category: non-dinosaurian
  reason: Middle Triassic silesaurid dinosauriform from the Santa Maria Formation of Dilermando de Aguiar Municipality, Rio Grande do Sul, Brazil, known from a partial ilium (single species *G. antiquus*). Among the oldest South American silesaurids. Treated as a silesaurid since description.

- genus: Gondwanax
  category: non-dinosaurian
  reason: Triassic silesaurid dinosauriform from the Pinheiros-Chiniquá Sequence of Brazil, known from a partial skeleton (single species *G. paraisensis*). Among the oldest known dinosauromorphs. Treated as a silesaurid since description.

- genus: Gwyneddosaurus
  category: non-dinosaurian
  reason: Late Triassic (Norian) reptile from the Lockatong Formation of Montgomery County, Pennsylvania, originally described by Bock (1945) as a coelurosaurian dinosaur (single species *G. erici*, holotype ANSP 15072). Olsen & Flynn (1989) reinterpreted the holotype as a composite, probably a regurgitated bone mass of the tanystropheid *Tanytrachelos*. Not a dinosaur; the validity of the genus itself is doubtful and remains unresolved — a question for any future expansion of the dataset beyond Dinosauria.

- genus: Ignotosaurus
  category: non-dinosaurian
  reason: Late Triassic (Carnian) silesaurid dinosauriform from the Cancha de Bochas Member of the Ischigualasto Formation, Argentina; contemporary with the earliest dinosaurs (e.g. *Herrerasaurus*). Treated as a silesaurid since description.

- genus: Itaguyra
  category: non-dinosaurian
  reason: Late Triassic (Carnian) dinosauromorph from the Santa Cruz Sequence of the Santa Maria Supersequence, Brazil, known from two isolated pelvic bones (single species *I. occulta*). Allied with taxa traditionally regarded as silesaurids (possibly earliest ornithischian dinosaurs); the silesaurid-or-ornithischian question remains open.

- genus: Kwanasaurus
  category: non-dinosaurian
  reason: Late Triassic silesaurid dinosauromorph from the Eagle Basin (Chinle Formation), Colorado, known from a single species *K. williamparkeri*. Treated as a silesaurid since description, with deeper skull and stronger herbivorous specialization than other silesaurids.

- genus: Lewisuchus
  category: non-dinosaurian
  reason: Late Triassic (early Carnian) silesaurid dinosauriform from the Chañares Formation, Argentina; about 1 m long, exhibiting dorsal osteoderms. Treated as a silesaurid in recent literature; sometimes considered a member of, or sister to, the silesaurids that may themselves be true dinosaurs.

- genus: Lutungutali
  category: non-dinosaurian
  reason: Middle Triassic (Anisian) silesaurid dinosauriform from the upper Ntawere Formation of Zambia, known from a holotype with hip bones and tail vertebrae (single species *L. sitwensis*). First known silesaurid from Zambia and, along with Asilisaurus and Nyasasaurus, among the oldest known dinosauromorphs. Treated as a silesaurid since description.

- genus: Nyasasaurus
  category: non-dinosaurian
  reason: Avemetatarsalian archosaur from the putatively Middle Triassic Manda Formation of Tanzania, first described in 1956 in Charig's doctoral thesis and formally named by Nesbitt et al. (2013). Wikipedia describes it as a taxon that "may be the earliest known dinosaur" — placement on either side of the dinosaur–silesaurid boundary is currently unresolved.

- genus: Pisanosaurus
  category: non-dinosaurian
  reason: Late Triassic (Carnian) dinosauriform from the Ischigualasto Formation of San Juan, Argentina (single species *P. mertii*, holotype PVL 2577), long regarded as the earliest and most basal ornithischian. Multiple recent studies instead recover it as a silesaurid dinosauriform — the expansive redescription by Agnolín & Rozadilla (2017), the re-analyzed Ornithoscelida matrix of Baron, Norman & Barrett (2017), and a 2018 study combining both. No broad consensus that the genus is a dinosaur.
  references:
    - "Phylogenetic reassessment of *Pisanosaurus mertii* Casamiquela, 1967 (Agnolín & Rozadilla, 2017): expansive redescription recovering Pisanosaurus as a silesaurid dinosauriform near the base of (or outside) Ornithischia."

- genus: Sacisaurus
  category: non-dinosaurian
  reason: Late Triassic (Norian) silesaurid dinosauriform from the Caturrita Formation of southern Brazil (single species *S. agudoensis*), known from dozens of bones including 35 right femora. Treated as a silesaurid since description; recovered in the paraphyletic-silesaurid analysis of Agnolín & Rozadilla (2017) and Müller & Garcia (2020).
  references:
    - "Phylogenetic reassessment of *Pisanosaurus mertii* Casamiquela, 1967 (Agnolín & Rozadilla, 2017): part of the body of recent analyses placing several silesaurid genera, including Sacisaurus, near the base of Ornithischia."

- genus: Taveirosaurus
  category: non-dinosaurian
  reason: "Late Cretaceous tooth-taxon from the Argilas de Aveiro Formation of Portugal (and Laño, Spain), named by Telles Antunes & Sigogneau-Russell (1991), originally interpreted as a pachycephalosaurid. After successive reassignments (Homalocephalidae → Pachycephalosauridae → Nodosauridae → Fabrosauridae → Ornithischia indet. as nomen dubium per Norman 2004), a recent revision found the teeth most similar to the early mammal group Eutriconodonta, lacking ornithischian features."

- genus: Yaverlandia
  category: non-dinosaurian
  reason: Lower Cretaceous Wessex Formation (Isle of Wight, England) reptile, known from two partial fossil skulls. Galton (1971) recognized it as a distinct genus and assigned it to Pachycephalosauridae; Naish (2008) suggested maniraptoran theropod affinities instead; Naish & Sweetman (2026) describe a second specimen and conclude the identity remains enigmatic, noting that some anatomical features are comparable to non-dinosaurian reptiles such as crocodyliforms.

- genus: Alamotyrannus
  category: nomen-nudum
  reason: "Informal tyrannosaurid name (intended type species \"*A. brinkmani*\") attributed to Dalman (2013) for large tyrannosaur material from the Ojo Alamo Formation of New Mexico, USA. Jones & Viola (2026) describe it as a leaked name covering several skull and jaw fragments and other remains that are still under study, and note that various media have attached further names to some or all of the same material. Molina-Perez & Larramendi (2019) list the name against USNM vertebrae described by Gilmore (1916)."
  references:
    - "The Princeton Encyclopedia of Dinosaurs: Theropods (Jones & Viola, 2026): lists the name among informally named theropods, giving the Ojo Alamo Formation occurrence and the attribution to Dalman (2013)."

- genus: Andhrasaurus
  category: nomen-nudum
  reason: Informal armored-ornithischian name coined by Ulansky (2014) for GSI material (skull elements, ~30 osteoderms, vertebrae and limb extremities) from the Kota Formation of India, originally assigned to Ankylosauria by Nath et al. (2002). Galton & Carpenter (2016) declared it a nomen nudum on the grounds that it did not meet ICZN requirements, listing the material as Thyreophora indet. Subsequently redescribed (sans the name) by Galton (2019) as Ankylosauria.

- genus: Angloposeidon
  category: nomen-nudum
  reason: Informal sauropod-vertebra name for MIWG.7306, a single cervical from the Barremian Wessex Formation, Isle of Wight, England — possibly a brachiosaurid of ≥20 m length. The original worker (Naish) recommended the name be kept informal, though he later used it in his 2010 Tetrapod Zoology Book One.

- genus: Angustungui
  category: nomen-nudum
  reason: "Informal stegosaur name for SS V16001 (axial, pectoral, pelvic, limb and armor elements) and paratype SS V16002, from the Late Jurassic Qigu Formation, Shanshan County, China. Discovered 2016; the name first appeared in a 2024 bioRxiv pre-print recovering it as sister to *Loricatosaurus*."

- genus: Bayosaurus
  category: nomen-nudum
  reason: Informal abelisauroid name coined by Coria, Currie & Paulina Carabajal (2006) for MCF-PVPH-237 (dorsal and sacral vertebrae, fragmentary pelvis, partial bones) from the Turonian Cerro Lisandro Formation of Neuquén, Argentina. The name was used only as a phylogenetic-analysis placeholder; no formal description has followed.

- genus: Beelemodon
  category: nomen-nudum
  reason: Informal coelurosaur-grade theropod name applied to two teeth from the Late Jurassic of Wyoming, USA. Bakker (1997) mentioned it in an Academy of Natural Sciences symposium; the teeth resemble *Compsognathus* but share features with *Protarchaeopteryx* and dromaeosaurids and lack unique diagnostic characters.

- genus: Biscoveosaurus
  category: nomen-nudum
  reason: Informal basal-ornithopod name for an Early Maastrichtian specimen (dentaries, teeth, braincase, partial maxillae, forelimb elements, vertebrae, pectoral girdle) from the Cape Lamb Member of the Snow Hill Island Formation, James Ross Island, Antarctica. Possibly a secondary specimen of *Morrosaurus* — overlap with the *Morrosaurus* holotype cannot be tested.

- genus: Cinizasaurus
  category: nomen-nudum
  reason: "Nomen ex dissertationae proposed by Hunt (1997, unpublished thesis) for NMMNH P-18400 (a tibia, vertebrae, and other fragments) from the Late Triassic of New Mexico, initially interpreted as a theropod. Intended type species \"*C. hunti*\". Nesbitt, Irmis & Parker (2007) reclassified both NMMNH P-18400 and P-18401 as indeterminate archosauriforms."

- genus: Comanchesaurus
  category: nomen-nudum
  reason: "Nomen ex dissertationae proposed by Adrian Hunt in his unpublished dissertation for NMMNH P-4569 (a partial skeleton with vertebral centra and hindlimb bones) from the Norian Bull Canyon Formation of Guadalupe County, New Mexico. Intended type species \"*C. kuesi*\". Nesbitt, Irmis & Parker (2007) found the material to belong to a possible indeterminate saurischian."

- genus: Capitalsaurus
  category: nomen-nudum
  reason: Informal large-theropod name coined by Peter Kranz in the 1990s for a single caudal vertebra discovered in 1898 during sewer construction at First & F Streets SE, Washington, D.C. Earlier assigned to *Creosaurus potens* and *Dryptosaurus potens* (both overturned). Adopted by the District of Columbia as official dinosaur (1998), with F Street renamed Capitalsaurus Court (1999) and 28 January observed as Capitalsaurus Day — none of which constitutes ICZN publication.

- genus: Changdusaurus
  category: nomen-nudum
  reason: "Informal stegosaurid name (also \"Changtusaurus\"; type species \"*C. laminoplacodus*\") coined by Zhao in 1983 for material from the Late Jurassic of China. Never formally described; one source reports the fossils have been lost."

- genus: Dachongosaurus
  category: nomen-nudum
  reason: "Informal sauropod name (alternate spelling \"Dachungosaurus\"; type species \"*D. yunnanensis*\") coined by Zhao (1985) for a partial articulated skeleton from the Lower Lufeng Series (Sinemurian Dark Red Beds), Yunnan, China. Possibly a cetiosaur; the material may since have been redescribed under another name."

- genus: Damalasaurus
  category: nomen-nudum
  reason: "Informal sauropod name (\"Damala lizard\") for Early Jurassic material, including a rib, from the Middle Daye Group of Tibet. Attributed species \"*D. laticostalis*\" and \"*D. magnus*\" may refer to the same animal. No formal description."

- genus: Duranteceratops
  category: nomen-nudum
  reason: Informal chasmosaurine-ceratopsid name proposed for a ceratopsid skull collected in 2012 from the Hell Creek Formation of South Dakota by amateur collector John Carter. Announced in Prehistoric Times no. 121 (Spring 2017); no formal description has been published.

- genus: Echizensaurus
  category: nomen-nudum
  reason: Informal ceratopsian-grade ornithischian name applied to Late Cretaceous material from Echizen, Japan. Mentioned in Lida Xing's homepage as Ceratopsia incertae sedis; no formal publication.

- genus: Eoplophysis
  category: nomen-nudum
  reason: '"*Eoplophysis*" was coined by Ulansky (2014) as a new genus for *Omosaurus vetustus* von Huene (later *Dacentrurus vetustus*), based on OUM J.14000 — a 60 cm juvenile right femur from the Bathonian Cornbrash Formation of Oxfordshire, England. Maidment et al.''s stegosaur review found the holotype lacks Stegosauria synapomorphies and reassigned it to Dinosauria indet., making the Ulansky genus redundant and informal.'

- genus: Eugongbusaurus
  category: nomen-nudum
  reason: "Informal neornithischian name leaked as a replacement-genus proposal for \"*Gongbusaurus*\" *wucaiwanensis* Dong (1989), described for IVPP 8302 (partial lower jaw, three caudals, partial forelimb) and IVPP 8303 (two sacrals, eight caudals, two complete hindlimbs) from the Oxfordian Shishugou Formation of Xinjiang, China. Because *Gongbusaurus* is a non-diagnostic tooth taxon, several workers have suggested moving the species to a new genus; none has yet done so formally."

- genus: Fendusaurus
  category: nomen-nudum
  reason: Nomen ex dissertatione proposed by Fedak (2006) for FGM 998GF13-II (a skull) plus five referred specimens from the Hettangian McCoy Brook Formation of Wasson Bluff, Nova Scotia. Previously classified as cf. *Ammosaurus*; Fedak placed it in Massospondylidae. First non-avian dinosaur from Nova Scotia.

- genus: Ferganastegos
  category: nomen-nudum
  reason: Stegosaur name coined by Ulansky (2014) in the self-published "Dinologia" for IGB 001, four posterior dorsal vertebrae from the Middle Jurassic (Callovian) Balabansai Formation of the Fergana Valley, Kyrgyzstan. Ulansky did not examine the material and gave no valid differential diagnosis. Galton & Carpenter (2016) found that Ulansky's names, including *Ferganastegos*, fail the ICZN requirements for valid publication (no ISSN, no Article 13 differential description) and are not available, and that the vertebrae — described by Averianov, Bakirov & Martin (2007) as Stegosauria indet. — are non-diagnostic.
  references:
    - "The plated dinosaur *Stegosaurus longispinus* Gilmore, 1914, type species of *Alcovasaurus* n. gen. (Galton & Carpenter, 2016): finds Ulansky's (2014) self-published stegosaur names, including \"Ferganastegos\", not validly published under the ICZN, and the material non-diagnostic (Stegosauria indet.)."
    - "First definitive stegosaur from the Middle Jurassic of Kyrgyzstan (Averianov, Bakirov & Martin, 2007): original description of IGB 001 as Stegosauria indet."

- genus: Ferropectis
  category: nomen-nudum
  reason: "Nomen ex dissertatione for a Cenomanian Eagle Ford Group nodosaurid ankylosaur from Texas, named in Matt Clemens's 2018 dissertation. Intended type species \"*F. brysorum*\"; the dissertation's phylogenetic analysis recovered it as sister to *Borealopelta* in a clade with *Hungarosaurus*, *Europelta*, and *Pawpawsaurus*."

- genus: Francoposeidon
  category: nomen-nudum
  reason: "Informal turiasaurian-sauropod name (\"French earthquake god\"; type species \"*F. charantensis*\") for at least 7 individuals' worth of material — braincase, skull bones, teeth, cervical/dorsal/caudal vertebrae, chevrons, pelvic girdle, all limb bones — from the Hauterivian Angeac-Charente bonebed of France. Femur length ~2.35 m suggests one of the largest European sauropods. No formal description has been published."

- genus: Futabasaurus
  category: nomen-nudum
  reason: "Informal theropod name converted by David Lambert (1990) from Hasegawa et al.'s (1987) Japanese nickname \"Futaba-ryū\" for a ~56 mm-wide partial shin bone from the Coniacian Ashizawa Formation (Futaba Group), Japan; considered indeterminate tyrannosaurid. The name *Futabasaurus* has since been used for a plesiosaur genus, so any future formal description will require a different name."

- genus: Gadolosaurus
  category: nomen-nudum
  reason: Informal hadrosauroid name (PIN 3458/5) that originated as a 1979 Japanese-language mistranslation by Tsunemasa Saito of the Russian word *gadrosavr* (hadrosaur). Applied to a juvenile from the Bayan Shireh Formation of Baishin Tsav, Mongolia; never intended by the Soviet workers as a generic name. Averianov, Lopatin & Tsogtbaatar (2022) preliminarily described the specimen as a possible juvenile of a novel taxon closer to *Gobihadros*.

- genus: Hanwulosaurus
  category: nomen-nudum
  reason: "Informal ankylosaur name (~9 m long; \"long for an ankylosaur\") for material from the Late Cretaceous of Inner Mongolia, China — a nearly complete skeleton including a complete skull, vertebrae, ribs, scapula, ulna, femora, lower-leg bones, and armor. Surfaced in news reports in 2001; Zhao Xijin has suggested it may warrant its own subgroup within Ankylosauria, but no formal description has followed."

- genus: Heilongjiangosaurus
  category: nomen-nudum
  reason: "Informal hadrosaurid name (possibly lambeosaurine; intended type species \"*H. jiayinensis*\") coined in 2001 by Li & Jin in a faunal list from the Maastrichtian of Heilongjiang, China. May be the same animal as *Charonosaurus*, and possibly connected to the nomen nudum \"*Mandschurosaurus*\" jiainensis (1983)."

- genus: Hironosaurus
  category: nomen-nudum
  reason: Informal hadrosaurid name for fragmentary teeth and a vertebra from the Late Cretaceous of Hirono, Fukushima, Japan. Mentioned by Hisa (1988) and brought to a wider audience by Lambert (1990); identified by Dong, Hasegawa & Azuma as Hadrosauridae indet., lacking characters for precise identification.

- genus: Hisanohamasaurus
  category: nomen-nudum
  reason: Informal sauropod name for teeth from Iwaki, Fukushima, Japan, first appearing in Lambert's 1990 general-audience book. Initially identified as a diplodocid, later as a nemegtosaurid similar to *Nemegtosaurus*.

- genus: Imrankhanshaheen
  category: nomen-nudum
  reason: "Wikipedia redirects this name to \"Imrankhanhero\", an informal titanosaurian name proposed by Malkani (2023) in Scientific Research Publishing (a venue widely treated as predatory) for a humerus, femur, fibulae, tibia, metatarsal, and possibly nearby caudal vertebrae from the Maastrichtian Vitakri Formation of Pakistan. The intended type species is \"*Imrankhanhero zilefatmi*\"."

- genus: Jindipelta
  category: nomen-nudum
  reason: "Informal ankylosaur name (intended type species \"*J. zouyunensis*\") for a partial skeleton from the Cenomanian Zhumapu Formation of China. First announced in the 2019 SVP abstract book (Lei et al., \"in press\"); no formal description has followed."

- genus: Julieraptor
  category: nomen-nudum
  reason: "Informal nickname for a dromaeosaurid fossil from the Judith River Formation of Montana (discovered 2002); parts of the same skeleton were illegally excavated in 2006 as \"Sid Vicious\", and the poacher served jail time. Also nicknamed \"Kleptoraptor\" by Bob Bakker. The specimen consists of an almost complete skeleton with well-preserved braincase but missing most of the skull, most caudal vertebrae, part of the femur, and most of the spinal/cervical vertebrae."

- genus: Kagasaurus
  category: nomen-nudum
  reason: Informal coelurosaur-grade theropod name coined by Hisa (1988) for two teeth from the Early Cretaceous of Kaga, Japan. Possibly a non-maniraptoriform coelurosaur or a dromaeosaurid; no formal description.

- genus: Kunmingosaurus
  category: nomen-nudum
  reason: "Informal primitive-sauropod name (type species \"*K. wudingensis*\") invalidly coined by Zhao (1985) for pelvic, hind-limb, and vertebral material from the Fengjiahe Formation (Lower Lufeng Series), Yunnan, China, found in 1954."

- genus: Lancanjiangosaurus
  category: nomen-nudum
  reason: "Informal sauropod name (alternate spelling \"Lanchanjiangosaurus\"; type species \"*L. cachuensis*\"; for the Lancangjiang River of China) coined by Zhou (1983) for Middle Jurassic material from the Dapuka Group of Tibet. No formal description."

- genus: Magulodon
  category: nomen-nudum
  reason: "Informal tooth-taxon (type species \"*M. muirkirkensis*\"; possible basal ornithopod or basal ceratopsian) coined by Kranz (1996) for a single tooth from the Aptian–Albian Arundel Formation of Maryland, USA. A later paper cited the type specimen as indeterminate but avoided using the name to prevent taxonomic clutter."

- genus: Maltaceratops
  category: nomen-nudum
  reason: "Informal centrosaurine ceratopsid name (proposed type species \"*M. hammondorum*\"; previously nicknamed \"Malta new taxon\") for a possible skull from the Campanian Judith River Formation of Montana, USA. No formal description has been published."

- genus: Marisaurus
  category: nomen-nudum
  reason: "Informal titanosaurian name (\"Mari lizard\", for the Mari tribe of Pakistan; type species \"*M. jeffi*\") described by Malkani (2004) on tail vertebrae from the Maastrichtian Vitakri Member of the Pab Formation, Balochistan, Pakistan. Considered invalid by Wilson, Barrett & Carrano (2011)."

- genus: Megacervixosaurus
  category: nomen-nudum
  reason: "Informal titanosaurian sauropod name (\"big neck lizard\"; type species \"*M. tibetensis*\") coined by Zhao Xijin (1983) for material from the Late Cretaceous Zonggo Formation of Tibet. Never formally described."

- genus: Microcephale
  category: nomen-nudum
  reason: "Informal pachycephalosaurid name (also \"*Mycocephale*\"; \"tiny head\") for very small (<5 cm) skull caps from the Campanian Dinosaur Park Formation of Alberta, Canada — the \"North American dwarf species\". First mentioned by Paul Sereno (1997) in a list of pachycephalosaurids; no species epithet was given."

- genus: Microdontosaurus
  category: nomen-nudum
  reason: "Informal sauropod name (intended type species \"*M. dayensis*\") coined by Zhao (1985) for Middle Jurassic material from the Dapuka Group of Xinjiang, China. Not used since; the material may have been redescribed under another name."

- genus: Mifunesaurus
  category: nomen-nudum
  reason: Informal tetanuran-theropod name coined by Hisa (1985, no species epithet) for a tibia, phalanx, metatarsus, and tooth (YNUGI 10003 / MDM 341) discovered in 1979 in the Cenomanian Kabu Formation of Japan. Tooth morphology suggests megalosauroid or carnosaur affinity.

- genus: Moshisaurus
  category: nomen-nudum
  reason: Informal name (also "Moshi-ryu") coined by Hisa (1985) for an incomplete sauropod humerus (NSM PV17656) from the Early Cretaceous Miyako Group of Japan; never validly published under the ICZN. Referred to Mamenchisaurus by Dong et al. (1990) and Hasegawa et al. (1991), but reassigned to Sauropoda indet. by Azuma & Tomida (1998) and Barrett et al. (2002).
  references:
    - "Japanese dinosaurs (Azuma & Tomida, 1998), in Currie & Padian (eds.), Encyclopedia of Dinosaurs: assigns NSM PV17656 to Sauropoda indet."
    - "Sauropod dinosaurs from the Lower Cretaceous of eastern Asia: taxonomic and biogeographical implications (Barrett, Hasegawa, Manabe, Isaji & Matsuoka, 2002): reassigns the material to Sauropoda indet."

- genus: Ngexisaurus
  category: nomen-nudum
  reason: "Informal avetheropod-grade theropod name (type species \"*N. dapukaensis*\") coined by Zhao (1983) for material from the Middle Jurassic Dapuka Group of Tibet, China. Zhao (1985) introduced an alternate name \"*Megalosaurus*\" *dapukaensis* for related material."

- genus: Nurosaurus
  category: nomen-nudum
  reason: "Informal sauropod name (proposed binomial \"*N. qaganensis*\") presented as soon-to-be-described by Zhiming Dong (1992) for a partial skeleton from the Early Cretaceous Qagannur Formation of Inner Mongolia. Notable as the first specimen on which a stress fracture of the foot phalanx was identified in a sauropod."

- genus: Orcomimus
  category: nomen-nudum
  reason: Informal ornithomimid name coined by Michael Triebold (1997) for a pelvis and hindlimb from the Late Cretaceous Hell Creek Formation of South Dakota; never formally described. May be referable to one of the ornithomimosaur species currently known from the Hell Creek.

- genus: Oshanosaurus
  category: nomen-nudum
  reason: "Informal sauropod name (\"Oshan lizard\"; intended type species \"*O. youngi*\") coined by Zhao (1985) for material from the Early Jurassic Lower Lufeng Series of Yunnan, China, discovered by Zhao in 1971 at Dianchung, Eshan County. Molina-Perez & Larramendi (2019) suggested without elaboration that it belongs to the theropod *Eshanosaurus*."

- genus: Otogosaurus
  category: nomen-nudum
  reason: "Informally named sauropod (proposed type species \"*O. sarulai*\") from Inner Mongolia, China, known from partial postcrania (including a 2.2 m tibia) and several footprints. Despite occasional citation to Zhao (2004) or Zhao & Tan (2004), scholars have not located such a source."

- genus: Ovoraptor
  category: nomen-nudum
  reason: "Informal dromaeosaurid name (intended type species \"*O. djadochtari*\") that Osborn used in a 1924 popular-press account of the Djadokhta material ahead of its formal description. The same specimen was described in the same year as *Velociraptor mongoliensis*, and the earlier name was never validly published. Olshevsky (1991) lists both *Ovoraptor* and *O. djadochtari* as nomina nuda in the synonymy of *Velociraptor*."
  references:
    - "A revision of the parainfraclass Archosauria Cope, 1869, excluding the advanced Crocodylia (Olshevsky, 1991): lists *Ovoraptor* Osborn, 1924 and *Ovoraptor djadochtari* Osborn, 1924 as nomina nuda under *Velociraptor* Osborn, 1924."

- genus: Pakisaurus
  category: nomen-nudum
  reason: "Informal titanosaurian name (\"Pakistan lizard\"; proposed species \"*P. balochistani*\") named by Malkani (2006) for isolated tail vertebrae from the Maastrichtian Vitakri Member of the Pab Formation, Balochistan. A 2023 femur from the Lameta Formation of India was also assigned to it. Considered invalid by Wilson, Barrett & Carrano (2011)."

- genus: Podischion
  category: nomen-nudum
  reason: "Informal hadrosaurid name (intended species \"*P. gracilis*\") applied to a skeleton collected in 1911 from the Red Deer River of Alberta, Canada by a field crew led by Barnum Brown. The name surfaced in print only in Dingus & Norell (2010) and was never validly published under the ICZN; the specimen may represent an individual of *Hypacrosaurus*."

- genus: Qaikshaheen
  category: nomen-nudum
  reason: "Informal titanosaurian name (intended type species \"*Q. masoomniazi*\") proposed by Malkani (2023) in Scientific Research Publishing for fragmentary axial, pectoral, and pelvic material from the Maastrichtian Vitakri Formation of Pakistan."

- genus: Ronaldoraptor
  category: nomen-nudum
  reason: "Informal oviraptorid name (also \"Mitrata Oviraptorid\"; listed as \"*Oviraptor* sp.\") first used by Luis Rey in his 2003 book *A Field Guide to Dinosaurs* as the caption to an illustration. Material is undescribed; may be closely related to *Citipati osmolskae*."

- genus: Sabinosaurus
  category: nomen-nudum
  reason: "Informal hadrosaur name (also \"Sabinosaurio\") for PASAC-1, a partial saurolophine skeleton from the Sabinas Basin of Mexico discovered in 2001. Initially described as *Kritosaurus* sp. by Kirkland et al. (2006), and Prieto-Márquez (2014) considered it indeterminate saurolophine — the largest known well-documented North American saurolophine (~11 m)."

- genus: Saldamosaurus
  category: nomen-nudum
  reason: "Informal stegosaurid name (type species \"*S. tuvensis*\") proposed by Ulansky (2014) for a complete braincase from the Early Cretaceous Saldam Formation of Siberia, Russia. Galton & Carpenter (2016) found the name did not meet ICZN requirements, declaring it nomen nudum."

- genus: Saltillomimus
  category: nomen-nudum
  reason: "Nomen ex dissertatione for an ornithomimid theropod from the Campanian Cerro del Pueblo Formation of Mexico, named by Aguillón Martinez in her 2010 thesis (intended type species \"*S. rapidus*\"). Holotype SEPCP 16/237 (partial tail, most of a hindlimb, forelimb bones); a skeletal reconstruction is on display at the Museo del Desierto."

- genus: Sidormimus
  category: nomen-nudum
  reason: "Informal noasaurid name (also \"Gadoufaoua noasaurid\", \"unnamed Niger noasaurid\", \"digging raptor\") for an articulated specimen from the Elrhaz Formation of Niger, discovered in 2000 by Chris Sidor. First named by Lyon on the Project Exploration website (also labelled \"Dogosaurus\" on the National Geographic site)."

- genus: Skaladromeus
  category: nomen-nudum
  reason: "Nomen ex dissertatione (also \"Kaiparowits ornithopod\"; intended type species \"*S. goldenii*\") named in Clint Boyd's 2012 thesis for an ornithopod from the Kaiparowits Formation."

- genus: Spondylosoma
  category: non-dinosaurian
  reason: Middle Triassic (late Ladinian) archosaur from the Lower Santa Maria Formation of Chiniquá, Rio Grande do Sul, Brazil, known from the holotype GPIT 479/30 (single species *S. absconditum*). Originally described by von Huene (1942) and historically treated as a basal dinosaur or herrerasaurid-like saurischian. Galton (2000) found that it lacks dinosaurian characters and was probably a rauisuchian close to rauisuchids, and Nesbitt et al. (2017) referred it to the non-dinosaurian avemetatarsalian clade Aphanosauria.
  references:
    - "Are Spondylosoma and Staurikosaurus (Santa Maria Formation, Middle-Upper Triassic, Brazil) the oldest saurischian dinosaurs? (Galton, 2000): concluded that Spondylosoma lacks dinosaurian characteristics and was probably a rauisuchian more closely related to rauisuchids."
    - "The earliest bird-line archosaurs and the assembly of the dinosaur body plan (Nesbitt, Butler, Ezcurra et al., 2017): referred Spondylosoma to the non-dinosaurian avemetatarsalian clade Aphanosauria."

- genus: Stegotitanus
  category: nomen-nudum
  reason: "Informal replacement-genus name proposed by Gregory S. Paul in *The Princeton Field Guide to Dinosaurs* (3rd ed., 2024) for *Stegosaurus ungulatus* — yielding the new combination \"*Stegotitanus*\" *ungulatus*. Material from the Kimmeridgian upper Morrison Formation, Wyoming, USA; ~7 m, ~4.2 t. Field-guide proposal does not constitute a formal generic erection."

- genus: Sugiyamasaurus
  category: nomen-nudum
  reason: "Informal titanosauriform name (\"Sugiyama lizard\") for spatulate teeth from the Early Cretaceous of Japan (near Katsuyama City); first printed by David Lambert (1990) in the *Dinosaur Data Book*. Possibly referable to *Fukuititan*, with which the teeth co-occur."

- genus: Sulaimanisaurus
  category: nomen-nudum
  reason: "Informal titanosaurian name (\"Sulaiman lizard\"; also \"Sulaimansaurus\"; proposed species \"*S. gingerichi*\") described by Malkani (2006) for seven Maastrichtian tail vertebrae from the Vitakri Member of the Pab Formation, Balochistan. Placed in \"Pakisauridae\" alongside *Pakisaurus* and *Khetranisaurus*; considered invalid by Wilson, Barrett & Carrano (2011)."

- genus: Tonouchisaurus
  category: nomen-nudum
  reason: "Informal coelurosaurian name (\"Tonouchi lizard\"; suggested type species \"*T. mongoliensis*\") for limb material (less than 0.91 m long) from the Early Cretaceous of Mongolia; first mentioned in a Japanese news article. Barsbold initially read the manus as didactyl (a tyrannosauroid trait) but later noted it is tridactyl with a sub-arctometatarsalian pes."

- genus: Vectispinus
  category: nomen-nudum
  reason: "Wikipedia redirects this name to \"White Rock spinosaurid\" — a giant spinosaurid (>10 m, vertebrae comparable to *Spinosaurus*) described in 2022 from the Vectis Formation of the Isle of Wight, England. The describers considered the name \"Vectispinus\" but refrained from naming the taxon because the remains are too fragmentary."

- genus: Vitakridrinda
  category: nomen-nudum
  reason: "Informal abelisaurid name (intended type species \"*V. sulaimani*\") first used in a Malkani (2004) abstract for two thigh bones and a tooth from the Maastrichtian Vitakri Member of the Pab Formation, Balochistan. The originally referred snout has since been reclassified as the mesoeucrocodylian *Induszalim*, and the braincase as *Gspsaurus*."

- genus: Vitakrisaurus
  category: nomen-nudum
  reason: "Informal noasaurid name (intended type species \"*V. saraiki*\"; honoring the Saraiki people of southern Pakistan) for MSM-303-2, a right pes from the Maastrichtian Vitakri Formation of Pakistan. Brief description and lack of comparative material make formal classification difficult."

- genus: Xinghesaurus
  category: nomen-nudum
  reason: "Informal sauropod name (possibly titanosauriform; no species epithet) coined by Hasegawa et al. (2009) in the *Miracle of Deserts* expo guidebook. Mount-based estimates: ~15.4 m, ~6 t."
